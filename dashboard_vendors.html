<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>글로벌 RAN·Core 벤더 맵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{
    --bg:#0d1528; --bg2:#0a1020; --panel:#141d33; --raised:#1b2742; --raised2:#223052;
    --line:rgba(150,170,215,.14); --line2:rgba(150,170,215,.26);
    --ink:#e7ecf7; --sub:#8e9bb8; --dim:#5f6c8a; --blue:#5b8cff; --blue-soft:rgba(91,140,255,.14);
    --land:#1c2740; --land-line:#0d1528; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%, rgba(91,140,255,.14), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(57,198,185,.08), transparent 60%),var(--bg);background-repeat:no-repeat;min-height:100vh;color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit} button{font-family:inherit}
  header{position:sticky;top:0;z-index:40;background:rgba(13,21,40,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hd-in{max-width:1400px;margin:0 auto;padding:12px 18px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:9px;white-space:nowrap}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(91,140,255,.18)}
  h1 span.t{color:var(--sub);font-weight:600}
  .hd-btns{display:flex;gap:6px;flex:0 0 auto}
  .hbtn{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:rgba(27,39,66,.7);color:var(--sub);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:border-color .2s,color .2s}
  .hbtn:hover{color:var(--ink);border-color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:4px}
  main{max-width:1400px;margin:0 auto;padding:14px 16px 60px}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .toolbar .lb{font-size:11.5px;color:var(--sub);font-weight:700;margin-right:4px}
  .chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--sub);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:all .18s}
  .chip:hover{color:var(--ink)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
  .chip.on .sw{outline:2px solid rgba(255,255,255,.6)}
  .layout{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media(min-width:1000px){.layout.open{grid-template-columns:minmax(0,1.25fr) minmax(380px,.9fr)}}
  .mapbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;box-shadow:0 10px 30px -18px rgba(0,0,0,.7)}
  .mapbox svg{display:block;width:100%;height:auto;background:radial-gradient(900px 500px at 50% 40%, rgba(91,140,255,.06), transparent 70%)}
  .mapbox .c{fill:var(--land);stroke:var(--land-line);stroke-width:.5;transition:fill .25s,opacity .25s;vector-effect:non-scaling-stroke}
  .mapbox .c.has{cursor:pointer}
  .mapbox .c.has:hover{filter:brightness(1.25)}
  .mapbox .c.sel{stroke:#fff;stroke-width:1.2}
  .mapbox.zoomed .c:not(.sel){opacity:.45}
  .mapbox.zoomed .legend{display:none}
  .maptip{position:absolute;z-index:5;background:#223052;color:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.55);display:none;pointer-events:none;max-width:320px}
  .maptip .t{font-weight:800;font-size:13px;margin-bottom:4px}
  .maptip .r{display:flex;gap:6px;align-items:baseline;margin:2px 0;flex-wrap:wrap}
  .maptip .r b{font-weight:700;min-width:72px;color:#cfe0ff}
  .vch{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.08);color:#e7ecf7;white-space:nowrap}
  .vch i{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
  .vch.sun{opacity:.55;text-decoration:line-through}
  .mapctl{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:4}
  .mapctl .chip{background:rgba(20,29,51,.9)}
  .legend{position:absolute;right:12px;bottom:12px;background:rgba(20,29,51,.9);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 10px;max-width:70%}
  .legend i{display:inline-flex;align-items:center;gap:5px;font-style:normal}
  .legend i::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
  .empty{color:var(--dim);font-size:12.5px;padding:30px 10px;text-align:center}
  /* 상세 패널 */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(0,0,0,.7);animation:in .4s var(--ease)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .p-hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .p-hd h2{font-size:16px;font-weight:800}
  .p-hd .cnt{font-size:11.5px;color:var(--sub)}
  .p-body{padding:12px 14px 16px}
  .cnote{font-size:12.5px;color:var(--sub);line-height:1.6;padding:10px 12px;background:var(--raised);border-radius:10px;margin-bottom:12px}
  .car{border:1px solid var(--line);border-radius:12px;background:var(--raised);margin-bottom:10px;overflow:hidden}
  .car-hd{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
  .car-hd:hover{background:var(--raised2)}
  .car-hd h3{font-size:14px;font-weight:800}
  .car-hd .m{font-size:11px;color:var(--sub)}
  .conf{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--raised2);color:var(--sub)}
  .conf.high{color:#7fe3d8} .conf.medium{color:#ffd08a} .conf.low{color:#ff9fae}
  .car-body{padding:0 12px 12px;display:none}
  .car.open .car-body{display:block}
  .gen{display:grid;grid-template-columns:52px 1fr;gap:6px 8px;align-items:baseline;font-size:12.5px;padding:3px 0}
  .gen b{color:var(--sub);font-size:11.5px}
  .sec{font-size:11.5px;font-weight:800;color:var(--sub);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .share{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;background:var(--bg2)}
  .share div{height:100%;background:var(--c);position:relative}
  .share-lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;margin-top:6px}
  .share-lg span{display:inline-flex;align-items:center;gap:5px}
  .share-lg span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
  .basis{font-size:11px;color:var(--dim);margin-top:4px}
  .reg{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;padding:3px 0;align-items:baseline}
  .iss{font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:40px 1fr;gap:8px}
  .iss:first-of-type{border-top:none}
  .iss b{color:var(--sub);font-size:11.5px}
  .srcs{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.7}
  .srcs a{color:#8fb0ff;text-decoration:none} .srcs a:hover{text-decoration:underline}
  .sl{color:#8fb0ff;text-decoration:none;font-size:11px;margin-left:4px}
  @media(max-width:700px){h1 .t{display:none}.hbtn .lb{display:none}.legend{display:none}main{padding:10px 10px 60px}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

<script src="news_data.js"></script>
<script>
const VM=(typeof VENDOR_MAP!=="undefined")?VENDOR_MAP:{countries:[]};
const ISO3={"410":"KOR","392":"JPN","840":"USA","124":"CAN","356":"IND","156":"CHN","826":"GBR","276":"DEU","250":"FRA","380":"ITA","724":"ESP","752":"SWE","528":"NLD","036":"AUS","076":"BRA","484":"MEX","643":"RUS","682":"SAU","784":"ARE","702":"SGP","704":"VNM","764":"THA","360":"IDN","608":"PHL","458":"MYS","710":"ZAF","566":"NGA","818":"EGY","792":"TUR","616":"POL","040":"AUT","756":"CHE","056":"BEL","578":"NOR","208":"DNK","246":"FIN","372":"IRL","620":"PRT","300":"GRC","203":"CZE","158":"TWN","554":"NZL","032":"ARG","152":"CHL","170":"COL","604":"PER","586":"PAK","050":"BGD","376":"ISR"};
const VCOL={"Samsung":"#4a78ea","Ericsson":"#1f9c90","Nokia":"#8b6cf0","Huawei":"#e0405a","ZTE":"#c4811f","Mavenir":"#d94f9c","NEC":"#3f9fd6","Fujitsu":"#9a7b2a","Rakuten Symphony":"#b4457a","Cisco":"#5fa8a0","Oracle":"#a86b3c","Datang":"#7a4fb0","Airspan":"#4f8fb0","Tejas Networks":"#6a9a3a"};
const OTHER="#6f7d9c";
function vbase(v){return String(v||"").replace(/\s*\(.*\)$/,"").trim();}
function vcol(v){const b=vbase(v);for(const k in VCOL){if(b.toLowerCase().startsWith(k.toLowerCase()))return VCOL[k];}return OTHER;}
function esc(s){return String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function vchip(v){const sun=/종료|sunset/i.test(v);return `<span class="vch${sun?" sun":""}" style="--c:${vcol(v)}"><i></i>${esc(v)}</span>`;}
const BYISO={}; VM.countries.forEach(c=>BYISO[c.iso3]=c);
let selIso=null, vendorFilter=null;

/* 국가별 대표(5G RAN 선두) 벤더: 점유율 최대 → 없으면 5G 벤더 등장 빈도 */
function leadVendor(c){
  const score={};
  c.carriers.forEach(k=>{
    let sh=(k.share||[]).filter(s=>s.pct!=null);
    if(sh.length){const latest=sh.map(s=>s.asof||"").sort().pop(); sh=sh.filter(s=>(s.asof||"")===latest); sh.forEach(s=>{const b=vbase(s.vendor);score[b]=(score[b]||0)+s.pct;});}
    else{((k.ran||{})["5g"]||[]).filter(v=>!/종료/.test(v)).forEach((v,i)=>{const b=vbase(v);score[b]=(score[b]||0)+(10-i);});}
  });
  let best=null;for(const v in score){if(!best||score[v]>score[best])best=v;}return best;
}
function vendorsIn(c){const set=new Set();c.carriers.forEach(k=>{for(const g in (k.ran||{}))(k.ran[g]||[]).forEach(v=>{if(!/종료/.test(v))set.add(vbase(v));});for(const g in (k.core||{}))(k.core[g]||[]).forEach(v=>set.add(vbase(v)));});return set;}

function drawMap(){
  const svg=document.getElementById("map");
  svg.setAttribute("viewBox",`0 0 ${WORLD.w} ${WORLD.h}`);
  svg.innerHTML=WORLD.f.map(f=>{
    const iso=ISO3[f.id]||f.id, c=BYISO[iso];
    return `<path class="c${c?" has":""}" data-iso="${iso}" data-name="${esc(f.name)}" d="${f.d}"></path>`;
  }).join("");
  svg.querySelectorAll(".c.has").forEach(p=>{
    p.addEventListener("mousemove",e=>showTip(e,p.dataset.iso));
    p.addEventListener("mouseleave",hideTip);
    p.addEventListener("click",e=>{e.stopPropagation();selectCountry(p.dataset.iso);});
  });
  paint();
}
function paint(){
  document.querySelectorAll("#map .c").forEach(p=>{
    const c=BYISO[p.dataset.iso]; if(!c){p.style.fill="";return;}
    if(vendorFilter){ p.style.fill=vendorsIn(c).has(vendorFilter)?VCOL[vendorFilter]||OTHER:"#2a3651"; }
    else{ const lv=leadVendor(c); p.style.fill=lv?(VCOL[lv]||OTHER):"#34507a"; }
  });
  const vendors=["Samsung","Ericsson","Nokia","Huawei","ZTE","Mavenir","NEC","Fujitsu"];
  document.getElementById("legend").innerHTML=(vendorFilter?`<i style="--c:${VCOL[vendorFilter]||OTHER}">${esc(vendorFilter)} 공급 국가</i><i style="--c:#2a3651">미공급·미확인</i>`
    :`<span style="width:100%;font-weight:700;color:var(--sub)">색 = 5G RAN 선두 벤더(사이트 점유율 기준, 없으면 공급사 수)</span>`+vendors.map(v=>`<i style="--c:${VCOL[v]}">${v}</i>`).join("")+`<i style="--c:#1c2740">데이터 없음</i>`);
}
function showTip(e,iso){
  const c=BYISO[iso]; const tip=document.getElementById("maptip"); if(!c){tip.style.display="none";return;}
  tip.innerHTML=`<div class="t">${esc(c.name_ko)} <span style="font-weight:500;color:#9fb3dc;font-size:11px">사업자 ${c.carriers.length}곳 · 클릭하여 상세</span></div>`+
    c.carriers.map(k=>`<div class="r"><b>${esc(k.name)}</b>${(((k.ran||{})["5g"]||[]).filter(v=>!/종료/.test(v)).length?((k.ran||{})["5g"]||[]):((k.ran||{})["4g"]||[])).filter(v=>!/종료/.test(v)).map(vchip).join("")||'<span style="color:#9fb3dc">미확인</span>'}</div>`).join("");
  const box=document.getElementById("mapbox").getBoundingClientRect();
  let x=e.clientX-box.left+14, y=e.clientY-box.top+14;
  tip.style.display="block";
  if(x+tip.offsetWidth>box.width-8) x=e.clientX-box.left-tip.offsetWidth-14;
  if(y+tip.offsetHeight>box.height-8) y=e.clientY-box.top-tip.offsetHeight-14;
  tip.style.left=Math.max(4,x)+"px"; tip.style.top=Math.max(4,y)+"px";
}
function hideTip(){document.getElementById("maptip").style.display="none";}

/* 확대: viewBox 애니메이션 */
let anim=null;
function animateView(to){
  const svg=document.getElementById("map"); const from=svg.getAttribute("viewBox").split(" ").map(Number);
  if(anim)cancelAnimationFrame(anim); const t0=performance.now(), D=600;
  const ease=t=>1-Math.pow(1-t,3);
  const step=now=>{const t=Math.min(1,(now-t0)/D), k=ease(t); svg.setAttribute("viewBox",from.map((v,i)=>v+(to[i]-v)*k).join(" ")); if(t<1)anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
}
function mainBBox(f){
  let best=null,bestA=-1;
  for(const seg of f.d.split("M").filter(Boolean)){
    const pts=seg.replace("Z","").split("L").map(p=>p.split(",").map(Number));
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const [x,y] of pts){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}
    const a=(x1-x0)*(y1-y0); if(a>bestA){bestA=a;best=[x0,y0,x1,y1];}
  }
  return best||f.bb;
}
function selectCountry(iso){
  hideTip(); selIso=iso;
  document.querySelectorAll("#map .c").forEach(p=>p.classList.toggle("sel",p.dataset.iso===iso));
  const box=document.getElementById("mapbox"), back=document.getElementById("backBtn"), layout=document.getElementById("layout");
  if(!iso){ box.classList.remove("zoomed"); back.style.display="none"; layout.classList.remove("open"); animateView([0,0,WORLD.w,WORLD.h]); renderPanel(null); return; }
  const f=WORLD.f.find(x=>(ISO3[x.id]||x.id)===iso); if(!f)return;
  const [x0,y0,x1,y1]=mainBBox(f);   // 가장 큰 폴리곤(본토) 기준 — 알래스카·해외령 때문에 과도하게 넓어지는 것 방지
  const w=x1-x0,h=y1-y0, ar=WORLD.w/WORLD.h; let W=Math.max(w*1.6,h*1.6*ar), H=W/ar; if(H<h*1.6){H=h*1.6;W=H*ar;}
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  box.classList.add("zoomed"); back.style.display="inline-flex"; layout.classList.add("open");
  animateView([cx-W/2,cy-H/2,W,H]);
  renderPanel(BYISO[iso]);
  if(window.innerWidth<1000) setTimeout(()=>document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"start"}),250);
}
document.getElementById("map").addEventListener("click",()=>{if(selIso)selectCountry(null);});

/* 상세 패널 */
const GEN_LABEL={"2g":"2G","3g":"3G","4g":"4G LTE","5g":"5G"}, CORE_LABEL={"epc":"4G EPC","5gc":"5G Core","ims":"IMS·음성"};
function shareBar(sh){
  // 같은 기준·시점끼리 한 막대로 묶고, 최신 시점부터 최대 3개 표시
  const rows=sh.filter(s=>s.pct!=null); if(!rows.length)return"";
  const groups={}; rows.forEach(s=>{const k=(s.asof||"")+"|"+(s.basis||"");(groups[k]=groups[k]||[]).push(s);});
  const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a)).slice(0,3);
  return keys.map(k=>{
    const g=groups[k]; const tot=g.reduce((a,s)=>a+s.pct,0); const scale=tot>100?100/tot:1;
    const s0=g[0]; const src=g.find(s=>s.source);
    return `<div style="margin-bottom:10px"><div class="basis" style="margin:0 0 4px">${esc(s0.asof||"")}${s0.basis?" · "+esc(s0.basis):""}${s0.type==="estimate"?" · 추정":s0.type==="official"?" · 공식":""}${src?` <a class="sl" href="${esc(src.source)}" target="_blank" rel="noopener">근거 ↗</a>`:""}</div>
    <div class="share">${g.map(s=>`<div style="--c:${vcol(s.vendor)};width:${s.pct*scale}%" title="${esc(s.vendor)} ${s.pct}%"></div>`).join("")}${tot<100?`<div style="--c:#2a3651;width:${100-tot}%" title="기타/미확인 ${Math.round((100-tot)*10)/10}%"></div>`:""}</div>
    <div class="share-lg">${g.map(s=>`<span style="--c:${vcol(s.vendor)}">${esc(vbase(s.vendor))} <b>${s.pct}%</b>${s.sites?` <span style="color:var(--dim)">(${Number(s.sites).toLocaleString()} 사이트)</span>`:""}</span>`).join("")}${tot<100?`<span style="--c:#2a3651">기타/미확인 ${Math.round((100-tot)*10)/10}%</span>`:""}</div></div>`;
  }).join("");
}
function carrierCard(k,i){
  const gens=["2g","3g","4g","5g"].filter(g=>(k.ran||{})[g]&&k.ran[g].length);
  const cores=["epc","5gc","ims"].filter(g=>(k.core||{})[g]&&k.core[g].length);
  return `<div class="car${i===0?" open":""}" id="car${i}">
    <div class="car-hd" onclick="this.parentElement.classList.toggle('open')"><div><h3>${esc(k.name)}${k.name_local&&k.name_local!==k.name?` <span style="font-weight:500;color:var(--sub);font-size:12px">${esc(k.name_local)}</span>`:""}</h3>
      <div class="m">${k.type&&k.type!=="MNO"?esc(k.type)+" · ":""}${k.subs_m?`가입자 ${k.subs_m}M${k.subs_asof?" ("+esc(k.subs_asof)+")":""} · `:""}5G RAN: ${((k.ran||{})["5g"]||[]).filter(v=>!/종료/.test(v)).map(vbase).join(", ")||"미확인"}</div></div>
      <span class="conf ${esc(k.confidence||"")}">${k.confidence==="high"?"근거 충분":k.confidence==="medium"?"업계 보도":k.confidence==="low"?"단편 보도":"미평가"}</span></div>
    <div class="car-body">
      <div class="sec">RAN 공급사</div>
      ${gens.length?gens.map(g=>`<div class="gen"><b>${GEN_LABEL[g]}</b><div>${k.ran[g].map(vchip).join(" ")}</div></div>`).join(""):'<div class="basis">공개 정보 없음</div>'}
      ${cores.length?`<div class="sec">Core 공급사</div>`+cores.map(g=>`<div class="gen"><b>${CORE_LABEL[g]}</b><div>${k.core[g].map(vchip).join(" ")}</div></div>`).join(""):""}
      ${(k.share||[]).some(s=>s.pct!=null)?`<div class="sec">RAN 점유율 (사이트 기준)</div>`+shareBar(k.share):""}
      ${(k.regions||[]).length?`<div class="sec">벤더 권역</div>`+k.regions.map(r=>`<div class="reg">${vchip(r.vendor)}<div>${esc(r.area)}${r.gens?` <span style="color:var(--dim);font-size:11px">(${r.gens.map(g=>GEN_LABEL[g]||g).join("·")})</span>`:""}${r.source?` <a class="sl" href="${esc(r.source)}" target="_blank" rel="noopener">↗</a>`:""}</div></div>`).join(""):""}
      ${(k.issues||[]).length?`<div class="sec">교체·전환·계약 이슈</div>`+k.issues.slice().sort((a,b)=>(b.year||0)-(a.year||0)).map(x=>`<div class="iss"><b>${esc(x.year||"")}</b><div>${esc(x.text)}${x.source?` <a class="sl" href="${esc(x.source)}" target="_blank" rel="noopener">↗</a>`:""}</div></div>`).join(""):""}
      ${(k.sources||[]).length?`<div class="srcs">출처: ${k.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(" · ")}</div>`:""}
    </div></div>`;
}
function renderPanel(c){
  const el=document.getElementById("panel");
  if(!c){el.innerHTML="";return;}
  el.innerHTML=`<div class="panel"><div class="p-hd"><h2>${esc(c.name_ko)}</h2><span class="cnt">전국망 사업자 ${c.carriers.length}곳${c.updated?" · "+esc(c.updated):""}</span></div>
    <div class="p-body">${c.country_note?`<div class="cnote">${esc(c.country_note)}</div>`:""}
    ${c.carriers.map(carrierCard).join("")}
    ${(c.sources||[]).length?`<div class="srcs">국가 공통 출처: ${c.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(" · ")}</div>`:""}
    </div></div>`;
}
function renderToolbar(){
  const vendors=["Samsung","Ericsson","Nokia","Huawei","ZTE","Mavenir","NEC","Fujitsu"];
  document.getElementById("toolbar").innerHTML=`<span class="lb">벤더 필터</span><button class="chip${!vendorFilter?" on":""}" onclick="setVendor(null)">선두 벤더 보기</button>`+
    vendors.map(v=>`<button class="chip${vendorFilter===v?" on":""}" style="--c:${VCOL[v]}" onclick="setVendor('${v}')"><span class="sw"></span>${v}</button>`).join("")+
    `<span class="lb" style="margin-left:auto">국가 바로가기</span>`+VM.countries.map(c=>`<button class="chip${selIso===c.iso3?" on":""}" onclick="selectCountry('${c.iso3}')">${esc(c.name_ko)}</button>`).join("");
}
function setVendor(v){vendorFilter=v;renderToolbar();paint();}
drawMap(); renderToolbar();
if(VM.generated) document.getElementById("meta").textContent=`국가에 마우스를 올리면 사업자별 공급사, 클릭하면 상세(권역·점유율·근거) · 데이터 ${VM.generated} · 대상 ${VM.countries.length}개국`;
if(!VM.countries.length) document.getElementById("panel").innerHTML='<div class="empty">벤더 데이터가 아직 없습니다.</div>';
</script>
