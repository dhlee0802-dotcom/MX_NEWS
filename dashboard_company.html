<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기업 히스토리</title>
<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;text-decoration:none;display:inline-block}
  main{padding:14px 16px 50px;max-width:900px;margin:0 auto}
  .grp{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .grp-label{flex:0 0 64px;font-size:11.5px;font-weight:700;color:var(--sub);text-align:right}
  .chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1}
  .chips::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .rchip .n{margin-left:4px;font-size:10.5px;opacity:.65}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:10px 14px}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:140px;background:var(--blue-soft);border-radius:10px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--sub);font-weight:700}
  .stat .v{font-size:13.5px;font-weight:800;color:var(--navy);margin-top:3px;line-height:1.4}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:560px}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  th{background:#fbfcfe;font-size:11.5px;color:var(--sub);white-space:nowrap}
  td a{color:var(--ink);text-decoration:none}
  td a:hover{color:var(--blue)}
  .tbl-wrap{overflow-x:auto}
  .ctrl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;-webkit-overflow-scrolling:touch}
  .ctrl::-webkit-scrollbar{display:none}
  .search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;margin-bottom:4px}
  .month-hd{font-size:12px;font-weight:800;color:var(--sub);margin:14px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--line)}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-of-type{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .ev{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .ev.장애{background:var(--crit-bg);color:var(--crit)}
  .ev.실적{background:var(--mid-bg);color:var(--mid)}
  .ev.수주공급{background:#e8f8ef;color:#1e8e4e}
  .ev.신제품{background:#f0ebfa;color:#6c3fc5}
  .ev.인수합병{background:#e5ecf8;color:var(--navy)}
  .ev.투자{background:var(--high-bg);color:#c46a10}
  .ev.경영진거점{background:#fff6d9;color:#9a7b00}
  .ev.규제주파수{background:var(--blue-soft);color:var(--blue)}
  .ev.위성{background:#e0f5f4;color:#0e8378}
  .ev.요금제{background:#fdeef5;color:#b8367f}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .empty{color:var(--low);font-size:12.5px;padding:16px 0;text-align:center}
  .legend{display:flex;gap:14px;margin:2px 0 6px;font-size:12px;color:var(--sub);font-weight:700}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .fin-note{font-size:11px;color:var(--low);margin-top:8px}
  .fin-tbl{margin-top:10px}
  .fin-tbl table{min-width:0}
  .fin-tbl th,.fin-tbl td{text-align:right;white-space:nowrap}
  .fin-tbl th:first-child,.fin-tbl td:first-child{text-align:left}
  .est{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .est:first-child{border-top:none}
  .est a{color:var(--ink);text-decoration:none;font-weight:700}
  .est a:hover{color:var(--blue)}
  .est .src{font-size:11px;color:var(--low);margin-top:2px}
</style>
</head>
<body>
<header>
  <div class="hd-top">
    <h1>Samsung Network <span>기업 히스토리</span></h1>
    <div style="display:flex;gap:6px;flex:0 0 auto">
      <a class="btn" href="network.html">📊 대시보드</a>
      <a class="btn" href="briefing.html">📄 브리핑</a>
    </div>
  </div>
  <div class="hd-meta" id="meta"></div>
</header>
<main>
  <div id="selector"></div>
  <div id="content"></div>
</main>

<script>/* 진단용 */
window.onerror=function(m,s,l){var e=document.getElementById("content");if(e)e.innerHTML='<div class="empty">⚠ 스크립트 오류: '+m+' (line '+l+')</div>';return false;};</script>
<script src="news_data.js"></script>
<script>
const META=(typeof COMPANY_META!=="undefined")?COMPANY_META:{generated:"데이터 없음",groups:{}};
const DATA=(typeof COMPANY_DATA!=="undefined")?COMPANY_DATA:{};
const NAME={"에릭슨":"Ericsson","노키아":"Nokia","화웨이":"Huawei","zte":"ZTE","스타링크":"Starlink","ast":"AST SpaceMobile","아마존":"Amazon Leo","버라이즌":"Verizon","kddi":"KDDI","도코모":"DOCOMO","skt":"SKT","kt":"KT","lg유플러스":"LG U+","지오":"Jio"};
const KO={"에릭슨":"에릭슨","노키아":"노키아","화웨이":"화웨이","zte":"ZTE","스타링크":"스타링크","ast":"AST","아마존":"아마존 Leo","버라이즌":"버라이즌","kddi":"KDDI","도코모":"도코모","skt":"SKT","kt":"KT","lg유플러스":"LGU+","지오":"Jio"};
const EVTS=["장애","신제품","수주공급","인수합병","투자","실적","경영진거점","규제주파수","위성","요금제","기타"];
const EVT_LABEL={경영진거점:"경영진·거점",규제주파수:"규제·주파수",수주공급:"수주·공급",인수합병:"M&A"};
const PERIODS=[["1년",365],["분기",92],["90일",90],["전체",9999]];
const FIN=(typeof COMPANY_FIN!=="undefined")?COMPANY_FIN:{};
let cur=null, period=365, evtFilter="", q="", finView="annual";
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML;}
function evLabel(e){return EVT_LABEL[e]||e;}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":"주목";return `<span class="imp i${Math.min(5,Math.max(3,n))}">${t} ${n}</span>`;}
function items(c){return (DATA[c]||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));}
function daysAgo(d){try{return (Date.now()-new Date(d.slice(0,10)))/864e5;}catch(e){return 9999;}}
function quarterOf(d){const y=d.slice(0,4),m=+d.slice(5,7);return y+" Q"+Math.ceil(m/3);}

/* ── 재무 실적 (USD 환산) ── */
const C_REV="#1e5eff", C_OP="#e67e22";
function usdFmt(m){ // $M 값 → 읽기 좋은 표기
  if(m===null||m===undefined||isNaN(m))return"–";
  const neg=m<0, v=Math.abs(m);
  const s=v>=1000?(v/1000).toFixed(v>=100000?0:1)+"B":v>=100?Math.round(v).toLocaleString()+"M":v.toFixed(1)+"M";
  return (neg?"-$":"$")+s;
}
function toUsd(f,v){ if(v===null||v===undefined)return null; return v*((FIN.mult||{})[f.currency]||1); }
function groupedBars(rows,opName){
  // rows: [{label, rev($M), op($M|null)}] — 매출·이익 동일 $ 축의 그룹 막대
  const W=Math.max(340,rows.length*118), H=230, padL=8, padR=8, padT=26, padB=24;
  const vals=rows.flatMap(r=>[r.rev,r.op]).filter(v=>v!==null&&!isNaN(v));
  let max=Math.max(...vals,0), min=Math.min(...vals,0);
  if(max===0&&min===0)max=1;
  const span=max-min, y=v=>padT+(max-v)/span*(H-padT-padB), y0=y(0);
  const bw=Math.min(24,Math.floor((W-padL-padR)/rows.length/2)-6);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block" role="img">`;
  // 0 기준선
  s+=`<line x1="${padL}" x2="${W-padR}" y1="${y0}" y2="${y0}" stroke="#e4e8f0" stroke-width="1"/>`;
  rows.forEach((r,i)=>{
    const cx=padL+(W-padL-padR)*(i+0.5)/rows.length;
    const bar=(v,color,dx)=>{
      if(v===null||isNaN(v))return"";
      const top=Math.min(y(v),y0), h=Math.max(2,Math.abs(y(v)-y0)), x=cx+dx;
      const up=v>=0, rx=4;
      const d=up?`M${x},${top+rx} a${rx},${rx} 0 0 1 ${rx},-${rx} h${bw-2*rx} a${rx},${rx} 0 0 1 ${rx},${rx} v${h-rx} h${-bw} z`
                :`M${x},${top} h${bw} v${h-rx} a${rx},${rx} 0 0 1 -${rx},${rx} h${-(bw-2*rx)} a${rx},${rx} 0 0 1 -${rx},-${rx} z`;
      return `<path d="${d}" fill="${color}"><title>${esc(r.label)} · ${usdFmt(v)}</title></path>`;
    };
    s+=bar(r.rev,C_REV,-bw-1)+bar(r.op,C_OP,1);
    if(r.rev!==null&&!isNaN(r.rev))
      s+=`<text x="${cx-1-bw/2}" y="${Math.min(y(r.rev),y0)-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a2233">${usdFmt(r.rev)}</text>`;
    s+=`<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="11" fill="#5b6577">${esc(r.label)}</text>`;
  });
  s+=`</svg>`;
  return `<div class="legend"><span><span class="sw" style="background:${C_REV}"></span>매출</span><span><span class="sw" style="background:${C_OP}"></span>${esc(opName)}</span></div><div style="overflow-x:auto">${s}</div>`;
}
function segBars(items){
  const max=Math.max(...items.map(x=>x.revenue||0),1);
  return items.map(x=>{
    const w=Math.max(2,(x.revenue||0)/max*100);
    return `<div style="margin:7px 0">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="font-weight:700">${esc(x.name)}</span><span style="color:#5b6577;font-weight:700">${usdFmt(x.usd)}</span></div>
      <div style="background:#f1f3f7;border-radius:4px;height:14px"><div style="width:${w}%;height:14px;border-radius:4px;background:${C_REV}" title="${esc(x.name)} ${usdFmt(x.usd)}"></div></div></div>`;
  }).join("");
}
function finBlock(c){
  const f=FIN.companies?FIN.companies[c]:null;
  if(!f)return"";
  const head=(inner,cnt)=>`<div class="block"><div class="blk-hd"><h3>재무 실적 <span style="font-size:11px;color:var(--sub);font-weight:600">USD 환산</span></h3><span class="cnt">${cnt||""}</span></div><div class="blk-body">${inner}</div></div>`;
  if(f.private){
    const inner=`<div class="empty" style="padding:6px 0">비상장 — 공시 실적 없음. 아래는 언론 보도 기반 추정치입니다.</div>`+
      (f.estimates||[]).map(e=>`<div class="est">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.label)}: ${usdFmt(e.value)}</a>`:`<b>${esc(e.label)}: ${usdFmt(e.value)}</b>`}<div class="src">${esc(e.source||"")}</div></div>`).join("")+
      `<div class="fin-note">${esc(f.note||"")}</div>`;
    return head(inner,"추정치");
  }
  const opName=f.op_metric||"영업이익";
  const hasSeg=!!(f.segments&&f.segments.items&&f.segments.items.length);
  const fv=(finView==="segments"&&!hasSeg)?"annual":finView;
  const chips=`<div class="ctrl">`+[["annual","연간 3년"],["quarterly","최근 4분기"],["segments","세그먼트"]]
    .filter(([k])=>k!=="segments"||hasSeg)
    .map(([k,lb])=>`<div class="rchip${k===fv?" on":""}" onclick="setFin('${k}')">${lb}</div>`).join("")+`</div>`;
  let body="";
  if(fv==="segments"){
    const items=(f.segments.items||[]).filter(x=>x.revenue!==null).map(x=>({...x,usd:toUsd(f,x.revenue)})).sort((a,b)=>b.usd-a.usd);
    body=`<div style="font-size:12px;color:var(--sub);font-weight:700;margin-bottom:2px">${esc(f.segments.label||"")} 세그먼트별 매출</div>`+segBars(items);
  }else{
    const rows=(f[fv]||[]).map(r=>({label:r.label,rev:toUsd(f,r.revenue),op:toUsd(f,r.op)}));
    body=groupedBars(rows,opName);
    body+=`<div class="fin-tbl tbl-wrap"><table><tr><th>기간</th><th>매출</th><th>${esc(opName)}</th><th>이익률</th></tr>`+
      rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${usdFmt(r.rev)}</td><td>${usdFmt(r.op)}</td><td>${(r.op!==null&&r.rev)?(r.op/r.rev*100).toFixed(1)+"%":"–"}</td></tr>`).join("")+`</table></div>`;
  }
  const shortNote=f.note?(f.note.length>130?f.note.slice(0,129)+"…":f.note):"";
  const note=`<div class="fin-note">현지통화 공시를 USD 환산 (환율 ${esc(FIN.fx_date||"")} 기준) · 이익 지표: ${esc(opName)}${shortNote?" · "+esc(shortNote):""} ${f.url?`· <a href="${esc(f.url)}" target="_blank" rel="noopener" style="color:var(--sub)">출처</a>`:""}</div>`;
  return head(chips+body+note);
}
function setFin(k){finView=k;render();}

function renderSelector(){
  let h="";
  for(const g in META.groups){
    h+=`<div class="grp"><div class="grp-label">${esc(g)}</div><div class="chips">`+
      META.groups[g].map(c=>`<div class="rchip${c===cur?" on":""}" onclick="sel('${c}')">${esc(KO[c]||c)}<span class="n">${(DATA[c]||[]).length}</span></div>`).join("")+
      `</div></div>`;
  }
  document.getElementById("selector").innerHTML=h;
}

function artCard(a){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.imp)}<span class="ev ${esc(a.evt)}">${esc(evLabel(a.evt))}</span></div>
    ${a.url?`<a class="art-title" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>`:`<div class="art-title">${esc(a.title)}</div>`}
    ${a.sum?`<div class="art-sum">${esc(a.sum)}</div>`:""}
    <div class="art-src">${esc(a.source||"")} · ${esc((a.date||"").slice(0,10))}</div></div>`;
}

function render(){
  document.getElementById("meta").textContent="업데이트 "+META.generated+" · 최근 400일 누적 · 회사를 선택하세요";
  renderSelector();
  const el=document.getElementById("content");
  if(!cur){el.innerHTML='<div class="empty">위에서 회사를 선택하면 현황 요약, 분기별 매트릭스, 이슈 타임라인이 표시됩니다.</div>';return;}
  const all=items(cur);
  let h="";

  /* ── 재무 실적 (첫 블록) ── */
  h+=finBlock(cur);

  /* ── 현황 요약 ── */
  const d90=all.filter(a=>daysAgo(a.date)<=90);
  const tops=all.filter(a=>daysAgo(a.date)<=180).sort((a,b)=>(b.imp-a.imp)||(b.date||"").localeCompare(a.date||"")).slice(0,3);
  h+=`<div class="block"><div class="blk-hd"><h3>${esc(NAME[cur]||cur)} 주요 이슈</h3><span class="cnt">최근 90일 ${d90.length}건${d90.filter(a=>a.imp>=5).length?` · 긴급 ${d90.filter(a=>a.imp>=5).length}건`:""}</span></div><div class="blk-body">
    ${tops.length?tops.map(a=>artCard(a)).join(""):'<div class="empty">최근 6개월 내 주요 이슈 없음</div>'}
  </div></div>`;

  /* ── 분기 매트릭스 ── */
  const qs=[...new Set(all.map(a=>quarterOf(a.date)))].sort().reverse().slice(0,5);
  const evts=EVTS.filter(e=>all.some(a=>a.evt===e));
  if(qs.length){
    let tbl=`<table><tr><th>분기</th>`+evts.map(e=>`<th>${esc(evLabel(e))}</th>`).join("")+`</tr>`;
    for(const qt of qs){
      tbl+=`<tr><th>${esc(qt)}</th>`+evts.map(e=>{
        const hit=all.filter(a=>quarterOf(a.date)===qt&&a.evt===e).sort((x,y)=>(y.imp-x.imp)||(y.date||"").localeCompare(x.date||""))[0];
        if(!hit)return"<td></td>";
        const t=hit.title.length>34?hit.title.slice(0,33)+"…":hit.title;
        return `<td>${hit.url?`<a href="${esc(hit.url)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t)}</td>`;
      }).join("")+`</tr>`;
    }
    tbl+=`</table>`;
    h+=`<div class="block"><div class="blk-hd"><h3>분기별 주요 사건</h3><span class="cnt">카테고리별 최고 중요도 1건</span></div><div class="blk-body tbl-wrap">${tbl}</div></div>`;
  }

  /* ── 타임라인 ── */
  let list=all.filter(a=>daysAgo(a.date)<=period);
  if(evtFilter) list=list.filter(a=>a.evt===evtFilter);
  if(q.trim()){const t=q.toLowerCase();list=list.filter(a=>((a.title||"")+" "+(a.sum||"")).toLowerCase().includes(t));}
  let tl=`<div class="ctrl">`+PERIODS.map(([lb,d])=>`<div class="rchip${d===period?" on":""}" onclick="setPeriod(${d})">${lb}</div>`).join("")+`</div>`;
  tl+=`<div class="ctrl"><div class="rchip${!evtFilter?" on":""}" onclick="setEvt('')">전체</div>`+
    EVTS.filter(e=>all.some(a=>a.evt===e)).map(e=>`<div class="rchip${e===evtFilter?" on":""}" onclick="setEvt('${e}')">${esc(evLabel(e))}</div>`).join("")+`</div>`;
  tl+=`<input class="search" id="qbox" value="${esc(q)}" placeholder="제목·내용 검색" onkeydown="if(event.key==='Enter'){q=this.value;render();}">`;
  if(!list.length) tl+=`<div class="empty">조건에 맞는 이슈가 없습니다</div>`;
  else{
    let mon="";
    for(const a of list){
      const m=(a.date||"").slice(0,7);
      if(m!==mon){mon=m;tl+=`<div class="month-hd">${esc(m)}</div>`;}
      tl+=artCard(a);
    }
  }
  h+=`<div class="block"><div class="blk-hd"><h3>이슈 타임라인</h3><span class="cnt">${list.length}건</span></div><div class="blk-body">${tl}</div></div>`;
  el.innerHTML=h;
}
function sel(c){cur=c;evtFilter="";q="";render();window.scrollTo(0,0);}
function setPeriod(d){period=d;render();}
function setEvt(e){evtFilter=e;render();}
const first=Object.values(META.groups)[0];
if(first&&first.length) cur=first[0];
render();
</script>
</body>
</html>
