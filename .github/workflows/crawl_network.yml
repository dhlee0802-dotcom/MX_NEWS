name: Network News Crawl

on:
  schedule:
    - cron: "12,42 * * * *"   # 30분 주기, MX(7,27,47분)와 겹치지 않게 배치
  workflow_dispatch:

concurrency:
  group: network-crawl
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Mark start
        run: echo "START_TS=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser googlenewsdecoder "selectolax<1.0"

      - name: Run crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python crawler_network.py

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/network.html || true
          git add docs/briefing.html || true
          git add gemini_model_nw.txt || true
          git add gemini_diag.txt || true
          git add network_archive.json || true
          git add briefings_network.json || true
          git add topics_seen_network.json || true
          git add gn_url_cache_network.json || true
          git add impact_cache_network.json || true
          git add gemini_cooldown_nw.json || true
          git add company_history.json || true
          git add docs/company.html || true
          git add docs/vendors.html || true
          git add stock_prices.json || true
          git commit -m "network dashboard update" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패 ($i/3) - 30초 후 재시도"
            sleep 30
          done
          echo "push 3회 모두 실패 (GitHub 서버 오류 가능성) - 다음 크롤에서 자동 반영됨"
          exit 1

      - name: Schedule next run (30분 주기 자가 예약)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - START_TS ))
          wait=$(( 1800 - elapsed )); [ $wait -lt 60 ] && wait=60
          echo "다음 회차까지 ${wait}초 대기"
          sleep $wait
          gh workflow run crawl_network.yml --ref main -R "$GITHUB_REPOSITORY" && echo "다음 회차 예약 완료"
