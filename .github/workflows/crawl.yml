name: MX News Crawl

on:
  schedule:
    - cron: "7,27,47 * * * *"   # 20분 간격 (혼잡한 정각 회피)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mark start
        run: echo "START_TS=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser googlenewsdecoder "selectolax<1.0"

      - name: Run crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python crawler_actions.py

      - name: Commit dashboard
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html gemini_model.txt notified.txt archive.json || true
          git add gn_url_cache_mx.json || true
          git add impact_cache_mx.json || true
          git add gemini_cooldown_mx.json || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "update dashboard [skip ci]"
          # 원격에 새 커밋이 있으면 당겨오되, docs/index.html 충돌은 방금 생성한 최신본으로 자동 해소
          git pull --rebase -X theirs origin main
          git push origin main

      # GitHub cron은 혼잡 시 몇 시간씩 밀리므로(실측 4~6시간 간격), 실행 종료 후 스스로 다음 회차를 예약해
      # 30분 주기를 보장. cron은 체인이 끊겼을 때의 백업 역할. 중단하려면 Actions 탭에서 워크플로 비활성화.
      - name: Schedule next run (30분 주기 자가 예약)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - START_TS ))
          wait=$(( 1800 - elapsed )); [ $wait -lt 60 ] && wait=60
          echo "다음 회차까지 ${wait}초 대기"
          sleep $wait
          gh workflow run crawl.yml --ref main -R "$GITHUB_REPOSITORY" && echo "다음 회차 예약 완료"
