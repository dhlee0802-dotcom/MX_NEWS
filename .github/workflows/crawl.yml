name: MX News Crawl

on:
  schedule:
    - cron: "7,27,47 * * * *"   # 20분 간격 (혼잡한 정각 회피)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser googlenewsdecoder

      - name: Run crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python crawler_actions.py

      - name: Commit dashboard
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html gemini_model.txt || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "update dashboard [skip ci]"
          # 원격에 새 커밋이 있으면 당겨오되, docs/index.html 충돌은 방금 생성한 최신본으로 자동 해소
          git pull --rebase -X theirs origin main
          git push origin main
