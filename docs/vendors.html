<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>글로벌 RAN·Core 벤더 맵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{
    --bg:#0d1528; --bg2:#0a1020; --panel:#141d33; --raised:#1b2742; --raised2:#223052;
    --line:rgba(150,170,215,.14); --line2:rgba(150,170,215,.26);
    --ink:#e7ecf7; --sub:#8e9bb8; --dim:#5f6c8a; --blue:#5b8cff; --blue-soft:rgba(91,140,255,.14);
    --land:#223052; --land-line:#0d1528; --ocean:#0f1b33; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%, rgba(91,140,255,.14), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(57,198,185,.08), transparent 60%),var(--bg);background-repeat:no-repeat;min-height:100vh;color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit} button{font-family:inherit}
  header{position:sticky;top:0;z-index:40;background:rgba(13,21,40,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hd-in{max-width:1480px;margin:0 auto;padding:10px 18px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:9px;white-space:nowrap}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(91,140,255,.18)}
  h1 span.t{color:var(--sub);font-weight:600}
  .hd-btns{display:flex;gap:6px;flex:0 0 auto}
  .hbtn{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:rgba(27,39,66,.7);color:var(--sub);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:border-color .2s,color .2s}
  .hbtn:hover{color:var(--ink);border-color:var(--blue)}
  .hbtn.on{background:var(--blue-soft);border-color:var(--blue);color:#bcd0ff}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:3px}
  main{max-width:1480px;margin:0 auto;padding:12px 16px 60px}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .toolbar .lb{font-size:11.5px;color:var(--sub);font-weight:700;margin-right:2px}
  .chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--sub);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:all .18s}
  .chip:hover{color:var(--ink)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
  .chip.sm{font-size:11px;padding:3px 9px}
  .layout{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media(min-width:1000px){.layout.open{grid-template-columns:minmax(0,1fr) minmax(420px,1fr)}}
  .mapbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;box-shadow:0 10px 30px -18px rgba(0,0,0,.7);user-select:none;touch-action:none}
  .mapbox svg{display:block;width:100%;height:auto;cursor:grab}
  .mapbox.drag svg{cursor:grabbing}
  .mapbox .c{fill:var(--land);stroke:var(--land-line);stroke-width:.6;transition:fill .25s;vector-effect:non-scaling-stroke}
  .mapbox .c.has{cursor:pointer}
  .mapbox .c.has:hover{filter:brightness(1.3)}
  .mapbox .c.sel{stroke:#fff;stroke-width:1.3}
  .mapbox.zoomed .c:not(.sel){opacity:.5}
  .maptip{position:absolute;z-index:5;background:#223052;color:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.55);display:none;pointer-events:none;max-width:360px}
  .maptip .t{font-weight:800;font-size:13px;margin-bottom:4px}
  .maptip .r{display:flex;gap:6px;align-items:center;margin:2px 0;flex-wrap:nowrap}
  .maptip .r b{font-weight:700;min-width:84px;color:#cfe0ff;white-space:nowrap}
  .vch{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.08);color:#e7ecf7;white-space:nowrap;line-height:1.5}
  .vch i{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex:0 0 auto}
  .vch.sun{opacity:.5;text-decoration:line-through}
  .mapctl{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:4;flex-wrap:wrap}
  .mapctl .chip{background:rgba(20,29,51,.9)}
  .zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;z-index:4}
  .zoomctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:rgba(20,29,51,.9);color:var(--ink);font-size:16px;cursor:pointer}
  .legend{position:absolute;left:12px;bottom:12px;background:rgba(20,29,51,.9);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;color:var(--sub);display:flex;flex-wrap:wrap;gap:5px 10px;max-width:75%}
  .legend i{display:inline-flex;align-items:center;gap:5px;font-style:normal}
  .legend i::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
  .mapbox.zoomed .legend{display:none}
  .empty{color:var(--dim);font-size:12.5px;padding:30px 10px;text-align:center}
  /* 상세 패널 */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(0,0,0,.7);animation:in .4s var(--ease)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .p-hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .p-hd h2{font-size:16px;font-weight:800}
  .p-hd .cnt{font-size:11.5px;color:var(--sub)}
  .p-body{padding:10px 12px 14px}
  details.cnote{font-size:12.5px;color:var(--sub);line-height:1.55;padding:8px 12px;background:var(--raised);border-radius:10px;margin-bottom:10px}
  details.cnote summary{cursor:pointer;color:var(--ink);font-weight:700;font-size:12.5px}
  details.cnote summary span{color:var(--sub);font-weight:500}
  details.cnote p{margin-top:6px}
  .car{border:1px solid var(--line);border-radius:12px;background:var(--raised);margin-bottom:8px;overflow:hidden}
  .car-hd{padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;cursor:pointer;align-items:center}
  .car-hd:hover{background:var(--raised2)}
  .car-hd h3{font-size:14px;font-weight:800;display:inline}
  .car-hd .loc{font-weight:500;color:var(--sub);font-size:12px;margin-left:6px}
  .car-hd .line{display:flex;gap:4px;flex-wrap:wrap;align-items:center;grid-column:1/-1}
  .car-hd .line .k{font-size:11px;color:var(--sub);margin-right:2px}
  .conf{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--raised2);color:var(--sub);white-space:nowrap}
  .conf.high{color:#7fe3d8} .conf.medium{color:#ffd08a} .conf.low{color:#ff9fae}
  .car-body{padding:0 12px 10px;display:none}
  .car.open .car-body{display:block}
  .grid2{display:grid;grid-template-columns:1fr;gap:0 16px}
  @media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
  table.kv{width:100%;border-collapse:collapse;font-size:12.5px}
  table.kv td{padding:3px 0;vertical-align:top;border-top:1px solid var(--line)}
  table.kv tr:first-child td{border-top:none}
  table.kv td:first-child{color:var(--sub);font-size:11.5px;white-space:nowrap;width:62px;padding-right:8px;padding-top:5px}
  table.kv .vs{display:flex;flex-wrap:wrap;gap:3px}
  .sec{font-size:11.5px;font-weight:800;color:var(--sub);margin:10px 0 5px;display:flex;align-items:center;gap:8px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .share{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;background:var(--bg2)}
  .share div{height:100%;background:var(--c)}
  .share-row{display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap;font-size:11.5px;margin-top:3px}
  .share-row span{display:inline-flex;align-items:center;gap:4px}
  .share-row span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
  .basis{font-size:11px;color:var(--dim)}
  .reg{font-size:12.5px;padding:2px 0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .iss{font-size:12.5px;padding:3px 0;display:flex;gap:8px;align-items:baseline}
  .iss b{color:var(--sub);font-size:11.5px;flex:0 0 36px}
  .srcs{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.6}
  .srcs a{color:#8fb0ff;text-decoration:none} .srcs a:hover{text-decoration:underline}
  .sl{color:#8fb0ff;text-decoration:none;font-size:11px}
  .deal{display:grid;grid-template-columns:68px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:baseline}
  .deal:first-child{border-top:none}
  .deal .d{color:var(--sub);font-size:11.5px;font-variant-numeric:tabular-nums}
  .deal .m{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
  .deal a{color:var(--ink);text-decoration:none} .deal a:hover{color:#dbe6ff}
  .deal .tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--raised2);color:var(--sub)}
  /* 아카이브 뷰 */
  .arch{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .arch .blk-hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .arch .blk-hd h2{font-size:15px;font-weight:800}
  .arch .blk-hd .cnt{font-size:11.5px;color:var(--sub)}
  .arch table{width:100%;border-collapse:collapse;font-size:12.5px}
  .arch th{font-size:11.5px;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:#182340;white-space:nowrap}
  .arch td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .arch tr:hover td{background:var(--raised)}
  .arch td a{color:var(--ink);text-decoration:none} .arch td a:hover{color:#dbe6ff}
  .arch .dt{white-space:nowrap;color:var(--sub);font-variant-numeric:tabular-nums}
  @media(max-width:700px){h1 .t{display:none}.hbtn .lb{display:none}.legend{display:none}.hd-meta{display:none}main{padding:10px 10px 60px}.arch .hide-m{display:none}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header><div class="hd-in">
  <div class="hd-top">
    <h1><span class="dot"></span>Samsung Network <span class="t">글로벌 RAN·Core 벤더 맵</span></h1>
    <div class="hd-btns">
      <button class="hbtn on" id="tabMap" onclick="setView('map')">🌐<span class="lb">벤더 맵</span></button>
      <button class="hbtn" id="tabArch" onclick="setView('arch')">📁<span class="lb">수주·벤더 변경 아카이브</span></button>
      <button class="hbtn" id="tabCert" onclick="setView('cert')">📡<span class="lb">전파 인증</span></button>
      <a class="hbtn" href="network.html">📡<span class="lb">뉴스</span></a>
      <a class="hbtn" href="company.html">🏢<span class="lb">기업</span></a>
      <a class="hbtn" href="briefing.html">📄<span class="lb">브리핑</span></a>
    </div>
  </div>
  <div class="hd-meta" id="meta">지구본을 드래그해 돌리고, 국가에 마우스를 올리면 사업자별 공급사, 클릭하면 상세(권역·점유율·근거)</div>
</div></header>
<main>
  <div id="viewMap">
    <div class="toolbar" id="toolbar"></div>
    <div class="layout" id="layout">
      <div class="mapbox" id="mapbox">
        <div class="mapctl">
          <button class="chip" id="backBtn" style="display:none" onclick="selectCountry(null)">← 전체 보기</button>
          <button class="chip" id="projBtn" onclick="toggleProj()">🗺 평면 지도</button>
          <button class="chip" id="spinBtn" onclick="toggleSpin()">⏸ 회전 멈춤</button>
        </div>
        <div class="zoomctl"><button onclick="zoomBy(1.4)" aria-label="확대">+</button><button onclick="zoomBy(1/1.4)" aria-label="축소">−</button></div>
        <svg id="map" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="legend" id="legend"></div>
        <div class="maptip" id="maptip"></div>
      </div>
      <div id="panel"></div>
    </div>
  </div>
  <div id="viewArch" style="display:none"></div>
  <div id="viewCert" style="display:none"></div>
</main>

<script>
const VM=(typeof VENDOR_MAP!=="undefined")?VENDOR_MAP:{countries:[]};
const DEALS=(typeof VENDOR_DEALS!=="undefined")?VENDOR_DEALS:[];
const VCOL={"Samsung":"#4a78ea","Ericsson":"#1f9c90","Nokia":"#8b6cf0","Huawei":"#e0405a","ZTE":"#c4811f","Mavenir":"#d94f9c","NEC":"#3f9fd6","Fujitsu":"#9a7b2a","Rakuten Symphony":"#b4457a","Cisco":"#5fa8a0","Oracle":"#a86b3c","Datang":"#7a4fb0","Airspan":"#4f8fb0","Tejas":"#6a9a3a","1Finity":"#9a7b2a","Microsoft":"#4f6fb0"};
const OTHER="#6f7d9c", NODATA="#223052";
const REGION={"KOR":"아시아","JPN":"아시아","CHN":"아시아","IND":"아시아","USA":"북미","CAN":"북미","MEX":"중남미","BRA":"중남미","ARG":"중남미","CHL":"중남미","COL":"중남미","PER":"중남미"};
function vbase(v){return String(v||"").replace(/\s*\(.*\)$/,"").trim();}
function vcol(v){const b=vbase(v).toLowerCase();for(const k in VCOL){if(b.startsWith(k.toLowerCase()))return VCOL[k];}return OTHER;}
function esc(s){return String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function vchip(v){v=String(v||"");if(/^\(/.test(v)||/미확인$/.test(v))return `<span class="basis">${esc(v)}</span>`;const sun=/종료|sunset|철거/i.test(v);return `<span class="vch${sun?" sun":""}" style="--c:${vcol(v)}"><i></i>${esc(v)}</span>`;}
const BYISO={}; VM.countries.forEach(c=>BYISO[c.iso3]=c);
const FEATS=WORLD.lo.map(f=>({id:f.id,n:f.n,r:f.r})).concat(Object.keys(WORLD.hi).map(k=>({id:k,n:WORLD.hi[k].n,r:WORLD.hi[k].r})));
const BYFEAT={}; FEATS.forEach(f=>BYFEAT[f.id]=f);
let selIso=null, vendorFilter=null, view="map";

/* ── 투영 ── */
const W=1000,H=560,CX=500,CY=282,R=262,D2R=Math.PI/180;
let proj="globe", cLon=15, cLat=22, spin=true, dragging=false, vb=[0,0,W,H];
function ortho(lon,lat,lon0,lat0){
  const l=(lon-lon0)*D2R, p=lat*D2R, p0=lat0*D2R, cp=Math.cos(p), sp=Math.sin(p), cp0=Math.cos(p0), sp0=Math.sin(p0), cl=Math.cos(l);
  const c=sp0*sp+cp0*cp*cl;
  return [CX+R*cp*Math.sin(l), CY-R*(cp0*sp-sp0*cp*cl), c];
}
const EA={A1:1.340264,A2:-0.081106,A3:0.000893,A4:0.003796,M:Math.sqrt(3)/2};
function eeRaw(lon,lat){const l=lon*D2R,p=lat*D2R,t=Math.asin(EA.M*Math.sin(p)),t2=t*t,t6=t2*t2*t2;
  return [2*Math.sqrt(3)/3*l*Math.cos(t)/(EA.A1+3*EA.A2*t2+t6*(7*EA.A3+9*EA.A4*t2)), t*(EA.A1+EA.A2*t2+t6*(EA.A3+EA.A4*t2))];}
const EEX=eeRaw(180,0)[0], EEY=eeRaw(0,90)[1], EES=Math.min((W-20)/(2*EEX),(H-20)/(2*EEY));
function flat(lon,lat){const [x,y]=eeRaw(lon,lat);return [CX+x*EES, CY-y*EES, 1];}
function fmt(n){return Math.round(n*10)/10;}
function ringPath(ring,lon0,lat0){
  // 정사영: 지평선(c=0)에서 잘라 보이는 구간만 서브패스로. 평면: 전체.
  if(proj==="flat"){ // 날짜변경선을 가로지르는 구간은 서브패스로 분리(러시아·피지 가로선 방지)
    let out="",cur=[],prev=null;
    for(const p of ring){ if(prev&&Math.abs(p[0]-prev[0])>180){ if(cur.length>2)out+="M"+cur.join("L")+"Z"; cur=[]; } const [x,y]=flat(p[0],p[1]); cur.push(fmt(x)+","+fmt(y)); prev=p; }
    if(cur.length>2)out+="M"+cur.join("L")+"Z"; return out; }
  let out="", cur=[], prevP=null, prevV=null;
  const edge=(a,b)=>{ // a 보임, b 안보임 (또는 반대) 사이 경계점 이분탐색
    let lo=a,hi=b; for(let i=0;i<8;i++){const m=[(lo[0]+hi[0])/2,(lo[1]+hi[1])/2]; if(ortho(m[0],m[1],lon0,lat0)[2]>0)lo=m;else hi=m;} return lo;};
  const n=ring.length;
  for(let i=0;i<=n;i++){
    const p=ring[i%n]; const q=ortho(p[0],p[1],lon0,lat0); const vis=q[2]>0;
    if(prevP){
      if(vis&&!prevV){const e=edge(p,prevP);const eq=ortho(e[0],e[1],lon0,lat0);cur.push(fmt(eq[0])+","+fmt(eq[1]));}
      if(!vis&&prevV){const e=edge(prevP,p);const eq=ortho(e[0],e[1],lon0,lat0);cur.push(fmt(eq[0])+","+fmt(eq[1]));out+="M"+cur.join("L")+"Z";cur=[];}
    }
    if(vis) cur.push(fmt(q[0])+","+fmt(q[1]));
    prevP=p; prevV=vis;
  }
  if(cur.length>2) out+="M"+cur.join("L")+"Z";
  return out;
}
function featPath(f,lon0,lat0){let d="";for(const r of f.r){if(proj==="globe"){ // 링 전체가 뒷면이면 건너뜀(빠른 판정)
      let any=false;for(let i=0;i<r.length;i+=Math.max(1,Math.floor(r.length/24))){if(ortho(r[i][0],r[i][1],lon0,lat0)[2]>0){any=true;break;}}
      if(!any)continue;}
    d+=ringPath(r,lon0,lat0);} return d;}

/* ── 그리기 ── */
function buildMap(){
  const svg=document.getElementById("map");
  let h=`<defs><radialGradient id="og" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#1a2b4d"/><stop offset="1" stop-color="#0b1326"/></radialGradient></defs>`;
  h+=`<circle id="sphere" cx="${CX}" cy="${CY}" r="${R}" fill="url(#og)" stroke="rgba(150,170,215,.25)" stroke-width="1"/><path id="grat" fill="none" stroke="rgba(150,170,215,.09)" stroke-width=".6"/>`;
  h+=FEATS.map(f=>{const c=BYISO[f.id];return `<path class="c${c?" has":""}" data-iso="${f.id}" data-name="${esc(f.n)}" d=""></path>`;}).join("");
  svg.innerHTML=h;
  svg.querySelectorAll(".c.has").forEach(p=>{
    p.addEventListener("pointermove",e=>{if(!dragging)showTip(e,p.dataset.iso);});
    p.addEventListener("pointerleave",hideTip);
  });
  renderMap(); paint();
}
function renderMap(){
  const svg=document.getElementById("map"); const lon0=cLon, lat0=cLat;
  const sph=document.getElementById("sphere"), gr=document.getElementById("grat");
  if(proj==="globe"){
    sph.style.display=""; let g="";
    for(let lon=-180;lon<180;lon+=30){const pts=[];for(let lat=-90;lat<=90;lat+=3)pts.push([lon,lat]);g+=ringPathOpen(pts,lon0,lat0);}
    for(let lat=-60;lat<=60;lat+=30){const pts=[];for(let lon=-180;lon<=180;lon+=3)pts.push([lon,lat]);g+=ringPathOpen(pts,lon0,lat0);}
    gr.setAttribute("d",g);
  }else{sph.style.display="none";gr.setAttribute("d","");}
  svg.querySelectorAll(".c").forEach(p=>{const f=BYFEAT[p.dataset.iso];p.setAttribute("d",featPath(f,lon0,lat0));});
}
function ringPathOpen(pts,lon0,lat0){let out="",cur=[];for(const p of pts){const q=ortho(p[0],p[1],lon0,lat0);if(q[2]>0.002)cur.push(fmt(q[0])+","+fmt(q[1]));else if(cur.length){out+="M"+cur.join("L");cur=[];}}if(cur.length>1)out+="M"+cur.join("L");return out;}
function carrierLead(k){
  // 사업자별 선두 벤더: 최근 3년 내 사이트 점유율이 있으면 최대 벤더, 없으면 5G 공급사 목록의 첫 벤더
  let sh=(k.share||[]).filter(s=>s.pct!=null&&String(s.asof||"")>="2023");
  if(sh.length){const latest=sh.map(s=>s.asof||"").sort().pop();sh=sh.filter(s=>(s.asof||"")===latest).sort((a,b)=>b.pct-a.pct);return vbase(sh[0].vendor);}
  const v5=((k.ran||{})["5g"]||[]).filter(v=>!/종료|철거/.test(v)); if(v5.length)return vbase(v5[0]);
  const v4=((k.ran||{})["4g"]||[]).filter(v=>!/종료|철거/.test(v)); return v4.length?vbase(v4[0]):null;
}
function leadVendor(c){
  // 국가 색: 사업자별 선두 벤더 다수결(지역·도매 사업자 제외), 동률이면 전국 MNO 순서 우선
  const votes={}; let first=null;
  c.carriers.filter(k=>!k.type||/MNO/i.test(k.type)).forEach(k=>{const v=carrierLead(k);if(!v||/^기타/.test(v))return;votes[v]=(votes[v]||0)+1;if(!first)first=v;});
  let best=null;for(const v in votes){if(!best||votes[v]>votes[best])best=v;} return best||first;
}
function vendorsIn(c){const set=new Set();c.carriers.forEach(k=>{for(const g in (k.ran||{}))(k.ran[g]||[]).forEach(v=>{if(!/종료/.test(v))set.add(vbase(v));});for(const g in (k.core||{}))(k.core[g]||[]).forEach(v=>set.add(vbase(v)));});return set;}
function paint(){
  document.querySelectorAll("#map .c").forEach(p=>{
    const c=BYISO[p.dataset.iso]; if(!c){p.style.fill="";return;}
    if(vendorFilter){p.style.fill=vendorsIn(c).has(vendorFilter)?(VCOL[vendorFilter]||OTHER):"#2f3d5c";}
    else{const lv=leadVendor(c);p.style.fill=lv?(VCOL[lv]||OTHER):"#3a5582";}
  });
  const vendors=["Samsung","Ericsson","Nokia","Huawei","ZTE","Mavenir","NEC","Fujitsu"];
  document.getElementById("legend").innerHTML=(vendorFilter?`<i style="--c:${VCOL[vendorFilter]||OTHER}">${esc(vendorFilter)} 공급 국가</i><i style="--c:#2f3d5c">미공급·미확인</i>`
    :`<span style="width:100%;font-weight:700;color:var(--sub)">색 = 5G RAN 선두 벤더 (사이트 점유율 → 없으면 공급사 수)</span>`+vendors.map(v=>`<i style="--c:${VCOL[v]}">${v}</i>`).join("")+`<i style="--c:${NODATA}">미조사</i>`);
}
function showTip(e,iso){
  const c=BYISO[iso]; const tip=document.getElementById("maptip"); if(!c){tip.style.display="none";return;}
  tip.innerHTML=`<div class="t">${esc(c.name_ko)} <span style="font-weight:500;color:#9fb3dc;font-size:11px">사업자 ${c.carriers.length}곳 · 5G RAN 공급사 · 클릭하면 상세</span></div>`+
    c.carriers.map(k=>{const v=((k.ran||{})["5g"]||[]).filter(x=>!/종료/.test(x));const v4=((k.ran||{})["4g"]||[]).filter(x=>!/종료/.test(x));
      return `<div class="r"><b>${esc(k.name)}</b>${(v.length?v:v4).map(vchip).join("")||'<span style="color:#9fb3dc">미확인</span>'}${!v.length&&v4.length?'<span style="color:#9fb3dc;font-size:10.5px">(4G)</span>':""}</div>`;}).join("");
  const box=document.getElementById("mapbox").getBoundingClientRect();
  let x=e.clientX-box.left+14, y=e.clientY-box.top+14;

function centroid(f){ let best=null,ba=-1; for(const r of f.r){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const [x,y] of r){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}const a=(x1-x0)*(y1-y0);if(a>ba){ba=a;best=r;}}
  let sx=0,sy=0;for(const [x,y] of best){sx+=x;sy+=y;} return {lon:sx/best.length,lat:sy/best.length,ring:best}; }
function bboxAt(ring,lon0,lat0){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of ring){const q=proj==="globe"?ortho(p[0],p[1],lon0,lat0):flat(p[0],p[1]);if(proj==="globe"&&q[2]<=0)continue;if(q[0]<x0)x0=q[0];if(q[1]<y0)y0=q[1];if(q[0]>x1)x1=q[0];if(q[1]>y1)y1=q[1];}return [x0,y0,x1,y1];}

  const cn=iso=>(BYISO[iso]||{}).name_ko||iso;
  let rows=DEALS.filter(d=>(!afV||d.vendor===afV)&&(!afC||d.country===afC)&&(!afP||d.product===afP));
  el.innerHTML=`<div class="toolbar"><span class="lb">벤더</span>${vendors.map(v=>`<button class="chip sm${afV===v?" on":""}" style="--c:${vcol(v)}" onclick="setAf('v','${v}')"><span class="sw"></span>${v}</button>`).join("")}
    <span class="lb" style="margin-left:10px">국가</span>${countries.map(c=>`<button class="chip sm${afC===c?" on":""}" onclick="setAf('c','${c}')">${esc(cn(c))}</button>`).join("")}
    ${prods.length?`<span class="lb" style="margin-left:10px">제품</span>`+prods.map(p=>`<button class="chip sm${afP===p?" on":""}" onclick="setAf('p','${p.replace(/'/g,"\\'")}')">${esc(p)}</button>`).join(""):""}</div>
    <div class="arch"><div class="blk-hd"><h2>수주·벤더 변경 아카이브</h2><span class="cnt">${rows.length}건 · 뉴스 크롤에서 장비 벤더가 주체인 수주·공급 기사를 자동 누적(2년 보관) · 제품 유형은 기사 판정 기준</span></div>
    ${rows.length?`<div style="overflow-x:auto"><table><tr><th>시점</th><th>벤더</th><th>사업자</th><th class="hide-m">국가</th><th class="hide-m">공급 제품</th><th>기사</th></tr>`+
      rows.map(d=>`<tr><td class="dt">${esc((d.date||"").slice(0,10))}</td><td>${vchip(d.vendor)}</td><td>${esc(d.carrier||"–")}</td><td class="hide-m">${d.country?`<a href="#" onclick="setView('map');selectCountry('${d.country}');return false" style="color:#8fb0ff">${esc(cn(d.country))}</a>`:"–"}</td><td class="hide-m">${esc(d.product||d.kw||"–")}</td><td><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> <span class="basis">${esc(d.source||"")}${d.score?` · ${d.score}점`:""}</span></td></tr>`).join("")+`</table></div>`:'<div class="empty">조건에 맞는 기사가 없습니다.</div>'}</div>`;
}

buildMap(); renderToolbar(); updSpin(); spinLoop();
if(VM.generated) document.getElementById("meta").textContent=`드래그로 회전 · 휠/버튼으로 확대 · 국가에 올리면 사업자별 5G 공급사, 클릭하면 상세 · 데이터 ${VM.generated} · ${VM.countries.length}개국 ${VM.countries.reduce((a,c)=>a+c.carriers.length,0)}개 사업자 · 수주 아카이브 ${DEALS.length}건 · 전파 인증 ${Object.values(CERTS).reduce((a,c)=>a+(c.items||[]).length,0)}건`;
if(!VM.countries.length) document.getElementById("panel").innerHTML='<div class="empty">벤더 데이터가 아직 없습니다.</div>';
</script>
</body>
</html>
