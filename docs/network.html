"contract", "importance": 3, "wl": false, "topic": "에이스테크놀로지 위성안테나"}, {"title": "\"HBM·AIDC만 AI 인프라 아냐\"…통신3사 \"네트워크 투자 지원해야\"", "summary": "AI 반도체와 AI 데이터센터(AIDC) 등에 국가적인 투자가 집중되고 있는 것처럼, 5G 단독모드(SA)와 AI 기반 무선접속망(AI-RAN), 6G 등 통신망과 해저케이블, 저궤도 위성 등 AI를 산업현장과 이용자에게 연결하는 네트워크...", "source": "news1.kr", "date": "2026-09-02 15:09", "url": "https://www.news1.kr/it-science/cc-newmedia/6277550", "category": "tech", "importance": 3, "wl": false, "topic": ""}, {"title": "대한항공 기내서 ‘공짜 와이파이’...9월 스타링크 도입 - 매일경제", "summary": "대한항공이 오는 9월부터 기내에서 스타링크의 고속 무료 와이파이 서비스를 도입합니다. 항공기 승객들에게 지상과 다름없는 끊김 없는 인터넷 환경을 제공하기 위한 전략입니다. 글로벌 항공사들의 위성 기반 기내 인터넷 도입 경쟁이 국내로 본격 확산하고 있습니다. 스페이스X의 항공 부문 시장 점유율 확대에 크게 기여할 것으로 보입니다.", "source": "매일경제", "date": "2026-09-02 14:32", "url": "https://www.mk.co.kr/news/business/12142298", "category": "contract", "importance": 3, "wl": false, "topic": "대한항공 스타링크"}, {"title": "스페이스X, AI 데이터센터 수장 교체…인력 이탈·장애 속 운영 안정화 총력 - 디지털투데이", "summary": "스페이스X가 AI 데이터센터 부문의 수장을 교체하며 내부 인력 이탈과 최근 발생한 시스템 장애 수습에 총력을 기울이고 있습니다. 급성장하는 AI 인프라와 위성 통신망 운영의 안정성을 동시에 확보하기 위한 고강도 조치입니다. 핵심 리더십 교체를 통해 조직을 재정비하고 기술적 난관을 돌파하려는 의도로 풀이됩니다. 향후 스페이스X의 AI 및 네트워크 서비스 운영에 이목이 쏠립니다.", "source": "디지털투데이", "date": "2026-09-02 14:04", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697624", "category": "exec", "importance": 3, "wl": false, "topic": "스페이스x 경영진교체"}, {"title": "Can Europe take on Elon Musk’s Starlink? - The Times", "summary": "유럽 연합이 일론 머스크의 스타링크에 맞설 독자적인 위성통신망 구축을 추진하고 있습니다. 스페이스X의 시장 지배력이 확대됨에 따라 유럽 내에서는 통신 주권 확보의 필요성이 커졌습니다. 유럽은 자체 저궤도 위성 프로젝트를 통해 안보 및 상업 통신망의 자립을 도모하고 있습니다. 글로벌 위성통신 시장은 미국과 유럽 간의 기술 패권 경쟁 양상으로 번지고 있습니다.", "source": "The Times", "date": "2026-09-02 14:00", "url": "https://www.thetimes.com/business/technology/article/eutelsat-oneweb-europe-space-race-starlink-9lf5pntb7", "category": "competitor", "importance": 3, "wl": false, "topic": "스타링크 유럽"}, {"title": "ASTS Down 46.3%, Insiders Buying, Earnings Make Or Break! | ASTS Stock Analysis Cbse 12th 02 01:05", "url": "https://www.telcotitans.com/network-and-it/new-helium-ceo-channels-starlink-with-enabler-platform-debut/10829.article", "category": "exec", "importance": 3, "wl": false, "topic": ""}, {"title": "AMZN or SPCX: One Stock Could Capture 76% of a $107B Satellite Market, Says Wells Fargo - ", "summary": "웰스파고 분석에 따르면 아마존과 스페이스X 중 한 기업이 1,070억 달러 규모의 위성 시장의 76%를 장악할 수 있습니다. 저궤도 위성통신 시장의 초기 주도권을 쥐기 위한 거인들의 경쟁이 극한으로 치닫고 있습니다. 두 기업의 공격적인 인프라 투자가 시장 독점력을 강화하는 주요 동인으로 작용하고 있습니다. 통신 장비 및 서비스 생태계 전반에 지대한 파장을 일으킬 것으로 예상됩니다.", "source": "TipRanks", "date": "2026-09-01 21:06", "url": "https://www.tipranks.com/news/amzn-or-spcx-one-stock-could-capture-76-of-a-107b-satellite-market-says-wells-fargo", "category": "competitor", "importance": 3, "wl": false, "topic": "웰스파고 위성시장"}, {"title": "KDDI Expands Starlink Direct Access to Philippines, New Zealand - Telecom Review Asia", "summary": "", "source": "Telecom Review Asia", "date": "2026-09-01 19:31", "url": "https://www.telecomreviewasia.com/news/network-news/30140-kddi-expands-starlink-direct-access-to-philippines-new-zealand/", "category": "other", "importance": 3, "wl": false, "topic": ""}], "competitor": [{"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도 정부가 국가 안보 우려를 이유로 기존에 설치된 중국산 통신 장비를 철거하고 교체하는 방안을 검토 중인 것으로 알려졌다. 이는 화웨이와 ZTE 등 중국산 통신 장비에 대한 글로벌 안보 제재 및 퇴출 흐름과 맥을 같이 한다. 인도의 이러한 움직임이 현실화될 경우 글로벌 통신 장비 시장의 판도와 에릭슨, 노키아, 삼성전자 등 비중국계 장비사들의 수혜 규모에 큰 영향을 미칠 전망이다. 인도 통신 시장의 장비 교체 수요는 향후 주요 경쟁사의 실적 변수로 작용할 수 있다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "화웨이 제재"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 드론 실시간 추적 등 차세대 통신 기술을 공개할 예정입니다. 한국 정부와 국내 통신사들을 상대로 자사의 기술력을 적극 알리고 협력 방안을 모색하겠다는 전략입니다. 고속 데이터를 처리하는 6G와 AI 기능이 ISAC(통신·레이더 융합)과 결합하여 기술 효율성을 극대화할 수 있다고 강조했습니다. 글로벌 장비사의 국내 시장 공략이 더욱 거세지고 있습니다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 드론추적"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨이 AI-RAN, ISAC, 차별화된 커넥티비티와 6G로 이어지는 차세대 기술 리더십과 청사진을 전격 공개했습니다. 에릭슨 코리아 대표는 AI 시대의 경쟁력이 네트워크에서 시작된다고 강조하며 한국 파트너들과의 협력을 다졌습니다. 글로벌 장비사들의 6G 및 AI 네트워크 기술 주도권 선점 경쟁이 본격화되었습니다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 6g청사진"}, {"title": "에릭슨코리아, AI 기반 통신망· 6G 기술 로드맵 공개", "summary": "에릭슨코리아가 'Ericsson Innovation Day 2026 Korea'를 개최하고 AI 활용 통신망 발전 전략과 6G 기술 로드맵을 발표했습니다. 국내 통신사와 산업계 관계자들이 대거 참석한 가운데 최신 5G 및 6G 진화 방향이 공유되었습니다. 글로벌 장비사의 국내 네트워크 시장 영향력 확대 전략을 보여줍니다.", "source": "biz.heraldcorp.com", "date": "2026-09-02 16:10", "url": "https://biz.heraldcorp.com/article/10860523?ref=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨코리아 6g로드맵"}, {"title": "에릭슨 코리아, ‘Ericsson Innovation Day 2026 Korea’ 개최…AI 시대 네...", "summary": "에릭슨이 MWC 2026에서 선보인 주요 기술과 국내 5G SA, AI 및 6G 기술 진화 방향을 공유하는 이노베이션 데이를 개최했습니다. 국내 파트너들과의 긴밀한 생태계 구축을 통해 차세대 통신 시장 선점을 노리고 있습니다. 글로벌 네트워크 장비 리더로서의 기술 리더십을 과시했습니다.", "source": "segye.com", "date": "2026-09-02 16:09", "url": "https://www.segye.com/newsView/20260902515277?OutUrl=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 이노베이션데이"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "에릭슨이 한 번의 전파 송출로 고속 데이터 전송과 주변 사물의 위치·속도 탐지를 동시에 처리하는 6G 통신 신기술을 선보였습니다. 통신용과 레이더용 주파수를 따로 할당할 필요 없이 하나의 기지국 및 단말기 장비로 두 기능을 수행할 수 있는 혁신 기술입니다. 주파수 효율성을 극대화하는 차세대 네트워크 표준 경쟁의 핵심으로 자리 잡을 전망입니다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 6g주파수공유"}, {"title": "[AI 고속도로] HPE, AI 서버·네트워킹 수요에 분기 최대 매출…공급 부족은 과제", "summary": "HPE가 AI 서버와 데이터센터 네트워킹 수요 확대로 2026 회계연도 3분기 매출이 34% 증가한 122억 달러를 기록하며 사상 최대 분기 매출을 달성했다. 기업들의 인프라 투자가 서버를 넘어 네트워크 장비로 본격 확산되고 있음을 보여준다. 다만 메모리 등 핵심 부품 공급 부족이 늘어나는 수요를 따라가지 못하는 과제가 남아 있다. AI 인프라 시장에서 네트워킹 장비 공급사들의 실적과 시장 동향을 보여주는 핵심 지표다.", "source": "ZDNet Korea", "date": "2026-09-03 13:30", "url": "https://zdnet.co.kr/view/?no=20260903132838", "category": "earnings", "importance": 4, "wl": true, "topic": "hpe 실적"}, {"title": "브로드컴 “AI칩 매출 3배↑”… 삼성 수혜 기대감 커진다", "summary": "브로드컴의 AI칩 매출이 3배 급증한 가운데 맞춤형 AI 가속기와 AI 네트워크 반도체 수요 확대가 삼성전자와의 협력 기대감으로 이어지고 있습니다. 글로벌 빅테크의 주문형 반도체 수요가 반도체 생태계 전반의 성장을 견인하고 있습니다. 네트워크 반도체 부문의 성장이 삼성전자의 파운드리 및 메모리 사업에도 긍정적인 영향을 미칠 것으로 전망됩니다.", "source": "dt.co.kr", "date": "2026-09-03 08:45", "url": "https://www.dt.co.kr/article/12081849?ref=naver", "category": "earnings", "importance": 4, "wl": false, "topic": "브로드컴 ai칩 실적"}, {"title": "\"외인 7조 던졌다\"...피멍 든 삼전·하이닉스, 브로드컴이 살릴까", "summary": "구글과 메타 등 글로벌 빅테크의 주문형 반도체와 데이터센터 네트워크 칩을 설계하는 브로드컴의 실적이 삼성전자와 SK하이닉스의 분위기 반전을 이끌지 주목됩니다. AI 인프라 투자 붐 속에서 네트워크 반도체와 메모리의 동반 성장이 기대됩니다. 글로벌 반도체 공급망의 핵심 축으로서 브로드컴의 영향력이 강조되고 있습니다.", "source": "fnnews.com", "date": "2026-09-03 06:40", "url": "https://www.fnnews.com/news/202609030614119048", "category": "earnings", "importance": 4, "wl": false, "topic": "브로드컴 ai네트워크칩"}, {"title": "싸게 팔던 중국기업의 반격…'특허' 무기로 삼성 ·글로벌 기업 흔든다", "summary": "중국 기업들이 강력한 특허 네트워크를 무기로 삼성전자와 LG전자 등 글로벌 선도 기업들을 거세게 압박하고 있습니다. 과거의 단순 추격자를 넘어 특허 기반의 신흥 강자로 부상하며 글로벌 공급망과 무역 전반에 지각변동을 일으키고 있습니다. 기술 패권을 쥐기 위한 글로벌 특허 경쟁이 더욱 격화될 전망입니다.", "source": "inews24.com", "date": "2026-09-03 06:01", "url": "http://www.inews24.com/view/2001233", "category": "competitor", "importance": 4, "wl": false, "topic": "중국기업 특허공격"}, {"title": "[CPU 대란 주의보 ③] \"1GW당 코어 4배 급증\"… 에이전트 AI가 부순 호스...", "summary": "인공지능(AI) 인프라 시장에서 에이전트 AI가 복잡한 태스크를 가속기에 분배하고 네트워크 트래픽을 DPU로 오프로딩하는 기술적 구조가 조명되었습니다. 엔비디아 GPU와 고대역폭메모리(HBM)를 뒷받침하는 고성능 네트워크 처리의 중요성이 커지고 있습니다. AI 시대의 폭증하는 트래픽을 처리하기 위한 차세대 네트워킹 기술 진화 방향을 보여줍니다.", "source": "ddaily.co.kr", "date": "2026-09-03 06:01", "url": "https://www.ddaily.co.kr/page/view/2026090111255746435", "category": "tech", "importance": 4, "wl": false, "topic": "에이전트ai 네트워크"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대학교와 함께 AI-RAN(인공지능 무선접속망) 네트워크 전환 기술 검증을 성공적으로 마쳤습니다. 로봇과 드론 등 피지컬 AI 장비가 시험망과 5G망을 오가는 환경에서 최적의 네트워크를 자동으로 선택하고 안정적으로 연결하는 성능을 입증했습니다. 차세대 6G 및 지능형 망 구축을 위한 핵심 기술 확보의 성과입니다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 4, "wl": false, "topic": "lg유플러스 ai-ran"}, {"title": "FIS stock gains on Ericsson wallet partnership and Q2 banking growth - AD HOC NEWS", "summary": "", "source": "AD HOC NEWS", "date": "2026-09-03 00:32", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/fis-stock-gains-on-ericsson-wallet-partnership-and-q2-banking-growth/70044743", "category": "policy", "importance": 4, "wl": false, "topic": ""}, {"title": "[ 6G 격전] ③보안에 사활...양자내성암호로 '리셋'", "summary": "6G 통신 시대를 맞아 보안의 중요성이 커지면서 양자내성암호(PQC)를 통한 보안 리셋이 핵심 과제로 부각되었습니다. LG전자 등 국내 주요 기업들이 AI 기반 6G 기술 및 PQC 선행 연구와 국제 표준화 협력을 추진하고 있습니다. 차세대 네트워크 표준 경쟁에서 보안 기술이 차지하는 비중이 급증하고 있습니다.", "source": "hansbiz.co.kr", "date": "2026-09-02 16:08", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=861636", "category": "tech", "importance": 4, "wl": false, "topic": "6g 양자내성암호"}, {"title": "Qualcomm stakes its claim on an AI-native 6G future - Mobile World Live", "summary": "퀄컴이 인공지능(AI)을 기본적으로 탑재한 AI 네이티브 6G 미래 청사진을 공개했습니다. 차세대 이동통신 표준에서 AI와의 융합이 핵심 경쟁력이 될 것임을 명확히 했습니다. 퀄컴은 모바일 칩셋을 넘어 통신 인프라 전반의 기술 주도권을 잡기 위한 R&D를 가속화하고 있습니다. 글로벌 장비사와 칩 메이커 간의 6G 주도권 경쟁이 한층 더 격화될 전망입니다.", "source": "Mobile World Live", "date": "2026-09-01 20:04", "url": "https://www.mobileworldlive.com/qualcomm-stakes-its-claim-on-an-ai-native-6g-future/", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g비전"}, {"title": "전북대 노예훈 박사과정생 학문후속세대 지원사업 선정.. ' 6G 전이중통신...", "summary": "전북대 연구팀이 6G 전이중 무선통신 시스템에 적용할 핵심 수신기 기술과 광대역 자기간섭 신호 억제 회로 구조를 연구해 확보했습니다. 수신기의 잡음과 선형성 성능 저하를 최소화하는 차세대 통신 원천 기술입니다. 향후 상용화될 6G 통신 장비의 성능을 좌우할 중요한 기술적 진전입니다.", "source": "veritas-a.com", "date": "2026-09-03 14:50", "url": "https://www.veritas-a.com/news/articleView.html?idxno=626092", "category": "tech", "importance": 3, "wl": false, "topic": "전북대 6g전이중통신"}, {"title": "알에프텍, RF 전문 자회사 ‘RFTC’ 출범… 5G ·방산 사업 확대", "summary": "알에프텍이 5G 통신 장비와 방산 분야 무선주파수(RF) 기술을 전담할 전문 자회사 ‘RFTC’를 출범하고 관련 사업 확장에 나섭니다. 기존 R&D 조직을 독립시켜 전문성을 높이고 급변하는 통신 및 방산 시장에 기민하게 대응할 계획입니다. 5G 장비 시장에서의 입지를 다지기 위한 전략적 조직 개편입니다.", "source": "edaily.co.kr", "date": "2026-09-03 14:44", "url": "https://www.edaily.co.kr/News/Read?newsId=04142646645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 rftc출범"}, {"title": "Nokia and BeeHealthy will replace texted codes in healthcare apps with silent phone checks", "summary": "", "source": "Stock Titan", "date": "2026-09-03 14:26", "url": "https://www.stocktitan.net/news/NOK/nokia-and-bee-healthy-bring-network-based-verification-to-digital-5p0m6ga7ntts.html", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "\"전문 혈압계 수준\"…화웨이, 혈압 측정 스마트워치 ‘워치 D3’ 공개", "summary": "화웨이가 전통적인 커프형 혈압계와 유사한 기계식 에어백 기술을 적용하여 정확도를 높인 혈압 측정 스마트워치 '화웨이 워치 D3'를 공개했다. 알고리즘에만 의존하던 기존 스마트워치와 달리 전문 기기 수준의 측정 기능을 제공하는 것이 특징이다. 경쟁사인 화웨이의 웨어러블 디바이스 및 헬스케어 기술력 강화 행보를 보여준다.", "source": "ZDNet Korea", "date": "2026-09-03 13:57", "url": "https://zdnet.co.kr/view/?no=20260903084818", "category": "tech", "importance": 3, "wl": true, "topic": "화웨이 스마트워치"}, {"title": "Huawei Unveils Watch D3 with Integrated Blood Pressure Monitoring - India News Network", "summary": "", "source": "India News Network", "date": "2026-09-03 13:56", "url": "https://www.indianewsnetwork.com/en/huawei-unveils-watch-d3-integrated-blood-pressure-monitoring-20260903", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 3, "wl": false, "topic": ""}, {"title": "Nokia set to rejoin Euro Stoxx 50, Volkswagen dropped - The Manila Times", "summary": "", "source": "The Manila Times", "date": "2026-09-03 07:23", "url": "https://www.manilatimes.net/2026/09/03/business/foreign-business/nokia-set-to-rejoin-euro-stoxx-50-volkswagen-dropped/2417546", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Ericsson powers Saudi Arabia’s next phase of digital transformation and innovation - Tahaw", "summary": "", "source": "TahawulTech.com", "date": "2026-09-03 07:04", "url": "https://www.tahawultech.com/home-slide/ericsson-powers-saudi-arabias-next-phase-of-digital-transformation-and-innovation/", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "엑시노스 탑재 늘렸지만… 삼성전자 , AP 비용 3년 전 대비 30%↑", "summary": "삼성전자가 AP(어플리케이션 프로세서) 비용 증가와 메모리 가격 부담으로 인해 DX부문의 실적 부진을 겪고 있습니다. 모바일경험(MX)과 네트워크(NW) 사업부를 아우르는 통합 부문의 수익성 개선이 시급한 과제로 대두되었습니다. 회사는 AX(AI 전환) 가속화를 통해 돌파구를 마련할 방침입니다.", "source": "news.mtn.co.kr", "date": "2026-09-03 06:04", "url": "https://news.mtn.co.kr/news-detail/2026090211184934341", "category": "earnings", "importance": 3, "wl": false, "topic": "삼성전자 ap비용"}, {"title": "Opinion: Huawei: They may rip out our networks, but they'll never take our patents! - Fier", "summary": "", "source": "Fierce Network", "date": "2026-09-03 03:01", "url": "https://www.fierce-network.com/modernization/opinion-huawei-they-may-rip-out-our-networks-theyll-never-take-our-patents", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "HUAWEI WATCH 6 - HUAWEI Global", "summary": "", "source": "HUAWEI Global", "date": "2026-09-02 23:32", "url": "https://consumer.huawei.com/en/wearables/watch-6/", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장을 위한 프라이빗 5G 배포 계획을 다시 추진하고 있으나 구체적인 주파수 할당 계획은 여전히 포함되지 않았다. 중국의 지속적인 프라이빗 5G 활성화 시도는 산업용 통신 시장의 변화를 예고하고 있다. 그러나 명확한 주파수 공급 방안 부재로 인해 실제 도입 효과에 대해서는 업계의 주시가 필요하다. 이는 글로벌 통신 장비 및 프라이빗 네트워크 시장의 경쟁 구도와 맞물려 있다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 5g"}, {"title": "Ericsson adaptive inventory", "summary": "에릭슨이 AI 및 자율 네트워크 시대의 요구에 대응하기 위해 에릭슨 어댑티브 인벤토리(EAI) 솔루션 프로필을 업데이트했다. 자율 운영 네트워크 환경에서 인벤토리 데이터의 중요성이 커짐에 따라 장비 및 소프트웨어 역량을 강화하고 있다. 통신 장비 경쟁사인 에릭슨의 최신 기술 전략을 보여준다.", "source": "RCR Wireless", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-Channel", "category": "tech", "importance": 3, "wl": true, "topic": "에릭슨 솔루션"}, {"title": "Nokia opens Saudi Arabia R&D centre - Mobile World Live", "summary": "", "source": "Mobile World Live", "date": "2026-09-02 21:07", "url": "https://www.mobileworldlive.com/nokia/nokia-opens-saudi-arabia-rd-centre/", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "노키아가 사우디아라비아에서 네트워크 자동화 기술을 개발하며 중동 시장 입지를 다지고 있다. 에릭슨은 FIS와의 협력을 통해 핀테크 제안을 강화하고 있다. EMEA 지역에서는 페어폰이 C라운드 투자 유치를 진행하는 등 통신·테크 기업들의 활동이 활발하다. 이러한 경쟁사들의 기술 개발 및 제약 확대는 글로벌 네트워크 장비 시장에서의 입지 싸움을 보여준다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "https://www.lightreading.com/smartphones-devices/eurobites-fairphone-opens-series-c-funding-round-after-happy-h1", "category": "contract", "importance": 3, "wl": true, "topic": "노키아 수주"}], "policy": [{"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "통신 3사가 세제·주파수·규제 개선을 요구하며 네트워크 및 AIDC(AI 데이터센터) 지원 확대의 필요성을 제기했습니다. 과기정통부 관계자는 투자환경 개선을 패키지로 추진하고 3G 종료 등 레거시망 개편도 민관협의체에서 논의하겠다고 화답했습니다. 차세대 5G·6G 투자 여력을 확보하기 위한 정책적 지원 방안이 본격적으로 다뤄지고 있습니다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 네트워크지원"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": ""}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "AI 트래픽이 5년 뒤 최대 5배 폭증할 것으로 예상됨에 따라 네트워크를 국가 AI 인프라로 육성해야 한다는 주장이 제기되었습니다. 5G SA, AI-RAN, 6G 투자에 대한 정부의 세제 지원과 함께 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토하겠다고 밝혔습니다. 차세대 통신망 확충을 위한 민관 협력이 가속화되고 있습니다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 ai인프라"}, {"title": "[헬로스톡] 9/2 주목할 종목 : 삼성전기·RFHIC·롯데렌탈·셀트리온제약", "summary": "미국 어퍼 C밴드 주파수 경매가 2027년 4월로 확정된 가운데 국내에서도 2026년 연말 5G SA(독립형 5G 네트워크) 도입이 예고되었습니다. NXP의 통신 사업 부문 철수 등 글로벌 장비·부품 생태계의 재편이 진행되고 있습니다. 미국의 대중국 장비 제재와 맞물려 통신 장비 시장의 판도가 출렁이고 있습니다.", "source": "hellot.net", "date": "2026-09-02 17:58", "url": "https://www.hellot.net/news/article.html?no=114725", "category": "policy", "importance": 4, "wl": false, "topic": "주파수경매 5g sa"}, {"title": "[현장] 통신업계 \"네트워크도 AI 인프라로 봐야\"…정책 지원 촉구", "summary": "국회 의원회관에서 열린 정책 토론회에서 통신업계는 네트워크를 국가 AI 인프라로 규정하고 정부의 적극적인 지원을 촉구했습니다. 기존 통신 수익만으로는 6G 등 차세대 네트워크에 대한 지속적인 투자를 감당하기 어렵다는 호소가 이어졌습니다. 여당 의원들과 과기정통부도 제도 개선의 필요성에 공감대를 형성했습니다.", "source": "newspost.kr", "date": "2026-09-02 16:42", "url": "https://www.newspost.kr/news/articleView.html?idxno=225400", "category": "policy", "importance": 4, "wl": false, "topic": "국회 네트워크포럼"}, {"title": "통신3사 \"AI망 지원\" 요구…정부, 세제·규제·AIDC 지원 추진(종합)", "summary": "정부가 5G SA에서 AI-RAN, 6G로 이어지는 네트워크 고도화를 지원하기 위해 세제, 주파수, AIDC 지원책을 추진합니다. 최근 출범한 'AI 시대 통신망 투자 촉진 민관협의체'를 통해 구체적인 실행 방안을 논의할 예정입니다. 통신사의 투자 인센티브 확대를 위한 정부의 정책적 드라이브가 본격화되었습니다.", "source": "news1.kr", "date": "2026-09-02 16:21", "url": "https://www.news1.kr/it-science/cc-newmedia/6277634", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 민관협의체"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신사들이 주파수 할당 대가와 전파사용료 등 규제 비용으로 연간 약 1조원을 부담하면서 6G 상용화와 AI 네트워크 투자에 재정적 압박을 받고 있습니다. 과도한 정책성 비용이 통신사의 투자 여력을 갉아먹는다는 지적입니다. AI 시대에 발맞춘 통신망 규제 혁신과 비용 부담 완화가 시급한 화두로 떠올랐습니다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 규제비용"}, {"title": "티빙, 2년 전 취약점 알고도 안 고쳤다…3954만개 계정 정보 유출", "summary": "과학기술정보 통신 부( 과기정통부 )는 3일 민관합동조사단의 티빙 침해사고 조사 결과를 발표했다. 조사단은 접속키 관리 부실과 과도한 접근 권한, 이상행위 감시체계 부재가 대규모 정보 유출로 이어졌다고...", "source": "peoplewatch.co.kr", "date": "2026-09-03 14:34", "url": "https://www.peoplewatch.co.kr/article/view/ppw202609030014", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "[ET톡] 6G 1등 국가의 조건", "summary": "과거 5G 세계 최초 상용화의 상흔을 교훈 삼아, 차세대 6G에서는 '세계 최초'보다 '최고 기술'을 갖춘 1등 국가가 되어야 한다는 정책적 제언이 나왔습니다. 기술과 산업 생태계 전반에서 실질적인 우위를 점하는 것이 핵심 목표입니다. 정부와 통신업계가 협력하여 장기적인 R&D와 인프라 투자를 준비해야 합니다.", "source": "etnews.com", "date": "2026-09-03 13:44", "url": "https://www.etnews.com/20260903000237", "category": "policy", "importance": 3, "wl": false, "topic": "6g 1등국가 전략"}, {"title": "DoT leaning toward 5% AGR-linked charge for satellite spectrum - Communications Today", "summary": "인도 통신부(DoT)가 위성 주파수 할당과 관련해 5%의 AGR 연계 수수료 부과를 검토하고 있습니다. 이는 위성통신 사업자들에게 새로운 재정적 부담으로 작용할 수 있어 업계의 이목이 집중되고 있습니다. 인도 정부는 급성장하는 위성 인터넷 시장의 질서를 잡고 공정한 과세 체계를 확립하려 합니다. 글로벌 위성 사업자들의 인도 시장 진입 전략에 적지 않은 영향 미칠 것입니다.", "source": "Communications Today", "date": "2026-09-03 11:49", "url": "https://www.communicationstoday.co.in/dot-leaning-toward-5-agr-linked-charge-for-satellite-spectrum/", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신부 위성주파수"}, {"title": "CHTR Stock Rises As Spectrum Bets On Scale And Prime - StocksToTrade", "summary": "", "source": "StocksToTrade", "date": "2026-09-03 04:03", "url": "https://stockstotrade.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "Satcom spectrum fee: DCC may soon decide airwave charges, allocation terms - economictimes", "summary": "인도 통신규제당국(DCC)이 위성통신 주파수 사용료와 할당 조건에 대한 결정을 곧 내릴 예정이다. 위성통신 및 관련 주파수 정책 변화는 글로벌 통신 시장에 영향을 미치는 요소이다. 인도 시장 내 위성통신 서비스 상용화와 직결되는 사안이다.", "source": "economictimes.indiatimes.com", "date": "2026-09-03 04:01", "url": "https://economictimes.indiatimes.com/industry/telecom/satcom-spectrum-fee-dcc-may-soon-decide-airwave-charges-allocation-terms/articleshow/133719014.cms", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신규제당국 위성통신 주파수 수수료 결정 임박"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "AI 국가 경쟁력을 확보하기 위해 3G 등 레거시 네트워크를 유지하면서 5G SA나 6G에 투자하는 것은 비효율적이므로 정부의 정책적 지원이 필요하다는 주장이 제기되었습니다. 과기정통부는 새로운 네트워크 투자 편익을 극대화하기 위한 방안을 검토 중입니다. 통신사의 투자 부담을 완화하고 차세대 망 전환을 유도하기 위한 논의가 이어지고 있습니다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 3, "wl": false, "topic": "ai네트워크 정부지원"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "AI 트래픽 폭증에 대응해 통신사들이 AI-RAN, 6G 등 차세대 네트워크 투자 확대 방안을 논의하며 기존 기지국 중심의 CAPEX 지표를 보완해야 한다고 목소리를 높였습니다. 개방형 시설에 대한 세제 혜택과 투자 인센티브 마련이 주요 과제로 꼽힙니다. 통신 인프라를 국가 AI 인프라로 재정의해야 한다는 업계의 요구가 커지고 있습니다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 capex 지표"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "망 투자는 늘어나는데 수익 창출은 정체된 상황에서 통신 3사가 AI 시대에 맞춘 정책 재설계를 촉구했습니다. 3G 레거시 망의 유지와 5G SA·6G 투자의 이중고를 해소하기 위해 3G 조기 종료 등 규제 완화가 필요하다는 지적입니다. 정부 역시 통신사의 새로운 네트워크 투자 여력을 높이기 위한 대책 마련에 고심하고 있습니다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 ai정책"}, {"title": "\"AI 시대, 트래픽 5배 증가…네트워크 지원 필요\"", "summary": "AI 시대 트래픽 폭증에 따라 초고속·초저지연 네트워크 구축을 위한 정부의 정책적 지원 필요성이 제기되었습니다. 글로벌 데이터 트래픽의 핵심인 해저케이블과 6G 지상망, 저궤도 위성망을 아우르는 통합 인프라 투자가 시급합니다. 통신사의 재정적 부담을 덜어주기 위한 인센티브 마련이 논의되고 있습니다.", "source": "news.bizwatch.co.kr", "date": "2026-09-02 17:28", "url": "https://news.bizwatch.co.kr/article/mobile/2026/09/02/0038", "category": "policy", "importance": 3, "wl": false, "topic": "ai시대 네트워크지원"}, {"title": "\"GPU만 쌓아선 AI 3강 못 간다…개방형 AIDC·네트워크 지원해야\"", "summary": "AI 3강 도약을 위해 GPU뿐만 아니라 개방형 AIDC와 5G·6G 네트워크 연결망에 대한 세제 및 투자 지원이 시급하다는 목소리가 나왔습니다. 현행 15%의 국가전략기술 사업화시설 세액공제 범위를 통신 인프라까지 확대해야 한다는 주장입니다. 레거시망 전환 비용을 포함한 종합적인 정책 패키지가 요구됩니다.", "source": "fnnews.com", "date": "2026-09-02 15:56", "url": "https://www.fnnews.com/news/202609021416214484", "category": "policy", "importance": 3, "wl": false, "topic": "aidc 네트워크세제지원"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계 전문가들이 과기정통부 관계자들과 함께 통신사의 AI 네트워크 및 데이터센터(DC) 투자비 지원 확대 방안을 논의했습니다. 6G 이동통신과 DC 연결망(DCI)에 대한 투자를 AI 인프라 투자로 간주하여 세제 혜택을 부여해야 한다는 의견이 모였습니다. 정부의 정책적 결단에 업계의 이목이 집중됩니다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 nw투자지원"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "통신사가 연간 약 8000억원의 주파수 할당 대가와 2000억원의 전파사용료를 부담하고 있는 가운데, 재할당 비용 절감과 AI 인프라 투자를 연계할 필요성이 제기되었습니다. 통신사들이 선제적으로 유·무선 네트워크를 확충할 수 있도록 정부가 투자 인센티브를 마련해야 한다는 목소리가 커지고 있습니다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 3, "wl": false, "topic": "통신망 투자유인"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "AI 3대 강국 도약을 위해 주파수 할당 대가와 전파사용료 등 정책성 비용의 부담을 낮춰 실제 투자 확대로 이어져야 한다는 제언이 나왔습니다. AIDC 투자를 끌어내기 위해 시행령부터 정교하게 다듬어야 한다는 학계의 지적입니다. 민간 투자를 유인하기 위한 규제 혁신 방안이 다방면으로 모색되고 있습니다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 3, "wl": false, "topic": "ai인프라 민간투자"}, {"title": "[4th-AI] \"AI 3대 강국 가려면 통신망 규제 풀고 AIDC 지원 체계 손봐야\"", "summary": "AI 시대 국가 경쟁력 강화를 위해 통신망 관련 규제를 풀고 AIDC 지원 체계를 전면 손봐야 한다는 주장이 제기되었습니다. 연간 수천억 원에 달하는 전파사용료 등 통신사 부담 비용을 투자 여력과 연계해 재검토해야 한다는 의견입니다. 망 투자 촉진을 위한 정부의 과감한 규제 혁신이 요구됩니다.", "source": "4th.kr", "date": "2026-09-02 12:24", "url": "http://www.4th.kr/news/articleView.html?idxno=2117312", "category": "policy", "importance": 3, "wl": false, "topic": "통신망 규제완화"}, {"title": "AI가 네트워크를 바꾼다…\"통신망 투자 수익성 확보해야\"", "summary": "AI 시대에 필수적인 유·무선 네트워크를 통신사들이 선제적으로 확충할 수 있도록 투자세액공제 확대와 주파수 할당 대가 완화 등 인센티브를 마련해야 한다는 제안이 나왔습니다. 네트워크 투자 수익성을 확보해야만 국가 차원의 AI 인프라 경쟁력이 뒷받침될 수 있습니다.", "source": "koit.co.kr", "date": "2026-09-02 11:18", "url": "https://www.koit.co.kr/news/articleView.html?idxno=208798", "category": "policy", "importance": 3, "wl": false, "topic": "ai 네트워크 투자"}, {"title": "스테이지파이브, 로플랫 인수…제4이통 대신 ‘AI 통신’으로 승부", "summary": "제4이통사 무산 이후 주파수 할당 대상 법인 선정이 취소된 스테이지파이브가 로플랫을 인수하며 알뜰폰 기반 'AI 통신'으로 사업 방향을 선회했습니다. 신규 이동통신 사업 진입이 좌절된 후 대안적인 비즈니스 모델을 모 opic": "에스케이텔레콤 정부 보안 인공지능 사업 탈락"}, {"title": "LG·보안업계 뭉친 연합군 통했다…네이버, SKT 꺾고 `K-미토스` 개발 (종합) - 디지털데일리", "summary": "네이버 등 보안업계 연합 컨소시엄이 SK텔레콤 컨소시엄을 제치고 정부 주도의 보안 특화 AI 모델 ‘K-미토스’ 개발 사업자로 최종 선정되었다. AI 공공 사업 수주전의 결과이다.", "source": "디지털데일리", "date": "2026-09-03 10:16", "url": "https://www.ddaily.co.kr/page/view/2026090310122915637", "category": "contract", "importance": 4, "wl": false, "topic": "네이버 에스케이텔레콤 제치고 보안 인공지능 개발 사업 선정"}, {"title": "정부 ‘보안 특화 AI’ 개발 사업자로 네이버 컨소시엄 선정 - 동아일보", "summary": "정부의 보안 특화 AI 모델 개발 사업 최종 사업자로 네이버 컨소시엄이 선정되었다. SK텔레콤 등 경쟁 컨소시엄과의 수주 경쟁 결과이다.", "source": "동아일보", "date": "2026-09-03 09:48", "url": "https://www.donga.com/news/Economy/article/all/20260903/134596717/1", "category": "contract", "importance": 4, "wl": false, "topic": "정부 보안 특화 인공지능 개발 사업자 네이버 컨소시엄 선정"}, {"title": "[속보] 정부, 보안 특화 AI모델 사업자로 네이버 선정 … SKT 탈락 - 뉴데일리", "summary": "정부 보안 특화 인공지능 모델 개발 사업의 최종 사업자로 네이버가 선정되었으며, SK텔레콤은 최종 탈락했다. 정부 공공 AI 사업 수주전의 주요 결과이다.", "source": "뉴데일리", "date": "2026-09-03 09:43", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/03/2026090300066.html", "category": "contract", "importance": 4, "wl": false, "topic": "정부 보안 특화 인공지능 모델 사업자 네이버 선정 에스케이텔레콤 탈락"}, {"title": "Deutsche Telekom Announces Management Changes Across Finance and Technology - The Fast Mod", "summary": "도이치텔레콤이 재무 및 기술 부문에 걸쳐 대대적인 경영진 변경을 단행했다. 주요 통신사의 최고경영진 및 임원진 교체는 전반적인 네트워크 투자와 장비 조달 전략에 영향을 미칠 수 있다.", "source": "The Fast Mode", "date": "2026-09-03 09:00", "url": "https://www.thefastmode.com/leadership-and-management/50460-deutsche-telekom-announces-management-changes-across-finance-and-technology", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 재무 및 기술 부문 경영진 교체"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - Barron's", "summary": "엘리엇의 도이치텔레콤 합병 반대 소식에 힘입어 티모바일의 주가가 상승세를 보였다. 통신사 간 인수합병 및 지배구조 이슈에 대한 시장 반응을 다룬다.", "source": "Barron's", "date": "2026-09-03 06:18", "url": "https://www.barrons.com/articles/t-mobile-  일렉 최고재무책임자(CFO)가 2027년 4월에 회사를 떠날 예정이라고 밝혔다. 핵심 재무 임원의 퇴임 예고로 경영 전반에 변화가 예상된다.", "source": "TradingView", "date": "2026-09-02 19:37", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_FWN44T17M:0-deutsche-telekom-cfo-christian-illek-to-leave-company-in-april-2027/", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 최고재무책임자 크리스티안 일렉 사임 예정"}, {"title": "AT&T goes to the mat over Charter's use of 'fiber-powered' label for HFC", "summary": "AT&T가 차터 커뮤니케이션즈를 상대로 HFC 네트워크 기반의 초고속 인터넷 서비스에 '파이버 프리미엄' 또는 '파이버 기반'이라는 표현을 사용하는 것이 허위 광고라며 소송을 제기했다. 이번 법적 공방은 통신사 간 마케팅 용어와 네트워크 기술 정체성을 둘러싼 갈등을 보여준다. 광고 규제 기관의 판정 이후 제기된 소송으로 향후 브로드밴드 시장 경쟁에 파장을 미칠 전망이다. 통신 서비스의 기술적 본질을 가리키는 용어 사용을 두고 업계 관심이 집중되고 있다.", "source": "Light Reading", "date": "2026-09-02 00:55", "url": "https://www.lightreading.com/broadband/at-t-goes-to-the-mat-over-charter-s-use-of-fiber-powered-label-for-hfc", "category": "policy", "importance": 4, "wl": true, "topic": "at&t 소송"}, {"title": "“AI에 고품질 데이터 입힌다”…KT, ‘에이전틱 데이터 플로우’ 구축 - 아시아투데이", "summary": "KT가 고품질 데이터에 기반하여 AI가 스스로 업무를 수행할 수 있는 ‘에이전틱 데이터 플로우’ 체계를 사내에 구축했다.", "source": "아시아투데이", "date": "2026-09-03 14:50", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20260903010001412", "category": "contract", "importance": 3, "wl": false, "topic": "케이티 에이전틱 데이터 플로우 구축"}, {"title": "국내외 통신사 CAPEX 절감 및 인프라 투자 정체… 통신 장비 테마 약세 흐...", "summary": "국내외 통신사들의 CAPEX(설비투자) 절감과 인프라 투자 정체로 인해 통신 장비 테마가 전반적인 약세 흐름을 보이고 있습니다. 단순한 5G 망 구축을 넘어 데이터센터, 광통신, 위성통신 등 새로운 성장 분야에서의 실제 수주와 매출 확보가 중요해졌습니다. 장비사들의 포트폴리오 다변화가 생존의 필수 조건으로 부각되고 있습니다.", "source": "pinpointnews.co.kr", "date": "2026-09-03 14:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=483544", "category": "other", "importance": 3, "wl": false, "topic": "통신사 capex절감"}, {"title": "정재헌 SKT CEO \"AI 시대, 통찰·공감 갖춰야\"…기술 넘어 사람에 초점 - 데일리팝", "summary": "정재헌 SKT CEO가 AI 시대에는 기술을 넘어 사람에 대한 초점과 통찰이 필요하다고 강조했다. 통신사 최고경영자의 경영 철학 및 비전 관련 소식이다.", "source": "데일리팝", "date": "2026-09-03 14:12", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102209", "category": "exec", "importance": 3, "wl": false, "topic": "정재헌 에스케이텔레콤 최고경영자 인공지능 시대 통찰 강조"}, {"title": "울산시, 오는 10월부터 시내버스 전 차량에 차세대 '와이파이 7' 도입", "summary": "울산시가 오는 10월부터 시내버스 전 차량에 차세대 ‘와이파이 7’ 장비를 도입합니다. 노후 장비를 전면 철거하고 5G 백홀 기반의 단일화된 최신 통신 시스템을 구축하여 실시간 장애 대응 효율성을 높입니다. 대중교통 이용객들에게 초고속 무선 인터넷 환경을 제공하는 스마트 시티 인프라 사업의 일환입니다.", "source": "pointe.co.kr", "date": "2026-09-03 14:12", "url": "https://www.pointe.co.kr/news/articleView.html?idxno=84255", "category": "contract", "importance": 3, "wl": false, "topic": "울산시 와이파이7"}, {"title": "LS일렉, KT클라우드와 '맞손'…AI DC 인프라 구축 - 매일일보", "summary": "LS일렉트릭이 KT클라우드와 손잡고 AI 데이터센터(DC) 인프라 시장 공략을 위한 협력을 체결했다.", "source": "매일일보", "date": "2026-09-03 14:11", "url": "https://www.m-i.kr/news/articleView.html?idxno=1409535", "category": "contract", "importance": 3, "wl": false, "topic": "엘에스일렉트릭 케이티클라우드 인공지능 데이터센터 인프라 구축 협력"}, {"title": "사우디 휴메인과 어플라이드 인튜이션, 자율주행 트럭을 시작으로 사우디 전역에 피지컬 AI 도입을 위한 전략적 파트너십 발표", "summary": "사우디 휴메인과 어플라이드 인튜이션이 자율주행 트럭 네트워크를 시작으로 로보택시, 항만, 제조업 등 국가 전역에 피지컬 AI를 도입하기 위한 전략적 파트너십을 체결했다. 2030년까지 사우디아라비아의 국가 단위 통합 자율주행 물류 네트워크를 구축하는 대형 프로젝트다. 중동 지역의 스마트 인프라 및 자율주행 물류 혁신을 위한 핵심 협력 사례다.", "source": "ZDNet Korea", "date": "2026-09-03 14:10", "url": "https://zdnet.co.kr/view/?no=20260903141002", "category": "contract", "importance": 3, "wl": true, "topic": "사우디 휴메인"}, {"title": "\"이해도·신뢰성 높인 AI 에이전트\"···KT, 데이터 활용 체계 구축 - 뉴스웨이", "summary": "KT가 전사 데이터 활용 체계를 고도화하여 신뢰성과 이해도가 높은 AI 에이전트 업무 환경을 구현했다.", "source": "뉴스웨이", "date": "2026-09-03 14:05", "url": "https://www.newsway.co.kr/news/view?ud=2026090312335343586", "category": "contract", "importance": 3, "wl": false, "topic": "케이티 이해도와 신뢰성 높은 인공지능 에이전트 구축"}, {"title": "kt cloud-LS일렉트릭, AI 데이터센터 전력 인프라 협력 - sentv.co.kr", "summary": "KT클라우드와 LS일렉트릭이 AI 데이터센터 사업 경쟁력 강화를 위해 전력 인프라 구축 협약을 체결했다.", "source": "sentv.co.kr", "date": "2026-09-03 14:01", "url": "https://www.sentv.co.kr/article/view/s   ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
