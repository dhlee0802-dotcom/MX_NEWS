<style>

  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}

  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}

  .art-src{font-size:11px;color:var(--low);margin-top:4px}

  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

</style>

lite": [{"title": "한화-KAI, 초소형위성서 '1.4조 맞대결'…'중복사업' 역할조정 가늠자", "summary": "한화시스템과 KAI가 초소형 위성 및 6G 저궤도 통신위성 사업 등에서 1.4조 원 규모의 맞대결을 벌이며 우주사업 역량을 적극 알리고 있다. 국내 우주항공 및 저궤도 위성통신 분야의 대형 투자와 주도권 경쟁이 본격화되는 양상이다. 국가 차원의 우주 통신 인프라 구축과 방산·위성 시너지가 주목된다.", "source": "asiatoday.co.kr", "date": "2026-09-07 17:14", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20260907010002509", "category": "contract", "importance": 4, "wl": false, "topic": "한화시스템 위성"}, {"title": "韓 6G 비전 공개 석달 앞으로…AI 인프라 생태계 중심 선언", "summary": "한국의 6G 비전 공개를 앞두고 삼성전자, LG전자 등 국내 기업과 에릭슨, 노키아, 화웨이 등 글로벌 장비사가 총출동할 예정인 '모바일 코리아 2026' 콘퍼런스가 개최된다. 6G와 AI 네트워크 관련 최신 기술과 전략이 논의되는 핵심 장이다. 차세대 통신 표준화와 산업계 동향을 파악할 수 있는 중요 행사다.", "source": "etnews.com", "date": "2026-09-07 15:15", "url": "https://www.etnews.com/20260907000374", "category": "tech", "importance": 4, "wl": false, "topic": "과학기술정보통신부 6g"}, {"title": "Japan's $1 Billion BlueBird Deal Positions AST SpaceMobile (NASDAQ: ASTS) As The Global Sa", "summary": "일본의 10억 달러 규모 블루버드(BlueBird) 계약이 AST 스페이스모바일을 글로벌 위성 통신 강자로 포지셔닝하게 만들었다. 저궤도 위성 통신 분야의 대형 계약으로 업계 구도에 큰 영향을 미친다.", "source": "foreignpolicyjournal.com", "date": "2026-09-07 08:57", "url": "https://www.foreignpolicyjournal.com/2026/09/06/japans-1-billion-bluebird-deal-positions-ast-spacemobile-nasdaq-asts-as-the-global-satellite-infrastructure-layer/", "category": "contract", "importance": 4, "wl": false, "topic": "ast스페이스모바일 수주"}, {"title": "中, 2030년까지 성능 선도하는 신세대 통신망 전면 구축 계획 - 国际在线", "summary": "중국이 2030년까지 성능을 선도하는 신세대 통신망을 전면 구축할 계획을 밝혔다. 국가 주도의 강력한 인프라 투자를 통해 차세대 통신 패권을 잡겠다는 의도다. 글로벌 통신장비 시장과 기술 표준화 경쟁에 지대한 영향을 미칠 전망이다. 주요 경쟁사들의 중국 시장 전략에 수정이 불가피할 것으로 보인다.", "source": "国际在线", "date": "2026-09-07 03:02", "url": "https://korean.cri.cn/2026/09/07/ARTI1788771734397958", "category": "tech", "importance": 4, "wl": false, "topic": "중국공업정보화부 통신망"}, {"title": "ASTS Stock Eyes Comeback After 4-Week Slide: Japan Filing Confirms Rakuten-Led Pick For Ne", "summary": "일본의 규제 서류를 통해 라쿠텐 주도의 네트워크 파트너 선정 사실이 확인되면서 AST 스페이스모바일의 주가 반등 기대감이 커지고 있다. 위성 통신사의 글로벌 통신사 협력 및 시장 진출 성과다.", "source": "Stocktwits", "date": "2026-09-07 00:39", "url": "https://stocktwits.com/news-articles/markets/equity/asts-japan-rakuten-1b-push-spacex-rival/cZmdDamR70H", "category": "contract", "importance": 4, "wl": false, "topic": "ast스페이스모바일 위성통신"}, {"title": "A Historic Deal Between Apple and Amazon to Boost Satellite Services on the iPhone - آي-فو", "summary": "애플과 아마존이 아이폰의 위성 서비스 강화를 위한 역사적 거래를 체결했다. 빅테크 기업 간 위성 통신 서비스 제휴로 모바일 위성통신 생태계에 큰 파장을 미친다.", "source": "آي-فون إسلام", "date": "2026-09-06 17:46", "url": "https://iphoneislam.com/language/en/2026/04/a-historic-deal-between-apple-and-amazon-to-boost-satellite-services-on-the-iphone/165317", "category": "contract", "importance": 4, "wl": false, "topic": "애플 위성통신"}, {"title": "Private German rocket makes history, reaches orbit from European soil - Space", "summary": "독일 민간 로켓이 유럽 본토 발사장으로부터 궤도 진입에 성공하며 역사적인 기록을 세웠다. 유럽의 우주 발사체 역량 강화와 위성 인프라 생태계에 중요한 이정표다.", "source": "Space", "date": "2026-09-06 05:51", "url": "https://www.space.com/space-exploration/launches-spacecraft/isar-aerospace-second-launch-norway-andoya-spaceport-spectrum-rocket", "category": "tech", "importance": 4, "wl": false, "topic": "이사르애어로스페이스 로켓"}, {"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 AI 네이티브 네트워크를 기반으로 통신 밸류체인을 재편할 6G의 세 가지 축을 공개했다. 인공지능을 통신 설계 단계부터 내장하여 네트워크 성능과 효율을 극대화하는 전략이다. 차세대 무선 통신 표준과 칩셋 시장에서 주도권을 잡기 위한 기술적 비전을 제시했다. 글로벌 통신 장비 및 반도체 생태계 전반에 큰 파장을 일으킬 것으로 보인다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g"}, {"title": "\"태평양 넘어 뉴욕 맨해튼 30분 거리로\"…유나이티드항공, 인천~뉴어크...", "summary": "또 초고속 기내 Wi-Fi 서비스인 스타링크 (Starlink)가 순차 도입되어 비행 중에도 라이브 스트리밍과 실시간 업무 처리가 가능해진다. 향후 적용될 '유나이티드 엘리베이티드' 인테리어 기체에는 27인치 4K OLED 모니터와...", "source": "bizwnews.com", "date": "2026-09-07 20:28", "url": "http://www.bizwnews.com/news/articleView.html?idxno=145513", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "에델웨이 \"SAR 핵심 전장품 첫 첨단기술·제품 확인\"", "summary": "우주·방산 및 AI 전문기업 에델웨이가 위성에 사용되는 합성개구레이더(SAR) 핵심 전장품 디지털 컨트롤 유닛(DCU) 기술로 산업통상자원부 첨단기술·제품 확인서를 받았다. 위성 탑재체 관련 기술력 입증 소식이다.", "source": "ZDNet Korea", "date": "2026-09-07 19:14", "url": "https://zdnet.co.kr/view/?no=20260907191407", "category": "tech", "importance": 3, "wl": true, "topic": "에델웨이 위성 전장품"}, {"title": "Asia-Pacific faces new spectrum challenge as 6G, satellite services advance - The Business", "summary": "아시아태평양 지역이 6G와 위성서비스의 진전에 따라 새로운 주파수 과제에 직면했다. 차세대 통신망 전환을 위한 주파수 확보와 효율적 운용 방안이 논의되고 있다. 위성통신과 지상 6G의 연계 과정에서 규제와 기술적 조율이 요구된다. 지역 내 통신 인프라 고도화에 중요한 영향을 미칠 전망이다.", "source": "The Business Standard", "date": "2026-09-07 19:05", "url": "https://www.tbsnews.net/bangladesh/asia-pacific-faces-new-spectrum-challenge-6g-satellite-services-advance-1535721", "category": "tech", "importance": 3, "wl": false, "topic": "아시아태평양 6g"}, {"title": "Jio’s first decade: 524 million users, 240 EB data and a home-grown 6G blueprint - Mathrub", "summary": "인도 릴라이언스 지오가 출범 10주년을 맞아 5억 2400만 명의 가입자와 대규모 데이터 트래픽 처리 실적을 공개하고 자체 6G 청사진을 제시했다. 인도 통신 시장의 급격한 성장을 보여주며 향후 차세대 네트워크 기술 개발 방향을 시사한다.", "source": "Mathrubhumi English", "date": "2026-09-07 18:50", "url": "https://english.mathrubhumi.com/news/money/jio-10-years-524-million-users-6g-blueprint-2030-of3yewr1", "category": "tech", "importance": 3, "wl": false, "topic": "릴라이언스지오 6g 전략"}, {"title": "SpaceX petitions FCC to block ViaSat-3 F2 satellite, citing interference concerns - Data C", "summary": "스페이스X가 비아셋(ViaSat-3 F2) 위성의 간섭 우려를 제기하며 FCC에 차단 청원을 제출했다. 위성 통신 사업자 간 주파수 및 간섭 규제 갈등을 다룬다.", "source": "Data Center Dynamics", "date": "2026-09-07 18:31", "url": "https://www.datacenterdynamics.com/en/news/spacex-petitions-fcc-to-block-viasat-3-f2-satellite-citing-interference-concerns/", "category": "policy", "importan ract", "importance": 4, "wl": false, "topic": "빛과전자 6g광부품"}, {"title": "India Plans Phased Removal of Chinese Equipment from Telecommunications Networks - Zamin.u", "summary": "인도가 통신망에서 중국산 장비를 단계적으로 철수할 계획을 수립하고 있습니다. 국가 안보 및 공급망 재편 차원에서 추진되는 조치입니다. 글로벌 장비사들의 인도 시장 점유율 경쟁에 큰 변수가 될 전망입니다.", "source": "Zamin.uz", "date": "2026-09-07 15:22", "url": "https://zamin.uz/en/technology/220473-india-plans-phased-removal-of-chinese-equipment-from-telecommunications-networks.html", "category": "policy", "importance": 4, "wl": false, "topic": "인도정부 화웨이 장비 철수"}, {"title": "Was Huawei’s rise built on crime? A US jury will decide", "summary": "화웨이의 과거 성장 과정의 적법성을 다루는 미국 배심원 재판이 시작될 예정이다. 캐나다에서 멍완주 부회장이 석방된 지 5년 만에 화웨이 본사가 직접 법적 심판대에 오른다. 글로벌 통신장비 경쟁사의 규제 및 법적 리스크를 보여주는 주요 사안이다.", "source": "Financial Times Tech", "date": "2026-09-06 21:00", "url": "https://www.ft.com/content/9422805f-519c-4b22-839c-cbd7a6464f07?syn-25a6b1a6=1", "category": "policy", "importance": 4, "wl": true, "topic": "화웨이 사법 리스크"}, {"title": "PTA approves Ufone-Telenor Merger: Reshaping Telecom Landscape - TechJuice", "summary": "파키스탄 통신청(PTA)이 우폰과 텔레노어의 합병을 최종 승인했다. 이번 합병으로 현지 통신 시장의 지형도가 크게 재편될 전망이다. 통신사 간 통합에 따른 네트워크 인프라 통합과 장비 재조달 수요가 발생할 수 있다. 글로벌 장비사들의 현지 영업 전략에 변화가 요구된다.", "source": "TechJuice", "date": "2026-09-06 18:54", "url": "https://www.techjuice.pk/pta-approves-ufone-telenor-merger-reshaping-telecom-landscape/", "category": "contract", "importance": 4, "wl": false, "topic": "파키스탄통신청 우폰"}, {"title": "빛과전자, 과기부 '광통신 부품 상용화' 수행기관 최종선정", "summary": "빛과전자가 과기부 지원 사업을 통해 AI 데이터센터와 6G 네트워크 확산에 대응하는 차세대 프론트홀 광통신 부품 국산화를 추진한다. 한양대학교 등과 협력하여 기술 자립도를 높이고 글로벌 공급망 진입을 노린다. 차세대 네트워크 부품 시장에서의 경쟁력 확보가 기대된다.", "source": "bloter.net", "date": "2026-09-07 19:38", "url": "https://www.bloter.net/news/articleView.html?idxno=673002", "category": "tech", "importance": 3, "wl": false, "topic": "빛과전자 광통신부품"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - sdxcentral.", "summary": 가 제15차 5개년 계획을 통해 2030년까지 차세대 통신망을 전면 구축하겠다는 목표를 발표했다. 고성능 통신 인프라 확충과 기술 표준 선도를 국가 차원에서 추진한다. 글로벌 통신장비 및 네트워크 생태계에 미치는 파급효과가 클 것으로 예상된다. 향후 중국 시장을 둘러싼 글로벌 장비사들의 전략 수립에 중요한 지표가 된다.", "source": "finance.biggo.com", "date": "2026-09-07 16:56", "url": "https://finance.biggo.com/news/c06e0cf7-cf84-447c-adea-297ca2346213", "category": "policy", "importance": 4, "wl": false, "topic": "중국공업정보화부 5차5개년계획"}, {"title": "\"AI 자립 외치더니 안마당 내주나\"… 공공 클라우드 빗장 완화에 '역차별...", "summary": "국정원과 과기정통부의 클라우드 보안인증(CSAP) 및 공공 클라우드 빗장 완화를 두고 역차별 논란이 제기됐다. 해외 클라우드 서비스에서 장애가 발생할 경우 책임 소재와 정부의 통제력 부족 우려가 쟁점으로 떠오르고 있다. 공공 클라우드 및 인프라 보안 정책에 중대한 영향을 미치는 사안이다.", "source": "newsis.com", "date": "2026-09-07 16:47", "url": "https://www.newsis.com/view/NISX20260907_0003779224", "category": "policy", "importance": 4, "wl": false, "topic": "국가정보원 클라우드"}, {"title": "테이텀 시큐리티, ‘사이버 보안 특화 AI’ 개발 참여", "summary": "테이텀시큐리티가 과기정통부 산하 NIPA가 추진하는 사이버 보안 특화 AI 파운데이션 모델 개발 사업에 네이버클라우드 컨소시엄 일원으로 참여한다. 인공지능 기반의 보안 기술 역량을 강화하기 위한 정부 지원 사업이다.", "source": "zdnet.co.kr", "date": "2026-09-07 20:35", "url": "https://zdnet.co.kr/view/?no=20260907203426", "category": "tech", "importance": 3, "wl": false, "topic": "테이텀시큐리티 사이버보안"}, {"title": "The EU’s digital rulebook has reached a turning point - PubAffairs Bruxelles", "summary": "유럽연합(EU)의 디지털 규제 체계가 중요한 전환점에 도달했다. 빅테크 및 통신 관련 규제의 실효성과 방향성을 두고 논의가 이어지고 있다. 유럽 시장에서 활동하는 글로벌 통신 및 IT 기업들의 준법 전략에 영향을 미칠 사안이다.", "source": "PubAffairs Bruxelles", "date": "2026-09-07 20:02", "url": "https://www.pubaffairsbruxelles.eu/opinion-analysis/the-eus-digital-rulebook-has-reached-a-turning-point/", "category": "policy", "importance": 3, "wl": false, "topic": "유럽연합 디지털"}, {"title": "GSMA calls for clarity on upper 6 GHz policies to drive cellular investment - Telecompaper", "summary": "GSMA가 셀룰러 투자를 촉진하기 위해 상위 6GHz 주파수 정책의 명확화를 촉구했습니다. 글로벌 무선 통신 주파수 분배와 관련된 규제 당국의 결정을 요구하는 내용입니다.", "source": "Telecompaper", "date": "2026-09-07 19:13", "url": "https://www.telecompaper.com/news/gsma-calls-for-clarity-on-upper-6-ghz-policies-to-drive-cellular-investment--1581900", "category": "policy", "importance": 3, "wl": false, "topic": "gsma 6ghz 정책"}, {"title": "정부, ‘AI 안경 안전 이용’ 가이드라인 마련 돌입", "summary": "과기정통부가 AI 글라스 사용 환경 조성을 위한 산업 활성화 방안 및 안전 이용 가이드라인 마련에 착수했다. 의료, 제조, 교육 등 다양한 산업 현장에 AI 글라스가 도입됨에 따라 부작용을 방지하고 제도를 정비하기 위한 목적이다.", "source": "news.kbs.co.kr", "date": "2026-09-07 19:08", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8656709&ref=A", "category": "policy", "importance": 3, "wl": false, "topic": "과학기술정보통신부 ai안경"}, {"title": "충남대, 과기정통부 'AI최고급신진연구자지원 사업' 선정… 110억 원 확...", "summary": "충남대가 과기정통부와 IITP가 주관하는 AI 최고급 신진연구자 지원 사업 주관기관으로 선정되어 피지컬 AI 원천기술 개발에 나선다. 차세대 인공지능 분야의 연구 인재 양성과 원천기술 확보를 위한 정부 지원이다.", "source": "daily.hankooki.com", "date": "2026-09-07 18:46", "url": "https://daily.hankooki.com/news/articleView.html?idxno=1403538", "category": "tech", "importance": 3, "wl": false, "topic": "충남대학교 ai신진연구자"}, {"title": "VodafoneThree network chief calls for planning reform to unlock £11bn investment - Mobile ", "summary": "영국 보다폰과 스리의 합병 법인 네트워크 책임자가 110억 파운드 규모의 투자를 촉진하기 위해 계획 허가 제도 개혁을 촉구했다. 통신 인프라 투자를 위한 규제 완화 요구를 담고 있다.", "source": "Mobile Europe", "date": "2026-09-07 17:57", "url": "https://www.mobileeurope.co.uk/vodafonethree-andrea-dona-uk/", "category": "policy", "importance": 3, "wl": false, "topic": "보다폰쓰리 규제"}, {"title": "Reliance Jio and GSMA nudge TRAI for Net Neutrality violating Network Slicing - MediaNama", "summary": "릴라이언스 지오와 GSMA가 망중립성 원칙을 위반할 소지가 있는 네트워크 슬라이싱 도입을 규제 당국에 촉구하고 있습니다. 통신 정책 및 공정 경쟁을 둘러싼 이해관계 충돌을 다룹니다.", "source": "MediaNama", "date": "2026-09-07 17:10", "url": "https://www.medianama.com/2026/09/223-jio-gsma-network-slicing-net-neutrality/", "category": "policy", "importance": 3, "wl": false, "topic": "인도통신규제당국 망중립성"}, {"title": "Telecom operators oppose TRAI’s proposed QoS rules for5G network slicing - tele.net.in", "summary": "인도 통신사업자들이 TRAI가 제안한 5G 네트워크 슬라이싱 품질 규정 준수에 반대 목소리를 내고 있습니다. 상용망 운영 자율성을 확보하기 위한 통신사들의 정책 대응입니다.", "source": "tele.net.in", "date": "2026-09-07 14:19", "url": "https://tele.net.in/national-news/telecom-operators-oppose-trais-proposed-qos-rules-for5g-network-slicing-12501360", "category": "policy", "importance": 3, "wl": false, "topic": "인도통신규제당국 5g슬라이싱"}, {"title": "Satellite internet’s regulatory battle - Dawn", "summary": "위성 인터넷 서비스 확산에 따른 글로벌 규제 전장의 양상을 분석한 보도다. 저궤도 위성 통신을 둘러싼 각국 규제 기관의 정책적 대응을 다룬다.", "source": "Dawn", "date": "2026-09-07 08:30", "url": "https://www.dawn.com/news/2027983", "category": "policy", "importance": 3, "wl": false, "topic": "위성통신 규제"}, {"title": "Communications Minister Jyotiraditya Scindia releases revised TDIP guidelines to boost tel", "summary": "인도 통신부가 통신 인프라 투자를 촉진하기 위해 개정된 TDIP 가이드라인을 발표했다. 통신사들의 네트워크 투자 부담을 완화하고 서비스 품질을 개선하기 위한 조치다. 인도 내 통신망 확대와 디지털 전환 속도가 빨라질 것으로 기대된다. 현지 진출한 장비사들에게 새로운 사업 기회를 제공할 수 있다.", "source": "News On AIR", "date": "2026-09-06 22:10", "url": "https://newsonair.gov.in/communications-minister-jyotiraditya-scindia-releases-revised-tdip-guidelines-to-boost-telecom-sector/", "category": "policy", "importance": 3, "wl": false, "topic": "인도통신부 tdip"}, {"title": "\"AI 공장장 모셔볼까?\"…정부, '중소기업 맞춤형' 피지컬 AI 전격 지원", "summary": "과기정통부 ·중기부, 중소 제조기업 피지컬 AI 협력 나선다 피지컬 AI로 제조 현장 혁신…단계별 도입부터 R&D까지 전방위 지원 7일 오후 KAIST를 찾은 류제명 과학기술정보 통신 부 제2 차관과 노용석 중소벤처기업부 제1...", "source": "tjb.co.kr", "date": "2026-09-07 17:38", "url": "https://www.tjb.co.kr/news05/bodo/view/id/103306", "category": "other", "importance": 2, "wl": false, "topic": ""}, {"title": "Satellite Internet Gets New Rules in Pakistan - Bloom Pakistan", "summary": "파키스탄에서 위성 인터넷에 대한 새로운 규정들이 도입되었다. 국가별 위성 통신 규제 체계 정비 보도다.", "source": "Bloom Pakistan", "date": "2026-09-07 13:31", "url": "https://bloompakistan.com/satellite-internet-gets-new-rules-in-pakistan/", "category": "policy", "importance": 2, "wl": false, "topic": "파키스탄 위성통신"}], "carrier": [{"title": "\"먹통 없는 재난 대응\" 정부·이통3사, 상용망 기반 소방 통신 개선", "summary": "정부와 이동통신 3사가 먹통 없는 재난 대응을 위해 상용망 기반의 소방 통신 개선에 나섰다. KT가 소방청 행정망에 기업전용 5G SA(Standalone)를 도입하는 등 무선 통신 안정성을 높이고 있다. 공공 안전 통신망의 품질을 강화하고 비상 상황에서의 통신 연속성을 확보하는 중요한 조치다.", "source": "itdaily.kr", "date": "2026-09-07 17:46", "url": "https://www.itdaily.kr/news/articleView.html?idxno=241454", "category": "tech", "importance": 4, "wl": false, "topic": "과학기술정보통신부 소방통신"}, {"title": "KT '티오더 기술탈취' 의혹 재점화", "summary": "티오더가 통신망 장애가 발생한 매장에 KT 영업직원이 하이오더 사용을 권유했다는 기술탈취 의혹을 제기했다. 통신사 간 가입자 유치 경쟁 과정에서 네트워크 장애 상황이 언급되며 갈등이 빚어지고 있다. 통신 영업 현장의 과열 경쟁 양상을 보여준다.", "source": "4th.kr", "date": "2026-09-07 16:56", "url": "http://www.4th.kr/news/articleView.html?idxno=2117596", "category": "contract", "importance": 4, "wl": false, "topic": "kt 티오더기술탈튀"}, {"title": "위축됐던 통신망 투자, AI 트래픽 폭발에 재확대 기로", "summary": "글로벌 통신장비 업체 에릭슨이 피지컬 AI, 로봇, AI 에이전트 간 통신 증가로 2030년 데이터 업로드 트래픽이 현재보다 3~5배 증가할 것으로 전망했다. 이에 대응하기 위해 통신망 투자가 재확대되는 기로에 놓였다. 5G SA 전환 등 차세대 네트워크 인프라 수요가 급증할 것으로 예상된다.", "source": "mediapen.com", "date": "2026-09-07 16:04", "url": "https://www.mediapen.com/news/view/1121802", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 트래픽전망"}, {"title": "송주영 연구위원 \"국내 통신 사 첫 클라우드 전산실…서버 복구 빨라서 ...", "summary": "국내 통신사 최초의 클라우드 전산실 도입으로 서버 복구 속도가 빨라진 사례가 소개됐다. 요금 정산까지 연결된 통신사 핵심 전산망의 클라우드 전환은 장애 발생 시 고객 서비스에 직결되므로 고난도 작업이다. 365일 중단 없는 통신 인프라 운영의 중요성을 보여준다.", "source": "hankyung.com", "date": "2026-09-07 15:54", "url": "https://www.hankyung.com/article/2026090778701", "category": "tech", "importance": 4, "wl": false, "topic": "통신사 클라우드전산실"}, {"title": "[미리보는 AINEX 2026]〈중〉AI 입는 지상망…6G·AI-RAN·AIDC 전략 공개", "summary": "AINEX 2026을 앞두고 SK텔레콤과 LG유플러스가 6G 및 AI 기반 네트워크 전략을 발표하며, 삼성전자, 노키아코리아 등 국내외 장비업체가 AI 네트워크와 AIDC 인프라 기술을 소개한다. 지상망에 AI를 접목하는 차세대 통신 기술의 청사진이 공개되는 자리다. 통신사와 장비사 간의 긴밀한 기술 협력 방향을 보여준다.", "source": "etnews.com", "date": "2026-09-07 14:22", "url": "https://www.etnews.com/20260907000325", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 ainex"}, {"title": "이통3사 5G SA 전환 속도전…앞서가는 KT에 SKT·LGU+ \"연내 상용화\" - 뉴스웍스", "summary": "이통 3사의 5G SA 전환 속도가 빨라지는 가운데 앞서가는 KT에 맞서 SKT와 LGU+도 연내 상용화를 추진한다. 국내 이동통신사들의 차세대 네트워크 전환 경쟁을 보여주는 중요 기사다.", "source": "뉴스웍스", "date": "2026-09-07 11:07", "url": "https://www.newsworks.co.kr/news/articleViewAmp.html?idxno=852826", "category": "tech", "importance": 4, "wl": false, "topic": "통신3사 5g"}, {"title": "Charter Stock Outlook: Can the $34.5B Cox Merger Help CHTR Recover Before Earnings? - Trad", "summary": "차터 커뮤니케이션즈가 345억 달러 규모의 콕스 인수합병을 추진하며 실적 반등을 모색하고 있습니다. 미국 케이블 및 통신 시장의 대형 M&A 딜로 업계 재편에 큰 영향을 미칩니다. 합병 승인 여부와 재무적 영향이 주목받고 있습니다.", "source": "TradingKey", "date": "2026-09-06 07:20", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/261998863-charter-stock-outlook-cox-merger-chtr-before-earnings-tradingkey", "category": "contract", "importance": 4, "wl": false, "topic": "차터커뮤니케이션즈 콕스 인수합병"}, {"title": "Telstra deploys slicing so everyone can be a Teams player - Telecoms", "summary": "호주 텔스트라가 네트워크 슬라이싱 기술을 도입하여 기업용 협업 서비스 품질을 개선했다. 통신사의 5G SA 및 네트워크 슬라이싱 상용화 사례다.", "source": "Telecoms", "date": "2026-09-07 19:24", "url": "https://www.telecoms.com/operator-ecosystem/telstra-deploys-slicing-so-everyone-can-be-a-teams-player", "category": "tech", "importance": 3, "wl": false, "topic": "텔스트라 네트워크"}, {"title": "Vodafone launches Quality on Demand API in Germany - Telecoms", "summary": "보다폰이 독일 시장에서 품질 맞춤형 API(Quality on Demand API) 서비스를 출시했다. 통신사의 네트워크 기능 개방 및 API 기반 부가서비스 전략을 보여준다.", "source": "Telecoms", "date": "2026-09-07 19:14", "url": "https://www.telecoms.com/network-software/vodafone-launches-quality-on-demand-api-in-germany", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 api"}, {"title": "BharatNet Phase 3: Amilionn, ITI project surpasses 40% completion in Himachal Pradesh", "summary": "인도의 국가 광대역 통신망 사업인 '바랏넷 페이즈 3' 프로젝트의 일환으로 히마찰프라데시주 마디 지역에서의 광케이블 포설 및 인프라 구축 공정률이 40%를 돌파했다. 지역 통신 인프라 확충 현황이다.", "source": "ET Telecom", "date": "2026-09-07 19:11", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/bharatnet-phase-3-amilionn-iti-project-surpasses-40-completion-in-himachal-pradesh/133875803", "category": "contract", "importance": 3, "wl": true, "topic": "바랏넷 통신망 구축"}, {"title": "우상호 지사 “춘천-신세계, 원주-KT AI데이터센터 투자 협의 중” - 강원일보", "summary": "강원도가 원주에 KT, 춘천에 신세계를 파트너로 삼아 AI 데이터센터 투자를 협의 중이다. 지역 단위의 대형 데이터센터 인프라 유치 추진 상황을 나타낸다.", "source": "강원일보", "date": "2026-09-07 18:55", "url": "https://www.kwnews.co.kr/article/20260907501341", "category": "contract", "importance": 3, "wl": false, "topic": "kt 데이터센터"}, {"title": "Jio IPO vs Other Major Indian IPOs: What Makes It Different? - The Sunday Guardian", "summary": "인도 릴라이언스 지오의 IPO가 다른 주요 인도 기업들의 상장과 비교되어 특징이 분석되었다. 거대 통신사의 상장이 자본 시장에 미치는 파급효과가 주목받고 있다. 향후 통신 사업 투자의 중요한 자금 조달 창구로서 의미를 가진다.", "source": "The Sunday Guardian", "date": "2026-09-07 18:55", "url": "https://sundayguardianlive.com/brand-desk/jio-ipo-vs-other-major-indian-ipos-what-makes-it-different-279226/", "category": "earnings", "importance": 3, "wl": false, "topic": "릴라이언스지오 ipo"}, {"title": "Movistar Spain launches 2 Gbps fibre for B2B clients - Telecompaper", "summary": "스페인 모비스타가 기업(B2B) 고객을 위한 2 Gbps 초고속 광랜 서비스를 출시했다. 유선 통신 인프라 고도화 및 기업용 상품 강화 전략이다.", "source": "Telecompaper", "date": "2026-09-07 17:58", "url": "https://www.telecompaper.com/news/movistar-spain-launches-2-gbps-fibre-for-b2b-clients--1581890", "category": "tech", "importance": 3, "wl": false, "topic": "모비스타 5g"}, {"title": "[통신 풍향계] SKT '데이터 벽 칼럼'·KT '5G SA 슬라이싱' 실증·LGU+ 'PMDC 얼라이언스' 출범-'추석 멤버십' 강화 - 뉴스웍스", "summary": "SKT의 데이터 벽 칼럼, KT의 5G SA 슬라이싱 실증, LGU+의 PMDC 얼라이언스 출범 등 통신 3사의 기술 혁신 및 멤버십 개편 동향을 정리했다. 국내 통신사들의 최신 기술 적용 흐름을 보여준다.", "source": "뉴스웍스", "date": "2026-09-07 17:52", "url": "https://www.newsworks.co.kr/news/articleViewAmp.html?idxno=852915", "category": "tech", "importance": 3, "wl": false, "topic": "통신3사 동향"}, {"title": "IPTV 정체 속 티빙 해킹까지…KT, ‘OTT 합병’ 셈법 복잡해진다 - 아시아투데이", "summary": "IPTV 사업 정체와 티빙 해킹 사고 발생 등 악재 속에서 KT의 OTT 합병 전략 셈법이 복잡해지고 있다. 미디어 및 부가 서비스 사업의 전략적 난제를 다룬다.", "source": "아시아투데이", "date": "2026-09-07 17:37", "url": "http://www.asiatoday.co.kr/kn/view.php?key=20260907010002526", "category": "tech", "importance": 3, "wl": false, "topic": "kt 미디어"}, {"title": "Makedonski Telekom unveils 5G SA network - Telecompaper", "summary": "마케도니아 텔레콤이 단독모드(5G SA) 네트워크를 공식 출범했다. 통신사의 차세대 무선 네트워크 상용화 및 인프라 고도화 동향을 나타낸다.", "source": "Telecompaper", "date": "2026-09-07 17:28", "url": "https://www.telecompaper.com/news/makedonski-telekom-unveils-5g-sa-network--1581871", "category": "tech", "importance": 3, "wl": false, "topic": "마케도니아텔레콤 5g"}, {"title": "[재계 투데이] 삼성 , 하반기 신입 공채 실시 外", "summary": "삼성이 하반기 신입 공채를 실시하는 과정에서 통신사와 연계한 인파 밀집도 측정 앱과 KT의 5G 네트워크 슬라이싱 기술 활용 사례가 언급되었다. 공채 소식 및 기술 협력 사례가 포함되어 있다.", "source": "news.dealsitetv.com", "date": "2026-09-07 17:22", "url": "https://news.dealsitetv.com/articles/175706", "category": "tech", "importance": 3, "wl": false, "topic": "kt 네트워크슬라이싱"}, {"title": "AIDC 키우는 통신3사…SKT '분업', KT '네트워크', LGU+ '표준화' - v.daum.net", "summary": "통신 3사가 AI 데이터센터(AIDC) 시장 공략을 위해 SKT는 분업, KT는 네트워크, LGU+는 표준화에 주력하며 차별화 전략을 펼치고 있다. AI 인프라 시장에서의 통신사별 사업 전략을 분석한다.", "source": "v.daum.net", "date": "2026-09-07 17:13", "url": "https://v.daum.net/v/20260907171305156", "category": "tech", "importance": 3, "wl": false, "topic": "통신3사 ai데이터센터"}, {"title": "[기획] 데이터센터 다음은 로봇 훈련장… 中 통신사, 피지컬 AI 학습 시...", "summary": "중국 통신사 차이나텔레콤이 5G 통신망과 클라우드 인프라를 활용하여 피지컬 AI 학습 데이터를 수집 및 지원하고 있다. 로봇 학습용 작업 과정을 기록하는 미펑테크놀로지와 협력하여 AI 인프라를 확장하는 양상이다. 통신사의 네트워크가 AI 학습 및 로봇 제어의 핵심 인프라로 활용되는 사례다.", "source": "dt.co.kr", "date": "2026-09-07 16:57", "url": "https://www.dt.co.kr/article/12082561?ref=naver", "category": "tech", "importance": 3, "wl": false, "topic": "차이나텔레콤 피지컬ai"}, {"title": "楽天モバイル、一部エリアで10月以降もKDDIローミングを継続する方針を改めてお知らせ (ケータイ Watch) - Yahoo!ニュース", "summary": "라쿠텐 모바일이 자체 기지국망 구축이 지연되는 일부 지역에서 10월 이후에도 KDDI 로밍을 유지한다고 발표했습니다. 가입자 서비스 품질 유지를 위한 불가피한 조치입니다. 양사 간 로밍 협상이 막바지에 이르렀음을 시사합니다.", "source": "Yahoo!ニュース", "date" mes.com/news/industry/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market-akash-ambani/133826619", "category": "other", "importance": 3, "wl": true, "topic": "릴라이언스지오 글로벌 진출"}, {"title": "2026년 9월 15일부터 2G 서비스가 종료됩니다. 어떤 사용자들이 영향을 받게 될까요? - Vietnam.vn", "summary": "베트남에서 2G 서비스가 종료됨에 따라 특정 이용자들이 영향을 받을 것으로 예상된다. 구형 네트워크의 순차적 종료와 주파수 재배치가 진행되고 있다. 가입자들의 4G·5G 전환을 유도하여 모바일 네트워크 효율성을 높이기 위한 조치다.", "source": "Vietnam.vn", "date": "2026-09-06 11:43", "url": "https://www.vietnam.vn/ko/tu-15-9-2026-tat-song-2g-nhung-nguoi-dung-nao-bi-anh-huong", "category": "policy", "importance": 3, "wl": false, "topic": "베트남통신부 2g"}, {"title": "LGU+ 볼트업, 충전기 이상 감지 AI 개발…원격 조치 자동화 추진 - 전자신문", "summary": "LG유플러스의 전기차 충전 서비스 '볼트업'이 충전기 이상 감지를 위한 AI 기술을 개발하고 원격 조치 자동화를 추진한다. 인프라 운영의 안정성을 강화하기 위한 디지털 전환의 일환이다. 통신사의 부가 서비스 및 스마트 인프라 관리 역량을 보여준다.", "source": "전자신문", "date": "2026-09-06 10:30", "url": "https://www.etnews.com/20260904000134?m=1", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 볼트업"}, {"title": "평범한 업무차가 통신망 훑는 AI 차량으로…SKT '톺다', 해외서도 눈길 - 뉴시스", "summary": "SK텔레콤이 개발한 AI 기반 통신망 분석 차량 '톺다'가 해외에서도 주목을 받고 있다. 차량을 통해 이동하며 실시간으로 무선 네트워크 품질을 점검하고 분석할 수 있는 솔루션이다. 통신망 운영의 효율성을 높이는 혁신적인 기술로 평가받는다. 글로벌 시장 진출 가능성을 모색하고 있다.", "source": "뉴시스", "date": "2026-09-06 10:13", "url": "https://mobile.newsis.com/view_amp.html?ar_id=NISX20260906_0003777890", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 톺다"}, {"title": "제각각 통신 방식 통일…軍, 전군 드론 '통신표준' 만든다 - 뉴스1", "summary": "군이 제각각이던 드론 통신 방식을 하나로 통일하기 위해 전군 드론 통신표준 제정에 나섰다. 군수 및 작전 환경에서 안정적인 무선 데이터 전송과 통신 호환성을 확보하기 위한 조치다. 향후 국방 분야 네트워크 인프라 표준화의 기틀이 될 전망이다. 관련 통신 장비 및 솔루션 도입에 영향을 미칠 수 있다.", "source": "뉴스1", "date": "2026-09-06 07:00", "url": "https://www.news1.kr/amp/diplomacy/defense-diplomacy/6280619", "category": "tech", "importance": 3, "wl": false, "topic": "국방부 드론"}, {"title": "투자자들은 SBA Communications(SBAC)의 주파수 경매 및 타워 임대 전망에 어떻게 반응하고 있는가 - simplywall.st", "summary": "에스비에이커뮤니케이션즈(SBAC)의 주파수 경매 /* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
