<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}

  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

 [{"title": "AST SpaceMobile Stock: The Selloff Has Gone Too Far (NASDAQ:ASTS) - Seeking Alpha", "summary": "위성통신 기업 AST스페이스모바일(NASDAQ: ASTS)의 최근 주가 급락세가 과도하다는 분석이 제기되었다. 저궤도 위성 통신망 구축과 상용화 진척도에 따라 변동성이 큰 종목으로 평가받고 있다. 실적 발표와 사업 성과가 주가 향방의 핵심 변수로 꼽힌다.", "source": "Seeking Alpha", "date": "2026-09-03 17:26", "url": "https://seekingalpha.com/article/4942652-ast-spacemobile-the-selloff-has-gone-too-far?source=feed_tag_long_ideas", "category": "earnings", "importance": 4, "wl": false, "topic": "ast스페이스모바일 주가 하락세 평가"}, {"title": "대만 유사시 첫 전장은 우주?…美·中 대위성 무기 경쟁 격화", "summary": "대만 유사시 우주전 전장화 가능성이 제기되는 가운데 미·중 간 대위성 무기 경쟁이 격화되고 있다. 러시아의 GPS 수신기 교란과 함께 중국 역시 스타링크를 공격할 가능성을 검토하고 있다는 분석 보고서가 나왔다.", "source": "digitaltoday.co.kr", "date": "2026-09-03 14:14", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697949", "category": "tech", "importance": 4, "wl": false, "topic": "미중 대위성 무기 경쟁과 스타링크 위협"}, {"title": "Berenberg's Bullish Space Sector Sweep And Insider Buy Push AST SpaceMobile (NASDAQ: ASTS)", "summary": "베렌베르크의 우주 섹터 전반에 걸친 긍정적 전망과 내부자 매수세가 맞물려 AST스페이스모바일에 대한 투자 심리가 자극되었다. 저궤도 위성 통신 기술의 성장 잠재력이 재확인되는 계기가 되었다. 위성통신 기업들의 주가 반등 모멘텀으로 작용하고 있다.", "source": "foreignpolicyjournal.com", "date": "2026-09-03 08:25", "url": "https://www.foreignpolicyjournal.com/2026/09/02/berenbergs-bullish-space-sector-sweep-and-insider-buy-push-ast-spacemobile-nasdaq-asts-stock-price-up-10/", "category": "earnings", "importance": 4, "wl": false, "topic": "베렌베르크 ast스페이스모바일 낙관"}, {"title": "공정위, 한화 KAI 주식 취득 승인… ‘한국판 스페이스X’ 구상 속도", "summary": "공정거래위원회가 한화의 KAI 주식 취득을 승인했다. 한화는 2040년까지 대규모 자금을 투입하여 독자 발사체, 저궤도 통신망, 우주 AI 데이터센터 등을 구축하는 AI 우주강국 중장기 전략을 추진 중이다.", "source": "weekly.donga.com", "date": "2026-09-03 07:02", "url": "https://weekly.donga.com/3/all/11/6371275/1", "category": "policy", "importance": 4, "wl": false, "topic": "공정위 한화 kai 주식 취득 승인과 우주 전략"}, {"title": "\"억지 실패 땐 궤도서 교전\"…미·중 우주 전투태세 서두르는 이유", "summary": "스페이스X가 약 1만 1000기의 스타링크 위성을 운용하며 우주 데이터망을 확장하는 가운데 중국도 독 크를 비롯해 아마존과 중국 기업들의 대규모 저궤도 위성망 구축 경쟁으로 발사 횟수가 급증하고 우주 쓰레기와 교통체증 우려가 심화되고 있다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/P75B75JQ6RGGJFUYQ7FOD7VYTU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 붐빔과 우주 쓰레기 문제"}, {"title": "안보 위협하는 신흥기술…중견국 리더십 발휘해야 [왜냐면]", "summary": "인공지능 도입이 저궤도 위성의 군사화와 무기화를 가속화하고 있다. 아울러 자율적으로 취약점을 찾는 에이전트 AI의 사이버 공격 위협도 대두되고 있다.", "source": "hani.co.kr", "date": "2026-09-02 19:08", "url": "https://www.hani.co.kr/arti/opinion/because/1275953.html", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 군사화와 에이전트 ai 위협"}], "competitor": [{"title": "美 '팍스 실리카' 맞불…中, 제3세계로 AI 인프라 확장", "summary": "중국이 제3세계로 AI 인프라를 확장하는 가운데, 광통신 등 일부 분야에서 중국 공급망 비중이 높다. 반면 반도체 장비와 첨단 칩 부문에서는 화웨이와 창신메모리테크놀로지가 국산화에 속도를 내며 미국의 제재에 대응하고 있다.", "source": "hankyung.com", "date": "2026-09-02 18:23", "url": "https://www.hankyung.com/article/2026090203721", "category": "policy", "importance": 5, "wl": false, "topic": "화웨이 반도체 국산화 및 공급망"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크가 고고도 플랫폼(HAPS)을 활용한 성층권 시험 비행을 완료하고 2027년 상용화를 목표로 설정했다. 고치현 무로토곶 해역에서 진행된 이번 시험은 드론과 에지 컴퓨팅 시스템 간의 원활한 연결성을 검증했다. 지상과 위성을 잇는 차세대 통신 인프라로서 경쟁력을 높이고 있다.", "source": "Light Reading", "date": "2026-09-03 23:20", "url": "https://www.lightreading.com/satellite/softbank-completes-stratospheric-haps-trial-eyes-2027-deployment", "category": "tech", "importance": 4, "wl": true, "topic": "소프트뱅크 haps"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "바이트댄스가 중국 내이멍구에 대규모 AI데이터센터 건설을 추진한다. 과거 화웨이 등 통신장비 업체를 비롯한 빅테크 기업들이 이 지역에 컴퓨팅 시설 투자를 진행해 온 연장선상이다.", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "contract", "importance": 4, "wl": false, "topic": "바이트댄스 네이멍구 ai데이터센터 건설"}, {"title": "삼성물산, 스웨덴 SMR 사업 전략적 파트너 선정…유럽 교두보 확보", "summary": "삼성물산이 스웨덴 소형모듈원자로(SMR) 신규 원전 사업의 전략적 Partner로 선정되어 GE 버노바 등과 함께 공동 EPC로 참여해 SMR 4기를 건설한다. 이번 사업을 통해 삼성물산은 유럽 원전 시장의 교두보를 확보하게 됐다. 글로벌 친환경 에너지 인프라 시장에서의 수주 경쟁력을 입증하는 계기가 될 전망이다.", "source": "매일경제 IT", "date": "2026-09-03 16:26", "url": "https://www.mk.co.kr/news/realestate/12143496", "category": "contract", "importance": 4, "wl": true, "topic": "삼성물산 smr 사업 파트너 선정"}, {"title": "‘목동 첫 래미안’ 나온다…삼성물산, 2조3000억 규모 목동13단지 출격", "summary": "삼성물산 건설부문이 2조 3000억 원 규모의 서울 양천구 목동13단지 재건축 정비사업 수주전에 본격적으로 뛰어들었다. 글로벌 건축설계사인 미국의 SMDP와 협업하여 차별화된 설계를 선보일 예정이다. 반포에 이어 목동에서도 '래미안' 브랜드 타운을 조성하겠다는 전략이다.", "source": "매일경제 IT", "date": "2026-09-03 15:43", "url": "https://www.mk.co.kr/news/realestate/12143430", "category": "contract", "importance": 4, "wl": true, "topic": "삼성물산 목동13단지 재건축 수주"}, {"title": "SK 최태원, AI 메모리 품귀 속 승부수…日 키옥시아와 ‘반도체 동맹’...", "summary": "AI 메모리 품귀 속에서 SK하이닉스와 키옥시아가 반도체 동맹을 추진하며 점유율 확대에 나선다. 글로벌 1위 삼성전자에 맞서 2위와 3위 기업이 손을 잡는 형국이다. 한국, 미국, 일본을 잇는 글로벌 반도체 생산 및 협력 네트워크가 한층 견고해질 전망이다.", "source": "sportsseoul.com", "date": "2026-09-03 12:00", "url": "https://www.sportsseoul.com/news/read/1632430?ref=naver", "category": "contract", "importance": 4, "wl": false, "topic": "sk하이닉스 키옥시아 반도체 동맹"}, {"title": "대우건설, 세계적 조경·도시설계 그룹 STOSS와 손잡고 신월시영 재건축 조경 차별화", "summary": "대우건설이 서울 양천구 신월시영아파트 재건축사업 수주를 위해 글로벌 조경·도시 설계 그룹 STOSS와 협업에 나선다. 단지를 자연과 문화, 예술이 공존하는 미래형 주거 공간으로 조성해 수주 경쟁력을 높인다는 전략이다. 대형 건설사들의 해외 유명 설계사와의 협업을 통한 수주전이 활발해지고 있다.", "source": "매일경제 IT", "date": "2026-09-03 09:46", "url": "https://www.mk.co.kr/news/realestate/12143046", "category": "contract", "importance": 4, "wl": true, "topic": "대우건설 신월시영 재건축 조경 수주"}, {"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도가 국가 안보 우려를 이유로 기존 중국산 통신 장비의 철거 및 교체를 검토하고 있는 것으로 전해졌다. 글로벌 통신장비 시장에서 화웨이와 ZTE 등 중국 업체의 입지가 더욱 축소될 가능성이 제기된다. 주요국의 중국산 장비 제재 기조와 맞물려 업계 판도에 큰 영향을 미칠 전망이다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 4, "wl": true, "topic": "인도 화웨이"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨은 연말 한국에서 드론 실시간 추적 통신 기술을 공개할 예정이다. 한국 정부와 기업에 기술력을 알리고 협력 방안을 모색하기 위한 행보로 풀이된다. 데이터를 빠르게 처리하는 6G와 AI 기능이 ISAC과 결합하여 기술 효율성을 극대화할 것으로 전망했다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 및 드론 기술 공개"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아는 AI-RAN, ISAC, 그리고 6G로 이어지는 차세대 네트워크 청사진을 제시했다. AI 시대의 경쟁력은 네트워크 고도화에서 시작된다며 기술 리더십을 강조했다. 한국 시장의 파트너들과 함께 새로운 협력 기회를 모색할 계획이다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 청사진 제시"}, {"title": "에이스테크놀로지, 항우연 저궤도 위성 통신 핵심 안테나 개발 수주", "summary": "에이스테크놀로지가 한국항공우주연구원의 저궤도 위성 통신 자립화 사업에서 지상국용 ESA(능동위상배열안테나) 개발 계약을 수주했다. 국가 위성 통신 자립화 프로젝트 참여를 통해 기술력을 입증하고 있다.", "source": "metroseoul.co.kr", "date": "2026-09-02 16:38", "url": "http://www.metroseoul.co.kr/article/20260902500539", "category": "contract", "importance": 4, "wl": false, "topic": "에이스테크놀로지 항우연 저궤도 위성 안테나 수주"}, {"title": "통신사도 통신장비도 AI로 달라진다…통신망 운영의 새 기준은 '예측'", "summary": "국내 통신사들이 AI를 활용한 네트워크 이상 징후 예측 시스템을 도입하는 가운데, 에릭슨과 노키아 등 글로벌 통신장비 업체들도 AI 기반 네트워크 운영 솔루션을 강화하고 있다. 통신망 운영의 새로운 기준으로 예측 정밀도가 대두되고 있다.", "source": "popcornnews.net", "date": "2026-09-02 15:50", "url": "http://www.popcornnews.net/news/articleView.html?idxno=131622", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 노키아 ai 네트워크 운영 시스템"}, {"title": "가성비 중국폰 옛말… 화웨이 ·샤오미 메모리난에 가격 일제히 올려", "summary": "중국 통신장비 업체 화웨이의 올해 상반기 매출은 증가했으나 순이익은 감소했다. R&D 비용 확대와 더불어 메모리 가격 상승 등이 수익성에 영향을 미친 것으로 나타났다.", "source": "sedaily.com", "date": "2026-09-02 06:01", "url": "https://www.sedaily.com/article/20086004?ref=naver", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 상반기 실적 및 r&d 비용"}, {"title": "Ciena sees AI driving multi-year optical infrastructure investment cycle", "summary": "시에나는 AI가 장거리 네트워크부터 데이터 센터 패브릭에 이르기까지 광섬유 연결의 중요성을 높이며 다년간의 광인프라 투자 사이클을 견인하고 있다고 밝혔다. 대대적인 네트워크 재건축 수요가 발생하면서 관련 장비 시장의 성장이 기대된다. AI 시대의 인프라 수혜주로서 입지를 다지고 있다.", "source": "RCR Wireless", "date": "2026-09-04 00:25", "url": "https://rcrwireless.com/20260903/connectivity/ciena-ai-optical", "category": "earnings", "importance": 3, "wl": true, "topic": "시에나 실적"}, {"title": "우리넷, KOREN 기반 AI 광네트워크 실증 착수", "summary": "국내 통신장비 업체 우리넷은 KOREN 기반의 AI 광네트워크 실증에 착수하며 차세대 기술 경쟁력 확보에 나섰다. 후속 과제인 '6G 수십테라급 초정밀 전달망 시스템 기술 개발'을 통해 기존 광전송망 기능을 고도화할 계획이다. 이를 통해 향후 AI 데이터센터 및 다양한 산업 영역으로 사업 포트폴리오를 확장할 방침이다.", "source": "thelec.kr", "date": "2026-09-03 19:10", "url": "https://www.thelec.kr/news/articleView.html?idxno=61790", "category": "tech", "importance": 3, "wl": false, "topic": "우리넷 ai 광네트워크 실증"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "통신장비 및 부품업체 알에프텍이 5G 통신장비와 방산 RF 기술 경쟁력을 강화하기 위해 연구개발(R&D) 조직을 별도 자회사 'RFTC'로 분리한다고 밝혔다. 이달 중 운영 체계 정비를 마무리하고 본격적인 RF 사업 확대에 나선다. 전문화된 기술 플랫폼 구축을 위한 조직 개편이다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "other", "importance": 3, "wl": false, "topic": "알에프텍 r&d 자회사 rftc 분리"}, {"title": "알에프텍, 5G 기술 방산으로 확대…RF 자회사 'RFTC' 출범", "summary": "알에프텍은 지난 2019년 삼성전자에 5G 안테나 필터 유닛을 공급하며 RF 장비 시장에 진입한 이래 Massive MIMO 기지국용 안테나 및 필터 유닛을 공급해왔다. 최근 이 같은 5G 통신장비 및 방산 RF 기술 경쟁력을 강화하기 위해 R&D 조직을 자회사 'RFTC'로 분리했다. 삼성전자 협력사의 사업 다각화 및 전문화 행보를 보여준다.", "source": "fnnews.com", "date": "2026-09-03 13:41", "url": "https://www.fnnews.com/news/202609031334337249", "category": "other", "importance": 3, "wl": false, "topic": "알에프텍 삼성전자 공급 및 rftc"}, {"title": "화웨이 코리아가 한국 대학생 9명을 선전으로 부른 이유는", "summary": "화웨이 코리아가 한국 대학생들을 선전 본사로 초청했다. 반도체와 통신 장비 소프트웨어 분야 인재들과의 조기 접점을 넓혀 기술 협력 기반을 다지기 위한 전략이다.", "source": "econovill.com", "date": "2026-09-02 10:40", "url": "https://www.econovill.com/news/articleView.html?idxno=749636", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 코리아 한국 대학생 교류"}, {"title": "AI pushes fiber networks toward a capacity crunch, AFL says", "summary": "AFL의 노아 테일러는 광섬유 가용성과 전력 제약의 결합이 AI 인프라 구축에 추가적인 도전 과제를 제시하고 있다고 밝혔다. 데이터 폭증에 따른 네트워크 병목 현상 우려가 커지고 있다. 인프라 공급망 전반의 대응책 마련이 시급하다.", "source": "RCR Wireless", "date": "2026-09-03 16:07", "url": "https://rcrwireless.com/20260903/networks/ai-fiber-afl", "category": "tech", "importance": 2, "wl": true, "topic": "afl 광섬유"}, {"title": "Clearfield inks distribution alliance with WAV", "summary": "클리어필드가 WAV와의 유통 제휴를 통해 미국과 캐나다 전역에서 광섬유, 전력 및 무선 네트워크 인프라 접근성을 확대한다. 북미 통신 인프라 시장에서 유통망을 다각화하는 전략이다. 장비 공급 생태계의 협력이 강화되고 있다.", "source": "Light Reading", "date": "2026-09-03 04:29", "url": "https://www.lightreading.com/wireless/clearfield-inks-distribution-alliance-with-wav", "category": "contract", "importance": 2, "wl": true, "topic": "클리어필드 유통"}, {"title": "Ericsson Adaptive Inventory", "summary": "에릭슨이 어댑티브 인벤토리 솔루션을 통해 네트워크 자산 관리 효율화에 나선다. 복잡해지는 통신망 환경에서 운영 자동화를 지원하는 핵심 도구다. 통신사들의 비용 절감과 망 운용 최적화를 돕는다.", "source": "RCR Wireless", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-Channel", "category": "tech", "importance": 2, "wl": true, "topic": "에릭슨 인벤토리"}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "페어폰의 시리즈 C 투자 유치 소식과 함께 헬라스샛의 양자 보안 적용, 노키아의 사우디 네트워크 자동화, 에릭슨의 FIS 협력 등 유럽 및 중동 지역의 통신·기술 동향이 발표됐다. 각 기업들의 차세대 기술 협력과 실적 개선 노력이 이어지고 있다. 글로벌 통신 장비 및 솔루션 시장의 다각적인 변화를 보여준다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "https://www.lightreading.com/smartphones-devices/eurobites-fairphone-opens-series-c-funding-round-after-happy-h1", "category": "earnings", "importance": 2, "wl": true, "topic": "유럽 통신사 동향"}, {"title": "Calix hires new CMO", "summary": "칼릭스가 SAP, 오라클, 서비스나우 등에서 리더십 역할을 맡았던 예르겐 린드너를 신임 최고마케팅책임자(CMO)로 임명했다. 기업의 마케팅 전략 강화와 글로벌 시장 공략을 위한 인재 영입이다. 조직 개편을 통한 성장 동력 확보를 꾀하고 있다.", "source": "Light Reading", "date": "2026-09-02 03:28", "url": "https://www.lightreading.com/ai-machine-learning/calix-hires-new-cmo", "category": "exec", "importance": 1, "wl": true, "topic": "칼릭스 인사"}], "policy": [{"title": "GAO issues broadband program to-dos for FCC, NTIA", "summary": "미국 회계감사원(GAO)이 연방 브로드밴드 프로그램의 현황을 평가하고 FCC와 NTIA에 광대역 매핑 데이터의 정확성과 지속 가능성에 대한 구체적인 권고사항을 전달했다. 정부 주도의 통신 인프라 지원 정책이 실효성을 높이기 위한 조치다. 향후 관련 예산 집행과 정책 방향에 영향을 미칠 전망이다.", "source": "Light Reading", "date": "2026-09-03 21:00", "url": "https://www.lightreading.com/broadband/gao-issues-broadband-program-to-dos-for-fcc-ntia", "category": "policy", "importance": 3, "wl": true, "topic": "gao 브로드밴드"}, {"title": "[ET톡] 6G 1등 국가의 조건", "summary": "5G 상용화의 경험을 교훈 삼아 6G에서는 세계 최초 타이틀보다 최고 기술을 갖춘 1등 국가가 되어야 한다는 지적이 나왔다. 서비스 조기 시작보다는 기술과 산업 전반에서 실질적인 우위를 점하는 것이 중요하다는 평가다.", "source": "etnews.com", "date": "2026-09-03 13:44", "url": "https://www.etnews.com/20260903000237", "category": "tech", "importance": 3, "wl": false, "topic": "6g 1등 국가 도약 전략"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장의 프라이빗 5G 배포를 위한 새로운 계획을 마련했으나 주파수 할당에 대한 구체적인 내용은 포함되지 않았다. 산업용 5G 확산을 유도하려는 정책적 시도이나 실효성에 대한 의문이 제기된다. 규제 완화와 시장 수요 간의 조율이 과제로 남아 있다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 프라이빗5g"}, {"title": "AI regulatory regime should be nimble, not over-constraining: Top PM advisor", "summary": "인도의 최고 정책 자문가가 AI 규제 체제가 지나치게 제약적이지 않고 민첩해야 한다고 조언했다. 인도는 2026년 2월 IT법 개정을 통해 딥페이크와 인공지능을 규제하는 규범을 도입한 바 있다. 산업 성장을 저해하지 않는 균형 잡힌 규제 프레임워크 구축이 추진되고 있다.", "source": "ET Telecom", "date": "2026-09-03 16:55", "url": "https://telecom.economictimes.indiatimes.com/news/policy/ai-regulatory-regime-should-be-nimble-not-over-constraining-top-pm-advisor/133729523", "category": "policy", "importance": 2, "wl": true, "topic": "인도 ai 규제"}], "carrier": [{"title": "티빙 3954만 계정 정보 유출", "summary": "티빙이 침해사고 인지 후 정보통신망법에 따라 24시간 이내 과기정통부 또는 KISA에 신고해야 하는 규정을 위반했다. 조사단은 티빙의 보안 소홀과 늑장 신고 정황을 발표했다.", "source": "thereport.co.kr", "date": "2026-09-04 00:40", "url": "https://www.thereport.co.kr/news/articleView.html?idxno=91065", "category": "policy", "importance": 4, "wl": false, "topic": "티빙 개인정보 유출 사고 조사"}, {"title": "Elliott Management builds Deutsche Telekom stake, opposes possible T-Mobile merger - repor", "summary": "행동주의 펀드 엘리엇 매니지먼트가 도이치텔레콤의 지분을 확보하고 T-모바일과의 잠재적 합병 구도에 반대 입장을 표명했다. 유럽 주요 통신사의 지배구조와 M&A 전략에 개입하려는 움직임이다. 글로벌 통신 시장의 투자 및 경영권 이슈로 주목받고 있다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:17", "url": "https://www.datacenterdynamics.com/en/news/elliott-management-builds-deutsche-telekom-stake-opposes-possible-t-mobile-merger-reports/", "category": "other", "importance": 4, "wl": false, "topic": "엘리엇관리국 도이치텔레콤 지분 인수"}, {"title": "통신3사, “AI 네트워크는 국가 전략 인프라, 지원책 절실” 한목소리", "summary": "국내 통신 3사는 AI 네트워크가 국가 전략 인프라임에도 불구하고 투자를 통한 새로운 수익 창출이 정체되어 있다고 한목소리를 냈다. 5G SA와 6G 등 신기술 투자가 시급하지만 시장 성장이 둔화되어 정부의 정책적 지원과 제도 개선이 절실하다고 강조했다. 네트워크 정책 관점의 전환과 실질적 투자 인센티브가 필요하다는 입장이다.", "source": "kidd.co.kr", "date": "2026-09-03 17:40", "url": "https://kidd.co.kr/news/247290", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai 네트워크 정책 지원 촉구"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "SK텔레콤과 KT 등 국내 통신사들이 5G SA와 주파수 경매 변수 속에서 망 투자 재개 여부를 고심하고 있다. 기지국과 AI를 결합해 네트워크 운영 효율을 높이는 'AI-RAN' 정부 사업에 SK텔레콤이 참여하며 삼성전자, 에릭슨, 노키아 등과 실증을 추진한다. 차세대 통신 인프라 기술 확보를 위한 장비사와의 협력이 본격화되고 있다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 kt ai-ran 네트워크 투자"}, {"title": "Elliott Builds Stake in Deutsche Telekom Amid T-Mobile Merger Talks - Global Banking & Fin", "summary": "엘리엇 매니지먼트가 T-모바일 관련 합병 논의 속에서 도이치텔레콤의 지분을 대거 매입하며 영향력 행사에 나섰다. 주요 통신사 간 인수합병 및 제휴 전략에 행동주의 펀드가 개입하는 양상이다. 통신 업계의 전략적 재편에 변수로 작용할 수 있다.", "source": "Global Banking & Finance Review", "date": "2026-09-03 10:18", "url": "https://www.globalbankingandfinance.com/elliott-built-stake-deutsche-telekom-opposes-t-mobile-merger/", "category": "other", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분 확보 m&a 반대"}, {"title": "\"5G·6G도 국가전략자산\"… 통신 3사, AI 네트워크 투자 지원 촉구", "summary": "국회 정책 간담회에서 통신 3사는 5G SA, AI-RAN, 6G뿐만 아니라 해저케이블과 저궤도 위성까지 AI 인프라 범위에 포함하여 투자 지원을 해달라고 촉구했다. 국가전략자산으로서의 통신망 중요성이 강조됐다.", "source": "newscj.com", "date": "2026-09-02 17:36", "url": "https://www.newscj.com/news/articleView.html?idxno=3429661", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai 네트워크 투자 지원 촉구"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤은 통신 본업 회복과 함께 AI 가치가 부각되고 있다. 신규 주파수 할당, 5G 요금제 개편, 5G SA 상용화와 함께 AI 기지국 보급 정책이 논의될 가능성이 제기된다. AI 데이터센터와 기지국이 양대 성장 축으로 꼽힌다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "policy", "importance": 4, "wl": false, "topic": "sk텔레콤 ai 기지국 보급 정책"}, {"title": "대정전 시도, 공항에 폭발물 드론… 나토 흔드는 러 하이브리드戰", "summary": "독일 변전소에서 폭발과 송전선 장애가 발생해 인근 지역에 영향을 미쳤다. 또한 이란 연계 해커들이 미국의 상수도, 통신, 에너지 등 본토 인프라를 겨냥한 사이버 위협 활동을 벌이고 있다는 보도가 나왔다.", "source": "chosun.com", "date": "2026-09-04 00:49", "url": "https://www.chosun.com/international/international_general/2026/09/04/ZWWAWSMN7JG5HGHGZEIOZXAKP4/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "outage", "importance": 3, "wl": false, "topic": "변전소 폭발 및 송전선 장애"}, {"title": "VodafoneThree intros tiered 5G SA slicing portfolio for consumers, enterprises, critical s", "summary": "보다폰쓰리가 영국에서 소비자 및 기업을 위한 ‘패스트트랙’ 5G SA 슬라이싱 서비스 포트폴리오를 출시했다. 인터넷 TV 서비스와 결합하여 시장 공략을 강화하고 있다. 차별화된 5G 네트워크 성능을 앞세운 상용화 모델이다.", "source": "RCR Wireless", "date": "2026-09-04 00:21", "url": "https://rcrwireless.com/20260903/5g/vodafonethree-tiered-5g-sa-slicing-enterprises-critical-services", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 5g"}, {"title": "네이버, ‘보안 특화 AI모델’ 사업자로 선정", "summary": "과기정통부는 '사이버 보안 특화 인공지능 파운데이션 모델' 개발 사업자로 네이버클라우드 컨소시엄을 선정했다. 네이버의 뛰어난 기술력과 개발 경험이 높게 평가받았다.", "source": "joongang.co.kr", "date": "2026-09-04 00:01", "url": "https://www.joongang.co.kr/article/25458944", "category": "contract", "importance": 3, "wl": false, "topic": "네이버 사이버 보안 특화 ai 사업자 선정"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": "버진미디어O2(VMO2)가 북아일랜드 지역에 5G 단독모드(SA)를 도입했다. 이와 함께 SMS 블래스터 차단 기술 도입 및 오렌지의 프라이빗 5G 커버리지 협력 등이 추진된다. 유럽 통신사들의 망 고도화 경쟁이 가속화되고 있다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 3, "wl": true, "topic": "버진미디어o2 5g"}, {"title": "울산 시내버스, 차세대 와이파이로 싹 바꾼다", "summary": "울산시가 시내버스 전체 762대에 혼재되어 있던 노후 와이파이 장비를 철거하고 5G 백홀 기반의 차세대 '와이파이 7'로 전면 교체한다. 이를 통해 통신 품질을 대폭 향상시키고 실시간 장애 대응 효율성을 개선할 방침이다. 대중교통 이용객의 무선 네트워크 환경이 대폭 개선될 것으로 기대된다.", "source": "ujeil.com", "date": "2026-09-03 20:46", "url": "http://www.ujeil.com/news/articleView.html?idxno=391509", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 차세대 와이파이7 교체"}, {"title": "40 AI agents are already in use for clients. TELUS Digital will host demos at Dreamforce. ", "summary": "캐나다 통신사 텔러스(TELUS)의 자회사인 텔러스 디지털이 고객들을 위해 40개의 AI 에이전트를 이미 상용화하여 운영 중이라고 밝혔다. 드림포스(Dreamforce) 행사에서 관련 기술 데모를 시연할 예정이다. 통신 인프라와 결합된 AI 서비스 혁신 사례다.", "source": "Stock Titan", "date": "2026-09-03 19:45", "url": "https://www.stoc  {"title": "CHTR Stock Pops As Charter Leans Into Scale And Streaming Bundles - timothysykes.com", "summary": "차터커뮤니케이션즈가 규모의 경제 확보와 스트리밍 번들 상품 전략에 집중하면서 주가 상승을 기록했다. 미디어 및 통신 시장의 변화에 대응하기 위한 전략적 행보가 투자자들의 긍정적 평가를 받고 있다. 케이블 방송과 스트리밍 결합 상품이 핵심 경쟁력으로 작용하고 있다.", "source": "timothysykes.com", "date": "2026-09-03 04:03", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "other", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 규모 경제 및 스트리밍"}, {"title": "Spectrum COO Nick Jeffery Touts “The Great Cable Comeback” As He Assumes Charter Exec Post", "summary": "스펙트럼의 최고운영책임자(COO)인 닉 제프리가 차터커뮤니케이션즈의 주요 임원직을 맡으며 케이블 사업의 반등을 이끌고 있다. 그는 '위대한 케이블의 부활'을 강조하며 회사의 전략적 변화를 주도하고 있다. 경영진 개편을 통한 사업 경쟁력 강화 행보로 평가된다.", "source": "Yahoo Finance UK", "date": "2026-09-03 01:43", "url": "https://uk.finance.yahoo.com/news/spectrum-coo-nick-jeffery-touts-164309104.html", "category": "exec", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 임원 인사"}, {"title": "Why is Charter Communications stock up 6.9% today? - Traders Union", "summary": "차터커뮤니케이션즈의 주가가 하루 동안 6.9% 상승하며 강세를 보였다. 최근 추진 중인 사업 전략과 시장의 긍정적인 반응이 주가 상승을 이끌었다. 통신 섹터 내 주요 종목의 변동성을 보여준다.", "source": "Traders Union", "date": "2026-09-03 01:17", "url": "https://tradersunion.com/news/stocks/show/3197259-charter-surges-6-95percent-today-to/", "category": "other", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 주가 상승"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스는 연세대와 함께 로봇 및 드론 등 피지컬 AI 장비가 AI-RAN 시험망과 5G 망 사이를 이동할 때의 네트워크 연동 기술을 검증했다. 무선 환경이 급변하는 상황에서도 최적의 네트워크를 자동으로 선택하여 안정적인 연결을 유지하는 것을 목표로 한다. 차세대 통신망에서의 AI 인프라 활용 가능성을 높이는 계기가 된다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai-ran 기술 검증"}, {"title": "“삐, 공사장 탐지됐습니다”… AI가 미리 찾는 통신망 위험 - v.daum.net", "summary": "AI 기술을 접목하여 공사장 주변의 위험 요소를 미리 찾아내고 통신망 사고를 예방하는 지능형 관제 시스템이 주목받고 있다. 통신 인프라의 안정성을 높이기 위한 디지털 전환의 일환이다. 네트워크 운용 효율화에 기여하고 있다.", "source": "v.daum.net", "date": "2026-09-03 00:32", "url": "https://v.daum.net/v/20260903003222509", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 기반 통신망 위험 탐지"}, {"title": "Charter Communications announces resignation of CFO - Telecompaper", "summary": "차터커뮤니케이션즈가 최고재무책임자(CFO)의 사임 소식을 공식 발표했다. 주요 경영진의 이탈에 따라 향후 재무 전략 및 기업 운영에 변화가 예상된다. 통신사의 경영 안정성에 영향을 미칠 수 있는 인사 이슈다.", "source": "Telecompaper", "date": "2026-09-02 16:00", "url": "https://www.telecompaper.com/news/charter-communications-announces-resignation-of-cfo--1581381", "category": "exec", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 최고재무책임자 사임"}, {"title": "여의도 뒤덮을 100만 인파...LG유플러스, 이동기지국·AI로 통신 장애 막는다 - 소비자경제", "summary": "여의도 일대에 대규모 인파가 몰리는 행사를 앞두고 LG유플러스가 이동기지국을 배치하고 인공지능(AI) 기술을 활용해 통신 장애 예방에 총력을 기울이고 있다. 트래픽 폭주 상황에서 안정적인 통신 서비스를 제공하기 위한 선제적 조치다. 국내 통신사의 대형 행사 네트워크 관리 역량을 보여준다.", "source": "소비자경제", "date": "2026-09-02 12:52", "url": "http://www.dailycnc.com/news/articleView.html?idxno=244607", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 여의도 통신망 비상대응"}, {"title": "불꽃 터지는 순간 데이터 폭주…KT, 여의도 통신망 ‘비상 대응’ - ikoreadaily.co.kr", "summary": "여의도 행사 개최로 인한 데이터 트래픽 폭주에 대응하여 KT가 비상 대응 체계를 가동하고 통신망 품질 유지에 주력하고 있다. 대규모 인파 밀집 지역에서 무선 트래픽 분산과 실시간 모니터링을 통해 서비스 안정성을 확보한다. 주요 통신사의 현장 네트워크 지원 활동이다.", "source": "ikoreadaily.co.kr", "date": "2026-09-02 10:20", "url": "http://www.ikoreadaily.co.kr/news/articleView.html?idxno=839035", "category": "tech", "importance": 3, "wl": false, "topic": "kt 여의도 통신망 비상대응"}, {"title": "Down 41% and Still Yielding 5.6%: 1 Canadian Stock I’d Snap Up - The Globe and Mail", "summary": "주가가 고점 대비 하락했음에도 불구하고 5.6%의 높은 배당수익률을 유지하고 있는 캐나다 통신주 텔러스에 대한 투자 매력도가 분석되었다. 통신 섹터의 부진 속에서도 안정적인 배당 매력을 지닌 종목으로 평가받고 있다. 투자 관점에서 통신사 재무 구조를 조명했다.", "source": "The Globe and Mail", "date": "2026-09-02 10:13", "url": "https://www.theglobeandmail.com/investing/markets/stocks/T-T/pressreleases/4389438/down-41-and-still-yielding-5-6-1-canadian-stock-id-snap-up/", "category": "earnings", "importance": 3, "wl": false, "topic": "텔러스 주가 하락 및 배당수익률 분석"}, {"title": "스테이지파이브, 로플랫 인수…제4이통 대신 ‘AI 통신’으로 승부", "summary": "제4이통사 무산 이후 스테이지파이브가 로플랫을 인수하며 알뜰폰 기반 AI 통신 사업으로 전략을 선회했다. 과기정통부의 주파수 할당 대상 법인 선정 취소 이후 독자적인 사업 모델을 구축하려는 행보로 해석된다.", "source": "edaily.co.kr", "date": "2026-09-02 08:48", "url": "https://www.edaily.co.kr/News/Read?newsId=02794566645576184&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "other", "importance": 3, "wl": false, "topic": "스테이지파이브 로플랫 인수"}, {"title": "[르포] “유선망 위험 요소 직접 포착”…도로 위 AI 감시자, SKT ‘톺다’ 차량 타보니 - 헤럴드경제", "summary": "SK텔레콤이 도로 위에서 유선망의 위험 요소를 직접 포착하는 AI 감시 차량 '톺다'를 도입해 운영 현장을 공개했다. 첨단 AI 기술을 통해 케이블과 관로 등 통신 인프라의 잠재적 불량을 실시간으로 점검한다. 통신망 장애를 사전 차단하기 위한 혁신적인 인프라 관리 방식이다.", "source": "헤럴드경제", "date": "2026-09-02 08:31", "url": "https://mbiz.heraldcorp.com/article/10859567", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 톺다 차량 유선망 감시"}, {"title": "Can Telus (TSX:T) Sustain Dividends Amid Telecom Headwinds? - Kalkine Media", "summary": "통신 업계 전반의 역풍 속에서 캐나다 통신사 텔러스(TSX: T)가 안정적인 배당을 지속할 수 있을지에 대한 분석이 제기되었다. 거시경제적 부담과 자본적 지출(CAPEX) 압박 속에서도 주주환원 정책을 유지할 수 있을지 시장의 관심이 쏠린다. 통신사의 재무 건전성 및 주가 전망과 관련된 내용이다.", "source": "Kalkine Media", "date": "2026-09-02 04:40", "url": "https://kalkinemedia.com/ca/stocks/dividend/can-telus-tsxt-sustain-dividends-amid-telecom-headwinds", "category": "earnings", "importance": 3, "wl": false, "topic": "텔러스 배당 지속 가능성 분석"}, {"title": "\"맨홀이 탐지됐습니다\"…통신망 위험물 찾는 '매눈' - 네이트", "summary": "인공지능 기반의 영상 인식 기술을 통해 도로 위 맨홀 등 통신망 위험물과 이상 징후를 정확히 찾아내는 시스템이 운영되고 있다. 통신 인프라 손상으로 인한 대규모 장애를 예방하기 위한 지능형 감시 체계가 강화되고 있다. 통신사들의 망 관리 기술 고도화 사례다.", "source": "네이트", "date": "2026-09-02 04:00", "url": "https://m.news.nate.com/view/20260902n01225?mid=m02&list=recent&cpcd=", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 맨홀 탐지 통신망 보호"}, {"title": "Charter Communications stock slumps over 5% as bearish technical structure pressures price", "summary": "약세 흐름의 기술적 구조가 가격에 압력을 가하면서 차터커뮤니케이션즈의 주가가 5% 이상 급락했다. 투자 심리 위축과 차트상 저항선 작용 등이 원인으로 지목된다. 통신 종목의 단기 주가 조정을 나타낸다.", "source": "Traders Union", "date": "2026-09-04 01:55", "url": "https://tradersunion.com/news/stocks/show/3213523-charter-communications-slides-5-03percent-today/", "category": "other", "importance": 2, "wl": false, "topic": "차터커뮤니케이션즈 주가 하락세"}, {"title": "AT&T tops Ethernet Leaderboard amid ranking shakeup – Vertical Systems", "summary": "버티컬 시스템즈에 따르면 AT&T가 순위 변동 속에서도 미국 캐리어 이더넷 리더보드 1위 자리를 유지했다. 통신 시장 내 기업용 이더넷 부문에서 AT&T의 경쟁력이 다시 한번 입증됐다. 이번 평가는 주요 통신사들의 네트워크 서비스 역량을 비교하는 지표로 활용된다.", "source": "Light Reading", "date": "2026-09-03 23:44", "url": "https://www.lightreading.com/broadband/at-t-tops-ethernet-leaderboard-amid-ranking-shakeup-vertical-systems", "category": "other", "importance": 2, "wl": true, "topic": "at앤t 리더보드"}, {"title": "SmarTone chairman warns over revenue slide", "summary": "홍콩 통신사 스마톤의 회장이 수익 하락에 대해 경고하며 사업을 대폭 강화해야 한다고 밝혔다. 수익성 악화에 대응하기 위한 경영 전략 변화가 요구되는 상황이다. 홍콩 통신 시장의 치열한 경쟁 속에서 구조적 개선이 시급하다는 분석이다.", "source": "Light Reading", "date": "2026-09-03 23:37", "url": "https://www.lightreading.com/5g/smartone-chairman-warns-over-revenue-slide", "category": "earnings", "importance": 2, "wl": true, "topic": "스마톤 실적"}, {"title": "Minnesota operator taps MoCA Access tech to connect MDUs", "summary": "미국 미네소타의 통신 사업자인 쇼베르그가 인코액스, 노키아와 협력하여 MoCA Access 기술을 통해 다세대 주택(MDU)에 기가비트 속도를 구현했다. 지역 통신망 고도화를 위한 장비 공급 계약의 성격이다. 중소 통신사의 가입자망 품질 개선 사례로 평가된다.", "source": "Light Reading", "date": "2026-09-03 23:13", "url": "https://www.lightreading.com/broadband/minnesota-operator-taps-moca-access-tech-to-connect-mdus", "category": "contract", "importance": 2, "wl": true, "topic": "쇼베르그 수주"}, {"title": "양산부산대병원·양산시 AI 기반 예방적 통합돌봄 체계 구축", "summary": "양산시와 양산부 0215364923049", "category": "tech", "importance": 2, "wl": false, "topic": "기내 와이파이 확산 피코셀 기지국"}, {"title": "Cable One's carrier services unit beefs up wholesale ordering system", "summary": "케이블원의 도매 연결 서비스 부문인 스파크라이트 캐리어 서비스가 주문 관리 플랫폼을 간소화했다. ISP와 모바일 통신사를 위한 도매 연결성 제공 역량을 강화하기 위한 조치다. 인프라 운영 효율성 제고에 초점을 맞추고 있다.", "source": "Light Reading", "date": "2026-09-03 05:59", "url": "https://www.lightreading.com/cable-technology/cable-one-s-carrier-services-unit-beefs-up-wholesale-ordering-system", "category": "other", "importance": 2, "wl": true, "topic": "케이블원 도매"}, {"title": "Liberty Broadband stock holds steady as investors eye cable exposure - AD HOC NEWS", "summary": "투자자들이 케이블 사업 노출도에 주목하는 가운데 리버티브로드밴드 주가가 안정세를 유지하고 있다. 통신 및 미디어 인프라 투자 자산에 대한 시장의 평가가 반영된 결과다. 관련 업계 지분 구조와 주식 시장 반응을 다룬다.", "source": "AD HOC NEWS", "date": "2026-09-03 03:29", "url": "https://www.ad-hoc-news.de/boerse/news/nebenwerte/liberty-broadband-stock-holds-steady-as-investors-eye-cable-exposure/70045605", "category": "other", "importance": 2, "wl": false, "topic": "리버티브로드밴드 주가 안정세"}, {"title": "Grain Management wraps combo of Ritter and Great Plains to form 'Rightfiber'", "summary": "그레인 매니지먼트가 리터와 그레이트 플레인스의 합병을 완료하고 '라이트파이버'를 출범했다. 북미 지역 광섬유 통신망 통합을 위한 대형 딜의 일환이다. 지역 통신 시장의 경쟁 구도에 변화를 줄 것으로 보인다.", "source": "Light Reading", "date": "2026-09-03 02:29", "url": "https://www.lightreading.com/broadband/grain-management-wraps-combo-of-ritter-and-great-plains-to-form-rightfiber-", "category": "contract", "importance": 2, "wl": true, "topic": "그레인 매니지먼트 m&a"}, {"title": "Best ISPs of 2026: Our Top Picks Evaluated for Speed, Value and Price Transparency - CNET", "summary": "씨넷(CNET)이 2026년 최고의 인터넷 서비스 제공업체(ISP)들을 선정하여 속도, 가치, 가격 투명성 등을 기준으로 평가했다. 소비자들에게 통신 서비스 선택 가이드를 제공하는 내용이다. 주요 통신 및 인터넷 서비스 트렌드를 담고 있다.", "source": "CNET", "date": "2026-09-03 01:06", "url": "https://www.cnet.com/home/internet/best-internet-providers/", "category": "other", "importance": 2, "wl": false, "topic": "씨넷 인터넷 서비스 제공업체 평가 tes: VMO2 brings 5G standalone to Northern Ireland", "summary": "버진미디어O2(VMO2)가 북아일랜드 지역에 5G 단독모드(SA)를 도입했다. 이와 함께 SMS 블래스터 차단 기술 도입 및 오렌지의 프라이빗 5G 커버리지 협력 등이 추진된다. 유럽 통신사들의 망 고도화 경쟁이 가속화되고 있다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 3, "sid": "carrier", "topic": "버진미디어o2 5g"}, {"title": "울산 시내버스, 차세대 와이파이로 싹 바꾼다", "summary": "울산시가 시내버스 전체 762대에 혼재되어 있던 노후 와이파이 장비를 철거하고 5G 백홀 기반의 차세대 '와이파이 7'로 전면 교체한다. 이를 통해 통신 품질을 대폭 향상시키고 실시간 장애 대응 효율성을 개선할 방침이다. 대중교통 이용객의 무선 네트워크 환경이 대폭 개선될 것으로 기대된다.", "source": "ujeil.com", "date": "2026-09-03 20:46", "url": "http://www.ujeil.com/news/articleView.html?idxno=391509", "category": "tech", "importance": 3, "sid": "carrier", "topic": "울산시 시내버스 차세대 와이파이7 교체"}, {"title": "40 AI agents are already in use for clients. TELUS Digital will host demos at Dreamforce. ", "summary": "캐나다 통신사 텔러스(TELUS)의 자회사인 텔러스 디지털이 고객들을 위해 40개의 AI 에이전트를 이미 상용화하여 운영 중이라고 밝혔다. 드림포스(Dreamforce) 행사에서 관련 기술 데모를 시연할 예정이다. 통신 인프라와 결합된 AI 서비스 혁신 사례다.", "source": "Stock Titan", "date": "2026-09-03 19:45", "url": "https://www.stocktitan.net/news/TU/telus-digital-to-host-agentforce-industry-sessions-and-exclusive-b7osxigv9b4p.html", "category": "tech", "importance": 3, "sid": "carrier", "topic": "텔러스 ai 에이전트 서비스"}, {"title": "TELUS Digital to Host Agentforce Industry Sessions and Exclusive Events at Hotel Zetta Dur", "summary": "텔러스 디지털이 호텔 제타 투에서 개최되는 행사를 통해 에이전트포스(Agentforce) 산업 세션과 단독 이벤트를 주최한다. AI 에이전트 기술의 활용 사례와 기업 고객 대상 솔루션을 선보일 예정이다. 통신·디지털 서비스 기업의 기술 확장 전략을 보여준다.", "source": "Yahoo Finance", "date": "2026-09-03 19:45", "url": "https://finance.yahoo.com/technology/ai/articles/telus-digital-host-agentforce-industry-104500152.html", "category": "tech", "importance": 3, "sid": "carrier", "topic": "텔러스 디지털 에이전트포스 세션 개최"}, {"title": "테슬라 '사이버캡' 공개 운행 시작…일론 머스크식 자율주행 전략, 성공...", "summary": "테슬라가 로보택시 서비스인 사이버캡에 스타링크 위성 연결을 const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
