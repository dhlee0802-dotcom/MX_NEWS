ar itch", "summary": "도이치텔레콤과 에릭슨이 독일 함부르크의 컨테이너 터미널 알텐베르더에 프라이빗 5G 네트워크를 구축했다. 이는 7년간 이어진 양사의 셀룰러 협력 실험의 연장선이다. 산업용 5G가 현장에서 어떻게 적용되는지 보여주는 사례로 평가된다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 4, "wl": true, "topic": "에릭슨 프라이빗5g"}, {"title": "Huawei latest SingleRAN 22.1 launch targets the Agentverse - Total Telecom", "summary": "화웨이가 에이전트버스(Agentverse)를 타겟으로 한 최신 'SingleRAN 22.1' 솔루션을 공식 출시했다. 무선 접속망 제품군에 AI와 자율주행 기능을 결합하여 통신사의 망 운영 효율성을 극대화하는 것을 목표로 한다. 글로벌 경쟁사의 핵심 플래그십 소프트웨어 및 장비 업그레이드 발표다. 삼성전자를 비롯한 경쟁사들의 기술 개발 방향에 시사하는 바가 크다.", "source": "Total Telecom", "date": "2026-09-04 22:16", "url": "https://totaltele.com/huawei-latest-singleran-22-1-launch-targets-the-agentverse/", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 싱글란"}, {"title": "BSNL 4G network carries 6 PB data every day: C-DoT’s RK Upadhyay", "summary": "테이샤스 네트워크가 RAN 공급사로 참여하고 C-DoT가 코어 제공사로 나선 TCS 컨소시엄이 BSNL의 인도 전역 자국산 4G 네트워크 구축을 진행 중이다. 해당 네트워크는 하루 6PB의 트래픽을 처리하며 인도 통신 인프라 국산화의 주요 성과로 자리잡았다.", "source": "ET Telecom", "date": "2026-09-04 19:11", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/bsnl-4g-network-carrying-nearly-6-pb-data-daily-c-dots-rk-upadhyay/133759314", "category": "contract", "importance": 4, "wl": true, "topic": "bsnl 4g 네트워크"}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - Mobile Europe", "summary": "노키아가 사우디아라비아에 AI 중심의 연구개발(R&D) 센터를 신설했다. 중동 지역에서 AI 기반 네트워크 솔루션 개발을 가속화하고 현지 파트너십을 강화하기 위한 전략이다. 글로벌 거점 다변화를 통해 기술 주도권을 확보하려는 의도가 담겨 있다. 경쟁사들의 중동 및 신흥국 시장 공략 경쟁이 치열해지고 있음을 보여준다.", "source": "Mobile Europe", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 r&d"}, {"title": "Nokia may exit the consumer smartphone market - Zamin.uz", "summary": "노키아가 소비자 스마트폰 시장에 하여 부가가치를 높였다. 그룹 내 프로바이더 경쟁 해소와 NTT 광콜라보 활용을 통한 전국 사업 효율화 및 확대를 노린다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "contract", "importance": 4, "wl": true, "topic": "kddi au히かりプラス 전략"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "summary": "인도 통신망에 구축된 기존 중국산 통신장비에 대한 리플레이스(Rip-and-Replace) 검토가 진행되고 있다. 옴디아의 렘 파스칼 분석가에 따르면 중국산 장비는 수년 동안 인도 통신망에서 운영되어 왔다. 안보 및 공급망 재편 관점에서 주목받고 있다.", "source": "RCR Wireless", "date": "2026-09-04 23:22", "url": "https://rcrwireless.com/20260904/carriers/india-replace-chinese-equipment", "category": "policy", "importance": 4, "wl": true, "topic": "인도 중국산 장비"}, {"title": "楽天モバイル、グループID未連携なら強制解約 11月末期限 消費者保護から総務省調査 - 産経ニュース", "summary": "라쿠텐 모바일이 그룹 ID 미연계 가입자를 강제 해지하기로 한 방침에 대해 소비자 보호 측면의 우려가 제기되면서 총무성이 직접 조사에 나섰다. 통신사의 약관 및 가입자 권익 침해 여부를 다루는 규제 기관의 개입 사례다.", "source": "産経ニュース", "date": "2026-09-04 20:49", "url": "https://www.sankei.com/article/20260904-CJJM5QIHEFOKVMOFV5ACZTVFTI/", "category": "policy", "importance": 4, "wl": false, "topic": "라쿠텐모바일 아이디연계"}, {"title": "Verizon Layoffs Hit 16,600 as Record Quarter Funds the Cuts - FinanceFeeds", "summary": "버라이즌이 사상 최대 분기 실적을 기록한 자금을 바탕으로 1만 6,600명에 달하는 대규모 감원 및 구조조정을 단행했다. 호실적 이면에 비용 절감과 효율성 극대화를 위한 고강도 인력 감축이 포함되어 있음을 보여준다. 대형 통신사의 경영 전략 변화를 시사하는 중대 뉴스다.", "source": "FinanceFeeds", "date": "2026-09-04 19:17", "url": "https://financefeeds.com/verizon-layoffs-16600-jobs-record-quarter-cost-cuts/", "category": "earnings", "importance": 4, "wl": false, "topic": "버라이즌 구조조정"}, {"title": "Elliott wants to scuttle Deutsche Telekom's T-Mobile US merger - Telecoms", "summary": "엘리엇 펀드가 도이치텔레콤과 T-Mobile US 간의 미국 합병 건을 저지하기 위해 목소리를 높이고 있다. 대규모 M&A 성사를 두고 주주와 경영진 간의 갈등이 심화되는 양상이다. 글로벌 통신 업계의 대형 자본 거래와 지배구조 재편에 중대한 변수로 작용하고 있다.", "source": "Telecoms", "date": "2026-09-04 17:33", "url": "https://www.telecoms.com/operator-ecosystem/elliott-wants-to-scuttle-deutsche-telekom-s-t-mobile-us-merger", "category": "policy", "importance": 4, "wl": false, "topic": "도이치텔레콤 m&a"}, {"title": "Telcos oppose Trai’s proposed 5G slicing service quality rules", "summary": "인도 통신사들이 TRAI의 5G 슬라이싱 서비스 품질 규정에 대해 기술적으로 비현실적이며 심각한 운영 부담을 초래한다고 반발했다. 규제 당국과 업계 간의 마찰이 지속되고 있다.", "source": "Mint", "date": "2026-09-04 16:20", "url": "https://www.livemint.com/industry/telecom/reliance-jio-airtel-vodafone-idea-trai-5g-slicing-norms-service-quality-rules-telecom-companies-india-11788502641215.html", "category": "policy", "importance": 4, "wl": true, "topic": "통신사 5g 슬라이싱 반대"}, {"title": "KDDI achieves 3.6 Gbps outdoor transmission in 7 GHz 6G candidate band - Telecompaper", "summary": "일본 KDDI가 6G 후보 대역인 7 GHz 대역에서 야외 3.6 Gbps 전송에 성공했다. 차세대 이동통신 상용화를 위한 고주파수 대역 기술 검증을 선도적으로 진행하고 있다. 글로벌 통신사들의 6G 기술 R&D 경쟁력을 보여주는 대표적 성과다.", "source": "Telecompaper", "date": "2026-09-04 15:13", "url": "https://www.telecompaper.com/news/kddi-achieves-36-gbps-outdoor-transmission-in-7-ghz-6g-candidate-band--1581713", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 릴라이언스 지오가 40억 달러 규모의 대형 IPO를 나트라디-디왈리 시즌에 맞춰 추진한다. 이르면 다음 주 로드쇼를 시작할 수 있으며 인도 통신 시장의 거대 자금 조달 이벤트로 주목받고 있다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "contract", "importance": 4, "wl": true, "topic": "jio 4억달러 ipo"}, {"title": "Verizon Waives Charges for Hurricane Lowell, Prepares Network in Hawai'i - Yahoo Finance U", "summary": "미국 통신사 버라이즌이 허리케인 로웰(Lowell)의 영향에 대비해 하와이 지역 네트워크를 점검하고 고객 요금 면제 조치를 단행했다. 자연재해 상황에서 통신사의 신속한 망 안정화 조치와 가입자 지원 활동을 보여준다. 비상 상황 대응을 위한 통신 인프라 운영 역량을 확인할 수 있는 사례다.", "source": "Yahoo Finance UK", "date": "2026-09-06 06:29", "url": "https://uk.finance.yahoo.com/news/verizon-waives-charges-hurricane-lowell-212900457.html", "category": "contract", "importance": 3, "wl": false, "topic": "버라이즌 재난지원"}, {"title": "통신3사 AI 데이터센터 확장에 탄소배출 관리 부담 커진다, 재생에너지...", "summary": "SK텔레콤은 안정적 5G 서비스를 제공하기 위한 통신 장비 증설로 전력 사용량과 이에 따른 간접배출량이 늘어난 점을 배출량 증가 원인으로 들었다. 향후 AIDC 사업이 본격적으로 확대되면 이런 부담은 더 커질...", "source": "businesspost.co.kr", "date": "2026-09-06 06:00", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=446333", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "T-Mobile CEO appears to have given up on the postpaid crown as he talks up new categories ", "summary": "T-Mobile CEO가 후불 가입자 시장 1위 타이틀 경쟁에서 한 발 물러서는 대신 새로운 사업 카테고리 발굴과 홈 인터넷 등 신사업 확장에 무게를 두고 있다. 가입자 양적 성장보다 질적 수익성 및 신사업 다각화에 집중하겠다는 전략적 전환을 의미한다.", "source": "PhoneArena", "date": "2026-09-06 01:32", "url": "https://www.phonearena.com/news/t-mobile-losing-share-value-under-srini-gopalan_id183107", "category": "tech", "importance": 3, "wl": false, "topic": "티모바일 전략"}, {"title": "After 10 years of India feat, Jio sets its sights on global market - The Economic Times", "summary": "인도 시장에서 10년간 성공을 거둔 릴라이언스 지오가 글로벌 시장 진출을 본격적으로 추진하고 있다. 해외 통신 및 디지털 인프라 시장 진출을 목표로 하는 경영 전략이다. 글로벌 통신 시장의 경쟁 구도에 변화를 줄 수 있는 동향이다.", "source": "The Economic Times", "date": "2026-09-06 01:21", "url": "https://m.economictimes.com/industry/telecom/telecom-news/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market/articleshow/133808067.cms", "category": "exec", "importance": 3, "wl": false, "topic": "릴라이언스지오 글로벌 진출"}, {"title": "楽天モバイル、10月以降の国内ローミング継続を再案内 - blog of mobile", "summary": "라쿠텐 모바일이 10월 이후 국내 로밍 서비스의 지속 운영 계획을 재차 안내하며 가입자들의 혼란을 줄이고자 했다.", "source": "blog of mobile", "date": "2026-09-05 23:53", "url": "http://blogofmobile.com/article/182651", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐모바일 로밍종료"}, {"title": "楽天モバイルが再びau回線のローミングを10月以降も継続することを案内！KDDIと現在も詰めの協議を実施中。十分なカバーエリアは縮小へ - s-max.jp", "summary": "라쿠텐모바일이 10월 이후에도 au(KDDI) 회선 로밍을 계속 유지하기 위해 KDDI와 최종 협의를 진행 중이라고 밝혔다. 자 AI 데이터센터로…통신사 '변신' 시작됐다 - 연합뉴스", "summary": "기지국이 AI 데이터센터로 변모하는 통신사들의 새로운 사업 전략 변화를 조명했다. 통신 인프라와 AI 계산 능력을 결합하여 새로운 수익 모델을 창출하려는 글로벌 트렌드를 다루고 있다. 통신사들의 인프라 투자 방향이 단순 트래픽 전송에서 AI 컴퓨팅으로 확장되고 있음을 보여준다. 장비 공급업체들의 기술 대응 전략에도 큰 시사점을 준다.", "source": "연합뉴스", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR20260904023000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai"}, {"title": "T-Mobile appoints Shell veteran as next CFO - CFO Dive", "summary": "T-Mobile이 셸 출신의 베테랑 임원을 새로운 최고재무책임자(CFO)로 공식 임명했다. 리더십 개편을 통해 재무 건전성을 다지고 다음 단계의 기업 성장을 도모할 계획이다. 주요 통신사의 임원 인사이동 소식이다.", "source": "CFO Dive", "date": "2026-09-05 05:29", "url": "https://www.cfodive.com/news/tmobile-shell-ge-vernova-veteran-cfo-telecom-merger/829726/", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 경영진"}, {"title": "AT&T Prepares for Hurricane Lowell - AT&T Newsroom", "summary": "미국 통신사 AT&T가 허리케인 로웰 내습에 대비하여 비상 네트워크 점검 및 인프라 보호 조치를 완료했다. 악천후 속에서 가입자들의 통신망 연결성을 유지하기 위한 사전 대응 체계를 가동 중이다. 재난 대비 통신 인프라 운영의 중요성을 보여주는 사례다.", "source": "AT&T Newsroom", "date": "2026-09-05 03:33", "url": "https://about.att.com/pages/disaster_relief/2026/hurricane-lowell.html", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 재난지원"}, {"title": "Spectrum-Cox Merger Update: Will Your Bill And Service Change? - CableTV.com", "summary": "스펙트럼(Charter)과 콕스(Cox) 간의 합병 추진에 따른 요금 및 서비스 변화 전망을 다룬 기사다. 케이블 통신 업계의 대형 M&A 진행 상황을 보여주며 시장 경쟁 구도에 영향을 미친다.", "source": "CableTV.com", "date": "2026-09-05 03:19", "url": "https://www.cabletv.com/news/cox-spectrum-merger-will-price-increase", "category": "contract", "importance": 3, "wl": false, "topic": "스펙트럼 콕스 합병"}, {"title": "TELUS (TSX:T): Dividend Aristocrat Exit And AI Pivot Explained - Kalkine Media", "summary": "캐나다 통신사 텔러스가 배당 귀족주 타이틀에서 벗어나 AI 중심의 사업 피벗(전환)을 추진하고 있는 전략적 배경을 설명한다. 전통 통신 인프라에서 신사업으로의 경영 체질 개선을 보여준다.", "source": "Kalkine Media", "date": "2026-09-05 02:24", "url": "https://kalkinemedia.com/ca/stocks/communication/telus-tsxt-dividend-aristocrat-exit-and-ai-pivot-explained", "category": "exec", "importance": 3, "wl": false, "topic": "텔러스 배당 정책 및 ai 피벗"}, {"title": "T-Mobile hands CFO reins to ex-Shell exec Jessica Uhl, as Osvaldik retires", "summary": "티모바일은 피터 오스발딕 최고재무책임자(CFO)의 퇴임에 따라 전 셸 임원인 제시카 울을 후임 CFO로 선임했다. 피터 오스발딕은 내년 2월 자리에서 물러나 2027년 7월 최종 은퇴할 예정이다. 이번 인사는 사전에 계획된 일정에 맞춰 진행되었다. 티모바일의 재무 리더십 변화가 향후 경영 전략에 미칠 영향이 주목된다.", "source": "Light Reading", "date": "2026-09-05 01:12", "url": "https://www.lightreading.com/business-transformation/t-mobile-hands-cfo-reins-to-ex-shell-exec-jessica-uhl-as-osvaldik-retires", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원"}, {"title": "AT&T Delivers Value, Reliability, and Confidence with New Samsung Galaxy S26 FE - AT&T New", "summary": "AT&T가 삼성전자의 신형 스마트폰 '갤럭시 S26 FE' 출시와 연계하여 신뢰성과 가치를 강조하는 번들 상품 및 가입 프로그램을 선보였다. 주요 통신사의 단말 라인업 확보와 고객 유치 전략을 보여준다. 단말 판매와 연동된 통신사 영업 활동의 일환이다.", "source": "AT&T Newsroom", "date": "2026-09-04 23:00", "url": "https://about.att.com/story/2026/samsung-galaxy-s26-fe.html", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 단말번들"}, {"title": "Deutsche Telekom eyes synergies from Greek move - Mobile World Live", "summary": "도이치텔레콤이 그리스 자회사(OTE)의 리브랜딩과 연계하여 현지 시장에서의 사업 시너지 창출을 본격적으로 추진한다. 유럽 지역 통신사의 그룹 차원 경영 통합 전략이다.", "source": "Mobile World Live", "date": "2026-09-04 21:13", "url": "https://www.mobileworldlive.com/europe/deutsche-telekom-eyes-synergies-from-greek-move/", "category": "contract", "importance": 3, "wl": false, "topic": "도이치텔레콤 그리스 사업 시너지"}, {"title": "Viettel Secures 240 MHz Spectrum for Dominican Republic Network Launch - Telecom Review As", "summary": "비텔(Viettel)이 도미니카 공화국 네트워크 런칭을 위해 240 MHz 대역의 주파수를 확보했다. 신규 시장 진출과 상용화 서비스를 위한 필수 주파수 자원을 선점하며 인프라 구축에 착수했다. 글로벌 통신사의 해외 영토 확장 사례다.", "source": "Telecom Review Asia", "date": "2026-09-04 17:54", "url": "https://www.telecomreviewasia.com/news/network-news/30191-viettel-secures-240-mhz-spectrum-for-dominican-republic-network-launch/", "category": "contract", "importance": 3, "wl": false, "topic": "비텔 주파수할당"}, {"title": "“국민 누구나 AI를 쓴다”…정부 ‘모두의 AI’ 출격, SKT·카카오·KT 연내 서비스 경쟁 - 인공지능신문", "summary": "정부의 ‘모두의 AI’ 출격에 맞춰 SK텔레콤, 카카오, KT 등이 연내 서비스 경쟁에 나선다는 내용이다. 통신사들의 AI 서비스 진출 동향을 다룬다.", "source": "인공지능신문", "date": "2026-09-04 17:17", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41767", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai"}, {"title": "Vodafone sets out to ‘disrupt’ EE-backed ESN with critical infra network slicing - telcoti", "summary": "보다폰이 EE가 지원하는 영국의 공공안전통신망(ESN)에 맞서 비판적인 시각을 제기하며 핵심 인프라 네트워크 슬라이싱 서비스를 '디스럽트(파괴)'하겠다고 선언했다. 공공 통신망 시장에서의 경쟁 격화와 신기술 도입 경쟁을 보여준다.", "source": "telcotitans.com", "date": "2026-09-04 17:06", "url": "https://www.telcotitans.com/vodafonewatch/vodafone-sets-out-to-disrupt-ee-backed-esn-with-critical-infra-network-slicing/10840.article", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 비판 네트워크 슬라이싱"}, {"title": "auの通信品質を最優先！KDDIが楽天モバイルへの回線貸し出しを9月末で終了、自社サービスの快適化へ - dxmagazine.jp", "summary": "KDDI가 자사 서비스의 쾌적성 향상을 위해 9말 자로 라쿠텐 모바일에 대한 네트워크 회선 대여(로밍)를 종료하고 자원 집중을 도모한다. 일본 이동통신 시장 내 망 임대 계약 종료에 따른 사업자 간 경쟁 구도 변화를 보여준다.", "source": "dxmagazine.jp", "date": "2026-09-04 17:01", "url": "https://dxmagazine.jp/news/2629ko73re-01-03-04/", "category": "contract", "importance": 3, "wl": false, "topic": "kddi 라쿠텐로밍종료"}, {"title": "[Biz&Law] 삼성전자 , 美서 5G 기지국 특허침해 피소", "summary": "캐나다의 특허관리전문회사(NPE)인 원고는 삼성전자 가 자사 특허를 침해한 네트워크 제품을 미 통신사 버라이즌(Verizon)에 공급했다고 주장했다. 3일(현지시간) 미국 텍사스주(州) 동부 연방지방법원에 따르면...", "source": "the-biz.co.kr", "date": "2026-09-04 17:00", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=727390", "category": "contract", "importance": 3, "wl": false, "topic": ""}, {"title": "Jio IPO Timeline Surfaces, Could Happen in Festive Season - TelecomTalk", "summary": "릴라이언스 지오의 기업공개(IPO) 타임라인이 축제 시즌에 맞춰 가시화되고 있다는 전망이다. 대형 통신사의 상장 추진은 자본 시장과 투자 전략에 큰 파장을 미칠 수 있는 사안이다.", ];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
