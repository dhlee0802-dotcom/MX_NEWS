<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

 05:15", "url": "https://rollingout.com/2026/09/03/verizon-outage-sparks-fresh-complaints/", "category": "outage", "importance": 3, "wl": false, "topic": "버라이즌 전국적 통신 장애 불만 폭발"}, {"title": "Is Verizon having an outage right now? Verizon network outage impacts customers - Asbury P", "summary": "버라이즌의 네트워크 장애가 발생하여 고객들이 서비스 이용에 차질을 빚었다. 현재 장애 상황과 영향 범위에 대한 확인이 이어지고 있다. 통신사 네트워크 중단에 따른 현장 상황 보도다.", "source": "Asbury Park Press", "date": "2026-09-04 04:37", "url": "https://www.app.com/story/news/2026/09/03/is-verizon-having-issues-today-is-verizon-service-down/91597777007/", "category": "outage", "importance": 3, "wl": false, "topic": "버라이즌 네트워크 장애 발생"}], "satellite": [{"title": "Japan's Rakuten to debut satellite-to-cell service with Starlink rival AST - Nikkei Asia", "summary": "일본 라쿠텐 모바일이 스타링크의 라이벌인 AST 스페이스모바일과 손잡고 위성-휴대전화 직접 통신(Satellite-to-Cell) 서비스를 일본에서 본격 선보인다. 지상망 공백을 메우는 차세대 통신 서비스를 준비한다. 일본 통신사의 위성통신 도입 제휴 소식이다.", "source": "Nikkei Asia", "date": "2026-09-05 01:20", "url": "https://asia.nikkei.com/business/telecommunication/japan-s-rakuten-to-debut-satellite-to-cell-service-with-starlink-rival-ast", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐 모바일 ast 스페이스모바일 위성통신 도입"}, {"title": "SpaceXの次世代「Starlink V3」、通信容量を約10倍に Starshipでの本格展開近づく - 財経新聞", "summary": "스페이스X가 차세대 'Starlink V3'를 통해 통신 용량을 약 10배 확대할 계획이다. 대형 로켓인 스타십을 활용한 본격적인 발사 전개가 가까워지고 있으며, 저궤도 위성 통신 서비스의 성능이 크게 향상될 것으로 기대된다. 글로벌 위성 통신 시장에서의 경쟁 구도에 큰 영향을 미칠 전망이다. 스페이스X의 위성 인프라 확장 가속화를 보여주는 핵심 발표이다.", "source": "財経新聞", "date": "2026-09-04 20:39", "url": "https://www.zaikei.co.jp/amp/article/20260904/868716.html", "category": "tech", "importance": 4, "wl": false, "topic": "스타링크 차세대 스타링크v3"}, {"title": "\"운전대 없는 사이버캡 뜬다\"...테슬라(TSLA), 주가 5.4% 급등 환", "summary": "안전성 시험과 스페이스X(SpaceX)의 스타링크 (Starlink) 협력을 담은 홍보 영상도 공개했지만 사이버캡의 대규모 배치 일정과 구체적인 사업 계획은 제시하지 않았다. 월가의 시선은 사이버캡을 얼마나 빠르게 확대할 수...", "source": "coinreaders.com", "date": "2026-09-04 20:22", "url": "http://coinreaders.com/256609", "category": "other", "importance": 4, "wl": false, "topic": ""}, {"title": "사지마비 환자가 장갑 움직였다…中 ‘뇌에 심는 칩’ 세계 첫 시판 승...", "summary": "중국 정부가 뇌-컴퓨터 인터페이스(BCI) 기술을 양자 기술, 생물제조, 6세대 이동통신(6G) 등과 함께 국가 차원의 '미래산업'으로 지정하고 시판 승인 및 산업정책으로 강력히 육성하고 있습니다. 연구부터 제조, 시장 진입까지 국가적 지원이 집중됩니다. 차세대 통신 및 첨단 기술 패권 경쟁에서 중국의 정책적 드라이브를 보여줍니다. 글로벌 6G 기술 경쟁 구도에 중대한 영향을 미칩니다.", "source": "newsis.com", "date": "2026-09-04 15:53", "url": "https://www.newsis.com/view/NISX20260904_0003776938", "category": "tech", "importance": 4, "wl": false, "topic": "중국 bci 6g 미래산업"}, {"title": "KDDI achieves 3.6 Gbps outdoor transmission in 7 GHz 6G candidate band - Telecompaper", "summary": "KDDI가 6G 통신 후보 대역인 7GHz 주파수 대역을 활용해 야외 환경에서 세계 최고 수준인 하단 3.6Gbps 전송 속도를 달성하는 데 성공했다. 차세대 이동통신 기술 상용화를 위한 핵심 기술을 확보했다. 통신사의 6G 후보대역 실증 성과다.", "source": "Telecompaper", "date": "2026-09-04 15:31", "url": "https://www.telecompaper.com/news/kddi-achieves-36-gbps-outdoor-transmission-in-7-ghz-6g-candidate-band--1581713", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 7ghz 6g 후보대역 3.6gbps 실증"}, {"title": "“2만9000원→0원” 비행기서 유튜브 공짜로 본다…대한항공, 이달 중 ‘스타링크’ 도입 - 서울경제", "summary": "대한항공이 이달 중 저궤도 위성통신 서비스인 '스타링크'를 도입하여 기내 와이파이를 무료로 제공한다고 밝혔습니다. 항공기 내 통신 환경을 혁신하는 대규모 위성통신 서비스 채택 사례입니다. 스페이스X의 위성인터넷이 상용 항공 시장으로 영토를 확장하는 중요한 이벤트를 보여줍니다. 위성통신 기반의 B2B 시장 확대와 글로벌 경쟁 구도에 영향을 미칩니다.", "source": "서울경제", "date": "2026-09-04 10:23", "url": "https://m.sedaily.com/amparticle/20087135", "category": "contract", "importance": 4, "wl": false, "topic": "대한항공 스타링크"}, {"title": "国内初「空飛ぶ基地局」、試験成功…ソフトバンクが商用化へ - ニュースイッチ by 日刊工業新聞社", "summary": "소프트뱅크가 일본 국내 최초로 성층권 HAPS를 이용한 '하늘 나는 기지국' 통신 시험 비행 및 스마트폰 통신 실증에 성공했다. 상용화를 앞두고 재난 대비 통신망 확보에 기대를 모은다. 통신사의 차세대 공중 기지국 실증 보도다.", "source": "ニュースイッチ by 日刊工業新聞社", "date": "2026-09-04 06:02", "url": "https://newswitch.jp/p/50177", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 국내 최초 하늘 나는 기지국 실증 성공"}, {"title": "Satellite-to-Phone Race 2026: Starlink, AST SpaceMobile and Amazon Leo Battle for Telecom ", "summary": "2026년 위성-휴대전화 직접 통신 시장을 선점하기 위해 스타링크, AST 스페이스모바일, 아마존 레오 등이 치열한 각을 세우고 있다. 글로벌 위성통신 주도권을 잡기 위한 경쟁이 본격화되는 양상이다. 차세대 위성통신 시장 동향 보도다.", "source": "TelecomLead", "date": "2026-09-04 02:58", "url": "https://telecomlead.com/satellite/satellite-to-phone-race-2026-starlink-ast-spacemobile-and-amazon-leo-battle-for-telecom-revenue-127597", "category": "competitor", "importance": 4, "wl": false, "topic": "스타링크 ast스페이스모바일 위성통신 경쟁"}, {"title": "空飛ぶ基地局の試験成功 ソフトバンク、実用間近 - au Webポータル", "summary": "소프트뱅크의 성층권 공중 기지국 실험이 성공을 거두며 실용화 단계가 눈앞으로 다가왔다. 지상 기지국을 대체하거나 보완할 미래 통신 수단으로 주목받는다. 통신사 신기술 상용화 임박 소식이다.", "source": "au Webポータル", "date": "2026-09-04 01:54", "url": "https://article.auone.jp/3e001fa7-984f-49ae-9ecc-e8a82bfc347a", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 공중 기지국 실용화 임박"}, {"title": "ソフトバンク、成層圏HAPSでスマホ通信を国内初実証 災害時の「空飛ぶ基地局」商用化へ - 東京報道新聞", "summary": "소프트뱅크가 성층권 HAPS를 이용해 일본 최초로 일반 스마트폰과의 통신 실증에 성공하며 재난 시 '하늘 나는 기지국' 상용화에 청신호를 켰다. 미래 모바일 통신 서비스의 지평을 넓히는 성과다. 통신사의 HAPS 기술 실증 보도다.", "source": "東京報道新聞", "date": "2026-09-03 23:52", "url": "https://tokyonewsmedia.com/archives/27425", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 haps 스마트폰 통신 국내 최초 실증"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크는 고치현 무로토곶 앞바다에서 성층권 통신 플랫폼인 HAPS(고고도 통신 플랫폼)의 성층권 비행 시험을 완료했다. 이번 시험에는 드론과 엣지 컴퓨팅 시스템 간의 원활한 연결성을 검증하기 위한 종합적인 테스트가 포함됐다. 회사는 2027년 상용화를 목표로 관련 기술 개발에 박차를 가하고 있다.", "source": "Light Reading", "date": "2026-09-03 23:20", "url": "https://www.lightreading.com/satellite/softbank-completes-stratospheric-haps-trial-eyes-2027-deployment", "category": "tech", "importance": 4, "wl": true, "topic": "소프트뱅크 haps 성층권 비행 시험"}, {"title": "ソフトバンク、「空飛ぶ基地局」ＨＡＰＳで日本初の通信試験 - kabu-ir.com", "summary": "소프트뱅크가 HAPS(성층권 통신 플랫폼)를 활용하여 일본 최초의 통신 시험을 성공적으로 마쳤다. 주식 시장과 업계에 혁신적인 네트워크 커버리지 확장 가능성을 제시했다. 통신사의 성층권 통신 기술 시험 성공 보도다.", "source": "kabu-ir.com", "date": "2026-09-03 20:42", "url":  "source": "zdnet.co.kr", "date": "2026-09-05 06:01", "url": "https://zdnet.co.kr/view/?no=20260904222208", "category": "other", "importance": 2, "wl": false, "topic": ""}], "competitor": [{"title": "7GHz帯で世界最高水準の3.6Gbpsを達成！KDDIとSamsungが挑む6G＆AI時代の大容量通信実証 - DXマガジン", "summary": "KDDI와 삼성전자가 협력하여 7GHz 대역에서 세계 최고 수준인 하향 3.6Gbps 전송 속도를 달성하며 6G 및 AI 시대의 대용량 통신 기술 실증에 성공했다. 차세대 네트워크 표준과 장비 성능을 입증하는 핵심적인 협력 성과다. 삼성전자 네트워크사업부가 직접 당사자인 대형 기술 실증 보도다.", "source": "DXマガジン", "date": "2026-09-03 19:59", "url": "https://dxmagazine.jp/news/2640ko109/", "category": "tech", "importance": 5, "wl": false, "topic": "kddi 삼성 7ghz 6g ai 시대 대용량 통신 실증"}, {"title": "[Biz&Law] 삼성전자 , 美서 5G 기지국 특허침해 피소", "summary": "캐나다 NPE가 미국 텍사스주 동부 연방지방법원에 삼성전자가 미국 통신사 버라이즌에 공급한 5G 네트워크 제품이 자사 특허를 침해했다고 제소했습니다. 대형 통신장비 공급 건과 연계된 글로벌 특허 분쟁 소식입니다. 미국 시장에서의 네트워크 장비 사업 전개에 법적 리스크 요인으로 작용할 수 있습니다. 경영진 보고 가치가 높은 중요 특허 소송입니다.", "source": "the-biz.co.kr", "date": "2026-09-04 17:00", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=727390", "category": "contract", "importance": 4, "wl": false, "topic": "삼성전자 특허 피소"}, {"title": "삼성전자 , 스마트폰 주 기판 'HDI' 조달 골머리", "summary": "삼성전자 MX·네트워크 사업부가 2분기 7350억원 적자를 기록한 데 이어 연간 4130억원 적자 전망이 나오는 가운데 스마트폰 주 기판 조달에 골머리를 앓고 있습니다. 네트워크사업부를 포함한 실적 부진과 부품 조달 어려움을 다루고 있습니다. 사업부의 재무 건전성과 공급망 관리 이슈를 보여주는 중요한 경영 정보입니다. 경영진 보고 가치가 높은 실적 및 공급망 관련 보도입니다.", "source": "zdnet.co.kr", "date": "2026-09-04 16:58", "url": "https://zdnet.co.kr/view/?no=20260904160208", "category": "earnings", "importance": 4, "wl": false, "topic": "삼성전자 mx 네트워크 실적"}, {"title": "퀄컴 COO \"AI 시대 고성능·저전력 핵심\"…中과 6G 협력 확대 기대", "summary": "퀄컴의 최고운영자(COO)가 중국을 비롯한 글로벌 파트너들과 6G 표준 및 기술 협력을 확대할 것이라고 밝혔습니다. AI 시대 고성능·저전력 구현을 위해 글로벌 표준화 과정에서 중국 시장과의 공조를 강화하겠다는 의지입니다. 글로벌 반도체 및 통신 기술 리더의 차세대 6G 전략 방향을 보여줍니다. 6G 표준 선점을 위한 국제적 협력 구도를 시사합니다.", "source": "the-today.com", "date": "2026-09-04 16:52", "url": "https://www.the-today.com/news/articleView.html?idxno=89488", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 중국 6g 협력"}, {"title": "[최홍석 칼럼] AI 에이전트가 달리려면 어떤 도로가 필요한가", "summary": "인도네시아 Indosat Ooredoo Hutchison이 MWC에서 노키아와 엔비디아의 협력을 통해 동남아시아 최초로 AI-RAN 기반 레이어3 5G 통화를 실증했습니다. 노키아의 에어스케일 무선 장비와 RAN 소프트웨어가 엔비디아 GPU 가속 인프라와 결합하여 차세대 통신망을 구현한 중대 사건입니다. 글로벌 경쟁사의 AI-RAN 상용화 및 실증 성과를 보여주는 핵심 지표입니다. 삼성전자 네트워크사업부의 글로벌 경쟁 구도 분석에 매우 중요한 정보입니다.", "source": "zdnet.co.kr", "date": "2026-09-04 13:29", "url": "https://zdnet.co.kr/view/?no=20260904111545", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 ai-ran"}, {"title": "삼성, 8월 中 특허 504건 승인…'휴머노이드· 6G ·전고체' IP 방어망 구축", "summary": "삼성전자가 중국에서 휴머노이드, 6G, 전고체 등 첨단 기술 분야의 특허 217건을 포함해 총 504건을 승인받으며 IP 방어망을 구축했습니다. 차세대 6G AI 예측 및 원천 IP 확보를 통해 글로벌 초격차 기술 경쟁력을 공고히 하고 있습니다. 삼성그룹 차원의 핵심 미래 기술 지식재산권 확보 성과를 보여줍니다. 6G 분야의 기술 리더십을 입증하는 중요한 지표입니다.", "source": "theguru.co.kr", "date": "2026-09-04 08:56", "url": "https://www.theguru.co.kr/news/article.html?no=106603", "category": "tech", "importance": 4, "wl": false, "topic": "삼성 중국 특허 6g"}, {"title": "横長の折りたたみ「Xiaomi 18 Fold」を中国発表へ 自社開発チップ搭載、折りたたみiPhone発表前に先手？", "summary": "샤오미는 독자 개발한 프로세서 'Xiaomi XRING O3' 칩을 탑재하고 여권 형태의 가로형 폴더블 화면을 채택한 신형 스마트폰 'Xiaomi 18 Fold'를 중국 시장에 정식 공개할 예정이다. 자체 칩 기술력과 폼팩터 혁신을 통해 글로벌 경쟁사들을 겨냥하고 있다.", "source": "ITmedia Mobile", "date": "2026-09-03 23:08", "url": "https://www.itmedia.co.jp/mobile/articles/2609/03/news100.html", "category": "tech", "importance": 4, "wl": true, "topic": "샤오미 폴더블폰 샤오미 18 폴드"}, {"title": "[미리보는 AINEX 2026]〈상〉AI시대 우주·지상·해저 '초연결' 네트워크 ...", "summary": "AINEX 2026 컨퍼런스에서 삼성전자 황근철 부사장이 'AI 시대 인프라 기술'을 주제로 기조강연을 진행할 예정입니다. AI 서비스 확산에 따른 네트워크의 중요성과 고도화 방안을 발표하며 기술 리더십을 강조합니다. 통신 인프라 및 AI 네트워크 진화 방향을 공유하는 자리입니다. 업계 전문가들과의 기술 교류 및 비전 제시의 장이 됩니다.", "source": "etnews.com", "date": "2026-09-05 06:01", "url": "https://www.etnews.com/20260904000311", "category": "tech", "importance": 3, "wl": false, "topic": "ainex 삼성전자 발표"}, {"title": "T-Mobile hands CFO reins to ex-Shell exec Jessica Uhl, as Osvaldik retires", "summary": "티모바일은 피터 오 t", "importance": 3, "wl": false, "topic": "우리넷 koren ai 네트워크"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "국내 중소 통신장비 및 부품업체인 알에프텍이 5G 통신 장비와 방산 RF 기술 경쟁력 강화를 위해 R&D 조직을 자회사 'RFTC'로 분리했습니다. 5G 안테나 및 필터 기술의 독립적 플랫폼 고도화를 위한 전략입니다. 국내 통신장비 부품업계의 조직 개편 및 R&D 역량 강화 움직임을 보여줍니다. 5G 및 차세대 통신 장비 부품 생태계의 변화를 나타냅니다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 rftc 자회사 분리"}, {"title": "우리넷, AI 데이터센터 겨냥 '16Tbps급 네트워크' 실증… 6G 까지 기술 확...", "summary": "우리넷이 AI 데이터센터를 겨냥한 16Tbps급 대용량 네트워크 기술을 실제 시험망에서 검증하고, 향후 6G 초정밀 전달망까지 사업 영역을 확장한다고 밝혔습니다. 대용량 데이터의 손실 없는 전송을 보장하는 고성능 통신 장비 기술력의 실증입니다. 차세대 네트워크 인프라 구축을 위한 국내 장비사의 R&D 성과입니다. 미래 통신 장비 시장에서의 입지를 다지는 계기가 됩니다.", "source": "joongangenews.com", "date": "2026-09-03 15:18", "url": "https://www.joongangenews.com/news/articleView.html?idxno=545385", "category": "tech", "importance": 3, "wl": false, "topic": "우리넷 16tbps 네트워크 실증"}, {"title": "전북대 노예훈 박사과정생 학문후속세대 지원사업 선정.. ' 6G 전이중통신...", "summary": "전북대 연구팀이 광대역 자기간섭 신호를 억제하고 수신기 성능 저하를 최소화하는 회로 구조와 신호 제거 기술을 연구해 향후 6G 전이중 무선통신 시스템에 적용할 핵심 수신기 기술을 확보했습니다. 대학 및 연구소 차원의 차세대 6G 기초 원천 기술 연구 성과입니다. 미래 통신 시스템의 핵심 하드웨어 기술력을 높이는 데 기여합니다. 장기적인 6G R&D 생태계의 일부입니다.", "source": "veritas-a.com", "date": "2026-09-03 14:50", "url": "https://www.veritas-a.com/news/articleView.html?idxno=626092", "category": "tech", "importance": 3, "wl": false, "topic": "전북대 6g 전이중통신"}, {"title": "알에프텍, RF 전문 자회사 'RFTC' 출범…5G·방산 사업 본격 확대", "summary": "알에프텍이 5G R&D 역량을 기반으로 차세대 통신장비 기술 개발을 이어가고 방산 RF 기술을 확대하기 위해 자회사 'RFTC'를 출범했습니다. 5G, 5G-Advanced, 6G로 이어지는 차세대 통신 시장에 대응하는 체계를 갖추었습니다. 중소 통신장비 기업의 전문화된 R&D 법인 설립 소식입니다. 차세대 통신 장비 기술 대응력을 강화하는 조치입니다.", "source": "view.asiae.co.kr", "date": "2026-09-03 14:23", "url": "https://view.asiae.co.kr/article/2026090314231334445", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 rftc 자회사 출범"}, {"title": "ファーウェイ、血圧測定 키아 moca access 기술 공급"}], "policy": [{"title": "Canada publishes Responsible Data Centre Development Principles - Telecompaper", "summary": "캐나다 정부가 책임 있는 데이터센터 개발 원칙(Responsible Data Centre Development Principles)을 출판했다. 인공지능 및 클라우드 인프라 확장에 따른 정부 규제와 가이드라인을 제시한다. 통신 및 인프라 투자 환경에 영향을 미치는 정책이다.", "source": "Telecompaper", "date": "2026-09-05 00:21", "url": "https://www.telecompaper.com/news/canada-publishes-responsible-data-centre-development-principles--1581820", "category": "policy", "importance": 3, "wl": false, "topic": "캐나다 데이터센터 규제"}, {"title": "Qualcomm says 6G's AI-native future demands proactive spectrum policy: Report - ET Telecom", "summary": "퀄컴이 6G의 AI 네이티브 미래를 위해 선제적인 주파수 정책이 필수적이라고 강조했습니다. 차세대 통신 규격 안착을 위한 정부 차원의 주파수 할당 및 제도적 지원을 요구하는 목소리입니다. 통신 표준 및 주파수 규제 방향에 대한 기술 기업의 전략적 제안을 담고 있습니다. 6G 생태계 조성을 위한 정책적 논의를 반영합니다.", "source": "ET Telecom", "date": "2026-09-04 17:53", "url": "https://telecom.economictimes.indiatimes.com/amp/news/devices/qualcomm-says-6gs-ai-native-future-demands-proactive-spectrum-policy-report/133757498", "category": "tech", "importance": 3, "wl": false, "topic": "퀄컴 주파수 정책"}, {"title": "[단독] “미토스 허용해 달라” 韓 요청에도 美 백악관 ‘묵묵부답’…...", "summary": "과학기술정보통신부가 미국 백악관에 AI 모델 '미토스'의 수출 통제 완화를 요청했으나 묵묵부답인 상태이며 앤트로픽과 협의를 이어가고 있습니다. 미국 정부의 대형 AI 모델 수출 통제 조치에 대응하는 정부의 외교적·정책적 교섭 노력입니다. 국내 AI 산업 생태계와 글로벌 규제 간의 갈등을 보여줍니다. 첨단 기술 확보에 직결되는 중요한 정책적 변수입니다.", "source": "biz.heraldcorp.com", "date": "2026-09-04 17:41", "url": "https://biz.heraldcorp.com/article/10863187?ref=naver", "category": "other", "importance": 3, "wl": false, "topic": "과기정통부 미토스 수출 통제"}, {"title": "10월부터 해킹 의심 정황만 있어도 정부 '직권조사' 가능", "summary": "앞으로 해킹 의심 정황만 있어도 정부가 '직권조사'에 나설 수 있게 되며, 정보통신 서비스 제공자는 침해사고 발생 시 24시간 이내 과기정통부나 KISA에 신고해야 합니다. 기업의 신고 지연에 따른 정부의 대응력을 높이기 위한 제도적 개선입니다. 사이버 보안 규제 강화 및 정부의 권한 확대 조치를 다룹니다. 정보통신 업계 전반의 보안 준수 의무를 대폭 강화하는 핵심 규제 뉴스입니다.", "source": "hankookilbo.com", "date": "2026-09-04 17:10", "url": "https://www.hankookilbo.com/news/article/A2026090416330002597? 54만 계정 유출…2024년 발견한 취약점 개선 안 했다", "summary": "과학기술정보통신부가 정보통신망법 위반에 따라 티빙에 과태료를 부과할 방침인 가운데, 티빙 대표가 보안 체계 반성과 재발 방지를 약속했습니다. OTT 플랫폼의 사이버 침해사고 및 정부의 규제 조치를 다룹니다. 정보통신망법에 기반한 정부의 보안 사고 제재 사례입니다. 통신 인프라 마비가 아닌 플랫폼 기업의 보안 취약점 및 개인정보 유출 사고입니다.", "source": "rightknow.co.kr", "date": "2026-09-05 01:12", "url": "http://www.rightknow.co.kr/news/articleView.html?idxno=34664", "category": "other", "importance": 2, "wl": false, "topic": "티빙 개인정보 유출 과태료"}, {"title": "중기부 창업허브 844억 임대 논란…예결소위서 집중 추궁", "summary": "국회 예결소위에서 과학기술정보통신부의 인공지능(AI) 분야 모태펀드 운용 방식을 두고 여야가 공방을 벌였습니다. 정부의 R&D 및 벤처 투자 예산 집행의 타당성을 심사하는 과정입니다. 과기정통부의 AI 산업 육성 재정 정책을 다룹니다. 국가 차원의 AI 인프라 및 기술 투자 예산 논의입니다.", "source": "news1.kr", "date": "2026-09-04 21:11", "url": "https://www.news1.kr/politics/assembly/6280783", "category": "other", "importance": 2, "wl": false, "topic": "과기정통부 ai 모태펀드 공방"}, {"title": "AI 모태펀드 60% 의무투자 두고 여야 공방…온누리상품권도 충돌", "summary": "국회 예산결산특별위원회 결산심사소위원회에서 과학기술정보통신부의 AI 분야 모태펀드 운용 실태와 중기부 온누리상품권 운영을 두고 여야가 맞붙었습니다. 정부 부처의 예산 집행 적정성 검토 과정입니다. 과기정통부의 AI 생태계 지원 예산 편성을 다룹니다. 국가 정책 및 예산 심의 동향을 보여줍니다.", "source": "shinailbo.co.kr", "date": "2026-09-04 20:58", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5058715", "category": "other", "importance": 2, "wl": false, "topic": "과기정통부 ai 모태펀드 국회 심사"}, {"title": "여야, 과기부 모태펀드 공방…\"합목적성 결여\"·\"마중물 역할\"", "summary": "국회 예결소위에서 과학기술정보통신부의 인공지능 분야 모태펀드 운용 실태를 두고 여야가 합목적성과 마중물 역할에 대해 공방을 벌였습니다. 정부의 AI 기술 투자 재정 집행을 둘러싼 정치권의 검증 과정입니다. 과기정통부의 R&D 정책 방향을 다룹니다. 국가 기술 혁신 예산의 집행 기조를 반영합니다.", "source": "yna.co.kr", "date": "2026-09-04 19:48", "url": "https://www.yna.co.kr/view/AKR20260904163400001?input=1195m", "category": "other", "importance": 2, "wl": false, "topic": "과기정통부 모태펀드 국회 공방"}, {"title": "티빙, 개인정보 유출 사고 조사결과 발표…“3954만 전 계정 탈취”", "summary": "과기정통부가 OTT 플랫폼 티빙의 침해사고에 대한 민관합동조사단 조사 결과를 발표했습니다. 해커가 개발자 접속키를 탈취해 3954만 전 계정 정보가 탈취된 보안 사고의 전말을 공개했습니다. 정보통신 서비스 제공자의 침해사고 조사 및 보안 규제 집행 사례입니다. 통신망 장애가 아닌 앱 서비스 계정 탈취 해킹 사건이므로 outage가 아님.", "sourc   if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
