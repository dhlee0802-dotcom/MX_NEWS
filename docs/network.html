<style>

  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

</style>
</head>

반발"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤과 에릭슨이 독일 함부르크의 컨테이너 터미널 알텐베르더에 프라이빗 5G 네트워크를 구축했다. 이는 7년간 이어진 셀룰러 실험의 최신 단계로, 산업용 5G가 현장에서 어떻게 적용되는지 보여준다. 양사는 항만 물류 효율성을 높이기 위한 산업용 무선 통신 솔루션 협력을 지속하고 있다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 4, "wl": true, "topic": "에릭슨 프라이빗 5g 구축"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "summary": "인도 통신 네트워크에 구축된 중국산 장비가 수년간 운영되어 온 가운데, 정부가 이를 철거하고 교체하는 방안을 검토 중이다. 옴디아의 레미 파스칼 수석 애널리스트는 인도 시장의 레거시 장비 전환 가능성을 언급했다. 이는 글로벌 통신 보안 강화 및 탈중국 장비 공급망 재편 흐름과 맞닿아 있다.", "source": "RCR Wireless", "date": "2026-09-04 23:22", "url": "https://rcrwireless.com/20260904/carriers/india-replace-chinese-equipment", "category": "policy", "importance": 4, "wl": true, "topic": "인도 중국산 통신장비 교체 검토"}, {"title": "BSNL 4G network carries 6 PB data every day: C-DoT’s RK Upadhyay", "summary": "타타 컨설턴시 서비스(TCS) 컨소시엄이 주도하고 테자스 네트웍스와 C-DoT가 참여하여 구축한 인도 BSNL의 국산 4G 네트워크가 하루에 6PB의 데이터 트래픽을 처리하고 있다. 이는 인도 자국산 통신 장비 생태계가 대규모 상용 트래픽을 안정적으로 소화하고 있음을 보여주는 사례로, 향후 인프라 확장 가속화가 기대된다.", "source": "ET Telecom", "date": "2026-09-04 19:11", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/bsnl-4g-network-carrying-nearly-6-pb-data-daily-c-dots-rk-upadhyay/133759314", "category": "contract", "importance": 4, "wl": true, "topic": "bsnl 4g 네트워크 트래픽"}, {"title": "Maxis strengthens its nationwide network infrastructure with Nokia’s optical transport tec", "summary": "말레이시아 통신사 맥시스가 전국 네트워크 인프라를 강화하기 위해 노키아의 광전송 기술을 도입했다. 이번 업그레이드를 통해 네트워크 용량과 전송 효율이 대폭 향상되며, 노키아는 아시아 태평양 지역에서의 입지를 더욱 공고히 했다.", "source": "telecomtv.com", "date": "2026-09-04 17:09", "url": "https://www.telecomtv.com/content/nokia/maxis-strengthens-its-nationwide-network-infrastructure-with-nokia-s-optical-transport-technology-56172/", "category": "contract", "importance": 4, "wl": false, "topic": "맥시스 노키아 광전송 장비 도입"}, {"title": "[Biz&Law] 삼성전자 , 美서 5G 기지국 특허침해 피소", "summary": "캐나다의 특허관리전문회사(NPE)가 미국 텍사스주 동부 연방지방법원에 삼성전자가 자사의 5G 기지국 관련 특허를 침해했다고 제소했다. 삼성전자가 미 통신사 버라이즌에 공급한 네트워크 제품이 소송 대상에 포함되어 경영진 보고 가치가 높다.", "source": "the-biz.co.kr", "date": "2026-09-04 17:00", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=727390", "category": "contract", "importance": 4, "wl": false, "topic": "삼성전자 5g 특허침해 피소"}, {"title": "Telcos oppose Trai’s proposed 5G slicing service quality rules", "summary": "인도 통신사들이 인도텔레콤규제국(Trai)이 제안한 5G 슬라이싱 서비스 품질 규정에 대해 기술적으로 비실용적이고 운영상 과도한 부담을 초래한다며 공식적으로 반대 의사를 표명했다. 이는 5G 네트워크 자원 이용률을 제한하려는 규제안을 두고 통신업계와 당국 간의 갈등이 고조되고 있음을 보여준다.", "source": "Mint", "date": "2026-09-04 16:20", "url": "https://www.livemint.com/industry/telecom/reliance-jio-airtel-vodafone-idea-trai-5g-slicing-norms-service-quality-rules-telecom-companies-india-11788502641215.html", "category": "policy", "importance": 4, "wl": true, "topic": "통신사 5g 슬라이싱 규정 반대"}, {"title": "Maxis upgrades network infrastructure with Nokia optical transport technology - Telecompap", "summary": "맥시스가 노키아의 광학 전송 기술을 활용해 전국적인 네트워크 인프라 고도화 작업을 진행한다. 데이터 트래픽 급증에 대응하기 위한 통신사의 장비 투자 확대와 이에 따른 노키아의 수주 실적을 보여준다.", "source": "Telecompaper", "date": "2026-09-04 15:28", "url": "https://www.telecompaper.com/news/maxis-upgrades-network-infrastructure-with-nokia-optical-transport-technology--1581725", "category": "contract", "importance": 4, "wl": false, "topic": "맥시스 노키아 네트워크 인프라 업그레이드"}, {"title": "Euro Stoxx 50 return, Saudi expansion extend Nokia’s stunning comeback - internationalfina", "summary": "노키아가 유럽 주가지수 런칭과 사우디아라비아 사업 확장 등에 힘입어 가파른 실적 반등세를 이어가고 있다. 유럽 증시 지수 편입과 중동 지역의 인프라 투자 수주가 주가 상승과 재무 건전성 개선을 견인했다. 글로벌 통신장비 시장에서 노키아의 경쟁력이 다시 부각되는 국면이다. 향후 글로벌 통신장비 시장의 점유율 경쟁에 영향을 미칠 전망이다.", "source": "internationalfinance.com", "date": "2026-09-04 13:00", "url": "https://internationalfinance.com/telecom/euro-stoxx-50-return-saudi-expansion-extend-nokias-stunning-comeback/", "category": "earnings", "importance": 4, "wl": false, "topic": "노키아 실적"}, {"title": "수급 악화로 주가 빠졌지만… RFHIC 반등 기대 커지는 까닭", "summary": "5G 단독모드(SA) 및 6G 투자가 확대됨에 따라 고주파·고전력 반도체를 공급하는 RFHIC의 새로운 수요 창출과 반등 기대감을 다룬 국내 소부장 부품업체 동향이다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 09:04", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484216", "category": "tech", "importance": 3, "wl": false, "topic": "rfhic 5g sa 6g 반도체"}, {"title": "Maxis Deploys Nokia Optical Transport Technology To Boost AI And Enterprise Network Capaci", "summary": "말레이시아 막시스가 AI 및 기업용 네트워크 역량을 강화하기 위해 노키아의 광전송 기술을 도입했다. 급증하는 트래픽과 기업 고객의 고성능 수요에 대응하기 위한 인프라 업그레이드다. 노키아는 이번 구축을 통해 아시아 지역 광네트워크 시장에서의 입지를 공고히 하고 있다. 통신장비 공급 계약의 모범적인 사례다.", "source": "Pokde.Net", "date": "2026-09-06 05:55", "url": "https://pokde.net/system/service/telco-isp/maxis-deploys-nokia-optical-transport-technology", "category": "contract", "importance": 3, "wl": false, "topic": "맥시스 수주"}, {"title": "Huawei Enterprise AI Push Is Reshaping Industrial Infrastructure - urbanacres.in", "summary": "화웨이의 엔터프라이즈 AI 추진 전략이 산업용 인프라 전반을 재편하고 있다. 기업 고객을 대상으로 AI 기반 통신 및 클라우드 솔루션 공급을 확대하는 중이다. 전통적인 통신장비를 넘어 산업용 디지털 인프라 시장으로 영역을 넓히고 있다. 경쟁사의 전략 변화를 주시해야 한다.", "source": "urbanacres.in", "date": "2026-09-05 11:27", "url": "https://urbanacres.in/huawei-enterprise-ai-push-is-reshaping-industrial-infrastructure/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 기술"}, {"title": "Nokia Tests Network APIs in Healthcare - Telecom Reseller / Technology Reseller News", "summary": "노키아가 의료 분야에서 네트워크 API 성능을 테스트하며 5G 및 차세대 통신 기술의 산업용 적용 범위를 넓히고 있다. 통신장비사들의 수직 시장 진출 전략의 일환으로 주목된다.", "source": "Telecom Reseller / Technology Reseller News", "date": "2026-09-05 06:30", "url": "https://telecomreseller.com/2026/09/04/nokia-tests-network-apis-in-healthcare/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 헬스케어 네트워크 api 테스트"}, {"title": "The Swedish company Ericsson intends to gain a foothold in the Turkmen market of telecommu", "summary": "스웨덴 통신장비 기업 에릭슨이 투르크메니스탄 통신 시장 진출을 본격 추진하고 있다. 중앙아시아 지역의 네트워크 인프라 현대화 사업에 참여하여 발판을 마련하려는 전략이다. 신흥 시장 개척을 통해 글로벌 영토 확장을 도모하고 있다. 향후 구체적인 수주 성과로 이어질지 주목된다.", "source": "Turkmenportal.com", "date": "2026-09-05 06:17", "url": "https://turkmenportal.com/en/news/54025-shvedskaya-kompaniya-ericsson-namerena-zakrepitsya-na-turkmenskom-rynke-telekommunikacionnyh-uslug--------------------------", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 계약"}, {"title": "딥시크, 내몽골 1GW 데이터센터에 ' 화웨이 칩 16만개' 투입 추진", "summary": "중국 인공지능(AI) 스타트업 딥시크가 자국 통신장비 ·반도체 기업 화웨이 의 AI 가속기 도입을 추진하며 대규모 컴퓨팅 거점 구축에 속도를 내고 있다. 4일(현지시간) 블룸버그 통신 에 따르면 딥시크는 내몽골 자치구에...", "source": "joseilbo.com", "date": "2026-09-04 21:13", "url": "http://www.joseilbo.com/news/news_read.php?uid=575124&class=78&grp=", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - Mobile Europe", "summary": "노키아가 사우디아라비아에 인공지능(AI) 중심의 연구개발(R&D) 센터를 새롭게 개소했다. 이번 R&D 센터 설립은 중동 지역에서 AI 기반 통신 네트워크 솔루션 개발을 가속화하기 위한 전략의 일환이다. 차세대 통신 인프라 고도화와 현지 파트너십 강화를 도모한다. 글로벌 통신장비 업계의 AI 기술 경쟁이 심화되는 양상이다.", "source": "Mobile Europe", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 기술"}, {"title": "Nokia may exit the consumer smartphone market - Zamin.uz", "summary": "노키아 브랜드가 소비자용 스마트폰 시장에서 완전히 철수할 가능성이 제기되었다는 보도이다. 주요 통신장비 경쟁사의 사업 포트폴리오 변화를 시사한다.", "source": "Zamin.uz", "date": "2026-09-04 15:54", "url": "https://zamin.uz/en/technology/220178-nokia-may-exit-the-consumer-smartphone-market.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 소비자 스마트폰 철수"}, {"title": "Ericsson and Uni of Tokyo explore connectivity and AI scenarios for 2035 - Telecompaper", "summary": "에릭슨과 도쿄대학교가 협력하여 2035년을 겨냥한 6G 연결성 및 AI 시나리오 연구에 착수했다. 양 기관은 미래 모바일 네트워 ": "릴라이언스지오 글로벌"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "통신 임원들은 5G의 더 큰 사업적 기회가 소비자 시장보다는 산업용 자동화와 스마트 제조 분야에 있다고 강조했다. 프라이빗 네트워크와 연계된 B2B 시장 확장이 통신사의 핵심 과제로 부각되고 있다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "strategy", "importance": 3, "wl": false, "topic": "산업용 자동화 5g 기회"}, {"title": "Deutsche Telekom Peoplewatch: change-at-the-top in finance, infra, and tech - telcotitans.", "summary": "도이치텔레콤이 재무, 인프라, 기술 부문의 핵심 임원진 교체를 단행했다. 경영 체질 개선을 위한 조치다.", "source": "telcotitans.com", "date": "2026-09-05 14:04", "url": "https://www.telcotitans.com/deutsche-telekomwatch/deutsche-telekom-peoplewatch-change-at-the-top-in-finance-infra-and-tech/10839.article", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 인사"}, {"title": "SKT '수요'·KT '이음'·카카오 '편리'…모두의 AI 개발 시동", "summary": "SK텔레콤, KT, 카카오 등 국내 주요 통신 및 플랫폼 기업들이 각각 수요, 이음, 편리 가치를 내걸고 국민 누구나 무료로 사용하는 '모두의 AI' 개발에 착수했다. 외산 AI와 차별화된 에이전트 서비스 제공을 목표로 협력 체계를 구축하고 있다.", "source": "전자신문", "date": "2026-09-05 12:00", "url": "https://www.etnews.com/20260904000276", "category": "contract", "importance": 3, "wl": true, "topic": "skt kt 카카오 모두의 ai"}, {"title": "'5G Spectrum Auction' Expected in Korea Next Year... Beneficiaries Among Telecom Equipment", "summary": "한국에서 내년 중 추가 5G 주파수 경매가 예상됨에 따라 국내 통신장비 업계의 수혜 여부에 관심이 쏠린다는 전망 기사이다. 국내 네트워크 장비 시장의 투자 모멘텀을 시사한다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/en/article/2026090320502060845", "category": "policy", "importance": 3, "wl": false, "topic": "한국 내년 5g 주파수 경매"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니]", "summary": "국내에서 내년 5G 주파수 경매가 예상됨에 따라 통신장비주가 수혜를 입을 것이라는 전망 기사이다. 삼성전자의 높은 내수 점유율과 국내 중소 장비 업체 간의 협력 구도가 언급된다.", "source": "view.asiae.co.kr", "date": "2026-09-05 08:19", "url": "https://view.asiae.co.kr/article/2026090320502060845", "category": "contract", "importance": 3, "wl": false, "topic": "내년 5g 주파수 경매 통신장비"}, {"title": "유럽판 ‘어벤져스 기업’ 나오나…美·中 맞설 ‘메가합병’ 승부수", "summary": "유럽 통신시장이 사업자 난립으로 5G와 데이터센터, AI 인프라 투자에 어려움을 겪자 대규모 자금 투입과 경쟁력 강화를 위한 메가합병 등 구조조정 움직임을 다룬 시장 동향이다.", "source": "dailian.co.kr", "date": "2026-09-05 07:02", "url": "https://www.dailian.co.kr/news/view/1686306/?sc=Naver", "category": "contract", "importance": 3, "wl": false, "topic": "유럽 통신 메가합병 승부수"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - 연합뉴스", "summary": "통신사들의 기지국 부지를 AI 데이터센터로 활용하는 등 인프라의 다목적 변신이 시작되었다. 통신 국사와 기지국의 유휴 공간을 활용해 AI 연산 인프라를 구축하려는 트렌드가 확산하고 있다. 통신사들의 사업 모델 다각화와 자산 효율화 전략을 보여준다. 향후 통신 인프라 설계 패러다임에 영향을 미칠 전망이다.", "source": "연합뉴스", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR20260904023000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 기술"}, {"title": "T-Mobile appoints Shell veteran as next CFO - CFO Dive", "summary": "티모바일이 셸(Shell) 출신의 베테랑 임원을 새로운 최고재무책임자(CFO)로 임명했다. 핵심 재무 책임자의 교체를 통해 재무 전략에 변화를 줄 것으로 전망된다. 주요 통신사의 경영진 인사 동향이다.", "source": "CFO Dive", "date": "2026-09-05 05:29", "url": "https://www.cfodive.com/news/tmobile-shell-ge-vernova-veteran-cfo-telecom-merger/829726/", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 인사"}, {"title": "Spectrum-Cox Merger Update: Will Your Bill And Service Change? - cabletv.com", "summary": "스펙트럼과 콕스 간의 합병 추진설과 관련하여 가입자 요금 및 서비스 변화 전망이 제기되었다. 미국 케이블 및 초고속인터넷 사업자 간의 대형 M&A 가능성을 다룬 내용이다. 통신 시장의 경쟁 구도 재편을 예고하는 사안이다.", "source": "cabletv.com", "date": "2026-09-05 03:19", "url": "https://www.cabletv.com/news/cox-spectrum-merger-will-price-increase", "category": "contract", "importance": 3, "wl": false, "topic": "스펙트럼 m&a"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - Fierce Network", "summary": "스페인 마스오렌지와 에릭슨이 6G 미래를 향한 초기 단계로 6 GHz 주파수 대역 테스트를 진행했다. 양사는 차세대 이동통신 환경에서 해당 대역의 가용성과 성능을 검증하고 있다. 유   {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
