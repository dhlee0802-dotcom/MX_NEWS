<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}

  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

const NEWS_DATA = {"outage": [{"title": "T-Mobile customers complain of widespread outages - Mashable", "summary": "T모바일 고객들 사이에서 광범위한 통신망 장애가 발생했다는 보도이다. 무선 통신 서비스의 중단 및 연결 문제 확산을 다루고 있다. 가입자 불편을 초래한 실제 네트워크 장애 사건이다.", "source": "Mashable", "date": "2026-09-06 19:50", "url": "https://mashable.com/article/widespread-outages-t-mobile-att-verizon-sprint/?utm_source=social&utm_medium=facebook&utm_campaign=mash-com-fb-main-link&utm_content=tech&fbclid=IwAR0kTWmIxKKc1z4YXH3X7kXlOdmtVzu_SraTzqK9c6j7xufhMvv7ch70aW4", "category": "outage", "importance": 5, "wl": false, "topic": "티모바일 통신장애"}, {"title": "AT&T Wireless Service Restored After Hours-long Nationwide Outage; Company Apologizes To A", "summary": "미국 AT&T의 무선 통신 서비스가 수 시간 동안 전국적인 규모로 중단되었다가 복구됐다. 대규모 가입자에게 영향을 미친 전국 단위 장애로 회사가 공식 사과했다.", "source": "Mshale", "date": "2026-09-05 08:38", "url": "https://mshale.com/3dcbe582/7f13b3c0Is6IBlsVc0U", "category": "outage", "importance": 5, "wl": false, "topic": "at&t 통신 장애"}, {"title": "Verizon waives charges for Hurricane Lowell, prepares network in Hawaiʻi - Verizon", "summary": "미국 통신사 버라이즌이 하와이를 강타한 허리케인 '로웰'로 인한 피해를 최소화하기 위해 고객 요금을 면제하고 현지 통신망 비상 대응 태세에 돌입했다. 자연재해에 대비해 네트워크 안정성을 확보하고 비상 통신망을 유지하기 위한 통신사의 조치다. 폭풍으로 인한 통신 장애 예방 및 복구 역량을 점검하는 차원의 현장 리포트다.", "source": "Verizon", "date": "2026-09-06 18:32", "url": "https://www.verizon.com/about/news/hurricane-lowell-updates", "category": "outage", "importance": 3, "wl": false, "topic": "버라이즌 하와이 허리케인 대응"}, {"title": "AT&T service restored after issues affecting 911 service throughout central Ohio agencies ", "summary": "오하이오주 중부 기관들의 긴급전화(911) 서비스에 영향을 미친 장애 이후 AT&T 통신 서비스가 복구되었다는 보도이다. 특정 지역과 공공 서비스에 영향을 준 통신망 장애 사건이다.", "source": "10TV", "date": "2026-09-05 19:11", "url": "https://www.10tv.com/video/news/local/att-service-restored-after-issues-affecting-911-service-throughout-central-ohio-agencies/530-42170895-d7c3-468f-89f7-6e1a2ff3abb3", "category": "outage", "importance": 3, "wl": false, "topic": "at&t 통신장애"}], "satellite": [{"title": "Forget Starlink? Japan’s $1 Billion BlueBird Play Makes ASTS the National Satellite OS - Y", "summary": "일본에서 1억 달러 규모의 블루버드 프로젝트가 추진되면서 AST스페이스모바일이 주목받고 있다. 국가 단위 위성통신 OS로 자리잡는 계기가 되고 있다.", "source": "Yahoo Finance", "date": "2026-09-06 23:25", "url": "https://finance.yahoo.com/markets/stocks/articles/forget-starlink-japan-1-billion-142530511.html", "category": "contract", "importance": 4, "wl": false, "topic": "ast스페이스모바일 일본 계약"}, {"title": "추락하나했더니 ‘주가 재추진’…시총 2조달러 재입성한 스페이스X", "summary": "스페이스X가 기업 가치 산정 공식을 기존 '로켓+스타링크'에서 '로켓+위성통신+AI'로 확대하며 시총 2조 달러를 재입성했다. 자본시장은 스페이스X의 AI 컴퓨팅 능력 확대에 주목하고 있다. 오펜하이머는 스페이스X의 성장 동력이 위성통신을 넘어 인공지능 분야로 확장되고 있다고 평가했다.", "source": "mk.co.kr", "date": "2026-09-06 21:43", "url": "https://www.mk.co.kr/article/12145621", "category": "earnings", "importance": 4, "wl": false, "topic": "스페이스x ai"}, {"title": "\"저궤도 위성만으로 지상망 대체 어렵다”", "summary": "미국 이동통신 3사인 AT&T, T모바일, 버라이즌은 저궤도 위성만으로는 지상망을 대체하기 어렵다며 스타링크 모바일과의 MVNO 계약에 소극적인 태도를 보이고 있다. 대신 이들은 주파수 자원을 공동 활용하고 여러 위성 사업자와 협력하는 방식을 택하고 있다. 통신 음영지역 해소를 위한 지상 통신사와 위성 사업자 간의 복잡한 경쟁 구도가 형성되고 있다.", "source": "zdnet.co.kr", "date": "2026-09-06 08:42", "url": "https://zdnet.co.kr/view/?no=20260906084139", "category": "tech", "importance": 4, "wl": false, "topic": "스타링크 이동통신3사"}, {"title": "두 달 전 투자한 스페이스X 주식 10,000달러, 현재 가치 확인해보니", "summary": "스페이스X의 스타링크 가입자 수가 1200만 명을 돌파하고 스타실드 정부 계약으로 60억 달러 이상을 확보했다. 인공지능 부문 매출 또한 약 27억 달러를 기록하며 성장을 견인하고 있다. 우주 통신과 방산 및 AI 영역을 아우르는 스페이스X의 가치가 급상승하고 있다.", "source": "coinreaders.com", "date": "2026-09-06 07:50", "url": "http://coinreaders.com/256743", "category": "earnings", "importance": 4, "wl": false, "topic": "스페이스x 스타링크"}, {"title": "中·싱가포르 연구진 “ 스타링크 최신 단말기 해킹 성공” [차이나우]", "summary": "중국과 싱가포르 연구진이 스페이스X의 위성 인터넷 서비스 스타링크의 최신 사용자 단말기를 해킹해 관리자 권한을 확보했다고 주장했다. 이번 해킹으로 스타링크 위성 시스템의 보안성에 대한 우려가 제기되고 있다. 글로벌 위성통신 인프라의 사이버 보안 취약점 점검이 중요한 과제로 부각되는 상황이다.", "source": "segye.com", "date": "2026-09-06 07:19", "url": "https://www.segye.com/newsView/20260904502034?OutUrl=naver", "category": "tech", "importance": 4, "wl": false, "topic": "스타링크 해킹"}, {"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 AI 네이티브 네트워크를 중심으로 한 6G의 3대 핵심 축을 공개했다. 6G 표준화 및 통신 가치 밸류체인 재편을 위한 기술 비전을 제시한다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g"}, {"title": "돌연 파리 우주정상회의 안 간다는 스페이스X‥이유는?", "summary": "스페이스X가 파리 우주정상회의에 불참한 가운데 유럽의 독자 위성 구축 행보가 주목받고 있다. 마크롱 프랑스 대통령은 미국 스타링크의 대안인 유럽 합작 위성 기업에 1조 원을 투자하며 위성 의존을 비판했다. 유럽은 미국의 민간 위성 독점에 맞서 자체 우주 인프라 확보를 추진하고 있다.", "source": "imnews.imbc.com", "date": "2026-09-05 20:21", "url": "https://imnews.imbc.com/replay/2026/nwdesk/article/6849839_37004.html", "category": "policy", "importance": 4, "wl": false, "topic": "스타링크 우주정상회의"}, {"title": "테슬라-스페이스X 합병설 재부상...중국 생산망이 최대 걸림돌", "summary": "테슬라와 스페이스X의 합병설이 재부상한 가운데 중국 생산망이 최대 걸림돌로 지적된다. 테슬라는 태양광과 배터리를 공급하고, 스페이스X는 스타링크와 그록 AI를 테슬라 차량과 옵티머스에 제공할 수 있다는 분석이다. 양사 간 시너지 기대에도 불구하고 글로벌 공급망의 복잡성이 합병의 주요 변수로 작용한다.", "source": "digitaltoday.co.kr", "date": "2026-09-05 15:02", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=698509", "category": "tech", "importance": 4, "wl": false, "topic": "스페이스x 테슬라"}, {"title": "\"지구-달 사이에 30기 큐브샛 띄운다\"… 中, 5개국 규합 '3D 위성 관측망...", "summary": "중국이 5개국을 규합해 지구와 달 사이를 잇는 '3D 위성 관측망' 초소형 위성 네트워크 프로젝트를 공식 출범시켰다. 지구 저궤도부터 200만 ㎞ 떨어진 지구-달 공간을 겨냥한 우주 개척 사업이다. 미래 유인 달 탐사와 우주 활동을 선점하기 위한 국가 간 경쟁이 심화되고 있다.", "source": "g-enews.com", "date": "2026-09-07 06:36", "url": "https://www.g-enews.com/view.php?ud=2026090700302241120c8c1c064d_1", "category": "tech", "importance": 3, "wl": false, "topic": "중국 위성네트워크"}, {"title": "[아참마당] 저궤도 위성이 바꾸는 통신의 미래", "summary": "독자적인 6G 위성통신 기술과 산업 생태계 확보의 필요성을 강조한 오피니언이다. 위성 직접 연결의 영역 확대를 다룬다.", "source": "cctoday.co.kr", "date": "2026-09-07 06:02", "url": "https://www.cctoday.co.kr/news/articleView.html?idxno=2236218", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 6g 통신"}, {"title": "북한 '은밀한 영상' 찍던 그 회사…\"이젠 공간정보 플랫폼으로 진화\"", "summary": "벤터는 10기의 위성을 고도 500㎞ 저궤도에 띄워 매일 대규모 지상을 촬영하는 공간정보 플랫폼으로 진화하고 있다. 위성 영상에서 시계열 자료의 중요성이 강조되며 30㎝급 해상도의 촬영 데이터가 활용된다. 저궤도 위성을 활용한 고정밀 지구 관측 및 데이터 수집 역량이 확대되고 있다.", "source": "mt.co.kr", "date": "2026-09-07 05:00", "url": "https://www.mt.co.kr/future/2026/09/07/2026090217280253293", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도위성 플랫폼"}, {"title": "[서학!스타] 로켓랩(RKLB), 94번째 일렉트론 발사 성공…2026년 들어 15번...", "summary": "로켓랩이 94번째 일렉트론 발사에 성공하며 일본 위성 기업 신스펙티브의 최신 지구관측 위성을 저궤도에 투입했다. 뉴질랜드 발사 복합단지에서 수행된 이번 임무를 통해 소형 위성 발사 역량을 입증했다. 상업용 위성 발사 시장에서 로켓랩의 입지가 더욱 공고해지고 있다.", "source": "cbci.co.kr", "date": "2026-09-07 01:00", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=604366", "category": "tech", "importance": 3, "wl": false, "topic": "로켓랩 신스펙티브"}, {"title": "[김대호 진단] 반도체 열전 (51) 아마존... AWS 클라우드 혁명의 비밀", "summary": "아마존의 카이퍼 프로젝트는 일론 머스크의 스타링크와 정면 승부를 선언하며 3200개 이상의 저궤도 인공위성 발사를 추진하고 있다. 전 지구를 초고속 인터넷망으로 뒤덮는 것이 목표다. 이를 통해 아마존은 오지 인터넷뿐만 아니라 글로벌 통신 시장에서 새로운 경쟁 구도를 형성하고 있다.", "source": "g-enews.com", "date": "2026-09-07 00:00", "url": "https://www.g-enews.com/view.php?ud=202609040949484704906806b77b_1", "category": "tech", "importance": 3, "wl": false, "topic": "스타링크 카이퍼"}, {"title": "How SpaceX Spending Spree Could Threaten AT&T, Verizon, T-Mobile - Investor's Business Dai", "summary": "스페이스X의 막대한 자금 투자가 AT&T, 버라이즌, T모바일 등 주요 이동통신사에 위협이 될 수 있다는 분석 기사이다. 저궤도 위성통신과 지상 통신사 간의 경쟁 구도를 보여준다. 향후 통신 시장의 위성 서비스 확대 가능성을 시사한다.", "source": "Investor's Business Daily", "date": "2026-09-06 21:29", "url": "https://www.investors.com/news/technology/spacex-stock-telecom-starlink-wireless-broadband-att-verizon-tmobile/", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 위성통신"}, {"title": "ASTS Stock Eyes Weekly Comeback: AT&T Says AST SpaceMobile Satellite Offering Will 'Come T", "summary": "AT&T가 AST 스페이스모바일의 위성 통신 서비스 제공이 다가오고 있다고 밝힌 기사이다. 통신사의 위성 연계 서비스 도입 진행 상황을 보여준다. 향후 지상망과 위성 간 결합 서비스 확대를 예고한다.", "source": "Stocktwits", "date": "2026-09-06 17:21", "url": "https://stocktwits.com/news-articles/markets/equity/asts-at-and-t-satellite-offering-next-year/cZZn4ASR7DU", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 위성서비스"}, {"title": "美 뉴욕 가는 길 넓어졌다…유나이티드항공, 인천~뉴어크 매일 운항", "summary": "유나이티드항공은 올해 2분기 기준 450대 이상의 항공기에 스타링크 기반 위성통신망 와이파이를 설치했다고 밝혔다. 연말까지 이를 약 1000대로 확대하고 내년 말까지 전 기단에 구축할 계획이다. 이를 통해 기내 초고속 인터넷 서비스 경쟁력을 강화하고 프리미엄 수요를 공략하고 있다.", "source": "newsis.com", "date": "2026-09-06 16:14", "url": "https://www.newsis.com/view/NISX20260906_0003778045", "category": "contract", "importance": 3, "wl": false, "topic": "스타링크 유나이티드항공"}, {"title": "HBM·CXL 쏟아지자… 큐알티 신뢰성 평가 사업에 기회 커진다", "summary": "저궤도 위성 시장의 성장이 큐알티의 신뢰성 평가 사업에 새로운 기회를 제공하고 있다. 위성 발사 횟수가 증가함에 따라 관련 부품과 전자장비에 대한 시험 수요도 함께 늘어나는 추세다. 국내 기업들이 해외에 의존하던 특화 시험을 소화하며 수혜를 입을 것으로 기대된다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 15:46", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484275", "category": "earnings", "importance": 3, "wl": false, "topic": "큐알티 저궤도위성"}, {"title": "우주청·유엔, AI 통한 우주전파재난 대응 방안 논의", "summary": "우주청과 유엔이 태양 활동으로 위성과 통신에 장애를 초래하는 우주전파재난에 대응하기 위해 AI 활용 방안을 논의한다.", "source": "viva100.com", "date": "2026-09-06 15:34", "url": "https://www.viva100.com/article/20260906500532", "category": "policy", "importance": 3, "wl": false, "topic": "우주청 유엔 우주전파재난"}, {"title": "Spectrum Rocket Reaches Orbit From Andoya, Norway - srpske.rs", "summary": "노르웨이 안도야에서 스펙트럼 로켓이 궤도에 도달했다. 유럽 지역의 우주 산업 발전 사례다.", "source": "srpske.rs", "date": "2026-09-06 15:10", "url": "https://srpske.rs/en/news/nauka/2026/09/06/isar-aerospace-spectrum-rocket-reaches-orbit-andoya", "category": "tech", "importance": 3, "wl": false, "topic": "노르웨이 로켓 발사"}, {"title": "독일 이자르, 유럽 본토 첫 상업 위성 발사 성공", "summary": "독일 이자르가 유럽 본토에서 첫 상업 위성 발사에 성공했다. , "category": "tech", "importance": 3, "wl": false, "topic": "아마존 스타링크 추격"}, {"title": "Private German rocket makes history, reaches orbit from European soil - space.com", "summary": "독일 민간 로켓이 유럽 토지에서 발사되어 궤도 진입에 성공했다. 유럽의 우주 발사체 역량 강화 소식이다.", "source": "space.com", "date": "2026-09-06 05:51", "url": "https://www.space.com/space-exploration/launches-spacecraft/isar-aerospace-second-launch-norway-andoya-spaceport-spectrum-rocket", "category": "tech", "importance": 3, "wl": false, "topic": "독일 로켓 궤도 진입"}, {"title": "저궤도 명당을 잡아라...우주도 '부동산 전쟁'", "summary": "전체 위성의 90％가 데이터 송수신이 빠른 고도 500∼1000km 저궤도에 몰리며 우주 부동산 전쟁이 치열하다. 매일 같은 구역을 관측할 수 있는 태양동기궤도 등이 명당으로 꼽힌다. 거대 자본을 앞세운 기업들의 저궤도 선점 경쟁이 가속화되고 있다.", "source": "ytn.co.kr", "date": "2026-09-06 05:35", "url": "https://www.ytn.co.kr/_ln/0105_202609060535437991", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 우주부동산"}, {"title": "SpaceX Just Launched AST SpaceMobile's Biggest Bet To Advance Cell Service From Space - St", "summary": "스페이스X가 AST스페이스모바일의 대형 위성을 발사했다. 우주 공간에서의 셀룰러 서비스 제공을 위한 핵심 단계다.", "source": "Stocktwits", "date": "2026-09-06 03:52", "url": "https://stocktwits.com/news-articles/markets/equity/spacex-launches-ast-spacemobile-biggest-satellites-cell-service-from-space/cZK0HS1R7IN", "category": "contract", "importance": 3, "wl": false, "topic": "ast스페이스모바일 위성발사"}, {"title": "Delta Picks Amazon Over Starlink for In-Flight Wi-Fi - MiGFlug", "summary": "델타항공이 기내 와이파이 파트너로 스타링크 대신 아마존을 선택했다. 위성인터넷 시장에서 양사 간 경쟁 구도를 보여준다.", "source": "MiGFlug", "date": "2026-09-05 20:56", "url": "https://migflug.com/afterburner/delta-picks-amazon-over-starlink-for-in-flight-wi-fi/", "category": "contract", "importance": 3, "wl": false, "topic": "아마존 기내 와이파이"}, {"title": "머스크, 스타링크 로 우크라 훈장...EU 속타는 이유는 [김기혁의 테슬라...", "summary": "러시아-우크라이나 전쟁 발발 이후 지상의 핵심 기지국과 광케이블이 파괴된 상황에서 스페이스X의 스타링크가 통신망 위기를 극복하는 데 기여했다. 일론 머스크는 스타링크 지원으로 우크라이나 훈장을 받았다. 유럽은 통신 인프라 안보 차원에서 스타링크 의존도에 대한 복잡한 속내를 드러내고 있다.", "source": "sedaily.com", "date": "2026-09-05 20:01", "url": "https://www.sedaily.com/article/20087327?ref=naver", "category": "contract", "importance": 3, "wl": false, "topic": "스타링크 우크라이나"}, {"title": "LIG \"양자레이더, 새처럼 작게 탐지되는 스텔스기도 잡는다\"", "summary": "LIG는 보안성 검토를 거쳐 양자레이더와 저궤도 위성 체계 등 사업 현황을 공개했다. 원자기반 항법용 양자 중력 센서 개발과 은닉표적 탐지용 센서 연구가 포함됐다. 첨단 방산 기술과 저궤도 위성 체계의 융합을 통한 탐지 능력 강화가 추진되고 있다.", "source": "zdnet.co.kr", "date": "2026-09-05 16:29", "url": "https://zdnet.co.kr/view/?no=20260905162848", "category": "tech", "importance": 3, "wl": false, "topic": "lig 양자레이더"}], "competitor": [{"title": "화웨이 , 美 법정서 ‘성장 과정 불법성’ 가린다", "summary": "중국 통신장비 업체 화웨이가 미국 법정에서 회사의 성장 과정 자체를 겨냥한 대형 형사재판을 받게 된다. 미국 검찰은 화웨이가 20여 년간 경쟁사의 영업비밀을 탈취하고 이란 및 북한 제재를 우회했다고 주장하고 있다. 이번 재판은 화웨이의 글로벌 사업 전략과 법적 리스크에 중대한 영향을 미칠 전망이다.", "source": "g-enews.com", "date": "2026-09-07 04:02", "url": "https://www.g-enews.com/view.php?ud=2026090623002345259a1f309431_1", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 미국"}, {"title": "Was Huawei’s rise built on crime? A Brooklyn jury will decide", "summary": "미국 브루클린 배심원단이 화웨이의 과거 사업 확장 과정과 관련된 범죄 의혹에 대한 재판을 진행할 예정이다. 멍완저우 부회장의 캐나다 구금 해제 이후 5년 만에 화웨이 본사가 직접 법정에 서게 되면서 글로벌 통신장비 시장의 이목이 집중되고 있다. 이번 재판 결과는 화웨이의 글로벌 신뢰도와 향후 해외 시장 전략에 큰 타격을 줄 수 있다. 통신장비 업계 전반의 경쟁 구도와 규제 리스크에 중요한 변수로 작용할 전망이다.", "source": "Financial Times Tech", "date": "2026-09-06 21:00", "url": "https://www.ft.com/content/9422805f-519c-4b22-839c-cbd7a6464f07?syn-25a6b1a6=1", "category": "exec", "importance": 4, "wl": true, "topic": "화웨이 범죄 의혹 재판"}, {"title": "Maxis Deploys Nokia Optical Transport Technology To Boost AI And Enterprise Network Capaci", "summary": "말레이시아 통신사 맥시스가 인공지능 수요 급증과 기업용 네트워크 역량 강화를 위해 노키아의 광전송 기술(Optical Transport Technology)을 도입했다. 대규모 데이터 트래픽 처리가 요구되는 AI 시대를 맞아 통신사들이 핵심 백본 네트워크 고도화에 박차를 가하고 있음을 보여준다. 글로벌 장비사 간 수주 경쟁과 통신 인프라 투자 동향을 파악할 수 있는 중요 계약 소식이다.", "source": "Pokde.Net", "date": "2026-09-06 05:55", "url": "https://pokde.net/system/service/telco-isp/maxis-deploys-nokia-optical-transport-technology", "category": "contract", "importance": 4, "wl": false, "topic": "맥시스 노키아 광전송 기술 도입"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니]", "summary": "내년 국내 5G 주파수 경매 전망과 함께 삼성전자의 내수 점유율 및 에릭슨·노키아 컨소시엄과 국내 중소 장비업체 간의 구도를 분석한 통신장비 시장 진단 기사다.", "source": "view.asiae.co.kr", "date": "2026-09-05 08:19", "url": "https://view.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "내년 5g 주파수 경매"}, {"title": "[이 시각 세계] 캐나다, 관세 갈등 속 중국과 8년 만에 국방대화", "summary": "캐나다가 관세 갈등 속에서 중국과 8년 만에 국방대화를 재개하며 양국 관계가 해빙 국면에 접어들었다. 지난 2018년 캐나다가 미국의 요청으로 화웨이 멍완저우 부회장을 체포하면서 양국 관계가 크게 얼어붙은 바 있다. 이번 국방 회담은 양국 간 군사 교류와 협력을 강화하는 계기가 되고 있다.", "source": "imnews.imbc.com", "date": "2026-09-07 07:21", "url": "https://imnews.imbc.com/replay/2026/nwtoday/article/6850008_37012.html", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 캐나다"}, {"title": "Huawei Trial Draws Investor Attention To Key Telecom Network Suppliers - londoninsider.co.", "summary": "화웨이 관련 사법 절차가 본격화되면서 글로벌 통신 네트워크 장비 공급사들의 시장 지위와 투자 심리에 미칠 영향이 주목받고 있다. 지정학적 리스크가 장비 업계 재편에 변수로 작용하고 있다.", "source": "londoninsider.co.uk", "date": "2026-09-07 06:26", "url": "https://londoninsider.co.uk/huawei-trial-draws-investor-attention-to-key-telecom-network-suppliers/", "category": "exec", "importance": 3, "wl": false, "topic": "화웨이 재판 장비 공급사 영향"}, {"title": "3 Telecom Stocks Investors May Watch As Huawei Trial Puts Network Suppliers In Focus - sim", "summary": "화웨이를 둘러싼 사법 리스크 재판이 진행됨에 따라 글로벌 통신장비 공급망 전반에 대한 투자자들의 관심이 높아지고 있다. 화웨이의 법적 공방이 글로벌 시장 점유율과 경쟁사들의 수주 환경에 미칠 파장을 주시하는 분위기다.", "source": "simplywall.st", "date": "2026-09-07 05:30", "url": "https://simplywall.st/stocks/us/tech/nyse-bdc/belden/news/3-telecom-stocks-investors-may-watch-as-huawei-trial-puts-ne/amp", "category": "exec", "importance": 3, "wl": false, "topic": "화웨이 재판 통신장비사 주목"}, {"title": "Is Nokia Oyj (HLSE:NOKIA) A Bargain Following Its AI And Broadband Expansion? - simplywall", "summary": "노키 le": "수급 악화로 주가 빠졌지만… RFHIC 반등 기대 커지는 까닭", "summary": "5G SA와 6G 투자가 확대됨에 따라 통신 장비용 고주파·고전력 반도체를 공급하는 RFHIC의 실적 반등 기대감을 다룬 부품업체 동향이다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 09:04", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484216", "category": "tech", "importance": 3, "wl": false, "topic": "rfhic 반도체"}, {"title": "Huawei Enterprise AI Push Is Reshaping Industrial Infrastructure - urbanacres.in", "summary": "화웨이가 산업용 인프라 혁신을 목표로 엔터프라이즈 AI 솔루션과 클라우드 추진 전략을 가속화하고 있다. 제조 및 물류 현장의 디지털 전환을 겨냥한 화웨이의 B2B 인프라 전략을 다룬다.", "source": "urbanacres.in", "date": "2026-09-05 11:27", "url": "https://urbanacres.in/huawei-enterprise-ai-push-is-reshaping-industrial-infrastructure/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 엔터프라이즈 ai 인프라"}, {"title": "Nokia Tests Network APIs in Healthcare - Telecom Reseller / Technology Reseller News", "summary": "노키아가 헬스케어 부문에서 네트워크 API 활용성을 테스트하고 적용 범위를 넓히고 있다. 통신사 네트워크의 프로그래밍 가능성을 높여 의료 분야 등 다양한 산업과의 연계를 모색하는 전략의 일환이다. 네트워크 API 개방을 통한 5G·6G 시대 수익화 모델 발굴과 통신장비 시장에서의 경쟁력 강화를 위한 기술 행보를 보여준다.", "source": "Telecom Reseller / Technology Reseller News", "date": "2026-09-05 08:15", "url": "https://telecomreseller.com/2026/09/04/nokia-tests-network-apis-in-healthcare/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 헬스케어 네트워크 api 테스트"}, {"title": "Nokia stock holds as investors await a fresh catalyst - ad-hoc-news.de", "summary": "노키아의 주가가 새로운 상승 촉매제를 기다리며 횡보세를 보이는 가운데 투자자들의 관심이 집중되고 있다. 향후 실적 발표와 신사업 성과가 주가 향방을 가를 주요 변수로 꼽힌다.", "source": "ad-hoc-news.de", "date": "2026-09-07 02:20", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/nokia-stock-holds-as-investors-await-a-fresh-catalyst/70060893", "category": "other", "importance": 2, "wl": false, "topic": "노키아 주가 모멘텀 대기"}, {"title": "아이디퀀티크, Quantum Expo Korea 2026서 양자키분배·양자난수생성 기술...", "summary": "아이디퀀티크가 양자키분배 및 양자난수생성 네트워크 장비를 전시하며 5G 스마트폰 연계 기술을 소개했다.", "source": "aitimes.kr", "date": "2026-09-05 23:44", "url": "htt const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};
const SEC_NAME={competitor:"경쟁사",carrier:"통신사",satellite:"위성·6G",policy:"정책·규제",outage:"Outage"};
const TABS=[
  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성·6G",    secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
