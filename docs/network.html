<style>

  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}

  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

ww.techtimes.com/articles/326238/20260901/york-space-subsidiary-wins-pentagon-bet-commercial-speed-defense-satcom-manufacturing.htm", "category": "contract", "importance": 3, "wl": false, "topic": "요크 스페이스 미 국방부 수주"}, {"title": "Faced with earthly opposition, tech leaders want to put data centers in orbit - The Christ", "summary": "지상 데이터센터의 전력 및 환경적 한계를 극복하기 위해 기술 기업들이 우주 공간에 데이터센터를 구축하려는 구상을 추진하고 있다. 차세대 인프라 구상의 일환으로 장기적 기술 트렌드를 보여준다.", "source": "The Christian Science Monitor", "date": "2026-09-02 04:01", "url": "https://www.csmonitor.com/USA/Society/2026/0901/data-centers-AI-artificial-intelligence-space", "category": "tech", "importance": 3, "wl": false, "topic": "우주 데이터센터 구축 시도"}], "competitor": [{"title": "The era of AI-native RAN starts now - Nokia", "summary": "노키아가 AI 네이티브 RAN 시대를 선언하며 관련 기술 전략을 발표했다. 네트워크 자동화와 지능형 운영을 통해 차세대 통신망의 효율성을 높이는 것이 핵심이며, 기술 혁신을 통해 경쟁사와의 격차를 벌리려는 전략이다.", "source": "Nokia", "date": "2026-09-03 21:03", "url": "https://www.nokia.com/blog/the-era-of-ai-native-ran-starts-now/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 ai 네이티브"}, {"title": "Nokia opens AI research centre in Riyadh - fibre-systems.com", "summary": "노키아가 사우디아라비아 리야드에 AI 연구 센터를 개소했다. 이 센터는 AI 기반 네트워크 자동화 기술 개발에 집중하며, 사우디의 디지털 전환 전략에 발맞추어 현지 기술 생태계 구축과 네트워크 혁신을 주도할 예정이다.", "source": "fibre-systems.com", "date": "2026-09-03 17:50", "url": "https://www.fibre-systems.com/article/nokia-opens-ai-research-centre-riyadh", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 r&d"}, {"title": "DX 적자 속… 삼성전자 동행, 서초 이어 16~30일 이재용 자택 앞 집회", "summary": "삼성전자 DX부문이 올해 2분기 출범 이후 처음으로 분기 영업손실을 기록한 가운데, 스마트폰을 담당하는 MX와 네트워크 사업부를 포함한 부문의 실적 부진 소식을 다루고 있다. 사업부 전체의 실적 악화와 경영 상황을 진단하는 중요한 기업 공시 관련 보도이다. 향후 네트워크 사업부의 실적 개선 및 구조조정 여부가 주목된다.", "source": "inews24.com", "date": "2026-09-03 11:26", "url": "http://www.inews24.com/view/2001496", "category": "earnings", "importance": 4, "wl": false, "topic": "삼성전자 dx부문 적자"}, {"title": "美 '팍스 실리카' 맞불…中, 제3세계로 AI 인프라 확장", "summary": "미국의 '팍스 실리카' 전략에 맞서 중국이 제3세계로 AI 인프라 확장에 나서고 있다. ESS, 광통신 등 일부 공급망에서 중국 기업의 비중이 높지만 반도체 장비와 첨단 칩은 여전히 약점으로 꼽힌다. 화웨이와 창신메모리테크놀로지(CXMT) 등이 핵심 반도체 국산화에 속도를 내고 있으나 기술 자립까지는 과제가 산적해 있다. 글로벌 공급망 패권 경쟁의 단면이다.", "source": "hankyung.com", "date": "2026-09-02 18:23", "url": "https://www.hankyung.com/article/2026090203721", "category": "tech", "importance": 4, "wl": false, "topic": "중국 ai 인프라 확장"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 드론 실시간 추적 통신 기술을 공개할 예정이다. 한국 정부와 국내 기업들을 상대로 기술력을 적극 알리고 협력 방안을 모색하기 위한 행보로 풀이된다. 에릭슨 임원은 데이터를 빠르게 처리하는 6G와 AI 기능이 감지 및 통신 통합 기술(ISAC)과 결합되면 기술 효율성이 더욱 극대화될 것이라고 전망했다. 글로벌 통신장비 업체의 차세대 R&D 전략을 보여준다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 드론 기술"}, {"title": "Ericsson to Unveil Drone-Tracking Network Tech in Korea - Seoul Economic Daily", "summary": "에릭슨이 한국에서 드론 추적 네트워크 기술을 공개할 예정이다. 통신망을 활용한 드론 관제 및 안전 운용 기술을 선보임으로써 신규 비즈니스 모델을 창출하고 국내 시장에서의 기술 리더십을 강화하려는 목적이다.", "source": "Seoul Economic Daily", "date": "2026-09-02 17:46", "url": "https://en.sedaily.com/technology/2026/09/02/ericsson-to-unveil-drone-tracking-network-tech-in-korea", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 기술 공개"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI-RAN, ISAC(통신·감지 통합), 차별화된 커넥티비티와 6G로 이어지는 기술 리더십과 청사진을 제시했다. 에릭슨은 AI 시대의 경쟁력이 네트워크 고도화에서 시작된다고 강조하며 한국 고객 및 파트너와의 협력 의지를 다졌다. 글로벌 통신장비 선도 기업으로서 차세대 표준과 상용화 기술을 선점하겠다는 전략이다. 국내 통신 생태계와의 기술 교류가 한층 활발해질 전망이다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 청사진"}, {"title": "Huawei profits fall in H1 on revenues up 10% - Telecompaper", "summary": "화웨이의 상반기 매출은 10% 증가했으나 순이익은 감소했다. 글로벌 제재와 시장 환경 변화 속에서도 매출 성장을 유지했으나, 기술 투자 비용 증가와 시장 경쟁 심화로 인해 수익성 확보에는 어려움을 겪고 있다.", "source": "Telecompaper", "date": "2026-09-02 16:05", "url": "https://www.telecompaper.com/news/huawei-profits-fall-in-h1-on-revenues-up-10--1581432", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 실적"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - developingtelecoms.com", "summary": "에릭슨이 사우디 통신사 STC와 다년간의 5G 네트워크 확장 계약을 체결했다. 이번 계약을 통해 STC는 5G 커버리지를 확대하고 네트워크 품질을 강화할 예정이며, 에릭슨은 중동 시장에서의 입지를 더욱 공고히 다지게 되었다.", "source": "developingtelecoms.com", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 수주"}, {"title": "우리넷, KOREN 기반 AI 광네트워크 실증 착수", "summary": "우리넷이 KOREN(한국advanced연구망) 기반의 AI 광네트워크 실증 사업에 착수했다. 후속 과제인 '6G 수십테라급 초정밀 전달망 시스템 기술 개발 과제'를 통해 기능 고도화도 추진하고 있다. 기존 광전송망과 통신장비 기술 역량을 끌어올려 사업 영역을 다각화한다는 방침이다. AI 데이터센터 및 차세대 통신 인프라 시장에서의 경쟁력을 강화하고 있다.", "source": "thelec.kr", "date": "2026-09-03 19:10", "url": "https://www.thelec.kr/news/articleView.html?idxno=61790", "category": "tech", "importance": 3, "wl": false, "topic": "우리넷 ai 광네트워크"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "바이트댄스가 중국 네이멍구에 대규모 AI 데이터센터 건설을 추진한다. 과거 통신장비 업체 화웨이를 비롯해 콰이서우, 알리바바, 애플 등이 이 지역에 컴퓨팅 시설 관련 투자를 진행한 바 있다. 이번 데이터센터 투자는 급증하는 AI 컴퓨팅 수요를 소화하기 위한 전략적 행보다. 글로벌 빅테크들의 인프라 투자 경쟁이 치열해지고 있다.", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "contract", "importance": 3, "wl": false, "topic": "바이트댄스 ai데이터센터"}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "국내 장비업체 우리넷이 16Tbps급 네트워크 장비를 개발하여 NIA의 AI 네트워크 실증 사업에 참여합니다. 국내 통신 장비 국산화 및 AI 네트워크 상용화 시험의 일환입니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "tech", "importance": 3, "wl": true, "topic": "우리넷 ai 네트워크"}, {"title": "우리넷, NIA ‘AI 네트워크 장비 실증’ 주관기관 선정…상용화 추진", "summary": "우리넷이 한국지능정보사회진흥원(NIA)의 'AI 네트워크 장비 실증' 주관기관으로 선정되어 상용화 추진에 나섰다. 후속 과제인 '6G 수십테라급 초정밀 전달망 시스템 기술 개발'을 연계하여 기술 고도화를 이룬다. AI 데이터센터, 원격 로봇수술, 스마트팩토리 등 초저지연이 요구되는 분야로 사업 영역을 확장한다. 국산 통신장비의 기술력 입증과 시장 진입 가속화가 기대된다.", "source": "edaily.co.kr", "date": "2026-09-03 16:46", "url": "https://www.edaily.co.kr/News/Read?newsId=04572326645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "tech", "importance": 3, "wl": false, "topic": "우리넷 ai 네트워크 실증"}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "에릭슨이 FIS와 협력하여 핀테크 서비스 기능을 강화하는 등 통신 장비 외 분야로 사업을 확장하고 있습니다. 전통적인 장비 공급을 넘어 비즈니스 다변화를 꾀하는 경쟁사의 전략적 움직임입니다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "https://www.lightreading.com/smartphones-devices/eurobites-fairphone-opens-series-c-funding-round-after-happy-h1", "category": "tech", "importance": 3, "wl": true, "topic": "에릭슨 사업"}, {"title": "통신사도 통신장비도 AI로 달라진다…통신망 운영의 새 기준은 '예측'", "summary": "국내 통신사들이 AI를 활용해 네트워크 이상 징후를 사전에 감지하고 원인을 분석하는 시스템을 도입하는 가운데, 에릭슨과 노키아 등 글로벌 통신장비 업체들도 AI 기반 네트워크 관리 기술을 강화하고 있다. 통신망 운영의 새로운 기준이 '사후 대응'에서 '예측'으로 전환되는 추세다. 글로벌 장비사들의 기술 혁신이 국내 시장에도 큰 영향을 미치고 있다.", "source": "popcornnews.net", "date": "2026-09-02 15:50", "url": "http://www.popcornnews.net/news/articleView.html?idxno=131622", "category": "tech", "importance": 3, "wl": false, "topic": "통신장비업체 ai 네트워크"}, {"title": "Private 5G Isn't Dying, It's Narrowing to Factories, and Omdia Crowns Nokia, ZTE and Erics", "summary": "프라이빗 5G 시장이 공장 자동화 중심으로 재편되고 있는 가운데 옴디아가 노키아, ZTE, 에릭슨을 해당 분야의 주요 리더로 선정했다. 산업용 특화망 시장에서의 경쟁이 심화되고 있음을 시사한다.", "source": "Pasquale Pillitteri", "date": "2026-09-02 09:39", "url": "https://news.google.com/rss/articles/CBMijAFBVV95cUxObjM5TGtIQWlmLXRyRWMzS19kakxNaU40cjM0LWtnSWlpcGd2eTZlMGw5VVpjd0lCanpwTUt2Y0FlbUlHX1pJOThBWUM1YlplSERxMzNTbEdqYTEz  강조하는 조치입니다. 관련 규제 동향을 주시해야 합니다.", "source": "Light Reading", "date": "2026-09-03 21:00", "url": "https://www.lightreading.com/broadband/gao-issues-broadband-program-to-dos-for-fcc-ntia", "category": "policy", "importance": 3, "wl": true, "topic": "gao 광대역 프로그램"}, {"title": "\"K-콘텐츠 뿌리는 방송…규제 아닌 전략산업으로”", "summary": "한국방송협회가 방송산업 경쟁력 강화를 위해 규제 개선과 전략 산업 육성을 강조했습니다. 미디어 산업 활성화를 위한 제도적 지원 촉구 성격을 띱니다.", "source": "ZDNet Korea", "date": "2026-09-03 19:00", "url": "https://zdnet.co.kr/view/?no=20260903181500", "category": "policy", "importance": 3, "wl": true, "topic": "한국방송협회 방송산업"}, {"title": "미국 정부, AI 저작권 소송서 오픈AI 지지…\"학습 제한하면 혁신 저해\"", "summary": "미국 정부가 오픈AI의 저작권 소송에서 기술 혁신을 위해 오픈AI의 입장을 지지했습니다. AI 산업 육성을 위한 정책적 지원 기조를 반영합니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:28", "url": "https://zdnet.co.kr/view/?no=20260903171308", "category": "policy", "importance": 3, "wl": true, "topic": "미국 정부 오픈ai"}, {"title": "국회, 'AI기본사회법' 발의…공공서비스·국민 권리 강화", "summary": "국회에서 AI 공공서비스 이용과 국민 권리 보장을 위한 'AI 기본사회법'이 발의되었습니다. 인공지능 활용 확산에 따른 제도적 기반 마련을 목적으로 합니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:09", "url": "https://zdnet.co.kr/view/?no=20260903170814", "category": "policy", "importance": 3, "wl": true, "topic": "국회 ai 기본사회법"}, {"title": "\"중학생까진 AI 안 돼\"…美 뉴욕시, 교실서 생성형 AI 사용 막는다", "summary": "미국 뉴욕시가 초·중학교 교실에서 생성형 AI 사용을 1년간 금지합니다. 학생들의 학습 영향과 부작용을 고려한 교육 현장의 규제 조치입니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:03", "url": "https://zdnet.co.kr/view/?no=20260903170219", "category": "policy", "importance": 3, "wl": true, "topic": "미국 뉴욕시 ai 금지"}, {"title": "AI regulatory regime should be nimble, not over-constraining: Top PM advisor", "summary": "인도 정부가 AI 규제 체계를 마련 중이며, 과도한 규제보다는 유연한 접근이 필요하다는 의견이 제시되었습니다. 신기술 확산을 저해하지 않으려는 정책 방향성을 보여줍니다.", "source": "ET Telecom", "date": "2026-09-03 16:55", "url": "https://telecom.economictimes.indiatimes.com/news/policy/ai-regulatory-regime-should-be-nimble-not-over-constraining-top-pm-advisor/133729523", "category": "p 부의 적극적인 지원책 마련을 한목소리로 촉구했다. 5G SA와 6G 등 차세대 기술 투자가 필요한 시점이나 통신 시장 성장이 정체되어 새로운 수익 창출이 어렵다는 입장이다. 네트워크 정책의 패러다임을 전환하여 지속 가능한 투자 여력을 확보해야 한다고 강조했다. 정부와 업계 간의 정책 공조가 필요한 국면이다.", "source": "kidd.co.kr", "date": "2026-09-03 17:40", "url": "https://kidd.co.kr/news/247290", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 ai 네트워크 정책"}, {"title": "플리토, 육군에 AI 민원상담 구축…장병·국민 문의 24시간 대응", "summary": "플리토가 이스트소프트, 와이즈넛과 컨소시엄을 구성해 육군과 'AI 기반 민원상담체계 개발' 업무협약을 체결했습니다. 군 폐쇄망에서도 작동하는 AI를 통해 국방 분야 AX를 추진합니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:36", "url": "https://zdnet.co.kr/view/?no=20260903173519", "category": "contract", "importance": 3, "wl": true, "topic": "플리토 육군 ai 민원상담"}, {"title": "[포스트 오라클] 기업은행도 선택한 EDB…안정성으로 승부", "summary": "IBK기업은행을 비롯해 국내 대형 자동차 제조사와 통신사도 일부 업무 시스템의 데이터베이스(DB)를 오라클에서 EDB로 전환하며 안정성을 확보하고 있다. EDB는 장애 발생 시 정해진 시간 내 반드시 해결한다는 서비스수준목표(SLO)를 고객에게 약속한다고 밝혔다. 외산 독점 구조를 탈피하여 핵심 인프라의 안정성을 높이는 전환 사례다.", "source": "bloter.net", "date": "2026-09-03 17:33", "url": "https://www.bloter.net/news/articleView.html?idxno=672659", "category": "contract", "importance": 3, "wl": false, "topic": "기업은행 edb db전환"}, {"title": "Distributed AI inference is redrawing the network map (Reader Forum)", "summary": "AI가 중앙 집중식 학습에서 분산 추론으로 전환됨에 따라 네트워크 아키텍처가 근접성, 지연 시간, 탄력성을 중심으로 재편되고 있습니다. 메트로 광섬유, 엣지 코넥티비티, 광학 인프라의 중요성이 커지고 있습니다.", "source": "RCR Wireless", "date": "2026-09-03 17:00", "url": "https://rcrwireless.com/20260903/network-infrastructure/distributed-ai-redrawing-the-network-map-reader-forum", "category": "tech", "importance": 3, "wl": true, "topic": "네트워크 인프라 ai"}, {"title": "AI pushes fiber networks toward a capacity crunch, AFL says", "summary": "AFL 관계자는 AI 인프라 배포에 있어 광섬유 가용성과 전력 제약이 추가적인 도전 과제를 제시한다고 밝혔습니다. AI 트래픽 급증에 따른 네트워크 용량 병목현상 우려를 다루고 있습니다.", "source": "RCR Wireless", "date": "2026-09-03 16:07", "url": "https://rcrwireless.com/20260903/networks/ai-fiber-afl", "category": "tech", "importance": 3, "wl": true, "topic": "ai 광섬유"}, {"title": "SKT·KT·LGU+, 정부에 '네트워크 투자' 지원 촉구", "summary": "SK텔레콤, KT, LG유플러스 등 통신 3사가 정부를 향해 네트워크 및 6G 투자에 대한 정책적 지원을 강력히 촉구했다. AI 네트워크의 국가 전략 인프라 지정과 함께 현장 실증 및 초기 수요 창출의 중요성을 강조했다. 통신사의 투자 여력을 제고하기 위한 세제 혜택과 규제 완화가 필수적이라는 입장이다. 향후 차세대 통신망 구축 속도에 결정적인 영향을 미칠 전망이다.", "source": "bloter.net", "date": "2026-09-03 15:58", "url": "https://www.bloter.net/news/articleView.html?idxno=672549", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 네트워크 투자 지원"}, {"title": "Deutsche Telekom jumps after report on Elliott taking a stake - marketscreener.com", "summary": "엘리엇 매니지먼트가 도이치텔레콤의 지분을 매입했다는 보도가 나오면서 시장의 주목을 받고 있다. 구체적인 매입 규모나 전략적 의도는 아직 확인되지 않은 상태이다. 글로벌 통신 시장에서 대형 투자자의 움직임은 향후 통신사의 경영 전략과 주가에 상당한 영향을 미친다. 향후 도이치텔레콤의 지배구조 변화 및 경영 전략 방향을 주시할 필요가 있다.", "source": "marketscreener.com", "date": "2026-09-03 15:37", "url": "https://www.marketscreener.com/news/deutsche-telekom-jumps-after-report-on-elliott-taking-a-stake-ce7858d3df89f222", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 지분 매입"}, {"title": "\"은행·증권·보험·연금 한눈에\"…해빗팩토리, SKT 손잡고 ‘금융 AI’ 출격 - 조세일보", "summary": "해빗팩토리가 SKT와 손잡고 AI 기술을 활용한 금융 AI 서비스를 전격 출시했다. 양사는 AI 기반 금융 데이터 분석 및 서비스 고도화를 추진할 계획이다. 통신사의 AI 기술이 금융 등 이종 산업과의 융합을 통해 영역을 넓혀가고 있음을 보여준다. 향후 통신-금융 융합 서비스 시장의 활성화가 기대된다.", "source": "조세일보", "date": "2026-09-03 15:05", "url": "https://m.joseilbo.com/news/view.htm?newsid=575025", "category": "tech", "importance": 3, "wl": false, "topic": "skt 금융 ai 서비스"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 AWS의 얀 호프마이어를 차기 CTO로 선임했습니다. 이는 통신사의 디지털 전환 전략의 일환으로 해석됩니다. 외부 인재 영입을 통한 기술 역량 강화를 추진하고 있습니다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 인사"}, {"title": "Verizon Communications stock edges higher as Q2 2026 beats estimates and insider selling d", "summary": "버라이즌의 2분기 실적이 시장 예상치를 상회하며 주가가 소폭 상승했다. 견조한 실적 달성과 내부자 거래 동향이 함께 보도되었다.", "source": "AD HOC NEWS", "date": "2026-09-03 14:42", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-edges-higher-as-q2-2026-beats-estimates-and/70047238", "category": "earnings", "importance": 3, "wl": false, "topic": "버라이즌 실적"}, {"title": "VodafoneThree to launch debut TV service in challenge to UK rivals", "summary": "보다폰쓰리가 영국 시장에서 경쟁력을 강화하기 위해 TV 서비스를 출시하고 광대역 사업 확장을 꾀하고 있습니다. 번들 서비스를 통한 가입자 유치 및 경쟁사 대응 전략의 일환입니다.", "source": "Financial Times Tech", "date": "2026-09-03 13:00", "url": "https://www.ft.com/content/b44fcdbd-4c0e-4032-b81a-98e309991388?syn-25a6b1a6=1", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 tv서비스"}, {"title": "Deutsche Telekom names Mirchandani CFO in shake-up - Briefs Finance", "summary": "도이치텔레콤이 경영진 교체 인사 과정에서 새로운 최고재무책임자를 임명했다. 재무 건전성 강화와 투자 전략 재편을 위한 인사이다.", "source": "Briefs Finance", "date": "2026-09-03 06:44", "url": "https://www.briefs.co/news/deutsche-telekom-taps-dhananjay-mirchandani-as-next-cfo-in-b/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 임원 인사"}, {"title": "CHTR Stock Pops As Spectrum, Cox, Liberty Deals Reshape Charter - timothysykes.com", "summary": "스펙트럼, 콕스, 리버티 관련 딜과 구조조정 이슈가 차터 커뮤니케이션즈의 주가 움직임과 사업 재편에 영향을 미치고 있다는 분석이다.", "source": "timothysykes.com", "date": "2026-09-03 05:47", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02-2/", "category": "contract", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션즈 인수합병"}, {"title": "CHTR Stock Pops As Charter Leans Into Scale And Streaming Bundles - timothysykes.com", "summary": "차터 커뮤니케이션즈가 규모의 경제와 스트리밍 번들 상품 결합 전략을 강화하면서 시장에서 긍정적인 반응을 얻고 있다.", "source": "timothysykes.com", "date": "2026-09-03 04:03", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "contract", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션즈 전략"}, {"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "이통 3사가 세제·주파수·규제 완화의 3박자 지원을 통해 네트워크 및 AIDC 투자를 늘려야 한다고 요구했다. 과기정통부 통신정책기획과장은 투자환경 개선을 패키지로 추진하겠다고 화답하며 민관협의체에서 구체적인 논의를 예고했다. 3G 종료 역시 5G와 6G 투자를 위한 당연한 수순으로 검토되고 있다. 정부와 통신업계 간의 규제 합리화 논의가 활발히 진행 중이다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 3, "wl": false, "topic": "이통3사 네트워크 지원 촉구"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 AI-RAN(인공지능 무선접속망) 네트워크 전환 기술 검증에 착수했다. 로봇, 드론 등 피지컬 AI 장비가 AI-RAN 시험망을 벗어나 일반 5G 망으로 이동하는 시나리오를 구현했다. 무선 환경이 급변하는 상황에서도 최적의 네트워크를 자동으로 선택하고 안정적인 연결을 유지하는 기술을 실증했다. 향후 차세대 통신 인프라의 지능화 고도화에 기여할 것으로 기대된다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai-ran 검증"}, {"title": "“삐, 공사장 탐지됐습니다”… AI가 미리 찾는 통신망 위험 - 동아일보", "summary": "통신사들이 AI 기술을 도입하여 공사장 등 유·무선 통신망의 잠재적 위험 요소를 사전에 탐지하는 시스템을 구축하고 있다. 네트워크 안정성 확보와 사고 예방 능력이 한층 강화될 것으로 기대된다.", "source": "동아일보", "date": "2026-09-03 00:30", "url": "https://www.donga.com/news/Economy/article/all/20260902/134592397/2", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 통신망 위험 탐지"}, {"title": "Canadian pension fund La Caisse buys 24% in Altius for ₹12,100 crore - Business Standard", "summary": "캐나다 연기금 라케스가 알티우스의 지분을 대규모로 인수하며 인프라 및 자원 관련 투자 행보를 이어갔다.", "source": "Business Standard", "date": "2026-09-02 22:47", "url": "https://www.business-standard.com/india-news/canadian-pension-fund-la-caisse-buys-24-in-altius-for-12-100-crore-126090201316_1.html", "category": "contract", "importance": 3, "wl": false, "topic": "캐나다 연기금 투자"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "AI 국가 경쟁력 확보를 위해 레거시 네트워크(3G)를 유지하면서 5G SA나 6G에 투자하는 것은 비효율적이므로 정부의 지원이 필요하다는 주장이 제기됐다. 과기정통부는 새로운 네트워크 투자가 가져올 편익을 고려하여 통신사의 투자 여력을 뒷받침할 방안을 모색하겠다고 밝혔다. 통신망 고도화를 위한 제도적 개선과 민관 협력이 핵심 화두로 부각되고 있다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 네트워크 투자 지원"}, {"title": "Deutsche Telekom CFO Christian Illek To Leave Company In April 2027 - TradingView", "summary": "도이치텔레콤의 크리스티안 일렉 CFO가 2027년 4월에 사임할 예정이라고 발표했다. 장기적인 재무 리더십 교체 계획의 일환이다.", "source": "TradingView", "date": "2026-09-02 19:37", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_FWN44T17M:0-deutsche-telekom-cfo-christian-illek-to-leave-company-in-april-2027/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 임원 퇴임"}, {"title": "What is JioPC? Know All About Reliance Jio's Standalone Cloud Platform; Check Prices, Plan", "summary": "인도의 릴라이언스 지오가 자체 클라우드 플랫폼인 'JioPC'를 전격 출시했다. 전통적인 통신 서비스를 넘어 클라우드 및 소프트웨어 영역으로 사업 포트폴리오를 확장하고 있다. 통신사들의 디지털 서비스 다각화 전략의 일환이다.", "source": "latestly.com", "date": "2026-09-02 18:40", "url": "https://www.latestly.com/technology/what-is-jiopc-know-all-about-reliance-jios-standalone-cloud-platform-check-prices-plans-and-how-it-works-7586722.html/amp", "category": "tech", "importance": 3, "wl": false, "topic": "릴라이언스지오 클라우드 플랫폼"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "통신사들이 AI-RAN, 6G 등 차세대 네트워크 투자를 확대함에 따라 기존의 기지국 중심 CAPEX 지표를 보완해야 한다는 목소리가 나온다. 현행 국가전략기술 사업화시설 세액공제 제도는 대기업 기준 15%이지만 개방형 시설의 경우 이용내역 입증 등의 한계가 지적된다. 차세대 통신 인프라 투자를 유인하기 위한 제도적 보완책 마련이 시급하다는 진단이다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 capex 지표 보완"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "5년 뒤 AI 트래픽이 최대 5배 폭증할 것으로 예상됨에 따라 네트워크를 국가 AI 인프라로 육성해야 한다는 주장이 제기됐다. 5G SA, AI-RAN, 6G 등에 대한 투자 지원과 함께 서비스 특성에 부합하는 네트워크 품질 보장이 요구된다. 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 적극 검토하겠다고 밝혔다. 정부와 통신업계의 긴밀한 인프라 협력이 가시화되고 있다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 3, "wl": false, "topic": "ai 인프라 네트워크 지원"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "망 투자는 늘어나는 반면 수익 창출은 제한적인 상황에서 통신 3사가 AI 시대에 맞는 정책 재설계를 요구했다. 3G 같은 레거시 망 유지와 5G SA·6G 투자의 이중고를 해소하기 위해 3G 종료 등의 유연한 정책이 필요하다는 지적이다. 과기정통부도 새로운 네트워크 투자의 중요성에 공감하며 제도 개선 가능성을 열어두었다. 통신 시장의 구조적 변화에 대응하기 위한 민관 소통이 이어지고 있다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 ai시대 정책"}, {"title": "BTC to launch commercial 5G services in Gabarone in October - Telecompaper", "summary": "보츠와나텔레콤이 10월에 가보로네 지역에서 상용 5G 서비스를 출시할 예정이다. 아프리카 지역 통신사의 차세대 이동통신망 상용화 동향을 보여준다.", "source": "Telecompaper", "date": "2026-09-02 17:34", "url": "https://www.telecompaper.com/news/btc-to-launch-commercial-5g-services-in-gabarone-in-october--1581407", "category": "contract", "importance": 3, "wl": false, "topic": "btc 5g 상용화"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계 전문가들이 정부를 향해 통신사의 AI 네트워크 및 데이터센터 투자비 지원 확대를 거듭 촉구했다. 통신사의 'AI를 위한 NW' 투자를 촉진하기 위해 망 중립성 가이드라인 정비, 주파수 할당 대가 및 전파사용료 인하 등이 시급하다는 진단이다. 과도한 정책성 비용 부담을 완화하여 실질적인 망 투자 인센티브를 제공해야 한다는 목소리가 높다. 향후 정책 반영 여부가 주목된다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 ai nw 투자 지원"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "통신사가 부담하는 주파수 할당 대가가 연간 8000억원, 전파사용료가 약 2000억원에 달하는 것으로 나타났다. 전문가들은 재할당 비용을 절감하고 설비투자 및 AI 인프라 투자 확대로 연계할 필요가 있다고 국회 세미나에서 제안했다. 통신망 고도화를 위한 민간 투자를 유인하기 위해 정부의 규제 비용 완화가 필수적이라는 지적이다. 차세대 통신 정책 수립에 중요한 변수로 작용할 전망이다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 전파사용료 완화"}, {"title": "HPE scores Wi-Fi and AI goals as 5G and VMware lose out", "summary": "토트넘 홋스퍼 스타디움이 HPE 기술을 활용해 Wi-Fi 7과 AI 기능을 갖춘 멀티미디언 업그레이드를 거의 마쳤습니다. 대형 경기장 인프라 구축 및 최신 무선 기술 적용 사례입니다.", "source": "Light Reading", "date": "2026-09-02 15:00", "url": "https://www.lightreading.com/wifi/hpe-scores-wi-fi-and-ai-goals-as-5g-and-vmware-lose-out", "category": "contract", "importance": 3, "wl": true, "topic": "hpe 스타디움"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신사들이 주파수 할당 대가, 전파사용료, 무선국 검사 수수료 등으로 연간 약 1조원에 달하는 규제 비용을 부담하고 있는 것으로 조사됐다. 6G 상용화와 AI 네트워크 투자가 본격화되는 시점에서 이러한 고비용 구조가 투자의 걸림돌로 작용하고 있다. 통신 인프라 고도화를 위한 합리적인 규제 완화와 세제 지원의 필요성이 거세게 제기되고 있다. 업계와 정부 간의 실효성 있는 대책 협의가 요구된다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 규제비용 부담"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "AI 3대 강국 도약을 위해 망 인프라와 AIDC 부문의 민간 투자를 과감하게 이끌어내야 한다는 현장 제언이 나왔다. 주파수 할당 대가와 전파사용료 등 정책성 비용의 부담을 낮추어 실제 투자 확대로 이어지는지 점검해야 한다는 지적이다. 연세대 교수는 AIDC 투자를 촉진하기 위해 시행령부터 정교하게 다듬어야 한다고 조언했다. 정부의 정책적 뒷받침이 민간 투자 마중물 역할을 할 것으로 기대된다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 3, "wl": false, "topic": "ai 인프라 민간투자 유인"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤이 해킹 후유증을 털어내고 통신 본업 회복과 함께 AI 가치를 부각하고 있다. 하나증권 연구원은 신규 주파수 할당, 5G 요금제 개편, 5G SA 상용화와 더불어 AI 기지국 보급 확대 정책이 논의될 가능성이 크다고 진단했다. AI의 양대 성장 축인 데이터센터와 기지국 투자가 맞물리며 실적 개선에 대한 기대감이 커지고 있다. 통신 본업의 경쟁력 회복이 가속화되는 양상이다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai 기지국"}, {"title": "여의도 뒤덮을 100만 인파...LG유플러스, 이동기지국·AI로 통신 장애 막는다 - 소비자경제", "summary": "LG유플러스가 대규모 인파가 몰리는 여의도 행사에 대비하여 이동기지국을 배치하고 AI 기술을 활용해 통신 장애 예방에 총력을 기울인다. 트래픽 폭주에 선제적으로 대응하여 안정적인 통신 서비스를 제공할 방침이다.", "source": "소비자경제", "date": "2026-09-02 12:52", "url": "http://www.dailycnc.com/news/articleView.html?idxno=244607", "category": "other", "importance": 3, "wl": false, "topic": "lg유플러스 축제 통신망 대응"}, {"title": "[4th-AI] \"AI 3대 강국 가려면 통신망 규제 풀고 AIDC 지원 체계 손봐야\"", "summary": "AI 3대 강국 도약을 위해 통신망 규제를 풀고 AIDC 지원 체계를 전면 손봐야 한다는 주장이 제기됐다. 주파수 할당 대가와 연간 2000억원에 달하는 전파사용료 등 통신사 부담 비용을 투자 여력 관점에서 재검토해야 한다는 지적이다. 전파 관리 등의 목적과 실효성을 따져 규제 비용을 합리화해야 민간 투자가 살아날 수 있다는 분석이다. 정부의 정책 방향 전환이 시급한 시점이다.", "source": "4th.kr", "date": "2026-09-02 12:24", "url": "http://www.4th.kr/news/articleView.html?idxno=2117312", "category": "policy", "importance": 3, "wl": false, "topic": "통신망 규제 완화"}]};
const NEWS_LATEST = [{"title": "Vodafone Follows Airtel: 5G Network Slicing Live with Minimum 15 Mbps Speeds - TelecomTalk", "summary": "보다폰이 에어텔에 이어 5G 네트워크 슬라이싱 서비스를 상용화했다. 최소 15Mbps 속도를 보장하며 기업용 특화 서비스 시장을 공략하고 있으며, 네트워크 효율성을 높이고 수익원을 다변화하려는 전략이다.", "source": "TelecomTalk", "date": "2026-09-04 00:03", "url": "https://telecomtalk.info/vodafone-follows-airtel-5g-network-slicing-live/1011530/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰 5g 슬라이싱"}, {"title": "Nokia and BeeHealthy Bring Network-based Verification to Digital Healthcare - NewswireToda", "summary": "노키아와 비헬시가 네트워크 기반 검증 기능을 디지털 헬스케어에 도입하기 위한 협력을 진행한다. 통신망 보안 및 인증 기술의 타 산업 적용 사례이다.", "source": "NewswireToday", "date": "2026-09-04 00:01", "url": "https://www.newswiretoday.com/news/186783/Nokia-and-BeeHealthy-Bring-Network-based-Verification-to-Digital-Healthcare/", "category": "contract", "importance": 2, "sid": "competitor", "topic": "노키아 헬스케어"}, {"title": "AT&T tops Ethernet Leaderboard amid ranking shakeup – Vertical Systems", "summary": "AT&T가 버티컬 시스템즈가 발표한 미국 통신사 이더넷 리더보드에서 1위를 유지했습니다. 이번 순위는 통신사 간 경쟁 구도 속에서도 AT&T의 시장 지배력을 보여줍니다. 통신사 네트워크 부문의 시장 점유율과 경쟁력을 가늠할 수 있는 지표입니다.", "source": "Light Reading", "date": "2026-09-03 23:44", "url": "https://www.lightreading.com/broadband/at-t-tops-ethernet-leaderboard-amid-ranking-shakeup-vertical-systems", "category": "other", "importance": 3, "sid": "carrier", "topic": "at&t 이더넷 리더보드"}, {"title": "[통신3사 AI 경량화] KT, 기업용 AI 크기 세분화…‘B2B’ 전략 : 네이버 블로그 - Naver Blog", "summary": "KT가 기업용 AI 시장 공략을 본격화하기 위해 B2B 전략을 강화하고 AI 모델 크기를 세분화했다. 기업 고객의 다양한 수요에 맞춘 맞춤형 AI 솔루션 제공을 통해 시장 경쟁력을 확보하려는 전략이다. 통신사의 B2B 인프라 및 AI 서비스 다각화 흐름을 보여준다. 향후 통신 기반 AI 수익화 모델의 성과가 주목된다.", "source": "Naver Blog", "date": "2026-09-03 23:40", "url": "https://blog.naver.com/PostView.naver?blogId=dealsite&logNo=224399940686&redirect=Dlog", "category": "tech", "importance": 3, "sid": "carrier", "topic": "kt 기업용 ai"}, {"title": "SmarTone chairman warns over revenue slide", "summ <script>
const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};
const SEC_NAME={competitor:"경쟁사",carrier:"통신사",satellite:"위성·6G",policy:"정책·규제",outage:"Outage"};
const TABS=[
  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성·6G",    secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
