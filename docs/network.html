하기 위한 고도화된 무선 통신 기술 검증에서 핵심적인 성과를 거두었습니다. 이번 실증은 향후 글로벌 6G 장비 시장에서 양사의 기술 경쟁력을 공고히 하는 계기가 될 것입니다. 첨단 대용량 통신 인프라 수요에 대응하는 양사의 전략적 협력 관계를 보여주는 대표적 사례입니다.", "source": "dxmagazine.jp", "date": "2026-09-03 19:59", "url": "https://dxmagazine.jp/news/2640ko109/", "category": "tech", "importance": 5, "wl": false, "topic": "kddi 삼성전자 6g"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - Fierce Network", "summary": "에릭슨과 스페인 통신사 마스오렌지가 6 GHz 주파수 대역을 활용한 테스트를 성공적으로 진행했다. 이는 차세대 통신 기술인 6G 상용화를 향한 초기 단계의 중요한 기술 진전이다. 글로벌 통신장비 시장의 차세대 기술 경쟁 구도를 보여준다.", "source": "Fierce Network", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 마스오렌지 6ghz 테스트"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤과 에릭슨이 독일 함부르크의 알텐베르더 컨테이너 터미널에 프라이빗 5G 네트워크를 구축했다. 양사가 수년간 협력해온 산업용 셀룰러 기술 실험의 최신 성과로, 항만 물류 현장의 스마트 자동화를 지원한다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 4, "wl": true, "topic": "에릭슨 프라이빗 5g"}, {"title": "BSNL's homegrown 4G network carries 6 PB data per day: C-DoT - The Economic Times", "summary": "인도의 국영 통신사 BSNL이 자국 기술(C-DoT 개발)을 기반으로 구축한 토종 4G 네트워크가 하루 평균 6페타바이트(PB)의 방대한 데이터 트래픽을 처리하며 안정적으로 운영되고 있습니다. 외산 장비 의존도를 낮추고 국산화율을 높인 인도 통신 정책의 가시적인 성과입니다. 인도 내 통신 장비 시장에서 국산 솔루션의 입지가 강화되고 있음을 시사합니다.", "source": "The Economic Times", "date": "2026-09-04 23:32", "url": "https://economictimes.indiatimes.com/industry/telecom/telecom-news/bsnls-homegrown-4g-network-carries-6-pb-data-per-day-c-dot/articleshow/133767038.cms", "category": "contract", "importance": 4, "wl": false, "topic": "bsnl c-dot 4g 네트워크"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "sum  "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 임원"}, {"title": "Global Telecom Capex Ranking 2026: AT&T, Deutsche Telekom, China Mobile, NTT and Verizon L", "summary": "2026년 글로벌 통신사 설비투자(Capex) 순위 집계 결과 AT&T, 도이치텔레콤, 차이나모바일, NTT, 버라이즌 등이 상위권을 차지했다. 세계 주요 통신사들의 망 투자 규모와 전략적 우선순위를 보여주는 지표다.", "source": "TelecomLead", "date": "2026-09-03 22:48", "url": "https://telecomlead.com/5g/global-telecom-capex-ranking-2026-att-deutsche-telekom-china-mobile-ntt-and-verizon-lead-network-investment-127592", "category": "earnings", "importance": 4, "wl": false, "topic": "글로벌 통신사 설비투자 순위"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - AD HOC NEWS", "summary": "버라이즌 커뮤니케이션스가 프론티어(Frontier) 통신 인수 추진과 최고경영진 교체 소식을 동시에 전했다. 대형 유선 통신 인프라 인수를 통해 기업 경쟁력을 강화하려는 전략적 행보다. 업계 대형 M&A 이슈다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "contract", "importance": 4, "wl": false, "topic": "버라이즌 프론티어 인수 ceo 교체"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - press9.kr", "summary": "그동안 투자를 축소해왔던 SK텔레콤과 LG유플러스 등 국내 이동통신사들이 5G SA 고도화 및 향후 주파수 경매 변수에 대응해 망 투자를 다시 늘릴 가능성이 제기되고 있다. 통신사들의 설비투자(Capex) 기조 변화는 국내 네트워크 장비 시장에 직접적인 영향을 미친다.", "source": "press9.kr", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "contract", "importance": 4, "wl": false, "topic": "skt lgu+ 망 투자 재개"}, {"title": "AT&T (T) Q2 2026 Earnings Call Transcript - fortune.com", "summary": "미국 통신사 AT&T가 2026년 2분기 실적 발표 컨퍼런스 콜을 개최하고 주요 경영 지표와 가이던스를 공유했다. 5G 및 광대역 통신망 투자 성과와 재무 건전성 지표가 공개되었다. 주요 통신사의 분기 실적 발표다.", "source": "fortune.com", "date": "2026-09-03 12:48", "url": "https://fortune.com/company/att/earnings/q2-2026/", "category": "earnings", "importance": 4, "wl": false, "topic": "at&t 2분기 실적 컨퍼런스"}, {"title": "SKT '수요'·KT '이음'·카카오 '편리'…모두의 AI 개발 시동 - 전자신문", "summary": "SK텔레콤, KT, 카카오 등 주요 통신·플랫폼사가 정부 주도의 '모두의 AI' 개발에 시동을 걸었습니다. 각사의 강점을 살린 실행형 AI 서비스를 연내 선보일 계획입니다. 국가 AI 경쟁력 강화를 위한 민관 협력 프로젝트입니다.", "source": "전자신문", "date": "2026-09-05 12:00", "url": "https://www.etnews.com/20260904000276", "category": "tech", "importance": 3, "wl": false, "topic": "과기정통부 모두의ai"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신사들이 트레이(TRAI)가 제안한 5G 네트워크 슬라이싱 서비스 품질(QoS) 규제 지침에 대해 강하게 반발하고 있다. 무선 자원 이용률 상한선 설정 등이 기술적으로 비효율적이고 운영 부담을 가중시킨다는 지적이다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "인도 trai 5g 슬라이싱 규제 반발"}, {"title": "KT, ‘모두의 AI’ 이음 본격화...생활 속 ‘1인 1 AI 에이전트’ 구현 - fnnews1.com", "summary": "KT가 '모두의 AI' 이음 프로젝트를 본격화하며 생활 속 '1인 1 AI 에이전트' 구현에 나섭니다. 멀티모델과 토큰 팩토리를 결집해 대중화된 AI 시대를 열어갈 계획입니다.", "source": "fnnews1.com", "date": "2026-09-05 10:52", "url": "https://www.fnnews1.com/news/articleViewAmp.html?idxno=108102", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - 연합뉴스", "summary": "기존의 통신사 기지국 인프라가 인공지능(AI) 데이터센터로 탈바꿈하는 통신사들의 사업 다각화 변신이 시작됐다. 엣지 컴퓨팅과 AI 서비스를 결합하여 새로운 수익원을 창출하려는 전략이다. 업계의 인프라 활용 트렌드를 다룬다.", "source": "연합뉴스", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR20260904023000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 기지국 ai 데이터센터 변신"}, {"title": "T-Mobile (NASDAQ:TMUS): Is Today’s Move More Than Sector Momentum? - Kalkine Media", "summary": "미국 통신사 T모바일 주가의 최근 움직임이 단순한 통신 섹터 전반의 모멘텀을 넘어선 독자적인 성장성에 기인한 것인지 분석했다. 가입자 증가세와 경영 전략 변화가 투자 심리에 미친 영향을 다룬다.", "source": "Kalkine   return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;

}

  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}

  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],

];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}

    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출

      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);

    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
