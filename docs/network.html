/reinventing-business-internet-from-the-ground-up-and-the-sky-down/article_124462fe-1053-5caf-b6d3-bcc1f097ece5.html", "category": "tech", "importance": 3, "wl": false, "topic": "위성통신 서비스"}, {"title": "\"2만9000원→0원\" 비행기서 유튜브 공짜로 본다…대한항공, 이달 중 '스타링크' 도입 - 네이트", "summary": "대한항공이 이달 중 기내에서 무료로 유튜브 등을 시청할 수 있는 스타링크 위성인터넷 서비스를 도입한다. 항공사들의 고속 위성통신 채택 확대를 보여준다.", "source": "네이트", "date": "2026-09-04 10:27", "url": "https://news.nate.com/view/20260904n09723", "category": "contract", "importance": 3, "wl": false, "topic": "대한항공 스타링크"}], "competitor": [{"title": "[단독] \"5G 한계 지웠다\" 삼성, 日 KDDI와 7GHz 대역서 3.6Gbps 역대급 속도 입증 The Guru - Investing.com 한국어", "summary": "삼성전자가 일본 KDDI와 함께 7GHz 대역에서 3.6Gbps 속도를 구현하며 차세대 5G 통신 기술력을 입증했다. 기존 주파수의 한계를 뛰어넘는 전송 성능을 보여주며 글로벌 통신 장비 시장에서의 경쟁 우위를 재확인했다. 향후 글로벌 수주 전에서 강력한 마케팅 포인트로 작용할 전망이다.", "source": "Investing.com 한국어", "date": "2026-09-04 09:11", "url": "https://m.kr.investing.com/news/stock-market-news/article-2084212?ampMode=1", "category": "tech", "importance": 5, "wl": false, "topic": "삼성전자 기술"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신사들이 트라이(TRAI)가 제안한 5G 슬라이싱 서비스 품질 기준 제정에 대해 반대 입장을 표명했다. 트라이는 자원 이용률을 모니터링하여 무선 자원 활용도가 80퍼센트를 넘지 않도록 제한하는 방안을 제안했으나, 통신사들은 기술적으로 비현실적이며 심각한 운영 부담을 초래할 것이라고 주장하고 있다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 4, "wl": true, "topic": "인도 텔코 5g 슬라이싱"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다", "summary": "노키아가 나주에서 머신러닝 기반 채널 추정 기술을 시험한 뒤 삼성전자와 함께 성남 일대 상용망에 AI 기지국 기술을 적용한다. 글로벌 장비사와 삼성전자의 AI 네트워크 상용화 협력이다.", "source": "yna.co.kr", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/view/AKR20260904023000017?input=1195m", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 삼성전자 ai기지국"}, {"title": "BSNL 4G network carries 6 PB data every day: C が〝空飛ぶ基地局〟HAPSの商用化に向けた試験サービスに成功 - @DIME アットダイム", "summary": "소프트뱅크가 '하늘 띄우는 기지국'으로 불리는 성층권 통신 플랫폼(HAPS)의 상용화를 위한 시험 서비스에 성공했다. 지상 기지국이 닿지 않는 오지나 재난 지역에 공중에서 통신망을 제공하는 혁신 기술이다. 차세대 무선 커버리지 확장 수단으로 기대를 모은다.", "source": "@DIME アットダイム", "date": "2026-09-06 06:29", "url": "https://dime.jp/genre/2150592/", "category": "tech", "importance": 3, "wl": false, "topic": "소프트뱅크 기술"}, {"title": "KT 해킹 보상으로 티빙 봤다가…개인정보 52만건 또 유출 - v.daum.net", "summary": "KT의 해킹 보상 이벤트인 티빙 시청 과정에서 52만 명의 개인정보가 추가로 유출되는 사고가 터졌다. 고객 보상 프로그램이 보안 취약점으로 인해 또 다른 피해를 낳았다. 통신사의 개인정보 보호 체계에 대한 심각한 결함이 드러났다. 향후 법적 책임과 당국의 조사가 불가피하다.", "source": "v.daum.net", "date": "2026-09-06 06:02", "url": "https://v.daum.net/v/20260906060255936", "category": "policy", "importance": 3, "wl": false, "topic": "kt 개인정보유출"}, {"title": "통신3사 AI 데이터센터 확장에 탄소배출 관리 부담 커진다, 재생에너지...", "summary": "SK텔레콤은 안정적 5G 서비스를 제공하기 위한 통신 장비 증설로 전력 사용량과 이에 따른 간접배출량이 늘어난 점을 배출량 증가 원인으로 들었다. 향후 AIDC 사업이 본격적으로 확대되면 이런 부담은 더 커질...", "source": "businesspost.co.kr", "date": "2026-09-06 06:00", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=446333", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Gov’t to upgrade all rural telephony networks to 4G capability – Sam George - MyJoyOnline", "summary": "정부가 농어촌 지역의 모든 전화 네트워크를 4G 역량으로 업그레이드한다. 통신 소외 지역 인프라 개선 사업이다.", "source": "MyJoyOnline", "date": "2026-09-06 01:48", "url": "https://www.myjoyonline.com/govt-to-upgrade-all-rural-telephony-networks-to-4g-capability-sam-george/", "category": "contract", "importance": 3, "wl": false, "topic": "농어촌 통신 4g업그레이드"}, {"title": "T-Mobile CEO appears to have given up on the postpaid crown as he talks up new categories ", "summary": "티모바일 최고경영자가 전통적인 후불 가입자 1위 타이틀 경쟁에서 한 발 물러서는 대신 새로운 사업 카테고리 확장에 집중하겠다는 의중을 내비쳤다. 외형 성장보다는 수익성과 신사업 다각화에 무게를 두는 전략 변화다. 통신 시장의 경쟁 구도 재편을 예고한다.", "source": "PhoneArena", "date": "2026-09-06 01:32", "url": "https://www.phonearena.com/news/t-mobile-losing-share-value-under-srini-gopalan_id183107", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 경영"}, {"title": "After 10 years of India feat, Jio sets its sights on global market - The Economic Times", "summary": "인도 시장에서 10년간의 성공을 거둔 릴라이언스 지오가 이제 글로벌 시장으로 눈을 돌리고 있다. 자국 내 디지털 혁신을 발판 삼아 해외 통신 및 기술 시장 진출을 모색 중이다. 인도 통신 산업의 거대 주역으로서 세계 무대에서의 입지를 넓히려 한다. 글로벌 통신 장비 및 서비스 시장에 미칠 파급효과가 주목된다.", "source": "The Economic Times", "date": "2026-09-06 01:21", "url": "https://m.economictimes.com/industry/telecom/telecom-news/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market/articleshow/133808067.cms", "category": "strategy", "importance": 3, "wl": false, "topic": "릴라이언스지오 글로벌"}, {"title": "'강민호 역전타' 삼성, 연장 11회 뒤집기…사흘 만에 선두 탈환(종합) - 연합뉴스", "summary": "삼성 라이온즈가 연장 혈투 끝에 LG의 6연승을 저지하고 사흘 만에 프로야구 선두 자리를 탈환했다는 스포츠 보도다. 다만 삼성 그룹의 스포츠단 운영 기사로, 네트워크 사업부의 장비 공급이나 통신 실적과는 무관하다. 단, 삼성 계열사 스포츠 성과를 다룬 일반 기사다.", "source": "연합뉴스", "date": "2026-09-05 21:42", "url": "https://www.yna.co.kr/amp/view/AKR20260905052000007", "category": "strategy", "importance": 3, "wl": false, "topic": "삼성전자 선두탈환"}, {"title": "楽天モバイルの東京地下対策は本当に効いたのか？地下42mで格安SIM4社を実測 - news.livedoor.com", "summary": "라쿠텐모바일의 도쿄 지하철 통신 대책이 실제로 효과가 있었는지를 검증하기 위해 지하 42m 깊이에서 알뜰폰 4사의 속도를 실측했다. 지하 공간에서의 네트워크 품질 개선 여부를 확인하는 테스트다. 자체 망 구축과 지하 수신 환경 개선의 성과를 평가하고 있다. 통신사들의 체감 품질 경쟁을 보여준다.", "source": "news.livedoor.com", "date": "2026-09-05 19:13", "url": "https://news.livedoor.com/article/detail/32250745/", "category": "tech", "importance": 3, "wl": false, "topic": "라쿠텐모바일 통신품질"}, {"title": "LIVE: | Islamabad 5G Spectrum Auction 2026 | PTA Inaugural Ceremony | Geo News James Haske", "summary": "파키스탄 이슬라마바드에서 5G 주파수 경매 및 PTA 취임식이 개최되었다. 신흥 시장의 5G 도입 본격화를 보여준다.", "source": "Mshale", "date": "2026-09-05 14:17", "url": "https://mshale.com/9bf82a2b/01c0c54dNsw9aucTWYE", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 5g경매"}, {"title": "Deutsche Telekom Peoplewatch: change-at-the-top in finance, infra, and tech - telcotitans.", "summary": e": 3, "wl": false, "topic": "텔러스 배당전략"}, {"title": "Verizon Communications stock gains as Q2 2026 earnings beat and outage reports test sentim", "summary": "버라이즌의 2026년 2분기 실적이 시장 예상을 상회했으나, 일부 통신 장애 보도가 투자 심리에 혼조세를 불렀다. 호실적에도 불구하고 인프라 안정성에 대한 우려가 주가에 부담으로 작용했다. 수익성과 망 관리의 균형이 중요해졌다.", "source": "AD HOC NEWS", "date": "2026-09-05 02:16", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-as-q2-2026-earnings-beat-and-outage/70055902", "category": "earnings", "importance": 3, "wl": false, "topic": "버라이즌 실적"}, {"title": "T-Mobile hands CFO reins to ex-Shell exec Jessica Uhl, as Osvaldik retires", "summary": "티모바일은 피터 오스발딕 최고재무책임자가 내년 2월 자리에서 물러나고 2027년 7월 은퇴할 예정임에 따라, 전 셸 임원인 제시카 우를 새 CFO로 임명한다고 발표했다. 이번 인사는 경영진 교체 계획에 따른 것으로, 향후 재무 전략 전반에 변화가 예상된다. 티모바일의 리더십 변화가 시장과 주가에 미칠 영향이 주목된다.", "source": "Light Reading", "date": "2026-09-05 01:12", "url": "https://www.lightreading.com/business-transformation/t-mobile-hands-cfo-reins-to-ex-shell-exec-jessica-uhl-as-osvaldik-retires", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원"}, {"title": "A Decade of Digital Disruption: How Jio Sparked the Great Indian Data Revolution and Resha", "summary": "릴라이언스가 촉발한 인도의 대대적인 데이터 혁명 10주년을 맞아 그간의 디지털 파급 효과를 되짚어본다. 저렴한 데이터와 광범위한 LTE 보급이 인도의 사회경제적 구조를 어떻게 바꿨는지 조명한다. 통신 인프라 투자가 국가적 디지털 전환을 이끈 대표적 사례다. 향후 5G 및 디지털 서비스 확장의 기반이 되었다.", "source": "Telangana Today", "date": "2026-09-05 00:00", "url": "https://telanganatoday.com/a-decade-of-digital-disruption-how-jio-sparked-the-great-indian-data-revolution-and-reshaped-the-telugu-states", "category": "strategy", "importance": 3, "wl": false, "topic": "릴라이언스지오 전략"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - Whalesbook", "summary": "국영 통신사 BSNL의 4G 네트워크가 일일 트래픽 6페타바이트(PB) 고지를 달성했다. 국산화된 통신 장비와 솔루션이 대규모 트래픽을 안정적으로 처리하고 있음을 보여준다. 인도 통신 인프라의 국산화 성공 사례로 평가받는다. 네트워크 고도화의 청신호를 켜고 있다.", "source": "Whalesbook", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "tech", "importance": 3, "wl": false, "topic": "bsnl 4g네트워크"}, {"title": "Verizon Layoffs Hit 16,600 as Record Quarter Funds the Cuts - FinanceFeeds", "summary": "버라이즌이 역대급 실적을 바탕으로 대규모 구조조정을 단행하며 1만 6,600명의 감원을 감행했다. 수익성 극대화를 위한 비용 절감과 조직 효율화의 일환이다. 대형 통신사의 인력 재배치 움직임을 보여준다.", "source": "FinanceFeeds", "date": "2026-09-04 19:17", "url": "https://financefeeds.com/verizon-layoffs-16600-jobs-record-quarter-cost-cuts/", "category": "exec", "importance": 3, "wl": false, "topic": "버라이즌 경영"}, {"title": "Viettel Secures 240 MHz Spectrum for Dominican Republic Network Launch - Telecom Review As", "summary": "비엣텔이 도미니카 공화국 네트워크 신규 런칭을 위해 240 MHz 폭의 주파수를 확보했다. 해외 시장 진출을 위한 주파수 자원을 선점하며 서비스 개시를 준비하고 있다. 통신사의 글로벌 영토 확장 사례다.", "source": "Telecom Review Asia", "date": "2026-09-04 17:54", "url": "https://www.telecomreviewasia.com/news/network-news/30191-viettel-secures-240-mhz-spectrum-for-dominican-republic-network-launch/", "category": "contract", "importance": 3, "wl": false, "topic": "비엣텔 수주"}, {"title": "Elliott wants to scuttle Deutsche Telekom's T-Mobile US merger - Telecoms", "summary": "엘리엇이 도이치텔레콤과 티모바일 US 간의 합병 구상을 저지하기 위한 공세를 지속하고 있다. 대형 통신사의 M&A 전략에 제동을 걸려는 행동주의 펀드의 개입이다. 글로벌 통신 시장의 지배구조에 영향을 미칠 수 있다.", "source": "Telecoms", "date": "2026-09-04 17:33", "url": "https://www.telecoms.com/operator-ecosystem/elliott-wants-to-scuttle-deutsche-telekom-s-t-mobile-us-merger", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영"}, {"title": "“국민 누구나 AI를 쓴다”…정부 ‘모두의 AI’ 출격, SKT·카카오·KT 연내 서비스 경쟁 - 인공지능신문", "summary": "정부 주도의 모두의 AI 출격에 맞춰 SKT, 카카오, KT 등 주요 통신사와 기업들이 연내 서비스 경쟁에 돌입한다. 국민 누구나 AI를 활용할 수 있도록 지원하는 정책과 통신사의 행보를 담고 있다.", "source": "인공지능신문", "date": "2026-09-04 17:17", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41767", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai"}, {"title": "auの通信品質を最 <script>

];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>

    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
