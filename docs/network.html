nts reinvented for a comeback - T", "summary": "노키아, 에릭슨, IBM, 블랙베리 등 과거의 거대 기술 기업들이 변화하는 시장 환경 속에서 어떻게 사업을 재편하고 부활에 성공했는지를 조명하는 기업 전략 분석 기사입니다. 글로벌 통신장비 경쟁사들의 체질 개선과 비즈니스 모델 전환 과정을 다룹니다.", "source": "The Indian Express", "date": "2026-09-06 17:07", "url": "https://indianexpress.com/article/explained/explained-economics/nokia-ericsson-ibm-blackberry-comeback-10865506/", "category": "exec", "importance": 4, "wl": false, "topic": "노키아 에릭슨 전략"}, {"title": "Maxis Deploys Nokia Optical Transport Technology To Boost AI And Enterprise Network Capaci", "summary": "말레이시아 통신사 맥시스(Maxis)가 AI 및 엔터프라이즈 네트워크 역량 강화를 위해 노키아의 광전송 기술을 도입했습니다. 양사는 협력을 통해 데이터 처리 효율을 높이고 차세대 네트워크 인프라를 구축할 예정입니다. 노키아의 해외 통신장비 수주 성과를 나타냅니다.", "source": "pokde.net", "date": "2026-09-06 05:55", "url": "https://pokde.net/system/service/telco-isp/maxis-deploys-nokia-optical-transport-technology", "category": "contract", "importance": 4, "wl": false, "topic": "노키아 광전송장비"}, {"title": "[글로벌 포커스] 수에즈 품은 이집트, 미·중 'AI 패권 전쟁'의 새로운 ...", "summary": "중국 통신장비 업체 화웨이가 이집트에 두 개의 컴퓨팅 클러스터를 구축하기 위한 입찰 제안서를 제출했습니다. 화웨이는 12개월의 구축 기간과 AI 모델 훈련용 최신 장비 공급을 제안했습니다. 이는 미·중 AI 패권 전쟁 속에서 화웨이의 아프리카 시장 선점 공세를 보여줍니다.", "source": "newsian.co.kr", "date": "2026-09-05 06:50", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=94828", "category": "contract", "importance": 4, "wl": false, "topic": "화웨이 이집트 컴퓨팅 클러스터"}, {"title": "‘관세 폭탄’ 美에 등 돌린 加, 中과 8년 만에 군사 교류", "summary": "과거 캐나다가 중국 통신장비 업체 화웨이 창업자 딸 멍완저우 부회장을 체포하면서 양국 관계가 급속도로 악화했습니다. 이후 마크 카니 총리 취임과 함께 캐나다가 중국과의 관계 개선에 나서고 있습니다. 양국 간 군사 교류 재개 조치가 가시화되고 있습니다.", "source": "kmib.co.kr", "date": "2026-09-06 18:38", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000009486&cp=nv", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 캐나다 국방 대화"}, {"title": "SPCX Stock: SpaceX's Wireless Ambitions Fuel T-Mobile Acquisition Speculation - Stocktwits", "summary": "스페이스X의 무선 사업 진출과 연계하여 T-모바일과의 인수합병 가능성에 대한 시장의 추측을 다루고 있습니다. 통신 시장의 지형 변화 가능성을 보여주나 확정된 딜은 아닙니다.", "so 2026090500000013400", "category": "policy", "importance": 4, "wl": false, "topic": "라쿠텐 모바일 강제 해약 조사"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니] - 아시아경제", "summary": "내년 국내에서 5G 주파수 경매가 진행될 것으로 전망됩니다. 주파수 확보를 위한 통신사들의 네트워크 투자가 확대될 것으로 기대되며, 이에 따른 국내 통신 장비 주식들의 수혜가 예상됩니다. 정부의 주파수 정책과 통신망 투자 계획에 따른 장비 시장 파급효과를 다룹니다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 주파수경매"}, {"title": "'5G Spectrum Auction' Expected in Korea Next Year... Beneficiaries Among Telecom Equipment", "summary": "내년 한국에서 5G 주파수 경매가 예정되어 있습니다. 국내 통신 인프라 투자 확대로 통신장비주 수혜가 기대되는 중요 정책 이벤트입니다. 국내 통신장비 시장에 직접적인 영향을 미칩니다.", "source": "asiae.co.kr", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/en/article/2026090320502060845", "category": "contract", "importance": 4, "wl": false, "topic": "과기정통부 주파수 경매"}, {"title": "ID未連携 強制解約 楽天モバイル 11月末期限 総務省 消費者保護で調査 - 沖縄タイムス社", "summary": "라쿠텐 모바일의 일방적인 ID 미연동 강제 해약 조치에 대해 일본 총무성이 소비자 권익 보호를 위해 공식 조사에 나섰습니다. 통신 규제 및 정책 관련 사안입니다.", "source": "沖縄タイムス社", "date": "2026-09-05 03:57", "url": "https://www.okinawatimes.co.jp/articles/-/1917448", "category": "policy", "importance": 4, "wl": false, "topic": "일본 총무성 라쿠텐 모바일 조사"}, {"title": "전화·검색·카톡 파고드는 ‘모두의 AI’… 생활 속 실행력 승부수", "summary": "과학기술정보통신부는 서울 한국프레스센터에서 '모두의 AI' 프로젝트 사업자 간담회를 개최했습니다. 배경훈 부총리 겸 과기정통부 장관은 외산 서비스에 대응하기 위한 독창적인 비즈니스 모델과 서비스 창출의 필요성을 강조했습니다. 정부와 업계는 AI 주권 확보를 위한 실행력 강화 방안을 논의했습니다.", "source": "dt.co.kr", "date": "2026-09-06 18:38", "url": "https://www.dt.co.kr/article/12082349?ref=naver", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 모두의 ai 간담회"}, {"title": "티빙 유출 사고 보상 신청 7일 시작… 4000만 계정 피해 어떻게 갚나", "summary": "과학기술정보통신부 민관합동조사단은 티빙 개인정보 유출 사고에 대한 조사 결과를 발표했습니다. 과기정통부는 이번 유출을 중대 침해사고로 규정하고 2차 피해 방지 대책을 점검하고 있습니다. 정부는 유출된 정보를 악용한 스미싱 등을 차단하기 위한 후속 조치를 강화할 방침입니다.", "source": "wikitree.co.kr", "date": "2026-09-06 16:02", "url": "https://www.wikitree.co.kr/articles/1157593", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 티빙 침해사고 조사"}, {"title": "9.4조 AI 승부수 띄운 정부… '보안·전국민 서비스'로 생태계 가속", "summary": "과학기술정보통신부가 발표한 내년도 예산안에 따르면 AI 관련 사업 예산이 전년 대비 84.3% 증가한 9조 4211억원으로 대폭 편성되었습니다. 이는 과기정통부 전체 예산의 상당 부분을 차지하며 AI 생태계 가속화에 투입됩니다. 정부는 보안 강화와 전국민 AI 서비스 확산을 통해 글로벌 경쟁력 확보에 나섭니다.", "source": "newscj.com", "date": "2026-09-06 14:18", "url": "https://www.newscj.com/news/articleView.html?idxno=3430376", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai 예산 확대"}, {"title": "[기획] GS리테일 이어 티빙까지…대형 유출 키운 '보안 관리 부실'", "summary": "티빙이 침해사고 발생 후 정보통신망법상 신고기한인 24시간을 넘겨 한국인터넷진흥원에 신고한 것으로 조사되었습니다. 과학기술정보통신부는 보안 관리 부실 책임을 물어 티빙에 과징금을 부과할 방침입니다. 개인정보보호위원회 등 관계 기관도 별도의 제재 절차를 검토하고 있습니다.", "source": "m-i.kr", "date": "2026-09-06 12:00", "url": "https://www.m-i.kr/news/articleView.html?idxno=1410173", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 티빙 보안 부실 제재"}, {"title": "[기획] 비밀번호 대입부터 API까지…유통 플랫폼 해킹 수법도 진화", "summary": "과학기술정보통신부 민관합동조사단은 브리핑을 통해 티빙의 해킹 및 침해사고 조사 결과를 공개했습니다. 조사 결과 티빙에서 이용자 계정 약 3954만 개와 소스코드 등이 유출된 것으로 확인되었습니다. 정부는 유통 플랫폼의 지능화된 해킹 수법에 대응하기 위한 보안 대책을 점검하고 있습니다.", "source": "m-i.kr", "date": "2026-09-06 12:00", "url": "https://www.m-i.kr/news/articleView.html?idxno=1410079", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 티빙 민관합동조사"}, {"title": "정부, ‘모두의 AI’ 12월 출시 추진…보안 특화 AI 개발도 착수", "summary": "과학기술정보통신부는 사이버 보안 특화 AI 파운데이션 모델 개발 사업의 수행기관으로 네이버클라우드 컨소시엄을 선정했습니다. 과기정통부는 네이버클라우드와 SK텔레콤 등 컨소시엄을 대상으로 관련 사업을 추진합니다. 정부는 연내 '모두의 AI' 출시와 함께 보안에 특화된 국산 AI 모델 개발에 착수했습니다.", "source": "sentv.co.kr", "date": "2026-09-06 11:30", "url": "https://www.sentv.co.kr/article/view/sentv202609060016", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 보안 ai 개발"}, {"title": "제각각 통신 방식 통일…軍, 전군 드론 '통신표준' 만든다 - news1.kr", "summary": "군이 드론 통신 표준을 통합하여 전군 드론 운용 효율성을 높입니다. 통신 표준화 정책 보도입니다. 공공 부문의 통신 표준 정립 사례입니다.", "source": "news1.kr", "date": "2026-09-06 07:00", "url": "https://www.news1.kr/amp/diplomacy/defense-diplomacy/6280619", "category": "tech", "importance": 3, "wl": false, "topic": "국군 드론 통신표준"}, {"title": "[단독] 과기정통부 , 유럽에 'AI 공동연구랩' 세운다", "summary": "과학기술정보통신부와 정보통신기획평가원(IITP)은 내년 유럽에 '글로벌 AI 공동연구랩'을 구축할 계획입니다. 국회 제출 자료에 따르면 과기정통부는 글로벌 AI 협력을 확대하기 위해 이 사업을 추진합니다. 이번 연구랩은 한국과 유럽 간 AI 연구 역량을 결합하는 거점이 될 것입니다.", "source": "mt.co.kr", "date": "2026-09-06 06:30", "url": "https://www.mt.co.kr/tech/2026/09/06/2026090315315525902", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 유럽 ai 공동연구랩"}, {"title": "Union Minister Jyotiraditya Scindia launches theme for 10th India Mobile Congress 2026 - n", "summary": "인도 모바일 콩그레스 2026 개최 및 통신 정책 방향 발표 보도입니다. 인도 통신 시장의 성장세를 다룹니다.", "source": "newsonair.gov.in", "date": "2026-09-06 04:56", "url": "https://newsonair.gov.in/union-minister-jyotiraditya-scindia-launches-theme-for-10th-india-mobile-congress-2026/", "category": "other", "importance": 3, "wl": false, "topic": "인도 모바일 콩그레스"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "FAA의 5G 무선 고도계 규제 관련 논란이 종결되었습니다. 통신 주파수와 항공 안전 간의 규제 조정 보도입니다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "faa 5g 규제"}, {"title": "LIVE: | Islamabad 5G Spectrum Auction 2026 | PTA Inaugural Ceremony | Geo News James Haske", "summary": "파키스탄의 5G 주파수 경매 및 통신 정책 발표 보도입니다. 신규 통신 시장의 인프라 구축을 위한 절차입니다.", "source": "Mshale", "date": "2026-09-05 14:17", "url": "https://mshale.com/9bf82a2b/01c0c54dNsw9aucTWYE", "category": "contract", "importance": 3, "wl": false, "topic": "파키스탄 주파수 경매"}, {"title": "Putting Customer Protection First: Why Consent Verification Should Rest With the TAP - Tel", "summary": "통신 소비자 보호를 위해 가입 동의 및 확인 절차를 통신사(TAP)가 직접 담당해야 한다는 규제 관련 정책 토론을 다루고 있습니다. 통신 제도 개선 사안입니다.", "source": "TelecomTalk", "date": "2026-09 orge - MyJoyOnline", "summary": "가나 정부의 통신 요금 인하 및 인프라 개선 계획 보도입니다.", "source": "MyJoyOnline", "date": "2026-09-06 14:48", "url": "https://www.myjoyonline.com/rural-calls-data-to-become-cheaper-by-q1-2027-sam-george/", "category": "other", "importance": 2, "wl": false, "topic": "가나 통신 정책"}, {"title": "[세종만사]공공기관 기능개혁, 발표 다음날 이례적 '사후 홍보전'", "summary": "과학기술정보통신부 장관이 유임되면서 이재명 정부의 주요 AI 프로젝트가 지속 추진될 전망입니다. 과기정통부 내부에서는 장관 유임이 정책의 연속성을 확보하는 데 긍정적이라는 평가가 나옵니다. 향후 관련 AI 정책과 사업들이 안정적으로 이어질 것으로 기대됩니다.", "source": "etnews.com", "date": "2026-09-06 14:01", "url": "https://www.etnews.com/20260906000071", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 장관 유임 정책 연속성"}, {"title": "충남도 ‘1조 원대 AI 모빌리티 실증 콤플렉스’ 첫 관문 통과", "summary": "충남도의 'AI 모빌리티 실증 콤플렉스' 사업이 과학기술정보통신부의 구축형 R&D 사업추진심사 대상에 선정되었습니다. 내년 상반기 과기정통부의 최종 본심사를 통과할 경우 2028년부터 국비와 지방비가 투입됩니다. 이번 사업은 충남도의 미래 모빌리티 산업 육성을 위한 핵심 과제로 추진됩니다.", "source": "munhwa.com", "date": "2026-09-06 12:44", "url": "https://www.munhwa.com/article/11614816?ref=naver", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 충남 ai 콤플렉스"}, {"title": "[2027 AI예산 해부 ④] 불어난 예산, ‘염불보다 잿밥’ 주의보…“과기...", "summary": "AI 정책의 급격한 확대에 따라 대통령실, 국가AI전략위원회, 과기정통부 및 산하기관까지 관련 사업에 참여하고 있습니다. 과기정통부 내부에서도 AI 관련 조직과 업무가 확장되는 추세입니다. 이에 따라 늘어난 예산의 효율적 집행과 부처 간 조율의 필요성이 제기되고 있습니다.", "source": "ddaily.co.kr", "date": "2026-09-06 06:23", "url": "https://www.ddaily.co.kr/page/view/2026090416264434084", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 ai 예산 집행 점검"}, {"title": "과기정통부 , 2027년 예산 29.6조 원 편성…전 국민 AI서비스 지원", "summary": "과학기술정보통신부는 2027년도 예산을 29조 6000억원 규모로 편성했습니다. 전 국민 AI 서비스 지원과 함께 국공립과학관 과학문화 서비스가 제공됩니다. 취약계층을 위한 정보통신 기기 개발 및 보급 지원도 확대됩니다.", "source": "hellot.net", "date": "2026-09-05 17:46", "url": "https://www.hellot.net/news/article.html?no=114788", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 2027년 예산 편성"}, {"title": "국가대표 AI 연구 이끈다…포스텍, 220억 국책 과제 2건 동시 선정", "summary": "포스텍 연구팀은 과학기술   return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
