 false, "topic": "도이치텔레콤 지배구조"}, {"title": "모두의 AI 성공방정식 '외산과 차별화'…SKT·KT·카카오 출격 - 전자신문", "summary": "정부 지원 하에 SK텔레콤, KT, 카카오 등 국내 주요 통신 및 플랫폼 사업자들이 외산 AI와 차별화된 '모두의 AI' 서비스를 연내 출격시킨다. 전 국민을 대상으로 무료 AI 서비스를 제공하여 국산 AI 생태계를 육성하려는 대형 프로젝트다. 통신사의 AI 서비스 다각화 및 빅테크 협력 모델을 보여준다.", "source": "전자신문", "date": "2026-09-04 16:16", "url": "https://www.etnews.com/20260904000334", "category": "contract", "importance": 4, "wl": false, "topic": "skt kt 카카오 모두의ai 출격"}, {"title": "KDDI achieves 3.6 Gbps outdoor transmission in 7 GHz 6G candidate band - Telecompaper", "summary": "KDDI가 6G 후보 대역인 7GHz 주파수 대역에서 3.6 Gbps 속도의 야외 전송 시연에 성공했다. 차세대 이동통신 초고속 전송 기술 확보를 위한 핵심 연구 성과다. 차세대 통신 표준 기술 선점을 위한 경쟁력 입증이다.", "source": "Telecompaper", "date": "2026-09-04 15:31", "url": "https://www.telecompaper.com/news/kddi-achieves-36-gbps-outdoor-transmission-in-7-ghz-6g-candidate-band--1581713", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g 야외 전송"}, {"title": "정부, ‘모두의 AI’에 내년 2500억 편성…SKT·카카오·KT에 100억씩 - 디일렉", "summary": "정부가 내년 '모두의 AI' 사업에 2,500억 원의 예산을 편성하고 SKT, 카카오, KT 등 참여 사업자들에게 각각 100억 원씩 지원하기로 했다. 국가 차원의 인공지능 보급 및 국산 생태계 육성 정책의 구체적 실행 방안이다. 통신사들의 AI R&D 및 서비스 상용화에 직접적인 재정적 뒷받침이 된다.", "source": "디일렉", "date": "2026-09-04 14:26", "url": "https://www.thelec.kr/news/articleView.html?idxno=61834", "category": "policy", "importance": 4, "wl": false, "topic": "정부 모두의ai 예산 편성 및 지원"}, {"title": "T-Mobile CFO Peter Osvaldik to step down in February 2027, Jessica Uhl to succeed", "summary": "티모바일의 피터 오스발딕 CFO가 2027년 2월에 사임할 예정이며 제시카 울이 그 뒤를 잇는다. 이 발표는 행동주의 투자자 엘리엇 인베스트먼트가 도이치텔레콤의 지분을 확보한 가운데, 독일 통신 그룹에 티모바일과의 잠재적 합병을 철회할 것을 촉구했다는 보도와 맞물려 나왔다. 대형 통신사의 경영진 변동과 지배구조 이슈를 다루고 있다.", "source": "ET Telecom", "date": "2026-09-04 10:57", "url": "https://telecom.economictimes.indiatimes.com/news/industry/t-mobile-cfo-peter-osvaldik-to-step-down-in-february-2027-jessica-uhl-to-succeed/133749414", "category": "exec", "importance": 4, "wl": true, "topic": "티모바일 피터 오스발딕 사임"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 통신사 릴라이언스 지오(Reliance Jio)가 나브라트리 및 디왈리 시기를 겨냥해 최대 40억 달러 규모의 대형 기업공개(IPO)를 추진하고 있다. 로드쇼는 이르면 다음 주부터 시작될 수 있다. 글로벌 통신 시장의 대형 투자 및 상장 뉴스로 업계의 주목을 받고 있다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "contract", "importance": 4, "wl": true, "topic": "지오 40억달러 ipo 추진"}, {"title": "Bombay HC quashes ₹2,113 crore DoT demand against Vodafone Idea - scanx.trade", "summary": "봄베이 고등법원이 인도 통신부(DoT)가 보다폰 아이디어를 상대로 청구했던 2,113억 루피 규모의 과징금 요구를 무효화했다. 통신사의 재무적 부담을 대폭 덜어주는 중대한 법적 판결이다. 인도 통신 규제 당국과 사업자 간의 오랜 갈등에서 통신사가 승소한 사례다. 보다폰 아이디어의 경영 안정화에 결정적 전환점이 된다.", "source": "scanx.trade", "date": "2026-09-04 09:28", "url": "https://scanx.trade/stock-market-news/companies/bombay-high-court-quashes-2-113-crore-dot-demand-notices-against-vodafone-idea-for-one-time-spectrum-charges/42522031", "category": "policy", "importance": 4, "wl": false, "topic": "보다폰아이디어 dot 과징금 취소"}, {"title": "国内初「空飛ぶ基地局」、試験成功…ソフトバンクが商用化へ - ニュースイッチ by 日刊工業新聞社", "summary": "소프트뱅크가 일본 최초로 성층권 무인기(HAPS)를 이용한 하늘 위 기지국 통신 시험에 성공하며 상용화를 앞두게 되었다. 재난 대응 및 음영지역 해소를 위한 혁신적 통신 인프라 구축 성과다.", "source": "ニュースイッチ by 日刊工業新聞社", "date": "2026-09-04 06:02", "url": "https://newswitch.jp/p/50177", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 하늘 위 기지국"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "도이체텔레콤이 AWS 출신의 얀 호프마이어를 영입하고 최고재무책임자(CFO)가 퇴임하는 등 대대적인 세대교체와 리더십 개편을 단행했다. AI와 차세대 네트워크 경쟁력 강화를 위한 전면적인 조직 쇄신이다. 기존 경영진 체제에서 클라우드 중심 체제로의 전환을 의미한다. 통신업계 전반에 시사하는 바가 큰 대형 인사다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이체텔레콤 경영진 세대교체"}, {"title": "Jan Hofmeyr named DT's new Board of Management member for product and technology - Fierce ", "summary": "AWS 출신의 얀 호프마이어가 도이체텔레콤의 제품 및 기술 담당 새로운 이사회 멤버이자 CTO로 공식 선임되었다. 클라우드 전문 인재를 최고 기술 수장으로 발탁하여 네트워크의 가상화 및 AI 접목을 강력히 추진한다. 통신사의 기술 로드맵에 큰 변화를 가져올 핵심 인사다. 업계의 주목을 받는 고위급 영입이다.", "source": "Fierce Network", "date": "2026-09-04 00:54", "url": "https://www.fierce-network.com/newswire/jan-hofmeyr-named-dts-new-board-management-member-product-and-technology", "category": "exec", "importance": 4, "wl": false, "topic": "얀 호프마이어 도이체텔레콤 cto 선임"}, {"title": "Deutsche Telekom names AWS' Jan Hofmeyr as next CTO - Data Center Dynamics", "summary": "도이체텔레콤이 AWS의 임원인 얀 호프마이어를 차기 CTO로 전격 임명했다. 클라우드 기술과 네트워크의 융합을 가속화하기 위한 파격적인 인재 영입이다. 통신사의 기술 주도권을 소프트웨어와 클라우드 중심으로 이동시키려는 전략의 핵심이다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:02", "url": "https://www.datacenterdynamics.com/en/news/deutsche-telekom-names-aws-jan-hofmeyr-as-next-cto/", "category": "exec", "importance": 4, "wl": false, "topic": "도이체텔레콤 aws 얀 호프마이어 cto 선임"}, {"title": "T-Mobile US stock gains as Elliott pressure on Deutsche Telekom reshapes merger debate - A", "summary": "행동주의 펀드 엘리엇의 압박이 도이치텔레콤을 자극하면서 티모바일 US 합병 논쟁에 새로운 변수로 작용하고 있다. 주주의 전략 수정 요구가 통신사 M&A 구도에 영향을 미치고 있다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:57", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/t-mobile-us-stock-gains-as-elliott-pressure-on-deutsche-telekom-reshapes/70049448", "category": "policy", "importance": 4, "wl": false, "topic": "티모바일 합병 논란"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - AD HOC NEWS", "summary": "버라이즌이 프론티어 인수 추진과 CEO 전환 소식에 힘입어 주가가 상승했다. 유선망 강화를 위한 대형 M&A 추진으로 통신 업계에 큰 파장을 일으키고 있다. 네트워크 인프라 확장 측면에서 중대한 거래다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "contract", "importance": 4, "wl": false, "topic": "버라이즌 프론티어 인수"}, {"title": "Deutsche Telekom anoints CTO with Comcast chief network veteran and AWS VP Jan Hofmeyr - S", "summary": "도이체텔레콤이 컴캐스트 네트워크 베테랑이자 AWS 부사장인 얀 호프마이어(Jan Hofmeyr)를 새로운 최고기술책임자(CTO)로 임명했다. 클라우드 및 AI 기술을 통신 네트워크에 접목하기 위한 최고위급 인사이더 영입이다. 통신사의 기술 전략 수립과 디지털 전환 가속화에 중대한 변화를 예고한다. 경영진 교체에 준하는 기술 부문 핵심 리더십 개편이다.", "source": "SDxCentral", "date": "2026-09-03 22:32", "url": "https://www.sdxcentral.com/news/deutsche-telekom-anoints-cto-with-comcast-chief-network-veteran-and-aws-vp-jan-hofmeyr/", "category": "exec", "importance": 4, "wl": false, "topic": "도이체텔레콤 cto 영입"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - PRESS9", "summary": "SK텔레콤과 LG유플러스가 그동안 줄여왔던 네트워크 투자를 다시 늘릴 가능성이 제기됐다. 5G SA 고도화와 향후 주파수 경매 등이 주요 변수로 작용하고 있다.", "source": "PRESS9", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "contract", "importance": 4, "wl": false, "topic": "skt lgu+ 망투자"}, {"title": "Telco operators reject quality of service norms for 5G slicing - The Economic Times", "summary": "인도의 주요 통신사들이 트라이(TRAI)가 제안한 5G 네트워크 슬라이싱 품질 표준 규격에 대해 반대 입장을 표명했다. 통신사들은 해당 규제가 자율적인 망 운영과 서비스 품질 관리에 제약을 준다고 주장한다. 5G 상용화 확대 과정에서 규제 당국과 업계 간의 정책 조율이 주요 과제로 부각되고 있다. 향후 5G 특화 서비스 제공 전략에 영향을 미칠 전망이다.", "source": "The Economic Times", "date": "2026-09-05 04:38", "url": "https://m.economictimes.com/industry/telecom/telecom-giants-reject-trais-5g-slicing-qos-norms-amidst-net-neutrality-debate/articleshow/133776604.cms", "category": "policy", "importance": 3, "wl": false, "topic": "인도통신사 5g네트워크슬라이싱"}, {"title": "Verizon Communications stock gains as Q2 2026 earnings beat and outage reports test sentim", "summary": "버라이즌의 2026년 2분기 실적이 시장 예상을 상회하며 주가 상승을 견인했다. 다만 통신 장애 리포트가 투자 심리를 일부 시험하는 요인으로 작용했다. 호실적 발표에도 불구하고 네트워크 안정성이 변수로 지적되었다.", "source": "AD HOC NEWS", "date": "2026-09-05 02:16", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-as-q2-2026-earnings-beat-and-outage/70055902", "category": "earnings", "importance": 3, "wl": false, "topic": "버라이즌 실적"}, {"title": "T-Mobile hands CFO reins to ex-Shell exec Jessica Uhl, as Osvaldik retires", "summary": "미국 이동통신사 티모바일(T-Mobile)이 피터 오스발딕 최고재무책임자(CFO)의 퇴임에 따라 후임으로 전 쉘(Shell) 임원인 제시카 울을 임명했다고 발표했다. 오스발딕은 2027년 2월 CFO직에서 물러난 뒤 같은 해 7월 공식 은퇴 전까지 전략 자문 역할을 수행할 예정이다. 이번 최고재무책임자 교체는 통신사의 안정적인 경영 연속성을 유지하기 위한 리더십 개편의 일환으로 추진된다. 티모바일은 향후 재무 전략과 핵심 사업 추진 과정에서 새로운 리더십 체제를 바탕으로 시장 경쟁력을 강화해 나갈 전망이다.", "source": "Light Reading", "date": "2026-09-05 01:12", "url": "https://www.lightreading.com/business-transformation/t-mobile-hands-cfo-reins-to-ex-shell-exec-jessica-uhl-as-osvaldik-retires", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원 인사"}, {"title": "楽天モバイル、楽天ＩＤと連携しないと携帯電話サービス停止・自動的に解約…１１月末までに連携必要 - yomiuri.co.jp", "summary": "라쿠텐 모바일이 11월 말까지 楽天 ID와 연동하지 않는 경우 휴대폰 서비스를 정지하고 자동 해지한다고 밝혔다. 가입자 관리 정책의 중대한 변경 사항이다.", "source": "yomiuri.co.jp", "date": "2026-09-04 23:01", "url": "https://www.yomiuri.co.jp/economy/20260904-GYT1T00285/", "category": "policy", "importance": 3, "wl": false, "topic": "라쿠텐 id 미연계 해지"}, {"title": "Telcos push back on Trai’s proposed 5G slicing norms - financialexpress.com", "summary": "인도 통신사들이 트라이(TRAI)가 제안한 5G 네트워크 슬라이싱 규제안에 대해 거세게 반발하고 있다. 통신사들은 과도한 규제가 신기술 도입과 상용화 속도를 저해한다고 지적한다. 규제 기관과 업계 간의 정책 조율 과정이 난항을 겪고 있다. 향후 5G 특화 서비스 제공 방식에 중대한 영향을 미치는 규제 이슈다.", "source": "financialexpress.com", "date": "2026-09-04 21:49", "url": "https://www.financialexpress.com/business/news/telcos-push-back-on-trais-proposed-5g-slicing-norms/4332144/", "category": "policy", "importance": 3, "wl": false, "topic": "트라이 5g 네트워크슬라이싱 규제 반발"}, {"title": "Verizon Layoffs Hit 16,600 as Record Quarter Funds the Cuts - FinanceFeeds", "summary": "호실적을 기록한 가운데 버라이즌이 대규모 구조조정의 일환으로 1만 6천여 명 규모의 감원을 단행했다. 비용 효율화와 수익성 제고를 위한 고강도 인력 감축이다. 통신사의 경영 전략 변화를 보여준다.", "source": "FinanceFeeds", "date": "2026-09-04 19:17 na Mobile, NTT and Verizon L", "summary": "2026년 글로벌 통신사 설비투자(Capex) 순위에서 AT&T, 도이치텔레콤, 차이나모바일, NTT, 버라이즌 등이 상위권을 차지했다. 주요 통신 사업자들의 인프라 투자 규모와 트렌드를 보여준다. 장비 수요 예측에 중요한 참고 지표다.", "source": "TelecomLead", "date": "2026-09-03 22:48", "url": "https://telecomlead.com/5g/global-telecom-capex-ranking-2026-att-deutsche-telekom-china-mobile-ntt-and-verizon-lead-network-investment-127592", "category": "earnings", "importance": 3, "wl": false, "topic": "글로벌 통신사 캡엑스 순위"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": "영국 버진미디어 O2(VMO2)가 북아일랜드 지역에 5G 단독모드(SA) 서비스를 도입했다. 이와 함께 오렌지의 프라이빗 5G 구축 협력 및 노키아의 새로운 API 고객 확보 소식 등이 전해졌다. 유럽 주요 통신사의 네트워크 고도화 및 장비사 협력 동향을 담고 있다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 3, "wl": true, "topic": "유럽 통신사 5g 및 노키아 api"}, {"title": "UK's VodafoneThree launches TV, guaranteed-speed mobile offer - ET Telecom", "summary": "영국의 보다폰쓰리가 TV 서비스와 속도가 보장되는 모바일 상품을 결합한 SuperMobile을 출시했다. 통신 인프라 경쟁력을 바탕으로 시장 내 입지 강화를 노린다. 유무선 통합 서비스를 통해 가입자 기반을 확대하려는 전략이다. 영국의 통신 시장 경쟁 구도에 변화를 주는 서비스 런칭이다.", "source": "ET Telecom", "date": "2026-09-03 20:45", "url": "https://telecom.economictimes.indiatimes.com/amp/news/industry/uks-vodafonethree-launches-tv-guaranteed-speed-mobile-offer/133735222", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰쓰리 supermobile 출시"}]};

function hasWord(t,w){

function prodKey(a){

    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;

function capPerProduct(list,max){
  const cnt={},out=[];

    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}

    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
