<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네트워크 뉴스 모니터링</title>
<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px;white-space:pre-wrap}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .selbox{width:16px;height:16px;accent-color:var(--blue);flex:0 0 auto;cursor:pointer}
  .repbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:50}
  .repbar.on{display:flex}
  .repbar button{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .repbar .go{background:var(--blue);color:#fff}
  .repbar .off{background:rgba(255,255,255,.15);color:#fff}
  .modal{position:fixed;inset:0;background:rgba(15,42,92,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
  .modal.on{display:flex}
  .modal-box{background:var(--card);border-radius:12px;max-width:560px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-hd h3{font-size:15px;font-weight:800;color:var(--navy)}
  .modal-box textarea{flex:1;border:none;padding:14px 16px;font-size:13.5px;line-height:1.6;font-family:inherit;resize:none;min-height:280px;outline:none}
  .modal-ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .modal-ft button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .modal-ft .copy{background:var(--blue);border-color:var(--blue);color:#fff}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hd-top">
    <h1>Samsung Network <span>뉴스 모니터링</span></h1>
    <div style="display:flex;gap:6px;flex:0 0 auto">
      <button class="noti-btn" id="repBtn" onclick="toggleReport()">📋 보고</button>
      <a class="noti-btn" href="briefing.html" style="text-decoration:none;display:inline-block">📄 브리핑</a>
      <button class="noti-btn" id="notiBtn" onclick="toggleNoti()">🔕 알림 꺼짐</button>
    </div>
  </div>
  <div class="hd-meta" id="lastUpdate">news_data.js 없음</div>
  <div class="tabbar" id="tabbar"></div>
</header>
<main id="content"></main>
<div class="repbar" id="repbar">
  <span id="repCnt" style="font-size:13px;font-weight:700">선택 0건</span>
  <div style="display:flex;gap:8px">
    <button class="off" onclick="toggleReport()">취소</button>
    <button class="go" onclick="buildReport()">보고문 생성</button>
  </div>
</div>
<div class="modal" id="repModal">
  <div class="modal-box">
    <div class="modal-hd"><h3>📋 메신저 보고문</h3><span style="font-size:12px;color:var(--sub)">필요시 수정 후 복사</span></div>
    <textarea id="repText"></textarea>
    <div class="modal-ft">
      <button onclick="document.getElementById('repModal').classList.remove('on')">닫기</button>
      <button class="copy" id="copyBtn" onclick="copyReport()">복사</button>
    </div>
  </div>
</div>

itor", "topic": "화웨이 이란 거래 미국 재판 회부"}, {"title": "Huawei feels the enduring love of Spain's telcos – to EU's horror", "summary": "유럽연합의 강력한 퇴출 압박과 제재 노력에도 불구하고, 스페인 총리가 유용한 동맹으로 자리 잡으면서 현지 통신사들은 화웨이 장비를 열성적으로 도입하고 있다. 스페인 통신사들은 EU의 반대에도 불구하고 화웨이와의 오랜 협력 관계를 유지하며 네트워크 구축을 지속하고 있다. 이러한 행보는 유럽 전역의 대중국 통신장비 제재 기조와 대조를 이루며 글로벌 장비 시장의 경쟁 구도에 변수로 작용하고 있다. 스페인 통신 시장에서의 화웨이 입지 유지는 경쟁사들의 유럽 내 점유율 확대 전략에 타격을 줄 수 있다.", "source": "Light Reading", "date": "2026-09-09 16:30", "url": "https://www.lightreading.com/regulatory-politics/huawei-feels-the-enduring-love-of-spain-s-telcos-to-eu-s-horror", "category": "contract", "importance": 4, "sid": "competitor", "topic": "화웨이 스페인 수주"}, {"title": "Nokia Selected by Planters Broadband Cooperative to Build AI-ready Fiber Network for Under", "summary": "", "source": "NewswireToday", "date": "2026-09-09 16:00", "url": "https://www.newswiretoday.com/news/186832/Nokia-Selected-by-Planters-Broadband-Cooperative-to-Build-AI-ready-Fiber-Network-for-Underserved-Communities-in-Southeast-Georgia/", "category": "policy", "importance": 4, "sid": "competitor", "topic": ""}, {"title": "AT&T Business adds Amazon Leo to managed connectivity range - Telecompaper", "summary": "AT&T 비즈니스가 관리형 연결 서비스 범위에 아마존 레오 저궤도 위성 브로드밴드를 추가했다. 기업 고객의 네트워크 탄력성을 높이기 위한 전략적 행보이다. 위성통신 기반 상용 서비스의 저변이 확대되고 있다.", "source": "Telecompaper", "date": "2026-09-09 15:57", "url": "https://www.telecompaper.com/news/att-business-adds-amazon-leo-to-managed-connectivity-range--1582143", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 위성통신"}, {"title": "Satellite Broadband In India Gets Push As DCC Approves Spectrum Usage Charges - Swarajya", "summary": "", "source": "Swarajya", "date": "2026-09-09 15:37", "url": "https://swarajyamag.com/news-brief/satellite-broadband-in-india-gets-push-as-dcc-approves-spectrum-usage-charges", "category": "policy", "importance": 4, "sid": "policy", "topic": ""}, {"title": "KT클라우드, AI 데이터센터 1GW 확장…전력·구축 경쟁력 함께 키운다 - 위키리크스한국", "summary": "KT클라우드가 AI 데이터센터 용량을 1GW 규모로 대폭 확장하며 전력 인프라와 구축 경쟁력을 동시에 키워나가고 있다. 폭증하는 AI 연산 및 클라우드 수요를 소화하기 위한 대규모 인프라 투자 전략이다.", "source": "위키리크스한국", "date": "2026-09-09 15:20", "url": "https://www.wikileaks-kr.org/news/articleView.html?idxno=191800", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai 데이터센터 확장"}, {"title": "Apple forays into India's business messasging segment with Reliance Jio", "summary": "애플이 지역 통신사들과의 파트너십을 통해 미국, 영국, 독일, 프랑스, 스페인 등 주요 시장에서 비즈니스 RCS 도입을 점진적으로 활성화하고 있으며, 릴라이언스 지오(Reliance Jio)와 손잡고 인도 비즈니스 메시징 시장에도 진출한다. 서비스 가격은 통신사가 결정하며 시장별로 상이하다. 통신사와 빅테크 간의 차세대 메시징 협력 사례다.", "source": "ET Telecom", "date": "2026-09-09 15:16", "url": "https://telecom.economictimes.indiatimes.com/news/devices/apple-forays-into-indias-business-messasging-segment-with-reliance-jio/133955927", "category": "contract", "importance": 4, "sid": "carrier", "topic": "애플 비즈니스 메시징"}, {"title": "Huawei Technologies faces racketeering trial in US - BGNES", "summary": "화웨이가 미국 시장 내 과거 사업 거래와 관련하여 조직범죄 혐의로 정식 재판에 회부됐다. 글로벌 통신장비 시장 구도에 영향을 미칠 법적 리스크다.", "source": "BGNES", "date": "2026-09-09 15:14", "url": "http://www.bgnes.com/economy/huawei-technologies-faces-racketeering-trial-in-us", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 내 조직범죄 혐의 재판 회부"}, {"title": "민주당, 배달수수료 상한제 입법 재시동…국감 앞두고 플랫폼 압박", "summary": "더불어민주당이 국정감사를 앞두고 배달 수수료 상한제 도입 등 배달 플랫폼 규제 입법을 재추진한다. 공정거래위원회도 자율규제 한계를 인정하며 법제화 가능성을 열어둔 상태로, 업계와 전문가들은 합리적인 비용 분담 방안 설계를 강조하고 있다.", "source": "전자신문", "date": "2026-09-09 15:07", "url": "https://www.etnews.com/20260909000254", "category": "policy", "importance": 4, "sid": "policy", "topic": "더불어민주당 배달플랫폼 규제"}, {"title": "\"美 통신망 뒤흔든 '솔트 타이푼', 25% 잔존 '화웨이 장비 '가 침투 교두...", "summary": "미국 통신망을 뒤흔든 '솔트 타이펀' 사태의 원인으로 잔존한 중국산 화웨이 장비가 지목됐다. 주요국들이 고위험 장비 퇴출을 제도화한 가운데 미국은 FCC를 통해 철거를 지원하고 있다. 국내에서도 통신망 보안 강화를 위한 제도적 대책이 촉구되고 있다.", "source": "weekly.hankooki.com", "date": "2026-09-09 15:04", "url": "https://weekly.hankooki y": "버라이즌은 네트워크 확장 및 인공지능(AI) 인프라 지원을 위해 코닝과 수십억 달러 규모의 광케이블 공급 계약을 체결했다. 계약에 따라 2027년부터 2032년까지 8000만 마일 이상의 광케이블을 공급받게 된다. 이번 대규모 투자는 버라이즌의 통신망 고도화와 AI 연계 인프라 구축 가속화를 위한 전략적 행보로 평가된다.", "source": "Light Reading", "date": "2026-09-09 00:56", "url": "https://www.lightreading.com/data-centers/verizon-loads-up-on-corning-s-fiber-for-network-expansion-and-ai-infrastructure", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 장비계약"}, {"title": "Ericsson says telco-grade AI RAN must deliver measurable gains at scale", "summary": "에릭슨의 전략적 RAN 리더십 총괄 가브리엘 포글란더는 RCR테크 텔코 AI 포럼에서 텔코급 AI RAN이 대규모 환경에서 측정 가능한 성과를 반드시 입증해야 한다고 강조했다. AI-RAN이 네트워크 전반에 AI를 내재화하는 광범위한 전환의 교두보 역할을 해야 한다는 설명이다. 글로벌 통신장비 경쟁사가 차세대 무선 접속망(RAN)과 AI의 결합 방향성을 제시한 핵심 발언이다. 삼성전자 네트워크사업부의 AI 기반 6G 및 차세대 네트워크 전략 수립에 시사점을 준다.", "source": "RCR Wireless", "date": "2026-09-09 00:44", "url": "https://rcrwireless.com/20260908/carriers/ericsson-ai-ran", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 ai"}, {"title": "Verizon and Corning announce multi-year, multi-billion dollar supply agreement for broadba", "summary": "버라이즌과 코닝이 광대역 통신망 구축을 위한 다년간 수십억 달러 규모의 대형 공급 계약을 체결했습니다. 미국 전역의 통신 인프라 현대화와 고속 인터넷 보급을 위한 핵심 물량입니다. 장비 공급업체와 통신사 간의 장기 파트너십을 재확인했습니다. 인프라 산업 전반에 안정적인 성장 동력을 제공합니다.", "source": "WebWire", "date": "2026-09-09 00:30", "url": "http://webwire.com/ViewPressRel.asp?SESSIONID=&aId=360172", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 다년간 공급 계약"}, {"title": "China’s Huawei Technologies faces racketeering trial in New York - Boston Herald", "summary": "중국 화웨이 테크놀로지가 미국 뉴욕 법원에서 조직범죄 혐의 관련 재판을 앞두고 있습니다. 미·중 기술 패권 갈등 속에서 화웨이의 법적 리스크가 심화되는 국면을 다룹니다.", "source": "Boston Herald", "date": "2026-09-09 00:28", "url": "https://www.bostonherald.com/2026/09/08/huawei-racketeering-trial/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 뉴욕 공판"}, {"title": "Stronger Connections, Smarter Growth: Spectrum and Southern 2", "category": "contract", "importance": 4, "sid": "carrier", "topic": "원스토어 지분 구조 개편"}, {"title": "Amazon Leo expands launch contract with Arianespace - Telecompaper", "summary": "아마존 카이퍼가 아리안스페이스와의 기존 발사 계약 규모를 확장했다. 저궤도 위성 대량 배치를 위한 공급망을 공고히 했다. 스페이스X 추격을 위한 핵심 인프라 투자다.", "source": "Telecompaper", "date": "2026-09-10 16:22", "url": "https://www.telecompaper.com/news/amazon-leo-expands-launch-contract-with-arianespace--1582286", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아마존 아리안스페이스 발사 계약 확장"}, {"title": "Lessons from a war zone: how Ukraine's Kyivstar harnesses Starlink to keep users online", "summary": "우크라이나 통신사 키이스타가 전시 상황에서 통신망 유지를 위해 스타링크 위성통신을 하이브리드 방식으로 도입했습니다. 750만 명 이상의 가입자가 지상망과 위성망을 결합한 시스템을 이용하고 있습니다. 이는 전시 상황에서 통신 인프라의 회복탄력성을 확보하기 위한 전략적 조치입니다.", "source": "Light Reading", "date": "2026-09-10 16:00", "url": "https://www.lightreading.com/satellite/lessons-from-a-war-zone-how-ukraine-s-kyivstar-harnesses-starlink-to-keep-users-online", "category": "tech", "importance": 4, "sid": "satellite", "topic": "키이스타 스타링크"}, {"title": "Nokia and Orange France complete first worldwide live service provider network tomography ", "summary": "노키아와 오렌지 프랑스가 세계 최초로 라이브 서비스 제공업체 네트워크 토모그래피 기술을 성공적으로 구현했다. 이 기술은 네트워크 내부의 트래픽 흐름을 정밀하게 분석하여 성능을 최적화한다. 노키아는 이번 성과를 통해 AI 기반 네트워크 관리 기술의 선두 주자임을 입증했다.", "source": "Nokia", "date": "2026-09-10 16:00", "url": "https://www.nokia.com/newsroom/nokia-and-orange-france-complete-first-worldwide-live-service-provider-network-tomography-trial-supporting-ai-ready-infrastructure/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 오렌지 협력"}, {"title": "KT, ‘AI 네트워크 ’ HD현대삼호 조선소에 깐다", "summary": "과기정통부와 NIA가 주관하는 고성능 AI 네트워크 기반조성 사업에 KT 컨소시엄이 참여한다. KT는 지난 7월 삼성전자, HD현대삼호 등과 함께 우선협상대상자로 선정되었다. 조선소 현장에 AI 네트워크를 적용해 산업용 통신 가치를 검증한다.", "source": "dailian.co.kr", "date": "2026-09-10 16:00", "url": "https://www.dailian.co.kr/news/view/1688943/?sc=Naver", "category": "contract", "importance": 4, "s ://www.4th.kr/news/articleView.html?idxno=2117809", "category": "tech", "importance": 4, "sid": "competitor", "topic": "애플 아이폰 듀오 국내 핵심부품 채택"}, {"title": "ZTE Global Summit & User Congress 2026 Opens in Kuala Lumpur, Advancing from Connectivity ", "summary": "ZTE가 쿠알라룸푸르에서 글로벌 서밋을 개최하고 차세대 연결 기술을 선보였습니다.", "source": "PR Newswire UK", "date": "2026-09-10 11:28", "url": "https://www.prnewswire.co.uk/news-releases/zte-global-summit--user-congress-2026-opens-in-kuala-lumpur-advancing-from-connectivity-to-digital-value-creation-302874501.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "zte 글로벌 서밋"}, {"title": "쿠팡·SKT급 유출 또 나면…과징금 '매출 10%' - v.daum.net", "summary": "쿠팡 및 SKT급의 대규모 정보 유출 사고 발생 시 과징금을 매출액의 최대 10%까지 부과하는 강력한 제재 방안이 추진됩니다. 통신사 및 플랫폼 기업의 보안 책임과 규제 강화 기조를 보여줍니다.", "source": "v.daum.net", "date": "2026-09-10 11:24", "url": "https://v.daum.net/v/20260910112400507", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 규제"}, {"title": "中 화웨이 장비 75% 교체했는데도 뚫렸다…美 통신망 해킹 파장", "summary": "미국 통신망이 대규모 해킹 사태인 '솔트 타이펀'에 뚫리면서 중국산 장비 잔존에 대한 우려가 커졌다. 미국은 FCC를 통해 화웨이 장비 철거를 지원하고 있으나 여전히 일부가 남아 보안 공백을 야기했다. 국내 정치권에서도 통신망 보안 대책 강화가 시급하다는 지적이 제기됐다.", "source": "news.mtn.co.kr", "date": "2026-09-10 11:14", "url": "https://news.mtn.co.kr/news-detail/2026091010555557264", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 솔트 타이펀 통신망 해킹 화웨이"}, {"title": "ソフトバンクとスカイ、「空飛ぶ基地局」HAPS商用化向けた通信試験に成功 米国から1万5,000kmを飛行 - drone-journal.impress.co.jp", "summary": "소프트뱅크와 스카이가 '하늘을 나는 기지국' HAPS의 상용화를 위한 장거리 통신 시험에 성공했습니다. 성층권 통신 네트워크 기술 실증입니다.", "source": "drone-journal.impress.co.jp", "date": "2026-09-10 11:08", "url": "https://drone-journal.impress.co.jp/docs/news/1188881.html", "category": "tech", "importance": 4, "sid": "satellite", "topic": "소프트뱅크 haps 통신"}, {"title": "T, AMZN Stocks In Focus — AT&T, Amazon Leo Partner To Expand Satellite Broadband For Busin", "summary": "AT&T와 아마존 레오가 파트너십을 맺고 기업용 위성 브로드밴드 서비스를 확장하는 협력 건에 대한 시장 초점 분석입니다.", "source": "Stocktwits", "date": "2026-09-10 11:04", "url": "https://stocktwits.com/news-articles/markets/equity/t-amzn-stocks-in-focus-at-and-t-amazon-leo-partner-to-expand-satellite-broadband-for-businesses/cZtE2toRJUv", "category": "contract", "importance": 4, "sid": "carrier", "topic": "at&t 아마존 위성 파트너십"}, {"title": "AT&T, 아마존 위성통신 결합 기업전용망 구성", "summary": "미국 AT&T가 광통신 및 5G 네트워크에 아마존의 저궤도 위성망 레오(Leo)를 결합하는 기업 전용 통신 서비스를 구축한다. 위성통신을 별도 상품이 아닌 기존 지상망과 하나의 기업용 서비스로 통합하여 커버리지와 복원력을 높인다. AT&T 비즈니스와 아마존 레오 간 계약을 통해 공공 및 기업 고객을 공략한다.", "source": "ZDNet Korea", "date": "2026-09-10 10:59", "url": "https://zdnet.co.kr/view/?no=20260910105904", "category": "contract", "importance": 4, "sid": "carrier", "topic": "at&t 위성통신"}, {"title": "신한·하나카드, AI결제 인프라 개발…SKT '모두의 AI' 컨소시엄 - 연합뉴스", "summary": "신한카드와 하나카드가 AI 결제 인프라 개발을 위해 SK텔레콤이 주도하는 '모두의 AI' 컨소시엄에 합류했다. 통신사와 금융권이 협력하여 AI 생태계를 확장하는 대표적 B2B 서비스 개발 사례이다.", "source": "연합뉴스", "date": "2026-09-10 10:50", "url": "https://www.yna.co.kr/amp/view/AKR20260910055000002", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai컨소시엄"}, {"title": "Verizon And Corning Sign Multi-Billion-Dollar Fiber Deal For Broadband And AI Infrastructu", "summary": "버라이즌이 코닝과 광대역 및 AI 인프라 확장을 위해 수십억 달러 규모의 대형 광케이블 공급 계약을 체결했다. 이번 계약을 통해 8,000만 마일 이상의 고밀도 광섬유를 확보하여 초고속 인터넷 및 AI 데이터센터 트래픽에 대응한다. 양사는 수년에 걸친 파트너십을 통해 미국 전역의 네트워크 고도화를 가속화할 방침이다. 통신사의 대규모 인프라 투자 계약으로 업계 파급력이 크다.", "source": "Pulse 2.0", "date": "2026-09-10 10:42", "url": "https://pulse2.com/verizon-and-corning-sign-multi-billion-dollar-fiber-deal-for-broadband-and-ai-infrastructure/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광케이블 계약"}, {"title": "2027년 통신장비 쇼티지 온다∙∙∙한국 중견업체 반사이익 주목 - leadeconomy.co.kr", "summary": "2027년 글로벌 통신장비 시장에 심각한 공급 부족 현상이 닥칠 것으로 전망되면서 국내 중견 장비 및 부품 업체들의 반사이익이 주목받고 있습니다. AI 데이터센터 투자와 맞물려 통신 인프라 수요가 급증하는 반면 주요 벤더들의 생산 능력이 한계에 달할 것이라는 분석입니다. 관련 수혜주에 대한 기대감이 커지고 있습니다.", "source": "leadeconomy.co.kr", "date ry": "other", "importance": 4, "sid": "carrier", "topic": "티모바일 경영 전략"}, {"title": "DOCOMO Conducts Green Base Station Demonstration with PLDT in the Philippines to Advance D", "summary": "NTT 도코모가 필리핀 PLDT와 함께 친환경 기지국(그린 기지국) 실증 실험을 성공적으로 완료했다. 글로벌 통신 시장에서 탈탄소 및 에너지 절감형 기지국 도입을 가속화한다.", "source": "TradingView", "date": "2026-09-10 00:32", "url": "https://www.tradingview.com/news/reuters.com,2026-09-09:newsml_JCN109950:0-docomo-conducts-green-base-station-demonstration-with-pldt-in-the-philippines-to-advance-decarbonization-technologies/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt 도코모 수주"}, {"title": "ATIS presents 'blueprint' for 6G spectrum requirements", "summary": "ATIS의 차세대G 얼라이언스가 2030년 6G 상용화에 필요한 주파수 요구사항을 권장하는 백서를 발표했다. 이번 백서는 6G 네트워크의 원활한 상용 도입을 위해 확보해야 할 주파수 대역과 전략적 방향성을 제시하고 있다. 북미 지역을 중심으로 차세대 통신 표준화 및 주파수 확보 논의가 가속화되고 있음을 보여준다. 삼성전자의 네트워크 연구개발 및 표준화 전략에 참고가 되는 동향이다.", "source": "Light Reading", "date": "2026-09-10 00:06", "url": "https://www.lightreading.com/6g/atis-presents-blueprint-for-6g-spectrum-requirements", "category": "tech", "importance": 4, "sid": "satellite", "topic": "atis 6g 주파수 요구사항"}, {"title": "ドコモ、フィリピンでグリーン基地局実証 太陽光利用率38％→61％ - k-tai.watch.impress.co.jp", "summary": "도코모가 필리핀에서 태양광 이용률을 38%에서 61%로 높인 그린 기지국 실증 결과를 공개했다.", "source": "k-tai.watch.impress.co.jp", "date": "2026-09-10 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2139533.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt 도코모 pldt 그린 기지국 실증"}, {"title": "[石野純也の「スマホとお金」]5Gも光も使えて通信障害に強い、すぐにネットが使える新サービス「auひかりプラス」の隠れた魅力と裏側", "summary": "KDDI가 기존 광회선(FTTH)에 더해 4G와 5G 모바일 통신까지 하나의 계약으로 모두 지원하는 새로운 고정 통신 서비스 'au히かりプラス'를 도입한다. 유무선 통합 서비스를 통해 사용자가 루터를 가지고 즉시 통신을 시작할 수 있는 편의성을 제공한다. 일본 이동통신 시장에서 유무선 결합 및 신규 서비스 경쟁력을 강화하는 전략적 행보이다. 삼성전자의 일본 통신사 대상 장비 및 홈 게이트웨이 영업에 시사점을 준다.", "source": "ケータイ Watch", "date": "2026-09-10 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/column/value/2139538.html", "category": 성이 강조되고 있다.", "source": "The Times of India", "date": "2026-09-11 15:24", "url": "https://timesofindia.indiatimes.com/technology/tech-news/thousands-in-texas-were-left-without-internet-and-tv-after-outage-iranian-hackers-say-we-did-it-att-says-no-we-/articleshow/134049926.cms", "category": "outage", "importance": 5, "sid": "outage", "topic": "at&t 장애"}, {"title": "世界初、ノキア製最新型基地局装置のマルチベンダー構成による商用運用を開始 - docomo.ne.jp", "summary": "노키아가 최신형 기지국 장비를 활용한 멀티벤더 구성의 상용 운용을 세계 최초로 시작했습니다. 차세대 통신 장비 기술의 실증 및 상용화 사례로 업계의 주목을 받고 있습니다.", "source": "docomo.ne.jp", "date": "2026-09-11 15:04", "url": "https://www.docomo.ne.jp/info/news_release/2026/09/11_00.html", "category": "tech", "importance": 5, "sid": "competitor", "topic": "노키아 기지국"}, {"title": "世界初、ノキア製最新型基地局装置のマルチベンダー構成による商用運用を開始 - prtimes.jp", "summary": "도코모가 노키아의 최신 기지국 장비를 도입하여 멀티벤더 구성의 상용 운용을 시작했습니다.", "source": "prtimes.jp", "date": "2026-09-11 15:00", "url": "https://prtimes.jp/main/html/rd/p/000000910.000118641.html", "category": "tech", "importance": 5, "sid": "competitor", "topic": "도코모 오픈랜 구축"}, {"title": "世界初、ノキア製最新型基地局装置のマルチベンダー構成による商用運用を開始 (2026年9月11日掲載) - ライブドアニュース", "summary": "NTT도코모가 노키아의 최신형 기지국 장비를 활용한 멀티벤더 구성 상용 운용을 세계 최초로 개시했습니다.", "source": "ライブドアニュース", "date": "2026-09-11 15:00", "url": "https://news.livedoor.com/pr_topics/detail/32304273/", "category": "tech", "importance": 5, "sid": "carrier", "topic": "ntt도코모 노키아 장비도입"}, {"title": "Frontier Internet Down? Users Report Outage Early Friday Morning Following Verizon Acquisi", "summary": "버라이즌의 프론티어 인수 발표 직후 금요일 이른 아침 프론티어 인터넷 서비스에서 광범위한 장애가 발생했다. 수많은 이용자들이 접속 불능 등의 불편을 겪으며 항의했다. 대형 통신사 M&A 시점과 맞물려 발생한 실제 네트워크 서비스 중단 사고이다.", "source": "International Business Times Australia", "date": "2026-09-11 14:57", "url": "https://www.ibtimes.com.au/frontier-customers-report-second-internet-outage-week-1875371", "category": "outage", "importance": 5, "sid": "outage", "topic": "프론티어 인터넷 장애"}, {"title": "US taking $100 million measure against Huawei 5G network in Africa - Huawei Central", "summary": "미국 정부가 아프리카 내 화웨이 5G 네트워크 확산을 견제하기 위해 1억 달러 규모의 대응 조치를 취하고 있습니다.", "source": "Huawei Central", "date": "2026-09-11 14:12", "url": "https://www.huaweicentral.com/us-taking-100-million-measure-against-huawei-5g-network-in-africa/", "category": "policy", "importance": 5, "sid": "policy", "topic": "미국 화웨이 제재"}, {"title": "美 검찰, 화웨이 에 '범죄 기업' 직격…영업비밀·이란 제재 쟁점", "summary": "미국 검찰이 중국 통신장비 업체 화웨이를 상대로 한 형사재판에서 회사를 '범죄 기업'으로 규정하고 영업비밀 탈취와 대이란 제재 위반, 금융사기 혐의를 제기했다. 이번 법적 공방은 글로벌 통신장비 시장 내 화웨이의 입지와 대외 제재 리스크를 크게 고조시키고 있다.", "source": "digitaltoday.co.kr", "date": "2026-09-11 11:44", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=699944", "category": "policy", "importance": 5, "sid": "competitor", "topic": "화웨이 범죄기업제소"}, {"title": "한화에어로, '천무' 유럽 수출 성공…크로아티아와 공급계약", "summary": "한화에어로스페이스가 크로아티아와 약 6,411억 원 규모의 다연장 유도미사일 '천무' 공급 계약을 체결했습니다.", "source": "전자신문", "date": "2026-09-11 10:26", "url": "https://www.etnews.com/20260911000099", "category": "contract", "importance": 5, "sid": "competitor", "topic": "한화에어로스페이스 수출"}, {"title": "T-Mobile customers complain of widespread outages - Mashable", "summary": "미국 이동통신사 티모바일 고객들 사이에서 광범위한 통신망 장애가 발생하여 불편이 확산되었다는 보도이다. 대규모 통신사 장애로 중요도 5점을 부여한다.", "source": "Mashable", "date": "2026-09-11 08:01", "url": "https://mashable.com/article/widespread-outages-t-mobile-att-verizon-sprint/?utm_source=social&utm_medium=facebook&utm_campaign=mash-com-fb-main-link&utm_content=tech&fbclid=IwAR0kTWmIxKKc1z4YXH3X7kXlOdmtVzu_SraTzqK9c6j7xufhMvv7ch70aW4", "category": "outage", "importance": 5, "sid": "outage", "topic": "티모바일 장애"}, {"title": "Huawei’s racketeering trial opens in New York six days before Xi meets Trump - martincid.c", "summary": "미중 정상회담을 앞두고 화웨이에 대한 미국의 형사 재판이 개시되었다. 제재 위반 및 기술 탈취 혐의를 다루는 이번 재판은 양국 간 기술 패권 경쟁의 분수령이 될 전망이다.", "source": "martincid.com", "date": "2026-09-11 03:36", "url": "https://www.martincid.com/business/huawei-racketeering-trial/", "category": "policy", "importance": 5, "sid": "policy", "topic": "화웨이 미국 연방 재판 개시"}, {"title": "Iridium, Deutsche Telekom and Toyota Test NB-IoT Voice Messaging Over LEO Satellites - IoT", "summary": "이리듐, 도이치텔레콤, 도요타가 저궤도 위성을 이용한 NB-IoT 음성 메시지 테스트를 완료했습니다.", "source": "IoT Business News", "date": "2026-09-11 01:38", "url": "https://iotbusinessnews.com/2026/09/10/iridium-deutsche-telekom-and-toyota-test-nb-iot-voice-messaging-over-leo-satellites/", "category": "tech", "importance": 5, "sid": "satellite", "topic": "이리듐 위성통신"}, {"title": "衛星とスマホの直接通信サービス「au Starlink Direct」の海外ローミングが8月31日からフィリピンとニュージーランドにも拡大！合計4カ国に - s-max.jp", "summary": "KDDI가 스타링크 연계 스마트폰 직접 통신 서비스의 해외 로밍 국가를 필리핀과 뉴질랜드까지 총 4개국으로 확대했습니다. 위성 기반 통신 서비스의 글로벌 호환성과 편의성이 빠르게 높아지고 있습니다. 통신사들의 위성 서비스 상용화 경쟁이 국경을 넘어 확장되고 있습니다.", "source": "s-max.jp", "date": "2026-09-11 23:55", "url": "https://s-max.jp/archives/1800388.html", "category": "contract", "importance": 4, "sid": "satellite", "topic": "케이디디아이 위성통신"}, {"title": "\"비행기 타면 무조건 무료\" 대한항공·아시아나, 15일부터 확 바뀌는 기내 서비스 | - nanamcom.co.kr", "summary": "대한항공과 아시아나항공이 15일부터 전 좌석 무료 기내 와이파이 서비스를 전면 도입하며 서비스 환경이 크게 바뀐다. 스타링크 위성 네트워크를 활용한 고속 인터넷 서비스가 본격 제공된다. 항공 승객의 통신 경험을 혁신하는 대표적 사례다.", "source": "nanamcom.co.kr", "date": "2026-09-11 23:50", "url": "https://www.nanamcom.co.kr/news/articleViewAmp.html?idxno=52909", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스타링크 기내와이파이"}, {"title": "Could a Vodafone Idea BSNL Network-Sharing Partnership Challenge Jio and Airtel? - Telecom", "summary": "보다폰 아이디어와 BSNL 간의 네트워크 공유 파트너십이 성사될 경우 인도 통신 시장의 거물인 지오와 에어텔에 강력한 대항마가 될 수 있는지 분석한 업계 전략 기사다. 인도 통신 시장의 판도를 바꿀 수 있는 인프라 공유 및 제휴 가능성을 다루고 있다. 경쟁 구도 재편 관점에서 주목할 만한 사안이다.", "source": "TelecomTalk", "date": "2026-09-11 23:16", "url": "https://telecomtalk.info/could-vodafone-idea-bsnl-network-sharing-partnership/1011756/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰아이디어 제휴"}, {"title": "Metro fiber, “kick-ass” 5G, a little DCI and D2D – AT&T sets its course", "summary": "AT&T가 구리선 네트워크를 철거하고 광섬유와 무선망을 핵심 사업으로 전환함. 위성 통합 및 기업용 서비스 확대를 통해 네트워크 고도화를 추진 중임. 주요 통신사의 인프라 전환 및 네트워크 투자 전략을 보여줌.", "source": "RCR Wireless", "date": "2026-09-11 22:55", "url": "https://rcrwireless.com/20260911/carriers/metro-fiber-kick-ass-5g-a-little-dci-and-d2d-att-sets-its-course", "category": "other", "importance": 4, "sid": "carrier", "topic": "at&t 전략"}, {"title": "Jio plans 1,600 satellites for Starlink-style internet: Report - The Hans India", "summary": "지오가 1,600개의 위성을 활용한 위성 인터넷 서비스를 계획하고 있습니다. 글로벌 위성 통신 시장의 경쟁이 가속화되고 있습니다.", "source": "The Hans India", "date": "2026-09-11 22:28", "url": "https://www.thehansindia.com/tech/jio-plans-1600-satellites-for-starlink-style-internet-report-1120857?utm_source=home&utm_medium=justIn", "category": "tech", "importance": 4, "sid": "satellite", "topic": "지오 위성 통신"}, {"title": "Trump administration lends $100M to US-owned cell phone network in Africa to expand Americ", "summary": "미국 행정부가 아프리카 지역에서 활동하는 미국계 통신망 사업자인 아프리카셀에 약 1억 달러 규모의 대출을 지원하여 통신 인프라 확장과 영향력 확대에 나선다.", "source": "The Edwardsville Intelligencer", "date": "2026-09-11 22:18", "url": "https://www.theintelligencer.com/news/world/article/trump-administration-lends-100m-to-us-owned-cell-22427032.php", "category": "contract", "importance": 4, "sid": "competitor", "topic": "미국 아프리카 통신망 대출 지원"}, {"title": "디지털 문해력 격차 해소 시 전 세계 GDP 성장에서 수조 달러 창출 가능", "summary": "화웨이가 협력하여 작성한 GSMA 인텔리전스 보고서가 유네스코 디지털 학습 주간에서 발표됐다. 모바일 광대역 커버리지 내에서도 3명 중 1명 이상이 디지털 문해력 부족으로 오프라인 상태에 머물러 있다는 연구 결과가 공개되었다. 글로벌 모바일 브로드밴드 보급과 디지털 격차 해소 정책에 시사점을 준다. 경쟁사인 화웨이의 글로벌 리포트 발표로 경영진 참고 가치가 있다.", "source": "ZDNet Korea", "date": "2026-09-11 22:10", "url": "https://zdnet.co.kr/view/?no=20260911221013", "category": "policy", "importance": 4, "sid": "policy", "topic": "화웨이 gsma보고서"}, {"title": "European telecoms are negotiating an alliance to offer satellite services - Inspenet", "summary": "유럽 주요 통신사들이 위성 서비스 제공을 위한 연합체 구성을 협상 중임. 위성통신 시장 경쟁력 확보를 위한 전략적 움직임임.", "source": "Inspenet", , "topic": "중흥통신 글로벌 서밋"}, {"title": "Deutsche Telekom's Two-Track Week: Elliott's Stake, a Satellite Voice Call, and a Buyback ", "summary": "도이치텔레콤이 엘리엇의 지분 인수, 위성 음성 통화 성공, 자사주 매입 등 최근의 주요 사업 흐름을 전개하고 있습니다. 위성통신 기술 실증과 경영 동향입니다.", "source": "ad-hoc-news.de", "date": "2026-09-11 21:10", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/deutsche-telekom-s-two-track-week-elliott-s-stake-a-satellite-voice/70087288", "category": "tech", "importance": 4, "sid": "satellite", "topic": "도이치텔레콤 위성 음성 통화"}, {"title": "“삼성전자 HBM, 더 크게 터진다”…'역대급' 증권가 파격 전망 나왔다", "summary": "증권가 리포트에 따르면 삼성전자의 고대역폭메모리(HBM) 시장 점유율이 4분기 40%에 육박하고 2나노 선단 공정 수율 개선으로 파운드리 흑자 전환 가능성이 높아지고 있습니다. HBM4 판매 확대가 주요 동인입니다.", "source": "전자신문", "date": "2026-09-11 21:08", "url": "https://www.etnews.com/20260911000368", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "삼성전자 hbm 실적"}, {"title": "Zankore to build Indonesia's first AI factory with $3.1B funding", "summary": "인도네시아 오사토 홀딩스(IOH), 엔비디아, 노키아의 합작사인 잔코레가 31억 달러 규모의 자금 조달을 완료했다. 이를 통해 1기가와트 규모의 AI 팩토리와 네오 클라우드 플랫폼 초기 구축에 착수한다. 노키아는 주요 통신 및 기술 기업들과의 협력을 통해 AI 인프라 시장에서 입지를 확대하고 있다. 이번 대규모 프로젝트는 통신 장비 업체의 인프라 다각화 전략을 보여준다.", "source": "Light Reading", "date": "2026-09-11 20:54", "url": "https://www.lightreading.com/data-centers/zankore-to-build-indonesia-s-first-ai-factory-with-3-1b-funding", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 ai 팩토리 수주"}, {"title": "Amazon Leo adds new Arianespace launches - Advanced Television", "summary": "아마존의 저궤도 위성 프로젝트(Amazon Leo)가 아리안스페이스와 추가 발사 계약을 체결했다. Kuiper 콘스탈레이션 구축을 위한 발사 수주 및 협력 확대의 일환이다.", "source": "Advanced Television", "date": "2026-09-11 20:53", "url": "https://www.advanced-television.com/2026/09/11/amazon-leo-adds-new-arianespace-launches/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아마존 위성수주"}, {"title": "Vietnam Auctions 900 MHz Spectrum for 4G, 5G Expansion - Telecom Review Asia", "summary": "베트남이 4G 및 5G 네트워크 확장을 위해 900MHz 대역 주파수 경매를 진행했다. 동남아 통신 시장의 주파수 확보 및 인프라 투자 가속화를 보여주는 규제·정책 이벤트다.", "source": "Telecom Review Asia", "date": "2026-09-11 20:43", "url": "https://www.telecomreviewasia.com/news/network-news/30245-vietnam-auctions-900-mhz-spectrum-for-4g-5g-expansion/", "category": "policy", "importance": 4, "sid": "policy", "topic": "베트남 900mhz 주파수 경매"}, {"title": "SBI Agreed To Provide $3.5 Billion Of Debt Financing To Vodafone Idea - Times Now", "summary": "SBI 컨소시엄이 보다폰 인디아(Vodafone Idea)에 35억 달러(약 35,000억 원) 규모의 부채 금융 제공에 합의했다. 이번 자금 조달로 보다폰 인디아는 턴어라운드와 재무 구조 개선에 속도를 낼 전망이다. 인도 통신 시장에서 대규모 자금 확보가 이루어지며 장비 투자 확대 가능성이 제기된다. 주요 통신사의 대규모 자금 조달은 글로벌 통신장비 시장의 투자 심리에 긍정적 영향을 미칠 것으로 평가된다.", "source": "Times Now", "date": "2026-09-11 20:05", "url": "https://www.timesnownews.com/business-economy/companies/sbi-agreed-to-provide-3-5-billion-of-debt-financing-to-vodafone-idea-article-156139812", "category": "contract", "importance": 4, "sid": "competitor", "topic": "보다폰인도네시아 수주"}, {"title": "Vodafone Idea secures $3.5bn debt backing from SBI-led lenders - Developing Telecoms", "summary": "인도 통신사 보다폰 아이디어가 SBI 주도 대출 기관으로부터 35억 달러 규모의 부채 자금 조달을 확보했다. 이번 자금 유치를 통해 네트워크 투자 및 인프라 확장을 가속화할 전망이다. 인도 통신 시장의 주요 재무 건전성 개선 사례로 의미가 크다.", "source": "Developing Telecoms", "date": "2026-09-11 19:59", "url": "https://developingtelecoms.com/telecom-business/operator-news/20815-vodafone-idea-secures-3-5bn-debt-backing-from-sbi-led-lenders.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보더폰인도 자금조달"}, {"title": "Huawei labeled a 'criminal enterprise' as trial begins in US - NewsBytes", "summary": "미국에서 열린 재판에서 화웨이가 '범죄 기업'으로 지목되며 본격적인 공방이 시작됐다. 미 정부의 대중국 제재 기조 속에서 화웨이의 법적 압박이 가중되는 국면이다. 주요 경쟁사의 법적 리스크 심화는 글로벌 장비 시장의 경쟁 지형에 큰 파장을 일으킨다. 향후 제재 수위 변화를 예의주시해야 한다.", "source": "NewsBytes", "date": "2026-09-11 19:57", "url": "https://www.newsbytesapp.com/news/business/us-prosecutor-calls-huawei-a-criminal-enterprise-as-trial-begins/story", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 재판"}, {"title": "AT&T Business expands connectivity with Amazon Leo satellite - TipRanks", "summary": "AT&T 비즈니스가 아마존 카이퍼와의 협력을 통해 기업용 위성 연결 서비스를 확장한다. 기업 고객에게 지상망과 위성이 결합된 끊김 없는 하이브리드 네트워크를 제공한다. B2B 통신 시장에서 위성 기술의 활용도가 한층 높아졌다.", "source": "TipRanks", "date": "2026-09-11 19:57", "url": "https://www.tipranks.com/news/the-fly/att-business-expands-connectivity-with-amazon-leo-satellite-thefly-news", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 비즈니스 아마존 카이퍼 위성 연동"}, {"title": "Jio is putting 1600 satellites in orbit, will provide satellite internet like Starlink: Re", "summary": "릴라이언스 지오가 1600개의 위성을 궤도에 올려 위성 인터넷 서비스를 제공할 계획임. 인도 시장의 위성통신 경쟁 본격화임.", "source": "India Today", "date": "2026-09-11 19:49", "url": "https://www.indiatoday.in/amp/technology/news/story/jio-is-putting-1600-satellites-in-orbit-will-provide-satellite-internet-like-starlink-report-2992432-2026-09-11", "category": "tech", "importance": 4, "sid": "satellite", "topic": "릴라이언스 지오 위성"}, {"title": "Docomo lights Nokia open RAN base station - Mobile World Live", "summary": "일본 NTT도코모가 노키아의 최신 오픈랜(Open RAN) 기지국 장비를 상용망에 도입하고 운용을 시작했다. 멀티벤더 환경에서의 오픈랜 상용화를 가속화하는 중요한 진전으로 평가된다. 향후 개방형 무선 접속망 시장 확대에 긍정적인 영향을 미칠 것으로 기대된다.", "source": "Mobile World Live", "date": "2026-09-11 19:05", "url": "https://www.mobileworldlive.com/docomo/docomo-lights-nokia-open-ran-base-station/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 오픈랜"}, {"title": "Nokia and Orange claim a first with network tomography trial - Telecoms", "summary": "노키아와 오렌지가 세계 최초의 네트워크 토모그래피 라이브 시험에 성공했다. AI 기반 분석을 통해 통신망 내부를 투시하듯 상태를 파악하는 기술이다. 양사의 기술 협력 성과가 주목받고 있다.", "source": "Telecoms", "date": "2026-09-11 19:04", "url": "https://www.telecoms.com/fibre/nokia-and-orange-claim-a-first-with-network-tomography-trial", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 오렌지 ai 네트워크"}, {"title": "AT&T Business Expands Partnership With  위성통신 시장의 경쟁이 본격화되는 계기가 될 것으로 보인다.", "source": "Light Reading", "date": "2026-09-11 18:31", "url": "https://www.lightreading.com/satellite/india-approves-5-spectrum-charge-for-satellite-players-report", "category": "policy", "importance": 4, "sid": "satellite", "topic": "인도 위성 규제"}, {"title": "Ericsson deploys private 5G network at US airport - Mobile Europe", "summary": "에릭슨이 미국 공항 내 프라이빗 5G 네트워크 배포를 완료했다. 공항이라는 특수 환경에서의 통신 인프라 수주 및 구축으로, 경쟁사의 버티컬 시장 공략 확대를 보여준다.", "source": "Mobile Europe", "date": "2026-09-11 18:16", "url": "https://www.mobileeurope.co.uk/ericsson-5g-usa/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 공항 프라이빗 5g 구축"}, {"title": "US in move to counter Huawei in Africa - extensia-ltd.com", "summary": "미국 정부가 아프리카 통신 시장에서 화웨이의 지배력을 낮추고 대체 공급망을 확보하기 위한 본격적인 견제 조치에 착수했다. 글로벌 통신장비 시장의 지정학적 경쟁이 격화되고 있다.", "source": "extensia-ltd.com", "date": "2026-09-11 18:11", "url": "https://extensia-ltd.com/2026/09/11/us-in-move-to-counter-huawei-in-africa/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "미국 아프리카 화웨이 견제 정책"}, {"title": "\"빠른 망에서 한 단계 도약\" 피지컬 AI 위한 'AI 네트워크 ' 뜬다", "summary": "삼성전자 네트워크사업부 관계자가 AI에 최적화된 차세대 네트워크 구조와 소프트웨어 분리 구축의 필요성을 강조했다.", "source": "itdaily.kr", "date": "2026-09-11 18:10", "url": "https://www.itdaily.kr/news/articleView.html?idxno=241560", "category": "tech", "importance": 4, "sid": "competitor", "topic": "삼성전자 ai네트워크"}, {"title": "\"소형 원자로 개발 속도 내 2035년 상용화\"... 내년 상세설계 착수", "summary": "과기정통부는 소형모듈원자로(SMR) 개발 촉진 및 지원에 관한 특별법과 시행령이 11일 시행된다고 밝혔다. 정부는 5년마다 SMR 개발 기본계획을 수립하고 2035년 상용화를 목표로 전방위 지원에 나선다.", "source": "hankookilbo.com", "date": "2026-09-11 18:01", "url": "https://www.hankookilbo.com/news/article/A2026091108510005057?did=NA", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 smr특별법"}, {"title": "[기자수첩]KT넷코어 사망사고, 중대재해수사과로 이첩…박윤영 사장 답할 차례 - 1코노미뉴스", "summary": "KT넷코어 사망사고와 관련해 사건이 중대재해수사과로 이첩되면서 박윤영 사장의 책임 문제가 대두되었습니다. 통신 인프라 시공 및 협력사 관리와 관련된 심각한 : "보다폰인도네시아 자금 조달"}, {"title": "ADI, 알리프 세미컨덕터 인수…'피지컬 인텔리전스' 사업 가속화", "summary": "아나로그디바이스(ADI)가 알리프 세미컨덕터를 13억 5000만 달러 규모의 전액 현금 거래로 인수하는 최종 계약을 체결했다. AI가 물리적 세계와 상호작용하는 단계로 진입함에 따라 모션, 소리, 전파 등의 신호 추론 사업을 가속화하기 위한 전략이다. 글로벌 반도체 및 엣지 인텔리전스 분야의 대형 M&A 계약이다.", "source": "ZDNet Korea", "date": "2026-09-11 11:17", "url": "https://zdnet.co.kr/view/?no=20260911095741", "category": "contract", "importance": 4, "sid": "competitor", "topic": "아나로그디바이스 기업 인수"}, {"title": "中CXMT, 상하이 신규 팹 설비투자 준비…韓 맹추격", "summary": "중국 최대 D램 업체인 CXMT가 상하이 신규 팹 설비투자를 위한 장비 입찰을 시작하며 공격적인 증설에 돌입했다. 투자가 원활히 진행되면 삼성전자와 SK하이닉스 등 국내 메모리 반도체 기업들과의 생산능력 격차를 빠르게 좁힐 것으로 예상된다. 글로벌 메모리 반도체 시장의 경쟁 구도에 중대한 위협 요소로 작용할 수 있다.", "source": "ZDNet Korea", "date": "2026-09-11 11:15", "url": "https://zdnet.co.kr/view/?no=20260911105941", "category": "contract", "importance": 4, "sid": "competitor", "topic": "cxmt 팹투자"}, {"title": "SBI-led group agrees to $3.5 billion debt package for Vodafone Idea to fuel network push: ", "summary": "SBI 주도 컨소시엄이 Vodafone Idea의 네트워크 확충을 위해 35억 달러 규모의 부채 패키지에 동의했습니다. 통신사의 대규모 자금 조달을 통한 네트워크 투자 재원 확보를 다룹니다. 통신사 투자 관련 중요 소식입니다.", "source": "Business Today", "date": "2026-09-11 11:04", "url": "https://www.businesstoday.in/latest/corporate/story/sbi-led-group-agrees-to-3-5-billion-debt-package-for-vodafone-idea-to-fuel-network-push-report-554734-2026-09-11", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰인디아 대출"}, {"title": "[아시아포럼] 왕즈린 中 대사 참사관 \"차이나 기회 2.0 시대, 공동 혁신...", "summary": "왕 참사관은 \"한국의 인공지능(AI) 반도체 및 첨단 하드웨어 기술 과 중국의 대규모 시장 및 상용화 역량을 결합해 데이터센터, 자율주행, 6G 등에서 새로운 성장 공간을 개척해야 한다\"고 말했다. 아울러 재생에너지...", "source": "newspim.com", "date": "2026-09-11 10:53", "url": "https://www.newspim.com/news/view/20260911000475", "category": "tech", "importance": 4, "sid": "satellite", "topic": ""}, {"title": "5G·AI로 용접로봇 자동화…KT, HD현대삼호서 피지컬 AI 실증 나서 - v.daum.net", "summary": "KT가 5G와 AI를 결합하여 HD현대삼호 조선소에서 용접로봇을 자동화하는 피지컬 AI 실증 사업에 나섭니다. B2B 스마트팩토리 시장 공략의 핵심 사례입니다.", "s  "contract", "importance": 4, "sid": "satellite", "topic": "아시아나항공 스타링크"}, {"title": "200만원 아이폰18 오늘부터 예약...통신 3사 할인 경쟁", "summary": "SK텔레콤, KT, LG유플러스 등 이동통신 3사가 출고가가 오른 '아이폰18 프로·프로맥스' 사전예약 판매에 돌입했다. 전작보다 오른 단말기 가격 부담을 낮추기 위해 이통3사는 단말 할인, 중고폰 보상, 콘텐츠 및 AI 구독권 등을 내세워 치열한 가입자 유치 경쟁을 벌이고 있다.", "source": "ZDNet Korea", "date": "2026-09-12 08:10", "url": "https://zdnet.co.kr/view/?no=20260911212856", "category": "contract", "importance": 4, "sid": "carrier", "topic": "이통3사 아이폰18 사전예약"}, {"title": "Iridium tables NTN Direct go-live for Q4 - telcotitans.com", "summary": "이리디움이 비지상네트워크(NTN) 다이렉트 서비스의 공식 상용화 시점을 올해 4분기로 예고했습니다. 위성 직접 통신 시장 진입을 위한 본격적인 준비 단계입니다.", "source": "telcotitans.com", "date": "2026-09-12 08:01", "url": "https://www.telcotitans.com/deutsche-telekomwatch/iridium-tables-ntn-direct-go-live-for-q4/10866.article", "category": "tech", "importance": 4, "sid": "satellite", "topic": "이리디움 위성통신"}, {"title": "인도, 위성통신 주파수 쓰려면 매출 5% 내라", "summary": "인도 정부가 위성통신 사업자에게 매출의 5%를 주파수 사용료로 부과하는 방안을 추진합니다. 기존 권고안보다 부담이 커져 스타링크 등 인도 시장 진출을 준비하는 사업자들의 비용 부담이 가중될 전망입니다.", "source": "ZDNet Korea", "date": "2026-09-12 07:40", "url": "https://zdnet.co.kr/view/?no=20260912073508", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도 위성통신 규제"}, {"title": "[월드IT뷰] 3GPP 마드리드 총회 14일 개막…6G 전환 방식 결정되나 - 뉴스웍스", "summary": "3GPP 마드리드 총회가 개막하여 6G 전환 방식 및 표준화 로드맵을 결정하는 중요한 분수령이 되고 있습니다. 글로벌 이동통신 표준화의 핵심 이벤트입니다.", "source": "뉴스웍스", "date": "2026-09-12 07:04", "url": "https://www.newsworks.co.kr/news/articleViewAmp.html?idxno=853453", "category": "tech", "importance": 4, "sid": "satellite", "topic": "3gpp 마드리드 총회"}, {"title": "FCC Interested in 1.6 GHz Auction in 2028, NTIA Official Says - Broadband Breakfast", "summary": "미국 FCC가 2028년 1.6 GHz 대역 주파수 경매 개최에 관심을 보이고 있다고 NTIA 관리가 밝혔다.", "source": "Broadband Breakfast", "date": "2026-09-12 06:36", "url": "https://broadbandbreakfast.com/fcc-interested-in-1-6-ghz-auction-in-2028-ntia-official-says/", "category": "policy", "importance": 4, "sid": "policy", "topic": "fcc 주파수 경매"}, {"title": "China's Huawei Technologies faces racketeering trial in New York - ABC News - Breaking New", "summary": "중국 화웨이 테크놀로지가 뉴욕 법원에서 공갈 혐의 관련 재판에 직면했습니다. 미국 정부와 중국 장비사 간의 사법적 리스크가 심화되고 있음을 보여줍니다. 글로벌 통신장비 경쟁 구도에 중대한 영향을 미치는 규제·법적 이슈입니다.", "source": "ABC News - Breaking News, Latest News and Videos", "date": "2026-09-12 06:30", "url": "https://abcnews.com/US/wireStory/chinas-huawei-technologies-faces-racketeering-trial-new-york-136264518", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 뉴욕 재판 회부"}, {"title": "US Carriers Back Chinese Telecom Ban but Warn Interconnection Scope Could Wall Off Global ", "summary": "미국 통신사들이 중국산 장비 금지 정책을 지지하면서도, 상호 연결성 문제로 인한 글로벌 네트워크 단절 가능성을 경고함.", "source": "Tech Times", "date": "2026-09-12 06:16", "url": "https://www.techtimes.com/articles/327380/20260911/us-carriers-back-chinese-telecom-ban-warn-interconnection-scope-could-wall-off-global-traffic.htm", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 통신 정책"}, {"title": "ドコモ、ノキア製最新基地局装置で世界初のマルチベンダー商用運用スタート - excite.co.jp", "summary": "NTT 도코모가 노키아 최신 기지국을 통한 세계 최초 멀티벤더 상용 운용을 시작했습니다.", "source": "excite.co.jp", "date": "2026-09-12 06:13", "url": "http://www.excite.co.jp/news/article/k_tai_watch_1471252820539949870/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "엔티티도코모 노키아"}, {"title": "[심층리포트] 개인정보 유출 과징금 감경 40%, SKT·KT·쿠팡 3대 심결로 본 증빙 설계법 - 한국데이터경제신문", "summary": "개인정보 유출 사고에 따른 과징금 감경 40% 적용과 관련해 SKT, KT, 쿠팡의 심결 사례를 통해 증빙 설계법을 분석했다. 통신사 규제 준수 및 컴플라이언스 기준 확립에 중요한 정책적 시사점을 제공한다. 통신 규제 동향 파악에 가치가 있다.", "source": "한국데이터경제신문", "date": "2026-09-12 06:05", "url": "https://www.dataeconomy.co.kr/news/articleView.html?idxno=42547", "category": "policy", "importance": 4, "sid": "policy", "topic": "개인정보 과징금 감경"}, {"title": "투자한 만큼 주파수 값 낮춰야...재할당 제도 개편 필요 - v.daum.net", "summary": "투자한 만큼 주파수 값을 낮춰야 하며 재할당 제도를 개편해야 한다는 목소리가 나온다. 통신사의 자발적 투자를 유도하기 위해 대가 감면 등 합리적인 제도 개선이 필요하다는 지적이다.", "source": "v.daum.net", "date": "2026-09-12 06:01", "url": "https://v.daum.net/v/1r0fZVZvjR", "category": "policy", "importance": 4, "sid": "policy", "topic": "주파수 재할당 제도 개편"}, {"title": "【画像】ドコモ、ノキア製最新基地局装置で世界初のマルチベンダー商用運用スタート - news.livedoor.com", "summary": "도코모가 노키아의 최신 기지국 장비를 활용해 세계 최초로 멀티벤더 상용 운용을 시작했다고 보도했다. 이번 도입은 개방형 무선 접속망(Open RAN) 환경에서의 실증 및 상용화 진전을 보여준다. 글로벌 장비 시장에서 노키아의 기술 상용화 경쟁력을 입증하는 사례다. 다국적 장비사 간 기술 주도권 경쟁 속에서 네트워크 유연성을 높이는 의미가 있다.", "source": "news.livedoor.com", "date": "2026-09-12 06:00", "url": "https://news.livedoor.com/article/image_detail/32304726/?img_id=56313251", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 수주"}, {"title": "Nokia Stock Jumps As AI, Index Comeback Fuel Momentum - timothysykes.com", "summary": "노키아 주가가 AI 수요 증가와 지수 편입 등에 힘입어 상승세를 보이고 있습니다.", "source": "timothysykes.com", "date": "2026-09-12 05:47", "url": "https://timothysykes.com/news/nokia-corporation-sponsored-nok-news-2026_09_11-2/", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "노키아 실적"}, {"title": "Verizon Waves Off Starlink, Bets On Cities And Old Phone Buildings - Stocktwits", "summary": "버라이즌이 스타링크 대신 도시 인프라와 기존 통신 시설 활용에 집중하는 전략을 선택했습니다. 지상망 중심의 서비스 강화 전략입니다.", "source": "Stocktwits", "date": "2026-09-12 04:41", "url": "https://stocktwits.com/news-articles/markets/equity/verizon-waves-off-starlink-bets-on-cities-and-old-phone-buildings/cZt7idaRJCG", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 위성통신"}, {"title": "Ghana approves three bidders for 5G - Connecting Africa", "summary": "가나 정부가 5G 입찰을 위한 3개 입찰자를 승인했다. 아프리카 국가의 5G 네트워크 상용화 추진을 위한 사업자 선정 절차가 진행 중임을 보여준다.", "source": "Connecting Africa", "date": "2026-09-12 03:44", "url": "https://www.connectingafrica.com/5g-networks/ghana-approves-three-bidders-for-5g", "category": "contract", "importance": 4, "sid": "carrier", "topic": "가나 5g"}, {"title": "SBI-Led Lenders Agree $3.5 Bn Debt For Vodafone Idea - BW Businessworld", "summary": "SBI 주도 대출 기관들이 보다폰 인디아를 위해 35억 달러어치의 부채 패키지에 합의했다. 자금난을 해소하고 네트워크 투자 자금을 확보하는 데 성공했다. 인도 통신 시장의 건전성을 유지하는 데 기여하는 대형 계약이다. 회사의 장기 성장 기반을 다지는 계기가 된다.", "source": "BW Businessworld", "date": "2026-09-12 03:38", "url": "https://www.businessworld.in/article/sbi-led-lenders-agree-3-5-bn-debt-for-vodafone-idea-623193", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰인도 자금조달"}, {"title": "Iridium Sends Voice Message from Toyota Vehicle With Deutsche Telekom IoT - Via Satellite", "summary": "이리듐이 도이치텔레콤의 IoT망을 활용해 도요타 차량에서 위성 음성 메시지를 전송하는 기술을 시연함. 위성-지상망 연동 기술의 상용화 가능성을 보여주는 사례임.", "source": "Via Satellite", "date": "2026-09-12 03:05", "url": "https://www.satellitetoday.com/connectivity/2026/09/11/iridium-sends-voice-message-from-toyota-vehicle-with-deutsche-telekom-iot/", "category": "tech", "importance": 4, "sid": "satellite", "topic": "이리듐 위성통신"}, {"title": "Telecom Company in Africa Gets $100 Million U.S. Loan to Compete with China’s Huawei - bre", "summary": "아프리카의 통신사가 중국 화웨이에 대항하기 위해 미국으로부터 1억 달러의 대출을 받았다. 아프리카 통신 인프라 시장에서 미·중 기술 경쟁이 심화되고 있음을 시사한다. 서구권 정부의 자금 지원은 중국 장비 점유율을 낮추는 데 기여할 수 있다. 이는 글로벌 네트워크 장비 시장의 지형도에 영향을 미치는 사안이다.", "source": "breitbart.com", "date": "2026-09-12 02:57", "url": "https://www.breitbart.com/national-security/2026/09/11/telecom-company-africa-gets-100-million-u-s-loan-to-compete-chinas-huawei/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "트럼프 행정부 아프리카셀 대출"}, {"title": "Elisa stock gains attention as Google taps operator for major AI data center project - ad-", "summary": "구글이 대규모 AI 데이터센터 프로젝트를 위해 핀란드 통신사 엘리사를 파트너로 낙점하면서 엘리사 주식이 주목을 받고 있다. 통신사의 AI 인프라 협력 및 수주 동향을 보여주는 중요 기사이다.", "source": "ad-hoc-news.de", "date": "2026-09-12 02:48", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/elisa-stock-gains-attention-as-google-taps-operator-for-major-ai-data/70088709", "category": "contract", "importance": 4, "sid": "carrier", "topic": "엘리사 ai 데이터센터"}, {"title": "Airtel seeks sovereign stack to control Indians' data processed overseas - business-standa", "summary": "바티 에어텔이 인도 국민의 데이터가 해외에서 처리되는 것을 통제하기 위해 주권형 데이터 스택(Sovereign Stack) 도입을 요구하고 나섰다. 국가 데이터 안보와 통신 규제 강화에 초점을 맞춘 정책적 제안이다. 해외 데이터 처리 및 통신 규제 패러다임 변화에 시사점을 준다.", "source": "business-standard.com", "date": "2026-09-12 02:37", "url": "https://www.business-standard.com/india-news/airtel-seeks-sovereign-stack-to-control-indians-data-processed-overseas-126091101484_1.html", "category": "policy", "importance": 4, "sid": "policy", "topic": "바티에어텔 정책"}, {"title": "Deutsche Telekom's Capital Question Meets a Satellite Milestone - ad-hoc-news.de", "summary": "도이치텔레콤의 자본 전략과 위성통신 기술 성과를 다룸. 통신사의 기술 및 재무 전략임.", "source": "ad-hoc-news.de", "date": "2026-09-12 02:01", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/deutsche-telekom-s-capital-question-meets-a-satellite-milestone/70088544", "category": "tech", "importance": 4, "sid": "satellite", "topic": "도이치텔레콤 위성통신"}, {"title": "Huawei’s new optical engine is about more than speed - Fierce Network", "summary": "화웨이가 새로운 광학 엔진 기술을 공개했습니다. 단순한 속도 향상을 넘어 네트워크 효율성과 지능화를 목표로 하는 화웨이의 차세대 광통신 기술 전략입니다.", "source": "Fierce Network", "date": "2026-09-12 01:51", "url": "https://www.fiercewireless.com/wireless/huaweis-new-optical-engine-about-more-speed", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 기술"}, {"title": "AST SpaceMobile Looks to Extend Its 30-Day FCC Satellite Testing Window - TradingView", "summary": "위성통신 기업 AST스페이스모바일이 미 연방통신위원회(FCC)에 30일간의 위성 테스트 윈도우 연장을 신청하고 승인을 추진합니다. 상용화를 위한 위성 시험 비행 및 규제 기관의 허가 절차 관련 보도입니다. 위성통신 규제 및 테스트 동향입니다.", "source": "TradingView", "date": "2026-09-12 01:40", "url": "https://www.tradingview.com/news/marketbeat:16a31c02c094b:0-ast-spacemobile-looks-to-extend-its-30-day-fcc-satellite-testing-window/", "category": "policy", "importance": 4, "sid": "satellite", "topic": "ast스페이스모바일 fcc 승인"}, {"title": "Verizon shores up its fiber supply - Lightwave Online", "summary": "버라이즌이 광섬유 공급망을 안정적으로 확보하기 위해 공급망 다변화 및 조달 확충에 나섰다. 초고속 통신망 및 5G, 데이터센터 인프라 확대를 위한 안정적인 광케이블 조달이 핵심 과제로 부각되고 있다. 대형 통신사의 인프라 투자 확대는 관련 장비 및 부품 생태계 전반에 긍정적인 영향을 미친다. 통신망 고도화를 위한 필수 자원 확보 전략이다.", "source": "Lightwave Online", "date": "2026-09-12 01:12", "url": "https://www.lightwaveonline.com/home/video/55404459/fridayfive_9_11_26", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 수주"}, {"title": "Ex-Bell Labs chief says 6G will need more than AI ‘magic dust’ - Fierce Network", "summary": "전직 벨랩스 최고기술책임자가 다가오는 6G 시대에는 단순한 AI 도입을 넘어선 근본적인 기술 혁신이 필요하다고 제언했다. 차세대 통신 표준화 연구에 시사하는 바가 크다.", "source": "Fierce Network", "date": "2026-09-12 01:11", "url": "https://www.fierce-network.com/wireless/ex-bell-labs-chief-says-6g-will-need-more-ai-magic-dust", "category": "tech", "importance": 4, "sid": "satellite", "topic": "전직 벨랩스 수장 6g"}, {"title": "Verizon's $20B Frontier deal boosts service rev... - pluang.com", "summary": "버라이즌의 대규모 프론티어 인수 딜이 회사의 장기적인 통신 서비스 매출 증대와 네트워크 경쟁력 강화에 기여할 것으로 전망된다.", "source": "pluang.com", "date": "2026-09-12 00:39", "url": "https://pluang.com/en/news-feed/verizon-fokus-pada-konvergensi-layanan-dan-pertumbuhan-pendapatan", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 프론티어 인수 서비스 매출 증대"}, {"title": "하늘서도 무료 와이파이… 출장 직장인들 ‘쉴 틈’ 없겠네", "summary": "대한항공과 아시아나항공이 오는 15일부터 스페이스X의 저궤도 위성 인터넷 '스타링크'를 도입하여 일부 국제선의 이코노미부터 일등석까지 전 좌석에 초고속 기내 와이파이를 무료로 제공한다고 발표했습니다. 위성통신 서비스의 대형 항공사 상용화 도입 사례입니다.", "source": "chosun.com", "date": "2026-09-12 00:35", "url": "https://www.chosun.com/economy/industry-company/2026/09/12/4A53DVMCPNG3HNDOZNT6VIPBTQ/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "contract", "importance": 4, "sid": "satellite", "topic": "대한항공 아시아나 스타링크"}, {"title": "U.S. Boosts Africell with $100 Million Loan to Counter Huawei in Africa - Devdiscourse", "summary": "미국이 아프리셀에 대한 1억 달러 규모의 금융 지원을 통해 아프리카 통신 시장에서 화웨이에 대응하는 전략을 강화하고 있다.", "source": "Devdiscourse", "date": "2026-09-12 00:28", "url": "https://www.devdiscourse.com/article/technology/3976139-us-boosts-africell-with-100-million-loan-to-counter-huawei-in-africa?amp", "category": "contract", "importance": 4, "sid": "competitor", "topic": "화웨이 제재"}, {"title": "대한항공·아시아나, '스타링크' 기내 와이파이 전격 도입… 15일부터 전 좌석 무료 제공 - cbci.co.kr", "summary": "대한항공과 아시아나항공이 스타링크를 도입하여 15일부터 전 좌석에 무료 기내 와이파이를 제공한다. 위성통신 사업자의 국내 항공 시장 진입 성과다.", "source": "cbci.co.kr", "date": "2026-09-12 00:05", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=605912", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스타링크 위성수주"}], "2026-09-13": [{"title": "새우등 터진 韓 로봇, 美 수출 제동", "summary": "미국 연방통신위원회(FCC)가 외국산 휴머노이드 로봇 및 자율주행로봇 수입을 규제함에 따라 국내 로봇 기업들의 미국 수출에 제동이 걸렸다. 신규 승인을 받지 못한 첨단 로봇의 미국 내 수입과 유통이 금지되면서 국내 산업계에 큰 타격이 발생했다. 정부 차원의 조속한 대책 마련이 시급하다는 지적이 제기되고 있다.", "source": "전자신문", "date": "2026-09-13 16:00", "url": "https://www.etnews.com/20260911000247", "category": "policy", "importance": 5, "sid": "policy", "topic": "미국 fcc 로봇규제"}, {"title": "AT&T First US Wireless Carrier To Use Amazon Leo's Low-Earth-Orbit Satellite Division - Ae", "summary": "AT&T가 미국 이동통신사 중 최초로 아마존의 저궤도 위성 통신 부문인 '아마존 레오(Amazon Leo / Kuiper)'의 위성 서비스를 도입하기로 결정했다. 지상 통신망과 저궤도 위성을 결합하는 대형 통신사의 네트워크 확장 전략이자 위성통신 상용화의 중대한 전환점이다.", "source": "Aero-News.net", "date": "2026-09-13 15:37", "url": "https://www.aero-news.net/index.cfm?do=main.ajTextPost&id=245D7BFA-024C-403F-955A-2EAAC07012B7", "category": "contract", "importance": 5, "sid": "carrier", "topic": "at&t 아마존 레오 제휴"}, {"title": "オプタスの通信障害が3州に影響、豪政府が通信網の強靱化へ - BigGo ファイナンス", "summary": "호주 통신사 오프타스(Optus)의 대규모 통신 장애가 3개 주에 걸쳐 발생하여 광범위한 서비스 중단 피해가 일어났다. 이에 따라 호주 정부는 국가 통신망의 인프라 강인성과 비상 대응 체계를 강화하기 위한 대책 마련에 착수했다. 전국 단위의 심각한 통신망 장애로 수백만 명의 가입자와 주요 서비스에 영향을 미쳤다. 통신망 안정성 확보의 중요성을 보여주는 대표적 장애 사고이다.", "source": "BigGo ファイナンス", "date": "2026-09-13 11:55", "url": "https://finance.biggo.jp/news/18739aa4-63d2-4789-a4b9-089081dca4c0", "category": "outage", "importance": 5, "sid": "outage", "topic": "오프타스 장애"}, {"title": "\"한숨 돌린 中 광모듈\"… 美 FCC 장비 승인 개정서 '데이터센터 광트랜...", "summary": "미국 FCC가 커버드 리스트 장비 승인 개정안을 최종 승인하면서 화웨이와 ZTE 등 블랙리스트 규제 대상 기업의 데이터센터 광트랜시버 등이 영향을 받게 되었다. 이번 조치는 글로벌 통신장비 공급망과 관련 기업 주가 반등에 직접적인 파장을 미치고 있다.", "source": "g-enews.com", "date": "2026-09-13 06:06", "url": "https://www.g-enews.com/view.php?ud=2026091300083842940c8c1c064d_1", "category": "policy", "importance": 5, "sid": "policy", "topic": "미국fcc 통신장비규제"}, {"title": "Deutsche Telekom's Balancing Act: Elliott's US Push, a Four-Way Satellite Play, and a Char", "summary": "애드호크뉴스에 따르면 도이치텔레콤은 엘리엇의 미국 시장 진출 압박, 위성통신 사업 전개 등 복잡한 경영 과제 속에서 균형을 잡기 위한 전략을 추진하고 있다. 유럽 대형 통신사의 글로벌 투자 및 파트너십 전략 변화를 보여준다.", "source": "ad-hoc-news.de", "date": "2026-09-13 23:50", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/deutsche-telekom-s-balancing-act-elliott-s-us-push-a-four-way-satellite/70095710", "category": "strategy", "importance": 4, "sid": "carrier", "topic": "도이치텔레콤 전략 재편"}, {"title": "Charter Stock Outlook: Can the $34.5B Cox Merger Help CHTR Recover Before Earnings? - Trad", "summary": "미국 케이블 및 브로드밴드 통신사인 차터 커뮤니케이션즈가 34.5빌리언 달러 규모의 콕스(Cox) 인수합병을 추진하며 실적 반등을 모색하고 있습니다. 북미 유선 통신 시장의 대형 M&A 진행 상황을 다룹니다.", "source": "TradingKey", "date": "2026-09-13 23:29", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/261998863-charter-stock-outlook-cox-merger-chtr-before-earnings-tradingkey", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터 커뮤니케이션즈 345억달러 콕스 인수 전망"}, {"title": "[리포트랩] 2027년 통신장비 슈퍼사이클 전망…RFHIC·KMW 주목 : 네이버 블로그 - Naver Blog", "summary": "2027년 글로벌 통신장비 시장의 슈퍼사이클 진입이 전망되면서 국내 부품사인 RFHIC와 KMW가 주목받고 있다. 통신사들의 투자가 재개되면 장비 및 부품 공급사들의 실적 개선으로 이어질 것으로 보인다. 대형 통신장비 교체 주기가 도래함에 따라 국내외 밸류체인의 수혜가 기대된다. 시장의 긍정적인 시황 전망을 담은 증권가 리포트다.", "source": "Naver Blog", "date": "2026-09-13 22:48", "url": "https://blog.naver.com/PostView.naver?blogId=dealsite&logNo=224410517787&redirect=Dlog", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "rfhic 수주"}, {"title": "SpaceX Stock Breaks Out 7% as Charter Mobile Talks and $4.3B Nasdaq-100 Buying Fuel Rally ", "summary": "스페이스X가 차터 모바일과의 협상 및 나스닥-100 대규모 매수세에 힘입어 주가가 7% 급등했다. 위성 사업자와 케이블 통신사 간의 협력 가능성을 시사하는 대형 이벤트이다.", "source": "TradingKey", "date": "2026-09-13 22:18", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262000742-spacex-stock-charter-mobile-nasdaq-100-breakout-tradingkey", "category": "contract", "importance": 4, "sid": "carrier", "topic": "스페이스x 차터 모바일협상"}, {"title": "Ericsson says Ghana’s 5G rollout could support next phase of digital growth - Tech Review ", "summary": "에릭슨이 가나의 5G 네트워크 상용화가 디지털 경제 성장의 다음 단계를 강력하게 지원할 것이라고 밝혔습니다. 아프리카 시장에서 에릭슨의 장비 공급과 기술 협력 전략을 보여줍니다. 디지털 인프라 확충에 기여하는 행보입니다.", "source": "Tech Review Africa", "date": "2026-09-13 21:31", "url": "https://techreviewafrica.com/news/7176/ericsson-says-ghanas-5g-rollout-could-support-next-phase-of-digital-growth", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 가나 5g 상용화 지원"}, {"title": "US EXIM lends Africell $100 million to counter Huawei - Billionaires.Africa", "summary": "미국 수출입은행이 아프리카 통신사 아프리셀에 1억 달러의 대출을 지원하기로 결정했다. 이는 아프리카 시장에서 5G 점유율 52%를 차지하고 있는 화웨이의 영향력을 견제하기 위한 조치다. 미국의 자금 지원은 아프리카 내 친서구 통신망 확장을 목표로 하고 있다. 이를 통해 글로벌 통신장비 시장에서 미·중 간의 패권 경쟁이 더욱 격화될 전망이다.", "source": "Billionaires.Africa", "date": "2026-09-13 20:50", "url": "https://www.billionaires.africa/2026/09/13/lebanese-telecoms-tycoon-ziad-dallouls-africell-gets-100-million-from-washington-to-counter-huawei-in-africa/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "화웨이 아프리카 수주"}, {"title": "人が密集しても通信はサクサク！ドコモの世界初「次世代・基地局」が本格稼働、スタジアムや都市部へ拡大スタート - DXマガジン", "summary": "NTT도코모가 밀집 지역과 스타디움 등에서 트래픽을 원활하게 처리할 수 있는 세계 최초의 차세대 기지국 가동을 본격화했다. 대규모 트래픽 분산과 통신 품질 향상을 위한 신형 기지국 인프라가 실가동에 돌입했다. 통신사의 네트워크 고도화 투자와 차세대 기지국 도입 성과를 보여주는 대목이다. 향후 장비 수요 확대로 이어질 수 있다.", "source": "DXマガジン", "date": "2026-09-13 20:32", "url": "https://dxmagazine.jp/news/2650ko135/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 기술"}, {"title": "人が密集しても通信はサクサク！ドコモの世界初「次世代・基地局」が本格稼働、スタジアムや都市部へ拡大スタート - dxmagazine.jp", "summary": "NTT도코모가 세계 최초로 차세대 멀티벤더 기지국을 본격 가동하며 스타디움과 도심 지역으로 확산에 나섰다. 개방형 무선 접속망(Open RAN) 상용화의 진전을 보여준다. 네트워크 장비 공급사 간 협력과 기술 적용 사례로 의미가 크다.", "source": "dxmagazine.jp", "date": "2026-09-13 20:32", "url": "https://dxmagazine.jp/news/2650ko135/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 차세대기지국"}, {"title": "[차이나 급보] 대만 양자 참관기: 반도체를 넘어 양자 산업을 준비하는...", "summary": "브렌던 카 FCC 위원장이 5G, 6G, AI, 인공위성, 양자 컴퓨팅 등 첨단 기술 및 인프라의 중요성을 강조한 대만 양자 산업 참관기이다. 주요국 규제 기관장의 첨단 기술 패권 구상을 보여주는 보도이다. 글로벌 통신 및 장비 시장의 정책 환경을 가늠하는 데 유용하다.", "source": "hellodd.com", "date": "2026-09-13 18:28", "url": "http://www.hellodd.com/news/articleView.html?idxno=113154", "category": "policy", "importance": 4, "sid": "competitor", "topic": "대만 양자 참관기 fcc 장관 언급"}, {"title": "[밀물썰물] 하늘길 와이파이", "summary": "대한항공이 저궤도 위성 사업자 스페이스X의 스타링크 기반 기내 와이파이 서비스를 전면 도입하여 지연 시간을 대폭 줄인 고속 인터넷 서비스를 제공한다. 저궤도 위성통신의 항공 분야 상용화가 본격화되고 있다.", "source": "busan.com", "date": "2026-09-13 18:02", "url": "https://www.busan.com/view/busan/view.php?code=2026091317552916450", "category": "contract", "importance": 4, "sid": "satellite", "topic": "대한항공 스타링크 위성통신"}, {"title": "A Historic Deal Between Apple and Amazon to Boost Satellite Services on the iPhone - iphon", "summary": "애플과 아마존이 아이폰의 위성통신 서비스를 강화하기 위한 역사적인 제휴를 추진한다. 스마트폰과 저궤도 위성 연계 서비스가 한층 고도화될 전망이다.", "source": "iphoneislam.com", "date": "2026-09-13 17:35", "url": "https://iphoneislam.com/language/en/2026/04/a-historic-deal-between-apple-and-amazon-to-boost-satellite-services-on-the-iphone/165317", "category": "contract", "importance": 4, "sid": "satellite", "topic": "애플 아마존 위성 제휴"}, {"title": "KT, 美 팹리스 앰로직과 ‘칩 동맹’…셋톱박스 공급망·AI 협력 확대 - MTN 머니투데이방송", "summary": "KT가 미국 팹리스 기업 앰로직과 미디어 셋톱박스용 칩셋 공급망 강화 및 AI 협력을 위한 업무협약을 체결했다. 이번 협력을 통해 미디어 단말 기술 경쟁력을 높이고 국내 협력사의 해외 수출을 지원한다. AI 기반 셋톱박스 생태계를 확장하고 글로벌 공급망을 다변화하는 전략이다. KT의 미디어 사업 혁신에 중요한 진전이다.", "source": "MTN 머니투데이방송", "date": "2026-09-13 16:47", "url": "https://news.mtn.co.kr/news-detail/2026091316440354205", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 칩셋협력"}, {"title": "KT, 美 앰로직과 미디어칩 공급 MOU…협력사 수출도 지원 - 아시아경제", "summary": "KT가 미국의 앰로직과 미디어 칩셋 공급 계약 및 협력을 체결하여 글로벌 공급망을 강화하고 국내 협력사의 해외 수출을 지원합니다. 미디어 단말 인프라 생태계 확장을 위한 전략적 제휴입니다.", "source": "아시아경제", "date": "2026-09-13 16:46", "url": "https://www.asiae.co.kr/article/2026091316460037331", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 앰로직 칩 동맹"}, {"title": "AI·6G 특허전쟁 판 바뀐다…중국, CIPAC서 ‘IP 대전환’ 선언 - 아산데일리", "summary": "중국이 CIPAC를 통해 IP 대전환을 선언하며 AI와 6G 분야 특허 경쟁에서 주도권 확보에 나섰다.", "source": "아산데일리", "date": "2026-09-13 16:37", "url": "https://asandaily.kr/View.aspx?No=4224677", "category": "policy", "importance": 4, "sid": "satellite", "topic": "중국 ai 6g 특허 전략"}, {"title": "대교 이어 목화·시범까지 … 여의도 래미안 벨트", "summary": "삼성물산 건설부문이 여의도 목화아파트 재건축 사업 시공사로 최종 선정되었습니다. 지난해 대교아파트에 이어 목화아파트까지 수주하며 여의도 일대에 래미안 벨트를 구축하고 있습니다.", "source": "매일경제 IT", "date": "2026-09-13 16:30", "url": "https://www.mk.co.kr/news/realestate/12151399", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성물산 여의도 목화 수주"}, {"title": "‘Y’ 형상 외관 설계 적용…삼성물산, 5122억 규모 여의도 목화아파트 재건축 수주", "summary": "삼성물산 건설부문이 5122억 규모의 여의도 목화아파트 재건축 사업을 수주하여 래미안 와이니티로 명명하고 한강 조망 특화 설계를 추진합니다.", "source": "매일경제 IT", "date": "2026-09-13 16:05", "url": "https://www.mk.co.kr/news/realestate/12151391", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성물산 래미안 와이니티 수주"}, {"title": "韓 휴머노이드, 美 수출길 막혔다…“정부, 특단의 대책 서둘러야”", "summary": "미국 연방통신위원회(FCC)가 외국산 휴머노이드 및 자율주행로봇 수입 규제를 시행함에 따라 국내 로봇 기업들의 대미 수출길에 비상이 걸렸다. 신규 승인 미필 시 미국 내 유통과 판매가 금지되는 등 타격이 예상되어 정부 차원의 대책이 시급하다는 지적이다.", "source": "전자신문", "date": "2026-09-13 16:00", "url": "https://www.etnews.com/20260911000247", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 로봇규제"}, {"title": "ASTS Stock Jumps Overnight: Retail Eyes Potential Win As Japan's $1B 'Starlink' Award Near", "summary": "AST 스페이스모바일(AST SpaceMobile)의 주가가 일본의 10억 달러 규모 스타링크 경쟁 계약(라쿠텐 연계 등) 임박 소식에 급등했다. 저궤도 위성 직접 통신(Direct-to-Cell) 분야의 대형 국가별 계약 진행 상황을 보여준다. 글로벌 위성통신 시장의 핵심 수주전 동향이다.", "source": "Stocktwits", "date": "2026-09-13 15:44", "url": "https://stocktwits.com/news-articles/markets/equity/asts-retail-eyes-win-japans-1b-starlink-award/cZKf4wOR7di", "category": "contract", "importance": 4, "sid": "satellite", "topic": "ast 스페이스모바일 일본 수주"}, {"title": "Amazon, AT&T Join Forces To Challenge SpaceX's Satellite Dominance - Aero-News.net", "summary": "아마존과 AT&T가 손잡고 스페이스X의 위성 통신 독점에 도전한다. 기업용 위성 브로드밴드 확장을 위한 양사의 협력으로, 위성통신 및 위성-지상 통합 서비스 시장 구도에 큰 변화를 예고한다.", "source": "Aero-News.net", "date": "2026-09-13 15:36", "url": "https://www.aero-news.net/index.cfm?do=main.textpost&id=245D7BFA-024C-403F-955A-2EAAC07012B7", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아마존 at&t 위성"}, {"title": "앤트로픽 \"AI 개발 속도 조절해야\"...머스크·알트먼도 공감", "summary": "앤트로픽의 다리오 아모데이 CEO가 최첨단 AI 모델의 역량 개선 속도를 늦추자고 제안했다. 시장 주도권을 다투는 오픈AI의 샘 알트먼과 일론 머스크도 여기에 공감하면서 AI 안전 논의가 새 국면을 맞았다. AI 업계의 기술 개발 속도 조절과 안전성 확보 방안을 다룬다.", "source": "ZDNet Korea", "date": "2026-09-13 15:30", "url": "https://zdnet.co.kr/view/?no=20260913143726", "category": "tech", "importance": 4, "sid": "competitor", "topic": "앤트로픽 ai"}, {"title": "대한항공, 기내 무료 와이파이 서비스 개시", "summary": "대한항공이 스페이스X의 스타링크 기반 기내 와이파이 서비스를 전 좌석을 대상으로 15일부터 전격 개시한다고 공식 발표했습니다. 음성·영상 통화와 라이브 방송 등 고속 인터넷을 제공하며, 한진그룹 항공사들의 본격적인 저궤도 위성 통신 도입을 알리는 대형 계약입니다.", "source": "kgnews.co.kr", "date": "2026-09-13 15:08", "url": "https://www.kgnews.co.kr/news/article.html?no=911290", "category": "contract", "importance": 4, "sid": "satellite", "topic": "대한항공 스타링크 기내 와이파이 도입"}, {"title": "포스텍·LB세미콘, 140GHz 위상배열 송수신 모듈 세계 첫 개발 - hidomin.com", "summary": "포스텍과 LB세미콘이 140GHz 위상배열 송수신 모듈을 세계 최초로 개발했다. 차세대 6G 통신 상용화를 위한 핵심 원천 기술을 확보했다는 점에서 의미가 크다.", "source": "hidomin.com", "date": "2026-09-13 15:06", "url": "https://www.hidomin.com/news/articleView.html?idxno=720849", "category": "tech", "importance": 4, "sid": "satellite", "topic": "포스텍 위상배열 모듈 개발"}, {"title": "아시아나항공, 15일 A350·A330 부터 스타링크 기내 와이파이 무료 제공", "summary": "아시아나항공이 오는 15일부터 일부 항공편(A350·A330)을 시작으로 스타링크 기반의 무료 기내 와이파이 서비스를 제공합니다. 한진그룹 5개 항공사의 스타링크 도입 결정에 따른 후속 조치로, 항공기 내 위성통신 서비스 상용화가 빠르게 확산되고 있습니다.", "source": "thefirstmedia.net", "date": "2026-09-13 15:02", "url": "http://www.thefirstmedia.net/news/articleView.html?idxno=208439", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아시아나항공 스타링크 기내 와이파이"}, {"title": "과거 경매가에 묶인 주파수 재할당…\"현재 가치 반영하는 별도 기준 필요\" - 뉴시스", "summary": "뉴시스 보도에 따르면 과거 경매가에 묶인 주파수 재할당 대가 산정 방식에 대해 현재 가치를 반영하는 별도 기준이 필요하다는 지적이 제기됐다. 통신사의 설비 투자 부담을 완화하고 차세대 네트워크 전환을 촉진하기 위한 제도 개선 요구가 커지고 있다.", "source": "뉴시스", "date": "2026-09-13 14:56", "url": "https://mobile.newsis.com/view_amp.html?ar_id=NISX20260913_0003787296", "category": "policy", "importance": 4, "sid": "policy", "topic": "주파수 재할당 제도 개편"}, {"title": "KT ‘모두의 AI’ 승부수 띄운다…6000만 서비스에 AI 장착 - munhwa.com", "summary": "KT가 6000만 서비스에 AI를 장착하는 '모두의 AI' 전략을 본격 추진합니다. 생활 속 플랫폼과 연동하여 AI 대중화를 이끌겠다는 구상입니다. 통신 본업을 넘어 AI 서비스 생태계 주도권을 잡기 위한 행보입니다.", "source": "munhwa.com", "date": "2026-09-13 14:42", "url": "https://www.munhwa.com/article/11616598", "category": "other", "importance": 4, "sid": "carrier", "topic": "kt 모두의ai"}, {"title": "위성통신 시장 커지자…주파수 확보 경쟁도 본격화 - dt.co.kr", "summary": "위성통신 시장이 급성장함에 따라 핵심 자원인 주파수 확보를 위한 글로벌 통신사 및 위성 사업자 간 경쟁이 본격화되고 있다. 한정된 주파수 대역을 선점하기 위한 규제 기관의 정책 조율과 업계의 로비가 치열해지고 있다. 위성 산업 성장의 핵심 병목 구간으로 꼽힌다.", "source": "dt.co.kr", "date": "2026-09-13 14:11", "url": "https://www.dt.co.kr/article/12083072", "category": "policy", "importance": 4, "sid": "policy", "topic": "위성통신 주파수경쟁"}, {"title": "쓰던 앱에 AI 버튼 ‘쏙’…KT, 6000만 접점 공략 - v.daum.net", "summary": "KT가 일상 앱에 AI 버튼을 탑재하여 6,000만 명의 고객 접점을 공략하는 '모두의 AI' 전략을 발표했다. 생활 밀착형 AI 서비스 확대를 위한 통신사의 혁신 행보이다.", "source": "v.daum.net", "date": "2026-09-13 14:00", "url": "https://v.daum.net/v/20260913140000910?f=p", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt ai 전략"}, {"title": "SKT·KT·LG유플러스 '아이폰18' 전초전...야구·축구·로밍 '총동원' - 테크M", "summary": "SK텔레콤, KT, LG유플러스 등 국내 이동통신 3사가 차세대 '아이폰18' 출시를 앞두고 야구, 축구, 로밍 등 다양한 콘텐츠와 마케팅을 총동원해 전초전 경쟁을 벌이고 있습니다. 신형 플래그십 단말 가입자 유치를 위한 통신사들의 마케팅 경쟁이 본격화되고 있습니다. 통신사들의 단말기 출시 사전 마케팅 및 가입자 확보 전략을 보여줍니다.", "source": "테크M", "date": "2026-09-13 13:24", "url": "https://www.techm.kr/news/articleView.html?idxno=155183", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt 아이폰18"}, {"title": "India joins 24 nations in global 6G push, endorses call for secure and resilient networks ", "summary": "인도가 안전하고 회복력 있는 차세대 네트워크 구축을 위한 글로벌 6G 추진 연합의 24개국에 합류했다. 국가 간 표준화 협력과 보안 주도권 확보를 위한 공조를 강화한다.", "source": "organiser.org", "date": "2026-09-13 13:02", "url": "https://organiser.org/2026/09/13/380298/bharat/india-joins-24-nations-in-global-6g-push-endorses-call-for-secure-and-resilient-networks/", "category": "policy", "importance": 4, "sid": "satellite", "topic": "인도 글로벌 6g 동참"}, {"title": "애플 아이폰17, 출시 첫해 230조 역대 최대 매출", "summary": "애플의 아이폰17 시리즈가 출시 첫해 역대 최대 매출을 기록하며 삼성전자 MX 및 네트워크 사업부 연매출의 1.8배에 달하는 실적을 거두었다. 중국 시장에서의 판매량 증가가 주효했다. 글로벌 경쟁사의 플래그십 성과를 보여준다.", "source": "srtimes.kr", "date": "2026-09-13 12:12", "url": "http://www.srtimes.kr/news/articleView.html?idxno=212263", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "애플 아이폰17 매출"}, {"title": "삼성디스플레이, 갤S27 프로·울트라에 최신 M16 OLED 공급", "summary": "삼성전자가 차기 플래그십 스마트폰 라인업에 삼성디스플레이의 최신 M16 유기발광다이오드 소재를 전격 적용하기로 했다. 기본 및 고급형 전반에 걸쳐 재료 세트에 대대적인 변화를 줄 예정이다. 부품 공급망 및 하드웨어 스펙 관련 보도다.", "source": "전자신문", "date": "2026-09-13 12:00", "url": "https://www.etnews.com/20260911000205", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 디스플레이"}, {"title": "オプタスの通信障害が3州に影響、豪政府が通信網の強靱化へ - finance.biggo.jp", "summary": "호주 옵타스(Optus)의 대규모 통신 장애가 3개 주에 걸쳐 확산되면서 수많은 가입자와 기업이 심각한 서비스 중단 피해를 입었습니다. 이에 호주 정부는 국가 통신망의 강인함과 회복력을 높이기 위한 대책마련에 착수했습니다. 주요 통신사의 대규모 네트워크 마비 사고로 인해 국가적 차원의 규제 및 인프라 보안 논의로 이어졌습니다. 통신망 장애의 심각성과 복구 과정, 정부의 대응을 보여주는 중대 사건입니다.", "source": "finance.biggo.jp", "date": "2026-09-13 11:55", "url": "https://finance.biggo.jp/news/18739aa4-63d2-4789-a4b9-089081dca4c0", "category": "outage", "importance": 4, "sid": "outage", "topic": "옵타스 장애"}, {"title": "[KCSCON 2026] 최종보 LG유플러스 보안사업담당 \" 통신 망과 보안을 하나로...", "summary": "LG유플러스가 보안 컨퍼런스에서 통신사가 가진 인프라와 전국 단위 장애 대응, 24시간 관제 경험에 보안을 결합하는 전략을 발표했다. 통신 네트워크와 보안을 하나로 묶어 기업 고객에게 차별화된 인프라를 제공한다. 통신사의 B2B 네트워크 보안 서비스 강화 전략을 보여준다. 통신장비 운용 및 관제 역량의 중요성을 강조한다.", "source": "dailysecu.com", "date": "2026-09-13 11:42", "url": "https://www.dailysecu.com/news/articleView.html?idxno=208412", "category": "strategy", "importance": 4, "sid": "carrier", "topic": "lg유플러스 통신망 보안 결합"}, {"title": "[KCSCON 2026] 최종보 LG유플러스 보안사업담당 “통신망과 보안을 하나로”…AI·SASE·아이덴티티 아우르는 통합 보안 전략 공개 - 데일리시큐", "summary": "LG유플러스 최종보 보안사업담당이 보안 컨퍼런스에서 AI, SASE, 아이덴티티를 아우르는 통합 보안 전략과 '통신망과 보안의 융합' 비전을 공개했다. 통신 사업자의 네트워크 보안 고도화 전략을 보여준다.", "source": "데일리시큐", "date": "2026-09-13 11:41", "url": "https://www.dailysecu.com/news/articleView.html?idxno=208412", "category": "tech", "importance": 4, "sid": "carrier", "topic": "lg유플러스 보안 전략"}, {"title": "ノキアがNTTドコモに納めた「MantaRay SON」を紹介――これで長年、苦しんできたネットワーク品質の改善に期待：石川温のスマホ業界新聞 - ITmedia Mobile -", "summary": "노키아가 NTT도코모에 공급한 지능형 네트워크 관리 솔루션 'MantaRay SON'을 소개하며, 오랜 기간 도코모가 겪어온 네트워크 품질 문제 개선에 기여할 것으로 기대된다. 개방형 무선접속망 생태계에서의 노키아 기술력을 입증하는 사례다.", "source": "ITmedia", "date": "2026-09-13 11:00", "url": "https://www.itmedia.co.jp/mobile/amp/2609/13/news011.html", "category": "contract", "importance": 4, "sid": "competitor", "topic": "도코모 노키아 오픈랜 상용화"}, {"title": "KT, 세계 최대 미디어 전시회 IBC 2026 참가 - 연합뉴스", "summary": "KT가 세계 최대 미디어 전시회 'IBC 2026'에 참가해 글로벌 미디어 기술을 선보인다. 이번 전시회를 통해 국내 협력사들의 해외 판로 개척과 글로벌 미디어 시장 진출을 지원할 계획이다. KT의 미디어 경쟁력을 알리고 파트너십을 확장하는 무대가 될 전망이다. 글로벌 미디어 생태계 내 입지를 다지는 행보로 평가된다.", "source": "연합뉴스", "date": "2026-09-13 10:59", "url": "https://www.yna.co.kr/amp/view/PYH20260913035500013", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 글로벌전시"}, {"title": "T-Mobile completed acquisition of most U.S. Cellular wireless assets in 2025 - eciks.org", "summary": "티모바일이 2025년에 US셀룰러의 무선 자산 인수를 대부분 완료했다. 이번 인수를 통해 티모바일은 가입자 기반을 확충하고 네트워크 커버리지를 대폭 강화하게 됐다. 미국 이동통신 시장의 경쟁 구도 재편과 주파수 및 망 확장에 직결되는 대형 딜이다. 통신사 사업 전략 측면에서 중요도가 높다.", "source": "eciks.org", "date": "2026-09-13 10:55", "url": "https://eciks.org/26445-t-mobile-uscellular-acquisition", "category": "contract", "importance": 4, "sid": "carrier", "topic": "티모바일 인수"}, {"title": "KT, 앰로직과 미디어 단말 칩셋 공급망 협력 - 디지털데일리", "summary": "KT가 앰로직과 협력하여 미디어 단말 칩셋 공급망을 다변화하고 협력사 수출을 지원합니다. 글로벌 파트너십 구축 소식입니다.", "source": "디지털데일리", "date": "2026-09-13 10:17", "url": "https://www.ddaily.co.kr/page/view/2026091309294001690", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 앰로직 미디어칩 mou"}, {"title": "KT, 세계 최대 미디어 전시회 참가…미디어 단말 칩셋 공급 MOU - 머니투데이 - 머니투데이", "summary": "KT가 세계 최대 미디어 전시회에 참가하며 앰로직과의 미디어 단말 칩셋 공급 MOU를 체결했습니다. 글로벌 무대에서 하드웨어 파트너십을 공고히 하고 사업 영역을 넓힙니다. 미디어 인프라 경쟁력을 강화합니다.", "source": "머니투데이", "date": "2026-09-13 10:00", "url": "https://www.mt.co.kr/amp/tech/2026/09/13/2026091309540484668", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 앰로직협력"}, {"title": "「iPhone Duo」でAppleの“折りたたみスマホシェア”は全世界5割超に？ 激変するフォルダブルスマホ市場", "summary": "애플의 폴더블 스마트폰 진입이 전 세계 폴더블폰 시장 점유율을 재편하고 사용자 저변을 대폭 넓히는 계기가 될 것으로 전망된다. 경쟁사들의 견제 속에서 전체 시장 규모 자체가 급성장하는 변곡점이 될 수 있다. 글로벌 모바일 시장의 판도 변화에 이목이 쏠린다.", "source": "ITmedia Mobile", "date": "2026-09-13 10:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/13/news004.html", "category": "strategy", "importance": 4, "sid": "competitor", "topic": "애플 폴더블폰"}, {"title": "Vodafone Idea $3.5 Billion Loan: SBI-Led Consortium Approves Funding - businessviewpointma", "summary": "SBI 주도 컨소시엄이 보다폰 아이디어를 위한 35억 달러 규모의 펀딩을 승인했습니다. 인도 통신 시장의 자금 조달 및 재정 개선 조치입니다.", "source": "businessviewpointmagazine.com", "date": "2026-09-13 09:30", "url": "https://businessviewpointmagazine.com/vodafone-idea-3-5-billion-loan/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰아이디어 투자"}, {"title": "KT, 美팹리스 앰로직과 미디어단말용 칩셋 공급 MOU - 연합인포맥스", "summary": "KT가 미국의 팹리스 기업 앰로직과 미디어 단말용 칩셋 공급을 위한 MOU를 체결했습니다. 미디어 단말 공급망 강화 및 협력사와의 글로벌 진출을 추진합니다.", "source": "연합인포맥스", "date": "2026-09-13 09:12", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4434578", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt 미디어 칩셋 협력"}, {"title": "China puts 6G commercial services into its 2026-2030 telecoms plan - tech-ish.com", "summary": "중국 정부가 2026~2030년 통신 계획에 6G 상용화 서비스를 공식 포함시키며 국가적 차원의 기술 선점에 나섰습니다.", "source": "tech-ish.com", "date": "2026-09-13 09:07", "url": "https://tech-ish.com/2026/09/13/china-puts-6g-commercial-services-into-its-2026-2030-telecoms-plan/", "category": "policy", "importance": 4, "sid": "policy", "topic": "중국 6g정책"}, {"title": "KT, ‘이음 인사이드’로 대국민 AI 연결…“계정·채널 장벽 낮춰 사각...", "summary": "KT가 과기정통부 '모두의 AI' 사업 선정에 따라 공공·교육·금융·쇼핑 등의 일상 서비스를 하나의 AI 경험으로 묶는 대국민 AI 연결 서비스 '이음 인사이드' 전략을 발표했습니다. 통신사의 AI 플랫폼 확장 및 서비스 도입을 다룹니다.", "source": "economist.co.kr", "date": "2026-09-13 09:01", "url": "https://economist.co.kr/article/view/ecn202609110035", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 이음 인사이드 ai"}, {"title": "\"앱 설치 없이 포털·쇼핑서 바로 쓴다\"…KT, 대국민 AI '이음' 승부수 - 지디넷코리아", "summary": "KT가 앱 설치 없이 포털과 쇼핑에서 바로 사용할 수 있는 대국민 AI 서비스 '이음'을 공개했다. 국내 통신사의 개방형 AI 생태계 확장 전략이다.", "source": "지디넷코리아", "date": "2026-09-13 09:00", "url": "https://zdnet.co.kr/view/?no=20260911184448", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt ai 이음 생태계 전략"}, {"title": "“GPT처럼 답만 하지 않는다”…KT ‘모두의 AI’, 생활 속 실행 노린다(종합) - 디지털데일리", "summary": "KT가 단순한 답변을 넘어 생활 속 실행을 노리는 '모두의 AI' 전략을 종합 발표했습니다. 검색을 넘어 실제 행동과 결제까지 이어지는 실생활 밀착형 AI를 지향합니다. 차별화된 AI 서비스로 승부수를 던졌습니다.", "source": "디지털데일리", "date": "2026-09-13 09:00", "url": "https://www.ddaily.co.kr/page/view/2026091217444935706", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt ai서비스"}, {"title": "실행형 AI VS 연결형 AI…'모두의 AI' 선점 나선 SKT·KT - newstomato.com", "summary": "SKT와 KT가 각각 실행형 AI와 연결형 AI를 내세우며 일상 속 AI 생태계 선점을 위한 경쟁에 돌입했다.", "source": "newstomato.com", "date": "2026-09-13 09:00", "url": "http://www.newstomato.com/ReadNews.aspx?no=1313401", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai전략"}, {"title": "AI 데이터센터 투자 가속도...반도체·부품 매출 182% 급증", "summary": "시장조사업체 델오로에 따르면 올해 2분기 전 세계 데이터센터 서버와 스토리지용 IT 반도체 및 부품 매출이 AI 가속 서버 구축 확산에 힘입어 1년 만에 3배 가까이 급증했다. 메모리 가격 상승과 함께 고속 네트워크 부품 수요가 급증하면서 인프라 공급망 전반의 성장을 견인하고 있음을 보여준다. 글로벌 AI 인프라 투자 붐을 증명하는 주요 시장 지표다.", "source": "ZDNet Korea", "date": "2026-09-13 08:50", "url": "https://zdnet.co.kr/view/?no=20260913082224", "category": "contract", "importance": 4, "sid": "competitor", "topic": "ai데이터센터 반도체"}, {"title": "China invents new science that threatens Western tech dominance - RBC-Ukraine", "summary": "중국이 서구권의 기술 독점에 위협이 되는 새로운 과학 기술을 발명하며 기술 패권 경쟁이 심화되고 있다. 통신 및 첨단 기술 분야의 지형 변화를 다룬다.", "source": "RBC-Ukraine", "date": "2026-09-13 08:50", "url": "https://newsukraine.rbc.ua/news/china-invents-new-science-that-threatens-1789253699.html", "category": "tech", "importance": 4, "sid": "satellite", "topic": "중국 서구 기술 패권 위협 과학 기술"}, {"title": "Debt Reduction Meets Digital Ambition: Inside The Structure Of Jio Platforms’ Mega IPO - i", "summary": "지오 플랫폼스의 대규모 IPO 구조를 분석하며 부채 감축과 디지털 사업 확장을 위한 전략을 조명했습니다. 인도 최대 통신사의 상장 행보는 글로벌 통신 시장의 주목을 받고 있습니다.", "source": "inventiva.co.in", "date": "2026-09-13 08:44", "url": "https://www.inventiva.co.in/stories/debt-reduction-meets-digital-ambition-inside-the-structure-of-jio-platforms-mega-ipo/", "category": "other", "importance": 4, "sid": "carrier", "topic": "릴라이언스지오 ipo 전략"}, {"title": "出そろった「iPhon -and-samsung-trialled-isac-during-the-world-cup", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 삼성 isac 테스트"}, {"title": "Verizon stirs Samsung AI-powered sensing tech into 6G sneak peek - SDxCentral", "summary": "버라이즌이 삼성전자의 AI 기반 감지 기술을 6G 네트워크에 통합하는 테스트를 진행하며 차세대 기술 선점에 나섰다. 통신 인프라를 센서로 활용하는 혁신 기술의 상용화 가능성을 높이고 있다. 6G 표준 경쟁에서 양사의 협력이 주목된다.", "source": "SDxCentral", "date": "2026-09-14 22:26", "url": "https://www.sdxcentral.com/news/verizon-stirs-samsung-ai-powered-sensing-tech-into-6g-sneak-peek/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 삼성 ai 감지 기술"}, {"title": "Verizon’s 6G Innovation Forum lands AWS, Cisco, Intel, and Nvidia as new members - cryptob", "summary": "버라이즌의 6G 혁신 포럼에 AWS, 시스코, 인텔, 엔비디아 등 글로벌 빅테크 기업들이 신규 멤버로 합류했다. 차세대 통신 기술 표준과 인프라 연구를 위한 강력한 연합체가 구성되었다.", "source": "cryptobriefing.com", "date": "2026-09-14 22:20", "url": "https://cryptobriefing.com/verizon-6g-forum-aws-cisco-intel-nvidia/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 혁신 포럼"}, {"title": "Nex-Tech Wireless Signs Ericsson for Four-Year 5G Standalone Rollout - Securities.io", "summary": "넥스테크 와이어리스가 에릭슨과 4년 계약을 맺고 5G 독립형(SA) 네트워크 구축을 본격 추진한다. 농촌 지역 망 현대화를 위한 대규모 장비 공급 계약으로 에릭슨의 북미 입지를 다지는 계기다.", "source": "Securities.io", "date": "2026-09-14 22:17", "url": "https://www.securities.io/nex-tech-wireless-signs-ericsson-for-four-year-5g-standalone-rollout/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 넥스테크와이어리스 계약"}, {"title": "ZTE Unveils an End-to-End AI Video Solution to Fully Empower Operators' Video Services - T", "summary": "중흥(ZTE)이 통신사의 비디오 서비스를 지원하기 위한 엔드투엔드 AI 비디오 솔루션을 글로벌 시장에 선보였다.", "source": "Telecompaper", "date": "2026-09-14 22:17", "url": "https://www.telecompaper.com/partner-content/zte-unveils-an-end-to-end-ai-video-solution-to-fully-empower-operators-video-services--1582627", "category": "tech", "importance": 4, "sid": "competitor", "topic": "중흥 ai 비디오 솔루션 공개"}, {"title": "Samsung comes out against 6G overhaul for sensing", "summary": "삼성전자가 미국 버라이즌과 5G 기반의 ISAC(통신·센싱 융합) 기술을 시연했습니다. 삼성전자는 6G 도입을 위해 기존 통신망을 완전히 재설계해야 한다는 주장에 대해 신중한 입장을 보였습니다. 이번 시연은 5G 인프라를 활용한 기술 고도화 가능성을 타진하는 차원입니다. 글로벌 시장에서 버라이즌과의 협력을 통해 기술 경쟁력을 입증하고 있습니다.", "source": "Light Reading", "date": "2026-09-14 22:10", "url": "https://www.lightreading.com/5g/samsung-comes-out-against-6g-overhaul-for-sensing", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 협력"}, {"title": "Verizon and Samsung ISAC Crowd-density detection trial at Dallas Fair Park - YouTube", "summary": "유튜브를 통해 공개된 삼성전자와 버라이즌의 댈러스 페어파크 ISAC 군중 밀집도 감지 실증 영상이다. 통신 기지국이 실시간으로 인파의 움직임을 분석해내는 과정을 시각적으로 보여준다. AI 기반 6G 핵심 기술의 실효성을 대외적으로 홍보하는 자료다. 양사의 기술 협력 성과를 직관적으로 전달한다.", "source": "YouTube", "date": "2026-09-14 22:10", "url": "https://youtu.be/t3mn3xWd_DU?si=jr3IgoqOdYiz5XKG", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 isac 실증"}, {"title": "ZTE and Antel complete LatAm's first symmetric 50G PON trial - Telecompaper", "summary": "ZTE가 아르헨티나 안텔(Antel)과 함께 라틴아메리카 최초로 대칭형 50G PON 기술 시험을 성공적으로 완료함. 차세대 광통신 기술인 50G PON의 상용화 가능성을 확인한 사례임. ZTE는 글로벌 광대역 통신 시장에서 기술 리더십을 확보하려는 전략을 추진 중임.", "source": "Telecompaper", "date": "2026-09-14 22:05", "url": "https://www.telecompaper.com/news/zte-and-antel-complete-latams-first-symmetric-50g-pon-trial--1582625", "category": "tech", "importance": 4, "sid": "competitor", "topic": "zte 수주"}, {"title": "Nex-Tech Wireless selects Ericsson in four-year deal to modernize rural Kansas network and", "summary": "넥스-테크 와이어리스가 미국 캔자스주 농촌 지역의 네트워크 현대화를 위해 에릭슨을 공급사로 선정함. 4년 계약을 통해 해당 지역의 모바일 서비스를 고도화할 예정임. 에릭슨은 이번 수주를 통해 미국 내 농촌 지역 통신 인프라 시장에서의 입지를 강화함.", "source": "PR Newswire", "date": "2026-09-14 22:00", "url": "https://www.prnewswire.com/news-releases/nex-tech-wireless-selects-ericsson-in-four-year-deal-to-modernize-rural-kansas-network-and-launch-5g-standalone-302876013.html", "category": "contract", "importanc
