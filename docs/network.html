<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네트워크 뉴스 모니터링</title>
<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hd-top">
    <h1>Samsung Network <span>뉴스 모니터링</span></h1>
    <button class="noti-btn" id="notiBtn" onclick="toggleNoti()">🔕 알림 꺼짐</button>
  </div>
  <div class="hd-meta" id="lastUpdate">news_data.js 없음</div>
  <div class="tabbar" id="tabbar"></div>
</header>
<main id="content"></main>

ce": 3, "wl": false, "topic": ""}, {"title": "AT&T outages on Monday. AT&T outage map. AT&T outage near me - Asbury Park Press", "summary": "", "source": "Asbury Park Press", "date": "2026-09-08 02:07", "url": "https://www.app.com/story/news/2026/09/07/is-there-an-att-outage-in-my-area-att-outage-houston/91650097007/", "category": "outage", "importance": 3, "wl": false, "topic": ""}, {"title": "AT&T Resolves 911 Outage Affecting Franklin County Emergency Calls - SuaraGarut.ID", "summary": "AT&T가 프랭클린 카운티의 긴급 구조요청에 영향을 미쳤던 911 서비스 장애 문제를 완전히 해결했다. 긴급 통신망 중단으로 인해 발생했던 지역 사회의 불안이 해소되었다. 통신 장애 복구 작업이 신속하게 진행되면서 추가적인 피해를 막을 수 있었다. 통신 서비스의 안정성과 신뢰성 회복에 주력하고 있다.", "source": "SuaraGarut.ID", "date": "2026-09-07 17:59", "url": "https://suaragarut.id/en/att-911-outage-franklin-county", "category": "outage", "importance": 3, "wl": false, "topic": "at&t 911장애"}, {"title": "\"먹통 없는 재난 대응\" 정부·이통3사, 상용망 기반 소방 통신 개선", "summary": "적용 대상은 소방청의 공공 업무에 사용하는 휴대전화, 태블릿PC, 사물인터넷(IoT) 장비 등 법인 명의 무선... KT는 소방청 행정망에 기업전용 5G SA(Standalone)를 도입했다. 5G SA는 기존 LTE망과 연동하는 비단독모드(NSA)와...", "source": "itdaily.kr", "date": "2026-09-07 17:46", "url": "https://www.itdaily.kr/news/articleView.html?idxno=241454", "category": "outage", "importance": 3, "wl": false, "topic": ""}, {"title": "AT&T service disruptions affect thousands in Dallas-Fort Worth area - news.ssbcrack.com", "summary": "", "source": "news.ssbcrack.com", "date": "2026-09-08 10:43", "url": "https://news.ssbcrack.com/att-service-disruptions-affect-thousands-in-dallas-fort-worth-area/", "category": "outage", "importance": 2, "wl": false, "topic": ""}], "satellite": [{"title": "AT&T and Amazon Leo Advance Strategic Fiber-to-Space Alliance to Challenge SpaceX Starlink", "summary": "AT&T와 아마존 레오가 스페이스X의 스타링크에 대항하기 위해 전략적 위성-우주 동맹을 강화한다. 저궤도 위성 기반의 브로드밴드 연결성을 기업 및 원격지로 확장하는 데 초점을 맞추고 있다. 양사는 지상망의 한계를 극복하고 우주 기반 통신 인프라를 선점하기 위해 협력 중이다. 글로벌 위성통신 시장에서 강력한 경쟁 구도를 형성하고 있다.", "source": "satnews.com", "date": "2026-09-09 02:36", "url": "https://satnews.com/2026/09/08/att-and-amazon-leo-advance-strategic-fiber-to-space-alliance-to-challenge-spacex-starlink/", "category": "contract", "importance": 4, "wl": false, "topic": "at&t 아마존"}, {"title": "Digital Communications Commission approves TRAI recommendations on Satcom Spectrum - PGuru", "summary": "인도 디지털통신위원회(DCC)가 TRAI의 위성통신 주파수(Satcom Spectrum) 관련 권고안을 공식 승인했다. 급성장하는 위성 브로드밴드 시장에 발맞추어 주파수 할당 및 규제 틀을 마련하는 중요한 진전이다. 글로벌 위성 사업자들의 인도 시장 진입이 더욱 가속화될 전망이다. 국가 차원의 명확한 규제 확립이 시장 성장의 기틀을 제공한다.", "source": "PGurus", "date": "2026-09-09 00:33", "url": "https://www.pgurus.com/digital-communications-commission-approves-trai-recommendations-on-satcom-spectrum/", "category": "policy", "importance": 4, "wl": false, "topic": "인도 위성통신 정책"}, {"title": "EU telcos close ranks against Starlink in bid for satellite spectrum – report", "summary": "도이치텔레콤, 오렌지, 텔레포니카, 보다폰 등 유럽 주요 통신사들이 위성-디바이스 간 직접통신(D2D)을 위한 EU 모바일 위성 주파수 입찰 참여를 위해 컨소시엄 결성을 논의 중이다. 스페이스X의 스타링크 등 미국 위성 통신 공세에 대응해 유럽 통신사들이 연합 전선을 구축하는 양상이다. 위성 통신 시장의 주도권 경쟁과 유럽 규제 환경 변화를 보여준다. 향후 글로벌 위성 통신 및 6G 서비스 경쟁에 중요한 변수가 될 수 있다.", "source": "Light Reading", "date": "2026-09-09 00:04", "url": "https://www.lightreading.com/satellite/eu-telcos-close-ranks-against-starlink-in-joint-bid-for-satellite-spectrum-report", "category": "contract", "importance": 4, "wl": true, "topic": "도이치텔레콤 위성"}, {"title": "India joins US-led 6G initiative with 25 countries: What new global alliance means for the", "summary": "인도가 25개국이 참여하는 미국 주도의 글로벌 6G 이니셔티브에 가입했다. 다국간 협력 체제를 통해 차세대 무선 통신 기술 표준 수립과 연구개발(R&D)에 공동으로 참여하게 된다. 미래 초고속 통신망 시장의 주도권을 쥐기 위한 국가 간 연대가 강화되고 있다. 6G 상용화 준비 과정에서의 중요한 외교적 성과다.", "source": "The Economic Times", "date": "2026-09-09 00:03", "url": "https://m.economictimes.com/industry/telecom/telecom-news/india-joins-us-led-6g-initiative-with-25-countries-what-new-global-alliance-means-for-the-future-of-internet-and-wireless-connectivity/articleshow/133930349.cms", "category": "tech", "importance": 4, "wl": false, "topic": "인도 6g연합"}, { ew/2026090815132013510", "category": "tech", "importance": 3, "wl": false, "topic": ""}, {"title": "India joins US, 24 countries in global 6G initiative - Free Press Kashmir", "summary": "", "source": "Free Press Kashmir", "date": "2026-09-08 16:39", "url": "https://freepresskashmir.news/2026/09/08/india-joins-us-24-countries-in-global-6g-initiative/amp/", "category": "tech", "importance": 3, "wl": false, "topic": ""}], "competitor": [{"title": "Huawei's SingleRAN rebuilds radio software for AI - Telecoms", "summary": "화웨이가 무선 통신 소프트웨어를 인공지능(AI) 기반으로 재구축하는 'SingleRAN' 기술 혁신을 단행했다. 글로벌 경쟁사의 차세대 장비 솔루션 및 AI 결합 전략 발표로 장비 시장에 미치는 파급효과가 크다.", "source": "Telecoms", "date": "2026-09-07 22:51", "url": "https://www.telecoms.com/telecoms-infrastructure/huawei-s-singleran-rebuilds-radio-software-for-ai", "category": "other", "importance": 5, "wl": false, "topic": "화웨이 싱글랜ai소프트웨어"}, {"title": "Ericsson says telco-grade AI RAN must deliver measurable gains at scale", "summary": "에릭슨의 전략적 RAN 리더십 총괄 가브리엘 포글란더는 RCR테크 텔코 AI 포럼에서 텔코급 AI RAN이 대규모 환경에서 측정 가능한 성과를 반드시 입증해야 한다고 강조했다. AI-RAN이 네트워크 전반에 AI를 내재화하는 광범위한 전환의 교두보 역할을 해야 한다는 설명이다. 글로벌 통신장비 경쟁사가 차세대 무선 접속망(RAN)과 AI의 결합 방향성을 제시한 핵심 발언이다. 삼성전자 네트워크사업부의 AI 기반 6G 및 차세대 네트워크 전략 수립에 시사점을 준다.", "source": "RCR Wireless", "date": "2026-09-09 00:44", "url": "https://rcrwireless.com/20260908/carriers/ericsson-ai-ran", "category": "tech", "importance": 4, "wl": true, "topic": "에릭슨 ai"}, {"title": "China's Huawei Technologies faces racketeering trial in New York - abcnews.com", "summary": "중국 화웨이 테크놀로지가 미국 뉴욕 법원에서 조직범죄 혐의 관련 형사 재판을 받게 되었다. 미중 기술 갈등 속 화웨이의 법적 리스크가 심화되는 중대 사안이다.", "source": "abcnews.com", "date": "2026-09-08 23:43", "url": "https://abcnews.com/Technology/wireStory/chinas-huawei-technologies-faces-racketeering-trial-new-york-136274303", "category": "other", "importance": 4, "wl": false, "topic": "화웨이 뉴욕 조직범죄 재판"}, {"title": "Huawei puts pioneering chip design tech to its first test", "summary": "화웨이의 최신 플래그십 스마트폰 '메이트 XT 2'가 자체 웨이를 완전히 배제하도록 압박하는 강력한 법적 명분으로 작용할 것\"이라고 경고했다....", "source": "g-enews.com", "date": "2026-09-08 08:20", "url": "https://www.g-enews.com/view.php?ud=2026090808165086980c8c1c064d_1", "category": "policy", "importance": 4, "wl": false, "topic": ""}, {"title": "말레이시아, 화웨이 AI칩 도입 검토… 美 수출통제 충돌", "summary": "미국의 강도 높은 제조 장비 수출 제재 속에서도 화웨이는 독자 기술 개발에 매진해 왔다. 화웨이의... 미 정부는 과거 화웨이 5G 통신망 차단과 마찬가지로 중국이 글로벌 AI 인프라를 장악하는 사태를 봉쇄하기 위해...", "source": "g-enews.com", "date": "2026-09-08 05:02", "url": "https://www.g-enews.com/view.php?ud=202609080357483436e7e8286d56_1", "category": "policy", "importance": 4, "wl": false, "topic": ""}, {"title": "3つ折りスマホ「HUAWEI Mate XT 2」発表 のぞき見を防止、Kirin 9050 Pro×AIも搭載 約46万円から", "summary": "화웨이가 세계 최초로 '로직폴딩 타우(τ)' 칩을 탑재해 양산화에 성공한 3단 접이식 스마트폰 'HUAWEI Mate XT 2 ULTIMATE DESIGN'을 발표했다. 양쪽에서 개폐하는 독창적인 3단 폴더블 폼팩터와 기린 9050 프로 및 AI 기능을 탑재했다. 경쟁사의 혁신적인 플래그십 모바일 하드웨어 공개다. 직접적인 네트워크 장비는 아니나 경쟁사의 첨단 칩셋 및 하드웨어 기술력을 보여주는 주요 발표다.", "source": "ITmedia Mobile", "date": "2026-09-08 00:16", "url": "https://www.itmedia.co.jp/mobile/articles/2609/08/news049.html", "category": "tech", "importance": 4, "wl": true, "topic": "화웨이 폴더블폰"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - SDxCentral", "summary": "라쿠텐 심포니의 클라우드 RAN 기술이 타발(Tawal)의 다중 통신사 공유 실내 네트워크 구축에 채택되어 적용되었다. 개방형 무선망 기술의 실증 및 상용화 성과다.", "source": "SDxCentral", "date": "2026-09-09 01:28", "url": "https://www.sdxcentral.com/news/rakuten-symphony-cloud-ran-tech-powers-tawals-multi-operator-indoor-network/", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐 심포니 타발 실내 네트워크"}, {"title": "Nokia’s AI-RAN pitch gets reality check in new study - Fierce Network", "summary": "새로운 연구 보고서를 통해 노키아의 AI-RAN 비전에 대한 현실적인 진단과 과제가 제기되었다. AI와 무선 접속 네트워크 결합의 기술적 실효성을 분석한 내용이다.", "source": "Fierce Network", "date": "2026-09-09 01:01", "url": "https://www.fiercewireless.com/wireless/nokias-ai-ran-pitch-gets-reality-check-new-study", "category": "tech", "importance": 3, " Standard", "date": "2026-09-08 19:28", "url": "https://www.business-standard.com/technology/tech-news/india-5g-network-slicing-trai-telcos-qos-rules-126090800860_1.html", "category": "policy", "importance": 3, "wl": false, "topic": "인도 trai 네트워크 슬라이싱 반대"}, {"title": "\"R&D 제한 20년·제재금 30배\"···정부, 연구부정시 사실상 퇴출", "summary": "[자료=과학기술정보 통신 부]국가 연구개발(R&D) 과정에서 연구비를 악의적·상습적으로 부정 사용하면 앞으로... 과기정통부 는 법 시행 전인 내년 3월까지 국가연구개발혁신법 시행령 등 후속 제도를 정비할 계획이다. 현장...", "source": "hellodd.com", "date": "2026-09-08 18:20", "url": "http://www.hellodd.com/news/articleView.html?idxno=113100", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "PBS 폐지 후 출연연 밑그림 \"핵심임무 집중하고 성과 따라 보상\"", "summary": "[사진= 과학기술정보 통신 부]정부출연연구기관이 연구과제 수주 중심의 PBS 체제에서 벗어나 국가적 임무를... 구혁채 과기정통부 제1차관은 \"출연연이 국가 산업을 뒷받침하고 미래를 개척하는 핵심임무에 집중할 수...", "source": "hellodd.com", "date": "2026-09-08 18:20", "url": "http://www.hellodd.com/news/articleView.html?idxno=113097", "category": "contract", "importance": 3, "wl": false, "topic": ""}, {"title": "국가AI전략위 2기, 기술·의제 등 글로벌 AI 핵심 공급망 박차", "summary": "대통령 직속 국가인공지능전략위원회가 출범 1주년 성과보고회를 열고 AI 3대 강국 실현과 '대체 불가 AI 핵심 공급망 국가' 도약을 위한 글로벌 공급망 협력 및 공공 AI 전환 성과를 발표했다. 하정우 부위원장은 지난 1년간 AI 대전환 기틀을 다졌다고 강조했다. 국가 차원의 AI 인프라 및 생태계 육성 전략을 다룬다. 정보통신 및 AI 정책의 중장기 방향을 보여준다.", "source": "전자신문", "date": "2026-09-08 18:03", "url": "https://www.etnews.com/20260908000373", "category": "tech", "importance": 3, "wl": true, "topic": "국가ai전략위 성과"}, {"title": "연구비 빼돌리면 최대 20년 R&D 퇴출… 제재부가금도 ‘30배’", "summary": "과학기술정보 통신 부는 8일 국무회의에서 이 같은 내용의 ‘국가연구개발혁신법’ 일부개정법률 공포안이... 과기정통부 는 개정법 시행에 맞춰 내년 3월까지 국가연구개발혁신법 시행령 등 하위법령을 정비할 예정이다....", "source": "viva100.com", "date": "2026-09-08 17:32", "url": "https://www.viva100.com/article/20260908501383", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "[뉴스줌인] AI 개발만으론 산업 못 만든다…SW시장 함께 키워야", "summary": "정부의 AI 예산 확대에도 불구하고 실제 산업과 공공 현장 적용을 위해서는 모델과 인프라 확보를 넘어 시스템 연계와 제품화, 장기 운영을 담보할 소프트웨어(SW) 생태계 투자가 병행되어야 한다는 지적이다. 전문가들은 지속 가능한 AI 산업 육성을 위한 중장기적 정책 전환을 촉구했다. 국가 AI 및 SW 산업 정책 방향을 다룬다.", "source": "전자신문", "date": "2026-09-08 17:04", "url": "https://www.etnews.com/20260908000368", "category": "tech", "importance": 3, "wl": true, "topic": "소프트웨어 생태계"}, {"title": "“AI산업 기반인데 내년 SW사업 예산은 뒷걸음질”…SW 홀대론 커져", "summary": "정부가 내년 AI에 대규모 예산을 투입할 예정인 반면, AI 산업의 근간이 되는 전통적인 소프트웨어(SW) 관련 과기정통부 비R&D 예산은 오히려 뒷걸음질 친 것으로 나타났다. 기반 SW 지원 축소가 AI 경쟁력까지 악화시킬 수 있다는 업계의 우려가 커지고 있다. 국가 R&D 및 SW 예산 편성과 관련된 정책 비판 보도다.", "source": "전자신문", "date": "2026-09-08 16:30", "url": "https://www.etnews.com/20260908000358", "category": "tech", "importance": 3, "wl": true, "topic": "소프트웨어 예산 삭감"}, {"title": "온라인 주민번호 'CI' 제도개선 제자리걸음…업계는 '유효기간제' 도입 촉구", "summary": "온라인 주민등록번호로 불리는 연계정보(CI) 제도 개선 논의가 대규모 유출 발생 후 1년 넘게 결론을 내지 못하고 있다. 인증 업계에서는 일정 기간마다 기존 값을 폐기·재발급하는 '유효기간제'의 조속한 도입을 촉구하고 있다. 방송미디어통신위원회의 제도 개선 지연과 업계의 요구를 다룬 규제 정책 보도다.", "source": "전자신문", "date": "2026-09-08 16:00", "url": "https://www.etnews.com/20260908000278", "category": "policy", "importance": 3, "wl": true, "topic": "연계정보 ci 제도"}, {"title": "국가AI전략위, AI 보안 전면화·국방 특화 AI 등 성과 낸다", "summary": "국가인공지능전략위원회가 AI 모델 개발부터 운영까지 전 단계에 보안을 기본 원칙으로 적용하는 'AI 보안 전면화'에 나선다. 국방 특화 AI 모델 개발과 국방AI법의 조속한 제정을 뒷받침하여 국가 안보에도 기여한다는 계획이다. 출범 1주년 성과보고회에서 이 같은 향후 계획을 발표했다. 국가 안보 및 AI 보안 정책의 방향을 보여준다.", "source": "전자신문", "date": "2026-09-08 15:00", "url": "https://www.etnews.com/20260908000210", "category": "tech", "importance": 3, "wl": true, "topic": "국가ai전략위 보안"}, {"title": "'포스트 PBS' 이행 계획 의결…“출연연, 국가 R&D 거점 도약”", "summary": "정부출연연구기관을 과제 수주 경쟁으로 몰았던 연구과제중심제도(PBS) 폐지 결정 1년을 맞아 정부가 새로운 체제 안착에 속도를 낸다. 출연연별 핵심 연구 분야를 정하고 연구개발(R&D) 성과에 따른 보상을 강화하여 출연연을 국가 R&D 거점으로 도약시킨다는 목표다. 과학기술정보통신부의 국가 연구개발 체계 개혁 조치다.", "source": "전자신문", "date": "2026-09-08 14:31", "url": "https://www.etnews.com/20260908000166", "category": "policy", "importance": 3, "wl": true, "topic": "출연연 pbs 폐지"}, {"title": "이소영 “소상공인 비용 감축 로드맵 만들겠다”…배달앱 정책도 재설계", "summary": "이소영 중소벤처기업부 장관 후보자가 소상공인·자영업자의 지속 불가능한 비용 구조 개선을 정책 핵심 과제로 제시했다. 실제 수입과 지출을 지표화해 경영 부담을 관리하고 비용 감축 로드맵을 마련하겠다는 구상이다. 쿠폰 중심의 상생배달앱 지원 정책도 예산 심의 과정에서 효율성 중심으로 재설계하겠다는 뜻을 밝혔다. 정부의 소상공인 지원 및 플랫폼 규제 정책 방향이다.", "source": "전자신문", "date": "2026-09-08 13:40", "url": "https://www.etnews.com/20260908000219", "category": "policy", "importance": 3, "wl": true, "topic": "이소영 소상공인비용"}, {"title": "Supreme Court dismisses ₹363 crore GST demand against Vodafone Idea on tower business sale", "summary": "인도 대법원이 타워 사업 매각과 관련하여 보다폰 아이디어를 상대로 제기된 363억 루피 규모의 GST(상품서비스세) 부과 소송을 기각했다. 아울러 존재하지 않는 법인인 보다폰 모바일 서비스에 어떻게 절차가 개시될 수 있었는지 정부 측에 의문을 제기했다. 통신 사업자의 세무 및 법적 분쟁에 대한 사법부의 최종 판단이다. 통신 규제 및 세무 환경의 변화를 보여준다.", "source": "ET Telecom", "date": "2026-09-08 10:47", "url": "https://telecom.economictimes.indiatimes.com/news/industry/supreme-court-dismisses-363-crore-gst-demand-against-vodafone-idea-on-tower-business-sale/133903142", "category": "policy", "importance": 3, "wl": true, "topic": "보다폰인도 대법원"}, {"title": "남아공, 왓츠앱·넷플릭스 요금 들여다본다", "summary": "이번 조사는 규제 당국이 앞서 진행한 데이터 서비스 관련 검토와 고속 인터넷용 주파수 할당 및 경쟁 촉진 조치 이후 실시해 온 요금 모니터링을 토대로 진행될 예정이다. 이번 조사는 남아공 통신부 장관이 통신 서비스...", "source": "zdnet.co.kr", "date": "2026-09-08 10:26", "url": "https://zdnet.co.kr/view/?no=20260908090632", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "Brazil 6 GHz spectrum auction targets data centre and connectivity investment - Intelligen", "summary": "", "source": "Intelligent CIO", "date": "2026-09-07 20:01", "url": "https://www.intelligentcio.com/latam/2026/09/07/brazil-6-ghz-spectrum-auction-targets-data-centre-and-connectivity-investment/", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "Ranchers reeling from President Trump beef price initiatives - Spectrum News", "summary": "", "source": "Spectrum News", "date": "2026-09-07 06:19", "url": "https://spectrumlocalnews.com/ca/california/politics/2026/09/06/cattle-ranchers-beef-import-prices", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "중기부, 글로벌 일류 지원 'K-소비재' 기업 188곳 선정", "summary": "중소벤처기업부가 K-컬처 열풍에 힘입어 전 세계적으로 수요가 늘고 있는 뷰티 등 소비재 분야 혁신 제품을 글로벌 일류 상품으로 육성하기 위해 2026년 'K-수출전략품목 육성사업' 지원 대상 188개 기업을 선정했다. 정부의 중소기업 수출 지원 및 K-브랜드 육성 정책이다.", "source": "ZDNet Korea", "date": "2026-09-08 23:09", "url": "https://zdnet.co.kr/view/?no=20260908230958", "category": "other", "importance": 2, "wl": true, "topic": "중기부 k소비재"}, {"title": "정부, 국산 프론티어급 AI 개발에 4조7000억 출자한다", "summary": "8일 과학기술정보 통신 부 등에 따르면 정부는 프론티어 AI 모델 개발을 지원하기 위해 미래대응기금 형태로 4조7000억 원을 출자할 계획이다. 해당 재원은 과기정통부 가 내년도 예산안으로 제시한 AI 예산 약 9조4000억...", "source": "kookje.co.kr", "date": "2026-09-08 22:48", "url": "http://www.kookje.co.kr/news2011/asp/newsbody.asp?code=0200&key=20260908.99099002753", "category": "other", "importance": 2, "wl": false, "topic": ""}], "carrier": [{"title": "Verizon signs $2 billion-plus deal with Corning to supply fiber for FTTP and AI - Fierce N", "summary": "버라이즌이 코닝과 20억 달러(약 2조 원) 이상의 대규모 광섬유 공급 계약을 체결했다. 이번 계약은 FTTP(가구당 광케이블) 구축 가속화와 함께 급증하는 AI 데이터센터 트래픽을 지원하기 위한 목적이다. 양사 간의 파트너십은 미국 통신 시장에서 인프라 현대화 경쟁을 주도하는 핵심 요인으로 작용한다. 대규모 자금이 투입되는 장기 계약으로 업계의 큰 주목을 받고 있다.", "source": "Fierce Network", "date": "2026-09-09 01:20", "url": "https://www.fiercewireless.com/broadband/verizon-signs-2-billion-plus-deal-corning-supply-fiber-fttp-and-ai", "category": "contract", "importance": 5, "wl": false, "topic": "버라이즌 코닝"}, {"title": "KDDI, Samsung Achieve 3.6 Gbps in 7 GHz 6G Field Trial - Telecom Review Asia", "summary": "일본 KDDI와 삼성전자가 7 GHz 주파수 대역을 활용한 6G 필드 트라이얼에서 3.6 Gbps 속도 시연에 성공했다. 차세대 통신 표준 선점을 위한 양사의 기술 협력 성과로 삼성전자 네트워크사업부의 핵심 실적이다.", "source": "Telecom Review Asia", "date": "2026-09-08 18:06", "url": "https://www.telecomreviewasia.com/news/network-news/30208-kddi-samsung-achieve-3-6-gbps-in-7-ghz-6g-field-trial/", "category": "tech", "importance": 5, "wl": false, "topic": "kddi 삼성전자 6g 필드 트라이얼"}, {"title": "Verizon loads up on Corning's fiber for network expansion and AI infrastructure", "summary": "버라이즌은 네트워크 확장과 AI 인프라 구축을 위해 코닝과 수십억 달러 규모의 대형 광섬유 공급 계약을 체결했다. 계약에 따라 2027년부터 2032년까지 8000만 마일 이상의 광섬유를 공급받아 차세대 통신망을 강화할 예정이다. AI 데이터 트래픽 증가에 대응하기 위한 통신사의 인프라 투자 전략을 보여준다. 향후 통신 장비 및 부품 생태계에 큰 파급효과를 미칠 전망이다.", "source": "Light Reading", "date": "2026-09-09 00:56", "url": "https://www.lightreading.com/data-centers/verizon-loads-up-on-corning-s-fiber-for-network-expansion-and-ai-infrastructure", "category": "contract", "importance": 4, "wl": true, "topic": "버라이즌 수주"}, {"title": "楽天モバイル『エリア縮小』ほぼ確定へ、「auローミング継続」再び訴えるも自社回線の整備遅れが新型iPhone商戦を直撃 - Buzzap！（バザップ！）", "summary": "라쿠텐 모바일이 'au 로밍 지속'을 거듭 호소하고 있으나 자체 자사 회선 정비 지연으로 인해 '에리어 축소'가 사실상 확정되는 분위기다. 이로 인해 신형 아이폰 출시를 맞이한 가입자 유치전에 악영향을 미치고 있다. 통신사의 인프라 투자 속도 저하가 마케팅 성과로 직결되는 리스크를 보여준다.", "source": "Buzzap！（バザップ！）", "date": "2026-09-08 20:00", "url": "https://buzzap.jp/news/20260908-rakuten-mobile-area-cover-au-roaming-for-iphone18pro/", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐모바일 kddi"}, {"title": "Vodafone Idea’s operating cash flows may fall short of spectrum payment obligations from F", "summary": "보다폰 아이디어(Vi)의 향후 5년간 유예된 주파수 지불 의무가 2027 회계연도 7100억 루피에서 시작해 2029년과 2030년에는 2조 7000억 루피로 정점에 달할 것으로 전망되면서 운영 현금 흐름이 이를 충족하지 못할 수 있다는 우려가 제기되고 있다. 막대한 스펙트럼 부채와 재정적 압박이 통신사의 지속 가능성을 위협하고 있다. 인도 통신 시장의 구조적 재정 위기와 장비 투자 여력 축소 가능성을 보여주는 중요한 지표다.", "source": "ET Telecom", "date": "2026-09-08 16:38", "url": "https://telecom.economictimes.indiatimes.com/news/industry/vodafone-ideas-operating-cash-flows-may-fall-short-of-spectrum-payment-obligations-from-fy29-report/133914780", "category": "earnings", "importance": 4, "wl": true, "topic": "보다폰인도 재정"}, {"title": "Jio Platforms plans to kick off investor outreach for its IPO next week - Business Standar", "summary": "인도 릴라이언스 지오 플랫폼스가 다음 주부터 기업공개(IPO)를 위한 투자자 로드쇼 및 아웃리치 일정에 돌입한다. 수조 원대 가치로 평가받는 지오의 상장은 글로벌 통신 및 테크 시장의 최대 대형 이벤트 중 하나다. 대규모 자본 조달을 통해 향후 5G 및 6G, 위성통신 인프라 투자를 가속화할 전망이다. 업계 판도를 흔들 초대형 금융 이벤트다.", "source": "Business Standard", "date": "2026-09-08 11:04", "url": "https://www.business-standard.com/markets/ipo/jio-platforms-plans-to-kick-off-investor-outreach-for-its-ipo-next-week-126090800084_1.html", "category": "other", "importance": 4, "wl": false, "topic": "릴라이언스지오 ipo"}, {"title": "ソフトバンクのネットワーク運用変革 独自開発した“通信業界向けAI”を本格活用 - ビジネスネットワーク", "summary": "소프트뱅크가 자체 개발한 '통신업계 전용 AI'를 네트워크 운용에 본격적으로 활용하기 시작했다. AI 기반의 자율 네트워크 관리를 통해 망 장애 예측, 트래픽 최적화, 운영 효율 극대화를 추진한다. 통신 인프라 운용의 패러다임을 사람 중심에서 AI 자율 제어 체제로 전환하는 혁신적인 시도다. 글로벌 통신사들의 AI 네이티브 전환을 선도하는 사례로 주목받는다.", "source": "ビジネスネットワーク", "date": "2026-09-08 07:01", "url": "https://businessnetwork.jp/article/35813/", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 ai운용"}, {"title": "Supreme Court dismisses Rs 363 crore GST demand against Vodafone Idea on tower business sa", "summary": "인도 대법원이 보다폰 아이디어를 상대로 타워 사업 매각과 관련해 제기된 363억 루피 규모의 상품서비스세(GST) 부과 소송을 기각했다. 통신사의 자산 매각 및 구조조정 과정에서 벌어진 대규모 조세 분쟁에서 통신사가 승소한 셈이다. 재무적 불확실성을 덜어낸 보다폰 아이디어의 경영 안정화에 기여할 전망이다. 통신 업계의 세무 규제 관련 주요 판례로 기록된다.", "source": "The Economic Times", "date": "2026-09-08 04:24", "url": "https://economictimes.indiatimes.com/industry/telecom/telecom-news/supreme-court-dismisses-rs-363-crore-gst-demand-against-vodafone-idea-on-tower-business-sale/articleshow/133895163.cms", "category": "policy", "importance": 4, "wl": false, "topic": "보다폰아이디어 세금"}, {"title": "Telecom operators oppose TRAI’s proposed QoS rules for5G network slicing - tele.net.in", "summary": "통신 사업자들이 인도 통신규제청(TRAI)이 제안한 5G 네트워크 슬라이싱 품질 규제안에 대해 반대 입장을 표명했다. 산업용 맞춤형 통신 서비스를 제공하는 핵심 기술인 슬라이싱에 과도한 규제가 적용될 경우 사업 경쟁력이 저하될 수 있다는 지적이다. 정책 수립 과정에서 업계의 의견을 반영하기 위한 로비와 협상이 치열하다.", "source": "tele.net.in", "date": "2026-09-07 14:19", "url": "https://tele.net.in/national-news/telecom-operators-oppose-trais-proposed-qos-rules-for5g-network-slicing-12501360", "category": "policy", "importance": 4, "wl": false, "topic": "인도 trai 5g규제"}, {"title": "T-Mobile Names Jessica Uhl As Next CFO, Peter Osvaldik To Retire In 2027 - Pulse 2.0", "summary": "티모바일이 차기 최고재무책임자(CFO)로 제시카 울(Jessica Uhl)을 선임하고 현 CFO 피터 오스발딕이 2027년에 은퇴할 예정이라고 발표했다. 주요 경영진의 세대교체와 체계적인 승계 계획을 공식화한 것이다. 최고위 임원 교체는 회사의 장기적인 재무 전략과 경영 기조에 큰 변화를 가져올 수 있다. 업계의 큰 관심을 모으는 인사 소식이다.", "source": "Pulse 2.0", "date": "2026-09-07 10:25", "url": "https://pulse2.com/t-mobile-names-jessica-uhl-as-next-cfo-peter-osvaldik-to-retire-in-2027/", "category": "exec", "importance": 4, "wl": false, "topic": "티모바일 인사"}, {"title": "Bell, Rogers and Telus Lead Canada’s Wi-Fi 7 Shift as Fibre Pulls Ahead - iphoneincanada.c", "summary": "벨, 로저스, 텔러스 등 캐나다 주요 통신사들이 광케이블 확충과 함께 와이파이 7 전환을 주도하고 있다. 유선 네트워크 및 차세대 무선랜 인프라 투자 동향을 보여준다.", "source": "iphoneincanada.ca", "date": "2026-09-09 01:25", "url": "https://www.iphoneincanada.ca/2026/09/08/bell-rogers-and-telus-lead-canadas-wi-fi-7-shift-as-fibre-pulls-ahead/", "category": "other", "importance": 3, "wl": false, "topic": "캐나다통신사 와이파이전환"}, {"title": "SATELLAI Deepens Collaboration with Deutsche Telekom IoT and Swift Navigation at IFA 2026 ", "summary": "사테라이가 IFA 2026에서 도이치텔레콤 IoT 및 스위프트 내비게이션과의 협력 관계를 심화한다고 발표했다. 통신사와 IoT 기술 기업 간의 파트너십 강화 동향이다.", "source": "The Malaysian Reserve", "date": "2026-09-09 00:27", "url": "https://themalaysianreserve.com/2026/09/08/satellai-deepens-collaboration-with-deutsche-telekom-iot-and-swift-navigation-at-ifa-2026/amp/", "category": "other", "importance": 3, "wl": false, "topic": "도이치텔레콤 사테라이협력"}, {"title": "Stronger Connections, Smarter Growth: Spectrum and Southern Bank Build a Future-Ready Netw", "summary": "스펙트럼(Charter Communications)과 서던 뱅크가 협력하여 미래 지향적인 고도화된 네트워크 인프라를 구축했다. 기업 고객과 지역 사회를 위한 강력하고 스마트한 연결성 제공에 초점을 맞추고 있다. 안정적인 광대역 서비스 제공을 통해 비즈니스 경쟁력을 강화하는 기반을 마련했다. 통신사의 지속적인 인프라 투자 사례를 보여준다.", "source": "Charter Communications", "date": "2026-09-09 00:24", "url": "https://corporate.charter.com/newsroom/spectrum-fiber-internet-powers-southern-bank-growth", "category": "contract", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 네트워크"}, {"title": "LG유플러스, 월 5500원 입문형 홈캠 '홈캠 Lite' 출시 - worktoday.co.kr", "summary": "LG유플러스가 월 5,500원이라는 저렴한 요금으로 이용 가능한 홈캠 Lite를 출시하여 홈 IoT 시장을 공략한다. 통신사 부가 서비스 동향이다.", "source": "worktoday.co.kr", "date": "2026-09-08 23:57", "url": "http://www.worktoday.co.kr/news/articleView.html?idxno=88998", "category": "other", "importance": 3, "wl": false, "topic": "lg유플러스 홈캠라이트출시"}, {"title": "Corning Stock Climbs On Multibillion-Dollar Verizon Network Deal - Investor's Business Dai", "summary": "버라이즌의 수조 원대 규모 네트워크 장비 및 광섬유 공급 계약 소식에 힘입어 파트너사인 코닝의 주가가 상승했다. 통신 인프라 투자가 통신사와 장비 공급사의 동반 성장으로 이어지는 양상을 보여준다. AI 트래픽 대응을 위한 대규모 투자 집행이 시장에서 긍정적인 평가를 받고 있다. 주가 상승은 향후 통신 인프라 시장의 활황 기대를 반영한다.", "source": "Investor's Business Daily", "date": "2026-09-08 23:41", "url": "https://www.investors.com/news/technology/corning-stock-glw-verizon-network-agreement/", "category": "contract", "importance": 3, "wl": false, "topic": "버라이즌 주가"}, {"title": "Deutsche Telekom demos drone protection shield at Digital X - Telecompaper", "summary": "도이치텔레콤이 디지털 X 컨퍼런스에서 드론 보호 방패 시스템을 시연하며 네트워크 기반 안티드론 기술을 선보였다. 통신망 응용 기술 관련 보도이다.", "source": "Telecompaper", "date": "2026-09-08 22:52", "url": "https://www.telecompaper.com/news/deutsche-telekom-demos-drone-protection-shield-at-digital-x--1582079", "category": "other", "importance": 3, "wl": false, "topic": "도이치텔레콤 드론탐지시스템"}, {"title": "Deutsche Telekom showcases enterprise network protection platform T Secure Fabric at Digit", "summary": "도이치텔레콤이 디지털 X 행사에서 엔터프라이즈 네트워크 보호 플랫폼인 'T 시큐어 패브릭'을 공개했다. 기업 고객을 위한 보안 네트워크 솔루션 출시 동향이다.", "source": "Telecompaper", "date": "2026-09-08 22:06", "url": "https://www.telecompaper.com/news/deutsche-telekom-showcases-enterprise-network-protection-platform-t-secure-fabric-at-digital-x-event--1582059", "category": "other", "importance": 3, "wl": false, "topic": "도이치텔레콤 보안플랫폼출시"}, {"title": "80+ million miles of fiber will link homes, businesses and AI data centers - Stock Titan", "summary": "미국 전역에 가정, 기업, AI 데이터센터를 연결하기 위해 8,000만 마일 이상의 광섬유가 포설될 예정이다. 대규모 광케이블 투자는 데이터 트래픽 폭증과 AI 인프라 확충 요구에 대응하기 위한 필수 조건이다. 통신사와 장비 공급사 간의 대형 계약을 뒷받침하는 배경이 된다. 네트워크 고도화 작업이 본격적으로 가속화되고 있음을 보여준다.", "source": "Stock Titan", "date": "2026-09-08 22:00", "url": "https://www.stocktitan.net/news/VZ/verizon-and-corning-announce-multi-year-multi-billion-dollar-supply-gazgcbh2dq09.html", "category": "contract", "importance": 3, "wl": false, "topic": "버라이즌 광섬유"}, {"title": "Data translation a massive hurdle for AI-native telcos, says DT’s Hafez - telecomtv.com", "summary": "도이치텔레콤의 기술 책임자 아드난 하페즈가 AI 네이티브 통신사로 전환하는 과정에서 데이터 변환이 거대한 걸림돌이라고 지적했다. 통신사의 AI 인프라 전환 전략을 보여준다.", "source": "telecomtv.com", "date": "2026-09-08 21:42", "url": "https://www.telecomtv.com/content/ai/data-translation-a-massive-hurdle-for-ai-native-telcos-says-dt-s-hafez-56193/", "category": "other", "importance": 3, "wl": false, "topic": "도이치텔레콤 ai전략"}, {"title": "Indian telcos push back against proposed 5G slicing rules", "summary": "인도의 민간 통신사들이 인도 트라이(TRAI)가 제안한 5G 네트워크 슬라이싱 규제안에 대해 규제 부담을 가중시키고 유연성을 제한한다며 강력히 반대하고 있다. 통신사들은 새로운 규제가 서비스 혁신을 저해할 수 있다고 주장한다. 인도 시장에서의 5G 서비스 운영 정책과 통신 규제 당국 간의 갈등을 보여준다. 향후 인도 통신사들의 5G 투자 및 서비스 전략에 영향을 미칠 수 있다.", "source": "Light Reading", "date": "2026-09-08 21:39", "url": "https://www.lightreading.com/5g/indian-telcos-push-back-against-proposed-5g-slicing-rules", "category": "policy", "importance": 3, "wl": true, "topic": "인도통신사 5g"}, {"title": "Did CFO Exit Just Shift Charter Communications (CHTR) Investment Narrative? - simplywall.s", "summary": "차터커뮤니케이션즈(CHTR)의 최고재무책임자(CFO) 퇴임이 회사의 향후 투자 내러티브와 전략 방향에 미칠 영향에 관심이 모이고 있다. 주요 재무 책임자의 교체는 향후 자본 배분 및 인프라 투자 계획에 변수로 작용할 수 있다. 시장 분석가들은 리더십 변화가 기업 가치 평가에 어떤 변화를 줄지 주시하고 있다. 안정적인 승계와 전략 유지 여부가 관건이다.", "source": "simplywall.st", "date": "2026-09-08 19:34", "url": "https://simplywall.st/stocks/us/media/nasdaq-chtr/charter-communications/news/did-cfo-exit-just-shift-charter-communications-chtr-investme", "category": "exec", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 인사"}, {"title": "KT-KAIST-다임리서치, 피지컬 AI 기술 개발과 사업화 협력 체계 구축 - 디지털경제뉴스 가포르 케이블(ASC)이 인도네시아 해역에서 케이블 단절 사고를 일으켜 인터넷 트래픽이 대체 경로로 우회 처리되었다. 해저 케이블 손상으로 인해 주요 국제 통신 경로에 일시적인 장애와 소통 혼란이 발생했다. 해저 케이블 인프라의 물리적 보안과 우회 경로 확보의 중요성을 시사한다. 지역적 해저 케이블 사고로서 통신망 안정성 유지의 과제를 보여준다.", "source": "Light Reading", "date": "2026-09-07 21:05", "url": "https://www.lightreading.com/cable-technology/asc-cable-break-disrupts-key-australia-singapore-route", "category": "outage", "importance": 3, "wl": true, "topic": "보커스 케이블"}, {"title": "Reliance Jio gears up for mega IPO as Kerala subscriber base crosses 1.1 crore - Onmanoram", "summary": "릴라이언스 지오가 케럴라 지역 가입자 1,100만 명을 돌파하며 메가 IPO를 준비하고 있다. 인도 최대 통신사의 상장 추진과 가입자 성장세를 보여주는 통신사 동향 기사이다.", "source": "Onmanorama", "date": "2026-09-07 20:57", "url": "https://www.onmanorama.com/news/business/2026/09/07/reliance-jio-kerala-10-years-1-119-crore-subscribers-ipo-2026.html", "category": "other", "importance": 3, "wl": false, "topic": "릴라이언스지오 ipo추진"}, {"title": "Eurobites: Vodafone starts offering Quality on Demand API in Germany", "summary": "보다폰이 독일 시장에서 고품질 보장(QoD) API 서비스를 시작했다. 이와 함께 TIM 경영진의 주식 매각, O2 비즈니스의 위성 서비스 출시, 그리스 코스모테의 텔레콤 사명 변경 등 유럽 지역의 통신사 동향이 함께 전해졌다. 통신사가 네트워크 성능을 API 형태로 외부에 개방하여 새로운 수익 모델을 창출하려는 전략을 보여준다. 5G 네트워크 기반의 부가 서비스 상용화 동향을 파악하는 데 유용하다.", "source": "Light Reading", "date": "2026-09-07 20:48", "url": "https://www.lightreading.com/wireless/eurobites-vodafone-starts-offering-quality-on-demand-api-in-germany", "category": "tech", "importance": 3, "wl": true, "topic": "보다폰 api"}, {"title": "Weekly Recap: Deutsche Telekom–T-Mobile US, Inc. talks stall and Uhl CFO - TradingView", "summary": "도이치텔레콤과 미국 T-Mobile 간의 협상이 정체되고 최고재무책임자(CFO) 인사가 맞물린 주간 동향을 정리했다. 모기업과 자회사 간의 거버넌스 이슈를 다루고 있다.", "source": "TradingView", "date": "2026-09-07 20:22", "url": "https://www.tradingview.com/news/tradingview:5d86bd2616bfd:0-weekly-recap-deutsche-telekom-t-mobile-us-inc-talks-stall-and-uhl-cfo/", "category": "other", "importance": 3, "wl": false, "topic": "도이치텔레콤 티모바일미국협상"}, {"title": "BSNL’s Homegrown 4G Network Reac   document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
