</style>

 "other", "importance": 3, "wl": false, "topic": ""}, {"title": "MDA Space Files for Own D2D Constellation While Supplying Rival Operators - Tech Times", "summary": "MDA 스페이스가 경쟁 위성 사업자에게 장비를 공급하는 동시에 자체 D2D 위성 군집 구축을 추진한다. 위성통신 장비 및 서비스 경쟁 구도이다.", "source": "Tech Times", "date": "2026-09-03 04:50", "url": "https://www.techtimes.com/articles/326366/20260902/mda-space-files-own-d2d-constellation-while-supplying-rival-operators.htm", "category": "tech", "importance": 3, "wl": false, "topic": "mda스페이스 위성"}], "competitor": [{"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도 정부가 국가 안보 우려를 이유로 기존 중국산 통신 장비를 철거하고 교체하는 방안을 검토 중인 것으로 알려졌다. 이는 글로벌 통신 장비 시장에서 화웨이와 ZTE 등 중국산 장비의 퇴출 기조를 강화하는 조치이다. 주요국 정부 차원의 중국산 통신장비 제재 및 안보 강화 정책의 연장선에 있다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도 정부"}, {"title": "Elliott Management builds Deutsche Telekom stake, opposes possible T-Mobile merger - repor", "summary": "엘리엇 매니지먼트가 도이치텔레콤의 지분을 대거 매입하고 T모바일 US 합병 가능성에 공식 반대 입장을 표명했다. 행동주의 펀드의 개입으로 인해 주요 통신사의 자본 배치와 미국 시장 전략이 중대한 기로에 섰다. 글로벌 통신 시장의 지형도와 장비 투자 계획에 큰 파장을 미칠 수 있는 대형 이슈이다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:17", "url": "https://www.datacenterdynamics.com/en/news/elliott-management-builds-deutsche-telekom-stake-opposes-possible-t-mobile-merger-reports/", "category": "other", "importance": 4, "wl": false, "topic": "도이치텔레콤 인수합병"}, {"title": "T-Mobile US stock gains as Elliott pressure on Deutsche Telekom reshapes merger debate - A", "summary": "엘리엇 매니지먼트의 압박이 도이치텔레콤의 전략에 영향을 미치면서 T모바일 US 관련 인수합병 및 지배구조 논쟁이 재점화되었다. 행동주의 펀드의 개입이 주요 통신 그룹의 대서양 횡단 합병 전략에 변수로 작용하고 있다. 글로벌 통신 시장의 지형도와 장비 투자 계획에 파장을 낼 수 있는 사안이다. 업계 판도에 영향을 주는 대형 이슈로 주시해야 한다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:57", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/t-mobile-us-stock-gains-as-elliott-pressure-on-deutsche-telekom-reshapes/70049448", "category": "other", "importance": 4, "wl": false, "topic": "t-mobile 인수합병"}, {"title": "Sceye, SoftBank demo high-altitude platform systems connectivity - Computer Weekly", "summary": "소프트뱅크가 스카예(Sceye)와 협력하여 고고도 플랫폼 시스템(HAPS)을 활용한 통신 연결 시연에 성공했다. 성층권 무인기를 기지국으로 활용하여 난시 지역과 재난 지역에 광대역 통신을 제공하는 차세대 무선 기술이다. 5세대 후반 및 6G 시대의 공중 네트워크 인프라 구축을 위한 핵심 기술력 확보에 해당한다. 통신 장비 및 네트워크 진화 방향을 보여주는 중요 R&D 성과이다.", "source": "Computer Weekly", "date": "2026-09-03 20:18", "url": "https://www.computerweekly.com/news/366649923/Sceye-SoftBank-demo-high-altitude-platform-systems-connectivity", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 고고도무인기"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - The Fast", "summary": "에릭슨이 사우디아라비아 모빌리와 협력하여 AI 기반 RAN 및 자율주행 네트워크 기술을 고도화하기로 했다. 사우디의 디지털 전환 가속화에 발맞추어 차세대 통신 인프라 구축을 주도하고 있다. 중동 지역에서의 네트워크 장비 공급 및 기술 협력 입지를 공고히 하고 있다.", "source": "The Fast Mode", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 모빌리 수주"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 6G 기지국을 활용해 소형 드론을 탐지할 수 있는 신기술을 공개했다. 이동통신 기지국 전파를 이용해 주변 비행체를 감지함으로써 통신과 센싱 기능을 융합하는 차세대 기술력을 입증했다. 향후 스마트 시티 및 국방 분야에서의 응용 가능성을 제시하고 있다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 드론 탐지"}, {"title": "Ericsson to Unveil Drone-Tracking Network Tech in Korea - Seoul Economic Daily", "summary": "에릭슨이 기지국 전파를 활용한 드론 추적·탐지 네트워크 기술을 한국 시장에서 최초로 공개할 예정이라고 밝혔다. 통신 인프라가 단순 음성·데이터 전송을 넘어 센싱 기능까지 수행하는 6G 시제품급 기술이다. 국내 통신사 및 관련 기관과의 기술 협력 확장이 기대된다. 슨 일본 ai 연구"}, {"title": "Nokia and BeeHealthy Bring Network-based Verification to Digital Healthcare - NewswireToda", "summary": "노키아와 비건강이 네트워크 기반 번호 인증 기술을 디지털 헬스케어 애플리케이션에 적용한다고 발표했다. 보안성과 사용자 편의를 동시에 만족시키는 통신 API 솔루션이다. 헬스케어 분야로의 네트워크 솔루션 확장을 가속화하고 있다.", "source": "NewswireToday", "date": "2026-09-04 00:01", "url": "https://www.newswiretoday.com/news/186783/Nokia-and-BeeHealthy-Bring-Network-based-Verification-to-Digital-Healthcare/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 헬스케어 인증"}, {"title": "Minnesota operator taps MoCA Access tech to connect MDUs", "summary": "미네소타 기반의 통신사업자 스요베르크가 인코액스와 노키아의 협력을 통해 다세대 주택(MDU)에 MoCA Access 기술을 도입하여 기가비트 속도를 구현했다. 노키아의 유선 액세스 솔루션이 북미 지역 주거용 초고속 인터넷 인프라에 적용된 사례다. 장비 공급을 통한 통신장비 시장 내 입지를 보여준다.", "source": "Light Reading", "date": "2026-09-03 23:13", "url": "https://www.lightreading.com/broadband/minnesota-operator-taps-moca-access-tech-to-connect-mdus", "category": "contract", "importance": 3, "wl": true, "topic": "노키아 수주"}, {"title": "Chinese businesses of all stripes are turning to Huawei - The Economist", "summary": "미국의 제재 속에서도 중국 내 다양한 업종의 기업들이 자체 공급망 확보를 위해 화웨이의 기술과 장비로 선회하고 있다. 내수 시장을 중심으로 생태계를 결속하려는 화웨이의 행보가 뚜렷해지고 있다. 제재 장기화에 대응하는 중국 기업들의 자립화 트렌드를 보여준다.", "source": "The Economist", "date": "2026-09-03 22:08", "url": "https://www.economist.com/business/2026/09/03/chinese-businesses-of-all-stripes-are-turning-to-huawei", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 국내 기업 활용"}, {"title": "The era of AI-native RAN starts now - Nokia", "summary": "노키아가 AI 네이티브 RAN 시대의 개막을 선언하며 관련 아키텍처와 기술 비전을 공개했다. 인공지능이 기획 단계부터 기지국 알고리즘에 내장되어 무선 접속망의 성능을 스스로 최적화하는 차세대 기술이다. 6G 및 고도화된 5G 인프라 시장에서 기술 주도권을 잡기 위한 포석이다.", "source": "Nokia", "date": "2026-09-03 21:05", "url": "https://www.nokia.com/blog/the-era-of-ai-native-ran-starts-now/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai 네이티브 ran"}, {"title": "How Could Nokia (NYSE:NOK) R&D Plans Affect NYSE Composite? - Kalkine Media", "summary": "노키아의 대규모 연구개발 계획이 글로벌 증시 및 NYSE 컴포짓 지수에 미치는 영향에 대한 분석이 제기되었다. 차세대 통신 기술 및 AI 연구 투자가 기업의 중장기 밸류에이션에 중요한 변수로 작용한다. 글로벌 장비사의 기술 투자 방향성을 가늠할 수 있다.", "source": "Kalkine Media", "date": "2026-09-03 19:53", "url": "https://kalkinemedia.com/us/stocks/penny/how-could-nokia-nysenok-rd-plans-affect-nyse-composite", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 r&d 계획"}, {"title": "Nokia deploys Gibabit Connect with InCoax MoCA Access for apartments on Sjoberg's network ", "summary": "노키아가 스웨덴 쇼베르그 네트워크를 통해 아파트 단지에 InCoax MoCA Access 기술을 결합한 기가비트 커넥트 솔루션을 공급했다. 기존 동축케이블 인프라를 활용해 고속 초고속 인터넷 서비스를 효율적으로 제공할 수 있는 것이 특징이다. 유럽 주거 지역의 유선망 업그레이드 수요를 공략하고 있다.", "source": "Telecompaper", "date": "2026-09-03 19:46", "url": "https://www.telecompaper.com/news/nokia-deploys-gibabit-connect-with-incoax-moca-access-for-apartments-on-sjobergs-network-in-minnesota--1581634", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 기가비트 장비 공급"}, {"title": "Chunghwa Telecom, Askey Launch 5G Platform for Construction Robots - telecomreviewasia.com", "summary": "중화텔레콤과 애스키가 건설 현장 로봇을 위한 5G 전용 플랫폼을 공동 출시했다. 초고속·저지연 5G 특화망을 통해 무인 건설 로봇의 원격 제어와 실시간 모니터링이 가능해졌다. B2B 5G 솔루션의 산업 현장 적용이 본격화되고 있음을 보여준다.", "source": "telecomreviewasia.com", "date": "2026-09-03 19:44", "url": "https://www.telecomreviewasia.com/news/technology-news/30170-chunghwa-telecom-askey-launch-5g-platform-for-construction-robots/", "category": "contract", "importance": 3, "wl": false, "topic": "중화텔레콤 건설로봇 5g"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "통신장비 업체 화웨이 를 비롯해 숏폼·AI 기업 콰이서우, 전자상거래 업체 알리바바, 미국 애플 등이 이 지역에 컴퓨팅 시설 관련 투자를 진행한 바 있습니다. 바이트댄스가 추진하는 데이터센터의 투자 규모가...", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Huawei debuts Nova 16s smartphone range alongside new smartwatches and tablets - Tele . 글로벌 탈중국 통신장비 공급망 재편에 중대한 파장을 미칠 전망이다.", "source": "Data Center Dynamics", "date": "2026-09-04 02:02", "url": "https://www.datacenterdynamics.com/en/news/india-mulls-removal-of-legacy-chinese-telecoms-kit-report/", "category": "policy", "importance": 5, "wl": false, "topic": "인도 화웨이 장비 철수"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "도이치텔레콤이 세대교체의 일환으로 AWS 출신 호프마이어를 영입해 AI 및 네트워크 역량을 강화하고 CFO 퇴임 등 광범위한 경영진 물바꿈을 단행했다. 클라우드 전문 인사의 전면 배치를 통해 차세대 통신 인프라 혁신을 도모하고 있다. 유럽 거대 통신사의 리더십 변화로서 업계 판도에 중대한 영향을 미친다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 임원인사"}, {"title": "Elliott's Telekom Gambit Puts a €70bn Activist Against Bonn's US Merger Ambitions - AD HOC", "summary": "700억 유로 규모의 자산을 운용하는 행동주의 펀드 엘리엇이 본사의 미국 합병 야망에 맞서 도이치텔레콤을 상대로 거대한 도박에 나섰다. 글로벌 통신 거인의 전략적 M&A를 저지하려는 헤지펀드와 경영진 간의 전면전이 벌어지고 있다. 통신 업계 전체의 판도를 좌우할 수 있는 대형 거버넌스 이슈이다.", "source": "AD HOC NEWS", "date": "2026-09-04 01:41", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/elliott-s-telekom-gambit-puts-a-70bn-activist-against-bonn-s-us-merger/70050413", "category": "other", "importance": 4, "wl": false, "topic": "도이치텔레콤 인수합병"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - AD HOC NEWS", "summary": "버라이즌 커뮤니케이션스의 주가가 프론티어 거래와 최고경영자 교체 소식에 힘입어 상승세를 보였다. 이번 인수합병과 리더십 변화는 통신 시장 내에서 버라이즌의 경쟁력을 강화할 전망이다. 대형 통신사의 전략적 움직임으로서 업계의 주목을 받고 있다. 향후 네트워크 인프라 확장과 경영 효율성 제고에 기여할 것으로 기대된다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "contract", "importance": 4, "wl": false, "topic": "버라이즌 인수합병"}, {"title": "LIG아큐버, LG유플러스와 291억원 규모 Core Probe 공급 계약 - 데이터투자", "summary": "LIG아큐버가 LG유플러스와 291억 원 규모의 Core Probe 공급 계약을 체결했다. 통신 장비 및 솔루션 조달과 관련된 대규모 계약 건이다.", "source": "데이터투자", "date": "2026-09-03 17:27", "url": "https://www.datatooza.com/article/20260903172751600752ef3ef162_80", "category": "contract", "importance": 4, "wl": false, "topic": "lg유플러스 수주"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - press9.kr", "summary": "SK텔레콤과 LG유플러스 등 국내 이동통신사들이 그간 축소해왔던 네트워크 투자를 다시 늘릴 가능성이 제기되고 있다. 5G SA 단독모드 고도화와 향후 주파수 경매 일정이 주요 변수로 작용할 전망이다. 국내 통신 인프라 투자 사이클의 전환점이 될지 주목된다.", "source": "press9.kr", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "policy", "importance": 4, "wl": false, "topic": "국내 통신사 망투자 재개"}, {"title": "Deutsche Telekom Builds New Leadership Team to Drive €30 Billion Fiber, 5G, Cloud and AI S", "summary": "독일 도이치텔레콤이 300억 유로 규모의 광랜, 5G, 클라우드 및 AI 인프라 투자를 진두지휘할 새로운 경영진 리더십 팀을 구축했다. 유럽 최대 통신사의 대규모 네트워크 전환 투자를 총괄할 조직 정비가 마무리되었다. 유럽 통신 인프라 시장 전반에 미치는 파급효과가 클 것으로 보인다.", "source": "TelecomLead", "date": "2026-09-02 21:16", "url": "https://telecomlead.com/telecom-services/deutsche-telekom-builds-new-leadership-team-to-drive-e30-billion-fiber-5g-cloud-and-ai-strategy-127564", "category": "contract", "importance": 4, "wl": false, "topic": "도이치텔레콤 리더십 개편"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "일본 KDDI가 6G 후보 주파수인 7GHz 대역에서 세계 최고 수준인 3.6 Gbps 속도의 야외 무선 전송에 성공했다고 발표했다. 차세대 이동통신 상용화를 위한 핵심 주파수 대역의 기술 실증에서 유의미한 성과를 거뒀다. 글로벌 통신사들의 6G 주파수 확보 및 기술 경쟁이 가속화되고 있다.", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g 야외 전송"}, {"title": "Verizon advances its Carrier Ethernet standing amidst M&A market shuffle - lightwaveonline", "summary": "버라이즌이 통신 시장의 인수합병 물결 속에서 캐리어 이더넷 시장 내 입지를 한층 강화하고 있다. 기업용 네트워크 서비스 경쟁력을 높이기 위한 전략적 행보다. 북미 유선 통신 시장의 점유율 확대에 기여하고 있다.", "source": "lightwaveonline.com", "date": "2026-09-04 05:53", "url": "https://www.lightwaveonline.com/home/article/55403011/verizon-advances-its-carrier-ethernet-standing-amidst-ma-market-shuffle", "category": "contract", "importance": 3, "wl": false, "topic": "버라이즌 캐리어 이더넷"}, {"title": "T-Mobile sets CFO transition", "summary": "미국 통신사 T-Mobile은 쉘의 전 최고재무책임자(CFO)인 제시카 울을 2027년 2월 새로운 CFO로 선임한다고 발표했다. 현 CFO인 피터 오스발딕은 2027년 7월 1일 예정된 퇴직 전까지 전략 자문가로 활동할 예정이다. 이번 최고재무책임자 교체는 통신사의 장기적인 재무 전략과 리더십 변화를 보여주는 사례이다.", "source": "Light Reading", "date": "2026-09-04 05:49", "url": "https://www.lightreading.com/finance/t-mobile-sets-cfo-transition", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원"}, {"title": "[통신3사 AI 경량화] KT, 기업용 AI 크기 세분화…‘B2B’ 전략 : 네이버 블로그 - blog.naver.com", "summary": "KT가 기업용 인공지능(AI)의 크기를 세분화하여 B2B 시장을 공략하는 맞춤형 AI 전략을 추진하고 있다. 기업 고객의 다양한 수요에 맞춰 경량화된 AI 모델을 제공함으로써 기업용 솔루션 경쟁력을 높이려 한다. 통신사의 B2B 디지털 전환 및 AI 서비스 전략을 보여준다.", "source": "blog.naver.com", "date": "2026-09-04 05:40", "url": "https://blog.naver.com/PostView.naver?blogId=dealsite&logNo=224399940686&redirect=Dlog", "category": "tech", "importance": 3, "wl": false, "topic": "kt 인공지능"}, {"title": "Shell’s former finance chief is set to lead T-Mobile’s finances in 2027 - Stock Titan", "summary": "쉘의 전직 재무정책 총괄 임원이 오는 2027년부터 티모바일의 재무 부문을 이끌 새로운 최고재무책임자로 합류할 예정이다. 대형 통신사의 핵심 경영진 교체를 통해 미래 재무 전략을 정비하는 인사 조치다.", "source": "Stock Titan", "date": "2026-09-04 05:08", "url": "https://www.stocktitan.net/news/TMUS/t-mobile-announces-planned-chief-financial-officer-ocasik76f1w8.html", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 재무 책임자 영입"}, {"title": "SK Telecom’s Topda turns work vans into an AI inspection fleet", "summary": "SK텔레콤이 일반 업무용 차량을 AI 검사 함대로 탈바꿈시키는 AI 기반 검사 시스템 '탑다(Topda)'를 상용화했다. 기술자의 일상적인 이동 경로를 활용해 유선 네트워크 시설을 자동으로 점검할 수 있는 시스템이다. 통신망 유지보수 분야의 인공지능 전환(AX) 모범 사례를 제시한다.", "source": "RCR Wireless", "date": "2026-09-04 01:56", "url": "https://rcrwireless.com/20260903/tech/sk-telecoms-topda", "category": "tech", "importance": 3, "wl": true, "topic": "sk텔레콤 ai"}, {"title": "VodafoneThree unveils SuperMobile 5G+ national network slice service - Data Center Dynamic", "summary": "보다폰 쓰리가 기업 및 특화 시장을 겨냥한 슈퍼모바일 5G+ 전국망 네트워크 슬라이싱 서비스 전용 상품을 공개했다. 단독모드(SA) 기반으로 특정 산업군에 맞춤형 품질과 속도를 보장하는 인프라 서비스이다. 통신사의 기업간거래(B2B) 5G 사업 확대를 보여준다.", "source": "Data Center Dynamics", "date": "2026-09-04 01:37", "url": "https://www.datacenterdynamics.com/en/news/vodafonethree-unveils-supermobile-5g-national-network-slice-service/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰스리 5g슬라이싱"}, {"title": "Telus allegedly misled B.C. watchdog over cancellation fee investigation - MobileSyrup", "summary": "텔러스가 해지 수수료 조사 과정에서 브리티시컬럼비아주 규제 당국을 오도했다는 의혹이 제기되어 논란이 되고 있다. 통신사의 소비자 계약 관행과 규제 준수 여부가 도마 위에 올랐다. 통신 사업자의 컴플라이언스와 규제 리스크를 보여주는 사례이다.", "source": "MobileSyrup", "date": "2026-09-04 01:11", "url": "https://mobilesyrup.com/2026/09/03/telus-allegedly-misled-bc-watchdog-cancellation-fees/", "category": "policy", "importance": 3, "wl": false, "topic": "텔러스 규제조사"}, {"title": "VodafoneThree revs 5G SA engine with SuperMobile pitched as competitive edge - telcotitans", "summary": "보다폰 쓰리(VodafoneThree)가 '슈퍼모바일'을 경쟁 우위 요소로 내세우며 5G 단독모드(SA) 네트워크 엔진 가동에 박차를 가하고 있다. 고품질의 5G SA 서비스를 통해 가입자들에게 차별화된 연결 경험을 제공하려 한다. 통신사들의 상용 5G 고도화 경쟁을 보여주는 사례이다.", "source": "telcotitans.com", "date": "2026-09-04 00:51", "url": "https://www.telcotitans.com/vodafonewatch/vodafonethree-revs-5g-sa-engine-with-supermobile-pitched-as-competitive-edge/10838.article", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰스리 5g sa"}, {"title": "European Stocks Muted as Deutsche Telekom Gains on Elliott Stake - bloomberg.com", "summary": "유럽 주식시장이 보합세를 보이는 가운데 도이치텔레콤은 엘리엇의 지분 매입 소식에 힘입어 주가가 상승했다. 주주 행동주의가 대형 통신주의 주가 흐름에 즉각적인 호재로 작용했다. 시장의 뜨거운 관심을 반영한다.", "source": "bloomberg.com", "date": "2026-09-04 00:51", "url": "https://www.bloomberg.com/news/articles/2026-09-03/european-stocks-muted-as-deutsche-telekom-gains-on-elliott-stake", "category": "other", "importance": 3, "wl": false, "topic": "도이치텔레콤 주가동향"}, {"title": "Ciena sees AI driving multi-year optical infrastructure investment cycle", "summary": "시에나는 인공지능(AI)이 장거리 네트워크부터 데이터센터 패브릭에 이르기까지 광 네트워크 인프라의 다년간에 걸친 재아키텍처를 주도하고 있다고 밝혔다. AI로 인한 대역폭 수요 급증이 광 connectivity의 중요성을 높이고 있다. 통신 장비 및 광 전송망 시장의 구조적 변화를 시사한다.", "source": "RCR Wireless", "date": "2026-09-04 00:25", "url": "https://rcrwireless.com/20260903/connectivity/ciena-ai-optical", "category": "tech", "importance": 3, "wl": true, "topic": "시에나 ai"}, {"title": "VodafoneThree intros tiered 5G SA slicing portfolio for consumers, enterprises, critical s", "summary": "보다폰쓰리가 영국에서 소비자와 기업을 위한 계층형 5G SA 슬라이싱 서비스 포트폴리오를 출시했다. 인터넷 TV 서비스와 결합된 패스트트랙 네트워크 슬라이싱을 통해 맞춤형 연결성을 제공한다. 5G 단독모드 기반의 상용 서비스 다각화를 보여준다.", "source": "RCR Wireless", "date": "2026-09-04 00:21", "url": "https://rcrwireless.com/20260903/5g/vodafonethree-tiered-5g-sa-slicing-enterprises-critical-services", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 5g"}, {"title": "Vodafone Follows Bharti Airtel: 5G Network Slicing Live with Minimum 15 Mbps Speeds - Tele", "summary": "보다폰이 바르티 에어텔의 뒤를 이어 최소 15 Mbps 속도를 보장하는 5G 네트워크 슬라이싱 상용 서비스를 개시했다. 5G 단독모드(SA) 인프라를 활용하여 기업 및 특화 서비스에 차별화된 품질을 제공한다. 통신사의 고급 네트워크 기능 상용화 확대를 보여주는 기술 동향이다.", "source": "TelecomTalk", "date": "2026-09-04 00:05", "url": "https://telecomtalk.info/vodafone-follows-airtel-5g-network-slicing-live/1011530/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 5g 네트워크슬라이싱"}, {"title": "Spectrum expands college athletics partnerships with Wisconsin, South Carolina and TCU as ", "summary": "스펙트럼이 위스콘신, 사우스캐롤라이나, TCU 등과의 대학 스포츠 파트너십을 광범위하게 확대했다. 지역 대학과의 제휴를 통해 마케팅을 강화하고 서비스 가입을 유도하려는 전략이다. 미디어 및 브로드밴드 결합 서비스의 마케팅 활동이다.", "source": "Traders Union", "date": "2026-09-03 22:45", "url": "https://tradersunion.com/news/stocks/show/3208362-charter-communications-stock-jumps-8-7percent/", "category": "contract", "importance": 3, "wl": false, "topic": "스펙트럼 파트너십"}, {"title": "VodafoneThree launches upgraded 5G service available at extra charge - Belfast Telegraph", "summary": "보다폰 쓰리가 추가 요금을 지불하는 가입자들을 대상으로 업그레이드된 5G 서비스를 공식 출시했다. 고품질 무선 데이터 서비스에 대한 차등화된 과금 모델을 도입하여 수익성 개선을 꾀하고 있다. 통신사의 5G 서비스 상용화 전략을 보여준다.", "source": "Belfast Telegraph", "date": "2026-09-03 22:34", "url": "https://www.belfasttelegraph.co.uk/business/uk-world/vodafonethree-launches-upgraded-5g-service-available-at-extra-charge/a/160926366.html", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰스리 5g서비스"}, {"title": "AT&T tops Ethernet Leaderboard amid shakeup – Vertical Systems - lightreading.com", "summary": "AT&T가 버티컬 시스템즈의 이더넷 리더보드 순위 개편 속에서 업계 선두 자리를 유지했다. 기업용 네트워크 및 이더넷 서비스 부문에서 경쟁력을 입증한 결과다. 법인 통신 시장에서의 입지를 재확인했다.", "source": "lightreading.com", "date": "2026-09-03 22:00", "url": "https://www.lightreading.com/broadband/at-t-tops-ethernet-leaderboard-amid-ranking-shakeup-vertical-systems", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 이더넷 리더보드"}, {"title": "KT, CU 편의점의 디지털 사이니지 광고 운영 - 디지털경제뉴스", "summary": "KT가 CU 편의점의 디지털 사이니지 광고 운영 사업을 진행한다. 통신사의 미디어 및 광고 플랫폼 진출 사례이다.", "source": "디지털경제뉴스", "date": "2026-09-03 21:38", "url": "https://www.denews.co.kr/news/articleView.html?idxno=42316", "category": "other", "importance": 3, "wl": false, "topic": "kt 광고"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": "영국 버진미디어오투(VMO2)가 북아일랜드 지역에 5G 단독모드(SA) 서비스를 도입했다. 이와 함께 SMS 블래스터 차단 및 오렌지의 프라이빗 5G 인프라 커버리지 확대, 노키아의 새로운 API 고객 확보 소식이 전해졌다. 유럽 통신사들의 5G SA 전환 및 부가 서비스 경쟁이 본격화되고 있다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 3, "wl": true, "topic": "버진모바일 5g"}, {"title": "Airtel ARPU Could Hit Rs 325 by FY29 - TelecomTalk", "summary": "바르티 에어텔의 ARPU가 향후 수년간 가파르게 상승하여 높은 수준을 기록할 것이라는 시장 보고서이다. 인도 통신 시장의 요금 현실화와 데이터 소비 증가가 실적 성장을 견인하고 있다. 통신사들의 설비 투자 여력과 직결되는 재무 지표이다.", "source": "TelecomTalk", "date": "2026-09-03 19:55", "url": "https://telecomtalk.info/airtel-arpu-could-hit-rs-325-by-fy29/1011523/", "category": "earnings", "importance": 3, "wl": false, "topic": "바르티에어텔 실적전망"}, {"title": "LS일렉트릭, KT클라우드와 AIDC 전력 인프라 협력 - dt.co.kr", "summary": "LS일렉트릭이 KT클라우드와 손잡고 AI 데이터센터 전력 인프라 협력을 추진한다. 데이터센터 전력 확보를 위한 협력이다.", "source": "dt.co.kr", "date": "2026-09-03 19:21", "url": "https://www.dt.co.kr/article/12081856", "category": "other", "importance": 3, "wl": false, "topic": "kt 클라우드"}, {"title": "Vietnam shuts down its 2G networks nationwide - mediasat.info", "summary": "베트남이 전국적으로 2G 통신망 서비스를 공식 종료했다. 통신사의 네트워크 세대 전환 및 레거시 망 철수 사례이다.", "source": "mediasat.info", "date": "2026-09-03 19:17", "url": "https://mediasat.info/en/2026/09/03/vietnam-shuts-down-its-2g-networks-nationwide/", "category": "tech", "importance": 3, "wl": false, "topic": "베트남 통신사"}, {"title": "Orange plans new subsea cable linking La Reunion to South Africa - Developing Telecoms", "summary": "프랑스 통신사 오렌지(Orange)가 레위니옹섬과 남아프리카공화국을 연결하는 신규 해저 케이블 구축 계획을 발표했다. 국제 데이터 트래픽 수요 증가에 대응하고 아프리카 지역의 네트워크 백본 연결성을 강화하기 위한 인프라 투자이다. 대형 통신사의 해저 케이블 프로젝트로 장비 및 건설 수요를 창출한다.", "source": "Developing Telecoms", "date": "2026-09-03 18:52", "url": "https://developingtelecoms.com/telecom-business/operator-news/20774-orange-plans-new-subsea-cable-linking-la-reunion-to-south-africa.html", "category": "contract", "importance": 3, "wl": false, "topic": "오렌지 해저케이블"}, {"title": "KT, 에이전틱 AI 맞춤 데이터 체계 구축…AX 플랫폼 전환 가속 - 블로터", "summary": "KT가 에이전틱 AI 맞춤 데이터 체계를 구축하고 AX 플랫폼 전환을 가속화한다. 통신사의 인공지능 및 디지털 전환 전략이다.", "source": "블로터", "date": "2026-09-03 18:30", "url": "https://www.bloter.net/news/articleView.html?idxno=672638", "category": "other", "importance": 3, "wl": false, "topic": "kt ai"}, {"title": "VodafoneThree declares 5G network slicing war on BT", "summary": "보다폰쓰리가 BT를 상대로 5G 네트워크 슬라이싱 경쟁을 선언했다. 새로 출시된 슈퍼모바일 요금제는 BT의 동등한 서비스에는 없는 보증 기능을 제공하며 가입자 유치에 나섰다. 통신사 간 차별화된 5G 슬라이싱 서비스 경쟁이 치열해지고 있다.", "source": "Light Reading", "date": "2026-09-03 18:23", "url": "https://www.lightreading.com/5g/vodafonethree-declares-5g-network-slicing-war-on-bt", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰 5g"}, {"title": "울산 시내버스 762대 차세대 와이파이로 전면 교체", "summary": "울산시는 구축 시기에 따라 서로 다른 장비 로 운영돼 온 시내버스 762대의 노후 와이파이 장비 를 철거하고, 5세대 이동통신( 5G ) 백홀 기반의 와이파이 7 장비 를 설치한다. 백홀은 통신사 기지국의 백본망과 버스 내부...", "source": "iusm.co.kr", "date": "2026-09-03 18:20", "url": "https://www.iusm.co.kr/news/articleView.html?idxno=1067423", "category": "exec", "importance": 3, "wl": false, "topic": ""}, {"title": "'독파모' 탈락 네이버클라우드, SKT 제치고 ‘보안 AI’ 낙점 - 디일렉", "summary": "정부 보안 AI 사업 수주전에서 네이버클라우드가 탈락한 가운데 KT가 SK텔레콤을 제치고 ‘보안 AI’ 사업자로 최종 낙점되었다. 공공 및 기업 보안 분야에서 통신사 주도의 인공지능 솔루션 경쟁력을 입증한 대형 수주 성과이다. 국내 통신사 간의 AI 인프라 및 서비스 수주 구도를 보여주는 주요 사안이다.", "source": "디일렉", "date": "2026-09-03 18:18", "url": "https://www.thelec.kr/news/articleView.html?idxno=61789", "category": "contract", "importance": 3, "wl": false, "topic": "kt 보안ai"}, {"title": "티빙 개인정보 유출 보상 1인당 2만원… SKT와 비슷 - IT조선", "summary": "티빙의 개인정보 유출 보상금과 과거 SK텔레콤의 사례를 비교하는 보안 관련 보도이다. 통신 서비스 보안 및 개인정보 관련 동향이다.", "source": "IT조선", "date": "2026-09-03 18:01", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169458", "category": "other", "importance": 3, "wl": false, "topic": "sk텔레콤 보안"}, {"title": "Orange acquires Dome platform to expand secure private 5G - Mobile Europe", "summary": "프랑스 통신사 오렌지가 기업용 보안 프라이빗 5G 서비스 포트폴리오를 확장하기 위해 돔(Dome) 플랫폼을 인수했다. 기업 고객을 위한 안전하고 맞춤화된 사설 무선 네트워크 구축 역량을 강화하는 조치이다. 통신사들의 B2B 5G 및 특화망 사업 경쟁력을 높이는 인수합병이다.", "source": "Mobile Europe", "date": "2026-09-03 17:41", "url": "https://www.mobileeurope.co.uk/orange-dome-acqusition/", "category": "contract", "importance": 3, "wl": false, "topic": "오렌지 프라이빗5g"}, {"title": "Deutsche Telekom competitors slow fibre investments in 2025 as costs rise - Telecompaper", "summary": "도이치텔레콤의 경쟁사들이 비용 상승과 경제적 압박으로 인해 2025년 광섬유(Fibre) 인프라 투자를 둔화시키고 있다. 유럽 통신 시장 전반의 인프라 투자 정체 국면을 보여주는 조사 결과이다. 장비 공급업체들의 유럽 내 수주 환경에 부정적인 요인으로 작용할 수 있다.", "source": "Telecompaper", "date": "2026-09-03 17:28", "url": "https://www.telecompaper.com/news/deutsche-telekom-competitors-slow-fibre-investments-in-2025-as-costs-rise--1581594", "category": "other", "importance": 3, "wl": false, "topic": "유럽 통신사 광랜투자"}, {"title": "Deutsche Telekom reshuffles leadership team - Mobile Europe", "summary": "도이치텔레콤이 새로운 최고재무책임자와 제품 책임자들을 임명하며 리더십 팀을 대대적으로 개편했다. 경영진 쇄신을 통해 급변하는 글로벌 통신 환경에 대응하고 조직의 실행력을 높이려 한다. 주요 통신사의 인적 쇄신 동향이다.", "source": "Mobile Europe", "date": "2026-09-03 17:21", "url": "https://www.mobileeurope.co.uk/deutsche-telekom-appointments-leadership/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 조직개편"}, {"title": "[DD퇴근길] 네이버, SKT 제치고 K-미토스 사업 선정 - 디지털데일리", "summary": "네이버가 SK텔레콤을 제치고 K-미토스 사업 사업자로 선정되었다는 소식이다. 통신사 관련 정부 사업 선정 동향을 보여준다.", "source": "디지털데일리", "date": "2026-09-03 17:00", "url": "https://www.ddaily.co.kr/page/view/2026090313564434970", "category": "contract", "importance": 3, "wl": false, "topic": "sk텔레콤 사업"}, {"title": "\"은행·증권·보험·연금 한눈에\"…해빗팩토리, SKT 손잡고 ‘금융 AI’ 출격 - 조세일보", "summary": "해빗팩토리가 SK텔레콤과 손잡고 금융 AI 서비스를 출시한다. 통신사의 AI 기술을 활용한 제휴 서비스 협력 동향이다.", "source": "조세일보", "date": "2026-09-03 15:05", "url": "https://m.joseilbo.com/news/view.htm?newsid=575025", "category": "other", "importance": 3, "wl": false, "topic": "sk텔레콤 금융"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 AWS의 얀 호프마이어를 차기 최고기술책임자(CTO)로 영입했다. 글로벌 클라우드 기업 출신의 인재를 영입함으로써 네트워크 가상화 및 클라우드 전환 전략에 속도를 낼 것으로 전망된다. 통신사의 기술 리더십 강화 방안의 일환이다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true  "url": "https://www.yna.co.kr/view/AKR20260902171200057?input=1195m", "category": "exec", "importance": 3, "wl": false, "topic": ""}, {"title": "울산 시내버스 와이파이 끊김 없이 더 빨라진다…762대 장비 교체", "summary": "울산시는 그동안 구축 시기에 따라 서로 다른 장비 로 운영해 온 시내버스의 노후 와이파이를 철거하고 5G 백홀 기반 장비 로 바꾼다. 백홀은 통신사 기지국 네트워크와 버스 단말기(AP)를 잇는 전송로를 말한다. 시는...", "source": "news1.kr", "date": "2026-09-03 09:00", "url": "https://www.news1.kr/local/ulsan/6278080", "category": "exec", "importance": 3, "wl": false, "topic": ""}, {"title": "VodafoneThree Takes Aim at EE With “Up to 4x Faster” 5G+ Plans - Tech Advisor", "summary": "영국 보다폰쓰리가 경쟁사 EE를 겨냥해 최대 4배 빠른 속도를 내세운 새로운 5G+ 요금제 출시를 발표했다. 통신사 간 가입자 유치 경쟁이 초고속 5G 서비스 중심으로 심화되고 있다.", "source": "Tech Advisor", "date": "2026-09-03 08:02", "url": "https://www.techadvisor.com/article/3225803/vodafonethree-takes-aim-at-ee-with-up-to-4x-faster-5g-plans.html", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰쓰리 5g 요금제"}, {"title": "CHTR Stock Pops As Spectrum, Cox, Liberty Deals Reshape Charter - timothysykes.com", "summary": "스펙트럼, 콕스, 리버티 등의 대형 딜과 제휴 소식이 차터의 주가 상승을 견인하며 업계 판도를 재편하고 있다. 케이블 및 브로드밴드 사업자 간의 규모의 경제 확보와 번들링 전략이 가속화되고 있다. 유선 통신 시장의 합종연횡 트렌드를 보여주는 중요 동향이다.", "source": "timothysykes.com", "date": "2026-09-03 05:47", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02-2/", "category": "contract", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션스 인수합병"}, {"title": "TELUS (TSX:T) Dividend Strategy Shifts Toward Deleveraging - Kalkine Media", "summary": "텔러스가 배당 전략의 초점을 주주 환원에서 부채 축소(Deleveraging)로 전환하고 있다. 고금리 환경 속에서 재무 건전성을 확보하고 대차대조표를 개선하기 위한 경영 전략의 변화이다. 통신사의 자본 지출 및 투자 여력에 영향을 미치는 중요 재무 사안이다.", "source": "Kalkine Media", "date": "2026-09-03 04:51", "url": "https://kalkinemedia.com/ca/stocks/communication/telus-tsxt-dividend-strategy-shifts-toward-deleveraging", "category": "other", "importance": 3, "wl": false, "topic": "텔러스 재무전략"}, {"title": "CHTR Stock Rises As Spectrum Bets On Scale And Prime - StocksToTrade", "summary": "스펙트럼이 규모의 경제와 프라임 서비스에 집중하는 전략을 채택하면서 차터의 주가가 상승했다. 가입자 기반을 확대하고 미디어 스트리밍 결합 상품을 강화하여 경쟁력을 높이려 한다. 케이블 브로드밴드 사업자의 사업 재편 방향을 보여준다.", "source": "StocksToTrade", "date": "2026-09-03 04:03", "url": "https://stockstotrade.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "other", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션스 전략"}, {"title": "Spectrum COO Nick Jeffery Touts \"The Great Cable Comeback\" As He Assumes Charter Exec Post", "summary": "스펙트럼의 최고운영책임자(COO) 닉 제프리가 차터의 경영진직을 맡으며 '위대한 케이블의 부활'을 선언했다. 케이블 방송 및 초고속인터넷 사업자의 경쟁력 강화를 위한 경영진 개편과 전략 방향을 담고 있다. 유선 브로드밴드 시장에서의 가입자 방어 및 서비스 혁신 의지를 보여준다.", "source": "deadline.com", "date": "2026-09-03 01:43", "url": "https://deadline.com/2026/09/charter-spectrum-coo-nick-jeffery-great-cable-comeback-1237064469/", "category": "other", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션스 임원인사"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에 프라이빗 5G를 배포하기 위한 새로운 계획을 마련했으나, 구체적인 주파수 할당 계획은 포함되지 않았다. 산업용 5G 활성화를 추진하면서도 주파수 정책 측면의 한계가 지적되고 있다. 중국의 통신 규제 및 산업용 네트워크 구축 동향을 보여준다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 정부"}, {"title": "Vi Gets a New Look: Unveils 3D Brand Identity and Teases Major Transformation With Shah Ru", "summary": "보다폰 아이디어가 3D 브랜드 아이덴티티를 도입하고 샤룩 칸과 함께 대규모 기업 변화를 예고했다. 브랜드 리브랜딩을 통해 시장 내 입지를 다지고 가입자 이탈 방지에 총력을 기울이고 있다. 인도 통신사의 전략적 전환점을 보여준다.", "source": "PaidFreeDroid", "date": "2026-09-02 20:01", "url": "https://paidfreedroid.com/2026/09/vi-shah-rukh-khan-rebrand-3d-logo-network-change.html/amp", "category": "other", "importance": 3, "wl": false, "topic": "보다폰아이디어 브랜드개편"}, {"title": "Verizon deploys Frontline Crisis Response teams in Indiana, Hawaii - Telecompaper", "summary": "버라이즌이 인디애나주와 하와이에서 긴급 위기 대응 팀인 '프론트라인'을 배치했다. 재난 상황에서 공공안전     <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
