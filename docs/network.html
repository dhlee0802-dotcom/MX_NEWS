ajournal.com/news/articleView.html?idxno=386570", "category": "tech", "importance": 4, "sid": "satellite", "topic": "스페이스엑스 스타링크 우주혁신"}, {"title": "SoftBank gets upsized US$11.9 billion loan in OpenAI funding push - The Business Times", "summary": "소프트뱅크가 오픈AI 펀딩을 위해 119억 달러 규모의 대형 대출을 추가로 확보했다. 인공지능 분야에 대한 공격적인 투자를 이어가며 기술 생태계 장악에 주력하고 있다. 통신 및 투자 대기업의 행보로 업계 주목을 받고 있다.", "source": "The Business Times", "date": "2026-09-14 11:54", "url": "https://www.businesstimes.com.sg/companies-markets/softbank-gets-upsized-11-9-billion-loan-openai-funding-push", "category": "strategy", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 오픈ai 투자"}, {"title": "“600억 달러 뚫었다” ICT 수출 사상 최대… 무역수지도 첫 400억 달러 ...", "summary": "과기정통부와 산업통상자원부가 지난달 ICT 수출액이 전년 동월 대비 급증해 사상 최대치를 기록했다고 발표했다. 반도체 등 정보통신기술 품목의 수출 호조로 무역수지 흑자 달성을 이끌었다. 국가 ICT 산업의 수출 실적을 보여주는 핵심 지표다.", "source": "theopiniontimes.news", "date": "2026-09-14 11:22", "url": "https://theopiniontimes.news/600%ec%96%b5-%eb%8b%ac%eb%9f%ac-%eb%9a%ab%ec%97%88%eb%8b%a4-ict-%ec%88%98%ec%b6%9c-%ec%82%ac%ec%83%81-%ec%b5%9c%eb%8c%80-%eb%ac%b4%ec%97%ad%ec%88%98%ec%a7%80%eb%8f%84/", "category": "earnings", "importance": 4, "sid": "policy", "topic": "과기정통부 ict 수출 최대"}, {"title": "SATS Stock Jumps Overnight: EchoStar’s $11B SpaceX Exposure Sparks Retail IPO Proxy Frenzy", "summary": "위성통신 및 이동통신 사업자인 에코스타가 스페이스X와 연계된 110억 달러 규모의 익스포저를 바탕으로 시장의 폭발적인 관심을 받으며 IPO 대용 프록시 역할을 하고 있다. 위성통신 및 우주 산업 전반의 대규모 투자와 자본 유입을 보여주는 핵심 사건이다.", "source": "Stocktwits", "date": "2026-09-14 11:20", "url": "https://stocktwits.com/news-articles/markets/equity/sats-stock-echostars-11b-spacex-exposure-ipo-proxy/cZXr3CeRelg", "category": "contract", "importance": 4, "sid": "satellite", "topic": "에코스타 스페이스엑스 익스포저"}, {"title": "대한항공·아시아나, ‘ 스타링크 ’ 도입", "summary": "대한항공과 아시아나항공이 스페이스X의 '스타링크' 기반 초고속 기내 와이파이를 국내 최초로 도입하여 개조 작업을 마친 항공기부터 무료 서비스를 제공하기 시작한 소식을 다룬 기사이다. 저궤도 위성통신 서비스의 상용 도입을 보여준다.", "source": "koreadaily.com", "date": "2026-09-14 11:04", "url": "https://www.koreadaily.com/article/20260913190259651", "category": "contract", "importance": 4, "sid": "satellite", "topic": "대한항공 스타링크도입"}, {"title": "AI 투자 확대에 8월 ICT 수출 역대 최대", "summary": "과기정통부와 산업부가 발표한 8월 ICT 수출 동향에 따르면 AI 투자 확대로 인해 수출액이 599억 8000만 달러를 기록하며 호조를 보였습니다.", "source": "newsprime.co.kr", "date": "2026-09-14 11:04", "url": "http://www.newsprime.co.kr/news/article.html?no=747564", "category": "earnings", "importance": 4, "sid": "policy", "topic": "과기정통부 8월 ict 수출"}, {"title": "“북미 원전 통신 시장 공략” 일신이디아이, 에어스판과 전략적 협력", "summary": "일신이디아이가 미국 통신 장비 기업인 에어스판 네트웍스와 손잡고 북미 원전 시장을 공략한다고 밝혔다. 에어스판은 4G·5G 네트워크 솔루션을 보유하고 6G를 준비하는 기업으로, 양사의 전략적 협력을 다룬다.", "source": "etnews.com", "date": "2026-09-14 11:01", "url": "https://www.etnews.com/20260914000119", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에어스판네트웍스 협력"}, {"title": "[단독] 과기부총리, 통신3사 CEO와 17일 회동···\"AI·해저케이블·추석...", "summary": "과기정통부 부총리가 통신3사 CEO와 회동하여 AI 서비스 확산에 따른 데이터 처리량 증가와 통신망 고도화에 대응하기 위해 AI 기반 무선망(AI-RAN), 6G 등 차세대 기술 도입 및 투자 방향을 논의했다. 정부와 통신사의 핵심 네트워크 전략 협의이다.", "source": "enewstoday.co.kr", "date": "2026-09-14 10:31", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2470023", "category": "exec", "importance": 4, "sid": "carrier", "topic": "과기정통부 통신3사 ceo 회동"}, {"title": "[2027년도 예산안] 93조 늘린 '슈퍼예산'… 中企 성장사다리·AX·수출에...", "summary": "정부가 발표한 내년도 예산안에서 과기정통부의 AI 예산이 올해 5조 1000억원에서 9조 4000억원으로 84.3% 대폭 늘어났다. 대·중소기업 상생형 AX 모델 구축과 함께 국가 차원의 인공지능 전환(AX) 가속화에 막대한 재정이 투입된다. 슈퍼예산 편성을 통해 미래 성장동력 확보와 수출 경쟁력 강화를 도모한다는 방침이다. 차세대 기술 인프라 생태계 전반에 큰 파급효과가 예상된다.", "source": "kbiznews.co.kr", "date": "2026-09-14 10:14", "url": "http://www.kbiznews.co.kr/news/articleView.html?idxno=114821", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 2027년도 ai 예산"}, {"title": "[AX 혁신 대한민국, 2026] '동반자 AI' 국가전략, AX 대한민국 설계도 다...", "summary": "배경훈 과기정통부 장관이 참석한 가운데 AI 국가전략과 AX 대한민국 설계도를 논의하는 자리가 마련됐다. 과기정통부와 대통령실 AI미래기획수석, AI전략위로 구성된 정책 컨트롤타워 'AI삼각편대'가 본격적으로 재정비되었다. 국가 차원의 AI 경쟁력 확보와 혁신 생태계 조성을 위한 정책 집행이 한층 탄력을 받을 전망이다. 최고 수준의 정책적 실행력을 바탕으로 한 AI 대전환이 추진된다.", "source": "delighti.co.kr", "date": "2026-09-14 10:10", "url": "https://www.delighti.co.kr/news/articleView.html?idxno=121765", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 ai삼각편대 정책"}, {"title": "LG유플러스, 100MW AIDC도 모듈러로…5개사 연합해 ‘구축속도’ 높인다 - 업코리아", "summary": "LG유플러스가 100MW 규모의 AI 데이터센터(AIDC)를 모듈러 방식으로 구축하기 위해 5개사 연합과 협력하여 구축 속도를 높인다. 대규모 AI 인프라 투자 및 건설 프로젝트이다.", "source": "업코리아", "date": "2026-09-14 09:54", "url": "https://www.upkoreanews.kr/news/articleView.html?idxno=100208", "category": "contract", "importance": 4, "sid": "carrier", "topic": "엘지유플러스 데이터센터 구축"}, {"title": "인텔리안테크, NI와 409억원 위성통신 단말기 공급 계약…글로벌 국방시장 진출 - 전자신문", "summary": "인텔리안테크가 NI와 409억 원 규모의 위성통신 단말기 공급 계약을 체결했다. 이번 계약을 통해 글로벌 국방 시장 진출의 교두보를 마련하게 되었다. 고성능 위성통신 장비의 기술력을 입증하는 계기가 될 것으로 보인다.", "source": "전자신문", "date": "2026-09-14 09:12", "url": "http://www.etnews.com/20260914000027", "category": "contract", "importance": 4, "sid": "satellite", "topic": "인텔리안테크 위성통신 계약"}, {"title": "T-Mobile US Sees Broadband, AI Growth as CFO Osvaldik Plans 2027 Retirement - TradingView", "summary": "티모바일의 CFO 오스발디크가 2027년 퇴임 계획을 밝히고 브로드밴드 및 AI 성장 전략을 제시했다. 향후 재무 및 기술 투자의 방향성을 가늠할 수 있는 내용이다.", "source": "TradingView", "date": "2026-09-14 09:02", "url": "https://www.tradingview.com/news/marketbeat:4efecc6bf094b:0-t-mobile-us-sees-broadband-ai-growth-as-cfo-osvaldik-plans-2027-retirement/", "category": "exec", "importance": 4, "sid": "carrier", "topic": "티모바일 경영진 인사"}, {"title": "[더벨][유캐스트 IPO] 공모자금 60% 시설투자 배정, 양산전환 기반 마련", "summary": "유캐스트가 이동기지국 및 5G 특화망 사업 확대를 위해 생산 역량을 확보함.", "source": "thebell.co.kr", "date": "2026-09-14 08:02", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609101619550520106389", "category": "contract", "importance": 4, "sid": "competitor", "topic": "유캐스트 ipo"}, {"title": "Trump rejects calls from tech bosses for AI slowdown", "summary": "트럼프 대통령이 AI 개발 속도 조절을 요구하는 기술 기업 기술 동맹을 통해 차세대 통신 주도권을 확보하려는 전략의 일환이다. 향후 글로벌 6G 연구개발과 생태계 확장 가속화가 예상된다.", "source": "dailynews.lk", "date": "2026-09-14 04:42", "url": "https://dailynews.lk/2026/09/14/world/1038820/india-joins-us-led-6g-initiative-with-25-countries/", "category": "policy", "importance": 4, "sid": "satellite", "topic": "인도 6g 글로벌 연대"}, {"title": "TRAI Sets New Rules for AI Business Calls to Reduce Spam Blocking - Whalesbook", "summary": "인도 규제 당국이 스팸 차단을 줄이고 효율성을 높이기 위해 AI 기반 비즈니스 통화에 대한 새로운 규제 지침을 마련했다. 통신 규제 변화는 통신사의 서비스 운영과 인프라에 직접적인 영향을 미친다.", "source": "Whalesbook", "date": "2026-09-14 04:29", "url": "https://www.whalesbook.com/news/English/sebiexchange/TRAI-Sets-New-Rules-for-AI-Business-Calls-to-Reduce-Spam-Blocking/6aa6f38e75fe79b492e5cba8", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도통신규제위원회 ai 규제"}, {"title": "Vodafone Idea Secures ₹35,000 Crore Debt Led by SBI - Whalesbook", "summary": "보다폰 아이디어가 인도 최대 은행인 SBI가 주도하는 컨소시엄으로부터 35,000 크로어 규모의 대규모 부채 자금을 조달하는 데 성공했다. 대규모 자금 확보를 통해 재무구조 개선과 네트워크 투자 여력을 확보할 것으로 기대된다.", "source": "Whalesbook", "date": "2026-09-14 04:09", "url": "https://www.whalesbook.com/news/English/bankingfinance/Vodafone-Idea-Secures-indian-rupee35000-Crore-Debt-Led-by-SBI/6aa6f38e75fe79b492e5cba3", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰아이디어 대규모 부채"}, {"title": "T-Mobile US CEO Maps 5G, Broadband and AI Growth Strategy at Goldman Sachs Conference - Ya", "summary": "T-Mobile US CEO가 골드만삭스 컨퍼런스에서 5G, 광대역 인터넷, AI 성장 전략을 발표했습니다. 주요 통신사의 중장기 네트워크 고도화 및 신사업 청사진을 제시하는 내용입니다.", "source": "Yahoo Finance", "date": "2026-09-14 04:02", "url": "https://finance.yahoo.com/technology/ai/articles/t-mobile-us-ceo-maps-190200025.html", "category": "exec", "importance": 4, "sid": "carrier", "topic": "티모바일 ceo"}, {"title": "스페이스X, 스타십 배분 딜레마… 스타링크 냐 달·화성이냐", "summary": "스페이스X가 차세대 스타링크 위성 대량 발사와 NASA 달 착륙선 개발, AI 데이터센터 및 화성 개척 프로젝트 사이에서 스타십 발사 배분을 고심하고 있다. 저궤도 위성 인프라 대량 확충 계획과 관련된 전략적 딜레마를 보여준다.", "source": "g-enews.com", "date": "2026-09-14 04:00", "url": "https://www.g-enews.com/view.php?ud=202609132004221139a1f309431_1", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스페이스x 스타십 스타링크"}, {"title": "Vi eyes 35,000-crore loan to fund next decade's capex - The Economic Times", "summary": "보다폰 아이디어가 향후 10년간의 설비투자(Capex) 재원을 마련하기 위해 35,000코루(약 35,000억 루피) 규모의 대규모 대출 조달을 추진하고 있습니다. 인도 통신 시장에서 생존과 5G망 확충을 위한 막대한 자금 확보에 나섰습니다. 통신사의 대규모 자금 조달은 향후 네트워크 장비 발주와 인프라 투자의 직결되는 핵심 요인입니다. 보다폰 아이디어의 공격적인 망 투자 재원 마련 움직임을 보여주는 중대 사안입니다.", "source": "The Economic Times", "date": "2026-09-14 03:58", "url": "https://m.economictimes.com/industry/telecom/telecom-news/vi-eyes-35000-crore-loan-to-fund-next-decades-capex/articleshow/134220187.cms", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보더폰아이디어 투자"}, {"title": "ASTS Stock Slides Premarket: AT&T Says SpaceX And Amazon Could Rival AST SpaceMobile In Sa", "summary": "AT&T가 스페이스엑스와 아마존이 AST스페이스모바일의 강력한 라이벌이 될 수 있다고 언급하면서 ASTS 주가가 프레마켓에서 하락세를 보였습니다. 위성 직접통신(Direct-to-Cell) 시장의 경쟁 심화를 보여줍니다. 위성통신 부문의 중요 시장 동향입니다.", "source": "Stocktwits", "date": "2026-09-14 03:53", "url": "https://stocktwits.com/news-articles/markets/equity/asts-stock-slides-premarket-att-flags-spacex-amazon-as-rivals/cZBfYzqRebM", "category": "other", "importance": 4, "sid": "satellite", "topic": "ast스페이스모바일 주가 하락 및 위성 경쟁"}, {"title": "Trai moves to keep legit AI calls off spam list - economictimes.com", "summary": "TRAI가 합법적인 AI 통화가 스팸 목록에 포함되지 않도록 규정을 마련 중입니다. 통신사 규제 관련 보도입니다.", "source": "economictimes.com", "date": "2026-09-14 03:51", "url": "https://m.economictimes.com/industry/telecom/telecom-news/trai-moves-to-keep-legit-ai-calls-off-spam-list/articleshow/134219315.cms", "category": "policy", "importance": 4, "sid": "carrier", "topic": "trai 스팸방지"}, {"title": "Airtel, Jio allege unfair practices by Vi, seek intervention from Trai - Business Standard", "summary": "에어텔과 지오가 보다폰아이디어의 불공정 관행을 주장하며 TRAI에 공식 개입과 조사를 요구했다. 128번 기사의 동일 이슈다.", "s titor", "topic": "삼성전자 버라이즌 6g 센싱 기술 실증"}, {"title": "삼성전자, 버라이즌과 6G 기술 실증…AI로 군중 밀집도 분석 - insightkorea.co.kr", "summary": "삼성전자가 버라이즌과 공동으로 6G 기술 실증에 성공하며 AI를 통한 군중 밀집도 분석 기능을 선보였다. 통신과 센싱의 융합을 통해 네트워크 인프라의 가치를 극대화하는 데 성공했다. 실제 필드 환경에서 검증된 기술력을 바탕으로 향후 6G 표준화 경쟁에서 유리한 고지를 선점했다. 삼성의 글로벌 네트워크 사업 역량이 한층 돋보인다.", "source": "insightkorea.co.kr", "date": "2026-09-15 16:07", "url": "https://www.insightkorea.co.kr/news/articleViewAmp.html?idxno=254613", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성 버라이즌 6g isac 실증"}, {"title": "삼성전자, 통신망으로 군중 밀집 감지…美서 6G 기술 실증 - m-i.kr", "summary": "삼성전자가 미국 통신사 버라이즌과 함께 통신망으로 군중 밀집도를 감지하는 6G 기술 실증에 성공했습니다. 기지국을 고정밀 센서로 활용하는 AI 기반 ISAC 기술을 실제 망에 적용했습니다. 네트워크의 기능적 한계를 뛰어넘어 새로운 활용법을 제시한 의미 있는 성과입니다. 글로벌 통신 장비 시장에서 삼성전자의 기술적 위상을 높이고 있습니다.", "source": "m-i.kr", "date": "2026-09-15 14:37", "url": "https://www.m-i.kr/news/articleView.html?idxno=1414162", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성전자 6g 실증"}, {"title": "KDDI、27年にも衛星経由で音声通話 圏外解消へ次世代スターリンク活用 - BigGo ファイナンス", "summary": "KDDI가 2027년에 위성 경유 음성 통화를 도입하여 음영 지역을 해소하기 위해 차세대 스타링크를 활용한다. 위성통신 기반 커버리지 혁신을 추진하고 있다.", "source": "BigGo ファイナンス", "date": "2026-09-15 14:25", "url": "https://finance.biggo.jp/news/c207cb14-5136-4883-bb8e-af370e20490c", "category": "tech", "importance": 5, "sid": "satellite", "topic": "kddi 위성통신 서비스"}, {"title": "Samsung, Verizon Test Key 6G Technology on Existing 5G Network - Koreabizwire", "summary": "삼성전자 네트워크사업부와 버라이즌이 기존 5G 상용 네트워크 환경에서 핵심 6G 기술 시험을 성공적으로 완료했습니다. 가상화된 네트워크 기반에서 통신과 센싱을 동시에 수행하는 ISAC 기술을 실증했습니다. 양사는 글로벌 스포츠 이벤트 현장에서 모바일 네트워크를 AI 센서로 활용하는 혁신을 선보이며 차세대 통신 주도권 확보에 나섰습니다.", "source": "Koreabizwire", "date": "2026-09-15 12:04", "url": "http://koreabizwire.com/samsung-verizon-test-key-6g-technology-on-existing-5g-network/359183", "category": "contract", "importance": 5, "sid": "carrier", "topic": "삼성전자 버라이즌 6g 기술 시험"}, {"title": "圏外でも高速データ通信や音声通話が可能に KDDIが「Starlink Mobile V2」契約を締結 アジア初", "summary": " ", "date": "2026-09-15 08:29", "url": "https://www.ddaily.co.kr/page/view/2026091508284210354", "category": "contract", "importance": 5, "sid": "competitor", "topic": "삼성전자 버라이즌 가상화 망 isac 실증"}, {"title": "삼성전자, 150년 통신의 틀 깼다…美 버라이즌과 ‘6G 신기술’ 세계 첫 실증 - issuevalley.com", "summary": "삼성전자가 150년 통신의 틀을 깨고 미국 버라이즌과 함께 6G 신기술을 세계 최초로 현장 실증했다. 통신망을 고정밀 센서로 활용하는 AI 기반 ISAC 기술을 통해 인파 밀집도를 실시간으로 감지해 냈다. 전통적인 통신 인프라의 개념을 뒤바꾸는 혁신적인 성과로 글로벌 업계의 이목이 집중되었다. 차세대 통신 장비 시장에서 삼성전자의 압도적인 기술 리더십을 증명했다.", "source": "issuevalley.com", "date": "2026-09-15 08:24", "url": "https://www.issuevalley.com/news/articleView.html?idxno=56339", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성전자 버라이즌 세계 첫 실증"}, {"title": "삼성전자·버라이즌, AI 기반 6G ‘ISAC’ 현장 실증 - 강소기업뉴스", "summary": "삼성전자가 미국 통신사 버라이즌과 협력하여 인공지능(AI) 기반 6G 핵심 기술인 ISAC(통신·센싱 통합) 현장 실증을 세계 최초로 성공했다. 이번 실증은 통신망을 통해 군중 밀집도를 실시간 감지하는 등 통신망의 센싱 활용 가능성을 입증한 것이다. 삼성전자는 버라이즌과의 지속적인 기술 협력을 통해 차세대 6G 시장에서의 주도권을 강화하고 있다.", "source": "강소기업뉴스", "date": "2026-09-15 08:18", "url": "https://kangso.co.kr/ViewM.aspx?No=4227025", "category": "contract", "importance": 5, "sid": "competitor", "topic": "삼성전자 수주"}, {"title": "Mobile number portability row hints at a shift in market dynamics, say experts - TradingVi", "summary": "번호이동(MNP) 규정과 관련된 논란이 통신 시장의 역학 관계 변화를 시사하고 있다.", "source": "TradingView", "date": "2026-09-15 23:51", "url": "https://www.tradingview.com/news/moodys:4430d4807624b:0-mobile-number-portability-row-hints-at-a-shift-in-market-dynamics-say-experts/", "category": "policy", "importance": 4, "sid": "carrier", "topic": "보다폰아이디어 규제"}, {"title": "Can Nokia's DDoS Security Expansion in Spain Boost Its Profits? - Yahoo Finance", "summary": "노키아가 스페인 시장에서 DDoS 방어 등 네트워크 보안 솔루션 사업을 확장하며 새로운 수익원 창출에 나섰다. 사이버 공격 급증에 대응해 보안 솔루션을 핵심 포트폴리오로 육성하고 있다. 이번 확장은 유럽 전역 공급을 위한 교두보가 될 것으로 기대된다.", "source": "Yahoo Finance", "date": "2026-09-15 23:31", "url": "https://finance.yahoo.com/technology/ai/articles/nokias-ddos-security-expansion-spain-143100540.html", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 보안"}, {"title": "Can Verizon's 6G Acceleration Initiatives and AI Trials Drive Growth? - TradingView", "summary": "버라이즌의 6G 가속화 이니셔티브와 AI 기반 시험들이 향후 기업 성장을 견인할 수 있을지 분석했다. 통신 인프라 고도화와 신기술 도입이 버라이즌의 장기적 경쟁력에 미치는 영향을 조명했다. 삼성전자 등 주요 장비 파트너사들과의 협력이 핵심 동력으로 작용하고 있다. 북미 통신 시장의 투자 및 기술 트렌드를 보여준다.", "source": "TradingView", "date": "2026-09-15 23:28", "url": "https://www.tradingview.com/news/zacks:2d4499820094b:0-can-verizon-s-6g-acceleration-initiatives-and-ai-trials-drive-growth/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 혁신 포럼"}, {"title": "Russia finally launches 5G in major cities - Developing Telecoms", "summary": "러시아 주요 도시에서 마침내 5G 이동통신 서비스가 공식 상용화되었다. 장비 조달 제재 속 자체 인프라를 통한 서비스 확산 국면에 진입했다.", "source": "Developing Telecoms", "date": "2026-09-15 23:18", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20833-russia-finally-launches-5g-in-major-cities.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "러시아 주요도시 5g 상용화"}, {"title": "FCC updates Technology Advisory Council remit - Telecompaper", "summary": "FCC가 기술 자문 위원회의 임무를 업데이트함. 통신 정책 및 규제 관련 이슈임.", "source": "Telecompaper", "date": "2026-09-15 23:09", "url": "https://www.telecompaper.com/news/fcc-updates-technology-advisory-council-remit--1582741", "category": "policy", "importance": 4, "sid": "policy", "topic": "fcc 기술 자문 위원회"}, {"title": "European telecoms execs push back against planned Huawei crackdown - Euronews.com", "summary": "유럽 통신사 최고경영자(CEO)들이 유럽연합 차원에서 추진되는 중국산 화웨이 장비 규제 및 퇴출 움직임에 대해 공급망 차질과 비용 부담을 이유로 반대 목소리를 내고 있다. 주요국 장비 제재를 둘러싼 정책 갈등이다.", "source": "Euronews.com", "date": "2026-09-15 23:04", "url": "https://www.euronews.com/my-europe/2026/09/15/european-telecoms-execs-push-back-against-planned-huawei-crackdown", "category": "policy", "importance": 4, "sid": "policy", "topic": "유럽연합 화웨이규제반대"}, {"title": "Telxius and Nokia Deploy 800G O 드가 2031년까지 1GW 규모의 AI 데이터센터(AIDC) 인프라를 공급하겠다는 중장기 비전을 제시했다. 폭증하는 AI 인프라 수요에 대응하기 위한 통신 자회사의 대규모 인프라 투자 전략이다.", "source": "조선일보", "date": "2026-09-15 15:05", "url": "https://www.chosun.com/economy/tech_it/2026/09/15/HNOV7CG2SVCAPOQESSGYQ3G7HE/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai인프라"}, {"title": "누리호 5차 발사, 역대 최다 위성 15기 싣고 내달 7일 발사…초소형군집위성 첫선", "summary": "우주항공청과 한국항공우주연구원은 누리호 5차 발사에 역대 최다인 15기의 위성을 탑재해 내달 7일 발사한다고 밝혔다. 국내 첫 초소형군집위성 5기와 우주 기술 실증을 위한 큐브위성 10기가 실려 의약품 결정화, 우주 방사선, 광통신 등 다양한 임무를 수행한다. 한국의 독자 우주 발사 능력 고도화와 위성 군집 운용 역량을 입증하는 중요한 계기가 될 것이다. 국내 우주 산업의 기술적 진보를 보여주는 대형 이벤트다.", "source": "전자신문", "date": "2026-09-15 15:04", "url": "https://www.etnews.com/20260915000342", "category": "tech", "importance": 4, "sid": "satellite", "topic": "우주항공청 누리호 발사"}, {"title": "“경기장 인파, 통신망이 실시간으로 읽었다”…삼성전자·버라이즌, 6G ‘ISAC’ 업계 첫 실증 - 더게이트", "summary": "경기장 인파를 통신망이 실시간으로 읽어내는 6G ISAC 실증을 삼성전자와 버라이즌이 업계 최초로 성공했다. 상용 망 활용의 지평을 넓혔다.", "source": "더게이트", "date": "2026-09-15 15:03", "url": "http://www.spochoo.com/news/articleView.html?idxno=130064", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 경기장 인파 실증"}, {"title": "AI 결제 사고 막는다…SKT, 문자를 ‘최종 승인 버튼’으로 - economist.co.kr", "summary": "SK텔레콤이 AI 결제 오작동과 사고를 예방하기 위해 문자를 최종 승인 수단으로 사용하는 글로벌 표준을 제안했다.", "source": "economist.co.kr", "date": "2026-09-15 14:42", "url": "https://economist.co.kr/article/view/ecn202609150035", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai 결제 표준 제안"}, {"title": "Samsung and Verizon prove 6G ISAC at Texas venue, advancing AI-driven networks - CHOSUNBIZ", "summary": "삼성전자와 버라이즌이 텍사스 행사장 현장에서 6G ISAC 기술을 완벽하게 증명해 내며 AI 기반 네트워크의 발전상을 선보였다. 양사의 긴밀한 협력은 차세대 통신 표준 기술 확립에 핵심적인 역할을 하고 있다. 삼성의 기술 리더십을 다시 한번 각인시켰다.", "source": "Chosunbiz", "date": "2026-09-15 14:35", "url": "https://biz.chosun.com/en/en-it/2026/09/15/UEVTTKZSBJGG3HQJ2IXV7YTJ34/?outputType=amp", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 텍사스 6g isac 입증"}, {"title": "삼성전자, 버라이즌과 함께 6G 핵심 ‘통신·센싱 융합’ 현장 실증 - 조선비즈 - Chosunbiz", "summary": "삼성전자가 버라이즌과 함께 6G 핵심인 통신·센싱 융합 기술 현장 실증을 성공적으로 마쳤다. 양사 간 협력 관계가 기술 결실로 이어지고 있다.", "source": "Chosunbiz", "date": "2026-09-15 14:35", "url": "https://biz.chosun.com/it-science/ict/2026/09/15/RCOXGHJUWJCSHOIPQOKREBU73E/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 통신 센싱 융합 실증"}, {"title": "삼성·버라이즌, 통신망-센싱기술-AI로 인파 밀집도 실시간 확인 성공 - 한국일보", "summary": "삼성전자와 버라이즌이 통신망, 센싱 기술, AI를 결합해 인파 밀집도를 실시간 확인하는 데 성공했다. 융합 기술의 상용화 가능성을 높였다.", "source": "한국일보", "date": "2026-09-15 14:21", "url": "https://www.hankookilbo.com/news/article/A2026091511170001120", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 통신망 센싱 ai"}, {"title": "“AI 에이전트 거래, 문자로 확인하고 승인”… SKT, 글로벌 표준화 제안 - 조선비즈 - Chosunbiz", "summary": "SKT가 AI 에이전트 거래 시 문자로 확인하고 승인하는 방식을 제안하며 글로벌 표준화 논의를 이끌고 있다.", "source": "Chosunbiz", "date": "2026-09-15 14:09", "url": "https://biz.chosun.com/it-science/ict/2026/09/15/XAINYSCRBZBCJK2TTYIPLH5ZUE/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt ai메시징표준"}, {"title": "SKT·KT, 인천부터 지하철 와이파이 5G 전환 착수 - 전자신문", "summary": "SKT와 KT가 인천 지역을 시작으로 지하철 와이파이 및 기존 망의 5G 전환 작업에 착수했다. 국내 이동통신사의 인프라 고도화 및 품질 개선 투자다.", "source": "전자신문", "date": "2026-09-15 14:06", "url": "http://www.etnews.com/20260915000281", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt·kt 지하철 5g 전환"}, {"title": "삼성전자 6G 기술 주도권 선점 속도, 미국 버라이즌과 업계 최초 통신·센싱 융합기술 현장 실증 성공 - huffingtonpost.kr", "summary": "삼성전자가 미국 버라이즌과 업계 최초로 통신·센싱 융합기술 현장 실증에 성공하며 6G 기술 주도권 선점에 속도를 내고 있다. 글로벌 위상을 높이고 있다.", "source": "huffingtonpost.kr", "date": "2026-09-15 14:05", "url": "https://www.huffingtonpost.kr/article/260504", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 6g 기술 주도권 허핑턴포스트"}, {"title": "삼성전자, 버라이즌과 6G 'ISAC' 업계 첫 현장 실증⋯AI로 인파 읽었다 - finomy.com", "summary": "삼성전자가 버라이즌과 손잡고 업계 최초로 6G ISAC 현장 실증을 성공적으로 수행했 제공하고 있습니다. 승객들은 비행 중 고화질 영상 스트리밍 등을 이용할 수 있습니다. 글로벌 항공사의 저궤도 위성통신 도입 사례입니다.", "source": "sports.khan.co.kr", "date": "2026-09-15 00:56", "url": "https://sports.khan.co.kr/article/202609150055003?pt=nv", "category": "contract", "importance": 4, "sid": "satellite", "topic": "에어프랑스 스타링크"}, {"title": "6G Investment Race Begins as Telecom Operators Prepare Networks for 2030 - TelecomLead", "summary": "2030년 상용화를 목표로 통신 사업자들이 네트워크 준비에 돌입하면서 6G 투자 경쟁이 본격화되고 있다. 차세대 이동통신 기술 표준화와 인프라 구축 움직임이 빨라지는 추세다.", "source": "TelecomLead", "date": "2026-09-15 00:54", "url": "https://telecomlead.com/6g/6g-investment-race-begins-as-telecom-operators-prepare-networks-for-2030-127725", "category": "tech", "importance": 4, "sid": "satellite", "topic": "6g 인프라 투자"}, {"title": "Top 10 Mobile Network Deals of 2026: Ericsson, Nokia, Samsung and Huawei Lead 5G Investmen", "summary": "텔레콤리드가 2026년 주요 모바일 네트워크 거래 Top 10을 발표했다. 에릭슨, 노키아, 삼성, 화웨이가 5G 투자를 주도하고 있는 것으로 나타났다. 글로벌 통신장비 시장의 주요 수주 트렌드와 경쟁 구도를 보여준다.", "source": "TelecomLead", "date": "2026-09-15 00:47", "url": "https://telecomlead.com/telecom-equipment/top-10-mobile-network-deals-of-2026-ericsson-nokia-samsung-and-huawei-lead-5g-investment-cycle-127719", "category": "contract", "importance": 4, "sid": "competitor", "topic": "텔레콤리드 장비 계약"}, {"title": "AT&T Business, Amazon Leo Ink Deal to Expand Public Sector Connectivity - ExecutiveBiz", "summary": "AT&T 비즈니스가 아마존 Leo와 손잡고 공공 부문 연결성 확대를 위한 계약을 체결했다. 공공 기관과 정부 고객을 대상으로 안정적인 위성 브로드밴드 서비스를 제공하는 것이 목표다. 위성 통신 사업자와 대형 통신사 간 B2B 협력이 공공 시장으로 확장되고 있음을 보여준다. 차세대 위성 네트워크의 상용화 레퍼런스로 기능할 전망이다.", "source": "ExecutiveBiz", "date": "2026-09-15 00:42", "url": "https://www.executivebiz.com/articles/att-business-amazon-leo-satellite-connectivity-agreement", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 공공위성계약"}, {"title": "Viasat and Space42 Commit Up to $1 Billion to Shared D2D Satellite Platform Equatys - iotb", "summary": "비아셋과 스페이스42가 공유형 D2D 위성 플랫폼 '에쿼티스' 구축을 위해 최대 10억 달러를 투자하기로 약정했다. 양사는 위성 통신 서비스 확장을 위해 협력을 강화할 계획이다. 이번 투자는 차세대 위성 통신 시장의 경쟁 구도에 영향을 미칠 것으로 보인다.", "source": "iotbusinessnews.com", "date": "2026-09-15 00:33", "url": "https://iotbusinessnews.com/2026/09/14/viasat-and-space42-commit-up-to-1-billion-to-shared-d2d-satellite-platform-equatys/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "비아셋 투자"}, {"title": "AWS, Nvidia among new recruits for Verizon's 6G Innovation Forum", "summary": "버라이즌은 AWS, 시스코, 인텔, 엔비디아 등 주요 기술 기업들이 자사의 6G 혁신 포럼(6GIF)에 합류했다고 발표했다. 이번 파트너십을 통해 차세대 통신 인프라와 6G 기술 표준화 연구에 속도를 낼 계획이다. 글로벌 주요 통신장비 및 클라우드 기업들이 대거 참여하면서 생태계 확장이 기대된다. 이는 향후 6G 상용화 과정에서 주도권을 잡기 위한 전략적 행보로 분석된다.", "source": "Light Reading", "date": "2026-09-15 00:32", "url": "https://www.lightreading.com/6g/aws-nvidia-among-new-recruits-for-verizon-s-6g-innovation-forum", "category": "tech", "importance": 4, "sid": "satellite", "topic": "버라이즌 기술"}, {"title": "New CRTC rules aim to make internet plans easier to understand - MobileSyrup", "summary": "캐나다 CRTC의 새로운 규칙이 인터넷 요금제를 더 이해하기 쉽게 만드는 것을 목표로 시행됩니다. 통신 소비자 보호 및 규제 정책입니다.", "source": "MobileSyrup", "date": "2026-09-15 00:23", "url": "https://mobilesyrup.com/2026/09/14/crtc-new-internet-rules-easier-to-understand/", "category": "policy", "importance": 4, "sid": "policy", "topic": "캐나다방송통신규제위 인터넷규정"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視（1/2 ページ） - ITmedia Mobile - ITmedia", "summary": "NTT 도코모가 2027년도 내에 '5G 영역 = SA(단독모드) 대응 영역'으로 만들겠다는 목표를 선언했다. 단순 품질 순위 경쟁보다는 소비자가 체감하는 '체감 품질' 향상에 주력할 방침이다. 5G SA 전환을 가속화하여 네트워크 고도화를 추진하겠다는 전략적 방향을 제시했다. 일본 이동통신 시장의 네트워크 업그레이드 로드맵을 보여준다.", "source": "ITmedia", "date": "2026-09-15 00:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/15/news055.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "도코모 5g전략"}, {"title": "ドコモ「スマホが繋がらない」はどう解消される？ キーパーソンが語る2026年夏の通信品質改善の今とこれから", "summary": "NTT 도코모가 2022년 이후 제기된 통신 품질 저하 문제에 대응해 대규모 설비 투자와 기술적 대책을 지속해 온 현황을 다뤘다. 도코모는 체감 품질 향상을 최우선으로 두고 도심지 리소스 집중 및 800MHz帯 4G 전용 등을 추진 중이다. 외부 조사 순위보다 가입자 체감 품질 개선에 집중하겠다는 전략을 밝혔다. 통신사의 네트워크 품질 개선 투자 동향을 보여준다.", "source": "ケータイ Watch", "date": "2026-09-15 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/interview/2140815.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 품질"}, {"title": "クアルコム、次世代「Hexagon NPU」発表──なぜエージェント型AIに“全く異なる設計”が必要なのか", "summary": "퀄컴이 스마트폰 등에 탑재될 차세대 '헥사곤 NPU'의 개요를 공개하며 '단일 거대 AI'에서 '복수의 전문 AI 연동'으로 진화하는 에이전트형 AI에 맞춘 완전히 새로운 설계 방식을 도입했다고 밝혔습니다. 모바일 프로세서 및 AI 반도체 분야의 핵심 기술 발전 방향을 보여줍니다. 경쟁사의 플래그십급 칩셋 아키텍처 변경으로 업계에 큰 시사점을 줍니다. 통신 및 디바이스용 AI 하드웨어 경쟁력을 가늠하는 중요 기술 뉴스입니다.", "source": "ケータイ Watch", "date": "2026-09-15 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2140807.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "퀄컴 npu"}], "2026-09-16": [{"title": "DDoS attack targets Meo's international network - Telecompaper", "summary": "포르투갈 통신사 메오(Meo)의 국제 네트워크가 대규모 디도스(DDoS) 사이버 공격을 받아 트래픽 장애가 발생했다. 주요 통신사의 해외 연동망 마비로 서비스 이용에 차질이 빚어졌다.", "source": "Telecompaper", "date": "2026-09-16 23:38", "url": "https://www.telecompaper.com/news/ddos-attack-targets-meos-international-network--1582880", "category": "outage", "importance": 5, "sid": "outage", "topic": "메오 국제 네트워크 디도스 공격 장애"}, {"title": "China urges EU to avoid discriminatory restrictions after European telecom firms warn new ", "summary": "유럽 통신사들이 새로운 통신 장비 규제에 대해 경고 목소리를 낸 가운데, 중국 정부가 EU를 향해 차별적인 규제와 제한 조치를 피할 것을 강력히 촉구했다. 글로벌 통신 장비 시장에서 화웨이 등 중국산 장비 배제 움직임과 맞물려 지정학적 긴장이 고조되고 있다. 공급망 재편에 중대한 영향을 미치는 사안이다.", "source": "Global Times", "date": "2026-09-16 17:37", "url": "https://www.globaltimes.cn/page/202609/1370665.shtml", "category": "policy", "importance": 5, "sid": "policy", "topic": "중국정부 통신장비제재"}, {"title": "[단독]SKT·KT, 삼성에 5G 장비 '64TRx' 공급 요청 - etnews.com", "summary": "SK텔레콤과 KT가 삼성전자에 5G 장비인 '64TRx' 공급을 공식 요청한 것으로 확인됐다. 국내 이동통신사의 대규모 5G 고도화 투자에 발맞춰 삼성전자의 국내 장비 공급 물량이 대폭 확대될 전망이다. 네트워크사업부의 실적에 직접적인 영향을 미치는 대형 수주 성과다.", "source": "etnews.com", "date": "2026-09-16 15:19", "url": "https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYUpBNytPMStLVCt4WGtiTi8vZ0JPUTd0eGtZa3dkNG5zM094UHYvK1IyRGlSWmhkV0Q3VFFjT0trV0thRjlPM0VjTnowTFFTK09vbHdQQjV5bnJaU1lUNm5sbkd2NHg5WFZLUWhEVlF0OVFOSS9jTTNJdndOMEt6Ry9kTnU0ZktIQXlla3Ixb1ZuYXRyb3dVYTN0MXBqN3pIM3hPTXAwekJrZVBpcW1iTkpuTWQ0eEkzZUFtMVZEUG9aTUE5YVNjNU0yVkh0c1dYVlZ6SjZUUXdHZ3FUT1R2QW13NHFuOGlhOFJJZzNxLzhwdlE9PQ", "category": "contract", "importance": 5, "sid": "competitor", "topic": "삼성전자 5g 장비"}, {"title": "삼성전자, 미국 버라이즌과 6G 핵심 기술인 ‘AI 기반 ISAC’ 실증 성공 - senews.kr", "summary": "삼성전자가 미국 버라이즌과 6G 핵심 기술인 AI 기반 ISAC 실증에 성공했습니다. 이는 6G 네트워크가 통신과 센싱을 동시에 수행할 수 있음을 입증한 중요한 성과입니다.", "source": "senews.kr", "date": "2026-09-16 15:06", "url": "http://www.senews.kr/41170", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성 버라이즌 6g 실증"}, {"title": "European telecoms warn EU, Huawei 5G ban could cost €40 billion - Huawei Central", "summary": "유럽 통신사들이 화웨이 5G 장비 금지 시 400억 유로의 비용이 발생할 수 있다고 경고했습니다.", "source": "Huawei Central", "date": "2026-09-16 13:18", "url": "https://www.huaweicentral.com/european-telecoms-warn-eu-huawei-5g-ban-could-cost-e40-billion/", "category": "policy", "importance": 5, "sid": "policy", "topic": "eu 중국 장비 제재"}, {"title": "삼성전자, 美 버라이즌과 업계 최초 ‘AI 기반 6G’ 실증 성공 - 뉴뉴스", "summary": "삼성전자가 미국 버라이즌과 손잡고 업계 최초로 ‘AI 기반 6G’ 기술 현장 실증에 성공했다. 기존 상용 5G 네트워크와 소프트웨어 업그레이드만으로 통신망을 고정밀 센서로 활용하는 ISAC 기술을 구현했다. 통신과 센싱을 융합하여 자율주행과 군중 밀집도 분석 등을 가능케 하는 차세대 핵심 기술이다. 이번 성과는 글로벌 6G 표준화 경쟁에서 삼성전자의 압도적인 기술 리더십을 각인시키는 계기가 되었다.", "source": "뉴뉴스", "date": "2026-09-16 10:37", "url": "https://www.nnewss.com/news/articleView.html?idxno=6826", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성전자 수주"}, {"title": "EU telecoms bosses oppose ban on Chinese equipment suppliers - ET Telecom", "summary": "유럽 주요 통신사 최고경영자(CEO)들이 EU의 중국산 통신장비 공급업체 퇴출 및 금지 계획에 대해 공식 반대 입장을 밝혔다. 본 건은 주요국 정부 및 연합체의 중국산 장비(화웨이·ZTE 등) 제재·퇴출 기조에 대한 통신 업계의 반발을 다룬 대형 규제 이슈로, 글로벌 네트워크 장비 시장의 판도에 직결되는 최고 중요도(imp=5) 사안이다.", "source": "ET Telecom", "date": "2026-09-16 09:52", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/eu-telecoms-bosses-oppose-ban-on-chinese-equipment-suppliers/134275806", "category": "policy", "importance": 5, "sid": "policy", "topic": "유럽 통신사 수장들 중국산 장비 금지 반대"}, {"title": "Nokia Gets Buy Rating as Analyst Sees Undervalued AI Optical Play - finance.biggo.com", "summary": "글로벌 투자은행과 애널리스트들이 노키아의 AI 기반 광학 네트워크 기술 잠재력을 높이 평가하며 매수 의견을 제시했다. AI 데이터센터 확장에 따른 광학 장비 수요 증가로 수혜가 기대된다. 현재 보수적인 통신 시장 멀티플에 거래되어 저평가된 종목으로 분류된다. 향후 통신장비 시장에서 광학 및 보안 포트폴리오 강화의 발판이 될 전망이다.", "source": "finance.biggo.com", "date": "2026-09-16 03:37", "url": "https://finance.biggo.com/news/4e736006-669e-48a2-8ae0-abe3a6f81c1d", "category": "other", "importance": 5, "sid": "competitor", "topic": "노키아 ai"}, {"title": "Verizon and Samsung Turned Dallas Soccer Crowd Into Live 6G Sensing Lab - Tech Times", "summary": "버라이즌과 삼성전자가 달라스 축구 관중 군중을 라이브 6G 센싱 실험실로 활용했다. 대규모 인파 속에서 ISAC 기술을 성공적으로 시연했다. 상용 네트워크의 6G 진화 가능성을 각인시켰다.", "source": "Tech Times", "date": "2026-09-16 00:29", "url": "https://www.techtimes.com/articles/327554/20260915/verizon-samsung-turned-dallas-soccer-crowd-live-6g-sensing-lab.htm", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성전자 버라이즌 실증"}, {"title": "ASTS Stock Slides Premarket: AT&T Says SpaceX And Amazon Could Rival AST SpaceMobile In Sa", "summary": "AT&T가 스페이스X와 아마존이 AST 스페이스모바일의 경쟁자가 될 수 있다고 언급했습니다. 위성통신 시장의 경쟁 구도 변화를 시사합니다.", "source": "Stocktwits", "date": "2026-09-16 23:59", "url": "https://stocktwits.com/news-articles/markets/equity/asts-stock-slides-premarket-att-flags-spacex-amazon-as-rivals/cZBfYzqRebM", "category": "tech", "importance": 4, "sid": "satellite", "topic": "at&t 위성통신"}, {"title": "Charter Offering its Spectrum Plans to Cox Customers - Broadband Breakfast", "summary": "차터가 콕스 고객들을 대상으로 자사의 스펙트럼 플랜을 제공하기 시작했다. 인수 지역에서의 서비스 마이그레이션이 본격적으로 진행되고 있다.", "source": "Broadband Breakfast", "date": "2026-09-16 23:56", "url": "https://broadbandbreakfast.com/charter-offering-its-spectrum-plans-to-cox-customers/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터 커뮤니케이션즈 콕스 인수 통합"}, {"title": "Spectrum services now available across former Cox markets - Telecompaper", "summary": "스펙트럼 서비스가 이전 콕스 시장 전역에서 이용 가능해졌습니다. 통신사의 서비스 지역 확대 사례입니다.", "source": "Telecompaper", "date": "2026-09-16 23:55", "url": "https://www.telecompaper.com/news/spectrum-services-now-available-across-former-cox-markets--1582931", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터 커뮤니케이션즈 사업 확장"}, {"title": "SAL and Huawei sign MoU to advance digital logistics in Saudi Arabia - Telecompaper", "summary": "화웨이가 사우디아라비아 물류 기업 SAL과 업무협약을 체결하고 사우디 내 디지털 물류 인프라 고도화에 협력하기로 했다. 인공지능과 클라우드 등 화웨이의 첨단 ICT 솔루션이 물류 현장에 적용될 예정인 대형 프로젝트이다. 중동 시장에서 화웨이의 영향력이 지속적으로 확대되고 있다.", "source": "Telecompaper", "date": "2026-09-16 23:45", "url": "https://www.telecompaper.com/news/sal-and-huawei-sign-mou-to-advance-digital-logistics-in-saudi-arabia--1582792", "category": "contract", "importance": 4, "sid": "competitor", "topic": "화웨이 sal 사우디 mou"}, {"title": "Nokia, Microsoft Take AI Agents Into Telecom Networks: What NOK Investors Need To Know - S", "summary": "노키아와 마이크로소프트의 AI 에이전트 기반 통신 네트워크 자동화 협력이 투자자들의 주요 관심사로 부각되었습니다. 양사의 협업 내용과 투자자들이 주목해야 할 핵심 가치가 분석되었습니다. 경쟁사의 최신 파트너십 동향을 파악하는 데 유용합니다.", "source": "Stocktwits", "date": "2026-09-16 23:35", "url": "https://stocktwits.com/news-articles/markets/equity/nokia-extends-microsoft-tie-up-with-ai-platform-for-telecom-network-automation-nok-stock-rises-premarket/cZtrmU5RB5V", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 협력"}, {"title": "We want to be the Nvidia of ICT, says Huawei boss", "summary": "화웨이 회장 구핑은 AI가 인류의 마지막 기술 혁명이 될 수 있다고 언급하며, 화웨이가 ICT 분야의 엔비디아가 되는 것을 목표로 한다고 밝혔다. 화웨이는 AI를 중심으로 한 기술 혁신과 인프라 장비 시장에서의 주도권 강화를 추진하고 ?no=20260916181116", "category": "policy", "importance": 4, "sid": "policy", "topic": "방송미디어통신위원회 유통환경조성"}, {"title": "화웨이, M360 ASEAN 2026에서 지능형 연결성과 AI 전환 강조", "summary": "화웨이가 GSMA M360 아세안 2026의 행사 파트너로 참여해 지능형 연결성과 AI 전환 전략을 강조했습니다. 화웨이는 행사 기간 동안 지능형 모바일 네트워크, 디지털 신뢰, AI 솔루션을 제시하며 역내 디지털 경제 전환을 지원했습니다. 이는 화웨이의 글로벌 시장 전략 강화를 보여줍니다.", "source": "ZDNet Korea", "date": "2026-09-16 18:10", "url": "https://zdnet.co.kr/view/?no=20260916181024", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 m360 아세안"}, {"title": "Nokia (0HAF) Advances Global AI-RAN Trials with Eight Telecom Operators Including stc, du,", "summary": "노키아가 stc, du 등 8개 주요 글로벌 통신사와 함께 AI-RAN 글로벌 라이브 시험을 적극적으로 확대하고 있다. 엔비디아 플랫폼 기반의 인공지능 무선 접속망 기술을 상용화하기 위한 다각도의 검증이 진행 중이다. 글로벌 장비사의 차세대 기술 실증 성과다.", "source": "Kalkine Media", "date": "2026-09-16 18:00", "url": "https://kalkinemedia.com/uk/news/announcements/nokia-0haf-advances-global-ai-ran-trials-with-eight-telecom-operators-including-stc-du-and-tpg-telecom-using-nvidia-aerial-platform", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 글로벌 ai-ran 시험 확대"}, {"title": "로이터 “SK하이닉스, 인텔과 협력해 美서 메모리 생산”…SK하이닉스 “결정된 바 없다”", "summary": "로이터통신은 SK하이닉스가 인텔과 협력해 미국 오하이오주 팹 일부를 임대해 메모리 반도체를 현지 생산하는 방안을 협상 중이라고 보도했다. SK하이닉스 측은 모든 가능성이 열려 있으나 아직 확정된 바는 없다고 공식 입장을 밝혔다. 미국 정부의 반도체 공급망 내재화 압박 속에서 양사 간 전략적 제휴 가능성이 대두되고 있다. 글로벌 반도체 시장의 생산 거점 재편을 보여주는 중대 사안이다.", "source": "전자신문", "date": "2026-09-16 17:52", "url": "https://www.etnews.com/20260916000377", "category": "contract", "importance": 4, "sid": "competitor", "topic": "sk하이닉스 인텔 협력"}, {"title": "KT-KISTI, 국내 첫 한미 400G 국가연구망 개통…전송 용량 4배로 - 에너지경제신문", "summary": "KT가 한국과학기술정보연구원(KISTI)과 협력하여 국내 최초로 한·미 간 400Gbps급 국가연구망 회선을 성공적으로 개통했습니다. 기존 전송 용량 대비 4배 확대된 대역폭을 통해 대규모 양자 및 AI 공동 연구를 뒷받침할 핵심 네트워크 인프라를 확보했습니다.", "source": "에너지경제신문", "date": "2026-09-16 17:48", "url": "https://www.ekn.kr/web/view.php?key=20260916026155643", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 한미연구망개통"}, {"title": "VideoLabs buys Ericsson CDN/cloud IP assets for undisclosed sum - Telecompaper", "summary": "비디오랩스가 에릭슨의 CDN 및 클라우드 IP 자산을 비공개 금액으로 인수했습니다. 관련 인프라 자산 인수를 통해 미디어 딜리버리 역량을 강화할 것으로 전망됩니다. 글로벌 장비사들의 포트폴리오 재편이 이어지고 있습니다.", "source": "Telecompaper", "date": "2026-09-16 17:35", "url": "https://www.telecompaper.com/news/videolabs-buys-ericsson-cdncloud-ip-assets-for-undisclosed-sum--1582830", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 m&a"}, {"title": "NTT DoCoMo adds Nokia equipment to boost multivendor O-RAN efforts - SDxCentral", "summary": "일본 이동통신사 NTT 도코모가 멀티벤더 오픈랜(O-RAN) 노력을 강화하기 위해 노키아의 장비를 추가 도입했다. 이번 협력은 개방형 무선접속망 생태계를 확장하고 망 운영의 유연성을 높이기 위한 전략의 일환이다. 노키아는 글로벌 통신사와의 파트너십을 공고히 하고 있다.", "source": "SDxCentral", "date": "2026-09-16 17:32", "url": "https://www.sdxcentral.com/news/ntt-docomo-adds-nokia-equipment-to-boost-multivendor-o-ran-efforts/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 도코모 오픈랜"}, {"title": "Augusta objects to Verizon's proposed end to copper phone line servicing - The News Leader", "summary": "오거스타 지역 사회가 버라이즌의 구리선 전화 회선 서비스 종료 제안에 대해 공식적으로 반대 의견을 제기했습니다. 노후 인프라 폐지에 따른 통신 서비스 공백 우려가 제기되고 있습니다. 규제 승인 과정에서 통신사가 직면한 지역 갈등입니다.", "source": "The News Leader | Staunton, VA", "date": "2026-09-16 17:31", "url": "https://www.newsleader.com/story/news/local/government/2026/09/16/verizon-end-copper-phone-lines-challenged-virginia/91776238007/", "category": "policy", "importance": 4, "sid": "carrier", "topic": "버라이즌 유선망 전환"}, {"title": "Cross-Operator Joint Study on 5G Millimeter-Wave Infrastructure and Technical Architecture", "summary": "라쿠텐모바일을 비롯한 통신 사업자들이 5G 밀리미터파(mmWave) 인프라 구축과 기술적 아키텍처에 대한 교차 연산 공동 연구를 추진한다. 초고속·대용량 통신 환경 구현을 위해 고주파수 대역 활용 방안을 모색하고 있다. 단독 구축의 한계를 극복하고 효율적인 망 설계를 도모하는 차원이다. 차세대 통신망 고도화를 위한 기술 협력의 일환이다.", "source": "楽天モバイル株式会社", "date": "2026-09-16 16:50", "url": "https://corp.mobile.rakuten.co.jp/english/news/press/2026/0916_01/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "라쿠텐모바일 5g"}, {"title": "스페이스X도 통신망 투자…통신장비 ‘공급 부족’ 신호 깜빡 - 딜사이트", "summary": "스페이스X 등 위성통신 사업자들의 공격적인 통신망 투자가 이어지면서 글로벌 통신장비 시장에 '공급 부족' 신호가 감지되고 있다. 위성 및 지상국 인프라 확충에 필요한 장비 수요가 급증하는 추세다. 장비 제조사들에게는 새로운 사업 기회인 동시에 부품 수급 관리가 중요한 과제로 떠올랐다. 통신장비 생태계 전반의 수급 환경 변화를 시사한다.", "source": "딜사이트", "date": "2026-09-16 16:34", "url": "https://dealsite.co.kr/articles/169162", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스페이스x 통신망 투자 공급 부족"}, {"title": "折りたたみ「Galaxy Z Fold8（256GB）」、ソフトバンクにMNPで約30万円が2年間7万円台に【スマホお得情報】", "summary": "소프트뱅크는 폴더블 스마트폰 'Galaxy Z Fold8(256GB)'에 대해 MNP 및 단말 반환 프로그램을 적용하여 2년간 실부담액을 7만 원대로 낮춰 판매하는 할인 프로모션을 개시했다. 주요 통신사의 프리미엄 폴더블폰 판매 경쟁 양상을 보여준다.", "source": "ITmedia Mobile", "date": "2026-09-16 16:06", "url": "https://www.itmedia.co.jp/mobile/articles/2609/16/news081.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 갤럭시"}, {"title": "Nokia and Microsoft launch unified data foundation for telecoms AI operations - Telecompap", "summary": "노키아와 마이크로소프트가 통신 AI 운영을 지원하기 위한 통합 데이터 파운데이션을 공동으로 출시했다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/nokia-and-microsoft-launch-unified-data-foundation-for-telecoms-ai-operations--1583013", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 통신 ai 데이터 재단"}, {"title": "Ericsson debuts customer-hosted NetCloud tailored to regulated enterprise workloads - Tele", "summary": "에릭슨이 규제가 엄격한 엔터프라이즈 워크로드에 맞춤화된 고객 호스팅형 넷클라우드(NetCloud) 서비스를 선보였습니다. 기업 고객의 보안 및 규정 준수 요구사항을 충족하는 프라이빗 네트워크 및 클라우드 솔루션을 제공합니다. 경쟁사의 B2B 기업 시장 공략 전략입니다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/ericsson-debuts-customer-hosted-netcloud-tailored-to-regulated-enterprise-workloads--1583002", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 엔터프라이즈 솔루션"}, {"title": "Vodafone Egypt deploys Ericsson AI RAN Processor 6672 - Telecompaper", "summary": "보다폰 이집트가 에릭슨의 AI RAN 프로세서 6672를 상용망에 배치하고 네트워크 고도화에 착수했습니다. 고성능 프로세서 도입을 통해 에너지 효율을 높이고 AI 기반 무선 접속망 성능을 강화합니다. 에릭슨의 중동 지역 통신장비 공급 실적을 보여줍니다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/vodafone-egypt-deploys-ericsson-ai-ran-processor-6672--1583009", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 이집트 수주"}, {"title": "ZTE wants to take operators beyond connectivity with AI - Telecompaper", "summary": "중흥통신(ZTE)이 단순한 물리적 연결 제공을 넘어 인공지능을 결합한 통신 서비스와 솔루션으로 사업 영역을 확장하겠다는 의지를 밝혔다. 통신 장비를 넘어 AI 기반 디지털 전환을 주도하려는 ZTE의 전략 방향이다. 경쟁사의 신사업 비전이다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/partner-content/zte-wants-to-take-operators-beyond-connectivity-with-ai--1583019", "category": "tech", "importance": 4, "sid": "competitor", "topic": "중흥통신 전략"}, {"title": "CTIA paper calls for federal 4 GHz study in next 60 days - Telecompaper", "summary": "미국 무선통신산업협회(CTIA)가 향후 60일 내 연방 차원의 4GHz 주파수 대역 연구를 촉구하는 정책 제안서를 제출했습니다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/ctia-paper-calls-for-federal-4-ghz-study-in-next-60-days--1583008", "category": "policy", "importance": 4, "sid": "policy", "topic": "ctia 4ghz 주파수 연구"}, {"title": "携帯4社、5Gミリ波の基地局・中継器を共同活用へ 覚書締結 - finance.biggo.jp", "summary": "일본 4대 이동통신사가 5G 밀리웨이브(mmWave) 기지국과 중계기를 공동 활용하기 위한 양해각서(MOU)를 체결했습니다. 인프라 투자 비용을 절감하고 커버리지를 효율적으로 넓히기 위한 전략적 제휴입니다.", "source": "finance.biggo.jp", "date": "2026-09-16 15:55", "url": "https://finance.biggo.jp/news/81b190fd-ca09-4b1c-b7c9-002d37b38d00", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본 통신사 5g 밀리웨이브 협력"}, {"title": "ソフトバンクとSceye、「空飛ぶ基地局」HAPSの試験サービスに国内初成功。米国から太平洋を越え、日本上空へ - digital-construction.jp", "summary": "소프트뱅크와 Sceye가 '하늘 위의 기지국' HAPS 시험 서비스에 국내 최초로 성공했다.", "source": "digital-construction.jp", "date": "2026-09-16 15:54", "url": "https://digital-construction.jp/news/4017", "category": "tech", "importance": 4, "sid": "competitor", "topic": "소프트뱅크 항공 기지국"}, {"title": "[단독] 미국 통신사 특허전 불똥 맞은 삼성전자, 5G 기지국 장비 관련 미국서 피소 - 일요신문", "summary": "삼성전자가 미국 통신사 간의 특허 분쟁 여파로 5G 기지국 장비 관련 미국에서 피소당했다. 특허 침해 소송에 휘말리며 미국 시장 내 장비 사업에 잠재적 리스크가 발생했다. 향후 소송 진행 상황이 삼성전자의 북미 사업에 영향을 미칠 수 있다. 법적 대응을 위한 준비가 요구된다.", "source": "일요신문", "date": "2026-09-16 15:50", "url": "https://www.ilyo.co.kr/?ac=article_view&entry_id=512745", "category": "policy", "importance": 4, "sid": "competitor", "topic": "삼성전자 법적 리스크"}, {"title": "SKT, AI인프라에 ‘보안’까지…F5와 국내 시장 공략 - 디일렉", "summary": "SK텔레콤이 글로벌 보안 기업 F5와 손잡고 AI 인프라 및 클라우드 보안 분야에서 전략적 파트너십을 체결했다. AI 데이터센터와 클라우드 서비스 보호를 위한 통합 관리 체계를 구축한다. 국내 보안 및 클라우드 시장 공략을 가속화할 전망이다.", "source": "디일렉", "date": "2026-09-16 15:42", "url": "https://www.thelec.kr/news/articleView.html?idxno=62383", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 f5 보안 파트너십"}, {"title": "KDDI／ドコモ／ソフトバンク／楽天モバイルが5Gミリ波エリア拡大に向け共同検討を開始（PHILE WEB） - Yahoo!ニュース", "summary": "KDDI, 도코모, 소프트뱅크, 라쿠텐모바일 등 일본 4대 이동통신사가 5G 밀리미터파 주파수 대역의 에어리어 확대를 위해 공동 검토를 시작했습니다. 고주파수 대역 투자 부담을 줄이기 위한 업계 협력입니다.", "source": "Yahoo!ニュース", "date": "2026-09-16 15:41", "url": "https://news.yahoo.co.jp/articles/9cf1099c4ba6287296a73c4b4401aa676e751e46", "category": "tech", "importance": 4, "sid": "carrier", "topic": "일본 4대 통신사 밀리미터파 연합"}, {"title": "Japan carrier NTT Docomo gave user data to Amazon Japan arm without consent - Japan Wire b", "summary": "NTT 도코모가 아마존 재팬에 고객 데이터를 무단 제공한 사건입니다.", "source": "Japan Wire by Kyodo News", "date": "2026-09-16 15:27", "url": "https://english.kyodonews.net/articles/-/85219", "category": "policy", "importance": 4, "sid": "carrier", "topic": "ntt 도코모 개인정보"}, {"title": "SoftBank Completes Japan Airborne Base Station Trial for 2027 Rollout - Retail News Asia", "summary": "소프트뱅크가 2027년 상용화를 목표로 성층권 기반 공중 기지국 실증을 완료했습니다.", "source": "Retail News Asia", "date": "2026-09-16 15:22", "url a Von Der Leyen Proposes EU Kids Act Social Media Ban Under 13: how 18 outlets framed", "summary": "- 우르줄라 폰 데어 라이엔 EU 집행위원장이 13세 미만 아동 소셜미디어 사용 금지 법안(EU Kids Act) 제안\n- 디지털 규제 강화", "source": "NewsCord", "date": "2026-09-17 20:03", "url": "https://newscord.org/article/ursula-von-der-leyen-proposes-eu-kids-act-social-media-ban-under-13--Story_20260917_EUannouncesplantores72bc6802", "category": "policy", "importance": 4, "sid": "policy", "topic": "우르줄라 폰 데어 라이엔 eu 아동 소셜미디어 금지"}, {"title": "「世界初」ソフトバンクらが成層圏HAPSのリアルタイム追尾とレーザー測距に成功 光無線通信へ大きな一歩 - ITmedia Mobile - ITmedia", "summary": "소프트뱅크 등이 세계 최초로 성층권 HAPS의 실시간 추적과 레이저 측거를 이용한 광무선 통신에 성공했다. 상공에서 고속 데이터 송수신을 안정적으로 수행할 수 있는 기반을 다졌다. 차세대 항공 통신 기술 분야에서 독보적인 기술력을 과시했다.", "source": "ITmedia", "date": "2026-09-17 20:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/17/news098.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 성층권 통신 플랫폼 haps 실험"}, {"title": "「世界初」ソフトバンクらが成層圏HAPSのリアルタイム追尾とレーザー測距に成功 光無線通信へ大きな一歩", "summary": "소프트뱅크 등 3개사가 성층권 통신 플랫폼(HAPS)을 지상에서 실시간으로 추적하여 레이저 광으로 거리를 측정하는 광무선 통신 실증에 세계 최초로 성공했습니다. 태평양横断 비행 및 에지 컴퓨팅 연동을 통해 통신 지연을 대폭 줄였으며, 2027년 상용화를 목표로 국내 거점 정비와 2030년 전국 커버리지를 추진합니다. 차세대 공중 통신망 기술의 중요한 진전입니다.", "source": "ITmedia Mobile", "date": "2026-09-17 20:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/17/news098.html", "category": "tech", "importance": 4, "sid": "satellite", "topic": "소프트뱅크 성층권 에이치에이피에스 레이저 측정 성공"}, {"title": "China’s AI labs must accelerate development, says Huawei chair", "summary": "화웨이 회장이 중국의 AI 연구소가 개발을 가속화해야 한다고 발언했습니다. 실리콘밸리의 AI 속도 조절론과 대비되는 시각입니다. 통신장비 기업 수장의 산업 전망 발언입니다.", "source": "Financial Times Tech", "date": "2026-09-17 19:50", "url": "https://www.ft.com/content/c1f4cacf-098a-4776-b76b-fb741ef36fa6?syn-25a6b1a6=1", "category": "exec", "importance": 4, "sid": "competitor", "topic": "화웨이 ai 랩스"}, {"title": "Near-Packaged Optics Emerges as the Pragmatic Path for AI’s Next Networking Era - The Fast", "summary": "AI 시대의 차세대 네트워킹을 위한 실용적 대안으로 근접 패키지 광학(Near-Packaged Optics) 기술이 부상하고 있다. 대규모 데이터센터와 고성능 통신망의 병목 현상을 해결할 핵심 기술로 주목받는다. 차세대 장비 기술 동향이다.", "source": "The Fast Mode", "date": "2026-09-17 19:37", "url": "https://www.thefastmode.com/technology-solutions/50640-near-packaged-optics-emerges-as-the-pragmatic-path-for-ai-s-next-networking-era", "category": "tech", "importance": 4, "sid": "competitor", "topic": "통신장비 기술"}, {"title": "Nokia and Microsoft team up for network automation - telecoms.com", "summary": "노키아와 마이크로소프트가 차세대 통신망의 지능형 네트워크 자동화를 위해 긴밀한 협력 관계를 구축했다.", "source": "telecoms.com", "date": "2026-09-17 19:07", "url": "https://www.telecoms.com/automation/nokia-and-microsoft-team-up-for-network-automation", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 네트워크 자동화 팀업"}, {"title": "이청 삼성디스플레이 사장, 中추격에 \"LCD 뼈아픈 경험 되풀이 안돼\"", "summary": "이청 한국디스플레이산업협회 회장 겸 삼성디스플레이 사장이 디스플레이의 날 기념식에서 LCD의 뼈아픈 경험을 되풀이하지 않겠다고 강조했다. 산학연이 원팀이 되어 핵심 기술을 지키고 차세대 경쟁력을 확보해야 한다고 밝혔다. 중국의 거센 추격에 맞서 초격차 기술 확보의 시급성을 역설했다. 국내 디스플레이 산업의 위기 극복 전략을 제시했다.", "source": "ZDNet Korea", "date": "2026-09-17 18:55", "url": "https://zdnet.co.kr/view/?no=20260917184346", "category": "exec", "importance": 4, "sid": "competitor", "topic": "삼성디스플레이 디스플레이"}, {"title": "LFP 양극재 선두 엘앤에프, 삼성SDI 이어 SK온도 수주…1617억 규모", "summary": "LFP 양극재 선두 기업 엘앤에프가 삼성SDI에 이어 SK온과도 중장기 LFP 양극재 공급 계약을 체결했다. 이번 계약으로 SK온의 국내외 모든 생산법인 및 지정업체에 양극재를 공급하게 된다.", "source": "ZDNet Korea", "date": "2026-09-17 18:49", "url": "https://zdnet.co.kr/view/?no=20260917183510", "category": "contract", "importance": 4, "sid": "competitor", "topic": "엘앤에프 lfp 양극재 공급 계약"}, {"title": "ソフトバンク、HAPSで「3次元ネットワーク」へ スマホ直接通信で下り36Mbps - Impress Watch", "summary": "소프트뱅크가 HAPS를 통해 3차원 네트워크를 구현하며 스마트폰과의 직접 통신으로 하리 36Mbps 속도를 확인했다. 지상 기지국 사각지대를 해소하는 혁신적인 공중 통신망 기술이다.", "source": "Impress Watch", "date": "2026-09-17 18:45", "url": "https://www.watch.impress.co.jp/docs/news/2141933.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "소프트뱅 sible", "summary": "화웨이가 지능형 오피스 솔루션 2.0을 출시하며 기업용 시장 공략을 강화한다.", "source": "PR Newswire", "date": "2026-09-17 17:40", "url": "https://www.prnewswire.com/in/news-releases/huawei-ekit-launches-intelligent-office-solution-2-0--making-intelligent-office-accessible-to-all-302881802.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 솔루션"}, {"title": "'유심 해킹' SKT \"정상 단말기 켜지면 복제 유심 접속 불가\" - v.daum.net", "summary": "SK텔레콤이 유심 해킹 및 유출 사고와 관련해 정상 단말기가 켜져 있으면 복제 유심으로의 무단 접속이 원천 차단된다고 해명했다. 1,300억 원대 과징금 부과를 둘러싼 첫 재판에서 치열한 공방이 벌어지며 통신사 보안 책임과 제재 정당성이 쟁점이 되고 있다.", "source": "v.daum.net", "date": "2026-09-17 17:40", "url": "https://v.daum.net/v/20260917174052060", "category": "policy", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 유심 유출 과징금"}, {"title": "Ericsson explores the future of intelligent networks with industry analysts - telecomtv.co", "summary": "에릭슨이 산업 분석가들과 함께 지능형 네트워크의 미래 방향성과 차세대 통신 기술 전략을 탐색하고 논의했다.", "source": "telecomtv.com", "date": "2026-09-17 17:38", "url": "https://www.telecomtv.com/content/ai/ericsson-explores-the-future-of-intelligent-networks-with-industry-analysts-56266/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 지능형 네트워크 미래 탐색"}, {"title": "Ericsson ConsumerLab: Consumer appetite for agentic AI could transform network traffic - t", "summary": "에릭슨 컨슈머랩 보고서에 따르면 소비자의 에이전틱 AI 수요가 향후 통신 네트워크 트래픽 구조와 사용 패턴을 크게 변화시킬 것으로 전망됐다.", "source": "telecomtv.com", "date": "2026-09-17 17:38", "url": "https://www.telecomtv.com/content/ai/ericsson-consumerlab-consumer-appetite-for-agentic-ai-could-transform-network-traffic-56268/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 에이전틱 ai 통신 트래픽 전망"}, {"title": "\"AI 시대에 모든 트래픽 똑같이\"...망중립성 손질 필요", "summary": "AI와 6G 시대에 자율주행과 로봇, AI 에이전트 등 초저지연 서비스가 늘어나면서 모든 인터넷 트래픽을 동등하게 취급해온 기존 망중립성 원칙을 손질해야 한다는 목소리가 커지고 있다. 사람과 스마트폰 중심으로 설계된 기존 통신 정책의 패러다임 전환이 필요하다는 지적이다. 차세대 네트워크 환경에 맞춘 통신 규제 패러다임 변화를 다룬 정책 이슈다.", "source": "ZDNet Korea", "date" d 6G Policy - Broadband Break", "summary": "FCC가 주파수, AI, 6G 정책을 자문하기 위해 기술자문위원회(TAC)를 재출범시켰다. 미국 정부의 차세대 통신 규제 및 표준화 정책 수립에 핵심적인 역할을 담당한다. 글로벌 통신 산업의 정책 방향에 큰 영향을 미친다.", "source": "Broadband Breakfast", "date": "2026-09-17 08:49", "url": "https://broadbandbreakfast.com/fcc-relaunches-tech-advisory-council-to-guide-spectrum-ai-and-6g-policy/", "category": "policy", "importance": 4, "sid": "policy", "topic": "fcc 기술자문위원회 재출범"}, {"title": "ＫＤＤＩなど携帯４社、５Ｇミリ波のエリア拡大へ共同検討、基地局・中継器を有効活用 - kabu-ir.com", "summary": "KDDI 등 휴대폰 4사가 5G 밀리미터파 영역 확대를 위해 기지국과 중개기를 공동으로 활용하는 방안을 검토하기 위한 각서를 체결했다.", "source": "kabu-ir.com", "date": "2026-09-17 08:00", "url": "https://kabu-ir.com/article/521572973.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본 통신4사 5g 밀리미터파 협력"}, {"title": "Former Cox customers in Oklahoma can now access Spectrum pricing, packages - news9.com", "summary": "오클라호마의 전 콕스 고객들이 스펙트럼 요금제와 패키지를 이용할 수 있게 됨. 통신사의 시장 통합 전략임.", "source": "news9.com", "date": "2026-09-17 07:49", "url": "https://www.news9.com/oklahoma-city-news/former-cox-customers-in-oklahoma-can-now-access-spectrum-pricing-packages", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터 커뮤니케이션즈 스펙트럼"}, {"title": "KDDI, NTT DOCOMO, SoftBank and Rakuten Mobile Launch 5G Millimeter-Wave Study - The Fast M", "summary": "- KDDI, NTT 도코모, 소프트뱅크, 라쿠텐 모바일이 5G 밀리미터파 공동 연구를 시작\n- 일본 시장 내 28GHz 대역 확장 협력", "source": "The Fast Mode", "date": "2026-09-17 07:42", "url": "https://www.thefastmode.com/technology-solutions/50625-kddi-ntt-docomo-softbank-and-rakuten-mobile-launch-5g-millimeter-wave-study", "category": "tech", "importance": 4, "sid": "competitor", "topic": "일본통신사 5g 밀리미터파 연구"}, {"title": "Ericsson Showcases Intelligent Networks at Industry Analyst Event - The Fast Mode", "summary": "에릭슨이 업계 분석가 행사에서 지능형 네트워크 기술을 선보임. 차세대 네트워크 자동화 및 최적화 솔루션을 강조함.", "source": "The Fast Mode", "date": "2026-09-17 07:26", "url": "https://www.thefastmode.com/technology-solutions/50623-ericsson-showcases-intelligent-networks-at-industry-analyst-event", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 네트워크"}, {"title": "Nokia Advances AI-RAN Adoption Across Global Operator Trials - The Fast Mode", "summary": "노키아가 글로벌 통신사들과의 시험을 통해 AI-RAN 도입을 가속화하고 있다. 무선 네트워크에 AI를 통합하여 성능을 최적화하는 방안을 검증하고 있다. 통신 장비 시장에서 AI 기술 적용을 선도하려는 전략이다. 다수의 통신 사업자가 참여하여 기술 실증이 진행 중이다.", "source": "The Fast Mode", "date": "2026-09-17 07:24", "url": "https://www.thefastmode.com/technology-solutions/50628-nokia-advances-ai-ran-adoption-across-global-operator-trials", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 ai-ran 도입"}, {"title": "NTT Docomo says it gave user data to Amazon Japan without consent - Japan Today", "summary": "NTT 도코모가 사용자 동의 없이 아마존 재팬에 고객 데이터를 제공했습니다.", "source": "Japan Today", "date": "2026-09-17 06:30", "url": "https://japantoday.com/category/business/update1-japan-carrier-ntt-docomo-gave-user-data-to-amazon-japan-arm-without-consent", "category": "policy", "importance": 4, "sid": "carrier", "topic": "ntt 도코모 개인정보"}, {"title": "EU urged to ‘avoid’ proposed ban on equipment suppliers - Borneo Bulletin", "summary": "유럽연합(EU)이 중국산 통신장비 공급업체에 대한 금지 조치를 피해야 한다는 주장이 제기되었습니다. 이는 글로벌 통신 시장의 장비 조달 및 규제 측면에서 중요한 정책적 논점을 형성하고 있습니다. 유럽 내 주요 국가와 통신사들은 비용 증가와 공급망 차질 우려를 제기하며 신중한 접근을 요구하고 있습니다. 이러한 규제 논의는 향후 글로벌 통신장비 시장의 경쟁 구도에 큰 영향을 미칠 전망입니다.", "source": "Borneo Bulletin", "date": "2026-09-17 06:05", "url": "https://borneobulletin.com.bn/eu-urged-to-avoid-proposed-ban-on-equipment-suppliers/", "category": "policy", "importance": 4, "sid": "policy", "topic": "화웨이 통신장비 규제"}, {"title": "Carney pitches sovereign internet network, funding help from feds - mobilesyrup.com", "summary": "마크 카니 등 캐나다 주요 인사가 연방 정부의 재정 지원을 받아 전국적인 주권 인터넷망(Sovereign Internet Network) 구축을 추진해야 한다고 주장했습니다. 국가 핵심 통신망의 보안과 자립성을 강화하기 위한 정책적 논의입니다. 캐나다 통신 인프라 정책에 큰 변화를 예고합니다.", "source": "mobilesyrup.com", "date": "2026-09-17 05:55", "url": "https://mobilesyrup. }

  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["로저스",["rogers"]],["bell canada",[]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel","rogers","로저스","bell canada"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else if(tab.mode==="search"){
    html+=`<div class="block"><div class="blk-body" style="padding:12px 14px">
      <div style="display:flex;gap:8px">
        <input id="searchInput" value="${esc(searchQ)}" placeholder="회사명·키워드 검색 (예: 에릭슨 수주)" onkeydown="if(event.key==='Enter')doSearch()"
          style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit">
        <button class="rchip on" style="border:none" onclick="doSearch()">검색</button>
      </div></div></div>`;
    if(searchQ.trim()){
      const toks=searchQ.toLowerCase().split(/\s+/).filter(Boolean);
      const expand=x=>{for(const [c,ali] of COMPANIES){if(c===x||ali.includes(x))return [c].concat(ali);}return [x];};
      const seen=new Set();let all=[];
      const push=(a,sid)=>{const k=(a.url||a.title||"");if(k&&!seen.has(k)){seen.add(k);all.push({...a,_sid:sid});}};
      if(typeof NEWS_DATA!=="undefined")Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>push(a,s)));
      Object.keys(ARCH).forEach(d=>(ARCH[d]||[]).forEach(a=>push(a,a.sid)));
      const hits=all.filter(a=>{
        const t=((a.title||"")+" "+(a.summary||"")+" "+(a.topic||"")+" "+(a.source||"")).toLowerCase();
        return toks.every(x=>expand(x).some(v=>t.includes(v)));
      }).sort((a,b)=>(b.importance||0)-(a.importance||0)||(b.date||"").localeCompare(a.date||"")).slice(0,50);
      html+=block("🔍 검색 결과",hits.length+"건",hits.map(a=>artCard(a,true)).join(""));
    }else{
      html+=`<div class="empty">검색어를 입력하세요.<br>현재 대시보드의 전체 기사와 최근 30일 중요 기사 아카이브에서 찾습니다.</div>`;
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
