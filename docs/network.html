"policy", "importance": 4, "wl": false, "topic": "과기정통부 ai"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 릴라이언스 지오는 나브라트리 및 디왈리 연휴 기간에 맞춰 4억 달러 규모의 대규모 IPO를 단행할 계획이다. IPO 일정이 가시화되면서 글로벌 통신 시장의 자본 유치 움직임으로 주목받고 있다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "earnings", "importance": 4, "wl": true, "topic": "지오 ipo"}, {"title": "Bombay HC quashes ₹2,113 crore DoT demand against Vodafone Idea - scanx.trade", "summary": "인도 뭄바이 고등법원이 인도 통신부(DoT)가 보다폰 아이디어를 상대로 제기한 2,113억 루피 규모의 요금 청구 소송을 기각했다. 통신사의 재무적 불확실성을 크게 덜어주는 중대한 법적 판결이다. 자금난을 겪고 있는 보다폰 아이디어의 경영 정상화에 숨통이 트일 것으로 기대된다. 인도 통신 규제 당국과 사업자 간의 오랜 법적 공방에 영향을 미치는 사안이다.", "source": "scanx.trade", "date": "2026-09-04 09:28", "url": "https://scanx.trade/stock-market-news/companies/bombay-high-court-quashes-2-113-crore-dot-demand-notices-against-vodafone-idea-for-one-time-spectrum-charges/42522031", "category": "policy", "importance": 4, "wl": false, "topic": "보다폰아이디어 규제"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - barrons.com", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤의 지분을 확보하고 미국 자회사 T-Mobile과의 합병 계획에 반대 입장을 표명한 가운데 도이치텔레콤 주가가 상승했다. 대형 통신사의 지배구조 개편과 자회사 합병 전략을 둘러싼 주주 간 갈등이 표면화되고 있다. 향후 그룹의 전략 방향에 중대한 영향을 미칠 사안이다.", "source": "barrons.com", "date": "2026-09-04 01:24", "url": "https://www.barrons.com/articles/t-mobile-stock-report-elliott-deutsche-telekom-merger-2880aac4", "category": "strategy", "importance": 4, "wl": false, "topic": "도이치텔레콤 인수합병"}, {"title": "T-Mobile US stock gains as Elliott pressure on Deutsche Telekom reshapes merger debate - A", "summary": "엘리엇의 압박이 도이치텔레콤의 합병 계획에 영향을 미치면서 T-Mobile US의 주가에 변동성이 나타났다. 대형 통신사의 M&A 전략을 둘러싼 불확실성이 주가 흐름에 반영되고 있다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:57", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/t-mobile-us-stock-gains-as-elliott-pressure-on-deutsche-telekom-reshapes/70049448", "category": "strategy", "importance": 4, "wl": false, "topic": "티모바일 인수합병"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - PRESS9", "summary": "SK텔레콤과 LG유플러스 등 국내 이동통신사들이 그동안 축소해왔던 네트워크 망 투자를 다시 늘릴 가능성이 제기된다. 5G SA 고도화와 향후 주파수 경매 등이 주요 변수로 작용하고 있다.", "source": "PRESS9", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "skt lgu+ 망투자"}, {"title": "Elliott builds stake in Deutsche Telekom - ET Telecom", "summary": "행동주의 펀드 엘리엇 매니지먼트가 도이치텔레콤의 지분을 매입하며 경영 관여에 나섰다. 도이치텔레콤의 주요 전략 및 미국 자회사 T-Mobile과의 합병 구도 등에 제동을 걸 가능성이 제기된다. 거대 통신사의 지배구조와 향후 투자 전략에 큰 파장을 미칠 수 있는 사안이다. 시장 내 투자자들과 통신 업계의 이목이 집중되고 있다.", "source": "ET Telecom", "date": "2026-09-03 11:19", "url": "https://telecom.economictimes.indiatimes.com/amp/news/industry/elliott-builds-stake-in-deutsche-telekom/133723377", "category": "contract", "importance": 4, "wl": false, "topic": "도이치텔레콤 지분"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - v.daum.net", "summary": "통신사들이 기지국 인프라를 AI 데이터센터로 변신시키는 등 새로운 비즈니스 모델 발굴에 나서고 있다. 전통적인 통신 수익의 한계를 극복하기 위해 네트워크 자산을 AI 연산 인프라로 활용하려는 전략이다. 통신과 AI의 융합 트렌드를 보여주는 대표적 사례다.", "source": "v.daum.net", "date": "2026-09-05 06:34", "url": "https://v.daum.net/v/20260905063458471", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai"}, {"title": "고고도 기지국…소프트뱅크, 성층권서 엣지컴퓨팅 실험", "summary": "소프트뱅크가 성층권에 띄운 고고도 플랫폼(HAPS)을 단순 기지국을 넘어 엣지컴퓨팅 거점으로 활용하는 실험에 성공했다. 지상 이동통신망과 저궤도 위성망 사이에서 데이터 처리를 담당하는 새로운 네트워크 계층으로 HAPS의 활용 가능성이 주목받고 있다. 소프트뱅크와 미국 Sceye는 일본 상공에서 해당 실험을 진행하며 차세대 통신 인프라 확장 가능성을 입증했다.", "source": "ZDNet Korea", "date": "2026-09-05 06:00", "url": "https://zdnet.co.kr/view/?no=20260904222208", "category": "tech", "importance": 3, "wl": true, "topic": "소프트뱅크 기술"}, {"title": "Telco operators reject quality of service norms for 5G slicing - The Economic Times", "summary": "인도의 통신 사업자들이 규제 당국이 추진하는 5G 네트워크 슬라이싱 관련 서비스 품질(QoS) 규제 지침에 대해 반대 입장을 표명했다. 신기술 도입 초기 자율성을 해칠 수 있다는 우려에서 비롯된 마찰이다. 통신 규제 및 정책을 둘러싼 정부와 업계 간의 갈등이다.", "source": "The Economic Times", "date": "2026-09-05 04:38", "url": "https://m.economictimes.com/industry/telecom/telecom-giants-reject-trais-5g-slicing-qos-norms-amidst-net-neutrality-debate/amp_articleshow/133776604.cms", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신사 5g 슬라이싱 서비스 품질 규제 반발"}, {"title": "Spectrum-Cox Merger Update: Will Your Bill And Service Change? - CableTV.com", "summary": "스펙트럼과 콕스의 합병 가능성이 제기되면서 요금과 서비스에 미칠 영향에 관심이 모이고 있다. 케이블 및 통신 시장의 대형 사업자 간 재편 움직임이다. 업계 판도에 영향을 주는 M&A 동향이다.", "source": "CableTV.com", "date": "2026-09-05 03:19", "url": "https://www.cabletv.com/news/cox-spectrum-merger-will-price-increase", "category": "contract", "importance": 3, "wl": false, "topic": "스펙트럼 콕스 합병 추진"}, {"title": "TELUS (TSX:T): Dividend Aristocrat Exit And AI Pivot Explained - Kalkine Media", "summary": "캐나다 통신사 텔러스의 배당 귀족주 지위 변화와 AI 중심의 사업 피벗 전략을 분석했다. 전통적인 통신 수익 모델에서 벗어나 인공지능 및 디지털 서비스로 전환하려는 경영 전략을 다루고 있다. 주주 환원 정책의 변화와 신사업 투자의 타당성이 논의된다.", "source": "Kalkine Media", "date": "2026-09-05 02:24", "url": "https://kalkinemedia.com/ca/stocks/communication/telus-tsxt-dividend-aristocrat-exit-and-ai-pivot-explained", "category": "strategy", "importance": 3, "wl": false, "topic": "텔러스 전략"}, {"title": "Verizon Communications stock gains as Q2 2026 earnings beat and outage reports test sentim", "summary": "버라이즌의 2026년 2분기 실적이 시장 예상을 웃돌았으나, 동시에 발생한 통신 장애 보고들이 투자 심리에 영향을 미쳤다. 견조한 재무 성과와 네트워크 안정성 이슈가 교차하고 있다. 실적과 장애가 함께 언급된 통신사 소식이다.", "source": "AD HOC NEWS", "date": "2026-09-05 02:16", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-as-q2-2026-earnings-beat-and-outage/70055902", "category": "earnings", "importance": 3, "wl": false, "topic": "버라이즌 실적 호조 및 장애 보고"}, {"title": "LS일렉트릭, KT클라우드와 AI 데이터센터 인프라 공급·개발 맞손 - koreasprint.com", "summary": "LS일렉트릭이 KT클라우드와 AI 데이터센터 인프라 공급 및 개발을 위한 파트너십을 체결했다. AI 인프라 확충에 필수적인 전력 및 설비 부문에서 협력을 강화한다.", "source": "koreasprint.com", "date": "2026-09-05 00:20", "url": "https://www.koreasprint.com/news/articleView.html?idxno=18674", "category": "contract", "importance": 3, "wl": false, "topic": "kt 클라우드"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - Whalesbook", "summary": "인도 국영 통신사 BSNL의 4G 네트워크 일일 트래픽이 6 페타바이트를 돌파하는 마일스톤을 달성했다. 가입자들의 데이터 이용량이 급증하면서 네트워크 부하와 처리 용량 확대의 필요성이 커지고 있다. 4G망 구축 확대와 함께 트래픽 처리 능력이 안정적으로 안착하고 있음을 보여준다. 인도 공공 통신 인프라의 서비스 이용 추이를 보여주는 지표다.", "source": "Whalesbook", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "tech", "importance": 3, "wl": false, "topic": "bsnl 네트워크"}, {"title": "Philippine telcos set $2.2B for infrastructure investment in 2026", "summary": "필리핀 정보통신부는 현지 통신사들이 2026년에 인프라 투자 명목으로 22억 달러를 책정했다고 밝혔다. 이번 대규모 투자는 국가의 디지털 전환에 대한 확신을 보여주는 평가를 받고 있다. 통신사들의 네트워크 고도화와 투자 동향을 시사한다.", "source": "Light Reading", "date": "2026-09-04 21:43", "url": "https://www.lightreading.com/regulatory-politics/philippine-telcos-set-2-2b-for-infrastructure-investment-in-2026", "category": "contract", "importance": 3, "wl": true, "topic": "필리핀통신 인프라투자"}, {"title": "Deutsche Telekom eyes synergies from Greek move - Mobile World Live", "summary": "도이치텔레콤이 그리스 법인(코스모테) 사업 재편을 통해 시너지 창출을 모색하고 있다. 유럽 지역 내 자회사 운영 효율성을 높이고 수익성을 개선하기 위한 경영 전략의 일환이다. 해외 시장에서의 사업 포트폴리오 최적화 작업을 보여준다.", "source": "Mobile World Live", "date": "2026-09-04 21:13", "url": "https://www.mobileworldlive.com/europe/deutsche-telekom-eyes-synergies-from-greek-move/", "category": "strategy", "importance": 3, "wl": false, "topic": "도이치텔레콤 전략"}, {"title": "The Buildout: Louisiana targets 15K BEAD locations by early 2027", "summary": "미국 루이지애나주 등에서 브로드밴드 구축 사업이 본격적으로 진행되고 있다. 케이준 브로드밴드와 넥스트링크 등이 BEAD 사업을 수행 중이며, 컴캐스트와 즐플라이 등도 인프라 확장 마일스톤을 달성했다. 통신 사업자들의 지역망 투자 동향을 보여준다.", "source": "Light Reading", "date": "2026-09-04 21:00", "url": "https://www.lightreading.com/broadband/the-buildout-louisiana-targets-15k-bead-locations-by-early-2027", "category": "contract", "importance": 3, "wl": true, "topic": "루이지애나 브로드밴드"}, {"title": "T-Mobile seeks positive energy from new CFO - telcotitans.com", "summary": "티모바일 US가 새로운 최고재무책임자(CFO) 영입을 통해 재무 안정성과 새로운 성장 동력을 모색하고 있다. 최고경영진 교체 시기를 맞아 재무 전략의 변화가 예상된다.", "source": "telcotitans.com", "date": "2026-09-04 19:09", "url": "https://www.telcotitans.com/deutsche-telekomwatch/t-mobile-seeks-positive-energy-from-new-cfo/10842.article", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 임원"}, {"title": "楽天モバイル、楽天ID未連携なら12月に自動解約へ - BigGo ファイナンス", "summary": "楽天모바일이 12월부터 楽天 ID 연계를 필수로 지정하고, 미연계 시 자동 해지 처리에 들어간다. 가입자 관리 기준을 엄격하게 적용하는 정책 변경이다.", "source": "BigGo ファイナンス", "date": "2026-09-04 18:35", "url": "https://finance.biggo.jp/news/2e72d1a6-ff89-43cb-a84c-4a467009e116", "category": "contract", "importance": 3, "wl": false, "topic": "楽天모바일 12월 id 미연계 자동 해지"}, {"title": "楽天モバイルの看板＝東京都新宿区 - 楽天ID未連携で強制解約 モバイル利用者、11月末 - 写真・画像(1/1) - nishinippon.co.jp", "summary": "楽天모바일이 11월 말까지 ID를 연계하지 않은 모바일 이용자들을 대상으로 강제 해약을 진행한다고 예고했다. 가입자 관리 정책의 엄격한 집행을 보여준다.", "source": "nishinippon.co.jp", "date": "2026-09-04 18:28", "url": "https://www.nishinippon.co.jp/image/1079124/", "category": "contract", "importance": 3, "wl": false, "topic": "楽天모바일 id 미연계 11월 말 강제 해약 예고"}, {"title": "楽天モバイル、ID未連携ユーザーを強制解約へ 11月末期限で - mainichi.jp", "summary": "楽天모바일이 11월 말까지 楽天 ID를 연계하지 않은 이용자들을 대상으로 강제 해약 조치를 단행한다. 가입자 정보 관리 체계를 정비하기 위한 규정 강화다. 통신사의 약관 및 가입자 정책 변경 건이다.", "source": "mainichi.jp", "date": "2026-09-04 18:21", "url": "https://mainichi.jp/articles/20260904/k00/00m/020/296000c", "category": "contract", "importance": 3, "wl": false, "topic": "楽天모바일 id 미연계 이용자 강제 해약 조치"}, {"title": "楽天モバイルが楽天ID未連携の利用者を11月末に強制解約へ (2026年9月4日掲載) - ライブドアニュース", "summary": "楽天모바일이 楽天 ID 연계를 완료하지 않은 가입자들을 대상으로 11월 말에 강제 해약을 단행하기로 한 소 const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
