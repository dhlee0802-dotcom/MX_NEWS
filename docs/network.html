ce": 4, "wl": true, "topic": "한화 방산 폴란드 수주"}, {"title": "\"조직범죄 기업이냐, 中 기술굴기 견제냐\"…美 법정 서는 화웨이", "summary": "미국 정부가 화웨이를 거래제한 명단에 올린 데 이어 첨단 반도체 접근을 제한하고 미국 시장에서 화웨이 통신장비 퇴출을 추진하는 등 제재를 고수하고 있다. 조직범죄 기업 프레임과 중국 기술 굴기 견제라는 명분이 엇갈리는 가운데 화웨이는 독자 생존을 모색하고 있다. 글로벌 통신장비 시장에서 화웨이의 입지와 미·중 제재 전선의 긴장감이 지속되고 있다.", "source": "ajunews.com", "date": "2026-09-07 11:14", "url": "https://www.ajunews.com/view/20260907110239396", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 제재확대"}, {"title": "[이 시각 세계] 캐나다, 관세 갈등 속 중국과 8년 만에 국방대화", "summary": "캐나다가 관세 갈등 속에서 중국과 8년 만에 국방 대화를 재개하며 군사 교류와 협력 강화에 나섰다. 지난 2018년 미국의 요청으로 캐나다가 화웨이 멍완저우 부회장을 체포하면서 양국 관계가 급랭했으나 최근 해빙 국면에 접어들었다. 미·중 갈등 구도 속에서 캐나다의 대중국 외교 기조 변화를 보여주는 상징적 사건이다. 향후 통신장비 및 안보 지형에 미칠 파장이 주목된다.", "source": "imnews.imbc.com", "date": "2026-09-07 07:21", "url": "https://imnews.imbc.com/replay/2026/nwtoday/article/6850008_37012.html", "category": "policy", "importance": 4, "wl": false, "topic": "캐나다-중국 국방대화"}, {"title": "화웨이 , 美 법정서 ‘성장 과정 불법성’ 가린다", "summary": "중국 최대 통신장비 업체 화웨이가 미국 법정에서 회사의 성장 과정과 영업비밀 탈취, 대북·이란 제재 우회 혐의를 다루는 대형 형사재판을 치른다. 미국 검찰은 20여년에 걸친 불법 행위를 겨냥하고 있으며 화웨이는 이에 맞서고 있다. 글로벌 통신장비 업계의 선두 주자인 화웨이를 둘러싼 사법 리스크가 최고조에 달했다. 향후 판결 결과에 따라 글로벌 통신장비 시장 구도가 크게 흔들릴 수 있다.", "source": "g-enews.com", "date": "2026-09-07 04:02", "url": "https://www.g-enews.com/view.php?ud=2026090623002345259a1f309431_1", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 재판시작"}, {"title": "Was Huawei’s rise built on crime? A US jury will decide", "summary": "미국 법원에서 화웨이를 상대로 한 형사 재판이 진행될 예정이라는 보도이다. 과거 화웨이 재무담당자의 체포 이후 화웨이 본사를 겨냥한 사법 리스크가 본격화되고 있음을 보여준다. 글로벌 대형 통신장비 경쟁사인 화웨이의 법적 리스크와 기업 전략에 미칠 파장이 주목된다.", "source": "Financial Times Tech", "date": "2026-09-06 21:00", "url": "https://www.ft.com/content/9422805f-519c-4b22-839c-cbd7a6464f07?syn-25a6b1a6=1", "category": "other", "importance": 4, "wl": true, "topic": "화웨이 재판"}, {"title": "‘관세 폭탄’ 美에 등 돌린 加, 中과 8년 만에 군사 교류", "summary": "캐나다가 미국과의 관세 갈등 여파로 중국과의 관계 개선에 나서며 8년 만에 국방 대화를 재개했다. 과거 화웨이 멍완저우 사태로 인해 최악으로 치달았던 양국 관계가 새로운 국면을 맞이했다. 마크 카니 총리 취임 이후 외교적 다변화를 꾀하는 행보로 해석된다. 글로벌 공급망과 안보 외교에 미치는 파급효과가 크다.", "source": "kmib.co.kr", "date": "2026-09-06 18:38", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000009486&cp=nv", "category": "policy", "importance": 4, "wl": false, "topic": "캐나다-중국 군사교류"}, {"title": "‘美 갈등’ 캐나다, 中과 밀착… 8년 만에 국방 대화", "summary": "중국과 캐나다가 2018년 화웨이 멍완저우 체포 사건으로 중단되었던 국방 당국 간 협의 체계를 8년 만에 가동하고 군사 협력을 강화하기로 했다. 미·중 갈등의 최전선에 있었던 캐나다가 대중국 관계 회복에 속도를 내고 있다. 양국 간 해빙 무드가 글로벌 통신 및 외교 지형에 미칠 영향이 주목된다. 화웨이 사태로 촉발된 과거 갈등이 새로운 국면으로 전환되고 있다.", "source": "fnnews.com", "date": "2026-09-06 18:32", "url": "https://www.fnnews.com/news/202609061831130316", "category": "policy", "importance": 4, "wl": false, "topic": "캐나다-중국 국방협력"}, {"title": "中, '美와 갈등' 캐나다와 8년만에 국방대화…\"군사협력 강화\"", "summary": "중국과 캐나다가 2018년 화웨이 사태 이후 단절되었던 국방 대화를 전격 재개하고 군사 교류 및 협력 강화를 선언했다. 양국은 과거 국방 협의 체계를 복원하며 관계 정상화에 시동을 걸었다. 미국의 대중 견제 전선에서 캐나다의 이탈 조움이 외교가의 주목을 받고 있다. 향후 글로벌 안보 및 경제 협력의 변수로 작용할 전망이다.", "source": "fnnews.com", "date": "2026-09-06 15:42", "url": "https://www.fnnews.com/news/202609061533243926", "category": "policy", "importance": 4, "wl": false, "topic": "중국-캐나다 국방회담"}, {"title": "Nokia opens research and development centre in Riyadh - TahawulTech.com", "summary": "노키아가 리야드에 새로운 연구개발 센터를 개소하며 현지 기술 혁신과 입지 강화를 도모한다.", "source": "TahawulTech.com", "date": "2026-09-07 16:29", "url": "https://www.tahawultech.com/news/nokia-opens-research-and-development-centre-in-riyadh/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 r&d"}, {"title": "위축됐던 통신망 투자, AI 트래픽 폭발에 재확대 기로", "summary": "글로벌 통신 장비 업체 에릭슨이 피지컬 AI, 로봇, AI 에이전트 간 통신 증가로 2030년 데이터 업로드 트래픽이 현재보다 3~5배 증가할 것으로 전망했다. 폭발적인 AI 트래픽 수요에 대응하기 위해 위축되었던 통신망 투자가 재확대되는 기로에 놓였다. 이를 뒷받침하기 위한 첫 단계로 5G SA 전환이 가속화되고 있다. 장비 업계는 차세대 트래픽 급증에 대비한 인프라 솔루션 확충에 주력하고 있다.", "source": "mediapen.com", "date": "2026-09-07 16:04", "url": "https://www.mediapen.com/news/view/1121802", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 트래픽전망"}, {"title": "Maxis Business upgrades optical transport network with Nokia gear - Developing Telecoms", "summary": "맥시스 비즈니스가 노키아 장비를 도입하여 광전송 네트워크를 업그레이드하고 엔터프라이즈 네트워크 역량을 강화한다.", "source": "Developing Telecoms", "date": "2026-09-07 14:29", "url": "https://www.developingtelecoms.com/telecom-technology/optical-fixed-networks/20783-maxis-business-upgrades-optical-transport-network-with-nokia-gear.html", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 수주"}, {"title": "Rakuten Symphony, TAWAL Launch Saudi Arabia’s First Cloud RAN Shared Indoor Network - The ", "summary": "라쿠텐 심포니와 TAWAL이 협력하여 사우디아라비아 최초의 클라우드 기반 오픈랜 공유 실내 네트워크를 구축했다.", "source": "The Fast Mode", "date": "2026-09-07 08:34", "url": "https://www.thefastmode.com/technology-solutions/50500-rakuten-symphony-tawal-launch-saudi-arabia-s-first-cloud-ran-shared-indoor-network", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐 심포니 수주"}, {"title": "통신 장비 주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게", "summary": "하나증권 연구진은 3G부터 5G를 거치며 무선 장비 업체 수는 감소한 반면 선도업체 매출은 오히려 증가하는 '쏠림 현상'이 반복되어 왔다고 진단했다. 엔비디아가 AI 기지국(AI-RAN) 시장으로 사업을 확장하는 등 통신장비 산업의 지형도 변화가 예고되고 있다. 글로벌 장비 시장의 구조조정과 선도사 중심의 재편 흐름이 뚜렷해지고 있다. 향후 투자 전략 수립에 중요한 시사점을 제공한다.", "source": "metroseoul.co.kr", "date": "2026-09-06 09:44", "url": "http://www.metroseoul.co.kr/article/20260906500019", "category": "earnings", "importance": 3, "wl": false, "topic": "통신장비주 쏠림현상"}, {"title": "PTA Delays Decision on Ufone–Telenor Merger Amid Spectrum Auction - techjuice.pk", "summary": "파키스탄 통신청(PTA)이 주파수 경매 일정과 맞물려 유폰과 텔레노르 간의 합병 결정을 연기했다. 이번 M&A는 현지 통신 시장의 구도를 재편할 수 있는 대형 딜로 주목받아 왔다. 규제 당국의 신중한 검토로 인해 최종 승인까지는 다소 시간이 걸릴 예정이다. 경쟁사들의 시장 점유율 변화에 미칠 영향이 주목된다.", "source": "techjuice.pk", "date": "2026-09-05 21:24", "url": "https://www.techjuice.pk/pta-delays-decision-on-ufone-telenor-merger-amid-spectrum-auction/", "category": "contract", "importance": 3, "wl": false, "topic": "파키스탄 통신사"}, {"title": "통신사 및 장비·부품사 총출동… 5G 테마 종목별 온도 차 명확", "summary": "네트워크 통합 솔루션 기업 오파스넷을 비롯해 광통신 및 통신장비 관련 종목들이 증시에서 주목받고 있다. LS에코에너지와 삼성전자 등 관련 주가 흐름이 양호한 모습을 보이고 있다. 5G 및 AI 인프라 투자 확대에 따른 수혜 기대감이 반영된 결과다. 통신장비 부품 시장의 종목별 차별화 장세가 이어지고 있다.", "source": "pinpointnews.co.kr", "date": "2026-09-07 13:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484543", "category": "earnings", "importance": 2, "wl": false, "topic": "오파스넷 네트워크"}, {"title": "Turkcell integrates BiP messaging app into Huawei's Watch Kids X1 smartwatch - Telecompape", "summary": "튀르케셀이 BiP 메신저 앱을 화웨이의 어린이용 스마트워치에 통합하여 서비스 연동을 확대한다.", "source": "Telecompaper", "date": "2026-09-07 12:14", "url": "https://www.telecompaper.com/news/turkcell-integrates-bip-messaging-app-into-huaweis-watch-kids-x1-smartwatch--1581827", "category": "tech", "importance": 2, "wl": false, "topic": "화웨이 어린이용 스마트워치"}, {"title": "명진아이씨티, K-ICT WEEK 2026서 Wi-Fi7 무선인프라 소개... \"공공·기업...", "summary": "명진아이씨티가 K-ICT WEEK 2026에서 Wi-Fi 7 무선 인프라와 유무선 네트워킹 보안 솔루션을 소개했다. 공공기관과 기업을 대상으로 한 네트워크 장비 공급 및 통합 솔루션 사업을 강화하고 있다. 최신 무선 표준 도입을 통해 고성능 통신 환경을 지원하는 기술력을 알리고 있다. 국내 네트워크 장비 시장의 기술 트렌드를 보여주는 사례다.", "source": "kr.aving.net", "date": "2026-09-07 10:26", "url": "https://kr.aving.net/news/articleView.html?idxno=1814126", "category": "tech", "importance": 2, "wl": false, "topic": "명진아이씨티 wi-fi7"}, {"title": "킨텍스서 9일 5G 특화망 세미나… 중소기업 지원사업 무료 소개 - specialtimes.co.kr", "summary": "킨텍스에서 5G 특화망 관련 세미나가 개최되어 중소기업 지원사업 및 관련 생태계 활성화 방안이 소개된다.", "source": "specialtimes.co.kr", "date": "2026-09-07 09:25", "url": "http://www.specialtimes.co.kr/news/articleView.html?idxno=459279", "category": "other", "importance": 2, "wl": false, "topic": "5g 특화망 세미나"}, {"title": "Is Nokia Oyj (HLSE:NOKIA) A Bargain Following Its AI And Broadband Expansion? - simplywall", "summary": "노키아가 AI 및 초고속 브로드밴드 사업을 확장함에 따라 주식 시장에서의 가치 평가와 매력도를 분석한다.", "source": "simplywall.st", "date": "2026-09-07 03:38", "url": "https://simplywall.st/stocks/fi/tech/hel-nokia/nokia-oyj-shares/news/is-nokia-oyj-hlsenokia-a-bargain-following-its-ai-and-broadb", "category": "other", "importance": 2, "wl": false, "topic": "노키아 투자"}, {"title": "Nokia stock holds as investors await a fresh catalyst - AD HOC NEWS", "summary": "투자자들이 새로운 사업적 촉매제를 기다리는 가운데 노키아 주가가 안정세를 유지하고 있다.", "source": "AD HOC NEWS", "date": "2026-09-07 02:20", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/nokia-stock-holds-as-investors-await-a-fresh-catalyst/70060893", "category": "other", "importance": 2, "wl": false, "topic": "노키아 주가"}, {"title": "Nokia, Ericsson, IBM, to Blackberry: How humbled tech giants reinvented for a comeback - T", "summary": "노키아, 에릭슨, IBM 등 과거 명성 높은 기술 거인들이 어떻게 비즈니스를 재편하고 시장에 다시 복귀했는지 조명한다.", "source": "The Indian Express", "date": "2026-09-06 17:07", "url": "https://indianexpress.com/article/explained/explained-economics/nokia-ericsson-ibm-blackberry-comeback-10865506/lite/", "category": "other", "importance": 2, "wl": false, "topic": "노키아 재도약"}, {"title": "수급 악화로 주가 빠졌지만… RFHIC 반등 기대 커지는 까닭 - pinpointnews.co.kr", "summary": "국내 통신부품 업체 RFHIC의 주가 반등 가능성이 제기되었다. 수급 악화로 주가가 조정을 받았으나 실적 개선 기대감이 유입되고 있다. 글로벌 통신장비 투자가 점진적으로 회복되면서 부품 공급사들의 실적 개선 여부가 주목된다. 향후 수주 확대가 주가 반등의 열쇠가 될 전망이다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 09:56", "url": "https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=484216", "category": "earnings", "importance": 2, "wl": false, "topic": "rfhic 실적"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "통신 임원들은 5G의 더 큰 기회가 단순 소비자용을 넘어 산업용 자동화 영역에 있다고 평가하고 있다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 2, "wl": false, "topic": "5g 산업용 자동화"}, {"title": "공장 환경을 위한 무선 공존 설계", "summary": "공장 환경에서 무선 네트워크 간 간섭을 막기 위해 별도의 주파수 대역을 할당하는 공존 설계 방식이 다뤄졌다. 성능은 회복되었으나 데이터 재전송 증가와 지연 시간 발생 등 트래픽 최적화의 과제가 남았다. 산업용 무선 통신망의 안정성을 높이기 위한 기술적 고려사항을 보여준다. 스마트팩토리 구축에 있어 네트워크 설계의 중요성을 시사한다.", "source": "hellot.net", "date": "2026-09-05 20:32", "url": "https://www.hellot.net/news/article.html?no=114796", "category": "tech", "importance": 2, "wl": false, "topic": "무선공존 설계"}], "policy": [{"title": "China's MIIT Releases 15th Five-Year Plan: Build Next-Gen Communications Network by 2030, ", "summary": "중국 공업정보화부(MIIT)가 제15차 5개년 계획을 통해 2030년까지 차세대 통신망 구축을 완료하겠다는 목표를 발표했다. 주요국의 국가 차원 통신 인프라 전략 수립을 보여준다.", "source": "finance.biggo.com", "date": "2026-09-07 16:56", "url": "https://finance.biggo.com/news/c06e0cf7-cf84-447c-adea-297ca2346213", "category": "policy", "importance": 4, "wl": false, "topic": "중국 공업정보화부 차세대 통신망 계획"}, {"title": "India Plans Phased Removal of Chinese Equipment from Telecommunications Networks - zamin.u", "summary": "인도 정부가 통신망에서 중국산 장비를 단계적으로 철수하는 계획을 추진하며 글로벌 장비 공급망에 영향을 미치고 있다.", "source": "zamin.uz", "date": "2026-09-07 15:22", "url": "https://zamin.uz/en/technology/220473-india-plans-phased-removal-of-chinese-equipment-from-telecommunications-networks.html", "category": "policy", "importance": 4, "wl": false, "topic": "인도 통신장비 제재"}, {"title": "'AI 공장장' 제조현장으로··· 과기정통부 -중기부, 피지컬 AI 실증 확대", "summary": "과기정통부와 중소벤처기업부가 손잡고 중소 제조기업 현장에 피지컬 AI 실증을 확산한다. 과기정통부가 개발한 피지컬 AI 기술을 중기부의 스마트제조혁신 정책과 연계하여 제조업 혁신을 도모한다. 무인공장 제어 및 초정밀 제조 지능화 등 현장 맞춤형 AI 도입이 본격화된다. 정부 부처 간 협업을 통한 산업 디지털 전환의 대표적 사례다.", "source": "hellodd.com", "date": "2026-09-07 18:18", "url": "http://www.hellodd.com/news/articleView.html?idxno=113082", "category": "tech", "importance": 3, "wl": false, "topic": "과기정통부-중기부 피지컬ai"}, {"title": "\"AI 공장장이 간다\"…중소 제조 현장 '피지컬 AI' 시동", "summary": "과기정통부와 중소벤처기업부 차관이 KAIST를 찾아 '모두의 AI 공장장' 전략을 발표했다. 전북(무인공장 제어)과 경남(초정밀 제조 지능화) 지역 실증을 통해 확보한 피지컬 AI 기술을 중소 제조 현장에 전격 보급한다. 제조업의 생산성과 효율성을 획기적으로 높이기 위한 범정부 차원의 지원이 시작된다. 스마트 제조 혁신 생태계 조성에 가속도가 붙고 있다.", "source": "news.sbs.co.kr", "date": "2026-09-07 17:58", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008741677&plink=ORI&cooper=NAVER", "category": "tech", "importance": 3, "wl": false, "topic": "모두의ai 공장장"}, {"title": "\"로봇 몇 대, 어디로 움직일까\"…중소 제조현장에 'AI 공장장' 뜬다", "summary": "과기정통부가 KAIST 피지컬 AI 실증랩에서 중기부와 함께 중소 제조현장 맞춤형 '모두의 AI 공장장' 전략을 공개했다. 로봇의 동작과 공장 자동화를 지원하는 피지컬 AI의 현장 보급 청사진이 제시되었다. 제조 현장의 지능화를 이끌어낼 구체적인 실증 사업들이 추진된다. 정부의 강력한 스마트제조 혁신 의지를 보여준다.", "source": "newsis.com", "date": "2026-09-07 17:44", "url": "https://www.newsis.com/view/NISX20260907_0003779780", "category": "tech", "importance": 3, "wl": false, "topic": "kaist 피지컬ai실증"}, {"title": "\"AI 공장장 모셔볼까?\"…정부, '중소기업 맞춤형' 피지컬 AI 전격 지원", "summary": "과기정통부와 중기부가 중소 제조기업의 피지컬 AI 도입을 위해 R&D부터 컨설팅까지 전방위 지원에 나선다. KAIST를 찾은 두 부처 차관은 현장 간담회를 통해 실질적인 협력 방안을 모색했다. 제조 현장의 고질적인 인력 난제 해결과 생산성 혁신이 기대된다. 중소기업 맞춤형 AI 생태계 구축의 신호탄이다.", "source": "tjb.co.kr", "date": "2026-09-07 17:38", "url": "https://www.tjb.co.kr/news05/bodo/view/id/103306", "category": "tech", "importance": 3, "wl": false, "topic": "중소기업 피지컬ai지원"}, {"title": "중기부· 과기정통부 , 중소 제조현장에 피지컬 AI 심는다", "summary": "중소벤처기업부와 과학기술정보통신부가 중소 제조기업의 피지컬 AI 도입 지원을 위해 뜻을 모았다. 양 부처 차관과 얼라이언스 관계자들이 참석한 가운데 현장 간담회가 개최되었다. 기술 개발 역량과 현장 지원 정책의 결합으로 시너지 창출이 기대된다. 제조업 전반의 지능화 전환 속도가 빨라질 전망이다.", "source": "platum.kr", "date": "2026-09-07 17:36", "url": "https://platum.kr/archives/294085", "category": "tech", "importance": 3, "wl": false, "topic": "중기부-과기정통부 협력"}, {"title": "과기정통부 -중기부, 중소 제조기업 '피지컬 AI' 확산 나선다", "summary": "과기정통부와 중기부가 제조업 피지컬 AI 확산을 위해 KAIST 실증랩을 방문하고 본격적인 협력 체제에 돌입했다. 전북과 경남의 지역 실증 성과를 바탕으로 무인공장 및 제조 지능화 기술을 전국으로 보급할 계획이다. 제조업의 미래 성장 동력을 확보하기 위한 범정부 차원의 지원이 구체화되고 있다.", "source": "it-b.co.kr", "date": "2026-09-07 17:32", "url": "https://www.it-b.co.kr/news/articleView.html?idxno=89774", "category": "tech", "importance": 3, "wl": false, "topic": "제조업 피지컬ai 확산"}, {"title": "과기정통부 ‘모두의 AI 공장장’과 중기부 ‘스마트제조혁신’ 사업 연...", "summary": "과기정통부의 '모두의 AI 공장장' 사업과 중기부의 '스마트제조혁신' 사업이 연계되어 공동 지원에 나선다. 기술 개발부터 실증, 사업화에 이르는 전 주기를 두 부처가 함께 뒷받침한다. 중소 제조기업의 AI 도입 문턱을 낮추고 실효성을 높이는 계기가 될 것이다. 제조 산업의 디지털 혁신이 한층 탄력을 받게 되었다.", "source": "dt.co.kr", "date": "2026-09-07 17:30", "url": "https://www.dt.co.kr/article/12082568?ref=naver", "category": "tech", "importance": 3, "wl": false, "topic": "스마트제조혁신 연계"}, {"title": "SKT, 보안 AI 국가사업 '고배'···네이버 컨소시엄 우위", "summary": "과기정통부 주관의 사이버보안 특화 AI 파운데이션 모델 사업 최종 사업자로 네이버클라우드 컨소시엄이 선정되었다. SK텔레콤 등 경쟁 컨소시엄을 제치고 국가 보안 AI 사업의 주도권을 확보했다. 산학연 대규모 컨소시엄 구성을 통해 차세대 보안 AI 기술 개발에 착수한다. 국가 핵심 인프라의 사이버 보안 역량을 강화하는 중대한 프로젝트다.", "source": "finomy.com", "date": "2026-09-07 17:28", "url": "http://www.finomy.com/news/articleView.html?idxno=260904", "category": "contract", "importance": 3, "wl": false, "topic": "사이버보안 ai사업"}, {"title": "과기부-중기부, ‘피지컬 AI’로 중소 제조사 미래성장 돕는다", "summary": "과기정통부와 중기부가 KAIST를 방문해 피지컬 AI 기술개발 역량과 현장 지원 정책을 연계하는 협력 방안을 논의했다. 중소 제조사의 미래 성장을 돕기 위한 실질적인 지원책이 가동된다. 제조업의 로봇 및 AI 자동화 도입이 활성화될 전망이다.", "source": "biz.newdaily.co.kr", "date": "2026-09-07 17:22", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/07/2026090700341.html", "category": "tech", "importance": 3, "wl": false, "topic": "과기부-중기부 피지컬ai협력"}, {"title": "중기부· 과기정통부 , 피지컬 AI 확산 간담회 개최", "summary": "중기부와 과기정통부가 KAIST에서 피지컬 AI 확산을 위한 합동 간담회를 개최했다. 스마트제조혁신 지원정책과 피지컬 AI 실증 역량을 결합하여 현장 체감도를 높일 방침이다. 중소 제조업의 AI 전환을 위한 긴밀한 공조가 이어지고 있다.", "source": "hansbiz.co.kr", "date": "2026-09-07 17:14", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=862884", "category": "tech", "importance": 3, "wl": false, "topic": "중기부-과기정통부 간담회"}, {"title": "2028년 중소기업 물류·생산 전 공정에 피지컬 AI 적용한다", "summary": "과기정통부와 중기부가 2028년까지 중소기업의 물류 및 생산 전 공정에 피지컬 AI를 적용하는 목표를 추진한다. '모두의 공장장' 사업을 통해 컨설팅부터 단계적 도입을 지원한다. 제조 현장의 완전한 자동화와 지능화를 달성하기 위한 장기 로드맵이 가동되었다.", "source": "hankookilbo.com", "date": "2026-09-07 17:14", "url": "https://www.hankookilbo.com/news/article/A2026090715010001912?did=NA", "category": "tech", "importance": 3, "wl": false, "topic": "2028 피지컬ai적용"}, {"title": "Reliance Jio and GSMA nudge TRAI for Net Neutrality violating Network Slicing - MediaNama", "summary": "릴라이언스 지오와 GSMA가 망중립성을 위반할 소지가 있는 네트워크 슬라이싱 도입을 위해 TRAI에 완화를 촉구했다는 보도다. 통신 규제 및 정책 방향과 관련된 사안으로 주시할 필요가 있다.", "source": "MediaNama", "date": "2026-09-07 17:10", "url": "https://www.medianama.com/2026/09/223-jio-gsma-network-slicing-net-neutrality/", "category": "policy", "importance": 3, "wl": false, "topic": "릴라이언스 지오 규제"}, {"title": "과기정통부 -중기벤처부, 제조업 피지컬 AI ‘협력’…부산경남 수혜", "summary": "과기정통부와 중기부가 제조업 피지컬 AI 적용 확산을 추진하면서 부산·경남 지역 제조기업들이 수혜를 입을 전망이다. 로봇 등 물리적 기기에 AI를 적용하는 기술이 지역 주력 제조업에 도입된다. 지역 산업의 경쟁력을 강화하고 스마트 공장 고도화를 이끌어낼 것으로 기대된다.", "source": "kookje.co.kr", "date": "2026-09-07 16:49", "url": "http://www.kookje.co.kr/news2011/asp/newsbody.asp?code=0200&key=20260907.99099001862", "category": "tech", "importance": 3, "wl": false, "topic": "부산경남 피지컬ai"}, {"title": "\"AI 자립 외치더니 안마당 내주나\"… 공공 클라우드 빗장 완화에 '역차별...", "summary": "정부의 공공 클라우드 보안인증(CSAP) 빗장 완화 움직임에 대해 역차별 논란과 함께 해외 컨트롤 플레인에 대한 보안 통제력 상실 우려가 제기되었다. 국정원과 과기정통부 주관의 보안 검증 체계 변화가 가져올 파장이 주목된다. 해외 클라우드 서비스 장애 발생 시 책임 소재와 정부의 통제력 확보 방안이 핵심 쟁점으로 떠올랐다. 공공 IT 인프라 정책의 중요한 변곡점이다.", "source": "newsis.com", "date": "2026-09-07 16:47", "url": "https://www.newsis.com/view/NISX20260907_0003779224", "category": "policy", "importance": 3, "wl": false, "topic": "공공클라우드 csap"}, {"title": "정부, 전력망·수요 대응 기술 확보… 에너지 R&D 투자 본격화", "summary": "과기정통부의 2027년도 에너지 기술 R&D 예산이 7336억 원으로 올해보다 48.2% 대폭 증가했다. AI 데이터센터 확산에 따른 전력 수요 급증에 대응하기 위해 전력망 및 수요 대응 기술 확보에 투자가 집중된다. 국가 차원의 에너지 인프라 R&D 강화 기조가 뚜렷해졌다. 향후 전력·에너지 관련 기술 생태계 성장에 큰 촉매가 될 것이다.", "source": "polinews.co.kr", "date": "2026-09-07 16:44", "url": "https://www.polinews.co.kr/news/articleView.html?idxno=742393", "category": "policy", "importance": 3, "wl": false, "topic": "에너지 r&d예산"}, {"title": "황정아 의원, AI 전력수요 급증에 에너지 R&D 48% 확대", "summary": "국회 과방위 소속 황정아 의원이 과기정통부로부터 제출받은 자료에 따르면 AI 전력수요 급증에 대응해 내년도 에너지 기술 관련 R&D 예산안이 대폭 확대되었다. 전력망 안정화 및 관련 기술 확보의 시급성이 국정감사 및 예산 심의 과정에서 부각되었다. 급증하는 인프라 전력 수요에 발맞춘 정부의 선제적 투자 편성이 이루어졌다.", "source": "kmecnews.co.kr", "date": "2026-09-07 16:42", "url": "https://www.kmecnews.co.kr/news/articleView.html?idxno=51694", "category": "policy", "importance": 3, "wl": false, "topic": "황정아 의원 에너지r&d"}, {"title": "Govt readies telecom PLI successor with significant outlay and components focus, targets Q", "summary": "인도 정부가 상당한 예산과 부품 중심의 초점을 맞춘 차기 통신 생산연계인센티브(PLI) 후속 제도를 준비하고 있다.", "source": "Moneycontrol.com", "date": "2026-09-07 15:15", "url": "https://www.moneycontrol.com/news/telecom/govt-readies-telecom-pli-successor-with-significant-outlay-and-components-focus-targets-q1-fy28-rollout-14024086.html", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신 pli"}, {"title": "[AI 고속도로] 공공 클라우드 외산 문턱 낮아지나…국내업계 \"역차별 없...", "summary": "과기정통부의 CSAP와 국정원 보안검증으로 이원화되었던 공공 클라우드 규제 완화 논의가 이어졌다. 해외 컨트롤 플레인 도입 시 장애 발생 시의 책임 소재와 정부의 통제력 확보 방안이 핵심 쟁점으로 부각되었다. 국내 클라우드 업계의 역차별 해소 요구와 맞물려 정책 방향에 관심이 집중된다. 공공 IT 시장의 보안 체계 재편이 예고된다.", "source": "zdnet.co.kr", "date": "2026-09-07 15:12", "url": "https://zdnet.co.kr/view/?no=20260907143308", "category": "policy", "importance": 3, "wl": false, "topic": "공공클라우드 보안검증"}, {"title": "불법 스트리밍 '주소 차단' 넘어 송출 원천 막는다... 셋톱박스 추적 제도화 제안", "summary": "한국저작권보호원이 개최한 포럼에서 유료방송 셋톱박스 식별정보를 활용해 불법 스트리밍 장치(ISD)의 송출 원점을 추적 및 차단하는 제도를 법제화해야 한다는 제안이 나왔다. 유료방송 및 통신 인프라 관련 정책·규제 논의이다.", "source": "전자신문", "date": "2026-09-07 14:03", "url": "https://www.etnews.com/20260907000303", "category": "policy", "importance": 3, "wl": true, "topic": "한국저작권보호원 불법스트리밍"}, {"title": "Communications Minister Jyotiraditya Scindia releases revised TDIP guidelines to boost tel", "summary": "인도 통신부 장관이 통신 인프라 투자를 촉진하기 위해 개정된 TDIP 지침을 발표했다. 이번 지침은 통신사들의 네트워크 투자 부담을 완화하고 관련 생태계를 활성화하는 데 초점을 맞추고 있다. 인도 내 통신망 고도화와 5G·6G 전환 가속화에 기여할 것으로 기대된다. 관련 업계는 규제 완화에 따른 수혜를 주시하고 있다.", "source": "News On AIR", "date": "2026-09-06 22:10", "url": "https://newsonair.gov.in/communications-minister-jyotiraditya-scindia-releases-revised-tdip-guidelines-to-boost-telecom-sector/", "category": "policy", "importance": 3, "wl": false, "topic": "인도통신부 tdip"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "미국 연방항공청(FAA)의 5G 무선 고도계 관련 규제 분쟁이 최종 마무리 단계에 접어들었다. 그동안 항공기 간섭 우려로 대립했던 5G 통신 주파수 사용 갈등이 해소 국면을 맞았다. 이번 결정으로 통신사들의 C밴드 5G 전국망 서비스 전개에 걸림돌이 제거되었다. 장비 조달과 네트워크 투자 안정성이 높아질 것으로 평가된다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "faa 5g"}, {"title": "피지컬 AI 기술 살피는 과기정통부 ·중기부 차관", "summary": "과기정통부와 중소벤처기업부 고위 관계자들이 KAIST 피지컬 AI 실증 랩(카이로스)을 방문해 기술 현황을 점검했다. 부처 간 협력을 바탕으로 한 제조 현장 AI 확산 의지를 현장 행보로 보여주었다. 피지컬 AI 상용화 및 실증 가속화가 기대된다.", "source": "yna.co.kr", "date": "2026-09-07 17:41", "url": "https://www.yna.co.kr/view/PYH20260907215300063?input=1196m", "category": "tech", "importance": 2, "wl": false, "topic": "과기정통부-중기부 현장방문"}, {"title": "계명대 동산의료원, 과기정통부 개인기초연구 12개 과제 선정", "summary": "계명대 동산의료원이 과기정통부 주관 '2026년 2차 개인기초연구사업'에서 신규 과제 12개가 선정되었다. 기초 연구 역량을 인정받으며 다양한 학술 연구를 수행하게 된다. 지역 의료 R&D 경쟁력 제고에 기여할 것으로 보인다.", "source": "dkilbo.com", "date": "2026-09-07 17:16", "url": "https://www.dkilbo.com/news/articleView.html?idxno=553554", "category": "tech", "importance": 2, "wl": false, "topic": "계명대 동산의료원 연구과제"}, {"title": "‘기술개발인의 날’ 첫 법정기념일 기념식… 산업 R&D 주역 한자리에", "summary": "첫 법정기념일로 지정된 '기술개발인의 날' 기념식에 국무총리와 국회 과학기술정보방송통신위원장 등이 참석해 산업 R&D 주역들을 격려했다. 기술개발인들이 자부심을 갖고 국가적 과제를 주도할 수 있도록 실질적인 지원을 약속했다. 산·학·연 관계자들이 모여 국가 기술 주권 확보의 의지를 다졌다.", "source": "biz.chosun.com", "date": "2026-09-07 17:12", "url": "https://biz.chosun.com/science-chosun/science/2026/09/07/5NAN4VY7PNB2PB7SK4B4GWBDZ4/?utm_source=naver&utm_medium=original&utm_campaign=biz", "category": "policy", "importance": 2, "wl": false, "topic": "기술개발인의날 행사"}, {"title": "고성군, 지능형 영상분석 도입으로 265개 마을 방범 CCTV 하나로 잇는다", "summary": "고성군이 과기정통부의 '2027년 스마트빌리지 보급 및 확산 사업'에 선정되어 지능형 영상분석을 도입한다. 기존 분산된 마을 방범 CCTV 시스템의 장비 상태 확인 및 장애 대응 한계를 극복할 예정이다. 농 ability – Sam George - MyJoyOnline", "summary": "가나 정부가 모든 농촌 지역의 통신망을 4G 역량으로 업그레이드하는 사업을 추진한다. 이를 통해 농어촌 주민들도 고속 모바일 데이터를 누릴 수 있도록 인프라를 개선할 방침이다. 정부 주도의 디지털 포용 정책의 일환으로 통신 장비 수요가 늘어날 전망이다. 향후 장비 공급사 선정 과정에 업계의 관심이 모이고 있다.", "source": "MyJoyOnline", "date": "2026-09-06 01:48", "url": "https://www.myjoyonline.com/govt-to-upgrade-all-rural-telephony-networks-to-4g-capability-sam-george/", "category": "tech", "importance": 3, "wl": false, "topic": "가나 농촌4g"}, {"title": "T-Mobile CEO appears to have given up on the postpaid crown as he talks up new categories ", "summary": "티모바일 CEO가 후불 가입자 시장 1위 타이틀 경쟁에서 한 발 물러서는 대신 새로운 사업 카테고리 확장에 집중하고 있다.", "source": "PhoneArena", "date": "2026-09-06 01:32", "url": "https://www.phonearena.com/news/t-mobile-losing-share-value-under-srini-gopalan_id183107", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 ceo 전략"}]};

      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
