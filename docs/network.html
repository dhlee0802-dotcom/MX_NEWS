  .art{padding:10px 0;border-top:1px solid var(--line)}

  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}

</head>

ata-per-day-c-dot/articleshow/133767038.cms", "category": "tech", "importance": 4, "wl": false, "topic": "bsnl 4g 네트워크"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "summary": "인도 통신망에 구축된 기존 중국산 통신장비의 전면 교체(Rip-and-Replace) 가능성이 제기되고 있다. 옴디아의 수석 애널리스트는 인도 네트워크에 수년간 운영되어온 중국산 장비의 보안 및 지정학적 리스크를 지적하며 교체 당위성을 언급했다. 이는 글로벌 통신 장비 시장에서 화웨이와 ZTE 등 중국 업체의 입지를 더욱 위축시키는 요인이다.", "source": "RCR Wireless", "date": "2026-09-04 23:22", "url": "https://rcrwireless.com/20260904/carriers/india-replace-chinese-equipment", "category": "policy", "importance": 4, "wl": true, "topic": "인도 중국산 장비 퇴출"}, {"title": "Huawei latest SingleRAN 22.1 launch targets the Agentverse - Total Telecom", "summary": "화웨이가 에이전트버스(Agentverse)를 겨냥한 최신 'SingleRAN 22.1' 솔루션을 공식 출시했다. AI 에이전트 시대에 발맞추어 무선 접속망의 지능화와 자율 운영 기능을 대폭 강화한 것이 특징이다. 글로벌 통신장비 시장에서 기술 주도권을 잡기 위한 화웨이의 최신 전략 제품이다.", "source": "Total Telecom", "date": "2026-09-04 22:16", "url": "https://totaltele.com/huawei-latest-singleran-22-1-launch-targets-the-agentverse/", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 싱글랜 22.1 출시"}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - mobileeurope.co.uk", "summary": "노키아가 사우디아라비아 리야드에 AI 중심의 연구개발(R&D) 센터를 신설했다. 중동 지역의 디지털 전환 흐름에 맞춰 AI 기반 통신 기술 개발을 가속화할 방침이다. 현지 파트너들과의 협력을 통해 차세대 네트워크 연구 거점으로 활용할 계획이다.", "source": "mobileeurope.co.uk", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 사우디 ai 연구센터"}, {"title": "Maxis strengthens its nationwide network infrastructure with Nokia’s optical transport tec", "summary": "말레이시아 통신사 맥시스(Maxis)가 전국 네트워크 인프라 강화를 위해 노키아의 광전송 기술을 도입하기로 했다. 노키아의 광네트워크 솔루션을 통해 데이터 트래픽 증가에 대응하고 전국적인 네트워크 성능을 향상시킨다. 이번 장비 공급 계약은 노키아의 아시아 지역 시장 입지를 더욱 공고히 할 것으로 전망된다.", "source": "telecomtv.com", "date": "2026-09-04 17:09", "url": "https://www.telecomtv.com/content/nokia/maxis-strengthens-its-nationwide-network-infrastructure-with-nokia-s-optical-transport-technology-56172/", "category": "contract", "importance": 4, "wl": false, "topic": "맥시스 노키아 광전송 장비 수주"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크가 일본 고치현 무로토곶 인근에서 성층권 통신 플랫폼 HAPS(High Altitude Platform Station)의 무인기 비행 시험을 성공적으로 완료했다. 이번 시험에서는 드론과 에지 컴퓨팅 시스템 간의 원활한 연결성을 검증하기 위한 포괄적인 테스트가 진행됐다. 회사는 이를 바탕으로 2027년 상용화를 목표로 하고 있으며, 차세대 비지상네트워크(NTN) 기술 경쟁력을 강화하고 있다.", "source": "Light Reading", "date": "2026-09-03 23:20", "url": "https://www.lightreading.com/satellite/softbank-completes-stratospheric-haps-trial-eyes-2027-deployment", "category": "tech", "importance": 4, "wl": true, "topic": "소프트뱅크 haps"}, {"title": "Telstra deploys Ericsson AI scheduler nationwide to boost mobile performance - Telecompape", "summary": "호주 통신사 텔스트라(Telstra)가 모바일 성능 극대화를 위해 에릭슨의 AI 스케줄러를 전국망에 전면 도입했다. AI 기반 스케줄링을 통해 무선 자원 관리를 최적화하고 사용자 체감 속도를 크게 향상시켰다. 에릭슨의 AI RAN 상용화 역량을 입증하는 주요 성과다.", "source": "Telecompaper", "date": "2026-09-03 14:48", "url": "https://www.telecompaper.com/news/telstra-deploys-ericsson-ai-scheduler-nationwide-to-boost-mobile-performance--1581561", "category": "contract", "importance": 4, "wl": false, "topic": "텔스트라 에릭슨 ai 스케줄러"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - The Fast", "summary": "에릭슨이 사우디아라비아에서 AI 기반 RAN(무선 접속망) 및 자율형 네트워크 고도화를 추진한다. 모빌리(Mobily)와의 협력을 통해 AI 기술을 통신망 운영에 접목하여 효율성을 극대화하고 있다. 중동 지역의 차세대 통신 인프라 혁신을 주도하는 핵심 사례로 주목받고 있다.", "source": "The Fast Mode", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 사우디 ai ran"}, {"title": "ファーウェイ、血圧測定対応ウォッチ「HUAWEI WATCH D3」先行公開", "summary": "화웨이(Huawei)가 독일 뮌헨에서 개최된 유럽심장병학회 학술대회(ESC Congress 2026)에서 손목 부착형 혈압 측정 스마트워치의 차세대 모델인 'HUAWEI WATCH D3'를 공식 선공개했다. 글로벌 의료 및 웨어러블 시장 공략을 위한 핵심 제 deutsche-telekom-s-t-mobile-us-merger", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 m&a"}, {"title": "KDDI achieves 3.6 Gbps outdoor transmission in 7 GHz 6G candidate band - Telecompaper", "summary": "KDDI가 7 GHz 6G 후보 대역에서 야외 전송 속도 3.6 Gbps를 달성했습니다. 차세대 6G 이동통신 기술 표준 선점을 위한 주파수 실증 시험 성과를 보여줍니다.", "source": "Telecompaper", "date": "2026-09-04 15:31", "url": "https://www.telecompaper.com/news/kddi-achieves-36-gbps-outdoor-transmission-in-7-ghz-6g-candidate-band--1581713", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도의 주요 통신사 릴라이언스 지오(Reliance Jio)가 4빌리언 달러 규모의 대형 기업공개(IPO)를 오는 나브라트리 및 디왈리 축제 시즌에 맞춰 추진할 계획이다. 성공적인 증시 입성을 위해 이르면 다음 주부터 본격적인 로드쇼를 시작할 것으로 전망된다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "other", "importance": 4, "wl": true, "topic": "릴라이언스 지오 ipo"}, {"title": "Bombay HC quashes ₹2,113 crore DoT demand against Vodafone Idea - scanx.trade", "summary": "인도 뭄바이 고등법원이 인도 통신국(DoT)이 보다폰아이디어를 상대로 제기한 2,113억 루피 규모의 요금 및 라이선스 비용 청구 소송을 기각했다. 통신사의 재무적 불확실성을 해소하는 중요한 법적 판결이다. 규제 및 세무 리스크 관련 주요 사건이다.", "source": "scanx.trade", "date": "2026-09-04 09:28", "url": "https://scanx.trade/stock-market-news/companies/bombay-high-court-quashes-2-113-crore-dot-demand-notices-against-vodafone-idea-for-one-time-spectrum-charges/42522031", "category": "policy", "importance": 4, "wl": false, "topic": "보다폰아이디어 규제"}, {"title": "国内初「空飛ぶ基地局」、試験成功…ソフトバンクが商用化へ - ニュースイッチ by 日刊工業新聞社", "summary": "소프트뱅크가 국내 최초로 성층권 '하늘 나는 기지국'(HAPS) 통신 시험에 성공하며 상용화를 앞두고 있습니다. 재난 대응 및 통신 사각지대 해소를 위한 혁신적 네트워크 기술 검증입니다.", "source": "ニュースイッチ by 日刊工業新聞社", "date": "2026-09-04 06:02", "url": "https://newswitch.jp/p/50177", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 haps"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "도이치텔레콤이 최고재무책임자(CFO) 퇴임 등 대규모 경영진 쇄신을 단행하는 가운데, AI 및 네트워크 역량 강화를 위해 AWS로부터 얀 호프마이어를 영입했다. 세대교체와 기술 혁신을 동시에 추진하는 고강도 조직 개편이다. 최고위 임원진 교체는 업계의 큰 관심사다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 임원"}, {"title": "Global Telecom Capex Ranking 2026: AT&T, Deutsche Telekom, China Mobile, NTT and Verizon L", "summary": "AT&T, 도이치텔레콤, 차이나모바일, NTT, 버라이즌 등이 포함된 2026년 글로벌 통신사 설비투자(Capex) 순위를 다루었습니다. 주요 통신사들의 네트워크 인프라 투자 규모를 가늠할 수 있는 중요한 시장 데이터입니다.", "source": "TelecomLead", "date": "2026-09-03 22:48", "url": "https://telecomlead.com/5g/global-telecom-capex-ranking-2026-att-deutsche-telekom-china-mobile-ntt-and-verizon-lead-network-investment-127592", "category": "contract", "importance": 4, "wl": false, "topic": "글로벌 통신사 케이팩스"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - AD HOC NEWS", "summary": "버라이즌 주가가 프론티어 인수를 위한 딜과 CEO 교체 소식에 힘입어 상승했습니다. 대형 M&A 추진이 기업 가치와 시장 반응에 긍정적 영향을 미치고 있음을 보여줍니다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "contract", "importance": 4, "wl": false, "topic": "버라이즌 m&a"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - PRESS9", "summary": "SK텔레콤과 LG유플러스 등 국내 이동통신사들이 그동안 축소해왔던 망 투자를 다시 늘릴 가능성이 제기되고 있다. 5G SA 고도화와 향후 주파수 경매 등의 변수가 맞물리면서 인프라 투자 재개 여부가 주목된다. 국내 장비 시장의 수급 환경에 큰 영향을 미칠 전망이다.", "source": "PRESS9", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "policy", "importance": 4, "wl": false, "topic": "skt lgu+ 망 투자 재개"}, {"title": "AT&T (T) Q2 2026 Earnings Call Transcript - Fortune", "summary": "AT&T의 2026년 2분기 실적 발표 컨퍼런스 콜 녹취록입니다. 주요 통신사의 재무 성과와 향후 네트워크 투자 계획을 파악할 수 있는 중요한 자료입니다. 경영진의 실적 발표를 다룹니다.", "source": "Fortune", "date": "2026-09-03 12:48", "url": "https://fortune.com/company/att/earnings/q2-2026/", "category": "earnings", "importance": 4, "wl": false, "topic": "at&t 실적"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - 매일경제 마켓", "summary": "통신사들이 기존의 기지국 인프라를 AI 데이터센터와 결합하여 엣지 컴퓨팅 거점으로 변신시키는 추세가 본격화하고 있다. 트래픽 처리 중심의 통신망에서 벗어나 AI 연산 기능을 수행하는 지능형 인프라로 진화하는 전략이다. 향후 통신업계의 새로운 수익 창출 모델로 기대를 모으고 있다.", "source": "매일경제 마켓", "date": "2026-09-05 06:33", "url": "https://stock.mk.co.kr/news/view/1154014", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 기지국 ai 데이터센터 변신"}, {"title": "LG유플러스, MWC서 AI 보안성 정밀 진단… '글로벌 레드팀 챌린지' 출격 - 데일리뉴스", "summary": "LG유플러스가 MWC에서 AI 보안성 정밀 진단을 위한 '글로벌 레드팀 챌린지'에 출격한다. 통신 서비스 및 AI 시스템의 보안 역량을 강화하기 위한 글로벌 협력 및 기술 검증 활동이다. 통신사의 보안 강화 노력의 일환이다.", "source": "데일리뉴스", "date": "2026-09-05 06:03", "url": "https://idailynews.co.kr/article/lg%EC%9C%A0%ED%94%8C%EB%9F%AC%EC%8A%A4-mwc%EC%84%9C-ai-%EB%B3%B4%EC%95%88%EC%84%B1-%EC%A0%95%EB%B0%80-%EC%A7%84%EB%8B%A8-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%A0%88%EB%93%9C%ED%8C%80-%EC%B1%8C%EB%A6%B0%EC%A7%80-%EC%B6%9C%EA%B2%A9-f98f16dad586d678a551", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 보안"}, {"title": "고고도 기지국…소프트뱅크, 성층권서 엣지컴퓨팅 실험", "summary": "소프트뱅크가 성층권에 띄운 고고도 플랫폼(HAPS)을 단순한 기지국을 넘어 엣지컴퓨팅 거점으로 활용하는 실험에 성공했다. 지상 이동통신망과 저궤도 위성망 사이에서 통신과 데이터 처리를 동시에 담당하는 새로운 네트워크 계층으로 HAPS를 활용할 가능성이 주목받고 있다. 소프트뱅크와 미국 항공우주기업 사이(Sceye)는 일본 상공에서 해당 실험을 진행하며 기술 검증을 이어가고 있다. 향후 차세대 통신 인프라 다변화에 기여할 것으로 기대된다.", "source": "ZDNet Korea", "date": "2026-09-05 06:00", "url": "https://zdnet.co.kr/view/?no=20260904222208", "category": "tech", "importance": 3, "wl": true, "topic": "소프트뱅크 고고도 기지국 실험"}, {"title": "Charter Communications stock falls as CFO transition and weak sentiment weigh - AD HOC NEW", "summary": "CFO 교체와 약한 투자 심리 O 교체와 약한 투자 심리의 여파로 차터 커뮤니케이션즈 주가가 하락했습니다. 경영진 변동이 주가에 미친 영향을 보여줍니다.", "source": "AD HOC NEWS", "date": "2026-09-05 02:31", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/charter-communications-stock-falls-as-cfo-transition-and-weak-sentiment/70055980", "category": "exec", "importance": 3, "sid": "carrier", "topic": "차터 커뮤니케이션즈 실적"}];
</script>
<script>
const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};
const SEC_NAME={competitor:"경쟁사",carrier:"통신사",satellite:"위성·6G",policy:"정책·규제",outage:"Outage"};
const TABS=[
  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성·6G",    secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
