eshaping-wireless-networks/", "category": "tech", "importance": 3, "wl": false, "topic": "mems rf 스위치 무선 네트워크"}, {"title": "Huawei believes NPO is the optimal choice for the next generation of optical interconnects", "summary": "화웨이가 차세대 광 인터커넥트 분야에서 온패키지 옵틱스(NPO)가 최적의 선택이라고 밝혔습니다. 데이터센터 및 통신망 내부의 초고속 전송 효율을 높이기 위한 기술적 비전입니다. 광통신 장비 기술 트렌드를 보여줍니다.", "source": "Developing Telecoms", "date": "2026-09-07 23:49", "url": "https://www.developingtelecoms.com/telecom-business/vendor-news/20785-huawei-believes-npo-is-the-optimal-choice-for-the-next-generation-of-optical-interconnects-for-ai-computing.html", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 npo 광인터커넥트"}, {"title": "Huawei Kirin 9050 Pro Launches: LogicFolding Moves From Roadmap to Silicon - Tech Times", "summary": "화웨이가 차세대 기린 칩셋의 로드맵 달성 및 실리콘 구현을 공식화했습니다. 고성능 프로세서 설계 능력을 입증하며 하드웨어 경쟁력을 다지고 있습니다. 반도체 및 장비 기술 자립화 흐름을 보여줍니다.", "source": "Tech Times", "date": "2026-09-07 23:48", "url": "https://www.techtimes.com/articles/326836/20260907/huawei-kirin-9050-pro-launches-logicfolding-moves-roadmap-silicon.htm", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 기린 칩셋 상용화"}, {"title": "What’s up with… ETSI, Qualcomm, Telecom Italia - telecomtv.com", "summary": "ETSI, 퀄컴, 텔레콤 이탈리아 등 주요 표준화 단체 및 통신 장비·사업자의 최근 기술 표준 및 인프라 동향이다. 유럽 및 글로벌 통신 시장의 기술 협력과 표준화 작업의 흐름을 보여준다. 네트워크 장비 및 솔루션 개발 방향에 참고가 된다.", "source": "telecomtv.com", "date": "2026-09-07 23:02", "url": "https://www.telecomtv.com/content/ai/what-s-up-with-etsi-qualcomm-telecom-italia-56185/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "etsi 퀄컴 텔레콤이탈리아 기술 동향"}, {"title": "Huawei's SingleRAN rebuilds radio software for AI - Telecoms", "summary": "화웨이가 AI 구동에 최적화되도록 라디오 소프트웨어를 재구축한 싱글RAN 솔루션을 소개했습니다. 무선 통신 장비의 지능화를 통해 네트워크 운영 효율을 극대화하려는 시도입니다. 경쟁사의 차세대 장비 기술 동향 파악에 해당합니다.", "source": "Telecoms", "date": "2026-09-07 22:48", "url": "https://www.telecoms.com/telecoms-infrastructure/huawei-s-singleran-rebuilds-radio-software-for-ai", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 싱글ran ai"}, {"title": "Butterfly monitoring with AI and 5G networks - Ericsson", "summary": "에릭슨이 AI와 5G 네트워크를 결합한 나비 모니터링 기술을 선보였습니다. 해당 기술은 통신 인프라를 활용하여 환경 및 생태계 데이터를 정밀하게 수집하고 분석합니다. 에릭슨은 이를 통해 통신 장비의 활용도를 높이고 신규 서비스 영역을 확장하고자 합니다. 향후 스마트 인프라 시장에서 경쟁력을 강화하는 계기가 될 것으로 기대됩니다.", "source": "Ericsson", "date": "2026-09-07 21:01", "url": "https://www.ericsson.com/en/cases/2026/butterfly-monitoring-biodiversity-insights", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 ai 5g 네트워크"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - SDxCentral", "summary": "라쿠텐 심포니의 클라우드 RAN 기술이 타발의 다중 사업자 실내 네트워크에 적용되었습니다. 실내 음영지역 해소와 효율적인 트래픽 분산을 위한 오픈 랜 솔루션 도입 사례입니다. 라쿠텐의 소프트웨어 중심 통신 장비 확장을 의미합니다.", "source": "SDxCentral", "date": "2026-09-07 20:37", "url": "https://www.sdxcentral.com/news/rakuten-symphony-cloud-ran-tech-powers-tawals-multi-operator-indoor-network/", "category": "contract", "importance": 3, "wl": false, "topic": "타발 라쿠텐 클라우드"}, {"title": "Nokia and BeeHealthy Partner to Replace SMS OTPs with Network-Based Healthcare Verificatio", "summary": "노키아가 비헬시(BeeHealthy)와 손잡고 네트워크 기반 헬스케어 인증 솔루션을 제공하기로 했습니다. 기존의 SMS 일회용 비밀번호(OTP)를 대체하여 보안성을 높인 것이 특징입니다. 통신 네트워크와 의료 서비스를 결합한 새로운 비즈니스 모델을 구축합니다. 노키아의 소프트웨어 및 보안 솔루션 확장을 보여줍니다.", "source": "TechAfrica News", "date": "2026-09-07 17:03", "url": "https://techafricanews.com/2026/09/07/nokia-beehealthy-replace-sms-otps-network-based-healthcare-verification/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 헬스케어 파트너십"}, {"title": "Nokia opens research and development centre in Riyadh - TahawulTech.com", "summary": "노키아가 사우디아라비아 리야드에 새로운 연구개발(R&D) 센터를 개소했습니다. 중동 지역의 디지털 전환 수요에 맞춘 현지화 전략의 일환입니다. 노키아는 현지 파트너들과 협력하여 차세대 통신 기술 및 솔루션을 개발할 예정입니다. 중동 및 아프리카 시장에서 장비 공급 및 기술 주도권을 확보하기 위한 포석입니다.", "source": "TahawulTech.com", "date": "2026-09-07 16:29", "url": "https://www.tahawultech.com/news/nokia- . 중동 통신 시장에서 개방형 가상화 무선 접속망의 상용화 레퍼런스를 확보했습니다. 양사의 전략적 협력 관계를 보여주는 계약입니다.", "source": "The Fast Mode", "date": "2026-09-07 08:34", "url": "https://www.thefastmode.com/technology-solutions/50500-rakuten-symphony-tawal-launch-saudi-arabia-s-first-cloud-ran-shared-indoor-network", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐 타발 실내망"}, {"title": "화웨이 , 美 법정서 ‘성장 과정 불법성’ 가린다", "summary": "중국 최대 통신장비 업체 화웨이 가 미국에서 회사의 성장 과정 자체를 겨냥한 대형 형사재판의 심판대에 오른다. 미국 검찰은 화웨이 가 20여년에 걸쳐 경쟁사의 영업비밀을 훔치고 이란·북한 제재를 우회했으며...", "source": "g-enews.com", "date": "2026-09-07 04:02", "url": "https://www.g-enews.com/view.php?ud=2026090623002345259a1f309431_1", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "Tawal tries Rakuten Symphony cloud RAN for shared indoor network - Telecompaper", "summary": "타발(Tawal)이 실내 공용 네트워크 구축을 위해 라쿠텐 심포니의 클라우드 RAN 기술을 채택했습니다. 개방형 무선 접속망(Open RAN)을 활용하여 비용을 절감하고 유연성을 높였습니다. 라쿠텐 심포니는 중동 시장으로 클라우드 RAN 레퍼런스를 확대하는 성과를 거뒀습니다. 장비 경쟁사의 소프트웨어 기반 수주 사례입니다.", "source": "Telecompaper", "date": "2026-09-06 16:00", "url": "https://www.telecompaper.com/news/tawal-tries-rakuten-symphony-cloud-ran-for-shared-indoor-network--1581892", "category": "contract", "importance": 3, "wl": false, "topic": "타발 라쿠텐 심포니"}, {"title": "통신장비주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게 - 메트로신문", "summary": "동일한 실적 개선세에도 불구하고 미국 통신장비 주는 곧바로 주가에 반영되는 반면 국내 주는 더딘 흐름을 보이는 현상을 분석했다. 글로벌 시장과 국내 통신장비 시장의 투자 심리 및 밸류에이션 차이를 조명한다.", "source": "메트로신문", "date": "2026-09-06 09:13", "url": "https://www.metroseoul.co.kr/article/20260906500019", "category": "earnings", "importance": 3, "wl": false, "topic": "한미 통신장비주 주가 비교"}, {"title": "Maxis Deploys Nokia Optical Transport Technology To Boost AI And Enterprise Network Capaci", "summary": "맥시스가 AI 및 엔터프라이즈 네트워크 역량을 강화하기 위해 노키아의 광전송 기술을 도입했습니다. AI 연산 및 대규모 데이터 처리에 필수적인 고속 전송 환경을 구축하는 목적입니다. 노키아는 엔터프라이즈 시장 공략을 위한 레퍼런스를 추가하게 되었습니다. 통신 장비 공급을 통한 실적 기여가 예상됩니다.", "source": "Pokde.Net", "date": "2026-09-06 05:55", "url": "https://pokd FRMCS) 구축을 위한 프로젝트와 표준화 진행 상황을 다루고 있습니다. 철도 운행의 안전성과 효율성을 높이기 위한 차세대 무선 통신 도입 움직임입니다. 통신 장비 및 시스템 업체의 참여 기회가 열리는 분야입니다. 장기적인 인프라 전환 트렌드입니다.", "source": "International Railway Journal", "date": "2026-09-07 19:41", "url": "https://www.railjournal.com/static/advertising/fp2-morane-2-and-the-path-to-frmcs-deployment-in-europe/", "category": "tech", "importance": 2, "wl": false, "topic": "유럽 철도 frmcs"}, {"title": "Malaysia considers Huawei's Ascend 910C processors for a RM2 billion national AI program -", "summary": "말레이시아가 국가 AI 프로그램 구성을 위해 화웨이의 어센드 프로세서 도입을 검토하고 있습니다. AI 인프라 구축 과정에서의 중국산 하드웨어 활용 여부를 다루고 있습니다. 통신 장비보다는 AI 컴퓨팅 자원에 가깝습니다.", "source": "Global Sources", "date": "2026-09-07 19:23", "url": "https://www.globalsources.com/sourcing-digest/malaysia-evaluates-huawei-ascend-910c-chips-for-a-landmark-sovereign-ai-initiative/?source=GSOLHP_SKC_2", "category": "other", "importance": 2, "wl": false, "topic": "말레이시아 화웨이 칩셋"}, {"title": "미·중 신냉전 도화선 ‘ 화웨이 재판’ 본격 시작…기술경쟁·이란 문제...", "summary": "중국의 기술 굴기를 상징하는 통신장비 기업 화웨이 를 겨냥한 형사재판이 미국 법원에서 본격적으로 시작된다. 화웨이 재판에는 양국의 기술경쟁과 국가안보 문제가 얽힌 가운데 이달 시진핑 중국 국가주석의 방미가...", "source": "khan.co.kr", "date": "2026-09-07 16:20", "url": "https://www.khan.co.kr/article/202609071620001", "category": "other", "importance": 2, "wl": false, "topic": ""}, {"title": "Share buybacks in Ericsson during the period August 31 - September 4, 2026 - Yahoo Finance", "summary": "에릭슨이 정해진 기간 동안 진행한 자사주 매입 현황을 공시했습니다. 주주 가치 제고를 위한 자본 재배치 일환으로 시행되었습니다. 회사의 재무 건전성과 주주 환원 정책의 연장선상에서 파악됩니다. 경쟁사의 일반적인 경영 공시 사항입니다.", "source": "Yahoo Finance Singapore", "date": "2026-09-07 16:14", "url": "https://sg.finance.yahoo.com/news/share-buybacks-ericsson-during-period-071400078.html", "category": "other", "importance": 2, "wl": false, "topic": "에릭슨 자사주 매입"}], "policy": [{"title": "China's MIIT Releases 15th Five-Year Plan: Build Next-Gen Communications Network by 2030, ", "summary": "중국 공업정보화부(MIIT)가 2030년까지 차세대 통신망 구축을 목표로 하는 제15차 5개년 계획을 발표했다. 6G와 첨단 통신 인프라 분야에서 글로벌 주도권   if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
