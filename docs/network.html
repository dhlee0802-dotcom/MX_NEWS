<style>

  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}

  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}

</style>

대 통신사가 차세대 6G 표준화 및 독자 기술 확보에 나서고 있음을 보여준다. 글로벌 통신 시장에서 인도 사업자의 영향력 확대와 기술 독립 의지를 드러낸다.", "source": "Mathrubhumi English", "date": "2026-09-07 18:50", "url": "https://english.mathrubhumi.com/news/money/jio-10-years-524-million-users-6g-blueprint-2030-of3yewr1", "category": "tech", "importance": 4, "wl": false, "topic": "릴라이언스 지오 10주년 6g"}, {"title": "한화-KAI, 초소형위성서 '1.4조 맞대결'…'중복사업' 역할조정 가늠자", "summary": "한화시스템과 KAI가 초소형 SAR 위성을 비롯해 6G 저궤도 통신위성 및 우주사업을 두고 1조 4천억 원대 맞대결을 펼치며 역할 조정을 가늠하고 있다. 한화시스템은 소형 SAR 위성 기술과 발사 경험을 앞세워 우주사업 확대를 추진 중이다. 차세대 위성통신 및 방산 우주 인프라 시장의 주요 이벤트다.", "source": "asiatoday.co.kr", "date": "2026-09-07 17:14", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20260907010002509", "category": "contract", "importance": 4, "wl": false, "topic": "한화 kai 위성 맞대결"}, {"title": "韓 6G 비전 공개 석달 앞으로…AI 인프라 생태계 중심 선언", "summary": "오는 11월 한국의 6G 비전 공개를 앞두고 삼성전자, LG전자 등 국내 기업과 에릭슨, 노키아, 화웨이 등 글로벌 장비사들이 총출동할 예정이다. '모바일 코리아 2026' 콘퍼런스를 통해 6G 및 AI 네트워크 관련 최신 기술과 전략이 집중 조명된다. 차세대 통신 인프라 표준 선점을 위한 경쟁이 본격화되고 있다.", "source": "etnews.com", "date": "2026-09-07 15:15", "url": "https://www.etnews.com/20260907000374", "category": "tech", "importance": 4, "wl": false, "topic": "한국 6g 비전 공개"}, {"title": "[미리보는 AINEX 2026]〈중〉AI 입는 지상망…6G·AI-RAN·AIDC 전략 공개 - 전자신문", "summary": "AINEX 2026 행사를 앞두고 AI를 결합한 지상망과 6G, AI-RAN, AIDC 구축 전략이 공개됐다. 차세대 통신 표준과 인공지능이 융합된 네트워크 기술의 발전 방향을 제시한다. 통신 장비 제조사와 사업자들의 미래 R&D 방향성을 보여준다. 차세대 인프라 전략으로서 중요도가 높다.", "source": "전자신문", "date": "2026-09-07 14:21", "url": "https://www.etnews.com/20260907000325", "category": "tech", "importance": 4, "wl": false, "topic": "지상망 6g 전략"}, {"title": "Sceyeとソフトバンク、日本での成層圏接続性の実証実験を完了し、HAPSの商用化に向けて前進（共同通信PRワイヤー） - 毎日新聞", "summary": "스카이와 소프트뱅크가 일본 내 성층권 연결성 실증 실험을 완료하고 HAPS(고고도 플랫폼 무선국)의 상용화를 향해 전진했다. 하늘을 나는 기지국을 통해 통신 사각지대를 해소하는 차세대 무선 통신 기술 개발의 중요한 이정표이다. 통신사들의 미래 네트워크 커버리지 확충 전략을 보여준다.", "source": "毎日新聞", "date": "2026-09-07 11:34", "url": "https://mainichi.jp/articles/20260907/pls/00m/020/535000c", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 haps 실증"}, {"title": "Japan's $1 Billion BlueBird Deal Positions AST SpaceMobile (NASDAQ: ASTS) As The Global Sa", "summary": "일본의 10억 달러 규모 투자 및 계약으로 AST스페이스모바일이 글로벌 위성 통신 강자로 자리매김하고 있습니다. 이번 계약을 통해 저궤도 위성 기반의 직접 단말 통신(Direct-to-Cell) 상용화에 속도를 낼 전망입니다. 양측의 협력을 바탕으로 글로벌 위성 커버리지가 확대될 것입니다.", "source": "foreignpolicyjournal.com", "date": "2026-09-07 08:57", "url": "https://www.foreignpolicyjournal.com/2026/09/06/japans-1-billion-bluebird-deal-positions-ast-spacemobile-nasdaq-asts-as-the-global-satellite-infrastructure-layer/", "category": "contract", "importance": 4, "wl": false, "topic": "ast스페이스모바일 일본 계약"}, {"title": "ASTS Stock Jumps Overnight: Rakuten CEO Calls AST Satellite Push ‘Critical’ For Japan Secu", "summary": "라쿠텐 최고경영자가 AST의 위성 통신 추진이 일본의 안보와 통신 커버리지 확보를 위해 매우 '중요하다'고 평가했다. 지상 이동통신망의 사각지대를 해소하기 위한 저궤도 위성 연계 전략이 주목받고 있다. 일본 시장에서의 위성-셀룰러 연동 서비스 도입이 가속화되고 있다. 위성통신 분야의 핵심 파트너십 동향이다.", "source": "stocktwits.com", "date": "2026-09-06 21:16", "url": "https://stocktwits.com/news-articles/markets/equity/asts-rakuten-japan-security-spacex-rivalry/cZKyRhER7On", "category": "tech", "importance": 4, "wl": false, "topic": "라쿠텐 ast 위성통신"}, {"title": "ASTS Stock Eyes Weekly Comeback: AT&T Says AST SpaceMobile Satellite Offering Will 'Come T", "summary": "AT&T가 AST 스페이스모바일의 위성 통신 서비스가 곧 제공될 것이라고 밝히며 주가 반등을 이끌고 있다. 지상 통신망과 저궤도 위성을 결합한 Direct-to-Cell 서비스 상용화가 임박했음을 시사한다. 통신사와 위성 사업자의 협력이 진전되고 있다. 위성통신 분야의 핵심 동향이다.", "source": "stocktwits.com", "date": "2026-09-06 17:21", "url": "https://stocktwits.com/news-articles/markets/equity/asts-at-and-t-satellite-offering-next-year/cZZn4ASR7DU", "category": "tech", "importance": 4, "wl": false, "topic": "ast스페이스모바일 위성"}, {"title": "「空飛ぶ基地局」通信試験が国内初成功、災害時やクマ監視への活用期待…ソフトバンクが２０２７年度以降の商用化目指す - article.auone.jp", "summary": "소프트뱅크가 국내 최초로 '하늘을 나는 기지국' 통신 시험에 성공하며 2027년 이후 상용화를 목표로 내걸었다. 재난 시 통신 두절 방지 및 야간 산간 지역 모니터링 등에 활용될 예정이다. 저궤도 위성 및 HAPS를 아우르는 차세대 상공 통신망 구축 경쟁이 본격화되고 있다.", "source": "article.auone.jp", "date": "2026-09-06 17:06", "url": "https://article.auone.jp/0c0608b8-d789-483a-aa34-dbfbcddf82c9", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 haps 상용화"}, {"title": "Asia-Pacific faces new spectrum challenge as 6G, satellite services advance - The Business", "summary": "아시아태평양 지역이 6G와 위성통신 서비스의 발전 속에서 새로운 주파수 과제에 직면했다. 차세대 통신망 구축을 위한 주파수 확보와 기술 표준화의 중요성이 강조되고 있다. 각국 통신 규제 기관과 업계는 급증하는 트래픽에 대응하기 위한 방안을 모색 중이다.", "source": "The Business Standard", "date": "2026-09-07 19:05", "url": "https://www.tbsnews.net/bangladesh/asia-pacific-faces-new-spectrum-challenge-6g-satellite-services-advance-1535721?amp", "category": "tech", "importance": 3, "wl": false, "topic": "아시아태평양 위성통신 6g"}, {"title": "SpaceX petitions FCC to block ViaSat-3 F2 satellite, citing interference concerns - Data C", "summary": "스페이스X가 전파 간섭 우려를 제기하며 비에이셋(ViaSat-3 F2) 위성 발사를 차단해달라고 연방통신위원회(FCC)에 청원했습니다. 저궤도 및 정지궤도 위성 사업자 간의 주파수 및 간섭 분쟁이 심화되고 있습니다. 규제 기관의 최종 판단에 업계의 이목이 쏠립니다.", "source": "Data Center Dynamics", "date": "2026-09-07 18:31", "url": "https://www.datacenterdynamics.com/en/news/spacex-petitions-fcc-to-block-viasat-3-f2-satellite-citing-interference-concerns/", "category": "policy", "importance": 3, "wl": false, "topic": "스페이스x 비에이셋 위성 규제"}, {"title": "German private company Isar Aerospace launched a rocket from a spaceport in Norway - Unive", "summary": "독일의 민간 기업 이사 항공우주(Isar Aerospace)가 노르웨이 우주기지에서 로켓 발사에 성공했습니다. 유럽 토종 민간 우주 발사체 기술의 진전을 보여주는 성과입니다. 향후 소형 위성 발사 시장의 다변화에 기여할 것입니다.", "source": "Universe Space Tech", "date": "2026-09-07 18:16", "url": "https://universemagazine.com/en/german-private-company-isar-aerospace-launched-a-rocket-from-a-spaceport-in-norway/", "category": "tech", "importance": 3, "wl": false, "topic": "이사항공우주 로켓 발사"}, {"title": "Amazon postponed the launch of its Leo satellite internet service - Universe Space Tech", "summary": "아마존이 저궤도 위성 인터넷 서비스인 '카이퍼(Leo)'의 발사 일정을 연기했습니다. 프로젝트 진행 과정에서 기술적 또는 일정상 조정이 이루어지고 있음을 시사합니다. 스페이스X 스타링크와의 경쟁 구도에서 다소 숨 고르기에 들어간 모습입니다.", "source": "Universe Space Tech", "date": "2026-09-07 17:36", "url": "https://universemagazine.com/en/amazon-delays-promised-launch-dates-for-its-leo-satellite-internet-service/", "category": "tech", "importance": 3, "wl": false, "topic": "아마존 카이퍼 위성 발사 연기"}, {"title": "【미래산업 특집】 우주에 세운 통신기지국 스페이스X로 보는 위성통신의 미래와 지구 통신망의 대전환 - 시사매거진", "summary": "우주에 세운 통신기지국인 스페이스X 사례를 통해 위성통신의 미래와 지구 통신망의 대전환을 조명했습니다. 지상 통신망과 위성 통신의 융합이 가속화되면서 통신 산업 패러다임이 변화하고 있습니다. 향후 통신 인프라의 핵심 축으로 위성통신이 자리 잡을 것입니다.", "source": "시사매거진", "date": "2026-09-07 17:23", "url": "https://www.sisamagazine.co.kr/news/articleViewAmp.html?idxno=529428", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 위성통신 미래 전망"}, {"title": "KOINDEX 2026 현장에서 확인한 인도의 K-웨이브 소비", "summary": "KOINDEX 2026 현장에서 한국과 인도 간 교역 및 투자 잠재력이 조명된 가운데, 6G와 디지털화 분야가 협력 유망 분야로 꼽혔다. 양국은 재생에너지와 함께 6G, 사이버보안 등 첨단 디지털 인프라 구축을 위한 협력을 모색하고 있다. 글로벌 통신 시장의 기술 협력 네트워크를 확대하는 계기다.", "source": "dream.kotra.or.kr", "date": "2026-09-07 17:08", "url": "http://dream.kotra.or.kr/kotranews/cms/news/actionKotraBoardDetail.do?SITE_NO=3&MENU_ID=110&CONTENTS_NO=1&bbsGbn=245&bbsSn=245&pNttSn=243873", "category": "tech", "importance": 3, "wl": false, "topic": "한인도 교류 6g"}, {"title": "경희대 임영현 교수팀, 6G ·AI 반도체 클럭 신뢰성 높이는 회로 기술 개...", "summary": "경희대 임영현 교수팀이 6G 이동통신 후보 대역인 어퍼 미드밴드 통신칩과 AI 반도체의 클럭 신뢰성을 높이는 회로 기술을 개발했다. 차세대 SoC 시장에서 고주파와 저지터를 동시에 요구하는 통신 장비 설계의 난제를 해결했다. 향후 6G 인프라 반도체 경쟁력 강화에 기여할 전망이다.", "source": "metroseoul.co.kr", "date": "2026-09-07 15:32", "url": "http://www.metroseoul.co.kr/article/20260907500420", "category": "tech", "importance": 3, "wl": false, "topic": "경희대 6g 반도체 회로"}, {"title": "美 우주기업, 마크롱 행사 보이콧…미국-EU간 궤도 주도권 다툼 수면 위...", "summary": "이는 해당 대역을 활용하는 스페이스X의 스타링크 사업과 정면 충돌한다. 한 위성업체 최고경영자(CEO)는 \"궤도와 주파수가 핵심 자원이며 스페이스X가 두 자원을 완벽히 지배하려는 정책을 펼치고 있다\"고 주장했다. 유럽은...", "source": "g-enews.com", "date": "2026-09-07 14:52", "url": "https://www.g-enews.com/view.php?ud=20260907103252304fda4f5ab74_1" 아주IB투자, 2000억 펀드레이징 순항…국민성장·KIF 확보", "summary": "아주IB투자가 KIF 및 국민성장 자금을 확보해 2000억 원 규모의 대형 펀드레이징을 순항 중이다. AI 하드웨어와 함께 5G·6G 이동통신, 양자 기술 등이 주요 투자 분야에 포함되었다. 차세대 통신 및 네트워크 혁신 기업들에 대한 자금 공급이 활성화될 전망이다.", "source": "topdaily.kr", "date": "2026-09-07 08:30", "url": "https://www.topdaily.kr/articles/111811", "category": "tech", "importance": 3, "wl": false, "topic": "아주ib투자 6g 펀드"}, {"title": "[아참마당] 저궤도 위성이 바꾸는 통신의 미래", "summary": "저궤도 위성 통신이 가져올 통신 미래에 대응하기 위해 독자적인 6G 위성통신 기술과 산업 생태계 확보가 강조되고 있다. 이동통신 주파수를 넘어 비면허 주파수까지 위성 직접 연결이 확대되는 추세다. 글로벌 위성통신 규제 및 기술 주도권 경쟁에 대비해야 한다는 진단이다.", "source": "cctoday.co.kr", "date": "2026-09-07 06:02", "url": "https://www.cctoday.co.kr/news/articleView.html?idxno=2236218", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도위성 통신 미래"}, {"title": "AMZN Stock Gains On Hitting Satellite Milestone to Launch Starlink Internet Rival This Yea", "summary": "아마존이 스타링크의 라이벌인 위성 인터넷 서비스의 올해 발사를 위한 위성 마일스톤을 달성하며 주가가 상승했습니다. 저궤도 위성 시장에서의 경쟁이 본격화되고 있음을 보여줍니다. 향후 양사의 서비스 품질 및 커버리지 경쟁이 주목됩니다.", "source": "stocktwits.com", "date": "2026-09-07 04:38", "url": "https://stocktwits.com/news-articles/markets/equity/amzn-stock-gains-on-hitting-satellite-milestone-to-launch-starlink-internet-rival-this-year/cZmewuPR7jI", "category": "tech", "importance": 3, "wl": false, "topic": "아마존 스타링크 경쟁 마일스톤"}, {"title": "Spectrum Rocket Reaches Orbit From Andoya, Norway - srpske.rs", "summary": "노르웨이 안도야 발사장에서 스펙트럼 로켓이 성공적으로 궤도에 진입했습니다. 유럽 지역에서의 상업용 로켓 발사 역량이 한층 강화되었습니다. 소형 위성 발사 시장의 공급 다변화에 기여할 것입니다.", "source": "srpske.rs", "date": "2026-09-06 15:10", "url": "https://srpske.rs/en/news/nauka/2026/09/06/isar-aerospace-spectrum-rocket-reaches-orbit-andoya", "category": "tech", "importance": 3, "wl": false, "topic": "노르웨이 안도야 스펙트럼 로켓"}, {"title": "Keysight Technologies: Powering India’s 6G, AI and semiconductor ambitions - tele.net.in", "summary": "키사이트테크놀로지스가 인도의 6G, 인공지능, 반도체 분야의 성장을 지원하기 위한 인프라 구축에 참여한다. 첨단 계측 및 테스트 솔루션을 제공하여 현지 통신 기술 고도화에 기여하고 있다. 인도 정부의 디지털 인프 .com", "summary": "노키아(Nokia)가 사우디아라비아 리야드에 새로운 연구개발(R&D) 센터를 개소했다. 현지 통신 인프라 연구와 기술 협력을 확대하기 위한 전략적 거점 구축이다. 글로벌 통신장비 경쟁사의 R&D 투자 동향이다.", "source": "TahawulTech.com", "date": "2026-09-07 16:29", "url": "https://www.tahawultech.com/news/nokia-opens-research-and-development-centre-in-riyadh/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 연구소 개소"}, {"title": "Maxis Business upgrades optical transport network with Nokia gear - Developing Telecoms", "summary": "맥시스 비즈니스(Maxis Business)가 노키아(Nokia)의 장비를 도입하여 광학 전송 네트워크를 업그레이드했다. AI 및 기업용 네트워크 용량을 강화하기 위한 인프라 구축 계약이다. 경쟁사의 주요 수주 및 장비 공급 소식이다.", "source": "Developing Telecoms", "date": "2026-09-07 14:29", "url": "https://www.developingtelecoms.com/telecom-technology/optical-fixed-networks/20783-maxis-business-upgrades-optical-transport-network-with-nokia-gear.html", "category": "contract", "importance": 4, "wl": false, "topic": "노키아 맥시스 수주"}, {"title": "[이 시각 세계] 캐나다, 관세 갈등 속 중국과 8년 만에 국방대화", "summary": "캐나다가 관세 갈등 속에서도 중국과 8년 만에 국방대화를 개최했다. 지난 2018년 미국의 요청으로 화웨이 멍완저우 부회장을 체포하며 얼어붙었던 양국 관계가 해빙 국면으로 접어들고 있다는 분석이다. 통신장비 기업을 둘러싼 지정학적 갈등이 새로운 국면을 맞이하고 있다.", "source": "imnews.imbc.com", "date": "2026-09-07 07:21", "url": "https://imnews.imbc.com/replay/2026/nwtoday/article/6850008_37012.html", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 캐나다 대화"}, {"title": "PTA approves Ufone-Telenor Merger: Reshaping Telecom Landscape - TechJuice", "summary": "파키스탄 통신청(PTA)이 유폰과 텔레노르의 합병을 최종 승인했다. 이번 합병으로 현지 통신 시장의 경쟁 구도가 재편될 전망이다. 대형 통신사 탄생에 따른 네트워크 투자 및 장비 수요 변화가 예상된다.", "source": "TechJuice", "date": "2026-09-06 18:54", "url": "https://www.techjuice.pk/pta-approves-ufone-telenor-merger-reshaping-telecom-landscape/", "category": "contract", "importance": 4, "wl": false, "topic": "파키스탄 통신사 인수합병"}, {"title": "Maxis Deploys Nokia Optical Transport Technology To Boost AI And Enterprise Network Capaci", "summary": "맥시스(Maxis)가 AI 및 엔터프라이즈 네트워크 용량을 부스팅하기 위해 노키아의 광학 전송 기술을 배포했다. 통신사의 인프라 고도화 과정에서 노키아 장비가 채택된 주요 수주 계약이다.", "source": "Pokde.Net", "date": "2026-09-06 05:55", "url": "https://pokde.net/system/service/telco-isp/maxis-deploys-nokia-optical-transport-technology", "category": "contract", "importance": 4, "wl": false, "topic": "맥시스 노키아 장비 도입"}, {"title": "빛과전자, ‘광통신 부품 상용화 사업’ 수행기관 최종 선정", "summary": "빛과전자가 IEEE 표준을 준수하는 50G급 프론트홀 광통신 부품 상용화 사업의 수행기관으로 최종 선정되었다. 5G-Advanced 및 6G 전환에 대비한 고대역폭 부품 개발을 추진한다. 완료 후 국내외 통신장비사와 통신사업자에 공급할 예정이다.", "source": "sentv.co.kr", "date": "2026-09-07 20:10", "url": "https://www.sentv.co.kr/article/view/sentv202609070223", "category": "contract", "importance": 3, "wl": false, "topic": "빛과전자 광통신"}, {"title": "Nokia and BeeHealthy Partner to Replace SMS OTPs with Network-Based Healthcare Verificatio", "summary": "노키아(Nokia)와 비헬시(BeeHealthy)가 파트너십을 체결하고 SMS 기반 OTP 인증을 네트워크 기반 헬스케어 인증으로 대체하기로 했다. 통신 네트워크 보안 및 인증 솔루션 확산 소식이다.", "source": "TechAfrica News", "date": "2026-09-07 17:03", "url": "https://techafricanews.com/2026/09/07/nokia-beehealthy-replace-sms-otps-network-based-healthcare-verification/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 헬스케어 파트너십"}, {"title": "위축됐던 통신망 투자, AI 트래픽 폭발에 재확대 기로", "summary": "글로벌 통신장비사 에릭슨이 피지컬 AI와 로봇, AI 에이전트 간 통신 증가로 2030년 데이터 업로드 트래픽이 현재보다 3~5배 증가할 것으로 전망했다. 이러한 수요에 대응하기 위해 위축되었던 통신망 투자가 5G SA 도입 등과 함께 재확대될 기로에 놓였다. 장비 업계의 실적 회복 기대감을 높이는 요인이다.", "source": "mediapen.com", "date": "2026-09-07 16:04", "url": "https://www.mediapen.com/news/view/1121802", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 트래픽 전망"}, {"title": "TSMC 등 대만 30여개사, '실리콘 포토닉스 연맹' 추진…광통신 주도권 정조준 - 녹색경제신문", "summary": "TSMC 등 대만 기업 30여 개사가 '실리콘 포토닉스 연맹'을 결성하여 광통신 주도권 확보에 나섰다. 광대역 통신 및 데이터센터 전송 속도를 높이기 위한 광통신 기술 협력이다. 글로벌 통신장비 및 부품 생태계에 미치는 영향이 주목된다. 차세대 통신 부품 공급망의 변화를 보여준다.", "source": "녹색경제신문", "date": "2026-09-07 15:13", "url": "http://www.greened.kr/news/articleView.html?idxno=349418", "category": "tech", "importance": 3, "wl": false, "topic": "대만 실리콘 포토닉스"}, {"title": "통신사 및 장비·부품사 총출동… 5G 테마 종목별 온도 차 명확", "summary": "통신장비 및 부품 테마주들의 주가 흐름과 종목별 온도 차를 조명했다. 네트워크 통합 솔루션 및 광통신 분야에서 LS에코에너지와 삼성전자 등이 상승세를 보이고 있다. AI 트래픽 증가에 따른 통신망 투자 기대감이 반영되고 있다.", "source": "pinpointnews.co.kr", "date": "2026-09-07 13:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484543", "category": "earnings", "importance": 3, "wl": false, "topic": "통신장비 테마주"}, {"title": "Huawei Trial Draws Investor Attention To Key Telecom Network Suppliers - londoninsider.co.", "summary": "화웨이 관련 법적 공방이 통신 네트워크 장비 공급업체들을 향한 투자자들의 이목을 끌고 있다. 글로벌 통신장비 시장의 규제 리스크와 공급망 재편 가능성을 시사한다. 경쟁사들의 실적과 주가에 미치는 영향이 분석된다. 업계 동향 파악용으로 주시할 가치가 있다.", "source": "londoninsider.co.uk", "date": "2026-09-07 06:26", "url": "https://londoninsider.co.uk/huawei-trial-draws-investor-attention-to-key-telecom-network-suppliers/", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 통신장비 재판"}, {"title": "[사설] 삼성전자 DX 동행노조의 무리한 투쟁", "summary": "삼성전자 DX 부문 노동조합의 활동을 다루면서, 올 2분기 MX 및 네트워크 사업부의 실적을 언급했다. 네트워크 사업부의 실적 흐름이 전체 가전·모바일 부문 실적 보도에 포함되어 있다. 전사 차원의 사업 실적 점검에 참고할 수 있는 내용이다.", "source": "m.skyedaily.com", "date": "2026-09-07 00:04", "url": "https://m.skyedaily.com/news_view.html?ID=311042", "category": "earnings", "importance": 3, "wl": false, "topic": "삼성전자 dx 노조"}, {"title": "Nokia, Ericsson, IBM, to Blackberry: How humbled tech giants reinvented for a comeback - T", "summary": "노키아(Nokia), 에릭슨(Ericsson), IBM, 블랙베리 등 한때 고전했던 기술 거인들이 어떻게 재기에 성공했는지 조명한다. 글로벌 통신장비 및 IT 기업들의 전략적 변신 과정을 다룬 심층 분석 기사다.", "source": "The Indian Express", "date": "2026-09-06 17:07", "url": "https://indianexpress.com/article/explained/explained-economics/nokia-ericsson-ibm-blackberry-comeback-10865506/lite/", "category": "other", "importance": 3, "wl": false, "topic": "노키아 에릭슨 재기"}, {"title": "수급 악화로 주가 빠졌지만… RFHIC 반등 기대 커지는 까닭 - 핀포인트뉴스", "summary": "국내 통신장비 부품사인 RFHIC의 수급 악화에 따른 주가 하락과 향후 반등 기대감을 분석했다. 글로벌 통신사들의 투자 회복 지연 속에서도 질화갈륨(GaN) 등 핵심 부품의 성장성이 점쳐진다. 중장기 실적 개선 가능성이 주시되고 있다.", "source": "핀포인트뉴스", "date": "2026-09-06 09:56", "url": "https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=484216", "category": "earnings", "importance": 3, "wl": false, "topic": "rfhic 실적"}, {"title": "통신장비주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게 - 메트로신문", "summary": "미국과 한국의 통신장비주가 동일한 실적 개선세를 보이더라도 주가 반응 속도에 차이가 나는 현상을 분석했다. 미국은 즉각적으로 주가에 반영되는 반면 한국은 더디다는 지적이다. 글로벌 통신 인프라 투자 환경과 시장 기대치의 괴리가 원인으로 꼽힌다.", "source": "메트로신문", "date": "2026-09-06 09:13", "url": "https://www.metroseoul.co.kr/article/20260906500019", "category": "earnings", "importance": 3, "wl": false, "topic": "통신장비주 실적"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "통신 임원들에 따르면 5G의 더 큰 사업적 기회는 소비자 시장이 아니라 산업 자동화에 있다. 노키아와 에릭슨 등 장비사들의 B2B 및 스마트팩토리 전략과 맞물린 통신 업계의 시각을 반영한다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "5g 산업 자동화"}, {"title": "Turkcell integrates BiP messaging app into Huawei's Watch Kids X1 smartwatch - Telecompape", "summary": "튀르케셀이 비프(BiP) 메시징 앱을 화웨이의 키즈 스마트워치에 통합했다. 통신사의 소프트웨어 서비스와 경쟁사 웨어러블 기기의 연동 사례이다. 통신장비 시장 전반의 동향을 파악하는 데 참고할 수 있다. 직접적인 대규모 장비 수주는 아니다.", "source": "Telecompaper", "date": "2026-09-07 12:14", "url": "https://www.telecompaper.com/news/turkcell-integrates-bip-messaging-app-into-huaweis-watch-kids-x1-smartwatch--1581827", "category": "other", "importance": 2, "wl": false, "topic": "화웨이 스마트워치"}, {"title": "명진아이씨티, K-ICT WEEK 2026서 Wi-Fi7 무선인프라 소개... \"공공·기업...", "summary": "명진아이씨티가 네트워크 장비 제조사의 국내 공식 파트너사로서 K-ICT WEEK 2026에서 Wi-Fi7 무선 인프라를 소개했다. 공공 및 기업, 병원 등을 대상으로 유무선 네트워킹과 VPN 암호화를 결합한 보안 솔루션을 제공한다. 공공·기업용 네트워크 장비 공급망의 동향을 보여준다.", "source": "kr.aving.net", "date": "2026-09-07 10:26", "url": "https://kr.aving.net/news/articleView.html?idxno=1814126", "category": "contract", "importance": 2, "wl": false, "topic": ases 15th Five-Year Plan: Build Next-Gen Communications Network by 2030, ", "summary": "중국 공업정보화부(MIIT)가 15차 5개년 계획을 통해 2030년까지 차세대 통신망을 전면 구축할 것을 발표했다. 성능을 선도하는 신세대 통신망을 구축하여 글로벌 기술 패권 경쟁에 대응하겠다는 전략이다. AI와 결합된 인프라 투자가 가속화될 전망이다.", "source": "finance.biggo.com", "date": "2026-09-07 16:56", "url": "https://finance.biggo.com/news/c06e0cf7-cf84-447c-adea-297ca2346213", "category": "tech", "importance": 4, "wl": false, "topic": "중국 공신부 5개년 계획"}, {"title": "Govt readies telecom PLI successor with significant outlay and components focus, targets Q", "summary": "인도 정부가 상당한 예산과 부품 초점을 맞춘 후속 통신 PLI(생산연계인센티브) 제도를 준비하고 있으며 4분기 출시를 목표로 하고 있다. 통신장비 제조 및 공급망 정책과 관련된 정부 규제 동향이다.", "source": "Moneycontrol.com", "date": "2026-09-07 15:15", "url": "https://www.moneycontrol.com/news/telecom/govt-readies-telecom-pli-successor-with-significant-outlay-and-components-focus-targets-q1-fy28-rollout-14024086.html", "category": "policy", "importance": 4, "wl": false, "topic": "인도 통신 pli 정책"}, {"title": "The EU’s digital rulebook has reached a turning point - PubAffairs Bruxelles", "summary": "유럽연합(EU)의 디지털 규제 체계가 중요한 전환점에 도달했다. 빅테크 기업과 통신 사업자 간의 망 이용공정성 및 플랫폼 규제가 핵심 쟁점이다. 향후 유럽 디지털 시장의 경쟁 환경에 큰 영향을 미칠 전망이다.", "source": "PubAffairs Bruxelles", "date": "2026-09-07 20:02", "url": "https://www.pubaffairsbruxelles.eu/opinion-analysis/the-eus-digital-rulebook-has-reached-a-turning-point/", "category": "policy", "importance": 3, "wl": false, "topic": "유럽연합 디지털 규제"}, {"title": "“피지컬 AI 하고 싶어도 공장이 못 받는다”… 정부, 중소 제조현장 확...", "summary": "과기정통부와 중소벤처기업부가 중소 제조현장에 피지컬 AI를 확산하기 위해 손을 잡았다. 과기정통부의 기술과 중기부의 스마트제조혁신 정책을 결합하여 제조 현장의 지능화를 지원한다. 정부 차원의 AI 인프라 보급 정책이다.", "source": "viva100.com", "date": "2026-09-07 19:28", "url": "https://www.viva100.com/article/20260907501400", "category": "tech", "importance": 3, "wl": false, "topic": "과기정통부 중기부 피지컬 ai"}, {"title": "정부, ‘AI 안경 안전 이용’ 가이드라인 마련 돌입", "summary": "과학기술정보통신부가 '바람직한 AI 글라스 사용 환경 조성을 위한 산업 활성화 방안 연구' 과제를 통해 AI 안경 안전 이용 가이드라인 마련에 돌입했다. 의료, 제조, 물류 등 다양한 산 날' 기념식 개최 外", "summary": "과학기술정보통신부가 전국 45만 기술개발인의 노고를 기리기 위해 '2026 기술개발인의 날' 기념식을 개최했다. 엔지니어와 기업 연구원들을 격려하는 정부 주도 행사다.", "source": "dongascience.com", "date": "2026-09-07 19:06", "url": "https://www.dongascience.com/news/view/79808", "category": "other", "importance": 2, "wl": false, "topic": "기술개발인의 날 표창"}, {"title": "진천 ㈜농경, '기술개발인의 날' 과기정통부 장관 표창", "summary": "진천 소재 기업 농경이 '기술개발인의 날' 행사에서 과학기술정보통신부 장관 표창을 수상했다. 상토 제조 기술과 연구개발 성과를 인정받은 결과다. 네트워크 산업과는 무관하다.", "source": "ccdailynews.com", "date": "2026-09-07 18:12", "url": "https://www.ccdailynews.com/news/articleView.html?idxno=2439092", "category": "other", "importance": 2, "wl": false, "topic": "농경 과기정통부 장관 표창"}, {"title": "김기쁨(한림대), 한국연구재단·한국장학재단 박사과정 지원 동시 선정...", "summary": "한림대 박사과정생이 과기정통부 지원 사업에 선정된 소식을 다뤘다. 청각 증상 및 수면 장애 연구를 포함하고 있으나 통신망 장애가 아닌 의학적 청각 장애를 다룬 연구다. 네트워크 사업과 무관하여 제외된다.", "source": "kyosu.net", "date": "2026-09-07 17:18", "url": "https://www.kyosu.net/news/articleView.html?idxno=209902", "category": "other", "importance": 2, "wl": false, "topic": "한국연구재단 지원"}, {"title": "India, UK reaffirm commitment to strengthen cooperation in AI and telecommunications techn", "summary": "인도와 영국 양국이 인공지능 및 통신 기술 분야에서의 협력을 강화하기로 재확인했다. 양국은 첨단 기술 생태계 조성을 위한 공동 연구와 정책 공조를 확대할 방침이다. 글로벌 공급망 안정화와 디지털 경제 성장이 주요 목표다.", "source": "News On AIR", "date": "2026-09-07 08:15", "url": "https://newsonair.gov.in/india-uk-reaffirm-commitment-to-strengthen-cooperation-in-ai-and-telecommunications-technologies/", "category": "other", "importance": 2, "wl": false, "topic": "인도 ai"}], "carrier": [{"title": "[미리보는 AINEX 2026]〈중〉AI 입는 지상망…6G·AI-RAN·AIDC 전략 공개", "summary": "AINEX 2026 컨퍼런스에서 SK텔레콤과 LG유플러스가 6G 및 AI 기반 네트워크 전략을 발표한다. 삼성전자, 노키아코리아, 시스코코리아 등 국내외 장비업체들이 대거 참여해 AI 네트워크와 AIDC 인프라 기술을 소개할 예정이다. 지상망의 AI 전환과 차세대 통신 기술의 청사진이 공개된다.", "source": "etnews.com", "date": "2026-09-07 14:22", "url": "https://www.etnews.com/20260907000325", "category": "tech", "importance": 4, "wl": false, "topic": "ainex 2026 6g"}, {"title": "이통3사 5G SA 전환 속도전…앞서가는 KT에 SKT·LGU+ \"연내 상용화\" - 뉴스웍스", "summary": "국내 이동통신 3사의 5G 단독모드(SA) 전환 경쟁이 가속화되고 있습니다. 선두주자인 KT의 뒤를 이어 SK텔레콤과 LG유플러스도 연내 상용화를 목표로 속도를 내고 있습니다. 초저지연 및 네트워크 슬라이싱 등 차세대 통신 서비스 구현을 위한 필수 단계입니다.", "source": "뉴스웍스", "date": "2026-09-07 11:07", "url": "https://www.newsworks.co.kr/news/articleViewAmp.html?idxno=852826", "category": "tech", "importance": 4, "wl": false, "topic": "이통3사 5g sa 전환"}, {"title": "SKT, AIDC 사업 재편…3.1조 자금 유입 기대 - 경제타임스", "summary": "SK텔레콤이 AI 데이터센터(AIDC) 사업을 본격적으로 재편하며 3조 원대 규모의 대규모 자금 유입이 기대되고 있습니다. AI 인프라 사업의 가치를 인정받아 투자 유치와 외부 협력이 가속화되는 양상입니다. 회사의 미래 성장 동력 확보에 중요한 전환점이 될 것입니다.", "source": "경제타임스", "date": "2026-09-07 09:51", "url": "https://ket.kr/news/article.html?no=40561", "category": "contract", "importance": 4, "wl": false, "topic": "sk텔레콤 ai데이터센터 사업"}, {"title": "Rakuten Symphony, TAWAL Launch Saudi Arabia’s First Cloud RAN Shared Indoor Network - The ", "summary": "라쿠텐심포니와 타왈(TAWAL)이 사우디아라비아 최초의 클라우드 RAN 기반 공유 실내 네트워크를 구축했다. 개방형 무선 접속망(Open RAN) 기술을 활용한 인프라 협력 사례이다. 중동 지역 통신 환경 개선과 클라우드 네트워크 확장을 의미한다. 네트워크 장비 시장의 기술 트렌드를 보여준다.", "source": "The Fast Mode", "date": "2026-09-07 08:34", "url": "https://www.thefastmode.com/technology-solutions/50500-rakuten-symphony-tawal-launch-saudi-arabia-s-first-cloud-ran-shared-indoor-network", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐심포니 클라우드"}, {"title": "Vodafone Idea Subscribers Consume More Data as Daily Usage Jumps 28 Percent to 88.4 Petaby", "summary": "인도 보다폰 아이디어의 가입자당 일일 데이터 사용량이 28% 증가하여 88.4페타바이트에 달하며 데이터 소비량이 급증했다. 모바일 네트워크의 트래픽 부하가 가중되고 있음을 보여준다. 통신 인프라 확충의 필요성을 시사한다.", "source": "TelecomTalk", "date": "2026-09-07 20:09", "url": "https://telecomtalk.info/vodafoneidea-subscribers-data-dailyusage-jumps-28percent-petabytes/1011626/", "category": "other", "importance": 3, "wl": false, "topic": "보다폰 아이디어 데이터 소비"}, {"title": "BSNL 4G network handles nearly 6 PB daily - Bisinfotech", "summary": "국영 통신사 BSNL의 4G 네트워크가 하루에 거의 6페타바이트(PB)에 달하는 트래픽을 처리하고 있다. 4G 인프라 구축 이후 망 이용량의 증가세를 보여주는 지표이다. 통신사의 네트워크 부하 및 데이터 트래픽 현황을 전한다.", "source": "Bisinfotech", "date": "2026-09-07 20:05", "url": "https://www.bisinfotech.com/bsnl-homegrown-4g-network-reaches-6-petabytes-daily-data-volume-as-5g-trials-progress/", "category": "other", "importance": 3, "wl": false, "topic": "bsnl 4g 트래픽"}, {"title": "Telstra deploys slicing so everyone can be a Teams player - Telecoms", "summary": "텔스트라가 기업용 협업 툴인 팀즈(Teams) 사용자를 위해 네트워크 슬라이싱 기술을 성공적으로 도입했습니다. 네트워크 자원을 최적화하여 끊김 없는 통신 환경을 제공합니다. B2B 고객의 업무 효율성 향상에 기여할 것입니다.", "source": "Telecoms", "date": "2026-09-07 19:24", "url": "https://www.telecoms.com/operator-ecosystem/telstra-deploys-slicing-so-everyone-can-be-a-teams-player", "category": "tech", "importance": 3, "wl": false, "topic": "텔스트라 네트워크 슬라이싱"}, {"title": "Vodafone launches Quality on Demand API in Germany - Telecoms", "summary": "보다폰이 독일 시장에서 '품질 주문형(Quality on Demand)' API를 새롭게 출시했습니다. 기업 고객을 대상으로 네트워크 품질을 맞춤형으로 제어할 수 있는 기능을 제공합니다. 향후 B2B 서비스 수익화에 기여할 것으로 기대됩니다.", "source": "Telecoms", "date": "2026-09-07 19:14", "url": "https://www.telecoms.com/network-software/vodafone-launches-quality-on-demand-api-in-germany", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 api 출시"}, {"title": "BharatNet Phase 3: Amilionn, ITI project surpasses 40% completion in Himachal Pradesh", "summary": "인도의 BharatNet Phase 3 프로젝트 중 히마프라데시주 만디 지역에서의 Amilionn과 ITI의 광섬유 부설 공사 진척도가 40%를 넘어섰다. 가장 까다로운 지형 중 하나인 해당 지역에서 인프라 구축이 진행 중이다. 국가 통신망 구축 사업의 진척 상황이다.", "source": "ET Telecom", "date": "2026-09-07 19:11", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/bharatnet-phase-3-amilionn-iti-project-surpasses-40-completion-in-himachal-pradesh/133875803", "category": "contract", "importance": 3, "wl": true, "topic": "bharatnet 사업"}, {"title": "우상호 지사 “춘천-신세계, 원주-KT AI데이터센터 투자 협의 중” - 강원일보", "summary": "강원특별자치도가 춘천에는 신세계, 원주에는 KT와 AI 데이터센터 투자를 위한 협의를 진행 중이라고 밝혔습니다. 지역 경제 활성화와 첨단 인프라 유치를 위한 지자체와 기업 간 협력입니다. 대규모 데이터센터 건립을 통한 지역 거점 구축이 기대됩니다.", "source": "강원일보", "date": "2026-09-07 18:55", "url": "https://www.kwnews.co.kr/article/20260907501341", "category": "contract", "importance": 3, "wl": false, "topic": "강원도 ai 데이터센터 협의"}, {"title": "[통신 풍향계] SKT '데이터 벽 칼럼'·KT '5G SA 슬라이싱' 실증·LGU+ 'PMDC 얼라이언스' 출범-'추석 멤버십' 강화 - 뉴스웍스", "summary": "통신 3사의 주간 동향으로 SKT의 데이터 분석, KT의 5G SA 슬라이싱 실증, LGU+의 PMDC 얼라이언스 출범 및 추석 멤버십 강화 소식이 전해졌습니다. 각사별로 AI, 네트워크 고도화, 고객 혜택 분야에서 활발한 행보를 보이고 있습니다. 통신 시장의 기술 및 마케팅 트렌드를 종합적으로 보여줍니다.", "source": "뉴스웍스", "date": "2026-09-07 17:52", "url": "https://www.newsworks.co.kr/news/articleViewAmp.html?idxno=852915", "category": "tech", "importance": 3, "wl": false, "topic": "이통3사 주간 통신 동향"}, {"title": "\"먹통 없는 재난 대응\" 정부·이통3사, 상용망 기반 소방 통신 개선", "summary": "정부와 통신 3사가 재난 대응력 강화를 위해 상용망 기반의 소방 통신 개선에 나섰다. KT 등 통신사는 소방청 행정망에 기업전용 5G SA를 도입하여 안정적인 통신 환경을 구축하고 있다. 먹통 없는 재난 대응을 위한 공공 부문 통신 인프라 고도화 사례다.", "source": "itdaily.kr", "date": "2026-09-07 17:46", "url": "https://www.itdaily.kr/news/articleView.html?idxno=241454", "category": "tech", "importance": 3, "wl": false, "topic": "소방청 상용망 통신"}, {"title": "IPTV 정체 속 티빙 해킹까지…KT, ‘OTT 합병’ 셈법 복잡해진다 - 아시아투데이", "summary": "IPTV 사업이 정체를 겪는 가운데 티빙 해킹 사건까지 겹치면서 KT의 OTT 합병 셈법이 한층 복잡해지고 있습니다. 미디어 시장 환경 변화에 대응하기 위한 전략적 판단이 요구되는 시점입니다. 플랫폼 경쟁력 강화와 보안 이슈가 동시에 대두되고 있습니다.", "source": "아시아투데이", "date": "2026-09-07 17:37", "url": "http://www.asiatoday.co.kr/kn/view.php?key=20260907010002526", "category": "other", "importance": 3, "wl": false, "topic": "kt iptv 및 ott 셈법"}, {"title": "Makedonski Telekom unveils 5G SA network - Telecompaper", "summary": "마케도니아 텔레콤이 독자적인 5G 단독모드(SA) 네트워크를 공식적으로 출범했습니다. 기존 NSA 방식에서 벗어나 초저지연과 고속 통신을 지원하는 인프라를 구축했습니다. 향후 다양한 산업용 디지털 전환 서비스의 기반이 될 것입니다.", "source": "Telecompaper", "date": "2026-09-07 17:28", "url": "https://www.telecompaper.com/news/makedonski-telekom-unveils-5g-sa-network--1581871", "category": "tech", "importance": 3, "wl": false, "topic": "마케도니아텔레콤 5g sa"}, {"title": "[재계 투데이] 삼성 , 하반기 신입 공채 실시 外", "summary": "삼성 등 대기업의 하반기 신입 공채 소식과 함께, 통신사와 연계한 인파 밀집도 측정 앱 및 KT 5G 네트워크 슬라이싱 기술을 활용한 현장 안전 관리 사례가 소개되었다. 통신 인프라의 공공 안전 활용도를 보여준다.", "source": "news.dealsitetv.com", "date": "2026-09-07 17:22", "url": "https://news.dealsitetv.com/articles/175706", "category": "tech", "importance": 3, "wl": false, "topic": "kt 네트워크 슬라이싱"}, {"title": "AIDC 키우는 통신3사…SKT '분업', KT '네트워크', LGU+ '표준화' - v.daum.net", "summary": "국내 통신 3사가 AI 데이터센터(AIDC) 사업을 본격화하는 가운데 전략이 분화되고 있습니다. SKT는 분업, KT는 네트워크 중심, LGU+는 표준화에 초점을 맞추고 경쟁하고 있습니다. 각사의 강점을 살린 AIDC 주도권 경쟁이 치열해지고 있습니다.", "source": "v.daum.net", "date": "2026-09-07 17:13", "url": "https://v.daum.net/v/20260907171305156", "category": "tech", "importance": 3, "wl": false, "topic": "통신3사 ai데이터센터 전략"}, {"title": "Vodafone delivers 5G emergency unit to Spain's UME - Telecompaper", "summary": "보다폰이 스페인 비상재난부대(UME)에 5G 기반 긴급 통신 유닛을 공급했습니다. 재난 및 비상 상황에서 안정적인 통신망을 유지하기 위한 이동형 기지국 역할을 수행합니다. 공공 안전 인프라 강화에 기여할 것으로 기대됩니다.", "source": "Telecompaper", "date": "2026-09-07 16:58", "url": "https://www.telecompaper.com/news/vodafone-delivers-5g-emergency-unit-to-spains-ume--1581880", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 긴급 통신 유닛"}, {"title": "[기획] 데이터센터 다음은 로봇 훈련장… 中 통신사, 피지컬 AI 학습 시...", "summary": "중국 차이나텔레콤이 5G 통신망과 클라우드 인프라를 활용하여 로봇 학습 데이터를 수집하고 처리하는 피지컬 AI 인프라를 구축하고 있다. 데이터센터 다음 단계로 로봇 훈련장과 통신망의 연계가 가속화되고 있다. 통신사의 신사업 모델 확장을 보여준다.", "source": "dt.co.kr", "date": "2026-09-07 16:57", "url": "https://www.dt.co.kr/article/12082561?ref=naver", "category": "tech", "importance": 3, "wl": false, "topic": "중국 통신사 피지컬 ai"}, {"title": "楽天モバイル、一部エリアで10月以降もKDDIローミングを継続する方針を改めてお知らせ (ケータイ Watch) - Yahoo!ニュース", "summary": "라쿠텐 모바일이 일부 지역을 중심으로 10월 이후에도 KDDI 로밍 서비스를 지속 제공할 계획임을 다시금 공지했다. 망 구축 지연 지역 가입자의 이탈을 막기 위한 조치이다. 통신사의 네트워크 서비스 연속성 확보 방안을 보여준다.", "source": "Yahoo!ニュース", "date": "2026-09-07 16:56", "url": "https://news.yahoo.co.jp/articles/0de39bee7ed4a8273685bea495f9a6778b9b5ba1/images/000", "category": "other", "importance": 3, "wl": false, "topic": "라쿠텐모바일 kddi로밍"}, {"title": "KT '티오더 기술탈취' 의혹 재점화", "summary": "오더 플랫폼 기업 티오더가 KT의 불공정 영업 행위 의혹을 제기하며, 통신망 장애가 발생한 매장에 KT 영업직원이 자사 서비스로의 전환을 권유했다는 주장이 나왔다. 통신망 장애 발생과 연계된 통신사의 영업 관행 논란을 다루고 있다. 통신 서비스 안정성과 관련된 업계 이슈다.", "source": "4th.kr", "date": "2026-09-07 16:56", "url": "http://www.4th.kr/news/articleView.html?idxno=2117596", "category": "outage", "importance": 3, "wl": false, "topic": "kt 통신망 장애"}, {"title": "17만명 몰렸지만 먹통 없었다…추석 기차 예매 첫날 '안정적'", "summary": "추석 기차 예매 첫날 17만 명이 몰렸으나 접속 장애나 시스템 먹통 없이 안정적으로 진행되었다. 통신 대역폭을 대폭 증설하고 예매 기간을 연장한 결과다. 대규모 트래픽 폭주 상황에서 안정적인 통신망 운영 역량을 보여준 사례다.", "source": "idaegu.co.kr", "date": "2026-09-07 16:54", "url": "https://www.idaegu.co.kr/news/articleView.html?idxno=558840", "category": "tech", "importance": 3, "wl": false, "topic": "기차 예매 통신 인프라"}, {"title": "[AI 시대, 권력 대이동-SKT] 통신망 위에 AI 탑재…서비스·모델·인프라 확장 - 포인트데일리", "summary": "SK텔레콤이 통신망 위에 AI를 탑재하여 서비스, 모델, 인프라 전반으로 사업 영역을 확장하고 있습니다. 전통적인 통신 사업자에서 AI 컴퍼니로의 전환을 가속화하는 전략입니다. AI 중심의 인프라 생태계 구축이 본격화되고 있습니다.", "source": "포인트데일리", "date": "2026-09-07 16:20", "url": "https://www.pointdaily.co.kr/news/articleView.html?idxno=318305", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai 인프라 확장"}, {"title": "Akash Ambani to Make Jio Into More than Just a Telecom Company - TelecomTalk", "summary": "아카시 암바니가 릴라이언스 지오를 단순한 통신 사업자를 넘어선 종합 기술 기업으로 도약시키겠다는 청사진을 밝혔다. 통신사의 플랫폼 및 신사업 다각화 전략을 설명한다. 업계 리더의 비전 발표로 의미가 있다.", "source": "TelecomTalk", "date": "2026-09-07 16:14", "url": "https://telecomtalk.info/akash-ambani-to-make-jio-into-more/1011615/", "category": "other", "importance": 3, "wl": false, "topic": "릴라이언스 지오 비전"}, {"title": "[전파칼럼] AI 시대 보이지 않는 안전망, 전자기 복원력", "summary": "AI 기반 자율시스템과 핵심 인프라에서 작은 센서 오류나 순간적인 통신 장애만으로도 기능 상실로 이어질 수 있어 전자기 복원력의 중요성이 강조되고 있다. 인명 안전과 직결되는 장비와 통신망의 안정성 확보 방안을 다룬다.", "source": "etnews.com", "date": "2026-09-07 16:01", "url": "https://www.etnews.com/20260907000137", "category": "tech", "importance": 3, "wl": false, "topic": "전자기 복원력 통신장비"}, {"title": "송주영 연구위원 \"국내 통신 사 첫 클라우드 전산실…서버 복구 빨라서 ...", "summary": "국내 통신사 최초로 클라우드 전산실을 도입한 사례와 관련하여, 요금 정산까지 연결된 통신사 핵심 전산망의 클라우드 전환과 장애 대응의 중요성이 조명되었다. 24시간 중단 없는 가동이 요구되는 통신망 인프라의 고난도 전환 작업이다.", "source": "hankyung.com", "date": "2026-09-07 15:54", "url": "https://www.hankyung.com/article/2026090778701", "category": "tech", "importance": 3, "wl": false, "topic": "국내 통신사 클라우드 전산실"}, {"title": "LG유플러스, PMDC 얼라이언스 출범…AI 데이터센터 건축기간 줄인다 - 사회적경제뉴스", "summary": "LG유플러스가 'PMDC 얼라이언스'를 출범하며 AI 데이터센터(AIDC)의 건축 기간을 단축하기 위한 표준화 작업에 착수했습니다. 건설사 등과의 협업을 통해 데이터센터 건립 효율성을 높인다는 전략입니다. 고성능 AI 인프라 시장 주도권을 확보하기 위한 행보입니다.", "source": "사회적경제뉴스", "date": "2026-09-07 15:43", "url": "http://www.senews.kr/40879", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 pmdc 얼라이언스"}, {"title": "Vodafone Idea Shares Hit 25-Month High Amid Rebranding and SRK Campaign - Whalesbook", "summary": "인도의 통신사 보다폰아이디어가 리브랜딩과 캠페인에 힘입어 주가가 25개월 내 최고치를 기록했습니다. 주가는 최근 한 달간 20% 이상 급등하며 시장 가치가 크게 확대되었습니다. 이는 투자자들의 긍정적인 기대감이 반영된 결과로 풀이됩니다. 향후 지속적인 실적 개선과 마케팅 성과가 주목됩니다.", "source": "Whalesbook", "date": "2026-09-07 15:34", "url": "https://www.whalesbook.com/news/English/telecom/Vodafone-Idea-Shares-Hit-25-Month-High-Amid-Rebranding-and-SRK-Campaign/6a9e5af540007e01b83c8679", "category": "earnings", "importance": 3, "wl": false, "topic": "보다폰아이디어 주가 상승"}, {"title": "KT 2년 새 경력사원 5천 명 줄이고 신입 채용은 배로 늘려, 박윤영 AX 중심 젊은피 수혈 '속도' - 비즈니스포스트", "summary": "KT가 지난 2년간 경력사원을 대폭 줄이고 신입 채용을 늘리는 등 박윤영 체제 하에서 AX(AI 전환) 중심의 젊은 피 수혈에 속도를 내고 있습니다. 디지털 전환 전략에 맞춰 조직 체질을 근본적으로 개선하려는 인사 조치입니다. 향후 인력 구조 변화가 경영 효율성에 미칠 영향이 주목됩니다.", "source": "비즈니스포스트", "date": "2026-09-07 15:07", "url": "https://m.businesspost.co.kr/BP?command=mobile_view&num=446552", "category": "exec", "importance": 3, "wl": false, "topic": "kt 인력 구조조정 및 채용"}, {"title": "LG U+, AI 데이터센터 '조립식' 추진…SKT 이어 구축 속도전 - 디일렉", "summary": "LG유플러스가 SK텔레콤에 이어 조립식 모듈러 방식을 활용한 AI 데이터센터 구축에 속도를 내고 있습니다. 공기 단축과 효율성 극대화를 위한 새로운 건축 방식을 도입하고 있습니다. 급증하는 AI 컴퓨팅 수요에 대응하기 위한 인프라 투자입니다.", "source": "디일렉", "date": "2026-09-07 14:58", "url": "https://www.thelec.kr/news/articleView.html?idxno=61914", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai 데이터센터"}, {"title": "Japan's AI data centre capacity set to quadruple by 2033 - report - Telecompaper", "summary": "일본의 AI 데이터센터 용량이 2033년까지 4배로 급증할 것으로 예상된다는 리포트가 발표됐다. AI 인프라 확충에 따라 막대한 전력과 고속 네트워크 수요가 동반 증가할 전망이다. 통신사와 데이터센터 사업자들의 인프라 투자 확대를 예고한다.", "source": "Telecompaper", "date": "2026-09-07 14:55", "url": "https://www.telecompaper.com/news/japans-ai-data-centre-capacity-set-to-quadruple-by-2033-report--1581862", "category": "other", "importance": 3, "wl": false, "topic": "일본 ai 데이터센터"}, {"title": "구현모 시절 인수한 KT 엡실론, 1년 만에 다시 적자 전환 - 시사저널e", "summary": "구현모 전 대표 시절 인수했던 KT의 해외 자회사 엡실론이 인수 1년 만에 다시 적자 전환했습니다. 글로벌 네트워크 사업 확장을 위해 인수했으나 수익성 개선에 어려움을 겪고 있습니다. 해외 투자 전략에 대한 점검이 필요하다는 지적이 나옵니다.", "source": "시사저널e", "date": "2026-09-07 14:38", "url": "https://www.sisajournal-e.com/news/articleViewAmp.html?idxno=423551", "category": "earnings", "importance": 3, "wl": false, "topic": "kt 엡실론 실적 악화"}, {"title": "Weekly Recap: Deutsche Telekom AG €5bn buyback and CFO transition - TradingView", "summary": "도이치텔레콤이 5유로 규모의 대규모 자사주 매입 계획과 함께 최고재무책임자(CFO) 교체 인사를 단행했습니다. 주주 환원 정책을 강화하고 경영진 개편을 통해 미래 전략을 정비하고 있습니다. 시장에서는 이번 리더십 변화에 주목하고 있습니다.", "source": "TradingView", "date": "2026-09-07 14:14", "url": "https://www.tradingview.com/news/tradingview:0ccb722fa12d2:0-weekly-recap-deutsche-telekom-ag-5bn-buyback-and-cfo-transition/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 자사주 매입"}, {"title": "Telstra、7月の通信障害の原因はネットワーク同期システムの障害と確認 - Data Center Cafe", "summary": "호주 텔스트라(Telstra)가 지난 7월 겪은 통신 장애의 원인이 네트워크 동기화 시스템의 오류 때문인 것으로 공식 확인됐다. 대형 통신사의 네트워크 인프라 내부 시스템 결함으로 인한 서비스 장애 분석 결과이다. 통신망 안정성 확보를 위한 교훈을 제공한다.", "source": "Data Center Cafe", "date": "2026-09-07 14:10", "url": "https://cafe-dc.com/security/telstra-confirms-july-outage-was-caused-by-network-timing-system-failure/", "category": "outage", "importance": 3, "wl": false, "topic": "텔스트라 통신장애"}, {"title": "BSNL Beats Jio and Airtel in Mobile Subscriber Additions in This Telecom Circle - TelecomT", "summary": "인도 국영 통신사 BSNL이 특정 통신 서클에서 지오(Jio)와 에어텔(Airtel)을 제치고 모바일 가입자 순증 1위를 기록했다. 인도 이동통신 시장에서의 가입자 판도 변화를 보여준다. 경쟁 구도 분석에 유의미한 통신사 동향이다.", "source": "TelecomTalk", "date": "2026-09-07 13:06", "url": "https://telecomtalk.info/bsnl-beats-jio-airtel-in-mobilesubscriber-additions/1011601/", "category": "other", "importance": 3, "wl": false, "topic": "bsnl 가입자 증가"}, {"title": "楽天モバイル、KDDIローミングは「10月以降も継続」と再告知 「現在も詰めの協議」（画像）（1/2枚目） - ITmedia", "summary": "라쿠텐 모바일이 당초 종료하려던 KDDI 로밍을 기지국 정비 지연 지역에 한해 10월 이후에도 연장 운영하기로 하고 현재 조율 중이다. 통신사의 인프라 투자 속도와 가입자 서비스 보호 전략의 접점을 보여준다.", "source": "ITmedia", "date": "2026-09-07 13:00", "url": "https://www.itmedia.co.jp/news/article/limage/2609/07/2000001211/10005386", "category": "other", "importance": 3, "wl": false, "topic": "`라쿠텐모바일 kddi로밍`"}, {"title": "楽天モバイル、一部エリアで10月以降もKDDIローミングを継続する方針を改めてお知らせ", "summary": "라쿠텐모바일은 5일 공식 사이트를 통해 자사 회선 구축이 늦어지는 일부 지역에서 10월 이후에도 KDDI 회선에 의한 로밍을 계속할 방침임을 다시 한번 안내했다. 통신사 간 네트워크 로밍 협력 유지와 관련된 주요 동향이다.", "source": "ケータイ Watch", "date": "2026-09-07 12:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2138671.html", "category": "contract", "importance": 3, "wl": true, "topic": "라쿠텐모바일 로밍"}, {"title": "[단독] KT, 공중전화 업무 통합…개통·AS 기사도 교육 - v.daum.net", "summary": "KT가 공중전화 관련 내부 업무를 통합하고 개통 및 AS 현장 기사들을 대상으로 교육을 진행합니다. 유무선 서비스 현장 운영의 효율성을 제고하기 위한 조직 정비 작업입니다. 서비스 품질 향상을 위한 현장 지원 강화 조치입니다.", "source": "v.daum.net", "date": "2026-09-07 11:49", "url": "https://v.daum.net/v/20260907114900377", "category": "exec", "importance": 3, "wl": false, "topic": "kt 공중전화 업무 통합"}, {"title": "LG유플러스-GS건설, 모듈러 데이터센터 표준모델 개발 협력 - 이슈밸리", "summary": "LG유플러스와 GS건설이 모듈러 데이터센터 표준모델 공동 개발을 위한 협력을 체결했습니다. 공기 단축과 비용 절감을 동시에 달성할 수 있는 인프라 구축 방식입니다. 양사의 협업을 통해 데이터센터 건설 경쟁력을 높여나갈 계획입니다.", "source": "이슈밸리", "date": "2026-09-07 11:34", "url": "https://www.issuevalley.com/news/articleView.html?idxno=56058", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 모듈러 데이터센터"}, {"title": "Jio marks a decade of disruption, sets sights on global technology markets - Communication", "summary": "릴라이언스 지오가 시장 진입 10주년을 맞아 5억 명 이상의 가입자를 확보한 데 이어 글로벌 기술 시장으로 진출하겠다는 포부를 밝혔다. 인도 최대 통신사의 사업 확장과 글로벌 기술 생태계 공략 비전을 보여준다.", "source": "Communications Today", "date": "2026-09-07 11:16", "url": "https://www.communicationstoday.co.in/jio-marks-a-decade-of-disruption-sets-sights-on-global-technology-markets/", "category": "other", "importance": 3, "wl": false, "topic": "릴라이언스 지오 글로벌 전략"}, {"title": "首都直下地震でも、スマホはつながる？ ドコモやソフトバンク…各社が垣根越え、復旧へタッグ - tokyo-np.co.jp", "summary": "수도권 직하 지진 등 대재난 발생 시에도 스마트폰 통신이 가능하도록 NTT 도코모, 소프트웨어 등 일본 통신사들이 장벽을 넘어 복구를 위해 손을 잡았다. 재난 대비 비상 통신망 공동 대응 및 인프라 로밍 협력 체계를 구축한다. 통신사의 공공 안전 및 재난 복구 역량을 강화하는 조치이다.", "source": "tokyo-np.co.jp", "date": "2026-09-07 11:00", "url": "https://www.tokyo-np.co.jp/article/513347", "category": "other", "importance": 3, "wl": false, "topic": "일본 통신사 재난 연대"}, {"title": "T-Mobile Names Jessica Uhl As Next CFO, Peter Osvaldik To Retire In 2027 - Pulse 2.0", "summary": "미국 통신사 티모바일이 새로운 최고재무책임자(CFO)로 제시카 울을 임명했다. 기존 CFO는 2027년에 은퇴할 예정이다. 대형 통신사의 고위 경영진 인사는 기업 전략 변화에 영향을 미칠 수 있다. 주요 통신사의 인물 동향으로 가치가 있다.", "source": "Pulse 2.0", "date": "2026-09-07 10:25", "url": "https://pulse2.com/t-mobile-names-jessica-uhl-as-next-cfo-peter-osvaldik-to-retire-in-2027/", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 임원 교체"}, {"title": "추석 귀성길 정체 AI가 족집게 예측하고 드론 뜬다", "summary": "추석 귀성길 관리를 위해 AI 분석망과 연동된 순찰 드론 수십 대가 투입된다. 상공에서 촬영한 대용량 4K 영상 스트림을 지연 없이 지상 관제 센터로 전송하기 위해 5G 이동통신 기반의 무선 네트워크가 활용된다. 공공 안전을 위한 5G 인프라의 실증 사례다.", "source": "gokorea.kr", "date": "2026-09-07 09:18", "url": "https://www.gokorea.kr/news/articleView.html?idxno=877330", "category": "tech", "importance": 3, "wl": false, "topic": "추석 연휴 드론 통신"}, {"title": "LG유플러스, AI 데이터센터 구축 ‘속도전’… PMDC 표준모델 만든다 - Korea IT Times", "summary": "LG유플러스가 AI 데이터센터 구축 속도를 높이기 위해 PMDC 표준모델을 제정하고 추진합니다. 데이터센터 시공 및 운영의 표준화를 통해 효율성을 극대화합니다. 급증하는 AIDC 수요에 대응하기 위한 인프라 혁신 전략입니다.", "source": "Korea IT Times", "date": "2026-09-07 09:15", "url": "http://www.koreaittimes.com/news/articleView.html?idxno=156827", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai데이터센터 표준"}, {"title": "[심층진단]② LG유플러스, 핵심은 ‘건물을 빨리 짓는 것’보다 전력망·냉각·고밀도 GPU 환경까지 통합한 운영 표준 확보 -2부 - 뉴스밸류", "summary": "LG유플러스가 데이터센터 건립 속도뿐만 아니라 전력망, 냉각, 고밀도 GPU 환경까지 통합한 운영 표준을 확보하는 것이 핵심이라고 진단했습니다. 고성능 AI 연산을 안정적으로 소화하기 위한 인프라 역량 강화에 집중하고 있습니다. AIDC 시장에서 차별화된 운영 경쟁력을 갖추겠다는 전략입니다.", "source": "뉴스밸류", "date": "2026-09-07 07:30", "url": "https://www.newsvalue.kr/news/articleView.html?idxno=24566", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai데이터센터 운영"}, {"title": "Puzzle of Airtel’s licence status as CA issues new notice - Business Daily", "summary": "통신 규제 기관의 새로운 통지서 발급에 따른 에어텔(Airtel)의 라이선스 상태를 둘러싼 논란이 제기됐다. 규제 준수 여부가 통신사의 사업 지속성에 영향을 미치는 사안이다. 현지 통신 시장의 규제 리스크를 보여준다.", "source": "Business Daily", "date": "2026-09-07 03:15", "url": "https://www.businessdailyafrica.com/bd/corporate/companies/puzzle-of-airtel-s-licence-status-as-ca-issues-new-notice-5585994", "category": "policy", "importance": 3, "wl": false, "topic": "에어텔 라이선스"}, {"title": "가을밤 수놓은 100만 인파…\"하늘 보는 모든 사람이 누릴 행복\" 쏘아올렸...", "summary": "대규모 인파가 몰리는 행사에서 KT의 5G 네트워크 슬라이싱 기술을 기반으로 한 CCTV 통합관제 시스템이 가동되었다. 주요 구간의 인파 흐름을 실시간으로 파악하여 안전사고를 예방하는 데 기여하고 있다. 통신망 슬라이싱 기술의 실효성을 입증하는 현장이다.", "source": "newsroad.co.kr", "date": "2026-09-06 19:18", "url": "http://www.newsroad.co.kr/news/articleView.html?idxno=63867", "category": "tech", "importance": 3, "wl": false, "topic": "kt 5g 네트워크 슬라이싱"}, {"title": "Verizon waives charges for Hurricane Lowell, prepares network in Hawaiʻi - Verizon", "summary": "미국 통신사 버라이즌이 허리케인 로웰로 피해를 입은 하와이 지역 고객을 위해 요금을 면제하고 네트워크 복구 및 대비태세를 갖추고 있다. 재난 상황에 대응하는 통신사의 인프라 관리 및 고객 지원 조치이다. 통신사의 네트워크 안정화 노력을 보여준다. 재난 시 통신사 대응 사례이다.", "source": "Verizon", "date": "2026-09-06 18:32", "url": "https://www.verizon.com/about/news/hurricane-lowell-updates", "category": "other", "importance": 3, "wl": false, "topic": "버라이즌 하와이 지원"}, {"title": "일자리부터 돌봄·교통·의료·여가까지 '살고싶은 대구'로...시민 생애...", "summary": "대구시가 응급의료 체계 혁신을 위해 2026년 하반기 5G 구급차에 통신 장비를 구축하고 AI 플랫폼 실증사업을 추진한다. 응급실과 소방서 간의 실시간 데이터 전송을 위해 안정적인 5G 네트워크 인프라가 활용된다. 공공 의료 서비스와 통신 기술의 융합 사례다.", "source": "idaegu.co.kr", "date": "2026-09-06 17:24", "url": "https://www.idaegu.co.kr/news/articleView.html?idxno=558741", "category": "tech", "importance": 3, "wl": false, "topic": "대구시 5g 구급차"}, {"title": "\"AI 데이터센터에 모듈러 접목\" … GS건설·LGU+ 표준모델 개발", "summary": "GS건설이 AI 데이터센터 수요에 대응하기 위해 LG유플러스 등과 협력하여 모듈러 기술을 접목한 사전 제작형 모듈러 데이터센터(PMDC) 표준모델 개발에 나선다. 통신·건설사 간 협업 소식이다.", "source": "매일경제 IT", "date": "2026-09-06 17:12", "url": "https://www.mk.co.kr/news/realestate/12145461", "category": "contract", "importance": 3, "wl": true, "topic": "gs건설 lg유플러스 데이터센터"}, {"title": "Rural calls, data to become cheaper by Q1 2027 – Sam George - MyJoyOnline", "summary": "가나 정부가 2027년 1분기까지 농어촌 지역의 음성 통화 및 데이터 요금을 인하하겠다고 밝혔다. 샘 조지 장관은 모든 농어촌 통신망을 4G 역량으로 업그레이드할 계획이라고 발표했다. 디지털 포용성 확대와 통신비 부담 완화가 주요 목적이다.", "source": "MyJoyOnline", "date": "2026-09-06 14:48", "url": "https://www.myjoyonline.com/rural-calls-data-to-become-cheaper-by-q1-2027-sam-george/", "category": "policy", "importance": 3, "wl": false, "topic": "가나 통신망 업그레이드"}, {"title": "After 10 years of India feat, Jio sets its sights on global market: Akash Ambani", "summary": "인도 지오(Jio)가 10년 동안 인도 시장에서의 성과를 바탕으로 글로벌 시장 진출을 본격 추진한다. 아카시 암바니는 지오가 고품질 디지털 연결성을 보편화한 저력을 바탕으로 해외로 시선을 돌리고 있다고 밝혔다. 대형 통신사의 글로벌 전략 발표다.", "source": "ET Telecom", "date": "2026-09-06 14:11", "url": "https://telecom.economictimes.indiatimes.com/news/industry/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market-akash-ambani/133826619", "category": "other", "importance": 3, "wl": true, "topic": "지오 글로벌 진출"}, {"title": "2026년 9월 15일부터 2G 서비스가 종료됩니다. 어떤 사용자들이 영향을 받게 될까요? - Vietnam.vn", "summary": "베트남에서 2026년 9월 15부로 2G 서비스가 공식 종료된다. 주파수 자원의 효율적 재배치와 4G·5G 전환을 가속화하기 위한 조치다. 구형 단말기 사용자들의 이동통신 전환 대책이 시행되고 있다.", "source": "Vietnam.vn", "date": "2026-09-06 11:43", "url": "https://www.vietnam.vn/ko/tu-15-9-2026-tat-song-2g-nhung-nguoi-dung-nao-bi-anh-huong", "category": "policy", "importance": 3, "wl": false, "topic": "베트남 2g 서비스 종료"}, {"title": "SPCX Stock: SpaceX's Wireless Ambitions Fuel T-Mobile Acquisition Speculation - stocktwits", "summary": "스페이스X의 무선 통신 야망이 티모바일 인수설에 대한 투기적 추측을 불러일으키고 있다. 위성 통신과 지상파 이동통신사 간의 결합 가능성에 대한 시장의 기대감을 반영한다. 통신 및 위성 산업의 메가 딜 가능성을 엿볼 수 있다. 향후 업계 재편에 미치는 파급력이 크다.", "source": "stocktwits.com", "date": "2026-09-06 10:40", "url": "https://stocktwits.com/news-articles/markets/equity/spcx-stock-space-x-s-wireless-ambitions-fuel-t-mobile-acquisition-speculation/cZ1G8HBR7X1", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 티모바일 인수"}, {"title": "LGU+ 볼트업, 충전기 이상 감지 AI 개발…원격 조치 자동화 추진 - 전자신문", "summary": "LG유플러스의 전기차 충전 서비스 '볼트업'이 충전기 이상을 감지하는 AI 시스템을 개발하고 원격 조치 자동화를 추진한다. 통신 및 AI 기술을 인프라 관리 효율화에 접목한 사례다. 안정적인 서비스 운영을 위한 지능형 관제 체계를 강화하고 있다.", "source": "전자신문", "date": "2026-09-06 10:30", "url": "https://www.etnews.com/20260904000134?m=1", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 볼트업"}, {"title": "“PMDC 표준모델 공동개발”…GS건설, 모듈러로 AI데이터센터 공기 단축", "summary": "GS건설이 LG유플러스 등 5개사와 협력하여 AI 데이터센터 밸류체인 확대를 위한 하이퍼스케일 사전 제작형 모듈러 데이터센터(PMDC) 표준모델을 공동 개발한다. 데이터센터 인프라 협력 소식이다.", "source": "매일경제 IT", "date": "2026-09-06 10:14", "url": "https://www.mk.co.kr/news/realestate/12145229", "category": "contract", "importance": 3, "wl": true, "topic": "lg유플러스 gs건설 pmdc"}, {"title": "평범한 업무차가 통신망 훑는 AI 차량으로…SKT '톺다', 해외서도 눈길 - newsis.com", "summary": "SK텔레콤이 개발한 AI 기반 통신망 분석 차량 '톺다'가 해외에서도 주목을 받고 있다. 평범한 업무차가 이동하며 통신망 상태를 점검하는 혁신적인 기술이다. 글로벌 통신 인프라 관리 효율성을 높이는 사례로 평가받는다.", "source": "newsis.com", "date": "2026-09-06 10:13", "url": "https://mobile.newsis.com/view_amp.html?ar_id=NISX20260906_0003777890", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 톺다"}, {"title": "Charter Stock Outlook: Can the $34.5B Cox Merger Help CHTR Recover Before Earnings? - trad", "summary": "차터 커뮤니케이션스의 345억 달러 규모 콕스(Cox) 인수합병이 실적 회복에 미칠 영향과 주가 전망을 분석했다. 대형 케이블 및 통신 사업자 간의 거대 M&A 딜 추진 상황을 보여준다. 통신 및 미디어 시장의 지형을 바꿀 수 있는 대형 이벤트이다. 업계 재편 측면에서 중요도가 높다.", "source": "tradingkey.com", "date": "2026-09-06 07:20", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/261998863-charter-stock-outlook-cox-merger-chtr-before-earnings-tradingkey", "category": "other", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션스 인수"}, {"title": "제각각 통신 방식 통일…軍, 전군 드론 '통신표준' 만든다 - 뉴스1", "summary": "군 당국이 제각각 운영되던 드론 통신 방식을 하나로 통일하기 위해 전군 드론 통신표준 제정에 착수했다. 군수용 무인기의 상호운용성과 데이터 전송 안정성을 확보하기 위한 조치다. 향후 전술 통신망과의 연계성이 강화될 것으로 보인다.", "source": "뉴스1", "date": "2026-09-06 07:00", "url": "https://www.news1.kr/amp/diplomacy/defense-diplomacy/6280619", "category": "tech", "importance": 3, "wl": false, "topic": "한국군 드론 통신"}, {"title": "Calls, texts and data will be free on Kauai as Hurricane Lowell nears - Stock Titan", "summary": "허리케인 로웰의 접근에 따라 카우아이 지역 주민들을 위해 통신사들이 통화, 문자, 데이터를 무료로 제공하기로 했다. 자연재해에 대응한 통신사의 긴급 네트워크 무상 지원 조치이다. 통신사의 사회적 책임과 비상 통신망 운영 방안을 보여준다. 재난 대비 통신 지원 사례이다.", "source": "Stock Titan", "date": "2026-09-06 06:29", "url": "https://www.stocktitan.net/news/VZ/verizon-waives-charges-for-hurricane-lowell-prepares-network-in-y617ytf66y46.html", "category": "other", "importance": 3, "wl": false, "topic": "카우아이 허리케인 지원"}, {"title": "Union Minister Jyotiraditya Scindia launches theme for 10th India Mobile Congress 2026 - N", "summary": "인도 통신부 장관 조티라디티야 신디아 가 제10회 인도 모바일 콩그레스(IMC) 2026의 테마를 공식 런칭했다. 이번 행사는 인도 통신 시장의 디지털 혁신과 모바일 기술 발전을 조명하는 자리다. 글로벌 통신사 및 장비 제조사들의 참여가 기대된다.", "source": "News On AIR", "date": "2026-09-06 04:56", "url": "https://newsonair.gov.in/union-minister-jyotiraditya-scindia-launches-theme-for-10th-india-mobile-congress-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "인도모바일 congress"}]};

  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
