  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}

  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}

  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}

  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
</style>
</head>

_content=RCR-Wireless-Channel", "category": "tech", "importance": 5, "wl": true, "topic": "에릭슨 적응형 인벤토리"}, {"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도 정부가 국가 안보 우려를 이유로 레거시 중국산 통신 장비에 대한 '립 앤 리플레이스(철거 후 교체)' 방안을 심도 있게 검토하고 있다. 화웨이와 ZTE 등 중국산 장비에 대한 글로벌 안보 제재 기조와 맞물려 인도 시장 내 대규모 장비 교체 수요가 발생할 가능성이 높다. 이는 글로벌 통신장비 시장 구도와 삼성전자를 비롯한 비중국계 장비사들의 수주 환경에 큰 영향을 미칠 수 있는 중대 사안이다. 인도 통신사의 장비 조달 전략 변화에 업계의 이목이 집중되고 있다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도 중국산 장비 퇴출 검토"}, {"title": "Nokia opens Saudi Arabia R&D centre - Mobile World Live", "summary": "노키아가 사우디아라비아에 인공지능 기반 네트워크 자동화 R&D 센터를 개소했다. AI 역량을 강화하고 중동 시장에서의 기술 협력을 확대하기 위한 전략적 행보이다.", "source": "Mobile World Live", "date": "2026-09-02 21:07", "url": "https://www.mobileworldlive.com/nokia/nokia-opens-saudi-arabia-rd-centre/", "category": "tech", "importance": 5, "wl": false, "topic": "노키아 연구소"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 드론 실시간 추적 등의 6G 통신 신기술을 공개할 예정이다. 6G와 AI 기능이 결합된 ISAC 기술을 통해 한국 시장에서의 기술 협력을 모색하고 있다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 6g"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨이 AI 랜(AI-RAN), ISAC, 6G로 이어지는 차세대 네트워크 기술 리더십과 청사진을 제시했다. 한국 파트너들과의 협력을 통해 AI 시대 통신 경쟁력을 주도하겠다는 전략이다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 6g청사진"}, {"title": "에릭슨코리아, AI 기반 통신망· 6G 기술 로드맵 공개", "summary": "에릭슨코리아가 이노베이션 데이를 열고 AI 기반 통신망 발전 전략과 6G 기술 로드맵을 공개했다. 국내 통신사들과 함께 차세대 네트워크 진화 방향을 공유했다.", "source": "biz.heraldcorp.com", "date": "2026-09-02 16:10", "url": "https://biz.heraldcorp.com/article/10860523?ref=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨코리아 6g로드맵"}, {"title": "에릭슨 코리아, ‘Ericsson Innovation Day 2026 Korea’ 개최…AI 시대 네...", "summary": "에릭슨코리아가 국내 통신사 및 생태계 파트너를 대상으로 MWC 주요 기술과 5G SA, 5G 어드밴스드, 6G 기술 진화 방향을 선보였다.", "source": "segye.com", "date": "2026-09-02 16:09", "url": "https://www.segye.com/newsView/20260902515277?OutUrl=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨코리아 이노베이션데이"}, {"title": "에릭슨 코리아, ‘이노베이션 데이 2026 코리아’ 개최", "summary": "에릭슨코리아가 AI-RAN, ISAC, 6G 기술을 바탕으로 네트워크 자체의 AI 진화와 국내 고객 지원 방침을 강조했다.", "source": "fnnews.com", "date": "2026-09-02 16:03", "url": "https://www.fnnews.com/news/202609021538039947", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨코리아 6g기술"}, {"title": "에릭슨코리아 \"AI-RAN·ISAC로 6G 네트워크 전환 앞당길 것\"", "summary": "에릭슨코리아가 AI-RAN과 ISAC 중심의 6G 네트워크 전환을 앞당기겠다고 밝혔다. 150년 역사 기반의 차세대 통신 진화 방향을 제시했다.", "source": "aitimes.com", "date": "2026-09-02 15:08", "url": "https://www.aitimes.com/news/articleView.html?idxno=214748", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨코리아 6g전환"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - developingtelecoms.com", "summary": "에릭슨이 사우디아라비아 통신사 stc와 다년 계약을 체결하고 5G 네트워크 확장을 추진한다. 중동 지역 대규모 5G 인프라 구축 사업을 수주하며 시장 주도권을 확대하고 있다.", "source": "developingtelecoms.com", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 5, "wl": false, "topic": "에릭슨 수주"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 대중국 제재가 완성품을 넘어 부품 영역까지 확산되면서 국내 통신 장비 부품 업체들에게 반사이익과 영향이 집중되고 있다. 글로벌 장비 시장의 공급망 재편 가능성을 시사한다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 5, "wl": false, "topic": "화웨이 제재"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "에릭슨이 전파 송출 한 번으로 고속 데이터 전송과 사물 탐지를 동시에 처리하는 6G 통신 신기술을 공개했다. 통신용과 레이더용 주파수를 따로 할당할 필요가 없는 장비 기술이다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 6g통신신기술"}, {"title": "Nokia Bell Labs sees bells toll in downsizing and wind-down of future network vision - SDx", "summary": "노키아 벨랩이 조직 축소 및 미래 네트워크 비전 재정립에 나섰다. 연구조직 개편과 구조조정을 통해 비용 효율성을 도모하고 사업 방향성을 조정하는 과정이다.", "source": "SDxCentral", "date": "2026-09-01 23:01", "url": "https://www.sdxcentral.com/news/nokia-bell-labs-sees-bells-toll-in-downsizing-and-wind-down-of-future-network-vision/", "category": "exec", "importance": 5, "wl": false, "topic": "노키아 벨랩"}, {"title": "Samsung wins ZTE 5G patent case, raising difficult questions for UK courts - IAM Patent", "summary": "삼성전자가 ZTE와의 5G 특허 소송에서 승소하며 영국 법원에 까다로운 법적 과제를 남겼다. 글로벌 통신 특허 공방에서 삼성전자가 거둔 중요한 법적 승리이다.", "source": "IAM Patent", "date": "2026-09-01 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "contract", "importance": 5, "wl": false, "topic": "삼성전자 특허"}, {"title": "Huawei Profit Plunges 36% As AI, Chip Investment And Rising Costs Squeeze Margins - Tekedi", "summary": "화웨이의 순이익이 AI와 칩 투자 비용 증가 및 비용 압박으로 인해 36% 급감했다. 대규모 투자가 수익성에 미치는 영향과 경쟁사의 실적 악화 흐름을 보여준다.", "source": "Tekedia", "date": "2026-09-01 19:49", "url": "https://www.tekedia.com/huawei-profit-plunges-36-as-ai-chip-investment-and-rising-costs-squeeze-margins/", "category": "earnings", "importance": 5, "wl": false, "topic": "화웨이 실적"}, {"title": "India weighs ‘rip and replace’ plan for Chinese telecom gear - Communications Today", "summary": "인도 정부가 중국산 통신 장비에 대한 '장비 철거 및 교체(rip and replace)' 정책 도입을 저울질하고 있다. 화웨이와 ZTE 등 중국산 장비 배제 움직임이 글로벌로 확산되는 양상이다.", "source": "Communications Today", "date": "2026-09-01 19:18", "url": "https://www.communicationstoday.co.in/india-weighs-rip-and-replace-plan-for-chinese-telecom-gear/", "category": "policy", "importance": 5, "wl": false, "topic": "인도 화웨이"}, {"title": "Ericsson says 5G SA is core network for AI era, sets out foundation for 6G evolution - 디지털", "summary": "에릭슨이 5G 단독모드(SA)가 AI 시대의 핵심 코어 네트워크이며 6G 진화의 기반이 된다고 밝혔다. 향후 통신 장비 시장의 기술 표준 방향성을 제시하는 내용이다.", "source": "디지털투데이", "date": "2026-09-01 15:31", "url": "https://www.digitaltoday.co.kr/en/view/98844/ericsson-says-5g-sa-is-core-network-for-ai-era-sets-out-foundation-for-6g-evolution", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 5g"}, {"title": "Ericsson powers Saudi Arabia’s next phase of digital transformation and innovation - Tahaw", "summary": "에릭슨이 사우디아라비아의 차세대 디지털 전환과 혁신 과정을 기술적으로 지원하고 있다. 현지 통신사들과의 협력이 본격화되고 있다.", "source": "TahawulTech.com", "date": "2026-09-03 07:04", "url": "https://www.tahawultech.com/home-slide/ericsson-powers-saudi-arabias-next-phase-of-digital-transformation-and-innovation/", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 디지털"}, {"title": "Saudi’s ACES announces 5G and 6G partnership with Movandi - developingtelecoms.com", "summary": "사우디 ACES가 모반디와 손잡고 5G 및 6G 파트너십 체결을 발표했다. 중동 인프라 시장에서 차세대 통신 기술 협력이 활발해지고 있다.", "source": "developingtelecoms.com", "date": "2026-09-02 20:57", "url": "https://www.developingtelecoms.com/regions/central-eastern-europe-telecommunications/20770-saudis-aces-announces-5g-and-6g-partnership-with-movandi.html", "category": "contract", "importance": 4, "wl": false, "topic": "aces 파트너십"}, {"title": "Nokia partners with Saudi Arabia on network automation R&D - Telecoms", "summary": "노키아가 사우디아라비아와 손잡고 네트워크 자동화 분야의 연구개발 협력을 추진한다. 현지 디지털 전환 전략과 긴밀히 연계되어 있다.", "source": "Telecoms", "date": "2026-09-02 00:05", "url": "https://www.telecoms.com/automation/nokia-partners-with-saudi-arabia-on-network-automation-r-d", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 파트너십"}, {"title": "Ericsson and Mobily Partner for AI Networks in Saudi Arabia - intlbm", "summary": "에릭슨과 모빌리가 사우디아라비아에서 AI 네트워크 구현을 위한 파트너십을 체결했다. 자율형 네트워크 구축과 인공지능 기반 통신 인프라 혁신을 도모한다.", "source": "intlbm", "date": "2026-09-01 20:24", "url": "https://intlbm.com/2026/09/01/ericsson-and-mobily-partner-for-ai-networks-in-saudi-arabia/", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 모빌리"}, {"title": "[6G격전] ②동맹 없인 미래도 없다 - hansbiz.co.kr", "summary": "6G 통신 표준 선점을 위해 글로벌 기업 간의 동맹과 협력이 필수적이라는 점을 분석한 기사이다. 차세대 네트워크 경쟁 구도를 조명한다.", "source": "hansbiz.co.kr", "date": "2026-09-01 15:50", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=861251", "category": "tech", "importance": 4, "wl": false, "topic": "6g격전 동맹"}, {"title": "브로드컴 “AI칩 매출 3배↑”… 삼성 수혜 기대감 커진다", "summary": "브로드컴이 맞춤형 AI 가속기와 AI 네트워크 반도체 수요 급증에 힘입어 뛰어난 실적을 거두었다. 이 과정에서 삼성전자와의 협력 가능성도 재조명되고 있다.", "source": "dt.co.kr", "date": "2026-09-03 08:45", "url": "https://www.dt.co.kr/article/12081849?ref=naver", "category": "earnings", "importance": 3, "wl": false, "topic": "브로드컴 실적"}, {"title": "FIS stock gains on Ericsson wallet partnership and Q2 banking growth - AD HOC NEWS", "summary": "에릭슨의 월렛 파트너십 체결 소식이 FIS 등의 주가 상승에 긍정적 영향을 미쳤다. 금융 및 모바일 서비스 연계 협력 사례이다.", "source": "AD HOC NEWS", "date": "2026-09-03 00:32", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/fis-stock-gains-on-ericsson-wallet-partnership-and-q2-banking-growth/70044743", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 파트너십"}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "유럽 통신 및 기술 시장 동향에서 페어폰이 상반기 실적 호조에 힘입어 시리즈 C 투자 라운드를 개시했다. 또한 스파크와 헬라스 샛이 양자 보안 통신 협력에 나섰으며, 노키아는 사우디아라비아에서 네트워크 자동화 기술을 개발 중이다. 에릭슨은 FIS와의 협업을 통해 핀테크 제안을 강화하고 있다. 주요 장비사들의 기술 고도화와 투자 유치 움직임이 활발하게 전개되고 있다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "https://www.lightreading.com/smartphones-devices/eurobites-fairphone-opens-series-c-funding-round- mportance": 5, "wl": false, "topic": "도이체텔레콤 재무 기술 부문 임원 변경"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - Barron's", "summary": "배런스는 행동주의 펀드 엘리엇이 도이체텔레콤 지분을 확보하고 T-모바일 관련 합병 구상에 반대한다는 소식이 전해지면서 T-모바일 주가가 상승세를 보였다고 보도했다. 시장 투자자들은 이번 주주 행동주의가 향후 지배구조 개편과 M&A 전략에 미칠 파장에 주목하고 있다. 대형 통신사의 M&A 및 지배구조 이슈에 해당한다.", "source": "Barron's", "date": "2026-09-03 06:18", "url": "https://www.barrons.com/articles/t-mobile-stock-report-elliott-deutsche-telekom-merger-2880aac4", "category": "contract", "importance": 5, "wl": false, "topic": "t모바일 엘리엇의 도이체텔레콤 합병 반대 보도"}, {"title": "Elliott Builds Deutsche Telekom Stake, Opposes T-Mobile Merger - Bloomberg.com", "summary": "행동주의 펀드 엘리엇(Elliott)이 도이체텔레콤의 지분을 대거 매입하고, T-모바일과의 합병 추진에 반대 입장을 표명했다. 주요 주주의 개입으로 인해 도이체텔레콤과 자회사 간의 거버넌스 및 인수합병 전략에 중대한 변동이 생길 가능성이 제기된다. 주요 통신사의 지배구조와 M&A 구도를 흔드는 대형 이슈이다.", "source": "Bloomberg.com", "date": "2026-09-03 04:38", "url": "https://www.bloomberg.com/news/articles/2026-09-02/elliott-builds-deutsche-telekom-stake-opposes-t-mobile-merger", "category": "contract", "importance": 5, "wl": false, "topic": "도이체텔레콤 엘리엇 지분 매입 및 합병 반대"}, {"title": "Deutsche Telekom AG Announces Management Changes - marketscreener.com", "summary": "마켓스크리너는 도이체텔레콤 AG가 규제 공시를 통해 최고경영진 및 주요 임원진의 대대적인 변경 사항을 공식 발표했다고 전했다. 재무와 기술 부문을 아우르는 리더십 교체는 회사의 향후 투자 및 기술 전략 방향에 큰 영향을 미칠 전망이다. 통신사의 최고경영진 교체 및 조직 개편 공시다.", "source": "marketscreener.com", "date": "2026-09-03 00:43", "url": "https://www.marketscreener.com/news/deutsche-telekom-ag-announces-management-changes-ce7858d3d88afe2c", "category": "exec", "importance": 5, "wl": false, "topic": "도이체텔레콤 경영진 변경 공시"}, {"title": "Deutsche Telekom reshuffles top management including CFO role - Telecompaper", "summary": "텔레컴페이퍼는 도이체텔레콤이 CFO 교체를 포함하여 최고경영진 인사를 단행했다고 보도했다. 재무와 기술 등 핵심 요직의 리더십을 새롭게 구축함으로써 급변하는 통신 시장 환경에 대응하고 내부 역량을 재편하려는 조치이다. 주요 통신사의 최고경영진 교체 및 조직 개편이다.", "source": "Telecompaper", "date": "2026-09-02 22:21", "url": "https://www.telecompaper.com/news/deutsche-telekom-reshuffles-top-management-including-cfo-role--1581499", "category": "exec", "importance": 5, "wl": false, "topic": "도이체텔레콤 cfo 포함 경영진 개편"}, {"title": "Deutsche Telekom Names New CFO, CTO in Management Reshuffle - Bloomberg.com", "summary": "블룸버그는 도이체텔레콤이 대규모 경영진 리샤플을 단행하며 새로운 최고재무책임자(CFO)와 최고기술책임자(CTO)를 각각 임명했다고 보도했다. 기술 및 재무 수장의 동시 교체는 회사의 향후 네트워크 인프라 투자와 재무 정책에 결정적인 변화를 가져올 수 있다. 주요 통신사의 최고경영진 교체 및 핵심 임원 인사이다.", "source": "Bloomberg.com", "date": "2026-09-02 21:31", "url": "https://www.bloomberg.com/news/articles/2026-09-02/deutsche-telekom-names-new-cfo-cto-in-management-reshuffle", "category": "exec", "importance": 5, "wl": false, "topic": "도이체텔레콤 신임 cfo cto 선임"}, {"title": "Deutsche Telekom CFO Christian Illek To Leave Company In April 2027 - TradingView", "summary": "도이체텔레콤의 크리스티안 일렉(Christian Illek) 최고재무책임자(CFO)가 2027년 4월에 회사를 떠날 예정이라고 트레이딩뷰가 보도했다. 장기간 재무 수장을 맡아온 핵심 임원의 퇴임 예고는 향후 재무 전략 수립과 경영 승계 구도에 중요한 변화를 예고한다. 주요 통신사 최고경영진 교체 발표에 해당한다.", "source": "TradingView", "date": "2026-09-02 19:37", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_FWN44T17M:0-deutsche-telekom-cfo-christian-illek-to-leave-company-in-april-2027/", "category": "exec", "importance": 5, "wl": false, "topic": "도이체텔레콤 최고재무책임자 사임 예정"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "일본 KDDI가 6G 후보 대역인 7GHz 대역에서 세계 최고 수준인 3.6 Gbps 야외 전송을 달성했다. 차세대 이동통신 기술 실증에서 선도적인 성과를 거두었다.", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 5, "wl": false, "topic": "kddi 6g"}, {"title": "LG유플러스, 글로벌 AI 운영 관리 기업 어라이즈 AI와 손잡고 AI 에이전트 관리 체계 강화 - 주간현대", "summary": "LG유플러스는 글로벌 AI 운영 관리 기업 어라이즈 AI(Arize AI)와 손잡고 자사 인공지능 에이전트의 관리 체계를 대폭 강화한다고 밝혔다. 글로벌 선도 기술 도입을 통해 AI 서비스의 안정성과 신뢰성을 높인다. 통신사의 AI 기술 파트너십 및 역량 강화 전략이다.", "source": "주간현대", "date": "2026-09-03 12:05", "url": "http://hyundaenews.com/107487", "category": "contract", "importance": 4, "wl": false, "topic": "lg유플러스 어라이즈 ai 손잡고 ai 에이전트 관리 체계 강화"}, {"title": "정부 보안 AI 사업 탈락 SKT \"컨소시엄 참여기관과 협력 방안 논의\" - 아시아경제", "summary": "SK텔레콤은 정부의 보안 특화 인공지능(AI) 모델 사업자 선정에서 탈락한 후, 컨소시엄 참여 기관들과 향후 협력 방안을 논의 중이라고 밝혔다. 공공 및 보안 부문의 대형 AI 사업 수주전에서 고배를 마시며 향후 AI 전략 수정이 불가피해졌다. 주요 통신사의 정부 사업 수주 및 실주 관련 중요 소식이다.", "source": "아시아경제", "date": "2026-09-03 10:41", "url": "https://www.asiae.co.kr/article/2026090310415329495", "category": "contract", "importance": 4, "wl": false, "topic": "sk텔레콤 정부 보안 ai 사업 탈락"}, {"title": "한전, 삼전닉스에 '전기료 선납' 제안…첨단산업 전력망 투자재원 조달", "summary": "한국전력이 반도체 및 AI 데이터센터 확대로 급증하는 첨단산업 전력망 투자 재원을 조달하기 위해 삼성전자와 SK하이닉스 등 대규모 전력수요 기업에 '대규모 전기요금 선납제도'를 제안했다. 기업이 장래 전기요금을 미리 납부하고 한전은 이를 첨단산업 전력망 건설에 투입하는 방식이다. 한전의 재무 부담을 덜고 기업에는 안정적인 전력 인프라를 제공하기 위한 조치로, 국가 전력망 및 데이터센터 인프라 투자에 직접적인 영향을 미친다.", "source": "전자신문", "date": "2026-09-03 10:26", "url": "https://www.etnews.com/20260903000103", "category": "contract", "importance": 4, "wl": true, "topic": "한국전력 대규모 전기요금 선납제도"}, {"title": "LG·보안업계 뭉친 연합군 통했다…네이버, SKT 꺾고 `K-미토스` 개발 (종합) - 디지털데일리", "summary": "네이버를 중심으로 한 보안업계 연합군이 SK텔레콤 컨소시엄을 제치고 정부의 사이버 보안 AI 모델인 'K-미토스' 개발 사업자로 최종 낙점되었다. 치열한 공공 AI 수주전에서 네이버가 승리함에 따라 AI 시장의 판도에 변화가 예상된다. 통신사의 주요 정부 사업 수주 및 실주 결과이다.", "source": "디지털데일리", "date": "2026-09-03 10:16", "url": "https://www.ddaily.co.kr/page/view/2026090310122915637", "category": "contract", "importance": 4, "wl": false, "topic": "네이버 sk텔레콤 꺾고 k미토스 개발"}, {"title": "[속보] 정부, 보안 특화 AI모델 사업자로 네이버 선정 … SKT 탈락 - 뉴데일리", "summary": "정부의 보안 특화 인공지능 모델 개발 사업자로 네이버 컨소시엄이 최종 선정되었으며, SK텔레콤은 고배를 마셨다. 공공 부문 AI 주도권을 두고 벌어진 대형 수주전에서 네이버가 승기를 잡았다. 통신사의 주요 정부 AI 사업 수주 및 실주 결과이다.", "source": "뉴데일리", "date": "2026-09-03 09:43", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/03/2026090300066.html", "category": "contract", "importance": 4, "wl": false, "topic": "정부 보안 특화 ai모델 사업자 네이버 선정 skt 탈락"}, {"title": "'보안 독파모' 네이버클라우드 품으로…SKT \"AI 역량 계속 키운다\" - 파이낸셜뉴스", "summary": "정부 보안 AI 사업에서 네이버클라우드가 최종 사업자로 선정되자, 탈락한 SK텔레콤은 자체적인 AI 역량을 지속해서 키워나가겠다는 입장을 밝혔다. 공공 AI 수주전 결과에 따른 통신사의 향후 대응 전략을 다룬다. 통신사의 정부 사업 수주 및 실주 관련 후속 소식이다.", "source": "파이낸셜뉴스", "date": "2026-09-03 09:39", "url": "https://www.fnnews.com/news/202609030939274204", "category": "contract", "importance": 4, "wl": false, "topic": "보안 독파모 네이버클라우드 품으로 skt ai 역량 계속 키운다"}, {"title": "네이버클라우드, SKT 제치고 '사이버 보안 AI' 사업자 낙점 - 데일리안", "summary": "네이버클라우드가 SKT를 제치고 정부의 '사이버 보안 AI' 사업자로 최종 낙점되었다. 공공 보안 분야의 인공지능 모델 구축을 주도할 사업권을 획득하며 AI 기술력을 입증했다. 통신사의 주요 정부 AI 사업 수주 및 실주 결과이다.", "source": "데일리안", "date": "2026-09-03 09:25", "url": "https://www.dailian.co.kr/news/view/1685824/%EB%84%A4%EC%9D%B4%EB%B2%84%ED%81%B4%EB%9D%BC%EC%9A%B0%EB%93%9C-SKT-%EC%A0%9C%EC%B9%98%EA%B3%A0-%EC%82%AC%EC%9D%B4%EB%B2%84-2026", "category": "contract", "importance": 4, "wl": false, "topic": "네이버클라우드 skt 제치고 사이버 보안 ai 사업자 낙점"}, {"title": "CHTR Stock Pops As Spectrum, Cox, Liberty Deals Reshape Charter - timothysykes.com", "summary": "스펙트럼, 콕스, 리버티 등의 대형 딜과 인수합병 움직임이 차터 커뮤니케이션스의 주가 상승과 사업 구조 재편을 이끌고 있다.", "source": "timothysykes.com", "date": "2026-09-03 05:47", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02-2/", "category": "contract", "importance": 4, "wl": false, "topic": "차터 m&a"}, {"title": "New star in comms firmament – Softbank positions HAPS between terrestrial and satellite", "summary": "소프트뱅크가 지상 통신망과 위성 통신의 간극을 메우기 위해 성층권 통신 플랫폼인 HAPS(고고도 플랫폼 정거장)를 적극 포지셔닝하고 있다. 최근 HAPS 시험을 통해 성층권이 단순 음영 지역 해소를 넘어 광역 셀룰러, 프라이빗 네트워크, 드론, 엣지 컴퓨팅을 통합하는 인프라로 도약할 가능성을 제시했다. 소프트뱅크의 차세대 비정지궤도(Non-Terrestrial Network) 및 통신 커버리지 확장 전략의 핵심 축으로 평가된다.", "source": "RCR Wireless", "date": "2026-09-03 01:08", "url": "https://rcrwireless.com/20260902/network-infrastructure/softbank-positions-haps-between-terrestrial-and-satellite", "category": "tech", "importance": 4, "wl": true, "topic": "소프트뱅크 haps 전략"}, {"title": "DT hires AWS's Jan Hofmeyr as CTO", "summary": "도이체텔레콤이 오는 2026년 11월 AWS 임원인 <script>
const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};
const SEC_NAME={competitor:"경쟁사",carrier:"통신사",satellite:"위성",policy:"정책·규제",outage:"Outage"};
const TABS=[
  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성",       secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 회사명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
