<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}

  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}

  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}

  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>

 "category": "outage", "importance": 3, "wl": false, "topic": ""}, {"title": "\"먹통 없는 재난 대응\" 정부·이통3사, 상용망 기반 소방 통신 개선", "summary": "적용 대상은 소방청의 공공 업무에 사용하는 휴대전화, 태블릿PC, 사물인터넷(IoT) 장비 등 법인 명의 무선... KT는 소방청 행정망에 기업전용 5G SA(Standalone)를 도입했다. 5G SA는 기존 LTE망과 연동하는 비단독모드(NSA)와...", "source": "itdaily.kr", "date": "2026-09-07 17:46", "url": "https://www.itdaily.kr/news/articleView.html?idxno=241454", "category": "outage", "importance": 3, "wl": false, "topic": ""}, {"title": "AT&T service disruptions affect thousands in Dallas-Fort Worth area - SSBCrack", "summary": "", "source": "SSBCrack", "date": "2026-09-08 10:43", "url": "https://news.ssbcrack.com/att-service-disruptions-affect-thousands-in-dallas-fort-worth-area/", "category": "outage", "importance": 2, "wl": false, "topic": ""}], "satellite": [{"title": "Europe's four telecom giants form alliance to challenge Starlink - 헤럴드경제", "summary": "유럽의 4대 통신 거물이 일론 머스크의 스타링크에 대항하기 위해 동맹을 결성했다. 위성통신 및 우주 기반 모바일 서비스 시장에서 공동 전선을 구축하여 주도권을 잡겠다는 전략이다. 글로벌 위성통신 시장의 구도를 흔드는 대형 딜이다.", "source": "헤럴드경제", "date": "2026-09-08 11:23", "url": "https://mbiz.heraldcorp.com/article/10866214", "category": "contract", "importance": 5, "wl": false, "topic": "유럽통신사 위성컨소시엄"}, {"title": "DCC approves satellite spectrum pricing for Jio, Starlink, OneWeb - The Economic Times", "summary": "인도 디지털통신위원회(DCC)가 지오, 스타링크, 원웹 등을 위한 위성 주파수 가격 정책을 승인했다. 급성장하는 인도 위성통신 시장의 규제 기틀이 마련되고 있다.", "source": "The Economic Times", "date": "2026-09-09 04:04", "url": "https://m.economictimes.com/industry/telecom/telecom-news/dcc-approves-satellite-spectrum-pricing-for-jio-starlink-oneweb/articleshow/133939185.cms", "category": "policy", "importance": 4, "wl": false, "topic": "인도 위성 스펙트럼"}, {"title": "EU telcos close ranks against Starlink in bid for satellite spectrum – report", "summary": "도이치텔레콤, 오렌지, 텔레포니카, 보다폰 등 유럽 주요 통신사들이 스타링크의 위성 통신 공세에 대응하기 위해 컨소시엄 결성을 추진 중이다. 이들은 유럽연합(EU)의 모바일 위성 주파수(D2D) 입찰에 공동 참여하기 위해 협상을 벌이고 있다. 위성통신과 지상망의 융합 서비스 시장에서 미국 스페이스X 등 글로벌 사업자에 맞 WEI Mate XT 2'를 발표했다. 양산화와 시장 진입에 성공하며 독창적인 폼팩터 기술력을 과시했다. 프리미엄 스마트폰 시장에서 화웨이의 공격적인 행보를 보여주는 상징적 모델이다.", "source": "ITmedia Mobile", "date": "2026-09-08 00:16", "url": "https://www.itmedia.co.jp/mobile/articles/2609/08/news049.html", "category": "tech", "importance": 4, "wl": true, "topic": "화웨이 메이트 xt 2 발표"}, {"title": "LG전자, '화웨이서 분사' 아너에 미국 특허 15건 양도", "summary": "LG전자가 화웨이에서 분사한 중국 아너에 미국 영상 표준특허(SEP) 15건을 양도했다. LG전자는 사업 목적에 특허 라이선스업을 추가한 이후 특허 수익화 사례를 지속적으로 늘려가고 있다. 글로벌 기업 간의 지식재산권 거래와 특허 포트폴리오 재편의 일환이다.", "source": "ZDNet Korea", "date": "2026-09-09 01:53", "url": "https://zdnet.co.kr/view/?no=20260909014245", "category": "contract", "importance": 3, "wl": true, "topic": "lg전자 아너 특허 양도"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - SDxCentral", "summary": "라쿠텐 심포니의 클라우드 RAN 기술이 타왈(Tawal)의 다중 통신사 실내 네트워크 인프라에 성공적으로 적용됐다. 클라우드 기반 가상화 장비의 성능을 입증하며 중동 지역 실내 무선망 구축을 지원한다. 오픈랜 생태계 확장을 위한 중요한 수주 및 실증 성과다.", "source": "SDxCentral", "date": "2026-09-09 01:28", "url": "https://www.sdxcentral.com/news/rakuten-symphony-cloud-ran-tech-powers-tawals-multi-operator-indoor-network/", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐심포니 타왈"}, {"title": "AI agents raise new control questions for telecom networks - Fierce Network", "summary": "통신망에서 AI 에이전트의 도입이 증가함에 따라 통신 네트워크 관리와 제어에 새로운 과제와 혁신 방향이 제기되고 있다. 에릭슨 등 글로벌 장비사들은 AI 기반의 자율 네트워크 제어 및 자동화 기술 고도화에 주력하고 있다. 통신사들의 운영 효율성 제고와 네트워크 아키텍처 변화를 이끌 핵심 기술로 평가받는다.", "source": "Fierce Network", "date": "2026-09-09 01:21", "url": "https://www.fiercewireless.com/cloud/ai-agents-raise-new-control-questions-telecom-networks", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 ai 에이전트"}, {"title": "Nokia’s AI-RAN pitch gets reality check in new study - Fierce Network", "summary": "노키아가 추진하고 있는 AI-RAN 전략과 비전에 대한 새로운 연구 결과와 현실적인 평가가 제기되었다. 무선 접속망에 인공지능을 결합하는 기술의 상용화 과정에서 직면한 과제들이 분석됐다. 차세대 통신망 구축을 위한 기술적 타당성과 시장 수용성이 주요 화두로 떠올랐다.", "source": "Fierce Network", "date": "2026-09-09 01:01", "url": "https://www.fiercewireless.com/wireless/nokias-ai-ran-pitch-gets-reality-check-new-study", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai-ran"}, {"title": "Ericsson says telco-grade AI RAN must deliver measurable gains at scale", "summary": "에릭슨의 전략적 RAN 리더십 책임자인 가브리엘 포글란데는 RCR테크 텔코 AI 포럼에서 텔코 등급의 AI RAN이 대규모 환경에서 측정 가능한 성능 향상을 제공해야 한다고 강조했다. AI를 무선 접속망(RAN) 전반에 내장하여 네트워크 효율성을 극대화하려는 에릭슨의 기술 비전을 담고 있다. 통신장비 업계의 차세대 핵심 화두로 떠오른 AI-RAN 상용화 전략을 대변한다.", "source": "RCR Wireless", "date": "2026-09-09 00:44", "url": "https://rcrwireless.com/20260908/carriers/ericsson-ai-ran", "category": "tech", "importance": 3, "wl": true, "topic": "에릭슨 ai ran"}, {"title": "Nokia launches industry-first initiative to help operators accelerate network innovation -", "summary": "노키아가 통신사들의 네트워크 혁신 가속화를 돕기 위한 업계 최초의 주도적 프로그램을 런칭했다. 최신 통신 기술과 소프트웨어를 실제 환경에서 테스트할 수 있는 기회를 제공한다. 통신 산업 전반의 디지털 전환과 인프라 고도화를 선도하려는 전략이다.", "source": "بوابة التكنولوجيا المالية", "date": "2026-09-08 23:55", "url": "https://fintechgate.net/251229", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 네트워크 혁신"}, {"title": "Softbank, Nokia demo passive optical network smorgasbord - SDxCentral", "summary": "노키아와 소프트뱅크가 패시브 광 네트워크(PON) 기술을 활용한 다양한 시연을 성공적으로 마쳤다. 양사는 최신 광대역 통신 솔루션의 성능을 입증하며 긴밀한 기술 협력 관계를 과시했다. 고도화된 통신 인프라 구축을 위한 장비 공급 및 검증이 원활히 진행 중이다.", "source": "SDxCentral", "date": "2026-09-08 23:07", "url": "https://www.sdxcentral.com/news/softbank-nokia-demo-passive-optical-network-passive-optical-smorgasbord/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 소프트뱅크"}, {"title": "화웨이 , 美서 '이란 제재 위반·기술탈취' 형사재판…8년 만에 법정으로", "summary": "중국 통신장비 업체 화웨이 가 북한·이란을 상대로 한 미국의 제재를 위반하고 미 기업 영업 비밀을 빼돌렸다는 등의 혐의로 미국에서 형사재판을 받는다. 지난 2018년 멍완저우 화웨이 최고재무책임자(CFO) 체포로 미중...", "source": "news1.kr", "date": "2026-09-08 22:06", "url": "https://www.news1.kr/world/usa-canada/6284181", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "Airties debuts agentic AI plug-in for Airties Home suite - Telecompaper", "summary": "에어타이스가 자사 홈 스위트 솔루션을 위한 에이전틱 AI 플러그인을 새롭게 선보였다. 홈 네트워크 관리와 사용자 경험을 향상시키기 위한 지능형 소프트웨어 기능이 강화됐다. 통신 서비스 제공업체들에게 차별화된 가정을 위한 솔루션을 제공한다.", "source": "Telecompaper", "date": "2026-09-08 21:43", "url": "https://www.telecompaper.com/news/airties-debuts-agentic-ai-plug-in-for-airties-home-suite--1582032", "category": "tech", "importance": 3, "wl": false, "topic": "에어타이스 ai 플러그인"}, {"title": "Viva picks Rakuten Symphony to upgrade 200 mobile sites in Bolivia - Telecompaper", "summary": "통신사 비바(Viva)가 볼리비아 내 200여 개 모바일 기지국 업그레이드를 위해 라쿠텐 심포니의 장비와 솔루션을 채택했다. 라쿠텐의 클라우드 기반 네트워크 기술력을 바탕으로 망 현대화 작업을 추진한다. 라쿠텐 심포니의 중남미 시장 진지 구축을 보여주는 사례다.", "source": "Telecompaper", "date": "2026-09-08 21:42", "url": "https://www.telecompaper.com/news/viva-picks-rakuten-symphony-to-upgrade-200-mobile-sites-in-bolivia--1582056", "category": "contract", "importance": 3, "wl": false, "topic": "비바 라쿠텐심포니"}, {"title": "TDC Net monitors butterflies in heathland conservation project with help from Ericsson - T", "summary": "덴마크 통신사 TDC넷이 에릭슨의 5G 네트워크 기술과 AI 솔루션을 활용하여 황무지 생태계 보존 및 나비 모니터링 프로젝트를 진행했다. 통신 인프라가 환경 보호 및 지속 가능성 연구에 어떻게 기여하는지 보여주는 대표적 협력 사례다. 에릭슨은 네트워크 장비 공급을 넘어 친환경 가치 창출을 지원하고 있다.", "source": "Telecompaper", "date": "2026-09-08 21:26", "url": "https://www.telecompaper.com/news/tdc-net-monitors-butterflies-in-heathland-conservation-project-with-help-from-ericsson--1582052", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 덴마크 네트워크"}, {"title": "Eurobites: Nokia launches mobile core testing program", "summary": "노키아가 새로운 모바일 코어 테스트 프로그램을 출시했다. 통신 장비 시장에서 네트워크 소프트웨어의 품질과 안정성을 검증하기 위한 프로그램으로, 통신사들의 클라우드 기반 코어 네트워크 전환 수요를 겨냥하고 있다. GSMA의 6GHz 주파수 로비 등 유럽 지역의 통신 인프라 동향과 맞물려 있다.", "source": "Light Reading", "date": "2026-09-08 20:01", "url": "https://www.lightreading.com/mobile-core/eurobites-nokia-launches-mobile-core-testing-program", "category": "tech", "importance": 3, "wl": true, "topic": "노키아 모바일 코어"}, {"title": "Nokia Takes the Guesswork Out of AI-Era Networks With New Live Testing Hub - TradingView", "summary": "노키아가 AI 시대의 네트워크 구축 불확실성을 해소하기 위해 새로운 라이브 테스트 허브를 개소했다. 통신 사업자들이 최신 네트워크 솔루션과 소프트웨어를 실제 환경과사전 테스트할 수 있도록 지원한다. 이를 통해 상용화 전 기술 검증 기간을 단축하고 성능을 최적화할 수 있다.", "source": "TradingView", "date": "2026-09-08 18:53", "url": "https://www.tradingview.com/news/benzinga:0fd48f601094b:0-nokia-takes-the-guesswork-out-of-ai-era-networks-with-new-live-testing-hub/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 라이브 테스트"}, {"title": "Nokia and BeeHealthy: Simplifying Digital Healthcare Access - Healthcare Digital", "summary": "노키아가 비헬시(BeeHealthy)와의 협력을 통해 디지털 헬스케어 접근성을 단순화하고 개선하는 솔루션을 선보였다. 통신 인프라와 헬스케어 플랫폼을 연계하여 의료 서비스 혁신을 도모하고 있다. 통신 기술의 응용 범위를 의료 분야까지 다각화하는 전략의 일환이다.", "source": "Healthcare Digital", "date": "2026-09-08 18:53", "url": "https://healthcare-digital.com/news/nokia-and-beehealthy-simplifying-digital-healthcare-access", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 디지털헬스케어"}, {"title": "Nokia launches mobile core demo environment to help carriers try out emerging software fea", "summary": "노키아가 통신사들이 신흥 소프트웨어 기능을 직접 체험해 볼 수 있도록 모바일 코어 데모 환경을 구축했다. 통신사들이 복잡한 네트워크 업그레이드 전에 성능을 사전에 검증할 수 있는 환경을 제공한다. 장비 공급업체와 통신사 간의 기술 협력이 가속화될 것으로 기대된다.", "source": "Telecompaper", "date": "2026-09-08 18:00", "url": "https://www.telecompaper.com/news/nokia-launches-mobile-core-demo-environment-to-help-carriers-try-out-emerging-software-features--1582022", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 데모 환경"}, {"title": "Nokia opens Riyadh R&D centre to advance AI-powered network automation and support Saudi V", "summary": "노키아가 리야드 R&D 센터 개소를 통해 AI 기반 네트워크 자동화 기술을 발전시키고 사우디 비전 정책을 적극 지원하겠다고 밝혔다. 중동 통신 시장에서의 입지를 공고히 하고 현지 파트너들과의 협력을 확대한다. 장기적인 성장 기반을 다지는 전략적 거점 확보로 평가된다.", "source": "Computer Weekly", "date": "2026-09-08 18:00", "url": "https://www.computerweekly.com/news/366649491/Nokia-opens-Riyadh-RD-centre-to-advance-AI-powered-network-automation-and-support-Saudi-Vision-2030", "category": "exec", "importance": 3, "wl": false, "topic": "노키아 연구개발센터"}, {"title": "Hitachi to sell Nokia drones for automated inspections | The Asahi Shimbun: Breaking News,", "summary": "히타치가 자동화된 검사 업무를 위해 노키아의 드론 솔루션을 판매하기로 협력했다. 통신 장비와 첨단 드론 기술의 결합을 통해 산업용 인프라 점검의 효율성을 극대화한다. 노키아의 기술 영역이 다양한 산업 자동화 분야로 다변화되고 있음을 보여준다.", "source": "朝日新聞", "date": "2026-09-08 17:54", "url": "https://www.asahi.com/ajw/articles/16871733", "category": "tech", "importance": 3, "wl": false, "topic": "히타치 노키아 드론"}, {"title": "Nokia Launches Mobile Core Early Access for Telecom Sector - marketscreener.com", "summary": "노키아가 통신 섹터를 겨냥한 모바일 코어 얼리 액세스 프로그램을 선보이며 장비 시장 공략을 강화하고 있다. 급변하는 통신 환경 속에서 사업자들이 신기술을 도입하는 장벽을 낮추는 데 초점을 맞추었다. 글로벌 경쟁사들과의 기술 서비스 경쟁이 한층 치열해질 것으로 보인다.", "source": "marketscreener.com", "date": "2026-09-08 17:51", "url": "https://www.marketscreener.com/news/nokia-launches-mobile-core-early-access-for-telecom-sector-ce785bd8da8bf624", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 통신 섹터"}, {"title": "Nokia opens a first-of-its-kind live network test program - Stock Titan", "summary": "노키아가 업계 최초로 라이브 네트워크 테스트 프로그램을 공식 오픈하며 글로벌 통신사들의 참여를 독려하고 있다. 차세대 통신 장비와 코어 네트워크 기능을 실제 운영 환경에서 평가할 수 있는 기회를 제공한다. 글로벌 통신 시장에서 기술 주도권을 잡기 위한 행보로 풀이된다.", "source": "Stock Titan", "date": "2026-09-08 17:09", "url": "https://www.stocktitan.net/news/NOK/nokia-launches-industry-first-initiative-to-help-operators-i1mb7w8r1ju8.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 네트워크 테스트"}, {"title": "Nokia Opens Mobile Core Early Access Globally as Operators Prepare for AI-Native 5G Networ", "summary": "노키아가 오퍼레이터들의 AI 네이티브 5G 네트워크 전환 준비를 지원하기 위해 글로벌 모바일 코어 얼리 액세스 프로그램을 오픈했다. 인공지능 기반의 차세대 네트워크 운영 체계를 선점하려는 전략이다. 글로벌 통신 장비 시장에서 경쟁 우위를 확보하기 위한 핵심 솔루션으로 작용할 것이다.", "source": "TelecomLead", "date": "2026-09-08 17:06", "url": "https://telecomlead.com/telecom-equipment/nokia-opens-mobile-core-early-access-globally-as-operators-prepare-for-ai-native-5g-networks-127642", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai 네이티브"}, {"title": "Nokia Opens Mobile Core Early Access Programme to Global Telecom Industry - TechAfrica New", "summary": "노키아가 글로벌 통신 산업을 대상으로 모바일 코어 얼리 액세스 프로그램을 전격 개방했다. 통신사들은 해당 프로그램을 통해 최신 코어 네트워크 기능을 미리 경험하고 평가할 수 있다. AI 시대에 발맞춘 네트워크 혁신을 추진하는 통신사들에게 유용한 테스트베드가 될 전망이다.", "source": "TechAfrica News", "date": "2026-09-08 16:50", "url": "https://techafricanews.com/2026/09/08/nokia-mobile-core-early-access-global-telecom-industry/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 얼리 액세스"}, {"title": "Nokia plans sweeping Bell Labs cuts to alarm of ex-president", "summary": "노키아가 유명 연구 조직인 벨연구소에 대한 대규모 구조조정을 추진하면서 전직 수장 마커스 웰든 등으로부터 강한 비판을 받고 있다. 비용 절감과 수익성 개선을 위한 경영진의 결정이 핵심 연구 역량 약화로 이어질 수 있다는 우려가 제기된다. 글로벌 통신장비 업계의 수익성 악화와 이에 대응하는 구조조정 트렌드를 보여준다.", "source": "Light Reading", "date": "2026-09-08 16:30", "url": "https://www.lightreading.com/business-transformation/nokia-plans-sweeping-bell-labs-cuts-to-alarm-of-ex-president", "category": "exec", "importance": 3, "wl": true, "topic": "노키아 벨연구소 구조조정"}, {"title": "1&1 Versatel deploys Ekinops customer premises equipment - Telecompaper", "summary": "1&1 페르사텔이 에키놉스(Ekinops)의 고객 구내 장비(CPE)를 배치했다. 통신 사업자의 네트워크 인프라 구축 및 장비 도입 사례이다. 통신장비 시장의 납품 동향을 보여준다.", "source": "Telecompaper", "date": "2026-09-08 16:21", "url": "https://www.telecompaper.com/news/11-versatel-deploys-ekinops-customer-premises-equipment--1581993", "category": "contract", "importance": 3, "wl": false, "topic": "에키놉스 장비공급"}], "policy": [{"title": "India Plans Phased Removal of Chinese Equipment from Telecommunications Networks - Zamin.u", "summary": "인도 정부가 국가 안보 강화를 위해 자국 통신망에서 중국산 통신 장비를 단계적으로 철수하고 완전히 제거하는 계획을 본격 추진한다. 화웨이와 ZTE 등 중국 업체의 입지가 원천 차단되면서 글로벌 장비 시장의 판도 재편이 가속화될 전망이다. 삼성전자 등 비중국계 글로벌 장비사들에게 새로운 수주 기회로 작용할 것으로 기대된다.", "source": "Zamin.uz", "date": "2026-09-07 15:22", "url": "https://zamin.uz/en/technolo kyivstar-completes-migration-of-3g-users-to-4g-refarms-spectrum.html", "category": "tech", "importance": 3, "wl": false, "topic": "키이스타르 4g 마이그레이션"}, {"title": "[AT 현장]KT의 ‘97만㎞ 통신망’ 길 위에서 일상의 순간이 흐른다 - asiatime.co.kr", "summary": "KT의 97만 km에 달하는 광대역 통신망 현장을 조명하며 일상의 연결을 지탱하는 인프라의 중요성을 강조했다. 대규모 유선 인프라 관리 현황이다.", "source": "asiatime.co.kr", "date": "2026-09-08 14:35", "url": "https://www.asiatime.co.kr/article/20260908500243", "category": "tech", "importance": 3, "wl": false, "topic": "kt 통신망현장"}, {"title": "KT, 로봇 데이터 관리 ‘통합 엣지AI 플랫폼’ 구현 나서 - aitimes.com", "summary": "KT가 로봇 데이터 관리를 위한 '통합 엣지 AI 플랫폼' 구현에 나선다. AI와 네트워크 인프라를 결합하여 지능형 로봇 제어 환경을 구축하려는 시도이다. B2B 신사업 영역의 기술 확장을 보여준다.", "source": "aitimes.com", "date": "2026-09-08 14:32", "url": "https://www.aitimes.com/news/articleView.html?idxno=214986", "category": "tech", "importance": 3, "wl": false, "topic": "kt 엣지ai플랫폼"}, {"title": "Jio reshapes Gujarat’s wireless market - Ahmedabad Mirror", "summary": "릴라이언스 지오가 구자라트 지역의 무선 통신 시장 재편을 주도하고 있다. 대규모 가입자 기반을 바탕으로 지역 시장 내 지배력을 확대하는 중이다. 통신사의 시장 점유율 변화를 보여주는 동향이다.", "source": "Ahmedabad Mirror", "date": "2026-09-08 13:54", "url": "https://www.ahmedabadmirror.com/jio-reshapes-gujarats-wireless-market/81921355.html", "category": "other", "importance": 3, "wl": false, "topic": "릴라이언스지오 무선시장"}, {"title": "Jio Satellite Broadband Plan: India’s 1,600-Satellite Network - urbanacres.in", "summary": "", "source": "urbanacres.in", "date": "2026-09-08 12:29", "url": "https://urbanacres.in/jio-satellite-broadband-plan-tests-indias-digital-infrastructure/", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "朝ラッシュ時の山手線、4キャリアの5G速度や「5G+」表示比率は？ ICT総研が調査（2026年9月）", "summary": "ICT총연구소가 발표한 아침 러시 아워 야마노테선 5G 통신 속도 실측 조사 결과, 도코모, au, 소프트뱅크의 하향 속도가 180Mbps대로 팽팽한 경쟁을 벌였다. 특히 소프트뱅크의 평균 통신 속도가 향상된 것으로 나타났다. 주요 통신사들의 망 품질 개선 노력과 서비스 경쟁력을 보여준다.", "source": "ITmedia Mobile", "date": "2026-09-08 12:21", "url": "https://www.itmedia.co.jp/mobile/articles/2609/08/news062.html", "category": "tech", "importance": 3, "wl": true, "topic": "ict총연구 5g 실측"}, {"title": "Vodafone named Romania's fastest and best 5G network by Ookla in H1 - Telecompaper", "summary": "오클라(Ookla) 평가 결과 상반기 루마니아에서보다폰이 가장 빠르고 우수한 5G 네트워크로 선정되었다. 통신사의 인프라 품질과 경쟁력을 입증하는 지표이다. 소비자 만족도 제고에 기여한다.", "source": "Telecompaper", "date": "2026-09-08 11:59", "url": "https://www.telecompaper.com/news/vodafone-named-romanias-fastest-and-best-5g-network-by-ookla-in-h1--1581954", "category": "other", "importance": 3, "wl": false, "topic": "보다폰 5g품질평가"}, {"title": "[단독]'퀸잇' 라포랩스, '홈쇼핑 전문가' 박승표 전 KT알파 대표 영입 - 전자신문", "summary": "패션 플랫폼 퀸잇을 운영하는 라포랩스가 홈쇼핑 전문가인 박승표 전 KT알파 대표를 영입했다. 통신 계열사 출신 임원의 이력 이동을 보여준다.", "source": "전자신문", "date": "2026-09-08 11:20", "url": "https://www.etnews.com/20260908000110", "category": "exec", "importance": 3, "wl": false, "topic": "kt알파 임원영입"}, {"title": "Jio Platforms plans to kick off investor outreach for its IPO next week - Business Standar", "summary": "지오 플랫폼이 다음 주부터 기업공개(IPO)를 위한 투자자 대상 설명회(Outreach)에 돌입할 예정이다. 대규모 자본 조달 행보다.", "source": "Business Standard", "date": "2026-09-08 11:04", "url": "https://www.business-standard.com/markets/ipo/jio-platforms-plans-to-kick-off-investor-outreach-for-its-ipo-next-week-126090800084_1.html", "category": "other", "importance": 3, "wl": false, "topic": "지오플랫폼 ipo"}, {"title": "Supreme Court dismisses ₹363 crore GST demand against Vodafone Idea on tower business sale", "summary": "인도 대법원이 타워 사업 매각과 관련된 보다폰 아이디어에 대한 363억 루피 규모의 GST(상품서비스세) 부과 요구를 기각했다. 아울러 존재하지 않는 법인에 대한 절차 진행 방식에 대해 정부를 질타했다. 통신 규제 및 세무 관련 불확실성을 해소하는 판결이다.", "source": "ET Telecom", "date": "2026-09-08 10:47", "url": "https://telecom.economictimes.indiatimes.com/news/industry/supreme-court-dismisses-363-crore-gst-demand-against-vodafone-idea-on-tower-business-sale/133903142", "category": "policy", "importance": 3, "wl": true, "topic": "인도 대법원 보다폰아이디어"}, {"title": "[김재섭의 뒤집어보기] 6G 상용화 일정 갈수록 안갯속, KT '통신본업 충실' 앞세운 박윤영 깃발 먼저 꽂을까 - 비즈니스포스트", "summary": "6G 상용화 일정이 안갯속인 가운데 KT가 통신 본업에 충실하겠다는 전략을 앞세워 차별화된 행보를 보이고 있다. 박윤영 전 사장의 기조를 이어받아 내실을 다지는 KT의 통신 전략이 시장에서 주목받고 있다. 향후 국내 통신사들의 네트워크 투자 방향에 영향을 미칠 전망이다.", "source": "비즈니스포스트", "date": "2026-09-08 10:07", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=446621", "category": "tech", "importance": 3, "wl": false, "topic": "kt 6g 상용화"}, {"title": "ソフトバンクのネットワーク運用変革 独自開発した“通信業界向けAI”を本格活用 - ビジネスネットワーク", "summary": "소프트뱅크가 자체 개발한 통신 업계 특화 AI를 네트워크 운용에 본격적으로 활용한다. AI 기반 자율 운영을 통해 네트워크 효율성을 극대화하려는 전략이다.", "source": "ビジネスネットワーク", "date": "2026-09-08 07:01", "url": "https://businessnetwork.jp/article/35813/", "category": "other", "importance": 3, "wl": false, "topic": "소프트뱅크 ai"}, {"title": "Deutsche Telekom : Diversity in the network, simplicity for the customer - marketscreener.", "summary": "도이치텔레콤이 네트워크의 다양성 확보와 고객 편의성을 높이기 위한 전략을 추진하고 있다. 인프라 혁신과 고객 경험 개선을 목표로 한다. 통신사 경영 방침의 방향성을 보여준다.", "source": "marketscreener.com", "date": "2026-09-08 03:09", "url": "https://www.marketscreener.com/news/deutsche-telekom-diversity-in-the-network-simplicity-for-the-customer-ce785bdbd081f421", "category": "tech", "importance": 3, "wl": false, "topic": "도이치텔레콤 네트워크전략"}, {"title": "Telstra Launches 5G Network Slicing For Microsoft Teams Video Calls - Brand Spur", "summary": "텔스트라가 마이크로소프트 팀즈 화상 통화를 위해 5G 네트워크 슬라이싱 서비스를 출시했다. 기업용 협업 툴의 품질을 보장하기 위한 맞춤형 네트워크 기술 적용이다. 5G 상용화의 실효성을 높이는 사례이다.", "source": "Brand Spur", "date": "2026-09-08 00:15", "url": "https://brandspurng.com/2026/09/07/telstra-launches-5g-network-slicing-for-microsoft-teams-video-calls/?amp", "category": "tech", "importance": 3, "wl": false, "topic": "텔스트라 5g네트워크슬라이싱"}, {"title": "SIMBA redefines Singapore’s Home Broadband Landscape with first-in-market WiFi 7 Integrate", "summary": "싱가포르의 통신사 SIMBA가 시장 최초로 와이파이 7이 통합된 홈 브로드밴드 서비스를 출시하며 유선 네트워크 경쟁력을 재정의했다. 초고속 무선 및 유선 결합 상품을 통해 가입자 유치에 적극 나서고 있다. 싱가포르 가정용 통신 시장의 기술 표준을 높이는 계기가 될 것이다.", "source": "The Independent Singapore News", "date": "2026-09-07 22:32", "url": "https://theindependent.sg/simba-redefines-singapore-s-home-broadband-landscape-with-first-in-market-wifi-7-integrated-onr/", "category": "tech", "importance": 3, "wl": false, "topic": "simba 와이파이"}, {"title": "Telecom Egypt, PSL to develop Sharm El-Sheikh-Taba subsea cable - Connecting Africa", "summary": "통신 이집트(Telecom Egypt)와 PSL이 샤름 엘셰이크와 타바를 연결하는 새로운 해저 케이블 건설 프로젝트를 추진한다. 양국 간 통신 트래픽 수용 능력을 확대하고 중동 지역의 네트워크 연결성을 대폭 강화하기 위한 인프라 투자다. 지역 내 안정적인 데이터 전송의 핵심 축이 될 전망이다.", "source": "Connecting Africa", "date": "2026-09-07 21:36", "url": "https://www.connectingafrica.com/connectivity/telecom-egypt-psl-to-develop-sharm-el-sheikh-taba-subsea-cable", "category": "contract", "importance": 3, "wl": false, "topic": "통신이집트 해저케이블"}, {"title": "Vodafone Turkey triples budget for joint data centre project - telcotitans.com", "summary": "보다폰 터키가 공동 데이터센터 프로젝트를 위해 예산을 3배로 증액했다. 인프라 투자를 확대하여 데이터 처리 능력을 강화하려는 조치이다. 클라우드 및 데이터센터 역량 확충에 해당한다.", "source": "telcotitans.com", "date": "2026-09-07 21:15", "url": "https://www.telcotitans.com/vodafonewatch/vodafone-turkey-triples-budget-for-joint-data-centre-project/10848.article", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰터키 데이터센터"}, {"title": "ASC cable break disrupts key Australia-Singapore route", "summary": "보커스의 호주-싱가포르 케이블(ASC)이 인도네시아 해역에서 케이블 단절 사고를 일으켜 인터넷 트래픽이 대체 경로로 우회됐다. 주요 해저 케이블 인프라의 물리적 손상으로 인한 네트워크 불안정이 발생했으나 우회 경로를 통해 긴급 복구가 진행되었다. 국제 데이터 트래픽의 안정성에 해저 케이블 보안이 핵심임을 보여준다.", "source": "Light Reading", "date": "2026-09-07 21:05", "url": "https://www.lightreading.com/cable-technology/asc-cable-break-disrupts-key-australia-singapore-route", "category": "outage", "importance": 3, "wl": true, "topic": "아스카 케이블 단절"}, {"title": "Vodafone launches Quality on Demand API in Germany - Telecoms", "summary": "보다폰이 독일에서 고품질 네트워크 연결을 보장하는 '품질 온 수요(Quality on Demand) API'를 출시했다. 개발자와 기업 고객을 위한 맞춤형 네트워크 기능 개방이다. 통신사의 서비스 다변화 전략이다.", "source": "Telecoms", "date": "2026-09-07 19:16", "url": "https://www.telecoms.co e": "Digital Communications Commission approves TRAI recommendations on Satcom Spectrum - PGuru", "summary": "디지털통신위원회(DCC)가 위성통신(Satcom) 주파수에 대한 TRAI의 권고안을 최종 승인했습니다. 인도 내 위성통신 상용화를 위한 규제적 기반이 마련되었습니다. 위성 사업자들의 시장 진입이 가속화될 전망입니다. 통신 규제 환경의 큰 변화입니다.", "source": "PGurus", "date": "2026-09-09 00:33", "url": "https://www.pgurus.com/digital-communications-commission-approves-trai-recommendations-on-satcom-spectrum/", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도위성통신 정책"}, {"title": "China’s Huawei Technologies faces racketeering trial in New York - Boston Herald", "summary": "중국 화웨이 테크놀로지가 미국 뉴욕 법원에서 조직범죄 혐의 관련 재판을 앞두고 있습니다. 미·중 기술 패권 갈등 속에서 화웨이의 법적 리스크가 심화되는 국면을 다룹니다.", "source": "Boston Herald", "date": "2026-09-09 00:28", "url": "https://www.bostonherald.com/2026/09/08/huawei-racketeering-trial/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 뉴욕 공판"}, {"title": "Verizon, Corning ink fibre supply deal - Mobile World Live", "summary": "버라이즌(Verizon)과 코닝(Corning)이 차세대 초고속 인터넷망 구축과 AI 트래픽 수용을 위한 광섬유 장기 공급 계약을 공식 체결했습니다.", "source": "Mobile World Live", "date": "2026-09-09 00:13", "url": "https://www.mobileworldlive.com/verizon/verizon-corning-ink-fibre-supply-deal/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광섬유 공급"}, {"title": "EU telcos close ranks against Starlink in bid for satellite spectrum – report", "summary": "도이치텔레콤, 오렌지, 텔레포니카, 보다폰 등 유럽 주요 통신사들이 위성 직접통신(D2D)을 위한 EU 모바일 위성 주파수 입찰에 공동 참여하기 위해 컨소시엄 결성을 추진하고 있다. 스페이스X의 스타링크 등 위성통신 공세에 대응해 유럽 통신사들이 연합 전선을 구축하는 양상이다. 유럽 시장 내 위성통신 경쟁 구도에 큰 변화를 줄 것으로 전망된다.", "source": "Light Reading", "date": "2026-09-09 00:04", "url": "https://www.lightreading.com/satellite/eu-telcos-close-ranks-against-starlink-in-joint-bid-for-satellite-spectrum-report", "category": "contract", "importance": 4, "sid": "satellite", "topic": "도이치텔레콤 위성컨소시엄"}, {"title": "India joins US-led 6G initiative with 25 countries: What new global alliance means for the", " <script>
const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};

const TABS=[

  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},

  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}},
  {id:"daily",  name:"📅 일자별",     secs:[],             mode:"daily"}
];
const ARCH=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
let activeTab="top";
let archDay=null;
let archImp=0;
function setArchDay(d){archDay=d;render();}
function setArchImp(n){archImp=n;render();}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${esc(a.url)}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
