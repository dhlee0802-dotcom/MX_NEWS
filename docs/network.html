  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}

  .cat.exec{background:#fff6d9;color:#9a7b00}

  .art-src{font-size:11px;color:var(--low);margin-top:4px}

</style>

topic": ""}, {"title": "AT&T Business to link Amazon Leo satellite service into managed offer - SDxCentral", "summary": "AT&T 비즈니스가 아마존 레오 위성 브로드밴드 서비스를 관리형 기업용 통신 상품에 연동하기로 했다. 위성통신 기술을 상용 기업 서비스에 접목하여 차별화된 연결성 포트폴리오를 구축하고 있다.", "source": "SDxCentral", "date": "2026-09-09 06:30", "url": "https://www.sdxcentral.com/news/att-business-to-link-amazon-leo-satellite-service-into-managed-offer/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "at&t 아마존레오 위성"}, {"title": "ＫＤＤＩ／スターリンク利用の通信エリア構築ソリューション／ＮＥＴＩＳ登録で拡大 - decn.co.jp", "summary": "KDDI가 스타링크를 활용한 통신 영역 구축 솔루션을 NETIS(신기술 정보 제공 시스템)에 등록하며 적용 범위를 확대하고 있다. 재난 지역 및 산간 오지에 신속하게 위성통신망을 구축하는 솔루션의 공신력이 높아졌다.", "source": "decn.co.jp", "date": "2026-09-09 06:03", "url": "https://www.decn.co.jp/?p=187507", "category": "contract", "importance": 4, "sid": "satellite", "topic": "kddi 스타링크 솔루션 등록"}, {"title": "FCC sizes up spectrum for satellite broadband, AI sensing", "summary": "미국 연방통신위원회(FCC)가 위성 브로드밴드와 AI 센싱을 위한 주파수 확보에 나섰다. 위성 연결을 위해 12GHz 및 42GHz 대역의 주파수를 개방하고, AI 기반 센싱 및 신흥 응용 분야를 위한 비면허 초광대역 주파수를 현대화하는 안건을 투표에 부칠 예정이다. 위성통신 및 주파수 규제 측면에서 업계의 주목을 받는 정책 동향이다.", "source": "Light Reading", "date": "2026-09-09 05:45", "url": "https://www.lightreading.com/satellite/fcc-sizes-up-spectrum-for-satellite-broadband-ai-sensing", "category": "policy", "importance": 4, "sid": "satellite", "topic": "fcc 위성통신"}, {"title": "Sceyeとソフトバンク、日本での成層圏接続性の実証実験を完了し、HAPSの商用化に向けて前進 - acrofan.com", "summary": "스카이와 소프트뱅크가 일본 내 성층권 통신 연결성 실증 실험을 완료하고 HAPS(고고도 플랫폼 무선국) 상용화에 한 걸음 더 다가섰다. 차세대 공중 통신망 구축을 위한 핵심 기술 진전이다.", "source": "acrofan.com", "date": "2026-09-09 05:38", "url": "https://jp.acrofan.com/detail.php?number=120379", "category": "tech", "importance": 4, "sid": "satellite", "topic": "소프트뱅크 haps 상용화"}, {"title": "FCC Returns $3.08 Billion to Treasury after Spectrum Auction Pays Off Rip-and-Replace Loan", "summary": "미국 FCC가 주파수 경매 수익을 활용해 화웨이 등 중국산 장비 퇴출(Rip-and-Replace) 대출 상환을 완료하고 남은 자금을 국고로 반환했다. 미 정부 차원의 중국산 통신장비 제재 및 보안 강화 정책의 일환이다. 글로벌 통신장비 시장에 큰 영향을 미친다.", "source": "Broadband Breakfast", "date": "2026-09-09 05:14", "url": "https://broadbandbreakfast.com/fcc-returns-3-08-billion-to-treasury-after-spectrum-auction-pays-off-rip-and-replace-loan/", "category": "policy", "importance": 4, "sid": "policy", "topic": "fcc 장비제거"}, {"title": "Verizon’s multi-billion Corning fiber supply deal supports fiber broadband, AI expansion -", "summary": "버라이즌의 다년간 수십억 달러 규모 코닝 광섬유 공급 계약은 광대역 통신망과 AI 인프라 확장을 지원한다. 데이터 트래픽 증가에 대응하기 위한 핵심 네트워크 투자다. 통신 장비 및 자재 수요를 크게 견인한다.", "source": "Lightwave Online", "date": "2026-09-09 05:02", "url": "https://www.lightwaveonline.com/home/press-release/55403609/verizons-multi-billion-corning-fiber-supply-deal-supports-fiber-broadband-ai-expansion", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 광섬유"}, {"title": "AT&T Business Expands Work with Amazon Leo for Resilient Connectivity - Via Satellite", "summary": "AT&T 비즈니스가 복원력 있는 연결성을 위해 아마존 Leo 위성과의 협력을 확대한다. 저궤도 위성을 활용한 기업용 브로드밴드 서비스를 강화하는 내용이다. 위성통신 시장에서의 경쟁 구도를 보여준다.", "source": "Via Satellite", "date": "2026-09-09 04:25", "url": "https://www.satellitetoday.com/connectivity/2026/09/08/att-business-expands-work-with-amazon-leo-for-resilient-connectivity/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at앤트 위성"}, {"title": "AT&T Business Customers to Get Amazon Leo Satellite Broadband... Eventually - PCMag UK", "summary": "AT&T 비즈니스 고객들이 향후 아마존 레오 위성 브로드밴드 서비스를 이용할 수 있게 된다. 위성 통신을 활용한 기업용 연결성 서비스가 확대된다.", "source": "PCMag UK", "date": "2026-09-09 04:09", "url": "https://uk.pcmag.com/networking/167148/att-business-customers-to-get-amazon-leo-satellite-broadband-eventually", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 아마존레오 위성통신계약"}, {"title": "DCC approves satellite spectrum pricing for Jio, Starlink, OneWeb - economictimes.com", "summary": "인도 통신위원회(DCC)가 릴라이언스 지오, 스타링크, 원웹 등 주요 사업자를 위한 위성통신 주파수 가격 산정 방안을 최종 승인했다. 인도 정부의 적극적인 위성 스펙 09014245", "category": "contract", "importance": 4, "sid": "competitor", "topic": "lg전자 아너 특허 양도"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - SDxCentral", "summary": "라쿠텐 심포니의 클라우드 RAN 기술이 타왈의 다중 통신사 실내망 구축에 적용됐다. 클라우드 기반 가상화 무선 접속망 솔루션의 상용화 성과다. 오픈랜 생태계 확장을 보여주는 대형 계약이다.", "source": "SDxCentral", "date": "2026-09-09 01:28", "url": "https://www.sdxcentral.com/news/rakuten-symphony-cloud-ran-tech-powers-tawals-multi-operator-indoor-network/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "라쿠텐 심포니 타왈 실내망 구축"}, {"title": "Verizon powers American AI with billions-strong Corning fiber deal - SDxCentral", "summary": "버라이즌이 수십억 달러 규모의 코닝 광섬유 계약을 통해 미국 내 AI 인프라 확장을 위한 통신망 동력을 확보했다. 대규모 광대역 투자를 통해 고도화된 연결성 서비스를 제공할 계획이다.", "source": "SDxCentral", "date": "2026-09-09 01:28", "url": "https://www.sdxcentral.com/news/verizon-powers-american-ai-with-billions-strong-corning-fiber-deal/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광섬유 계약"}, {"title": "Bell, Rogers and Telus Lead Canada’s Wi-Fi 7 Shift as Fibre Pulls Ahead - iPhone in Canada", "summary": "벨, 로저스, 텔러스 등 캐나다 주요 통신사들이 광케이블 인프라 확충과 함께 와이파이 7(Wi-Fi 7) 기술 도입을 주도하고 있습니다. 유무선 홈브로드밴드 고도화 트렌드를 보여줍니다.", "source": "iPhone in Canada", "date": "2026-09-09 01:25", "url": "https://www.iphoneincanada.ca/2026/09/08/bell-rogers-and-telus-lead-canadas-wi-fi-7-shift-as-fibre-pulls-ahead/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "캐나다 통신사 와이파이7 전환"}, {"title": "Verizon and Corning announce fiber agreement | About Verizon - Verizon", "summary": "버라이즌이 코닝과 대규모 광케이블 공급 계약을 체결했습니다. FTTP 광대역 인터넷망 구축과 AI 인프라 확장을 뒷받침하기 위한 수조 원 규모의 전략적 파트너십입니다. 고속 데이터 트래픽 증가에 대응하기 위한 핵심 네트워크 투자입니다. 통신사의 인프라 조달 및 장기 공급망 확보를 나타냅니다.", "source": "Verizon", "date": "2026-09-09 01:22", "url": "https://www.verizon.com/about/news/verizon-corning-broadband-ai-fiber-agreement", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 광케이블"}, {"title": "삼성전자, 프랑스 미스트랄 AI에 지분 투자…반도체 특화 AI 공동 개발", "summary": "삼성전자가 프랑스의 대표 AI 기업 '미스트랄 AI'에 지분 투자를 단행하고 반도체 특화 AI 모델을 공동 개발하기 위한 전략적 파트너십을 체결했다. 유럽의 AI 거점과의 협력을 통해 AI 경쟁력을 강화하려는 포석이다.", "source": "ZDNet Korea", "date": "2026-09-09 01:00", "url": "https://zdnet.co.kr/view/?no=20260908192706", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 미스트랄 ai 지분 투자 협력"}, {"title": "Verizon loads up on Corning's fiber for network expansion and AI infrastructure", "summary": "버라이즌은 네트워크 확장 및 인공지능(AI) 인프라 지원을 위해 코닝과 수십억 달러 규모의 광케이블 공급 계약을 체결했다. 계약에 따라 2027년부터 2032년까지 8000만 마일 이상의 광케이블을 공급받게 된다. 이번 대규모 투자는 버라이즌의 통신망 고도화와 AI 연계 인프라 구축 가속화를 위한 전략적 행보로 평가된다.", "source": "Light Reading", "date": "2026-09-09 00:56", "url": "https://www.lightreading.com/data-centers/verizon-loads-up-on-corning-s-fiber-for-network-expansion-and-ai-infrastructure", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 장비계약"}, {"title": "Ericsson says telco-grade AI RAN must deliver measurable gains at scale", "summary": "에릭슨의 전략적 RAN 리더십 총괄 가브리엘 포글란더는 RCR테크 텔코 AI 포럼에서 텔코급 AI RAN이 대규모 환경에서 측정 가능한 성과를 반드시 입증해야 한다고 강조했다. AI-RAN이 네트워크 전반에 AI를 내재화하는 광범위한 전환의 교두보 역할을 해야 한다는 설명이다. 글로벌 통신장비 경쟁사가 차세대 무선 접속망(RAN)과 AI의 결합 방향성을 제시한 핵심 발언이다. 삼성전자 네트워크사업부의 AI 기반 6G 및 차세대 네트워크 전략 수립에 시사점을 준다.", "source": "RCR Wireless", "date": "2026-09-09 00:44", "url": "https://rcrwireless.com/20260908/carriers/ericsson-ai-ran", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 ai"}, {"title": "Corning Secures Another Multi-Billion-Dollar Long-Term Deal with Verizon as AI Fiber Deman", "summary": "AI 광섬유 수요 증가 속에서 코닝이 버라이즌과 또 다른 수십억 달러 규모의 장기 계약을 체결했다. 통신 인프라 시장의 대형 수주 계약이다.", "source": "finance.biggo.com", "date": "2026-09-09 00:35", "url": "https://finance.biggo.com/news/b2d3dbda-4a06-4b4d-bc0d-7246a65f5c6e", "category": "contract", "importance": 4, "sid": "carrier", "topic": "코닝 버라이즌"}, {"title": "Digital Communications Commission approves TRAI recommendations on Satcom Spectrum - PGuru", "summary": "디지털통신위원회(DCC)가 위성통신(Satcom) 주파수에 대한 TRAI의 권고안을 최종 승인했습니다. 인도 내 위성통신 상용화를 위한 규제적 기반이 마련되었습니다. 위성 사업자들의 시장 진입이 가속화될 전망입니다. 통신 규제 환경의 큰 변화입니다.", "source": "PGurus", "date": "2026-09-09 00:33", "url": "https://www.pgurus.com/digital-communications-commission-approves-trai-recommendations-on-satcom-spectrum/", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도위성통신 정책"}, {"title": "China’s Huawei Technologies faces racketeering trial in New York - Boston Herald", "summary": "중국 화웨이 테크놀로지가 미국 뉴욕 법원에서 조직범죄 혐의 관련 재판을 앞두고 있습니다. 미·중 기술 패권 갈등 속에서 화웨이의 법적 리스크가 심화되는 국면을 다룹니다.", "source": "Boston Herald", "date": "2026-09-09 00:28", "url": "https://www.bostonherald.com/2026/09/08/huawei-racketeering-trial/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 뉴욕 공판"}, {"title": "Verizon, Corning ink fibre supply deal - Mobile World Live", "summary": "버라이즌(Verizon)과 코닝(Corning)이 차세대 초고속 인터넷망 구축과 AI 트래픽 수용을 위한 광섬유 장기 공급 계약을 공식 체결했습니다.", "source": "Mobile World Live", "date": "2026-09-09 00:13", "url": "https://www.mobileworldlive.com/verizon/verizon-corning-ink-fibre-supply-deal/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광섬유 공급"}, {"title": "EU telcos close ranks against Starlink in bid for satellite spectrum – report", "summary": "도이치텔레콤, 오렌지, 텔레포니카, 보다폰 등 유럽 주요 통신사들이 위성 직접통신(D2D)을 위한 EU 모바일 위성 주파수 입찰에 공동 참여하기 위해 컨소시엄 결성을 추진하고 있다. 스페이스X의 스타링크 등 위성통신 공세에 대응해 유럽 통신사들이 연합 전선을 구축하는 양상이다. 유럽 시장 내 위성통신 경쟁 구도에 큰 변화를 줄 것으로 전망된다.", "source": "Light Reading", "date": "2026-09-09 00:04", "url": "https://www.lightreading.com/satellite/eu-telcos-close-ranks-against-starlink-in-joint-bid-for-satellite-spectrum-report", "category": "contract", "importance": 4, "sid": "satellite", "topic": "도이치텔레콤 위성컨소시엄"}, {"title": "India joins US-led 6G initiative with 25 countries: What new global alliance means for the", "summary": "인도가 25개국이 참여하는 미국 주도의 6G 글로벌 동맹에 가입했습니다. 차세대 통신 기술 표준 선점과 공급망 협력을 강화합니다. 6G 연구개발 및 국제 협력 뉴스입니다.", "source": "The Economic Times", "date": "2026-09-09 00:03", "url": "https://m.economictimes.com/industry/telecom/telecom-news/india-joins-us-led-6g-initiative-with-25-countries-what-new-global-alliance-means-for-the-future-of-internet-and-wireless-connectivity/articleshow/133930349.cms", "category": "tech", "importance": 4, "sid": "satellite", "topic": "인도 6g"}, {"title": "Huawei heads to trial in US over its business dealings in Iran - KELO-AM", "summary": "화웨이가 이란과의 부적절한 사업 거래 혐의와 관련해 미국 법정에서 정식 재판 절차에 돌입했다. 글로벌 통신장비 시장 점유율 1위 기업인 화웨이에 대한 미 법무부의 제재 압박이 거세지고 있다.", "source": "KELO-AM", "date": "2026-09-09 00:03", "url": "https://kelo.com/2026/09/08/huawei-heads-to-trial-in-us-over-its-business-dealings-in-iran/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 이란 거래 미국 재판"}]};

function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${esc(a.url)}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
