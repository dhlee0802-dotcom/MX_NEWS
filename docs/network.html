<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

ws/articleView.html?idxno=13551", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 기지국 드론 탐지 기술"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI 랜, ISAC, 차별화된 커넥티비티 및 6G로 이어지는 차세대 기술 리더십을 바탕으로 국내 파트너들과의 협력 청사진을 제시했다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g청사진"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디아라비아 통신사 STC와 다년간의 5G 네트워크 확장 계약을 체결했습니다. 이번 계약을 통해 현지 5G 인프라 커버리지를 넓히고 네트워크 성능을 대폭 업그레이드할 계획입니다. 대형 통신사와 장비사 간의 핵심 수주 계약 사례입니다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 stc 5g 네트워크 확장 계약"}, {"title": "Samsung wins ZTE 5G patent case, raising difficult questions for UK courts - IAM Patent", "summary": "삼성전자가 중국 장비사인 ZTE와의 5G 표준필수특허(SEP) 소송에서 승소하며 영국 법원 판결과 관련해 업계의 이목을 집중시키고 있습니다. 이번 판결은 글로벌 통신 특허 라이선스 관행과 장비사 간의 지식재산권 공방에 중요한 선례가 될 수 있습니다. 경쟁사 간의 핵심 법적 분쟁 확정 보도입니다.", "source": "IAM Patent", "date": "2026-09-01 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "tech", "importance": 4, "wl": false, "topic": "삼성전자 zte 5g 특허 소송 승소"}, {"title": "Nokia deploys Gibabit Connect with InCoax MoCA Access for apartments on Sjoberg's network ", "summary": "노키아가 인코액스(InCoax)의 MoCA 액세스 기술을 활용해 아파트 단지 대상의 기가비트 커넥트 네트워크 구축을 지원합니다. 기존 동축 케이블 인프라를 활용해 고속 초고속 인터넷 서비스를 제공할 수 있도록 장비를 배치했습니다. 통신장비 공급 및 구축 사례입니다.", "source": "Telecompaper", "date": "2026-09-03 19:44", "url": "https://www.telecompaper.com/news/nokia-deploys-gibabit-connect-with-incoax-moca-access-for-apartments-on-sjobergs-network-in-minnesot  보여준다. 통신사 및 AI 기업들의 기술력 경쟁 구도에 중요한 변화이다.", "source": "디지털데일리", "date": "2026-09-03 10:16", "url": "https://www.ddaily.co.kr/page/view/2026090310122915637", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 ai"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "증권가 분석을 통해 SK텔레콤의 통신 본업 회복과 함께 신규 주파수 할당, 5G 요금제 개편, 5G SA 상용화 및 AI 기지국 보급 확대 정책 논의 가능성이 거론되었다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "policy", "importance": 4, "wl": false, "topic": "sk텔레콤 주파수정책"}, {"title": "Yettel Bulgaria appoints Nin as chief technology and information officer - Telecompaper", "summary": "불가리아의 통신사 예텔(Yettel Bulgaria)이 새로운 최고기술정보책임자(CTO/CIO)로 닌을 임명했다. 통신사 기술 부서의 리더십 교체를 통한 망 고도화 전략 추진을 의미한다.", "source": "Telecompaper", "date": "2026-09-03 20:13", "url": "https://www.telecompaper.com/news/yettel-bulgaria-appoints-nin-as-chief-technology-and-information-officer--1581640", "category": "exec", "importance": 3, "wl": false, "topic": "예텔불가리아 임원"}, {"title": "Airtel ARPU Could Hit Rs 325 by FY29 - telecomtalk.info", "summary": "인도의 주요 통신사 바르티 에어텔(Bharti Airtel)의 가입자당 평균 매출(ARPU)이 회계연도 2029년까지 크게 상승할 것이라는 전망이 제기되었다. 인도 통신 시장의 지속적인 요금 인상 추세와 데이터 소비량 증가가 배경으로 작용하고 있다. 통신사의 재무 건전성 및 향후 인프라 투자 여력을 가늠할 수 있는 지표이다. 인도 통신 시장의 성장 잠재력을 보여준다.", "source": "telecomtalk.info", "date": "2026-09-03 19:55", "url": "https://telecomtalk.info/airtel-arpu-could-hit-rs-325-by-fy29/1011523/", "category": "earnings", "importance": 3, "wl": false, "topic": "바르티에어텔 실적"}, {"title": "40 AI agents are already in use for clients. TELUS Digital will host demos at Dreamforce. ", "summary": "텔러스 디지털(TELUS Digital)이 고객들을 위해 40종 이상의 AI 에이전트를 실무에 도입해 운영 중이며 관련 데모를 선보일 예정이다. 통신 및 디지털 서비스 운영에 생성형 AI 기술을 적극 접목하고 있다. 통신사의 디지털 혁신 및 AI 솔루션 도입 트렌드를 보여준다.", "source": "Stock Titan", "date": "2026-09-03 19:45", "url": "https://www.stocktitan.net/news/TU/telus-digital-to-host-agentforce-industry-sessions-and-exclusive-b7osxigv9b4p.html", "category": "tech", "importance": 3, "wl": false, "topic": "텔러스 디지털"}, {"title": "Chunghwa Telecom, Askey Launch 5G Platform for Construction Robots - Telecom Review Asia", "summary": "대만 중화텔레콤과 아스키(Askey)가 건설 현장 로봇을 위한 5G 플랫폼을 공동 출시했습니다. 초고속·초저지연 5G 네트워크를 기반으로 원격 제어 및 자율주행 건설 로봇의 안정성을 높입니다. 통신사의 5G B2B 솔루션 상용화 사례입니다.", "source": "Telecom Review Asia", "date": "2026-09-03 19:44", "url": "https://www.telecomreviewasia.com/news/technology-news/30170-chunghwa-telecom-askey-launch-5g-platform-for-construction-robots/", "category": "tech", "importance": 3, "wl": false, "topic": "중화텔레콤 아스키 5g 건설 로봇 플랫폼"}, {"title": "LS일렉트릭, KT클라우드와 AIDC 전력 인프라 협력 - dt.co.kr", "summary": "LS일렉트릭이 KT클라우드와 AI 데이터센터 전력 인프라 구축을 위한 전략적 파트너십을 체결했다. 대규모 전력이 소모되는 AI 데이터센터의 안정적 운영을 위한 전력 설비 협력이다.", "source": "dt.co.kr", "date": "2026-09-03 19:21", "url": "https://www.dt.co.kr/article/12081856", "category": "contract", "importance": 3, "wl": false, "topic": "kt클라우드 인프라"}, {"title": "Vodafone has the best and fastest 5G network in Romania, according to Ookla - Business Rev", "summary": "오클라(Ookla) 테스트 결과 보다폰이 루마니아에서 가장 우수하고 빠른 5G 네트워크를 보유한 통신사로 선정되었다. 통신사의 무선 네트워크 품질 경쟁력을 입증하는 지표이다. 통신 장비의 성능과 품질 우수성을 방증한다.", "source": "Business Review", "date": "2026-09-03 19:01", "url": "https://business-review.eu/tech/telecom/vodafone-has-the-best-and-fastest-5g-network-in-romania-according-to-ookla-300026", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 5g"}, {"title": "VodafoneThree declares 5G network slicing war on BT", "summary": "보다폰쓰리가 BT의 유사 서비스와 차별화된 보증 조건을 내세운 새로운 SuperMobile 5G 네트워크 슬라이싱 상품을 선보였다. 이번 출시는 통신사 간 B2B 및 고성능 연결 서비스 경쟁을 심화시킬 것으로 전망된다. 영국 통신 시장에서 새로운 수익원을 창출하기 위한 전략적 시도로 평가된다.", "source": "Light Reading", "date": "2026-09-03 18:23", "url": "https://www.lightreading.com/5g/vodafonethree-declares-5g-network-slicing-war-on-bt", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 5g 네트워크 슬라이싱"}, {"title": "울산 시내버스 762대 차세대 와이파이로 전면 교체", "summary": , "wl": false, "topic": "sk텔레콤 ai-ran"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 AWS의 얀 호프메이어를 차기 최고기술책임자(CTO)로 영입했다. 이번 인사를 통해 클라우드 및 네트워크 인프라 혁신을 가속화할 전망이다. 최고재무책임자(CFO) 등 주요 경영진의 세대교체 흐름과 맞물려 주목받고 있다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 임원 인사"}, {"title": "KT, ‘2026 대한민국 안전산업박람회’에서 AX 인프라 활용한 다양한 안전 솔루션 선보여 - 디지털경제뉴스", "summary": "KT가 대한민국 안전산업박람회에 참가해 AX(AI 전환) 인프라를 기반으로 한 다양한 안전 솔루션을 선보였다.", "source": "디지털경제뉴스", "date": "2026-09-03 14:04", "url": "https://www.denews.co.kr/news/articleView.html?idxno=42304", "category": "tech", "importance": 3, "wl": false, "topic": "kt 안전산업"}, {"title": "VodafoneThree to launch debut TV service in challenge to UK rivals", "summary": "영국 통신 그룹 보다폰쓰리가 영국 시장에서 라이벌에 대항하여 자사의 첫 TV 서비스를 출시할 예정이라고 밝혔다. TV 플랫폼 추가를 통해 광대역 인터넷 사업 규모를 두 배로 키우겠다는 목표다. 영국 통신사의 결합상품 및 미디어 전략이다.", "source": "Financial Times Tech", "date": "2026-09-03 13:00", "url": "https://www.ft.com/content/b44fcdbd-4c0e-4032-b81a-98e309991388?syn-25a6b1a6=1", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 tv 서비스 출시"}, {"title": "Elliott builds stake in Deutsche Telekom - Bilyonaryo Business", "summary": "행동주의 펀드 엘리엇(Elliott)이 독일의 대형 통신사 도이치텔레콤(Deutsche Telekom)의 지분을 대거 매입하며 주요 주주로 부상했습니다. 유럽 거대 통신사의 지배구조 및 경영 전략에 변수가 될 수 있는 대형 투자 건입니다.", "source": "Bilyonaryo Business", "date": "2026-09-03 12:38", "url": "https://bilyonaryo.com/elliott-builds-stake-in-deutsche-telekom/", "category": "other", "importance": 3, "wl": false, "topic": "엘리엇 도이치텔레콤 지분 매입"}, {"title": "Telekom's Boardroom Reshuffle Puts a 48-Quarter Winning Streak to the Test - AD HOC NEWS", "summary": "도이치텔레콤의 최고 경영진 개편이 그간 이어온 장기 실적 호조세(48분기 연속 승승장구)에 어떤 영향을 미칠지 분석했다. 리더십 변화가 향후 실적 유지에 시험대가 될 전망이다.", "source": "AD HOC NEWS", "date": "2026-09-03 10:30", "u lekom-4ig-wiocc-56163/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "도이치텔레콤 동향"}, {"title": "Vi Gets a New Look: Unveils 3D Brand Identity and Teases Major Transformation With Shah Ru", "summary": "보다폰 아이디어가 3차원 브랜드 아이덴티티를 전면 도입하고 샤룩 칸을 내세워 대규모 사업 전환을 예고했다. 기업 체질 개선과 브랜드 인지도 제고를 위한 마케팅 드라이브이다. 통신사의 비즈니스 전략 변화를 시사한다.", "source": "PaidFreeDroid", "date": "2026-09-02 20:01", "url": "https://paidfreedroid.com/2026/09/vi-shah-rukh-khan-rebrand-3d-logo-network-change.html/amp", "category": "exec", "importance": 3, "wl": false, "topic": "보다폰아이디어 임원"}, {"title": "Telstra says external review finds network timing system caused July outage", "summary": "텔스트라는 외부 감사 결과 지난 7월 발생한 모바일 네트워크 장애가 계획된 유지보수 이후 잘못된 날짜 정보가 전파되면서 발생한 네트워크 타이밍 시스템 결함 때문인 것으로 확인되었다고 밝혔다. 통신망 장애 원인 규명 및 복구 관련 보도다.", "source": "ET Telecom", "date": "2026-09-02 19:05", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telstra-says-external-review-finds-network-timing-system-caused-july-outage/133706421", "category": "outage", "importance": 3, "wl": true, "topic": "텔스트라 네트워크 장애 조사"}, {"title": "Charter Communications announces resignation of CFO - Telecompaper", "summary": "미국의 대형 케이블 및 통신 사업자인 차터커뮤니케이션즈(Charter Communications)에서 최고재무책임자(CFO)의 사임 소식이 발표되었다. 구체적인 퇴임 일정과 함께 후임 인선에 대한 시장의 관심이 집중되고 있다. 이번 경영진 변동은 회사의 재무 전략 및 향후 투자 방향성에 영향을 미칠 수 있다. 통신 업계 내 주요 리더십 변화 동향으로 주목된다.", "source": "Telecompaper", "date": "2026-09-02 16:00", "url": "https://www.telecompaper.com/news/charter-communications-announces-resignation-of-cfo--1581381", "category": "exec", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 임원"}, {"title": "드론부터 딥보이스까지…KT, ‘AI 안전망’ 띄운다 - 데일리안", "summary": "KT가 드론 및 딥보이스 탐지 기술 등 인공지능을 접목한 첨단 'AI 안전망' 서비스를 새롭게 구축하고 공공 및 사회 안전 분야에 적용한다고 밝혔습니다. 통신사의 AI 기반 공공 서비스 진출 동향을 다룹니다.", "source": "데일리안", "date": "2026-09-02 15:09", "url": "https://www.dailian.co.kr/news/view/1685574/%EB%93%9C%EB%A1%A0-%EB%94%A5%EB%B3%B4%EC%9D%B4%EC%8A%A4%EA%B9%8C%EC%A7%80KT-%E2%80%98AI-%EC%95%8     if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
