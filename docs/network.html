<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

ite Engineers from Amazon's Project Kuiper - streamlinefeed.co.k", "summary": "블루오리진이 아마존의 위성 프로젝트 쿠이퍼에 소속된 다수의 위성 엔지니어를 영입했다. 우주 및 위성 통신 분야에서 우수 인재를 선점하기 위한 경쟁이 치열해지고 있다. 주요 우주 기업 간의 핵심 인력 이동을 보여준다.", "source": "streamlinefeed.co.ke", "date": "2026-09-03 23:25", "url": "https://streamlinefeed.co.ke/news/blue-origin-poaches-satellite-engineers-amazon-project-kuiper", "category": "other", "importance": 4, "wl": false, "topic": "블루오리진 아마존 인력 영입"}, {"title": "테슬라 '사이버캡' 공개 운행 시작…일론 머스크식 자율주행 전략, 성공...", "summary": "테슬라가 오스틴에서 로보택시 서비스 운영을 시작하며 사이버캡에 스페이스X의 스타링크 연결을 설치했다. 자율주행 차량의 실시간 통신을 위해 저궤도 위성망을 활용하는 전략이다. 위성 통신과 모빌리티의 결합을 보여주는 대표적인 사례이다.", "source": "digitaltoday.co.kr", "date": "2026-09-03 19:26", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697995", "category": "contract", "importance": 4, "wl": false, "topic": "테슬라 사이버캡 스타링크 연결"}, {"title": "대만 유사시 첫 전장은 우주?…美·中 대위성 무기 경쟁 격화", "summary": "미·중 간 대위성 무기 경쟁이 격화되는 가운데 중국이 스타링크를 공격할 가능성을 검토하고 있다는 보고서가 발표되었다. 러시아의 GPS 수신기 교란에 이어 저궤도 위성망을 무력화하기 위한 우주전 대비가 본격화되고 있다. 안보 환경 변화에 따른 위성 통신망의 전략적 중요성을 보여준다.", "source": "digitaltoday.co.kr", "date": "2026-09-03 14:14", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697949", "category": "policy", "importance": 4, "wl": false, "topic": "미중 대위성 무기 경쟁 스타링크"}, {"title": "DoT leaning toward 5% AGR-linked charge for satellite spectrum - Communications Today", "summary": "인도 통신국(DoT)이 위성 주파수 할당과 관련하여 조정총수입(AGR) 연계 5% 부과 방식을 검토하고 있다. 위성통신 서비스 사업자들에게 적용될 규제 비용과 주파수 정책 방향을 설정하는 단계이다. 주요국의 위성 주파수 정책 수립 동향이다.", "source": "Communications Today", "date": "2026-09-03 13:56", "url": "https://www.communicationstoday.co.in/dot-leaning-toward-5-agr-linked-charge-for-satellite-spectrum/", "category": "policy", "importance": 4, "wl": false, "topic": "인도 통신국 위성 주파수 요금"}, {"title": "'소형 발사체 강자' 로켓랩, 일렉트론 94번째 발사 성공", "summary": "소형 발사체 강자 로켓랩이 뉴질랜드 마히아 발사장에서 일렉트론 로켓을 성공적으로 발사했다. 위성 스트릭스를 고도 575km 저궤도에 정확히 투입하며 글로벌 위성 발사 임무를 수행했다. 민간 소형 발사 서비스의 경쟁력을 보여준다.", "source": "choicenews.co.kr", "date": "2026-09-03 08:56", "url": "http://www.choicenews.co.kr/news/articleView.html?idxno=170900", "category": "contract", "importance": 4, "wl": false, "topic": "로켓랩 일렉트론 94회 발사"}, {"title": "공정위, 한화 KAI 주식 취득 승인… ‘한국판 스페이스X’ 구상 속도", "summary": "공정위가 한화의 KAI 주식 취득을 승인하며 '한국판 스페이스X' 구상에 속도가 붙었다. 한화는 2040년까지 55조 원을 투입해 독자 발사체, 위성, 우주 AI 데이터센터, 저궤도 통신망을 구축하는 우주·국방 인프라 전략을 추진한다. 대규모 우주 산업 투자 딜이다.", "source": "weekly.donga.com", "date": "2026-09-03 07:02", "url": "https://weekly.donga.com/3/all/11/6371275/1", "category": "contract", "importance": 4, "wl": false, "topic": "한화 kai 주식 취득 저궤도 통신망"}, {"title": "\"억지 실패 땐 궤도서 교전\"…미·중 우주 전투태세 서두르는 이유", "summary": "미국과 중국이 우주 전투태세를 서두르는 가운데 스페이스X는 약 1만 1000기의 스타링크 위성을 운용하며 우주 데이터망을 확장하고 있다. 중국도 독자 저궤도 위성망을 조성하며 트럼프 전 대통령의 골든돔 요격망 구상에 대응하고 있다. 저궤도 위성의 군사적·전략적 가치가 부각되고 있다.", "source": "g-enews.com", "date": "2026-09-03 06:44", "url": "https://www.g-enews.com/view.php?ud=202609030625368576fbbec65dfb_1", "category": "policy", "importance": 4, "wl": false, "topic": "미중 우주 전투태세 스타링크"}, {"title": "“비행기 안에서도 생방송?”… 스타링크 시대, 기내 규칙 바뀐다", "summary": "대한항공이 9월부터 장거리 노선 투입 기종을 시작으로 스페이스X의 저궤도 위성 인터넷 '스타링크' 기반 기내 와이파이를 순차 도입한다. 2027년 말까지 전 기종으로 확대를 추진할 계획이다. 항공기 내 통신 환경의 패러다임을 바꾸는 대형 위성 통신 계약이다.", "source": "edaily.co.kr", "date": "2026-09-03 06:09", "url": "https://www.edaily.co.kr/News/Read?newsId=02263206645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "contract", "importance": 4, "wl": false, "topic": "대한항공 스타링크 기내 와이파이 도입"}, {"title": "MDA Space Files for Own D2D Constellation While Supplying Rival Operators - Tech Times", "summary": "MDA 스페이스가 경쟁 위성 통신 사업자들에게 장비를 공급하면서도 독자적인 위성 직접통신(D2D) 군집 구축을 위한 서류를 제출했다. 위성통신 시장에서 공급자와 경쟁자의 역할을 동시에 수행하며 사업 확장을 노리고 있다. 위성 장비 및 서비스 시장의 경쟁 구도 변화를 나타낸다.", "source": "Tech Times", "date": "2026-09-03 04:50", "url": "https://www.techtimes.com/articles/326366/20260902/mda-space-files-own-d2d-constellation-while-supplying-rival-operators.htm", "category": "contract", "importance": 4, "wl": false, "topic": "mda 스페이스 d2d 위성 군"}, {"title": "美·中, 우주전 대비 가속…'헌터 위성' 경쟁 본격화", "summary": "미국과 중국이 우주전에 대비해 '헌터 위성' 경쟁에 본격적으로 돌입했다. 스페이스X가 1만 1000기의 스타링크 위성을 운용하는 가운데 중국도 경쟁 위성망 건설을 가속화하고 있다. 우주 안보와 저궤도 인프라 선점을 위한 패권 경쟁을 다룬다.", "source": "g-enews.com", "date": "2026-09-03 02:00", "url": "https://www.g-enews.com/view.php?ud=2026090221261233169a1f309431_1", "category": "policy", "importance": 4, "wl": false, "topic": "미중 우주전 헌터 위성 스타링크"}, {"title": "우주항공청, 내년 예산 1조6491억…5290억 증액", "summary": "우주항공청의 내년 예산이 1조 6491억 원으로 대폭 증액 편성되었다. 정지궤도 환경위성, 다목적실용위성 8호, 한국형 위성항법시스템과 함께 저궤도 위성 통신 기술개발에 205억원이 배정되었다. 정부 차원의 우주 및 통신 인프라 육성 정책이다.", "source": "gndomin.com", "date": "2026-09-02 18:14", "url": "http://www.gndomin.com/news/articleView.html?idxno=487739", "category": "policy", "importance": 4, "wl": false, "topic": "우주항공청 내년 예산 저궤도 위성"}, {"title": "A Historic Deal Between Apple and Amazon to Boost Satellite Services on the iPhone - آي-فو", "summary": "아이폰의 위성 통신 서비스 강화를 위해 애플과 아마존 간의 역사적인 제휴가 추진된다. 거대 빅테크 기업들이 손잡고 모바일 기기 기반의 위성 연결성을 확대하려는 전략이다. 위성통신 생태계에 큰 파장을 미칠 대형 파트너십이다.", "source": "آي-فون إسلام", "date": "2026-09-02 17:43", "url": "https://iphoneislam.com/language/en/2026/04/a-historic-deal-between-apple-and-amazon-to-boost-satellite-services-on-the-iphone/165317", "category": "contract", "importance": 4, "wl": false, "topic": "애플 아마존 위성 서비스 협력"}, {"title": "\"AI 시대, 트래픽 5배 증가…네트워크 지원 필요\"", "summary": "AI 시대 트래픽 5배 증가에 대응하여 초고속·초저지연 네트워크 기술 투자 지원의 필요성이 제기됐다. 해저케이블과 6G 지상망에 결합 가능한 저궤도 위성망까지 아우르는 국가 차원의 인프라 육성이 강조되었다. 차세대 통신망 인프라 구축을 위한 정책 제언이다.", "source": "news.bizwatch.co.kr", "date": "2026-09-02 17:28", "url": "https://news.bizwatch.co.kr/article/mobile/2026/09/02/0038", "category": "policy", "importance": 4, "wl": false, "topic": "ai 시대 네트워크 인프라 지원"}, {"title": "Hungary's 4iG Group and SpaceX sign Europe's first Starlink - mediasat.info", "summary": "헝가리의 4iG 그룹과 스페이스X가 유럽 최초로 스타링크 위성통신 서비스 제공 계약을 체결했다. 유럽 지역 내 저궤도 위성 인터넷 서비스 상용화의 물꼬를 트는 대형 계약이다. 위성통신 서비스의 글로벌 영토 확장 사례이다.", "source": "mediasat.info", "date": "2026-09-02 17:14", "url": "https://mediasat.info/en/2026/09/02/starlink-mobile-is-coming-to-hungary-and-the-balkans/", "category": "contract", "importance": 4, "wl": false, "topic": "포아이쥐 스타링크 유럽 계약"}, {"title": "인텔리안테크, 美생산공장 가동…게이트웨이 안테나 첫 출하", "summary": "인텔리안테크가 미국 생산공장을 본격 가동하고 게이트웨이 안테나를 첫 출하했다. 저궤도와 정지궤도 위성 인프라 확대에 따라 북미 현지에서 늘어나는 수요에 대응할 방침이다. 차세대 위성 통신 고주파 대역 대응 능력을 확보했다. 글로벌 위성 장비 시장에서의 입지를 강화하는 딜이다.", "source": "zdnet.co.kr", "date": "2026-09-02 15:23", "url": "https://zdnet.co.kr/view/?no=20260902152242", "category": "contract", "importance": 4, "wl": false, "topic": "인텔리안테크 북미 생산공장 가동"}, {"title": "York Space Subsidiary Wins Pentagon Bet on Commercial-Speed Defense SATCOM Manufacturing -", "summary": "요크 스페이스의 자회사가 상업용 속도의 국방 위성통신(SATCOM) 제조 부문에서 미 펜타곤의 계약을 수주했다. 미 국방부의 상업 기술 도입 기조에 맞춰 방산용 위성 제조 역량을 입증한 결과이다. 위성통신 장비 업체의 대형 수주 성과이다.", "source": "Tech Times", "date": "2026-09-02 04:20", "url": "https://www.techtimes.com/articles/326238/20260901/york-space-subsidiary-wins-pentagon-bet-commercial-speed-defense-satcom-manufacturing.htm", "category": "contract", "importance": 4, "wl": false, "topic": "요크 스페이스 펜타곤 계약"}, {"title": "Exclusive: Aerospace project at NASA's KSC could bring more Space Coast growth - floridato", "summary": "나사(NASA) 케네디 우주센터의 신규 항공우주 프로젝트가 스페이스 코스트 지역의 경제 성장을 견인할 것으로 기대된다. 우주 산업 인프라 확대와 관련 기업들의 투자 유치가 활발해지고 있다. 위성 및 우주 발사 관련 지역 인프라 동향이다.", "source": "floridatoday.com", "date": "2026-09-03 23:37", "url": "https://www.floridatoday.com/story/tech/science/space/2026/09/03/permitting-reveals-future-florida-commercial-aerospace-facility-at-nasa-kennedy-space-center/91590839007/", "category": "other", "importance": 3, "wl": false, "topic": "나사 케네디 우주센터 프로젝트"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크가 고고도 통신 플랫폼 HAPS의 성층권 시험비행을 완료하고 2027년 상용화를 추진합니다. 고치현 무로토곶 인근에서 진행된 이번 시험은 드론과 엣지 컴퓨팅 시스템 간의 원활한 연결성을 검증했습니다. 사각지대 해소를 위한 차세대 통신 인프라로서 기대를 모으고 있습니다. 지상과 위성을 잇는 혁신 기술로 주목받고 있습니다.", "source": "Light Reading", "date": "2026-09-03 23:20", "url": "https://www.lightreading.com/satellite/softbank-completes-stratospheric-haps-trial-eyes-2027-deployment", "category": "tech", "importance": 3, "wl": true, "topic": "소프트뱅크 기술"}, {"title": "[화보] 102kg 체중 사람이 올라탄 수련잎…핵폭발로 만들어진 합금", "summary": "스페이스X의 스타링크 위성 무리가 중국 네이멍구 상공에서 촬영된 궤도 사진이 공개되었다. 해당 사진은 우주 과학 사진전에 출품되어 주목을 받았다. 저궤도 위성 네트워크의 물리적 확장과 관측 현황을 보여준다.", "source": "dongascience.com", "date": "2026-09-03 17:47", "url": "https://www.dongascience.com/news/view/79751", "category": "tech", "importance": 3, "wl": false, "topic": "스페이스x 스타링크 위성 궤도"}, {"title": "[사이언스칼럼]제2의 우주경쟁, 유럽의 경쟁력 약화가 한국에 던지는 시...", "summary": "미국은 스페이스X를 중심으로 재사용 발사체와 스타링크를 구축하여 수직계열화된 경쟁력을 확보했다. 반면 유럽은 뒤늦게 민간 발사 서비스 경쟁력 강화를 위한 사업을 추진하고 있다. 글로벌 우주 통신 인프라 생태계의 격차를 진단하는 내용이다.", "source": "joongdo.co.kr", "date": "2026-09-03 17:42", "url": "https://www.joongdo.co.kr/web/view.php?key=20260903010000955", "category": "tech", "importance": 3, "wl": false, "topic": "유럽 우주 경쟁력 스타링크"}, {"title": "전북대 노예훈 박사과정생 학문후속세대 지원사업 선정.. ' 6G 전이중통신...", "summary": "전북대 연구팀이 광대역 자기간섭 신호를 억제하고 수신기 성능 저하를 최소화하는 회로 및 신호 제거 기술을 연구했다. 향후 6G 전이중 무선통신 시스템에 적용할 핵심 수신기 기술을 확보하는 성과를 거뒀다. 차세대 6G 원천 기술 연구 개발 동향이다.", "source": "veritas-a.com", "date": "2026-09-03 14:50", "url": "https://www.veritas-a.com/news/articleView.html?idxno=626092", "category": "tech", "importance": 3, "wl": false, "topic": "전북대 6g 전이중통신 수신기 기술"}, {"title": "[ET톡] 6G 1등 국가의 조건", "summary": "세계 최초 상용화라는 타이틀보다 최고 기술을 갖춘 6G 1등 국가가 되어야 한다는 정책적 제언이 제기됐다. 5G가 남긴 상흔을 교훈 삼아 기술과 산업 생태계에서 진정한 리더십을 확보해야 한다는 시각이다. 차세대 6G 기술 개발의 방향성을 다룬 기고이다.", "source": "etnews.com", "date": "2026-09-03 13:44", "url": "https://www.etnews.com/20260903000237", "category": "tech", "importance": 3, "wl": false, "topic": "6g 1등 국가 도약 과제"}, {"title": "[주말뉴스 FULL] AIT-E, 엔비디아 파트너 WWT와 맞손…100% 액체냉각 '실...", "summary": "AIT-E가 엔비디아 파트너와 손잡고 액체냉각 실적을 공개한 가운데, 저궤도 위성 공략을 위한 AI 자동화 기술이 핵심 과제로 떠올랐다. 금리 및 건설 채용 소식 등과 함께 방송에서 다뤄진 저궤도 위성 통신 인프라 동향이다.", "source": "paxetv.com", "date": "2026-09-03 12:30", "url": "http://www.paxetv.com/news/articleView.html?idxno=280934", "category": "tech", "importance": 3, "wl": false, "topic": "ait-e 저궤도 위성 기술"}, {"title": "Satcom spectrum fee: DCC may soon decide airwave charges, allocation terms", "summary": "인도 통신위원회(DCC)가 위성통신(Satcom) 스펙트럼 요금과 할당 조건을 곧 결정할 예정입니다. 현재는 휴즈와 넬코 같은 정지궤도 위성 네트워크만 허용되어 있으며 매출액 대비 3~4%의 스펙트럼 비용을 지불하고 있습니다. 정부가 위성통신 서비스의 가격 책정과 규제 체계를 확립하는 단계입니다. 인도 위성통신 시장의 진입 장벽과 규제 동향을 보여줍니다.", "source": "ET Telecom", "date": "2026-09-03 11:10", "url": "https://telecom.economictimes.indiatimes.com/news/portal-in-portal/satcom/satcom-spectrum-fee-dcc-may-soon-decide-airwave-charges-allocation-terms/133723333", "category": "policy", "importance": 3, "wl": true, "topic": "인도정부 규제"}, {"title": "[INdustrial Technology] (주)뉴로랩, “소방관 대신 화재현장 진압”… ...", "summary": "뉴로랩의 소방 로봇 'FL30'은 원격 제어가 필요할 때 5G 망을 활용하고, 오지에서는 스타링크 위성통신을 통해 통신을 주고받는다. 지상 통신망과 위성통신을 결합하여 재난 현장의 대응력을 높이고 소방관의 안전을 확보한다. 복합 통신 기술의 현장 적용 사례이다.", "source": "fpn119.co.kr", "date": "2026-09-03 10:02", "url": "http://fpn119.co.kr/256067", "category": "tech", "importance": 3, "wl": false, "topic": "뉴로랩 소방 로봇 통신"}, {"title": "AIT-E, 글로벌 선박통신 솔루션업체 '아게 헴펠 그룹' 협력업체 등록 완...", "summary": "글로벌 선박통신 솔루션업체 AIT-E가 아게 헴펠 그룹의 협력업체로 등록 완료했다. 국제 선급 인증 서비스를 제공하며 스타링크 마리타임 공식 리셀러로서 선박에 위성 인터넷 서비스를 공급하고 있다. 해상 저궤도 위성 통신 시장의 확대 사례이다.", "source": "paxetv.com", "date": "2026-09-03 09:26", "url": "http://www.paxetv.com/news/articleView.html?idxno=280912", "category": "contract", "importance": 3, "wl": false, "topic": "ait-e 스타링크 마리타임 리셀러"}, {"title": "[LIG D&A 50년-63] 미래 위한 역량 강화 및 인프라 투자 확대", "summary": "LIG넥스원이 미래 역량 강화와 인프라 투자를 위해 우주사업부 조직을 개편했다. 우주사업부 1팀은 정지궤도와 항공용 SAR을, 2팀은 저궤도와 지상체 등을 담당하며 위성 사업 분야의 수주 경쟁력을 높이고 있다. 국내 방산 기업의 위성 인프라 투자 동향이다.", "source": "thebigdata.co.kr", "date": "2026-09-03 08:46", "url": "http://www.thebigdata.co.kr/view.php?ud=202609030151236989570d99e4c8_23", "category": "contract", "importance": 3, "wl": false, "topic": "lig넥스원 우주사업부 개편"}, {"title": "비쉐이, 히트싱크 없이 고전력 구현하는 박막 고주파 칩 저항기 출시", "summary": "비쉐이가 히트싱크 없이 고전력을 구현하는 박막 고주파 칩 저항기를 출시했다. 해당 제품은 저궤도 위성, 기지국 터미널, 5G 및 6G 네트워크, 안테나 등 RF 인프라 통신 애플리케이션에 적합하다. 차세대 통신 장비용 부품 개발 소식이다.", "source": "etnews.com", "date": "2026-09-03 08:42", "url": "https://www.etnews.com/20260901000221", "category": "tech", "importance": 3, "wl": false, "topic": "비쉐이 저궤도 위성 고주파 칩"}, {"title": "위성 170만기 시대 온다는데… 지구 궤도 ‘우주 교통’ 비상", "summary": "스타링크 등 대규모 저궤도 위성망 확대로 지구 궤도의 혼잡이 가속화되고 있다. 파편 충돌 위험과 전파 주파수 혼잡 심화 가능성이 제기되며 우주 교통 관리에 비상이 걸렸다. 위성 통신 급증에 따른 부작용을 경고하는 보도이다.", "source": "biz.chosun.com", "date": "2026-09-03 06:01", "url": "https://biz.chosun.com/science-chosun/science/2026/09/03/7HRPQEAE5FHHXAF2BWQ43KGSE4/?utm_source=naver&utm_medium=original&utm_campaign=biz", "category": "tech", "importance": 3, "wl": false, "topic": "스타링크 우주 쓰레기 교통체증"}, {"title": "우크라이나 전 장관 방산 창업… 팔란티어 CEO가 투자 주도", "summary": "우크라이나 전 장관의 방산 창업과 팔란티어 CEO의 투자가 주목받는 가운데, 스페이스X가 스타링크를 통해 러시아군의 위성 인터넷 서비스 이용을 차단한 조치가 높게 평가되었다. 전장 환경에서 위성 통신 통제의 중요성을 보여준다.", "source": "g-enews.com", "date": "2026-09-03 03:30", "url": "https://www.g-enews.com/view.php?ud=2026090220433795502bd56fbc3c_1", "category": "other", "importance": 3, "wl": false, "topic": "우크라이나 페도로프 스타링크 차단"}], "competitor": [{"title": "삼성물산, 스웨덴 SMR 사업 전략적 파트너 선정…유럽 교두보 확보", "summary": "삼성물산이 스웨덴 소형모듈원자로(SMR) 신규 원전 사업의 전략적 파트너로 선정되었습니다. GVH와 공동 EPC로 참여해 SMR 4기를 건설할 예정입니다. 이번 수주를 통해 유럽 시장의 교두보를 확실히 확보하게 되었습니다. 글로벌 원전 시장에서의 경쟁력을 입증하는 대형 딜입니다.", "source": "매일경제 IT", "date": "2026-09-03 16:26", "url": "https://www.mk.co.kr/news/realestate/12143496", "category": "contract", "importance": 5, "wl": true, "topic": "삼성물산 수주"}, {"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도가 국가 안보 우려를 이유로 레거시 중국산 통신 장비의 철거 및 교체를 검토하고 있습니다. 국가 안보를 강화하고 자국 내 통신망의 신뢰성을 높이기 위한 조치로 풀이됩니다. 화웨이 등 중국산 장비 의존도를 낮추려는 글로벌 규제 흐름과 맥을 같이 합니다. 글로벌 장비 시장의 경쟁 구도에 큰 파장을 미칠 수 있는 사안입니다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도정부 규제"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "바이트댄스가 중국 네이멍구에 대규모 AI 데이터센터 건설을 추진한다. 해당 지역에는 통신장비 업체 화웨이를 비롯해 콰이서우, 알리바바, 애플 등이 컴퓨팅 시설 관련 투자를 진행한 바 있다. 대규모 인프라 투자로 글로벌 빅테크와 장비사들의 수주 경쟁이 예상된다.", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "contract", "importance": 4, "wl": false, "topic": "바이트댄스 네이멍구 ai 데이터센터"}, {"title": "美 '팍스 실리카' 맞불…中, 제3세계로 AI 인프라 확장", "summary": "중국이 제3세계로 AI 인프라 확장을 꾀하며 미국에 맞불을 놓고 있다. 광통신 및 ESS 등 일부 공급망에서 중국 기업의 비중이 높은 가운데 화웨이와 창신메모리테크놀로지가 핵심 반도체 국산화에 속도를 내고 있다. 글로벌 기술 패권 경쟁 구도가 심화되고 있다.", "source": "hankyung.com", "date": "2026-09-02 18:23", "url": "https://www.hankyung.com/article/2026090203721", "category": "tech", "importance": 4, "wl": false, "topic": "중국 화웨이 ai 인프라 확장"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 드론 실시간 추적 통신 기술을 공개하고 국내 정부 및 기업과의 협력을 모색한다. 6G와 AI 기능이 ISAC과 결합해 데이터 처리 효율성을 대폭 개선할 것이라는 전망을 내놓았다. 글로벌 통신장비 경쟁사의 최신 기술 방한 발표이다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 연말 드론 통신 기술 공개"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI 시대의 경쟁력은 네트워크에서 시작된다며 AI 랜, ISAC, 차별화된 커넥티비티로 이어지는 6G 기술 청사진을 제시했다. 에릭슨은 이러한 기술 리더십을 바탕으로 한국 고객 및 파트너와의 협력을 강화할 방침이다. 글로벌 장비사의 차세대 기술 비전 발표이다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 ai-ran isac 6g 청사진"}, {"title": "에이스테크놀로지, 항우연 저궤도 위성 통신 핵심 안테나 개발 수주", "summary": "에이스테크놀로지가 한국항공우주연구원이 추진하는 저궤도 위성 통신 자립화 사업에서 지상국용 능동위상배열안테나 개발 계약을 수주했다. 위성체 지상국 부문의 핵심 장비를 국산화하는 사업의 연장선이다. 국내 통신부품 업체의 기술력 입증 사례이다.", "source": "metroseoul.co.kr", "date": "2026-09-02 16:38", "url": "http://www.metroseoul.co.kr/article/20260902500539", "category": "contract", "importance": 4, "wl": false, "topic": "에이스테크 항우연 저궤도 위성 수주"}, {"title": "통신사도 통신장비도 AI로 달라진다…통신망 운영의 새 기준은 '예측'", "summary": "국내 통신사들이 AI를 활용해 네트워크 이상 징후를 사전에 감지하고 분석하는 시스템을 실제 운영에 적용하고 있다. 이에 발맞춰 에릭슨과 노키아 등 글로벌 통신장비 업체들도 AI 기반의 차세대 네트워크 운영 솔루션을 강화하고 있다. 통신망 운영의 새로운 기준이 제시되고 있다.", "source": "popcornnews.net", "date": "2026-09-02 15:50", "url": "http://www.popcornnews.net/news/articleView.html?idxno=131622", "category": "tech", "importance": 4, "wl": false, "topic": "통신사 에릭슨 노키아 ai 네트워크"}, {"title": "가성비 중국폰 옛말… 화웨이 ·샤오미 메모리난에 가격 일제히 올려", "summary": "중국 통신장비 업체 화웨이가 올해 상반기 매출이 전년 동기 대비 9.6% 늘어났으나 순이익은 36% 감소했다고 발표했다. R&D 비용 확대와 메모리 가격 상승이 수익성 악화에 영향을 미쳤다. 메모리난 속에서도 글로벌 시장에서 투자를 지속하는 전략을 보여준다.", "source": "sedaily.com", "date": "2026-09-02 06:01", "url": "https://www.sedaily.com/article/20086004?ref=naver", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 상반기 실적"}, {"title": "Ciena sees AI driving multi-year optical infrastructure investment cycle", "summary": "시에나는 AI가 네트워크 인프라의 다년간 재아키텍처를 촉진하여 대역폭 수요를 높이고 장거리 네트워크에서 데이터 센터 패브릭에 이르기까지 광섬유 연결의 중요성을 높이고 있다고 밝혔습니다. AI 구동에 따른 광인프라 투자의 지속적인 확대를 전망했습니다. 장비 제조사의 시장 전망을 보여줍니다.", "source": "RCR Wireless", "date": "2026-09-04 00:25", "url": "https://rcrwireless.com/20260903/connectivity/ciena-ai-optical", "category": "tech", "importance": 3, "wl": true, "topic": "시에나 기술"}, {"title": "Vodafone Follows Airtel: 5G Network Slicing Live with Minimum 15 Mbps Speeds - TelecomTalk", "summary": "보다폰이 에어텔의 뒤를 이어 최소 15 Mbps 속도를 보장하는 5G 네트워크 슬라이싱 상용 서비스를 개시했다. 이번 서비스는 특정 기업 및 응용 프로그램에 맞춤형 품질의 통신 환경을 제공한다. 통신 장비 경쟁사들의 고급화된 네트워크 기술 적용 사례로 주목된다.", "source": "TelecomTalk", "date": "2026-09-04 00:03", "url": "https://telecomtalk.info/vodafone-follows-airtel-5g-network-slicing-live/1011530/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 5g 네트워크 슬라이싱"}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "국내 중소 통신장비 업체 우리넷이 한국지능정보사회진흥원의 국책과제 주관기관으로 선정되어 16Tbps급 패킷-광-전달망 시스템을 실제 운용 환경에서 검증합니다. AI 네트워크 상용화를 위한 실증 사업으로 국산 장비의 성능과 안정성을 시험대에 올립니다. 국내 통신장비 기술 발전의 주요 사례입니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "tech", "importance": 3, "wl": true, "topic": "우리넷 기술"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "알에프텍이 5G 통신 장비 및 방산 RF 기술 경쟁력 강화를 위해 연구개발 조직을 자회사 'RFTC'로 분리한다. 이달 중 조직 정비를 마치고 5G 안테나·필터 기술 고도화와 방산 사업 확대에 나선다. 국내 통신 장비 및 부품 업체의 R&D 구조 개편이다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "tech", "importance": 3, "wl": false, "topic": "알에프텍 r&d 자회사 분리"}, {"title": "국내외 통신사 CAPEX 절감 및 인프라 투자 정체… 통신 장비 테마 약세 흐...", "summary": "국내외 통신사의 CAPEX 절감과 인프라 투자 정체로 인해 통신 장비 테마가 약세 흐름을 보이고 있다. 단순한 5G 망 구축 수혜를 넘어 데이터센터, 위성통신, 광통신 등 새로운 성장 분야에서의 실제 수주와 매출 확보가 중요해졌다. 통신 장비 시장의 투자 트렌드 진단이다.", "source": "pinpointnews.co.kr", "date": "2026-09-03 14:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=483544", "category": "earnings", "importance": 3, "wl": false, "topic": "통신 장비 테마 약세 분석"}, {"title": "화웨이 코리아가 한국 대학생 9명을 선전으로 부른 이유는", "summary": "화웨이 코리아가 한국 대학생 9명을 선전 본사로 초청했다. 반도체와 통신 장비 소프트웨어 분야에서 우수한 인력과의 초기 접점을 넓혀 기술 협력 기반을 다지기 위한 행보다. AI와 5G 분야의 글로벌 인재 생태계 조성을 위한 전략이다.", "source": "econovill.com", "date": "2026-09-02 10:40", "url": "https://www.econovill.com/news/articleView.html?idxno=749636", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 코리아 한국 대학생 초청"}, {"title": "Minnesota operator taps MoCA Access tech to connect MDUs", "summary": "미국 미네소타 지역 사업자인 쇼버그가 인코엑스 및 노키아와 협력하여 MoCA 액세스 기술로 MDU에 기가비트 속도를 구현했습니다. 이번 프로젝트는 다가구 주택 거주자들에게 고속 초고속인터넷 서비스를 제공합니다. 노키아의 유선 액세스 솔루션 경쟁력을 보여주는 사례입니다. 북미 지역 통신 인프라 개선에 기여하고 있습니다.", "source": "Light Reading", "date": "2026-09-03 23:13", "url": "https://www.lightreading.com/broadband/minnesota-operator-taps-moca-access-tech-to-connect-mdus", "category": "contract", "importance": 2, "wl": true, "topic": "노키아 수주"}, {"title": "Ericsson Adaptive Inventory", "summary": "에릭슨의 적응형 인벤토리 솔루션에 대한 내용입니다. 네트워크 운영의 효율성을 높이고 자산 관리를 최적화하기 위한 소프트웨어 및 솔루션 관련 소개입니다. 글로벌 장비 제조사의 기술 포트폴리오를 보여줍니다.", "source": "RCR Wireless", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-Channel", "category": "tech", "importance": 2, "wl": true, "topic": "에릭슨 기술"}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "유럽 지역 동향으로 페어폰이 상반기 실적 호조에 힘입어 C라운드 투자 유치에 나섰습니다. 스파크와 헬라스 샛은 양자 내성 보안을 도입했으며 노키아는 사우디아라비아에서 네트워크 자동화를 개발하고 에릭슨은 FIS와의 협력을 통해 핀테크 제안을 강화했습니다. 유럽 통신 및 장비 업계의 다양한 기술 발전 소식입니다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "https://www.lightreading.com/smartphones-devices/eurobites-fairphone-opens-series-c-funding-round-after-happy-h1", "category": "other", "importance": 2, "wl": true, "topic": "페어폰 투자"}], "policy": [{"title": "Bell faces up to $10 million in penalties after defying CRTC order to stop selling locked ", "summary": "캐나다 통신사 벨이 잠금 해제된 단말기 판매 중단 CRTC 명령을 위반하여 최대 1000만 달러의 벌금 처분을 받게 되었다. 규제 당국의 지침을 어긴 통신사에 대한 강력한 제재 조치이다. 통신 규제 준수 및 정책적 처벌의 대표적 사례이다.", "source": "Yahoo! Finance Canada", "date": "2026-09-03 00:30", "url": "https://ca.finance.yahoo.com/news/bell-faces-10-million-penalties-153000094.html", "category": "policy", "importance": 4, "wl": false, "topic": "벨 캐나다 crtc 규제 위반 벌금"}, {"title": "ICT기금 내년에도 14.8% 줄어든다…재원 개편 논의 불가피", "summary": "ICT기금의 핵심 위 정책 자문가는 AI 규제 체계가 지나치게 구속력 있기보다는 기민해야 한다고 강조했습니다. 인도는 독립적인 AI 법안은 없지만 2026년 2월 정보통신 개정을 통해 AI와 딥페이크 규제 규범을 마련했습니다.", "source": "ET Telecom", "date": "2026-09-03 16:55", "url": "https://telecom.economictimes.indiatimes.com/news/policy/ai-regulatory-regime-should-be-nimble-not-over-constraining-top-pm-advisor/133729523", "category": "policy", "importance": 2, "wl": true, "topic": "인도정부 규제"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에 프라이빗 5G를 배포하기 위한 새로운 계획을 마련했으나 주파수 할당에 대한 구체적인 내용은 포함되지 않았습니다. 기업들의 자율적인 도입을 유도하려 하지만 핵심 자원인 주파수 문제가 해결되지 않아 실효성에 의문이 제기됩니다. 중국의 산업용 통신 정책의 현주소를 보여줍니다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 2, "wl": true, "topic": "중국정부 규제"}, {"title": "Non-banks seek clarity, exemption for supply-chain finance from RBI", "summary": "인도중앙은행(RBI)의 회전식 신용 발행 금지 초안 규제에 대해 비은행 금융기관들이 공급망 금융에 대한 명확한 지침과 면제를 요구하고 있습니다.", "source": "Mint", "date": "2026-09-02 19:54", "url": "https://www.livemint.com/industry/banking/nonbanks-seek-clarity-exemption-for-supply-chain-finance-from-rbi-11788338751938.html", "category": "policy", "importance": 1, "wl": true, "topic": "인도중앙은행 규제"}], "carrier": [{"title": "Elliott Management builds Deutsche Telekom stake, opposes possible T-Mobile merger - repor", "summary": "행동주의 펀드 엘리엇 마이닝턴이 도이치텔레콤의 지분을 확보하고 향후 T모바일과의 합병 추진에 반대 입장을 표명했다. 글로벌 통신사의 지배구조와 대형 M&A 전략을 둘러싼 주주 간 갈등이 불거지고 있다. 주요 통신사 관련 대형 지분 투자 및 전략 이슈이다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:17", "url": "https://www.datacenterdynamics.com/en/news/elliott-management-builds-deutsche-telekom-stake-opposes-possible-t-mobile-merger-reports/", "category": "other", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분 확보"}, {"title": "통신3사, “AI 네트워크는 국가 전략 인프라, 지원책 절실” 한목소리", "summary": "통신 3사가 AI 네트워크를 국가 전략 인프라로 규정하고 정부의 적극적인 지원책을 촉구했다. 5G SA와 6G 등 신기술 투자가 필요한 시점이나 시장 성정 정체로 새로운 수익 창출이 어려운 상황이다. 네트워크 정책의 패러다임 전환과 정부 지원의 필요성이 강조되었다.", "source": "kidd.co.kr", "date": "2026-09-03 17:40", "url": "https://kidd.co.kr/news/247290", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 ai 네트워크 지원 촉구"}, {"title": "SKT·KT·LGU+, 정부에 '네트워크 투자' 지원 촉구", "summary": "SK텔레콤, KT, LG유플러스 통신 3사가 정부를 향해 네트워크 및 6G 투자 인프라에 대한 정책적 지원을 촉구했다. AI 네트워크를 국가 전략 인프라로 지정하고 현장 실증과 초기 투자로 연결해야 한다는 목소리가 나왔다. 통신사의 차세대 망 투자 부담 완화 요구이다.", "source": "bloter.net", "date": "2026-09-03 15:58", "url": "https://www.bloter.net/news/articleView.html?idxno=672549", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 네트워크 투자 지원 촉구"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "SK텔레콤과 LG유플러스가 망 투자 재개 움직임을 보이는 가운데 AI-RAN 기술 실증 사업을 추진한다. SK텔레콤은 정부 사업에 참여해 삼성전자, 에릭슨, 노키아 등과 기지국 및 AI 결합 기술을 검증할 예정이다. 국내 통신사의 차세대 네트워크 실증 협력 프로젝트이다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "contract", "importance": 4, "wl": false, "topic": "sk텔레콤 ai-ran 실증"}, {"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "이통3사가 세제, 주파수, 규제 등 네트워크 및 AI 데이터센터(AIDC) 투자를 위한 패키지 지원을 건의했다. 과기정통부 통신정책기획과장은 민관협의체에서 적극 논의하겠다고 화답하며 3G 종료 등 투자 여력 확보 방안을 검토하기로 했다. 정부와 통신사의 차세대 인프라 정책 협의이다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 4, "wl": false, "topic": "이통3사 네트워크 aidc 지원 요구"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "3G 레거시 네트워크를 유지하면서 5G SA나 6G에 투자하는 부담을 줄이기 위해 정부 지원이 필요하다는 의견이 제시됐다. 과기정통부는 새로운 서비스 창출을 위한 네트워크 투자 편익을 고려해 제도 개선을 검토할 방침이다. 차세대 네트워크 전환을 위한 정책 간담회 내용이다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 4, "wl": false, "topic": "ai 네트워크 고도화 정부 지원"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "AI-RAN, 6G 등 차세대 네트워크 투자 확대와 관련해 기지국 중심 CAPEX 지표를 보완해야 한다는 주장이 나왔다. 국가전략기술 사업화시설 세액공제 대상에 개방형 시설을 포함하는 등 제도적 인프라 보완이 논의되고 있다. 통신 인프라 투자를 위한 세제 지원 개편 요구이다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 차세대 네트워크 투자 지원"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "AI 트래픽 폭증에 대비해 5G SA, AI-RAN, 6G 등에 대한 투자 지원과 네트워크의 국가 AI 인프라 지정을 촉구했다. 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토하겠다고 밝혔다. AI 시대 국가 네트워크 경쟁력 강화를 위한 정책 토론회이다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 ai 트래픽 네트워크 지원"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "통신 3사가 망 투자가 늘고 수익성이 악화되는 상황에서 5G SA나 6G 투자 효율성을 높이기 위한 정책 재정비를 요구했다. 3G 종료 등을 포함해 통신사의 투자 여력을 확보하기 위한 규제 개선 논의가 이어지고 있다. AI 시대 통신 정책 패러다임 전환 촉구이다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai시대 네트워크 정책"}, {"title": "\"5G·6G도 국가전략자산\"… 통신 3사, AI 네트워크 투자 지원 촉구", "summary": "국회 정책 간담회에서 SK텔레콤, KT, LG유플러스 통신 3사가 5G SA, AI-RAN, 6G뿐만 아니라 해저케이블과 저궤도 위성까지 AI 네트워크 투자를 지원해 달라고 촉구했다. 국가전략자산인 통신망 고도화를 위한 정책적 지원 필요성이 제기되었다. 국내 주요 통신사의 전략적 요구 사항이다.", "source": "newscj.com", "date": "2026-09-02 17:36", "url": "https://www.newscj.com/news/articleView.html?idxno=3429661", "category": "policy", "importance": 4, "wl": false, "topic": "통신 3사 ai 네트워크 투자"}, {"title": "AI시대 네트워크 투자 해법...\"규제·세제 전면 손질\"", "summary": "KT와 LG유플러스 등 통신사 대외협력 담당자들이 AI 시대 차세대 네트워크에 대한 세액공제와 정부 보조금, 공공 수요 확보 지원을 강조했다. 해저케이블과 저궤도 위성 등 미래 네트워크에 대한 세제 지원과 주파수 정책 정비가 시급하다는 입장이다. 정부와 통신업계 간의 정책 조율 과정이다.", "source": "zdnet.co.kr", "date": "2026-09-02 17:35", "url": "https://zdnet.co.kr/view/?no=20260902165531", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 ai 네트워크 세제 지원"}, {"title": "통신3사 \"AI 강국 도약…투자 인센티브, 제도 체계화 필요\"", "summary": "통신 3사가 AI 시대에 요구되는 유무선 지상망을 선제적으로 확충할 수 있도록 투자 인센티브 마련을 요구했다. 해저케이블 및 저궤도 위성 통신도 AI 핵심 인프라에 포함시켜 달라는 입장을 전달했다. 통신사들의 망 투자 부담 완화 요구를 다룬다.", "source": "newsway.co.kr", "date": "2026-09-02 16:32", "url": "https://www.newsway.co.kr/news/view?ud=2026090215431389718", "category": "policy", "importance": 4, "wl": false, "topic": "통신 3사 ai 인프라 투자 인센티브"}, {"title": "통신3사 \"AI망 지원\" 요구…정부, 세제·규제·AIDC 지원 추진(종합)", "summary": "KT가 차세대 네트워크 범위를 지상 유무선망에서 해저케이블과 저궤도 위성까지 육·해·공으로 확대해 정책 지원해야 한다고 주장했다. 통신3사는 초고속·초저지연·고신뢰 AI 인프라 구축을 위한 정부의 적극적인 역할을 촉구했다. 통신사들의 대정부 정책 건의 내용이다.", "source": "news1.kr", "date": "2026-09-02 16:21", "url": "https://www.news1.kr/it-science/cc-newmedia/6277634", "category": "policy", "importance": 4, "wl": false, "topic": "통신 3사 육해공 ai망 지원"}, {"title": "통신3사 \"AI 인프라 지원 넓혀달라\" 과기부 \"투자 여력 부족하진 않아\"", "summary": "통신 3사가 세제 혜택과 인센티브 제도를 활성화하고 해저케이블 및 저궤도 위성망까지 지원 범위를 넓혀달라고 요구했다. 이에 대해 과기부는 통신사들의 투자 여력이 부족하지 않다는 입장을 밝혔다. 통신망 투자를 둘러싼 업계와 정부 간의 시각차가 드러났다.", "source": "metroseoul.co.kr", "date": "2026-09-02 16:12", "url": "http://www.metroseoul.co.kr/article/20260902500514", "category": "policy", "importance": 4, "wl": false, "topic": "통신 3사 ai 인프라 지원 과기부"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계 전문가들이 통신사의 AI 네트워크(NW for AI) 투자를 촉진하기 위해 망 중립성 가이드라인 정비, 주파수 할당 대가 및 전파사용료 인하가 필요하다고 제언했다. 통신 인프라 투자를 유인하기 위한 정책적 인센티브 마련이 시급하다는 지적이다. 통신 규제 및 비용 부담 완화 요구이다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 ai 네트워크 투자 지원"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "통신사가 부담하는 연간 약 8000억 원의 주파수 할당 대가와 2000억 원의 전파사용료를 절감하여 설비 및 AI 인프라 투자로 연계할 필요성이 제기됐다. 국회 토론회에서 통신망 투자 유인을 위한 정책적 비용 부담 완화가 논의되었다. 통신 규제 비용 절감 및 투자 연계 방안이다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 4, "wl": false, "topic": "통신망 투자 유인 aidc 지원"}, {"title": "\"HBM·AIDC만 AI 인프라 아냐\"…통신3사 \"네트워크 투자 지원해야\"", "summary": "AI 반도체와 데이터센터뿐만 아니라 5G SA, AI-RAN, 6G 등 통신망과 해저케이블, 저궤도 위성 등 네트워크 인프라 전반에 대한 투자를 지원해야 한다는 통신 3사의 목소리가 커지고 있다. 이용자와 산업 현장을 연결하는 통신 인프라의 중요성이 강조되고 있다.", "source": "news1.kr", "date": "2026-09-02 15:09", "url": "https://www.news1.kr/it-science/cc-newmedia/6277550", "category": "policy", "importance": 4, "wl": false, "topic": "통신 3사 네트워크 투자 지원"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신사들이 주파수 할당 대가, 전파사용료, 무선국 검사 수수료 등으로 연간 약 1조 원에 달하는 규제 비용을 부담하고 있다. 6G 상용화와 AI 네트워크 투자가 본격화되는 시점에서 과도한 정책적 비용이 투자의 걸림돌로 작용한다는 지적이다. 통신사 규제 비용 부담 완화 촉구이다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 규제비용 1조원 부담"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "AI 3대 강국 도약을 위해 주파수 할당 대가와 전파사용료 등 정책성 비용의 부담을 낮춰 민간 투자 확대로 이어지도록 제도를 재검토해야 한다는 의견이 모였다. AIDC 투자를 끌어내기 위한 시행령 정비 등 세부 지원책이 논의되었다. AI 인프라 확충을 위한 규제 혁신 토론회이다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 4, "wl": false, "topic": "ai 인프라 민간투자 지원 확대"}, {"title": "[4th-AI] \"AI 3대 강국 가려면 통신망 규제 풀고 AIDC 지원 체계 손봐야\"", "summary": "AI 3대 강국 도약을 위해 통신망 규제를 풀고 연간 2000억 원에 달하는 전파사용료 등 통신사 부담 비용을 투자 여력 관점에서 재검토해야 한다고 강조했다. 전파 관리 목적 외에 과도한 비용 구조를 개선해 투자를 유도해야 한다는 주장이다. 통신 규제 혁신 및 투자 활성화 요구이다.", "source": "4th.kr", "date": "2026-09-02 12:24", "url": "http://www.4th.kr/news/articleView.html?idxno=2117312", "category": "policy", "importance": 4, "wl": false, "topic": "통신망 규제 완화 aidc 지원"}, {"title": "AI가 네트워크를 바꾼다…\"통신망 투자 수익성 확보해야\"", "summary": "AI 시대에 필요한 유·무선 네트워크를 선제적으로 확충하기 위해 투자세액공제 확대, 주파수 할당 대가 및 전파사용료 부담 완화 등의 인센티브 마련이 제안됐다. 통신사의 투자 수익성을 확보하고 선제적 망 투자를 유도하기 위한 제도적 지원책 요구이다.", "source": "koit.co.kr", "date": "2026-09-02 11:18", "url": "https://www.koit.co.kr/news/articleView.html?idxno=208798", "category": "policy", "importance": 4, "wl": false, "topic": "ai 네트워크 투자 인센티브"}, {"title": "AT&T goes to the mat over Charter's use of 'fiber-powered' label for HFC", "summary": "AT&T가 차터의 HFC 네트워크 기반 광대역 서비스에 대해 '파이버 파워드'라는 표현을 사용하는 것이 소비자를 오도하는 허위 광고라며 소송을 제기했습니다. 광고 감시 단체의 판정 이후 이어진 법적 공방입니다. 통신사 간의 마케팅 용어 및 서비스 품질을 둘러싼 경쟁이 법정 소송으로 비화되었습니다. 유무선 서비스의 브랜딩 전략에 영향을 미치는 사안입니다.", "source": "Light Reading", "date": "2026-09-02 00:55", "url": "https://www.lightreading.com/broadband/at-t-goes-to-the-mat-over-charter-s-use-of-fiber-powered-label-for-hfc", "category": "policy", "importance": 4, "wl": true, "topic": "at&t 규제"}, {"title": "VodafoneThree intros tiered 5G SA slicing portfolio for consumers, enterprises, critical s", "summary": "보다폰오이즈가 영국에서 소비자 및 기업을 위한 패스트트랙 5G SA 슬라이싱 서비스 포트폴리오를 출시하고 인터넷 TV 서비스를 선보였습니다. 차별화된 네트워크 성능을 제공하여 가입자를 확보하려는 전략입니다. 5G 상용화의 핵심 수익원 창출 모델로 슬라이싱을 적극 활용하고 있습니다. 통신사의 서비스 다각화를 보여줍니다.", "source": "RCR Wireless", "date": "2026-09-04 00:21", "url": "https://rcrwireless.com/20260903/5g/vodafonethree-tiered-5g-sa-slicing-enterprises-critical-services", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰오이즈 수주"}, {"title": "울산 시내버스, 차세대 와이파이로 싹 바꾼다", "summary": "울산시가 시내버스 762대의 노후 와이파이 장비를 철거하고 5G 백홀 기반의 차세대 '와이파이7'로 전면 교체한다. 이를 통해 통신 품질을 높이고 실시간 장애 대응 효율성을 개선할 방침이다. 공공 교통 서비스의 통신 인프라 고도화 사업이다.", "source": "ujeil.com", "date": "2026-09-03 20:46", "url": "http://www.ujeil.com/news/articleView.html?idxno=391509", "category": "contract", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이 교체"}, {"title": "40 AI agents are already in use for clients. TELUS Digital will host demos at Dreamforce. ", "summary": "텔러스 디지털이 고객 서비스를 위한 40개의 AI 에이전트를 실무에 도입해 운영 중이다. 드림포스 행사에서 관련 기술 데모 시연을 진행할 예정이며 AI 기반 혁신을 가속화하고 있다. 통신사 자회사의 디지털 전환 및 AI 활용 사례이다.", "source": "Stock Titan", "date": "2026-09-03 19:45", "url": "https://www.stocktitan.net/news/TU/telus-digital-to-host-agentforce-industry-sessions-and-exclusive-b7osxigv9b4p.html", "category": "tech", "importance": 3, "wl": false, "topic": "텔러스 디지털 ai 에이전트"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 AWS의 얀 호프마이어를 차기 최고기술책임자(CTO)로 임명했습니다. 클라우드 전문 인재 영입을 통해 네트워크와 IT 인프라의 융합을 가속화할 방침입니다. 경영진 교체를 통해 디지털 전환 전략에 박차를 가하고 있습니다. 글로벌 통신사의 기술 리더십 변화를 보여줍니다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 경영진"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 AI-RAN 네트워크 전환 기술을 검증했다. 로봇, 드론 등 피지컬 AI 장비가 시험망과 5G 망을 이동하는 상황을 구현하여 무선 환경 변화에도 최적의 네트워크를 자동 선택하도록 했다. 국내 통신사의 차세대 무선접속망 기술 실증이다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai-ran 검증"}, {"title": "[봇규의 헬로BOT] ‘피지컬 AI 1강’으로 ② | 실증은 늘렸다, 근데 산업...", "summary": "제조 장비, 로봇, 자율주행 등 실제 환경에서 움직이는 피지컬 AI를 위해 5G 단독모드(SA)와 AI 무선접속망(AI-RAN)을 산업 현장에 구축하는 실증이 진행되고 있다. 산업용 네트워크의 안정성과 자율 운영 효율성을 높이기 위한 기술 적용이다. 차세대 네트워크 인프라 활용 동향이다.", "source": "hellot.net", "date": "2026-09-03 00:08", "url": "https://www.hellot.net/news/article.html?no=114727", "category": "tech", "importance": 3, "wl": false, "topic": "피지컬 ai 5g sa ai-ran"}, {"title": "Vi Gets a New Look: Unveils 3D Brand Identity and Teases Major Transformation With Shah Ru", "summary": "인도 통신사 보다폰 인도가 새로운 3D 브랜드 아이덴티티를 공개하고 대규모 경영 혁신을 예고했다. 유명 배우 샤룩 칸을 기용하여 대대적인 마케팅 공세에 나설 예정이다. 통신사의 이미지 쇄신과 가입자 확보 전략의 일환이다.", "source": "PaidFreeDroid", "date": "2026-09-02 20:01", "url": "https://paidfreedroid.com/2026/09/vi-shah-rukh-khan-rebrand-3d-logo-network-change.html/amp", "category": "other", "importance": 3, "wl": false, "topic": "보다폰 인도 브랜드 개편"}, {"title": "HPE scores Wi-Fi and AI goals as 5G and VMware lose out", "summary": "영국 런던의 토트넘 홋스퍼 스타디움이 Wi-Fi 7과 AI 기능을 갖춘 HPE 기술로 수백만 달러 규모의 업그레이드를 완료했습니다. 5G와 VMware가 부진한 사이 HPE가 무선 및 AI 목표를 달성했습니다. 대규모 경기장의 고성능 네트워크 구축 사례입니다. 차세대 무선랜 기술의 실제 적용을 보여줍니다.", "source": "Light Reading", "date": "2026-09-02 15:00", "url": "https://www.lightreading.com/wifi/hpe-scores-wi-fi-and-ai-goals-as-5g-and-vmware-lose-out", "category": "tech", "importance": 3, "wl": true, "topic": "hpe 통신사"}, {"title": "Vodafone Idea shares jump 3% after brand revamp, Shah Rukh Khan joins as ambassador - Zee ", "summary": "보다폰 인도가 브랜드 개편을 단행하고 배우 샤룩 칸을 홍보대사로 영입한 후 주가가 3% 상승했다. 마케팅 전략 변화가 투자자들의 긍정적 반응을 이끌어내며 주가에 반영되었다. 통신사의 브랜드 리뉴얼 효과를 보여준다.", "source": "Zee Business", "date": "2026-09-02 14:21", "url": "https://www.zeebiz.com/market-news/news-vodafone-idea-shares-jump-3-after-brand-revamp-shah-rukh-khan-joins-as-ambassador-401527", "category": "other", "importance": 3, "wl": false, "topic": "보다폰 인도 주가 상승"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤이 통신 본업 회복과 함께 AI 가치가 부각되고 있다. 증권가에서는 신규 주파수 할당, 5G 요금제 개편, 5G SA 상용화와 함께 AI 기지국 보급 확대 정책이 논의될 것으로 전망했다. 통신사의 실적 개선 및 AI 신사업 성장 모멘텀이다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "other", "importance": 3, "wl": false, "topic": "sk텔레콤 통신 본업 회복 ai"}, {"title": "Vodafone Idea Unveils New Logo, Ropes In Shah Rukh Khan as Brand Face - HDFC Sky", "summary": "인도 통신사 보다폰 인도가 새로운 로고를 공개하고 발리우드 스타 샤룩 칸을 브랜드 얼굴로 영입했다. 브랜드 리브랜딩을 통해 시장 내 입지를 강화하고 가입자 유치에 나서고 있다. 통신사의 마케팅 및 경영 전략의 일환이다.", "source": "HDFC Sky", "date": "2026-09-02 13:10", "url": "https://hdfcsky.com/news/vodafone-idea-ropes-in-shah-rukh-khan-for-new-brand-identity-campaign", "category": "other", "importance": 3, "wl": false, "topic": "보다폰 인도의 브랜드 개편"}, {"title": "Jio, Airtel and Vi diverge on tariffs as consensus breaks down - Communications Today", "summary": "인도 주요 통신사인 지오, 에어텔, 비아이(Vi) 간의 요금 정책을 둘러싼 의견 일치가 깨지며 전략이 엇갈리고 있다. 각 통신사는 시장 점유율 확보와 수익성 개선을 위해 차별화된 요금제를 도입하고 있다. 인도 통신 시장의 경쟁 구도 변화를 보여주는 동향이다.", "source": "Communications Today", "date": "2026-09-02 12:15", "url": "https://www.communicationstoday.co.in/jio-airtel-and-vi-diverge-on-tariffs-as-consensus-breaks-down/", "category": "other", "importance": 3, "wl": false, "topic": "인도 통신사 요금 정책"}, {"title": "스테이지파이브, 로플랫 인수…제4이통 대신 ‘AI 통신’으로 승부", "summary": "제4이통사 무산 이후 스테이지파이브가 로플랫을 인수하며 알뜰폰 기반 'AI 통신'으로 승부수를 던졌다. 과기정통부의 주파수 할당 취소 이후 독자적인 AI 중심 통신 비즈니스 모델 구축을 추진하고 있다. 신흥 통신 사업자의 전략 선회 행보이다.", "source": "edaily.co.kr", "date": "2026-09-02 08:48", "url": "https://www.edaily.co.kr/News/Read?newsId=02794566645576184&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "other", "importance": 3, "wl": false, "topic": "스테이지파이브 로플랫 인수 ai"}, {"title": "JioHotstar debuts in UK, Canada, Singapore with a new slate", "summary": "지오핫스타가 영국, 캐나다, 싱가포르 등 글로벌 시장에 새로운 콘텐츠 라인업과 함께 공식 진출했습니다. 남아시아 디아스포라와 글로벌 시청자를 타깃으로 다양한 라이브 쇼와 콘텐츠를 제공합니다. 인도 통신 및 미디어 기업의 해외 시장 확장 전략을 보여줍니다.", "source": "Mint", "date": "2026-09-02 08:01", "url": "https://www.livemint.com/industry/media/jiohotstar-debuts-in-uk-canada-singapore-with-a-new-slate-11788250565743.html", "category": "contract", "importance": 3, "wl": true, "topic": "지오핫스타 수주"}, {"title": "Bharti Airtel Deploys 2,750+ New 5G Sites Across Gujarat in 12 Months - scanx.trade", "summary": "바르티 에어텔이 인도 구자라트주 전역에 12개월 동안 2,750개 이상의 신규 5G 기지국을 구축했다. 지속적인 네트워크 인프라 투자를 통해 커버리지와 서비스 품질을 확대하고 있다. 통신사의 적극적인 5G 망 확충 전략을 보여준다.", "source": "scanx.trade", "date": "2026-09-02 07:54", "url": "https://scanx.trade/stock-market-news/companies/bharti-airtel-expands-5g-network-with-2-750-sites-in-gujarat-launches-399-unlimited-data-plan/35795045", "category": "contract", "importance": 3, "wl": false, "topic": "바르티 에어텔 5g 기지국 구축"}, {"title": "Can Telus (TSX:T) Sustain Dividends Amid Telecom Headwinds? - Kalkine Media", "summary": "캐나다 통신사 텔러스가 통신 업계의 역풍 속에서도 배당금을 지속 지급할 수 있을지 재무적 관점에서 분석되었다. 업계 전반의 자본적 지출 부담과 수익성 정체 상황이 고려되었다. 통신사의 재무 건전성 및 주주 환원 정책에 대한 평가이다.", "source": "Kalkine Media", "date": "2026-09-02 04:40", "url": "https://kalkinemedia.com/ca/stocks/dividend/can-telus-tsxt-sustain-dividends-amid-telecom-headwinds", "category": "earnings", "importance": 3, "wl": false, "topic": "텔러스 배당 지속 가능성"}, {"title": "Charter CFO heading to Google-Blackstone data center JV", "summary": "차터의 CFO 제시카 피셔가 10월 15일부로 퇴사하여 구글의 커스텀 텐서 처리 장치를 활용하는 구글-블랙스톤 AI 데이터 센터 합작법인으로 합류합니다. 이에 따라 차터는 후임자 물색에 나섰습니다. 통신사 고위 임원의 AI 인프라 분야 이동을 보여줍니다. 업계 간 인재 이동의 흐름을 나타냅니다.", "source": "Light Reading", "date": "2026-09-02 03:54", "url": "https://www.lightreading.com/cable-technology/charter-cfo-heading-to-google-blackstone-data-center-jv", "category": "exec", "importance": 3, "wl": true, "topic": "차터 경영진"}, {"title": "TDS acquires Granite State Communications", "summary": "TDS 텔레커뮤니케이션이 그래니트 스테이트 커뮤니케이션의 광섬유 및 음성 사업 인수를 완료했습니다. 이번 인수로 뉴햄프셔 지역의 광섬유 서비스 주거지가 1만 1,000곳 이상 늘어났습니다. 지역 통신사의 인프라 확장 전략을 보여줍니다. 가입자 기반 확대에 기여할 것으로 기대됩니다.", "source": "Light Reading", "date": "2026-09-02 03:29", "url": "https://www.lightreading.com/fttx/tds-acquires-granite-state-communications", "category": "contract", "importance": 3, "wl": true, "topic": "tds 수주"}, {"title": "Bell offers $30/100GB win-back plan to some former customers - MobileSyrup", "summary": "캐나다 통신사 벨이 일부 이탈 고객을 대상으로 30달러에 100GB 데이터를 제공하는 리텐션 요금제를 선보였다. 가입자 방어와 경쟁사로의 이탈을 막기 위한 공격적인 마케팅 전략이다. 통신사 간의 가입자 유치 경쟁을 보여준다.", "source": "MobileSyrup", "date": "2026-09-02 02:34", "url": "https://mobilesyrup.com/2026/09/01/bell-30-100gb-win-back-plan-lucky-mobile-deal/", "category": "other", "importance": 3, "wl": false, "topic": "벨 캐나다 요금제 출시"}, {"title": "AT&T tops Ethernet Leaderboard amid ranking shakeup – Vertical Systems", "summary": "버티컬 시스템즈의 순위 개편에서 AT&T가 미국 이더넷 리더보드 최상위 자리를 유지했습니다. 이번 평가는 현지 통신 시장 내에서 AT&T의 강력한 네트워크 입지와 서비스 경쟁력을 입증합니다. 경쟁사들 간의 순위 변동 속에서도 선두를 지켰다는 점에서 의미가 있습니다. 통신사들의 기업용 이더넷 서비스 시장 구도를 보여줍니다.", "source": "Light Reading", "date": "2026-09-03 23:44", "url": "https://www.lightreading.com/broadband/at-t-tops-ethernet-leaderboard-amid-ranking-shakeup-vertical-systems", "category": "other", "importance": 2, "wl": true, "topic": "at&t 실적"}, {"title": "SmarTone chairman warns over revenue slide", "summary": "홍콩 통신사 스마톤의 회장이 수익 감소에 대해 경고하며 사업을 대폭 강화해야 한다고 밝혔습니다. 시장 환경 악화 속에서 실적 부진을 타개하기 위한 경영 전략 수정이 불가피할 것으로 보입니다. 통신사의 수익성 개선과 향후 대응 방향에 업계의 이목이 쏠립니다. 아시아 지역 통신 시장의 실적 동향을 보여줍니다.", "source": "Light Reading", "date": "2026-09-03 23:37", "url": "https://www.lightreading.com/5g/smartone-chairman-warns-over-revenue-slide", "category": "earnings", "importance": 2, "wl": true, "topic": "스마톤 실적"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": "영국 등 유럽 지역에서 보다폰오이즈가 북아일랜드에 5G 단독모드(SA)를 도입했습니다. 이와 함께 SMS 블래스터 차단 기술 및 오렌지의 인프라 프라이빗 5G 수요 대응 계획이 발표되었습니다. 노키아의 새로운 API 고객 확보 소식도 함께 전해졌습니다. 유럽 통신사들의 5G 고도화 경쟁을 보여줍니다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 2, "wl": true, "topic": "보다폰 실적"}, {"title": "Deepika Pillai: Leading People Through the AI Shift | TELUS Digital - Business Viewpoint M", "summary": "텔러스 디지털의 임원 디피카 필라이가 인공지능 전환 시기를 맞아 조직을 이끄는 리더십과 전략에 대해 인터뷰했다. AI 시대로의 전환에 따른 기업 문화와 인재 관리 방안을 다루고 있다. 통신사 자회사의 경영 혁신 관련 내용이다.", "source": "Business Viewpoint Magazine", "date": "2026-09-03 16:28", "url": "https://businessviewpointmagazine.com/deepika-pillai-telus-digital/", "category": "other", "importance": 2, "wl": false, "topic": "텔러스 디지털 임원 인터뷰"}, {"title": "[댓글리뷰] \"기내 와이파이 확산되면 비행기모드 사라질까?\"", "summary": "항공기 내부에서 로컬 장비와 통신하거나 지상 이동통신망을 직접 찾는 기내 와이파이 및 통신 기술이 논의되고 있다. 유럽에서는 항공기 내부에 '피코셀'이라는 소형 이동통신 기지국을 설치해 기내 5G 서비스를 제공하고 있다. 이동통신 커버리지 확장 기술에 대한 설명이다.", "source": "ddaily.co.kr", "date": "2026-09-03 10:47", "url": "https://www.ddaily.co.kr/page/view/2026090215364923049", "category": "tech", "importance": 2, "wl": false, "topic": "항공기 기내 피코셀 통신"}, {"title": "Cable One's carrier services unit beefs up wholesale ordering system", "summary": "케이블원의 도매 연결 사업부인 스파크라이트 캐리어 서비스가 주문 관리 플랫폼을 간소화했습니다. ISP와 모바일 사업자를 위한 도매 연결성 및 미들·라스트마일 연결 서비스를 제공합니다. 주문 프로세스 효율화를 통해 고객 편의성을 높이고 있습니다. 북미 유선 및 도매 통신 시장의 운영 효율화 동향입니다.", "source": "Light Reading", "date": "2026-09-03 05:59", "url": "https://www.lightreading.com/cable-technology/cable-one-s-carrier-services-unit-beefs-up-wholesale-ordering-system", "category": "other", "importance": 2, "wl": true, "topic": "케이블원 수주"}, {"title": "Vodafone Idea 3GB Per Day Prepaid Plans in September 2026: Detailed - TelecomTalk", "summary": "인도 통신사 보다폰 인도의 일 3GB 제공 선불 요금제 세부 내용이 공개되었다. 가입자들의 데이터 소비 패턴에 맞춘 요금 상품 구성 정보를 담고 있다. 통신사의 소비자 대상 모바일 서비스 요금제 현황이다.", "source": "TelecomTalk", "date": "2026-09-03 03:05", "url": "https://telecomtalk.info/vodafoneidea-3gb-per-day-prepaid-plans-september2026/1011466/", "category": "other", "importance": 1, "wl": false, "topic": "보다폰 인도 선불 요금제"}, {"title": "Helium seeks new heights for Wi-Fi offload model", "summary": "헬륨의 CEO 마리오 디 디오가 통신사, MVNO, 리테일 브랜드가 무선 연결을 출시하고 관리할 수 있는 새로운 플랫폼에 대해 논의했습니다. 탈중앙화 무선 네트워크 모델의 확장을 목표로 하고 있습니다. 새로운 형태의 무선 통신 비즈니스 모델을 제시합니다.", "source": "Light Reading", "date": "2026-09-02 21:49", "url": "https://www.lightreading.com/wifi/helium-seeks-new-heights-for-wi-fi-offload-model", "category": "other", "importance": 1, "wl": true, "topic": "헬륨 통신사"}, {"title": "Reliance Jio Rs 445 vs Rs 450 Plan: Which Plan Makes More Sense - TelecomTalk", "summary": "인도 통신사 릴라이언스의 445루피 요금제와 450루피 요금제의 혜택을 비교 분석했다. 가입자에게 더 유리한 요금 상품을 선택하기 위한 가이드를 제공한다. 통신사의 요금 경쟁 및 마케팅 전략 관련 내용이다.", "source": "TelecomTalk", "date": "2026-09-02 10:30", "url": "https://telecomtalk.info/reliancejio-rs445-plan-vs-rs450-plan-sense/1011418/", "category": "other", let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
