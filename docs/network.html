<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

<header>

준비하는 위성통신 사업자들의 비용 부담이 커지고 있다.", "source": "zdnet.co.kr", "date": "2026-09-12 07:40", "url": "https://zdnet.co.kr/view/?no=20260912073508", "category": "policy", "importance": 3, "wl": false, "topic": "인도 위성통신 주파수"}, {"title": "애플, 아이폰14·15·16 위성 SOS 무료 기간 1년 더 연장…아이폰16 첫 포...", "summary": "애플이 아이폰의 위성 SOS 무료 서비스 기간을 1년 더 연장했다. 이상적인 조건에서 메시지 전송에 시간이 걸리며 장애물이 있을 경우 지연될 수 있어, 통신이 끊기는 오프그리드 환경에서 유용하게 활용된다.", "source": "wikitree.co.kr", "date": "2026-09-12 03:12", "url": "https://www.wikitree.co.kr/articles/1158964", "category": "carrier", "importance": 3, "wl": false, "topic": "애플 위성sos"}, {"title": "[책의 향기]두 억만장자 경쟁에 우주를 맡겨도 되나", "summary": "스페이스X가 스타링크 위성을 다수 발사하며 상업 우주산업의 최전선을 열고 있다. 이러한 우주산업 경쟁의 배경에는 민간 기업들의 적극적인 투자와 기술 발전이 자리 잡고 있다. 우주 통신 및 위성 인프라 확장이 가속화되면서 관련 시장의 경쟁 구도가 급변하고 있다. 향후 글로벌 통신 및 위성 네트워크 시장 전반에 미칠 파급효과가 주목된다.", "source": "donga.com", "date": "2026-09-12 01:43", "url": "https://www.donga.com/news/Culture/article/all/20260911/134652585/2", "category": "tech", "importance": 3, "wl": false, "topic": "스페이스x 상업 우주산업"}, {"title": "하늘서도 무료 와이파이… 출장 직장인들 ‘쉴 틈’ 없겠네", "summary": "대한항공과 아시아나항공이 오는 15일부터 스페이스X의 저궤도 위성 인터넷 스타링크를 도입한다. 일부 국제선의 이코노미를 포함한 전 좌석에 기내 초고속 와이파이를 무료로 제공할 예정이다. 저궤도 위성 기반의 통신 서비스가 항공업계로 빠르게 확산되는 추세를 보여준다. 승객들의 기내 연결성이 대폭 향상될 것으로 기대된다.", "source": "chosun.com", "date": "2026-09-12 00:35", "url": "https://www.chosun.com/economy/industry-company/2026/09/12/4A53DVMCPNG3HNDOZNT6VIPBTQ/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "대한항공 스타링크"}, {"title": "아시아나항공, 15일부터 '무료 스타링크' 띄운다", "summary": "아시아나항공이 15일부터 저궤도 위성 네트워크 기반의 스타링크 기내 와이파이 서비스를 시작한다. 기존 위성 인터넷보다 빠르고 안정적인 연결 환경을 구축하여 OTT 스트리밍과 게임 등을 지원한다. 기내 환경에서의 대용량 데이터 전송과 클라우드 협업이 가능해진다. 항공사들의 기내 통신 서비스 경쟁이 한층 심화될 것으로 보인다.", "source": "tournews21.com", "date": "2026-09-11 17:54", "url": "https://www.tournews21.com/news/articleView.html?idxno=143319", "category": "tech", "importance": 3, "wl": false, "topic": "아시아나항공 스타링크"}, {"title": "글로벌 6G , 2030년부터 단계적 상용화 전망..대만 움직임은?", "summary": "대만 정부 고위 관계자가 글로벌 6G가 2030년부터 단계적으로 상용화될 전망에 맞춰 지상 이동통신과 위성 네트워크를 긴밀하게 통합하는 6G 준비를 서둘러야 한다고 강조했다.", "source": "choicenews.co.kr", "date": "2026-09-11 09:40", "url": "http://www.choicenews.co.kr/news/articleView.html?idxno=171174", "category": "tech", "importance": 3, "wl": false, "topic": "대만 6g"}, {"title": "[인터뷰] 페카 라우릴라 ICEYE 공동창업자 “韓 우주정보 주권 확보하려...", "summary": "ICEYE 공동창업자가 한국의 우주정보 주권 확보의 중요성을 강조했다. 저궤도 위성 군집 운용을 통해 특정 지역의 재촬영 주기 단축이 가능하다. 다수의 위성을 활용한 효율적인 관측 시스템 구축이 필수적이다. 글로벌 우주안보 및 정보 수집 역량 강화 방안으로 군집위성이 주목받고 있다.", "source": "biz.chosun.com", "date": "2026-09-13 06:01", "url": "https://biz.chosun.com/it-science/ict/2026/09/13/SUXHMZIEMNB3TNUKYQLEYV24O4/?utm_source=naver&utm_medium=original&utm_campaign=biz", "category": "tech", "importance": 2, "wl": false, "topic": "iceye 우주정보"}, {"title": "007이 보는 인공 위성 영상 '블랙스카이'를 아시나요", "summary": "블랙스카이는 지구 저궤도에 초소형 관측 위성을 띄워 주요 전략 거점을 실시간 감시하는 기업이다. 인공지능(AI)을 활용해 항만, 공항, 국경 등 주요 시설의 사진을 분석한다. 시간 단위의 반복 촬영으로 정밀한 상황 인식이 가능하다. 상업용 초소형 위성 시장의 기술력을 보여주는 사례다.", "source": "mt.co.kr", "date": "2026-09-13 05:16", "url": "https://www.mt.co.kr/stock/2026/09/13/2026091305144622667", "category": "tech", "importance": 2, "wl": false, "topic": "블랙스카이 위성"}, {"title": "[이주의 법안] 美는 우주사관학교, 中은 우주몽…韓의 우주외교는?", "summary": "러시아-우크라이나 전쟁에서 상업용 저궤도 위성 통신망이 전장에서 활용된 사례가 안보적 중요성을 부각시켰다. 우주 자산이 단순 경제 영역을 넘어 국가 안보와 직결되는 핵심 자산으로 자리 잡았다. 이에 따라 한국의 우주외교 및 위성 인프라 확보 전략의 필요성이 제기된다. 주요국들의 우주 안보 경쟁이 더욱 치열해지고 있다.", "source": "sisajournal.com", "date": "2026-09-12 07:05", "url": "https://www.sisajournal.com/news/articleView.html?idxno=386966", "category": "policy", "importance": 2, "wl": false, "topic": "우주외교 안보"}, {"title": "케이앤에스아이앤씨, 한화시스템과 군용 저궤도 맨팩 안테나 시제품 개...", "summary": "케이앤에스아이앤씨가 한화시스템과 군용 저궤도 맨팩 안테나 시제품 개발 및 납품을 진행했다. 이번 납품을 계기로 국내 방산업체와의 협력을 강화하고 위성통신체계 사업을 본격화할 계획이다. ESA 기반의 차세대 군용 통신 장비 시장 진입을 추진하고 있다. 방산 분야 위성 안테나 공급망 다변화에 기여할 전망이다.", "source": "gukjenews.com", "date": "2026-09-11 21:08", "url": "https://www.gukjenews.com/news/articleView.html?idxno=3692630", "category": "tech", "importance": 2, "wl": false, "topic": "케이앤에스아이앤씨 안테나"}, {"title": "[오늘의 항공] 에어서울·아시아나항공·대한항공", "summary": "에어서울과 아시아나항공, 대한항공 등이 스타링크 저궤도 위성 네트워크 기반의 기내 인터넷 서비스를 다룬다. 비행 중 끊김 없는 OTT 스트리밍, 대용량 파일 전송 등을 지원하는 안정적인 환경을 제공한다. 항공기 내 네트워크 고도화가 전 그룹 차원으로 확산되는 양상이다. 고객 서비스 품질 향상에 기여할 것으로 보인다.", "source": "financialreview.co.kr", "date": "2026-09-11 17:12", "url": "http://www.financialreview.co.kr/news/articleView.html?idxno=44799", "category": "tech", "importance": 2, "wl": false, "topic": "에어서울 스타링크"}], "competitor": [{"title": "美 검찰, 화웨이 에 '범죄 기업' 직격…영업비밀·이란 제재 쟁점", "summary": "미국 검찰이 중국 통신장비 업체 화웨이를 상대로 한 형사재판에서 회사를 범죄 기업으로 규정하고 영업비밀 탈취와 대이란 제재 위반, 금융사기 혐의를 강하게 제기했다. 글로벌 통신장비 시장에서 화웨이의 법적 리스크와 제재 압박이 한층 가중되고 있다.", "source": "digitaltoday.co.kr", "date": "2026-09-11 11:44", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=699944", "category": "exec", "importance": 5, "wl": false, "topic": "화웨이 사법리스크"}, {"title": "Zankore to build Indonesia's first AI factory with $3.1B funding", "summary": "인도네시아에서 IOH, 엔비디아, 노키아가 공동 설립한 합작법인 잔코레가 31억 달러 규모의 자금 조달에 성공했다. 이번 자금은 1기가와트 규모의 AI 팩토리 및 네오 클라우드 플랫폼 초기 구축에 투입될 예정이다. 노키아는 인프라 파트너로서 인공지능 기반의 통신 및 클라우드 생태계 확장에 기여하고 있다.", "source": "Light Reading", "date": "2026-09-11 20:54", "url": "https://www.lightreading.com/data-centers/zankore-to-build-indonesia-s-first-ai-factory-with-3-1b-funding", "category": "contract", "importance": 4, "wl": true, "topic": "노키아 수주"}, {"title": "Nokia alert to risks as it puts AI agents into mobile core", "summary": "노키아가 모바일 코어 제품군에 AI 에이전트 기능을 탑재한 신규 서비스를 선보였다. 통신사들은 이를 통해 'AI 네이티브' 특화 기능을 사전에 체험하고 네트워크 운영 효율화를 검토할 수 있게 됐다. 통신 장비 벤더들의 핵심망 지능화 경쟁이 본격화되고 있다.", "source": "Light Reading", "date": "2026-09-11 16:30", "url": "https://www.lightreading.com/ai-machine-learning/nokia-alert-to-risks-as-it-puts-ai-agents-into-mobile-core", "category": "tech", "importance": 4, "wl": true, "topic": "노키아 ai코어"}, {"title": "삼성 'SW 네트워크 '·LG 'AI-특화망'…차세대 네트워크 경쟁", "summary": "삼성전자 네트워크사업부가 버라이즌 상용망에서 에너지 세이빙 매니저 애플리케이션을 적용해 최대 35%의 에너지 절감 효과를 확인했다. 국내 사업자들과의 데모 시연을 통해 차세대 네트워크 시장에서 AI 및 에너지 절감 기술 경쟁력을 입증하고 있다.", "source": "etnews.com", "date": "2026-09-11 15:03", "url": "https://www.etnews.com/20260911000253", "category": "tech", "importance": 4, "wl": false, "topic": "삼성전자 네트워크"}, {"title": "[현장] AI-RAN 얼라이언스 \" 6G 시대 ISAC·NTN 중요해질 것\"", "summary": "AI-RAN 얼라이언스 행사에서 6G 시대의 ISAC(통신·센싱 통합)과 NTN(비지상 네트워크)의 중요성이 강조됐다. 엔비디아, 마이크로소프트, 에릭슨, 노키아, 소프트뱅크와 함께 삼성전자와 SK텔레콤, KT 등이 참여해 기술 연구와 생태계 조성을 논의했다.", "source": "itdaily.kr", "date": "2026-09-11 12:00", "url": "https://www.itdaily.kr/news/articleView.html?idxno=241544", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g"}, {"title": "中 정치무대 전면에 등장한 ‘치링허우 세대’ [김규환의 핸디 차이나]", "summary": "중국 첨단산업의 중심지인 선전시를 조명하는 기사에서 중국 최대 통신장비 업체인 화웨이가 대표적인 지역 기업으로 언급되었다.", "source": "dailian.co.kr", "date": "2026-09-13 07:02", "url": "https://www.dailian.co.kr/news/view/1689534/?sc=Naver", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 첨단산업"}, {"title": "인텔리안테크, 글로벌 국방용 안테나 첫 수주…409억 규모", "summary": "인텔리안테크가 409억 원 규모의 글로벌 국방용 안테나 초도 수주를 달성했다. 저궤도 위성 서비스를 활용해 적의 전파 교란이나 장애 발생 시에도 통신 복원력을 유지할 수 있다. 원격 작전 환경에 필수적인 군용 통신 체계를 안정적으로 공급하게 된다. 글로벌 방산 및 위성 통신 시장에서의 입지를 더욱 공고히 하고 있다.", "source": "bloter.net", "date": "2026-09-11 17:08", "url": "https://www.bloter.net/news/articleView.html?idxno=673448", "category": "contract", "importance": 3, "wl": false, "topic": "인텔리안테크 국방 수주"}], "policy": [{"title": "\"한숨 돌린 中 광모듈\"… 美 FCC 장비 승인 개정서 '데이터센터 광트랜...", "summary": "미국 FCC가 통신장비 인증 절차 개정안을 최종 승인·발표했다. 이번 규정 개정의 핵심은 커버드 리스트에 등재된 화웨이, ZTE 등 특정 해외 기업의 장비가 규제 대상에 포함되면서도 데이터센터 광트랜시버 같은 부품은 블랙리스트 규제를 비껴가 관련 기업 주가가 반등하는 계기가 되었다.", "source": "g-enews.com", "date": "2026-09-13 06:06", "url": "https://www.g-enews.com/view.php?ud=2026091300083842940c8c1c064d_1", "category": "policy", "importance": 5, "wl": false, "topic st flight for 1,600-satellite LEO network", "summary": "릴라이언스 지오가 2027년 9월 저궤도 위성 네트워크 테스트를 목표로 위성 통신 사업을 추진 중임.", "source": "ET Telecom", "date": "2026-09-08 10:43", "url": "https://telecom.economictimes.indiatimes.com/news/portal-in-portal/satcom/reliance-jio-eyes-september-2027-test-flight-for-1600-satellite-leo-network/133903064", "category": "tech", "importance": 4, "sid": "satellite", "topic": "릴라이언스 지오 위성"}, {"title": "KT·KAIST, 피지컬 AI로 자동화 공장 만든다 - 조선일보", "summary": "KT와 KAIST가 피지컬 AI 기술을 활용하여 자동화 공장 구축을 추진함. 산업용 AI 네트워크 기술의 실질적 적용 사례로 주목됨.", "source": "조선일보", "date": "2026-09-08 10:39", "url": "https://www.chosun.com/economy/tech_it/2026/09/08/ZHKU76C3E5GBRP2ETCEIN2JWOQ/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt ai"}, {"title": "삼성전자, 美 특허 전략 강화…\"AI·6G·메모리 IP 영토 확장\" - 비즈월드", "summary": "삼성전자가 AI, 6G, 메모리 분야의 특허 전략을 강화합니다. 차세대 통신 기술 및 IP 영토 확장을 통해 글로벌 경쟁력을 확보하려는 전략입니다.", "source": "비즈월드", "date": "2026-09-08 10:22", "url": "http://www.bizwnews.com/news/articleView.html?idxno=145549", "category": "tech", "importance": 4, "sid": "satellite", "topic": "삼성전자 6g 전략"}, {"title": "막대한 AI 인프라 투자 규모…GSMA가 SKT 주목한 이유", "summary": "GSMA가 SK텔레콤의 AI 인프라 투자 방식을 주목함. 외부 자본 활용 및 그룹사 역량 결합을 통해 AI 데이터센터(AIDC) 구축의 통제권을 유지하면서 효율적인 투자를 진행하는 전략이 업계의 모범 사례로 평가됨. 통신사의 인프라 확장 모델로서 의미를 지님.", "source": "ZDNet Korea", "date": "2026-09-08 10:03", "url": "https://zdnet.co.kr/view/?no=20260908100356", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai 인프라"}, {"title": "애플 폴더블 출격 임박…삼성, 글로벌서 '웰컴 투 폴더블'", "summary": "삼성전자가 갤럭시Z폴드8 시리즈를 활용한 글로벌 옥외 광고 캠페인을 진행한다. 애플 첫 폴더블폰 공개가 임박한 시점에 세계 주요 도시에서 갤럭시 폴드 브랜드와 제품 경쟁력을 다시 부각하려는 의도로 풀이된다. 삼성전자는 세계 주요 랜드마크에서 '웰컴 투 폴더블' 캠페인을 전개한다.", "source": "전자신문", "date": "2026-09-08 09:57", "url": "https://www.etnews.com/20260908000095", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 폴더블 광고"}, {"title": "India joins US-led global initiative to shape next-generation 6G networks 5", "category": "policy", "importance": 4, "sid": "policy", "topic": "ofcom 광케이블 전환 마일스톤"}, {"title": "SK브로드밴드, DC 떼내자 성장재원 논란…SKT는 1.88조 확보 - PRESS9", "summary": "SK브로드밴드가 데이터센터(DC) 사업을 떼어내어 독립시키는 구조 개편을 단행한 가운데, 모회사 SK텔레콤이 1.88조 원 규모의 성장 재원을 확보하게 되었다. AI 및 클라우드 인프라 사업 투자를 위한 대규모 자본 재배치다. 통신 대기업의 대형 지배구조 및 사업 재편 딜이다.", "source": "PRESS9", "date": "2026-09-09 16:46", "url": "http://www.press9.kr/news/articleView.html?idxno=82485", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk브로드밴드 데이터센터 분할 및 sk텔레콤 재원 확보"}, {"title": "경찰 보급 보디캠 ‘중국산’ 의혹…KT컨소시엄 수사 - ichannela.com", "summary": "경찰청이 보급한 보디캠 사업에 중국산 장비가 국산으로 둔갑해 납품되었다는 의혹과 관련해 KT컨소시엄에 대한 경찰 수사가 진행 중이다. 공공 통신·보안 장비 조달 과정의 규제 위반 및 납품 비리 의혹을 다룬다. 대형 컨소시엄 사업의 법적 리스크다.", "source": "ichannela.com", "date": "2026-09-09 16:31", "url": "https://ichannela.com/news/detail/000000549534.do", "category": "policy", "importance": 4, "sid": "carrier", "topic": "경찰 보디캠 중국산 의혹 kt컨소시엄 수사"}, {"title": "Huawei heads to trial in US over Iran deals - The Arkansas Democrat-Gazette", "summary": "화웨이가 이란과의 불법 거래 및 대북제재 위반 등 혐의와 관련해 미국 법정에 출두하여 본격적인 재판을 받게 됐다. 글로벌 사업 과정에서의 제재 회피 혐의가 주요 쟁점이다. 화웨이의 사법 리스크가 중대 국면에 접어들었다.", "source": "The Arkansas Democrat-Gazette", "date": "2026-09-09 16:31", "url": "https://www.arkansasonline.com/news/2026/sep/09/huawei-heads-to-trial-in-us-over-iran-deals/", "category": "other", "importance": 4, "sid": "competitor", "topic": "화웨이 이란 거래 미국 재판 회부"}, {"title": "Huawei feels the enduring love of Spain's telcos – to EU's horror", "summary": "유럽연합의 강력한 퇴출 압박과 제재 노력에도 불구하고, 스페인 총리가 유용한 동맹으로 자리 잡으면서 현지 통신사들은 화웨이 장비를 열성적으로 도입하고 있다. 스페인 통신사들은 EU의 반대에도 불구하고 화웨이와의 오랜 협력 관계를 유지하며 네트워크 구축을 지속하고 있다. 이러한 행보는 유럽 전역의 대중국 통신장비 제재 기조와 대조를 이루며 글로벌 장비 시장의 경쟁 구도에 변수로 작용하고 있다. 스페인 통신 시장에서의 화웨이 입지 유지는 경쟁사들의 유럽 내 점유율 확대 전략에 타격을 줄 수 있다.", "source": "Light Reading", "date": "2026-09-09 16:30", "url": "https://www.lightreading.com/regulatory-politics/huawei-feels-the-enduring-love-of-spain-s-telcos-to-eu-s-horror", "category": "contract", "importance": 4, "sid": "competitor", "topic": "화웨이 스페인 수주"}, {"title": "Nokia Selected by Planters Broadband Cooperative to Build AI-ready Fiber Network for Under", "summary": "", "source": "NewswireToday", "date": "2026-09-09 16:00", "url": "https://www.newswiretoday.com/news/186832/Nokia-Selected-by-Planters-Broadband-Cooperative-to-Build-AI-ready-Fiber-Network-for-Underserved-Communities-in-Southeast-Georgia/", "category": "policy", "importance": 4, "sid": "competitor", "topic": ""}, {"title": "AT&T Business adds Amazon Leo to managed connectivity range - Telecompaper", "summary": "AT&T 비즈니스가 관리형 연결 서비스 범위에 아마존 레오 저궤도 위성 브로드밴드를 추가했다. 기업 고객의 네트워크 탄력성을 높이기 위한 전략적 행보이다. 위성통신 기반 상용 서비스의 저변이 확대되고 있다.", "source": "Telecompaper", "date": "2026-09-09 15:57", "url": "https://www.telecompaper.com/news/att-business-adds-amazon-leo-to-managed-connectivity-range--1582143", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 위성통신"}, {"title": "Satellite Broadband In India Gets Push As DCC Approves Spectrum Usage Charges - Swarajya", "summary": "", "source": "Swarajya", "date": "2026-09-09 15:37", "url": "https://swarajyamag.com/news-brief/satellite-broadband-in-india-gets-push-as-dcc-approves-spectrum-usage-charges", "category": "policy", "importance": 4, "sid": "policy", "topic": ""}, {"title": "KT클라우드, AI 데이터센터 1GW 확장…전력·구축 경쟁력 함께 키운다 - 위키리크스한국", "summary": "KT클라우드가 AI 데이터센터 용량을 1GW 규모로 대폭 확장하며 전력 인프라와 구축 경쟁력을 동시에 키워나가고 있다. 폭증하는 AI 연산 및 클라우드 수요를 소화하기 위한 대규모 인프라 투자 전략이다.", "source": "위키리크스한국", "date": "2026-09-09 15:20", "url": "https://www.wikileaks-kr.org/news/articleView.html?idxno=191800", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai 데이터센터 확장"}, {"title": "Apple forays into India's business messasging segment with Reliance Jio", "summary": "애플이 지역 통신사들과의 파트너십을 통해 미국, 영국, 독일, 프랑스, 스페인 등 주요 시장에서 비즈니스 RCS 도입을 점진적으로 활성화하고 있으며, 릴라이언스 지오(Reliance Jio)와 손잡고 인도 비즈니스 메시징 시장에도 진출한다. 서비스 가격은 통신사가 결정하며 시장별로 상이하다. 통신사와 빅테크 간의 차세대 메시징 협력 사례다.", "source": "ET Telecom", "date": "2026-09-09 15:16", "url": "https://telecom.economictimes.indiatimes.com/news/devices/apple-forays-into-indias-business-messasging-segment-with-reliance-jio/133955927", "category": "contract", "importance": 4, "sid": "carrier", "topic": "애플 비즈니스 메시징"}, {"title": "Huawei Technologies faces racketeering trial in US - BGNES", "summary": "화웨이가 미국 시장 내 과거 사업 거래와 관련하여 조직범죄 혐의로 정식 재판에 회부됐다. 글로벌 통신장비 시장 구도에 영향을 미칠 법적 리스크다.", "source": "BGNES", "date": "2026-09-09 15:14", "url": "http://www.bgnes.com/economy/huawei-technologies-faces-racketeering-trial-in-us", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 내 조직범죄 혐의 재판 회부"}, {"title": "민주당, 배달수수료 상한제 입법 재시동…국감 앞두고 플랫폼 압박", "summary": "더불어민주당이 국정감사를 앞두고 배달 수수료 상한제 도입 등 배달 플랫폼 규제 입법을 재추진한다. 공정거래위원회도 자율규제 한계를 인정하며 법제화 가능성을 열어둔 상태로, 업계와 전문가들은 합리적인 비용 분담 방안 설계를 강조하고 있다.", "source": "전자신문", "date": "2026-09-09 15:07", "url": "https://www.etnews.com/20260909000254", "category": "policy", "importance": 4, "sid": "policy", "topic": "더불어민주당 배달플랫폼 규제"}, {"title": "\"美 통신망 뒤흔든 '솔트 타이푼', 25% 잔존 '화웨이 장비 '가 침투 교두...", "summary": "미국 통신망을 뒤흔든 '솔트 타이펀' 사태의 원인으로 잔존한 중국산 화웨이 장비가 지목됐다. 주요국들이 고위험 장비 퇴출을 제도화한 가운데 미국은 FCC를 통해 철거를 지원하고 있다. 국내에서도 통신망 보안 강화를 위한 제도적 대책이 촉구되고 있다.", "source": "weekly.hankooki.com", "date": "2026-09-09 15:04", "url": "https://weekly.hankooki.com/news/articleView.html?idxno=7183314", "category": "policy", "importance": 4, "sid": "policy", "topic": "솔트 타이펀 화웨이 장비 안보 위협"}, {"title": "NTT Docomo and PLDT demonstrate weather-controlled base stations - Telecompaper", "summary": "NTT도코모와 PLDT가 날씨 예보와 연동되는 친환경 기지국 기술을 시연했다. 재생에너지 활용도를 극대화하는 통신 장비 운영 기술이다. 차세대 기지국 운용 효율화 방안을 보여준다.", "source": "Telecompaper", "date": "2026-09-09 14:52", "url": "https://www.telecompaper.com/news/ntt-docomo-and-pldt-demonstrate-weather-controlled-base-stations--1582124", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 친환경 기지국 ce": 4, "sid": "satellite", "topic": "소프트뱅크 sceye haps 실증 실험"}, {"title": "FCC Returns $3.08 Billion to Treasury after Spectrum Auction Pays Off Rip-and-Replace Loan", "summary": "미국 FCC가 주파수 경매 수익을 활용해 화웨이 등 중국산 장비 퇴출(Rip-and-Replace) 대출 상환을 완료하고 남은 자금을 국고로 반환했다. 미 정부 차원의 중국산 통신장비 제재 및 보안 강화 정책의 일환이다. 글로벌 통신장비 시장에 큰 영향을 미친다.", "source": "Broadband Breakfast", "date": "2026-09-09 05:14", "url": "https://broadbandbreakfast.com/fcc-returns-3-08-billion-to-treasury-after-spectrum-auction-pays-off-rip-and-replace-loan/", "category": "policy", "importance": 4, "sid": "policy", "topic": "fcc 장비제거"}, {"title": "Verizon’s multi-billion Corning fiber supply deal supports fiber broadband, AI expansion -", "summary": "버라이즌의 다년간 수십억 달러 규모 코닝 광섬유 공급 계약은 광대역 통신망과 AI 인프라 확장을 지원한다. 데이터 트래픽 증가에 대응하기 위한 핵심 네트워크 투자다. 통신 장비 및 자재 수요를 크게 견인한다.", "source": "Lightwave Online", "date": "2026-09-09 05:02", "url": "https://www.lightwaveonline.com/home/press-release/55403609/verizons-multi-billion-corning-fiber-supply-deal-supports-fiber-broadband-ai-expansion", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 광섬유"}, {"title": "AT&T Business Expands Work with Amazon Leo for Resilient Connectivity - Via Satellite", "summary": "AT&T 비즈니스가 복원력 있는 연결성을 위해 아마존 Leo 위성과의 협력을 확대한다. 저궤도 위성을 활용한 기업용 브로드밴드 서비스를 강화하는 내용이다. 위성통신 시장에서의 경쟁 구도를 보여준다.", "source": "Via Satellite", "date": "2026-09-09 04:25", "url": "https://www.satellitetoday.com/connectivity/2026/09/08/att-business-expands-work-with-amazon-leo-for-resilient-connectivity/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at앤트 위성"}, {"title": "AT&T Business Customers to Get Amazon Leo Satellite Broadband... Eventually - PCMag UK", "summary": "AT&T 비즈니스 고객들이 향후 아마존 레오 위성 브로드밴드 서비스를 이용할 수 있게 된다. 위성 통신을 활용한 기업용 연결성 서비스가 확대된다.", "source": "PCMag UK", "date": "2026-09-09 04:09", "url": "https://uk.pcmag.com/networking/167148/att-business-customers-to-get-amazon-leo-satellite-broadband-eventually", "cate s/gurufocus:ce2c634c9094b:0-verizon-edged-lower-as-80-million-fiber-miles-chase-ai-traffic/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광케이블 계약"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - SDxCentral", "summary": "라쿠텐 심포니의 클라우드 RAN 기술이 타왈의 다중 통신사 실내망 구축에 적용됐다. 클라우드 기반 가상화 무선 접속망 솔루션의 상용화 성과다. 오픈랜 생태계 확장을 보여주는 대형 계약이다.", "source": "SDxCentral", "date": "2026-09-09 01:28", "url": "https://www.sdxcentral.com/news/rakuten-symphony-cloud-ran-tech-powers-tawals-multi-operator-indoor-network/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "라쿠텐 심포니 타왈 실내망 구축"}, {"title": "Verizon powers American AI with billions-strong Corning fiber deal - SDxCentral", "summary": "버라이즌이 수십억 달러 규모의 코닝 광섬유 계약을 통해 미국 내 AI 인프라 확장을 위한 통신망 동력을 확보했다. 대규모 광대역 투자를 통해 고도화된 연결성 서비스를 제공할 계획이다.", "source": "SDxCentral", "date": "2026-09-09 01:28", "url": "https://www.sdxcentral.com/news/verizon-powers-american-ai-with-billions-strong-corning-fiber-deal/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광섬유 계약"}, {"title": "Bell, Rogers and Telus Lead Canada’s Wi-Fi 7 Shift as Fibre Pulls Ahead - iPhone in Canada", "summary": "벨, 로저스, 텔러스 등 캐나다 주요 통신사들이 광케이블 인프라 확충과 함께 와이파이 7(Wi-Fi 7) 기술 도입을 주도하고 있습니다. 유무선 홈브로드밴드 고도화 트렌드를 보여줍니다.", "source": "iPhone in Canada", "date": "2026-09-09 01:25", "url": "https://www.iphoneincanada.ca/2026/09/08/bell-rogers-and-telus-lead-canadas-wi-fi-7-shift-as-fibre-pulls-ahead/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "캐나다 통신사 와이파이7 전환"}, {"title": "Verizon and Corning announce fiber agreement | About Verizon - Verizon", "summary": "버라이즌이 코닝과 대규모 광케이블 공급 계약을 체결했습니다. FTTP 광대역 인터넷망 구축과 AI 인프라 확장을 뒷받침하기 위한 수조 원 규모의 전략적 파트너십입니다. 고속 데이터 트래픽 증가에 대응하기 위한 핵심 네트워크 투자입니다. 통신사의 인프라 조달 및 장기 공급망 확보를 나타냅니다.", "source": "Verizon", "date": "2026-09-09 01:22", "url": "https://www.verizon.com/about/news/verizon-corning-broadband-ai-fiber-agreement", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 광케이블"}, {"title": "삼성전자, 프랑스 미스트랄 AI에 지분 투자…반도체 특화 AI 공동 개발", "summary": "삼성전자가 프랑스의 대표 AI 기업 '미스트랄 AI'에 지분 투자를 단행하고 반도체 특화 AI 모델을 공동 개발하기 위한 전략적 파트너십을 체결했다. 유럽의 AI 거점과의 협력을 통해 AI 경쟁력을 강화하려는 포석이다.", "source": "ZDNet Korea", "date": "2026-09-09 01:00", "url": "https://zdnet.co.kr/view/?no=20260908192706", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 미스트랄 ai 지분 투자 협력"}, {"title": "Verizon loads up on Corning's fiber for network expansion and AI infrastructure", "summary": "버라이즌은 네트워크 확장 및 인공지능(AI) 인프라 지원을 위해 코닝과 수십억 달러 규모의 광케이블 공급 계약을 체결했다. 계약에 따라 2027년부터 2032년까지 8000만 마일 이상의 광케이블을 공급받게 된다. 이번 대규모 투자는 버라이즌의 통신망 고도화와 AI 연계 인프라 구축 가속화를 위한 전략적 행보로 평가된다.", "source": "Light Reading", "date": "2026-09-09 00:56", "url": "https://www.lightreading.com/data-centers/verizon-loads-up-on-corning-s-fiber-for-network-expansion-and-ai-infrastructure", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 장비계약"}, {"title": "Ericsson says telco-grade AI RAN must deliver measurable gains at scale", "summary": "에릭슨의 전략적 RAN 리더십 총괄 가브리엘 포글란더는 RCR테크 텔코 AI 포럼에서 텔코급 AI RAN이 대규모 환경에서 측정 가능한 성과를 반드시 입증해야 한다고 강조했다. AI-RAN이 네트워크 전반에 AI를 내재화하는 광범위한 전환의 교두보 역할을 해야 한다는 설명이다. 글로벌 통신장비 경쟁사가 차세대 무선 접속망(RAN)과 AI의 결합 방향성을 제시한 핵심 발언이다. 삼성전자 네트워크사업부의 AI 기반 6G 및 차세대 네트워크 전략 수립에 시사점을 준다.", "source": "RCR Wireless", "date": "2026-09-09 00:44", "url": "https://rcrwireless.com/20260908/carriers/ericsson-ai-ran", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 ai"}, {"title": "Corning Secures Another Multi-Billion-Dollar Long-Term Deal with Verizon as AI Fiber Deman", "summary": "AI 광섬유 수요 증가 속에서 코닝이 버라이즌과 또 다른 수십억 달러 규모의 장기 계약을 체결했다. 통신 인프라 시장의 대형 수주 계약이다.", "source": "finance.biggo.com", "date": "2026-09-09 00:35", "url": "https://finance.biggo.com/news/b2d3dbda-4a06-4b4d-bc0d-7246a65f5c6e", "category": "contract", "importance": 4, "sid": "carrier", "topic": "코닝 버라이즌"}, {"title": "Digital Communications Commission approves TRAI recommendations on Satcom Spectrum - PGuru", "summary": "디지털통신위원회(DCC)가 위성통신(Satcom) 주파수에 대한 TRAI의 권고안을 최종 승인했습니다. 인도 내 위성통신 상용화를 위한 규제적 기반이 마련되었습니다. 위성 사업자들의 시장 진입이 가속화될 전망입니다. 통신 규제 환경의 큰 변화입니다.", "source": "PGurus", "date": "2026-09-09 00:33", "url": "https://www.pgurus.com/digital-communications-commission-approves-trai-recommendations-on-satcom-spectrum/", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도위성통신 정책"}, {"title": "Verizon and Corning announce multi-year, multi-billion dollar supply agreement for broadba", "summary": "버라이즌과 코닝이 광대역 통신망 구축을 위한 다년간 수십억 달러 규모의 대형 공급 계약을 체결했습니다. 미국 전역의 통신 인프라 현대화와 고속 인터넷 보급을 위한 핵심 물량입니다. 장비 공급업체와 통신사 간의 장기 파트너십을 재확인했습니다. 인프라 산업 전반에 안정적인 성장 동력을 제공합니다.", "source": "WebWire", "date": "2026-09-09 00:30", "url": "http://webwire.com/ViewPressRel.asp?SESSIONID=&aId=360172", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 다년간 공급 계약"}, {"title": "China’s Huawei Technologies faces racketeering trial in New York - Boston Herald", "summary": "중국 화웨이 테크놀로지가 미국 뉴욕 법원에서 조직범죄 혐의 관련 재판을 앞두고 있습니다. 미·중 기술 패권 갈등 속에서 화웨이의 법적 리스크가 심화되는 국면을 다룹니다.", "source": "Boston Herald", "date": "2026-09-09 00:28", "url": "https://www.bostonherald.com/2026/09/08/huawei-racketeering-trial/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 뉴욕 공판"}, {"title": "Stronger Connections, Smarter Growth: Spectrum and Southern Bank Build a Future-Ready Netw", "summary": "차터 커뮤니케이션스의 스펙트럼(Spectrum) 브랜드가 서던 뱅크와 손잡고 미래 지향적인 기업용 네트워크 인프라를 구축한다. 통신사의 B2B 인프라 서비스 확장 사례이다.", "source": "Charter Communications", "date": "2026-09-09 00:24", "url": "https://corporate.charter.com/newsroom/spectrum-fiber-internet-powers-southern-bank-growth", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터커뮤니케이션스 네트워크"}, {"title": "Verizon, Corning ink fibre supply deal - Mobile World Live", "summary": "버라이즌(Verizo e": "Lessons from a war zone: how Ukraine's Kyivstar harnesses Starlink to keep users online", "summary": "우크라이나 통신사 키이스타가 전시 상황에서 통신망 유지를 위해 스타링크 위성통신을 하이브리드 방식으로 도입했습니다. 750만 명 이상의 가입자가 지상망과 위성망을 결합한 시스템을 이용하고 있습니다. 이는 전시 상황에서 통신 인프라의 회복탄력성을 확보하기 위한 전략적 조치입니다.", "source": "Light Reading", "date": "2026-09-10 16:00", "url": "https://www.lightreading.com/satellite/lessons-from-a-war-zone-how-ukraine-s-kyivstar-harnesses-starlink-to-keep-users-online", "category": "tech", "importance": 4, "sid": "satellite", "topic": "키이스타 스타링크"}, {"title": "Nokia and Orange France complete first worldwide live service provider network tomography ", "summary": "노키아와 오렌지 프랑스가 세계 최초로 라이브 서비스 제공업체 네트워크 토모그래피 기술을 성공적으로 구현했다. 이 기술은 네트워크 내부의 트래픽 흐름을 정밀하게 분석하여 성능을 최적화한다. 노키아는 이번 성과를 통해 AI 기반 네트워크 관리 기술의 선두 주자임을 입증했다.", "source": "Nokia", "date": "2026-09-10 16:00", "url": "https://www.nokia.com/newsroom/nokia-and-orange-france-complete-first-worldwide-live-service-provider-network-tomography-trial-supporting-ai-ready-infrastructure/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 오렌지 협력"}, {"title": "KT, ‘AI 네트워크 ’ HD현대삼호 조선소에 깐다", "summary": "과기정통부와 NIA가 주관하는 고성능 AI 네트워크 기반조성 사업에 KT 컨소시엄이 참여한다. KT는 지난 7월 삼성전자, HD현대삼호 등과 함께 우선협상대상자로 선정되었다. 조선소 현장에 AI 네트워크를 적용해 산업용 통신 가치를 검증한다.", "source": "dailian.co.kr", "date": "2026-09-10 16:00", "url": "https://www.dailian.co.kr/news/view/1688943/?sc=Naver", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt hd현대삼호 고성능 ai 네트워크"}, {"title": "KT, 조선소에 'AI 용접로봇' 투입...AI 네트워크 산업현장 적용", "summary": "KT가 HD현대삼호 조선소에 AI 용접로봇을 투입하기 위한 고성능 AI 네트워크 구축 사업을 추진한다. KT는 지난 7월 삼성전자 등과 함께 우선협상대상자로 선정된 바 있다. AI를 활용해 통신망을 지능적으로 운영하고 피지컬 AI 환경을 제공한다.", "source": "fnnews.com", "date": "2026-09-10 15:57", "url": "https://www.fnnews.com/news/202609101533384918", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt hd현대삼호 ai 용접로봇 투입"}, {"title": "KT, HD현대삼호 조선소에 고성능 AI 네트워크 구축⋯피지컬 AI 실증 본격...", "summary": "KT가 과기 e": "전자신문", "date": "2026-09-10 14:17", "url": "https://www.etnews.com/20260910000282", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt lgu+ ai"}, {"title": "[단독] 라포랩스, SK스토아 인수 재시동…SK텔레콤과 SPA 체결", "summary": "라포랩스가 SK텔레콤과 SK스토아 인수를 위한 수정 주식매매계약(SPA)을 체결했습니다. 지난 7월 자진 철회 이후 재추진되는 건으로, 통신사의 비통신 자산 매각 전략의 일환입니다.", "source": "전자신문", "date": "2026-09-10 14:13", "url": "https://www.etnews.com/20260910000271", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 sk스토아 매각"}, {"title": "Verizon Waves Off Starlink, Bets On Cities And Old Phone Buildings - Stocktwits", "summary": "버라이즌이 스페이스X의 스타링크 등 위성통신 대신 도심 지역 및 기존 유선 인프라와 지상망 강화에 집중하는 전략을 고수하고 있다. 위성통신과 지상 통신 간 전략적 차이를 보여준다.", "source": "Stocktwits", "date": "2026-09-10 13:47", "url": "https://stocktwits.com/news-articles/markets/equity/verizon-waves-off-starlink-bets-on-cities-and-old-phone-buildings/cZt7idaRJCG", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 위성통신 전략"}, {"title": "“통신망에 남은 중국 통신 장비 정부 보안대책 필요”", "summary": "미국, 영국, 호주, EU 등 글로벌 주요국들이 중국산 통신 장비를 국가안보 및 공급망 위협 요소로 규정하고 퇴출을 제도화하고 있다. FCC의 철거 예산 지원과 영국의 2027년 시한 설정 등이 대표적이다. 국내에서도 통신망에 남은 고위험 장비에 대한 정부 차원의 보안 대책이 요구되고 있다.", "source": "knnews.co.kr", "date": "2026-09-10 13:40", "url": "https://www.knnews.co.kr/news/articleView.php?idxno=1550584", "category": "policy", "importance": 4, "sid": "policy", "topic": "글로벌 주요국 고위험 통신 장비 규제"}, {"title": "AI시대 新유형 특화망 발굴 착수…이용지침 만든다 - 전자신문", "summary": "과기정통부가 AI 시대에 대응하여 특화망(이음5G) 이용 지침을 마련하고 신유형 발굴에 착수합니다. 국내 통신 정책 및 규제 변화에 관한 내용입니다.", "source": "전자신문", "date": "2026-09-10 13:36", "url": "https://www.etnews.com/20260910000241", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 특화망"}, {"title": "\"AI로 위성 영상 실시간 분석\"…한화시스템, '우주AI 솔루션' 첫 선", "summary": "한화시스템이 우주항공 및 AI 분야 대규모 투자 계획의 일환으로 초저궤도 SAR 위성과 우주 AI 데이터센터, 저궤도 위성 통신망 구축 등에 약 20조원을 투입한다고 밝혔다. 위성 영상을 실제 의사결정에 활용하는 우주 AI 솔루션을 선보이며 관련 시장 공략에 나선다.", "source": "newsworks.co.kr", 이 주도하는 '모두의 AI' 컨소시엄에 합류했다. 통신사와 금융권이 협력하여 AI 생태계를 확장하는 대표적 B2B 서비스 개발 사례이다.", "source": "연합뉴스", "date": "2026-09-10 10:50", "url": "https://www.yna.co.kr/amp/view/AKR20260910055000002", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai컨소시엄"}, {"title": "Verizon And Corning Sign Multi-Billion-Dollar Fiber Deal For Broadband And AI Infrastructu", "summary": "버라이즌이 코닝과 광대역 및 AI 인프라 확장을 위해 수십억 달러 규모의 대형 광케이블 공급 계약을 체결했다. 이번 계약을 통해 8,000만 마일 이상의 고밀도 광섬유를 확보하여 초고속 인터넷 및 AI 데이터센터 트래픽에 대응한다. 양사는 수년에 걸친 파트너십을 통해 미국 전역의 네트워크 고도화를 가속화할 방침이다. 통신사의 대규모 인프라 투자 계약으로 업계 파급력이 크다.", "source": "Pulse 2.0", "date": "2026-09-10 10:42", "url": "https://pulse2.com/verizon-and-corning-sign-multi-billion-dollar-fiber-deal-for-broadband-and-ai-infrastructure/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광케이블 계약"}, {"title": "2027년 통신장비 쇼티지 온다∙∙∙한국 중견업체 반사이익 주목 - leadeconomy.co.kr", "summary": "2027년 글로벌 통신장비 시장에 심각한 공급 부족 현상이 닥칠 것으로 전망되면서 국내 중견 장비 및 부품 업체들의 반사이익이 주목받고 있습니다. AI 데이터센터 투자와 맞물려 통신 인프라 수요가 급증하는 반면 주요 벤더들의 생산 능력이 한계에 달할 것이라는 분석입니다. 관련 수혜주에 대한 기대감이 커지고 있습니다.", "source": "leadeconomy.co.kr", "date": "2026-09-10 10:31", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9652", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "통신장비 쇼티지 전망"}, {"title": "2027년 통신장비 쇼티지 온다∙∙∙한국 중견업체 반사이익 주목 - 리드경제", "summary": "2027년 글로벌 통신장비 시장에 공급 부족 쇼티지가 발생할 것으로 전망되는 가운데, 국내 중견 통신장비 및 부품업체들이 누릴 반사이익에 대한 기대감이 높아지고 있다. 장비 수급 불균형에 따른 업계 지형 변화 분석이다.", "source": "리드경제", "date": "2026-09-10 10:31", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9652", "category": "tech", "importance": 4, "sid": "competitor", "topic": "통신장비 쇼티지 전망 중견업체 반사이익"}, {"title": "Charter at Goldman Sachs conference: growth push after Cox deal - Investing.com", "summary": "차터 커뮤니케이션스가 골드만 삭스 컨퍼런스에서 콕스(Cox) 인수 거래 이후의 본격적인 성장 추진 전략을 밝혔다. 케이블 및 브로드밴드 사업자의 대규모 확장 계획을 가늠할 수 있다. 주요 통신사의 경영 전략 발표다.", "source": "Investing.com", " impress.co.jp", "summary": "도코모가 필리핀에서 태양광 이용률을 38%에서 61%로 높인 그린 기지국 실증 결과를 공개했다.", "source": "k-tai.watch.impress.co.jp", "date": "2026-09-10 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2139533.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt 도코모 pldt 그린 기지국 실증"}, {"title": "[石野純也の「スマホとお金」]5Gも光も使えて通信障害に強い、すぐにネットが使える新サービス「auひかりプラス」の隠れた魅力と裏側", "summary": "KDDI가 기존 광회선(FTTH)에 더해 4G와 5G 모바일 통신까지 하나의 계약으로 모두 지원하는 새로운 고정 통신 서비스 'au히かりプラス'를 도입한다. 유무선 통합 서비스를 통해 사용자가 루터를 가지고 즉시 통신을 시작할 수 있는 편의성을 제공한다. 일본 이동통신 시장에서 유무선 결합 및 신규 서비스 경쟁력을 강화하는 전략적 행보이다. 삼성전자의 일본 통신사 대상 장비 및 홈 게이트웨이 영업에 시사점을 준다.", "source": "ケータイ Watch", "date": "2026-09-10 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/column/value/2139538.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kddi 유무선 통합 서비스 au히かり플러스 도입"}, {"title": "ドコモ、フィリピンでグリーン基地局実証 太陽光利用率38％→61％ - ケータイ Watch", "summary": "도코모가 필리핀에서 친환경 기지국 실증을 통해 태양광 이용률을 대폭 끌어올렸다. 기지국 운영의 탄소 감축 효과를 입증했다. 통신 인프라의 친환경 전환 기술이다.", "source": "ケータイ Watch", "date": "2026-09-10 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2139533.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 친환경 기지국"}, {"title": "PLDT and DoCoMo demo base station energy innovation - Developing Telecoms", "summary": "PLDT와 도코모가 기지국 에너지 혁신을 위한 친환경 솔루션 데모를 공동 개최했다. 통신 장비의 전력 효율을 높이고 탄소 배출을 줄이기 위한 기술 협력이다.", "source": "Developing Telecoms", "date": "2026-09-10 00:00", "url": "https://developingtelecoms.com/telecom-technology/energy-sustainability/20798-pldt-and-docomo-demo-base-station-energy-innovation.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "도코모 친환경 기지국"}], "2026-09-11": [{"title": "US Plans to Push Huawei Out of Africa, Where It Holds 52% of the 5G Market - mediasat.info", "summary": "미국 정부가 5G 시장의 절반 이상을 장악하고 있는 아프리카 지역에서 화웨이의 영향력을 줄이기 위해 본격적인 견제와 대항마 지원에 나섰다. 중국산 통신장비 배제를 위한 지정학적 경쟁이 심화되는 양상이다.", "source": "mediasat.info", "date": "2026 ness/huawei-racketeering-trial/", "category": "policy", "importance": 5, "sid": "policy", "topic": "화웨이 미국 연방 재판 개시"}, {"title": "Iridium, Deutsche Telekom and Toyota Test NB-IoT Voice Messaging Over LEO Satellites - IoT", "summary": "이리듐, 도이치텔레콤, 도요타가 저궤도 위성을 이용한 NB-IoT 음성 메시지 테스트를 완료했습니다.", "source": "IoT Business News", "date": "2026-09-11 01:38", "url": "https://iotbusinessnews.com/2026/09/10/iridium-deutsche-telekom-and-toyota-test-nb-iot-voice-messaging-over-leo-satellites/", "category": "tech", "importance": 5, "sid": "satellite", "topic": "이리듐 위성통신"}, {"title": "Metro fiber, “kick-ass” 5G, a little DCI and D2D – AT&T sets its course", "summary": "AT&T가 구리선 네트워크를 철거하고 광섬유와 무선망을 핵심 사업으로 전환함. 위성 통합 및 기업용 서비스 확대를 통해 네트워크 고도화를 추진 중임. 주요 통신사의 인프라 전환 및 네트워크 투자 전략을 보여줌.", "source": "RCR Wireless", "date": "2026-09-11 22:55", "url": "https://rcrwireless.com/20260911/carriers/metro-fiber-kick-ass-5g-a-little-dci-and-d2d-att-sets-its-course", "category": "other", "importance": 4, "sid": "carrier", "topic": "at&t 전략"}, {"title": "Jio plans 1,600 satellites for Starlink-style internet: Report - The Hans India", "summary": "지오가 1,600개의 위성을 활용한 위성 인터넷 서비스를 계획하고 있습니다. 글로벌 위성 통신 시장의 경쟁이 가속화되고 있습니다.", "source": "The Hans India", "date": "2026-09-11 22:28", "url": "https://www.thehansindia.com/tech/jio-plans-1600-satellites-for-starlink-style-internet-report-1120857?utm_source=home&utm_medium=justIn", "category": "tech", "importance": 4, "sid": "satellite", "topic": "지오 위성 통신"}, {"title": "Trump administration lends $100M to US-owned cell phone network in Africa to expand Americ", "summary": "미국 행정부가 아프리카 지역에서 활동하는 미국계 통신망 사업자인 아프리카셀에 약 1억 달러 규모의 대출을 지원하여 통신 인프라 확장과 영향력 확대에 나선다.", "source": "The Edwardsville Intelligencer", "date": "2026-09-11 22:18", "url": "https://www.theintelligencer.com/news/world/article/trump-administration-lends-100m-to-us-owned-cell-22427032.php", "category": "contract", "importance": 4, "sid": "competitor", "topic": "미국 아프리카 통신망 대출 지원"}, {"title": "디지털 문해력 격차 해소 시 전 세계 GDP 성장에서 수조 달러 창출 가능", "summary": "화웨이가 협력하여 작성한 GSMA 인텔리전스 보고서가 유네스코 디지털 학습 주간에서 발표됐다. 모바일 광대역 커버리지 내에서도 3명 중 1명 이상이 디지털 문해력 부족으로 오프라인 상태에 머물러 있다는 연구 결과가 공개되었다. 글로벌 모바일 브로드밴드 보급과 디지털 격차 해소 정책에 시사점을 준다. 경쟁사인 화웨이의 글로벌 리포트 발표로 경영진 참고 가치가 있다.", "source": "ZDNet Korea", "date": "2026-09-11 22:10", "url": "https://zdnet.co.kr/view/?no=20260911221013", "category": "policy", "importance": 4, "sid": "policy", "topic": "화웨이 gsma보고서"}, {"title": "European telecoms are negotiating an alliance to offer satellite services - Inspenet", "summary": "유럽 주요 통신사들이 위성 서비스 제공을 위한 연합체 구성을 협상 중임. 위성통신 시장 경쟁력 확보를 위한 전략적 움직임임.", "source": "Inspenet", "date": "2026-09-11 22:04", "url": "https://inspenet.com/en/news/alliance-to-offer-satellite-services/", "category": "tech", "importance": 4, "sid": "satellite", "topic": "유럽 통신사 위성연합"}, {"title": "Newly formed (and funded) Rightfiber wants to build and buy its way to growth", "summary": "미국 라이트파이버가 16억 달러 규모의 신용 한도를 확보하며 네트워크 확장과 인수합병을 통한 성장을 추진합니다. 리터 커뮤니케이션즈와 그레이트 플레인스 커뮤니케이션즈의 통합 브랜드인 라이트파이버는 광대역 인프라 확충에 주력하고 있습니다. 이번 자금 조달은 지역 통신 시장의 경쟁 구도를 변화시킬 잠재력을 지니고 있습니다. 향후 공격적인 M&A와 망 고도화가 예상됩니다.", "source": "Light Reading", "date": "2026-09-11 22:00", "url": "https://www.lightreading.com/broadband/newly-formed-and-funded-rightfiber-wants-to-build-and-buy-its-way-to-growth", "category": "contract", "importance": 4, "sid": "carrier", "topic": "라이트파이버 투자"}, {"title": "Plus plans major network expansion in cooperation with Cellnex and Towerlink - Telecompape", "summary": "플러스(Plus)가 셀넥스 및 타워링크와 협력하여 대규모 네트워크 확장을 계획하고 있습니다.", "source": "Telecompaper", "date": "2026-09-11 21:25", "url": "https://www.telecompaper.com/news/plus-plans-major-network-expansion-in-cooperation-with-cellnex-and-towerlink--1582491", "category": "contract", "importance": 4, "sid": "carrier", "topic": "플러스 네트워크"}, {"title": "U.S. to Provide $100M Loan to Africell to Counter Huawei in Africa - dailybeirut.com", "summary": "미국 정부가 아프리카 통신 시장에서 화웨이의 지배력을 견제하기 위해 아프리카셀에 1억 달러 규모의 정책 자금 대출을 제공하기로 했다.", "source": "dailybeirut.com", "date": "2026-09-11 21:18", "url": "https://dailybeirut.com/en/business/us-to-provide-100m-loan-to-africell-to-counter-huawei-in-africa/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "미국 아프리카셀 1억달러 지원"}, {"title": "ZTE Global Summit 2026 Opens in Kuala Lumpur - TeknoGadyet", "summary": "중흥통신(ZTE)이 쿠알라룸푸르에서 'ZTE 글로벌 서밋 2026'을 개최했다. 연결성을 넘어선 첨단 기술과 비전을 공유하며 글로벌 통신사 고객들과 협력을 모색한다.", "source": "TeknoGadyet", "date": "2026-09-11 21:13", "url": "https://www.teknogadyet.com/2026/09/zte-global-summit.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "중흥통신 글로벌 서밋"}, {"title": "Deutsche Telekom's Two-Track Week: Elliott's Stake, a Satellite Voice Call, and a Buyback ", "summary": "도이치텔레콤이 엘리엇의 지분 인수, 위성 음성 통화 성공, 자사주 매입 등 최근의 주요 사업 흐름을 전개하고 있습니다. 위성통신 기술 실증과 경영 동향입니다.", "source": "ad-hoc-news.de", "date": "2026-09-11 21:10", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/deutsche-telekom-s-two-track-week-elliott-s-stake-a-satellite-voice/70087288", "category": "tech", "importance": 4, "sid": "satellite", "topic": "도이치텔레콤 위성 음성 통화"}, {"title": "“삼성전자 HBM, 더 크게 터진다”…'역대급' 증권가 파격 전망 나왔다", "summary": "증권가 리포트에 따르면 삼성전자의 고대역폭메모리(HBM) 시장 점유율이 4분기 40%에 육박하고 2나노 선단 공정 수율 개선으로 파운드리 흑자 전환 가능성이 높아지고 있습니다. HBM4 판매 확대가 주요 동인입니다.", "source": "전자신문", "date": "2026-09-11 21:08", "url": "https://www.etnews.com/20260911000368", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "삼성전자 hbm 실적"}, {"title": "Zankore to build Indonesia's first AI factory with $3.1B funding", "summary": "인도네시아 오사토 홀딩스(IOH), 엔비디아, 노키아의 합작사인 잔코레가 31억 달러 규모의 자금 조달을 완료했다. 이를 통해 1기가와트 규모의 AI 팩토리와 네오 클라우드 플랫폼 초기 구축에 착수한다. 노키아는 주요 통신 및 기술 기업들과의 협력을 통해 AI 인프라 시장에서 입지를 확대하고 있다. 이번 대규모 프로젝트는 통신 장비 업체의 인프라 다각화 전략을 보여준다.", "source": "Light Reading", "date": "2026-09-11 20:54", "url": "https://www.lightreading.com/data-centers/zankore-to-build-indonesia-s-first-ai-factory-with-3-1b-funding", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 ai 팩토리 수주"}, {"title": "Vietnam Auctions 900 MHz Spectrum for 4G, 5G Expansion - Telecom Review Asia", "summary": "베트남이 4G 및 5G 네트워크 확장을 위해 900MHz 대역 주파수 경매를 진행했다. 동남아 통신 시장의 주파수 확보 및 인프라 투자 가속화를 보여주는 규제·정책 이벤트다.", "source": "Telecom Review Asia", "date": "2026-09-11 20:43", "url": "https://www.telecomreviewasia.com/news/network-news/30245-vietnam-auctions-900-mhz-spectrum-for-4g-5g-expansion/", "category": "policy", "importance": 4, "sid": "policy", "topic": "베트남 900mhz 주파수 경매"}, {"title": "SBI Agreed To Provide $3.5 Billion Of Debt Financing To Vodafone Idea - Times Now", "summary": "SBI 컨소시엄이 보다폰 인디아(Vodafone Idea)에 35억 달러(약 35,000억 원) 규모의 부채 금융 제공에 합의했다. 이번 자금 조달로 보다폰 인디아는 턴어라운드와 재무 구조 개선에 속도를 낼 전망이다. 인도 통신 시장에서 대규모 자금 확보가 이루어지며 장비 투자 확대 가능성이 제기된다. 주요 통신사의 대규모 자금 조달은 글로벌 통신장비 시장의 투자 심리에 긍정적 영향을 미칠 것으로 평가된다.", "source": "Times Now", "date": "2026-09-11 20:05", "url": "https://www.timesnownews.com/business-economy/companies/sbi-agreed-to-provide-3-5-billion-of-debt-financing-to-vodafone-idea-article-156139812", "category": "contract", "importance": 4, "sid": "competitor", "topic": "보다폰인도네시아 수주"}, {"title": "Vodafone Idea secures $3.5bn debt backing from SBI-led lenders - Developing Telecoms", "summary": "인도 통신사 보다폰 아이디어가 SBI 주도 대출 기관으로부터 35억 달러 규모의 부채 자금 조달을 확보했다. 이번 자금 유치를 통해 네트워크 투자 및 인프라 확장을 가속화할 전망이다. 인도 통신 시장의 주요 재무 건전성 개선 사례로 의미가 크다.", "source": "Developing Telecoms", "date": "2026-09-11 19:59", "url": "https://developingtelecoms.com/telecom-business/operator-news/20815-vodafone-idea-secures-3-5bn-debt-backing-from-sbi-led-lenders.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보더폰인도 자금조달"}, {"title": "Huawei labeled a 'criminal enterprise' as trial begins in US - NewsBytes", "summary": "미국에서 열린 재판에서 화웨이가 '범죄 기업'으로 지목되며 본격적인 공방이 시작됐다. 미 정부의 대중국 제재 기조 속에서 화웨이의 법적 압박이 가중되는 국면이다. 주요 경쟁사의 법적 리스크 심화는 글로벌 장비 시장의 경쟁 지형에 큰 파장을 일으킨다. 향후 제재 수위 변화를 예의주시해야 한다.", "source": "NewsBytes", "date": "2026-09-11 19:57", "url": "https://www.newsbytesapp.com/news/business/us-prosecutor-calls-huawei-a-criminal-enterprise-as-trial-begins/story", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 재판"}, {"title": "AT&T Business expands connectivity with Amazon Leo satellite - TipRanks", "summary": "AT&T 비즈니스가 아마존 카이퍼와의 협력을 통해 기업용 위성 연결 서비스를 확장한다. 기업 고객에게 지상망과 위성이 결합된 끊김 없는 하이브리드 네트워크를 제공한다. B2B 통신 시장에서 위성 기술의 활용도가 한층 높아졌다.", "source": "TipRanks", "date": "2026-09-11 19:57", "url": "https://www.tipranks.com/news/the-fly/att-business-expands-connectivity-with-amazon-leo-satellite-thefly-news", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 비즈니스 아마존 카이퍼 위성 연동"}, {"title": "Jio is putting 1600 satellites in orbit, will provide satellite internet like Starlink: Re", "summary": "릴라이언스 지오가 1600개의 위성을 궤도에 올려 위성 인터넷 서비스를 제공할 계획임. 인도 시장의 위성통신 경쟁 본격화임.", "source": "India Today", "date": "2026-09-11 19:49", "url": "https://www.indiatoday.in/amp/technology/news/story/jio-is-putting-1600-satellites-in-orbit-will-provide-satellite-internet-like-starlink-report-2992432-2026-09-11", "category": "tech", "importance": 4, "sid": "satellite", "topic": "릴라이언스 지오 위성"}, {"title": "Docomo lights Nokia open RAN base station - Mobile World Live", "summary": "일본 NTT도코모가 노키아의 최신 오픈랜(Open RAN) 기지국 장비를 상용망에 도입하고 운용을 시작했다. 멀티벤더 환경에서의 오픈랜 상용화를 가속화하는 중요한 진전으로 평가된다. 향후 개방형 무선 접속망 시장 확대에 긍정적인 영향을 미칠 것으로 기대된다.", "source": "Mobile World Live", "date": "2026-09-11 19:05", "url": "https://www.mobileworldlive.com/docomo/docomo-lights-nokia-open-ran-base-station/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 오픈랜"}, {"title": "Nokia and Orange claim a first with network tomography trial - Telecoms", "summary": "노키아와 오렌지가 세계 최초의 네트워크 토모그래피 라이브 시험에 성공했다. AI 기반 분석을 통해 통신망 내부를 투시하듯 상태를 파악하는 기술이다. 양사의 기술 협력 성과가 주목받고 있다.", "source": "Telecoms", "date": "2026-09-11 19:04", "url": "https:/   ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 출근길 음성 브리핑 (최근 24시간 4·5점 기사) ── */
let briefQueue=[],briefPlaying=false,koVoice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith("ko"));
  if(!vs.length){koVoice=null;return;}
  // Edge의 Natural 음성 > Online 음성 > Google 음성 > 기타 순으로 선택
  const score=v=>(/natural/i.test(v.name)?4:0)+(/online/i.test(v.name)?2:0)+(/google/i.test(v.name)?1:0);
  vs.sort((a,b)=>score(b)-score(a));
  koVoice=vs[0];
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function briefText(){
  if(typeof NEWS_BRIEF!=="undefined"&&NEWS_BRIEF.text) return NEWS_BRIEF.text;
  // 크롤러가 아직 원고를 만들기 전이면 아카이브 최신 날짜에서 즉석 생성
  const days=Object.keys(ARCH).sort().reverse();
  if(days.length){
    const items=(ARCH[days[0]]||[]).slice(0,8);
    if(items.length) return "네트워크 뉴스 브리핑입니다. "+items.map((a,i)=>(i+1)+"번째 소식. "+a.title+". "+(a.summary||"")).join(" ")+" 이상입니다.";
  }
  return "재생할 브리핑이 아직 없습니다.";
}
function splitBrief(t){
  // 문장 단위로 나눠 순차 재생: 크롬이 긴 음성을 중간에 끊는 버그 회피 + 문장 사이 자연스러운 호흡
  const parts=t.match(/[^.!?]+[.!?]?/g)||[t];
  const out=[];let cur="";
  for(const p of parts){ if((cur+p).length>180){if(cur)out.push(cur);cur=p;} else cur+=p; }
  if(cur)out.push(cur);
  return out;
}
function playNextBrief(b){
  if(!briefPlaying||!briefQueue.length){briefPlaying=false;b.textContent="🎧 브리핑";return;}
  const u=new SpeechSynthesisUtterance(briefQueue.shift());
  u.lang="ko-KR";u.rate=1.0;u.pitch=1.0;
  if(koVoice)u.voice=koVoice;
  u.onend=()=>playNextBrief(b);
  u.onerror=()=>playNextBrief(b);
  speechSynthesis.speak(u);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(!("speechSynthesis" in window)){alert("이 브라우저는 음성 재생을 지원하지 않습니다.");return;}
  if(briefPlaying){speechSynthesis.cancel();briefQueue=[];briefPlaying=false;b.textContent="🎧 브리핑";return;}
  pickVoice();
  briefQueue=splitBrief(briefText());
  briefPlaying=true;b.textContent="⏹ 정지";
  playNextBrief(b);
}
/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
