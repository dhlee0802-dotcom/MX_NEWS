026년 8월, 소프트뱅크는 HAPS(성층권 통신 플랫폼)를 활용한 일본 최초의 실험에 성공했다. 대재해 시에도 스마트폰이 연결되는 세상을 목표로 실증이 진행되었다. 향후 재난 대비 및 음영 지역 해소를 위한 차세대 통신 인프라로 기대를 모으고 있다. 상용화를 위한 기술 검증이 순조롭게 진행 중이다.", "source": "ケータイ Watch", "date": "2026-09-17 20:05", "url": "https://k-tai.watch.impress.co.jp/docs/news/2141967.html", "category": "tech", "importance": 4, "sid": "satellite", "topic": "소프트バンク haps"}, {"title": "【画像】ソフトバンクが成層圏の「空飛ぶ基地局」で日本初の通信実証に成功 1/21 - ライブドアニュース", "summary": "- 소프트뱅크가 성층권 '하늘을 나는 기지국'으로 일본 최초의 통신 실증 성공\n- ライブドアニュース 보도", "source": "ライブドアニュース", "date": "2026-09-17 20:05", "url": "https://news.livedoor.com/article/image_detail/32353029/?img_id=56450500", "category": "tech", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 haps 통신 실증"}, {"title": "【画像】ソフトバンクが成層圏の「空飛ぶ基地局」で日本初の通信実証に成功 6/21 - ライブドアニュース", "summary": "- 소프트뱅크 성층권 공중 기지국 일본 최초 통신 실증 관련 추가 이미지 보도\n- 차세대 통신 인프라 검증", "source": "ライブドアニュース", "date": "2026-09-17 20:05", "url": "https://news.livedoor.com/article/image_detail/32353029/?img_id=56450512", "category": "tech", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 haps 통신실증"}, {"title": "U.S.-Saudi $24B ‘Historic’ F-35 Deal Could Hit Another Roadblock as New Report Flags China", "summary": "- 미국-사우디 F-35 계약 관련 중국산 통신장비 보안 우려 제기", "source": "EurAsian Times", "date": "2026-09-17 20:03", "url": "https://www.eurasiantimes.com/u-s-saudi-24-billion-historic-f-35-deal/", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 중국 장비 제재"}, {"title": "Ursula Von Der Leyen Proposes EU Kids Act Social Media Ban Under 13: how 18 outlets framed", "summary": "- 우르줄라 폰 데어 라이엔 EU 집행위원장이 13세 미만 아동 소셜미디어 사용 금지 법안(EU Kids Act) 제안\n- 디지털 규제 강화", "source": "NewsCord", "date": "2026-09-17 20:03", "url": "https://newscord.org/article/ursula-von-der-leyen-proposes-eu-kids-act-social-media-ban-under-13--Story_20260917_EUannouncesplantores72bc6802", "category": "policy", "importance": 4, "sid": "policy", "topic": "우르줄라 폰 데어 라이엔 eu 아동 소셜미디어 금지"}, {"title": "「世界初」ソフトバンクらが成層圏HAPSのリアルタイム追尾とレーザー測距に成功 光無線通信へ大きな一歩 - ITmedia Mobile - ITmedia", "summary": "소프트뱅크 등이 세계 최초로 성층권 HAPS의 실시간 추적과 레이저 측거를 이용한 광무선 통신에 성공했다. 상공에서 고속 데이터 송수신을 안정적으로 수행할 수 있는 기반을 다졌다. 차세대 항공 통신 기술 분야에서 독보적인 기술력을 과시했다.", "source": "ITmedia", "date": "2026-09-17 20:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/17/news098.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 성층권 통신 플랫폼 haps 실험"}, {"title": "「世界初」ソフトバンクらが成層圏HAPSのリアルタイム追尾とレーザー測距に成功 光無線通信へ大きな一歩", "summary": "소프트뱅크 등 3개사가 성층권 통신 플랫폼(HAPS)을 지상에서 실시간으로 추적하여 레이저 광으로 거리를 측정하는 광무선 통신 실증에 세계 최초로 성공했습니다. 태평양横断 비행 및 에지 컴퓨팅 연동을 통해 통신 지연을 대폭 줄였으며, 2027년 상용화를 목표로 국내 거점 정비와 2030년 전국 커버리지를 추진합니다. 차세대 공중 통신망 기술의 중요한 진전입니다.", "source": "ITmedia Mobile", "date": "2026-09-17 20:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/17/news098.html", "category": "tech", "importance": 4, "sid": "satellite", "topic": "소프트뱅크 성층권 에이치에이피에스 레이저 측정 성공"}, {"title": "Nokia and Microsoft integrate agentic AI for telecom network automation - Crypto Briefing", "summary": "노키아와 마이크로소프트가 통신 네트워크 자동화를 실현하기 위해 에이전틱 AI 기술을 장비 솔루션에 긴밀히 통합한다. 통신사의 운영 비용 절감을 위한 핵심 무기가 될 전망이다. 경쟁사의 AI 솔루션 고도화 소식이다.", "source": "Crypto Briefing", "date": "2026-09-17 19:51", "url": "https://cryptobriefing.com/nokia-microsoft-agentic-ai-telecom/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 ai 통합"}, {"title": "China’s AI labs must accelerate development, says Huawei chair", "summary": "화웨이 회장이 중국의 AI 연구소가 개발을 가속화해야 한다고 발언했습니다. 실리콘밸리의 AI 속도 조절론과 대비되는 시각입니다. 통신장비 기업 수장의 산업 전망 발언입니다.", "source": "Financial Times Tech", "date": "2026-09-17 19:50", "url": "https://www.ft.com/content/c1f4cacf-098a-4776-b76b-fb741ef36fa6?syn-25a6b1a6=1", "category": "exec", "importance": 4, "sid": "competitor", "topic": "화웨이 ai 랩스"}, {"title": "Nokia Extends Microsoft Tie-Up With AI Platform For Telecom Network Automation – NOK Stock", "summary": "노키아가 마이크로소프트와 손잡고 AI 플랫폼을 활용한 통신 네트워크 자동화 협력을 확대한다. 통신망 운영의 지능화와 자율화를 추진하기 위한 양사 간 기술 결합이 본격화되고 있다. 글로벌 장비사의 AI 네트워크 솔루션 확장 소식이다.", "source": "TradingView", "date": "2026-09-17 19:42", "url": "https://www.tradingview.com/news/stocktwits:fdc89a84c094b:0-nokia-extends-microsoft-tie-up-with-ai-platform-for-telecom-network-automation-nok-stock-rises-premarket/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 파트너십"}, {"title": "Near-Packaged Optics Emerges as the Pragmatic Path for AI’s Next Networking Era - The Fast", "summary": "AI 시대의 차세대 네트워킹을 위한 실용적 대안으로 근접 패키지 광학(Near-Packaged Optics) 기술이 부상하고 있다. 대규모 데이터센터와 고성능 통신망의 병목 현상을 해결할 핵심 기술로 주목받는다. 차세대 장비 기술 동향이다.", "source": "The Fast Mode", "date": "2026-09-17 19:37", "url": "https://www.thefastmode.com/technology-solutions/50640-near-packaged-optics-emerges-as-the-pragmatic-path-for-ai-s-next-networking-era", "category": "tech", "importance": 4, "sid": "competitor", "topic": "통신장비 기술"}, {"title": "Nokia and Microsoft Expand Partnership to Develop AI-Powered Telecom Network Automation - ", "summary": "노키아와 마이크로소프트가 AI 기반 통신 네트워크 자동화 개발을 위해 파트너십을 대폭 확장한다. 통신 사업자의 운영 부담을 줄이고 자율형 네트워크 구축을 가속화하는 핵심 협력이다. 경쟁사의 주요 전략적 제휴 건이다.", "source": "Yahoo Tech", "date": "2026-09-17 19:31", "url": "https://tech.yahoo.com/ai/copilot/articles/nokia-microsoft-expand-partnership-develop-103131415.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트"}, {"title": "Nokia and Microsoft team up for network automation - telecoms.com", "summary": "노키아와 마이크로소프트가 차세대 통신망의 지능형 네트워크 자동화를 위해 긴밀한 협력 관계를 구축했다.", "source": "telecoms.com", "date": "2026-09-17 19:07", "url": "https://www.telecoms.com/automation/nokia-and-microsoft-team-up-for-network-automation", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 네트워크 자동화 팀업"}, {"title": "Nokia and Microsoft expand partnership for AI-driven network automation - StreetInsider", "summary": "노키아가 AI 기반 네트워크 자동화를 가속화하기 위해 마이크로소프트와의 전략적 협력 관계를 대폭 확대한다고 밝혔다.", "source": "StreetInsider", "date": "2026-09-17 19:00", "url": "https://www.streetinsider.com/Corporate+News/Nokia+and+Microsoft+expand+partnership+for+AI-driven+network+automation/27072092.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 ai 네트워크 자동화 협력"}, {"title": "이청 삼성디스플레이 사장, 中추격에 \"LCD 뼈아픈 경험 되풀이 안돼\"", "summary": "이청 한국디스플레이산업협회 회장 겸 삼성디스플레이 사장이 디스플레이의 날 기념식에서 LCD의 뼈아픈 경험을 되풀이하지 않겠다고 강조했다. 산학연이 원팀이 되어 핵심 기술을 지키고 차세대 경쟁력을 확보해야 한다고 밝혔다. 중국의 거센 추격에 맞서 초격차 기술 확보의 시급성을 역설했다. 국내 디스플레이 산업의 위기 극복 전략을 제시했다.", "source": "ZDNet Korea", "date": "2026-09-17 18:55", "url": "https://zdnet.co.kr/view/?no=20260917184346", "category": "exec", "importance": 4, "sid": "competitor", "topic": "삼성디스플레이 디스플레이"}, {"title": "Nokia, Microsoft partner for AI-driven network automation - ET Telecom", "summary": "노키아와 마이크로소프트가 AI 중심의 네트워크 자동화 실현을 위해 협력 관계를 공고히 하고 글로벌 통신사 지원에 나섭니다.", "source": "ET Telecom", "date": "2026-09-17 18:53", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/nokia-microsoft-partner-for-ai-driven-network-automation/134307912", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 네트워크 자동화 협력 중복"}, {"title": "LFP 양극재 선두 엘앤에프, 삼성SDI 이어 SK온도 수주…1617억 규모", "summary": "LFP 양극재 선두 기업 엘앤에프가 삼성SDI에 이어 SK온과도 중장기 LFP 양극재 공급 계약을 체결했다. 이번 계약으로 SK온의 국내외 모든 생산법인 및 지정업체에 양극재를 공급하게 된다.", "source": "ZDNet Korea", "date": "2026-09-17 18:49", "url": "https://zdnet.co.kr/view/?no=20260917183510", "category": "contract", "importance": 4, "sid": "competitor", "topic": "엘앤에프 lfp 양극재 공급 계약"}, {"title": "ソフトバンク、HAPSで「3次元ネットワーク」へ スマホ直接通信で下り36Mbps - Impress Watch", "summary": "소프트뱅크가 HAPS를 통해 3차원 네트워크를 구현하며 스마트폰과의 직접 통신으로 하리 36Mbps 속도를 확인했다. 지상 기지국 사각지대를 해소하는 혁신적인 공중 통신망 기술이다.", "source": "Impress Watch", "date": "2026-09-17 18:45", "url": "https://www.watch.impress.co.jp/docs/news/2141933.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 성층권 통신 실험 성공"}, {"title": "ソフトバンク、HAPSで「3次元ネットワーク」へ スマホ直接通信で下り36Mbps (Impress Watch) - Yahoo!ニュース", "summary": "소프트뱅크가 HAPS를 활용한 3차원 네트워크 구축의 일환으로 스마트폰 직접 통신 실증을 진행했다. 성층권 기지국을 통해 지상 단말과 직접 연결하여 하향 36Mbps 속도를 구현했다. 기존 통신망의 커버리지 한계를 극복하는 차세대 비지상네트워크(NTN) 기술 확장을 보여준다.", "source": "Yahoo!ニュース", "date": "2026-09-17 18:45", "url": "https://news.yahoo.co.jp/articles/64dc851093652e2970fc3bf7136538d875f1212e/images/000", "category": "tech", "importance": 4, "sid": "satellite", "topic": "소프트뱅크 haps 실증"}, {"title": "China's Huawei says AI chip demand outstrips supply as it steps up Nvidia challenge - The ", "summary": "화웨이가 AI 칩 수요 급증에 대응하며 엔비디아와의 경쟁을 강화하고 있다.", "source": "The Lufkin Daily News", "date": "2026-09-17 18:06", "url": "https://lufkindailynews.com/news_reuters/business/chinas-huawei-says-ai-chip-demand-outstrips-supply-as-it-steps-up-nvidia-challenge/article_003c43f7-1376-5d15-8578-f87fe0ea4ab5.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 ai 칩"}, {"title": "Huawei Speeds Up AI Chip Launch to Challenge Nvidia - The Information", "summary": "화웨이가 미국 제재에 맞서 엔비디아와의 경쟁 구도를 형성하기 위해 AI 반도체 칩 출시를 앞당기고 있습니다. 글로벌 AI 반도체 및 장비 시장의 핵심 이슈입니다.", "source": "The Information", "date": "2026-09-17 18:05", "url": "https://www.theinformation.com/briefings/huawei-speeds-ai-chip-launch-challenge-nvidia", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 엔비디아 대항 ai 칩 출시 단축"}, {"title": "ソフトバンクが空飛ぶ基地局「HAPS」の通信試験、その成果は？ 衛星-HAPS-地上間の光通信へ前進 - ビジネスネットワーク", "summary": "소프트뱅크가 성층권 통신 플랫폼(HAPS)을 활용한 통신 시험에서 위성과 HAPS, 지상을 잇는 광통신 연계의 진전을 이뤘다. 공중 기지국 기술 상용화를 위한 의미 있는 기술적 성과를 확보했다.", "source": "ビジネスネットワーク", "date": "2026-09-17 18:01", "url": "https://businessnetwork.jp/article/37215/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "소프트뱅크 성과"}, {"title": "ソフトバンクが空飛ぶ基地局「HAPS」の通信試験、その成果は？ 衛星-HAPS-地上間の光通信へ前進 - businessnetwork.jp", "summary": "소프트뱅크가 추진 중인 성층권 통신 플랫폼 HAPS의 통신 시험에서 위성과 HAPS, 지상 간 광통신 연계에 성공하며 기술적 진전을 이뤘다. 공중 기지국을 활용해 재난 지역이나 오지에 끊김 없는 통신망을 제공하는 기반을 마련했다. 차세대 3차원 네트워크 인프라 구축을 위한 핵심 기술력을 입증했다. 향후 상용화를 향한 실증 작업이 속도를 낼 것으로 보인다.", "source": "businessnetwork.jp", "date": "2026-09-17 18:01", "url": "https://businessnetwork.jp/article/37215/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 5g"}, {"title": "Nokia Shares Rise Nearly 5% Pre-Market as It Partners With Microsoft to Advance Network Au", "summary": "노키아가 마이크로소프트와의 AI 네트워크 자동화 파트너십 발표 이후 프리마켓에서 주가가 약 5% 급등했다. 양사 협력을 통한 통신장비 시장 내 인공지능 솔루션 상용화 기대감이 반영된 결과다.", "source": "TradingKey", "date": "2026-09-17 17:55", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262172750-nokia-microsoft-partner-network-automation-shares-rise-5-pre-market-tradingkey", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트파트너십주가상승"}, {"title": "HUAWEI eKit Launches Intelligent Office Solution 2.0, Making Intelligent Office Accessible", "summary": "화웨이가 지능형 오피스 솔루션 2.0을 출시하며 기업용 시장 공략을 강화한다.", "source": "PR Newswire", "date": "2026-09-17 17:40", "url": "https://www.prnewswire.com/in/news-releases/huawei-ekit-launches-intelligent-office-solution-2-0--making-intelligent-office-accessible-to-all-302881802.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 솔루션"}, {"title": "'유심 해킹' SKT \"정상 단말기 켜지면 복제 유심 접속 불가\" - v.daum.net", "summary": "SK텔레콤이 유심 해킹 및 유출 사고와 관련해 정상 단말기가 켜져 있으면 복제 유심으로의 무단 접속이 원천 차단된다고 해명했다. 1,300억 원대 과징금 부과를 둘러싼 첫 재판에서 치열한 공방이 벌어지며 통신사 보안 책임과 제재 정당성이 쟁점이 되고 있다.", "source": "v.daum.net", "date": "2026-09-17 17:40", "url": "https://v.daum.net/v/20260917174052060", "category": "policy", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 유심 유출 과징금"}, {"title": "Ericsson explores the future of intelligent networks with industry analysts - telecomtv.co", "summary": "에릭슨이 산업 분석가들과 함께 지능형 네트워크의 미래 방향성과 차세대 통신 기술 전략을 탐색하고 논의했다.", "source": "telecomtv.com", "date": "2026-09-17 17:38", "url": "https://www.telecomtv.com/content/ai/ericsson-explores-the-future-of-intelligent-networks-with-industry-analysts-56266/", "cate ier", "topic": "sk텔레콤 유심사고"}, {"title": "SKT “정상폰 켜져 있으면 복제유심 접속 불가”…1300억 과징금 첫 재판서 공방 - 조선비즈 - biz.chosun.com", "summary": "유심 해킹 및 유출 사고로 부과된 1,300억 원대 과징금을 취소하기 위한 SK텔레콤과 정부 간의 첫 법정 공방이 시작됐다. SKT는 정상 단말기가 켜져 있으면 복제 유심으로 접속이 불가하다며 과징금 처분의 부당성을 강하게 주장했다. 통신사의 보안 책임 범위와 행정 처분의 적법성을 가리는 대형 법적 분쟁이다. 업계 전체의 보안 기준과 규제 리스크에 큰 파장을 미칠 사안이다.", "source": "biz.chosun.com", "date": "2026-09-17 16:07", "url": "https://biz.chosun.com/topics/law_firm/2026/09/17/KIHZDDOLJFH7FB6VD6IJPULBXA/", "category": "policy", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 유심 과징금"}, {"title": "AI 활용·하이브리드 근무 확산에...KT, 기업·공공 특화 5G 업무망 서비스 확대 - 매일경제", "summary": "AI 활용과 하이브리드 근무 형태의 확산에 발맞추어 KT가 기업 및 공공기관을 위한 특화 5G 업무망 서비스를 확대한다. 변화하는 오피스 환경에 맞춘 고성능 전용 통신망 솔루션을 제공하여 B2B 시장 점유율을 높이겠다는 전략이다. 국내 통신사들의 기업용 네트워크 인프라 고도화 트렌드를 잘 보여준다.", "source": "매일경제", "date": "2026-09-17 16:01", "url": "https://www.mk.co.kr/news/it/12155498", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt 기업용 5g"}, {"title": "Nokia accelerates network automation through agentic, unified data foundation with Microso", "summary": "노키아가 마이크로소프트와 협력하여 에이전트 기반의 통합 데이터 기반을 구축, 네트워크 자동화를 가속화합니다.", "source": "Nokia", "date": "2026-09-17 16:00", "url": "https://www.nokia.com/newsroom/nokia-accelerates-network-automation-through-agentic-unified-data-foundation-with-microsoft/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 네트워크 자동화"}, {"title": "Microsoft and Nokia build AI tools to automate phone networks - Stock Titan", "summary": "노키아와 마이크로소프트가 통신 네트워크 자동화를 위한 AI 도구를 공동 개발합니다.", "source": "Stock Titan", "date": "2026-09-17 16:00", "url": "https://www.stocktitan.net/news/NOK/nokia-accelerates-network-automation-through-agentic-unified-data-6r3kxc00geva.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 ai"}, {"title": "EU, '13세 미만 SNS 금지' 추진…한국은 국회 논의 답보", "summary": "유럽연합이 27개 회원국 전역에서 13세 미만 아동의 SNS 이용을 금지하는 법안을 추진한다. 13~14세는 부모 감독하에 미니 계정을 허용하고 15세부터 독립 계정을 부여 <script>

function toggleReport(){
  reportMode=!reportMode;

  b.textContent=reportMode?"📋 선택 중":"📋 보고";
  document.getElementById("repbar").classList.toggle("on",reportMode);
  updateRepCnt(); render();
}
function toggleSel(k){
  if(SEL.has(k)) SEL.delete(k); else SEL.add(k);
  updateRepCnt();
}
function updateRepCnt(){
  const el=document.getElementById("repCnt");
  if(el) el.textContent="선택 "+SEL.size+"건";
}
function buildReport(){
  if(!SEL.size){alert("보고할 기사를 먼저 선택해 주세요.");return;}
  const arts=[...SEL].map(k=>REG[k]).filter(Boolean)
    .sort((a,b)=>(b.importance||0)-(a.importance||0)||(b.date||"").localeCompare(a.date||""));
  const now=new Date();
  const days=["일","월","화","수","목","금","토"];
  const head=`[네트워크 동향 보고] ${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")}(${days[now.getDay()]})`;
  const body=arts.map(a=>{
    let sum=(a.summary||"").trim();
    if(sum && !sum.startsWith("-")) sum="- "+sum;  // 구형(문장형) 요약도 불릿 형태로
    return `■ ${a.title}\n${sum}\n(${a.source}, ${(a.date||"").slice(5,10)})`;
  }).join("\n\n");
  document.getElementById("repText").value=head+"\n\n"+body;
  document.getElementById("repModal").classList.add("on");
}
function copyReport(){
  const t=document.getElementById("repText");
  const done=()=>{const b=document.getElementById("copyBtn");b.textContent="복사됨 ✓";setTimeout(()=>b.textContent="복사",1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(done).catch(()=>{t.select();document.execCommand("copy");done();});
  }else{t.select();document.execCommand("copy");done();}
}
function setArchDay(d){archDay=d;render();}

function doSearch(){
  const el=document.getElementById("searchInput");

  const el2=document.getElementById("searchInput");
  if(el2){el2.focus();el2.setSelectionRange(el2.value.length,el2.value.length);}
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  const k=String(a.url||a.title||"");
  if(k) REG[k]=a;
  const kAttr=esc(k).replace(/'/g,"&#39;");
  const box=(reportMode&&k)?`<input type="checkbox" class="selbox" onchange="toggleSel('${kAttr}')" ${SEL.has(k)?"checked":""}>`:"";
  return `<div class="art">
    <div class="art-tags">${box}${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${esc(a.url)}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){

}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["1finity",["원피니티"]],["후지쯔",["fujitsu","후지츠"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["로저스",["rogers"]],["bell canada",[]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel","rogers","로저스","bell canada"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else if(tab.mode==="search"){
    html+=`<div class="block"><div class="blk-body" style="padding:12px 14px">
      <div style="display:flex;gap:8px">
        <input id="searchInput" value="${esc(searchQ)}" placeholder="회사명·키워드 검색 (예: 에릭슨 수주)" onkeydown="if(event.key==='Enter')doSearch()"
          style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit">
        <button class="rchip on" style="border:none" onclick="doSearch()">검색</button>
      </div></div></div>`;
    if(searchQ.trim()){
      const toks=searchQ.toLowerCase().split(/\s+/).filter(Boolean);
      const expand=x=>{for(const [c,ali] of COMPANIES){if(c===x||ali.includes(x))return [c].concat(ali);}return [x];};
      const seen=new Set();let all=[];
      const push=(a,sid)=>{const k=(a.url||a.title||"");if(k&&!seen.has(k)){seen.add(k);all.push({...a,_sid:sid});}};
      if(typeof NEWS_DATA!=="undefined")Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>push(a,s)));
      Object.keys(ARCH).forEach(d=>(ARCH[d]||[]).forEach(a=>push(a,a.sid)));
      const hits=all.filter(a=>{
        const t=((a.title||"")+" "+(a.summary||"")+" "+(a.topic||"")+" "+(a.source||"")).toLowerCase();
        return toks.every(x=>expand(x).some(v=>t.includes(v)));
      }).sort((a,b)=>(b.importance||0)-(a.importance||0)||(b.date||"").localeCompare(a.date||"")).slice(0,50);
      html+=block("🔍 검색 결과",hits.length+"건",hits.map(a=>artCard(a,true)).join(""));
    }else{
      html+=`<div class="empty">검색어를 입력하세요.<br>현재 대시보드의 전체 기사와 최근 30일 중요 기사 아카이브에서 찾습니다.</div>`;
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
