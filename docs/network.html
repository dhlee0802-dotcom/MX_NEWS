<title>네트워크 뉴스 모니터링</title>
<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

해사고 조사 결과"}, {"title": "티빙 3954만 계정 털려…총체적 보안 ‘구멍’", "summary": "티빙이 정보보안팀 인지 후 24시간이 지나 KISA에 신고하여 정보통신망법을 위반함에 따라 과기정통부가 과태료를 부과합니다. 총체적인 보안 구멍과 늑장 대응이 도마 위에 올랐습니다. 플랫폼 보안 사고의 대표적 부실 사례입니다.", "source": "kookje.co.kr", "date": "2026-09-03 19:31", "url": "http://www.kookje.co.kr/news2011/asp/newsbody.asp?code=0200&key=20260904.22010001277", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 늑장 신고 구멍"}, {"title": "티빙, 내부 접속키 털리고 정보는 해외로…1인당 2만원 상당 보상(종합...", "summary": "티빙의 개인정보 대규모 유출 및 해외 유출 사고와 관련해 과기정통부가 늑장 신고에 따른 과태료를 부과합니다. 티빙은 1인당 2만 원 상당의 보상안을 내놓았습니다. 보안 사고에 따른 후속 조치입니다.", "source": "view.asiae.co.kr", "date": "2026-09-03 19:29", "url": "https://view.asiae.co.kr/article/2026090319290317230", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 해외 유출 보상"}, {"title": "[현장] 3954만 계정 유출된 티빙…탈퇴 고객은 다시 가입해야 보상", "summary": "3954만 개 계정이 유출된 티빙이 피해 고객 대상 보상안을 발표한 가운데 과기정통부가 신고 기한 위반에 대한 과태료 부과를 확정했습니다. 탈퇴 고객 재가입 보상 등 후속 대책이 진행됩니다.", "source": "onews.tv", "date": "2026-09-03 19:28", "url": "https://www.onews.tv/news/articleView.html?idxno=286252", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 유출 고객 보상"}, {"title": "티빙, 3954만 계정 정보 유출… 최초 침투경로는 끝내 미궁", "summary": "과기정통부 민관합동조사단이 발표한 티빙 침해사고 결과 활성 및 비활성 계정 총 3954만 개가 유출되었으나 최초 침투경로는 미궁으로 남았습니다. 대규모 개인정보 유출의 원인 분석 결과입니다.", "source": "joongang.co.kr", "date": "2026-09-03 19:24", "url": "https://www.joongang.co.kr/article/25458919", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 유출 경로 미궁"}, {"title": "“탈퇴한 내 정보가 유출?”…티빙, 탈퇴 계정 887만개도 유출", "summary": "과기정통부 민관합동조사단이 발표한 티빙 최종 조사 결과 탈퇴 계정 887만 개를 포함해 전체 유출 규모가 확정되었습니다. 과기정통부는 재발방지 대책 이행 여부를 점검할 예정입니다.", "source": "swtvnews.com", "date": "2026-09-03 19:00", "url": "https://www.swtvnews.com/news/newsview.php?ncode=1065598028384160", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 탈퇴 계정 유출"}, {"title": "티빙, 1인당 체감 2만원 보상…탈퇴·휴면 이용자도 포함(종합)", "summary": "티빙이 유출 고객에게 1인당 체감 2만 원 상당의 보상 패키지를 제공하며, 과기정통부는 정보통신망법 위반으로 최대 3000만 원의 과태료를 부과합니다. 휴면 및 탈퇴 이용자도 보상에 포함됩니다.", "source": "ddaily.co.kr", "date": "2026-09-03 18:58", "url": "https://www.ddaily.co.kr/page/view/2026090318502875113", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 체감 보상 패키지"}, {"title": "[N포커스] '3954만 유출' 티빙, 쇄신·보상안 발표…K-플랫폼 연합 '초비...", "summary": "과기정통부가 신고 지연 등 정보통신망법을 위반한 티빙에 과태료를 부과하고 내년 1월부터 고강도 현장 점검에 돌입합니다. 3954만 유출 사태에 따른 플랫폼 업계의 초비상 국면을 보여줍니다.", "source": "nc.press", "date": "2026-09-03 18:52", "url": "https://www.nc.press/news/articleView.html?idxno=625615", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 쇄신 및 과태료"}, {"title": "티빙, 접속키 암호화 안해…3954만개 계정 개인정보·개발 프로젝트 털...", "summary": "티빙이 접속키를 암호화하지 않아 3954만 개 계정과 개발 프로젝트가 털렸으며, 과기정통부는 늑장 신고에 따른 과태료를 부과할 방침입니다. 보안 관리 부실이 초래한 대형 침해사고입니다.", "source": "hani.co.kr", "date": "2026-09-03 18:50", "url": "https://www.hani.co.kr/arti/economy/it/1276140.html", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 암호화 미비 유출"}, {"title": "최주희 티빙 대표 “3954만 계정 유출 사과”…2년 전 취약점 방치", "summary": "최주희 티빙 대표가 3954만 계정 유출에 대해 공식 사과했습니다. 과기정통부 조사 결과 2024년 모의해킹에서 확인된 보안 취약점이 개선되지 않은 채 방치된 것으로 드러났습니다.", "source": "donga.com", "date": "2026-09-03 18:42", "url": "https://www.donga.com/news/Economy/article/all/20260903/134601534/2", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 취약점 방치 사과"}, {"title": "최주희 티빙 대표, 사이버 침해사고 공식사과…\"보안 투자 4배 확대\"", "summary": "과기정통부 민관합동조사단이 티빙 침해사고 조사 결과를 발표한 가운데, 최주희 대표가 보안 투자 4배 확대를 약속하며 공식 사과했습니다. 소스코드와 기술자산 30GB 이상이 유출되었습니다.", "source": "m-i.kr", "date": "2026-09-03 18:40", "url": "https://www.m-i.kr/news/articleView.html?idxno=1409817", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 사이버 침해 사과"}, {"title": "티빙, 취약점 알고도 관리 부실…늑장 신고로 대응도 ‘미흡’", "summary": "과기정통부 조사단이 티빙의 전사적 정보보호 관리체계 미흡과 2024년 모의해킹 취약점 미개선을 이번 침해사고의 원인으로 지적했습니다. 늑장 신고와 함께 총체적 부실이 드러났습니다.", "source": "etoday.co.kr", "date": "2026-09-03 18:40", "url": "https://www.etoday.co.kr/news/view/2621707", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 관리 부실 조사"}, {"title": "계정 유출에 고개 숙인 '티빙'…\"조사결과 겸허히 수용\"", "summary": "계정 유출 사태로 고개 숙인 티빙이 안심보험과 시청 환경 업그레이드 등 보상안을 발표했습니다. 과기정통부는 재발방지 대책 요구와 함께 정보통신망법 과태료를 부과할 예정입니다.", "source": "news.bizwatch.co.kr", "date": "2026-09-03 18:33", "url": "https://news.bizwatch.co.kr/article/mobile/2026/09/03/0034", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 보상안 질타"}, {"title": "티빙 유출, 1300만→3954만으로 3배…“집단소송 참여 늘어날 것”", "summary": "과기정통부 민관합동조사단 조사 결과 티빙 유출 계정이 3954만 개로 3배 늘어나면서 집단소송 참여가 확산될 전망입니다. 개발환경 접속키 관리 부실 등이 지적되었습니다.", "source": "donga.com", "date": "2026-09-03 18:32", "url": "https://www.donga.com/news/It/article/all/20260903/134601622/2", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 집단소송 확산"}, {"title": "티빙, 사이버 침해사고 공식 사과…\"2030년까지 정보보호 투자 4배 확대...", "summary": "과기정통부와 KISA의 티빙 침해사고 조사 결과 접속키가 평문 유출된 수준임이 밝혀졌습니다. 티빙은 2030년까지 정보보호 투자를 4배 확대하겠다고 발표했습니다.", "source": "efnews.co.kr", "date": "2026-09-03 18:26", "url": "http://www.efnews.co.kr/news/articleView.html?idxno=132122", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 정보보호 투자 확대"}, {"title": "최주희 티빙 대표 \"탈퇴회원도 모두 보상…정보조직 인력, 연말까지 15~...", "summary": "과기정통부 조사 결과 티빙의 정보 조직 인력이 4명에 불과했던 것으로 드러났습니다. 티빙 대표는 연말까지 정보 조직 인력을 대폭 확충하고 탈퇴 회원 전원 보상을 약속했습니다.", "source": "newsworks.co.kr", "date": "2026-09-03 18:26", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=852604", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 인력 확충 보상"}, {"title": "3954만 계정 털린 티빙…현금 대신 보험·포인트 보상 내놨다", "summary": "티빙 개인정보 유출 사고 당시 최초 데이터 탈취로 CPU 사용률이 치솟았으나 이를 단순 시스템 장애로 오인하여 대응이 늦어졌습니다. 과기정통부 민관합동조사단이 발표한 침해사고 조사 결과의 일부입니다. IT 인프라 장애 오인으로 인한 보안 사고 대응의 미흡함을 보여줍니다.", "source": "joseilbo.com", "date": "2026-09-03 18:23", "url": "http://www.joseilbo.com/news/news_read.php?uid=575042&class=33&grp=", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 개인정보 유출 장애 오인"}, {"title": "계정 3954만 개 피해… 고개 숙인 티빙 대표 \"보안 체계 근본부터 재구...", "summary": "과기정통부 민관합동조사단이 정부서울청사에서 티빙 침해사고 결과를 발표했습니다. 3954만 계정 피해에 대해 과태료가 부과되며 티빙은 보안 체계를 근본부터 재구축하겠다고 밝혔습니다.", "source": "mediatoday.co.kr", "date": "2026-09-03 18:23", "url": "https://www.mediatoday.co.kr/news/articleView.html?idxno=336873", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 보안 체계 재구축"}, {"title": "3954만 계정 다 털린 티빙 “정보보호 투자 4배 늘릴 것”", "summary": "과기정통부가 정부서울청사 브리핑을 통해 활성화·비활성화·테스트 계정 등 티빙의 모든 계정 3954만 개가 유출된 침해사고 조사 결과를 발표했습니다. 보안 투자 확대가 불가피해졌습니다.", "source": "sedaily.com", "date": "2026-09-03 18:22", "url": "https://www.sedaily.com/article/20086972?ref=naver", "category": "outage", "importance": 3, "wl": false, "topic": "티빙 모든 계정 유출"}, {"title": "토스뱅크 '총체적 부실' 57건 적발..\"명의도용 대출·23억 이체 먹통\"", "summary": "토스뱅크가 관리자 전산실 이탈 등으로 69분 동안 먹통이 되며 23억 원 규모의 이체 실패 대규모 장애가 발생했습니다. 보이스피싱 피해 환급 절차 누락 등 총 57건의 부실이 적발되었습니다. 금융 IT 시스템의 심각한 전산 장애 및 관리 부실을 드러낸 사례입니다.", "source": "4th.kr", "date": "2026-09-03 18:00", "url": "http://www.4th.kr/news/articleView.html?idxno=2117448", "category": "outage", "importance": 3, "wl": false, "topic": "토스뱅크 전산 이체 장애"}, {"title": "Telstra says external review finds network timing system caused July outage", "summary": "호주 통신사 텔스트라는 외부 감사 기관 조사 결과, 지난 7월 발생한 네트워크 장애가 계획된 유지보수 이후 모바일 네트워크 전파 과정에서 발생한 잘못된 날짜 정보 때문인 것으로 확인되었다고 밝혔다. 이번 장애로 인해 통신 서비스 이용에 차질이 빚어졌으나 신속한 원인 규명과 복구가 이루어졌다. 통신망 운영 안정성 확보의 중요성을 보여주는 사례다.", "source": "ET Telecom", "date": "2026-09-02 19:05", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telstra-says-external-review-finds-network-timing-system-caused-july-outage/133706421", "category": "outage", "importance": 3, "wl": true, "topic": "텔스트라 네트워크 장애 원인 규명"}, {"title": "UPS Down? Outage Reports Surge as Customers Report Trouble Tracking and Shipping Packages ", "summary": "글로벌 물류 회사 UPS의 패키지 추적 및 배송 시스템에서 장애가 발생하여 리포트가 급증했습니다. 고객들이 화물 추적과 발송 업무에 큰 불편을 겪었습니다. 물류 IT 시스템의 일시적 마비로 인한 부분적 서비스 차질로 확인되었습니다. 향후 유사 IT 인프라 장애 예방을 위한 점검이 요구됩니다.", lse, "topic": "ai 통신망 운영 예측"}, {"title": "에이스테크, 항우연 저궤도 위성통신 안테나 개발 수주…위성·방산 통신 확대 - 네이트", "summary": "에이스테크놀로지가 항우연의 저궤도 위성통신 안테나 개발 사업을 수주했습니다. 위성통신 및 방산 분야 장비 공급 확대를 통해 기술 경쟁력을 강화할 전망입니다.", "source": "네이트", "date": "2026-09-02 14:28", "url": "https://news.nate.com/view/20260902n21710", "category": "contract", "importance": 4, "wl": false, "topic": "에이스테크 위성 안테나 수주"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "에릭슨이 전파 송출 한 번으로 고속 데이터 전송과 주변 사물 위치·속도를 동시에 탐지하는 6G 통신 신기술을 공개했습니다. 통신용과 레이더용 주파수를 따로 할당할 필요 없이 하나의 기지국 장비로 처리할 수 있는 혁신입니다. 글로벌 장비사의 차세대 무선 통신 기술력 진화를 보여줍니다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 통신 신기술"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "바이트댄스가 중국 네이멍구에 대규모 AI 데이터센터 건설을 추진합니다. 통신장비 업체 화웨이를 비롯해 알리바바와 애플 등 글로벌 빅테크들이 컴퓨팅 시설 투자를 이어온 지역입니다. 대규모 AI 인프라 투자 동향을 보여줍니다.", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "contract", "importance": 3, "wl": false, "topic": "바이트댄스 네이멍구 데이터센터"}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "국내 중소 통신장비업체 우리넷이 NIA의 KOREN 기반 AI NETWORK 장비 시범도입 실증 사업 주관기관으로 선정되어 16Tbps급 패킷-광-전달망 시스템 상용화 시험에 돌입했습니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "contract", "importance": 3, "wl": true, "topic": "우리넷 ai 네트워크 상용화 시험"}, {"title": "치솟는 부품값에…고개 숙인 HPE 주가", "summary": "AI 서버와 네트워크 장비 수요 급증으로 휴렛팩커드엔터프라이즈(HPE)의 실적이 시장 예상을 웃돌았습니다. 그러나 치솟는 부품값과 엔비디아 GPU 및 삼성전자·SK하이닉스의 D램 가격 상승이 부담으로 작용하고 있습니다. AI 인프라 확장에 따른 공급망 비용 압박을 보여줍니다. 향후 장비 제조사의 수익성에 미칠 영향이 주시됩니다.", "source": "hankyung.com", "date": "2026-09-03 17:49", "url": "https://www.hankyung.com/article/2026090328161", "category": "earnings", "importance": 3, "wl": false, "topic": "hpe 실적 및 부품값"}, {"title": "삼성전자 \"로봇, 다양한 폼팩터로 선보일 것\"", "summary": "마우로 포르치니 삼성전자 DX CDO 사장이 모든 형태의 로봇을 살펴보고 있으며 휴머노이드 외 다양한 형태의 로봇 개발을 시사했습니다.", "source": "ZDNet Korea", "date": "2026-09-03 16:47", "url": "https://zdnet.co.kr/view/?no=20260903155258", "category": "exec", "importance": 3, "wl": true, "topic": "삼성전자 로봇 폼팩터 다양화 계획"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "국내 통신장비 및 부품업체 알에프텍이 5G 통신 장비와 방산 RF 기술 경쟁력 강화를 위해 R&D 조직을 자회사 ‘RFTC’로 분리합니다. 5G 안테나 및 필터 기술을 독립적 플랫폼으로 고도화하여 사업을 확대할 계획입니다. 국내 통신부품업계의 전문화 전략을 보여줍니다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 자회사 rftc"}, {"title": "알에프텍, RF 전문 자회사 'RFTC' 출범 - 뉴스핌", "summary": "국내 RF 부품업체 알에프텍이 RF 전문 자회사 'RFTC'를 공식 출범시켰습니다. 연구개발 및 사업 역량을 전문화하여 RF 사업을 본격적으로 확대할 계획입니다. 국내 통신장비 부품업체 동향입니다.", "source": "뉴스핌", "date": "2026-09-03 15:25", "url": "https://www.newspim.com/news/view/20260903000886", "category": "other", "importance": 3, "wl": false, "topic": "알에프텍 자회사 출범"}, {"title": "국내외 통신사 CAPEX 절감 및 인프라 투자 정체… 통신 장비 테마 약세 흐...", "summary": "국내외 통신사들의 CAPEX 절감과 인프라 투자 정체로 인해 통신 장비 테마가 약세 흐름을 보이고 있습니다. 단순 5G 망 구축을 넘어 데이터센터, 광통신, 위성통신 등 새로운 성장 분야에서의 실제 수주와 매출 확보가 중요해졌습니다. 글로벌 통신장비 업계의 투자 부진과 사업 다각화 필요성을 시사합니다.", "source": "pinpointnews.co.kr", "date": "2026-09-03 14:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=483544", "category": "earnings", "importance": 3, "wl": false, "topic": "통신장비 테마 약세"}, {"title": "DX 적자 속… 삼성전자 동행, 서초 이어 16~30일 이재용 자택 앞 집회", "summary": "삼성전자 DX부문이 올해 2분기 사상 처음으로 분기 적자를 기록했습니다. 스마트폰을 담당하는 MX 사업부와 네트워크 사업부를 포함한 DX 부문의 실적 부진이 부각되었습니다. 글로벌 스마트폰 및 통신장비 시장의 경쟁 심화와 수익성 악화를 방증합니다. 사업부 전반의 실적 개선 전략이 요구되는 국면입니다.", "source": "inews24.com", "date": "2026-09-03 11:26", "url": "http://www.inews24.com/view/2001496", "category": "earnings", "importance": 3, "wl": false, "topic": "삼성전자 dx부문 적자"}, {"title": "브로드컴 “AI칩 매출 3배↑”… 삼성 수혜 기대감 커진다", "summary": "브 l=true&r=8eo9l&token=eyJ1c2VyX2lkIjoxNDEyMTU2MSwicG9zdF9pZCI6MjEyNzQyOTc1LCJpYXQiOjE3ODgyODQ1NDUsImV4cCI6MTc5MDg3NjU0NSwiaXNzIjoicHViLTgxNDM2OTIiLCJzdWIiOiJwb3N0LXJlYWN0aW9uIn0.ntnMdYlsDCD3ZGZc0sUQQrV7oCG_e6xiTZA0uoYjuuI", "category": "policy", "importance": 4, "wl": false, "topic": "at&t 유선전화 폐지"}, {"title": "GAO issues broadband program to-dos for FCC, NTIA", "summary": "미국 회계감사원(GAO)은 연방 브로드밴드 프로그램의 현황을 평가하고, FCC와 NTIA를 대상으로 매핑 데이터 정확성과 지속 가능성에 관한 권고사항을 전달했습니다. 이번 평가는 연방 정부 통신 인프라 지원 사업의 예산 집행 정확도를 제고하기 위해 이루어졌습니다. 관련 기관들은 데이터 품질 개선을 통해 통신 지원 사업의 효율성을 높여야 하는 과제를 안고 있습니다.", "source": "Light Reading", "date": "2026-09-03 21:00", "url": "https://www.lightreading.com/broadband/gao-issues-broadband-program-to-dos-for-fcc-ntia", "category": "policy", "importance": 3, "wl": true, "topic": "미국 회계감사원 브로드밴드 프로그램 권고"}, {"title": "국회, 'AI기본사회법' 발의…공공서비스·국민 권리 강화", "summary": "국민이 AI 공공서비스를 차별 없이 이용하고 AI 판단에 대한 설명이나 재검토를 요구할 수 있도록 하는 AI기본사회법이 발의되었습니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:09", "url": "https://zdnet.co.kr/view/?no=20260903170814", "category": "policy", "importance": 3, "wl": true, "topic": "국회 ai기본사회법 발의"}, {"title": "Satcom spectrum fee: DCC may soon decide airwave charges, allocation terms", "summary": "인도 통신규제위원회(DCC)가 정지궤도 위성 기반 고정 위성 네트워크에 대한 주파수 요금 및 할당 조건을 곧 결정할 예정이다. 현재 3~4% 수준인 조정총매출액(AGR) 기반 스펙트럼 요금 체계에 변화가 예상된다. 위성통신 사업자들의 비용 구조에 직접적인 영향을 미칠 전망이다.", "source": "ET Telecom", "date": "2026-09-03 11:10", "url": "https://telecom.economictimes.indiatimes.com/news/portal-in-portal/satcom/satcom-spectrum-fee-dcc-may-soon-decide-airwave-charges-allocation-terms/133723333", "category": "policy", "importance": 3, "wl": true, "topic": "인도 위성통신 주파수 요금 결정"}, {"title": "AI regulatory regime should be nimble, not over-constraining: Top PM advisor", "summary": "인도의 최고 총리 자문위원이 AI 규제 체제가 지나치게 억압적이지 않고 기민해야 한다고 강조했다. 인도는 2026년 2월 정보통신법 개정을 통해 AI와 딥페이크 규제 규범을 마련한 바 있다. 통신 및 IT 규제 환경의 유연성 확보 필요성을 시사한다.", "source": "ET Telecom", "date": "2026-09-03 16:55", "url": "https://telecom.economictimes.indiatimes.com/news/policy/ai-regulatory-regime-should-be-nimble-not-over-constraining-top-pm-advisor/133729523", "category": "policy", "importance": 2, "wl": true, "topic": "인도 ai 규제 체제 기민성 강조"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에서의 사설 5G 배치를 위한 새로운 계획을 마련했으나, 구체적인 주파수 할당 계획은 포함되지 않았습니다. 제조 및 산업용 5G 확산을 위한 정책적 시도가 계속되고 있으나 실효성에 대한 의문이 제기됩니다. 향후 주파수 할당 여부가 정책 성패를 가를 것으로 보입니다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 2, "wl": true, "topic": "중국 사설 5g 규제 완화 시도"}, {"title": "The Kingsbury Commitment Promised Competition. AT&T Got 98% of Long Distance - Broadband B", "summary": "과거 킹스베리 약정(Kingsbury Commitment)이 약속했던 통신 시장 경쟁 체제와 달리 AT&T가 장거리 전화 시장의 98%를 독점하게 되었던 역사적 배경을 분석한 회고 기사입니다.", "source": "Broadband Breakfast", "date": "2026-09-02 21:30", "url": "https://broadbandbreakfast.com/the-kingsbury-commitment-promised-competition-at-t-got-98-of-long-distance/", "category": "policy", "importance": 2, "wl": false, "topic": "at&t 역사적 독점"}], "carrier": [{"title": "통신3사, “AI 네트워크는 국가 전략 인프라, 지원책 절실” 한목소리", "summary": "국내 통신 3사가 5G SA와 6G 등 신기술 투자 필요성을 강조하며 정부에 AI 네트워크 인프라 지원을 촉구했습니다. 시장 성장이 정체된 상황에서 투자를 통한 수익 창출의 어려움을 토로했습니다. 네트워크 정책의 패러다임 전환과 정부 지원책 마련이 주요 화두로 부각되었습니다.", "source": "kidd.co.kr", "date": "2026-09-03 17:40", "url": "https://kidd.co.kr/news/247290", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai 네트워크 지원 촉구"}, {"title": "SKT·KT·LGU+, 정부에 '네트워크 투자' 지원 촉구", "summary": "통신 3사가 정부에 네트워크와 6G 투자 지원을 촉구하며 AI 네트워크의 국가 전략 인프라 지정을 요구했습니다. 기술 개발을 넘어 현장 실증과 초기 수요 창출로 이어지는 정책적 뒷받침을 강조했습니다. 통신 인프라 정책 방향에 큰 영향을 미치는 이슈입니다.", "source": "bloter.net", "date": "2026-09-03 15:58", "url": "https://www.bloter.net/news/articleView.html?idxno=672549", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 네트워크 투자 지원"}, {"title": "Elliott builds stake in Deutsche Telekom - Bilyonaryo Business", "summary": "행동주의 헤지펀드 엘리엇(Elliott)이 유럽 대표 통신사 도이치텔레콤(Deutsche Telekom)의 지분을 대거 매입하며 주주 행동주의를 본격화했습니다. 주요 통신사의 지배구조와 투자 동향을 다룹니다.", "source": "Bilyonaryo Business", "date": "2026-09-03 12:38", "url": "https://bilyonaryo.com/elliott-builds-stake-in-deutsche-telekom/", "category": "contract", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분"}, {"title": "Elliott Builds Stake in Deutsche Telekom Amid T-Mobile Merger Talks - Global Banking & Fin", "summary": "행동주의 펀드 엘리엇이 티모바일과의 합병 협상 과정에 있는 도이치텔레콤의 지분을 확보했습니다. 양사 간의 복잡한 M&A 및 구조 개편 협상에 변수로 작용할 전망입니다. 글로벌 통신 시장의 거대 자본 이동과 지배구조 변화를 보여주는 사례입니다. 향후 북미 및 유럽 통신 시장의 합병 구도에 미칠 영향이 주목됩니다.", "source": "Global Banking & Finance Review", "date": "2026-09-03 10:18", "url": "https://www.globalbankingandfinance.com/elliott-built-stake-deutsche-telekom-opposes-t-mobile-merger/", "category": "contract", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분 인수"}, {"title": "CHTR Stock Pops As Spectrum, Cox, Liberty Deals Reshape Charter - timothysykes.com", "summary": "스펙트럼, 콕스, 리버티 등 주요 케이블 및 통신 사업자 간의 인수합병 및 파트너십 딜이 이어지면서 차터 커뮤니케이션즈의 주가가 급등세를 기록했습니다. 북미 통신·케이블 시장의 대형 구조조정 소식입니다.", "source": "timothysykes.com", "date": "2026-09-03 05:47", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02-2/", "category": "contract", "importance": 4, "wl": false, "topic": "차터 m&a 재편"}, {"title": "CHTR Stock Pops As Charter Leans Into Scale And Streaming Bundles - timothysykes.com", "summary": "미국 통신사 차터 커뮤니케이션즈가 규모의 경제 확보와 스트리밍 번들 상품 결합 전략에 적극적으로 나서며 주가 반등을 기록했습니다. 통신·케이블 사업 확장 전략입니다.", "source": "timothysykes.com", "date": "2026-09-03 04:03", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "contract", "importance": 4, "wl": false, "topic": "차터 스케일 전략"}, {"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "과기정통부와 이통 3사가 세제·주파수·규제 개선 민관협의체를 통해 네트워크 및 AIDC 지원 방안을 논의했습니다. 3G 종료와 5G·6G 투자를 위한 투자환경 개선 패키지가 검토됩니다. 통신 정책과 규제 환경에 직접적인 영향을 미치는 주요 협의입니다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 4, "wl": false, "topic": "이통3사 네트워크 지원 촉구"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "통신사들이 3G 레거시 네트워크 유지 부담 속에서 5G SA와 6G 등 AI 네트워크 고도화를 위한 정부 지원을 촉구했습니다. 과기정통부는 새로운 네트워크 투자 편익을 위한 민관 협력을 약속했습니다. 차세대 통신 인프라 구축을 위한 정책적 지원 방안이 논의됩니다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 4, "wl": false, "topic": "통신망 고도화 정부 지원"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "통신사들이 AI-RAN, 6G 등 차세대 네트워크 투자 확대에 따라 기지국 중심의 CAPEX 지표 보완과 개방형 시설 세액공제 요건 완화를 요구했습니다. 과기정통부 등과의 정책 논의를 통해 투자를 유인할 제도 개선이 검토되고 있습니다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 capex 지표 보완"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "AI 트래픽 폭증에 대응해 5G SA, AI-RAN, 6G 등 네트워크 투자를 국가 AI 인프라 차원에서 지원해야 한다는 목소리가 커졌습니다. 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토 중입니다. 국가 통신 인프라 정책의 중요한 전환점입니다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 4, "wl": false, "topic": "ai 트래픽 네트워크 인프라"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "통신 3사가 망 투자 부담과 수익성 한계를 지적하며 3G 종료 및 6G 투자 등 AI 시대에 맞는 통신 정책 재구성을 촉구했습니다. 과기정통부는 새로운 네트워크 투자를 유인하기 위한 방안을 검토 중입니다. 통신 규제 및 정책 환경의 변화를 예고하는 보도입니다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai시대 정책 개편"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계가 통신사의 AI 네트워크 및 데이터센터(AIDC) 투자를 촉진하기 위해 망 중립성 가이드라인 정비와 주파수 할당 대가·전파사용료 인하를 촉구했습니다. 통신 규제 완화를 통한 민간 투자 유도 방안이 논의되었습니다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 nw dc 투자 지원"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "통신사가 연간 수천억 원에 달하는 주파수 할당 대가와 전파사용료를 부담하는 상황에서, 이를 AI 인프라 및 설비 투자 확대와 연계할 필요가 있다는 주장이 제기되었습니다. 국회 현장에서 통신 인프라 규제 완화 해법이 논의되었습니다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 4, "wl": false, "topic": "ai 인프라 투자 해법"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신사가 부담하는 주파수 할당 대가, 전파사용료 등 연간 1조 원에 달하는 규제 비용이 6G 상용화와 AI 네트워크 투자에 걸림돌로 지적되었습니다. 투자를 가로막는 규제 비용의 합리화가 시급하다는 업계의 목소리가 커지고 있습니다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 규제비용 부담"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "AI 3대 강국 도약을 위해 주파수 할당 대가와 전파사용료 등 정책성 비용을 낮추고 민간 투자를 이끌어내야 한다는 제언이 나왔습니다. AIDC 등 AI 인프라 투자를 위한 시행령 정교화가 강조되었습니다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 4, "wl": false, "topic": "ai 3대 강국 인프라 지원"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤의 통신 본업 회복과 함께 신규 주파수 할당, 5G SA 상용화, AI 기지국 보급 확대 정책 논의 가능성이 제기되었습니다. AI 성장의 축인 데이터센터와 기지국 투자가 맞물려 통신사 가치 재평가로 이어지고 있습니다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "policy", "importance": 4, "wl": false, "topic": "skt 본업 회복 ai 가치"}, {"title": "[4th-AI] \"AI 3대 강국 가려면 통신망 규제 풀고 AIDC 지원 체계 손봐야\"", "summary": "AI 3대 강국 도약을 위해 통신망 규제를 풀고 전파사용료 등 연간 2000억 원에 달하는 비용 부담을 재검토해야 한다는 전문가 지적입니다. 통신사의 투자 여력 확충을 위한 제도 개선이 촉구되었습니다.", "source": "4th.kr", "date": "2026-09-02 12:24", "url": "http://www.4th.kr/news/articleView.html?idxno=2117312", "category": "policy", "importance": 4, "wl": false, "topic": "통신망 규제 완화 aidc"}, {"title": "AI가 네트워크를 바꾼다…\"통신망 투자 수익성 확보해야\"", "summary": "AI 시대 유무선 네트워크 확충을 위해 투자세액공제 확대와 주파수 할당 대가·전파사용료 완화 등 투자 인센티브 마련이 제안되었습니다. 통신사의 선제적 인프라 투자를 유도하는 정책적 지원이 필수적입니다.", "source": "koit.co.kr", "date": "2026-09-02 11:18", "url": "https://www.koit.co.kr/news/articleView.html?idxno=208798", "category": "policy", "importance": 4, "wl": false, "topic": "ai 네트워크 투자 인센티브"}, {"title": "티빙 '늑장 신고' 해명 … \"보안 체계 근본부터 재구축\"", "summary": "티빙이 정보통신망법상 침해사고 인지 후 24시간 이내 신고 의무를 위반하여 과기정통부로부터 최대 3000만 원의 과태료를 부과받을 예정입니다. 보안 부서의 인지 지연과 늑장 신고 경위가 밝혀졌습니다. 정부의 사이버 침해 규제 집행 사례입니다.", "source": "safetimes.co.kr", "date": "2026-09-03 21:36", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=245438", "category": "policy", "importance": 3, "wl": false, "topic": "티빙 늑장 신고 과태료"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": "버진미디어O2(VMO2)가 북아일랜드 지역에 5G 독립모드(SA) 서비스를 도입하며 네트워크 고도화에 나섰습니다. 이와 함께 SMS 블이스터 차단 기술 도입, 오렌지의 사설 5G 커버리지 확대, 노키아의 새로운 API 고객 확보 소식이 전해졌습니다. 유럽 주요 통신사들은 차세대 통신 기술 도입과 보안 강화를 지속하고 있습니다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 3, "wl": true, "topic": "버진미디어o2 5g sa 도입"}, {"title": "울산 시내버스, 차세대 와이파이로 싹 바꾼다", "summary": "울산시가 시내버스 전체 762대의 노후 와이파이를 철거하고 5G 백홀 기반의 차세대 와이파이7로 전면 교체합니다. 통신 품질을 대폭 향상시키고 실시간 장애 대응 효율을 개선하는 공공 통신 인프라 고도화 사업입니다. 지자체의 공공 무선통신망 업그레이드 모범 사례입니다.", "source": "ujeil.com", "date": "2026-09-03 20:46", "url": "http://www.ujeil.com/news/articleView.html?idxno=391509", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이"}, {"title": "Airtel ARPU Could Hit Rs 325 by FY29 - TelecomTalk", "summary": "인도 통신사 바르티 에어텔(Bharti Airtel)의 가입자당 평균 매출(ARPU)이 회계연도 2029년까지 325루피까지 상승할 것이라는 증권가 전망이 나왔습니다. 인도 통신 시장 성장성 분석입니다.", "source": "TelecomTalk", "date": "2026-09-03 19:55", "url": "https://telecomtalk.info/airtel-arpu-could-hit-rs-325-by-fy29/1011523/", "category": "earnings", "importance": 3, "wl": false, "topic": "바르티 에어텔 arpu"}, {"title": "VodafoneThree declares 5G network slicing war on BT", "summary": "보다폰쓰리(VodafoneThree)가 BT와의 경쟁에서 우위를 점하기 위해 '슈퍼모바일' 요금제를 선보이며 5G 네트워크 슬라이싱 경쟁에 돌입했습니다. 이 요금제는 BT의 동등한 서비스에는 없는 보증 사항들을 포함하고 있습니다. 통신사 간의 차별화된 네트워크 서비스 경쟁이 더욱 치열해질 전망입니다.", "source": "Light Reading", "date": "2026-09-03 18:23", "url": "https://www.lightreading.com/5g/vodafonethree-declares-5g-network-slicing-war-on-bt", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 5g 네트워크 슬라이싱 경쟁"}, {"title": "AI pushes fiber networks toward a capacity crunch, AFL says", "summary": "AFL의 노아 테일러는 RCR과의 인터뷰에서 광케이블 가용성과 전력 제약의 결합이 AI 인프라 구축에 추가적인 도전 과제를 제시하고 있다고 밝혔습니다. AI 트래픽 급증으로 인한 네트워크 병목현상 우려가 제기되고 있습니다.", "source": "RCR Wireless", "date": "2026-09-03 16:07", "url": "https://rcrwireless.com/20260903/networks/ai-fiber-afl", "category": "tech", "importance": 3, "wl": true, "topic": "ai 트래픽 광케이블 용량 압박"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - PRESS9", "summary": "SK텔레콤과 LG유플러스가 그동안 줄여왔던 네트워크 망 투자를 다시 늘릴 가능성이 제기되고 있습니다. 5G SA 고도화와 신규 주파수 경매 여부가 향후 투자 규모의 주요 변수로 작용할 전망입니다. 국내 통신사 투자 전략을 다룹니다.", "source": "PRESS9", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "contract", "importance": 3, "wl": false, "topic": "sk텔레콤·lg유플러스 망 투자"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 아마존웹서비스(AWS)의 얀 호프메이어를 신임 최고기술체이번 인사를 통해 클라우드 및 네트워크 기술 연계와 디지털 전환 전략을 강화할 것으로 기대됩니다. 주요 통신사의 최고기술경영자 교체는 향후 기술 로드맵에 영향을 미칠 전망입니다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aw   let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
