ce": "RCR Wireless", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-Channel", "category": "tech", "importance": 4, "wl": true, "topic": "에릭슨 인벤토리"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - developingtelecoms.com", "summary": "에릭슨이 사우디 STC와 5G 네트워크 확장을 위한 다년 계약을 체결했다. 중동 시장 내 5G 인프라 점유율을 공고히 하는 중요한 전략적 계약 성과이다. 양사 간의 장기 파트너십을 강화하는 계기가 된다.", "source": "developingtelecoms.com", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 stc 계약"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 화웨이 제재가 부품 공급망 전반으로 확대되면서 국내 통신 장비 및 부품 업체들에 미칠 잠재적 영향과 우려가 제기되고 있다. 글로벌 공급망 재편 속에서 국내 부품 생태계의 대응 전략이 요구된다. 대외 리스크 요인으로 작용한다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 4, "wl": false, "topic": "미국 화웨이 제재 부품 확산"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "에릭슨이 한 번의 전파 송출로 고속 데이터 전송과 사물 탐지를 동시에 처리하는 6G 통신 신기술을 공개했다. 통신용과 레이더용 주파수를 따로 할당할 필요가 없어 주파수 효율성이 극대화된다. 하나의 기지국 및 단말기 장비로 두 가지 기능을 수행할 수 있는 혁신적인 기술력이다. 글로벌 장비 시장에서 에릭슨의 기술 리더십을 각인시키는 계기가 되었다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 통신 신기술"}, {"title": "Samsung wins ZTE 5G patent case, raising difficult questions for UK courts - IAM Patent", "summary": "삼성전자가 화웨이와의 5G 특허 소송에서 승소함에 따라 영국 법원의 판결 기준과 향후 글로벌 통신 장비 특허 분쟁에 미칠 파장이 주목된다. 통신 장비 업계의 지식재산권 공방에 중요한 선례가 될 수 있다.", "source": "IAM Patent", "date": "2026-09-01 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "tech", "importance": 4, "wl": false, "topic": "삼성전자 화웨이 특허 승소"}, {"title": "Huawei Profit Plunges 36% As AI, Chip Investment And Rising Costs Squeeze Margins - Tekedi", "summary": "화웨이의 순이익이 AI 및 칩 투자 비용 증가와 비용 압박으로 인해 전년 대비 36% 급감했다. 공격적인 기술 투자가 단기 수익성에 부담으로 작용하고 있음을 보여준다. 글로벌 장비 시장의 수익성 지표에 영향을 준다.", "source": "Tekedia", "date": "2026-09-01 19:49", "url": "https://www.tekedia.com/huawei-profit-plunges-36-as-ai-chip-investment-and-rising-costs-squeeze-margins/", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 순이익 급감"}, {"title": "우리넷, NIA ‘AI 네트워크 장비 실증’ 주관기관 선정…상용화 추진", "summary": "우리넷이 과학기술정보통신부 산하 NIA의 'AI 네트워크 장비 시범도입 실증' 주관기관으로 선정되었다. AI 데이터센터 및 6G 초정밀 전달망 시스템 기술 개발 과제를 연계하여 기술을 고도화한다. 지연과 손실에 민감한 차세대 네트워크 인프라 상용화를 추진한다. 국내 장비 기업의 기술 경쟁력을 입증하는 사례다.", "source": "edaily.co.kr", "date": "2026-09-03 16:46", "url": "https://www.edaily.co.kr/News/Read?newsId=04572326645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "contract", "importance": 3, "wl": false, "topic": "우리넷 ai 네트워크 장비 실증"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "알에프텍이 5G 통신 장비와 방산 RF 기술 경쟁력을 강화하기 위해 R&D 조직을 자회사 'RFTC'로 분리한다. 5G 안테나 및 필터 기술의 독자적 플랫폼 고도화가 목적이다. 전문화된 자회사 출범을 통해 통신 및 방산 분야 수주 확대를 도모한다. 향후 신사업 성장에 대한 기대감을 높이고 있다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 rftc 자회사 분리"}, {"title": "우리넷, AI 데이터센터 겨냥 '16Tbps급 네트워크' 실증… 6G 까지 기술 확...", "summary": "우리넷이 AI 데이터센터를 겨냥한 16Tbps급 네트워크 장비 실증을 추진한다. 대용량 데이터를 손실 없이 전달하는 고성능 전송 기술을 시험망에서 검증한다. 향후 6G 초정밀 전달망까지 사업 영역을 확장한다는 전략이다. 차세대 하이엔드 네트워크 장비 시장에서의 경쟁력 확보를 도모하고 있다.", "source": "joongangenews.com", "date": "2026-09-03 15:18", "url": "https://www.joongangenews.com/news/articleView.html?idxno=545385", "category": "tech", "importance": 3, "wl": false, "topic": "우리넷 16tbps 네트워크 실증"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - The Fast", "summary": "에릭슨이 사우디아라비아에서 모빌리와 협력하여 AI 기반 무선 접속망(RAN)과 자율 네트워크 구축을 추진한다. 중동 통신 시장에서의 AI 네트워크 적용 사례를 확대하는 기술 협력 성과이다. 에릭슨의 차세대 솔루션 역량을 보여준다.", "source": "The Fast Mode", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 모빌리 협력"}, {"title": "알에프텍, 5G 기술 방산으로 확대…RF 자회사 'RFTC' 출범", "summary": "알에프텍은 지난 2019년 삼성전자에 5G 안테나 필터 유닛을 공급하며 RF 장비 시장에 진입했다. Massive MIMO 기지국용 안테나 및 필터 유닛을 공급하며 설계 및 제조 역량을 축적해왔다. 삼성전자를 비롯한 주요 고객사와의 협력을 통해 기술력을 검증받았다. 향후 방산 등으로 사업 영역을 확장하는 발판이 되었다.", "source": "fnnews.com", "date": "2026-09-03 13:41", "url": "https://www.fnnews.com/news/202609031334337249", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 삼성전자 협력"}, {"title": "DX 적자 속… 삼성전자 동행, 서초 이어 16~30일 이재용 자택 앞 집회", "summary": "삼성전자 DX부문 산하의 모바일경험(MX) 및 네트워크 사업부가 부진한 실적을 기록했다. 글로벌 통신 장비 시장의 투자 정체 속에서 실적 부진 요인이 분석되었다. 네트워크 사업부의 수익성 개선이 주요 과제로 대두되고 있다. 향후 글로벌 수주 확대를 통한 반등이 요구된다.", "source": "inews24.com", "date": "2026-09-03 11:26", "url": "http://www.inews24.com/view/2001496", "category": "earnings", "importance": 3, "wl": false, "topic": "삼성전자 네트워크사업 실적"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 6G 기지국을 활용해 드론을 탐지하는 기술 시연에 성공했다. 차세대 통신 인프라의 다목적 활용 가능성을 제시하며 향후 보안 및 관제 영역으로 확장할 수 있는 기반을 마련했다. 장비의 부가가치를 높이는 기술적 성과다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 드론 탐지 기술"}, {"title": "브로드컴 “AI칩 매출 3배↑”… 삼성 수혜 기대감 커진다", "summary": "브로드컴이 맞춤형 AI 가속기와 AI 네트워크 반도체 수요 급증에 힘입어 3배 이상 늘어난 AI칩 매출을 기록했다. AI 인프라 투자 확대로 인해 네트워크 반도체 생태계가 전체적으로 성장하고 있다. 이 과정에서 삼성전자와의 협력 가능성 및 수혜 기대감이 커지고 있다. 글로벌 AI 칩 시장의 가파른 성장세를 보여준다.", "source": "dt.co.kr", "date": "2026-09-03 08:45", "url": "https://www.dt.co.kr/article/12081849?ref=naver", "category": "earnings", "importance": 3, "wl": false, "topic": "브로드컴 ai칩 실적"}, {"title": "Ericsson powers Saudi Arabia’s next phase of digital transformation and innovation - Tahaw", "summary": "에릭슨이 사우디아라비아의 차세대 디지털 전환과 기술 혁신 과정에서 핵심적인 기술 지원 역할을 수행한다.", "source": "TahawulTech.com", "date": "2026-09-03 07:04", "url": "https://www.tahawultech.com/home-slide/ericsson-powers-saudi-arabias-next-phase-of-digital-transformation-and-innovation/", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 사우디 디지털 전환"}, {"title": "Nokia opens Saudi Arabia R&D centre - Mobile World Live", "summary": "노키아가 사우디아라비아에 새로운 연구개발(R&D) 센터를 개소하고 AI 기반 네트워크 자동화 기술 개발에 집중한다. 중동 시장을 겨냥한 전략적 기술 거점을 확보하며 현지 통신 인프라 혁신을 지원한다. 에릭슨 등과의 중동 경쟁 구도에 영향을 미친다.", "source": "Mobile World Live", "date": "2026-09-02 21:07", "url": "https://www.mobileworldlive.com/nokia/nokia-opens-saudi-arabia-rd-centre/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 r&d 센터 개소"}, {"title": "Saudi’s ACES announces 5G and 6G partnership with Movandi - developingtelecoms.com", "summary": "사우디 ACES가 모반디와 5G 및 6G 기술 협력을 위한 파트너십을 체결하고 차세대 통신 기술 개발에 나선다.", "source": "developingtelecoms.com", "date": "2026-09-02 20:57", "url": "https://www.developingtelecoms.com/regions/central-eastern-europe-telecommunications/20770-saudis-aces-announces-5g-and-6g-partnership-with-movandi.html", "category": "tech", "importance": 3, "wl": false, "topic": "사우디 aces 모반디 파트너십"}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "에릭슨이 금융 기술 서비스를 강화하는 한편 노키아는 사우디아라비아에서 네트워크 자동화 기술 개발에 착수했다. 글로벌 통신장비 경쟁사들이 소프트웨어 및 이종 산업과의 융합을 통해 사업 다각화를 꾀하고 있다. 이는 전통적인 네트워크 시장의 정체를 극복하기 위한 전략적 움직임으로 분석된다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "h tml", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 리야드 r&d 센터 개소"}, {"title": "Qualcomm stakes its claim on an AI-native 6G future - Mobile World Live", "summary": "퀄컴이 AI 네이티브 기반의 6G 미래 비전을 제시했다. 인공지능과 차세대 이동통신 기술의 융합을 통한 성능 극대화를 강조했다. 6G 표준화 과정에서 주도권을 잡기 위한 기술 전략을 공개했다. 향후 통신 칩셋 시장에서의 경쟁 구도에 변화를 예고했다.", "source": "Mobile World Live", "date": "2026-09-01 20:04", "url": "https://www.mobileworldlive.com/qualcomm-stakes-its-claim-on-an-ai-native-6g-future/", "category": "tech", "importance": 3, "wl": false, "topic": "퀄컴 6g 비전 발표"}], "policy": [{"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도 정부가 국가 안보를 이유로 기존에 설치된 화웨이, ZTE 등 중국산 통신장비를 전면 교체하는 정책 도입을 검토 중이다. 이번 조치가 확정될 경우 중국 장비업체들의 퇴출 압박이 더욱 거세질 전망이다. 이는 에릭슨, 노키아, 삼성전자 등 비중국계 통신장비 제조사들에게 인도 시장 점유율을 확대할 수 있는 대형 기회로 작용할 수 있다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도 중국산장비 규제"}, {"title": "India weighs ‘rip and replace’ plan for Chinese telecom gear - Communications Today", "summary": "인도 정부가 국가 안보를 이유로 중국산 통신 장비를 전면 퇴출하고 교체하는 립 앤 리플레이스 계획을 본격 검토 중이다. 화웨이와 ZTE 장비에 대한 제재가 더욱 강화될 것으로 전망된다. 글로벌 통신 장비 시장의 판도에 큰 영향을 미치는 규제 조치다.", "source": "Communications Today", "date": "2026-09-01 19:18", "url": "https://www.communicationstoday.co.in/india-weighs-rip-and-replace-plan-for-chinese-telecom-gear/", "category": "policy", "importance": 5, "wl": false, "topic": "인도 중국산 장비 퇴출"}, {"title": "Satcom spectrum fee: DCC may soon decide airwave charges, allocation terms - The Economic ", "summary": "인도 정부가 위성통신 주파수 사용료 산정 및 주파수 할당 조건에 대한 최종 결정을 조만간 내릴 예정이어서 업계의 이목이 집중되고 있다. 위성 사업자들의 진입 비용과 시장 경쟁에 큰 영향을 미친다.", "source": "The Economic Times", "date": "2026-09-03 04:01", "url": "https://economictimes.indiatimes.com/industry/telecom/satcom-spectrum-fee-dcc-may-soon-decide G 1등 국가의 조건", "summary": "세계 최초 상용화보다는 최고 기술을 갖춘 진정한 의미의 '6G 1등 국가'가 되어야 한다는 정책적 제언이 제기됐다. 과거 5G 상용화의 교훈을 바탕으로 기술과 산업적 실속을 챙기겠다는 의도다. 국가 차원의 장기적인 R&D와 생태계 조성이 강조되고 있다. 향후 정부의 차세대 통신 R&D 방향에 시사점을 준다.", "source": "etnews.com", "date": "2026-09-03 13:44", "url": "https://www.etnews.com/20260903000237", "category": "policy", "importance": 3, "wl": false, "topic": "6g 1등 국가 전략"}, {"title": "DoT leaning toward 5% AGR-linked charge for satellite spectrum - Communications Today", "summary": "인도 통신부(DoT)가 위성 주파수 할당과 관련해 조정총매출(AGR) 연계 수수료를 5% 수준으로 검토하고 있다. 위성통신 사업자들의 진입 장벽을 낮추고 투자를 촉진하기 위한 조치다. 인도 정부의 유연한 규제 완화 기조를 반영한다. 향후 현지 위성통신 시장 활성화에 긍정적 영향을 미칠 것으로 예상된다.", "source": "Communications Today", "date": "2026-09-03 11:49", "url": "https://www.communicationstoday.co.in/dot-leaning-toward-5-agr-linked-charge-for-satellite-spectrum/", "category": "policy", "importance": 3, "wl": false, "topic": "인도통신부 위성통신 정책"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부가 산업 현장의 사설 5G망 구축을 위한 규제 완화를 추진하고 있으나 주파수 할당 방안이 빠져 있어 실효성 논란이 일고 있다. 이번 조치는 산업 디지털화를 촉진하려는 의도이나 주파수 미확보로 초기 단계에 머물러 있다. 향후 중국 내 사설 5G 장비 시장의 성장 속도에 영향을 미칠 수 있다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 사설5g 규제"}, {"title": "Foreign Air Carriers To Challenge FCC Altimeters Order - Law360", "summary": "외항 항공사들이 FCC의 고도계 관련 명령에 대해 법적 대응을 검토 및 추진하고 있다. 5G 통신 주파수와 항공기 전파 고도계 간의 간섭 문제를 둘러싼 갈등의 연장선이다. 규제 당국과 산업계 간의 조율 과정이 지속되고 있다. 향후 통신 주파수 운용 정책에 영향을 미칠 수 있는 사안이다.", "source": "Law360", "date": "2026-09-02 08:16", "url": "https://www.law360.com/articles/2520343/foreign-air-carriers-to-challenge-fcc-altimeters-order", "category": "policy", "importance": 3, "wl": false, "topic": "법률신문 fcc 규제 대응"}, {"title": "티빙 이용자 4000만명 정보 유출…시작은 접속키 하나였다", "summary": "이에 과기정통부 는 정보 통신 망법 제76조에 따라 최대 3000만원의 과태료를 부과할 예정이다. 과기정통부 .bloomberg.com/news/articles/2026-09-02/elliott-builds-deutsche-telekom-stake-opposes-t-mobile-merger", "category": "contract", "importance": 4, "wl": false, "topic": "도이치텔레콤 지분매입"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - PRESS9", "summary": "SK텔레콤과 LG유플러스가 5G SA 고도화 및 향후 주파수 경매 변수에 대응해 그간 축소해 온 네트워크 망 투자를 다시 늘릴 가능성이 제기되고 있다. 국내 이동통신사의 설비투자(CAPEX) 기조 변화를 나타낸다. 삼성전자 등 국내 장비 공급사들의 실적에 직결되는 사안이다.", "source": "PRESS9", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 lg유플러스 망 투자 재개"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 아마존웹서비스(AWS)의 얀 호프메이어를 차기 최고기술책임자(CTO)로 영입했다. 호프메이어는 2026년 11월부터 합류하여 기술 전략 강화를 이끌 예정이다. 현 최고재무책임자(CFO)인 크리스티안 일렉은 2027년 5월 퇴임할 예정이다. 이번 인사는 도이치텔레콤의 클라우드 및 차세대 네트워크 기술 혁신을 가속화하기 위한 전략적 행보로 풀이된다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 4, "wl": true, "topic": "도이치텔레콤 임원"}, {"title": "Elliott Builds Stake in Deutsche Telekom Amid T-Mobile Merger Talks - Global Banking & Fin", "summary": "행동주의 펀드 엘리엇이 T-Mobile과의 합병 논의 속에서 도이치텔레콤의 지분을 구축했다. 글로벌 주요 통신사 간의 지배구조 개편 및 M&A 움직임을 보여준다. 통신 시장의 투자 가치 제고를 위한 전략적 행보로 해석된다. 향후 도이치텔레콤의 경영 전략에 변수로 작용할 수 있다.", "source": "Global Banking & Finance Review", "date": "2026-09-03 10:18", "url": "https://www.globalbankingandfinance.com/elliott-built-stake-deutsche-telekom-opposes-t-mobile-merger/", "category": "contract", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분"}, {"title": "LG·보안업계 뭉친 연합군 통했다…네이버, SKT 꺾고 `K-미토스` 개발 (종합) - 디지털데일리", "summary": "정부 보안 AI 사업자로 네이버가 최종 선정되면서 SKT가 탈락했습니다. 주요 기업 간 공공 AI 사업 수주 경쟁의 결과 확정입니다.", "source": "디지털데일리", "date": "2026-09-03 10:16", "url": "https://www.ddaily.co.kr/page/view/2026090310122915637", "category": "contract", "importance": 4, "wl": false, "topic": "skt 정부사업탈락"}, {"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "이통 3사가 세제 혜택, 주파수 제도 개선, 규제 완화 등 네트워크 및 AI 데이터센터(AIDC) 지원 강화를 요구했다. 과기정통부 통신정책기획과장은 민관협의체를 통해 투자 환경 개선을 적극 논의하겠다고 화답했다. 3G 종료 등 레거시 네트워크 정리를 통한 투자가 재원 확보 방안으로 거론되었다. 통신 인프라 고도화를 위한 민관 협력이 본격화되고 있다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 네트워크 투자 지원"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "AI 트래픽이 5년 뒤 최대 5배 폭증할 것으로 예상됨에 따라 네트워크를 국가 AI 인프라로 격상해 육성해야 한다는 주장이 제기됐다. 5G SA, AI-RAN, 6G 투자 지원과 함께 서비스 특성에 맞는 품질 제공이 요구된다. 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토하기로 했다. 국가 차원의 전폭적인 통신망 인프라 지원 정책이 가시화되고 있다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 4, "wl": false, "topic": "통신망 국가 ai 인프라 육성"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "통신 3사가 망 투자는 늘고 수익은 정체되는 상황에서 AI 시대에 맞는 정책 재설계를 촉구했다. 3G 종료의 유연화와 6G·SA 투자에 대한 국가적 지원의 필요성을 강조했다. 과기정통부도 새로운 네트워크 투자를 유인하기 위한 정책적 대안을 모색하겠다고 밝혔다. 통신 산업 전반의 구조적 변화를 예고하는 논의가 진행 중이다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai시대 정책 개편"}, {"title": "[현장] 통신업계 \"네트워크도 AI 인프라로 봐야\"…정책 지원 촉구", "summary": "국회 토론회에서 통신업계와 전문가들이 네트워크를 AI 인프라로 규정하고 정부의 전폭적인 정책 지원을 촉구했다. 기존 수익만으로는 6G 등 차세대 네트워크 투자를 감당하기 어렵다는 현장의 목소리가 전달되었다. 국회와 정부는 통신망 투자 활성화를 위한 법안 및 제도 개편을 검토하고 있다. 국가 AI 경쟁력 강화를 위한 핵심 과제로 부상했다.", "source": "newspost.kr", "date": "2026-09-02 16:42", "url": "https://www.newspost.kr/news/articleView.html?idxno=225400", "category": "policy", "importance": 4, "wl": false, "topic": "통신업계 네트워크 ai 인프라"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계가 통신사의 'NW for AI' 투자를 촉진하기 위해 망 중립성 가이드라인 정비와 주파수 할당 대가·전파사용료 인하가 필요하다고 제안했다. 과도한 정책성 비용이 통신사의 차세대 네트워크 투자 여력을 갉아먹고 있다는 지적이다. AI 시대 인프라 선점을 위한 규제 혁신이 시급하다는 목소리가 커지고 있다. 정부의 정책적 결단이 요구되는 시점이다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 ai nw dc 투자 지원"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "통신사가 매년 부담하는 주파수 할당 대가와 전파사용료가 연간 1조원에 달해 부담이 크다는 분석이 나왔다. 재할당 비용 절감과 AI 및 설비 투자를 연계하는 인프라 투자 해법이 제안되었다. 통신망 투자 유인책을 마련해야 국가 AI 경쟁력을 확보할 수 있다는 주장이다. 국정 감사 및 민관 협의의 주요 쟁점으로 다뤄지고 있다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 인프라 투자 해법"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신사들이 주파수 할당 대가와 전파사용료 등 연간 1조원에 달하는 규제 비용으로 인해 투자 여력을 압박받고 있다. 6G 상용화와 AI 네트워크 투자가 본격화되는 시점에서 과도한 정책 비용이 걸림돌로 작용하고 있다. 업계는 실효성 있는 비용 감면과 투자 세액공제 확대 등 제도적 보완을 강력히 요구하고 있다. 통신 산업의 수익성 개선을 위한 핵심 현안이다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 규제비용 부담"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "AI 3대 강국 도약을 위해 망 투자와 AIDC에 대한 민간 투자를 유인해야 한다는 전문가 제언이 나왔다. 주파수 할당 대가 및 전파사용료 등 정책성 비용의 부담을 낮춰 실제 투자 확대로 이어져야 한다고 강조했다. AIDC 투자를 이끌어내기 위한 시행령 정비 등 세부적인 제도 개선이 주문되었다. 정부의 정책적 지원책 마련이 시급하다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 4, "wl": false, "topic": "ai 3대 강국 인프라 지원"}, {"title": "[4th-AI] \"AI 3대 강국 가려면 통신망 규제 풀고 AIDC 지원 체계 손봐야\"", "summary": "AI 3대 강국 도약을 위해 통신망 규제를 풀고 AIDC 지원 체계를 대폭 손봐야 한다는 목소리가 커졌다. 연간 2000억원에 달하는 전파사용료 등 통신사 부담 비용을 투자 여력 관점에서 재검토해야 한다고 촉구했다. 전파 관리 목적 외에 과도하게 부과되는 비용을 합리화해야 한다는 주장이다. 향후 정부의 규제 혁신 방향에 이목이 집중된다.", "source": "4th.kr", "date": "2026-09-02 12:24", "url": "http://www.4th.kr/news/articleView.html?idxno=2117312", "category": "policy", "importance": 4, "wl": false, "topic": "통신망 규제 완화 aidc 지원"}, {"title": "AI가 네트워크를 바꾼다…\"통신망 투자 수익성 확보해야\"", "summary": "AI 시대에 발맞춰 통신사가 유·무선 네트워크를 선제적으로 확충할 수 있도록 투자 인센티브를 마련해야 한다고 제안했다. 투자세액공제 확대와 주파수 할당 대가·전파사용료 부담 완화가 핵심 과제로 꼽힌다. 통신망 투자의 수익성을 확보해야 안정적인 AI 인프라 구축이 가능하다는 논리다. 정부와 업계 간의 제도 개선 논의가 활발히 진행 중이다.", "source": "koit.co.kr", "date": "2026-09-02 11:18", "url": "https://www.koit.co.kr/news/articleView.html?idxno=208798", "category": "policy", "importance": 4, "wl": false, "topic": "ai 네트워크 투자 인센티브"}, {"title": "기업 사정 알려주자 AI 정답률 19%→81%…KT, 기업용 AI 정확도 높인 비결 [현장+] - 쿠키뉴스", "summary": "KT가 기업용 AI의 정확도를 높이는 기술을 개발했습니다. B2B AI 솔루션 경쟁력 강화를 위한 기술 적용 사례입니다.", "source": "쿠키뉴스", "date": "2026-09-03 16:58", "url": "https://www.kukinews.com/article/view/kuk202609030201", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai기술"}, {"title": "울산 시내버스 와이파이 업그레이드…10월 개통", "summary": "울산시가 시내버스 와이파이 시스템을 5G 백홀망과 다중 링크 동작 기술을 적용해 대역폭을 2배로 확장한다. 대중교통 이용객의 무선 인터넷 품질을 대폭 개선하기 위한 인프라 고도화 사업이다. 주말과 야간을 활용한 장비 순차 교체로 운행 차질을 방지한다. 스마트 시티 구현을 위한 공공 통신 인프라 개선 사례다.", "source": "sedaily.com", "date": "2026-09-03 16:57", "url": "https://www.sedaily.com/article/20086896?ref=naver", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 버스 와이파이 고도화"}, {"title": "European Stocks Muted as Deutsche Telekom Gains on Elliott Stake - Bloomberg.com", "summary": "엘리엇의 지분 매입 소식이 유럽 증시에 미친 영향과 도이치텔레콤의 주가 상승을 다룹니다. 대형 통신사 지분 변동이 증시에 미친 파급효과입니다.", "source": "Bloomberg.com", "date": "2026-09-03 16:14", "url": "https://www.bloomberg.com/news/articles/2026-09-03/european-stocks-muted-as-deutsche-telekom-gains-on-elliott-stake", "category": "contract", "importance": 3, "wl": false, "topic": "도이치텔레콤 증시영향"}, {"title": "Deutsche Telekom shares jump after reports say Elliott builds stake, opposes T-Mobile deal", "summary": "엘리엇의 지분 매입 소식과 T-모바일 합병 반대 보도로 도이치텔 ee to launch debut TV service in challenge to UK rivals", "summary": "영국 보다폰이 합병 법인 출범을 앞두고 최초로 자체 TV 서비스를 출시하며 미디어 시장 공략에 나선다. 이는 경쟁사인 BT와 버진미디어 O2에 대응해 결합 상품 경쟁력을 강화하고 가입자 이탈을 막기 위한 전략이다. 네트워크 인프라 투자와 연계된 미디어 서비스 다각화의 일환으로 가입자당평균매출을 높이려는 시도다.", "source": "Financial Times Tech", "date": "2026-09-03 13:00", "url": "https://www.ft.com/content/b44fcdbd-4c0e-4032-b81a-98e309991388", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 tv"}, {"title": "T-Mobile Supports Indiana Communities Following Severe Weather and Prolonged Power Outages", "summary": "티모바일이 악천후와 장기 정전으로 큰 피해를 입은 인디애나 지역 주민들을 대상으로 지원 활동을 벌였다.", "source": "csrwire.com", "date": "2026-09-03 12:39", "url": "https://csrwire.com/press-release/t-mobile-supports-indiana-communities-following-severe-weather-and-prolonged-power-outages/", "category": "outage", "importance": 3, "wl": false, "topic": "티모바일 인디애나 악천후 지원"}, {"title": "베트남은 5G 주파수 확보를 위해 2026년 9월 15일부터 2G 네트워크를 완전히 공식적으로 폐쇄할 예정이다. - vietnam.vn", "summary": "베트남 정부와 통신사가 5G 주파수 확보를 위해 2026년 9월 15일부터 2G 네트워크를 완전 폐쇄한다. 주파수 자원의 재배치를 통해 차세대 통신 인프라 경쟁력을 강화한다. 구형 네트워크의 퇴출은 글로벌 통신 업계의 공통된 흐름이다. 향후 통신사의 투자 여력 확대로 이어질 수 있다.", "source": "vietnam.vn", "date": "2026-09-03 12:05", "url": "https://www.vietnam.vn/ko/viet-nam-chinh-thuc-tat-hoan-toan-mang-2g-tu-ngay-15-9-2026-nham-giai-phong-tan-so-cho-5g", "category": "policy", "importance": 3, "wl": false, "topic": "베트남통신 베트남 2g 종료"}, {"title": "Telekom's Boardroom Reshuffle Puts a 48-Quarter Winning Streak to the Test - AD HOC NEWS", "summary": "도이치텔레콤의 경영진 개편이 회사의 장기적인 성과에 미칠 영향에 대한 분석입니다. 임원진 교체가 실적 유지에 어떤 변수가 될지 다룹니다.", "source": "AD HOC NEWS", "date": "2026-09-03 10:30", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/telekom-s-boardroom-reshuffle-puts-a-48-quarter-winning-streak-to-the-test/70046488", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영진"}, {"title": "KT, 국가 공공사업 수주 '압도적'…해킹에 제동 걸리나 - SR타임스", "summary": "KT의 공공사업 수주 현황과 보안 이슈에 대한 분석입니다. 통신사의 공공 시장 영향력 및 보안 역량 점검 보도입니다.", "source": "SR타임스", "date": "2026-09-03 10:22", "url": "https://www.srtimes.kr/news/articleView.html?idxno=211462", "category": "contract", "importance": 3, "wl": false, "topic": "kt 공공사업수주"}, {"title": "Spectrum COO Nick Jeffery Touts \"The Great Cable Comeback\" As He Assumes Charter Exec Post", "summary": "스펙트럼의 최고운영책임자가 차터의 경영진으로 합류하며 케이블 사업의 부활을 강조했다. 주요 통신사 경영진 이동이다.", "source": "Deadline", "date": "2026-09-03 01:43", "url": "https://deadline.com/2026/09/charter-spectrum-coo-nick-jeffery-great-cable-comeback-1237064469/", "category": "exec", "importance": 3, "wl": false, "topic": "차터 최고운영체제 합류"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 AI-RAN 네트워크 전환 기술을 검증했다. 로봇과 드론 등 피지컬 AI 장비가 시험망과 5G 망을 이동하는 상황을 시뮬레이션했다. 무선 환경 변화에도 최적의 네트워크를 자동으로 선택하고 안정적으로 연결하는 기술을 입증했다. 향후 AI 시대에 대비한 지능형 망 관리 기술 확보에 주력하고 있다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai-ran 검증"}, {"title": "\"삐, 공사장 탐지됐습니다\"…AI가 미리 찾는 통신망 위험 - 네이트", "summary": "인공지능(AI)을 활용하여 공사장 등 통신망 위험 요소를 사전에 탐지하는 기술이 도입되고 있다. 통신 장애를 예방하기 위한 지능형 인프라 관리 시스템의 발전상을 보여준다. 통신사의 네트워크 운영 효율성과 안정성이 크게 향상될 것으로 기대된다. 향후 현장 안전 관리의 핵심 기술로 자리잡을 전망이다.", "source": "네이트", "date": "2026-09-03 00:31", "url": "https://m.news.nate.com/view/20260903n00346?mid=m02&list=recent&cpcd=", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 통신망 감시"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "AI 경쟁력 확보를 위해 레거시 네트워크를 유지하면서 5G SA나 6G에 투자하는 통신사의 부담을 완화해야 한다는 목소리가 나왔다. 정부와 업계는 네트워크 고도화가 가져올 편익과 투자 인센티브에 대해 논의했다. 통신망 투자가 국가 AI 인프라의 핵심임을 재확인했다. 향후 제도적 지원 방안 마련이 주목된다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 3, "wl": fal  경쟁력을 강화한다. 국내 항공 업계의 기내 와이파이 도입 확산에 영향을 미칠 것으로 보인다.", "source": "mk.co.kr", "date": "2026-09-02 14:32", "url": "https://www.mk.co.kr/news/business/12142298", "category": "contract", "importance": 3, "wl": false, "topic": "대한항공 위성통신 도입"}, {"title": "[통신] 베트남 9월 15일 2G 네트워크 완전 종료 예정 - 굿모닝베트남미디어", "summary": "베트남이 오는 9월 15일 2G 네트워크 서비스를 완전히 종료할 예정이다. 주파수 효율성을 높이고 5G 등 차세대 통신망 투자를 가속화하기 위한 조치다. 레거시 네트워크 정리를 통해 통신망 구조를 고도화한다. 베트남 통신사의 경영 효율성 개선에 기여할 전망이다.", "source": "굿모닝베트남미디어", "date": "2026-09-02 14:24", "url": "https://www.goodmorningvietnam.co.kr/news/article.html?no=83373", "category": "policy", "importance": 3, "wl": false, "topic": "굿모닝베트남미디어 베트남 2g 종료"}, {"title": "[현장] \"컴퓨팅 자원만으론 AI 3강 못 간다\"…AI 네트워크 투자 물꼬 트려면 - dailian.co.kr", "summary": "AI 경쟁력 확보를 위해 기존 컴퓨팅 자원뿐만 아니라 차세대 AI 네트워크 인프라 투자가 시급하다는 업계의 지적이 나왔다. 통신 인프라 고도화의 필요성을 강조한다.", "source": "dailian.co.kr", "date": "2026-09-02 13:58", "url": "https://www.dailian.co.kr/news/view/1685489/%ED%98%84%EC%9E%A5-%EC%BB%B4%ED%93%A8%ED%8C%85-%EC%9E%90%EC%9B%90%EB%A7%8C%EC%9C%BC%EB%A1%A0-AI-3%EA%B0%95-%EB%AA%BB-2026", "category": "tech", "importance": 3, "wl": false, "topic": "ai 네트워크 투자 촉구"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤이 통신 본업 회복과 함께 AI 가치를 부각시키며 실적 개선을 도모하고 있다. 신규 주파수 할당, 5G 요금제 개편, 5G SA 상용화와 함께 AI 기지국 보급 확대 정책이 논의되고 있다. 데이터센터와 기지국을 양대 축으로 하는 AI 성장이 본격화되고 있다. 향후 통신 시장에서의 경쟁력이 한층 강화될 전망이다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "contract", "importance": 3, "wl": false, "topic": "sk텔레콤 통신 본업 회복"}, {"title": "여의도 뒤덮을 100만 인파...LG유플러스, 이동기지국·AI로 통신 장애 막는다 - 소비자경제", "summary": "LG유플러스가 대규모 인파가 몰리는 행사에서 이동기지국과 AI 기술을 동원해 통신 장애를 사전 예방한다. 트래픽 폭주 상황에 대응하기 위한 선제적 망 관리 전략이다. 안정적인 통신 품질 유지를 위한 실시간 모니터링 시스템을 가동한다. 대형 이벤트에서의 네트워크 안정성 확보 사례를 보여준다.", "source": "소비자경제", "date": "2026-09-02 12:52", "url": "http://www.dailycnc.com/news/articleView.html?idxno=244607", "category": "tech", "importance": 3, "w   ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
