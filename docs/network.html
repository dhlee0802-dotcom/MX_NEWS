m/2026/09/samsung-and-verizon-complete-real-world.html", "category": "tech", "importance": 4, "sid": "satellite", "topic": "삼성전자 6g 센싱 실증"}, {"title": "KT, AI DC 사업 본격화…전국 20곳 1GW 이상 공급 - 국제신문", "summary": "KT가 AI DC(데이터센터) 사업을 본격화하며 전국 20여 곳에 1GW 이상의 인프라를 공급할 계획이다. 국가 AI 인프라 확충의 핵심 플레이어로 도약하고 있다.", "source": "국제신문", "date": "2026-09-15 13:15", "url": "https://www.kookje.co.kr/news2011/asp/newsbody.asp?code=0200&key=20260915.99099004910", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 aidc 공급 전략"}, {"title": "자람테크놀로지, 해외 고객향 반도체 공급계약 해지…\"선수금 절반 수령\"", "summary": "팹리스 기업 자람테크놀로지가 지난해 12월 글로벌 통신장비업체와 체결했던 1,565만 달러 규모의 XGS-PON 주문형 반도체(ASIC) 2차 설계 및 공급 계약이 고객사로부터 해지 통보를 받았다고 공시했다. 이번 해지된 계약은 1차 제품에 와이파이 기능을 추가한 파생 모델 개발 건이다. 글로벌 통신장비 공급망 내에서 부품 협력사의 수주 변동을 보여주는 사례다.", "source": "ZDNet Korea", "date": "2026-09-15 12:37", "url": "https://zdnet.co.kr/view/?no=20260915084407", "category": "contract", "importance": 4, "sid": "competitor", "topic": "자람테크놀로지 반도체 계약"}, {"title": "ドコモ、26年度中に5G基地局1万局以上を整備へ 通信品質の巻き返し図る - ITmedia", "summary": "NTT 도코모가 2026년 회계연도 내에 5G 기지국을 1만 국 이상 추가 정비할 계획이라고 발표했습니다. 통신 품질의 신뢰를 회복하고 네트워크 경쟁력을 만회하기 위한 대규모 투자입니다.", "source": "ITmedia", "date": "2026-09-15 12:23", "url": "https://www.itmedia.co.jp/news/article/2609/15/2000001479/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 5g 투자"}, {"title": "Verizon expands 6G forum with AWS, Nvidia & others; eyes global standards, ISAC - ET Telec", "summary": "미국 버라이즌이 AWS, 엔비디아 등을 6G 혁신 포럼에 신규 멤버로 영입했다. 글로벌 표준화 주도와 감지 및 통신 통합(ISAC) 기술 상용화를 추진한다. 차세대 이동통신 생태계 구축에 속도를 내고 있다.", "source": "ET Telecom", "date": "2026-09-15 12:09", "url": "https://telecom.economictimes.indiatimes.com/amp/news/industry/verizon-expands-6g-forum-with-aws-nvidia-others-eyes-global-standards-isac/134250890", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 포럼 확대 및 isac 추진"}, {"title": "楽天モバイルの5G投資額『ドコモの約1/10』でダントツ最下位に、auローミング終了でエリア整備コスト追加で発生へ - Buzzap！（バザップ！）", "summary": "라쿠텐 모바일의 5G 투자액이 도코모의 10분의 1 수준으로 최하위를 기록했다. au 로밍 종료에 따른 추가적인 에어리어 정비 비용 발생이 예상되는 등 재정적 부담이 제기되고 있다.", "source": "Buzzap！（バザップ！）", "date": "2026-09-15 12:00", "url": "https://buzzap.jp/news/20260915-rakuten-5g-network-cost-4g/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "라쿠텐 모바일 5g 투자"}, {"title": "NTT Docomo begins deployment of Nokia Open RAN gear in Japan - ET Telecom", "summary": "일본 NTT도코모가 노키아의 오픈랜(Open RAN) 장비 상용화 배포를 본격 시작했다. 개방형 무선 접속망 도입을 통해 네트워크 유연성을 높인다는 전략이다. 글로벌 오픈랜 생태계 확장에 기여한다.", "source": "ET Telecom", "date": "2026-09-15 11:58", "url": "https://telecom.economictimes.indiatimes.com/amp/news/telecom-equipment/ntt-docomo-begins-deployment-of-nokia-open-ran-gear-in-japan/134250729", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt도코모 노키아 오픈랜 장비 도입"}, {"title": "KDDIとSpaceX、次世代衛星「Starlink Mobile V2」契約 27年に音声通話も", "summary": "KDDI는 스페이스X와 아시아 최초로 차세대 위성 'Starlink Mobile V2' 서비스 제공 계약을 체결했다. 스마트폰과 위성의 직접 통신 서비스를 통해 2027년 내 고속 데이터 및 음성 통화(VoLTE) 제공을 목표로 한다. 위성통신과 지상 이동통신 간의 결합을 가속화하는 계약이다.", "source": "ケータイ Watch", "date": "2026-09-15 11:57", "url": "https://k-tai.watch.impress.co.jp/docs/news/2140947.html", "category": "contract", "importance": 4, "sid": "satellite", "topic": "kddi 스타링크"}, {"title": "KDDIとSpaceX、次世代衛星「Starlink Mobile V2」契約 27年に音声通話も - k-tai.watch.impress.co.jp", "summary": "KDDI가 스페이스X와 차세대 스타링크 모바일 V2 계약을 체결하고 2027년부터는 음성 통화 서비스까지 제공할 계획입니다. 위성 기반 통신 서비스의 상용화 범위가 넓어지고 있습니다.", "source": "k-tai.watch.impress.co.jp", "date": "2026-09-15 11:57", "url": "https://k-tai.watch.impress.co.jp/docs/news/2140947.html", "category": "contract", "importance": 4, "sid": "satellite", "topic": "kddi 스타링크 계약"}, {"title": "KDDIとSpaceX、次世代衛星「Starlink Mobile V2」契約 27年に音声通話も - ケータイ Watch", "summary": "KDDI와 스페이스X가 차세대 위성인 스타링크 모바일 V2 계약을 맺었다. 2027년부터 음성 통신까지 지원할 계획이다.", "source": "ケータイ Watch", "date": "2026-09-15 11:57", "url": "https://k-tai.watch.impress.co.jp/docs/news/2140947.html", "category": "contract", "importance": 4, "sid": "satellite", "topic": "kddi 위성통신"}, {"title": "SKT, 'AI 메시징' 글로벌 테이블 깔았다…에이전틱 시대 문자 역할 재정의 - 녹색경제신문", "summary": "SK텔레콤이 AI 에이전트 시대에 발맞춰 문자 메시지의 역할을 재정의하는 ‘AI 메시징’ 글로벌 표준화 논의를 주도하고 있습니다. RCS를 활용해 AI 서비스의 최종 결제 및 예약 승인을 처리하는 방안을 추진합니다. 글로벌 통신 생태계에서 메시징의 부가가치를 높이는 전략입니다.", "source": "녹색경제신문", "date": "2026-09-15 11:54", "url": "https://www.greened.kr/news/articleView.html?idxno=350099", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt ai결제 표준"}, {"title": "SKT, 'AI 메시징' 글로벌 테이블 깔았다…에이전틱 시대 문자 역할 재정의 - greened.kr", "summary": "SKT가 AI 에이전트 시대에 발맞춰 문자 메시지의 역할을 재정의하는 'AI 메시징' 표준을 글로벌 무대에 제안했다. RCS 기반 비즈니스 생태계 확장을 주도하고 있다.", "source": "greened.kr", "date": "2026-09-15 11:54", "url": "http://www.greened.kr/news/articleView.html?idxno=350099", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt ai 메시징 gsma 표준 제안"}, {"title": "Waymoの無人タクシー、東京で2027年商用化へ", "summary": "웨이모, 일본교통, GO 등 3개사가 도쿄도 내에서 무인 자동運転 택시(로보택시) 배차 서비스를 2027년에 상용화하기 위한 준비에 공식 합의했습니다. 자율주행 모빌리티 서비스의 상용화를 위한 구체적인 협력 체계가 구축되고 있음을 보여줍니다. 통신 인프라 및 고도화된 무선 통신 기술이 필수적인 미래 교통 인프라 프로젝트입니다. 주요 모빌리티 및 통신 연계 사업 진출을 알리는 핵심 제휴 소식입니다.", "source": "ケータイ Watch", "date": "2026-09-15 11:53", "url": "https://k-tai.watch.impress.co.jp/docs/news/2140941.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "웨이모 자율주행"}, {"title": "TRAI to examine Airtel, Jio complaints against Vi - Communications Today", "summary": "인도 통신규제기관 TRAI가 에르텔과 지오가 제기한 보다폰인디아 관련 불만 민원을 검토하고 조사에 착수했다.", "source": "Communications Today", "date": "2026-09-15 11:50", "url": "https://www.communicationstoday.co.in/trai-to-examine-airtel-jio-complaints-against-vi/", "category": "policy", "importance": 4, "sid": "carrier", "topic": "보다폰인디아 번호이동 논란"}, {"title": "AI가 결제 직전까지 알아서, 마지막 승인은 문자메시지로", "summary": "SK텔레콤이 을지로 T타워에서 열린 세계이동통신사업자연합회(GSMA) 회의에서 AI 에이전트가 주문과 결제 직전까지 대행하고 마지막 승인은 문자로 처리하는 방식을 국제 표준화 논의에 올렸다. AI의 자율 행동 수행 단계에서 이용자 확인 절차의 필요성을 제기한 것이다. 글로벌 통신 생태계 내에서 AI 서비스 표준화를 주도하려는 행보다.", "source": "ZDNet Korea", "date": "2026-09-15 11:44", "url": "https://zdnet.co.kr/view/?no=20260915114452", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai 에이전트 표준"}, {"title": "두산퓨얼셀, AI 전력 수요 타고 북미 연료전지 3222억원 추가 수주", "summary": "두산퓨얼셀이 인공지능 데이터센터의 자체 전력 수요 급증에 대응해 미국의 자회사 하이엑시엄과 3222억 원 규모의 북미 인산형 연료전지 공급 계약을 체결했다. 이달 초 5000억 원대 계약에 이어 불과 2주 만에 대규모 추가 주문을 확보하며 누적 계약액이 8000억 원을 넘어섰다. AI 인프라 확대에 따른 친환경 전력 장비 수주 랠리이다.", "source": "ZDNet Korea", "date": "2026-09-15 11:17", "url": "https://zdnet.co.kr/view/?no=20260915111732", "category": "contract", "importance": 4, "sid": "competitor", "topic": "두산퓨얼셀 수주"}, {"title": "HFCL boosts capex to ₹1,800 crore for optical fibre production", "summary": "인도의 자국 통신장비 제조업체인 HFCL이 광섬유, 광케이블, 프리폼(Preform)의 생산 능력을 대폭 확대하기 위해 자본적 지출(Capex)을 1,800억 루피 규모로 증액했습니다. 급증하는 글로벌 및 국내 통신 인프라 수요에 적극 대응하기 위한 전략적 투자입니다. 인도의 통신 장비 및 부품 공급망 생태계 강화 행보를 보여줍니다. 주요 장비 업체의 설비 투자 확대를 다루는 중요 경쟁사 동향입니다.", "source": "ET Telecom", "date": "2026-09-15 11:13", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/hfcl-boosts-capex-to-1800-crore-for-optical-fibre-production/134250219", "category": "strategy", "importance": 4, "sid": "competitor", "topic": "hfcl 광섬유"}, {"title": "レベル4の“完全無人タクシー”、東京で2027年に商用化へ GOとWaymo、日本交通が戦略的パートナーシップ", "summary": "GO, 웨이모, 일본교통 3사가 전략적 파트너십을 맺고 도쿄도 내에서 100대 규모의 레벨 4 완전 무인 택시 상용 서비스를 2027년에 개시하겠다고 공식 발표했다. 양사의 배터리 배차 앱을 통해 일반 승객들이 무인 자율주행 택시를 이용할 수 있도록 인프라를 구축할 예정이다. 자율주행 모빌리티 상용화 경쟁에 불을 지피는 대형 제휴이다.", "source": "ITmedia Mobile", "date": "2026-09-15 11:07", "url": "https://www.itmedia.co.jp/mobile/articles/2609/15/news069.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "go·waymo·일본교통 전략"}, {"title": "삼성전자, 미국 버라이즌과 'AI 기반 ISAC' 실증 성공…6G 시대 대비 - 굿모닝경제", "summary": "삼성전자가 미국 버라이즌과 함께 6G 핵심 기술인 ISAC 실증을 성공적으로 마쳐 미래 통신 시장을 준비합니다.", "source": "굿모닝경제", "date": "2026-09-15 11:03", "url": "https://www.goodkyung.com/news/articleView.html?idxno=291389", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 6g 기술 실증"}, {"title": "삼성전자·버라이즌, 6G ‘ISAC’ 현장 실증 성공...AI로 군중 밀집도 분...", "summary": "▲ 삼성전자와 버라이존이 6G 핵심 기술 인 ISAC의 현장 실증에 성공했다.(사진: 삼성전자 제공) 삼성전자와 미국 이동통신사 버라이즌이 6G 핵심 기술 로 꼽히는 통신·센싱 융합(ISAC) 기술 을 실제 대규모 행사 현장에...", "source": "idsn.co.kr", "date": "2026-09-15 10:56", "url": "https://idsn.co.kr/news/view/1065578039983725", "category": "tech", "importance": 4, "sid": "satellite", "topic": ""}, {"title": "6년 전 삼성의 ‘소프트웨어 기지국’ 승부…버라이즌과 6G 실증서 통했다 - 이코노미트리뷴", "summary": "삼성전자가 미국 이동통신사 버라이즌과 협력하여 6G 핵심 기술인 소프트웨어 기반 기지국과 ISAC(통신·센싱 융합) 현장 실증에 성공했다. 과거 소프트웨어 기지국 상용화 성공 경험을 바탕으로 6G 시대를 선도하기 위한 기술 주도권 확보에 나서고 있다. 버라이즌과의 강력한 파트너십을 통해 북미 통신장비 시장 내 입지를 공고히 하는 전략적 의미를 지닌다.", "source": "이코노미트리뷴", "date": "2026-09-15 10:55", "url": "https://www.economytribune.co.kr/news/articleView.html?idxno=3903892", "category": "tech", "importance": 4, "sid": "competitor", "topic": "버라이즌 6g 실증"}, {"title": "[AI픽] KT클라우드, AIDC 20여곳에 1GW 공급…AX 인프라 확대 - yna.co.kr", "summary": "KT클라우드가 향후 AI 데이터센터(AIDC) 인프라를 전국 20여 곳에 구축하여 총 1GW 규모의 용량을 공급하겠다는 비전을 발표했습니다. 폭증하는 인공지능 컴퓨팅 수요에 선제적으로 대응하여 AX(AI Transformation) 인프라 시장의 주도권을 잡겠다는 전략입니다.", "source": "yna.co.kr", "date": "2026-09-15 10:52", "url": "https://www.yna.co.kr/amp/view/AKR20260915074800017", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai 데이터센터 1gw 공급"}, {"title": "삼성·버라이즌, 6G '통신·센싱 융합' 실증…AI로 군중 밀집도 파악", "summary": "삼성전자는 미국 버라이즌과 함께 텍사스의 대형 행사장에서 가상화 네트워크 기반의 6G 통신·센싱 융합(ISAC) 기술을 실증했다. 별도의 추가 센서 장비 없이 기존 통신 인프라와 소프트웨어만으로 군중 밀집도를 실시간 파악하는 데 성공했다. 양사의 협력은 차세대 6G 핵심 기술 상용화 가능성을 입증한 사례로 평가받는다.", "source": "전자신문", "date": "2026-09-15 10:52", "url": "https://www.etnews.com/20260915000162", "category": "tech", "importance": 4, "sid": "competitor", "topic": "삼성전자 기술"}, {"title": "[AI픽] KT클라우드, AIDC 20여곳에 1GW 공급…AX 인프라 확대 - 연합뉴스", "summary": "KT클라우드가 2031년까지 전국 20여 곳에 1GW(기가와트) 규모 이상의 AI 데이터센터(AIDC)를 공급하겠다는 청사진을 밝혔습니다. 급증하는 인공지능 인프라 수요에 대응하기 위해 수도권 클러스터와 지방 거점을 연결하는 투트랙 전략을 추진합니다. AI 전환(AX) 인프라 시장에서 주도권을 확보하기 위한 대규모 투자 계획입니다.", "source": "연합뉴스", "date": "2026-09-15 10:52", "url": "https://www.yna.co.kr/amp/view/AKR20260915074800017", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai데이터센터"}, {"title": "삼성전자 ·버라이즌, 6G 핵심 'ISAC' 세계 최초 현장 실증 성공", "summary": "삼성전자가 미국 버라이즌과 함께 가상화 네트워크 솔루션을 활용해 6G 핵심 기술인 ISAC 현장 실증에 성공했다. 설지윤 네트워크사업부 상품전략팀장 부사장은 통신이 하드웨어 중심이어야 한다는 틀을 깨고 소프트웨어 기반 차세대 네트워크로의 전환에 성공했다고 밝혔다. 이번 성과는 AI와 6G 시대의 기술 경쟁력을 입증한다.", "source": "delighti.co.kr", "date": "2026-09-15 10:50", "url": "https://www.delighti.co.kr/news/articleView.html?idxno=121850", "category": "tech", "importance": 4, "sid": "competitor", "topic": "삼성전자 버라이즌 6g isac 실증 성공"}, {"title": "삼성전자 ·美 버라이즌, AI로 군중 밀집도 잡는다···6G 기술 실증", "summary": "삼성전자가 버라이즌과 함께 미국 텍사스 글로벌 스포츠 이벤트에서 가상화 네트워크 솔루션을 활용해 AI 기반 ISAC 기술을 실제 행사 환경에 적용했다. ISAC은 통신 인프라에서 데이터 전송과 주변 센싱을 동시에 수행하는 기술로 실증에 성공했다.", "source": "enewstoday.co.kr", "date": "2026-09-15 10:49", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2470537", "category": "tech", "importance": 4, "sid": "competitor", "topic": "삼성전자 버라이즌 ai isac 실증"}, {"title": "박민규, KT·LGU+ 개인정보 침해사고 '은폐방지법' 발의 - 스트레이트뉴스", "summary": "국회에서 KT와 LG유플러스의 개인정보 침해사고 은폐를 막기 위한 '증거보전 의무화법'이 발의되었다. 통신사의 보안 책임을 강화하고 사고 발생 시 투명한 조사를 보장하기 위한 입법이다. 통신 규제 강화의 중요한 전환점이다.", "source": "스트레이트뉴스", "date": "2026-09-15 10:48", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=311212", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 해킹방지법"}, {"title": "SKT \"AI 결제, 문자로 승인받자\"… GSMA에 표준 안건 제안 - 조선일보", "summary": "SK텔레콤이 AI 에이전트가 결제를 수행하기 전 문자로 최종 승인을 받는 'AI 메시징' 기술을 세계이동통신사업자연합회(GSMA) 표준 안건으로 공식 제안했습니다. 차세대 문자 서비스인 RCS를 기반으로 글로벌 AI 커머스 시장에서 표준화를 선도하겠다는 포부입니다.", "source": "조선일보", "date": "2026-09-15 10:46", "url": "https://www.chosun.com/economy/tech_it/2026/09/15/4KNVG45WZRD2RHQX2YTW3L6JSY/", "category": "tech", "importance": 4, "sid": "carri orea", "date": "2026-09-15 08:33", "url": "https://zdnet.co.kr/view/?no=20260915082154", "category": "tech", "importance": 4, "sid": "satellite", "topic": ""}, {"title": "삼성전자, 150년 통신의 틀 깼다…美 버라이즌과 ‘6G 신기술’ 세계 첫 실증 - 이슈밸리", "summary": "삼성전자가 미국 통신사 버라이즌과 협력해 세계 최초로 6G 'AI 기반 ISAC(통신·센싱 융합기술)' 실증에 성공했습니다. 통신망을 센서로 확장해 군중 밀집도 등을 파악하는 차세대 기술을 현장에서 입증했습니다. 이는 향후 6G 상용화 국면에서 네트워크 장비 시장의 경쟁 우위를 선점하는 중요한 계기가 될 것으로 기대됩니다.", "source": "이슈밸리", "date": "2026-09-15 08:24", "url": "https://www.issuevalley.com/news/articleView.html?idxno=56339", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 수주"}, {"title": "삼성전자·버라이즌, 6G 핵심 'AI 기반 ISAC' 실증 성공 - 더트래커", "summary": "삼성전자가 미국 통신사 버라이즌과 협력해 6G 핵심 기술인 'AI 기반 ISAC(통신·센싱 통합)'의 현장 실증에 성공했습니다. 이번 실증은 별도의 센서 없이 통신망을 활용해 인파나 군중 밀집도를 실시간으로 감지할 수 있음을 입증했습니다. 양사는 차세대 통신망의 센서 확장 가능성을 보여주며 6G 상용화 기반을 다지고 있습니다.", "source": "더트래커", "date": "2026-09-15 08:16", "url": "https://thetracker.co.kr/View.aspx?No=4227016", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌"}, {"title": "모건스탠리, 에코 스타 '비중확대' 추천…\"스페이스X 지분 할인 효과\"", "summary": "모건스탠리가 에코스타에 대해 비중확대 의견을 제시하며 스페이스X 지분 할인 효과를 언급했습니다. 에코스타는 지난해 스페이스X와 약 170억 달러 규모의 무선 주파수 라이선스 계약을 체결한 바 있습니다. 위성통신 사업자 간 대규모 파트너십 관련 내용입니다.", "source": "news.einfomax.co.kr", "date": "2026-09-15 07:52", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4434822", "category": "contract", "importance": 4, "sid": "satellite", "topic": "에코스타 스페이스x"}, {"title": "Iridium, Deutsche Telekom IoT and Toyota Demonstrate Satellite Voice Messaging - The Fast ", "summary": "이리듐, 도이치텔레콤 IoT, 토요타가 협력하여 위성 기반 음성 메시징 기술 시연에 성공했다. 위성통신과 지상망 및 모빌리티의 융합 기술이 진전되고 있다.", "source": "The Fast Mode", "date": "2026-09-15 07:45", "url": "https://www.thefastmode.com/technology-solutions/50581-iridium-deutsche-telekom-iot-and-toyota-demonstrate-satellite-voice-messaging", "category": "tech", "importance": 4, "sid": "satellite", "topic": "이리듐 위성통신"}, {"title": "폴란드, 자체 스타링크 구축 시동… 2030년 통신망 독립 추진", "summary": "폴란드가 자체 스타링크 구축에 시동을 걸며 2030년 통신망 독립을 추진합니다. 도널드 투스크 폴란드 총리가 방산 박람회 연설에서 스페이스X의 군집 통신망에 비유하며 국가적 목표를 제시했습니다. 국가 차원의 저궤도 위성통신망 도입 추진 사례입니다.", "source": "g-enews.com", "date": "2026-09-15 07:40", "url": "https://www.g-enews.com/view.php?ud=20260915072908194220990b2dc5_1", "category": "contract", "importance": 4, "sid": "satellite", "topic": "폴란드 스타링크"}, {"title": "ドコモが年度内に5G基地局1万局以上整備へ 通信品質が他社並みに 5G優先制御も検討 - ｄメニューニュース", "summary": "도코모가 회계연도 내 5G 기지국 1만국 이상을 추가 정비해 통신 품질을 타사 수준으로 끌어올리고 5G 우선 제어를 검토한다. 품질 개선을 위한 대규모 인프라 투자와 네트워크 고도화 의지를 보여준다.", "source": "ｄメニューニュース", "date": "2026-09-15 07:09", "url": "https://topics.smt.docomo.ne.jp/article/sankei/business/sankei-_economy_it_KDJGGYHWRJOOVJEQD4G556BKCM", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt docomo 5g 기지국"}, {"title": "Verizon Adds AWS, Cisco, Intel, NVIDIA and Others to Expanded 6G Innovation Forum - The Fa", "summary": "미국 통신사 버라이즌이 자사의 '6G 혁신 포럼'에 AWS, 시스코, 인텔, 엔비디아 등 글로벌 유수 테크 기업들을 대거 추가하며 참여 진영을 대폭 확장했다. 차세대 6G 생태계 조성을 위한 통신사와 빅테크 간 기술 표준 및 상용화 공조가 본격화되고 있다.", "source": "The Fast Mode", "date": "2026-09-15 07:03", "url": "https://www.thefastmode.com/technology-solutions/50567-verizon-adds-aws-cisco-intel-nvidia-and-others-to-expanded-6g-innovation-forum", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 혁신 포럼 멤버십 확대"}, {"title": "AT&T Adds Amazon Leo Satellite Service to Enterprise Network - Broadband Breakfast", "summary": "미국 통신사 AT&T가 기업용 네트워크 서비스 포트폴리오를 강화하기 위해 아마존의 저궤도 위성 통신 서비스인 레오(Leo)를 도입한다고 밝혔다.", "source": "Broadband Breakfast", "date": "2026-09-15 06:50", "url": "https://broadbandbreakfast.com/at-t-adds-amazon-leo-satellite-service-to-enterprise-network/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 아마존 레오 위성서비스 도입"}, {"title": "Chinese bank helped Huawei spirit $1B out of London days after US indictment of the tech g", "summary": "미국의 기소 직후 중국계 은행이 화웨이의 10억 달러 자금 유출을 도왔다는 보도가 나왔습니다. 화웨이에 대한 미국의 제재 및 사법 조치를 회피하기 위한 금융 거래 의혹으로 지정학적 갈등이 부각됩니다. 화웨이의 글로벌 금융 활동에 대한 규제 감시가 강화될 전망입니다.", "source": "International Consortium of Investigative Journalists - ICIJ", "date": "2026-09-15 06:41", "url": "https://www.icij.org/investigations/china-capital/huawei-icbc-banking-us-court-beijing-london/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 제재"}, {"title": "Samsung And Verizon Put 6G Sensing To A Real-World Test - SammyGuru", "summary": "삼성전자와 버라이즌이 실제 대형 경기장에서 가상화된 5G 네트워크 기반 6G 센싱 기술 ISAC 실증 테스트를 진행했습니다. 주파수 신호로 카메라 없이 군중 밀집도 파악과 드론 궤적 추적에 성공했습니다. 양사의 협력을 통해 6G 기술 표준화 및 시장 주도권 확보에 속도를 내고 있습니다.", "source": "SammyGuru", "date": "2026-09-15 06:22", "url": "https://sammyguru.com/samsung-verizon-6g-sensing-real-world-test/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g"}, {"title": "[미리보는 국감] 2300만명 개인정보 털리고 ‘증거 인멸’ 의혹까지…통신 3사 책임경영 시험대 - SR타임스", "summary": "수천만 명에 달하는 대규모 개인정보 유출 사고와 증거 인멸 의혹을 둔 국정감사를 앞두고 통신 3사의 책임 경영이 다시 한번 도마 위에 올랐다. 정치권과 규제 기관은 통신사들의 미흡한 보안 대책과 사고 대응 태도를 강하게 질타할 것으로 예상된다. 이번 국감은 통신사들의 보안 투자 확대와 내부 통제 강화를 압박하는 결정적 계기가 될 것이다. 소비자 신뢰 회복과 재발 방지 대책 마련이 시급한 과제로 떠올랐다.", "source": "SR타임스", "date": "2026-09-15 06:16", "url": "http://www.srtimes.kr/news/articleViewAmp.html?idxno=212398", "category": "policy", "importance": 4, "sid": "carrier", "topic": "통신3사 개인정보 유출 국감"}, {"title": "\"우주판 화웨이 온다\"… 中, '재사용 로켓' 성공으로 美 스페이스X 아성...", "summary": "중국이 재사용 로켓 성공을 거두며 과거 화웨이가 5G 통신 장비 시장을 석권했던 성공 공식이 지상에서 위성통신 궤도로 재현될 조짐을 보이고 있습니다.", "source": "g-enews.com", "date": "2026-09-15 05:36", "url": "https://www.g-enews.com/view.php?ud=202609141738088990c8c1c064d_1", "category": "contract", "importance": 4, "sid": "satellite", "topic": "화웨이 우주판"}, {"title": "Nex-Tech Wireless selects Ericsson in modernize rural Kansas network and launch 5GSA - Fie", "summary": "미국 넥스테크 와이어리스가 캔자스 네트워크의 현대화와 5G 독립형 서비스 상용화를 위해 에릭슨과 공급 계약을 체결했다. 광범위한 지역의 모바일 네트워크가 대폭 업그레이드되며 에릭슨의 미국 지역 통신장비 시장 확장을 보여주는 사례다.", "source": "Fierc s", "category": "contract", "importance": 4, "sid": "carrier", "topic": "텔레포니카 보다폰스페인 인수 협상"}, {"title": "Amazon Leo Expands Arianespace Deal With Six More Launches - Broadband Breakfast", "summary": "아마존의 저궤도 위성 통신 프로젝트 '아마존 레오(Leo)'가 아리안스페이스와의 로켓 발사 계약을 6회 추가로 확대했습니다. 대규모 위성 군집 구축을 위한 발사 수송 능력을 선점하기 위한 전략적 투자입니다. 위성 광대역 인터넷 서비스 상용화를 위한 인프라 확보가 본격화되고 있음을 보여줍니다.", "source": "Broadband Breakfast", "date": "2026-09-15 03:13", "url": "https://broadbandbreakfast.com/amazon-leo-expands-arianespace-deal-with-six-more-launches/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아마존 레오 아리안스페이스 발사 계약"}, {"title": "Space42, Viasat to spend $1bn to get satellite JV off ground - telcotitans.com", "summary": "스페이스42와 비아샛이 위성 합작 법인(JV) 출범을 위해 10억 달러를 투자한다. 위성 기반 직접통신(D2D) 시장 주도권을 잡기 위한 대형 투자 건이다.", "source": "telcotitans.com", "date": "2026-09-15 02:45", "url": "https://www.telcotitans.com/infrawatch/space42-viasat-to-spend-1bn-to-get-satellite-jv-off-ground/10868.article", "category": "contract", "importance": 4, "sid": "satellite", "topic": "비아샛 스페이스42 위성 플랫폼"}, {"title": "Looking into Bharti Airtel, Jio's MNP rule violation allegations: Trai - Business Standard", "summary": "TRAI가 바르티 에어텔과 릴라이언스 지오가 제기한 보다폰아이디어의 번호이동 규칙 위반 주장에 대해 조사에 착수했다.", "source": "Business Standard", "date": "2026-09-15 02:43", "url": "https://www.business-standard.com/companies/news/trai-looking-into-airtel-jio-complaint-against-vi-over-malpractices-126091400310_1.html", "category": "policy", "importance": 4, "sid": "carrier", "topic": "보다폰아이디어 번호이동 규제 분쟁"}, {"title": "Verizon Communications Inc. (VZ) Stock: Surge as 6G Expansion Targets AI and Smart Glasses", "summary": "버라이즌(VZ) 주가가 AI 서비스와 스마트 글래스 확장을 겨냥한 차세대 6G 네트워크 투자 및 확장 계획에 힘입어 상승세를 보였다. 미래 통신 환경 변화에 대응하는 통신사의 전략적 투자 방향을 보여준다.", "source": "Blockonomi", "date": "2026-09-15 02:33", "url": "https://blockonomi.com/verizon-communications-inc-vz-stock-surge-as-6g-expansion-targets-ai-and-smart-glasses/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 확장 ai 및 스마트글래스 타겟"}, {"title": "TRAI to examine Airtel, Jio concerns over Vodafone Idea’s customer poaching - madhyamamonl", "summary": "인도 통신규제청 TRAI가 바르티 에르텔과 지오가 제기한 보다폰 아이디아의 고객 포칭 및 번호이동 방해 민원에 대해 직접 조사에 착수했다.", "source": "madhyamamonline.com", "date": "2026-09-15 01:47", "url": "https://madhyamamonline.com/india/trai-to-examine-airtel-jio-concerns-over-vodafone-ideas-customer-poaching-1554543", "category": "policy", "importance": 4, "sid": "carrier", "topic": "trai 보다폰 아이디아 고객 유치 조사"}, {"title": "Ericsson pairs with Nex-Tech Wireless to launch 5G Standalone in rural Kansas - Data Cente", "summary": "에릭슨이 미국 넥스텍 와이어리스와 협력하여 캔자스주 농어촌 지역에 5G 단독모드(SA) 네트워크를 성공적으로 구축 및 론칭했다. 농어촌 지역 통신 인프라 고도화와 5G 서비스 확대를 가속화한다. 경쟁사의 기술 상용화 역량을 보여주는 사례다.", "source": "Data Center Dynamics", "date": "2026-09-15 01:18", "url": "https://www.datacenterdynamics.com/en/news/ericsson-pairs-with-nex-tech-wireless-to-launch-5g-standalone-in-rural-kansas/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 넥스텍 와이어리스 5g sa 상용화"}, {"title": "에어프랑스, 제52회 도빌 아메리칸 영화제 공식 파트너로 참여···조디...", "summary": "에어프랑스가 영화제 공식 파트너로 참여하며 스타링크 기반의 기내 초고속 무료 와이파이 서비스를 제공하고 있습니다. 승객들은 비행 중 고화질 영상 스트리밍 등을 이용할 수 있습니다. 글로벌 항공사의 저궤도 위성통신 도입 사례입니다.", "source": "sports.khan.co.kr", "date": "2026-09-15 00:56", "url": "https://sports.khan.co.kr/article/202609150055003?pt=nv", "category": "contract", "importance": 4, "sid": "satellite", "topic": "에어프랑스 스타링크"}, {"title": "AT&T Business, Amazon Leo Ink Deal to Expand Public Sector Connectivity - ExecutiveBiz", "summary": "AT&T 비즈니스가 아마존 Leo와 손잡고 공공 부문 연결성 확대를 위한 계약을 체결했다. 공공 기관과 정부 고객을 대상으로 안정적인 위성 브로드밴드 서비스를 제공하는 것이 목표다. 위성 통신 사업자와 대형 통신사 간 B2B 협력이 공공 시장으로 확장되고 있음을 보여준다. 차세대 위성 네트워크의 상용화 레퍼런스로 기능할 전망이다.", "source": "ExecutiveBiz", "date": "2026-09-15 00:42", "url": "https://www.executivebiz.com/articles/att-business-amazon-leo-satellite-connectivity-agreement", "category": "contract", "importance": 4, "sid" g 전략"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視（1/2 ページ） - ITmedia Mobile - ITmedia", "summary": "NTT 도코모가 2027년도 내에 '5G 영역 = SA(단독모드) 대응 영역'으로 만들겠다는 목표를 선언했다. 단순 품질 순위 경쟁보다는 소비자가 체감하는 '체감 품질' 향상에 주력할 방침이다. 5G SA 전환을 가속화하여 네트워크 고도화를 추진하겠다는 전략적 방향을 제시했다. 일본 이동통신 시장의 네트워크 업그레이드 로드맵을 보여준다.", "source": "ITmedia", "date": "2026-09-15 00:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/15/news055.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "도코모 5g전략"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視（ITmedia Mobile） - Yahoo!ニュース", "summary": "NTT도코모가 2027년까지 5G SA 커버리지를 대폭 확대하고 체감 품질 중심으로 망 운영 전략을 전환한다. 통신사의 5G 고도화 로드맵을 담은 보도이다.", "source": "Yahoo!ニュース", "date": "2026-09-15 00:00", "url": "https://news.yahoo.co.jp/articles/dc7cb43d2ea7c9282744f9776241e39c265a6b55", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 5g"}, {"title": "ドコモ「スマホが繋がらない」はどう解消される？ キーパーソンが語る2026年夏の通信品質改善の今とこれから", "summary": "NTT 도코모가 2022년 이후 제기된 통신 품질 저하 문제에 대응해 대규모 설비 투자와 기술적 대책을 지속해 온 현황을 다뤘다. 도코모는 체감 품질 향상을 최우선으로 두고 도심지 리소스 집중 및 800MHz帯 4G 전용 등을 추진 중이다. 외부 조사 순위보다 가입자 체감 품질 개선에 집중하겠다는 전략을 밝혔다. 통신사의 네트워크 품질 개선 투자 동향을 보여준다.", "source": "ケータイ Watch", "date": "2026-09-15 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/interview/2140815.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 품질"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視（ITmedia Mobile） - news.yahoo.co.jp", "summary": "NTT도코모가 2027년까지 5G 에어리어와 SA 대응 에어리어를 일치시키고 체감 품질을 중시하는 품질 전략을 추진합니다.", "source": "news.yahoo.co.jp", "date": "2026-09-15 00:00", "url": "https://news.yahoo.co.jp/articles/dc7cb43d2ea7c9282744f9776241e39c265a6b55", "category": "strategy", "importance": 4, "sid": "carrier", "topic": "ntt도코모 5g sa 목표"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視 - Infoseek", "summary": "NTT 도코모가 2027년까지 5G 서비스 지역을 전면 SA 대응으로 전환하여 체감 품질을 극대화하겠다고 선언했습니다. 네트워크 고도화를 통해   ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 출근길 음성 브리핑 (최근 24시간 4·5점 기사) ── */
let briefQueue=[],briefPlaying=false,koVoice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith("ko"));
  if(!vs.length){koVoice=null;return;}
  // Edge의 Natural 음성 > Online 음성 > Google 음성 > 기타 순으로 선택
  const score=v=>(/natural/i.test(v.name)?4:0)+(/online/i.test(v.name)?2:0)+(/google/i.test(v.name)?1:0);
  vs.sort((a,b)=>score(b)-score(a));
  koVoice=vs[0];
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function briefText(){
  if(typeof NEWS_BRIEF!=="undefined"&&NEWS_BRIEF.text) return NEWS_BRIEF.text;
  // 크롤러가 아직 원고를 만들기 전이면 아카이브 최신 날짜에서 즉석 생성
  const days=Object.keys(ARCH).sort().reverse();
  if(days.length){
    const items=(ARCH[days[0]]||[]).slice(0,8);
    if(items.length) return "네트워크 뉴스 브리핑입니다. "+items.map((a,i)=>(i+1)+"번째 소식. "+a.title+". "+(a.summary||"")).join(" ")+" 이상입니다.";
  }
  return "재생할 브리핑이 아직 없습니다.";
}
function splitBrief(t){
  // 문장 단위로 나눠 순차 재생: 크롬이 긴 음성을 중간에 끊는 버그 회피 + 문장 사이 자연스러운 호흡
  const parts=t.match(/[^.!?]+[.!?]?/g)||[t];
  const out=[];let cur="";
  for(const p of parts){ if((cur+p).length>180){if(cur)out.push(cur);cur=p;} else cur+=p; }
  if(cur)out.push(cur);
  return out;
}
function playNextBrief(b){
  if(!briefPlaying||!briefQueue.length){briefPlaying=false;b.textContent="🎧 브리핑";return;}
  const u=new SpeechSynthesisUtterance(briefQueue.shift());
  u.lang="ko-KR";u.rate=1.0;u.pitch=1.0;
  if(koVoice)u.voice=koVoice;
  u.onend=()=>playNextBrief(b);
  u.onerror=()=>playNextBrief(b);
  speechSynthesis.speak(u);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(!("speechSynthesis" in window)){alert("이 브라우저는 음성 재생을 지원하지 않습니다.");return;}
  if(briefPlaying){speechSynthesis.cancel();briefQueue=[];briefPlaying=false;b.textContent="🎧 브리핑";return;}
  pickVoice();
  briefQueue=splitBrief(briefText());
  briefPlaying=true;b.textContent="⏹ 정지";
  playNextBrief(b);
}
/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
