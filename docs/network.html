  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}

  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}

</style>
</head>

e": "[단독] \"5G 한계 지웠다\" 삼성, 日 KDDI와 7GHz 대역서 3.6Gbps 역대급 속도 입증 The Guru - Investing.com 한국어", "summary": "삼성전자가 일본 KDDI와 함께 7GHz 대역에서 3.6Gbps의 압도적인 속도를 구현하며 5G 성능 한계를 뛰어넘었습니다. 양사 간 긴밀한 네트워크 장비 협력을 보여주는 대표적 사례입니다. 글로벌 통신 시장에서 삼성전자 장비의 우수성을 입증하는 대형 성과입니다.", "source": "Investing.com 한국어", "date": "2026-09-04 09:11", "url": "https://m.kr.investing.com/news/stock-market-news/article-2084212?ampMode=1", "category": "contract", "importance": 5, "wl": false, "topic": "삼성전자 kddi"}, {"title": "딥시크, 화웨이 AI칩으로 中 최대 데이터센터 구축", "summary": "중국 AI 스타트업 딥시크가 화웨이의 차세대 AI 가속기 16만 개 이상을 투입한 중국 최대 규모의 데이터센터 구축을 추진한다. 미국의 대중국 반도체 수출 규제가 이어지는 상황에서 자국산 AI 칩을 활용해 엔비디아 의존도를 낮추고 독자적인 컴퓨팅 인프라를 확보하려는 행보로 주목받고 있다.", "source": "ZDNet Korea", "date": "2026-09-05 15:23", "url": "https://zdnet.co.kr/view/?no=20260905071613", "category": "tech", "importance": 4, "wl": true, "topic": "딥시크 화웨이 ai칩"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤과 에릭슨은 함부르크의 알텐베르더 컨테이너 터미널에 프라이빗 5G 네트워크를 구축했다. 이는 산업용 5G의 실효성을 입증해온 7년간의 셀룰러 실험의 최신 장을 장식하는 성과다. 양사의 지속적인 협력을 통해 항만 물류 현장에서의 초고속·저지연 무선 통신 환경이 성공적으로 구현되었다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 4, "wl": true, "topic": "에릭슨 프라이빗 5g"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "summary": "옴디아의 모바일 인프라 및 RAN 리드 애널리스트 레미 파스칼은 인도 통신망에 이미 구축된 중국산 장비가 수년 동안 운영되어 왔다고 밝혔다. 인도 정부는 이러한 노후 중국산 통신 장비에 대한 전면적인 철거 및 교체(rip-and-replace) 검토를 진행 중이다. 안보 우려에 따른 주요국의 탈중국 장비 기조가 인도 시장에서도 구체화되는 양상이다.", "source": "RCR Wireless", "date": "2026-09-04 23:22", "url": "https://rcrwireless.com/20260904/carriers/india-replace-chinese-equipment", "category": "policy", "importance": 4, "wl": true, "topic": "인도 화웨이 장비"}, {"title": "Huawei latest SingleRAN 22.1 launch targets the Agentverse - Total Telecom", "summary": "화웨이가 최신 '싱글란 22.1(SingleRAN 22.1)'을 공식 출시하며 에이전트버스(Agentverse)를 겨냥한 네트워크 솔루션을 선보였습니다. 인공지능 에이전트 시대에 맞춘 무선 접속망의 고도화와 지능화를 목표로 합니다. 경쟁사의 플래그십급 네트워크 솔루션 발표입니다.", "source": "Total Telecom", "date": "2026-09-04 22:16", "url": "https://totaltele.com/huawei-latest-singleran-22-1-launch-targets-the-agentverse/", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 싱글란"}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - Mobile Europe", "summary": "노키아가 사우디아라비아에 AI 중심의 연구개발(R&D) 센터를 새롭게 공개했습니다. 중동 지역에서 인공지능 기반 네트워크 기술 개발을 가속화하기 위한 거점입니다. 글로벌 R&D 투자 확대와 현지 시장 공략을 위한 전략적 행보입니다.", "source": "Mobile Europe", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 연구소"}, {"title": "Maxis strengthens its nationwide network infrastructure with Nokia’s optical transport tec", "summary": "말레이시아 통신사 맥시스가 노키아의 광전송 기술을 도입해 전국적인 네트워크 인프라를 대폭 강화합니다. 통신망 고도화를 통해 급증하는 트래픽에 대응하고 서비스 품질을 높이기 위한 조치입니다. 노키아의 장비 공급 실적 확대를 보여주는 계약입니다. 글로벌 통신장비 시장의 경쟁 구도에 영향을 미칩니다.", "source": "telecomtv.com", "date": "2026-09-04 17:09", "url": "https://www.telecomtv.com/content/nokia/maxis-strengthens-its-nationwide-network-infrastructure-with-nokia-s-optical-transport-technology-56172/", "category": "contract", "importance": 4, "wl": false, "topic": "노키아 장비 공급"}, {"title": "「Galaxy Z Fold8」の極薄ボディーを実現した新技術「Flex Titanium」開発秘話 一方でトレードオフの機能も", "summary": "삼성전자는 최신 폴더블폰 갤럭시 Z 시리즈를 발표하며 디스플레이에 도입된 'Flex Titanium' 등 신기술 개발 배경을 공개했다. 이를 통해 압도적인 박형 경량화와 내구성을 동시에 실현했으나 S펜 비지원 등의 기능적 트레이드오프도 발생했다. 혁신적인 소재 적용과 디자인 개선을 통해 폴더블폰 시장 리더십을 강화하려는 전략이다.", "source": "ITmedia Mobile", "date": "2026-09-04 13:10", "url": "https://www.itmedia.co.jp/mobile/articles/2609/04/news079.html", "category": "tech", "importance": 4, "wl": true, "topic": "삼성전자 폴더블폰"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크는 고치현 무로토곶 앞바다에서 성층권 통신플랫폼(HAPS)을 활용한 성층권 HAPS 시험을 완료하고 2027년 상용화를 목표로 추진 중이다. 이번 시험에는 드론과 엣지 컴퓨팅 시스템 간의 원활한 연결을 검증하기 위한 종합적인 테스트가 포함됐다. HAPS 플랫폼은 지상 통신망과 위성 통신망을 잇는 차세대 네트워크 인프라로 기대를 모으고 있다.", "source": "Light Reading", "date": "2026-09-03 23:20", "url": "https://www.lightreading.com/satellite/softbank-completes-stratospheric-haps-trial-eyes-2027-deployment", "category": "tech", "importance": 4, "wl": true, "topic": "소프트뱅크 성층권 통신"}, {"title": "The era of AI-native RAN starts now - Nokia", "summary": "노키아가 AI 네이티브 RAN(무선 접속망) 시대의 본격적인 시작을 선언했습니다. 무선 네트워크 인프라에 인공지능을 심층 결합하여 효율성과 성능을 극대화하는 전략입니다. 차세대 통신 장비 시장에서의 기술 주도권 확보를 위한 행보입니다. 경쟁사의 핵심 솔루션 고도화 동향입니다.", "source": "Nokia", "date": "2026-09-03 21:05", "url": "https://www.nokia.com/blog/the-era-of-ai-native-ran-starts-now/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 ran"}, {"title": "7GHz帯で世界最高水準の3.6Gbpsを達成！KDDIとSamsungが挑む6G＆AI時代の大容量通信実証 - DXマガジン", "summary": "KDDI와 삼성전자가 7GHz 대역에서 세계 최고 수준인 3.6Gbps 속도를 달성하며 6G 및 AI 시대의 대용량 통신 실증에 성공했다. 양사의 긴밀한 협력을 통해 차세대 이동통신 표준 기술에서 리더십을 입증한 중요한 성과다. 향후 글로벌 6G 장비 시장에서 경쟁력을 높이는 계기가 된다.", "source": "DXマガジン", "date": "2026-09-03 19:59", "url": "https://dxmagazine.jp/news/2640ko109/", "category": "tech", "importance": 4, "wl": false, "topic": "삼성전자 6g 대용량 통신 실증"}, {"title": "中 문샷AI, 홍콩 증시 상장 추진…최대 50억 달러 조달", "summary": "중국 AI 스타트업 문샷AI가 홍콩 증시 상장을 통해 최대 50억 달러 규모의 자금 조달을 추진한다. 고성능 AI 모델 '키미 K3'를 앞세워 글로벌 시장에서 입지를 넓히고 있으며 확보된 자금으로 AI 개발 경쟁에 속도를 낼 계획이다.", "source": "ZDNet Korea", "date": "2026-09-05 15:24", "url": "https://zdnet.co.kr/view/?no=20260905073057", "category": "contract", "importance": 3, "wl": true, "topic": "문샷ai 홍콩 상장"}, {"title": "中 반도체 장비사, 전공정 넘어 후공정까지 국산화 속도", "summary": "중국 주요 반도체 장비사인 나우라, AMEC, 화하이칭커 등이 전공정 기술을 바탕으로 하이브리드 본딩, 다이싱 등 후공정 장비 제품군으로 국산화 범위를 확대하고 있다. 미국의 대중국 반도체 장비 수출 규제에 대응하여 자급자족 체제를 강화하려는 전략이다.", "source": "전자신문", "date": "2026-09-05 14:00", "url": "https://www.etnews.com/20260904000236", "category": "tech", "importance": 3, "wl": true, "topic": "중국 반도체 장비 국산화"}, {"title": "Huawei Enterprise AI P   ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
