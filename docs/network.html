  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}

</head>

title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 6G 기지국을 활용해 드론을 감지할 수 있는 기술을 시연했습니다. 차세대 이동통신 인프라가 통신뿐만 아니라 보안 및 감시 영역까지 기능을 확장할 수 있음을 보여줍니다. 6G 표준화 및 상용화 연구에서 선도적인 위치를 확보하기 위한 기술력 과제입니다. 향후 다양한 산업과의 융합이 기대됩니다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 기술"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 6G와 AI 기능이 결합된 드론 실시간 추적 및 통신 신기술을 공개하며 국내 기업들과의 협력 방안을 모색한다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 드론 기술"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI 랜, ISAC, 차별화된 커넥티비티와 6G로 이어지는 차세대 네트워크 기술 리더십과 청사진을 제시했다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 청사진"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - developingtelecoms.com", "summary": "에릭슨이 사우디아라비아 통신사 STC와 다년간의 5G 네트워크 확장 계약을 체결했습니다. 중동 지역의 대규모 5G 인프라 고도화를 지원하는 핵심 공급 계약입니다. 양사는 지속적인 협력을 통해 모바일 브로드밴드 성능을 향상시킬 계획입니다. 에릭슨의 글로벌 수주 실적을 강화하는 계기가 됩니다.", "source": "developingtelecoms.com", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 수주"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 대중국 화웨이 제재가 완성품을 넘어 부품 공급망까지 전방위로 확산되고 있습니다. 글로벌 규제의 타격이 통신장비 부품 전반으로 번지면서 국내 장비 및 부품 업체들에게 반사이익과 공급 기회가 주목받고 있습니다. 글로벌 통신장비 시장의 공급망 재편이 가속화되고 있습니다. 업계의 판도를 바꿀 주요 규제 이슈입니다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 제재"}, {"title": "Samsung wins ZTE 5G patent case, raising difficult questions for UK courts - IAM Patent", "summary": "삼성전자가 ZTE와의 5G 특허 소송에서 승소하며 영국 법원에 까다로운 법적 과제를 던졌습니다. 글로벌 통신장비 특허권 분쟁에서 삼성전자가 유리한 고지를 점령한 사례입니다. 장비사 간의 지식재산권 공방이 법적으로 중요한 선례를 남겼습니다. 업계의 큰 주목을 받는 법적 판결입니다.", "source": "IAM Patent", "date": "2026-09-01 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "policy", "importance": 4, "wl": false, "topic": "삼성전자 특허소송"}, {"title": "Nokia deploys Gibabit Connect with InCoax MoCA Access for apartments on Sjoberg's network ", "summary": "노키아가 스외베르그 네트워크의 아파트 단지를 대상으로 인코액 MoCA 액세스를 활용한 기가비트 커넥트 솔루션을 구축했습니다. 주거용 초고속 인터넷 환경을 개선하기 위한 네트워크 업그레이드 프로젝트입니다. 기존 동축케이블 인프라를 활용해 고속 데이터 전송을 구현합니다. 노키아의 유선 통신 장비 경쟁력을 보여주는 사례입니다.", "source": "Telecompaper", "date": "2026-09-03 19:44", "url": "https://www.telecompaper.com/news/nokia-deploys-gibabit-connect-with-incoax-moca-access-for-apartments-on-sjobergs-network-in-minnesota--1581634", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 수주"}, {"title": "우리넷, KOREN 기반 AI 광네트워크 실증 착수", "summary": "우리넷이 KOREN 기반 AI 광네트워크 실증에 착수한 가운데 6G 초정밀 전달망 시스템 기술 개발 과제를 통해 사업 영역을 확대하고 있다.", "source": "thelec.kr", "date": "2026-09-03 19:10", "url": "https://www.thelec.kr/news/articleView.html?idxno=61790", "category": "contract", "importance": 3, "wl": false, "topic": "우리넷 ai 광네트워크 실증"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "통신장비 업체 화웨이 를 비롯해 숏폼·AI 기업 콰이서우, 전자상거래 업체 알리바바, 미국 애플 등이 이 지역에 컴퓨팅 시설 관련 투자를 진행한 바 있습니다. 바이트댄스가 추진하는 데이터센터의 투자 규모가...", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Sceye, SoftBank demo high-altitude platform systems connectivity he Telekom shares rise as sources say Elliott builds stake, opposes T-Mobile deal - ", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤의 지분을 확보하고 T-모바일 관련 거래에 반대 입장을 표명하면서 주가가 상승했습니다. 대형 통신사의 지배구조 및 M&A 전략에 큰 영향을 미치는 중요 이슈입니다.", "source": "TradingView", "date": "2026-09-03 17:21", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N44V0JM:0-deutsche-telekom-shares-rise-as-sources-say-elliott-builds-stake-opposes-t-mobile-deal/", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 지분"}, {"title": "Elliott Builds Stake in Deutsche Telekom Amid T-Mobile Merger Talks - Global Banking & Fin", "summary": "행동주의 펀드 엘리엇이 T-Mobile과의 합병 협상 속에서 도이치텔레콤의 지분을 확보했다. 글로벌 통신사 간 지배구조 및 M&A 관련 동향이다.", "source": "Global Banking & Finance Review", "date": "2026-09-03 10:18", "url": "https://www.globalbankingandfinance.com/elliott-built-stake-deutsche-telekom-opposes-t-mobile-merger/", "category": "contract", "importance": 4, "wl": false, "topic": "도이치텔레콤 지분 인수"}, {"title": "CHTR Stock Pops As Spectrum, Cox, Liberty Deals Reshape Charter - timothysykes.com", "summary": "스펙트럼, 콕스, 리버티 등 주요 통신·케이블 기업 간의 딜이 이어지면서 차터 커뮤니케이션즈의 주가가 급등했습니다. 북미 통신 및 미디어 시장의 대규모 구조조정과 인수합병(M&A) 물결을 주도하고 있습니다. 시장 판도를 재편하는 대형 딜로 평가받습니다. 업계 전반의 경쟁 구도에 큰 파장을 일으키고 있습니다.", "source": "timothysykes.com", "date": "2026-09-03 05:47", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02-2/", "category": "contract", "importance": 4, "wl": false, "topic": "차터 m&a"}, {"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "통신 3사가 네트워크 및 AIDC 투자를 위한 세제·주파수·규제 개선을 요구한 가운데 과기정통부가 민관협의체를 통해 적극 논의하겠다는 입장을 밝혔다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 네트워크 지원 촉구"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "일본 KDDI가 7GHz 대역에서 세계 최고 수준인 3.6 Gbps의 야외 전송 속도를 달성했습니다. 이는 신사의 임원진 교체 및 조직 정비 동향에 해당합니다.", "source": "marketscreener.com", "date": "2026-09-03 19:15", "url": "https://www.marketscreener.com/news/deutsche-telekom-reorganizes-leadership-functions-ce7858d3de81f120", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영진"}, {"title": "에임인텔리전스, SKT '모두의 AI' 컨소시엄 합류…보안 고도화 담당 - 머니투데이 - 머니투데이", "summary": "에임인텔리전스가 SK텔레콤이 주도하는 '모두의 AI' 컨소시엄에 합류하여 AI 보안 고도화 역할을 맡았습니다. 통신사의 AI 생태계 확장 및 보안 협력 동향을 보여줍니다.", "source": "머니투데이", "date": "2026-09-03 17:45", "url": "https://www.mt.co.kr/future/2026/09/03/2026090314061885832", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai"}, {"title": "[통신3사 AI 경량화] KT, 기업용 AI 크기 세분화…‘B2B’ 전략 : 네이버 블로그 - Naver Blog", "summary": "KT가 B2B 시장을 겨냥해 기업용 AI 모델의 크기를 세분화하는 맞춤형 전략을 추진하고 있습니다. 통신사의 기업용 AI 사업 전개 방안입니다.", "source": "Naver Blog", "date": "2026-09-03 17:40", "url": "https://blog.naver.com/PostView.naver?blogId=dealsite&logNo=224399940686&redirect=Dlog", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai"}, {"title": "플리토, 육군에 AI 민원상담 구축…장병·국민 문의 24시간 대응", "summary": "플리토 컨소시엄이 육군본부와 업무협약을 맺고 보안이 중요한 군 폐쇄망에서도 작동하는 AI 기반 24시간 민원상담체계를 구축한다. 국방 분야의 인공지능 전환(AX) 가속화와 행정 효율성 제고를 목표로 한다. 공공 및 특수 네트워크 환경에서의 AI 적용 사례다.", "source": "ZDNet Korea", "date": "2026-09-03 17:36", "url": "https://zdnet.co.kr/view/?no=20260903173519", "category": "contract", "importance": 3, "wl": true, "topic": "플리토 육군 ai 민원상담 구축"}, {"title": "Distributed AI inference is redrawing the network map (Reader Forum)", "summary": "AI가 중앙 집중형 훈련에서 분산형 추론으로 이동함에 따라 네트워크 건축은 근접성, 지연 시간, 탄력성을 중심으로 재편되고 있다. 메트로 파이버, 엣지 커넥티비티, 광인프라가 AI 시대의 핵심 요소로 자리 잡을 전망이다. 인공지능 워크로드 급증에 따른 통신망 아키텍처의 혁신적 변화를 시사한다.", "source": "RCR Wireless", "date": "2026-09-03 17:00", "url": "https://rcrwireless.com/20260903/network-infrastructure/distributed-ai-redrawing-the-network-map-reader-forum", "category": "tech", "importance": 3, "wl": true, "topic": "분산형 ai 인프라 네트워크"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "통신사들이 줄여왔던 망 투자를 다시 늘릴 조짐을 보이는 가운데 AI-RAN 기술 검증에 삼성전자 등이 참여하고 있다. 차세대 네트워크 전환을 위한 투자 재개 가능성을 다룬다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "contract", "importance": 3, "wl": false, "topic": "통신3사 망 투자 재개"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤은 AWS의 얀 호프메이어를 차기 최고기술책임자(CTO)로 영입했다. 이번 인사를 통해 기술 부문 리더십을 강화하고 향후 네트워크 및 클라우드 전략을 추진할 예정이다. 경영진 개편을 통해 지속적인 기술 혁신과 인프라 고도화를 도모할 계획이다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 임원 인사"}, {"title": "VodafoneThree to launch debut TV service in challenge to UK rivals", "summary": "영국 통신 그룹인 보다폰쓰리는 영국 경쟁사들에 도전하기 위해 최초의 TV 서비스를 출시하며 이를 통해 브로드밴드 사업을 두 배로 성장시키겠다는 목표를 세웠다. 통신 서비스와 미디어 플랫폼을 결합한 번들 상품을 통해 가입자 기반을 확대하려는 전략이다. 유무선 통합 가입자 유치 경쟁이 더욱 치열해질 전망이다.", "source": "Financial Times Tech", "date": "2026-09-03 13:00", "url": "https://www.ft.com/content/b44fcdbd-4c0e-4032-b81a-98e309991388?syn-25a6b1a6=1", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 tv 서비스 출시"}, {"title": "T-Mobile Supports Indiana Communities Following Severe Weather and Prolonged Power Outages", "summary": "티모바일이 심각한 기상 악화와 장기 정전 사태를 겪은 인디애나주 지역 사회를 지원하기 위한 구호 활동을 펼쳤습니다. 피해 복구 현장에 통신 지원 인력을 투입하고 필수 물품을 전달했습니다. 재난 상황 속에서 기업의 사회적 책임을 실천하는 모범 사례입니다. 지역 주민들의 신뢰를 높이고 있습니다.", "source": "CSRwire", "date": "2026-09-03 12:39", "url": "https://csrwire.com/press-release/t-mobile-supports-indiana-communities-following-severe-weather-and-prolonged-power-outages/", "category": "contract", "importance": 3, "wl": false, "topic": "티모바일 지역지원"}, {"title": "Canadian Pension Fund La Caisse buys 24% stake in Brookfield-backed Altius for ₹12,100 cr", "summary": "캐나다 연기금 라 케이스(La Caisse)가 브룩필드가 지원하는 알티우스 지분 24%를 12,100 크로어에 인수했다. 거래 완료 후에도 브룩필드는 최대 투자자로 남으며 싱가포르 GIC 등도 주주로 참여한다. 대형 인프라 자산에 대한 글로벌 기관투자자의 자본 유입이 지속되고 있다.", "source": "ET Telecom", "date": "2026-09-03 11:08", "url": "https://telecom.economictimes.indiatimes.com/news/industry/canadian-pension-fund-la-caisse-buys-24-stake-in-brookfield-backed-altius-for-12100-cr/133723304", "category": "contract", "importance": 3, "wl": true, "topic": "캐나다 연기금 알티우스 지분 인수"}, {"title": "VodafoneThree Takes Aim at EE With “Up to 4x Faster” 5G+ Plans - Tech Advisor", "summary": "보다폰스리가 EE를 겨냥해 최대 4배 더 빠른 속도를 제공하는 5G+ 요금제 및 서비스 플랜을 출시했습니다. 영국 이동통신 시장에서 가입자 유치를 위한 경쟁이 가열되고 있습니다. 향상된 네트워크 성능을 바탕으로 차별화된 마케팅을 전개합니다. 통신사 간 가입자쟁탈전이 심화되고 있습니다.", "source": "Tech Advisor", "date": "2026-09-03 08:02", "url": "https://www.techadvisor.com/article/3225803/vodafonethree-takes-aim-at-ee-with-up-to-4x-faster-5g-plans.html", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰스리 통신"}, {"title": "CHTR Stock Rises As Spectrum Bets On Scale And Prime - stockstotrade.com", "summary": "차터 커뮤니케이션즈의 스펙트럼 브랜드가 규모의 경제와 프라임 전략을 바탕으로 시장에서 입지를 강화하며 주가가 상승했습니다. 광대역 통신망과 미디어 서비스를 결합하여 가입자를 확대하고 있습니다. 경쟁 심화 속에서도 안정적인 성장 전략을 추진 중입니다. 투자자들의 긍정적인 평가를 받고 있습니다.", "source": "stockstotrade.com", "date": "2026-09-03 04:03", "url": "https://stockstotrade.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "contract", "importance": 3, "wl": false, "topic": "차터 스펙트럼"}, {"title": "New star in comms firmament – Softbank positions HAPS between terrestrial and satellite", "summary": "소프트뱅크의 최신 HAPS(성층권 통신 플랫폼) 실증은 성층권이 단순한 커버리지 공백 채우기를 넘어 광역 셀룰러, 프라이빗 네트워크, 드론, 엣지 컴퓨팅을 하나로 결합하는 수단이 될 수 있음을 보여준다. 지상망과 위성통신을 잇는 새로운 혁신적 네트워크 솔루션으로 주목받고 있다. 미래 6G 및 차세대 무선 통신 인프라의 다각화를 시사한다.", "source": "RCR Wireless", "date": "2026-09-03 01:08", "url": "https://rcrwireless.com/20260902/network-infrastructure/softbank-positions-haps-between-terrestrial-and-satellite", "category": "tech", "importance": 3, "wl": true, "topic": "소프트뱅크 haps 통신망"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 로봇·드론 등 피지컬 AI 장비가 AI-RAN 시험망과 5G망 사이를 이동할 때 안정적인 네트워크 연결을 유지하는 기술을 검증했다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai-ran 검증"}, {"title": "“삐, 공사장 탐지됐습니다”… AI가 미리 찾는 통신망 위험 - 동아일보", "summary": "국내 통신사들이 AI를 활용해 공사장 등 통신망 주변의 위험 요소를 사전에 탐지하고 예방하는 기술을 도입하고 있다. 네트워크 안정성 확보를 위한 지능형 인프라 관리 사례다.", "source": "동아일보", "date": "2026-09-03 00:30", "url": "https://www.donga.com/news/Economy/article/all/20260902/134592397/2", "category": "tech", "importance": 3, "wl": false, "topic": "통신망 ai 감시"}, {"title": "[봇규의 헬로BOT] ‘피지컬 AI 1강’으로 ② | 실증은 늘렸다, 근데 산업...", "summary": "산업 현장의 자립형 5G 단독모드(SA)와 AI 무선접속망(AI-RAN)을 활용한 로봇 및 물류 시스템의 지능형 네트워크 구축 동향이다.", "source": "hellot.net", "date": "2026-09-03 00:08", "url": "https://www.hellot.net/news/article.html?no=114727", "category": "tech", "importance": 3, "wl": false, "topic": "피지컬 ai 5g sa 구축"}, {"title": "AT&T (T) Stock: Surges as Workforce Coalition Targets 1 Million Skilled Workers by 2035 - ", "summary": "AT&T가 참여한 노동력 연합체가 2035년까지 100만 명의 숙련된 기술직 근로자를 양성하는 목표를 설정하면서 주가가 강세를 보였습니다. 산업계 전반의 구인난을 해소하고 국가 인프라 경쟁력을 높이는 대규모 프로젝트입니다. 기업의 ESG 경영 및 사회적 기여를 인정받고 있습니다. 투자 심리에 긍정적인 영향을 미쳤습니다.", "source": "Blockonomi", "date": "2026-09-02 23:07", "url": "https://blockonomi.com/att-t-stock-surges-as-workforce-coalition-targets-1-million-skilled-workers-by-2035/", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 인재양성"}, {"title": "Verizon deploys Frontline Crisis Response teams in Indiana, Hawaii - Telecompaper", "summary": "미국 통신사 버라이즌이 인디애나주와 하와이주에서 발생한 비상 상황에 대응하기 위해 '프론트라인 위기 대응 팀'을 긴급 파견했습니다. 재난 지역의 공공 안전 통신망을 복구하고 원활한 통신을 지원합니다. 통신사의 사회적 책무와 재난 복구 역량을 입증합니다. 지역 주민들의 통신 편의를 돕습니다.", "source": "Telecompaper", "date": "2026-09-02 19:57", "url": "https://www.telecompaper.co ortance": 3, "wl": false, "topic": "베트남 2g 폐쇄"}, {"title": "[현장] \"컴퓨팅 자원만으론 AI 3강 못 간다\"…AI 네트워크 투자 물꼬 트려면 - 데일리안", "summary": "인공지능 시대에 컴퓨팅 자원 확보뿐만 아니라 AI 네트워크 투자의 물꼬를 트기 위한 논의가 진행되었습니다. 통신망의 고도화 없이는 AI 서비스의 안정적인 구현이 불가능하다는 지적이 나왔습니다. 통신사들의 적극적인 인프라 투자 유인이 필요한 시점입니다. 업계 전문가들이 AI 네트워크 생태계 활성화 방안을 모색했습니다.", "source": "데일리안", "date": "2026-09-02 13:58", "url": "https://www.dailian.co.kr/news/view/1685489/%ED%98%84%EC%9E%A5-%EC%BB%B4%ED%93%A8%ED%8C%85-%EC%9E%90%EC%9B%90%EB%A7%8C%EC%9C%BC%EB%A1%A0-AI-3%EA%B0%95-%EB%AA%BB-2026", "category": "other", "importance": 3, "wl": false, "topic": "ai 네트워크 투자"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "증권가에서 SK텔레콤의 통신 본업 회복과 함께 신규 주파수 할당, 5G SA 상용화 및 AI 기지국 보급 확대 정책 논의 가능성이 거론됐다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "policy", "importance": 3, "wl": false, "topic": "skt 신규 주파수 정책"}, {"title": "T-Mobile Has Its Storm Response Ready as Edouard Moves Toward the Gulf Coast - TmoNews", "summary": "티모바일이 멕시코만 연안으로 접근하는 허리케인 '에두아르'에 대비하여 철저한 폭풍 대응 체계를 가동했습니다. 통신망 피해를 최소화하고 신속한 복구를 위한 비상 인력과 장비를 배치했습니다. 재난 상황 속에서도 가입자들의 통신 서비스를 유지하기 위한 조치입니다. 통신사의 위기 관리 능력을 보여줍니다.", "source": "TmoNews", "date": "2026-09-02 13:36", "url": "https://www.tmonews.com/2026/09/t-mobile-has-its-storm-response-ready-as-edouard-moves-toward-the-gulf-coast/?amp=1", "category": "contract", "importance": 3, "wl": false, "topic": "티모바일 폭풍대응"}, {"title": "Hitachi verifies 600-km automated disaster recovery with IOWN APN - International Business", "summary": "히타치가 IOWN APN 기술을 활용해 600km 구간의 자동화된 재난 복구 기능을 검증했다는 기술 보도입니다. 차세대 광네트워크 및 인프라 기술 동향 파악에 유의미합니다.", "source": "International Business Times", "date": "2026-09-02 13:25", "url": "https://jp.ibtimes.com/hitachi-verifies-600-km-automated-disaster-recovery-iown-apn-104086", "category": "tech", "importance": 3, "wl": false, "topic": "히타치 기술"}, {"title": "여의도 뒤덮을 100만 인파...LG유플러스, 이동기지국·AI로 통신 장애 막는다 - 소비자경제",   return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
