<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network CI Dashboard</title>
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#1C2B3A; --ink-soft:#5B6B7B;
  --line:#DDE4EA; --brand:#155EA2; --brand-soft:#E8F1F9;
  --alert:#C0392B; --alert-bg:#FBEDEB;
  --imp5:#C0392B; --imp4:#D97C2B; --imp3:#155EA2; --imp2:#7C8A98;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55}
a{color:inherit; text-decoration:none}
.wrap{max-width:920px; margin:0 auto; padding:0 16px 60px}

header{padding:22px 0 14px}
header h1{font-size:21px; font-weight:800; letter-spacing:-.3px}
header h1 span{color:var(--brand)}
.meta{margin-top:4px; font-size:12.5px; color:var(--ink-soft)}

/* Outage 경보 배너 */
.alert-banner{display:none; background:var(--alert-bg); border:1px solid #EBC4BE;
  border-left:4px solid var(--alert); border-radius:8px; padding:12px 14px; margin-bottom:14px}
.alert-banner.on{display:block}
.alert-banner .ab-head{font-weight:800; color:var(--alert); font-size:14px; margin-bottom:6px}
.alert-banner a{display:block; font-size:13.5px; padding:2px 0; color:#7A2A20}
.alert-banner a:hover{text-decoration:underline}

/* 탭 */
nav{position:sticky; top:0; z-index:10; background:var(--bg);
  display:flex; gap:2px; overflow-x:auto; padding:6px 0 10px; -webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  border-radius:20px; padding:7px 14px; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap}
nav button .n{margin-left:5px; font-size:11.5px; color:#9AA7B3}
nav button.active{background:var(--brand); border-color:var(--brand); color:#fff}
nav button.active .n{color:#CFE2F3}
nav button.tab-outage.has-alert{border-color:var(--alert); color:var(--alert)}
nav button.tab-outage.has-alert.active{background:var(--alert); color:#fff}

h2.group{font-size:13px; font-weight:700; color:var(--ink-soft); margin:18px 0 8px}

/* 기사 카드 */
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:10px}
.card .row1{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap}
.imp{flex:none; min-width:26px; text-align:center; border-radius:6px;
  font-size:11.5px; font-weight:800; color:#fff; padding:2px 6px}
.imp.i5{background:var(--imp5)} .imp.i4{background:var(--imp4)}
.imp.i3{background:var(--imp3)} .imp.i2,.imp.i1{background:var(--imp2)}
.chip{flex:none; font-size:11.5px; font-weight:700; color:var(--brand);
  background:var(--brand-soft); border-radius:6px; padding:2px 8px}
.chip.c-outage{color:var(--alert); background:var(--alert-bg)}
.sec-tag{font-size:11.5px; color:#9AA7B3; font-weight:600}
.card h3{font-size:15.5px; font-weight:700; line-height:1.4}
.card h3 a:hover{color:var(--brand); text-decoration:underline}
.card p{margin-top:6px; font-size:13.5px; color:#3D4C5B}
.card .foot{margin-top:8px; font-size:12px; color:var(--ink-soft)}
.empty{padding:40px 0; text-align:center; color:var(--ink-soft); font-size:14px}

@media (max-width:520px){
  .card{padding:12px 13px}
  .card h3{font-size:15px}
}
</style>
</head>

ttps://www.yna.co.kr/view/AKR20260903037251017?input=1195m", "category": "contract", "importance": 2, "wl": false, "topic": ""}, {"title": "네이버클라우드, '보안 특화 AI 파운데이션 모델' 개발 맡는다", "summary": "과학기술정보 통신 부( 과기정통부 )는 3일 '보안 특파모' 프로젝트 공모에 참여한 2개 사업자를 대상으로 발표평가를 진행한 결과 네이버클라우드가 최종 사업 수행기관으로 뽑혔다고 밝혔다. 이번 발표평가에선...", "source": "ajunews.com", "date": "2026-09-03 09:24", "url": "https://www.ajunews.com/view/20260903092059131", "category": "other", "importance": 2, "wl": false, "topic": ""}], "carrier": [{"title": "DT hires AWS's Jan Hofmeyr as CTO", "summary": "도이체텔레콤이 AWS의 얀 호프메이어를 2026년 11월부로 새 CTO로 영입하고, 크리스티안 일렉 CFO는 2027년 5월에 퇴임한다고 밝혔다. 주요 통신사의 핵심 임원 교체는 향후 기술 전략과 네트워크 투자 방향에 영향을 미칠 수 있다. 통신사 고위 경영진의 변화를 주시할 필요가 있다.", "source": "Light Reading", "date": "2026-09-02 23:47", "url": "https://www.lightreading.com/broadband/dt-hires-aws-s-jan-hofmeyr-as-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이체텔레콤 수주"}, {"title": "KT, 청년 120명 생성형 AI 실전 승부", "summary": "KT가 전국 교육장에서 청약 교육생 120명이 참가한 'KT K-뉴딜아카데미 1기 AX 경진대회'를 개최했다. 교육생들은 AI 기술을 활용해 KT의 실제 비즈니스와 연계할 수 있는 아이디어를 기획·제작했다. 통신사의 AI 인재 양성 및 실무 적용 시도 사례다.", "source": "ZDNet Korea", "date": "2026-09-02 22:44", "url": "https://zdnet.co.kr/view/?no=20260902224451", "category": "contract", "importance": 3, "wl": true, "topic": "kt 수주"}, {"title": "HPE scores Wi-Fi and AI goals as 5G and VMware lose out", "summary": "영국 런던의 토트넘 홋스퍼 스타디움이 Wi-Fi 7과 AI 기능이 포함된 수백만 달러 규모의 HPE 기술 업그레이드를 거의 완료했다. HPE는 5G와 VMware가 빠진 자리에 Wi-Fi 및 AI 목표를 달성했다. 주요 대형 경기장의 최신 통신 인프라 도입 사례다.", "source": "Light Reading", "date": "2026-09-02 15:00", "url": "https://www.lightreading.com/wifi/hpe-scores-wi-fi-and-ai-goals-as-5g-and-vmware-lose-out", "category": "contract", "importance": 3, "wl": true, "topic": "토트넘 수주"}, {"title": "Charter CFO heading to Google-Blackstone data center JV", "summary": "차터의 제시카 피셔 CFO가 오는 10월 15일 사임하고 구글과 블랙스톤이 공동 설립한 AI 데이터 센터 합작법인으로 이동한다. 구글의 커스텀 텐서 처리 장치를 활용할 예정인 가운데, 차터는 후임자 물색에 나섰다. 주요 통신사 경영진의 이동이 네트워크 및 AI 투자 전략에 미칠 영향을 주시할 필요가 있다.", "source": "Light Reading", "date": "2026-09-02 03:54", "url": "https://www.lightreading.com/cable-technology/charter-cfo-heading-to-google-blackstone-data-center-jv", "category": "exec", "importance": 3, "wl": true, "topic": "차터 수주"}, {"title": "AT&T goes to the mat over Charter's use of 'fiber-powered' label for HFC", "summary": "AT&T가 차터의 HFC 네트워크 기반 초고속 인터넷에 '섬유 기반(fiber-powered)'이라는 표현을 사용한 것이 소비자를 오도하는 허위 광고라며 소송을 제기했다. 이는 광고 감시 기관의 판결 이후 몇 달 만에 이루어졌다. 통신사 간 마케팅 용어 및 서비스 품질을 둘러싼 법적 공방을 보여준다.", "source": "Light Reading", "date": "2026-09-02 00:55", "url": "https://www.lightreading.com/broadband/at-t-goes-to-the-mat-over-charter-s-use-of-fiber-powered-label-for-hfc", "category": "policy", "importance": 3, "wl": true, "topic": "at&t 수주"}, {"title": "The road to mobile takes new twists and turns for Tier 2/3 broadband operators", "summary": "최근의 거래와 파트너십 덕분에 중소형 케이블 및 광대역 사업자들이 단말기 금융 및 업그레이드 프로그램에 접근할 수 있게 되었으며 모바일 사업에 진입할 새로운 방안을 확보하고 있다. 티어 2/3 통신사들의 모바일 시장 진출 전략 변화를 나타낸다.", "source": "Light Reading", "date": "2026-09-01 22:00", "url": "https://www.lightreading.com/cable-technology/the-road-to-mobile-takes-new-twists-and-turns-for-tier-2-3-broadband-operators", "category": "contract", "importance": 3, "wl": true, "topic": "티어 수주"}, {"title": "Cable One's carrier services unit beefs up wholesale ordering system", "summary": "ISP와 모바일 통신사 대상 도매 연결 서비스를 제공하는 케이블원의 자회사 스파크라이트 캐리어 서비스가 주문 관리 플랫폼을 간소화했다고 밝혔다. 이번 시스템 개편으로 홀세일 주문 처리 효율성이 향상될 것으로 기대된다. 향후 도매 연결 시장에서 경쟁력을 높이는 계기가 될 수 있다.", "source": "Light Reading", "date": "2026-09-03 05:59", "url": "https://www.lightreading.com/cable-technology/cable-one-s-carrier-services-unit-beefs-up-wholesale-ordering-system", "category": "contract", "importance": 2, "wl": true, "topic": "케이블원 수주"}, {"title": "Helium seeks new heights for Wi-Fi offload model", "summary": "헬륨의 마리오 디 디오 CEO가 통신사와 MVNO, 리테일 브랜드가 무선 연결 서비스를 쉽게 출시하고 관리할 수 있도록 지원하는 새로운 플랫폼에 대해 논의했다. 통신 사업 모델 다변화 측면에서 참고할 만한 동향이다.", "source": "Light Reading", "date": "2026-09-02 21:49", "url": "https://www.lightreading.com/wifi/helium-seeks-new-heights-for-wi-fi-offload-model", "category": "exec", "importance": 2, "wl": true, "topic": "헬륨 수주"}, {"title": "TDS acquires Granite State Communications", "summary": "TDS 텔레커뮤니케이션즈가 그래나이트 스테이트 커뮤니케이션즈의 광섬유 및 음성 사업 인수를 완료했다. 이번 인수로 뉴햄프셔 지역의 광섬유 발자국에 1만 1천 개 이상의 서비스 주소가 추가됐다. 지역 통신사의 인프라 확장 사례다.", "source": "Light Reading", "date": "2026-09-02 03:29", "url": "https://www.lightreading.com/fttx/tds-acquires-granite-state-communications", "category": "contract", "importance": 2, "wl": true, "topic": "tds 수주"}, {"title": "Keppel, Singtel land major DC deals in Japan, Singapore", "summary": "케펠 DC REIT가 도쿄의 하이퍼스케일 데이터 센터 두 곳의 과반수 지분을 인수할 예정이며, 싱텔과 KKR은 STT GDC의 52억 달러 인수를 완료했다. 아시아 지역 데이터 센터 인프라 투자가 활발히 이루어지고 있다.", "source": "Light Reading", "date": "2026-09-01 22:43", "url": "https://www.lightreading.com/data-centers/keppel-dc-reit-expands-japan-assets-as-singtel-kkr-close-5-2b-stt-gdc-deal", "category": "contract", "importance": 2, "wl": true, "topic": "케펠 수주"}, {"title": "KT 클라우드, LS일렉트릭과 AIDC 전력 공급체계 구축 맞손 - 네이트", "summary": "KT 클라우드가 LS일렉트릭과 손을 잡고 AIDC 전력 공급 체계를 구축한다. 대규모 전력이 소모되는 AI 데이터센터 인프라 확충에 힘을 모은다.", "source": "네이트", "date": "2026-09-03 09:01", "url": "https://news.nate.com/view/20260903n06449", "category": "contract", "importance": 4, "wl": false, "topic": "kt클라우드 ls일렉트릭 전력인프라 협력"}, {"title": "KT, 로밍부터 안전 AX까지…'통신사 넘어 AX 플랫폼' 전환 속도 - 뉴스투데이", "summary": "KT가 로밍 서비스부터 안전 분야 AX(AI 전환) 기술까지 아우르며 단순 통신사를 넘어 AX 플랫폼 기업으로의 전환에 속도를 내고 있다. AI 역량을 결합한 신사업 발굴에 집중하고 있다.", "source": "뉴스투데이", "date": "2026-09-03 07:24", "url": "https://www.news2day.co.kr/article/20260902500272", "category": "tech", "importance": 4, "wl": false, "topic": "kt ax 플랫폼 전환"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - Barron's", "summary": "행동주의 펀드 엘리엇이 도이체텔레콤과의 합병에 반대한다는 보도가 나온 가운데 티모바일의 주가가 상승했다. 통신사 간 지배구조와 합병 이슈가 투자 심리에 영향을 미치고 있다.", "source": "Barron's", <script>
const META  = (typeof NEWS_META  !== "undefined") ? NEWS_META  : {generated:"데이터 없음", sections:[]};
const DATA  = (typeof NEWS_DATA  !== "undefined") ? NEWS_DATA  : {};
const LATEST= (typeof NEWS_LATEST!== "undefined") ? NEWS_LATEST: [];

const CAT_LABEL = {outage:"장애", contract:"수주·계약", tech:"기술", earnings:"실적",
                   exec:"인사", policy:"정책·규제", other:"일반"};
const SEC_NAME = {};
META.sections.forEach(s => SEC_NAME[s.id] = s.name);

function esc(s){const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML;}

function card(a, showSec){
  const imp = a.importance || 2;
  const cat = CAT_LABEL[a.category] || "일반";
  return `<article class="card">
    <div class="row1">
      <span class="imp i${imp}">${imp}</span>
      <span class="chip ${a.category==="outage"?"c-outage":""}">${esc(cat)}</span>
      ${showSec && a.sid ? `<span class="sec-tag">${esc(SEC_NAME[a.sid]||"")}</span>` : ""}
    </div>
    <h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h3>
    ${a.summary ? `<p>${esc(a.summary)}</p>` : ""}
    <div class="foot">${esc(a.source)} — ${esc(a.date)}</div>
  </article>`;
}

function dedupeByTopic(list){
  const seen = new Set(); const out = [];
  for(const a of list){
    const t = a.topic || "";
    if(t && seen.has(t)) continue;
    if(t) seen.add(t);
    out.push(a);
  }
  return out;
}

/* 주요·최신 탭 */
function renderTop(){
  let tops = [];
  META.sections.forEach(s => (DATA[s.id]||[]).forEach(a => {
    if((a.importance||0) >= 4) tops.push({...a, sid:s.id});
  }));
  tops.sort((x,y) => (y.importance-x.importance) || (y.date>x.date?1:-1));
  tops = dedupeByTopic(tops).slice(0,12);
  let h = "";
  if(tops.length){ h += `<h2 class="group">중요 기사 (중요도 4 이상)</h2>` + tops.map(a=>card(a,true)).join(""); }
  if(LATEST.length){ h += `<h2 class="group">최신 기사</h2>` + LATEST.map(a=>card(a,true)).join(""); }
  return h || `<div class="empty">최근 48시간 내 수집된 기사가 없습니다</div>`;
}

function renderSection(sid){
  const items = DATA[sid] || [];
  if(!items.length) return `<div class="empty">최근 48시간 내 해당 섹션 기사가 없습니다</div>`;
  return items.map(a=>card(a,false)).join("");
}

/* Outage 경보 배너: outage 섹션 중요도 4+ */
function renderAlert(){
  const alerts = (DATA.outage||[]).filter(a => (a.importance||0) >= 4);
  if(!alerts.length) return false;
  document.getElementById("alertList").innerHTML =
    alerts.slice(0,3).map(a =>
      `<a href="${esc(a.url)}" target="_blank" rel="noopener">• ${esc(a.title)} <small>(${esc(a.source)}, ${esc(a.date)})</small></a>`
    ).join("");
  document.getElementById("alertBanner").classList.add("on");
  return true;
}

/* 탭 구성 */
const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");
const tabDefs = [{id:"top", name:"주요·최신", count:null}]
  .concat(META.sections.map(s => ({id:s.id, name:s.name, count:(DATA[s.id]||[]).length})));

function select(id){
  [...tabsEl.children].forEach(b => b.classList.toggle("active", b.dataset.id===id));
  contentEl.innerHTML = (id==="top") ? renderTop() : renderSection(id);
  window.scrollTo(0,0);
}

tabDefs.forEach(t => {
  const b = document.createElement("button");
  b.dataset.id = t.id;
  b.innerHTML = esc(t.name) + (t.count!==null ? `<span class="n">${t.count}</span>` : "");
  if(t.id==="outage") b.classList.add("tab-outage");
  b.onclick = () => select(t.id);
  tabsEl.appendChild(b);
});

document.getElementById("meta").textContent = "업데이트 " + META.generated + " (KST, 최근 48시간)";
const hasAlert = renderAlert();
if(hasAlert) document.querySelector(".tab-outage")?.classList.add("has-alert");
select("top");

/* 5분 자동 새로고침 */
setTimeout(() => location.reload(), 5*60*1000);
</script>
</body>
</html>
