<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

zed-satellite-spectrum/cZYBgpkRJZH", "category": "contract", "importance": 3, "wl": false, "topic": "ast스페이스모바일 실적"}, {"title": "Kymeta Secures $20 Million Department of Defense Order for Resilient Flat-Panel SATCOM Ter", "summary": "키메타가 미국 국방부로부터 2,000만 달러 규모의 평판형 위성통신 단말기 공급 계약을 체결했다. 군사 통신망의 회복력 강화가 목적이다.", "source": "satnews.com", "date": "2026-09-06 09:00", "url": "https://satnews.com/2026/09/05/kymeta-secures-20-million-department-of-defense-order-for-resilient-flat-panel-satcom-terminals/", "category": "contract", "importance": 3, "wl": false, "topic": "키메타 미 국방부 계약"}, {"title": "\"저궤도 위성만으로 지상망 대체 어렵다”", "summary": "미국 이동통신 3사가 저궤도 위성만으로 지상망을 대체하기는 어렵다는 입장을 보이고 있다. AT&T, T모바일, 버라이즌은 스타링크 모바일과 MVNO 계약에 소극적이다. 대신 주파수 자원 공유와 다중 위성 사업자 협력으로 음영지역을 해소하고 있다. 지상망과 위성통신의 역할 분담이 논의되고 있다.", "source": "zdnet.co.kr", "date": "2026-09-06 08:42", "url": "https://zdnet.co.kr/view/?no=20260906084139", "category": "tech", "importance": 3, "wl": false, "topic": "미국 통신사 스타링크"}, {"title": "中·싱가포르 연구진 “ 스타링크 최신 단말기 해킹 성공” [차이나우]", "summary": "중국과 싱가포르 연구진이 스페이스X의 스타링크 최신 사용자 단말기를 해킹해 관리자 권한을 확보했다고 주장했다. 이번 해킹으로 위성 통신의 보안성에 대한 우려가 제기된다. 위성 인터넷 단말기의 취약점이 노출된 사례다. 위성통신 보안 강화의 필요성이 대두되고 있다.", "source": "segye.com", "date": "2026-09-06 07:19", "url": "https://www.segye.com/newsView/20260904502034?OutUrl=naver", "category": "tech", "importance": 3, "wl": false, "topic": "스타링크 단말기 해킹"}, {"title": "아마존, 머스크의 스타링크 본격 추격 - 미주조선일보", "summary": "아마존이 저궤도 위성 인터넷 사업을 본격화하며 일론 머스크의 스타링크를 맹추격하고 있다. 글로벌 위성통신 시장의 경쟁이 격화될 전망이다.", "source": "미주조선일보", "date": "2026-09-06 06:38", "url": "https://chosundaily.com/bbs/board.php?bo_table=hotclick&wr_id=31520&sca=%EA%B2%BD%EC%A0%9C&spt=-31748&page=9", "category": "contract", "importance": 3, "wl": false, "topic": "아마존 스타링크 추격"}, {"title": "ASTS Stock Slides Premarket: AT&T Says SpaceX And Amazon Could Rival AST SpaceMobile In Sa", "summary": "AT&T가 스페이스엑스와 아마존이 AST 스페이스모바일의 위성통신 사업에 강력한 라이벌이 될 수 있다고 언급하면서 관련 주가가 하락했다. 위성통신 시장의 경쟁 구도와 주요 사업자들의 동향을 보여준다.", summary": "테슬라와 스페이스X의 합병설이 재부상한 가운데 중국 생산망이 최대 걸림돌로 지목됐다. 테슬라는 배터리와 태양광을, 스페이스X는 스타링크와 AI 모델을 제공할 수 있다는 분석이다. 테슬라의 상하이 거점이 글로벌 공급망에서 차지하는 비중이 변수다. 우주와 모빌리티 기업 간 시너지 창출 가능성이 논의되고 있다.", "source": "digitaltoday.co.kr", "date": "2026-09-05 15:02", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=698509", "category": "contract", "importance": 3, "wl": false, "topic": "테슬라 스페이스x 합병"}, {"title": "AMZN Stock Gains On Hitting Satellite Milestone to Launch Starlink Internet Rival This Yea", "summary": "아마존이 스타링크의 대항마인 위성 인터넷 서비스 출시를 위한 위성 발사 마일스톤에 도달하며 주가가 상승했다.", "source": "Stocktwits", "date": "2026-09-05 13:53", "url": "https://stocktwits.com/news-articles/markets/equity/amzn-stock-gains-on-hitting-satellite-milestone-to-launch-starlink-internet-rival-this-year/cZmewuPR7jI", "category": "contract", "importance": 3, "wl": false, "topic": "아마존 위성인터넷"}, {"title": "ASTS Stock Eyes Weekly Comeback: AT&T Says AST SpaceMobile Satellite Offering Will 'Come T", "summary": "AT&T가 AST 스페이스모바일의 위성통신 서비스 제공이 계획대로 진행될 것이라고 밝혔다. 위성통신 상용화를 위한 통신사와 파트너사 간의 협력 진행 상황을 다룬다.", "source": "Stocktwits", "date": "2026-09-05 12:15", "url": "https://stocktwits.com/news-articles/markets/equity/asts-at-and-t-satellite-offering-next-year/cZZn4ASR7DU", "category": "contract", "importance": 3, "wl": false, "topic": "에이티앤티 위성통신 제휴"}, {"title": "[미리보는 AINEX 2026]〈상〉AI시대 우주·지상·해저 '초연결' 네트워크 ...", "summary": "AINEX 2026에서 우주·지상·해저 초연결 네트워크가 조명된다. 이경한 교수와 황근철 삼성전자 부사장이 네트워크 진화 방안과 인프라 기술을 주제로 발표한다. AI 서비스 확산에 따른 네트워크의 중요성과 고도화 방안이 논의된다. 차세대 통신 인프라 구축 전략이 공유될 예정이다.", "source": "etnews.com", "date": "2026-09-05 06:01", "url": "https://www.etnews.com/20260904000311", "category": "tech", "importance": 3, "wl": false, "topic": "삼성전자 네트워크 진화"}], "competitor": [{"title": "Was Huawei’s rise built on crime? A Brooklyn jury will decide", "summary": "화웨이의 성장 과정에서의 불법 행위 여부를 가리는 재판이 브루클린 법원에서 시작된다. 멍완저우 부회장의 캐나다 구금 해제 5년 만에 기업 자체에 대한 본격적인 사법 절차가 진행되는 것이다. 이번 재판 결과는 화웨이의 글로벌 사업 신뢰도와 향후 시장 진출 전략에 중대한 영향을 미칠 것으로 보인다.", "source": "Financial Times Tech", "date": "2026-09-06 21:00", "url": "https://www.ft.com/content/9422805f-519c-4b22-839c-cbd7a6464f07?syn-25a6b1a6=1", "category": "policy", "importance": 4, "wl": true, "topic": "화웨이 사법 리스크"}, {"title": "[글로벌 포커스] 수에즈 품은 이집트, 미·중 'AI 패권 전쟁'의 새로운 ...", "summary": "중국 통신장비 업체 화웨이가 이집트에 두 개의 컴퓨팅 클러스터 구축 입찰 제안서를 제출하며 선제공격에 나섰다. 12개월 내 구축과 AI 모델 훈련용 최신 장비 공급을 제안했다. 미국의 맞불 전략 속에서 중동 지역 AI 패권 경쟁이 격화하고 있다. 화웨이의 글로벌 인프라 확장 전략이 주목된다.", "source": "newsian.co.kr", "date": "2026-09-05 06:50", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=94828", "category": "contract", "importance": 4, "wl": false, "topic": "화웨이 이집트 수주전"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤과 에릭슨이 독일 함부르크 컨테이너 터미널에 프라이빗 5G 네트워크를 구축했다. 이는 7년간 이어진 양사의 협력 프로젝트의 일환으로, 산업용 5G 기술의 실효성을 입증하는 사례다. 이번 구축은 제조 및 물류 현장에서의 5G 활용 사례를 확대하려는 양사의 전략적 의지가 반영된 결과다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 4, "wl": true, "topic": "에릭슨 수주"}, {"title": "‘관세 폭탄’ 美에 등 돌린 加, 中과 8년 만에 군사 교류", "summary": "캐나다가 관세 갈등 속에 중국과 8년 만에 군사 교류 재개에 나섰다. 과거 화웨이 창업자 딸 체포 사건으로 양국 관계가 급냉했으나 마크 카니 총리 취임 후 변화가 생겼다. 통신장비 업체 관련 정치적 갈등이 해소 국면을 맞고 있다. 글로벌 외교 지형의 변화가 감지되고 있다.", "source": "kmib.co.kr", "date": "2026-09-06 18:38", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000009486&cp=nv", "category": "other", "importance": 3, "wl": false, "topic": "캐나다 화웨이 갈등"}, {"title": "통신 장비 주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게", "summary": "3G와 LTE를 거쳐 5G로 이어지며 무선 장비 업체 수는 감소했지만 선도업체 매출은 증가하는 쏠림 현상이 나타났다. 엔비디아가 AI 기지국 시장으로 사업을 확장하는 등 시장 재편이 이뤄지고 있다. 국내외 통신 장비 주의 실적 개선과 주가 흐름에 차이가 발생하고 있다. 차세대 통신 장비 시장의 경쟁 구도가 변화하고 있다.", "source": "metroseoul.co.kr", "date": "2026-09-06 09:44", "url": "http://www.metroseoul.co.kr/article/20260906500019", "category": "earnings", "importanc 사이버 위협의 실태가 드러났다. 정부는 정보보호 네트워크 정책을 통해 보안 책임을 엄중히 묻고 있다. 기업들의 철저한 보안 관리 체계 확립이 요구된다.", "source": "digitaltoday.co.kr", "date": "2026-09-06 08:14", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=698304", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 침해사고 조사"}, {"title": "제각각 통신 방식 통일…軍, 전군 드론 '통신표준' 만든다 - news1.kr", "summary": "군 당국이 제각각이던 군용 드론의 통신 방식을 하나로 통일하기 위한 전군 통신 표준 제정에 나선다. 통신 연동성 확보와 효율적 운용이 목적이다.", "source": "news1.kr", "date": "2026-09-06 07:00", "url": "https://www.news1.kr/amp/diplomacy/defense-diplomacy/6280619", "category": "policy", "importance": 3, "wl": false, "topic": "한국군 드론 통신표준"}, {"title": "[단독] 과기정통부 , 유럽에 'AI 공동연구랩' 세운다", "summary": "과기정통부가 IITP와 함께 내년 유럽에 글로벌 AI 공동연구랩 구축에 착수한다. 국회 의원실을 통해 제출된 사업설명서에 따르면 국제 공동연구가 본격화된다. 글로벌 AI 연구 네트워크를 확장하기 위한 전략적 투자다. 국내 연구진의 국제 협력 역량이 강화될 것으로 기대된다.", "source": "mt.co.kr", "date": "2026-09-06 06:30", "url": "https://www.mt.co.kr/tech/2026/09/06/2026090315315525902", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai 공동연구랩"}, {"title": "Union Minister Jyotiraditya Scindia launches theme for 10th India Mobile Congress 2026 - N", "summary": "인도 통신 장관이 제10회 인도 모바일 콩그레스(IMC)의 공식 테마를 발표했다. 글로벌 통신 및 모바일 기술 트렌드를 논의하는 장이 될 예정이다.", "source": "News On AIR", "date": "2026-09-06 04:56", "url": "https://newsonair.gov.in/union-minister-jyotiraditya-scindia-launches-theme-for-10th-india-mobile-congress-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "인도 모바일 콩그레스"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "미 연방항공청(FAA)의 5G 무선 고도계 관련 규제 및 갈등이 마무리 단계에 접어들었다. 항공 안전과 5G 통신 서비스 간의 주파수 간섭 문제가 해소되고 있다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "미국 faa 5g 규제"}, {"title": "LIVE: | Islamabad 5G Spectrum Auction 2026 | PTA Inaugural Ceremony | Geo News James Haske", "summary": "파키스탄에서 5G 주파수 경매와 관련된 통신사 기념 행사 및 정책 추진 일정이 진행되고 있다.", "source": "Mshale", "date": "2026-09-05 14:17", "url": "https://mshale.com/9bf82a2b/01c0c54dNsw9aucTWYE", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 5g 주파수"}, {"title": "Putting Customer Protection First: Why Consent Verification Should Rest With the TAP - Tel", "summary": "소비자 보호를 최우선으로 하기 위해 동의 검증 책임이 TAP에 귀속되어야 한다는 규제 및 제도적 개선 방향을 논의한다. 통신 부가 서비스 및 소비자 보호 관련 규제 이슈이다.", "source": "TelecomTalk", "date": "2026-09-05 11:36", "url": "https://telecomtalk.info/putting-customer-protection-why-consent-verification-tap/1011571/", "category": "policy", "importance": 3, "wl": false, "topic": "소비자 보호 및 동의 검증 규제"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신규제국(TRAI)이 제안한 5G 슬라이싱 품질 서비스 규범에 대해 통신사들이 반대 입장을 표명했다. 슬라이싱 활성화 지역의 자원 모니터링과 무선 자원 활용률 80% 제한 규정이 통신사의 네트워크 운영 효율성을 저해할 수 있다는 우려 때문이다. 이번 논의는 인도 내 5G 서비스 품질과 규제 간의 균형을 찾는 과정에서 중요한 변수가 될 전망이다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "인도 규제국 5g 슬라이싱"}, {"title": "Canada publishes Responsible Data Centre Development Principles - Telecompaper", "summary": "캐나다 정부가 책임 있는 데이터센터 개발을 위한 원칙과 가이드라인을 새롭게 발표했다. 인프라 시설 확대에 따른 정책적 규제 및 지침이다.", "source": "Telecompaper", "date": "2026-09-05 00:21", "url": "https://www.telecompaper.com/news/canada-publishes-responsible-data-centre-development-principles--1581820", "category": "policy", "importance": 3, "wl": false, "topic": "캐나다 데이터센터 개발 원칙 발표"}, {"title": "과기정통부 , 2027년 예산 29.6조 원 편성…전 국민 AI서비스 지원", "summary": "과기정통부가 편성한 29조 6000억 원 규모의 예산안에 전 국민 AI 서비스 지원 계획이 포함됐다. 국공립과학관 활용과 함께 취약계층을 위한 정보통신 기기 개발 및 보급이 확대된다. 광학문자판독기와 의사소통보조기기 지원 등이 추진된다. 포용적 ICT 복지 정책이 지속되고 있다.", "source": "hellot.net", "date": "2026-09-05 17:46", "url": "https://www.hellot.net/news/article.html?no=114788", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 정보통신 기기"}], "carrier": [{"title": "Charter Stock Outlook: Can the $34.5B Cox Merger Help CHTR Recover Before Earnings? - Trad", "summary": "차터 커뮤니케이션즈가 345억 달러 규모의 콕스(Cox) 인수합병을 통해 실적 회복을 이뤄낼 수 있을지 시장의 관심이 쏠리고 있다. 대형 통신·케이블 사업자 간의 초대형 M&A 추진 과정은 업계 판도에 큰 영향을 미친다.", "source": "TradingKey", "date": "2026-09-06 07:20", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/261998863-charter-stock-outlook-cox-merger-chtr-before-earnings-tradingkey", "category": "contract", "importance": 4, "wl": false, "topic": "차터 커뮤니케이션즈 인수합병"}, {"title": "KDDIが光回線＋5Gの「auひかりプラス」を提供する狙い 光コラボを生かして全国展開も視野に", "summary": "KDDI가 9월 17일부터 광회선과 5G SA를 결합한 'au 히카리 플러스' 서비스를 시작한다. 개통 전 즉시 사용 및 장애 시 자동 백업 기능을 제공하며, 고정 전화의 VoLTE화를 통해 부가 가치를 높였다. 이는 그룹 내 프로바이더 경쟁을 해소하고 NTT 광통신망을 활용해 전국적인 사업 효율성을 극대화하려는 전략이다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "contract", "importance": 4, "wl": true, "topic": "kddi 서비스"}, {"title": "전화·검색·카톡 파고드는 ‘모두의 AI’… 생활 속 실행력 승부수", "summary": "과기정통부가 개최한 사업 착수 간담회에서 AI 서비스와 비즈니스 모델 창출의 중요성이 강조됐다. 배경훈 부총리 겸 장관은 차별화된 가치 제공을 주문했다. 생활 속에 파고드는 AI 서비스 확산이 추진되고 있다. 정부 주도의 AI 프로젝트가 본궤도에 올랐다.", "source": "dt.co.kr", "date": "2026-09-06 18:38", "url": "https://www.dt.co.kr/article/12082349?ref=naver", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 모두의 ai"}, {"title": "Verizon waives charges for Hurricane Lowell, prepares network in Hawaiʻi - Verizon", "summary": "미국 통신사 버라이즌이 허리케인 로웰 피해 지역 주민들을 위해 요금을 면제하고 하와이 지역 통신망을 사전에 점검·준비하고 있다. 재난 상황에 대비한 통신사의 네트워크 운영 및 고객 지원 조치이다.", "source": "Verizon", "date": "2026-09-06 18:32", "url": "https://www.verizon.com/about/news/hurricane-lowell-updates", "category": "other", "importance": 3, "wl": false, "topic": "버라이즌 허리케인 대응"}, {"title": "암표 잡고 실시간 번역까지…KT야구장 더 스마트해졌다 - 서울경제", "summary": "암표 단속부터 실시간 번역까지 KT가 수원 KT위즈파크에 다양한 인공지능 기술을 도입해 야구장을 더 스마트하게 탈바꿈시켰다. 통신사의 AI 기술 현장 적용 사례이다.", "source": "서울경제", "date": "2026-09-06 17:58", "url": "https://www.sedaily.com/article/20087691", "category": "tech", "importance": 3, "wl": false, "topic": "케이티 야구장 인공지능 기술 적용"}, {"title": "LG유플러스, PMDC 얼라이언스 출범…AI 데이터센터 건축기간 줄인다 - news.nate.com", "summary": "LG유플러스가 PMDC 얼라이언스를 출범하여 AI 데이터센터 건축 기간을 단축한다.", "source": "news.nate.com", "date": "2026-09-06 17:38", "url": "https://news.nate.com/view/20260906n13319", "category": "contract", "importance": 3, "wl": false, "topic": "lg유플러스 ai 데이터센터"}, {"title": "LG유플러스, AI 데이터센터 구축기간 줄인다…PMDC 표준모델 개발 - v.daum.net", "summary": "LG유플러스가 AI 데이터센터(AIDC) 구축 기간을 획기적으로 줄이기 위해 PMDC 표준모델을 자체 개발하고 인프라 공급 역량을 강화한다. 통신사의 AI 인프라 구축 효율화 전략이다.", "source": "v.daum.net", "date": "2026-09-06 17:26", "url": "https://v.daum.net/v/20260906172607902", "category": "tech", "importance": 3, "wl": false, "topic": "엘지유플러스 ai 데이터센터 표준화"}, {"title": "\"AI 데이터센터에 모듈러 접목\" … GS건설·LGU+ 표준모델 개발", "summary": "LG유플러스가 GS건설과 협력하여 AI 데이터센터 수요에 대응하기 위한 모듈러 데이터센터(PMDC) 표준모델을 개발한다. 사전 제작형 모듈러 기술을 적용해 공기를 단축하고 데이터센터 구축 경쟁력을 강화하려는 목적이다. 이는 AI 인프라 시장에서의 벨류체인을 확대하려는 통신사의 전략적 행보다.", "source": "매일경제 IT", "date": "2026-09-06 17:12", "url": "https://www.mk.co.kr/news/realestate/12145461", "category": "contract", "importance": 3, "wl": true, "topic": "lg유플러스 모듈러 데이터센터"}, {"title": "9.4조 AI 승부수 띄운 정부… '보안·전국민 서비스'로 생태계 가속", "summary": "과기정통부가 발표한 내년도 예산안에서 AI 관련 사업 예산이 대폭 증액됐다. 보안과 전 국민 서비스를 중심으로 한 AI 생태계 가속화가 추진된다. 미토스 쇼크 대응과 함께 정부의 전략적 투자가 확대되고 있다. 국가 차원의 AI 경쟁력 강화가 본격화하고 있다.", "source": "newscj.com", "date": "2026-09-06 14:18", "url": "https://www.newscj.com/news/articleView.html?idxno=3430376", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai 예산"}, {"title": "After 10 years of India feat, Jio sets its sights on global market: Akash Ambani", "summary": "릴라이언스 지오가 인도 시장에서의 성공을 바탕으로 글로벌 시장 진출을 본격화한다. 아카시 암바니 회장은 지난 10년간 인도 내 디지털 연결성을 저렴하고 접근 가능하게 만든 성과를 강조하며, 향후 글로벌 시장에서도 동일   ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],

  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}

];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}

    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
