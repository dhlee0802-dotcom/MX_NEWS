<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}

  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}

  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}

  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

le/nokia-opens-ai-research-centre-riyadh", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 r&d 센터 개소"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "SK텔레콤과 LG유플러스가 망 투자 재개 움직임을 보이는 가운데, AI-RAN 기술 실증에 정부 사업으로 참여한다. SK텔레콤은 삼성전자, 에릭슨, 노키아 등과 손잡고 기지국과 AI를 결합한 네트워크 효율화 기술을 검증한다. 차세대 통신 인프라 혁신을 위한 제조사 간 협력이 본격화되고 있다. 향후 상용화 단계의 장비 수주 전선에 큰 영향을 미칠 전망이다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "contract", "importance": 4, "wl": false, "topic": "sk텔레콤 ai-ran"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - The Fast", "summary": "에릭슨이 사우디아라비아에서 모빌리와 협력하여 AI 기반 RAN 및 자율형 네트워크를 추진한다. 양사는 사우디의 디지털 전환을 가속화하기 위해 인공지능 기술을 무선 접속망에 통합하는 방안을 모색하고 있다. 이번 협력은 중동 지역에서 에릭슨의 차세대 네트워크 솔루션 입지를 강화하는 의미를 지닌다.", "source": "The Fast Mode", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 ai ran 협력"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 6G 기지국을 활용해 드론을 정밀하게 탐지하는 기술 시연을 공개했다. 차세대 통신 인프라가 단순 통신을 넘어 센싱 기능을 수행할 수 있음을 보여주는 사례다. 6G 표준화 경쟁에서 주도권을 잡기 위한 기술력을 입증하고 있다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 드론 탐지"}, {"title": "Ericsson powers Saudi Arabia’s next phase of digital transformation and innovation - Tahaw", "summary": "에릭슨이 사우디아라비아의 차세대 디지털 혁신과 기술 고도화를 적극 지원하고 있다. 현지 통신사들과의 협력을 바탕으로 인프라 현대화를 이끌고 있다. 중동 시장 내 에릭슨의 전략적 입지를 보여준다.", "source": "TahawulTech.com", "date": "2026-09-03 07:04", "url": "https://www.tahawultech.com/home-slide/ericsson-powers-saudi-arabias-next-phase-of-digital-transformation-and-innovation/", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 사우디 협력"}, {"title": "Saudi’s ACES announces 5G and 6G partnership with Movandi - Developing Telecoms", "summary": "사우디 에이시스(ACES)가 모반디와 손잡고 5G 및 6G 통신 인프라 파트너십을 체결했다. 차세대 무선 기술 공동 개발 및 중동 인프라 고도화를 목표로 한다. 관련 장비 및 기술 협력 동향이다.", "source": "Developing Telecoms", "date": "2026-09-02 20:57", "url": "https://developingtelecoms.com/regions/middle-east-north-africa-telecommunications/20770-saudis-aces-announces-5g-and-6g-partnership-with-movandi.html", "category": "tech", "importance": 4, "wl": false, "topic": "에이시스 5g·6g 협력"}, {"title": "Orange acquires defence focussed private 5G core tech - Telecoms", "summary": "프랑스 통신사 오렌지가 국방 분야에 특화된 프라이빗 5G 코어 기술을 인수했다. 특수 목적용 사설망 시장 공략을 위한 통신사의 기술 확보 전략을 다루고 있다.", "source": "Telecoms", "date": "2026-09-02 19:24", "url": "https://www.telecoms.com/operator-ecosystem/orange-acquires-defence-focussed-private-5g-core-tech", "category": "contract", "importance": 4, "wl": false, "topic": "오렌지 프라이빗 5g"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 드론 실시간 추적 등 6G와 AI가 결합된 ISAC 통신 신기술을 공개할 예정이다. 한국 정부와 국내 기업들을 상대로 기술력을 홍보하고 협력 방안을 모색한다. 6G 시대 무선 통신과 센싱의 융합 기술 리더십을 강조하고 있다. 향후 국내 통신사 및 파트너사들과의 기술 협력이 강화될 전망이다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 통신"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI-RAN, ISAC, 차별화된 커넥티비티로 이어지는 6G 기술 청사진을 제시했다. AI 시대의 경쟁력은 네트워크 인프라에서 시작된다며 국내 고객사 및 파트너들과의 협력 의지를 다졌다. 글로벌 통신 장비 선도 기업으로서 차세대 표준 기술 주도권을 확보하겠다는 전략이다. 향후 국내 시장에서의 기술 영업이 활발해질 것으로 보인다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 청사진"}, {"title": "Huawei profits fall in H1 on revenues up 10% - Telecompaper", "summary": "화웨이의 상반기 매출은 10% 증가했으나 순이익은 감소한 실적 결과가 발표됐다. 매출 성에도 alse, "topic": "통신3사 네트워크 지원"}, {"title": "AT&T Increases 4.7% Year to Date: How to Play the Stock? - The Globe and Mail", "summary": "미국 통신사 AT&T의 연초 대비 주가 상승률과 향후 투자 전략을 분석한 금융 시장 보도다. 통신 대기업의 재무 성과를 다룬다.", "source": "The Globe and Mail", "date": "2026-09-03 01:02", "url": "https://www.theglobeandmail.com/investing/markets/stocks/VZ/pressreleases/4404799/att-increases-47-year-to-date-how-to-play-the-stock/", "category": "earnings", "importance": 3, "wl": false, "topic": "at&t 주가 동향"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 AI-RAN 네트워크 전환 기술 검증에 성공했다. 로봇이나 드론 등 피지컬 AI 장비가 시험망에서 5G 망으로 이동할 때 무선 환경 변화에 맞춰 최적의 네트워크를 자동 선택하고 안정적으로 연결한다. 차세대 자율주행 및 로봇 서비스의 통신 신뢰성을 높이는 핵심 기술이다. 향후 상용망 적용을 위한 검증 작업이 지속될 예정이다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai-ran"}, {"title": "“삐, 공사장 탐지됐습니다”… AI가 미리 찾는 통신망 위험 - 동아일보", "summary": "인공지능(AI) 기술을 활용해 공사장 등 통신망 주변의 위험 요소를 사전에 탐지하는 시스템이 도입됐다. 굴착 공사 등으로 인한 지하 케이블 절단 사고를 예방하는 데 기여한다. 통신사들의 망 운영 안정성이 한층 높아질 것으로 기대된다. 향후 지능형 인프라 관리 솔루션의 적용이 확대될 전망이다.", "source": "동아일보", "date": "2026-09-03 00:30", "url": "https://www.donga.com/news/Economy/article/all/20260902/134592397/2", "category": "tech", "importance": 3, "wl": false, "topic": "통신망 ai 탐지"}, {"title": "The Kingsbury Commitment Promised Competition. AT&T Got 98% of Long Distance - Broadband B", "summary": "", "source": "Broadband Breakfast", "date": "2026-09-02 21:30", "url": "https://broadbandbreakfast.com/the-kingsbury-commitment-promised-competition-at-t-got-98-of-long-distance/", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "통신업계가 AI 국가 경쟁력 확보를 위해 레거시 네트워크 정비와 함께 5G SA 및 6G 투자를 위한 정부 지원이 필요하다고 역설했다. 과기정통부는 새로운 서비스 창출을 위한 네트워크 편익 증대를 검토 중이다. 구형망 유지 비용과 차세대 투자 간의 미스매치를 해소해야 한다는 목소리가 높다. 향후 정책적 지원책 가시화가 기대된다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 네트워크 고도화"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "통신사들이 AI-RAN, 6G 등 차세대 네트워크 투자 확대에 따라 기존 기지국 중심의 CAPEX 평가 지표를 보완해야 한다고 목소리를 높였다. 개방형 시설에 대한 세액공제 요건 완화 등의 제도 개선이 논의되고 있다. 투자의 실효성을 높이기 위한 정책 정비가 요구된다. 향후 관련 세제 개편 여부가 관건이다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 capex 지표"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "AI 트래픽 폭증에 대응해 5G SA, AI-RAN, 6G 등 네트워크 투자를 국가 AI 인프라 차원에서 지원해야 한다는 주장이 제기됐다. 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토하기로 했다. 민간 투자를 유도하기 위한 인프라 지원책이 구체화되고 있다. 향후 정책적 실현 가능성이 주목된다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 ai 인프라"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "통신 3사가 망 투자는 늘고 수익은 정체되는 상황에서 AI 시대에 맞는 정책 재설계를 촉구했다. 3G 레거시 망 유지와 5G SA·6G 투자의 이중고를 해소하기 위해 제도적 보완이 필요하다는 지적이다. 정부도 새로운 네트워크 투자 유인책 마련을 고심하고 있다. 향후 통신 규제 패러다임의 변화가 예상된다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 네트워크 정책"}, {"title": "BTC to launch commercial 5G services in Gabarone in October - Telecompaper", "summary": "보츠와나텔레콤(BTC)이 오는 10월 가바보네 지역에서 상용 5G 서비스를 공식 출시할 예정이다. 아프리카 지역 통신사의 차세대 망 도입 확대 사례다.", "source": "Telecompaper", "date": "2026-09-02 17:34", "url": "https://www.telecompaper.com/news/btc-to-launch-commercial-5g-services-in-gabarone-in-october--1581407", "category": "contract", "importance": 3, "wl": false, "topic": "보츠와나텔레콤 5g"}, {"title": "\"AI 시대, 트래픽 5배 증가…네트워크 지원 필요\"", "summary": "AI 시대 트래픽 5배 폭증에 대응하기 위해 초고속·초저지연 네트워크 투자와 해저케이블, 6G 지상망, 저궤도 위성망을 연계한 인프라 확충이 시급하다는 제언이 나왔다. 국가 간 데이터 전송의 핵심인 통신망의 고도화가 국가 경쟁력을 좌우한다. 민관 합동의 투자 지원책 마련이 요구된다. 향후 차세대 통신망 구축의 밑그림이 될 전망이다.", "source": "news.bizwatch.co.kr", "date": "2026-09-02 17:28", "url": "https://news.bizwatch.co.kr/article/mobile/2026/09/02/0038", "category": "tech", "importance": 3, "wl": false, "topic": "통신망 ai 인프라"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계 전문가들이 통신사의 AI 네트워크 투자를 촉진하기 위해 망 중립성 가이드라인 정비와 주파수 할당 대가 및 전파사용료 인하가 필수적이라고 제언했다. 통신비용 부담을 완화해 투자 여력을 확보해 주어야 한다는 취지다. 향후 정책 당국의 수용 여부가 관건이다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 ai nw 투자"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "통신사들이 매년 막대한 주파수 할당 대가와 전파사용료를 부담하고 있는 가운데, 이를 설비투자 및 AI 인프라 투자와 연계해 경감해 줄 필요성이 제기됐다. 국회 토론회를 통해 통신 규제 비용 완화 목소리가 커지고 있다. 향후 주파수 재할당 제도 개편에 영향을 미칠 것으로 보인다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 주파수 할당"}, {"title": "드론부터 딥보이스까지…KT, ‘AI 안전망’ 띄운다 - 데일리안", "summary": "KT가 드론과 딥보이스 탐지 기술 등을 결합한 인공지능 기반의 종합 'AI 안전망' 구축에 나선다. 통신사의 공공 안전 서비스 진출 사례다.", "source": "데일리안", "date": "2026-09-02 15:09", "url": "https://www.dailian.co.kr/news/view/1685574/%EB%93%9C%EB%A1%A0-%EB%94%A5%EB%B3%B4%EC%9D%B4%EC%8A%A4%EA%B9%8C%EC%A7%80KT-%E2%80%98AI-%EC%95%88%EC%A0%84%EB%A7%9D%E2%80%99-2026", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai 안전망"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신 3사가 주파수 할당 대가와 전파사용료 등으로 연간 약 1조원에 달하는 규제 비용을 부담하고 있어 6G 및 AI 네트워크 투자에 걸림돌이 되고 있다는 지적이다. 투자 여력 확충을 위한 비용 절감 방안 마련이 시급하다는 목소리가 거세다. 향후 정부의 규제 완화 기조 변화가 주목된다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 규제 비용"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "AI 3대 강국 도약을 위해 망과 AIDC 부문에서 민간 투자를 이끌어내야 하며 주파수 할당 대가 등 정책성 비용의 실효성을 재검토해야 한다는 의견이 제시됐다. 정부도 제도적 인프라 확충 방안을 검토 중이다. 향후 실질적인 투자 인센티브 제도가 구체화될 전망이다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 3, "wl": false, "topic": "ai 인프라 민간투자"}, {"title": "[현장] \"컴퓨팅 자원만으론 AI 3강 못 간다\"…AI 네트워크 투자 물꼬 트려면 - 데일리안", "summary": "컴퓨팅 자원만으로는 AI 경쟁력 확보에 한계가 있으며, 통신망 고도화를 위한 AI 네트워크 투자 물꼬를 터야 한다는 현장 목소리가 제기됐다. 통신 인프라 투자 필요성을 다룬다.", "source": "데일리안", "date": "2026-09-02 13:58", "url": "https://www.dailian.co.kr/news/view/1685489/%ED%98%84%EC%9E%A5-%EC%BB%B4%ED%93%A8%ED%8C%85-%EC%9E%90%EC%9B%90%EB%A7%8C%EC%9C%BC%EB%A1%A0-AI-3%EA%B0%95-%EB%AA%BB-2026", "category": "tech", "importance": 3, "wl": false, "topic": "ai 네트워크 투자 토론"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤이 통신 본업 회복과 함께 AI 가치 부각을 이루는 가운데, 신규 주파수 할당 및 5G SA 상용화와 함께 AI 기지국 보급 확대 정책이 논의될 것으로 전망됐다. 데이터센터와 기지국이 AI 성장의 양대 축으로 꼽힌다. 향후 통신 인프라 고도화 수혜가 기대된다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "contract", "importance": 3, "wl": false, "topic": "sk텔레콤 ai 기지국"}, {"title": "여의도 뒤덮을 100만 인파...LG유플러스, 이동기지국·AI로 통신 장애 막는다 - 소비자경제", "summary": "LG유플러스가 여의도 대규모 인파 밀집 행사 에 대비해 이동기지국과 AI 기술을 동원하여 통신 장애 방지에 총력을 기울인다. 트래픽 폭주로 인한 통신 품질 저하를 막기 위한 사전 예방 조치다. 네트워크 부하 분산을 통해 안정적인 서비스를 제공할 계획이다. 향후 대형 행사의 통신 품질 관리 모범 사례가 될 것으로 보인다.", "source": "소비자경제", "date": "2026-09-02 12:52", "url": "http://www.dailycnc.com/news/articleView.html?idxno=244607", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 통신장애"}, {"title": "[4th-AI] \"AI 3대 강국 가려면 통신망 규제 풀고 AIDC 지원 체계 손봐야\"", "summary": "국내 전문가들이 AI 3대 강국 도약을 위해 통신망 규제를 완화하고 AIDC 지원 체계를 개편해야 한다고 강조했다. 연간 수천억 원에 달하는 전파사용료와 주파수 할당 대가의 적정성 재검토가 필요하다는 지적이다. 향후 통신 정책의 대수술이 이루어질지 관심이 집중된다.", "source": "4th.kr", "date": "2026-09-02 12:24", "url": "http://www.4th.kr/news/articleView.html?idxno=2117312", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 통신망 규제"}, {"title": "AI가 네트워크를 바꾼다…\"통신망 투자 수익성 확보해야\"", "summary": "AI 시대에 발맞추어 통신사가 유무선 네트워크에 선제 투자할 수 있도록 투자세액공제 확대 및 주파수 할당 대가·전파사용료 부담 완화 등의 인센티브가 필요하다는 제언이 나왔다. 수익성 확보가 어려운 통신사들의 투자 유인을 자극하기 위한 조치다. 향후 정책 반영 여부가 주목된다.", "source": "koit.co.kr", "date": "2026-09-02 11:18", "url": "https://www.koit.co.kr/news/articleView.html?idxno=208798", "category": "policy", "importance": 3, "wl": false, "topic": "ai 네트워크 투자"}, {"title": "스테이지파이브, 로플랫 인수…제4이통 대신 ‘AI 통신’으로 승부", "summary": "제4이통사 무산 이후 스테이지파이브가 로플랫을 인수하며 알뜰폰 기반의 'AI 통신' 사업으로 선회해 활로를 모색하고 있다. 주파수 할당 취소의 아픔을 딛고 독자적인 사업 모델 구축에 나섰다. 향후 통신 시장에서 새로운 경쟁 구도를 형성할지 주목된다.", "source": "edaily.co.kr", "date": "2026-09-02 08:48", "url": "https://www.edaily.co.kr/News/Read?newsId=02794566645576184&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "contract", "importance": 3, "wl": false, "topic": "스테이지파이브 로플랫"}, {"title": "[르포] “유선망 위험 요소 직접 포착”…도로 위 AI 감시자, SKT ‘톺다’ 차량 타보니 - 헤럴드경제", "summary": "SK텔레콤이 도로 위에서 유선망의 위험 요소를 직접 포착하는 AI 감시 장비 '톺다' 차량을 공개했다. 맨홀이나 케이블 등 인프라의 이상 징후를 실시간으로 감지하여 장애를 예방한다. 통신망 유지보수의 효율성을 극대화하는 혁신 기술로 평가된다. 향후 현장 현업 적용을 통해 네트워크 신뢰성이 대폭 향상될 전망이다.", "source": "헤럴드경제", "date": "2026-09-02 08:31", "url": "https://mbiz.heraldcorp.com/article/10859567", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 통신망"}, {"title": "Bharti Airtel Deploys 2,750+ New 5G Sites Across Gujarat in 12 Months - scanx.trade", "summary": "바르티 에어텔이 인도 구자라트 지역에 12개월간 2,750개 이상의 신규 5G 사이트를 구축했다. 지속적인 무선 네트워크 인프라 확장과 투자 행보를 보여준다.", "source": "scanx.trade", "date": "2026-09-02 07:54", "url": "https://scanx.trade/stock-market-news function prodKey(a){

    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
