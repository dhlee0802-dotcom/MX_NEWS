": "contract", "importance": 3, "wl": false, "topic": "라쿠텐심포니 타왈 클라우드ran"}, {"title": "[이 시각 세계] 캐나다, 관세 갈등 속 중국과 8년 만에 국방대화", "summary": "캐나다가 관세 갈등 속에서 중국과 8년 만에 국방대화를 재개했다. 과거 캐나다가 미국의 요청으로 화웨이 부회장을 체포하며 양국 관계가 얼어붙었던 적이 있다. 화웨이 관련 외교적 갈등의 해빙 국면을 다룬다.", "source": "imnews.imbc.com", "date": "2026-09-07 07:21", "url": "https://imnews.imbc.com/replay/2026/nwtoday/article/6850008_37012.html", "category": "policy", "importance": 3, "wl": false, "topic": "캐나다 화웨이 국방대화"}, {"title": "Huawei Trial Draws Investor Attention To Key Telecom Network Suppliers - londoninsider.co.", "summary": "화웨이 사태와 관련한 재판 진행이 글로벌 주요 통신장비 공급사들의 시장 점유율과 경쟁 구도에 미치는 영향 분석을 다룬 투자자 대상 리포트다.", "source": "londoninsider.co.uk", "date": "2026-09-07 06:26", "url": "https://londoninsider.co.uk/huawei-trial-draws-investor-attention-to-key-telecom-network-suppliers/", "category": "policy", "importance": 3, "wl": false, "topic": "화웨이 재판 통신장비사"}, {"title": "3 Telecom Stocks Investors May Watch As Huawei Trial Puts Network Suppliers In Focus - sim", "summary": "화웨이에 대한 미국 법원의 형사 재판이 본격화되면서 에릭슨, 노키아 등 글로벌 네트워크 장비 공급사들에 대한 시장의 관심이 집중되고 있다. 지정학적 리스크에 따른 반사이익 가능성이 제기된다.", "source": "simplywall.st", "date": "2026-09-07 05:30", "url": "https://simplywall.st/stocks/us/tech/nyse-bdc/belden/news/3-telecom-stocks-investors-may-watch-as-huawei-trial-puts-ne/amp", "category": "policy", "importance": 3, "wl": false, "topic": "화웨이 재판 장비사"}, {"title": "Is Nokia Oyj (HLSE:NOKIA) A Bargain Following Its AI And Broadband Expansion? - simplywall", "summary": "노키아가 AI 및 광대역 네트워크 확장 전략을 추진하고 있는 가운데 시장에서 매력적인 투자처로 평가받고 있는지 분석하는 기업 가치 평가 기사다. 노키아의 신사업 추진 상황을 보여준다.", "source": "simplywall.st", "date": "2026-09-07 03:38", "url": "https://simplywall.st/stocks/fi/tech/hel-nokia/nokia-oyj-shares/news/is-nokia-oyj-hlsenokia-a-bargain-following-its-ai-and-broadb", "category": "earnings", "importance": 3, "wl": false, "topic": "노키아 ai 광대역확장"}, {"title": "‘관세 폭탄’ 美에 등 돌린 加, 中과 8년 만에 군사 교류", "summary": "캐나다가 미국과의 갈등 속에서 중국과의 군사 교류를 재개했다. 과거 00", "url": "https://news.yahoo.co.jp/articles/ed36a6b892765b8e2c662593225d9d2a0cc65965", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐모바일 kddi 로밍 연장"}, {"title": "LG유플러스, PMDC 얼라이언스 출범…AI 데이터센터 구축기간 단축 - NSP통신", "summary": "LG유플러스가 AI 데이터센터 구축 기간을 단축하기 위해 'PMDC 얼라이언스'를 공식 출범시켰다. 데이터센터 인프라 분야의 파트너들과 협력하여 표준모델을 확산하고 시공 효율을 극대화한다는 전략이다. AI 인프라 시장에서 주도권을 잡기 위한 행보다.", "source": "NSP통신", "date": "2026-09-07 08:25", "url": "https://www.nspna.com/news/?mode=view&newsid=827137", "category": "contract", "importance": 4, "wl": false, "topic": "lg유플러스 pmdc 얼라이언스 출범"}, {"title": "[심층진단]② LG유플러스, 핵심은 ‘건물을 빨리 짓는 것’보다 전력망·냉각·고밀도 GPU 환경까지 통합한 운영 표준 확보 -2부 - newsvalue.kr", "summary": "LG유플러스가 AI 데이터센터 사업에서 단순한 건물 건설 속도보다 전력망, 냉각, 고밀도 GPU 환경까지 통합한 운영 표준을 선점하는 것이 핵심이라고 강조했다. 고성능 AI 인프라 시장에서 차별화된 경쟁력을 갖추기 위한 전략적 진단이다. 데이터센터 구축 역량 고도화를 추진하고 있다.", "source": "newsvalue.kr", "date": "2026-09-07 07:30", "url": "https://www.newsvalue.kr/news/articleView.html?idxno=24566", "category": "contract", "importance": 4, "wl": false, "topic": "lg유플러스 ai 데이터센터 운영 표준 확보"}, {"title": "LG유플러스, AI 데이터센터 표준모델 개발... \"공사 기간 단축 효과\" - 조선일보", "summary": "LG유플러스가 공사 기간을 단축할 수 있는 AI 데이터센터 표준모델 개발에 나섰다. 급증하는 인공지능 인프라 수요에 신속하게 대응하기 위한 건설 및 운영 효율화 전략이다. 데이터센터 사업 경쟁력 강화를 위한 핵심 인프라 혁신이다.", "source": "조선일보", "date": "2026-09-06 14:07", "url": "https://www.chosun.com/economy/tech_it/2026/09/06/AQWMUZF7XREDXFY3BGTO5YO6KY/", "category": "contract", "importance": 4, "wl": false, "topic": "조선일보 lg유플러스 ai 데이터센터 표준모델 개발"}, {"title": "Charter Stock Outlook: Can the $34.5B Cox Merger Help CHTR Recover Before Earnings? - trad", "summary": "차터 커뮤니케이션즈의 345억 달러 규모 콕스 인수합병이 실적 발표 전 회사의 반등을 이끌어낼 수 있을지 주목된다. 대형 케이블 및 통신 사업자 간의 거대 딜로서 시장 재편의 가능성을 품고 있다. 통신·미디어 업계의 대형 M&A 추진 상황을 보여준다. 향후 시장 구도에 미칠 파급력이 크다.", "source": "tradingkey.com", "date": "2026-09-06 07:20", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/261998863-charter-stock-outlook-cox-merger-chtr-before-earnings-tradingkey", "category": "contract", "importance": 4, "wl": false, "topic": "차터커뮤니케이션즈 콕스 인수"}, {"title": "Deutsche Telekom Peoplewatch: change-at-the-top in finance, infra, and tech - telcotitans.", "summary": "도이치텔레콤이 재무, 인프라, 기술 부문의 최고위급 리더십을 대거 교체하는 인사이단을 단행했다. 대형 통신사의 조직 개편을 통해 미래 네트워크 전략과 경영 효율성을 강화하려는 조치다. 주요 임원 교체는 향후 투자 방향에 직접적인 영향을 미친다. 그룹 전반의 전략적 변곡점이 될 수 있다.", "source": "telcotitans.com", "date": "2026-09-05 14:04", "url": "https://www.telcotitans.com/deutsche-telekomwatch/deutsche-telekom-peoplewatch-change-at-the-top-in-finance-infra-and-tech/10839.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 경영진 교체"}, {"title": "추석 귀성길 정체 AI가 족집게 예측하고 드론 뜬다", "summary": "추석 연휴 귀성길 교통 관제를 위해 순찰 드론과 지상 관제 센터의 AI 분석망이 연동된다. 초고화질 영상 전송을 위해 5G 이동통신 기반 무선 네트워크가 활용된다. 공공 인프라의 통신 기술 활용 사례다.", "source": "gokorea.kr", "date": "2026-09-07 09:18", "url": "https://www.gokorea.kr/news/articleView.html?idxno=877330", "category": "tech", "importance": 3, "wl": false, "topic": "추석 관제 ai드론"}, {"title": "해수부 \"통합 인프라로 무중단 서비스·업무 효율 동시에 잡았다\"", "summary": "해양수산부가 통합 인프라를 구축해 통신 장애 가능성을 최소화하고 업무 효율을 높였다. 부산 이전 프로젝트를 위해 알카텔-루슨트의 솔루션을 도입했다. 공공기관의 네트워크 장비 조달 및 인프라 구축 사례다.", "source": "datanet.co.kr", "date": "2026-09-07 09:00", "url": "https://www.datanet.co.kr/news/articleView.html?idxno=214277", "category": "contract", "importance": 3, "wl": false, "topic": "해양수산부 통신인프라"}, {"title": "楽天モバイル、KDDIのローミングは「10月以降も継続」と改めて告知 現在は「詰めの協議中」", "summary": "라쿠텐모바일이 10월 이후의 KDDI 로밍 서비스 지속 여부에 대해 현재 10월 이후에도 망 커버리지가 부족한 지역을 중심으로 협의를 진행 중이라고 공지했다. 자체 망 확충 속도에 맞춰 타사 네트워크 인프라 활용 방안을 조율하는 과정이다. 통신사의 네트워크 운영 전략과 망 임차 계약 현황을 보여준다.", "source": "ITmedia Mobile", "date": "2026-09-07 08:56", "url": "https://www.itmedia.co.jp/mobile/articles/2609/07/news047.html", "category": "contract", "importance": 3, "wl": true, "topic": "라쿠텐모바일 로밍"}, {"title": "[K-기업, 가치를 잇다] SKT, 기술 기반 ESG 경영 강화···AI부터 에너지 효율화까지 - 투데이코리아", "summary": "SK텔레콤이 기술 기반의 ESG 경영을 강화하며 AI부터 에너지 효율화까지 다양한 노력을 기울이고 있다. 통신 서비스 운영 과정에서의 친환경 기술 도입과 사 0", "category": "other", "importance": 3, "wl": false, "topic": "주간 통신 동향 정리"}, {"title": "GS건설, AI 데이터센터 겨냥 PMDC 표준모델 개발 착수 - 전기신문", "summary": "GS건설이 AI 데이터센터를 겨냥한 PMDC 표준모델 개발에 착수한다. LG유플러스 등과의 협력을 통해 데이터센터 구축 기간을 단축하고 효율성을 높인다는 목표다. 통신 및 건설 업계의 AI 인프라 확장 동향이다.", "source": "전기신문", "date": "2026-09-07 00:33", "url": "https://www.electimes.com/news/articleViewAmp.html?idxno=372095", "category": "contract", "importance": 3, "wl": false, "topic": "gs건설 데이터센터"}, {"title": "LG유플러스, GS건설 등과 모듈러 데이터센터 공동개발 - 동아일보", "summary": "LG유플러스가 GS건설 등과 협력하여 모듈러 데이터센터 공동개발에 나선다. AI 데이터센터 수요 증가에 대응하기 위한 인프라 구축 협력의 일환이다. 통신사의 AI 인프라 확장 전략을 보여주는 사례다.", "source": "동아일보", "date": "2026-09-07 00:30", "url": "https://www.donga.com/news/amp/all/20260906/134614978/2", "category": "contract", "importance": 3, "wl": false, "topic": "lg유플러스 데이터센터"}, {"title": "낡은 건물도 스마트빌딩으로…이엠시티 ‘비디앱’, 베트남 안전시장 노...", "summary": "이엠시티의 비디앱이 베트남 안전시장을 겨냥한다. 화재 등 긴급상황에서 서버나 통신망 장애가 발생하더라도 현장 경보설비가 독립적으로 작동해야 한다. 스마트빌딩 시설관리 시스템의 통신 안정성 확보를 다룬다.", "source": "livesnews.com", "date": "2026-09-06 21:44", "url": "https://www.livesnews.com/news/article.html?no=63907", "category": "outage", "importance": 3, "wl": false, "topic": "이엠시티 비디앱 스마트빌딩"}, {"title": "How SpaceX Spending Spree Could Threaten AT&T, Verizon, T-Mobile - Investor's Business Dai", "summary": "스페이스엑스의 공격적인 투자가 AT&T, 버라이즌, T모바일 등 미국 대형 이동통신사들에게 위협이 될 수 있다는 분석이다. 위성통신과 지상파 이동통신 간의 경쟁 구도 변화 가능성을 시사한다. 기존 통신사들의 시장 지위에 영향을 미칠 수 있는 요인으로 주목받고 있다. 통신 시장의 장기적 전략 변화를 전망하게 한다.", "source": "Investor's Business Daily", "date": "2026-09-06 21:29", "url": "https://www.investors.com/news/technology/spacex-stock-telecom-starlink-wireless-broadband-att-verizon-tmobile/", "category": "other", "importance": 3, "wl": false, "topic": "스페이스엑스 at&t 버라이즌 티모바일 위협"}, {"title": "1&1 stock holds steady as investors eye latest network expansion - AD HOC NEWS", "summary": "1&1의 최신 네트워크 확장 추세에 투자자들이 주목하면서 주가가 안정적인 흐름을 보이고 있다. 독자적인 이동통신망 구축 과정에서의 진척 상황이 시장의 평가를 지지하고 있다. 신생 통신사의 인프라 투 cks-are-sliding-today-is-there-a-spacex-connection/cZNTEzYRJTn", "category": "earnings", "importance": 3, "wl": false, "topic": "미국 통신사 주가"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "통신사 임원진들이 참여한 컨퍼런스에서 5G의 더 큰 사업적 기회는 소비자용 시장이 아니라 산업 자동화와 기업용 프라이빗 네트워크에 있다는 점을 강조했다. 5G 후속 투자 방향을 제시하는 통신사 전략 보도다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 5g 산업용자동화"}, {"title": "楽天モバイル、10月以降のローミングエリアについてユーザーに告知 「時間を要するエリアは、10月以降も継続」 - ASCII.jp", "summary": "라쿠텐모바일이 충분한 커버리지 확보에 시간이 걸리는 일부 지역에 대해 10월 이후에도 KDDI 로밍 서비스를 계속 제공한다고 이용자들에게 공지했다. 망 구축 스케줄에 따른 불가피한 조치다. 가입자 이탈을 방지하고 서비스 품질을 유지하기 위한 현실적 대응이다.", "source": "ASCII.jp", "date": "2026-09-05 21:25", "url": "https://ascii.jp/elem/000/004/432/4432587/", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐모바일 로밍 지역 연장 공지"}, {"title": "楽天モバイル、10月以降のローミングエリアについてユーザーに告知 「時間を要するエリアは、10月以降も継続」 (アスキー) - Yahoo!ニュース", "summary": "라쿠텐모바일이 커버리지 구축에 시간이 걸리는 지역을 중심으로 10월 이후에도 로밍을 지속한다고 이용자들에게 안내했다. 안정적인 서비스 제공을 위한 타사 인프라 활용 연장이다. 가입자 이탈 방어 목적을 띤다.", "source": "Yahoo!ニュース", "date": "2026-09-05 21:25", "url": "https://news.yahoo.co.jp/articles/3558537333ebadb393f93f5d6f74687c1698dca0/images/000", "category": "contract", "importance": 3, "wl": false, "topic": "아스키 라쿠텐모바일 로밍 공지"}, {"title": "楽天モバイルが再びau回線のローミングを10月以降も継続することを案内！KDDIと現在も詰めの協議を実施中。十分なカバーエリアは縮小へ - s-max.jp", "summary": "라쿠텐모바일이 KDDI와 협의를 지속하며 10월 이후에도 일부 au 회선 로밍을 유지하기로 했다. 충분한 커버리지 확보를 위한 과도기적 조치다. 가입자 품질 불만을 완화하기 위한 전략이다.", "source": "s-max.jp", "date": "2026-09-05 21:21", "url": "https://s-max.jp/archives/1810148.html", "category": "contract", "importance": 3, "wl": false, "topic": "s맥스 라쿠텐모바일 au 회선 로밍 유지"}, {"title": "改めて。楽天モバイル「KDDI ローミング契約」2026年10月以降も継続 - jetstream.blog const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
