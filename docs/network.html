G 청사진 제시", "summary": "에릭슨 코리아가 AI 랜, ISAC, 6G로 이어지는 기술 리더십과 청사진을 제시했다. AI 시대의 경쟁력은 네트워크에서 시작된다고 강조하며 국내 파트너들과의 협력을 다졌다. 차세대 통신 표준 선점을 위한 기술 로드맵을 공유했다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 ai-ran isac 6g 청사진"}, {"title": "에릭슨코리아, AI 기반 통신망· 6G 기술 로드맵 공개", "summary": "에릭슨코리아가 'Ericsson Innovation Day 2026 Korea'를 개최하고 AI 활용 통신망 발전 전략과 6G 기술 로드맵을 공개했다. 국내 통신사와 산업계 관계자들이 참석한 가운데 최신 통신 진화 방향을 공유했다.", "source": "biz.heraldcorp.com", "date": "2026-09-02 16:10", "url": "https://biz.heraldcorp.com/article/10860523?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨코리아 ai 통신망 6g 로드맵"}, {"title": "에릭슨 코리아, ‘Ericsson Innovation Day 2026 Korea’ 개최…AI 시대 네...", "summary": "에릭슨이 국내 통신사업자와 파트너들을 대상으로 MWC 2026 주요 기술과 5G SA, 5G Advanced, AI 및 6G 기술 진화 방향을 소개했다. 국내 생태계와의 협력 강화와 기술 리더십 전파에 주력하고 있다.", "source": "segye.com", "date": "2026-09-02 16:09", "url": "https://www.segye.com/newsView/20260902515277?OutUrl=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨코리아 이노베이션데이 2026 개최"}, {"title": "에릭슨 코리아, ‘이노베이션 데이 2026 코리아’ 개최", "summary": "에릭슨 코리아가 이노베이션 데이를 열고 AI를 통한 네트워크 진화 전략을 발표했다. AI-RAN, ISAC, 6G 기술을 바탕으로 국내 고객과 파트너를 지원하겠다는 의지를 밝혔다. 안정적인 연결성과 성능 제공을 위한 비전을 공유했다.", "source": "fnnews.com", "date": "2026-09-02 16:03", "url": "https://www.fnnews.com/news/202609021538039947", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨코리아 이노베이션데이 기술 발표"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디아라비아 통신사 stc와 다년 계약을 체결하고 5G 네트워크 확장 사업을 수주했다. 중동 지역에서 에릭슨의 통신 장비 공급 입지가 한층 강화될 전망이다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract ng-costs-squeeze-margins/", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 실적 이익 급감"}, {"title": "전북대 노예훈 박사과정생 학문후속세대 지원사업 선정.. ' 6G 전이중통신...", "summary": "전북대 연구팀이 6G 전이중 무선통신 시스템을 위한 핵심 수신기 회로 구조와 신호 제거 기술을 연구했다. 광대역 자기간섭 신호를 억제하고 수신기 성능 저하를 최소화하는 기술을 확보했다. 차세대 6G 통신 상용화를 위한 원천 기술 경쟁력 강화에 기여한다.", "source": "veritas-a.com", "date": "2026-09-03 14:50", "url": "https://www.veritas-a.com/news/articleView.html?idxno=626092", "category": "tech", "importance": 3, "wl": false, "topic": "전북대 6g 전이중통신 수신기 기술"}, {"title": "알에프텍, RF 전문 자회사 ‘RFTC’ 출범… 5G ·방산 사업 확대", "summary": "알에프텍이 5G 통신 장비와 방산 분야 무선주파수 기술을 담당하는 자회사 'RFTC'를 출범했다. 기존 5G 및 방산 R&D 조직을 분리하여 전문성을 강화하고 사업 확대를 추진한다. 통신 장비 부문의 경쟁력을 높이기 위한 조직 개편이다.", "source": "edaily.co.kr", "date": "2026-09-03 14:44", "url": "https://www.edaily.co.kr/News/Read?newsId=04142646645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 rf 자회사 rftc 출범"}, {"title": "\"전문 혈압계 수준\"…화웨이, 혈압 측정 스마트워치 ‘워치 D3’ 공개", "summary": "화웨이가 전통적인 에어백 방식을 적용하여 전문 혈압계 수준의 정확도를 갖춘 혈압 측정 스마트워치 '화웨이 워치 D3'를 공개했다. 중국 장비·단말 제조사의 헬스케어 기술 경쟁력을 보여준다.", "source": "ZDNet Korea", "date": "2026-09-03 13:57", "url": "https://zdnet.co.kr/view/?no=20260903084818", "category": "tech", "importance": 3, "wl": true, "topic": "화웨이 워치 d3 공개"}, {"title": "[AI 고속도로] HPE, AI 서버·네트워킹 수요에 분기 최대 매출…공급 부족은 과제", "summary": "HPE가 AI 서버와 데이터센터 네트워킹 수요 확대로 사상 최대 분기 매출인 122억 달러를 기록했다. 다만 부품 공급 부족이 과제로 지목되었다.", "source": "ZDNet Korea", "date": "2026-09-03 13:30", "url": "https://zdnet.co.kr/view/?no=20260903132838", "category": "earnings", "importance": 3, "wl": true, "topic": "hpe 분기 최대 매출"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 6G 기지국을 활용하여 드론을 감지할 수 있는 기술 시연을 선보였다. 차세대 이동통신 인프라의 활용 범위를 넓히는 기술로 주목받고 있다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://w pens Saudi Arabia R&D centre - Mobile World Live", "summary": "노키아가 사우디아라비아에 AI 기반 네트워크 자동화 연구소를 설립하며 중동 시장에서의 기술 연구 개발 거점을 확충했다.", "source": "Mobile World Live", "date": "2026-09-02 21:07", "url": "https://www.mobileworldlive.com/nokia/nokia-opens-saudi-arabia-rd-centre/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 r&d 센터 개소"}, {"title": "Saudi’s ACES announces 5G and 6G partnership with Movandi - Developing Telecoms", "summary": "사우디 아세스(ACES)가 모반디와 손잡고 5G 및 6G 차세대 통신 인프라 협력을 위한 파트너십을 체결했다.", "source": "Developing Telecoms", "date": "2026-09-02 20:57", "url": "https://developingtelecoms.com/regions/middle-east-north-africa-telecommunications/20770-saudis-aces-announces-5g-and-6g-partnership-with-movandi.html", "category": "contract", "importance": 3, "wl": false, "topic": "aces 모반디 5g 6g 파트너십"}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "유럽 통신 시장 동향 리포트에 따르면 노키아가 사우디아라비아에서 네트워크 자동화 기술을 개발하고 있다. 에릭슨은 FIS와의 협력을 통해 핀테크 제안을 강화하고 있다. 글로벌 통신장비 업체의 기술 개발 및 전략적 제휴 행보를 보여준다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "https://www.lightreading.com/smartphones-devices/eurobites-fairphone-opens-series-c-funding-round-after-happy-h1", "category": "tech", "importance": 3, "wl": true, "topic": "노키아 네트워크 자동화"}, {"title": "[ 6G 격전] ③보안에 사활...양자내성암호로 '리셋'", "summary": "6G 통신 표준화 과정에서 보안의 중요성이 커지며 양자내성암호(PQC) 도입이 추진되고 있다. LG전자 등과의 협력을 비롯해 글로벌 표준화 단체 활동이 활발하다. 차세대 통신망의 안전성 확보를 위한 핵심 기술로 꼽힌다.", "source": "hansbiz.co.kr", "date": "2026-09-02 16:08", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=861636", "category": "tech", "importance": 3, "wl": false, "topic": "6g 격전 양자내성암호 보안"}, {"title": "하나증권, \"RFHIC\" 목표가 15만원 곧 2차 급등할 가능성 높다 평가 - 이머니뉴스", "summary": "하나증권이 RFHIC에 대해 긍정적인 실적 전망을 바탕으로 목표가를 상향 조정했다. 3분기 실적 개선 기대감과 밸류에이션 매력이 부각되고 있다. 통신 장비 부품 공급사로서의 성장성이 재평가받고 있다. 향후 주가 급등 가능성이 높다는 평가다.", "source": "이머니뉴스", "date": "2026-09-02 13:56", "url": "http://www.emoneynews.co.kr/news/articleView.html?idxno=129885", "category": "earnings", "importance": 3, "wl": false, "topic": "하나증권 rfhic 목표가 상향"}, {"title": "화웨이 코리아가 한국 대학생 9명을 선전으로 부른 이유는", "summary": "화웨이 도 얻는 것이 있다. 반도체와 통신 장비 소프트웨어 분야에서 한국 대학이 배출하는 인력의 수준이 높은 만큼 초기 단계부터 접점을 만드는 일은 기업의 기술 협력 기반을 넓히는 선택이 되기 때문이다. AI와 5G...", "source": "econovill.com", "date": "2026-09-02 10:40", "url": "https://www.econovill.com/news/articleView.html?idxno=749636", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "RFHIC, 3Q 실적 더 좋다…밸류에이션 매력적-하나 - 네이트", "summary": "RFHIC의 3분기 실적이 더욱 양호할 것으로 전망되며 밸류에이션 매력이 부각되고 있다. 통신 장비 시장 회복 기대감과 함께 수혜가 예상된다. 하나증권은 동사의 실적 개선세를 높이 평가했다. 관련 부품 수요 증가가 실적을 견인할 전망이다.", "source": "네이트", "date": "2026-09-02 07:50", "url": "https://news.nate.com/view/20260902n04134", "category": "earnings", "importance": 3, "wl": false, "topic": "rfhic 3분기 실적 호조 전망"}], "policy": [{"title": "러트닉 美 상무장관, “미국서 안 만들면 반도체 관세”…표적 관세 언급", "summary": "하워드 러트닉 미국 상무장관이 미국 내에서 생산하지 않는 반도체 및 완제품에 대해 '표적 관세'를 부과하겠다고 공식 언급했다. 글로벌 반도체 공급망과 국내 IT·장비 업계에 중대한 타격을 줄 수 있는 조치다. 미국 시장 진입을 압박하며 자국 내 제조를 유도하려는 강력한 무역 제재 정책으로 평가된다.", "source": "전자신문", "date": "2026-09-03 10:12", "url": "https://www.etnews.com/20260903000086", "category": "policy", "importance": 5, "wl": true, "topic": "미국 상무부 반도체 관세"}, {"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도가 국가 안보 우려를 이유로 기존 중국산 통신 장비에 대한 '립 앤 리플레이스(철거 및 교체)' 정책을 검토하고 있다. 중국산 장비 의존도를 낮추기 위한 주요국 정부 차원의 규제 및 제재 움직임의 연장선이다. 이는 글로벌 통신장비 시장의 경쟁 구도와 화웨이 등 중국 업체의 입지에 큰 타격을 줄 수 있는 사안이다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도 장비 교체 검토"}, {"title": "정부 ‘보안 특화 AI’ 개발 사업자로 네이버 컨소시엄 선정 - 동아일보", "summary": "정부의 보안 특화 AI 개발 사업자로 네이버 컨소시엄이 최종 선정되었습니다. 국가 공공 AI 인프라 사업의 주도권 향방을 보여주는 정책 및 기술 뉴스입니다.", "source": "동아일보", "date": "2026-09-03 09:48", "url": "https://www.donga.com/news/Economy/article/all/20260903/134596717/1", "category": "policy", "importance": 4, "wl": false, "topic": "네이버 컨소시엄 ai 사업 선정"}, {"title": "AT&T ditching phone landlines, members of Congress call on FCC to block - substack.com", "summary": "AT&T가 전통적인 유선 전화 서비스 철수를 추진하는 가운데 미 의회 의원들이 연방통신위원회(FCC에 이를 차단해 줄 것을 촉구하고 나섰다.", "source": "substack.com", "date": "2026-09-02 02:42", "url": "https://substack.com/app-link/post?publication_id=8143692&post_id=212742975&utm_source=post-email-title&utm_campaign=email-post-title&isFreemail=true&r=8eo9l&token=eyJ1c2VyX2lkIjoxNDEyMTU2MSwicG9zdF9pZCI6MjEyNzQyOTc1LCJpYXQiOjE3ODgyODQ1NDUsImV4cCI6MTc5MDg3NjU0NSwiaXNzIjoicHViLTgxNDM2OTIiLCJzdWIiOiJwb3N0LXJlYWN0aW9uIn0.ntnMdYlsDCD3ZGZc0sUQQrV7oCG_e6xiTZA0uoYjuuI", "category": "policy", "importance": 4, "wl": false, "topic": "at&t 유선 전화 철수 논란 규제"}, {"title": "티빙, 2년 전 취약점 알고도 안 고쳤다…3954만개 계정 정보 유출", "summary": "과학기술정보 통신 부( 과기정통부 )는 3일 민관합동조사단의 티빙 침해사고 조사 결과를 발표했다. 조사단은 접속키 관리 부실과 과도한 접근 권한, 이상행위 감시체계 부재가 대규모 정보 유출로 이어졌다고...", "source": "peoplewatch.co.kr", "date": "2026-09-03 14:34", "url": "https://www.peoplewatch.co.kr/article/view/ppw202609030014", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "[ET톡] 6G 1등 국가의 조건", "summary": "세계 최초 상용화보다는 최고 기술을 갖춘 6G 1등 국가가 되어야 한다는 정책적 제언이 제기됐다. 5G 상용화의 교훈을 바탕으로 서비스 시점보다는 기술과 산업적 우위를 선점하겠다는 전략이다. 차세대 이동통신 표준 경쟁에서 주도권을 잡기 위한 방향성을 제시하고 있다.", "source": "etnews.com", "date": "2026-09-03 13:44", "url": "https://www.etnews.com/20260903000237", "category": "tech", "importance": 3, "wl": false, "topic": "6g 1등 국가 조건 최고 기술 확보"}, {"title": "Satcom spectrum fee: DCC may soon decide airwave charges, allocation terms - The Economic ", "summary": "디지털통신위원회(DCC)가 위성통신 주파수 사용료 및 할당 조건에 대한 결정을 곧 내릴 예정입니다. 인도 위성통신 시장의 규제 환경과 직결되는 사안으로, 향후 관련 사업자들의 비용 구조에 영향을 미칠 것입니다.", "source": "The Economic Times", "date": "2026-09-03 04:01", "url": "https://economictimes.indiatimes.com/industry/telecom/satcom-spectrum-fee-dcc-may-soon-decide-airwave-charges-allocation-terms/articleshow/133719014.cms", "category": "policy", "importance": 3, "wl": false, "topic": "위성통신 스펙트럼 수수료"}, {"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "통신 3사가 세제, 주파수, 규제 측면에서 네트워크 및 AI 데이터센터(AIDC) 지원을 늘려달라고 촉구했다. 과기정통부는 투자 환경 개선 패키지를 민관협의체에서 논의하겠다고 화답했다. 3G 종료 등 레거시 망 전환도 5G 및 6G 투자를 위한 과제로 다뤄졌다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 네트워크 aidc 지원 촉구"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에서의 프라이빗 5G 배포를 위한 새로운 계획을 마련했다. 하지만 현장에서는 구체적인 주파수 할당 계획이 보이지 않아 실효성에 대한 의문이 제기되고 있다. 중국의 통신 정책 및 프라이빗 네트워크 활성화 동향으로 파악된다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 5g 규제 완화"}, {"title": "The Kingsbury Commitment Promised Competition. AT&T Got 98% of Long Distance - Broadband B", "summary": "과거 AT&T의 독점 체제를 형성했던 킹스베리 약정이 통신 시장 경쟁에 미친 영향과 역사적 배경을 재조명했다.", "source": "Broadband Breakfast", "date": "2026-09-02 21:30", "url": "https://broadbandbreakfast.com/the-kingsbury-commitment-promised-competition-at-t-got-98-of-long-distance/", "category": "policy", "importance": 3, "wl": false, "topic": "킹스베리 약정 역사적 독점 분석"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "레거시 네트워크 유지와 5G SA 및 6G 투자 병행의 비효율성을 지적하며 네트워크 고도화를 위한 정부 지원 필요성이 제기됐다. 과기정통부는 새로운 서비스 창출을 위한 네트워크 편익 증대 방안을 모색하고 있다. 통신사들의 차세대 인프라 투자 유인을 위한 정책적 논의가 활발하다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 3, "wl": false, "topic": "ai 시대 네트워크 고도화 정부 지원"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "통신사들이 AI-RAN, 6G 등 차세대 네트워크 투자를 확대함에 따라 기존 기지국 중심의 CAPEX 지표를 보완해야 한다는 목소리가 나온다. 국가전략기술 사업화시설 세액공제와 관련하여 개방형 시설의 혜택 적용 기준 개선도 논의되고 있다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 ai-ran 6g capex 지표 보완"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "5년 뒤 AI 트래픽이 최대 5배 폭증할 것에 대비해 네트워크를 국가 AI 인프라로 육성해야 한다는 주장이 제기됐다. 5G SA, AI-RAN, 6G 등에 대한 투자 지원과 함께 서비스 특성에 맞는 품질 제공이 요구된다. 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토 중이다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 3, "wl": false, "topic": "네트워크 국가 ai 인프라 육성"}, {"title": "[헬로스톡] 9/2 주목할 종목 : 삼성전기·RFHIC·롯데렌탈·셀트리온제약", "summary": "미국 어퍼 C밴드 주파수 경매가 2027년 4월로 확정된 가운데 국내에서도 2026년 연말 5G SA 도입이 예정되어 있다. NXP의 통신 사업 부문 철수와 미국의 대중국 장비 및 부품 제재 기조가 맞물려 있다. 통신 장비 시장의 규제 및 주파수 환경 변화가 이어지고 있다.", "source": "hellot.net", "date": "2026-09-02 17:58", "url": "https://www.hellot.net/news/article.html?no=114725", "category": "policy", "importance": 3, "wl": false, "topic": "미국 c밴드 경매 및 국내 5g sa 도입"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "망 투자는 늘어나지만 수익 창출이 어려운 구조 속에서 통신 3사가 AI 시대에 맞는 정책 재정립을 요구했다. 레거시 망 유지와 5G SA·6G 투자의 비효율성을 지적하며 3G 종료 등의 제도 개선을 촉구했다. 정부 역시 새로운 네트워크 투자를 위한 정책적 대안을 검토하고 있다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 ai시대 망투자 정책 재정립"}, {"title": "[현장] 통신업계 \"네트워크도 AI 인프라로 봐야\"…정책 지원 촉구", "summary": "국회 토론회에서 통신업계가 네트워크를 AI 인프라로 간주하고 정책 지원을 촉구했다. 6G 등 차세대 네트워크에 지속적으로 투자해야 하지만 기존 통신 수익만으로는 한계가 있다는 지적이다. 정부와 정치권의 제도적 뒷받침이 요구된다.", "source": "newspost.kr", "date": "2026-09-02 16:42", "url": "https://www.newspost.kr/news/articleView.html?idxno=225400", "category": "policy", "importance": 3, "wl": false, "topic": "국회 통신업계 네트워크 ai 인프라 촉구"}, {"title": "통신3사 \"AI망 지원\" 요구…정부, 세제·규제·AIDC 지원 추진(종합)", "summary": "정부가 5G SA에서 AI-RAN, 6G로 이어지는 네트워크 고도화를 위해 세제, 주파수 지원 방안을 추진한다. 최근 출범한 'AI 시대 통신망 투자 촉진 민관협의체'를 통해 구체적인 실행 방안을 논의할 예정이다.", "source": "news1.kr", "date": "2026-09-02 16:21", "url": "https://www.news1.kr/it-science/cc-newmedia/6277634", "category": "policy", "importance": 3, "wl": false, "topic": "정부 통신사 ai망 6g 지원 민관협의체"}, {"title": "\"GPU만 쌓아선 AI 3강 못 간다…개방형 AIDC·네트워크 지원해야\"", "summary": "학계와 업계가 대기업 AIDC 투자세액공제 확대와 함께 5G·6G 및 데이터센터 연결망도 AI 인프라로 보고 세제 및 투자 지원을 검토해야 한다고 주장했다. 레거시 망 전환 지원 필요성도 함께 제기되었다.", "source": "fnnews.com", "date": "2026-09-02 15:56", "url": "https://www.fnnews.com/news/202609021416214484", "category": "policy", "importance": 3, "wl": false, "topic": "학계 업계 aidc 네트워크 투자비 지원"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "과기정통부 관계자들이 토론회에 참석해 5G, 6G, 데이터센터 연결망 등에 대한 투자를 AI 인프라 투자로 간주하고 세제 및 투자 지원을 확대하는 방안을 논의했다. 민관 협력을 통한 제도 개선이 추진되고 있다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 통신사 ai nw dc 투자 지원"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "통신사가 부담하는 연간 주파수 할당 대가와 전파사용료의 부담을 낮춰 설비투자와 AI 인프라 투자 확대로 연계해야 한다는 제안이 나왔다. 국회 토론회를 통해 통신망 투자 수익성 확보를 위한 제도 개선 목소리가 커지고 있다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 3, "wl": false, "topic": "통신망 주파수 할당대가 부담 완화 제안"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신사들이 주파수 할당 대가와 전파사용료 등으로 연간 약 1조원에 달하는 정책성 비용을 부담하고 있다. 6G 상용화와 AI 네트워크 투자가 본격화되는 시점에서 규제 비용 완화가 시급하다는 지적이 제기됐다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 규제비용 연 1조원 부담 지적"}, function hasWord(t,w){

function regionOf(a){

function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();

    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;

function capPerProduct(list,max){

    const k=prodKey(a); if(!k){out.push(a);continue;}

  }

}

    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
