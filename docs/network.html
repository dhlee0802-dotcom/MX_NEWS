<style>
  :root{

  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}

  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}

  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

, "topic": ""}], "competitor": [{"title": "India mulls removal of legacy Chinese telecoms kit - report - Data Center Dynamics", "summary": "인도 정부가 자국 내 통신망에 남아 있는 구형 중국산 통신 장비를 철거하는 방안을 검토 중인 것으로 보도되었다. 국가 안보 리스크를 차단하고 통신망의 보안성을 높이기 위한 고강도 조치다. 화웨이와 ZTE 등 중국 장비 제조사들의 글로벌 입지가 더욱 위축될 수 있는 사안이다. 주요국 정부 차원의 중국산 장비 퇴출 흐름이 남아시아로 확산되는 양상을 보여준다.", "source": "Data Center Dynamics", "date": "2026-09-04 02:02", "url": "https://www.datacenterdynamics.com/en/news/india-mulls-removal-of-legacy-chinese-telecoms-kit-report/", "category": "policy", "importance": 5, "wl": false, "topic": "인도 구형 중국산 통신장비 철수 검토"}, {"title": "삼성물산, 스웨덴 SMR 사업 전략적 파트너 선정…유럽 교두보 확보", "summary": "삼성물산이 스웨덴 소형모듈원자로(SMR) 신규 원전 사업의 전략적 파트너로 선정되었다. 스웨덴 스톡홀름에서 GE 버노바 등과 함께 공동 EPC(설계·조달·시공) 참여를 확정하며 유럽 시장 진출의 교두보를 확보했다. 이번 사업은 소형모듈원자로 4기를 건설하는 대형 프로젝트로 글로벌 친환경 에너지 시장에서 입지를 다지는 계기가 된다. 향후 유럽 SMR 추가 수주 확대로 이어질 가능성이 높다.", "source": "매일경제 IT", "date": "2026-09-03 16:26", "url": "https://www.mk.co.kr/news/realestate/12143496", "category": "contract", "importance": 5, "wl": true, "topic": "삼성물산 스웨덴 smr 사업"}, {"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도 정부가 국가 안보 우려를 이유로 자국 내에 설치된 구형 중국산 통신 장비를 철거하고 교체하는 방안을 검토 중인 것으로 알려졌다. 화웨이 등 중국산 장비에 대한 의존도를 낮추고 안보 리스크를 차단하려는 조치다. 글로벌 장비 시장에서 화웨이와 ZTE 등의 입지가 더욱 축소되는 계기가 될 것으로 보이며 에릭슨과 노키아 등 경쟁사들의 반사이익이 예상된다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도정부 화웨이 제재"}, {"title": "Ciena sees AI driving multi-year optical infrastructure investment cycle", "summary": "시에나는 인공지능(AI)이 광범위한 대역폭 수요를 촉발하고 장거리 네트워크에서 데이터센터 패브릭에 이르기까지 광섬유 연결의 중요성을 높이면서 네트워크 인프라의 다년간 재건축 주기를 이끌고 있다고 밝혔다. AI 확산에 따른 트래픽 급증이 광전송 장비 및 인프라 투자 확대로 직결되고 있음을 시사한다. 글로벌 네트워크 장비 및 광통신 시장의 핵심 성장 동력으로 작용하고 있다.", "source": "RCR Wireless", "date": "2026-09-04 00:25", "url": "https://rcrwireless.com/20260903/connectivity/ciena-ai-optical", "category": "tech", "importance": 4, "wl": true, "topic": "시에나 광인프라"}, {"title": "The era of AI-native RAN starts now - nokia.com", "summary": "노키아가 인공지능을 기본 탑재한 'AI-native RAN' 시대의 개막을 선언했다. 무선 접속망 설계 단계부터 AI를 내재화하여 네트워크 성능과 에너지 효율을 극대화한다는 전략이다. 차세대 통신 장비 시장에서 소프트웨어 경쟁력을 차별화 요소로 내세우고 있다. 통신사들의 운영 비용 절감과 자율주행 네트워크 구축을 지원할 예정이다.", "source": "nokia.com", "date": "2026-09-03 21:05", "url": "https://www.nokia.com/blog/the-era-of-ai-native-ran-starts-now/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 ai 네이티브 ran 비전"}, {"title": "Nokia opens AI research centre in Riyadh - fibre-systems.com", "summary": "노키아가 사우디아라비아 리야드에 인공지능(AI) 연구개발(R&D) 센터를 신설했다. AI 기반 네트워크 자동화 기술 연구를 중점적으로 수행할 예정이다. 사우디의 국가 차원 디지털 혁신 비전과 발맞추어 중동 지역의 R&D 거점을 확보했다. 현지 파트너들과의 기술 협력을 통해 시장 지배력을 확대할 계획이다.", "source": "fibre-systems.com", "date": "2026-09-03 17:50", "url": "https://www.fibre-systems.com/article/nokia-opens-ai-research-centre-riyadh", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 사우디 ai 연구센터 설립"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - The Fast", "summary": "에릭슨이 사우디아라비아 통신사 모빌리와 협력하여 AI 기반 RAN(무선 접속망)과 자율주행 네트워크 기술을 공동 추진한다. 양사는 사우디 내 모바일 네트워크 성능을 고도화하고 인프라 자동화를 가속화할 예정이다. 중동 지역의 디지털 전환 흐름에 맞춰 첨단 통신 기술 도입을 주도하고 있다. 에릭슨의 글로벌 AI 네트워크 시장 공략이 탄력을 받고 있다.", "source": "The Fast Mode", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 모빌리 사우디 ai ran"}, {"title": "기지국이 드론까지 잡는다…에릭슨, 6G 통신 신기술 공개 - 디잇플러스", "summary": "에릭슨이 기지국 전파를 활용해 드론을 감지하고 탐지할 수 있는 6G 통신 신기술을 전격 공개했다. 경쟁사(Ericsson)의 차세대 통신 기술 및 기지국 부가 기능 상용화 R&D 성과다. 네트워크 장비 시장의 기술 트렌드를 주도하는 발표다.", "source": "디잇플러스", "date": "2026-09-03 10:43", "url": "https://www.theitplus.kr/news/articleView.html?idxno=2171", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g신기술"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 차세대 6G 기지국을 활용해 드론을 감지할 수 있는 혁신적인 네트워크 기술을 시연했다. 통신 기지국의 무선 신호를 활용하여 별도의 레이더 장비 없이도 공중의 드론 위치를 추적하는 방식이다. 통신 인프라의 역할을 확장하여 스마트시티 및 안티드론 보안 영역으로 응용할 수 있음을 보여주었다. 6G 시대 통신 장비의 다목적 활용 가능성을 제시했다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 기지국 드론 탐지 기술"}, {"title": "Orange acquires defence focussed private 5G core tech - Telecoms", "summary": "프랑스 통신사 오렌지(Orange)가 국방 분야에 특화된 프라이빗 5G 코어 기술 기업을 인수했다. 군사 및 안보 통신 시장에서 요구되는 고도의 보안성과 안정성을 갖춘 전용망 기술을 확보하기 위한 조치다. 유럽 내 방산 통신 인프라 시장에서 경쟁력을 한층 높였다. 통신사들의 B2B 특화 시장 공략이 다각화되고 있음을 보여준다.", "source": "Telecoms", "date": "2026-09-02 19:25", "url": "https://www.telecoms.com/operator-ecosystem/orange-acquires-defence-focussed-private-5g-core-tech", "category": "contract", "importance": 4, "wl": false, "topic": "오렌지 국방 프라이빗 5g 인수"}, {"title": "Ericsson to Unveil Drone-Tracking Network Tech in Korea - Seoul Economic Daily", "summary": "에릭슨이 한국 시장에서 6G 기지국 기반의 드론 추적 네트워크 기술을 최초로 공개 시연할 예정이다. 통신망 신호를 이용해 공중의 드론을 정확히 탐지하는 차세대 기술을 국내에 선보인다. 한국의 선진적인 통신 인프라 환경을 활용해 기술력을 입증하려는 전략이다. 향후 안티드론 및 스마트시티 인프라 시장 진출의 교두보가 될 전망이다.", "source": "Seoul Economic Daily", "date": "2026-09-02 17:46", "url": "https://en.sedaily.com/technology/2026/09/02/ericsson-to-unveil-drone-tracking-network-tech-in-korea", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 한국 드론 추적 기술 공개"}, {"title": "Huawei profits fall in H1 on revenues up 10% - Telecompaper", "summary": "화웨이가 상반기 실적을 발표한 가운데 매출은 전년 동기 대비 10% 증가했으나 순이익은 감소한 것으로 나타났다. 매출 성장세에도 불구하고 수익성이 악화된 것은 연구개발 투자 확대와 미 제재에 따른 비용 증가 등이 복합적으로 작용한 결과로 분석된다. 제재 속에서도 외형 성장을 이어가고 있으나 수익성 방어에 과제를 안고 있음을 보여준다. 글로벌 경쟁사의 재무 건전성을 가늠할 수 있는 중요 지표다.", "source": "Telecompaper", "date": "2026-09-02 16:05", "url": "https://www.telecompaper.com/news/huawei-profits-fall-in-h1-on-revenues-up-10--1581432", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 상반기 실적 매출 순이익"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디아라비아 통신사 STC와 다년간의 5G 네트워크 확장 계약을 체결했다. 사우디 전역의 5G 커버리지 확대와 품질 개선을 위한 장비 공급 및 기술 지원이 포함된다. 중동 최대 통신사인 STC와의 파트너십을 공고히 하며 현지 시장 입지를 재확인했다. 지속적인 장비 수주를 통해 실적 성장의 발판을 마련했다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 stc 5g 네트워크 확장 계약"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 대중국 화웨이 제재가 완성품 장비를 넘어 부품 공급망 영역까지 본격적으로 확산되면서 국내 통신장비 및 부품업체들이 반사이익을 얻을 수 있을지 주목하고 있다. 글로벌 장비 시장의 공급망 재편 과정에서 한국 기업들에게 새로운 기회 요인이 될 수 있다는 분석이다. 지정학적 리스크가 국내 통신 부품 산업의 수주 지형에 미치는 파장을 다루고 있다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 제재 부품 확산 국내 영향"}, {"title": "ZTE stock steadies as investors await next earnings signal - AD HOC NEWS", "summary": "ZTE의 주가가 다음 분기 실적 발표를 앞두고 투자자들의 관망세 속에서 안정세를 유지하고 있다. 글로벌 통신 장비 시장의 업황 부진과 실적 개선 신호에 촉각을 곤두세우고 있다. 향후 실적 지표가 주가 방향성을 결정할 주요 변수로 작용할 전망이다. 시장 참가자들의 관심이 실적 발표에 집중되어 있다.", "source": "AD HOC NEWS", "date": "2026-09-04 05:58", "url": "https://www.ad-hoc-news.de/boerse/news/nebenwerte/zte-stock-steadies-as-investors-await-next-earnings-signal/70051866", "category": "other", "importance": 3, "wl": false, "topic": "zte 주가 실적 발표 대기"}, {"title": "Nokia (HLSE:NOKIA) Targets Digital Healthcare With Network As Code - Yahoo Finance", "summary": "노키아가 '네트워크 코드(Network As Code)' 플랫폼을 활용해 디지털 헬스케어 영역으로 사업 범위를 확장하고 있다. 통신망 기능을 API 형태로 개방하여 의료 앱의 보안과 편의성을 높이는 전략이다. 통신 장비 제공을 넘어 소프트웨어 및 API 생태계로 수익 모델을 다각화하려는 시도다. 헬스케어 분야에서의 새로운 B2B 비즈니스 기회를 창출할 것으로 기대된다.", "source": "Yahoo Finance", "date": "2026-09-04 03:16", "url": "https://finance.yahoo.com/technology/ai/articles/nokia-hlse-nokia-targets-digital-181601230.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 디지털 헬스케어 네트워크 api"}, {"title": "VodafoneThree unveils SuperMobile 5G+ national network slice service - BeBeez Internationa", "summary": "보다폰과 삼의 합병 법인인 보다폰트리가 '슈퍼모바일 5G+' 전국망 네트워크 슬라이스 서비스를 공식 공개했다. 5G SA 상용화 경쟁을 보여준다.", "source": "BeBeez International", "date": "2026-09-04 02:09", "url": "https://bebeez.eu/2026/09/03/vodafonethree-unveils-supermobile-5g-national-network-slice-service/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰트리 5g슬라이싱"}, {"title": "Ericsson Japan begins AI network research with Tokyo partners - Telecoms Tech News", "summary": "에릭슨 재팬이 도쿄 지역 파트너들과 손잡고 AI 기반 네트워크 연구에 착수했다. 일본 시장의 특화된 통신 환경에 맞춘 AI 알고리즘을 공동 개발하고 검증할 예정이다. 현지 통신사들과의 협력을 강화하는 포석이다. 글로벌 R&D 네트워크를 활용한 현지화 전략의 일환이다.", "source": "Telecoms Tech News", "date": "2026-09-04 00:16", "url": "https://www.telecomstechnews.com/news/ericsson-japan-begins-ai-network-research-with-tokyo-partners/", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 일본 ai 네트워크 연구"}, {"title": "Vodafone Follows Bharti Airtel: 5G Network Slicing Live with Minimum 15 Mbps Speeds - Tele", "summary": "보다폰이 바르티 에어텔의 뒤를 이어 최저 속도를 보장하는 5G 네트워크 슬라이싱 상용 서비스를 개시했다. 5G 특화 서비스 확산 동향이다.", "source": "TelecomTalk", "date": "2026-09-04 00:05", "url": "https://telecomtalk.info/vodafone-follows-airtel-5g-network-slicing-live/1011530/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰인도 5g슬라이싱"}, {"title": "Nokia and BeeHealthy Bring Network-based Verification to Digital Healthcare - NewswireToda", "summary": "노키아와 비헬시가 네트워크 기반 검증 솔루션을 디지털 헬스케어 플랫폼에 적용하는 파트너십을 체결했다. 보안성과 사용자 접근성을 동시에 강화하는 통신 API 활용 모델이다. 헬스케어 시장에서 통신 기술의 활용 영역을 넓히고 있다. 양사의 협업을 통해 환자 편의성이 대폭 향상될 것으로 기대된다.", "source": "NewswireToday", "date": "2026-09-04 00:01", "url": "https://www.newswiretoday.com/news/186783/Nokia-and-BeeHealthy-Bring-Network-based-Verification-to-Digital-Healthcare/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 비헬시 헬스케어 인증 도입"}, {"title": "Minnesota operator taps MoCA Access tech to connect MDUs", "summary": "미국 미네소타주의 통신사인 스조버그가 인코액스 및 노키아와의 파트너십을 통해 MoCA Access 기술을 활용해 다세대 주택(MDU)에 기가바이트 속도의 초고속 인터넷 서비스를 개통했다. 이번 협력은 주거용 유선 네트워크 인프라 고도화와 장비 공급 측면에서 의미가 있다. 노키아의 유선 접속 장비 경쟁력을 현지 시장에 입증하는 사례다.", "source": "Light Reading", "date": "2026-09-03 23:13", "url": "https://www.lightreading.com/broadband/minnesota-operator-taps-moca-access-tech-to-connect-mdus", "category": "contract", "importance": 3, "wl": true, "topic": "노키아 기술"}, {"title": "Chinese businesses of all stripes are turning to Huawei - The Economist", "summary": "제재 국면 속에서도 중국 내 다양한 업종의 기업들이 화웨이의 제품과 기술을 적극적으로 채택하고 있는 것으로 나타났다. 자국산 대체재를 찾으려는 움직임이 거세지면서 화웨이의 내수 시장 입지가 한층 공고해졌다. 미국의 제재가 오히려 중국 내 독자 생태계 결속을 강화하는 결과로 이어지고 있다. 글로벌 장비 시장에서의 입지와는 별개로 탄탄한 내수 기반을 유지하고 있다.", "source": "The Economist", "date": "2026-09-03 22:08", "url": "https://www.economist.com/business/2026/09/03/chinese-businesses-of-all-stripes-are-turning-to-huawei", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 자국 기업 수요 증가"}, {"title": "Nokia takes aim at healthcare with network deal - Mobile World Live", "summary": "노키아가 기업용 네트워크 솔루션을 바탕으로 헬스케어 시장 진출을 위한 네트워크 계약을 체결했다. 장비 업체의 신시장 개척 사례이다.", "source": "Mobile World Live", "date": "2026-09-03 21:17", "url": "https://www.mobileworldlive.com/industry/nokia-takes-aim-at-healthcare-with-network-deal/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 헬스케어계약"}, {"title": "How Could Nokia (NYSE:NOK) R&D Plans Affect NYSE Composite? - Kalkine Media", "summary": "노키아의 대규모 R&D 투자 계획이 뉴욕증권거래소(NYSE) 종합지수 및 회사 주가에 미칠 영향에 대한 분석이 제기되었다. AI 및 차세대 통신 기술 개발을 위한 지속적인 자금 투입이 장기적인 기업 가치에 긍정적으로 작용할지 관심이 모인다. 글로벌 증시에서의 노키아 주가 흐름에 영향을 미치는 주요 요인이다. 투자자들의 엇갈린 평가가 공존하고 있다.", "source": "Kalkine Media", "date": "2026-09-03 19:53", "url": "https://kalkinemedia.com/us/stocks/penny/how-could-nokia-nysenok-rd-plans-affect-nyse-composite", "category": "other", "importance": 3, "wl": false, "topic": "노키아 r&d 계획 주가 영향"}, {"title": "Nokia deploys Gibabit Connect with InCoax MoCA Access for apartments on Sjoberg's network ", "summary": "노키아가 스외베리의 네트워크 인프라에 InCoax MoCA Access 기술을 결합한 기가비트 커넥트 솔루션을 아파트 단지에 공급했다. 기존 동축케이블 인프라를 활용해 초고속 브로드밴드 서비스를 효율적으로 구축할 수 있도록 지원한다. 주거 밀집 지역의 유선 네트워크 업그레이드 수요를 공략하고 있다. 안정적인 기가비트 인터넷 환경 제공에 기여할 것으로 보인다.", "source": "Telecompaper", "date": "2026-09-03 19:46", "url": "https://www.telecompaper.com/news/nokia-deploys-gibabit-connect-with-incoax-moca-access-for-apartments-on-sjobergs-network-in-minnesota--1581634", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 기가비트 커넥트 솔루션 공급"}, {"title": "Nokia and BeeHealthy target healthcare with network verification - Telecoms", "summary": "노키아와 비헬시가 네트워크 검증 기술을 활용해 디지털 헬스케어 접근성을 단순화하는 파트너십을 체결했다. 환자들이 의료 서비스에 더 빠르고 안전하게 접근할 수 있도록 지원한다. 통신 기술의 이종 산업 융합 전략을 보여주는 대표적 행보다. 향후 다양한 서비스 분야로의 확장이 기대된다.", "source": "Telecoms", "date": "2026-09-03 19:24", "url": "https://www.telecoms.com/network-software/nokia-and-beehealthy-target-healthcare-with-network-verification", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 비헬시 헬스케어 인증 협력"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "통신장비 업체 화웨이 를 비롯해 숏폼·AI 기업 콰이서우, 전자상거래 업체 알리바바, 미국 애플 등이 이 지역에 컴퓨팅 시설 관련 투자를 진행한 바 있습니다. 바이트댄스가 추진하는 데이터센터의 투자 규모가...", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Nokia, BeeHealthy partner to simplify digital healthcare access - Mobile Europe", "summary": "노키아와 비헬시의 파트너십을 통해 디지털 헬스케어 이용 절차가 한층 간소화되었다. 네트워크 기반 검증 시스템을 통해 환자 인증 과정의 마찰을 줄였다. 통신 사업자의 API 생태계 확장을 보여주는 사례다. 헬스 ", "importance": 4, "wl": false, "topic": "도이치텔레콤 엘리엇 자사주 매입"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - barrons.com", "summary": "엘리엇 매니지먼트의 T-모바일 합병 반대 및 지분 매입 보도 직후 도이치텔레콤 주가가 상승세를 보였다.", "source": "barrons.com", "date": "2026-09-04 01:24", "url": "https://www.barrons.com/articles/t-mobile-stock-report-elliott-deutsche-telekom-merger-2880aac4", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 합병이슈"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - press9.kr", "summary": "SK텔레콤과 LG유플러스 등 국내 이동통신사들이 그간 축소해왔던 망 투자를 다시 늘릴지 주목되는 가운데 5G 단독모드(SA) 고도화와 신규 주파수 경매가 핵심 변수로 떠올랐다. 통신사들의 네트워크 투자 기조 변화 여부가 장비 업계의 실적에 직결되는 사안이다. 향후 정부의 주파수 정책 방향과 통신사 투자 계획에 업계의 이목이 쏠리고 있다.", "source": "press9.kr", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "policy", "importance": 4, "wl": false, "topic": "skt lgu+ 5g sa 주파수 경매"}, {"title": "Telstra deploys Ericsson AI scheduler nationwide to boost mobile performance - Telecompape", "summary": "호주 통신사 텔스트라가 전국망에 에릭슨의 AI 스케줄러를 도입하여 모바일 성능을 대폭 끌어올렸다. 실시간 트래픽 분석과 자원 할당을 최적화하여 사용자 체감 속도와 네트워크 효율성을 극대화했다. 통신 서비스 품질 향상을 위한 AI 기술 상용화가 본궤도에 올랐음을 보여준다. 에릭슨과의 긴밀한 협력을 통해 네트워크 고도화를 달성했다.", "source": "Telecompaper", "date": "2026-09-03 14:48", "url": "https://www.telecompaper.com/news/telstra-deploys-ericsson-ai-scheduler-nationwide-to-boost-mobile-performance--1581561", "category": "contract", "importance": 4, "wl": false, "topic": "텔스트라 에릭슨 ai 스케줄러 도입"}, {"title": "Deutsche Telekom Builds New Leadership Team to Drive €30 Billion Fiber, 5G, Cloud and AI S", "summary": "독일 통신사 도이치텔레콤이 300억 유로 규모의 광케이블, 5G, 클라우드, AI 인프라 투자를 진두지휘할 새로운 경영진 팀을 구성했다. 유럽 최대 통신사의 대규모 네트워크 전환 사업을 가속화하기 위한 조직 개편이다. 차세대 통신 인프라 구축 전략을 실행할 리더십 진용을 확정했다. 유럽 통신 시장의 장비 조달 및 투자 방향에 큰 영향을 미칠 전망이다.", "source": "TelecomLead", "date": "2026-09-02 21:16", "url": "https://telecomlead.com/telecom-services/deutsche-telekom-builds-new-leadership-team-to-drive-e30-billion-fiber-5g-cloud-and-ai-strategy-127564", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 신임 리더십 팀"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "일본 통신사 KDDI가 차세대 6G 후보 주파수인 7GHz 대역에서 야외 3.6 Gbps 속도의 세계 최고 수준 무선 전송 테스트에 성공했다. 고대역 주파수 활용을 통해 차세대 이동통신 환경에서의 초고속 데이터 전송 가능성을 입증했다. 6G 상용화 기술 확보를 위한 일본 통신사의 선제적 행보를 보여준다. 향후 글로벌 표준화 및 장비 개발에 중요한 기초 자료가 된다.", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 7ghz 대역 3.6gbps 전송"}, {"title": "구자균號 LS일렉트릭, KT클라우드와 맞손…AI 데이터센터 기반시설 공급 등 - 코리아리포트", "summary": "LS일렉트릭과 KT클라우드가 AI 데이터센터 기반시설 공급 및 모듈형 데이터센터 개발을 위해 손을 잡았다. AI 데이터센터의 전력 인프라 확충과 대형·고전력화 대응을 위한 협력이다. 통신사의 데이터센터 인프라 경쟁력을 높이는 중요한 제휴다. 향후 B2B 클라우드 및 AI 인프라 사업에 영향을 미친다.", "source": "코리아리포트", "date": "2026-09-04 07:10", "url": "https://www.koreareport.co.kr/news/articleView.html?idxno=52614", "category": "contract", "importance": 3, "wl": false, "topic": "kt클라우드 데이터센터"}, {"title": "T-Mobile taps former Shell CFO Jessica Uhl to help steer next phase of AI and enterprise g", "summary": "티모바일이 전 셸 CFO인 제시카 울을 영입해 AI 및 엔터프라이즈 부문 전략을 강화한다. 주요 통신사의 경영진 교체 및 신사업 추진 동향이다.", "source": "Fierce Network", "date": "2026-09-04 07:07", "url": "https://www.fierce-network.com/wireless/t-mobile-names-jessica-uhl-next-cfo", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 경영진"}, {"title": "Verizon advances its Carrier Ethernet standing amidst M&A market shuffle - Lightwave Onlin", "summary": "미국 통신사 버라이즌이 통신 장비 및 서비스 시장의 M&A 재편 속에서 캐리어 이더넷(Carrier Ethernet) 사업 입지를 강화하고 있다. 기업용 네트워크 및 전용회선 서비스 경쟁력을 높이기 위한 전략적 행보다. 통신 시장의 인수합병 트렌드에 발맞춰 B2B 포트폴리오를 다지고 있다. 향후 기업 고객 대상 서비스 점유율 확대에 기여할 전망이다.", "source": "Lightwave Online", "date": "2026-09-04 05:53", "url": "https://www.lightwaveonline.com/home/article/55403011/verizon-advances-its-carrier-ethernet-standing-amidst-ma-market-shuffle", "category": "contract", "importance": 3, "wl": false, "topic": "버라이즌 캐리어 이더넷 m&a"}, {"title": "T-Mobile sets CFO transition", "summary": "티모바일은 셸의 전 최고재무책임자(CFO)인 제시카 울을 2027년 2월 새로운 CFO로 선임할 예정이라고 발표했다. 현 CFO인 피터 오스발딕은 2027년 7월 1일 공식 은퇴 전까지 전략 고문직을 맡아 업무 인수인계를 지원한다. 이번 최고재무책임자 교체는 향후 통신사의 재무 전략과 장기 경영 방향성에 영향을 미칠 것으로 전망된다.", "source": "Light Reading", "date": "2026-09-04 05:49", "url": "https://www.lightreading.com/finance/t-mobile-sets-cfo-transition", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원 인사"}, {"title": "Shell’s former finance chief is set to lead T-Mobile’s finances in 2027 - Stock Titan", "summary": "미국 통신사 티모바일(T-Mobile)이 2027년 재무를 총괄할 새로운 최고재무책임자(CFO)로 셸(Shell)의 전직 재무 수장을 영입할 예정이라고 밝혔다. 대형 통신사의 재무 리더십 개편을 통해 장기적인 재무 건전성을 확보하려는 전략이다. 경영진 인사가 기업 전략 전반에 미칠 변화가 주목된다.", "source": "Stock Titan", "date": "2026-09-04 05:08", "url": "https://www.stocktitan.net/news/TMUS/t-mobile-announces-planned-chief-financial-officer-ocasik76f1w8.html", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 셸 재무 책임자 영입"}, {"title": "SK Telecom’s Topda turns work vans into an AI inspection fleet", "summary": "SK텔레콤이 작업용 차량을 AI 검사 함대로 변환하는 AI 기반 유선망 검사 시스템 '탑다(Topda)'를 상용화했다. 일반 차량에 탑재된 AI 카메라가 일상적인 기술자 이동 경로를 따라 유선 인프라를 자동으로 점검하는 방식이다. 통신망 유지보수 업무에 인공지능을 접목해 운영 효율성을 극대화한 사례다.", "source": "RCR Wireless", "date": "2026-09-04 01:56", "url": "https://rcrwireless.com/20260903/tech/sk-telecoms-topda", "category": "tech", "importance": 3, "wl": true, "topic": "sk텔레콤 ai"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "세대 교체의 일환으로 도이치텔레콤이 AWS 출신 호프마이어를 영입하고 CFO가 퇴임하는 등 대규모 임원진 개편을 진행했다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 3, "wl": f 스오렌지 6ghz 대역 6g 연구"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - AD HOC NEWS", "summary": "버라이즌이 프론티어 인수 추진과 CEO 전환 소식에 힘입어 주가가 상승했다. 통신사 간 대형 인수합병 및 경영진 변화 흐름을 보여준다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "exec", "importance": 3, "wl": false, "topic": "버라이즌 인수합병"}, {"title": "Orange plans new cable linking La Réunion and South Africa - Connecting Africa", "summary": "프랑스 통신사 오렌지가 레위니옹섬과 남아프리카공화국을 연결하는 새로운 해저케이블 구축 계획을 발표했다. 아프리카 및 인도양 지역의 국제 데이터 트래픽 수요 급증에 대응하기 위한 인프라 투자다. 대륙 간 통신망 연결성을 강화하고 안정적인 네트워크 백본을 확보하게 된다. 글로벌 통신사들의 해저케이블 영토 확장 경쟁이 지속되고 있다.", "source": "Connecting Africa", "date": "2026-09-03 22:40", "url": "https://www.connectingafrica.com/connectivity/orange-plans-new-cable-linking-la-r-union-and-south-africa", "category": "contract", "importance": 3, "wl": false, "topic": "오렌지 해저케이블 신규 구축"}, {"title": "Deutsche Telekom anoints CTO with Comcast chief network veteran and AWS VP Jan Hofmeyr - s", "summary": "도이치텔레콤이 컴캐스트 출신 네트워크 베테랑이자 AWS 부사장인 얀 호프마이어를 신임 CTO로 선임했다. 주요 글로벌 통신사의 최고기술경영자 교체 소식이다.", "source": "sdxcentral.com", "date": "2026-09-03 22:32", "url": "https://www.sdxcentral.com/news/deutsche-telekom-anoints-cto-with-comcast-chief-network-veteran-and-aws-vp-jan-hofmeyr/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영진"}, {"title": "AT&T tops Ethernet Leaderboard amid shakeup – Vertical Systems - Light Reading", "summary": "AT&T가 이더넷 시장 리더보드 상위권을 차지하며 업계 내 입지를 다지고 있다. 기업용 네트워크 서비스 경쟁력을 보여주는 지표이다.", "source": "Light Reading", "date": "2026-09-03 22:00", "url": "https://www.lightreading.com/broadband/at-t-tops-ethernet-leaderboard-amid-ranking-shakeup-vertical-systems", "category": "other", "importance": 3, "wl": false, "topic": "at&t 이더넷"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": ng Bundles - timothysykes.com", "summary": "차터가 규모의 경제와 스트리밍 번들 상품에 집중하며 사업 경쟁력 강화를 꾀하고 있다.", "source": "timothysykes.com", "date": "2026-09-03 04:03", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "other", "importance": 3, "wl": false, "topic": "차터 사업확대"}, {"title": "AT&T (NYSE:T) Opens Stadium Connectivity To Rival Customers - Kalkine Media", "summary": "AT&T가 경쟁사 고객들에게도 스타디움 내 경기장 연결 서비스를 개방하기로 했다. 고객 경험 확대와 상생 전략의 일환이다.", "source": "Kalkine Media", "date": "2026-09-03 03:38", "url": "https://kalkinemedia.com/us/stocks/communication/att-nyset-opens-stadium-connectivity-to-rival-customers", "category": "other", "importance": 3, "wl": false, "topic": "at&t 스타디움연결"}, {"title": "Spectrum COO Nick Jeffery Touts \"The Great Cable Comeback\" As He Assumes Charter Exec Post", "summary": "차터의 COO 닉 제프리가 경영진 복귀와 함께 케이블 사업의 부활을 주도하겠다는 포부를 밝혔다. 주요 케이블 통신사의 전략 변화이다.", "source": "Deadline", "date": "2026-09-03 01:43", "url": "https://deadline.com/2026/09/charter-spectrum-coo-nick-jeffery-great-cable-comeback-1237064469/", "category": "exec", "importance": 3, "wl": false, "topic": "차터 경영전략"}, {"title": "Bell faces up to $10 million in penalties after defying CRTC order to stop selling locked ", "summary": "캐나다 방송통신규제위원회(CRTC)의 잠금 장치 해제 휴대폰 판매 중단 명령을 위반한 벨(Bell)이 최대 1천만 달러의 벌금 처분을 받았다. 주요 통신사에 대한 규제 기관의 제재 조치이다.", "source": "Yahoo! Finance Canada", "date": "2026-09-03 00:30", "url": "https://ca.finance.yahoo.com/news/bell-faces-10-million-penalties-153000094.html", "category": "policy", "importance": 3, "wl": false, "topic": "벨 캐나다 규제제재"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에 프라이빗 5G를 구축하기 위한 새로운 계획을 마련했으나, 구체적인 주파수 할당 계획은 포함되지 않은 것으로 나타났다. 산업용 5G 확산을 유도하고 있으나 핵심 자원인 주파수 문제로 인해 실효성에 대한 의문이 제기된다. 향후 정책 구체화 여부가 기업들의 투자 방향을 좌우할 전망이다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국정부 5g 정책"}, {"title": "Softbank shooting for commercial HAPS launch in 2027 - Telecoms", "summary": "일본 소프트뱅크가 성층권 통신 플랫폼(HAPS)의 상용화 시점을 2027년으로 목표하고 개발에 박차를 가하고 있다. 지상 기지국의 전파가 닿지 않는 오지나 해상, 재난 지역에 하늘을 나는 기지국을 통해 통신 서비스를 제공한다는 구상이다. 차세대 공중 통신망 구축을 위한 핵심 기술 확보 경쟁이 치열하다. 위성통신과 함께 음영 지역 해소를 위한 대안으로 주목받고 있다.", "source": "Telecoms", "date": "2026-09-02 19:50", "url": "https://www.telecoms.com/5g-6g/softbank-shooting-for-commercial-haps-launch-in-2027", "category": "tech", "importance": 3, "wl": false, "topic": "소프트뱅크 haps 상용화 추진"}, {"title": "BTC to launch commercial 5G services in Gabarone in October - Telecompaper", "summary": "통신사 BTC가 오는 10월 보츠와나의 수도 가보로에서 상용 5G 서비스를 공식 개시할 예정이라고 밝혔다. 아프리카 지역 내 모바일 네트워크 고도화와 초고속 통신 서비스 보급이 본격화되고 있다. 가보로 지역 가입자들은 향상된 데이터 속도와 품질을 경험할 수 있게 된다. 신흥 시장의 5G 인프라 투자 확대 추세를 보여준다.", "source": "Telecompaper", "date": "2026-09-02 17:34", "url": "https://www.telecompaper.com/news/btc-to-launch-commercial-5g-services-in-gabarone-in-october--1581407", "category": "contract", "importance": 3, "wl": false, "topic": "btc 가보로 상용 5g 서비스"}, {"title": "Charter Communications announces resignation of CFO - Telecompaper", "summary": "차터 커뮤니케이션스가 최고재무책임자(CFO)의 사임 소식을 발표했다. 대형 통신·케이블사의 주요 임원 교체 소식이다.", "source": "Telecompaper", "date": "2026-09-02 16:00", "url": "https://www.telecompaper.com/news/charter-communications-announces-resignation-of-cfo--1581381", "category": "exec", "importance": 3, "wl": false, "topic": "차터 경영진"}, {"title": "HPE scores Wi-Fi and AI goals as 5G and VMware lose out", "summary": "영국 프리미어리그 토트넘 홋스퍼 스타디움이 휴렛팩커드(HPE)의 기술을 활용해 수백만 달러 규모의 네트워크 업그레이드를 거의 완료했다. 이번 업그레이드에는 와이파이 7과 AI 기능이 포함되어 대규모 군중 환경에서의 연결성을 대폭 강화했다. 고성능 경기장 및 대형 장소에서의 최신 무선 장비 도입 사례다.", "source": "Light Reading", "date": "2026-09-02 15:00", "url": "https://www.lightreading.com/wifi/hpe-scores-wi-fi-and-ai-goals-as-5g-and-vmware-lose-out", "category": "contract", "importance": 3, "wl":   return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
