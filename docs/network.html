] \"기내 와이파이 확산되면 비행기모드 사라질까?\" - 디지털데일리", "summary": "기내 와이파이 확산에 따른 항공기 내 스마트폰 비행기모드 규칙 변화 가능성을 다룬 IT 트렌드 기사입니다.", "source": "디지털데일리", "date": "2026-09-03 10:46", "url": "https://www.ddaily.co.kr/page/view/2026090215364923049", "category": "other", "importance": 2, "wl": false, "topic": "위성 미디어"}], "competitor": [{"title": "브로드컴 “AI칩 매출 3배↑”… 삼성 수혜 기대감 커진다", "summary": "브로드컴이 맞춤형 AI 가속기와 AI 네트워크 반도체 수요 급증에 힘입어 매출이 3배 이상 증가했다고 밝혔다. 이 과정에서 파운드리 및 반도체 분야에서 삼성전자와의 협력 가능성이 다시금 주목받고 있다. 글로벌 AI 인프라 확장에 따른 주요 칩 공급사의 실적 성장세와 파트너십 동향을 보여준다.", "source": "dt.co.kr", "date": "2026-09-03 08:45", "url": "https://www.dt.co.kr/article/12081849?ref=naver", "category": "contract", "importance": 5, "wl": false, "topic": "디지털타임스 브로드컴 ai칩"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 드론 실시간 추적 등의 통신 기술을 공개할 예정이다. 한국 정부와 국내 기업들을 상대로 ISAC과 결합된 6G 및 AI 처리 기술력을 적극 알리고 협력 방안을 모색한다. 글로벌 통신 장비 경쟁사의 최신 기술 로드맵과 국내 시장 공략 전략을 보여주는 핵심 보도다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 5, "wl": false, "topic": "서울경제 에릭슨 드론 추적"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI 랜(AI-RAN), ISAC, 6G로 이어지는 기술 리더십을 바탕으로 한국 고객과 파트너를 지원하겠다고 밝혔다. AI 시대의 경쟁력은 네트워크에서 시작된다는 기조 아래 차세대 통신망 진화 방향을 제시했다. 글로벌 장비사의 국내 시장 기술 공세가 본격화되고 있다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 5, "wl": false, "topic": "이투데이 에릭슨 ai-ran"}, {"title": "에릭슨코리아, AI 기반 통신망· 6G 기술 로드맵 공개", "summary": "에릭슨코리아가 'Ericsson Innovation Day 2026 Korea'를 개최하고 AI 기반 통신망 발전 전략과 6G 기술 로드맵을 전격 공개했다. 국내 통신사 및 산업계 관계자들이 대거 참석한 가운데 인공지능을 활용한 차세대 네트워크 진화 방향을 공유했다. 주요 글로벌 장비사의 국내 기술 행보를 보여준다.", "source": "biz.heraldcorp.com", "date": "2026-09-02 16:10", "url": "https://biz.heraldcorp.com/article/10860523?ref=naver", "category": "tech", "importance": 5, "wl": false, "topic": "헤럴드경제 에릭슨코리아  5, "wl": false, "topic": "삼성전자 zte 특허소송"}, {"title": "Huawei Profit Plunges 36% As AI, Chip Investment And Rising Costs Squeeze Margins - Tekedi", "summary": "화웨이의 이익이 AI 및 칩 투자와 비용 상승으로 인해 36% 급감했습니다. 막대한 연구개발 비용과 미국의 제재 압박 속에서 마진 압박이 심화되고 있음을 보여줍니다. 화웨이의 재무 건전성과 투자 기조에 변화가 예상됩니다.", "source": "Tekedia", "date": "2026-09-01 19:49", "url": "https://www.tekedia.com/huawei-profit-plunges-36-as-ai-chip-investment-and-rising-costs-squeeze-margins/", "category": "earnings", "importance": 5, "wl": false, "topic": "화웨이 실적 부진"}, {"title": "싸게 팔던 중국기업의 반격…'특허' 무기로 삼성 ·글로벌 기업 흔든다", "summary": "중국 기업들이 과거의 저가 공세를 넘어 강력한 '특허' 네트워크를 무기로 삼성전자와 글로벌 기업들을 위협하고 있다. 글로벌 공급망과 무역 전반에서 중국발 특허 공세가 거세지면서 기술 경쟁 구도에 비상이 걸렸다. 국내 주요 기업들의 지식재산권 전략 재점검이 시급한 상황이다.", "source": "inews24.com", "date": "2026-09-03 06:01", "url": "http://www.inews24.com/view/2001233", "category": "policy", "importance": 4, "wl": false, "topic": "아이뉴스24 중국기업 특허"}, {"title": "FIS stock gains on Ericsson wallet partnership and Q2 banking growth - AD HOC NEWS", "summary": "", "source": "AD HOC NEWS", "date": "2026-09-03 00:32", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/fis-stock-gains-on-ericsson-wallet-partnership-and-q2-banking-growth/70044743", "category": "policy", "importance": 4, "wl": false, "topic": ""}, {"title": "[헬로스톡] 9/2 주목할 종목 : 삼성전기·RFHIC·롯데렌탈·셀트리온제약", "summary": "미국 어퍼 C밴드 주파수 경매가 2027년 4월로 확정된 데 이어 국내에서도 2026년 연말 5G SA 도입이 예정되어 있다. NXP의 통신 사업 부문 철수와 함께 미국의 대중국 장비 및 부품 제재 기조가 이어지는 등 통신 장비 시장의 주요 규제 및 정책 변화가 교차하고 있다.", "source": "hellot.net", "date": "2026-09-02 17:58", "url": "https://www.hellot.net/news/article.html?no=114725", "category": "policy", "importance": 4, "wl": false, "topic": "헬로스톡 미국 주파수 경매"}, {"title": "알에프텍, RF 전문 자회사 'RFTC' 출범… 5G ·방산 사업 본격 확대", "summary": "알에프텍이 5G 통신 장비 및 방산 RF 기술 경쟁력 강화를 위해 R&D 조직을 'RFTC' 자회사로 분리하여 본격적인 사업 확대에 나선다. 과거 삼성전자에 5G 안테나 필터 유닛 등을 공급하며 쌓은 기술력을 바탕으로 전문성을 높이려는 전략이다. 통신 장비 부품 생태계의 변화를 보여준다.", "source": "view.asiae.co.kr", "date": "2026-09-03 14:23", "url": "https://view.asiae.co.kr/article/2026090314231334445", "category": "contract", "importance": 3, "wl": false, "topic": "아시아경제 알에프텍 자회사"}, {"title": "알에프텍, 5G 기술 방산으로 확대…RF 자회사 'RFTC' 출범", "summary": "알에프텍이 삼성전자에 5G 안테나 필터 유닛과 Massive MIMO 기지국용 부품을 공급하며 축적한 역량을 바탕으로 RF 자회사 'RFTC'를 출범해 방산 및 통신 장비 사업을 확대한다. 통신 장비 협력사의 조직 개편 및 사업 영역 확장 움직임을 다룬다.", "source": "fnnews.com", "date": "2026-09-03 13:41", "url": "https://www.fnnews.com/news/202609031334337249", "category": "contract", "importance": 3, "wl": false, "topic": "파이낸셜뉴스 알에프텍 5g"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 3, "wl": false, "topic": ""}, {"title": "Ericsson powers Saudi Arabia’s next phase of digital transformation and innovation - Tahaw", "summary": "에릭슨이 사우디아라비아의 차세대 디지털 전환과 혁신을 지원합니다. 사우디의 국가 비전과 발맞추어 통신 인프라 고도화를 주도합니다. 장기적인 파트너로서 입지를 다지고 있습니다.", "source": "TahawulTech.com", "date": "2026-09-03 07:04", "url": "https://www.tahawultech.com/home-slide/ericsson-powers-saudi-arabias-next-phase-of-digital-transformation-and-innovation/", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 사우디아라비아 디지털"}, {"title": "Opinion: Huawei: They may rip out our networks, but they'll never take our patents! - fier", "summary": "", "source": "fierce-network.com", "date": "2026-09-03 03:01", "url": "https://www.fierce-network.com/modernization/opinion-huawei-they-may-rip-out-our-networks-theyll-never-take-our-patents", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Ericsson adaptive inventory", "summary": "Meeting the demands of the AI and autonomous networks era Executive SummaryThis solution profile of Ericsson Adaptive Inventory (EAI) updates Appledore’s 2023 profile. Over the past three years, the role…", "source": "RCR Wireless", "date": "2026-09-02 22:5 tion By Investing.com - Invest", "summary": "노키아가 사우디아라비아에 AI 네트워크 자동화를 위한 R&D 센터를 개소했습니다. 중동 지역의 인프라 투자 수요에 대응하기 위한 거점입니다. AI 역량을 결합한 차세대 통신 기술 개발에 주력합니다.", "source": "Investing.com Australia", "date": "2026-09-02 08:56", "url": "https://m.au.investing.com/news/stock-market-news/nokia-opens-rd-center-in-saudi-arabia-for-ai-network-automation-93CH-4624337?ampMode=1", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 r&d센터"}, {"title": "Pakistani delegation visits Ericsson HQ in Stockholm, meets Pakistani professionals - | As", "summary": "", "source": "| Associated Press Of Pakistan", "date": "2026-09-02 04:21", "url": "https://www.app.com.pk/national/pakistani-delegation-visits-ericsson-hq-in-stockholm-meets-pakistani-professionals/", "category": "other", "importance": 3, "wl": false, "topic": ""}], "policy": [{"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - leadeconomy.co.kr", "summary": "미국의 화웨이 제재가 부품 분야로 확산되면서 국내 장비 업체들에게 반사이익과 기회가 쏠리고 있다는 분석입니다. 글로벌 통신 장비 공급망 재편 과정에서 한국 기업들의 입지가 주목받고 있습니다. 규제 강화가 시장 구도에 미치는 영향이 큽니다.", "source": "leadeconomy.co.kr", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 5, "wl": false, "topic": "화웨이 제재 부품"}, {"title": "India weighs ‘rip and replace’ plan for Chinese telecom gear - Communications Today", "summary": "인도 정부가 중국산 통신 장비에 대한 '립 앤 리플레이스(철거 후 교체)' 계획을 저울질하고 있습니다. 안보 우려로 인해 기존에 설치된 화웨이·ZTE 등 중국산 장비를 전면 철거하는 방안입니다. 글로벌 통신 장비 시장 구도에 큰 파장을 미칠 수 있습니다.", "source": "Communications Today", "date": "2026-09-01 19:18", "url": "https://www.communicationstoday.co.in/india-weighs-rip-and-replace-plan-for-chinese-telecom-gear/", "category": "policy", "importance": 5, "wl": false, "topic": "인도 중국산 장비"}, {"title": "[속보]티빙 3954만개 계정 정보 유출…탈퇴·휴면 회원까지 털렸다", "summary": "과학기술정보통신부 민관합동조사단이 티빙 침해사고 조사 결과를 발표하며 탈퇴 및 휴면 회원을 포함해 3954만 개의 계정 정보가 유출되었다고 밝혔다. 티빙 측이 법정 기한인 24시간 내에 사고를 신고하지 않아 과태료 부과 대상이 되었다. 주요 디지털 플랫폼의 보안 관리 실태와 규제 기관의 제재 조치를 다룬다.", " e": 4, "wl": false, "topic": "정부 ai 사업"}, {"title": "Satcom spectrum fee: DCC may soon decide airwave charges, allocation terms - economictimes", "summary": "인도 통신위원회(DCC)가 위성통신(Satcom) 스펙트럼 주파수 요금 및 할당 조건을 곧 결정할 예정입니다. 저궤도 위성 사업자들의 인도 시장 진입 비용과 규제 프레임워크가 확정되는 중요한 규제 이슈입니다.", "source": "economictimes.indiatimes.com", "date": "2026-09-03 04:01", "url": "https://economictimes.indiatimes.com/industry/telecom/satcom-spectrum-fee-dcc-may-soon-decide-airwave-charges-allocation-terms/articleshow/133719014.cms", "category": "policy", "importance": 4, "wl": false, "topic": "위성통신 스펙트럼 수수료"}, {"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "과학기술정보통신부와 국내 통신 3사가 세제, 주파수, 규제 완화를 패키지로 묶어 네트워크 및 AIDC 지원을 늘려야 한다는 데 공감대를 형성했다. 3G 종료를 포함해 5G와 6G 투자를 촉진하기 위한 민관협의체 논의가 본격화될 전망이다. 통신 인프라 투자 환경을 개선하기 위한 정부 정책의 방향성을 보여준다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 4, "wl": false, "topic": "머니투데이 이통3사 네트워크"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "AI 국가 경쟁력을 확보하기 위해 3G 같은 레거시 네트워크를 정리하고 5G SA나 6G 등 차세대 네트워크 고도화에 정부의 정책적 지원이 필요하다는 전문가 제언이 나왔다. 과기정통부 관계자도 네트워크 투자의 편익과 제도 개선 방안을 민관협의체에서 논의하겠다고 화답했다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 4, "wl": false, "topic": "바이라인네트워크 ai 국가 경쟁력"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "통신사들이 AI-RAN, 6G 등 차세대 네트워크 투자 확대에 따라 기존 기지국 중심의 CAPEX 지표를 보완해야 한다고 목소리를 높였다. 개방형 시설에 대한 세액공제 입증 문제 등 통신 인프라 투자를 촉진하기 위한 제도적 지원 방안이 논의되고 있다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 4, "wl": false, "topic": "딜사이트 ai 투자 통신사"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "향후 5년 뒤 AI 트래픽이 최대 5배 폭증할 것으로 예상됨에 따라 네트워크를 국가 AI 인프라로 격상해 키워야 한다는 주장이 제기됐다. 5G SA, AI-RAN, 6G 투자 지원과 함께 과 <script>
const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};
const SEC_NAME={competitor:"경쟁사",carrier:"통신사",satellite:"위성",policy:"정책·규제",outage:"Outage"};
const TABS=[
  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성",       secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 회사명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
