<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

om.au/ups-website-app-outages-customer-complaints-1874864", "category": "outage", "importance": 2, "wl": false, "topic": "ups 배송 추적 시스템 장애 발생"}, {"title": "Washington County non-emergency line set for outage Sept. 2 - heraldmailmedia.com", "summary": "헤럴드메일미디어는 워싱턴 카운티의 비상 전화 회선이 정기 점검 및 시스템 작업으로 인해 9월 2일 일시 중단된다고 보도했다. 사전 공지를 통해 주민들의 불편을 최소화하고 우회 번호를 안내했다. 통신망 장애가 아닌 계획된 점검 작업으로 인한 일시적 중단이다.", "source": "heraldmailmedia.com", "date": "2026-09-02 07:52", "url": "https://www.heraldmailmedia.com/story/news/local/2026/09/01/when-the-county-non-emergency-number-is-affected/91568196007/", "category": "outage", "importance": 1, "wl": false, "topic": "워싱턴카운티 비상번호 일시 장애"}], "satellite": [{"title": "OHB lands €1bn SES contract as Europe’s IRIS² advances - telcotitans.com", "summary": "독일 위성 제작사 OHB가 유럽연합(EU)의 차세대 보안 위성통신망 프로젝트인 'IRIS²'의 일환으로 SES로부터 1조 원(1억 유로 아님, 10억 유로) 규모의 계약을 체결했습니다. 유럽의 독자적인 저궤도 위성 통신망 구축 사업이 본격적인 가속 단계에 접어들었습니다. 이번 계약은 유럽 우주 산업의 기술력 집약과 함께 대형 위성 인프라 구축의 신호탄입니다. 글로벌 위성통신 시장의 경쟁 구도에 지대한 영향을 미칠 대형 딜입니다.", "source": "telcotitans.com", "date": "2026-09-03 01:06", "url": "https://www.telcotitans.com/infrawatch/ohb-lands-1bn-ses-contract-as-europes-iris-advances/10833.article", "category": "contract", "importance": 5, "wl": false, "topic": "ohb ses 유로파 계약"}, {"title": "Hungary's 4iG Group and SpaceX sign Europe's first Starlink - mediasat.info", "summary": "헝가리 4iG 그룹과 스페이스X가 손잡고 유럽 최초로 스타링크 서비스 도입 계약을 체결했습니다. 이번 계약을 통해 유럽 지역 내 위성통신 서비스 상용화가 본격화될 전망입니다. 저궤도 위성통신(Starlink)의 유럽 시장 진출은 기존 지상파 통신망 중심의 구도에 큰 변화를 예고합니다. 위성인프라와 지상 통신망의 결합을 통한 차세대 통신 서비스 경쟁이 더욱 치열해질 것입니다.", "source": "mediasat.info", "date": "2026-09-02 17:14", "url": "https://mediasat.info/en/2026/09/02/starlink-mobile-is-coming-to-hungary-and-the-balkans/", "category": "contract", "importance": 5, "wl": false, "topic": "스타링크 유럽 최초 계약"}, {"title": "Sceye, SoftBank demo high-altitude platform systems connectivity - Computer Weekly", "summary": "소프트뱅크가 고고도 플랫폼 시스템을 활용한 차세대 상공 통신 연결 기술 시연을 성공적으로 마쳤다. 지상 기지국의 한계를 극복하는 혁신적인 공중 무선 통신 기술로 주목받고 있다. 향후 음영 지역 해소 및 위성 연계 통신의 핵심 인프라로 활용될 전망이다. 차세대 6G 및 비지상 네트워크 경쟁력을 보여준다.", "source": "Computer Weekly", "date": "2026-09-03 18:39", "url": "https://www.computerweekly.com/news/366649923/Sceye-SoftBank-demo-high-altitude-platform-systems-connectivity", "category": "tech", "importance": 4, "wl": false, "topic": "소프트웨어 위성통신 시연"}, {"title": "위성 170만기 시대 온다는데… 지구 궤도 ‘우주 교통’ 비상", "summary": "스타링크 등 대규모 위성망 확대로 저궤도 혼잡 가속 10㎝ 이상 파편 충돌 시 위성 완전히 파괴 가능 미국천문학회(AAS), 전파 주파수 혼잡 심화 가능성 경고 지난 2009년 2월 미국 통신위성 이리듐33과 러시아 군사위성...", "source": "biz.chosun.com", "date": "2026-09-03 06:01", "url": "https://biz.chosun.com/science-chosun/science/2026/09/03/7HRPQEAE5FHHXAF2BWQ43KGSE4/?utm_source=naver&utm_medium=original&utm_campaign=biz", "category": "policy", "importance": 4, "wl": false, "topic": ""}, {"title": "ASTS Down 46.3%, Insiders Buying, Earnings Make Or Break! | ASTS Stock Analysis Cbse 12th ", "summary": "AST스페이스모바일(ASTS)의 주가가 큰 폭으로 하락한 가운데 내부자 매수와 실적 발표를 앞두고 시장의 기대와 우려가 교차하고 있습니다. 위성-셀룰러 직접 연결(Direct-to-Cell) 기술의 상용화 성과에 따라 기업의 명운이 갈릴 수 있는 국면입니다. 대규모 자본 투자가 소요되는 위성 사업 특성상 실적 발표가 주가 향방의 분수령이 될 전망입니다. 투자자들은 회사의 자금 조달 및 파트너십 진척 상황을 주시하고 있습니다.", "source": "mshale.com", "date": "2026-09-02 12:32", "url": "https://mshale.com/822d1196/ef7039f5-gAFt7ylJec", "category": "earnings", "importance": 4, "wl": false, "topic": "ast스페이스모바일 주가 및 실적"}, {"title": "New Helium CEO channels Starlink with enabler platform debut - telcotitans.com", "summary": "탈중앙화 통신 네트워크 헬륨의 신임 CEO가 스타링크를 겨냥한 위성통신 enabler 플랫폼을 전격 공개했다. 위성 기반 인프라 시장에 진입하며 기존 지상파 통신망과의 경쟁을 예고했다. 저궤도 위성 통신 생태계에 새로운 참여자가 늘어나고 있다. 향후 위성 직접 연결 서비스 시장에 미칠 파장이 주목된다.", "source": "telcotitans.com", "date": "2026-09-02 01:05", "url": "https://www.telcotitans.com/network-and-it/new-helium-ceo-channels-starlink-with-enabler-platform-debut/10829.article", "category": "contract", "importance": 4, "wl": false, "topic": "헬륨 위성통신 진출"}, {"title": "DoT leaning toward 5% AGR-linked charge for satellite spectrum - 우주 기반 데이터센터 및 통신 인프라 구축에 박차를 가하고 있다. 경영진 개편을 통해 프로젝트 실행력을 높이고 시장 신뢰를 회복할 계획이다.", "source": "디지털투데이", "date": "2026-09-02 14:04", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697624", "category": "exec", "importance": 3, "wl": false, "topic": "스페이스x ai 데이터센터 수장 교체"}, {"title": "Can Europe take on Elon Musk’s Starlink? - The Times", "summary": "더 타임스는 유럽이 일론 머스크의 스타링크(Starlink) 독점에 맞서 자체 저궤도 위성통신망 구축을 추진하고 있다고 보도했다. 유럽연합(EU) 차원에서 안보 및 통신 주권 확보를 위한 대규모 위성 프로젝트가 논의되고 있다. 미국 기업에 대한 의존도를 낮추기 위한 유럽 내 장비 제조사들의 역할이 강조된다. 자금 조달과 발사체 확보가 유럽 위성 사업 성공의 관건이다.", "source": "The Times", "date": "2026-09-02 14:00", "url": "https://www.thetimes.co.uk/business/technology/article/eutelsat-oneweb-europe-space-race-starlink-9lf5pntb7", "category": "other", "importance": 3, "wl": false, "topic": "더타임스 유럽의 스타링크 대항마 모색"}, {"title": "에이스테크, 항우연 저궤도 위성통신 핵심 안테나 개발 수주 - 머니투데이 - 머니투데이", "summary": "에이스테크가 한국항공우주연구원(항우연)으로부터 저궤도 위성통신 핵심 안테나 개발 사업을 수주했다고 머니투데이가 보도했다. 이번 수주를 통해 국내 기술력 기반의 위성통신 부품 국산화에 기여할 것으로 기대된다. 에이스테크는 우주 및 방산 통신 분야로 사업 영역을 적극적으로 확대하고 있다. 정부 주도의 위성 통신 인프라 구축 과정에서 핵심적인 역할을 수행할 전망이다.", "source": "머니투데이", "date": "2026-09-02 13:57", "url": "https://www.mt.co.kr/stock/2026/09/02/2026090213353698193", "category": "contract", "importance": 3, "wl": false, "topic": "에이스테크 항우연 저궤도 위성 안테나 수주"}, {"title": "ASTS Stock Hits One-Month Low: Insider Buys The Dip After BlueBird Deployments, Japan Win ", "summary": "아시안넷 뉴스에이블은 AST 스페이스모바일(ASTS) 주가가 블루버드 위성 배치 완료와 일본 통신사 수주 소식에도 불구하고 한 달 내 최저치를 기록했다고 보도했다. 내부자들은 주가 하락을 기회 삼아 저가 매수에 나선 것으로 나타났다. 최근의 위성 전개 성과와 글로벌 통신사와의 파트너십 진전은 장기적 호재로 작용한다. 단기 시장 변동성과 실질적 매출 발생 간의 괴리가 주가에 영향을 미치고 있다.", "source": "Asianet Newsable", "date": "2026-09-02 11:40", "url": "https://newsable.asianetnews.com/markets/asts-stock-hits-one-month-low-insider-buys-the-dip-after-bluebird-deployments-japan-win-articleshow-acp217e", "category": "other", "importance": 3, "wl": false, "topic": "ast스페이스모바일 주가 저점 기록"}, {"title": "인텔리안테크, 美 공장 첫 출하…북미 위성통신 공급망 가동 - 전자신문", "summary": "전자신문은 인텔리안테크가 미국 현지 공장에서 첫 안테나 제품을 출하하며 북미 위성통신 공급망 가동을 본격화했다고 보도했다. 현지 생산 거점 확보를 통해 글로벌 고객사들의 납품 요구에 신속하게 대응할 수 있게 되었다. 북미 지역의 저궤도 위성 서비스 수요 증가에 발맞춘 전략적 조치다. 위성통신 안테나 시장에서 회사의 글로벌 경쟁력이 한층 강화될 전망이다.", "source": "전자신문", "date": "2026-09-02 11:15", "url": "https://www.etnews.com/20260902000178", "category": "contract", "importance": 3, "wl": false, "topic": "인텔리안테크 美 공장 첫 출하"}, {"title": "Eutelsat OneWeb seeks urgent security approval for LEO constellation to launch commercial ", "summary": "이경제 타임즈는 유텔샛 오네웹(Eutelsat OneWeb)이 저궤도 위성 군집의 상용 서비스를 본격화하기 위해 긴급 보안 승인을 요청했다고 보도했다. 각국 정부의 엄격한 사이버 보안 및 국가 안보 심사를 통과해야 정식 서비스가 가능하다. 글로벌 위성통신 시장에서 경쟁력을 유지하기 위한 규제 승인 절차의 중요성이 부각된다. 승인이 완료되면 기업 및 정부 기관을 대상으로 한 서비스가 확대될 것이다.", "source": "The Economic Times", "date": "2026-09-02 04:36", "url": "https://m.economictimes.com/tech/technology/eutelsat-oneweb-seeks-urgent-security-approval-for-leo-constellation-to-launch-commercial-satcom-services-in-india/articleshow/133691078.cms", "category": "policy", "importance": 3, "wl": false, "topic": "유텔샛 오네웹 저궤도 위성 보안 승인 요청"}, {"title": "테슬라 '사이버캡' 공개 운행 시작…일론 머스크식 자율주행 전략, 성공...", "summary": "테슬라가 사이버캡에 스타링크 연결을 설치한 것도 이런 운영 방식과 관련이 있다. 테슬라는 2025년 6월부터 오스틴에서 로보택시 서비스를 운영해 왔으며, 이 지역에는 모델Y 약 110대가 투입된 것으로 추산된다. 다만...", "source": "digitaltoday.co.kr", "date": "2026-09-03 19:26", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697995", "category": "other", "importance": 2, "wl": false, "topic": ""}], "competitor": [{"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도 정부가 국가 안보 우려를 이유로 기존에 설치된 중국산 통신장비의 철거 및 교체(Rip and Replace)를 검토하고 있다. 화웨이와 ZTE 등 중국계 장비 의존도를 낮추기 위한 조치다. 글로벌 통신장비 시장에서 안보 이슈로 인한 중국산 장비 퇴출 흐름이 가파르게 전개되고 있다. 에릭슨, 노키아, 삼성전자 등 비중국계 장비 업체의 수혜가 예상된다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도 화웨이 장비 퇴출 검토"}, {"title": "VodafoneThree declares 5G network slicing war on BT", "summary": "보다폰쓰리가 BT의 유사 서비스와 차별화된 보증 조건을 내세우며 5G 네트워크 슬라이싱 시장 공략에 나섰다. 새로운 슈퍼모바일 요금제를 통해 기업 및 소비자 고객을 확보하려는 전략이다. 경쟁사인 BT와의 망 고도화 경쟁이 더욱 치열해질 전망이다. 통신장비 시장에서 네트워크 슬라이싱 상용화의 중요성이 커지고 있다.", "source": "Light Reading", "date": "2026-09-03 18:23", "url": "https://www.lightreading.com/5g/vodafonethree-declares-5g-network-slicing-war-on-bt", "category": "contract", "importance": 4, "wl": true, "topic": "보다폰쓰리 5g 네트워크 슬라이싱"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - The Fast", "summary": "에릭슨이 사우디아라비아 모빌라이(Mobily)와 손잡고 AI 기반 RAN 및 자율주행 네트워크 고도화를 추진한다. 양사는 사우디 내 인프라 혁신을 위해 차세대 기술 협력을 강화할 예정이다. 에릭슨의 글로벌 AI 네트워크 전략의 일환으로 추진된다. 중동 지역 5G 고도화 경쟁에서 입지를 다지는 계기가 된다.", "source": "The Fast Mode", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 수주"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 6G 기지국을 활용해 드론을 탐지할 수 있는 기술 시연을 선보였다. 차세대 이동통신 인프라의 다목적 활용 가능성을 제시한다. 향후 보안 및 공공 안전 분야에서 기지국 역할 확대가 기대된다. 기술 리더십을 입증하기 위한 전략적 행보이다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 차세대 기술"}, {"title": "브로드컴 “AI칩 매출 3배↑”… 삼성 수혜 기대감 커진다", "summary": "디지털타임스는 브로드컴이 맞춤형 AI 가속기와 AI 네트워크 반도체 수요 급증으로 호실적을 기록한 가운데, 삼성전자와의 협력 가능성이 다시 주목받고 있다고 보도했다. 빅테크의 AI 인프라 투자 확대로 인해 AI 네트워크 칩 및 파운드리 협업 기회가 확대되고 있다. 글로벌 반도체 및 네트워크 부품 생태계의 공급망 변화를 보여준다. 삼성전자 네트워크사업부 및 반도체 부문의 수혜 기대감을 높이는 요인이다.", "source": "dt.co.kr", "date": "2026-09-03 08:45", "url": "https://www.dt.co.kr/article/12081849?ref=naver", "category": "contract", "importance": 4, "wl": false, "topic": "디지털타임스 브로드컴 ai칩 실적과 삼성전자 수혜"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "서울경제는 글로벌 통신장비사 에릭슨이 오는 연말 한국에서 드론 실시간 추적 통신 기술(ISAC)을 공개할 예정이라고 보도했다. 한국 정부와 국내 기업을 상대로 6G와 AI가 결합된 차세대 기술력을 적극 알리고 협력 방안을 모색한다. 에릭슨은 뛰어난 기술 효율성을 내세우며 한국 시장에서의 영향력 유지를 꾀하고 있다. 삼성전자 네트워크사업부의 주요 경쟁사인 에릭슨의 국내 마케팅 및 기술 전략을 보여주는 핵심 정보로 중요도 4에 해당한다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "서울경제 에릭슨 연말 한국 드론 실시간 추적 6g 기술 공개"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "이데일리는 에릭슨 코리아가 AI-RAN, ISAC(통신·레이더 융합), 차별화된 커넥티비티로 이어지는 6G 기술 리더십 청사진을 제시했다고 보도했다. 에릭슨은 AI 시대의 경쟁력이 네트워크에서 시작된다며 한국 파트너들과의 협력을 강조했다. 글로벌 장비사의 차세대 기술 전략을 파악할 수 있는 중요한 발표다. 삼성전자 네트워크사업부의 글로벌 기술 경쟁 구도에 직접적인 시사점을 준다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "이데일리 에릭슨 ai-ran isac 6g 청사진 제시"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "전자신문은 에릭슨이 한 번의 전파 송출로 고속 데이터 전송과 주변 사물의 위치·속도·형상을 동시에 탐지하는 6G 통신 신기술(ISAC)을 공개했다고 보도했다. 통신용과 레이더용 주파수를 따로 할당할 필요 없이 하나의 기지국 장비로 두 기능을 수행할 수 있는 혁신 기술이다. 에릭슨의 차세대 무선 접속망 기술 리더십을 보여준다. 삼성전자 네트워크사업부의 R&D 및 기술 전략 수립에 강력한 경쟁 지표가 된다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 4, "wl": false, "topic": "전자신문 에릭슨 기지국 드론 탐지 6g isac 신기술"}, {"title": "Samsung wins ZTE 5G patent case, raising difficult questions for UK courts - IAM Patent", "summary": "삼성전자가 화웨이와의 5G 특허 소송에서 승소하며 영국 법원에 까다로운 과제를 남겼다. 글로벌 통신 특허 공방에서 중요한 선례가 될 것으로 보인다. 양사 간 기술 라이선스 협상에 큰 영향을 미칠 전망이다. 지식재산권 확보의 중요성을 보여주는 대표적 사례다.", "source": "IAM Patent", "date": "2026-09-01 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "contract", "importance": 4, "wl": false, "topic": "삼성전자 특허 소송"}, {"title": "Nokia deploys Gibabit Connect with InCoax MoCA Access for apartments on Sjoberg's network ", "summary": "노키아가 아파트 단지 네트워크를 위해 기가비트 커넥트 솔루션을 공급하고 구축을 완료했다.", "source": "Telecompaper", "date": "2026-09-03 19:44", "url": "https://www.telecompaper.com/news/nokia-deploys-gibabit-connect-with-incoax-moca-access-for-apartments-on-sjobergs-network-in-minnesota--1581634", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 장비 공급"}, {"title": "Nokia and BeeHealthy target healthcare with network verification - Telecoms", "summary": "노키아가 네트워크 검증 기술을 활용해 디지털 헬스케어 서비스 보안과 접근성을 강화한다.", "source": "Telecoms", "date": "2026-09-03 19:24", "url": "https://www.telecoms.com/network-software/nokia-and-beehealthy-target-healthcare-with-network-verification", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 헬스케어 기술"}, {"title": "우리넷, KOREN 기반 AI 광네트워크 실증 착수 - 디일렉", "summary": "우리넷이 KOREN 기반의 AI 광네트워크 실증 사업에 착수하며 기술력을 과시했다.", "source": "디일렉", "date": "2026-09-03 19:08", "url": "https://www.thelec.kr/news/articleView.html?idxno=61790", "category": "tech", "importance": 3, "wl": false, "topic": "우리넷 기술 개발"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "통신장비 업체 화웨이 를 비롯해 숏폼·AI 기업 콰이서우, 전자상거래 업체 알리바바, 미국 애플 등이 이 지역에 컴퓨팅 시설 관련 투자를 진행한 바 있습니다. 바이트댄스가 추진하는 데이터센터의 투자 규모가...", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Nokia opens AI research centre in Riyadh - fibre-systems.com", "summary": "노키아가 사우디아라비아 리야드에 AI 연구 센터를 개소하며 현지 네트워크 자동화 연구를 확대한다.", "source": "fibre-systems.com", "date": "2026-09-03 17:50", "url": "https://www.fibre-systems.com/article/nokia-opens-ai-research-centre-riyadh", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 기술 r&d"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "서울경제TV는 알에프텍이 5G 통신 장비와 방산 RF 기술 경쟁력을 강화하기 위해 연구개발(R&D) 조직을 별도 자회사 'RFTC'로 분리한다고 보도했다. 5G 안테나 및 필터 기술의 독립적 플랫폼 고도화가 목적이다. 통신 장비 시장의 변화에 맞춰 전문성을 높이고 사업 다각화를 추진한다. 중견 통신장비 업체의 조직 개편 및 R&D 역량 집중 전략을 보여준다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "other", "importance": 3, "wl": false, "topic": "알에프텍 r&d 조직 자회사 분리"}, {"title": "알에프텍 “드론 막는 RF기술력 강화”", "summary": "헤럴드경제는 알에프텍이 드론 방어 등 방산 RF 기술과 5G 통신 장비 사업 확대를 위해 자회사 RFTC를 출범한다고 보도했다. 기존 5G 안테나 기술을 기반으로 응용 분야를 방산 시장으로 넓히고 있다. 전문화된 조직 운영을 통해 기술 경쟁력을 제고할 방침이다. 통신장비 부품 업계의 신사업 진출 흐름을 나타낸다.", "source": "biz.heraldcorp.com", "date": "2026-09-03 15:27", "url": "https://biz.heraldcorp.com/article/10861859?ref=naver", "category": "other", "importance": 3, "wl": false, "topic": "헤럴드경제 알에프텍 자회사 rftc 설립"}, {"title": "알에프텍, RF 전문 자회사 'RFTC' 출범", "summary": "아시아경제는 알에프텍이 5G 통신장비 및 방산 RF R&D 조직을 'RFTC'로 분리 독립시켜 본격적인 운영에 돌입한다고 보도했다. 이달 중 법인 설립 절차를 마무리하고 사업 영역을 확장한다. 5G 안테나·필터 기술의 플랫폼화를 통해 수주 경쟁력을 강화한다. 통신장비 전문 기업의 효율성 제고 조치다.", "source": "newspim.com", "date": "2026-09-03 15:25", "url": "https://www.newspim.com/news/view/20260903000886", "category": "other", "importance": 3, "wl": false, "topic": "아시아경제 알에프텍 rf 전문 자회사 출범"}, {"title": "알에프텍, RF 전문 자회사 'RFTC' 출범… 5G ·방산 사업 본격 확대", "summary": "아시아경제는 알에프텍이 5G 통신장비 경쟁력 강화를 위해 R&D 조직을 자회사로 분리했다고 전했다. 5G 안테나·필터 분야의 기술 고도화와 신규 시장 개척이 주요 목표다. 전문 자회사를 통한 신속한 의사결정 체계를 구축한다. 통신장비 시장 내 입지 강화를 위한 포석이다.", "source": "view.asiae.co.kr", "date": "2026-09-03 14:23", "url": "https://view.asiae.co.kr/article/2026090314231334445", "category": "other", "importance": 3, "wl": false, "topic": "아시아경제 알에프텍 rftc 자회사 출범"}, {"title": "국내외 통신사 CAPEX 절감 및 인프라 투자 정체… 통신 장비 테마 약세 흐...", "summary": "핀포인트뉴스는 국내외 통신사들의 CAPEX(설비투자) 절감과 인프라 투자 정체로 인해 통신 장비 테마가 약세를 보이고 있다고 진단했다. 단순한 5G 망 구축 수혜에서 벗어나 데이터센터, 위성통신, 6G 등 새로운 성장 분야에서의 실제 수주와 매출 확보가 중요해졌다. 통신장비 제조사들이 사업 다각화와 차세대 기술 개발에 사활을 걸고 있는 이유다. 업계 전반의 투자 기조 변화를 보여주는 분석 기사다.", "source": "pinpointnews.co.kr", "date": "2026-09-03 14:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=483544", "category": "other", "importance": 3, "wl": false, "topic": "핀포인트뉴스 통신사 capex 절감 및 장비 테마 약세"}, {"title": "알에프텍, 5G 기술 방산으로 확대…RF 자회사 'RFTC' 출범", "summary": "파이낸셜뉴스는 알에프텍이 과거 삼성전자에 5G 안테나 필터 유닛과 Massive MIMO 기지국용 안테나(AU)를 공급하며 장비 시장에 진입했다고 보도했다. 탄탄한 설계 및 제조 검증 역량을 바탕으로 최근 RF R&D 조직을 자회사 RFTC로 분리해 방산 및 5G 사업을 확대한다. 삼성전자와의 협력 이력이 회사의 기술력 기반이 되었음을 보여준다. 통신장비 부품 생태계의 동향을 파악할 수 있는 기사다.", "source": "fnnews.com", "date": "2026-09-03 13:41", "url": "https://www.fnnews.com/news/202609031334337249", "category": "other", "importance": 3, "wl": false, "topic": "파이낸셜뉴스 알에프텍 삼성전자 협력 및 방산 확대"}, {"title": "Can Nokia's Saudi AI Network Automation Expansion Drive Growth? - Yahoo Finance Singapore", "summary": "노키아의 사우디 AI 네트워크 자동화 사업 확장이 향후 기업 성장을 견인할지 분석한다.", "source": "Yahoo Finance Singapore", "date": "2026-09-03 00:53", "url": "https://sg.finance.yahoo.com/news/nokias-saudi-ai-network-automation-155300075.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai 전략"}, {"title": "NTT's Transatel brings eSIM Bootstrap service to Samsung Galaxy Z phones - Telecompaper", "summary": "NTT 트랜사텔이 삼성 갤럭시 Z 시리즈에 eSIM 부트스트랩 서비스를 새롭게 지원한다.", "source": "Telecompaper", "date": "2026-09-03 00:02", "url": "https://www.telecompaper.com/news/ntts-transatel-brings-esim-bootstrap-service-to-samsung-galaxy-z-phones--1581526", "category": "contract", "importance": 3, "wl": false, "topic": "삼성전자 제휴 협력"}, {"title": "Ericsson adaptive inventory", "summary": "에릭슨이 AI 및 자율 네트워크 시대를 맞아 '에릭슨 어댑티브 인벤토리(EAI)' 솔루션 프로필을 업데이트했다. 운영 데이터의 자율성을 높이고 AI 모델 구동을 뒷받침하는 핵심 기술이다. 통신 장비업계의 지능형 네트워크 관리 체계 고도화 트렌드를 반영한다.", "source": "RCR Wireless", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-C ropped", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "한화투자證 “반도체 테스트 장비 발주 급증⋯삼성전자 HBM4 약진 연쇄효과” - v.daum.net", "summary": "반도체 테스트 장비 발주가 급증하며 삼성전자의 HBM4 약진과 연쇄적인 수혜가 기대된다.", "source": "v.daum.net", "date": "2026-09-02 07:50", "url": "https://v.daum.net/v/20260902075004698", "category": "earnings", "importance": 3, "wl": false, "topic": "반도체 장비 실적"}, {"title": "Nokia Bell Labs sees bells toll in downsizing and wind-down of future network vision - SDx", "summary": "노키아 벨연구소가 미래 네트워크 비전 축소와 함께 조직 슬림화 및 구조조정에 착수했다.", "source": "SDxCentral", "date": "2026-09-01 23:01", "url": "https://www.sdxcentral.com/news/nokia-bell-labs-sees-bells-toll-in-downsizing-and-wind-down-of-future-network-vision/", "category": "exec", "importance": 3, "wl": false, "topic": "노키아 조직 개편"}], "policy": [{"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "머니투데이는 과기정통부와 이동통신 3사가 민관협의체를 통해 네트워크 및 AIDC(AI 데이터센터) 투자 환경 개선을 위한 패키지 지원을 논의했다고 보도했다. 3G 종료를 허용하고 5G·6G 투자를 촉진하기 위한 규제 완화가 검토된다. 통신사의 투자 여력을 확충하기 위한 정책적 지원 방안이 핵심 의제로 다뤄졌다. 삼성전자 네트워크사업부의 국내 영업 환경에 큰 영향을 미치는 정책 변화다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 4, "wl": false, "topic": "머니투데이 이통3사 세제 주파수 규제 패키지 개선 요구"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "바이라인네크워크는 통신사들이 3G 등 레거시 네트워크 유지 비용 부담 속에서 5G SA와 6G 투자를 병행하는 것은 비효율적이라며 정부 지원을 호소했다고 보도했다. 과기정통부는 새로운 네트워크 투자 편익을 높이기 위한 제도 개선을 민관협의체에서 논의하겠다고 밝혔다. 레거시 정산과 차세대 인프라 투자를 연계하는 방안이 검토 중이다. 통신 장비 시장의 투자 활성화 여부를 가를 정책적 이슈다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 4, "wl": false, "topic": "바이라인네트워크 네트워크 고도화 정부 지원 호소"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "테크M은 학계와 업계 전문가들이 통신사의 AI 네트워크(NW) 투자를 촉진하기 위해 망 중립성 가이드라인 정비, 주파수 할당 대가 및 전파사용료 인하 등 파격적인 인센티브가 필요하다고 제언했다고 보도했다. 통신사의 투자 부담을 덜어주어야 AI 인프라 구축이 본궤도에 오른다는 분석이다. 정부의 정책적 결단이 요구되는 핵심 쟁점이다. 장비 제조사들의 수주 환경에 결정적 영향을 미친다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 4, "wl": false, "topic": "테크m 통신사 ai nw aidc 투자비 지원 확대 촉구"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "토마토신문은 통신사가 매년 부담하는 주파수 할당 대가(약 8천억 원)와 전파사용료(약 2천억 원)의 부담을 완화하여 설비투자와 AI 인프라 투자로 연계해야 한다는 전문가 제언을 보도했다. 국회 토론회 등에서 통신망 투자 수익성 확보를 위한 규제 완화 목소리가 커지고 있다. 통신사의 CAPEX 여력을 확보하기 위한 필수 과제로 꼽힌다. 통신 장비 생태계 전반의 활성화로 이어질 수 있다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 4, "wl": false, "topic": "토마토신문 ai 시대 인프라 통신망 투자 유인 및 aidc 지원 촉구"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "디지털데일리는 통신사가 주파수 할당 대가, 전파사용료, 무선국 검사 수수료 등 연간 1조 원에 달하는 정책성 규제 비용을 부담하고 있다고 보도했다. 6G 상용화와 AI 네트워크 투자가 본격화되는 시점에서 이러한 비용 부담이 투자의 발목을 잡고 있다는 지적이다. 규제 비용 완화를 통해 투자 여력을 확보해야 한다는 업계의 목소리가 거세다. 통신 장비 시장의 수요 견인을 위한 핵심 정책 변수다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 4, "wl": false, "topic": "디지털데일리 통신사 연 1조원 규제비용 완화 요구"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "아이뉴스24는 AI 3대 강국 도약을 위해 주파수 할당 대가와 전파사용료 등 정책성 비용을 낮추고 민간 투자를 유인해야 한다는 현장 목소리를 보도했다. AIDC 투자 활성화를 위한 시행령 정교화 등 실효성 있는 대책이 요구된다. 정부의 규제 혁신이 선행되어야 실질적인 인프라 확충이 가능하다는 지적이다. 네트워크 및 데이터센터 장비 시장에 직간접적 파급효과를 낳는다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 4, "wl": false, "topic": "아이뉴스24 ai 3대 강국 도약 망 aidc 민간투자 유인 촉구"}, {"title": "[4th-AI] \"AI 3대 강국 가려면 통신망 규제 풀고 AIDC 지원 체계 손봐야\"", "summary": "포스포인트는 AI 3대 강국 도약을 위해 통신망 규제를 풀고 주파수 할당 대가 및 전파사용료 등 통신사 부담 비용을 투자 여력과 연계해 재검토해야 한다고 보도했다. 전파 관리 목적으로 걷는 비용의 타당성을 점검하고 실질적인 투자 인센티브를 제공해야 한다는 주장이다. 통신사의 설비투자 확대를 유도하는 정책적 전환점이다. 장비 제조사들의 영업 환경에 지대한 영향을 미친다.", "source": "4th.kr", "date": "2026-09-02 12:24", "url": "http://www.4th.kr/news/articleView.html?idxno=2117312", "category": "policy", "importance": 4, "wl": false, "topic": "포스포인트 통신망 규제 해소 및 aidc 지원 체계 정비 요구"}, {"title": "AI가 네트워크를 바꾼다…\"통신망 투자 수익성 확보해야\"", "summary": "코이트는 AI 시대에 발맞추어 통신사가 유무선 네트워크를 선제적으로 확충할 수 있도록 투자세액공제 확대 및 주파수·전파사용료 부담 완화 등 인프라 투자 인센티브를 마련해야 한다고 보도했다. 통신망 투자 수익성이 악화된 상황에서 정부의 세제 및 규제 지원이 절실하다는 입장이다. 통신 인프라 고도화의 촉매제 역할을 할 수 있다. 통신장비 업계의 숙원인 투자 활성화 정책과 맞닿아 있다.", "source": "koit.co.kr", "date": "2026-09-02 11:18", "url": "https://www.koit.co.kr/news/articleView.html?idxno=208798", "category": "policy", "importance": 4, "wl": false, "topic": "코이트 ai 네트워크 투자세액공제 및 규제 완화 제언"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 화웨이 제재가 부품 공급망까지 확전되면서 국내 통신 장비 업체들이 반사이익 기대감에 주목받고 있다. 글로벌 장비 시장의 탈중화 추세가 가속화하는 양상이다. 국내 부품사들에게는 새로운 기회 요인으로 작용한다. 정책적 리스크가 공급망 재편을 이끌고 있다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 제재 조치"}, {"title": "AT&T ditching phone landlines, members of Congress call on FCC to block - Substack", "summary": "AT&T가 전통 유선 전화망 철수를 추진하는 가운데 미 의회 의원들이 FCC에 이를 저지해달라고 촉구했다. 통신사의 공공 서비스 의무를 둘러싼 규제 당국과의 갈등이 고조되고 있다. 가입자 권익 보호와 망 현대화 간의 마찰을 보여준다. 향후 통신 규제 정책에 중요한 변수가 된다.", "source": "Substack", "date": "2026-09-02 02:42", "url": "https://substack.com/app-link/post?publication_id=8143692&post_id=212742975&utm_source=post-email-title&utm_campaign=email-post-title&isFreemail=true&r=8eo9l&token=eyJ1c2VyX2lkIjoxNDEyMTU2MSwicG9zdF9pZCI6MjEyNzQyOTc1LCJpYXQiOjE3ODgyODQ1NDUsImV4cCI6MTc5MDg3NjU0NSwiaXNzIjoicHViLTgxNDM2OTIiLCJzdWIiOiJwb3N0LXJlYWN0aW9uIn0.ntnMdYlsDCD3ZGZc0sUQQrV7oCG_e6xiTZA0uoYjuuI", "category": "policy", "importance": 4, "wl": false, "topic": "at&t 규제 이슈"}, {"title": "최주희 티빙 대표, 사이버 침해사고 공식사과…\"보안 투자 4배 확대 rces say Elliott builds stake, opposes T-Mobile deal - ", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤의 지분을 확보하고 미국 자회사 T-모바일 관련 거래에 반대 입장을 표명했다는 소식에 도이치텔레콤 주가가 상승했습니다. 주요 주주의 경영 개입 가능성이 대두되면서 향후 그룹의 전략적 의사결정에 큰 파장이 예상됩니다. T-모바일 합병 및 구조조정 계획에 제동이 걸릴 수 있다는 전망이 나오고 있습니다. 최고경영진의 대응과 주주 간 갈등이 업계의 핵심 이슈로 부각되었습니다.", "source": "tradingview.com", "date": "2026-09-03 17:21", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N44V0JM:0-deutsche-telekom-shares-rise-as-sources-say-elliott-builds-stake-opposes-t-mobile-deal/", "category": "exec", "importance": 5, "wl": false, "topic": "도이치텔레콤 주가 상승 및 엘리엇 지분 인수"}, {"title": "통신3사, “AI 네트워크는 국가 전략 인프라, 지원책 절실” 한목소리", "summary": "전기신문 등은 국내 통신 3사가 5G SA와 6G 등 차세대 네트워크 투자가 시급하지만 시장 성정 정체로 수익 창출이 어렵다며 목소리를 높였다고 보도했다. AI 네트워크를 국가 전략 인프라로 지정하고 정부의 적극적인 정책적·재정적 지원이 필요하다고 촉구했다. 네트워크 정책의 관점을 규제에서 투자 활성화로 전환해야 한다는 주장이다. 삼성전자 네트워크사업부의 국내 장비 공급 환경과 직결되는 중요한 정책적 동향이다.", "source": "kidd.co.kr", "date": "2026-09-03 17:40", "url": "https://kidd.co.kr/news/247290", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai 네트워크 국가 전략 인프라 지원 촉구"}, {"title": "SKT·KT·LGU+, 정부에 '네트워크 투자' 지원 촉구", "summary": "블로터는 국내 이동통신 3사가 정부에 AI 네트워크와 6G 투자에 대한 실질적인 지원을 촉구했다고 보도했다. 기술 개발에 머무르지 않고 현장 실증과 초기 수요, 실제 투자로 이어지는 생태계 조성이 필요하다는 입장이다. 통신사의 설비투자 여력이 차세대 망 전환의 성패를 가른다. 정부의 통신 정책 방향에 큰 영향을 미칠 업계의 요구사항이다.", "source": "bloter.net", "date": "2026-09-03 15:58", "url": "https://www.bloter.net/news/articleView.html?idxno=672549", "category": "policy", "importance": 4, "wl": false, "topic": "블로터 통신3사 네트워크 및 6g 투자 지원 촉구"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "프레스9은 SK텔레콤과 LG유플러스 등 국내 통신사들이 망 투자 재개를 검토하는 가운데, 정부의 AI-RAN 사업에 참여해 삼성전자·에릭슨·노키아 등과 실증을 진행한다고 보도했다. AI-RAN은 기지국과 AI를 결합해 네트워크 운영 효율을 극대화하는 차세대 기술이다. 통신사들의 설비투자(CAPEX) 방향성과 장비 공급사 간의 협력 구도를 보여준다. 삼성전자 네트워크사업부의 국내 실증 및 수주 환경에 직접적인 영향을 미치는 주요 소식이다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "contract", "importance": 4, "wl": false, "topic": "프레스9 skt lgu+ 5g sa ai-ran 실증"}, {"title": "Elliott builds stake in Deutsche Telekom - Bilyonaryo Business", "summary": "행동주의 펀드 엘리엇이 독일의 대형 통신사 도이치텔레콤의 지분을 대거 매입하며 지배구조 개편 압박에 나섰다. 유럽 최대 통신사의 경영 전략과 향후 M&A 구도에 중대한 변수로 작용할 전망이다. 통신 업계 전반의 대형 투자자 동향으로 주목받고 있다. 향후 경영진과의 마찰 가능성이 제기된다.", "source": "Bilyonaryo Business", "date": "2026-09-03 12:38", "url": "https://bilyonaryo.com/elliott-builds-stake-in-deutsche-telekom/", "category": "contract", "importance": 4, "wl": false, "topic": "도이치텔레콤 지분 인수"}, {"title": "Elliott Builds Stake in Deutsche Telekom Amid T-Mobile Merger Talks - Global Banking & Fin", "summary": "글로벌 뱅킹 앤 파이낸스 리뷰는 행동주의 펀드 엘리엇(Elliott)이 T-모바일과의 합병 협상 소속 속에 도이치텔레콤(Deutsche Telekom)의 지분을 대거 매입했다고 보도했다. 글로벌 통신 시장에서 대형 통신사 간의 인수합병 및 지배구조 개편 논의가 활발해지고 있다. 엘리엇의 개입으로 인해 도이치텔레콤의 경영 전략에 변화가 예상된다. 유럽과 미국을 잇는 거대 통신 자본의 움직임으로 업계의 주시를 받고 있다.", "source": "Global Banking & Finance Review", "date": "2026-09-03 10:18", "url": "https://www.globalbankingandfinance.com/elliott-built-stake-deutsche-telekom-opposes-t-mobile-merger/", "category": "contract", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분 인수 및 합병설"}, {"title": "CHTR Stock Pops As Spectrum, Cox, Liberty Deals Reshape Charter - timothysykes.com", "summary": "차터커뮤니케이션즈가 스펙트럼, 콕스 등과의 연쇄적인 딜을 통해 업계 내 영향력을 대폭 확대하고 있다. 미 케이블 및 브로드밴드 시장의 판도를 뒤흔드는 대형 M&A 구도가 형성되고 있다. 대규모 인수합병을 통해 규모의 경제를 달성하려는 전략이다. 통신 방송 시장의 경쟁 지형 재편이 예상된다.", "source": "timothysykes.com", "date": "2026-09-03 05:47", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02-2/", "category": "contract", "importance": 4, "wl": false, "topic": "차터커뮤니케이션즈 m&a"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "KDDI가 7GHz 대역에서 세계 최고 수준인 3.6 Gbps 옥외 전송을 달성했다. 이는 차세대 6G 후보 주파수를 활용한 실증 성과다. 일본 내 초고속 무선 통신 기술 경쟁력을 입증했다. 향후 상용망 적용을 위한 기술적 발판을 마련했다.", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 기술 개발"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "딜사이트는 통신사들이 AI-RAN, 6G 등 차세대 네트워크 투자 확대와 관련해 기존 기지국 중심의 CAPEX 평가 지표를 보완해야 한다고 목소리를 높였다고 보도했다. 개방형 시설에 대한 세액공제 요건 완화 등 현실적인 지원책이 논의되고 있다. 통신사의 투자 유인을 높이기 위한 제도적 정비가 요구되는 시점이다. 장비 제조사들의 수주 환경 개선과 직결된다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 4, "wl": false, "topic": "딜사이트 통신사 ai-ran 6g 투자 지표 보완 요구"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "매일경제는 5년 뒤 AI 트래픽이 최대 5배 폭증할 것으로 예상됨에 따라 5G SA, AI-RAN, 6G 등 네트워크를 국가 AI 인프라로 육성해야 한다는 주장이 제기되었다고 보도했다. 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토하겠다고 화답했다. 통신망 투자를 촉진하기 위한 종합적인 지원 패키지가 추진된다. 국내 통신장비 시장에 긍정적인 모멘텀이 될 수 있다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 4, "wl": false, "topic": "매일경제 네트워크 국가 ai 인프라 격상 및 지원 검토"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "디지털데일리는 통신 3사가 망 투자는 늘어나지만 수익 창출이 어려운 구조 속에서 SA와 6G 투자 효율성을 높이기 위해 정책 재정립을 요구했다고 보도했다. 3G 종료 등 불필요한 레거시 유지 비용을 줄이고 차세대 망 전환에 집중할 수 있는 환경이 필요하다는 지적이다. 과기정통부도 통신사의 새로운 네트워크 투자 여력을 늘리기 위한 방안을 검토 중이다. 통신 장비 투자의 향방을 결정할 정책적 변화다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 4, "wl": false, "topic": "디지털데일리 통신3사 ai 시대 네트워크 정책 재정립 요구"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "아시아타임즈는 SK텔레콤이 통신 본업을 회복하는 가운데, 신규 주파수 할당, 5G 요금제 개편, 5G SA 상용화와 더불어 AI 기지국 보급 확대 정책이 논의될 전망이라고 보도했다. AI의 양대 축인 데이터센터와 기지국 투자가 맞물려 진행되고 있다. 통신사의 망 고도화 전략이 장비 수주로 이어질 가능성이 높다. 삼성전자 네트워크사업부의 국내 장비 공급 기회와 직결되는 핵심 내용이다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "contract", "importance": 4, "wl": false, "topic": "아시아타임즈 skt 신규 주파수 5g sa ai 기지국 보급"}, {"title": "Debt Reduction Meets Digital Ambition: Inside The Structure Of Jio Platforms’ Mega IPO - i", "summary": "인도 지오플랫폼이 부채 감축과 디지털 사업 확장을 목표로 메가 IPO(기업공개) 구조를 구체화하고 있습니다. 대규모 자금 조달을 통해 5G 및 디지털 인프라 투자를 가속화할 계획입니다. 이번 상장은 인도 통신 및 기술 시장에서 역대급 규모의 자본 거래로 기록될 가능성이 높습니다. 향후 상장 완료 시 지오의 시장 지배력은 더욱 공고해질 전망입니다.", "source": "inventiva.co.in", "date": "2026-09-01 19:56", "url": "https://www.inventiva.co.in/stories/debt-reduction-meets-digital-ambition-inside-the-structure-of-jio-platforms-mega-ipo/", "category": "earnings", "importance": 4, "wl": false, "topic": "지오플랫폼 ipo 추진"}, {"title": "Deutsche Telekom : reorganizes leadership functions - marketscreener.com", "summary": "도이치텔레콤이 리더십 기능을 전면 개편하며 조직 체계를 정비했습니다. 급변하는 디지털 환경에 맞춰 효율적인 의사결정 구조를 구축하기 위한 조치입니다. 주요 임원들의 역할 조정은 향후 회사의 장기 성장 전략에 직접적인 영향을 미칠 것입니다. 시장은 이번 경영진 쇄신이 실적과 주가에 미칠 긍정적 효과를 기대하고 있습니다.", "source": "marketscreener.com", "date": "2026-09-03 19:15", "url": "https://www.marketscreener.com/news/deutsche-telekom-reorganizes-leadership-functions-ce7858d3de81f120", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영진 개편"}, {"title": "우리넷, KOREN 기반 AI 광네트워크 실증 착수", "summary": "전자신문은 우리넷이 KOREN(한국첨단연구망)을 기반으로 한 AI 광네트워크 실증에 착수했다고 보도했다. 후속 과제인 '6G 수십테라급 초정밀 전달망 시스템 기술 개발'과 연계해 기술 고도화를 추진한다. 기존 광전송망과 통신장비 기술 역량을 바탕으로 사업 영역을 넓히고 있다. AI 데이터센터 및 차세대 통신망 인프라 구축에 기여할 전망이다.", "source": "thelec.kr", "date": "2026-09-03 19:10", "url": "https://www.thelec.kr/news/articleView.html?idxno=61790", "category": "contract", "importance": 3, "wl": false, "topic": "전자신문 우리넷 koren 기반 ai 광네트워크 실증"}, {"title": "Vodafone has the best and fastest 5G network in Romania, according to Ookla - Business Rev", "summary": "오클라(Ookla)의 조사 결과 보다폰이 루마니아에서 가장 우수하고 빠른 5G 네트워크를 보유한 통신사로 선정되었습니다. 지속적인 네트워크 품질 투자가 객관적인 지표로 입증되면서 브랜드 가치가 상승했습니다. 고품질 5G 서비스는 가입자 유치와 유지에 결정적인 경쟁 우위 요소입니다. 이번 평가는 보다폰의 루마니아 시장 내 리더십을 더욱 공고히 할 것입니다.", "source": "Business Review", "date": "2026-09-03 19:01", "url": "https://business-review.eu/tech/telecom/vodafone-has-the-best-and-fastest-5g-network-in-romania-according-to-ookla-300026", "category": "other", "importance": 3, "wl": false, "topic": "보다폰 루마니아 5g 네트워크 평가"}, {"title": "울산 시내버스 762대 차세대 와이파이로 전면 교체", "summary": "울산매일은 울산시가 시내버스 762대의 노후 와이파이 장비를 철거하고 5G 백홀 기반의 차세대 와이파이 7 장비로 전면 교체한다고 보도했다. 기존에 혼재되어 있던 장비를 단일화하여 통신 품질을 대폭 향상시키고 실시간 장애 대응 효율을 높인다. 통신사 백본망과 연계된 공공 인프라 고도화 사업의 모범 사례다. 공공 와이파이 시장에서의 장비 공급 및 인프라 업그레이드 수요를 보여준다.", "source": "iusm.co.kr", "date": "2026-09-03 18:20", "url": "https://www.iusm.co.kr/news/articleView.html?idxno=1067423", "category": "contract", "importance": 3, "wl": false, "topic": "울산시 시내버스 762대 와이파이 7 전면 교체"}, {"title": "울산 시내버스, 10월부터 '와이파이 7'로 전면 교체", "summary": "CNB뉴스는 울산시가 10월부터 관내 시내버스 전체 762대의 노후 통신 장비를 철거하고 5G 백홀 기반 와이파이 7로 교체한다고 보도했다. 대중교통 이용객들에게 끊김 없고 빠른 무선 인터넷 환경을 제공한다. 통신 품질 향상과 더불어 실시간 장애 대응 능력이 강화된다. 지자체의 대규모 공공 통신 인프라 개선 사업이다.", "source": "cnbnews.com", "date": "2026-09-03 17:58", "url": "https://www.cnbnews.com/news/articleView.html?idxno=1014302", "category": "contract", "importance": 3, "wl": false, "topic": "cnb뉴스 울산 시내버스 와이파이 7 교체"}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "우리넷이 국책과제로 개발한 16Tbps급 패킷-광-전달망 시스템을 NIA의 'KOREN 기반 AI NETWORK 장비 시범도입 실증' 사업을 통해 실제 운용 환경에서 검증한다. 국산 장비의 고속 네트워크 상용화 시험대로서 의미가 크다. AI 트래픽 급증에 대응하는 전송 장비 기술력 확보의 계기가 될 전망이다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "tech", "importance": 3, "wl": true, "topic": "우리넷 16tbps 국산 ai 네트워크 장비"}, {"title": "플리토, 육군에 AI 민원상담 구축…장병·국민 문의 24시간 대응", "summary": "플리토가 이스트소프트, 와이즈넛과 컨소시엄을 구성해 육군과 'AI 기반 민원상담체계 개발' 업무협약을 체결했다. 군 폐쇄망에서도 작동하는 AI를 도입하여 장병과 국민의 민원을 24시간 처리한다. 국방 분야의 AI 전환(AX) 가속화 사례로 주목받는다.", "source": "ZDNet Korea", "date": "2026-09-03 17:36", "url": "https://zdnet.co.kr/view/?no=20260903173519", "category": "contract", "importance": 3, "wl": true, "topic": "플리토 육군 ai 민원상담 구축"}, {"title": "[포스트 오라클] 기업은행도 선택한 EDB…안정성으로 승부", "summary": "블로터는 기업은행을 비롯한 국내 대형 자동차 제조사와 통신사가 업무 시스템의 데이터베이스(DB)를 오라클에서 국산 및 오픈소스 기반 EDB로 전환하고 있다고 보도했다. 장애 발생 시 정해진 시간 내 해결하는 서비스수준목표(SLO)를 적용하여 안정성을 확보한다. 통신사의 IT 인프라 및 내부 전산 시스템 개편 동향을 보여준다. 기업용 소프트웨어 및 인프라 시장의 변화를 나타낸다.", "source": "bloter.net", "date": "2026-09-03 17:33", "url": "https://www.bloter.net/news/articleView.html?idxno=672659", "category": "contract", "importance": 3, "wl": false, "topic": "블로터 기업은행 및 통신사 오라클 edb db 전환"}, {"title": "LIG아큐버, LG유플러스와 291억원 규모 Core Probe 공급 계약 - 데이터투자", "summary": "LIG아큐버가 LG유플러스와 291억 원 규모의 코어 프로브(Core Probe) 공급 계약을 체결했습니다. 이번 계약은 통신망 코어 네트워크의 성능 모니터링과 품질 관리를 고도화하기 위한 대규모 투자입니다. 안정적인 통신 서비스 제공과 트래픽 분석 역량을 강화하는 데 기여할 것입니다. 협력 업체를 통한 통신 인프라 장비 조달이 차질 없이 진행되고 있습니다.", "source": "데이터투자", "date": "2026-09-03 17:27", "url": "https://www.datatooza.com/article/20260903172751600752ef3ef162_80", "category": "contract", "importance": 3, "wl": false, "topic": "lg유플러스 코어 프로브 공급 계약"}, {"title": "기업 사정 알려주자 AI 정답률 19%→81%…KT, 기업용 AI 정확도 높인 비결 [현장+] - 쿠키뉴스", "summary": "KT가 기업 사정을 정확히 반영한 데이터 체계를 도입함으로써 AI의 정답률을 19%에서 81%까지 대폭 끌어올렸습니다. 기업용 AI의 정확도와 신뢰성을 높인 비결은 맞춤형 데이터 학습과 맥락 이해에 있습니다. 이를 통해 B2B 고객들에게 실질적인 업무 효율성 향상을 제공할 수 있게 되었습니다. KT의 차별화된 AI 경쟁력을 입증하는 성과입니다.", "source": "쿠키뉴스", "date": "2026-09-03 16:58", "url": "https://www.kukinews.com/article/view/kuk202609030201", "category": "tech", "importance": 3, "wl": false, "topic": "kt 에이전틱 데이터 플로우 구축"}, {"title": "울산 시내버스 와이파이 업그레이드…10월 개통", "summary": "서울경제는 울산시가 5G 백홀망과 다중 링크 동작(MLO) 기술을 적용해 시내버스 와이파이 대역폭을 2배로 확충한다고 보도했다. 주말과 야간 시간을 활용해 장비를 순차 교체하여 버스 운행 차질을 방지한다. 디지털 시티 구현을 위한 공공 통신망 업그레이드 프로젝트다. 차세대 무선 규격 도입을 통한 통신 품질 개선 사례다.", "source": "sedaily.com", "date": "2026-09-03 16:57", "url": "https://www.sedaily.com/article/20086896?ref=naver", "category": "contract", "importance": 3, "wl": false, "topic": "서울경제 울산 시내버스 와이파이 업그레이드"}, {"title": "우리넷, NIA ‘AI 절감하고 차세대 통신에 집중할 수 있게 된다. 베트남 통신 시장의 세대교체 속도가 빨라질 전망이다.", "source": "Vietnam.vn", "date": "2026-09-03 12:05", "url": "https://www.vietnam.vn/ko/viet-nam-chinh-thuc-tat-hoan-toan-mang-2g-tu-ngay-15-9-2026-nham-giai-phong-tan-so-cho-5g", "category": "policy", "importance": 3, "wl": false, "topic": "베트남 2026년 9월 2g 네트워크 폐쇄 확정"}, {"title": "울산 시내버스, 10월부터 5G 기반 ‘와이파이 7’ 구축", "summary": "서울신문은 울산시가 시내버스 762대의 와이파이 장비를 5G 백홀 기반 와이파이 7로 일원화한다고 보도했다. 구축 시기가 달라 혼재되어 있던 장비를 통일하여 통신 품질을 높이고 실시간 장애 대응 효율성을 개선한다. 공공 교통 서비스의 질적 향상을 도모하는 프로젝트다. 통신 인프라 표준화의 좋은 예시를 제공한다.", "source": "seoul.co.kr", "date": "2026-09-03 11:53", "url": "https://www.seoul.co.kr/news/publicnews/2026/09/03/20260903500110?wlog_tag3=naver", "category": "contract", "importance": 3, "wl": false, "topic": "서울신문 울산시 시내버스 5g 와이파이 7 구축"}, {"title": "울산시 \"울산 시내버스 공공와이파이 빨라진다\"", "summary": "프레시안은 울산시가 관내 시내버스 762대의 공공와이파이를 와이파이 7로 전면 교체하여 통신 속도를 대폭 개선한다고 보도했다. 5G 백홀 기반의 최신 시스템 도입으로 버스 이용객들의 만족도가 높아질 전망이다. 실시간 장애 대응 효율성도 함께 개선된다. 지자체 중심의 공공 통신 인프라 업그레이드 소식이다.", "source": "pressian.com", "date": "2026-09-03 10:34", "url": "https://www.pressian.com/pages/articles/2026090310015248848?utm_source=naver&utm_medium=search", "category": "contract", "importance": 3, "wl": false, "topic": "프레시안 울산시 시내버스 공공와이파이 고도화"}, {"title": "울산 시내버스 762대 와이파이 싹 바꾼다…10월부터 '와이파이 7'", "summary": "문화뉴스는 울산시가 제각각이던 시내버스 와이파이 장비를 5G 백홀 기반의 데이터 전송 대역폭이 넓은 와이파이 7로 전면 교체한다고 보도했다. 이번 정비를 통해 다중 주파수 대역을 동시에 활용할 수 있게 된다. 통신 품질 향상과 안정적인 공공 서비스 제공이 가능해진다. 대중교통 와이파이 인프라의 대규모 개편 사업이다.", "source": "mhns.co.kr", "date": "2026-09-03 09:36", "url": "https://www.mhns.co.kr/news/articleView.html?idxno=758765", "category": "contract", "importance": 3, "wl": false, "topic": "문화뉴스 울산시 시내버스 762대 와이파이 교체"}, {"title": "울산시, 시내버스 와이파이 차세대 규격으로 전면 교체", "summary": "경상일보는 울산시가 서로 다른 장비로 운영되던 시내버스 762대의 노후 와이파이를 철거하고 5G 백홀 기반 와이파이 7로 교체한다고 보도했다. 통신 품질 향상은 물론 실시간 장애 대응 효율성도 크게 개선된다. 지자체 행정 서비스의 일환으로 대중교통 통신망이 업그레이드된다. 안정적인 공공 데이터 전송 환경이 조성된다.", "source": "ksilbo.co.kr", "date": "2026-09-03 09:32", "url": "https://www.ksilbo.co.kr/news/articleView.html?idxno=1066245", "category": "contract", "importance": 3, "wl": false, "topic": "경상일보 울산시 시내버스 와이파이 차세대 교체"}, {"title": "울산시, 10월부터 시내버스에서 끊김없이 인터넷 즐긴다", "summary": "연합뉴스는 울산시가 이종 무선 장비로 운영되던 시내버스 762대의 와이파이를 5G 백홀 기반 와이파이 7로 전면 교체한다고 보도했다. 백홀은 통신사 기지국과 버스 단말기를 잇는 전송로를 뜻한다. 끊김 없는 인터넷 환경을 구축하고 통신 장애 대응력을 높인다. 공공 와이파이 품질 개선의 모범 사례다.", "source": "newsis.com", "date": "2026-09-03 09:23", "url": "https://www.newsis.com/view/NISX20260902_0003773857", "category": "contract", "importance": 3, "wl": false, "topic": "연합뉴스 울산시 시내버스 와이파이 7 전면 교체"}, {"title": "울산 시내버스 와이파이 끊김 없이 더 빨라진다…762대 장비 교체", "summary": "뉴스1은 울산시가 노후된 시내버스 와이파이 장비를 5G 백홀 기반 장비로 전면 교체한다고 보도했다. 통신사 기지국 네트워크와 버스 단말기를 안정적으로 연결하는 전송로가 강화된다. 통신 품질을 높이고 실시간 장애 대응 효율을 극대화한다. 지자체의 대중교통 통신 환경 개선 사업이다.", "source": "news1.kr", "date": "2026-09-03 09:00", "url": "https://www.news1.kr/local/ulsan/6278080", "category": "contract", "importance": 3, "wl": false, "topic": "뉴스1 울산시 시내버스 와이파이 장비 교체"}, {"title": "Spectrum COO Nick Jeffery Touts \"The Great Cable Comeback\" As He Assumes Charter Exec Post", "summary": "스펙트럼의 최고운영책임자가 차터의 주요 경영진 직책을 맡으며 케이블 업계의 반격을 주도한다.", "source": "Deadline", "date": "2026-09-03 01:43", "url": "https://deadline.com/2026/09/charter-spectrum-coo-nick-jeffery-great-cable-comeback-1237064469/", "category": "exec", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 임원 인사"}, {"title": "Why is Charter Communications stock up 6.9% today? - Traders Union", "summary": "사업 규모 확장과 실적 기대감이 맞물려 차터커뮤니케이션즈의 주가가 큰 폭으로 상승했다.", "source": "Traders Union", "date": "2026-09-03 01:17", "url": "https://tradersunion.com/news/stocks/show/3197259-charter-surges-6-95percent-today-to/", "category": "earnings", "importance": 3, "wl": false, "topic": "차터커뮤니케이션즈 주가 상승"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "조선일보는 LG유플러스가 연세대학교와 함께 AI-RAN(인공지능 무선접속망) 네트워크 전환 기술 검증에 성공했다고 보도했다. 로봇과 드론 등 피지컬 AI 장비가 시험망과 5G 망을 오가는 상황에서 무선 환경 변화에 맞춰 최적의 네트워크를 자동 선택하는 기술이다. AI와 통신망을 융합하여 서비스 안정성을 높이는 차세대 기술이다. 통신사의 네트워크 고도화 연구 성과를 보여준다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "조선일보 lg유플러스 연세대 ai-ran 검증"}, {"title": "“삐, 공사장 탐지됐습니다”… AI가 미리 찾는 통신망 위험 - 동아일보", "summary": "동아일보는 인공지능(AI)을 활용해 공사장 등 통신망 주변의 위험 요소를 미리 찾아내는 지능형 관제 기술을 소개했다. 굴착 공사 등으로 인한 지하 통신 케이블 파손 사고를 예방하는 데 초점을 맞추고 있다. 통신사들은 AI 영상 분석과 센서 데이터를 결합하여 망 안정성을 높이고 있다. 통신 인프라의 무중단 운영을 위한 핵심 기술로 자리잡고 있다.", "source": "동아일보", "date": "2026-09-03 00:30", "url": "https://www.donga.com/news/Economy/article/all/20260902/134592397/2", "category": "tech", "importance": 3, "wl": false, "topic": "동아일보 ai 통신망 위험 사전 탐지 기술"}, {"title": "[봇규의 헬로BOT] ‘피지컬 AI 1강’으로 ② | 실증은 늘렸다, 근데 산업...", "summary": "헬로T는 제조, 물류, 로봇 등 실제 산업 현장에서 스스로 움직이는 피지컬 AI를 구현하기 위해 5G SA(단독모드)와 AI-RAN 기술의 중요성을 보도했다. 무선 접속망과 AI의 결합이 산업용 로봇의 자율성과 통신 안정성을 보장한다. 통신사들의 차세대 네트워크 구축 방향과 맞물려 있다. 스마트 팩토리 및 물류 혁신을 위한 필수 인프라로 꼽힌다.", "source": "hellot.net", "date": "2026-09-03 00:08", "url": "https://www.hellot.net/news/article.html?no=114727", "category": "tech", "importance": 3, "wl": false, "topic": "헬로t 피지컬 ai 위한 5g sa 및 ai-ran 구축"}, {"title": "DT hires AWS's Jan Hofmeyr as CTO", "summary": "도이치텔레콤이 AWS 임원인 얀 호프메이어를 2026년 11월 CTO로 영입하고, 크리스티안 일렉 CFO는 2027년 5월 퇴임한다고 밝혔다. 클라우드 전문 인력의 전진 배치를 통해 네트워크 인프라 혁신을 도모한다. 경영진 세대교체를 통해 통신 인프라와 클라우드 간 융합 전략이 가속화될 전망이다.", "source": "Light Reading", "date": "2026-09-02 23:47", "url": "https://www.lightreading.com/broadband/dt-hires-aws-s-jan-hofmeyr-as-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 임원 인사"}, {"title": "Verizon deploys Frontline Crisis Response teams in Indiana, Hawaii - Telecompaper", "summary": "버라이즌이 인디애나와 하와이 지역에 위기 대응 전담 팀을 긴급 파견해 통신 지원에 나섰다.", "source": "Telecompaper", "date": "2026-09-02 19:57", "url": "ht 폰아이디어 경영 전략"}, {"title": "스테이지파이브, 로플랫 인수…제4이통 대신 ‘AI 통신’으로 승부", "summary": "이데일리는 제4이통사 무산 이후 스테이지파이브가 위치 데이터 스타트업 '로플랫'을 인수하며 알뜰폰(MVNO)을 넘어 'AI 통신' 기업으로의 전환을 추진하고 있다고 보도했다. 주파수 할당 취소의 아픔을 딛고 AI와 결합된 새로운 통신 서비스를 모색하고 있다. 통신 시장의 플레이어 변화와 기술 융합 트렌드를 보여준다. 소규모 통신 사업자의 생존 전략을 나타낸다.", "source": "edaily.co.kr", "date": "2026-09-02 08:48", "url": "https://www.edaily.co.kr/News/Read?newsId=02794566645576184&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "contract", "importance": 3, "wl": false, "topic": "이데일리 스테이지파이브 로플랫 인수 ai 통신 전환"}, {"title": "[르포] “유선망 위험 요소 직접 포착”…도로 위 AI 감시자, SKT ‘톺다’ 차량 타보니 - 헤럴드경제", "summary": "헤럴드경제는 SK텔레콤이 도로 위에서 유선망의 위험 요소를 직접 포착하는 AI 감시 차량 '톺다'의 현장 시연을 보도했다. AI 카메라와 센서를 탑재해 맨홀 파손이나 공사장 위험을 실시간으로 감지한다. 기존 인력 중심의 점검 방식에서 벗어나 자동화된 예방 정비 체계를 구축했다. 통신망 신뢰도를 높이고 장애 발생 가능성을 선제적으로 차단하는 효과가 있다.", "source": "헤럴드경제", "date": "2026-09-02 08:31", "url": "https://mbiz.heraldcorp.com/article/10859567", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai 유선망 위험 감시 차량 톺다 도입"}, {"title": "Bharti Airtel Deploys 2,750+ New 5G Sites Across Gujarat in 12 Months - scanx.trade", "summary": "인도 통신사 바르티에어텔이 지난 12개월 동안 구자라트주 전역에 2,750개 이상의 신규 5G 기지국을 구축했습니다. 이번 투자는 5G 커버리지 확대를 통한 가입자 만족도 제고 및 데이터 트래픽 수용력 확충을 위한 것입니다. 경쟁사인 지오와의 네트워크 품질 경쟁에서 우위를 점하기 위한 전략적 행보입니다. 지속적인 네트워크 인프라 투자는 인도 전역의 5G 생태계 활성화에 기여할 것입니다.", "source": "scanx.trade", "date": "2026-09-02 07:54", "url": "https://scanx.trade/stock-market-news/companies/bharti-airtel-expands-5g-network-with-2-750-sites-in-gujarat-launches-399-unlimited-data-plan/35795045", "category": "contract", "importance": 3, "wl": false, "topic": "바르티에어텔 5g 기지국 구축"}, {"title": "T-Mobile's Hidden $25 Unlimited Plan Is Its Best Deal Yet - Yahoo Tech", "summary": "티모바일의 가성비 높은 숨겨진 무제한 요금제 상품이 소비자들이 꼽는 최고의 혜택으로 꼽혔다.", "source": "Yahoo Tech", "date": "2026-09-02 05:17", "url": "https://tech.yahoo.com/phones/deals/articles/t-mobiles-hidden-25-unlim   ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
