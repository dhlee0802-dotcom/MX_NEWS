<style>

  .art{padding:10px 0;border-top:1px solid var(--line)}

  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}

  .imp.i1{background:var(--low-bg);color:var(--low)}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}

</style>
</head>

 "https://simplywall.st/stocks/fi/tech/hel-nokia/nokia-oyj-shares/news/is-nokia-oyj-hlsenokia-a-bargain-following-its-ai-and-broadb", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai광대역"}, {"title": "Nokia, Ericsson, IBM, to Blackberry: How humbled tech giants reinvented for a comeback - i", "summary": "노키아, 에릭슨 등 과거의 거대 기술 기업들이 변화하는 시장 환경 속에서 어떻게 사업을 재편하고 부활을 모색하고 있는지 조명했다. 글로벌 통신장비 경쟁사들의 경영 전략 변화를 다룬 분석 기사다.", "source": "indianexpress.com", "date": "2026-09-06 17:07", "url": "https://indianexpress.com/article/explained/explained-economics/nokia-ericsson-ibm-blackberry-comeback-10865506/", "category": "exec", "importance": 3, "wl": false, "topic": "노키아 에릭슨 재기"}, {"title": "통신 장비 주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게", "summary": "3G에서 5G를 거치며 통신 장비 업체의 쏠림 현상이 심화된 가운데 엔비디아의 AI 기지국(AI-RAN) 시장 진출 등 장비 산업의 패러다임 변화를 진단했다. 국내외 통신장비 시장의 실적과 주가 괴리 현상을 분석했다. 통신장비 업계의 투자 전략에 시사점을 준다.", "source": "metroseoul.co.kr", "date": "2026-09-06 09:44", "url": "http://www.metroseoul.co.kr/article/20260906500019", "category": "earnings", "importance": 3, "wl": false, "topic": "통신장비주 시황"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "통신 임원들이 5G의 더 큰 사업 기회가 소비자 시장보다는 산업 자동화 영역에 있다고 평가했다. 글로벌 장비사들과 통신사들이 주도하는 B2B 5G 및 스마트팩토리 솔루션 전략 방향을 다룬다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "5g 산업용자동화"}, {"title": "Telecom news: InCoax Networks, Nokia, Sjoberg’s, Telit Cinterion, Array Digital Infrastruc", "summary": "인코액스 네트워크, 노키아, 텔릿 등 글로벌 통신 인프라 및 장비 업계의 최근 수주 및 기술 협력 동향을 전달했다. 노키아의 광통신 및 네트워크 솔루션 공급 관련 소식이 포함되어 있다.", "source": "telecomlead.com", "date": "2026-09-05 16:34", "url": "https://telecomlead.com/news/telecom-news-incoax-networks-nokia-sjobergs-telit-cinterion-array-digital-infrastructu ry": "인도 통신사 릴라이언스 지오가 설립 10주년을 맞아 글로벌 시장 진출 포부를 밝혔다. 아카시 암바니 회장은 인도 내에서 디지털 연결성을 혁신한 경험을 바탕으로 해외 시장으로 영역을 넓히겠다고 선언했다. 지오의 글로벌 전략은 향후 통신 장비 조달 및 해외 벤더 선정에 영향을 미칠 수 있다.", "source": "ET Telecom", "date": "2026-09-06 14:11", "url": "https://telecom.economictimes.indiatimes.com/news/industry/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market-akash-ambani/133826619", "category": "exec", "importance": 3, "wl": true, "topic": "릴라이언스지오 글로벌"}, {"title": "楽天モバイル、10月以降の国内ローミング継続を再案内 - blog of mobile", "summary": "라쿠텐 모바일이 10월 이후의 au 회선 로밍 서비스를 일부 지역에 한해 연장한다고 재차 안내했다. 자사 망의 한계를 보완하기 위한 통신사 간 협력 연장 조치다. 네트워크 인프라 전략의 중요한 대목이다.", "source": "blog of mobile", "date": "2026-09-06 13:40", "url": "http://blogofmobile.com/article/182651", "category": "other", "importance": 3, "wl": false, "topic": "블로그오브모바일 라쿠텐모바일 로밍 연장"}, {"title": "「繋がりづらくなる」懸念強まる楽天モバイル、終了予定のauローミングに言及「詰めの協議中」一部地域は継続へ (オタク総研) - Yahoo!ニュース", "summary": "라쿠텐 모바일의 au 로밍 종료 예정에 따른 연결성 저하 우려 속에서 회사가 10월 이후 일부 지역의 로밍을 지속한다고 밝힌 입장을 전했다. 가입자 이탈을 막기 위한 네트워크 유지 전략을 다룬다. 시장 관심 사안이다.", "source": "Yahoo!ニュース", "date": "2026-09-06 11:32", "url": "https://news.yahoo.co.jp/articles/8d1e07e48e08e059e7211418be7189a105ea32a2/images/000", "category": "other", "importance": 3, "wl": false, "topic": "오タク総研 라쿠텐모바일 로밍 우려"}, {"title": "「繋がりづらくなる」懸念強まる楽天モバイル、終了予定のauローミングに言及「詰めの協議中」一部地域は継続へ - オタク総研", "summary": "연결 품질 저하 우려를 낳고 있는 라쿠텐 모바일이 종료 예정이었던 au 로밍을 일부 지역에서 지속하기로 하고 현재 최종 협의를 진행 중인 정황을 보도했다. 망 커버리지 전략의 중대한 수정이다. 통신사 동향 파악에 중요하다.", "source": "オタク総研", "date": "2026-09-06 11:30", "url": "https://0115765.com/archives/203995", "category": "other", "importance": 3, "wl": false, "topic": "오タク総研 락텐모바일 au 로밍 연장"}, {"title": "SPCX Stock: SpaceX's Wireless Ambitions Fuel T-Mobile Acquisition Speculation - stocktwits", "summary": "스페이스엑스의 무선 통신 야망이 T모바일과의 인수합병 추측을 불러일으키고 있다. 위성과 지상파 통신 거인의 결합 가능성을 제기하는 시장의 관측이다. 대형 M&A 가능성으로 주시할 가치가 있다.", "source": "stocktwits.com", "date": "2026-09-06 10:40", "url": "https://stocktwits.com/news-artic s to 4G capability – Sam George - MyJoyOnline", "summary": "가나 정부가 모든 농어촌 통신망을 4G 역량으로 업그레이드할 계획이라고 밝혔다. 소외 지역의 모바일 브로드밴드 인프라를 확충한다. 통신 장비 공급 및 네트워크 현대화 사업이 추진된다. 디지털 격차 해소를 위한 국가 차원의 인프라 투자이다.", "source": "MyJoyOnline", "date": "2026-09-06 01:48", "url": "https://www.myjoyonline.com/govt-to-upgrade-all-rural-telephony-networks-to-4g-capability-sam-george/", "category": "contract", "importance": 3, "wl": false, "topic": "가나 통신망 업그레이드"}, {"title": "T-Mobile CEO appears to have given up on the postpaid crown as he talks up new categories ", "summary": "T모바일 CEO가 포스트페이드 시장 점유율 경쟁에서 물러나 새로운 사업 카테고리에 집중하겠다는 의사를 밝혔다. 최고경영자의 전략적 방향 수정과 신사업 진출 의도를 보여준다. 통신사 경영 전략 변화를 파악하는 데 중요하다.", "source": "PhoneArena", "date": "2026-09-06 01:32", "url": "https://www.phonearena.com/news/t-mobile-losing-share-value-under-srini-gopalan_id183107", "category": "exec", "importance": 3, "wl": false, "topic": "t모바일 ceo 전략 전환"}, {"title": "楽天モバイル、10月以降のローミングエリアについてユーザーに告知 「時間を要するエリアは、10月以降も継続」 - ASCII.jp", "summary": "라쿠텐 모바일이 10월 이후의 국내 로밍 영역 변경 계획을 사용자에게 안내하며 커버리지 구축에 시간이 걸리는 지역은 로밍을 연장한다고 발표했다. 망 전략의 변화와 가입자 서비스 연속성을 다룬다. 통신사 경영 전략 상 중요 정보이다.", "source": "ASCII.jp", "date": "2026-09-05 21:25", "url": "https://ascii.jp/elem/000/004/432/4432587/", "category": "other", "importance": 3, "wl": false, "topic": "라쿠텐모바일 로밍 지역 안내"}, {"title": "楽天モバイル、10月以降のローミングエリアについてユーザーに告知 「時間を要するエリアは、10月以降も継続」 (アスキー) - Yahoo!ニュース", "summary": "라쿠텐 모바일이 사용자를 향해 10월 이후에도 시간이 소요되는 일부 지역은 로밍 영역을 계속 유지하겠다고 공지한 내용을 다뤘다. 자체 망 확충 속도 조절에 따른 불가피한 조치다. 통신사 인프라 전략의 핵심 참고 자료다.", "source": "Yahoo!ニュース", "date": "2026-09-05 21:25", "url": "https://news.yahoo.co.jp/articles/3558537333ebadb393f93f5d6f74687c1698dca0/images/000", "category": "other", "importance": 3, "wl": false, "topic": "아스키 라쿠텐모바일 로밍 공지"}, {"title": "楽天モバイルが再びau回線のローミングを10月以降も継続することを案内！KDDIと現在も詰めの協議を実施中。十分なカバーエリアは縮小へ - s-max.jp", "summary": "라쿠텐 모바일이 KDDI와 현재도 치열한 협의를 거쳐 10월 이후에도 au 회선 로밍을 계속 제공하기로 했다고 전했다. 자체 기지국만으로 충분치 않은 커버리지를 보완하기 위한 필수 조치다. 통신사의 네트워크 전략을 보여주는 핵심 기사다.", "source": "s-max.jp", "date": "2026-09-05 21:21", "url": "https://s-max.jp/archives/1810148.html", "category": "other", "importance": 3, "wl": false, "topic": "s-max 라쿠텐모바일 au 로밍 지속 협의"}, {"title": "改めて。楽天モバイル「KDDI ローミング契約」2026年10月以降も継続 - jetstream.blog", "summary": "라쿠텐 모바일이 KDDI와의 로밍 계약을 2026년 10월 이후에도 지속한다고 공식 안내했다. 자체 기지국 확장 일정에 차질이 있는 지역에 대한 필수적인 망 보완 조치다. 통신사의 네트워크 운영 전략 변화를 보여준다.", "source": "jetstream.blog", "date": "2026-09-05 19:10", "url": "https://jetstream.blog/2026/09/05/rakuten-mobile-kddi-roaming-agreement-continues-beyond-october-2026/", "category": "other", "importance": 3, "wl": false, "topic": "젯스트림 라쿠텐모바일 kddi 로밍"}, {"title": "Zong 5G Launches in 17 Cities: Here’s Where You Can Get It - TechJuice", "summary": "파키스탄 통신사 종(Zong)이 17개 도시에 5G 서비스를 공식 출시하며 상용화 지역을 확대했다. 통신사의 5G 커버리지 확충 및 네트워크 투자 동향을 보여주는 소식이다.", "source": "TechJuice", "date": "2026-09-05 15:43", "url": "https://www.techjuice.pk/zong-5g-launches-in-17-cities-heres-where-you-can-get-it/", "category": "contract", "importance": 3, "wl": false, "topic": "종 5g 출시"}, {"title": "Deutsche Telekom Peoplewatch: change-at-the-top in finance, infra, and tech - telcotitans.", "summary": "도이치텔레콤이 재무, 인프라, 기술 부문에서 일련의 고위 임원 교체를 단행하며 조직 개편을 추진했다. 유럽 최대 통신사의 리더십 변화로 네트워크 투자 및 전략 방향에 영향을 준다.", "source": "telcotitans.com", "date": "2026-09-05 14:04", "url": "https://www.telcotitans.com/deutsche-telekomwatch/deutsche-telekom-peoplewatch-change-at-the-top-in-finance-infra-and-tech/10839.article", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 인프라 기술 임원 교체"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신 규제당국(TRAI)이 제안한 5G 네트워크 슬라이싱 서비스 품질(QoS) 측정 규범에 대해 통신사들이 반대 입장을 표명했다. 슬라이싱 활성화 지역의 자원 모니터링 과정에서 무선 자원 활용률을 80% 이하로 제한하라는 방안에 대해 통신사들은 유연성이 떨어진다고 지적했다. 향후 5G 투자 및 서비스 운용 효율성에 영향을 줄 규제 이슈다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "trai 5g슬라이싱"}, {"title": "LG유플러스, 추석 알뜰 장보기 지원한다…9월 멤버십 혜택 강화 - 소셜밸류", "summary": "LG유플러스가 9월 한 달간 멤버십 혜택을 대폭 강화하여 추석 알뜰 장보기를 지원한다. 물가 안정과 연계된 통신사 소비자 복지 정책의 일환이다.", "source": "소셜밸류", "date": "2026-09-07 10:10", "url": "https://www.socialvalue.kr/news/view/1065574815085258", "category": "other", "importance": 2, "wl": false, "topic": "소셜밸류 lgu+ 추석 알뜰 장보기 지원"}, {"title": "LG유플러스, GS건설 등과 100MW급 AIDC 모듈러 표준모델 만든다 - 스페셜타임스", "summary": "LG유플러스가 GS건설 등과 협력하여 100MW급 AIDC 모듈러 표준모델을 만든다. AI 데이터센터 구축 기간을 단축하기 위한 표준화 작업에 착수했다. 모듈러 방식을 통해 인프라 구축 효율성을 높인다. AI 인프라 시장 확대를 위한 협력 체계를 구축했다.", "source": "스페셜타임스", "date": "2026-09-07 10:07", "url": "http://www.specialtimes.co.kr/news/articleView.html?idxno=459367", "category": "contract", "importance": 2, "wl": false, "topic": "lg유플러스 데이터센터"}, {"title": "LGU+, 추석 쇼핑·나들이 멤버십 혜택 강화 - 부산일보", "summary": "LG유플러스가 추석 연휴를 맞아 쇼핑과 나들이를 중심으로 멤버십 제휴 혜택을 강화했다. 가입자 유지를 위한 명절 맞춤형 서비스 마케팅이다.", "source": "부산일보", "date": "2026-09-07 09:56", "url": "https://mobile.busan.com/view/election/view.php?code=2026090709553985247", "category": "other", "importance": 2, "wl": false, "topic": "부산일보 lgu+ 쇼핑 나들이 혜택"}, {"title": "“8개 구단 100만 눈앞”…kt, 프로야구 관중 신기록 분수령 - 톱스타뉴스", "summary": "프로야구 구단 KT 위즈가 8개 구단 100만 관중 돌파를 목전에 두고 관중 신기록 달성의 분수령을 맞이했다. 통신 기업의 프로야구단 흥행 관련 스포츠 소식이다.", "source": "톱스타뉴스", "date": "2026-09-07 09:53", "url": "https://www.topstarnews.net/news/articleView.html?idxno=16185245", "category": "other", "importance": 2, "wl": false, "topic": "톱스타뉴스 kt 프로야구 관중 신기록"}, {"title": "生成AI時代を支える通信インフラ近代化のカギ - businessnetwork.jp", "summary": "생성형 인공지능 시대를 맞아 이를 뒷받침하는 통신 인프라의 현대화와 고도화의 필요성 및 핵심 요인을 진단했다. 트래픽 폭증에 대응하는 네트워크 구조 개선을 다룬다. 통신사 인프라 전략의 참고 자료다.", "source": "businessnetwork.jp", "date": "2026-09-07 09:52", "url": "https://businessnetwork.jp/article/36546/", "category": "tech", "importance": 2, "wl": false, "topic": "비즈니스네트워크 통신 인프라 현대화"},   return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
