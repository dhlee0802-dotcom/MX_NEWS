<style>

  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}

  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>

ory": "contract", "importance": 2, "wl": false, "topic": "한화시스템 국토위성 제작 사업"}, {"title": "[테크家] 양자컴퓨터 ④ㅣ 연구실 넘어 산업으로…'퀀텀 시대' 성큼", "summary": "우주데이터센터와 능동제어위성 핵심기술을 단계적으로 확보하고 2035년까지 한국형 저궤도 위성 통신망을 완성할 계획입니다. 퀀텀 시대 진입에 따라 첨단 바이오 및 양자 기술과의 융합 연구가 진행되고 있습니다. 국가 차원의 저궤도 위성 통신망 구축 로드맵이 제시되었습니다. 장기적인 통신 인프라 발전 방향을 보여줍니다.", "source": "cbci.co.kr", "date": "2026-09-04 10:12", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=603839", "category": "tech", "importance": 2, "wl": false, "topic": "양자컴퓨터 산업 적용 동향"}], "competitor": [{"title": "[단독] \" 5G 한계 지웠다\" 삼성, 日 KDDI와 7GHz 대역서 3.6Gbps 역대급 속...", "summary": "삼성전자가 일본 KDDI와 함께 7GHz 대역에서 3.6Gbps 역대급 속도의 5G 통신 시연에 성공했다. 양사는 지난 2019년 대규모 5G 장비 공급 계약을 맺은 이후 통신망 품질 개선과 인공지능 소프트웨어 고도화 영역에서 협력을 지속하고 있다.", "source": "theguru.co.kr", "date": "2026-09-04 09:02", "url": "https://www.theguru.co.kr/news/article.html?no=106671", "category": "contract", "importance": 5, "wl": false, "topic": "삼성전자 kddi 5g 계약"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신사들은 TRAI가 제안한 5G 네트워크 슬라이싱 서비스 품질(QoS) 측정 기준에 대해 반대 입장을 표명했다. 트래픽 자원 활용도를 모니터링하여 가용 여유를 확보하도록 한 규제안에 대해 업계는 실효성과 부담을 우려하고 있다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 4, "wl": true, "topic": "인도 통신사 규제"}, {"title": "[글로벌 포커스] 수에즈 품은 이집트, 미·중 'AI 패권 전쟁'의 새로운 ...", "summary": "미·중 간 AI 패권 전쟁 속에서 중국 통신장비 업체 화웨이가 이집트에 두 개의 컴퓨팅 클러스터를 구축하기 위한 입찰 제안서를 제출했다. 최신 AI 모델 훈련용 클러스터를 12개월 내 구축하는 조건을 제시하며 선제공격에 나섰다.", "source": "newsian.co.kr", "date": "2026-09-05 06:50", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=94828", "category": "contract", "importance": 4, "wl": false, "topic": "화웨이 이집트 클라우드"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤과 에릭슨은 함부르크 알텐베르더 컨테이너 터미 antum Expo Korea 2026서 양자키분배·양자난수생성 기술...", "summary": "아이디퀀티크가 Quantum Expo Korea 2026에 참가해 양자키분배 및 양자난수생성 기술을 선보였다. 네트워크 장비와 양자난수생성기를 전시했으며, 과거 세계 최초 5G 스마트폰 '갤럭시 퀀텀'에 기술을 탑재한 이력이 소개됐다.", "source": "aitimes.kr", "date": "2026-09-05 23:44", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41777", "category": "tech", "importance": 3, "wl": false, "topic": "아이디퀀티크 양자보안 기술"}, {"title": "[헬로즈업] “와이파이는 한계, 외산 모듈은 고비용”…175억 달러 특화...", "summary": "5G 특화망이 스마트팩토리와 물류 현장의 핵심 인프라로 부상하면서 모듈형 장비 중심으로 생태계가 개편되고 있다. 와이파이의 한계를 극복하고 가변적인 공정 환경에 유연하게 대응하는 특화망 장비 수요가 증가하고 있다.", "source": "hellot.net", "date": "2026-09-05 20:12", "url": "https://www.hellot.net/news/article.html?no=114794", "category": "tech", "importance": 3, "wl": false, "topic": "5g 특화망 장비 생태계"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니]", "summary": "국내 통신장비 업계에서 내년 5G 주파수 경매가 예상되는 가운데 수혜주에 대한 관심이 쏠리고 있다. 국내 시장은 삼성전자의 내수 점유율이 높은 편이며, 에릭슨과 노키아 컨소시엄이 국내 중소 장비 업체들과 협력하는 구조를 보이고 있다.", "source": "view.asiae.co.kr", "date": "2026-09-05 08:19", "url": "https://view.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 3, "wl": false, "topic": "통신장비주 5g 주파수 경매"}, {"title": "유럽판 ‘어벤져스 기업’ 나오나…美·中 맞설 ‘메가합병’ 승부수", "summary": "유럽 통신시장에서 사업자 난립으로 5G와 데이터센터, AI 인프라 투자가 어렵다는 지적이 나오는 가운데 메가 합병 논의가 대두되고 있다. 기술 분야에서는 노광 장비 업체 ASML과 AI 기업 미스트랄AI 등이 주목받고 있다.", "source": "dailian.co.kr", "date": "2026-09-05 07:02", "url": "https://www.dailian.co.kr/news/view/1686306/?sc=Naver", "category": "tech", "importance": 3, "wl": false, "topic": "유럽 통신 인프라 합병"}, {"title": "Ciena expects supply constraints to push backlog past $10B by year's end", "summary": "시에나는 인공지능(AI) 관련 네트워킹 지출 급증에 힘입어 매출이 빠르게 상승하고 있으나, 공급망 제약으로 인해 연말까지 수주 잔고가 100억 달러를 넘어설 것으로 예상된다. 시장의 수요를 충족하는 과정에서 공급망 문제와 주가 변동성이 과제로 지적되고 있다.", "source": "Light Reading", "date": "2026-09-04 22:03", "url": "https://www.lightreading.com/finance/ciena-expects-supply-issues-will-push-backlog-past-10b-by-year-s-end", "category": "earnings", "importa , "topic": "통신장비 업종 체질 개선"}, {"title": "대영에스텍, 자체 암호모듈 'KCMVP' 검증 완료…통합 양자보안 포트폴리...", "summary": "대영에스텍이 자체 암호모듈 KCMVP 검증을 완료한 영상 전송구간 암복호화 장비 'Q-Encryptor'를 선보였다. 드론과 5G 특화망, 국방 및 국가 인프라 분야로 양자보안 기술 적용 범위를 확대할 계획이다.", "source": "etnews.com", "date": "2026-09-04 09:55", "url": "https://www.etnews.com/20260904000057", "category": "tech", "importance": 3, "wl": false, "topic": "대영에스텍 양자보안 장비"}, {"title": "삼성, 8월 中 특허 504건 승인…'휴머노이드· 6G ·전고체' IP 방어망 구축", "summary": "삼성전자가 중국 국가知识产权局(CNIPA)로부터 8월 한 달간 217건을 포함해 그룹 주요 계열사 특허 504건을 승인받았다. 휴머노이드 로봇, 6G AI 예측, 전고체 배터리 등 첨단 원천 IP를 확보하며 방어망을 구축했다.", "source": "theguru.co.kr", "date": "2026-09-04 08:56", "url": "https://www.theguru.co.kr/news/article.html?no=106603", "category": "tech", "importance": 3, "wl": false, "topic": "삼성 중국 특허 승인"}, {"title": "[애널픽] 무선통신장비주 주목...\"피지컬AI 통신망 투자 본격화\"", "summary": "피지컬 AI 구현을 위한 통신망 투자가 본격화되면서 무선통신장비주가 주목받고 있다. 업계는 AI RAN과 6G 등 차세대 기술 도입을 논의하고 5G SA 상용화 현장을 점검하며 네트워크 투자 활성화를 기대하고 있다.", "source": "theviewers.co.kr", "date": "2026-09-04 08:50", "url": "https://theviewers.co.kr/View.aspx?No=4212481", "category": "tech", "importance": 3, "wl": false, "topic": "무선통신장비주 피지컬ai"}, {"title": "\"빚내서 산 AI 주식 털어낸다\"… 中 증시, 美 금리 급등·유가 충격에 신...", "summary": "중국 증시에서 AI 수익화 회의론과 미 금리 충격으로 AI 관련 주식 매도가 이어지고 있다. 광통신 장비사인 이옵톨링크 등이 중국 AI 증시 시가총액 상위에 랭크되며 주목받고 있다.", "source": "g-enews.com", "date": "2026-09-06 06:06", "url": "https://www.g-enews.com/view.php?ud=202609060000201450c8c1c064d_1", "category": "earnings", "importance": 2, "wl": false, "topic": "중국 증시 ai 수익화"}, {"title": "피앤에스로보틱스·노타 상승세...로봇·AI 섹터 '왕성한 식욕'", "summary": "로봇 및 AI 섹터에서 로보스타, 유진로봇, 클로봇 등 관련 주식들이 오름세를 보였다. 로봇 밸류체인 전반에 걸쳐 투자 심리가 회복되는 양상이다.", "source": "pinpointnews.co.kr", "date": "2026-09-04 14:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=483929", "category": "tech", "importance": 2, "wl": false, "topic": "로봇 ai 섹터 강세"}, {"title": "단순 테마 넘어 양산 국면 진입… 로봇 밸류체인 수급 집중", "summary": "로봇 밸류체인 전반으로 수급이 집중되는 가운데 로보스 icle/202609044207g", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 국가대표 ai"}, {"title": "[단독]갈수록 비싸지는 차세대 칩 '베라루빈'…정부, 대당 275억에 공급", "summary": "과기정통부가 내년 GPU 서버 확충 예산으로 3조 8500억 원을 배정받았다. 베라루빈 등 고성능 AI 가속기를 대거 확보하여 국가 인프라를 강화하고 관련 생태계를 지원할 방침이다.", "source": "mt.co.kr", "date": "2026-09-05 08:00", "url": "https://www.mt.co.kr/tech/2026/09/05/2026090415342779235", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 gpu 서버 예산"}, {"title": "[단독] “미토스 허용해 달라” 韓 요청에도 美 백악관 ‘묵묵부답’…...", "summary": "과기정통부가 미국 백악관에 AI 모델 '미토스' 허용을 요청했으나 답변을 받지 못한 것으로 알려졌다. 앞서 미국 정부는 미토스 전체 모델에 대한 수출 통제 조치를 단행한 바 있다.", "source": "biz.heraldcorp.com", "date": "2026-09-04 17:41", "url": "https://biz.heraldcorp.com/article/10863187?ref=naver", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 미토스 수출통제"}, {"title": "\"중국산 차량 영구 차단하라\"… 글로벌 완성차, 美 의회에 '전면 금지법...", "summary": "미국 의회에서 차량에 탑재되는 블루투스, 와이파이, 셀룰러 네트워크 모듈 및 저궤도 위성 통신 장비까지 중국산을 영구 차단하는 전면 금지법 추진 논의가 보도되었습니다. 최신 커넥티드 차량의 고성능 카메라, 라이다, 마이크, GPS 등과 연계된 통신 보안을 강화하기 위한 조치입니다. 해당 규제 범위에는 다양한 통신 및 위성 모듈이 포함되어 글로벌 자동차 및 통신 장비 공급망에 영향을 미칠 전망입니다. 향후 입법 진행 상황에 따라 업계의 부품 조달 전략 변화가 예상됩니다.", "source": "g-enews.com", "date": "2026-09-04 17:02", "url": "https://www.g-enews.com/view.php?ud=2026090417000525850c8c1c064d_1", "category": "policy", "importance": 3, "wl": false, "topic": "미국 의회 중국산 통신장비 규제"}, {"title": "[2027 AI예산 해부 ④] 불어난 예산, ‘염불보다 잿밥’ 주의보…“과기...", "summary": "AI 정책이 급속도로 확대되면서 대통령실과 국가AI전략위원회, 과기정통부 및 정보통신산업진흥원(NIPA) 등 산하기관이 관련 사업에 참여하고 있다. 예산 증가에 따른 효율적 집행 관리의 필요성이 제기됐다.", "source": "ddaily.co.kr", "date": "2026-09-06 06:23", "url": "https://www.ddaily.co.kr/page/view/2026090416264434084", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 ai 예산 해부"}, {"title": "국가대표 AI 연구 이끈다…포스텍, 220억 국책 과제 2건 동시 선정", "summary": "포스텍이 과기정통부와 정보통신기획평가원(IITP)이 주관하는 'AI최고급신진연구자지원사업'에 2개 과제가 동시 선정됐다. 국가대표 AI 연구를 이끌어갈 전문 인력 양성이 추진된다.", "source": "kbmaeil.com", "date": "2026-09-05 17:00" 국 연방통신위원회(FCC)의 인체 무해성 및 통신 적합성 검증인 FCC 무선 장비 전파 인증을 취득해야 한다. 미국 시장 진출을 위한 필수 규제 절차로 다뤄지고 있다.", "source": "dream.kotra.or.kr", "date": "2026-09-04 11:26", "url": "http://dream.kotra.or.kr/kotranews/cms/news/actionKotraBoardDetail.do?SITE_NO=3&MENU_ID=190&CONTENTS_NO=2&bbsGbn=254&bbsSn=254&pNttSn=243866", "category": "policy", "importance": 2, "wl": false, "topic": "미국 fcc 스마트워치 인증"}], "carrier": [{"title": "KDDIが光回線＋5Gの「auひかりプラス」を提供する狙い 光コラボを生かして全国展開も視野に", "summary": "KDDI가 출시하는 'auひかりプラス'는 광회선과 5G SA를 융합하여 즉시 개통 및 장애 시 자동 백업 기능을 제공한다. 이번 서비스는 NTT 광콜라보를 활용해 그룹 내 프로바이더 경쟁을 해소하고 전국 단위 사업 효율성을 극대화하기 위한 전략적 행보이다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "contract", "importance": 4, "wl": true, "topic": "kddi 전략"}, {"title": "光回線のバックアップにモバイル回線を――KDDIが新インターネットサービス「auひかりプラス」の提供を開始 ISPは3社から選択可（順次拡大予定）", "summary": "KDDI는 유선 광대역 회선의 백업용으로 5G 무선 통신을 활용할 수 있는 신규 결합 인터넷 서비스를 도입했다. 광랜 장애 시 5G 및 LTE 망으로 자동 전환되는 강력한 내구성을 제공하며 다양한 ISP 선택지를 지원한다.", "source": "ITmedia Mobile", "date": "2026-09-04 15:45", "url": "https://www.itmedia.co.jp/mobile/articles/2609/04/news086.html", "category": "contract", "importance": 4, "wl": true, "topic": "kddi 상품"}, {"title": "T-Mobile CFO Peter Osvaldik to step down in February 2027, Jessica Uhl to succeed", "summary": "티모바일의 피터 오스발딕 CFO가 퇴임하고 제시카 울이 후임으로 임명된 가운데, 행동주의 펀드 엘리엇 인베스트먼트가 모회사 도이치텔레콤의 지분을 확보하며 T-Mobile과의 합병 재검토를 요구하고 있다는 소식이 전해졌다.", "source": "ET Telecom", "date": "2026-09-04 10:57", "url": "https://telecom.economictimes.indiatimes.com/news/industry/t-mobile-cfo-peter-osvaldik-to-step-down-in-february-2027-jessica-uhl-to-succeed/133749414", "category": "exec", "importance": 4, "wl": true, "topic": "티모바일 경영진"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 릴라이언스 지오가 4억 달러 규모의 대형 IPO 추진 시기를 축제 시즌인 나바아트리 및 디왈리 기간으로 조율하고 있다. 이번 기업공개는 인도 통신 시장에서 메가톤급 자금 조달 이벤트로 기대를 모으고 있다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "contract", "importance": 4, "wl": true, "topic": "릴라이언스 지오 상장"}, {"title": "통신 빅3부터 쿠팡·티빙까지...민관합동조사단이 파헤친 침해사고 500일", "summary": "과기정통부 정보보호네트워크정책관 등이 참여한 민관합동조사단이 지난 500일간 국내 통신·방송 업계를 뒤흔든 침해사고 조사 결과를 발표했다. 티빙 등 주요 플랫폼의 보안 취약점과 해킹 사고 원인이 집중 조사됐다.", "source": "digitaltoday.co.kr", "date": "2026-09-06 08:14", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=698304", "category": "policy", "importance": 3, "wl": false, "topic": "민관합동조사단 침해사고"}, {"title": "카톡에 “등본 떼줘” 요청하면 은행 제출까지…‘모두의 AI’ 연내 출격", "summary": "과기정통부가 주관한 '모두의 AI' 사업자 간담회에서 SK텔레콤 등이 참여한 연내 출시 청사진이 공개됐다. 카카오톡이나 전화로 국산 AI 서비스를 이용할 수 있도록 지원하는 범국가적 프로젝트가 추진된다.", "source": "sentv.co.kr", "date": "2026-09-06 08:02", "url": "https://www.sentv.co.kr/article/view/sentv202609040192", "category": "tech", "importance": 3, "wl": false, "topic": "과기정통부 모두의 ai"}, {"title": "대규모 유출에 고개 숙인 티빙, 개인정보위 조사 발표 남았다", "summary": "과기정통부와 개인정보위원회가 티빙의 대규모 침해사고 및 개인정보 유출에 대한 조사 결과를 발표했다. 보안 탐지 실패와 늑장 신고 등에 대해 과기정통부는 재발방지 대책 이행계획을 점검할 예정이다.", "source": "ddaily.co.kr", "date": "2026-09-06 07:01", "url": "https://www.ddaily.co.kr/page/view/2026090415203322171", "category": "policy", "importance": 3, "wl": false, "topic": "티빙 개인정보위 조사"}, {"title": "제각각 통신 방식 통일…軍, 전군 드론 '통신표준' 만든다", "summary": "군이 제각각이던 드론 통신 방식을 통일하기 위해 전군 드론 통신표준 마련에 나섰다. 지상통제 장비를 매개로 통합관제체계에 편입할 방식을 찾는 가운데, 통신 방식으로 5G, 6G 위성통신, PS-LTE 등이 검토되고 있다.", "source": "news1.kr", "date": "2026-09-06 07:00", "url": "https://www.news1.kr/diplomacy/defense-diplomacy/6280619", "category": "tech", "importance": 3, "wl": false, "topic": "군 드론 통신표준 통일"}, {"title": "통신3사 AI 데이터센터 확장에 탄소배출 관리 부담 커진다, 재생에너지...", "summary": "통신 3사의 AI 데이터센터 확장으로 탄소 배출 관리 부담이 커지고 있다. SK텔레콤은 5G 서비스 제공을 위한 통신 장비 증설이 전력 사용량 증가의 원인이라고 밝혔으며, 향후 AIDC 확대로 이러한 부담은 더욱 가중될 전망이다.", "source": "businesspost.co.kr", "date": "2026-09-06 06:00", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=446333", "category": "other", "importance": 3, "wl": false, "topic": "통신사 데이터센터 탄소배출"}, {"title": "공장 환경을 위한 무선 공존 설계", "summary": "공장 환경에서 장비 간 충분한 간격 확보와 전파 조사를 통한 무선 공존 설계 전략이 강조되고 있다. 스마트팩토리 환경에서는 공장 자체적으로 프라이빗 5G 특화망을 구축해 센서와 액추에이터 간 통신을 운영하고 있다.", "source": "hellot.net", "date": "2026-09-05 20:32", "url": "https://www.hellot.net/news/article.html?no=114796", "category": "tech", "importance": 3, "wl": false, "topic": "공장 무선 공존 설계"}, {"title": "[헤로즈업] “과투자 덫에 걸린 5G 특화망”…클라우드·슬림 라이선스...", "summary": "글로벌 산업 현장에서 5G 특화망(이음 5G)이 도입되고 있으나 고가의 장비 가격과 통신 전문 인력 고용 부담 등 여러 허들에 직면해 있다. 이를 해결하기 위해 클라우드 기반 슬림 라이선스 등 대안이 논의되고 있다.", "source": "hellot.net", "date": "2026-09-05 20:08", "url": "https://www.hellot.net/news/article.html?no=114793", "category": "tech", "importance": 3, "wl": false, "topic": "5g 특화망 도입 과제"}, {"title": "[헬로즈업] AI 공장의 ‘숨은 대동맥’ 5G 특화망…제조업 게임의 룰을...", "summary": "5G 특화망을 단순 통신 장비 구매 비용이 아닌 생산성 향상과 설비 다운타임 방지 등을 포괄하는 수익형 인프라로 평가해야 한다는 분석이 제기됐다. 한국산업단지공단 등을 중심으로 관련 인프라 확산이 추진되고 있다.", "source": "hellot.net", "date": "2026-09-05 20:02", "url": "https://www.hellot.net/news/article.html?no=114792", "category": "tech", "importance": 3, "wl": false, "topic": "5g 특화망 수익형 인프라"}, {"title": "[헬로즈업] 로봇이 스스로 움직이는 공장…그 뒤엔 ‘ 5G 특화망’이 있...", "summary": "5G 특화망이 로봇이 스스로 움직이는 스마트 공장의 핵심 인프라로 자리 잡고 있다. 특화망 도입 시 적은 장비로 넓은 지역을 커버할 수 있으며, 와이파이 대비 투자 효과가 높다는 결과가 LG전자 AMR 테스트 등을 통해 제시됐다.", "source": "hellot.net", "date": "2026-09-05 19:58", "url": "https://www.hellot.net/news/article.html?no=114791", "category": "tech", "importance": 3, "wl": false, "topic": "5g 특화망 로봇 공장"}, {"title": "“연내 200대 실증 현장 투입” 라이노스, B2B 로봇 시장 공략 ‘출발’", "summary": "과기정통부의 국산 AI 반도체 기반 AX 디바이스 실증 사업을 통해 라이노스의 B2B 로봇이 현장에 투입된다. 라이다와 AI 카메라, 센서 등을 탑재해 주변 환경과 장애물을 감지하며 연내 200대 실증이 추진된다.", "source": "hellot.net", "date": "2026-09-05 13:44", "url": "https://www.hellot.net/news/article.html?no=114787", "category": "tech", "importance": 3, "wl": false, "topic": "과기정통부 ai 반도체 로봇"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다", "summary": "통신사들이 기지국을 AI 데이터센터로 활용하는 등 체질 개선에 나서고 있다. 노키아는 나주에서 머신러닝 기반 채널 추정 기술을 시험했고 삼성전자는 성남 일대 상용망에 AI 기술을 적용했으며, LG유플러스는 이종 네트워크 연동 안정성을 확보하고 있다.", "source": "yna.co.kr", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/view/AKR20260904023000017?input=1195m", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 데이터센터"}, {"title": "티빙 3954만 계정 유출…2024년 발견한 취약점 개선 안 했다", "summary": "과기정통부는 티빙의 3954만 계정 유출 사고와 관련해 정보통신망법 위반에 따라 과태료를 부과할 방침이다. 티빙 대표는 설명회에서 보안 체계 개선과 재발 방지를 약속했다.", "source": "rightknow.co.kr", "date": "2026-09-05 01:12", "url": "http://www.rightknow.co.kr/news/articleView.html?idxno=34664", "category": "policy", "importance": 3, "wl": false, "topic": "티빙 정보통신망법 위반"}, {"title": "Philippine telcos set $2.2B for infrastructure investment in 2026", "summary": "필리핀 정보통신부는 현지 통신사들이 2026년 인프라 투자에 22억 달러를 배정했다고 밝혔다. 이번 대규모 투자는 국가 디지털 전환 가속화에 대한 업계의 강한 자신감을 반영한 것으로 평가된다.", "source": "Light Reading", "date": "2026-09-04 21:43", "url": "https://www.lightreading.com/regulatory-politics/philippine-telcos-set-2-2b-for-infrastructure-investment-in-2026", "category": "contract", "importance": 3, "wl": true, "topic": "필리핀 통신사"}, {"title": "여야, 과기부 모태펀드 공방…\"합목적성 결여\"·\"마중물 역할\"", "summary": "국회 예결소위에서 과기정통부 모태펀드 공방과 함께 온누리상품권의 '2주 먹통' 사태에 대해 직무유기 지적이 제기되었다. 전산 서비스 중단에 따른 관리 부실 문제가 도마 위에 올랐다.", "source": "yna.co.kr", "date": "2026-09-04 19:48", "url": "https://www.yna.co.kr/view/AKR20260904163400001?input=1195m", "category": "outage", "importance": 3, "wl": false, "topic": "온누리상품권 2주 먹통"}, {"title": "카카오·SKT·KT 3사3색 ‘모두의 AI’ 서비스, 12월 출시", "summary": "국내 주요 통신 및 플랫폼 기업들이 참여하는 '모두의 AI' 서비스가 12월 출격을 앞두고 있다. 과기정통부 장관과 기업 대표들이 참석한 가운데 별도 앱 설치 없이 카카오톡이나 전화로 이용 가능한 AI 개발이 진행 중이다.", "source": "byline.network", "date": "2026-09-04 18:58", "url": "https://byline.network/?p=9004111222618345", "category": "tech", "importance": 3, y.co.kr", "date": "2026-09-05 08:02", "url": "https://www.youthdaily.co.kr/news/article.html?no=225166", "category": "tech", "importance": 2, "wl": false, "topic": "공군 작전통신 체계운용"}, {"title": "적정공사비 확보, 고품질 ICT인프라 구축의 출발점", "summary": "데이터센터와 6G 통신망 등 정보통신인프라의 중요성이 커지면서 적정 공사비 확보가 강조되고 있다. AI 기반 고품질 ICT 인프라 구축을 위해 전문 기술 인력 투입과 정밀한 시험·측정이 필수적이라는 지적이다.", "source": "koit.co.kr", "date": "2026-09-05 07:14", "url": "https://www.koit.co.kr/news/articleView.html?idxno=208861", "category": "tech", "importance": 2, "wl": false, "topic": "정보통신인프라 고품질 구축"}, {"title": "The Buildout: Louisiana targets 15K BEAD locations by early 2027", "summary": "미국 각 지역에서 광대역 인프라 구축 사업이 활발히 진행되는 가운데, 루이지애나주 등에서 BEAD 프로그램 기반의 네트워크 구축 작업이 본격화되고 있다. 주요 통신 및 건설 사업자들은 각 지역별로 통신망 건설 마일스톤을 달성하며 서비스 커버리지를 확대하고 있다.", "source": "Light Reading", "date": "2026-09-04 21:00", "url": "https://www.lightreading.com/broadband/the-buildout-louisiana-targets-15k-bead-locations-by-early-2027", "category": "contract", "importance": 2, "wl": true, "topic": "미국 통신 인프라"}, {"title": "\"심장질환은 병원 고를 시간을 주지 않는다\"…심혈관질환 골든타임 사수...", "summary": "심혈관질환 골든타임 사수를 위해 병원들이 첨단 영상 장비와 5G 기반 원격협진 시스템을 도입하고 있다. 한림대동탄성심병원은 보건복지부 지원 사업을 통해 지역 의료기관과 신속한 원격협진 체계를 구축했다.", "source": "sportschosun.com", "date": "2026-09-04 18:13", "url": "https://www.sportschosun.com/life/2026-09-04/202609040100031320001924", "category": "tech", "importance": 2, "wl": false, "topic": "병원 5g 원격협진"}, {"title": "スマホ通信費を見直し、好きなことに使いませんか？ 楽天モバイルがあえて安さだけをPRしない「おトク体験」", "summary": "라쿠텐모바일은 단순한 저가 요금 강조를 넘어 통신비 절감을 통해 개인이 좋아하는 활동에 투자하도록 독려하는 '좋아요 비용' 캠페인과 체험형 이벤트를 전개하고 있다.", "source": "ITmedia Mobile", "date": "2026-09-04 11:30", "url": "https://www.itmedia.co.jp/mobile/articles/2609/04/news056.html", "category": "other", "importance": 2, "wl": true, "topic": "라쿠텐모바일 마케팅"}, {"title": "WAON POINTやAEON Payのキャンペーンまとめ【9月4日最新版】 ポイント10～20倍の獲得チャンス多数", "summary": "이오ングループ가 9월 한 달간 WAON POINT 적립 확대와 함께 자회사 이온모바일을 통한 가입자 대상 포인트 부여 프로모션을 실시한다.", "source": "ITmedia Mobile", "d   return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
