d": "policy", "topic": "trai 합법적 ai 통화 스팸 제외"}, {"title": "Airtel, Jio allege unfair practices by Vi, seek intervention from Trai - Business Standard", "summary": "에어텔과 지오가 보다폰아이디어의 불공정 관행을 주장하며 TRAI에 공식 개입과 조사를 요구했다. 128번 기사의 동일 이슈다.", "source": "Business Standard", "date": "2026-09-14 03:22", "url": "https://www.business-standard.com/industry/news/vodafone-idea-denies-bharti-airtel-jio-s-charge-of-unfair-practice-126091300696_1.html", "category": "policy", "importance": 4, "sid": "carrier", "topic": "에어텔 지오 trai 보다폰아이디어 제소"}, {"title": "Jio plans 1,600 satellites to rival Starlink - newskarnataka.com", "summary": "인도 통신사 릴라이언스 지오가 스타링크에 대항하기 위해 1,600개의 자체 위성을 발사할 계획입니다.", "source": "newskarnataka.com", "date": "2026-09-14 03:00", "url": "https://newskarnataka.com/technology/jio-plans-1600-satellites-to-rival-starlink/13092026/", "category": "tech", "importance": 4, "sid": "satellite", "topic": "릴라이언스 지오 위성"}, {"title": "주가 -90% 버텼더니...\"각국 국방부서 러브콜\" 대박 난 이 회사", "summary": "미국 블랙스카이가 지구 저궤도에 초소형 관측 위성을 띄워 전략거점을 실시간 감시하는 기술로 각국 국방부로부터 러브콜을 받으며 주목받고 있는 위성 인프라 및 방산 분야 동향이다.", "source": "mt.co.kr", "date": "2026-09-14 03:00", "url": "https://www.mt.co.kr/stock/2026/09/14/2026091319380127016", "category": "contract", "importance": 4, "sid": "satellite", "topic": "미국 블랙스카이 관측위성"}, {"title": "楽天モバイルが強制解約を撤回 - oita-press.co.jp", "summary": "라쿠텐모바일의 강제 해약 방침 철회 소식이다. 80번 기사의 동일 이슈다.", "source": "oita-press.co.jp", "date": "2026-09-14 02:27", "url": "https://www.oita-press.co.jp/1002000000/2026/09/14/NP2026091401000558?amp=true", "category": "policy", "importance": 4, "sid": "carrier", "topic": "라쿠텐모바일 자동해약 철회 (오이타프레스)"}, {"title": "Amazon Seeks to Acquire Globalstar .. And Apple is at the Heart of the Storm - آي-فون إسلا", "summary": "아마존이 글로벌스타 인수를 추진 중이며 애플과의 관계가 핵심이라는 보도임.", "source": "آي-فون إسلام", "date": "2026-09-14 02:14", "url": "https://iphoneislam.com/language/en/2026/04/amazon-seeks-to-acquire-globalstar-and-apple-is-at-the-heart-of-the-storm/164772", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아마존 글로벌스타 인수"}, {"title": "스타링크 가 뭐길래? 대한항공·아시아나항공도 속속 도입", "summary": "대한항공과 아시아나항공이 9월 15일부터 스페이스X의 저궤도 위성통신 서비스 '스타링크' 기반 기내 와이파이를 국내 항공사 최초로 상용화한다. 양사는 별도 요금이나 회원 자격 없이 모든 승객에게 무료로 개방하는 파격적인 방식을 채택했다. 고도 550㎞ 저궤도 위성을 활용해 기존 정지궤도 위성보다 지연 시간이 크게 줄어든 고속 통신 서비스를 제공한다. 저궤도 위성통신(Starlink)의 국내 대중교통 및 상업 시장 본격 진입을 알리는 대형 계약 및 서비스 런칭이다.", "source": "traveltimes.co.kr", "date": "2026-09-14 01:18", "url": "https://www.traveltimes.co.kr/news/articleView.html?idxno=500387", "category": "contract", "importance": 4, "sid": "satellite", "topic": "대한항공 아시아나 스타링크 도입"}, {"title": "[김승조의 혁신의 우주경제] 첸쉐썬 이어받은 중국 우주 굴기, 스페이스...", "summary": "중국이 저궤도 우주 통신망인 궈왕과 첸판을 앞세워 스페이스X의 스타링크에 맞서고 있다. ITU에 대규모 위성 등록을 신청하며 글로벌 우주 인터넷 패권 경쟁을 벌이고 있다.", "source": "joongang.co.kr", "date": "2026-09-14 00:16", "url": "https://www.joongang.co.kr/article/25461513", "category": "strategy", "importance": 4, "sid": "satellite", "topic": "중국 궈왕 첸판 스타링크 대항"}], "2026-09-15": [{"title": "Samsung and Verizon launch integrated sensing trial in Dallas, Texas - Data Center Dynamic", "summary": "삼성전자가 미국 통신사 버라이즌과 함께 미국 텍사스주 댈러스에서 기존 5G 네트워크를 활용한 차세대 통신망 통합 센싱(ISAC) 기술 시험을 성공적으로 진행했다. 당사가 당사자인 대형 통신장비 기술 실증으로 중요도 5에 해당한다.", "source": "Data Center Dynamics", "date": "2026-09-15 20:03", "url": "https://www.datacenterdynamics.com/en/news/samsung-and-verizon-launch-integrated-sensing-trial-in-dallas-texas/", "category": "contract", "importance": 5, "sid": "competitor", "topic": "삼성전자 버라이즌통합센싱시험"}, {"title": "Samsung and Verizon complete 6G-focused ISAC trial on virtualised network - New Electronic", "summary": "삼성전자와 버라이즌이 가상화된 네트워크 환경에서 6G 중심의 ISAC(통신·센싱 통합) 시험을 완료했다. 기존 네트워크 장비의 하드웨어 교체 없이 소프트웨어 업그레이드만으로 센싱 기능을 구현할 수 있음을 입증했다. 차세대 6G 표준 경쟁에서 유리한 고지를 선점하게 됐다.", "source": "New Electronics", "date": "2026-09-15 17:13", "url": "https://www.newelectronics.co.uk/content/news/samsung-and-verizon-complete-6g-focused-isac-trial-on-virtualised-network", "category": "tech", "importance": 5, "sid": "satellite", "topic": "삼성전자 6g 센싱"}, {"title": "삼성전자, 美 버라이즌과 6G 핵심기술 실증…AI 기반 ISAC으로 군중 밀집도 파악 - socialvalue.kr", "summary": "삼성전자가 버라이즌과 AI 기반 ISAC 기술을 실증했습니다. 군중 밀집도 파악 등 활용 가능성을 확인했습니다.", "source": "socialvalue.kr", "date": "2026-09-15 17:11", "url": "https://www.socialvalue.kr/news/view/1065596440728863", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성 버라이즌 6g 실증"}, {"title": "삼성전자-버라이즌, 6G 핵심 기술 ‘AI 기반 ISAC’ 세계 최초 실증 - SWTV", "summary": "삼성전자와 버라이즌이 세계 최초로 6G 핵심 기술인 'AI 기반 ISAC' 실증을 성공적으로 마쳤다. 통신망을 센서로 탈바꿈시키는 혁신적 기술력을 전 세계에 공표했다. 삼성 네트워크사업부의 위상을 드높인 쾌거다.", "source": "SWTV", "date": "2026-09-15 16:57", "url": "https://m.swtvnews.com/news/amp.html?ncode=1065599821024978", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성전자 버라이즌 6g 센싱 기술 실증"}, {"title": "삼성전자, 버라이즌과 6G 기술 실증…AI로 군중 밀집도 분석 - insightkorea.co.kr", "summary": "삼성전자가 버라이즌과 공동으로 6G 기술 실증에 성공하며 AI를 통한 군중 밀집도 분석 기능을 선보였다. 통신과 센싱의 융합을 통해 네트워크 인프라의 가치를 극대화하는 데 성공했다. 실제 필드 환경에서 검증된 기술력을 바탕으로 향후 6G 표준화 경쟁에서 유리한 고지를 선점했다. 삼성의 글로벌 네트워크 사업 역량이 한층 돋보인다.", "source": "insightkorea.co.kr", "date": "2026-09-15 16:07", "url": "https://www.insightkorea.co.kr/news/articleViewAmp.html?idxno=254613", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성 버라이즌 6g isac 실증"}, {"title": "Samsung, Verizon trial 6G sensing technology over existing 5G network - Mobile Europe", "summary": "삼성전자와 버라이즌이 기존 5G 네트워크 기반 위에서 6G 센싱 기술을 실증하는 데 성공했습니다. 통신망이 주변 환경을 감지하고 군중 상태를 파악하는 지능형 인프라 기능을 시연했습니다. 차세대 표준화 경쟁에서 기술력을 과시했습니다.", "source": "Mobile Europe", "date": "2026-09-15 15:00", "url": "https://www.mobileeurope.co.uk/samsung-verizon-trial-6g/", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성전자 버라이즌 6g 센싱 시험"}, {"title": "삼성전자, 통신망으로 군중 밀집 감지…美서 6G 기술 실증 - m-i.kr", "summary": "삼성전자가 미국 통신사 버라이즌과 함께 통신망으로 군중 밀집도를 감지하는 6G 기술 실증에 성공했습니다. 기지국을 고정밀 센서로 활용하는 AI 기반 ISAC 기술을 실제 망에 적용했습니다. 네트워크의 기능적 한계를 뛰어넘어 새로운 활용법을 제시한 의미 있는 성과입니다. 글로벌 통신 장비 시장에서 삼성전자의 기술적 위상을 높이고 있습니다.", "source": "m-i.kr", "date": "2026-09-15 14:37", "url": "https://www.m-i.kr/news/articleView.html?idxno=1414162", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성전자 6g 실증"}, {"title": "KDDI、27年にも衛星経由で音声通話 圏外解消へ次世代スターリンク活用 - BigGo ファイナンス", "summary": "KDDI가 2027년에 위성 경유 음성 통화를 도입하여 음영 지역을 해소하기 위해 차세대 스타링크를 활용한다. 위성통신 기반 커버리지 혁신을 추진하고 있다.", "source": "BigGo ファイナンス", "date": "2026-09-15 14:25", "url": "https://finance.biggo.jp/news/c207cb14-5136-4883-bb8e-af370e20490c", "category": "tech", "importance": 5, "sid": "satellite", "topic": "kddi 위성통신 서비스"}, {"title": "Samsung, Verizon Test Key 6G Technology on Existing 5G Network - Koreabizwire", "summary": "삼성전자 네트워크사업부와 버라이즌이 기존 5G 상용 네트워크 환경에서 핵심 6G 기술 시험을 성공적으로 완료했습니다. 가상화된 네트워크 기반에서 통신과 센싱을 동시에 수행하는 ISAC 기술을 실증했습니다. 양사는 글로벌 스포츠 이벤트 현장에서 모바일 네트워크를 AI 센서로 활용하는 혁신을 선보이며 차세대 통신 주도권 확보에 나섰습니다.", "source": "Koreabizwire", "date": "2026-09-15 12:04", "url": "http://koreabizwire.com/samsung-verizon-test-key-6g-technology-on-existing-5g-network/359183", "category": "contract", "importance": 5, "sid": "carrier", "topic": "삼성전자 버라이즌 6g 기술 시험"}, {"title": "Samsung, Verizon complete key technology trial for 6G networks - en.yna.co.kr", "summary": "삼성전자가 버라이즌과의 공동 실증을 통해 가상화 네트워크 환경에서 소프트웨어 업그레이드만으로 6G 핵심 기술인 통신 센싱 융합 기술을 구현하는 데 성공했다. 카메라 장비 없이도 기지국 전파를 활용해 주변 객체를 감지하는 첨단 기술력을 입증했다.", "source": "en.yna.co.kr", "date": "2026-09-15 11:03", "url": "https://en.yna.co.kr/view/AEN20260915002600320", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성전자 버라이즌 6g 핵심기술 실증"}, {"title": "圏外でも高速データ通信や音声通話が可能に KDDIが「Starlink Mobile V2」契約を締結 アジア初", "summary": "KDDI가 스페이스X와 아시아 최초로 차세대 위성인 스타링크 모바일 V2 서비스 제공 계약을 체결하고 2027년 내에 지상 圏外 지역에서도 고속 데이터와 음성 통신이 가능하도록 하겠다고 발표했다. 지상 통신망의 한계를 극복하고 위성통신을 결합한 입체적인 커버리지를 확보하기 위한 핵심 전략이다. 삼성전자 네트워크사업부의 잠재적 장비 조달 및 인프라 연계 측면에서도 주목해야 할 대형 위성통신 수주 협력이다.", "source": "ITmedia Mobile", "date": "2026-09-15 11:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/15/news068.html", "category": "contract", "importance": 5, "sid": "carrier", "topic": "kddi 수주"}, {"title": "삼성전자, 美 버라이즌과 6G 핵심 기술 ‘AI 기반 ISAC’ 실증 성공 - CEO스코어데일리", "summary": "삼성전자가 버라이즌과 공동으로 6G 핵심 기술인 AI 기반 통신 센싱 융합 기술의 현장 실증을 성공적으로 마무리했다. 기존 가상화 인프라를 활용해 센싱 기능을 구현함으로써 기술 리더십을 공고히 했다.", "source": "CEO스코어데일리", "date": "2026-09-15 10:49", "url": "https://m.ceoscoredaily.com/page/view/2026091510300817136", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성전자 버라이즌 ai isac 현장 실증"}, {"title": "삼성전자·美 버라이즌, AI로 군중 밀집도 잡는다···6G 기술 실증 - enewstoday.co.kr", "summary": "삼성전자와 美 버라이즌이 AI를 활용한 군중 밀집도 분석 등 6G 기술 실증에 성공했다. 통신망을 센서화하는 혁신 기술로 차세대 장비 시장을 겨냥하고 있다. 기술 리더십 강화를 위한 중요한 이정표다.", "source": "enewstoday.co.kr", "date": "2026-09-15 10:49", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2470537", "category": "tech", "importance": 5, "sid": "carrier", "topic": "버라이즌 삼성전자 6g"}, {"title": "삼성전자, 버라이즌과 AI로 6G 핵심기술 ‘ISAC’ 현장 실증…기존 장비 그대로 - 인공지능신문", "summary": "삼성전자가 미국 버라이즌과 협력해 별도의 장비 추가 없이 소프트웨어 업그레이드만으로 6G 핵심 기술인 AI 기반 통신 센싱 융합 기술 현장 실증에 성공했다. 가상화 네트워크를 통해 기지국이 주변 환경을 인식하는 능력을 입증했다.", "source": "인공지능신문", "date": "2026-09-15 10:35", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41920", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성전자 버라이즌 ai 6g isac 실증 성공"}, {"title": "삼성전자, 美 버라이즌과 6G 핵심 기술 'ISAC 업계 최초 현장 실증 - 스트레이트뉴스", "summary": "삼성전자가 미국 버라이즌과 가상화 네트워크 기반 6G 핵심 기술인 'ISAC' 현장 실증을 업계 최초로 성공리에 마쳤다. 스포츠 이벤트 현장에서 소프트웨어만으로 통신과 센싱을 동시에 수행하는 성과를 거두었다.", "source": "스트레이트뉴스", "date": "2026-09-15 09:46", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=311198", "category": "tech", "importance": 5, "sid": "competitor", "topic": "삼성전자 버라이즌 6g isac 실증"}, {"title": "삼성전자, 버라이즌과 6G 핵심 기술 현장 실증 성공 - 라이센스뉴스", "summary": "삼성전자가 버라이즌과 공동으로 6G 시대의 핵심이 될 통신·센싱 융합 기술(ISAC)의 현장 실증에 성공했다고 발표했다. AI 알고리즘을 결합하여 통신 기지국이 주변의 움직임을 정확히 읽어내는 기술력을 과시했다. 양사의 긴밀한 협력이 결실을 맺은 대표적 기술 성과다.", "source": h back against planned Huawei crackdown - Euronews.com", "summary": "유럽 통신사 최고경영자(CEO)들이 유럽연합 차원에서 추진되는 중국산 화웨이 장비 규제 및 퇴출 움직임에 대해 공급망 차질과 비용 부담을 이유로 반대 목소리를 내고 있다. 주요국 장비 제재를 둘러싼 정책 갈등이다.", "source": "Euronews.com", "date": "2026-09-15 23:04", "url": "https://www.euronews.com/my-europe/2026/09/15/european-telecoms-execs-push-back-against-planned-huawei-crackdown", "category": "policy", "importance": 4, "sid": "policy", "topic": "유럽연합 화웨이규제반대"}, {"title": "Telxius and Nokia Deploy 800G Optical Technology Across Global Terrestrial Networks - tech", "summary": "노키아와 텔시우스가 글로벌 육상 네트워크망 전역에 800G 광학 기술을 배포하여 전송 용량을 강화했다. 양사의 파트너십을 통해 초고속 광 네트워킹을 구현한다.", "source": "techafricanews.com", "date": "2026-09-15 22:42", "url": "https://techafricanews.com/2026/09/15/telxius-nokia-800g-optical-technology-terrestrial-networks/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 광통신 기술"}, {"title": "China, Russia Voice Concern as US Confirms Weapons in Space - Asia Financial", "summary": "미국이 우주 공간에 무기 배치를 확정하자 중국과 러시아가 이에 대해 심각한 우려를 표명하며 반발했다.", "source": "Asia Financial", "date": "2026-09-15 22:41", "url": "https://www.asiafinancial.com/china-russia-voice-concern-as-us-confirms-weapons-in-space", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 우주 무기 배치 논란"}, {"title": "Space42 and Viasat to plow up to $1B into Equatys D2D JV", "summary": "비아셋과 스페이스42가 모바일 위성 서비스용 인프라 공유를 위해 에쿼티스(Equatys) 합작법인(JV)을 설립하고 최대 10억 달러 규모의 지분 투자를 단행한다. 양사는 이번 합작법인을 통해 타워코퍼레이션과 유사한 형태의 위성통신 공유 인프라를 구축할 계획이다. 향후 위성 직접통신(D2D) 시장에서 인프라 경쟁력을 강화하는 계기가 될 것으로 전망된다. 관련 시장의 투자 확대와 협력 구도 변화에 주목할 필요가 있다.", "source": "Light Reading", "date": "2026-09-15 22:28", "url": "https://www.lightreading.com/satellite/space42-and-viasat-to-plow-up-to-1b-into-equatys-d2d-jv", "category": "contract", "importance": 4, "sid": "satellite", "topic": "비아셋 위성통신 합작법인"}, {"title": "Ottawa to help finance nationwide sovereign internet network, Carney says - The Globe and ", "summary": "캐나다 정부가 국가 rl": "https://zdnet.co.kr/view/?no=20260915111732", "category": "contract", "importance": 4, "sid": "competitor", "topic": "두산퓨얼셀 수주"}, {"title": "HFCL boosts capex to ₹1,800 crore for optical fibre production", "summary": "인도의 자국 통신장비 제조업체인 HFCL이 광섬유, 광케이블, 프리폼(Preform)의 생산 능력을 대폭 확대하기 위해 자본적 지출(Capex)을 1,800억 루피 규모로 증액했습니다. 급증하는 글로벌 및 국내 통신 인프라 수요에 적극 대응하기 위한 전략적 투자입니다. 인도의 통신 장비 및 부품 공급망 생태계 강화 행보를 보여줍니다. 주요 장비 업체의 설비 투자 확대를 다루는 중요 경쟁사 동향입니다.", "source": "ET Telecom", "date": "2026-09-15 11:13", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/hfcl-boosts-capex-to-1800-crore-for-optical-fibre-production/134250219", "category": "strategy", "importance": 4, "sid": "competitor", "topic": "hfcl 광섬유"}, {"title": "삼성전자, 美 버라이즌과 6G 핵심기술 ‘ISAC’ 현장 실증 성공 - moneystorm.kr", "summary": "삼성전자가 미국 버라이즌과 협력해 6G 핵심기술인 ISAC 현장 실증을 성공적으로 마쳤다. AI 기반의 센싱 기술을 통해 통신망의 역할을 확장하는 혁신적인 성과를 거두었다. 차세대 통신 인프라 시장에서 삼성의 기술 리더십을 각인시켰다. 글로벌 파트너십을 통한 굳건한 협력을 보여준다.", "source": "moneystorm.kr", "date": "2026-09-15 11:13", "url": "https://www.moneystorm.kr/news/articleView.html?idxno=6496", "category": "tech", "importance": 4, "sid": "competitor", "topic": "머니스톰 삼성전자 美 버라이즌 6g 핵심기술 isac 현장 실증 성공"}, {"title": "삼성전자·버라이즌, 기지국으로 군중 밀집 감지…6G ‘AI ISAC’ 현장 실증 - 이코노미사이언스", "summary": "삼성전자와 버라이즌이 기지국으로 군중 밀집도를 감지하는 6G AI ISAC 현장 실증을 완료했다. 혁신적인 네트워크 성능을 선보였다.", "source": "이코노미사이언스", "date": "2026-09-15 11:11", "url": "https://www.e-science.co.kr/news/articleView.html?idxno=135476", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 ai isac 이코노미사이언스"}, {"title": "기지국이 인파까지 감지…삼성·버라이즌, 통신망으로 혼잡도 분석 - 조세일보", "summary": "기지국이 인파까지 감지하는 기술을 통해 삼성전자와 버라이즌이 통신망으로 혼잡도를 분석하는 데 성공했다. 스마트 네트워크의 활용성을 보여준다.", "source": "조세일보", "date": "2026-09-15 11:08", "url": "https://m.joseilbo.com/news/view.htm?newsid=575696", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 혼잡도 분석"}, {"title": "レベル4の“完全無人タクシー”、東京で2027年に商用化へ GOとWaymo、日本交通が戦略的パートナーシップ", "summary": "GO, 웨이모, 일본교통 3사가 전략적 파트너십을 맺고 도쿄도 내에서 100대 규모의 레벨 4 완전 무인 택시 상용 서비스를 2027년에 개시하겠다고 공식 발표했다. 양사의 배터리 배차 앱을 통해 일반 승객들이 무인 자율주행 택시를 이용할 수 있도록 인프라를 구축할 예정이다. 자율주행 모빌리티 상용화 경쟁에 불을 지피는 대형 제휴이다.", "source": "ITmedia Mobile", "date": "2026-09-15 11:07", "url": "https://www.itmedia.co.jp/mobile/articles/2609/15/news069.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "go·waymo·일본교통 전략"}, {"title": "삼성전자, 미국 버라이즌과 'AI 기반 ISAC' 실증 성공…6G 시대 대비 - 굿모닝경제", "summary": "삼성전자가 미국 버라이즌과 함께 6G 핵심 기술인 ISAC 실증을 성공적으로 마쳐 미래 통신 시장을 준비합니다.", "source": "굿모닝경제", "date": "2026-09-15 11:03", "url": "https://www.goodkyung.com/news/articleView.html?idxno=291389", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 6g 기술 실증"}, {"title": "Rosenblatt Starts Nokia (NOK) at Buy, 'Powerhouse AI Optical Franchise Trading at Telco Mu", "summary": "로젠블랫이 노키아에 대해 매수 의견으로 분석을 시작했다. 매력적인 밸류에이션 속에서 AI 광통신 분야의 강력한 성장 잠재력을 높이 평가했다. 통신장비 시장에서의 반등이 기대된다.", "source": "StreetInsider", "date": "2026-09-15 11:01", "url": "https://www.streetinsider.com/AI/Rosenblatt+Starts+Nokia+%28NOK%29+at+Buy%2C+Powerhouse+AI+Optical+Franchise+Trading+at+Telco+Multiple/27058974.html", "category": "exec", "importance": 4, "sid": "competitor", "topic": "로젠블랫 노키아 매수"}, {"title": "삼성전자·버라이즌, 6G ‘ISAC’ 현장 실증 성공...AI로 군중 밀집도 분...", "summary": "▲ 삼성전자와 버라이존이 6G 핵심 기술 인 ISAC의 현장 실증에 성공했다.(사진: 삼성전자 제공) 삼성전자와 미국 이동통신사 버라이즌이 6G 핵심 기술 로 꼽히는 통신·센싱 융합(ISAC) 기술 을 실제 대규모 행사 현장에...", "source": "idsn.co.kr", "date": "2026-09-15 10:56", "url": "https://idsn.co.kr/news/view/1065578039983725", "category": "tech", "importance": 4, "sid": "satellite", "topic": ""}, {"title": "6년 전 삼성의 ‘소프트웨어 기지국’ 승부…버라이즌과 6G 실증서 통했다 - 이코노미트리뷴", "summary": "삼성전자가 미국 이동통신사 버라이즌과 협력하여 6G 핵심 기술인 소프트웨어 기반 기지국과 ISAC(통신·센싱 융합) 현장 실증에 성공했다. 과거 소프트웨어 기지국 상용화 성공 경험을 바탕으로 6G 시대를 선도하기 위한 기술 주도권 확보에 나서고 있다. 버라이즌과의 강력한 파트너십을 통해 북미 통신장비 시장 내 입지를 공고히 하는 전략적 의미를 지닌다.", "source": "이코노미트리뷴", "date": "2026-09-15 10:55", "url": "https://www.economytribune.co.kr/news/articleView.html?idxno=3903892", "category": "tech", "importance": 4, "sid": "competitor", "topic": "버라이즌 6g 실증"}, {"title": "삼성전자·버라이즌, 6G 핵심 'AI 기반 ISAC' 현장 실증 - 비즈니스플러스", "summary": "삼성전자와 버라이즌이 6G 핵심 기술인 AI 기반 ISAC 현장 실증을 성공적으로 완수했다. 차세대 네트워크 상용화를 위한 기술적 토대를 탄탄히 다지고 있다. 글로벌 시장에서 기술 우위를 다지고 있다.", "source": "비즈니스플러스", "date": "2026-09-15 10:55", "url": "https://www.businessplus.kr/news/articleView.html?idxno=116857", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 isac 현장 실증"}, {"title": "6년 전 삼성의 ‘소프트웨어 기지국’ 승부…버라이즌과 6G 실증서 통했다 - economytribune.co.kr", "summary": "삼성전자가 6년 전에 던졌던 '소프트웨어 기지국' 승부가 버라이즌과의 6G 실증에서 완벽히 통했다. 가상화 네트워크(vRAN) 기술을 바탕으로 한 AI 기반 ISAC 실증이 성공을 거두며 과거의 선제적 투자가 결실을 맺고 있다. 글로벌 통신장비 시장에서 삼성의 비전과 기술력이 옳았음을 증명했다. 네트워크사업부의 전략적 성취를 보여준다.", "source": "economytribune.co.kr", "date": "2026-09-15 10:55", "url": "https://www.economytribune.co.kr/news/articleView.html?idxno=3903892", "category": "tech", "importance": 4, "sid": "competitor", "topic": "이코노미트리뷴 6년 전 삼성 소프트웨어 기지국 승부 버라이즌 6g 실증 통했다"}, {"title": "삼성전자·버라이즌, 6G ‘ISAC’ 현장 실증 성공...AI로 군중 밀집도 분석 - 매일안전신문", "summary": "삼성전자와 버라이즌은 AI로 군중 밀집도를 분석하는 6G ISAC 현장 실증에 성공했다. 통신망의 센싱 능력을 극대화하여 새로운 부가가치 창출 가능성을 보여주었다. 차세대 통신 장비 시장에서 기술력을 다시 한번 각인시켰다. 양사의 파트너십이 순항하고 있다.", "source": "매일안전신문", "date": "2026-09-15 10:53", "url": "https://idsn.co.kr/news/view/1065578039983725", "category": "tech", "importance": 4, "sid": "carrier", "topic": "매일안전신문 삼성전자 6g isac"}, {"title": "[AI픽] KT클라우드, AIDC 20여곳에 1GW 공급…AX 인프라 확대 - yna.co.kr", "summary": "KT클라우드가 향후 AI 데이터센터(AIDC) 인프라를 전국 20여 곳에 구축하여 총 1GW 규모의 용량을 공급하겠다는 비전을 발표했습니다. 폭증하는 인공지능 컴퓨팅 수요에 선제적으로 대응하여 AX(AI Transformation) 인프라 시장의 주도권을 잡겠다는 전략입니다.", "source": "yna.co.kr", "date": "2026-09-15 10:52", "url": "https://www.yna.co.kr/amp/view/AKR20260915074800017", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai 데이터센터 1gw 공급"}, {"title": "삼성·버라이즌, 6G '통신·센싱 융합' 실증…AI로 군중 밀집도 파악", "summary": "삼성전자는 미국 버라이즌과 함께 텍사스의 대형 행사장에서 가상화 네트워크 기반의 6G 통신·센싱 융합(ISAC) 기술을 실증했다. 별도의 추가 센서 장비 없이 기존 통신 인프라와 소프트웨어만으로 군중 밀집도를 실시간 파악하는 데 성공했다. 양사의 협력은 차세대 6G 핵심 기술 상용화 가능성을 입증한 사례로 평가받는다.", "source": "전자신문", "date": "2026-09-15 10:52", "url": "https://www.etnews.com/20260915000162", "category": "tech", "importance": 4, "sid": "competitor", "topic": "삼성전자 기술"}, {"title": "[AI픽] KT클라우드, AIDC 20여곳에 1GW 공급…AX 인프라 확대 - 연합뉴스", "summary": "KT클라우드가 2031년까지 전국 20여 곳에 1GW(기가와트) 규모 이상의 AI 데이터센터(AIDC)를 공급하겠다는 청사진을 밝혔습니다. 급증하는 인공지능 인프라 수요에 대응하기 위해 수도권 클러스터와 지방 거점을 연결하는 투트랙 전략을 추진합니다. AI 전환(AX) 인프라 시장에서 주도권을 확보하기 위한 대규모 투자 계획입니다.", "source": "연합뉴스", "date": "2026-09-15 10:52", "url": "https://www.yna.co.kr/amp/view/AKR20260915074800017", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai데이터센터"}, {"title": "삼성·버라이즌, 6G '통신·센싱 융합' 실증…AI로 군중 밀집도 파악 - 전자신문", "summary": "삼성과 버라이즌이 통신·센싱 융합 기술인 6G ISAC 실증을 성공적으로 마쳤다. AI로 군중 밀집도를 파악하는 실용적인 기능을 검증했다. 차세대 통신 표준화에 기여하고 있다.", "source": "전자신문", "date": "2026-09-15 10:52", "url": "https://www.etnews.com/20260915000162", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성 버라이즌 통신 센싱 융합 실증"}, {"title": "삼성전자·美 버라이즌, AI로 군중 밀집도 잡는다···6G 기술 실증 - 이뉴스투데이", "summary": "삼성전자와 버라이즌이 AI를 활용해 군중 밀집도를 분석하는 6G 기술 실증을 마쳤다. 통신망을 통한 정밀 감지 능력을 성공적으로 입증했다. 기술 상용화를 위한 기반을 다지고 있다.", "source": "이뉴스투데이", "date": "2026-09-15 10:52", "url": "http://www.enewstoday.co.kr/news/articleViewAmp.html?idxno=2470537", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 ai 군중 밀집도 6g"}, {"title": "삼성전자 ·버라이즌, 6G 핵심 'ISAC' 세계 최초 현장 실증 성공", "summary": "삼성전자가 미국 버라이즌과 함께 가상화 네트워크 솔루션을 활용해 6G 핵심 기술인 ISAC 현장 실증에 성공했다. 설지윤 네트워크사업부 상품전략팀장 부사장은 통신이 하드웨어 중심이어야 한다는 틀을 깨고 소프트웨어 기반 차세대 네트워크로의 전환에 성공했다고 밝혔다. 이번 성과는 AI와 6G 시대의 기술 경쟁력을 입증한다.", "source": "delighti.co.kr", "date": "2026-09-15 10:50", "url": "https://www.delighti.co.kr/news/articleView.html?idxno=121850", "category": "tech", "importance": 4, "sid": "competitor", "topic": "삼성전자 버라이즌 6g isac 실증 성공"}, {"title": "삼성전자 ·美 버라이즌, AI로 군중 밀집도 잡는다···6G 기술 실증", "summary": "삼성전자가 버라이즌과 함께 미국 텍사스 글로벌 스포츠 이벤트에서 가상화 네트워크 솔루션을 활용해 AI 기반 ISAC 기술을 실제 행사 환경에 적용했다. ISAC은 통신 인프라에서 데이터 전송과 주변 센싱을 동시에 수행하는 기술로 실증에 성공했다.", "source": "enewstoday.co.kr", "date": "2026-09-15 10:49", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2470537", "category": "tech", "importance": 4, "sid": "competitor", "topic": "삼성전자 버라이즌 ai isac 실증"}, {"title": "박민규, KT·LGU+ 개인정보 침해사고 '은폐방지법' 발의 - 스트레이트뉴스", "summary": "국회에서 KT와 LG유플러스의 개인정보 침해사고 은폐를 막기 위한 '증거보전 의무화법'이 발의되었다. 통신사의 보안 책임을 강화하고 사고 발생 시 투명한 조사를 보장하기 위한 입법이다. 통신 규제 강화의 중요한 전환점이다.", "source": "스트레이트뉴스", "date": "2026-09-15 10:48", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=311212", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 해킹방지법"}, {"title": "SKT \"AI 결제, 문자로 승인받자\"… GSMA에 표준 안건 제안 - 조선일보", "summary": "SK텔레콤이 AI 에이전트가 결제를 수행하기 전 문자로 최종 승인을 받는 'AI 메시징' 기술을 세계이동통신사업자연합회(GSMA) 표준 안건으로 공식 제안했습니다. 차세대 문자 서비스인 RCS를 기반으로 글로벌 AI 커머스 시장에서 표준화를 선도하겠다는 포부입니다.", "source": "조선일보", "date": "2026-09-15 10:46", "url": "https://www.chosun.com/economy/tech_it/2026/09/15/4KNVG45WZRD2RHQX2YTW3L6JSY/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai 메시징 결제 승인 gsma 표준 제안"}, {"title": "KDDI、米SpaceXと次世代通信「Starlink Mobile V2」のサービス提供契約を締結 - ビジネスネットワーク", "summary": "KDDI가 스페이스X와 'Starlink Mobile V2' 서비스 제공 계약을 체결했습니다. 아시아 최초 도입으로 지상 통신 음영 지역 해소를 위한 위성-셀룰러 직접 연동 서비스 상용화에 속도를 내고 있습니다.", "source": "ビジネスネットワーク", "date": "2026-09-15 10:43", "url": "https://businessnetwork.jp/article/37104/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "kddi 위성통신 계약"}, {"title": "KDDI、米SpaceXと次世代通信「Starlink Mobile V2」のサービス提供契約を締結 - businessnetwork.jp", "summary": "KDDI가 미국 스페이스X와 차세대 위성 통신 서비스 제공 계약을 체결하고 협력을 강화합니다.", "source": "businessnetwork.jp", "date": "2026-09-15 10:43", "url": "https://businessnetwork.jp/article/37104/", rrier", "topic": "삼성전자 버라이즌 6g ai 군중 분석"}, {"title": "SKT, AI 시대 맞아 ‘문자’ 역할 재정의한다...GSMA RCS 표준화 회의 개최 - 인공지능신문", "summary": "SK텔레콤이 AI 시대를 맞아 문자 메시지의 역할을 재정의하기 위해 GSMA RCS 표준화 회의를 개최했다. 메시징 서비스를 차세대 AI 에이전트의 승인 채널로 진화시키는 글로벌 표준을 주도하고 있다. 통신 기술 표준화 분야의 중요한 행보이다.", "source": "인공지능신문", "date": "2026-09-15 08:40", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41911", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 rcs"}, {"title": "ESpanix Deploys Nokia Deepfield Defender to Protect Spain's Internet Traffic from DDoS Att", "summary": "스페인의 에스파닉스가 스페인 인터넷 트래픽을 디도스 공격으로부터 보호하기 위해 노키아 딥필드 디펜더를 도입했습니다. 고도화되는 사이버 위협으로부터 국가 핵심 트래픽을 안전하게 보호합니다. 네트워크 보안 장비 공급 실적입니다.", "source": "NewswireToday", "date": "2026-09-15 08:40", "url": "https://www.newswiretoday.com/news/186850/ESpanix-Deploys-Nokia-Deepfield-Defender-to-Protect-Spains-Internet-Traffic-from-DDoS-Attacks/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 보안 장비"}, {"title": "삼성전자, 美 버라이즌과 6G 핵심 기술 실증...업계 최초", "summary": "[지디넷코리아]삼성전자가 기존 네트워크 장비 변경 없이 소프트웨어 적용만으로 차세대 네트워크 솔루션을 구현하는 성과를 거뒀다.삼성전자는 미국 이동통신사업자 버라이즌(Verizon)과 가상화 네트워크 솔루션을 활용해 6G 핵심 기술인 '통신·센싱 융합 기술(ISAC)' 현장 실증에 업계 최초로 성공했다고 15일 밝혔다.삼성전자와 버라이즌은 지난 7월 미국 텍사스에서 열린 글로벌 스포츠 이벤트에…", "source": "ZDNet Korea", "date": "2026-09-15 08:33", "url": "https://zdnet.co.kr/view/?no=20260915082154", "category": "tech", "importance": 4, "sid": "satellite", "topic": ""}, {"title": "장비 추가 없이 SW 군중 감지…삼성전자, 美 버라이즌과 6G ISAC 실증 - ddaily.co.kr", "summary": "삼성전자가 미 버라이즌과의 협력을 통해 별도 장비 추가 없이 소프트웨어만으로 군중을 감지하는 6G ISAC 기술 실증에 성공했다. 통신 기지국 전파의 반사파를 AI로 분석하여 실시간 인파 분석이 가능함을 증명했다. 통신사업자들에게 추가 투자 부담을 줄여주는 혁신적인 솔루션으로 평가받는다. 삼성전자의 차세대 R&D 경쟁력을 입증하는 대표적 사례다.", "source": "ddaily.co.kr", "date": "2026-09-15 08:29", "url": "https://www.ddaily.co.kr/page/view/2026091508284210354", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 실증"}, {"title": "삼성전자, 150년 통신의 틀 깼다…美 버라이즌과 ‘6G 신기술’ 세계 첫 실증 - 이슈밸리", "summary": "삼성전자가 미국 통신사 버라이즌과 협력해 세계 최초로 6G 'AI 기반 ISAC(통신·센싱 융합기술)' 실증에 성공했습니다. 통신망을 센서로 확장해 군중 밀집도 등을 파악하는 차세대 기술을 현장에서 입증했습니다. 이는 향후 6G 상용화 국면에서 네트워크 장비 시장의 경쟁 우위를 선점하는 중요한 계기가 될 것으로 기대됩니다.", "source": "이슈밸리", "date": "2026-09-15 08:24", "url": "https://www.issuevalley.com/news/articleView.html?idxno=56339", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 수주"}, {"title": "삼성전자, 美 버라이즌과 6G 핵심기술 'AI 기반 ISAC' 세계 첫 실증 .... \"통신망이 곧 CCTV\" - 워크투데이", "summary": "삼성전자가 미국 버라이즌과 6G 핵심 기술인 AI 기반 ISAC를 세계 최초로 실증하며 통신망이 곧 CCTV 역할을 할 수 있음을 입증했다. 인프라 효율성을 극대화하는 획기적인 기술이다. 글로벌 장비 시장의 이목이 집중됐다.", "source": "워크투데이", "date": "2026-09-15 08:18", "url": "http://www.worktoday.co.kr/news/articleView.html?idxno=89243", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 isac cctv 대체"}, {"title": "삼성전자·버라이즌, 6G 핵심 'AI 기반 ISAC' 실증 성공 - 더트래커", "summary": "삼성전자가 미국 통신사 버라이즌과 협력해 6G 핵심 기술인 'AI 기반 ISAC(통신·센싱 통합)'의 현장 실증에 성공했습니다. 이번 실증은 별도의 센서 없이 통신망을 활용해 인파나 군중 밀집도를 실시간으로 감지할 수 있음을 입증했습니다. 양사는 차세대 통신망의 센서 확장 가능성을 보여주며 6G 상용화 기반을 다지고 있습니다.", "source": "더트래커", "date": "2026-09-15 08:16", "url": "https://thetracker.co.kr/View.aspx?No=4227016", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌"}, {"title": "삼성전자·버라이즌, 6G 핵심기술 ‘ISAC’ 업계 최초 현장 실증 - 키즈맘", "summary": "삼성전자가 버라이즌과 함께 6G 핵심 기술인 ISAC를 업계 최초로 현장 실증했다. 통신 인프라의 새로운 가능성을 활짝 열었다. 글로벌 장비 시장에서 삼성의 저력을 다시 한번 각인시켰다.", "source": "키즈맘", "date": "2026-09-15 08:16", "url": "https://www.kizmom.com/news/articleView.html?idxno=112722", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 isac 업계 최초 실증"}, {"title": "삼성전자·버라이즌, 6G 핵심 'AI 기반 ISAC' 실증 성공 - thetracker.co.kr", "summary": "삼성전자와 버라이즌이 6G의 핵심인 AI 기반 ISAC 기술 실증에 성공했다. 통신망이 주변 환경을 인지하는 스마트 인프라의 가능성을 증명했다. 양사의 기술 협력 성과가 업계의 주목을 받고 있다.", "source": "thetracker.co.kr", "date": "2026-09-15 08:16", "url": "https://thetracker.co.kr/View.aspx?No=4227016", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성 버라이즌 ai isac 실증"}, {"title": "삼성전자·버라이즌, 6G 핵심기술 ‘ISAC’ 업계 최초 현장 실증 - kizmom.com", "summary": "삼성전자와 버라이즌이 6G 핵심기술인 ISAC의 업계 최초 현장 실증을 성공적으로 끝마쳤다. 통신망의 센서화라는 혁신적 개념을 실제 현장에서 구현해 냈다. 차세대 통신 장비 시장에서의 기술 우위를 확실히 다졌다. 글로벌 업계의 찬사를 받고 있다.", "source": "kizmom.com", "date": "2026-09-15 08:16", "url": "https://www.kizmom.com/news/articleView.html?idxno=112722", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 isac 현장"}, {"title": "모건스탠리, 에코 스타 '비중확대' 추천…\"스페이스X 지분 할인 효과\"", "summary": "모건스탠리가 에코스타에 대해 비중확대 의견을 제시하며 스페이스X 지분 할인 효과를 언급했습니다. 에코스타는 지난해 스페이스X와 약 170억 달러 규모의 무선 주파수 라이선스 계약을 체결한 바 있습니다. 위성통신 사업자 간 대규모 파트너십 관련 내용입니다.", "source": "news.einfomax.co.kr", "date": "2026-09-15 07:52", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4434822", "category": "contract", "importance": 4, "sid": "satellite", "topic": "에코스타 스페이스x"}, {"title": "Iridium, Deutsche Telekom IoT and Toyota Demonstrate Satellite Voice Messaging - The Fast ", "summary": "이리듐, 도이치텔레콤 IoT, 토요타가 협력하여 위성 기반 음성 메시징 기술 시연에 성공했다. 위성통신과 지상망 및 모빌리티의 융합 기술이 진전되고 있다.", "source": "The Fast Mode", "date": "2026-09-15 07:45", "url": "https://www.thefastmode.com/technology-solutions/50581-iridium-deutsche-telekom-iot-and-toyota-demonstrate-satellite-voice-messaging", "category": "tech", "importance": 4, "sid": "satellite", "topic": "이리듐 위성통신"}, {"title": "폴란드, 자체 스타링크 구축 시동… 2030년 통신망 독립 추진", "summary": "폴란드가 자체 스타링크 구축에 시동을 걸며 2030년 통신망 독립을 추진합니다. 도널드 투스크 폴란드 총리가 방산 박람회 연설에서 스페이스X의 군집 통신망에 비유하며 국가적 목표를 제시했습니다. 국가 차원의 저궤도 위성통신망 도입 추진 사례입니다.", "source": "g-enews.com", "date": "2026-09-15 07:40", "url": "https://www.g-enews.com/view.php?ud=20260915072908194220990b2dc5_1", "category": "contract", "importance": 4, "sid": "satellite", "topic": "폴란드 스타링크"}, {"title": "Verizon Communications (VZ) Added Nine Members To Its 6G Forum - finance.yahoo.com", "summary": "버라이즌이 6G 포럼에 9개 파트너를 추가했습니다. 6G 기술 협력 생태계 확장 전략입니다.", "source": "finance.yahoo.com", "date": "2026-09-15 07:14", "url": "https://finance.yahoo.com/technology/articles/verizon-communications-vz-added-nine-221407193.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 포럼"}, {"title": "ドコモが年度内に5G基地局1万局以上整備へ 通信品質が他社並みに 5G優先制御も検討 - ｄメニューニュース", "summary": "도코모가 회계연도 내 5G 기지국 1만국 이상을 추가 정비해 통신 품질을 타사 수준으로 끌어올리고 5G 우선 제어를 검토한다. 품질 개선을 위한 대규모 인프라 투자와 네트워크 고도화 의지를 보여준다.", "source": "ｄメニューニュース", "date": "2026-09-15 07:09", "url": "https://topics.smt.docomo.ne.jp/article/sankei/business/sankei-_economy_it_KDJGGYHWRJOOVJEQD4G556BKCM", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt docomo 5g 기지국"}, {"title": "Verizon Adds AWS, Cisco, Intel, NVIDIA and Others to Expanded 6G Innovation Forum - The Fa", "summary": "미국 통신사 버라이즌이 자사의 '6G 혁신 포럼'에 AWS, 시스코, 인텔, 엔비디아 등 글로벌 유수 테크 기업들을 대거 추가하며 참여 진영을 대폭 확장했다. 차세대 6G 생태계 조성을 위한 통신사와 빅테크 간 기술 표준 및 상용화 공조가 본격화되고 있다.", "source": "The Fast Mode", "date": "2026-09-15 07:03", "url": "https://www.thefastmode.com/technology-solutions/50567-verizon-adds-aws-cisco-intel-nvidia-and-others-to-expanded-6g-innovation-forum", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 혁신 포럼 멤버십 확대"}, {"title": "Samsung, Verizon Complete 6G ISAC Trial Using AI-Powered Virtualized Network - The Fast Mo", "summary": "삼성전자와 버라이즌이 AI 기반의 가상화 네트워크(vRAN)를 활용해 6G ISAC 실증을 완수했다. 통신 인프라가 단순 데이터 전송을 넘어 주변 환경을 감지하는 센서 기능을 수행하도록 진화했음을 보여주었다. AI 알고리즘을 결합하여 정밀한 군중 분석과 실시간 모니터링이 가능함을 입증했다. 향후 6G 상용화 과정에서 차별화된 네트워크 서비스 모델을 제시하는 중요한 이벤니다.", "source": "The Fast Mode", "date": "2026-09-15 07:01", "url": "https://www.thefastmode.com/technology-solutions/50571-samsung-verizon-complete-6g-isac-trial-using-ai-powered-virtualized-network", "category": "tech", "importance": 4, "sid": "competitor", "topic": "더패스트모드 삼성전자 버라이즌 ai 가상화 네트워크 6g 실증"}, {"title": "楽天モバイル、ID未連携回線の「強制解約」を撤回。 - smhn.info", "summary": "라쿠텐모바일이 ID 미연동 회선의 강제 해약 정책을 철회했습니다.", "source": "smhn.info", "date": "2026-09-15 06:54", "url": "https://smhn. ericsson-pairs-with-nex-tech-wireless-to-launch-5g-standalone-in-rural-kansas/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 넥스텍 와이어리스 5g sa 상용화"}, {"title": "에어프랑스, 제52회 도빌 아메리칸 영화제 공식 파트너로 참여···조디...", "summary": "에어프랑스가 영화제 공식 파트너로 참여하며 스타링크 기반의 기내 초고속 무료 와이파이 서비스를 제공하고 있습니다. 승객들은 비행 중 고화질 영상 스트리밍 등을 이용할 수 있습니다. 글로벌 항공사의 저궤도 위성통신 도입 사례입니다.", "source": "sports.khan.co.kr", "date": "2026-09-15 00:56", "url": "https://sports.khan.co.kr/article/202609150055003?pt=nv", "category": "contract", "importance": 4, "sid": "satellite", "topic": "에어프랑스 스타링크"}, {"title": "6G Investment Race Begins as Telecom Operators Prepare Networks for 2030 - TelecomLead", "summary": "2030년 상용화를 목표로 통신 사업자들이 네트워크 준비에 돌입하면서 6G 투자 경쟁이 본격화되고 있다. 차세대 이동통신 기술 표준화와 인프라 구축 움직임이 빨라지는 추세다.", "source": "TelecomLead", "date": "2026-09-15 00:54", "url": "https://telecomlead.com/6g/6g-investment-race-begins-as-telecom-operators-prepare-networks-for-2030-127725", "category": "tech", "importance": 4, "sid": "satellite", "topic": "6g 인프라 투자"}, {"title": "Top 10 Mobile Network Deals of 2026: Ericsson, Nokia, Samsung and Huawei Lead 5G Investmen", "summary": "텔레콤리드가 2026년 주요 모바일 네트워크 거래 Top 10을 발표했다. 에릭슨, 노키아, 삼성, 화웨이가 5G 투자를 주도하고 있는 것으로 나타났다. 글로벌 통신장비 시장의 주요 수주 트렌드와 경쟁 구도를 보여준다.", "source": "TelecomLead", "date": "2026-09-15 00:47", "url": "https://telecomlead.com/telecom-equipment/top-10-mobile-network-deals-of-2026-ericsson-nokia-samsung-and-huawei-lead-5g-investment-cycle-127719", "category": "contract", "importance": 4, "sid": "competitor", "topic": "텔레콤리드 장비 계약"}, {"title": "AT&T Business, Amazon Leo Ink Deal to Expand Public Sector Connectivity - ExecutiveBiz", "summary": "AT&T 비즈니스가 아마존 Leo와 손잡고 공공 부문 연결성 확대를 위한 계약을 체결했다. 공공 기관과 정부 고객을 대상으로 안정적인 위성 브로드밴드 서비스를 제공하는 것이 목표다. 위성 통신 사업자와 대형 통신사 간 B2B 협력이 공공 시장으로 확장되고 있음을 보여준다. 차세대 위성 네트워크의 상용화 레퍼런스로 기능할 전망이다.", "source": "ExecutiveBiz", "date": "2026-09-15 00:42", "url": "https://www.executivebiz.com/articles/att-business-amazon-leo-satellite-connectivity-agreement", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 공공위성계약"}, {"title": "Viasat and Space42 Commit Up to $1 Billion to Shared D2D Satellite Platform Equatys - iotb", "summary": "비아셋과 스페이스42가 공유형 D2D 위성 플랫폼 '에쿼티스' 구축을 위해 최대 10억 달러를 투자하기로 약정했다. 양사는 위성 통신 서비스 확장을 위해 협력을 강화할 계획이다. 이번 투자는 차세대 위성 통신 시장의 경쟁 구도에 영향을 미칠 것으로 보인다.", "source": "iotbusinessnews.com", "date": "2026-09-15 00:33", "url": "https://iotbusinessnews.com/2026/09/14/viasat-and-space42-commit-up-to-1-billion-to-shared-d2d-satellite-platform-equatys/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "비아셋 투자"}, {"title": "AWS, Nvidia among new recruits for Verizon's 6G Innovation Forum", "summary": "버라이즌은 AWS, 시스코, 인텔, 엔비디아 등 주요 기술 기업들이 자사의 6G 혁신 포럼(6GIF)에 합류했다고 발표했다. 이번 파트너십을 통해 차세대 통신 인프라와 6G 기술 표준화 연구에 속도를 낼 계획이다. 글로벌 주요 통신장비 및 클라우드 기업들이 대거 참여하면서 생태계 확장이 기대된다. 이는 향후 6G 상용화 과정에서 주도권을 잡기 위한 전략적 행보로 분석된다.", "source": "Light Reading", "date": "2026-09-15 00:32", "url": "https://www.lightreading.com/6g/aws-nvidia-among-new-recruits-for-verizon-s-6g-innovation-forum", "category": "tech", "importance": 4, "sid": "satellite", "topic": "버라이즌 기술"}, {"title": "New CRTC rules aim to make internet plans easier to understand - MobileSyrup", "summary": "캐나다 CRTC의 새로운 규칙이 인터넷 요금제를 더 이해하기 쉽게 만드는 것을 목표로 시행됩니다. 통신 소비자 보호 및 규제 정책입니다.", "source": "MobileSyrup", "date": "2026-09-15 00:23", "url": "https://mobilesyrup.com/2026/09/14/crtc-new-internet-rules-easier-to-understand/", "category": "policy", "importance": 4, "sid": "policy", "topic": "캐나다방송통신규제위 인터넷규정"}, {"title": "【重要】楽天モバイル、楽天IDとの未連携ユーザーの自動解約措置を撤回。12月以降も契約維持、基本的利用が可能へ - gapsis.jp", "summary": "라쿠텐 모바일의 이용약관 변경에 따른 강제 해약 방침이 철회되어 이용자들이 기존 번호와 회선을 계속 유지할 수 있게 되었다.", "source": "gapsis.jp", "date": "2026-09-15 00:01", "url": "https://www.gapsis.jp/2026/09/rakuten-mobile-id-renkei-cancel-cancel.html", "category": "policy", "importance": 4, "sid": "carrier", "topic": "라쿠텐 모바일 id 연계 자동해약 철회"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視", "summary": "NTT 도코모가 2027년 회계연도 내에 5G 통신 영역을 SA(단독모드) 대응 영역과 일치시키겠다는 목표를 밝혔다. 외부 품질 조사 순위 경쟁보다는 실제 이용자가 체감하는 품질 향상을 최우선으로 두겠다는 방침이다. 트래픽 집중 구간의 다운로드 속도 개선과 생성형 AI 확산에 대비한 신기술 도입을 추진하고 있다. 국내외 통신사들의 망 투자 방향에 시사하는 바가 크다.", "source": "ITmedia Mobile", "date": "2026-09-15 00:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/15/news055.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 5g 전략"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視（1/2 ページ） - ITmedia Mobile - ITmedia", "summary": "NTT 도코모가 2027년도 내에 '5G 영역 = SA(단독모드) 대응 영역'으로 만들겠다는 목표를 선언했다. 단순 품질 순위 경쟁보다는 소비자가 체감하는 '체감 품질' 향상에 주력할 방침이다. 5G SA 전환을 가속화하여 네트워크 고도화를 추진하겠다는 전략적 방향을 제시했다. 일본 이동통신 시장의 네트워크 업그레이드 로드맵을 보여준다.", "source": "ITmedia", "date": "2026-09-15 00:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/15/news055.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "도코모 5g전략"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視（ITmedia Mobile） - Yahoo!ニュース", "summary": "NTT도코모가 2027년까지 5G SA 커버리지를 대폭 확대하고 체감 품질 중심으로 망 운영 전략을 전환한다. 통신사의 5G 고도화 로드맵을 담은 보도이다.", "source": "Yahoo!ニュース", "date": "2026-09-15 00:00", "url": "https://news.yahoo.co.jp/articles/dc7cb43d2ea7c9282744f9776241e39c265a6b55", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 5g"}, {"title": "ドコモ「スマホが繋がらない」はどう解消される？ キーパーソンが語る2026年夏の通信品質改善の今とこれから", "summary": "NTT 도코모가 2022년 이후 제기된 통신 품질 저하 문제에 대응해 대규모 설비 투자와 기술적 대책을 지속해 온 현황을 다뤘다. 도코모는 체감 품질 향상을 최우선으로 두고 도심지 리소스 집중 및 800MHz帯 4G 전용 등을 추진 중이다. 외부 조사 순위보다 가입자 체감 품질 개선에 집중하겠다는 전략을 밝혔다. 통신사의 네트워크 품질 개선 투자 동향을 보여준다.", "source": "ケータイ Watch", "date": "2026-09-15 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/interview/2140815.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 품질"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視（ITmedia Mobile） - news.yahoo.co.jp", "summary": "NTT도코모가 2027년까지 5G 에어리어와 SA 대응 에어리어를 일치시키고 체감 품질을 중시하는 품질 전략을 추진합니다.", "source": "news.yahoo.co.jp", "date": "2026-09-15 00:00", "url": "https://news.yahoo.co.jp/articles/dc7cb43d2ea7c9282744f9776241e39c265a6b55", "category": "strategy", "importance": 4, "sid": "carrier", "topic": "ntt도코모 5g sa 목표"}, {"title": "ドコモ、2027年度中に「5Gエリア＝SA対応エリア」目指す 品質1位にこだわらず“体感品質”の向上を重視 - Infoseek", "summary": "NTT 도코모가 2027년까지 5G 서비스 지역을 전면 SA 대응으로 전환하여 체감 품질을 극대화하겠다고 선언했습니다. 네트워크 고도화를 통해 서비스 품질 경쟁력을 재구축하려는 의도입니다.", "source": "Infoseek", "date": "2026-09-15 00:00", "url": "https://news.infoseek.co.jp/amp/article/itmedia_mobile_20260915055/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 5g sa 전환"}, {"title": "クアルコム、次世代「Hexagon NPU」発表──なぜエージェント型AIに“全く異なる設計”が必要なのか", "summary": "퀄컴이 스마트폰 등에 탑재될 차세대 '헥사곤 NPU'의 개요를 공개하며 '단일 거대 AI'에서 '복수의 전문 AI 연동'으로 진화하는 에이전트형 AI에 맞춘 완전히 새로운 설계 방식을 도입했다고 밝혔습니다. 모바일 프로세서 및 AI 반도체 분야의 핵심 기술 발전 방향을 보여줍니다. 경쟁사의 플래그십급 칩셋 아키텍처 변경으로 업계에 큰 시사점을 줍니다. 통신 및 디바이스용 AI 하드웨어 경쟁력을 가늠하는 중요 기술 뉴스입니다.", "source": "ケータイ Watch", "date": "2026-09-15 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2140807.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "퀄컴 npu"}, {"title": "Can AST SpaceMobile's Expanding MNO Base Boost Its Revenue Prospects? - The Globe and Mail", "summary": "위성통신 기업 AST스페이스모바일(AST SpaceMobile)이 글로벌 모바일 네트워크 사업자(MNO) 파트너십을 60개 이상으로 대거 확충했다고 발표했다. 저궤도 위성을 활용한 Direct-to-Cell(직접연결) 서비스 상용화를 위해 전 세계 주요 통신사들과의 협력망을 넓히고 있으며, 기업 가치 상승 및 시장 지배력 강화로 이어지고 있다.", "source": "The Globe and Mail", "date": "2026-09-15 00:00", "url": "https://www.theglobeandmail.com/investing/markets/stocks/ASTS/pressreleases/4591703/can-ast-spacemobiles-expanding-mno-base-boost-its-revenue-prospects/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "ast스페이스모바일 mno 파트너십 확장"}], "2026-09-16": [{"title": "DDoS attack targets Meo's international network - Telecompaper", "summary": "포르투갈 통신사 메오(Meo)의 국제 네트워크가 대규모 디도스(DDoS) 사이버 공격을 받아 트래픽 장애가 발생했다. 주요 통신사의 해외 연동망 마비로 서비스 이용에 차질이 빚어졌다.", "source": "Telecompaper", "date": "2026-09-16 23:38", "url": "https://www.telecompaper.com/news/ddos-attack-targets-meos-international-network--1582880", "category": "outage", "importance": 5, "sid": "outage", "topic": "메오 국제 네트워크 디도스 공격 장애"}, {"title": "China urges EU to avoid discriminatory restrictions after European telecom firms warn new ", "summary": "유럽 통신사들이 새로운 통신 장비 규제에 대해 경고 목소리를 낸 가운데, 중국 정부가 EU를 향해 차별적인 규제와 제한 조치를 피할 것을 강력히 촉구했다. 글로벌 통신 장비 시장에서 화웨이 등 중국산 장비 배제 움직임과 맞물려 지정학적 긴장이 고조되고 있다. 공급망 재편에 중대한 영향을 미치는 사안이다.", "source": "Global Times", "date": "2026-09-16 17:37", "url": "https://www.globaltimes.cn/page/202609/1370665.shtml", "category": "policy", "importance": 5, "sid": "policy", "topic": "중국정부 통신장비제재"}, {"title": "[단독]SKT·KT, 삼성에 5G 장비 '64TRx' 공급 요청 - etnews.com", "summary": "SK텔레콤과 KT가 삼성전자에 5G 장비인 '64TRx' 공급을 공식 요청한 것으로 확인됐다. 국내 이동통신사의 대규모 5G 고도화 투자에 발맞춰 삼성전자의 국내 장비 공급 물량이 대폭 확대될 전망이다. 네트워크사업부의 실적에 직접적인 영향을 미치는 대형 수주 성과다.", "source": "etnews.com", "date": "2026-09-16 15:19", "url": "https://www.etnews.com/tools/image_popup.html?v=bjQ5VkNYY2dLZTZMZFBUbmNzandvWmpGcjBTK1pHYm1CUVRXR0pTMldlYUpBNytPMStLVCt4WGtiTi8vZ0JPUTd0eGtZa3dkNG5zM094UHYvK1IyRGlSWmhkV0Q3VFFjT0trV0thRjlPM0VjTnowTFFTK09vbHdQQjV5bnJaU1lUNm5sbkd2NHg5WFZLUWhEVlF0OVFOSS9jTTNJdndOMEt6Ry9kTnU0ZktIQXlla3Ixb1ZuYXRyb3dVYTN0MXBqN3pIM3hPTXAwekJrZVBpcW1iTkpuTWQ0eEkzZUFtMVZEUG9aTUE5YVNjNU0yVkh0c1dYVlZ6SjZUUXdHZ3FUT1R2QW13NHFuOGlhOFJJZzNxLzhwdlE9PQ", "category": "contract", "importance": 5, "sid": "competitor", "topic": "삼성전자 5g 장비"}, {"title": "삼성전자, 미국 버라이즌과 6G 핵심 기술인 ‘AI 기반 ISAC’ 실증 성공 - senews.kr", "summary": "삼성전자가 미국 버라이즌과 6G 핵심 기술인 AI 기반 ISAC 실증에 성공했습니다. 이는 6G 네트워크가 통신과 센싱을 동시에 수행할 수 있음을 입증한 중요한 성과입니다.", "source": "senews.kr", "date": "2026-09-16 15:06", "url": "http://www.senews.kr/41170", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성 버라이즌 6g 실증"}, {"title": "European telecoms warn EU, Huawei 5G ban could cost €40 billion - Huawei Central", "summary": "유럽 통신사들이 화웨이 5G 장비 금지 시 400억 유로의 비용이 발생할 수 있다고 경고했습니다.", "source": "Huawei Central", "date": "2026-09-16 13:18", "url": "https://www.huaweicentral.com/european-telecoms-warn-eu-huawei-5g-ban-could-cost-e40-billion/", "category": "policy", "importance": 5, "sid": "policy", "topic": "eu 중국 장비 제재"}, {"title": "삼성전자, 美 버라이즌과 업계 최초 ‘AI 기반 6G’ 실증 성공 - 뉴뉴스", "summary": "삼성전자가 미국 버라이즌과 손잡고 업계 최초로 ‘AI 기반 6G’ 기술 현장 실증에 성공했다. 기존 상용 5G 네트워크와 소프트웨어 업그레이드만으로 통신망을 고정밀 센서로 활용하는 ISAC 기술을 구현했다. 통신과 센싱을 융합하여 자율주행과 군중 밀집도 분석 등을 가능케 하는 차세대 핵심 기술이다. 이번 성과는 글로벌 6G 표준화 경쟁에서 삼성전자의 압도적인 기술 리더십을 각인시키는 계기가 되었다.", "source": "뉴뉴스", "date": "2026-09-16 10:37", "url": "https://www.nnewss.com/news/articleView.html?idxno=6826", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성전자 수주"}, {"title": "EU telecoms bosses oppose ban on Chinese equipment suppliers - ET Telecom", "summary": "유럽 주요 통신사 최고경영자(CEO)들이 EU의 중국산 통신장비 공급업체 퇴출 및 금지 계획에 대해 공식 반대 입장을 밝혔다. 본 건은 주요국 정부 및 연합체의 중국산 장비(화웨이·ZTE 등) 제재·퇴출 기조에 대한 통신 업계의 반발을 다룬 대형 규제 이슈로, 글로벌 네트워크 장비 시장의 판도에 직결되는 최고 중요도(imp=5) 사안이다.", "source": "ET Telecom", "date": "2026-09-16 09:52", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/eu-telecoms-bosses-oppose-ban-on-chinese-equipment-suppliers/134275806", "category": "policy", "importance": 5, "sid": "policy", "topic": "유럽 통신사 수장들 중국산 장비 금지 반대"}, {"title": "Nokia Gets Buy Rating as Analyst Sees Undervalued AI Optical Play - finance.biggo.com", "summary": "글로벌 투자은행과 애널리스트들이 노키아의 AI 기반 광학 네트워크 기술 잠재력을 높이 평가하며 매수 의견을 제시했다. AI 데이터센터 확장에 따른 광학 장비 수요 증가로 수혜가 기대된다. 현재 보수적인 통신 시장 멀티플에 거래되어 저평가된 종목으로 분류된다. 향후 통신장비 시장에서 광학 및 보안 포트폴리오 강화의 발판이 될 전망이다.", "source": "finance.biggo.com", "date": "2026-09-16 03:37", "url": "https://finance.biggo.com/news/4e736006-669e-48a2-8ae0-abe3a6f81c1d", "category": "other", "importance": 5, "sid": "competitor", "topic": "노키아 ai"}, {"title": "Verizon and Samsung Turned Dallas Soccer Crowd Into Live 6G Sensing Lab - Tech Times", "summary": "버라이즌과 삼성전자가 달라스 축구 관중 군중을 라이브 6G 센싱 실험실로 활용했다. 대규모 인파 속에서 ISAC 기술을 성공적으로 시연했다. 상용 네트워크의 6G 진화 가능성을 각인시켰다.", "source": "Tech Times", "date": "2026-09-16 00:29", "url": "https://www.techtimes.com/articles/327554/20260915/verizon-samsung-turned-dallas-soccer-crowd-live-6g-sensing-lab.htm", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성전자 버라이즌 실증"}, {"title": "ASTS Stock Slides Premarket: AT&T Says SpaceX And Amazon Could Rival AST SpaceMobile In Sa", "summary": "AT&T가 스페이스X와 아마존이 AST 스페이스모바일의 경쟁자가 될 수 있다고 언급했습니다. 위성통신 시장의 경쟁 구도 변화를 시사합니다.", "source": "Stocktwits", "date": "2026-09-16 23:59", "url": "https://stocktwits.com/news-articles/markets/equity/asts-stock-slides-premarket-att-flags-spacex-amazon-as-rivals/cZBfYzqRebM", "category": "tech", "importance": 4, "sid": "satellite", "topic": "at&t 위성통신"}, {"title": "RAN edge to DC plumbing – Nokia chases AI ‘supercycle’ everywhere", "summary": "노키아가 모바일 사업자와의 AI-RAN 추진, 정부 대상 방산 네트워크 공급, 인터넷 익스체인지 보안 판매, 장거리 광인프라 업그레이드 등 다방면으로 AI 슈퍼사이클을 쫓고 있다.", "source": "RCR Wireless", "date": "2026-09-16 23:57", "url": "https://rcrwireless.com/20260916/network-infrastructure/ran-edge-to-dc-plumbing-nokia-chases-ai-supercycle-everywhere", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 ai 슈퍼사이클"}, {"title": "Charter Offering its Spectrum Plans to Cox Customers - Broadband Breakfast", "summary": "차터가 콕스 고객들을 대상으로 자사의 스펙트럼 플랜을 제공하기 시작했다. 인수 지역에서의 서비스 마이그레이션이 본격적으로 진행되고 있다.", "source": "Broadband Breakfast", "date": "2026-09-16 23:56", "url": "https://broadbandbreakfast.com/charter-offering-its-spectrum-plans-to-cox-customers/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터 커뮤니케이션즈 콕스 인수 통합"}, {"title": "Spectrum services now available across former Cox markets - Telecompaper", "summary": "스펙트럼 서비스가 이전 콕스 시장 전역에서 이용 가능해졌습니다. 통신사의 서비스 지역 확대 사례입니다.", "source": "Telecompaper", "date": "2026-09-16 ategory": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 ai-ran 전략 강화"}, {"title": "Nvidia AI Moves Into Cell Towers With Nokia - NVIDIA (NASDAQ:NVDA), Nokia (NYSE:NOK) - Ben", "summary": "엔비디아의 인공지능 기술이 노키아의 협력을 통해 셀 타워 영역으로 본격적으로 진입하고 있다. 양사의 결합은 통신 타워의 컴퓨팅 성능을 극대화하고 AI-RAN 상용화를 앞당기는 계기가 될 전망이다. 글로벌 장비사와 빅테크 간의 핵심 협력 사례다.", "source": "Benzinga", "date": "2026-09-16 22:44", "url": "https://www.benzinga.com/trading-ideas/long-ideas/26/09/61815413/nvidia-ai-nokia-cell-towers", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 엔비디아 ai-ran 협력"}, {"title": "Nvidia’s AI Is Moving Into Cell Towers—and Nokia Is Already Testing It - TradingView", "summary": "엔비디아의 인공지능 기술이 기지국 타워 내부로 진입하고 있으며 노키아가 이를 활용한 AI-RAN 실증 시험을 이미 진행 중인 것으로 나타났다. 통신장비와 반도체 강자의 협력이다.", "source": "TradingView", "date": "2026-09-16 22:44", "url": "https://www.tradingview.com/news/benzinga:44ea41e61094b:0", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 엔비디아"}, {"title": "4GHz is key for US wireless and AI leadership – CTIA", "summary": "- CTIA, 6G 주도권 확보를 위해 4GHz 대역의 조속한 재배치 촉구\n- 정책 입안자들에게 신속한 조치 요구", "source": "Light Reading", "date": "2026-09-16 22:39", "url": "https://www.lightreading.com/regulatory-politics/4ghz-is-key-for-us-wireless-and-ai-leadership-ctia", "category": "tech", "importance": 4, "sid": "policy", "topic": "미국 주파수 정책"}, {"title": "Spectrum Says 'Hi!' to 11+ Million Homes & Businesses - Charter Communications", "summary": "차터커뮤니케이션스의 스펙트럼 서비스가 1,100만 가구 및 기업을 추가로 커버하게 되었습니다. 초고속인터넷 및 케이블 서비스의 가입자망이 대폭 확장되었습니다.", "source": "Charter Communications", "date": "2026-09-16 22:35", "url": "https://corporate.charter.com/newsroom/spectrum-says-hi-to-11-million-homes-and-businesses", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터커뮤니케이션스 스펙트럼 확장"}, {"title": "Nokia stock jumps 6% as AI-RAN trials expand to eight operators - Crypto Briefing", "summary": "노키아의 AI-RAN 시험 참여 통신사가 8개사로 늘어나면서 기술 상용화 기대감이 커지고 주가가 6% 올랐 category": "earnings", "importance": 4, "sid": "competitor", "topic": "노키아 주가 상승 배경 분석"}, {"title": "SpaceX sees mostly friendly skies from rural carriers - Fierce Network", "summary": "스페이스X(스타링크)가 미국 내 지역 중소형 통신사(rural carriers)들과 우호적인 협력 관계를 형성하며 위성-셀룰러 연동 서비스 영역을 넓히고 있습니다. 지상망이 닿지 않는 농어촌 지역에서 통신사들과의 마찰 없이 상생하며 위성 통신 커버리지를 확장하는 전략입니다. 위성통신이 기존 통신사 생태계에 미치는 영향력을 보여줍니다.", "source": "Fierce Network", "date": "2026-09-16 21:20", "url": "https://www.fierce-network.com/wireless/spacex-sees-mostly-friendly-skies-rural-carriers", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스페이스x 위성통신"}, {"title": "삼성전자, 6G 핵심기술 'ISAC' 현장 실증 성공 - 더칼럼니스트", "summary": "삼성전자가 미국 버라이즌과 협력하여 6G 핵심 기술인 '통신·센싱 융합(ISAC)'의 현장 실증에 성공했다. 기존 통신망을 활용해 인파의 밀집도를 실시간으로 감지하는 능력을 입증했다. 소프트웨어 기반 가상화 기지국 기술과 AI를 접목하여 차세대 통신 인프라의 새로운 가능성을 열었다. 글로벌 시장에서 삼성 네트워크사업부의 기술 리더십을 확고히 했다.", "source": "더칼럼니스트", "date": "2026-09-16 21:02", "url": "https://www.thecolumnist.kr/news/articleViewAmp.html?idxno=5083", "category": "tech", "importance": 4, "sid": "competitor", "topic": "더칼럼니스트 삼성전자 6g 핵심기술 isac 현장 실증 성공"}, {"title": "삼성전자, 6G 핵심기술 'ISAC' 현장 실증 성공 - thecolumnist.kr", "summary": "삼성전자가 6G 핵심 기술인 ISAC(통신·센싱 융합) 현장 실증에 성공했다. 통신망을 통해 주변 환경을 감지하는 혁신 기술을 선보이며 기술력을 입증했다. 차세대 네트워크 시장에서 주도권을 잡기 위한 기반을 다졌다.", "source": "thecolumnist.kr", "date": "2026-09-16 21:02", "url": "https://www.thecolumnist.kr/news/articleViewAmp.html?idxno=5083", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 isac 실증 성공"}, {"title": "Nokia's Optical Bet Takes Shape as China Retreat and Index Return Collide - ad-hoc-news.de", "summary": "노키아의 광통신 사업 전략이 구체화되며 시장 경쟁력을 확보하고 있음.", "source": "ad-hoc-news.de", "date": "2026-09-16 21:02", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/nokia-s-optical-bet-takes-shape-as-china-retreat-and-index-return-collide/70110637", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 광통신"}, {"title": "GSMA seeks cut in spectru ract", "importance": 4, "sid": "carrier", "topic": "일본 통신 4사 밀리파 공동연구"}, {"title": "スマホつながりやすくなる？ 通信4社｢真の5Ｇ｣エリア拡大で連携 - 朝日新聞", "summary": "일본의 이동통신 4사가 협력하여 진정한 의미의 5G 고주파 영역 확대를 공동 추진하기로 했습니다. 개별 투자의 한계를 뛰어넘어 망 품질을 개선하고 전국적인 커버리지를 조기에 완성하려는 목적입니다. 통신 장비 조달 및 인프라 전략에 중요한 변화입니다.", "source": "朝日新聞", "date": "2026-09-16 20:36", "url": "https://www.asahi.com/articles/ASV9J3F99V9JULFA013M.html?iref=com_topics_742ccaf7-b023-4af1-89f5-a016740a4451_timeline_article_1", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본 통신사 5g 인프라 협력"}, {"title": "スマホつながりやすくなる？ 通信4社｢真の5Ｇ｣エリア拡大で連携 - asahi.com", "summary": "일본의 이동통신 4사가 진정한 5G 서비스 확대를 위해 협력에 나섭니다. NTT도코모, KDDI, 소프트バンク, 라쿠텐모바일은 5G 밀리파 대역의 에어리어 확대를 위해 공동으로 검토를 시작했습니다. 1사의 투자 한계를 극복하고 비용을 절감하기 위한 목적입니다. 향후 기지국 및 중계기 공용화를 통해 고속 통신 환경 구축을 가속화할 전망입니다.", "source": "asahi.com", "date": "2026-09-16 20:36", "url": "https://www.asahi.com/articles/ASV9J3F99V9JULFA013M.html?iref=com_topics_742ccaf7-b023-4af1-89f5-a016740a4451_timeline_article_1", "category": "contract", "importance": 4, "sid": "carrier", "topic": "통신4사 5g 밀리파 갱신"}, {"title": "China Mobile Jiangsu and ZTE Deploy 5G-Advanced to Empower E-Commerce Growth in Donghai - ", "summary": "차이나모바일 장쑤 법인과 ZTE가 5G-Advanced 네트워크를 구축해 동하이 지역의 전자상거래 성장을 지원하고 있습니다. 최신 5G 기술을 상용 현장에 적용하여 지역 경제 활성화를 도모하는 사례입니다.", "source": "ZTE", "date": "2026-09-16 20:21", "url": "https://www.zte.com.cn/content/zte-site/www-zte-com-cn/global/about/news/china-mobile-jiangsu-and-zte-deploy-5g-advanced-to-empower-e-commerce-growth-in-donghai.html", "category": "contract", "importance": 4, "sid": "competitor", "topic": "차이나모바일 장쑤 zte 5g-a"}, {"title": "ミリ波の5G「エリア共同構築」ドコモ、KDDI、ソフトバンク、楽天モバイルが検討、基地局や中継機の共用でコスト減へ - Buzzap！（バザップ！）", "summary": "일본의 이동통신 4사인 도코모, KDDI, 소프트뱅크, 라쿠텐모바일이 5G 밀리파(mmWave) 영역의 기지국 및 중継기 공조 구축을 검토하기 시작했습니다. 네트워크 구축 비용을 절감하고 효율성을 높이기 위한 조치로, 향후 공동 인프라 활용 범위가 확대될 전망입니다.", "source": "Buzzap！（バザップ！）", "date": "2026-09-16 20:00", "url": "https://buzzap.jp/news/20260916-mmwave-5g  Operator Momentum for AI-RAN as 6G Development Advances - TechAfrica ", "summary": "노키아가 AI-RAN 글로벌 확산과 6G 기술 개발 진전 상황을 발표하며 통신사들의 호응을 얻고 있다. 차세대 이동통신 표준화 주도권을 잡기 위한 기술 로드맵을 가속화하고 있다.", "source": "TechAfrica News", "date": "2026-09-16 18:29", "url": "https://techafricanews.com/2026/09/16/nokia-reports-global-operator-momentum-for-ai-ran-as-6g-development-advances/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 ai-ran 및 6g 개발 진전"}, {"title": "AI-powered phone networks move into live trials worldwide with Nokia - Stock Titan", "summary": "노키아가 전 세계 통신사들과 함께 인공지능 기반 모바일 네트워크의 상용 라이브 트라이얼을 본격적으로 추진하고 있다. 차세대 AI 기술을 결합한 네트워크 성능 검증을 통해 장비 경쟁력을 강화하려는 전략이다. 경쟁사 대비 AI 솔루션 상용화 속도를 높이는 데 기여할 것으로 보인다.", "source": "Stock Titan", "date": "2026-09-16 18:20", "url": "https://www.stocktitan.net/news/NOK/nokia-accelerates-ai-ran-adoption-as-global-operators-embrace-ai-rpbb43pv4o3c.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 ai 폰 네트워크 라이브 트라이얼"}, {"title": "Nokia expands AI-RAN trials with global carriers - marketscreener.com", "summary": "노키아가 글로벌 주요 통신사들과 함께 AI-RAN 기술 검증 및 트라이얼을 대규모로 확장하며 차세대 무선망 생태계 주도에 나섰다.", "source": "marketscreener.com", "date": "2026-09-16 18:14", "url": "https://www.marketscreener.com/news/nokia-expands-ai-ran-trials-with-global-carriers-ce785bd2da8dff2c", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 글로벌 통신사 ai-ran 확대"}, {"title": "Verizon furthers forum for 6G development - Computer Weekly", "summary": "미국 버라이즌이 6G 기술 개발을 위한 혁신 포럼의 저변을 넓히고 차세대 통신 표준화 주도권을 선점하기 위한 행보를 가속화하고 있다.", "source": "Computer Weekly", "date": "2026-09-16 18:13", "url": "https://www.computerweekly.com/news/366650404/Verizon-furthers-forum-for-6G-development", "category": "tech", "importance": 4, "sid": "satellite", "topic": "버라이즌 6g 개발 포럼 주도"}, {"title": "DCC to be wound up after satcom spectrum approval: Report | What we know", "summary": "인도 정부가 TRAI의 위성통신 주파수 권고안을 승인한 후 37년 역사의 디지털통신위원회(DCC)를 해산할 예정이다. 통신부(DoT)의 역할 중복과 규제 개편의 일환이다.", "source": "Mint", "date": "2026-09-16 18:12", "url": "https://www.livemint.com/industry/telecom/dcc-to-be-wound-up-after-satcom-spectrum-approval-report-what-we-know-11789548696285.html", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도 통신위원회 dcc 폐지"}, {"title": "휴대폰 지원금·고가요금제 ‘깜깜이 판매’ 막는다", "summary": "방송미디어통신위원회가 휴대폰 판매점의 단말기 지원금 및 고가요금제 불완전판매를 막기 위해 추가지원금 정보 공개를 확대하고 약정 유지기간 만료 시 통지 제도를 추진합니다. 단말기 유통 투명성을 높이는 규제 정책입니다.", "source": "ZDNet Korea", "date": "2026-09-16 18:11", "url": "https://zdnet.co.kr/view/?no=20260916181116", "category": "policy", "importance": 4, "sid": "policy", "topic": "방송미디어통신위원회 유통환경조성"}, {"title": "화웨이, M360 ASEAN 2026에서 지능형 연결성과 AI 전환 강조", "summary": "화웨이가 GSMA M360 아세안 2026의 행사 파트너로 참여해 지능형 연결성과 AI 전환 전략을 강조했습니다. 화웨이는 행사 기간 동안 지능형 모바일 네트워크, 디지털 신뢰, AI 솔루션을 제시하며 역내 디지털 경제 전환을 지원했습니다. 이는 화웨이의 글로벌 시장 전략 강화를 보여줍니다.", "source": "ZDNet Korea", "date": "2026-09-16 18:10", "url": "https://zdnet.co.kr/view/?no=20260916181024", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 m360 아세안"}, {"title": "Nokia (0HAF) Advances Global AI-RAN Trials with Eight Telecom Operators Including stc, du,", "summary": "노키아가 stc, du 등 8개 주요 글로벌 통신사와 함께 AI-RAN 글로벌 라이브 시험을 적극적으로 확대하고 있다. 엔비디아 플랫폼 기반의 인공지능 무선 접속망 기술을 상용화하기 위한 다각도의 검증이 진행 중이다. 글로벌 장비사의 차세대 기술 실증 성과다.", "source": "Kalkine Media", "date": "2026-09-16 18:00", "url": "https://kalkinemedia.com/uk/news/announcements/nokia-0haf-advances-global-ai-ran-trials-with-eight-telecom-operators-including-stc-du-and-tpg-telecom-using-nvidia-aerial-platform", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 글로벌 ai-ran 시험 확대"}, {"title": "로이터 “SK하이닉스, 인텔과 협력해 美서 메모리 생산”…SK하이닉스 “결정된 바 없다”", "summary": "로이터통신은 SK하이닉스가 인텔과 협력해 미국 오하이오주 팹 일부를 임대해 메모리 반도체를 현지 생산하는 방안을 협상 중이라고 보도했다. SK하이닉스 측은 모든 가능성이 열려 있으나 아직 확정된 바는 없다고 공식 입장을 밝혔다. 미국 정부의 반도체 공급망 내재화 압박 속에서 양사 간 전략적 제휴 가능성이 대두되고 있다. 글로벌 반도체 시장의 생산 거점 재편을 보여주는 중대 사안이다.", "source": "전자신문", "date": "2026-09-16 17:52", "url": "https://www.etnews.com/20260916000377", "category": "contract", "importance": 4, "sid": "competitor", "topic": "sk하이닉스 인텔 협력"}, {"title": "通信4社、5Gミリ波の利用エリア拡大に向け共同検討 - Impress Watch", "summary": "통신 사업자 4사가 5G 밀리미터파 이용 영역을 넓히기 위해 공동 검토에 착수했다. 고주파 대역 인프라 구축의 경제적 부담을 나누고 서비스 품질을 끌어올리기 위한 전략적 제휴다.", "source": "Impress Watch", "date": "2026-09-16 17:49", "url": "https://www.watch.impress.co.jp/docs/news/2141496.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본통신사 5g 협력"}, {"title": "通信4社、5Gミリ波の利用エリア拡大に向け共同検討 - topics.smt.docomo.ne.jp", "summary": "일본 통신 4사가 5G 밀리미터파 이용 지역 확대를 위한 공동 검토 개시를 알렸습니다. 초고속 통신의 핵심인 밀리미터파 대역 커버리지를 넓히기 위해 인프라를 상호 연계합니다. 네트워크 효율성 개선을 위한 중대한 결정입니다.", "source": "topics.smt.docomo.ne.jp", "date": "2026-09-16 17:49", "url": "https://topics.smt.docomo.ne.jp/article/www_watch/trend/www_watch-2141496", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본통신사 5g 밀리미터파"}, {"title": "KT-KISTI, 국내 첫 한미 400G 국가연구망 개통…전송 용량 4배로 - 에너지경제신문", "summary": "KT가 한국과학기술정보연구원(KISTI)과 협력하여 국내 최초로 한·미 간 400Gbps급 국가연구망 회선을 성공적으로 개통했습니다. 기존 전송 용량 대비 4배 확대된 대역폭을 통해 대규모 양자 및 AI 공동 연구를 뒷받침할 핵심 네트워크 인프라를 확보했습니다.", "source": "에너지경제신문", "date": "2026-09-16 17:48", "url": "https://www.ekn.kr/web/view.php?key=20260916026155643", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 한미연구망개통"}, {"title": "VideoLabs buys Ericsson CDN/cloud IP assets for undisclosed sum - Telecompaper", "summary": "비디오랩스가 에릭슨의 CDN 및 클라우드 IP 자산을 비공개 금액으로 인수했습니다. 관련 인프라 자산 인수를 통해 미디어 딜리버리 역량을 강화할 것으로 전망됩니다. 글로벌 장비사들의 포트폴리오 재편이 이어지고 있습니다.", "source": "Telecompaper", "date": "2026-09-16 17:35", "url": "https://www.telecompaper.com/news/videolabs-buys-ericsson-cdncloud-ip-assets-for-undisclosed-sum--1582830", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 m&a"}, {"title": "NTT DoCoMo adds Nokia equipment to boost multivendor O-RAN efforts - SDxCentral", "summary": "일본 이동통신사 NTT 도코모가 멀티벤더 오픈랜(O-RAN) 노력을 강화하기 위해 노키아의 장비를 추가 도입했다. 이번 협력은 개방형 무선접속망 생태계를 확장하고 망 운영의 유연성을 높이기 위한 전략의 일환이다. 노키아는 글로벌 통신사와의 파트너십을 공고히 하고 있다.", "source": "SDxCentral", "date": "2026-09-16 17:32", "url": "https://www.sdxcentral.com/news/ntt-docomo-adds-nokia-equipment-to-boost-multivendor-o-ran-efforts/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 도코모 오픈랜"}, {"title": "Augusta objects to Verizon's proposed end to copper phone line servicing - The News Leader", "summary": "오거스타 지역 사회가 버라이즌의 구리선 전화 회선 서비스 종료 제안에 대해 공식적으로 반대 의견을 제기했습니다. 노후 인프라 폐지에 따른 통신 서비스 공백 우려가 제기되고 있습니다. 규제 승인 과정에서 통신사가 직면한 지역 갈등입니다.", "source": "The News Leader | Staunton, VA", "date": "2026-09-16 17:31", "url": "https://www.newsleader.com/story/news/local/government/2026/09/16/verizon-end-copper-phone-lines-challenged-virginia/91776238007/", "category": "policy", "importance": 4, "sid": "carrier", "topic": "버라이즌 유선망 전환"}, {"title": "Cross-Operator Joint Study on 5G Millimeter-Wave Infrastructure and Technical Architecture", "summary": "라쿠텐모바일을 비롯한 통신 사업자들이 5G 밀리미터파(mmWave) 인프라 구축과 기술적 아키텍처에 대한 교차 연산 공동 연구를 추진한다. 초고속·대용량 통신 환경 구현을 위해 고주파수 대역 활용 방안을 모색하고 있다. 단독 구축의 한계를 극복하고 효율적인 망 설계를 도모하는 차원이다. 차세대 통신망 고도화를 위한 기술 협력의 일환이다.", "source": "楽天モバイル株式会社", "date": "2026-09-16 16:50", "url": "https://corp.mobile.rakuten.co.jp/english/news/press/2026/0916_01/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "라쿠텐모바일 5g"}, {"title": "Cross-operator joint study on 5G mmWave infrastructure and technical architectures for cov", "summary": "복수의 통신사들이 협력하여 5G 밀리미터파(mmWave) 인프라 구축과 커버리지 확대를 위한 기술 아키텍처 공동 연구 결과를 발표했다. 초고주파수 상용화 방안을 모색하는 통신사 동향이다.", "source": "telecomtv.com", "date": "2026-09-16 16:44", "url": "https://www.telecomtv.com/content/the-future-of-ran/cross-operator-joint-study-on-5g-mmwave-infrastructure-and-technical-architectures-for-coverage-expansion-56258/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "5g mmwave 인프라 및 기술 아키텍처 크로스 오퍼레이터 공동 연구"}, {"title": "스페이스X도 통신망 투자…통신장비 ‘공급 부족’ 신호 깜빡 - 딜사이트", "summary": "스페이스X 등 위성통신 사업자들의 공격적인 통신망 투자가 이어지면서 글로벌 통신장비 시장에 '공급 부족' 신호가 감지되고 있다. 위성 및 지상국 인프라 확충에 필요한 장비 수요가 급증하는 추세다. 장비 제조사들에게는 새로운 사업 기회인 동시에 부품 수급 관리가 중요한 과제로 떠올랐다. 통신장비 생태계 전반의 수급 환경 변화를 시사한다.", "source": "딜사이트", "date": "2026-09-16 16:34", "url": "https://dealsite.co.kr/articles/169162", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스페이스x 통신망 투자 공급 부족"}, {"title": "折りたたみ「Galaxy Z Fold8（256GB）」、ソフトバンクにMNPで約30万円が2年間7万円台に【スマホお得情報】", "summary": "소프트뱅크는 폴더블 스마트폰 'Galaxy Z Fold8(256GB)'에 대해 MNP 및 단말 반환 프로그램을 적용하여 2년간 실부담액을 7만 원대로 낮춰 판매하는 할인 프로모션을 개시했다. 주요 통신사의 프리미엄 폴더블폰 판매 경쟁 양상을 보여준다.", "source": "ITmedia Mobile", "date": "2026-09-16 16:06", "url": "https://www.itmedia.co.jp/mobile/articles/2609/16/news081.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "소프트뱅크 갤럭시"}, {"title": "Nokia and Microsoft launch unified data foundation for telecoms AI operations - Telecompap", "summary": "노키아와 마이크로소프트가 통신 AI 운영을 지원하기 위한 통합 데이터 파운데이션을 공동으로 출시했다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/nokia-and-microsoft-launch-unified-data-foundation-for-telecoms-ai-operations--1583013", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 마이크로소프트 통신 ai 데이터 재단"}, {"title": "Nokia details global progress towards AI-RAN implementation - telecompaper.com", "summary": "노키아가 AI-RAN 구현을 위한 전 세계적인 기술 개발 진척 상황과 로드맵의 세부 내용을 상세히 공개했다. 상용화를 향한 구체적 성과를 과시하고 있다.", "source": "telecompaper.com", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/nokia-details-global-progress-towards-ai-ran-implementation--1582995", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 ai-ran 진척"}, {"title": "Ericsson debuts customer-hosted NetCloud tailored to regulated enterprise workloads - Tele", "summary": "에릭슨이 규제가 엄격한 엔터프라이즈 워크로드에 맞춤화된 고객 호스팅형 넷클라우드(NetCloud) 서비스를 선보였습니다. 기업 고객의 보안 및 규정 준수 요구사항을 충족하는 프라이빗 네트워크 및 클라우드 솔루션을 제공합니다. 경쟁사의 B2B 기업 시장 공략 전략입니다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/ericsson-debuts-customer-hosted-netcloud-tailored-to-regulated-enterprise-workloads--1583002", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 엔터프라이즈 솔루션"}, {"title": "Vodafone Egypt deploys Ericsson AI RAN Processor 6672 - Telecompaper", "summary": "보다폰 이집트가 에릭슨의 AI RAN 프로세서 6672를 상용망에 배치하고 네트워크 고도화에 착수했습니다. 고성능 프로세서 도입을 통해 에너지 효율을 높이고 AI 기반 무선 접속망 성능을 강화합니다. 에릭슨의 중동 지역 통신장비 공급 실적을 보여줍니다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/vodafone-egypt-deploys-ericsson-ai-ran-processor-6672--1583009", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 이집트 수주"}, {"title": "ZTE wants to take operators beyond connectivity with AI - Telecompaper", "summary": "중흥통신(ZTE)이 단순한 물리적 연결 제공을 넘어 인공지능을 결합한 통신 서비스와 솔루션으로 사업 영역을 확장하겠다는 의지를 밝혔다. 통신 장비를 넘어 AI 기반 디지털 전환을 주도하려는 ZTE의 전략 방향이다. 경쟁사의 신사업 비전이다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/partner-content/zte-wants-to-take-operators-beyond-connectivity-with-ai--1583019", "category": "tech", "importance": 4, "sid": "competitor", "topic": "중흥통신 전략"}, {"title": "CTIA paper calls for federal 4 GHz study in next 60 days - Telecompaper", "summary": "미국 무선통신산업협회(CTIA)가 향후 60일 내 연방 차원의 4GHz 주파수 대역 연구를 촉구하는 정책 제안서를 제출했습니다.", "source": "Telecompaper", "date": "2026-09-16 16:00", "url": "https://www.telecompaper.com/news/ctia-paper-calls-for-federal-4-ghz-study-in-next-60-days--1583008", "category": "policy", "importance": 4, "sid": "policy", "topic": "ctia 4ghz 주파수 연구"}, {"title": "携帯4社、5Gミリ波の基地局・中継器を共同活用へ 覚書締結 - BigGo ファイナンス", "summary": "일본 이동통신 4사가 5G 밀리미터파 기지국과 중계기를 공동으로 활용하기 위한 양해각서(MOU)를 체결했습니다. 투자 비용을 절감하고 초고주파 대역 커버리지를 신속히 넓히기 위한 전략입니다. 통신사 간 인프라 공유 협력이 본격화됩니다.", "source": "BigGo ファイナンス", "date": "2026-09-16 15:55", "url": "https://finance.biggo.jp/news/81b190fd-ca09-4b1c-b7c9-002d37b38d00", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본 통신사 5g 공동 활용"}, {"title": "携帯4社、5Gミリ波の基地局・中継器を共同活用へ 覚書締結 - finance.biggo.jp", "summary": "일본 4대 이동통신사가 5G 밀리웨이브(mmWave) 기지국과 중계기를 공동 활용하기 위한 양해각서(MOU)를 체결했습니다. 인프라 투자 비용을 절감하고 커버리지를 효율적으로 넓히기 위한 전략적 제휴입니다.", "source": "finance.biggo.jp", "date": "2026-09-16 15:55", "url": "https://finance.biggo.jp/news/81b190fd-ca09-4b1c-b7c9-002d37b38d00", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본 통신사 5g 밀리웨이브 협력"}, {"title": "ソフトバンクとSceye、「空飛ぶ基地局」HAPSの試験サービスに国内初成功。米国から太平洋を越え、日本上空へ - digital-construction.jp", "summary": "소프트뱅크와 Sceye가 '하늘 위의 기지국' HAPS 시험 서비스에 국내 최초로 성공했다.", "source": "digital-construction.jp", "date": "2026-09-16 15:54", "url": "https://digital-construction.jp/news/4017", "category": "tech", "importance": 4, "sid": "competitor", "topic": "소프트뱅크 항공 기지국"}, {"title": "[단독] 미국 통신사 특허전 불똥 맞은 삼성전자, 5G 기지국 장비 관련 미국서 피소 - 일요신문", "summary": "삼성전자가 미국 통신사 간의 특허 분쟁 여파로 5G 기지국 장비 관련 미국에서 피소당했다. 특허 침해 소송에 휘말리며 미국 시장 내 장비 사업에 잠재적 리스크가 발생했다. 향후 소송 진행 상황이 삼성전자의 북미 사업에 영향을 미칠 수 있다. 법적 대응을 위한 준비가 요구된다.", "source": "일요신문", "date": "2026-09-16 15:50", "url": "https://www.ilyo.co.kr/?ac=article_view&entry_id=512745", "category": "policy", "importance": 4, "sid": "competitor", "topic": "삼성전자 법적 리스크"}, {"title": "[단독] 미국 통신사 특허전 불똥 맞은 삼성전자, 5G 기지국 장비 관련 미국서 피소 - ilyo.co.kr", "summary": "미국 통신사 관련 특허 분쟁의 불똥이 튀어 삼성전자가 5G 기지국 장비와 관련해 미국에서 피소당했습니다. 해외 시장에서 장비 수출 및 운용과 관련한 지식재산권 리스크가 현실화된 국면입니다. 북미 시장을 주력으로 삼는 삼성전자 네트워크사업부의 법무적 리스크 관리와 대응이 요구됩니다. 향후 소송 결과가 현지 사업 전개에 미칠 파장을 주시해야 합니다.", "source": "ilyo.co.kr", "date": "2026-09-16 15:50", "url": "https://www.ilyo.co.kr/?ac=article_view&entry_id=512745", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 특허 소송"}, {"title": "SKT, AI인프라에 ‘보안’까지…F5와 국내 시장 공략 - 디일렉", "summary": "SK텔레콤이 글로벌 보안 기업 F5와 손잡고 AI 인프라 및 클라우드 보안 분야에서 전략적 파트너십을 체결했다. AI 데이터센터와 클라우드 서비스 보호를 위한 통합 관리 체계를 구축한다. 국내 보안 및 클라우드 시장 공략을 가속화할 전망이다.", "source": "디일렉", "date": "2026-09-16 15:42", "url": "https://www.thelec.kr/news/articleView.html?idxno=62383", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 f5 보안 파트너십"}, {"title": "KDDI／ドコモ／ソフトバンク／楽天モバイルが5Gミリ波エリア拡大に向け共同検討を開始（PHILE WEB） - Yahoo!ニュース", "summary": "KDDI, 도코모, 소프트뱅크, 라쿠텐모바일 등 일본 4대 이동통신사가 5G 밀리미터파 주파수 대역의 에어리어 확대를 위해 공동 검토를 시작했습니다. 고주파수 대역 투자 부담을 줄이기 위한 업계 협력입니다.", "source": "Yahoo!ニュース", "date": "2026-09-16 15:41", "url": "https://news.yahoo.co.jp/articles/9cf1099c4ba6287296a73c4b4401aa676e751e46", "category": "tech", "importance": 4, "sid": "carrier", "topic": "일본 4대 통신사 밀리미터파 연합"}, {"title": "KDDI／ドコモ／ソフトバンク／楽天モバイルが5Gミリ波エリア拡大に向け共同検討を開始 - PHILE WEB", "summary": "일본 이동통신 4사가 5G 밀리파 지역 확대를 위한 공동 검토를 시작했습니다. 인프라 공유를 통해 고주파수 영역의 커버리지 확장 속도를 높이고 투자비를 절감할 계획입니다.", "source": "PHILE WEB", "date": "2026-09-16 15:41", "url": "https://www.phileweb.com/news/mobile_pc/202609/16/3783.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt도코모 5g 밀리파"}, {"title": "KDDI／ドコモ／ソフトバンク／楽天モバイルが5Gミリ波エリア拡大に向け共同検討を開始 - phileweb.com", "summary": "일본 이동통신 4사가 5G 밀리미터파 영역 확대를 위해 공동 검토에 착수했다는 협력 발표이다. 인프라 공용화를 통한 5G 고도화 전략이다.", "source": "phileweb.com", "date": "2026-09-16 15:41", "url": "https://www.phileweb.com/news/mobile_pc/202609/16/3783.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본 통신사 5g 밀리미터파 공동 검토"}, {"title": "KDDIなど通信4社、高速大容量の「ミリ波」を共同で拡大へ 5G向け - 日本経済新聞", "summary": "KDDI 등 통신 4사가 5G를 위한 고속 대용량 '밀리미터파' 영역을 공동으로 확대하기로 결정했다. 단독 구축의 한계를 넘기 위한 상생 협력 모델이다. 장비 중복 투자를 막고 통신망의 효율성을 높인다. 일본 5G 시장의 새로운 전기가 마련된다.", "source": "日本経済新聞", "date": "2026-09-16 15:40", "url": "https://www.nikkei.com/article/DGXZQOUC163XD0W6A910C2000000/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본이동통신사 5g 밀리미터파"}, {"title": "Japan carrier NTT Docomo gave user data to Amazon Japan arm without consent - Japan Wir : "ITmedia Mobile", "date": "2026-09-16 14:45", "url": "https://www.itmedia.co.jp/mobile/articles/2609/16/news075.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "일본 통신사 5g 밀리파 협력"}, {"title": "大手キャリアが「5Gミリ波」エリアの拡大に向けた共同検討を開始 5Gミリ波基地局／中継器の有効活用を目指す - ITmedia Mobile - ITmedia", "summary": "일본 대형 이동통신사들이 5G 밀리미터파 영역 확장을 위한 공동 검토를 시작하며 기지국과 중개기의 효율적 활용을 도모합니다. 투자 비용 절감과 커버리지 극대화를 동시에 노립니다. 업계 전반의 인프라 효율화 움직임입니다.", "source": "ITmedia", "date": "2026-09-16 14:45", "url": "https://www.itmedia.co.jp/mobile/amp/2609/16/news075.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본통신사 5g밀리미터파"}, {"title": "大手キャリアが「5Gミリ波」エリアの拡大に向けた共同検討を開始 5Gミリ波基地局／中継器の有効活用を目指す - ITmedia Mobile - itmedia.co.jp", "summary": "대형 통신사들이 5G 밀리파 에어리어 확대를 위한 공동 검토를 시작했다. 기지국과 중계기 공유를 통해 투자비를 줄이고 서비스 품질을 높인다는 복안이다. 고주파 특성상 부족한 도달 거리를 보완하는 데 기여할 것이다. 업계 전반의 인프라 효율화 기조를 반영한다.", "source": "itmedia.co.jp", "date": "2026-09-16 14:45", "url": "https://www.itmedia.co.jp/mobile/articles/2609/16/news075.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본통신사 5지밀리미터파"}, {"title": "'쪼개기 후원' KT 전 경영진 배상 책임 인정‥\"황창규 4.5억 배상\" - MBC 뉴스", "summary": "국회의원 쪼개기 후원 의혹과 관련해 법원이 KT 전 경영진의 손해배상 책임을 인정했다. 황창규 전 회장 등에게 거액의 배상 판결이 내려지며 경영 리스크가 현실화됐다.", "source": "MBC 뉴스", "date": "2026-09-16 14:33", "url": "https://imnews.imbc.com/news/2026/society/article/6852226_36918.html", "category": "policy", "importance": 4, "sid": "carrier", "topic": "kt 경영진 배상판결"}, {"title": "携帯4社が5Gミリ波で連携 ー より広いエリアで高速通信を目指す - OREFOLDER", "summary": "휴대폰 4사가 5G 밀리미터파 협력을 통해 더 넓은 영역에서 고속 통신을 지향합니다.", "source": "OREFOLDER", "date": "2026-09-16 14:25", "url": "https://orefolder.jp/2026/09/5g-milliwave-area-expansion/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "통신 4사 5g 밀리미터파 협력"}, {"title": "삼성 6G 핵심기술 美서 실증…국내 실증은 내년", "summary": "2020년부터 가상화 기지국 전략을 펼친 삼성전자 와 네트워크 장비 공급 계약을 맺은 후 vRAN을 대규모 적용한 영향이다. 아직 ISAC 표준화가 이뤄지기 전이라는 점에서 국내 연구 단계가 뒤쳐진 것은 아니라는 의견도...", "source": "newspim.com", "date": "2026-09-16 14:19", "url": "https://www.newspim.com/news/view/20260916000579", "category": "contract", "importance": 4, "sid": "satellite", "topic": ""}, {"title": "삼성 6G 핵심기술 美서 실증…국내 실증은 내년 - 뉴스핌", "summary": "삼성의 6G 핵심기술이 미국에서 성공적으로 실증되었으며 국내 실증은 내년으로 예정됐다. 글로벌 통신사와 협력하여 기술 검증 범위를 넓혀가고 있다. 향후 국내외 상용화 추진에 속도가 붙을 전망이다.", "source": "뉴스핌", "date": "2026-09-16 14:19", "url": "https://www.newspim.com/news/view/20260916000579", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 6g 실증 성공"}, {"title": "삼성 6G 핵심기술 美서 실증…국내 실증은 내년 - newspim.com", "summary": "삼성전자가 미국 현지에서 6G 핵심 기술 실증을 성공적으로 마친 데 이어, 국내에서도 내년 중 실증을 추진할 계획입니다. 글로벌 무대에서 검증된 차세대 통신 기술을 국내 인프라로 확장하려는 행보입니다. 국내외 6G 상용화 일정을 구체화하고 있습니다.", "source": "newspim.com", "date": "2026-09-16 14:19", "url": "https://www.newspim.com/news/view/20260916000579", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 6g 실증"}, {"title": "NTTドコモ／KDDI／ソフトバンク／楽天モバイル、5Gミリ波のエリア拡大へ共同検討開始 - article.auone.jp", "summary": "NTT도코모, KDDI, 소프트뱅크, 라쿠텐모바일 등 일본 주요 4대 통신사가 5G 밀리미터파 주파수 영역의 커버리지 확대를 위한 공동 검토를 시작했다. 인프라 투자 비용을 절감하고 고속 통신망 보급을 가속화하려는 전략이다. 일본 통신 시장의 협력 체계 변화에 이목이 쏠린다.", "source": "article.auone.jp", "date": "2026-09-16 14:12", "url": "https://article.auone.jp/e172517a-e481-4cb4-9a48-94b670cc909a", "category": "tech", "importance": 4, "sid": "carrier", "topic": "일본통신사 5g 밀리미터파 공동 검토"}, {"title": "NTTドコモ／KDDI／ソフトバンク／楽天モバイル、5Gミリ波のエリア拡大へ共同検討開始 - マイナビニュース", "summary": "NTT 도코모, KDDI, 소프트뱅크, 라쿠텐 모바일 등 일본 4대 통신사가 5G 밀리미터파 지역 확장을 위한 공동 검토에 착수했다. 기지국과 장비의 공동 활용 가능성을 모색한다. 투자비 절감과 5G 고도화에 기여할 것으로 기대된다.", "source": "マイナビニュース", "date": "2026-09-16 14:12", "url": "https://news.mynavi.jp/article/20260916-4977427/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본 통신 4사 밀리미터파 협력"}, {"title": "NTTドコモ／KDDI／ソフトバンク／楽天モバイル、5Gミリ波のエリア拡大へ共同検討開始 - news.mynavi.jp", "summary": "국내 주요 통신 4개사가 5G 밀리미터파 커버리지 확대를 위해 손을 잡았습니다. 시설 공용화를 통한 비용 절감과 품질 향상을 동시에 도모합니다. 정부의 통신 인프 5g 밀리미터파 협력"}, {"title": "Telecom news: U Mobile, Tencent Cloud, Xtremis Spectrum Automation, ServicePower, Vision A", "summary": "유모바일과 텐센트 클라우드가 통신 분야에서의 디지털 혁신과 클라우드 솔루션 협력을 추진한다. 양사는 통신 서비스 품질을 높이고 기업 고객을 위한 클라우드 기반 인프라를 공동으로 개발할 예정이다. 통신과 클라우드 기업 간의 이러한 결합은 통신 사업자들의 수익 다각화와 서비스 고도화에 기여하고 있다. 시장에서는 다양한 파트너십을 통한 통신 생태계 확장을 주시하고 있다.", "source": "TelecomLead", "date": "2026-09-16 13:51", "url": "https://telecomlead.com/news/telecom-news-u-mobile-tencent-cloud-xtremis-spectrum-automation-servicepower-vision-ai-ericsson-127753", "category": "tech", "importance": 4, "sid": "competitor", "topic": "유모바일 텐센트 클라우드"}, {"title": "高速5G通信をより快適に、携帯4社が「ミリ波」エリア拡大に向けた連携へ", "summary": "NTT 도코모, KDDI, 소프트뱅크, 라쿠텐 모바일 등 일본 4대 통신사가 5G 밀리미터파(mmWave) 서비스 지역 확대를 위해 공동 협력하기로 합의했습니다. 9월 11일 체결된 이번 협약은 5G 인프라 투자 효율성을 높이고 고속 통신 환경을 개선하기 위한 전략적 제휴입니다.", "source": "ケータイ Watch", "date": "2026-09-16 13:45", "url": "https://k-tai.watch.impress.co.jp/docs/news/2141384.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "일본 통신사 5g 협력"}, {"title": "高速5G通信をより快適に、携帯4社が「ミリ波」エリア拡大に向けた連携へ - ケータイ Watch", "summary": "고속 5G 통신 이용 환경을 쾌적하게 만들기 위해 일본 햄버거 통신사들이 '밀리미터파' 인프라 확장을 위한 협력에 나섰습니다. 전국적인 5G 커버리지 품질 향상이 기대됩니다.", "source": "ケータイ Watch", "date": "2026-09-16 13:45", "url": "https://k-tai.watch.impress.co.jp/docs/news/2141384.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "일본 통신사 5g 밀리미터파 협력"}, {"title": "高速5G通信をより快適に、携帯4社が「ミリ波」エリア拡大に向けた連携へ - k-tai.watch.impress.co.jp", "summary": "휴대폰 4사가 보다 쾌적한 고속 5G 통신을 위해 밀리파 영역 확대에 협력하기로 했습니다. 공동 구축을 통해 투자 효율성을 높이고 서비스 품질을 개선합니다. 일본 통신 시장의 인프라 효율화에 중요한 전환점이 될 것입니다.", "source": "k-tai.watch.impress.co.jp", "date": "2026-09-16 13:45", "url": "https://k-tai.watch.impress.co.jp/docs/news/2141384.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "일본통신사 5g밀리파"}, {"title": "通信事業者間での5Gミリ波の利用エリア拡大に向けた共同検討を開始 - docomo.ne.jp", "summary": "NTT 도코모를 비롯한 일본 통신사업자들이 5G 밀리파의 이용 지역 확대를 위한 공동 검토를 시작했다. 기지국 자원의 효율적 운용을 통 KISTI, 한·미 400G 연구망 첫 개통...대역폭 4배 확대 - 조선일보", "summary": "KT와 KISTI가 한·미 간 400G 연구망을 처음으로 개통하고 대역폭을 4배 확대했다. 국가 차원의 초고속 대용량 연구용 네트워크 인프라 혁신을 이뤄냈다.", "source": "조선일보", "date": "2026-09-16 11:12", "url": "https://www.chosun.com/economy/tech_it/2026/09/16/2PTABTQQWVB23EAVQANT3VYUGM/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt 연구망개통"}, {"title": "楽天モバイル、楽天ID連携必須化を撤回 - blog of mobile", "summary": "라쿠텐 모바일의 ID 연동 필수화 방침 철회에 관한 보도입니다.", "source": "blog of mobile", "date": "2026-09-16 11:02", "url": "http://blogofmobile.com/article/182786", "category": "policy", "importance": 4, "sid": "carrier", "topic": "라쿠텐 모바일 정책"}, {"title": "스페이스X 스타십, 14번째 발사…\"이번엔 궤도 간다\" [우주로 간다]", "summary": "일론 머스크의 우주탐사 기업 스페이스X가 차세대 우주선 '스타십'의 14번째 시험비행을 오는 22일 미국 텍사스주 스타베이스에서 실시할 계획이다. 2023년 4월 첫 비행 이후 궤도 비행을 목표로 도전에 나선다. 본 기사는 저궤도 위성 및 우주 발사체 관련 중요 기술 동향으로 satellite 섹션의 4점에 해당한다.", "source": "ZDNet Korea", "date": "2026-09-16 10:54", "url": "https://zdnet.co.kr/view/?no=20260916100902", "category": "tech", "importance": 4, "sid": "satellite", "topic": "스페이스x 스타십 14차 시험비행"}, {"title": "삼성전자, 美 버라이즌과 업계 최초 ‘AI 기반 6G’ 실증 성공 - nnewss.com", "summary": "삼성전자가 美 버라이즌과 협력해 업계 최초로 AI 기반 6G 기술 실증에 성공했다. 가상화 네트워크 환경에서 통신과 센싱을 동시에 수행하는 혁신 기술을 선보였다. 양사의 긴밀한 공조가 차세대 통신 표준화 과정에서 강력한 시너지를 내고 있다. 글로벌 장비 시장에서 삼성의 기술 리더십을 재확인했다.", "source": "nnewss.com", "date": "2026-09-16 10:37", "url": "https://www.nnewss.com/news/articleView.html?idxno=6826", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 6g 실증"}, {"title": "Huawei Launches 3D Data Center in China as AI Computing Demand Grows - Asia Business Outlo", "summary": "AI 컴퓨팅 수요가 급증함에 따라 화웨이가 중국 내에 3D 데이터센터를 새롭게 런칭했습니다. 고성능 연산 인프라 확충을 통해 인공지능 처리 능력을 대폭 강화했습니다. 데이터센터 장비 시장에서의 기술력을 과시했습니다.", "source": "Asia Business Outlook", "date": "2026-09-16 10:23", "url": "https://www.asiabusinessoutlook.com/news/huawei-launches-3d-data-center-in-china-as-ai-computing-demand-grows-nwid-12459.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 데이터센터"}, {"title": "European telecoms execs push back against planned Huawei crackdown - MSN", "summary": "유럽 통신사 경영진들이 EU의 계획된 화웨이 장비 단속 조치에 대해 집단 반발하고 나섰다. 보안 명목의 강제 장비 교체가 가져올 재무적 부담과 망 운영 차질을 강력히 제기했다. 규제 당국과 업계 간의 마찰이 심화되면서 향후 유럽의 5G 및 6G 투자 계획에 불확실성이 커지고 있다. 글로벌 통신 장비 시장의 지형을 흔들 주요 규제 이슈다.", "source": "MSN", "date": "2026-09-16 10:22", "url": "https://www.msn.com/en-ie/money/general/european-telecoms-execs-push-back-against-planned-huawei-crackdown/ar-AA2cgS14?ocid=finance-verthp-feeds", "category": "policy", "importance": 4, "sid": "policy", "topic": "유럽연합 규제"}, {"title": "スマホ圏外で高速通信・音声通話へ KDDI、次世代Starlinkをアジア初契約（電波タイムズ） - Yahoo!ニュース", "summary": "KDDI가 차세대 스타링크 서비스를 도입하여 위성 직접 통신을 추진합니다. 위성통신을 활용한 커버리지 확대 전략입니다.", "source": "Yahoo!ニュース", "date": "2026-09-16 10:02", "url": "https://news.yahoo.co.jp/articles/81b8692ee7cd9de0e1fcb000c7ba4420e47ebe06", "category": "satellite", "importance": 4, "sid": "carrier", "topic": "kddi 스타링크 도입"}, {"title": "삼성전자, 미국 버라이즌과 6G 핵심 기술인 ‘AI 기반 ISAC’ 실증 성공 - 전국시민의소리", "summary": "삼성전자가 미국 버라이즌과 협력해 6G 핵심 기술인 AI 기반 ISAC 현장 실증에 성공했습니다. 기존 네트워크 장비를 활용하면서도 통신망이 센서 역할을 하도록 구현했습니다. 양사의 기술 협력 성과를 대외적으로 입증하는 쾌거입니다.", "source": "전국시민의소리", "date": "2026-09-16 10:01", "url": "https://www.gnsiminsori.com/news/articleView.html?idxno=45817", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 6g"}, {"title": "Kospi Holds 6,600 Level as Samsung, SK Hynix Rebound; SoftBank, Kioxia Drop Over 3% - Trad", "summary": "", "source": "TradingKey", "date": "2026-09-16 09:41", "url": "https://www.tradingkey.com/analysis/stocks/more/262169780-japan-south-korea-stocks-kospi-nikkei225-softbank-skhynix-samsung-kioxia-jpy-tradingkey", "category": "policy", "importance": 4, "sid": "carrier", "topic": ""}, {"title": "베트남, 2G 통신 중단...주파수 회수해 LTE·5G에 쓴다", "summary": "베트남 통신 당국이 전국적인 2G 기지국 운영을 전면 중단하고 기존 주파수를 회수하여 4G 및 5G 이동통신 서비스 확대에 투입하기로 했다. 이는 가입자 전환을 넘어 망 자체를 종료하고 주파수 자원을 차세대 통신으로 전환하는 본격적인 행보이 ": "policy", "importance": 4, "sid": "carrier", "topic": "네트워크 장비주 쇼티지"}, {"title": "ドコモが年度内に5G基地局1万局以上整備へ 通信品質が他社並みに 5G優先制御も検討（産経新聞） - Yahoo!ニュース", "summary": "NTT 도코모가 연내 5G 기지국 1만 국 이상을 추가 정비하여 통신 품질을 개선할 계획입니다. 네트워크 투자 확대 전략입니다.", "source": "Yahoo!ニュース", "date": "2026-09-16 08:34", "url": "https://news.yahoo.co.jp/articles/41a1d45e31d0f9752184480f61f91489c06ed746", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt 도코모 5g"}, {"title": "Huawei Speeds Up AI Chip Launch to Challenge Nvidia - The Information", "summary": "화웨이가 엔비디아의 시장 지배력에 대응하기 위해 AI 칩 출시 속도를 높이고 있습니다. 미국의 수출 규제 속에서도 자체적인 AI 컴퓨팅 역량을 강화하려는 전략입니다. 이는 글로벌 AI 반도체 시장에서 화웨이의 기술 자립화 의지를 보여주는 사례입니다.", "source": "The Information", "date": "2026-09-16 08:25", "url": "https://www.theinformation.com/briefings/huawei-speeds-ai-chip-launch-challenge-nvidia", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 ai 칩"}, {"title": "“AI가 통신망 속으로”···삼성·LG, 6G 시대 ‘두뇌 선점’ 나섰다 - 이뉴스투데이", "summary": "삼성전자와 LG전자가 통신망 속으로 AI를 결합하며 6G 시대의 두뇌 선점에 나섰다. 국내 주요 통신 장비 및 가전 제조사들이 차세대 통신 표준과 지능형 네트워크 기술 확보에 주력하고 있다. 삼성전자의 버라이즌 실증 성공 등이 국내 기업들의 기술력을 입증하는 대표적 사례로 꼽힌다. 국가 간 통신 기술 패권 경쟁에서 우위를 점하기 위한 전략적 행보를 보여준다.", "source": "이뉴스투데이", "date": "2026-09-16 08:05", "url": "http://www.enewstoday.co.kr/news/articleViewAmp.html?idxno=2470732", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성 lg 6g 기술 선점"}, {"title": "楽天モバイル、ID連携必須の自動解約方針を撤回 KDDIローミングも9月末で終了へ - 東京報道新聞", "summary": "라쿠텐모바일이 ID 연계 필수 자동 해지 방침을 철회하고 KDDI 로밍도 9월 말 종료됩니다. 네트워크 로밍 및 가입자 정책의 변화를 보여줍니다.", "source": "東京報道新聞", "date": "2026-09-16 08:00", "url": "https://tokyonewsmedia.com/archives/27957", "category": "contract", "importance": 4, "sid": "carrier", "topic": "라인모바일 5g투자"}, {"title": "Samsung, Verizon complete industry-first 6G sensing trial - upi.com", "summary": "삼성전자와 버라이즌이 업계 최초로 6G 센싱 필드 트라이얼을 성공적으로 완수했다. 통신망과 센싱 기능을 결합한 ISAC 기술의 상용망 적용 가능성을 세계에 알렸다. 양사의 파트너십이 차세대 통신 표준 수립에 핵심적인 역할을 하고 있음을 보여준다. 삼성 네트워크의 글로벌
