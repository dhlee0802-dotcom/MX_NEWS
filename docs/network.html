로벌 통신 시장에서 새로운 경쟁 구도가 형성될 것으로 예상된다.", "source": "ET Telecom", "date": "2026-09-06 14:11", "url": "https://telecom.economictimes.indiatimes.com/news/industry/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market-akash-ambani/133826619", "category": "strategy", "importance": 4, "sid": "carrier", "topic": "릴라이언스 지오 글로벌"}], "2026-09-08": [{"title": "Verizon and Corning announce fiber agreement | About Verizon - Verizon", "summary": "미국 통신사 버라이즌이 코닝과 다년간의 대규모 광섬유 공급 계약을 체결했습니다. 2032년까지 수천만 마일의 광섬유를 조달하여 초고속 통신망과 AI 데이터센터 인프라를 확충할 계획입니다. 양사 간 수조 원대에 달하는 대형 통신장비·자재 조달 딜입니다.", "source": "Verizon", "date": "2026-09-08 22:11", "url": "https://www.verizon.com/about/news/verizon-corning-broadband-ai-fiber-agreement", "category": "contract", "importance": 5, "sid": "carrier", "topic": "버라이즌 코닝 광섬유 공급계약"}, {"title": "Verizon and Corning Announce Multi-year, Multi-billion Dollar Supply Agreement for Broadba", "summary": "버라이즌이 코닝과 브로드밴드 인프라 구축을 위한 수십억 달러 규모의 다년간 공급 계약을 체결했다. 이번 대규모 계약은 양사의 장기적인 파트너십을 강화하고 미국 전역의 통신망 고도화를 가속화할 전망이다. 대형 통신사의 조달 계약으로 업계 내 파급효과가 크다.", "source": "marketscreener.com", "date": "2026-09-08 22:02", "url": "https://www.marketscreener.com/news/verizon-and-corning-announce-multi-year-multi-billion-dollar-supply-agreement-for-broadband-expansi-ce785bd8dc80f52c", "category": "contract", "importance": 5, "sid": "carrier", "topic": "버라이즌 수주"}, {"title": "KDDI, Samsung Achieve 3.6 Gbps in 7 GHz 6G Field Trial - Telecom Review Asia", "summary": "KDDI와 삼성전자가 7GHz 대역 6G 필드 테스트에서 3.6Gbps 속도를 달성했다.", "source": "Telecom Review Asia", "date": "2026-09-08 18:06", "url": "https://www.telecomreviewasia.com/news/network-news/30208-kddi-samsung-achieve-3-6-gbps-in-7-ghz-6g-field-trial/", "category": "tech", "importance": 5, "sid": "satellite", "topic": "삼성전자 6g"}, {"title": "화웨이 재판 배심원 선정 시작…美 검찰 \"20년간 기술 훔쳐 성장\"", "summary": "미국 뉴욕 동부지방법원에서 화웨이의 형사 재판 배심원 선정이 시작됨. 미 검찰은 화웨이가 20년간 기술 탈취를 통해 성장했다고 기소함. 이번 재판은 화웨이의 글로벌 사업에 중대한 법적 리스크를 초래할 수 있는 대형 사건임.", "source": " st flight for 1,600-satellite LEO network", "summary": "릴라이언스 지오가 2027년 9월 저궤도 위성 네트워크 테스트를 목표로 위성 통신 사업을 추진 중임.", "source": "ET Telecom", "date": "2026-09-08 10:43", "url": "https://telecom.economictimes.indiatimes.com/news/portal-in-portal/satcom/reliance-jio-eyes-september-2027-test-flight-for-1600-satellite-leo-network/133903064", "category": "tech", "importance": 4, "sid": "satellite", "topic": "릴라이언스 지오 위성"}, {"title": "KT·KAIST, 피지컬 AI로 자동화 공장 만든다 - 조선일보", "summary": "KT와 KAIST가 피지컬 AI 기술을 활용하여 자동화 공장 구축을 추진함. 산업용 AI 네트워크 기술의 실질적 적용 사례로 주목됨.", "source": "조선일보", "date": "2026-09-08 10:39", "url": "https://www.chosun.com/economy/tech_it/2026/09/08/ZHKU76C3E5GBRP2ETCEIN2JWOQ/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt ai"}, {"title": "삼성전자, 美 특허 전략 강화…\"AI·6G·메모리 IP 영토 확장\" - 비즈월드", "summary": "삼성전자가 AI, 6G, 메모리 분야의 특허 전략을 강화합니다. 차세대 통신 기술 및 IP 영토 확장을 통해 글로벌 경쟁력을 확보하려는 전략입니다.", "source": "비즈월드", "date": "2026-09-08 10:22", "url": "http://www.bizwnews.com/news/articleView.html?idxno=145549", "category": "tech", "importance": 4, "sid": "satellite", "topic": "삼성전자 6g 전략"}, {"title": "막대한 AI 인프라 투자 규모…GSMA가 SKT 주목한 이유", "summary": "GSMA가 SK텔레콤의 AI 인프라 투자 방식을 주목함. 외부 자본 활용 및 그룹사 역량 결합을 통해 AI 데이터센터(AIDC) 구축의 통제권을 유지하면서 효율적인 투자를 진행하는 전략이 업계의 모범 사례로 평가됨. 통신사의 인프라 확장 모델로서 의미를 지님.", "source": "ZDNet Korea", "date": "2026-09-08 10:03", "url": "https://zdnet.co.kr/view/?no=20260908100356", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai 인프라"}, {"title": "애플 폴더블 출격 임박…삼성, 글로벌서 '웰컴 투 폴더블'", "summary": "삼성전자가 갤럭시Z폴드8 시리즈를 활용한 글로벌 옥외 광고 캠페인을 진행한다. 애플 첫 폴더블폰 공개가 임박한 시점에 세계 주요 도시에서 갤럭시 폴드 브랜드와 제품 경쟁력을 다시 부각하려는 의도로 풀이된다. 삼성전자는 세계 주요 랜드마크에서 '웰컴 투 폴더블' 캠페인을 전개한다.", "source": "전자신문", "date": "2026-09-08 09:57", "url": "https://www.etnews.com/20260908000095", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 폴더블 광고"}, {"title": "India joins US-led global initiative to shape next-generation 6G networks ews/nokia-oyj-and-orange-france-complete-first-worldwide-live-service-provider-network-tomography-tria-ce785bd9dd88f420", "category": "tech", "importance": 4, "sid": "carrier", "topic": "노키아 오렌지 프랑스 라이브망"}, {"title": "Malaysia weighs Huawei chips for sovereign AI cloud - ET CIO SEA", "summary": "말레이시아 정부가 AI 클라우드 사업에 화웨이 칩을 사용하는 방안을 고려하고 있습니다.", "source": "ET CIO SEA", "date": "2026-09-09 17:40", "url": "https://ciosea.economictimes.indiatimes.com/news/data-center/malaysia-weighs-huawei-chips-for-sovereign-ai-cloud/133960841", "category": "tech", "importance": 4, "sid": "competitor", "topic": "말레이시아 화웨이"}, {"title": "Nokia launches live Mobile Core testing platform to accelerate AI-era network adoption - T", "summary": "노키아가 AI 시대의 네트워크 채택을 가속화하기 위해 라이브 모바일 코어 테스트 플랫폼을 출시했다. 통신사들이 AI 시대에 맞춘 소프트웨어 기능을 미리 시험하고 검증할 수 있는 환경을 제공한다. 경쟁사의 차세대 5G 코어 솔루션 출시 동향이다.", "source": "The Globe and Mail", "date": "2026-09-09 17:39", "url": "https://www.theglobeandmail.com/investing/markets/markets-news/Tipranks/4505678/nokia-launches-live-mobile-core-testing-platform-to-accelerate-ai-era-network-adoption/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 모바일 코어"}, {"title": "Ofcom Sets 2029 Copper Broadband Milestone as Openreach Fibre Investment, ARPU and Take-Up", "summary": "영국 통신규제기관 Ofcom이 2029년 구리선 브로드밴드 폐지 및 완전 광케이블(Fibre) 전환 마일스톤을 설정했다. 인프라 고도화 정책의 핵심 지표다.", "source": "telecomlead.com", "date": "2026-09-09 17:22", "url": "https://telecomlead.com/broadband/ofcom-sets-2029-copper-broadband-milestone-as-openreach-fibre-investment-arpu-and-take-up-rise-127665", "category": "policy", "importance": 4, "sid": "policy", "topic": "ofcom 광케이블 전환 마일스톤"}, {"title": "SK브로드밴드, DC 떼내자 성장재원 논란…SKT는 1.88조 확보 - PRESS9", "summary": "SK브로드밴드가 데이터센터(DC) 사업을 떼어내어 독립시키는 구조 개편을 단행한 가운데, 모회사 SK텔레콤이 1.88조 원 규모의 성장 재원을 확보하게 되었다. AI 및 클라우드 인프라 사업 투자를 위한 대규모 자본 재배치다. 통신 대기업의 대형 지배구조 및 사업 재편 딜이다.", "source": "PRESS9", "date": "2026-09-09 16:46", "url": "http://www.press9.kr/news/articleView.html?idxno=82485", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk브로드밴드 데이터센터 분할 및 sk텔레콤 재원 확보"}, {"title": "경찰 보급 보디캠 ‘중국산’ 의혹…KT컨소시엄 수사 - ichannela.com", "summary": "경찰청이 보급한 보디캠 사업에 중국산 장비가 국산으로 둔갑해 납품되었다는 의혹과 관련해 KT컨소시엄에 대한 경찰 수사가 진행 중이다. 공공 통신·보안 장비 조달 과정의 규제 위반 및 납품 비리 의혹을 다룬다. 대형 컨소시엄 사업의 법적 리스크다.", "source": "ichannela.com", "date": "2026-09-09 16:31", "url": "https://ichannela.com/news/detail/000000549534.do", "category": "policy", "importance": 4, "sid": "carrier", "topic": "경찰 보디캠 중국산 의혹 kt컨소시엄 수사"}, {"title": "Huawei feels the enduring love of Spain's telcos – to EU's horror", "summary": "유럽연합의 강력한 퇴출 압박과 제재 노력에도 불구하고, 스페인 총리가 유용한 동맹으로 자리 잡으면서 현지 통신사들은 화웨이 장비를 열성적으로 도입하고 있다. 스페인 통신사들은 EU의 반대에도 불구하고 화웨이와의 오랜 협력 관계를 유지하며 네트워크 구축을 지속하고 있다. 이러한 행보는 유럽 전역의 대중국 통신장비 제재 기조와 대조를 이루며 글로벌 장비 시장의 경쟁 구도에 변수로 작용하고 있다. 스페인 통신 시장에서의 화웨이 입지 유지는 경쟁사들의 유럽 내 점유율 확대 전략에 타격을 줄 수 있다.", "source": "Light Reading", "date": "2026-09-09 16:30", "url": "https://www.lightreading.com/regulatory-politics/huawei-feels-the-enduring-love-of-spain-s-telcos-to-eu-s-horror", "category": "contract", "importance": 4, "sid": "competitor", "topic": "화웨이 스페인 수주"}, {"title": "AT&T Business adds Amazon Leo to managed connectivity range - Telecompaper", "summary": "AT&T 비즈니스가 관리형 연결 서비스 범위에 아마존 레오 저궤도 위성 브로드밴드를 추가했다. 기업 고객의 네트워크 탄력성을 높이기 위한 전략적 행보이다. 위성통신 기반 상용 서비스의 저변이 확대되고 있다.", "source": "Telecompaper", "date": "2026-09-09 15:57", "url": "https://www.telecompaper.com/news/att-business-adds-amazon-leo-to-managed-connectivity-range--1582143", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 위성통신"}, {"title": "Satellite Broadband In India Gets Push As DCC Approves Spectrum Usage Charges - Swarajya", "summary": "", "source": "Swarajya", "date": "2026-09-09 15:37", "url": "https://swarajyamag.com/news-brief/satellite-broadband-in-india-gets-push-as-dcc-approves-spectrum-usage-charges", "category": "policy", "importance": 4, "sid": "policy", "topic": ""}, {"title": "KT클라우드, AI 데이터센터 1GW 확장…전력·구축 경쟁력 함께 키운다 - 위키리크스한국", "summary": "KT클라우드가 AI 데이터센터 용량을 1GW 규모로 대폭 확장하며 전력 인프라와 구축 경쟁력을 동시에 키워나가고 있다. 폭증하는 AI 연산 및 클라우드 수요를 소화하기 위한 대규모 인프라 투자 전략이다.", "source": "위키리크스한국", "date": "2026-09-09 15:20", "url": "https://www.wikileaks-kr.org/news/articleView.html?idxno=191800", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai 데이터센터 확장"}, {"title": "Apple forays into India's business messasging segment with Reliance Jio", "summary": "애플이 지역 통신사들과의 파트너십을 통해 미국, 영국, 독일, 프랑스, 스페인 등 주요 시장에서 비즈니스 RCS 도입을 점진적으로 활성화하고 있으며, 릴라이언스 지오(Reliance Jio)와 손잡고 인도 비즈니스 메시징 시장에도 진출한다. 서비스 가격은 통신사가 결정하며 시장별로 상이하다. 통신사와 빅테크 간의 차세대 메시징 협력 사례다.", "source": "ET Telecom", "date": "2026-09-09 15:16", "url": "https://telecom.economictimes.indiatimes.com/news/devices/apple-forays-into-indias-business-messasging-segment-with-reliance-jio/133955927", "category": "contract", "importance": 4, "sid": "carrier", "topic": "애플 비즈니스 메시징"}, {"title": "Huawei Technologies faces racketeering trial in US - BGNES", "summary": "화웨이가 미국 시장 내 과거 사업 거래와 관련하여 조직범죄 혐의로 정식 재판에 회부됐다. 글로벌 통신장비 시장 구도에 영향을 미칠 법적 리스크다.", "source": "BGNES", "date": "2026-09-09 15:14", "url": "http://www.bgnes.com/economy/huawei-technologies-faces-racketeering-trial-in-us", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 내 조직범죄 혐의 재판 회부"}, {"title": "민주당, 배달수수료 상한제 입법 재시동…국감 앞두고 플랫폼 압박", "summary": "더불어민주당이 국정감사를 앞두고 배달 수수료 상한제 도입 등 배달 플랫폼 규제 입법을 재추진한다. 공정거래위원회도 자율규제 한계를 인정하며 법제화 가능성을 열어둔 상태로, 업계와 전문가들은 합리적인 비용 분담 방안 설계를 강조하고 있다.", "source": "전자신문", "date": "2026-09-09 15:07", "url": "https://www.etnews.com/20260909000254", "category": "policy", "importance": 4, "sid": "policy", "topic": "더불어민주당 배달플랫폼 규제"}, {"title": "\"美 통신망 뒤흔든 '솔트 타이푼', 25% 잔존 '화웨이 장비 '가 침투 교두...", "summary": "미국 통신망을 뒤흔든 '솔트 타이펀' 사태의 원인으로 잔존한 중국산 화웨이 장비가 지목됐다. 주요국들이 고위험 장비 퇴출을 제도화한 가운데 미국은 FCC를 통해 철거를 지원하고 있다. 국내에서도 통신망 보안 강화를 위한 제도적 대책이 촉구되고 있다.", "source": " ogers-and-telus-lead-canadas-wi-fi-7-shift-as-fibre-pulls-ahead/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "캐나다 통신사 와이파이7 전환"}, {"title": "Verizon and Corning announce fiber agreement | About Verizon - Verizon", "summary": "버라이즌이 코닝과 대규모 광케이블 공급 계약을 체결했습니다. FTTP 광대역 인터넷망 구축과 AI 인프라 확장을 뒷받침하기 위한 수조 원 규모의 전략적 파트너십입니다. 고속 데이터 트래픽 증가에 대응하기 위한 핵심 네트워크 투자입니다. 통신사의 인프라 조달 및 장기 공급망 확보를 나타냅니다.", "source": "Verizon", "date": "2026-09-09 01:22", "url": "https://www.verizon.com/about/news/verizon-corning-broadband-ai-fiber-agreement", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 광케이블"}, {"title": "삼성전자, 프랑스 미스트랄 AI에 지분 투자…반도체 특화 AI 공동 개발", "summary": "삼성전자가 프랑스의 대표 AI 기업 '미스트랄 AI'에 지분 투자를 단행하고 반도체 특화 AI 모델을 공동 개발하기 위한 전략적 파트너십을 체결했다. 유럽의 AI 거점과의 협력을 통해 AI 경쟁력을 강화하려는 포석이다.", "source": "ZDNet Korea", "date": "2026-09-09 01:00", "url": "https://zdnet.co.kr/view/?no=20260908192706", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 미스트랄 ai 지분 투자 협력"}, {"title": "Verizon loads up on Corning's fiber for network expansion and AI infrastructure", "summary": "버라이즌은 네트워크 확장 및 인공지능(AI) 인프라 지원을 위해 코닝과 수십억 달러 규모의 광케이블 공급 계약을 체결했다. 계약에 따라 2027년부터 2032년까지 8000만 마일 이상의 광케이블을 공급받게 된다. 이번 대규모 투자는 버라이즌의 통신망 고도화와 AI 연계 인프라 구축 가속화를 위한 전략적 행보로 평가된다.", "source": "Light Reading", "date": "2026-09-09 00:56", "url": "https://www.lightreading.com/data-centers/verizon-loads-up-on-corning-s-fiber-for-network-expansion-and-ai-infrastructure", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 장비계약"}, {"title": "Ericsson says telco-grade AI RAN must deliver measurable gains at scale", "summary": "에릭슨의 전략적 RAN 리더십 총괄 가브리엘 포글란더는 RCR테크 텔코 AI 포럼에서 텔코급 AI RAN이 대규모 환경에서 측정 가능한 성과를 반드시 입증해야 한다고 강조했다. AI-RAN이 네트워크 전반에 AI를 내재화하는 광범위한 전환의 교두보 역할을 해야 한다는 설명이다. 글로벌 통신장비 경쟁사가 차세대 무선 접속망(RAN)과 AI의 결합 방향성을 제시한 핵심 발언이다. 삼성전자 네트워크사업부의 AI 기반 6G 및 차세대 네트워크 전략 수립에 시사점을 준다.", "source": "RCR Wireless", "date": "2026-09-09 00:44" ctions, Smarter Growth: Spectrum and Southern Bank Build a Future-Ready Netw", "summary": "차터 커뮤니케이션스의 스펙트럼(Spectrum) 브랜드가 서던 뱅크와 손잡고 미래 지향적인 기업용 네트워크 인프라를 구축한다. 통신사의 B2B 인프라 서비스 확장 사례이다.", "source": "Charter Communications", "date": "2026-09-09 00:24", "url": "https://corporate.charter.com/newsroom/spectrum-fiber-internet-powers-southern-bank-growth", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터커뮤니케이션스 네트워크"}, {"title": "Verizon, Corning ink fibre supply deal - Mobile World Live", "summary": "버라이즌(Verizon)과 코닝(Corning)이 차세대 초고속 인터넷망 구축과 AI 트래픽 수용을 위한 광섬유 장기 공급 계약을 공식 체결했습니다.", "source": "Mobile World Live", "date": "2026-09-09 00:13", "url": "https://www.mobileworldlive.com/verizon/verizon-corning-ink-fibre-supply-deal/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광섬유 공급"}, {"title": "EU telcos close ranks against Starlink in bid for satellite spectrum – report", "summary": "도이치텔레콤, 오렌지, 텔레포니카, 보다폰 등 유럽 주요 통신사들이 위성 직접통신(D2D)을 위한 EU 모바일 위성 주파수 입찰에 공동 참여하기 위해 컨소시엄 결성을 추진하고 있다. 스페이스X의 스타링크 등 위성통신 공세에 대응해 유럽 통신사들이 연합 전선을 구축하는 양상이다. 유럽 시장 내 위성통신 경쟁 구도에 큰 변화를 줄 것으로 전망된다.", "source": "Light Reading", "date": "2026-09-09 00:04", "url": "https://www.lightreading.com/satellite/eu-telcos-close-ranks-against-starlink-in-joint-bid-for-satellite-spectrum-report", "category": "contract", "importance": 4, "sid": "satellite", "topic": "도이치텔레콤 위성컨소시엄"}, {"title": "India joins US-led 6G initiative with 25 countries: What new global alliance means for the", "summary": "인도가 25개국이 참여하는 미국 주도의 6G 글로벌 동맹에 가입했습니다. 차세대 통신 기술 표준 선점과 공급망 협력을 강화합니다. 6G 연구개발 및 국제 협력 뉴스입니다.", "source": "The Economic Times", "date": "2026-09-09 00:03", "url": "https://m.economictimes.com/industry/telecom/telecom-news/india-joins-us-led-6g-initiative-with-25-countries-what-new-global-alliance-means-for-the-future-of-internet-and-wireless-connectivity/articleshow/133930349.cms", "category": "tech", "importance": 4, "sid": "satellite", "topic": "인도 6g"}, {  디지털 비전의 결합을 조명했다. 거대 통신 자회사의 상장은 글로벌 통신 시장에 막대한 자본 유입과 전략적 변화를 가져온다. 통신사의 재무 구조 개편 및 성장 전략을 보여주는 핵심 이벤트이다.", "source": "inventiva.co.in", "date": "2026-09-10 20:47", "url": "https://www.inventiva.co.in/stories/debt-reduction-meets-digital-ambition-inside-the-structure-of-jio-platforms-mega-ipo/", "category": "earnings", "importance": 4, "sid": "carrier", "topic": "릴라이언스지오 ipo"}, {"title": "Nokia unveils cognitiveOps suite tailored to critical comms and accelerated edge computing", "summary": "노키아가 미션 크리티컬 통신과 에지 컴퓨팅 환경에 최적화된 코그니티브옵스 제품군을 공식 발표했다. 이 솔루션은 산업 현장의 복잡한 네트워크 운영을 자동화하고 실시간 데이터 분석을 통해 장애 대응력을 높인다. AI 기술을 접목하여 네트워크 상태를 스스로 진단하고 최적화하는 기능을 제공한다. 노키아는 공공 안전 및 제조 시장을 적극 공략하고 있다.", "source": "Telecompaper", "date": "2026-09-10 20:33", "url": "https://www.telecompaper.com/news/nokia-unveils-cognitiveops-suite-tailored-to-critical-comms-and-accelerated-edge-computing--1582325", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 신제품"}, {"title": "Bharti Airtel receives ₹8.91 lakh DoT penalties for verification lapses - scanx.trade", "summary": "바르티에어텔이 가입자 확인 절차 미흡으로 인도 통신부로부터 약 89만 루피의 과태료를 부과받았습니다.", "source": "scanx.trade", "date": "2026-09-10 20:26", "url": "https://scanx.trade/stock-market-news/companies/bharti-airtel-receives-8-91-lakh-dot-penalties-verification-lapses/50584968", "category": "policy", "importance": 4, "sid": "policy", "topic": "바르티에어텔 제재"}, {"title": "Eurobites: Nokia X-rays Orange France's network - Light Reading", "summary": "노키아가 오렌지 프랑스의 네트워크 인프라에 대한 정밀 진단(X-ray) 및 최적화 작업을 수행하고 있다. 글로벌 장비사인 노키아가 주요 통신사의 망 진단을 지원하며 협력 관계를 과시하고 있다. 통신 장비 공급 및 유지보수 시장에서의 경쟁력을 보여주는 대형 계약 성격의 보도이다. 장비사 매출 및 고객사 연계 전략 파악에 중요도가 높다.", "source": "Light Reading", "date": "2026-09-10 20:21", "url": "https://www.lightreading.com/network-platforms/eurobites-nokia-x-rays-orange-france-s-network", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 오렌지 프랑스 네트워크 분석"}, {"title": "Liberty Global agrees €669m sale of VodafoneZiggo tower assets to DigitalBridge-led consor", "summary": "리버티 글로벌이 보다폰지고의 타워 자산을 디지털브리지 컨소시엄에 매각하기로 합의했습니다. 통신 인프라 자산 효율화를 위한 대규모 딜입니다.", "source": "BeBeez International", "date": "2026-09-10 20:07", "url": "https://bebeez.eu/2026/09/10/liberty-global-agrees-e669m-sale-of-vodafoneziggo-tower-assets-to-digitalbridge-led-consortium/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰지고 타워 매각"}, {"title": "Huawei gets lobbying boost from European pals after open RAN fail", "summary": "유럽 통신업계 보고서에 따르면, 오픈랜(Open RAN) 기술의 상용화가 지연됨에 따라 유럽연합(EU)이 화웨이 장비 사용을 전면 금지해서는 안 된다는 주장이 제기되었습니다. 이는 화웨이 장비에 대한 의존도가 여전히 높은 유럽 통신사들의 입장을 대변하는 것으로, 향후 EU의 통신 장비 정책 결정에 변수로 작용할 전망입니다.", "source": "Light Reading", "date": "2026-09-10 20:00", "url": "https://www.lightreading.com/regulatory-politics/huawei-gets-lobbying-boost-from-european-pals-after-open-ran-fail", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 유럽 규제"}, {"title": "HBM 공급부족에…화웨이도 AI칩 가격 대폭 인상 - 한국경제", "summary": "HBM 공급 부족으로 인해 화웨이의 AI 칩 가격이 대폭 인상되었습니다.", "source": "한국경제", "date": "2026-09-10 19:32", "url": "https://www.hankyung.com/article/202609107533i", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 칩 가격"}, {"title": "FCC Repays $3.08 Billion Treasury Loan for Rip & Replace - insidetowers.com", "summary": "미국 FCC가 'Rip & Replace(중국산 장비 제거 및 교체)' 프로그램을 위해 30억 8천만 달러의 재무부 대출을 상환함. 미국 내 보안 위협이 되는 중국산 통신 장비를 제거하고 신뢰할 수 있는 장비로 교체하는 정책의 일환임. 통신사들의 장비 교체 비용 부담을 완화하는 조치임.", "source": "insidetowers.com", "date": "2026-09-10 19:05", "url": "https://insidetowers.com/fcc-repays-3-08-billion-treasury-loan-for-rip-replace/", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 fcc 장비 교체 지원"}, {"title": "Nokia tests network tomography in first live trial with Orange France - Telecompaper", "summary": "노키아와 오렌지 프랑스가 세계 최초로 실제 운영 중인 서비스 제공업체 네트워크에서 네트워크 토모그래피 기술의 라이브 시험을 완료했다. 이 기술은 외부 측정 데이터를 통해 네트워크 내부의 상세한 상태를 추정하여 장애 구간을 신속히 찾아낸다. 양사는 네트워크 관리 효율성을 etitor", "topic": "애플 아이폰 듀오 국내 핵심부품 채택"}, {"title": "ZTE Global Summit & User Congress 2026 Opens in Kuala Lumpur, Advancing from Connectivity ", "summary": "ZTE가 쿠알라룸푸르에서 글로벌 서밋을 개최하고 차세대 연결 기술을 선보였습니다.", "source": "PR Newswire UK", "date": "2026-09-10 11:28", "url": "https://www.prnewswire.co.uk/news-releases/zte-global-summit--user-congress-2026-opens-in-kuala-lumpur-advancing-from-connectivity-to-digital-value-creation-302874501.html", "category": "tech", "importance": 4, "sid": "competitor", "topic": "zte 글로벌 서밋"}, {"title": "쿠팡·SKT급 유출 또 나면…과징금 '매출 10%' - v.daum.net", "summary": "쿠팡 및 SKT급의 대규모 정보 유출 사고 발생 시 과징금을 매출액의 최대 10%까지 부과하는 강력한 제재 방안이 추진됩니다. 통신사 및 플랫폼 기업의 보안 책임과 규제 강화 기조를 보여줍니다.", "source": "v.daum.net", "date": "2026-09-10 11:24", "url": "https://v.daum.net/v/20260910112400507", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 규제"}, {"title": "中 화웨이 장비 75% 교체했는데도 뚫렸다…美 통신망 해킹 파장", "summary": "미국 통신망이 대규모 해킹 사태인 '솔트 타이펀'에 뚫리면서 중국산 장비 잔존에 대한 우려가 커졌다. 미국은 FCC를 통해 화웨이 장비 철거를 지원하고 있으나 여전히 일부가 남아 보안 공백을 야기했다. 국내 정치권에서도 통신망 보안 대책 강화가 시급하다는 지적이 제기됐다.", "source": "news.mtn.co.kr", "date": "2026-09-10 11:14", "url": "https://news.mtn.co.kr/news-detail/2026091010555557264", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 솔트 타이펀 통신망 해킹 화웨이"}, {"title": "AT&T, 아마존 위성통신 결합 기업전용망 구성", "summary": "미국 AT&T가 광통신 및 5G 네트워크에 아마존의 저궤도 위성망 레오(Leo)를 결합하는 기업 전용 통신 서비스를 구축한다. 위성통신을 별도 상품이 아닌 기존 지상망과 하나의 기업용 서비스로 통합하여 커버리지와 복원력을 높인다. AT&T 비즈니스와 아마존 레오 간 계약을 통해 공공 및 기업 고객을 공략한다.", "source": "ZDNet Korea", "date": "2026-09-10 10:59", "url": "https://zdnet.co.kr/view/?no=20260910105904", "category": "contract", "importance": 4, "sid": "carrier", "topic": "at&t 위성통신"}, {"title": "신한·하나카드, AI결제 인프라 개발…SKT '모두의 AI' 컨소시엄 - 연합뉴스", "summary": "신한카드와 하나카드가 AI 결제 인프라 개발을 위해 SK텔레콤이 주도하는 '모두의 AI' 컨소시엄에 합류했다. 통신사와 금융권이 협력하여 AI 생태계를 확장하는 대표적 B2B 서비스 개발 사례이다.", "source": "연합뉴스", "date": "2026-09-10 10:50", "url": "https://www.yna.co.kr/amp/view/AKR20260910055000002", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai컨소시엄"}, {"title": "Verizon And Corning Sign Multi-Billion-Dollar Fiber Deal For Broadband And AI Infrastructu", "summary": "버라이즌이 코닝과 광대역 및 AI 인프라 확장을 위해 수십억 달러 규모의 대형 광케이블 공급 계약을 체결했다. 이번 계약을 통해 8,000만 마일 이상의 고밀도 광섬유를 확보하여 초고속 인터넷 및 AI 데이터센터 트래픽에 대응한다. 양사는 수년에 걸친 파트너십을 통해 미국 전역의 네트워크 고도화를 가속화할 방침이다. 통신사의 대규모 인프라 투자 계약으로 업계 파급력이 크다.", "source": "Pulse 2.0", "date": "2026-09-10 10:42", "url": "https://pulse2.com/verizon-and-corning-sign-multi-billion-dollar-fiber-deal-for-broadband-and-ai-infrastructure/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광케이블 계약"}, {"title": "2027년 통신장비 쇼티지 온다∙∙∙한국 중견업체 반사이익 주목 - leadeconomy.co.kr", "summary": "2027년 글로벌 통신장비 시장에 심각한 공급 부족 현상이 닥칠 것으로 전망되면서 국내 중견 장비 및 부품 업체들의 반사이익이 주목받고 있습니다. AI 데이터센터 투자와 맞물려 통신 인프라 수요가 급증하는 반면 주요 벤더들의 생산 능력이 한계에 달할 것이라는 분석입니다. 관련 수혜주에 대한 기대감이 커지고 있습니다.", "source": "leadeconomy.co.kr", "date": "2026-09-10 10:31", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9652", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "통신장비 쇼티지 전망"}, {"title": "2027년 통신장비 쇼티지 온다∙∙∙한국 중견업체 반사이익 주목 - 리드경제", "summary": "2027년 글로벌 통신장비 시장에 공급 부족 쇼티지가 발생할 것으로 전망되는 가운데, 국내 중견 통신장비 및 부품업체들이 누릴 반사이익에 대한 기대감이 높아지고 있다. 장비 수급 불균형에 따른 업계 지형 변화 분석이다.", "source": "리드경제", "date": "2026-09-10 10:31", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9652", "category": "tech", "importance": 4, "sid": "competitor", "topic": "통신장비 쇼티지 전망 중견업체 반사이익"}, {"title": "Charter at Goldman Sachs conference: growth push after Cox deal - Investing.com", "summary": "차터 커뮤니케이션스가 골드만 삭스 컨퍼런스에서 콕스(Cox) 인수 거래 이후의 본격적인 성장 추진 전략을 밝혔다. 케이블 및 브로드밴드 사업자의 대규모 확장 계획을 가늠할 수 있다. 주요 통신사의 경영 전략 발표다.", "source": "Investing.com", "date": "2026-09-10 10:00", "url": "https://www.investing.com/news/transcripts/charter-at-goldman-sachs-conference-growth-push-after-cox-deal-93CH-4894818", "category":   ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 출근길 음성 브리핑 (최근 24시간 4·5점 기사) ── */
function briefText(){
  if(typeof NEWS_BRIEF!=="undefined"&&NEWS_BRIEF.text) return NEWS_BRIEF.text;
  // 크롤러가 아직 원고를 만들기 전이면 아카이브 최신 날짜에서 즉석 생성
  const days=Object.keys(ARCH).sort().reverse();
  if(days.length){
    const items=(ARCH[days[0]]||[]).slice(0,8);
    if(items.length) return "네트워크 뉴스 브리핑입니다. "+items.map((a,i)=>(i+1)+"번째 소식. "+a.title+". "+(a.summary||"")).join(" ")+" 이상입니다.";
  }
  return "재생할 브리핑이 아직 없습니다.";
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(!("speechSynthesis" in window)){alert("이 브라우저는 음성 재생을 지원하지 않습니다.");return;}
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();b.textContent="🎧 브리핑";return;}
  const u=new SpeechSynthesisUtterance(briefText());
  u.lang="ko-KR";u.rate=1.05;
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith("ko"));
  if(v)u.voice=v;
  u.onend=()=>{b.textContent="🎧 브리핑";};
  u.onerror=()=>{b.textContent="🎧 브리핑";};
  b.textContent="⏹ 정지";
  speechSynthesis.speak(u);
}
/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
