 "https://www.newsmap.co.kr/news/articleView.html?idxno=2926", "category": "tech", "importance": 3, "wl": false, "topic": ""}], "competitor": [{"title": "China's Huawei heads to trial in US over sanctions and trade secrets - Nikkei Asia", "summary": "미국 법원에서 화웨이를 상대로 한 제재 위반 및 영업비밀 관련 형사 재판이 본격적으로 시작된다. 미중 기술 패권 경쟁 속에서 화웨이의 법적 리스크가 심화되는 국면이다. 글로벌 통신장비 시장 지형에 큰 파장을 미칠 수 있는 중대 사건이다.", "source": "Nikkei Asia", "date": "2026-09-08 00:00", "url": "https://asia.nikkei.com/politics/international-relations/us-china-tensions/china-s-huawei-heads-to-trial-in-us-over-sanctions-and-trade-secrets", "category": "policy", "importance": 5, "wl": false, "topic": "화웨이 미국재판"}, {"title": "India Plans Phased Removal of Chinese Equipment from Telecommunications Networks - Zamin.u", "summary": "인도 정부가 자국 통신망에서 중국산 통신장비를 단계적으로 철거하는 방안을 추진하고 있다. 국가 안보 우려에 따라 화웨이 등 중국 업체의 장비를 망에서 완전히 들어내려는 조치이다. 글로벌 통신장비 시장의 판도와 경쟁 구도에 중대한 영향을 미치는 대형 이슈이다.", "source": "Zamin.uz", "date": "2026-09-07 15:22", "url": "https://zamin.uz/en/technology/220473-india-plans-phased-removal-of-chinese-equipment-from-telecommunications-networks.html", "category": "policy", "importance": 5, "wl": false, "topic": "인도 중국산장비배제"}, {"title": "Huawei Kirin 9050 Pro Launches: LogicFolding Moves From Roadmap to Silicon - Tech Times", "summary": "화웨이가 새로운 로드맵을 거쳐 개발한 차세대 기린 9050 프로 프로세서가 실제 실리콘 양산 단계로 진입했다. 고성능 칩셋 설계 능력이 양산 제품에 적용됨을 알리는 내용이다. 경쟁사의 핵심 반도체 및 장비 기술 진전 사항이다.", "source": "Tech Times", "date": "2026-09-07 23:48", "url": "https://www.techtimes.com/articles/326836/20260907/huawei-kirin-9050-pro-launches-logicfolding-moves-roadmap-silicon.htm", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 기린칩셋"}, {"title": "Huawei unveils first major smartphone chip for six years - Telecoms", "summary": "화웨이가 6년 만에 자사 네트워크 및 스마트폰 기기에 탑재할 주요 자체 설계 모바일·통신 칩셋을 공개했다. 미국의 강력한 제재 속에서도 독자적인 반도체 설계 역량을 회복하고 있음을 보여준다. 경쟁사의 기술 자립화 가속화 조치이다.", "source": "Telecoms", "date": "2026-09-07 23:26", "url": "https://www.telecoms.com/mobile-devices/huawei-unveils-first-major-smartphone-chip-for-six-years", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 자체칩"}, {"title": "Huawei's SingleRAN rebuilds radio software for AI - Telecoms", "summary": "화웨이가 인공지능 시대를 맞아 무선 네트워크 소프트웨어를 재구축하는 '싱글RAN(SingleRAN)' 전략을 발표했다. AI 연동을 통해 무선 접속망의 효율성을 극대화하려는 기술적 시도이다. 경쟁사의 차세대 장비 및 소프트웨어 기술 전략에 해당한다.", "source": "Telecoms", "date": "2026-09-07 22:48", "url": "https://www.telecoms.com/telecoms-infrastructure/huawei-s-singleran-rebuilds-radio-software-for-ai", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 ai무선소프트웨어"}, {"title": "Was Huawei’s rise built on crime? A US jury will decide", "summary": "화웨이 본사에 대한 미국 배심원단의 정식 재판이 시작되면서 과거 성장 과정에서의 불법 행위 혐의가 다시 도마 위에 올랐다. 이번 재판은 화웨이가 글로벌 통신장비 시장에서 급성장하는 과정에서 저지른 기술 유출 및 사기 혐의 등을 다룬다. 미국 정부의 지속적인 제재 속에서 사법적 리스크가 추가됨에 따라 화웨이의 글로벌 사업 확장에 제동이 걸릴 수 있다. 삼성전자 등 경쟁사들에게는 반사이익 및 시장 점유율 변화의 기회가 될 수 있어 주목된다.", "source": "Financial Times Tech", "date": "2026-09-06 21:00", "url": "https://www.ft.com/content/9422805f-519c-4b22-839c-cbd7a6464f07?syn-25a6b1a6=1", "category": "policy", "importance": 4, "wl": true, "topic": "화웨이 미재판"}, {"title": "Huawei believes NPO is the optimal choice for the next generation of optical interconnects", "summary": "화웨이가 차세대 광상호연결(optical interconnects) 분야에서 NPO(Network Packet Optics 등)가 최적의 선택이라고 밝혔다. 초고속 광네트워크 전송 효율을 높이기 위한 기술적 비전을 제시했다. 경쟁사의 광통신 기술 연구 방향을 보여준다.", "source": "Developing Telecoms", "date": "2026-09-07 23:49", "url": "https://www.developingtelecoms.com/telecom-business/vendor-news/20785-huawei-believes-npo-is-the-optimal-choice-for-the-next-generation-of-optical-interconnects-for-ai-computing.html", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 광상호연결 npo"}, {"title": "Butterfly monitoring with AI and 5G networks - Ericsson", "summary": "에릭슨이 5G 네트워크와 인공지능 기술을 활용한 나비 모니터링 시스템 구축 사례를 소개했다. 통신 인프라가 단순 음성·데이터 전송을 넘어 생태계 환경 모니터링 같은 공익적 영역으로 활용될 수 있음을 보여준다. 경쟁사의 첨단 5G 기술 활용 전략을 가늠할 수 있다.", "source": "Ericsson", "date": "2026-09-07 21:01", "url": "https://www.ericsson.com/en/cases/2026/butterfly-monitoring-biodiversity-insights", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 5g네트워크"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - SDxCentral", "summary": "사우디 인프라 기업 타발이 라쿠텐 심포니의 클라우드 RAN 기술을 활용해 다중 통신사 실내 네트워크 인프라 구축을 완료했다. 가상화 및 클라우드 기반 오픈랜 기술의 상용 확산 사례이다. 경쟁사의 해외 수주 및 기술 적용 성과이다.", "source": "SDxCentral", "date": "2026-09-07 20:37", "url": "https://www.sdxcentral.com/news/rakuten-symphony-cloud-ran-tech-powers-tawals-multi-operator-indoor-network/", "category": "contract", "importance": 3, "wl": false, "topic": "타발 라쿠텐심포니"}, {"title": "Malaysia considers Huawei's Ascend 910C processors for a RM2 billion national AI program -", "summary": "말레이시아 정부가 20억 링깃 규모의 국가 AI 프로그램에 화웨이의 어센드 910C 프로세서를 채택하는 방안을 검토하고 있다. 국가 단위 AI 인프라 구축에 중국산 반도체와 장비가 연계되는 흐름이다. 글로벌 AI 및 통신 인프라 시장의 경쟁 상황을 보여준다.", "source": "Global Sources", "date": "2026-09-07 19:23", "url": "https://www.globalsources.com/sourcing-digest/malaysia-evaluates-huawei-ascend-910c-chips-for-a-landmark-sovereign-ai-initiative/?source=GSOLHP_SKC_2", "category": "contract", "importance": 3, "wl": false, "topic": "말레이시아 화웨이 ai프로그램"}, {"title": "Nokia and BeeHealthy Partner to Replace SMS OTPs with Network-Based Healthcare Verificatio", "summary": "노키아가 헬스케어 기업 비헬시(BeeHealthy)와 손잡고 네트워크 기반 검증 기술을 통해 기존의 SMS 일회용 비밀번호(OTP)를 대체하는 파트너십을 체결했다. 통신 네트워크 보안 및 인증 분야로의 사업 확장을 보여준다. 경쟁사의 신사업 제휴 사례이다.", "source": "TechAfrica News", "date": "2026-09-07 17:03", "url": "https://techafricanews.com/2026/09/07/nokia-beehealthy-replace-sms-otps-network-based-healthcare-verification/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 헬스케어보안"}, {"title": "Nokia opens research and development centre in Riyadh - TahawulTech.com", "summary": "노키아가 사우디아라비아 리야드에 새로운 연구개발(R&D) 센터를 공식 개소했다. 중동 지역에서의 입지를 강화하고 현지 통신사들과의 협력을 확대하기 위한 거점 마련의 일환이다. 글로벌 장비사의 지역별 R&D 투자 전략을 보여준 -ai-native-telco-frontrunners-56184/", "category": "tech", "importance": 3, "wl": false, "topic": "ai네이티브 통신사"}, {"title": "Telecom Egypt, PSL to develop Sharm El-Sheikh-Taba subsea cable - Connecting Africa", "summary": "통신 이집트(Telecom Egypt)가 PSL과 협력하여 샤르마 엘셰이크와 타바를 잇는 해저케이블 구축 프로젝트를 추진한다. 중동 지역의 해저 통신망 인프라를 확충하여 데이터 전송 용량을 늘리기 위한 목적이다. 통신사의 인프라 투자 소식이다.", "source": "Connecting Africa", "date": "2026-09-07 21:36", "url": "https://www.connectingafrica.com/connectivity/telecom-egypt-psl-to-develop-sharm-el-sheikh-taba-subsea-cable", "category": "contract", "importance": 3, "wl": false, "topic": "통신이집트 해저케이블"}, {"title": "Eurobites: Vodafone starts offering Quality on Demand API in Germany", "summary": "독일 보다폰이 기업 고객을 대상으로 품질 보장형(Quality on Demand) API 서비스를 출시했다. 이 서비스는 네트워크 성능을 실시간으로 제어하고 안정적인 연결 환경을 제공하는 데 초점을 맞추고 있다. 글로벌 통신사들이 5G 네트워크 수익화를 위해 API 표준화 및 상용화에 박차를 가하는 흐름의 일환이다. 향후 통신사들의 네트워크 개방 및 신규 비즈니스 모델 발굴에 기여할 것으로 전망된다.", "source": "Light Reading", "date": "2026-09-07 20:48", "url": "https://www.lightreading.com/wireless/eurobites-vodafone-starts-offering-quality-on-demand-api-in-germany", "category": "tech", "importance": 3, "wl": true, "topic": "보다폰 api"}, {"title": "FP2-MORANE-2 and the path to FRMCS deployment in Europe - International Railway Journal", "summary": "유럽 철도 부문에서 차세대 철도 통신 시스템(FRMCS) 도입을 위한 FP2-MORANE-2 프로젝트가 진행되고 있다. 유럽 전역의 철도 통신 인프라 현대화와 표준화 작업의 일환이다. 통신사의 특화망 및 공공 네트워크 투자 동향을 보여준다.", "source": "International Railway Journal", "date": "2026-09-07 19:41", "url": "https://www.railjournal.com/static/advertising/fp2-morane-2-and-the-path-to-frmcs-deployment-in-europe/", "category": "tech", "importance": 3, "wl": false, "topic": "유럽 철도무선 frmcs"}, {"title": "空飛ぶ基地局の試験成功 - fukuishimbun.co.jp", "summary": "고고도 통신 중계 플랫폼인 '하늘 위 기지국(HAPS 등)'을 활용한 무선 통신 시험이 성공을 거두었다. 지상 기지국의 한계를 극복하고 재난 지역이나 오지에 통신망을 공급하기 위한 차세대 무선 네트워크 기술 실증이다.", "source": "fukuishimbun.co.jp", "date": "2026-09-07 19:02", "url": "https://www.fukuishimbun.co.jp/articles/gallery/2688996",   let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
