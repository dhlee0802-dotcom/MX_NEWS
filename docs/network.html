ht-wi-fi/", "category": "contract", "importance": 4, "wl": false, "topic": "스타링크 위성통신"}, {"title": "Japan's Rakuten to debut satellite-to-cell service with Starlink rival AST - Nikkei Asia", "summary": "일본 라쿠텐이 스타링크의 라이벌인 AST 스페이스모바일과의 제휴를 통해 위성직접통신(satellite-to-cell) 서비스를 데뷔할 예정이다. 저궤도 위성 통신 시장의 경쟁 구도 변화를 예고하는 대형 협력이다.", "source": "Nikkei Asia", "date": "2026-09-05 01:20", "url": "https://asia.nikkei.com/business/telecommunication/japan-s-rakuten-to-debut-satellite-to-cell-service-with-starlink-rival-ast", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐모바일 위성통신 서비스"}, {"title": "추락하나했더니 ‘주가 재추진’…시총 2조달러 재입성한 스페이스X", "summary": "스페이스X의 기업 가치 산정 공식이 로켓과 스타링크 중심에서 위성통신과 AI 영역으로 확대되고 있다. 자본시장에서 회사의 AI 컴퓨팅 능력과 성장 잠재력이 높게 평가받고 있다. 시가총액 2조 달러 재입성을 견인하는 요인으로 작용하고 있다.", "source": "mk.co.kr", "date": "2026-09-06 21:43", "url": "https://www.mk.co.kr/article/12145621", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 기업가치"}, {"title": "美 뉴욕 가는 길 넓어졌다…유나이티드항공, 인천~뉴어크 매일 운항", "summary": "유나이티드항공이 보유 항공기에 스타링크 기반 와이파이를 순차 도입하고 있다. 올해 말까지 설치 대수를 대폭 늘리고 내년 말까지 전 기단으로 확대할 계획이다. 기내 위성인터넷 서비스 경쟁이 치열해지고 있다.", "source": "newsis.com", "date": "2026-09-06 16:14", "url": "https://www.newsis.com/view/NISX20260906_0003778045", "category": "contract", "importance": 3, "wl": false, "topic": "스타링크 항공기 와이파이"}, {"title": "HBM·CXL 쏟아지자… 큐알티 신뢰성 평가 사업에 기회 커진다", "summary": "저궤도 위성 시장의 성장에 따라 관련 부품과 전자장비에 대한 신뢰성 평가 및 시험 수요가 증가하고 있다. 큐알티 등 국내 기업들이 해외에 의존하던 특화 시험을 수행할 수 있는 기회가 커지고 있다. 우주 부품 국산화와 검증 인프라 확충이 기대된다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 15:46", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484275", "category": "strategy", "importance": 3, "wl": false, "topic": "큐알티 저궤도 위성 부품 테스트"}, {"title": "Spectrum Rocket Reaches Orbit From Andoya, Norway - srpske.rs", "summary": "노르웨이 안도야에서 스펙트럼 로켓이 궤도 진입에 성공했다. 유럽 지역의 상업용 로켓 발사 능력 확대를 의미한다. 위성 배치 인프라의 다양화에 기여하는 소식이다.", "source": "srpske.rs", "date": "2026-09-06 15:10", "url": " 이스x 실적 및 가입자"}, {"title": "저궤도 명당을 잡아라...우주도 '부동산 전쟁'", "summary": "데이터 송수신이 빠른 고도 500~1000km의 저궤도와 태양동기궤도 선점을 위한 우주 부동산 경쟁이 치열하다. 전체 위성의 상당수가 저궤도에 집중되어 있다. 거대 자본을 앞세운 위성 발사 경쟁이 본격화되고 있다.", "source": "ytn.co.kr", "date": "2026-09-06 05:35", "url": "https://www.ytn.co.kr/_ln/0105_202609060535437991", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 궤도 경쟁"}, {"title": "ASTS Stock Slides Premarket: AT&T Says SpaceX And Amazon Could Rival AST SpaceMobile In Sa", "summary": "AT&T가 스페이스X와 아마존의 위성통신 사업이 향후 AST 스페이스모바일의 다이렉트투셀 위성 서비스와 강력한 경쟁 구도를 형성할 것이라고 전망한 후 ASTS 주가가 시간외 거래서 하락했다. 위성 기반 직접 통신 시장을 선점하기 위한 빅테크와 통신사 간의 경쟁이 심화되고 있다.", "source": "Stocktwits", "date": "2026-09-06 02:32", "url": "https://stocktwits.com/news-articles/markets/equity/asts-stock-slides-premarket-att-flags-spacex-amazon-as-rivals/cZBfYzqRebM", "category": "other", "importance": 3, "wl": false, "topic": "에스티에스 스페이스모바일 경쟁"}, {"title": "돌연 파리 우주정상회의 안 간다는 스페이스X‥이유는?", "summary": "프랑스 대통령이 미국 스타링크의 대안으로 유럽 합작 위성 기업에 대규모 투자를 단행했다. 위성 인프라를 미국에 의존하는 것에 대한 우려가 제기됐다. 유럽의 독자적인 우주 주권 확보 움직임이 이어지고 있다.", "source": "imnews.imbc.com", "date": "2026-09-05 20:21", "url": "https://imnews.imbc.com/replay/2026/nwdesk/article/6849839_37004.html", "category": "strategy", "importance": 3, "wl": false, "topic": "스페이스x 유럽 위성 전략"}, {"title": "머스크, 스타링크 로 우크라 훈장...EU 속타는 이유는 [김기혁의 테슬라...", "summary": "우크라이나 전쟁 발발 이후 러시아군의 공격으로 지상 통신망이 파괴된 상황에서 스타링크가 핵심 통신 수단으로 활용됐다. 스페이스X의 저궤도 위성 인터넷이 전시 통신 위기를 극복하는 데 기여했다. 일론 머스크의 지원과 안보적 역할이 주목받고 있다.", "source": "sedaily.com", "date": "2026-09-05 20:01", "url": "https://www.sedaily.com/article/20087327?ref=naver", "category": "strategy", "importance": 3, "wl": false, "topic": "스타링크 우크라이나 지원"}, {"title": "LIG \"양자레이더, 새처럼 작게 탐지되는 스텔스기도 잡는다\"", "summary": "LIG넥스원이 스텔스기를 탐지할 수 있는 양자레이더 기술을 공개했다. 보안성 검토를 거쳐 공개된 사업 현황에는 양자 중력 센서 개발과 함께 저궤도 위성 체계 관련 내용이 포함됐다. 첨단 국방 기술과 위성 연계 연구가 진행 중이다.", "source": "zdnet.co.kr", "date": "2026-09-05 16:29", "url": "https://zdnet.co.kr/view/?no=20260905162848", "category": "tech", "importance": 3, "wl": false, "topic": "lig넥스원 양자레이더 개발"}, {"title": "Media: Trump’s snub throws Macron’s space summit into turmoil - Caliber.Az", "summary": "유럽의 우주 관련 정상회의가 정치적 외교적 요인으로 난항을 겪고 있다는 보도다. 글로벌 우주 안보와 정책 공조 과정에서의 갈등을 다룬다. 위성 및 우주 산업의 지정학적 중요성을 시사한다.", "source": "Caliber.Az", "date": "2026-09-05 15:09", "url": "https://caliber.az/en/post/media-trump-s-snub-throws-macron-s-space-summit-into-turmoil", "category": "policy", "importance": 3, "wl": false, "topic": "기타 우주정책"}, {"title": "테슬라-스페이스X 합병설 재부상...중국 생산망이 최대 걸림돌", "summary": "테슬라와 스페이스X의 합병설이 재부상한 가운데 중국 생산망이 최대 걸림돌로 지적됐다. 테슬라의 배터리 및 태양광 역량과 스페이스X의 스타링크 및 AI 모델 간 시너지가 거론된다. 글로벌 공급망과 지정학적 리스크가 변수로 작용하고 있다.", "source": "digitaltoday.co.kr", "date": "2026-09-05 15:02", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=698509", "category": "strategy", "importance": 3, "wl": false, "topic": "테슬라 스페이스x 합병"}, {"title": "ASTS Stock Eyes Weekly Comeback: AT&T Says AST SpaceMobile Satellite Offering Will 'Come T", "summary": "AT&T는 AST 스페이스모바일의 위성 기반 직접통신(D2C) 서비스가 계획대로 가시화될 것이라는 입장을 밝혔다. 이에 따라 ASTS 주가가 주간 단위의 반등세를 모색하며 위성통신 서비스 상용화 기대감을 높이고 있다.", "source": "Stocktwits", "date": "2026-09-05 12:15", "url": "https://stocktwits.com/news-articles/markets/equity/asts-at-and-t-satellite-offering-next-year/cZZn4ASR7DU", "category": "contract", "importance": 3, "wl": false, "topic": "에스티에스 스페이스모바일 위성서비스"}, {"title": "고고도 기지국?…소프트뱅크, 성층권서 엣지컴퓨팅 실험", "summary": "소프트뱅크가 성층권 통신 플랫폼(HAPS)을 활용한 엣지컴퓨팅 실험을 진행했다. HAPS는 스타링크와 같은 저궤도 위성의 단순한 대체재가 아니라 지상망과 위성을 잇는 별도의 네트워크 계층으로 발전할 가능성이 제기됐다. 차세대 통신 인프라 다변화가 추진되고 있다.", "source": "zdnet.co.kr", "date": "2026-09-05 06:01", "url": "https://zdnet.co.kr/view/?no=20260904222208", "category": "tech", "importance": 3, "wl": false, "topic": "소프트뱅크 haps 통신 실험"}, {"title": "[미리보는 AINEX 2026]〈상〉AI시대 우주·지상·해저 '초연결' 네트워크 미래 비전 제시 - 전자신문", "summary": "AI 시대 우주, 지상, 해저를 아우르는 초연결 네트워크의 미래 비전과 기술 동향을 다룬 행사 미리보기 기사다. 차세대 통신 인프라의 발전 방향을 제시한다.", "so tle": "통신 장비 주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게", "summary": "통신장비 시장에서 실적 개선에도 불구하고 미국과 한국의 주가 반응이 다른 현상을 분석했다. 3G에서 5G로 전환되는 과정에서 장비사 수는 줄고 선도업체로의 매출 쏠림 현상이 반복되고 있다. 엔비디아의 AI 기지국(AI-RAN) 시장 진입 등 새로운 경쟁 구도 변화가 언급된다. 글로벌 네트워크 장비 시장의 구조적 특징을 진단한 리포트다.", "source": "metroseoul.co.kr", "date": "2026-09-06 09:44", "url": "http://www.metroseoul.co.kr/article/20260906500019", "category": "tech", "importance": 4, "wl": false, "topic": "기타 통신장비"}, {"title": "Huawei September 7 Event: These seven devices launching next week - Huawei Central", "summary": "화웨이가 오는 7일 개최하는 대규모 신제품 발표회를 통해 스마트폰과 웨어러블 등 7종의 신기기를 전격 공개할 예정이다. 글로벌 통신장비 및 스마트폰 시장에서 화웨이의 차기 하드웨어 전략을 가늠할 수 있는 중요한 이벤트다.", "source": "Huawei Central", "date": "2026-09-05 21:57", "url": "https://www.huaweicentral.com/huawei-september-7-launching-devices/", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 신제품 발표회"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다", "summary": "노키아가 나주에서 머신러닝 기반 채널 추정 기술을 시험한 데 이어 삼성전자와 함께 성남 일대 상용망에서 AI 네트워크 실증에 나선다. 기지국을 AI 데이터센터로 활용하려는 통신사의 변신 트렌드를 보여준다. 글로벌 장비사인 노키아와 국내 대표 장비사인 삼성전자의 기술 실증 행보를 다룬다. 차세대 AI-RAN 및 무선 네트워크 고도화의 핵심 사례다.", "source": "yna.co.kr", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/view/AKR20260904023000017?input=1195m", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 ai 네트워크"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "summary": "인도 정부가 통신망 내에 구축된 레거시 중국산 통신장비의 전면 교체(Rip-and-Replace) 방안을 신중히 검토하고 있다. 옴디아의 수석 애널리스트에 따르면, 다년간 인도 통신망에서 운용되어 온 화웨이와 ZTE 등 중국산 장비를 철수시키는 조치가 본격화될 가능성이 제기된다. 이는 글로벌 통신장비 시장에서 보안 강화와 공급망 재편을 가속화하는 핵심 변수로 작용할 전망이다.", "source": "RCR Wireless", "date": "2026-09-04 23:22", "url": "https://rcrwireless.com/20260904/carriers/india-replace-chinese-equipment", "category": "policy", "importance": 4, "wl": true, "topic": "인도 통신장비 교체"}, {"title": "Nokia, Ericsson, IBM, to Blackberry: How humbled tech giants reinvented for a comeback - T", "summary": "노키아와 에릭슨, IBM, 블랙베리 등 과거 위기를 mmary": "마스오렌지와 에릭슨이 6G 시대를 대비한 초기 단계로 6GHz 주파수 대역에 대한 테스트를 성공적으로 진행했다. 양사는 차세대 이동통신 표준 선점을 위해 주파수 특성 분석과 네트워크 성능 검증 협력을 지속하고 있다.", "source": "Fierce Network", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 3, "wl": false, "topic": "마스오렌지 에릭슨 6g 테스트"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤과 에릭슨이 함부르크 컨테이너 터미널에 프라이빗 5G 네트워크를 성공적으로 구축했다. 이는 양사가 수년간 협력해온 산업용 셀룰러 실험의 연장선상으로, 항만 물류 자동화와 스마트 제조 분야에서 산업용 5G의 상용화 가능성을 입증하는 사례로 평가된다. 경쟁사인 에릭슨은 이번 프로젝트를 통해 글로벌 사설망 시장에서의 입지를 더욱 강화하고 있다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 3, "wl": true, "topic": "에릭슨 특화망 구축"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - Whalesbook", "summary": "자국산 통신 장비를 활용한 4G 네트워크가 일일 6 페타바이트의 트래픽 마일스톤을 달성하며 성공적으로 운용 중이다.", "source": "Whalesbook", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "tech", "importance": 3, "wl": false, "topic": "기타 국산 4g 네트워크"}, {"title": "Spain’s MásOrange signals a next step in the 6G story - telecomtv.com", "summary": "스페인의 마스오렌지가 6G 기술 시대를 향한 차세대 단계로의 진입을 선언하며 관련 연구와 기술 검증에 시동을 걸었다. 유럽 주요 통신사들과 장비업체들의 협력을 바탕으로 차세대 모바일 표준인 6G를 준비하는 움직임이 가속화되고 있다.", "source": "telecomtv.com", "date": "2026-09-04 23:32", "url": "https://www.telecomtv.com/content/6g/spain-s-m-sorange-signals-a-next-step-in-the-6g-story-56174/", "category": "tech", "importance": 3, "wl": false, "topic": "마스오렌지 육지스"}, {"title": "‘관세 폭탄’ 美에 등 돌린 加, 中과 8년 만에 군사 교류", "summary": "캐나다가 과거 화웨이 부체 체포로 악화됐던 중국과의 관계 개선에 나섰다. 최근 양국 간 국방 대화가 재개되는 등 군사 교류 협력이 강화되고 있다. 과거 통신장비 관련 갈등 국면에서 변화가 감지되고 있다.", "source": "kmib.co.kr", "date": "2026-09-06 18:38", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000009486&cp=nv", "category": "other", "importance": 2, "wl": false, "topic": "화웨이 캐나다 관계"}], "policy": [{"title": "Telcos oppose TRAI’s 5G network slicing rules, cite regulatory overreach - Communications ", "summary": "인도 통신사들이 통신규제당국(TRAI)의 5G 네트워크 슬라이싱 규칙에 대해 규제 과잉이라며 반발하고 나섰다. 5G 상용 서비스와 과금 체계에 영향을 미치는 규제 갈등 상황이다.", "source": "Communications Today", "date": "2026-09-05 14:25", "url": "https://www.communicationstoday.co.in/telcos-oppose-trais-5g-network-slicing-rules-cite-regulatory-overreach/", "category": "policy", "importance": 4, "wl": false, "topic": "인도 통신규제당국 5g 네트워크 슬라이싱 규제"}, {"title": "2027년 5G 경매 전망, 통신장비 투자 재논의 - tokenpost.kr", "summary": "2027년 예정된 5G 주파수 경매 전망이 대두되면서 통신사들의 신규 네트워크 투자 계획이 재논의되고 있다. 주파수 경매 결과는 향후 수년간의 이동통신망 고도화 투자 규모를 결정짓는 핵심 사안으로 통신장비 업계의 주목을 받고 있다.", "source": "tokenpost.kr", "date": "2026-09-05 08:38", "url": "https://www.tokenpost.kr/news/tech/402820", "category": "policy", "importance": 4, "wl": false, "topic": "5g 주파수 경매 재논의"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니] - 아시아경제", "summary": "내년 국내 통신 시장에서 5G 주파수 추가 경매가 진행될 것으로 전망되면서 관련 통신장비 제조사들의 수혜 여부에 업계의 관심이 집중되고 있다. 주파수 재할당 및 추가 할당은 통신사들의 무선국 투자를 촉발하여 국내 네트워크 장비 업계의 실적에 직접적인 영향을 미치는 핵심 변수다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 5g 주파수 경매"}, {"title": "'5G Spectrum Auction' Expected in Korea Next Year... Beneficiaries Among Telecom Equipment", "summary": "내년 국내 5G 추가 주파수 경매가 전망되는 가운데 통신 장비주들의 수혜 여부가 주목받고 있다. 정부의 주파수 정책 변화와 통신사의 망 투자 계획이 국내 장비 시장에 미치는 영향이 크다. 삼성전자 등 국내 네트워크 장비 업체의 내수 시장 입지와도 연관된다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/en/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "국내 5g 주파수 경매"}, {"title": "FCC Pays Back $3.08B 'Rip And Replace' Treasury Loan - Law360", "summary": "미국 연방통신위원회(FCC)가 화웨이 등 장비 퇴출을 위한 '립 앤 리플레이스(Rip and Replace)' 프로그램과 관련해 30억 달러 이상의 재무부 대출금을 상환했다. 중국산 통신장비 제재 및 망 교체 사업의 자금 집행과 관련된 주요 정책 뉴스다. 통신장비 시장에서 중국산 장비 퇴출 정책이 지속적으로 추진되고 있음을 보여준다.", "source": "Law360", "date": "2026-09-05 06:16", "url": "https://www.law360.com/amp/articles/2521986", "category": "policy", "importance": 4, "wl": false, "topic": "fcc 장비 교체 지원"}, {"title": "경상국립대, 우주항공·창업 혁신축 키운다…지역 성장 생태계 '가속'", "summary": "경상국립대가 과기정통부 과학기술혁신본부장과 만나 우주항공 분야 인재 양성 및 연구역량 강화 방안을 모색했다. 지역 성장 생태계 가속화를 위한 정부와 대학 간 협력이 논의됐다. 우주항공 중심의 지역 균형 발전이 추진된다.", "source": "industrynews.co.kr", "date": "2026-09-06 21:52", "url": "https://www.industrynews.co.kr/news/articleView.html?idxno=85575", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 우주항공 인재양성"}, {"title": "전화·검색·카톡 파고드는 ‘모두의 AI’… 생활 속 실행력 승부수", "summary": "과기정통부가 생활 속 AI 서비스 확산을 위한 사업 착수 간담회를 개최했다. 과기정통부 장관은 남다른 서비스와 비즈니스 모델을 통한 새로운 가치 창출을 주문했다. 국내 AI 생태계 경쟁력 강화를 위한 정부 지원이 본격화된다.", "source": "dt.co.kr", "date": "2026-09-06 18:38", "url": "https://www.dt.co.kr/article/12082349?ref=naver", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai 사업 간담회"}, {"title": "티빙 유출 사고 보상 신청 7일 시작… 4000만 계정 피해 어떻게 갚나", "summary": "과기정통부 민관합동조사단이 티빙 유출 사고를 중대 침해사고로 분류하고 조사 결과를 발표했다. 정부는 스미싱 등 2차 피해 방지를 위한 대응에 나섰다. 보안 관리 부실에 대한 제재 절차가 진행 중이다.", "source": "wikitree.co.kr", "date": "2026-09-06 16:02", "url": "https://www.wikitree.co.kr/articles/1157593", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 티빙 침해사고 조사"}, {"title": "AIDC 가르는 '기술기준' 나왔다", "summary": "과기정통부가 인공지능데이터센터(AIDC) 확산을 위한 기술기준 고시안을 마련했다. AI 장비 전력 소모량과 전체 정보통신 장비 전력 중 AI가 차지하는 비중 등이 기준에 포함됐다. 관련 시설의 효율적 운영과 관리가 기대된다.", "source": "etnews.com", "date": "2026-09-06 16:01", "url": "https://www.etnews.com/20260904000248", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 aidc 기술기준"}, {"title": "우주청·유엔, AI 통한 우주전파재난 대응 방안 논의", "summary": "우주항공청과 UN이 태양 활동으로 인한 위성 및 통신 장애 대응을 위해 AI 활용 방안을 논의한다. 양 기관은 서울에서 공동 워크숍을 개최하고 우주전파재난 협력 방안을 모색할 예정이다. 글로벌 차원의 우주 환경 위협 공동 대응이 추진된다.", "source": "viva100.com", "date": "2026-09-06 15:34", "url": "https://www.viva100.com/article/20260906500532", "category": "policy", "importance": 3, "wl": false, "topic": "우주항공청 우주전파재난 대응"}, {"title": "9.4조 AI 승부수 띄운 정부… '보안·전국민 서비스'로 생태계 가속", "summary": "과기정통부의 내년도 AI 관련 예산이 전년 대비 84.3% 늘어난 9조 4211억원으로 편성됐다. 이는 미토스 쇼크 대응과 보안, 전 국민 AI 서비스 제공을 위한 조치다. 정부 전체 예산 중 상당 비중을 차지하며 AI 생태계 가속화에 투입된다.", "source": "newscj.com", "date": "2026-09-06 14:18", "url": "https://www.newscj.com/news/articleView.html?idxno=3430376", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai 예산 대폭 확대"}, {"title": "[오늘 AI] 5000만 국민 AI 시대 열린다…'AI 주권'도 본격 시험대", "summary": "과기정통부가 '모두의 AI' 프로젝트 사업자 간담회를 열고 본격적인 AI 시대 준비에 나섰다. 외산 AI 서비스와의 차별화를 통해 AI 주권을 확립하는 것이 핵심 목표다. 국내 주요 기업들과의 협력이 추진되고 있다.", "source": "metroseoul.co.kr", "date": "2026-09-06 13:36", "url": "http://www.metroseoul.co.kr/article/20260906500151", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 모두의 ai 프로젝트"}, {"title": "정부, ‘모두의 AI’ 12월 출시 추진…보안 특화 AI 개발도 착수", "summary": "과기정통부가 추진하는 사이버 보안 특화 AI 파운데이션 모델 개발 사업 수행기관으로 네이버클라우드 컨소시엄이 선정됐다. 네이버클라우드와 SK텔레콤 등이 참여해 연내 출시를 목표로 개발을 진행한다. 국내 보안 AI 역량 강화가 기대된다.", "source": "sentv.co.kr", "date": "2026-09-06 11:30", "url": "https://www.sentv.co.kr/article/view/sentv202609060016", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 보안 ai 개발"}, {"title": "통신 빅3부터 쿠팡·티빙까지...민관합동조사단이 파헤친 침해사고 500일", "summary": "과기정통부 민관합동조사단이 지난 500일간 통신 및 방송 업계의 주요 사이버 침해사고를 조사한 결과가 발표됐다. 통신 빅3를 비롯한 주요 기업들의 보안 실태와 사고 원인이 분석됐다. 향후 정보보호 체계 강화의 기초 자료로 활용될 예정이다.", "source": "digitaltoday.co.kr", "date": "2026-09-06 08:14", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=698304", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 민관합동조사단 활동"}, {"title": "제각각 통신 방식 통일…軍, 전군 드론 '통신표준' 만든다 - news1.kr", "summary": "군이 제각각이던 드론 통신 방식을 하나로 통합하기 위해 전군 드론 통신 표준 제정에 나선다. 5G, 6G 위성통신, PS-LTE 등을 대상으로 최적의 표준을 모색한다. 무인기 운용의 상호 운용성과 통신 신뢰성을 높이기 위한 조치다. 공공 및 특수 통신망 표준화의 중요한 사례다.", "source": "news1.kr", "date": "2026-09-06 07:00", "url": "https://www.news1.kr/amp/diplomacy/defense-diplomacy/6280619", "category": "tech", "importance": 3, "wl": false, "topic": "국방부 드론 통신표준"}, {"title": "[단독] 과기정통부 , 유럽에 'AI 공동연구랩' 세운다", "summary": "과기정통부와 정보통신기획평가원(IITP)이 내년 유럽에 '글로벌 AI 공동연구랩' 구축에 착수한다. 국회 의원실을 통해 관련 사업설명서가 공개되며 글로벌 연구 협력 추진이 확인됐다. 유럽과의 AI R&D 연대가 본격화될 전망이다.", "source": "mt.co.kr", "date": "2026-09-06 06:30", "url": "https://www.mt.co.kr/tech/2026/09/06/2026090315315525902", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 유럽 ai 공동연구랩"}, {"title": "Union Minister Jyotiraditya Scindia launches theme for 10th India Mobile Congress 2026 - N", "summary": "인도 통신부가 제10회 인도 모바일콩그레스(IMC)의 주제를 발표했다. 인도 통신 시장의 성장과 모바일 기술 발전을 위한 행사의 준비 과정이다. 신흥 통신 시장의 정책적 방향성을 보여준다.", "source": "News On AIR", "date": "2026-09-06 04:56", "url": "https://newsonair.gov.in/union-minister-jyotiraditya-scindia-launches-theme-for-10th-india-mobile-congress-2026/", "category": "other", "importance": 3, "wl": false, "topic": "인도 모바일콩그레스"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "미국 연방항공청(FAA)의 5G 무선 고도계 관련 규제 갈등이 일단락되었다. 5G 통신 서비스와 항공기 안전 주파수 간의 간섭 문제를 해결하기 위한 조치들이 정착 단계에 접어들었다. 통신사와 항공 당국 간의 주파수 및 간섭 이슈가 해소되는 과정이다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "faa 5g 규제"}, {"title": "LIVE: | Islamabad 5G Spectrum Auction 2026 | PTA Inaugural Ceremony | Geo News James Haske", "summary": "파키스탄이 5G 주파수 경매 및 관련 개막식을 진행한다. 국가 차원의 5G 네트워크 도입을 위한 본격적인 절차다. 통신사들의 신규 주파수 확보와 장비 투자가 예상되는 대목이다.", "source": "Mshale", "date": "2026-09-05 14:17", "url": "https://mshale.com/9bf82a2b/01c0c54dNsw9aucTWYE", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 주파수 경매"}, {"title": "[뉴스+]SKT는 '수요'·KT는 '이음'·카카오는 '편리'…'모두의 AI' 3色 경...", "summary": "과기정통부가 '모두의 AI' 관련 예산으로 총 2500억원을 편성했다. 이 중 상당 금액이 엔비디아 등 인프라 확보에 투입될 예정이다. SK텔레콤, KT, 카카오 등 각 컨소시엄의 차별화된 전략이 추진된다.", "source": "businessplus.kr", "date": "2026-09-05 13:58", "url": "https://www.businessplus.kr/news/articleView.html?idxno=116431", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 모두의 ai 예산"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신규제당국(TRAI)이 제안한 5G 네트워크 슬라이싱 품질 측정 기준에 대해 이동통신사들이 강력히 반대하고 나섰다. 규제당국은 슬라이싱이 활성화된 구역에서 무선 자원 이용률이 80%를 초과하지 않도록 제한해 트래픽 여유 공간을 확보할 것을 요구했으나, 통신사들은 이는 망 운용의 유연성을 저해한다고 주장하고 있다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "인도 통신규제당국 5g슬라이싱"}, {"title": "적정공사비 확보, 고품질 ICT인프라 구축의 출발점", "summary": "데이터센터와 6G 통신망 등 정보통신인프라의 중요성이 커짐에 따라 적정공사비 확보와 전문 기술 인력 투입의 필요성을 강조한 기사다. 고품질 ICT 인프라 구축을 위한 제도적·기술적 기반을 다룬다.", "source": "koit.co.kr", "date": "2026-09-05 07:14", "url": "https://www.koit.co.kr/news/articleView.html?idxno=208861", "category": "tech", "importance": 3, "wl": false, "topic": "기타 통신인프라"}, {"title": "Communications Minister Jyotiraditya Scindia releases revised TDIP guidelines to boost tel", "summary": "인도 통신부가 통신 인프라 투자를 촉진하기 위해 수정된 TDIP 가이드라인을 발표했다. 통신 장비 및 서비스 확대를 위한 규제 개선 조치다. 인도 시장의 통신 장비 조달 환경에 영향을 미칠 것이다.", "source": "News On AIR", "date": "2026-09-05 05:17", "url": "https://newsonair.gov.in/communications-minister-jyotiraditya-scindia-releases-revised-tdip-guidelines-to-boost-telecom-sector/", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신정책"}, {"title": "Canada publishes Responsible Data Centre Development Principles - Telecompaper", "summary": "캐나다 정부가 책임 있는 데이터센터 개발 원칙(Responsible Data Centre Development Principles)을 공식 발표했다. AI 및 클라우드 인프라 확대에 따른 정책적 가이드라인이다.", "source": "Telecompaper", "date": "2026-09-05 00:21", "url": "https://www.telecompaper.com/news/canada-publishes-responsible-data-centre-development-principles--1581820", "category": "policy", "importance": 3, "wl": false, "topic": "캐나다 데이터센터 개발 원칙"}, {"title": "과기정통부 ·NIPA, '2026년 3D프린팅 전문인력 양성' 교육생 모집", "summary": "과기정통부와 정보통신산업진흥원이 2026년 3D프린팅 전문인력 양성 교육생을 모집한다. 국내 3D프린팅 산업의 기술 경쟁력 강화와 실무 인력 공급이 목적이다. 관련 교육 사업이 본격적으로 시행된다.", "source": "mtnews.net", "date": "2026-09-06 16:16", "url": "https://www.mtnews.net/news/articleView.html?idxno=25870", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 3d프린팅 인력양성"}, {"title": "최고 권위 '대한민국과기인상', 8년 만에 수상자 2명으로 확대", "summary": "과기정통부가 대한민국최고과기인상 수상자를 2명으로 확대하기로 했다. 연구개발 업적뿐만 아니라 경제발전 기여도 등이 선정 기준으로 반영된다. 국내 최고 권위의 과학기술인 예우가 강화된다.", "source": "etnews.com", "date": "2026-09-06 16:01", "url": "https://www.etnews.com/20260904000164", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 최고과기인상 확대"}, {"title": "[이준기의 과·알·세] “우수 연구자 성과급 준다는 데”… 출연연 연...", "summary": "과기정통부와 국가과학기술연구회가 우수 연구성과를 창출하는 정부출연연구기관을 대상으로 성과급 지원 방안을 추진한다. 기관평가 A등급 이상 받은 출연연 전 직원이 대상이다. 연구자 사기 진작과 성과 중심의 조직 문화 조성이 기대된다.", "source": "dt.co.kr", "date": "2026-09-06 15:14", "url": "https://www.dt.co.kr/article/12082291?ref=naver", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 출연연 성과급 개편"}, {"title": "[세종만사]공공기관 기능개혁, 발표 다음날 이례적 '사후 홍보전'", "summary": "과기정통부 장관이 유임되면서 AI 프로젝트 등 주요 정책의 연속성을 확보하게 됐다. 공공기관 기능개혁 발표 이후 이례적인 사후 홍보전이 펼쳐지기도 했다. 새 정부의 핵심 IT 과제들을 안정적으로 진두지휘할 전망이다.", "source": "etnews.com", "date": "2026-09-06 14:01", "url": "https://www.etnews.com/20260906000071", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 장관 유임"}, {"title": "충남도 ‘1조 원대 AI 모빌리티 실증 콤플렉스’ 첫 관문 통과", "summary": "충남도의 AI 모빌리티 실증 콤플렉스 구축 사업이 과기정통부의 R&D 사업추진심사 대상에 선정됐다. 내년 상반기 최종 본심사를 통과하면 국비와 지방비가 투입되어 본격적인 사업이 추진된다. 지역 미래 모빌리티 산업 육성이 기대된다.", "source": 사의 협업을 통한 데이터센터 인프라 경쟁력 강화를 보여주는 사례다.", "source": "매일경제 IT", "date": "2026-09-06 17:12", "url": "https://www.mk.co.kr/news/realestate/12145461", "category": "contract", "importance": 3, "wl": true, "topic": "지에스건설 엘지유플러스 데이터센터"}, {"title": "After 10 years of India feat, Jio sets its sights on global market: Akash Ambani", "summary": "인도 릴라이언스 지오의 아카시 암바니 회장은 자사가 지난 10년간 인도 전역에 저렴하고 접근성 높은 디지털 연결성을 제공한 데 이어 이제 글로벌 통신 시장 진출을 본격 추진한다고 밝혔다. 지오는 막대한 내수 시장에서의 성공을 발판 삼아 해외 통신 및 디지털 인프라 시장에서 영향력을 확대할 계획이다.", "source": "ET Telecom", "date": "2026-09-06 14:11", "url": "https://telecom.economictimes.indiatimes.com/news/industry/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market-akash-ambani/133826619", "category": "exec", "importance": 3, "wl": true, "topic": "릴라이언스 지오 글로벌 진출"}, {"title": "「繋がりづらくなる」懸念強まる楽天モバイル、終了予定のauローミングに言及「詰めの協議中」一部地域は継続へ - オタク総研", "summary": "라쿠텐모바일이 종료 예정이었던 au 로밍 협정과 관련해 일부 지역에서 지속하기 위해 KDDI와 막바지 협의를 진행 중임을 밝혔다. 커버리지 축소 우려를 불식시키기 위한 조치이다.", "source": "オタク総研", "date": "2026-09-06 11:30", "url": "https://0115765.com/archives/203995", "category": "policy", "importance": 3, "wl": false, "topic": "라쿠텐모바일 로밍 계약"}, {"title": "LGU+ 볼트업, 충전기 이상 감지 AI 개발…원격 조치 자동화 추진 - 전자신문", "summary": "LG유플러스의 전기차 충전 브랜드 '볼트업'이 충전기 이상을 감지하는 AI 기술을 개발하고 원격 조치 자동화를 추진한다. 인프라 관리의 효율성을 높이기 위한 AI 적용 사례다. 통신망과 연결된 설비의 스마트 관리 체계를 구축하고 있다. B2B 및 신사업 인프라 운영 역량을 강화하고 있다.", "source": "전자신문", "date": "2026-09-06 10:30", "url": "https://www.etnews.com/20260904000134?m=1", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai 충전기"}, {"title": "“PMDC 표준모델 공동개발”…GS건설, 모듈러로 AI데이터센터 공기 단축", "summary": "GS건설이 LG유플러스 등과 협력하여 인공지능 데이터센터 수요에 대응하기 위한 하이퍼스케일 모듈러 데이터센터(PMDC) 표준모델 공동 개발에 나선다. 설계와 시공, 운영 역량을 결집해 공기를 단축하고 데이터센터 건설 경쟁력을 높인다는 전략이다.", "source": "매일경제 IT", "date": "2026-09-06 10:14", "url": "https://www.mk.co.kr/news/realestate/12145229", "category": "contract", "importance": 3, "wl": true, "topic": "지에스건설 데이터센터 표준모델"}, {"title": "평범한 업무차가 통신망 훑는 AI 차량으로…SKT '톺다', 해외서도 눈길 - 뉴시스", "summary": "SK텔레콤이 개발한 AI 기반 통신망 분석 차량 '톺다'가 해외 시장에서도 주목받고 있다. 평범한 업무차량에 AI와 통신 측정 장비를 탑재해 무선 네트워크 품질을 효율적으로 점검한다. 자체 개발한 혁신적인 네트워크 운영 솔루션의 글로벌 진출 가능성을 보여준다. 통신사의 네트워크 고도화 및 기술 수출 사례다.", "source": "뉴시스", "date": "2026-09-06 10:13", "url": "https://mobile.newsis.com/view_amp.html?ar_id=NISX20260906_0003777890", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai 솔루션"}, {"title": "\"저궤도 위성만으로 지상망 대체 어렵다”", "summary": "미국 이동통신 3사가 저궤도 위성만으로는 지상망을 대체하기 어렵다는 입장을 보이고 있다. AT&T, T모바일, 버라이즌 등은 스타링크 모바일과의 MVNO 계약에 소극적이다. 대신 다양한 위성 사업자와 협력하고 주파수를 공동 활용해 음영지역을 해소하는 전략을 취하고 있다.", "source": "zdnet.co.kr", "date": "2026-09-06 08:42", "url": "https://zdnet.co.kr/view/?no=20260906084139", "category": "strategy", "importance": 3, "wl": false, "topic": "버라이즌 위성통신 전략"}, {"title": "통신3사 AI 데이터센터 확장에 탄소배출 관리 부담 커진다, 재생에너지...", "summary": "통신3사의 AI 데이터센터 확장과 5G 통신 장비 증설로 인해 전력 사용량과 탄소 배출 관리 부담이 커지고 있다. 재생에너지 조달 등의 과제가 대두되는 배경이다. 인프라 확장과 환경 규제 대응 사이의 균형이 통신사의 주요 경영 과제로 부각되고 있다.", "source": "businesspost.co.kr", "date": "2026-09-06 06:00", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=446333", "category": "other", "importance": 3, "wl": false, "topic": "sk텔레콤 ai 데이터센터"}, {"title": "Gov’t to upgrade all rural telephony networks to 4G capability – Sam George - MyJoyOnline", "summary": "정부가 농어촌 지역의 모든 통신망을 4G 역량으로 업그레이드하는 정책을 추진한다. 도농 간 디지털 격차를 해소하기 위한 통신 인프라 개선 사업이다.", "source": "MyJoyOnline", "date": "2026-09-06 01:48", "url": "https://www.myjoyonline.com/govt-to-upgrade-all-rural-telephony-networks-to-4g-capability-sam-george/", "category": "policy", "importance": 3, "wl": false, "topic": "기타 통신정책"}, {"title": "아이디퀀티크, Quantum Expo Korea 2026서 양자키분배·양자난수생성 기술...", "summary": "아이디퀀티크가 양자키분배 및 양자난수생성 기술을 전시하고 네트워크 장비를 소개했다. 과거 세계 최초 5G 스마트폰 '갤럭시 퀀텀'에 탑재된 양자 기술의 연장선상이다. 차세대 통신망 보안을 위한 양자 암호 통신 기술의 발전 방향을 보여준다.", "source": "aitimes.kr", "date": "2026-09-05 23:44", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41777", "category": "tech", "importance": 3, "wl": false, "topic": "아이디퀀티크 양자보안"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "글로벌 통신사 임원들이 5G의 더 큰 비즈니스 기회는 소비자 시장을 넘어 산업용 자동화와 스마트 제조 영역에 있다고 강조했다. 프라이빗 5G와 네트워크 슬라이싱 기술을 기반으로 한 B2B 시장 공략이 통신사들의 핵심 성장 동력으로 자리 잡고 있다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 산업용자동화 5g"}, {"title": "PTA Delays Decision on Ufone–Telenor Merger Amid Spectrum Auction - techjuice.pk", "summary": "파키스탄 규제 당국이 주파수 경매와 맞물려 통신사 간 인수합병(Ufone-Telenor) 승인 결정을 연기했다. 통신 시장의 구조조정과 경쟁 구도 재편에 영향을 미치는 규제 당국의 움직임이다.", "source": "techjuice.pk", "date": "2026-09-05 21:24", "url": "https://www.techjuice.pk/pta-delays-decision-on-ufone-telenor-merger-amid-spectrum-auction/", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 통신사 m&a"}, {"title": "공장 환경을 위한 무선 공존 설계", "summary": "스마트팩토리와 물류 현장에서 프라이빗 5G(이동통신 특화망) 구축 시 장비 간격 확보와 무선 공존 설계의 중요성을 다룬 기술 기사다. 공장 환경에서 안정적인 무선 통신을 유지하기 위한 핵심 전략을 제시한다.", "source": "hellot.net", "date": "2026-09-05 20:32", "url": "https://www.hellot.net/news/article.html?no=114796", "category": "tech", "importance": 3, "wl": false, "topic": "기타 프라이빗5g"}, {"title": "Pakistan’s 5G Rollout Slows Amid Rising Power Costs - digitalpakistan.pk", "summary": "파키스탄의 5G 도입 및 구축 작업이 전력 비용 상승 등으로 인해 지연되고 있다. 통신사들의 인프라 투자 경제성에 부담이 작용하고 있음을 보여준다. 신흥국의 통신망 고도화 과정에서 겪는 재정적 과제를 다룬다.", "source": "digitalpakistan.pk", "date": "2026-09-05 17:00", "url": "https://digitalpakistan.pk/pakistans-5g-rollout-slows-amid-rising-power-costs/", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 5g 투자"}, {"title": "Zong 5G Launches in 17 Cities: Here’s Where You Can Get It - techjuice.pk", "summary": "파키스탄의 주요 이동통신사인 종(Zong)이 17개 주요 도시에서 5G 통신 서비스 상용화를 본격 개 u히かりプラス'를 오는 17일부터 상용화한다. 이 서비스는 개통 즉시 이용 가능한 유연성과 망 장애 시 자동 백업 기능, VoLTE 기반의 고품질 유선전화를 지원한다. KDDI는 NTT의 광회선 재판매(콜라보레이션) 제도를 적극 활용하여 그룹 내 프로바이더 체계를 효율화하고 전국 단위의 사업 확장을 꾀하고 있다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "contract", "importance": 3, "wl": true, "topic": "케이디디아이 au히かり"}, {"title": "Verizon (VZ) Stock Looks Reasonable On Earnings Yet Mixed On Value - simplywall.st", "summary": "버라이즌 커뮤니케이션스의 최근 주식 시장 실적과 재무 건전성이 안정적인 것으로 평가받는 한편, 수익성 평가에 대해서는 시장 내 의견이 엇갈리고 있다. 견조한 실적 발표와 함께 통신 인프라 투자 규모가 투자자들의 주요 관심사로 꼽힌다.", "source": "simplywall.st", "date": "2026-09-05 05:33", "url": "https://simplywall.st/stocks/us/telecom/nyse-vz/verizon-communications/news/verizon-vz-stock-looks-reasonable-on-earnings-yet-mixed-on-v/amp", "category": "earnings", "importance": 3, "wl": false, "topic": "버라이즌 실적 분석"}, {"title": "T-Mobile appoints Shell veteran as next CFO - CFO Dive", "summary": "티모바일이 셸(Shell) 출신의 베테랑 인사를 새로운 최고재무책임자(CFO)로 임명했다. 통신 산업 외의 전문성을 수혈하여 재무 체질 개선을 꾀하려는 전략으로 풀이된다.", "source": "CFO Dive", "date": "2026-09-05 05:29", "url": "https://www.cfodive.com/news/tmobile-shell-ge-vernova-veteran-cfo-telecom-merger/829726/", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 최고재무책임자 교체"}, {"title": "Reliance Jio Launches JioPC: Turn Your Old Computer or TV Into a Cloud Desktop - PaidFreeD", "summary": "인도 릴라이언스 지오가 구형 컴퓨터나 TV를 클라우드 데스크톱으로 전환할 수 있는 '지오PC'를 출시했다. 통신망을 기반으로 한 클라우드 서비스 생태계를 확장하려는 전략이다. 저렴한 비용으로 디지털 접근성을 높이는 B2C 서비스 모델이다. 통신사의 소프트웨어 및 플랫폼 사업 다각화를 보여준다.", "source": "PaidFreeDroid", "date": "2026-09-05 03:43", "url": "https://paidfreedroid.com/2026/09/reliance-jio-jiopc-launch-india-cloud-computer-price.html/amp", "category": "tech", "importance": 3, "wl": false, "topic": "릴라이언스지오 클라우드pc"}, {"title": "Charter Communications stock falls as CFO transition and weak sentiment weigh - AD HOC NEW", "summary": "차터 커뮤니케이션즈가 최고재무책임자(CFO) 교체 과정에 돌입한 가운데, 투자 심   ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
