her", "importance": 3, "wl": false, "topic": "노키아 유럽 지수 복귀 및 사우디 확장"}, {"title": "SIMBA Brings Premium Whole-Home Wi-Fi Coverage to Singapore with Huawei’s First-in-Singapo", "summary": "싱가포르 통신사 심바(SIMBA)가 화웨이의 장비를 도입하여 싱가포르 최초로 프리미엄 홈 와이파이 커버리지 서비스 전용망을 구축했다. 유무선 홈네트워크 시장에서 화웨이 장비가 채택된 사례다.", "source": "Wake Up Singapore", "date": "2026-09-04 13:00", "url": "https://wakeup.sg/simba-huawei-wifi7-broadband/", "category": "contract", "importance": 3, "wl": false, "topic": "심바 화웨이 싱가포르 가정용 와이파이 커버리지 구축"}, {"title": "Nokia opens new research and development center in Saudi Arabia to accelerate AI-powered n", "summary": "노키아가 사우디아라비아에 신규 R&D 센터를 열어 AI 기반 통신 네트워크의 상용화와 고도화를 가속화한다. 현지 통신 인프라 시장에서의 입지를 강화하려는 전략이다. 네트워크 장비 업계의 해외 연구소 설립 소식이다.", "source": "cyprusshippingnews.com", "date": "2026-09-04 11:33", "url": "https://cyprusshippingnews.com/2026/09/04/nokia-opens-new-research-and-development-center-in-saudi-arabia-to-accelerate-ai-powered-network-automation/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 r&d 센터 개소 ai 네트워크 가속화"}, {"title": "[애널픽] 무선통신장비주 주목...\"피지컬AI 통신망 투자 본격화\" - 뷰어스", "summary": "무선통신장비 관련 주식들이 피지컬 AI(Physical AI) 구현을 위한 통신망 투자가 본격화될 것이라는 기대감에 주목받고 있다. AI 인프라와 결합하는 차세대 통신 장비 시장의 성장 가능성을 분석한 증권가 진단이다.", "source": "뷰어스", "date": "2026-09-04 08:49", "url": "https://theviewers.co.kr/View.aspx?No=4212481", "category": "tech", "importance": 3, "wl": false, "topic": "뷰어스 무선통신장비주 피지컬 ai 통신망 투자"}, {"title": "Nokia (HLSE:NOKIA) Targets Digital Healthcare With Network As Code - Yahoo Finance", "summary": "노키아가 네트워크 AS 코드(Network as Code) 플랫폼을 활용하여 디지털 헬스케어 시장을 본격적으로 공략하고 있다. 통신망 기능을 API 형태로 외부에 개방하여 의료 서비스의 효율성을 높이려는 전략이다. 통신 장비 업체의 수익 모델 다변화 및 소프트웨어 중심 비즈니스 전환을 보여준다.", "source": "Yahoo Finance", "date": "2026-09-04 03:16", "url": "https://finance.yahoo.com/technology/ai/articles/nokia-hlse-nokia-targets-digital-181601230.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 디지털 헬스케어 네트워크 api 공략"}, {"title": "Ericsson Japan begins AI network research with Tokyo partners - Telecoms Tech News", "summary": "에릭슨 일본 법인이 현지 파트너들과 함께 AI 기반 네트워크 최적화 및 통신망 연구를 시작했다. 일본 시장 내 기술 리더십을 유지하기 위한 R&D 협력 강화 조치다.", "source": "Telecoms Tech News", "date": "2026-09-04 00:16", "url": "https://www.telecomstechnews.com/news/ericsson-japan-begins-ai-network-research-with-tokyo-partners/", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 일본 도쿄 파트너 ai 네트워크 연구"}], "policy": [{"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신규제당국(Trai)이 5G 슬라이싱 서비스 활성화 지역 내 통신 자원 사용량을 모니터링하여 무선 자원 활용률이 80%를 넘지 않도록 제한하는 품질 보증 기준을 제안했으나, 이동통신사들이 이에 반발하고 있다. 5G 특화 서비스 규제 방향성을 둘러싼 정부와 통신업계 간의 마찰을 보여준다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 4, "wl": true, "topic": "인도통신규제 5g슬라이싱"}, {"title": "2027년 5G 경매 전망, 통신장비 투자 재논의 - tokenpost.kr", "summary": "2027년 예정된 5G 추가 주파수 경매 전망에 발맞추어 통신사들의 장비 투자 계획이 다시 테이블 위에 오르고 있다. 국내 통신 인프라 시장의 투자 재개 여부를 가늠할 수 있는 정책 및 시장 전망 보도다.", "source": "tokenpost.kr", "date": "2026-09-05 08:38", "url": "https://www.tokenpost.kr/news/tech/402820", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 2027년 5g 경매 전망 통신장비 투자 재논의"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니] - 아시아경제", "summary": "국내 통신 시장에서 오는 2027년 5G 추가 주파수 경매가 실시될 것으로 전망되면서 관련 통신장비 및 부품주들의 수혜 여부가 주목받고 있다. 주파수 할당에 따른 통신사들의 망 투자 재개 기대감이 커지고 있다. 국내 통신 정책 및 장비 시장에 미치는 파급력이 큰 주요 이슈다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 2027년 국내 5g 주파수 경매 전망"}, {"title": "Telcos push back on Trai’s proposed 5G slicing norms - financialexpress.com", "summary": "인도 통신사들이 TRAI(인도텔레콤규제청)가 제안한 5G 네트워크 슬라이싱 규정 초안에 대해 반발하고 나섰다. 서비스 자율성을 제한하는 규제 도입을 두고 통신사와 규제 당국 간 갈등이 벌어지고 있다. 향후 5G 비즈니스 모델에 큰 영향을 미칠 규제 이슈이다.", "source": "financialexpress.com", "date": "2026-09-04 21:49", "url": "https://www.financialexpress.com/business/news/telcos-push-back-on-trais-proposed-5g-slicing-norms/4332144/", "category": "policy", "importance": 4, "wl": false, "topic": "인도 네트워크 슬라이싱 규제"}, {"title": "India’s ₹20,000cr emergency network plan runs into cost and spectrum snags - Communication", "summary": "인도의 2,000억 루피 규모 비상 통신망 구축 계획이 비용 및 주파수 확보 문제에 부딪혀 난항을 겪고 있다. 국가 안보 및 재난 대비를 위한 대형 통신 인프라 프로젝트의 진행 차질을 다룬 정책·투자기사이다. 주파수 및 예산 조정 과정이 주목된다.", "source": "Communications Today", "date": "2026-09-04 13:18", "url": "https://www.communicationstoday.co.in/indias-%E2%82%B920000cr-emergency-network-plan-runs-into-cost-and-spectrum-snags/", "category": "policy", "importance": 4, "wl": false, "topic": "인도 비상 네트워크 계획"}, {"title": "India mulls removal of legacy Chinese telecoms kit - report - Data Center Dynamics", "summary": "인도 정부가 국가 안보 우려를 이유로 통신망 내에 남아있는 구형 중국산 통신장비를 단계적으로 철거하는 방안을 검토하고 있다. 화웨이 및 ZTE 등 중국 장비에 대한 규제가 글로벌 시장으로 확산되는 흐름을 보여준다. 삼성전자 등 비중국계 통신장비 업체들에게 새로운 반사이익 기회로 작용할 수 있는 주요 규제 이슈다.", "source": "Data Center Dynamics", "date": "2026-09-04 02:02", "url": "https://www.datacenterdynamics.com/en/news/india-mulls-removal-of-legacy-chinese-telecoms-kit-report/", "category": "policy", "importance": 4, "wl": false, "topic": "인도 구형 중국산 통신장비 철거 검토"}, {"title": "챗GPT 2300만명 쓰는데…'국가대표 AI' 아직 경쟁 중 [홍민성의 테토남]", "summary": "과학기술정보 통신 부는 지난해 8월 LG AI연구원, SK텔레콤, 업스테이지, 네이버클라우드, NC AI 등 5개 팀을... 과기정통부 의 2027년도 예산안에는 '전국민 AI서비스 보편적 활용지원' 사업이 새로 들어갔고 2500억원이...", "source": "hankyung.com", "date": "2026-09-05 09:01", "url": "https://www.hankyung.com/article/202609044207g", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "'5G Spectrum Auction' Expected in Korea Next Year... Beneficiaries Among Telecom Equipment", "summary": "", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/en/article/2026090320502060845", "cat egory": "policy", "importance": 4, "wl": true, "topic": "인도통신규제 중국산장비"}, {"title": "Elliott wants to scuttle Deutsche Telekom's T-Mobile US merger - telecoms.com", "summary": "행동주의 펀드 엘리엇이 도이체텔레콤을 압박하여 미국 자회사 티모바일과의 대규모 합병 구상을 저지하고 자사주 매입에 집중할 것을 요구하고 있다. 대형 통신사의 M&A 및 지배구조 전략에 개입하는 중대한 주주 행동주의 사안이다.", "source": "telecoms.com", "date": "2026-09-04 17:33", "url": "https://www.telecoms.com/operator-ecosystem/elliott-wants-to-scuttle-deutsche-telekom-s-t-mobile-us-merger", "category": "policy", "importance": 4, "wl": false, "topic": "엘리엇 도이체텔레콤 티모바일 미국 합병 무산 압박"}, {"title": "T-Mobile CFO Peter Osvaldik to step down in February 2027, Jessica Uhl to succeed", "summary": "미국 이동통신사 T-Mobile은 피터 오스발딕 CFO가 2027년 2월 사임하고 제시카 울이 후임으로 취임한다고 발표했다. 이번 인사는 행동주의 투자자 엘리엇 인베스트먼트가 도이치텔레콤 지분을 확보하고 독일 본사에 T-Mobile과의 합병 계획을 철회하라고 압박하는 가운데 이루어져 통신사 지배구조와 M&A 전략에 미치는 영향이 주목된다.", "source": "ET Telecom", "date": "2026-09-04 10:57", "url": "https://telecom.economictimes.indiatimes.com/news/industry/t-mobile-cfo-peter-osvaldik-to-step-down-in-february-2027-jessica-uhl-to-succeed/133749414", "category": "exec", "importance": 4, "wl": true, "topic": "티모바일 인사"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 릴라이언스 Jio가 나브라트라 및 디왈리 연휴 기간에 맞춰 40억 달러 규모의 대형 기업공개(IPO) 추진을 준비하고 있다. IPO가 10월 중순 축제 기간과 맞물릴 경우 이르면 다음 주부터 로드쇼가 시작될 전망이다. 인도 통신 시장의 자본 조달 및 기업가치 평가에 중대한 영향을 미치는 대형 이벤트다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "earnings", "importance": 4, "wl": true, "topic": "릴라이언스지오 상장"}, {"title": "Elliott pushes Deutsche Telekom to prioritize buybacks over T-Mobile US mega-merger - Fier", "summary": "행동주의 펀드 엘리엇이 독일 통신사 도이체텔레콤을 상대로 자사주 매입을 미국 티모바일과의 메가 합병보다 우선시할 것을 강하게 요구하고 나섰다. 대형 통신사의 경영 전략 및 지배구조에 개입하려는 행동주의 투자자의 압박이다.", "source": "Fierce Network", "date": "2026-09-04 07:38", "url": "https://www.fierce-network.com/wireless/dt-gets-pushback-elliott-over-t-mobile-merger-plans-reports", "category": "policy", "importance": 4, "wl": false, "topic": "엘리엇 도이체텔레콤 티모바일 미국 합병 우선순위 압박"}, {"title": "T-Mobile taps former Shell CFO Jessica Uhl to help steer next phase of AI and enterprise g", "summary": "미국 이동통신사 티모바일이 쉘(Shell)의 전직 최고재무책임자(CFO)인 제시카 울을 새로운 재무 수장으로 영입했다. 향후 인공지능(AI) 도입과 기업용(Enterprise) 사업 확장을 재정적으로 뒷받침하기 위한 전략적 인사다. 주요 통신사의 최고경영진 교체로 경영 전략 변화를 시사한다.", "source": "Fierce Network", "date": "2026-09-04 07:07", "url": "https://www.fierce-network.com/wireless/t-mobile-names-jessica-uhl-next-cfo", "category": "exec", "importance": 4, "wl": false, "topic": "티모바일 전 셸 cfo 제시카 울 영입 ai 기업 성장 주도"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "일본 이동통신사 소프트뱅크가 성층권 통신 플랫폼인 HAPS(High Altitude Platform Station)의 성층권 비행 시험을 완료하고 2027년 상용화를 목표로 추진 중이다. 고치현 무로토곶 앞바다에서 진행된 이번 시험에서는 드론과 에지 컴퓨팅 시스템 간의 끊김 없는 연결성을 포괄적으로 검증했다. 차세대 공중 통신망 기술 확보를 위한 중요한 진전으로 평가된다.", "source": "Light Reading", "date": "2026-09-03 23:20", "url": "https://www.lightreading.com/satellite/softbank-completes-stratospheric-haps-trial-eyes-2027-deployment", "category": "tech", "importance": 4, "wl": true, "topic": "소프트뱅크 haps"}, {"title": "Elliott Management builds Deutsche Telekom stake, opposes possible T-Mobile merger - repor", "summary": "엘리엇 매니지먼트가 도이치텔레콤의 주식을 대거 매입하며 주요 주주로 부상했다. 이와 함께 티모바일 US와의 합병안에 반대하는 입장을 공식화했다. 엘리엇의 개입으로 도이치텔레콤의 향후 M&A 전략에 큰 변화가 예상된다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:17", "url": "https://www.datacenterdynamics.com/en/news/elliott-management-builds-deutsche-telekom-stake-opposes-possible-t-mobile-merger-reports/", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 지분"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - AD HOC NEWS", "summary": "버라이즌이 프론티어(Frontier) 인수 합병 추진과 최고경영자(CEO) 리더십 전환을 단행한 가운데, 2분기 실적 호조에 힘입어 주가 상승세를 기록했다. 유무선 통합 가속화와 경영 체제 개편이 맞물린 대형 통신사 이벤트다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "contract", "importance": 4, "wl": false, "topic": "버라이즌 프론티어 인수 및 ceo 교체 실적 상승"}, {"title": "Retail Media in Korea: KT Connects 3,000 CU Stores - Sixteen:Nine", "summary": "KT가 BGF네트웍스와 협력하여 전국 CU 편의점 3,000개점에 디지털 사이니지 광고 인프라를 구축했다. 통신망과 미디어를 결합한 리테일 미디어 사업을 본격화하고 있다. 매장을 방문하는 소비자들에게 타겟팅된 광고와 콘텐츠를 제공할 예정이다.", "source": "Sixteen:Nine", "date": "2026-09-05 14:53", "url": "https://invidis.com/news/2026/09/retail-media-in-korea-kt-connects-3000-cu-stores/", "category": "contract", "importance": 3, "wl": false, "topic": "kt 리테일 미디어"}, {"title": "Deutsche Telekom Peoplewatch: change-at-the-top in finance, infra, and tech - telcotitans.", "summary": "도이치텔레콤이 재무, 인프라, 기술 부문 전반에 걸쳐 최고위층 인사 교체를 단행했다. 대대적인 리더십 개편을 통해 조직의 체질을 개선하고 미래 전략을 추진하려는 의도이다. 주요 통신 그룹의 인적 쇄신 동향이다.", "source": "telcotitans.com", "date": "2026-09-05 14:04", "url": "https://www.telcotitans.com/deutsche-telekomwatch/deutsche-telekom-peoplewatch-change-at-the-top-in-finance-infra-and-tech/10839.article", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 임원 인사"}, {"title": "[뉴스+]SKT는 '수요'·KT는 '이음'·카카오는 '편리'…'모두의 AI' 3色 경쟁 본격화 - 비즈니스플러스", "summary": "SKT의 '수요', KT의 '이음', 카카오의 '편리' 등 국내 주요 기업들의 '모두의 AI' 3색 경쟁이 본격화됐다. 각사의 강점을 살린 AI 서비스로 대중화 시대를 열겠다는 전략이다. 통신 인프라와 AI 기술의 결합이 가속화되고 있다.", "source": "비즈니스플러스", "date": "2026-09-05 13:57", "url": "https://www.businessplus.kr/news/articleView.html?idxno=116431", "category": "tech", "importance": 3, "wl": false, "topic": "skt ai"}, {"title": "[단독] '모두의 AI' 카카오·SKT·KT, 운영비로 100억씩 받는다 - 머니투데이 - mt.co.kr", "summary": "정부 주도의 '모두의 AI' 사업을 통해 카카오, SKT, KT가 각각 운영비로 100억 원씩 지원받게 됐다. 전 국민 대상 무료 AI 서비스 개발을 위한 정부의 마중물 예산 투입이다. 통신사와 플랫폼 기업의 국책 AI 프로젝트 참여가 확정됐다.", "source": "mt.co.kr", "date": "2026-09-05 13:48", "url": "https://www.mt.co.kr/tech/2026/09/04/2026090407422079624", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai"}, {"title": "SKT '수요'·KT '이음'·카카오 '편리'…모두의 AI 개발 시동", "summary": "SK텔레콤, KT, 카카오 등 3개 컨소시엄이 수요, 이음, 편리 등 각각의 핵심 가치를 내걸고 국민 누구나 무료로 사용하는 AI 서비스 '모두의 AI' 개발에 시동을 걸었다. 외산 AI와 차별화된 대중적 AI 챗봇과 에이전트 서비스 확산을 목표로 한다. 국내 주요 통신사들의 AI 기술 서비스 생태계 구축 전략을 보여준다.", "source": "전자신문", "date": "2026-09-05 12:00", "url": "https://www.etnews.com/20260904000276", "category": "tech", "importance": 3, "wl": true, "topic": "에스케이텔레콤 모두의ai"}, {"title": "KT, 전사 데이터 활용 체계 ‘에이전틱 데이터 플로우’ 구축…“조직 맥락 이해” - AI타임스", "summary": "KT가 전사 데이터를 통합 활용하는 체계인 '에이전틱 데이터 플로우'를 구축했다. 조직의 맥락을 스스로 이해하고 업무에 적용할 수 있는 AI 인프라를 조성하는 것이 핵심이다. 사내 업무 효율성 극대화와 AI 서비스 고도화를 동시에 추진하고 있다.", "source": "AI타임스", "date": "2026-09-05 10:35", "url": "https://www.aitimes.com/news/articleView.html?idxno=214847", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai"}, {"title": "楽天モバイル、ＩＤ未連携で強制解約｜四国新聞WEB朝刊 - shikoku-np.co.jp", "summary": "락텐모바일이 락텐 ID와 연계되지 않은 이용자들을 대상으로 강제 해지 조치를 단행하기로 했다. 가입자 데이터 정비 및 생태계 통합을 위한 강경책이다. 가입자 관리 정책의 변화를 보여준다.", "source": "shikoku-np.co.jp", "date": "2026-09-05 08:32", "url": "https://www.shikoku-np.co.jp/dg/article.aspx?id=K2026090500000013400", "category": "exec", "importance": 3, "wl": false, "topic": "라쿠텐모바일 강제해지"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - v.daum.net", "summary": "통신사의 기지국이 AI 데이터센터(AIDC)로 진화하며 새로운 수익 창출원으로 주목받고 있다. 통신 인프라를 활용해 AI 연산 인프라를 제공하는 모델로 사업 구조가 다변화되고 있다. 통신사들의 AI 인프라 사업 진출이 본격화되는 추세다.", "source": "v.daum.net", "date": "2026-09-05 06:34", "url": "https://v.daum.net/v/20260905063458471", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 데이터센터"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - yna.co.kr", "summary": "이동통신사들이 전통적인 무선 통신 기지국 인프라를 AI 데이터센터(DC)와 엣지 컴퓨팅 거점으로 전환하는 새로운 비즈니스 모델을 추진하고 있다. 통신사들의 망 고도화 및 신사업 진출 방향을 보여준다.", "source": "yna.co.kr", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR2 <script>
const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};
const SEC_NAME={competitor:"경쟁사",carrier:"통신사",satellite:"위성·6G",policy:"정책·규제",outage:"Outage"};
const TABS=[
  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성·6G",    secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
