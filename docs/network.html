<style>

  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}

  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

</style>
</head>

vice Bet365 (yibtc80mt9) - Mshale", "summary": "장기간의 네트워크 장애가 발생하여 AT&T 서비스 이용에 차질이 빚어졌다. 특정 서비스와 가입자들에게 영향을 미친 통신망 중단 사고다. 통신사의 망 안정성 관리 과제를 드러내는 장애 보도다.", "source": "Mshale", "date": "2026-09-04 23:14", "url": "https://mshale.com/171b30cd/8862e88fKJWBB98kxTM", "category": "outage", "importance": 3, "wl": false, "topic": "at&t 통신장애"}, {"title": "ドコモ、「ドコモメール」の障害復旧", "summary": "NTT도코모는 지난 27일 낮 시간에 일부 사용자를 대상으로 발생했던 도모코메일 서비스 장애가 완전히 복구되었다고 공식 발표했다. 당시 일부 가입자들이 메일 송수신에 불편을 겪었으나 현재는 정상화된 상태다.", "source": "ケータイ Watch", "date": "2026-09-04 16:20", "url": "https://k-tai.watch.impress.co.jp/docs/news/2138387.html", "category": "outage", "importance": 3, "wl": true, "topic": "ntt도코모 통신장애"}, {"title": "Verizon Wireless Goes Down for Thousands Thursday, Downdetector Reports - GV Wire", "summary": "목요일 미국 전역의 수천 명 버라이즌 무선 가입자들에게 통신 서비스 중단 장애가 발생했다고 다운디텍터가 보도했다. 갑작스러운 무선망 불통으로 이용자들이 통신에 차질을 빚었다. 통신사의 네트워크 신뢰성에 타격을 주는 국지적 장애 사고다. 일부 지역 및 서비스 영향으로 경미한 장애에 해당한다.", "source": "GV Wire", "date": "2026-09-04 10:38", "url": "https://gvwire.com/2026/09/03/verizon-wireless-goes-down-for-thousands-thursday-downdetector-reports/", "category": "outage", "importance": 3, "wl": false, "topic": "버라이즌 통신장애"}], "satellite": [{"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 6G의 3대 축으로 AI 네이티브 네트워크를 발표하며 통신 밸류체인 재편을 예고했다는 외신 보도이다. 차세대 통신 기술 표준화 및 AI 융합 전략을 보여준다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g"}, {"title": "ASTS Stock Jumps Overnight: Rakuten CEO Calls AST Satellite Push ‘Critical’ For Japan Secu", "summary": "라쿠텐 CEO가 AST의 위성 도입이 일본 안보와 통신 커버리지 측면에서 ‘결정적(Critical)’이라고 강조하며 주가 급등을 이끌었다. 위성통신 서비스가 통신사의 핵심 인프라 전략으로 자리 잡고 있음을 보여준다. 한일 양국의 통신-위성 협력 트렌드를 대표한다.", "source": "Stocktwits", "date": "2026-09-06 02:02", "url": "https://stocktwits.com/news-articles/mar upadhyay/133759314", "category": "contract", "importance": 4, "wl": true, "topic": "bsnl 4g 네트워크"}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - mobileeurope.co.uk", "summary": "노키아가 사우디아라비아에 AI 중심의 연구개발(R&D) 센터를 신설했다. 인공지능 기반의 네트워크 자동화 및 고도화 기술을 현지에서 가속화하기 위한 목적이다. 중동 지역의 디지털 전환 수요에 발맞추어 거점을 확장하는 전략적 행보이다. 글로벌 주요 장비사의 현지화 및 AI 기술 투자 의지를 보여준다.", "source": "mobileeurope.co.uk", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 r&d센터"}, {"title": "[Biz&Law] 삼성전자 , 美서 5G 기지국 특허침해 피소", "summary": "캐나다 NPE가 미국 텍사스주 동부 연방지방법원에 삼성전자가 버라이즌에 공급한 5G 기지국 네트워크 제품이 자사 특허를 침해했다고 제소했다는 보도이다. 삼성전자 네트워크사업부가 직접 당사자인 특허 소송 및 해외 주요 통신사 공급 건과 연관된 중요 법적 리스크이다.", "source": "the-biz.co.kr", "date": "2026-09-04 17:00", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=727390", "category": "policy", "importance": 4, "wl": false, "topic": "삼성전자 특허 피소"}, {"title": "Nokia may exit the consumer smartphone market - Zamin.uz", "summary": "노키아가 소비자 스마트폰 시장에서 철수할 수 있다는 Zamin.uz 보도이다. 경쟁사인 노키아가 통신 장비 및 B2B 인프라 사업에 집중하기 위해 포트폴리오를 조정하는 전략적 변화를 시사한다.", "source": "Zamin.uz", "date": "2026-09-04 15:54", "url": "https://zamin.uz/en/technology/220178-nokia-may-exit-the-consumer-smartphone-market.html", "category": "exec", "importance": 4, "wl": false, "topic": "노키아 스마트폰"}, {"title": "Maxis Deploys Nokia Optical Transport Technology To Boost AI And Enterprise Network Capaci", "summary": "맥시스가 AI 및 기업용 네트워크 역량을 강화하기 위해 노키아의 광전송 기술을 전격 도입했다. 대용량 데이터 전송과 초저지연이 요구되는 엔터프라이즈 시장 공략을 위한 인프라 투자다. 노키아는 아시아 태평양 지역에서의 장비 공급 실적을 추가로 확보했다. 통신사의 네트워크 고도화와 장비사의 수주 성과가 결합된 사례다.", "source": "Pokde.Net", "date": "2026-09-06 05:55", "url": "https://pokde.net/system/service/telco-isp/maxis-deploys-nokia-optical-transport-technology", "category": "contract", "importance": 3, "wl": false, "topic": "맥시스 노키아 광전송"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "통신 임원들은 5G의 더 큰 기회가 산업 자동화 영역에 있다고 평가했다. 제조 현장과 물류 등에서 초저지연과 고신뢰성을 제공하는 5G 특화망의 중요성이 커지고 있다. 노키아 등 주요 장비사들은 기업 전용망과 자동화 솔루션 공급을 확대하고 있다. B2B 시장에서 통신 장비 기업들의 새로운 성장 동력으로 자리 잡고 있음을 시사한다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 산업용 자동화"}, {"title": "Huawei September 7 Event: These seven devices launching next week - Huawei Central", "summary": "화웨이가 대규모 신제품 발표회를 개최하고 다수의 신기기를 공개할 예정임을 예고했다. 모바일 단말기 중심의 행사이나 글로벌 ICT 시장에서의 화웨이 영향력을 보여준다. 경쟁사의 마케팅 일정 및 신제품 라인업 확장 동향을 파악할 수 있다. 직접적인 네트워크 장비 뉴스는 아니나 경쟁사 동향으로 참고된다.", "source": "Huawei Central", "date": "2026-09-05 21:57", "url": "https://www.huaweicentral.com/huawei-september-7-launching-devices/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 신제품 행사"}, {"title": "Top 10 Telecom Tower Deals of 2026: MTN, IHS Towers, Altius, Macquarie and CVC Drive Infra", "summary": "MTN, IHS타워스, 알티우스 등 주요 기업들이 주도한 2026년 상반기 10대 통신 타워 거래를 결산했다. 글로벌 통신사들의 자산 경량화와 인프라 펀드의 투자가 맞물려 타워 인프라 M&A가 활발하게 이루어지고 있다. 통신 인프라 시장의 자본 흐름과 구조조정 트렌드를 보여준다. 장비 투자 환경에도 간접적인 영향을 미치는 주요 시장 동향이다.", "source": "TelecomLead", "date": "2026-09-05 16:32", "url": "https://telecomlead.com/telecom-equipment/top-10-telecom-tower-deals-of-2026-mtn-ihs-towers-altius-macquarie-and-cvc-drive-infrastructure-ma-127617", "category": "contract", "importance": 3, "wl": false, "topic": "통신 타워 딜"}, {"title": "Huawei Enterprise AI Push Is Reshaping Industrial Infrastructure - urbanacres.in", "summary": "화웨이의 기업용 AI 추진 전략이 산업 인프라 전반을 재편하고 있다. 제조, 물류 등 전통 산업에서 AI와 결합된 통신 및 컴퓨팅 인프라 수요를 자극하고 있다. 화웨이의 B2B 솔루션 확장 전략을 보여주는 대목이다. 통신 장비와 AI의 융합 트렌드를 나타낸다.", "source": "urbanacres.in", "date": "2026-09-05 11:27", "url": "https://urbanacres.in/huawei-enterprise-ai-push-is-reshaping-industrial-infrastructure/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 엔터프라이즈 ai"}, {"title": "Nokia Tests Network APIs in Healthcare - Telecom Reseller / Technology Reseller News", "summary": "노키아가 헬스케어 분야에서 네트워크 API 테스트를 진행하며 새로운 활용 사례를 모색하고 있다. 통신사 네트워크의 프로그래밍 가능성을 높여 다양한 산업과의 융합을 추진하는 전략의 일환이다. 경쟁사들도 개방형 네트워크 생태계 조성을 위한 API 개발에 주력하고 있다. 이를 통해 통신 장비 외에 소프트웨어 및 서비스 영역으로 수익원을 다변화하려는 의미를 갖는다.", "source": "Telecom Reseller / Technology Reseller News", "date": "2026-09-05 06:30", "url": "https://telecomreseller.com/2026/09/04/nokia-tests-network-apis-in-healthcare/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 네트워크 api"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - fierce-network.co", "summary": "스페인의 마스오렌지와 에릭슨이 6GHz 주파수를 활용한 테스트를 진행하며 6G 시대를 향한 초기 발걸음을 내디뎠다. 차세대 이동통신 표준 후보 대역에서의 성능을 검증하고 주파수 효율성을 높이는 연구다. 유럽 통신사와 장비사 간의 긴밀한 협력을 통해 미래 기술 주도권을 쥐려는 시도다. 향후 6G 상용화 로드맵의 중요한 기술적 기반이 된다.", "source": "fierce-network.com", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 마스오렌지 6g"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - whalesbook.com", "summary": "인도 BSNL의 국산 4G 네트워크가 일일 트래픽 6페타바이트 마일스톤을 달성하며 순항 중이다. 독자적인 인프라 구축의 실효성을 입증하고 있다.", "source": "whalesbook.com", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "tech", "importance": 3, "wl": false, "topic": "cdot bsnl망"}, {"title": "Spain’s MásOrange signals a next step in the 6G story - telecomtv.com", "summary": "스페인 마스오렌지가 6G 시대를 향한 다음 단계를 공식화하며 기술 준비에 착수했다. 유럽 시장에서 차세대 이동통신 표준 선점을 위한 선행 연구와 테스트를 이어가고 있다. 통신사 차원에서 미래 네트워크 비전을 제시하고 장비사들과 협력을 모색하는 단계다. 6G 표준화 논의가 점차 구체화되고 있음을 보여준다.", "source": "telecomtv.com", "date": "2026-09-04 23:32", "url": "https://www.telecomtv.com/content/6g/spain-s-m-sorange-signals-a-next-step-in-the-6g-story-56174/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "마스오렌지 6g"}, {"title": "Huawei latest SingleRAN 22.1 launch targets the Agentverse - Total Telecom", "summary": "화웨이가 최신 SingleRAN 22.1 버전을 출시하며 에이전트버스(Agentverse)를 타겟팅한다고 밝혔다. 무선 통신망 장비의 소프트웨어 업그레이드를 통해 AI 에이전트 환경을 지원하는 기능을 담았다. 통신 장비의 지능화와 효율성 향상을 도모하는 신제품 출시 소식이다. 화웨이의 무선 네트워크 기술 경쟁력을 보여준다.", "source": "Total Telecom", "date": "2026-09-04 22:16", "url": "https://totaltele.com/huawei-latest-singleran-22-1-launch-targets-the-agentverse/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 singleran"}, {"title": "딥시크, 내몽골 1GW 데이터센터에 ' 화웨이 칩 16만개' 투입 추진", "summary": "중국 인공지능(AI) 스타트업 딥시크가 자국 통신장비 ·반도체 기업 화웨이 의 AI 가속기 도입을 추진하며 대규모 컴퓨팅 거점 구축에 속도를 내고 있다. 4일(현지시간) 블룸버그 통신 에 따르면 딥시크는 내몽골 자치구에...", "source": "joseilbo.com", "date": "2026-09-04 21:13", "url": "http://www.joseilbo.com/news/news_read.php?uid=575124&class=78&grp=", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "AI-RAN Business Case 2026: Can AI Cut Mobile Network Costs and Double Spectrum Capacity? -", "summary": "2026년 AI-RAN 비즈니스 모델을 조명하며 AI가 모바일 네트워크 비용을 절감하고 주파수 용량을 배가할 수 있을지 분석했다. 인공지능과 무선 접속망의 결합이 통신사의 운영 비용을 낮추고 효율성을 극대화할 것으로 기대를 모으고 있다. 장비 업계와 통신사 모두에게 새로운 수익 창출과 비용 절감 방안으로 부상했다. 관련 기술 표준화와 상용화 논의가 활발해지고 있다.", "source": "TelecomLead", "date": "2026-09-04 19:44", "url": "https://telecomlead.com/telecom-services/ai-ran-business-case-2026-can-ai-cut-mobile-network-costs-and-double-spectrum-capacity-127608?amp=1", "category": "tech", "importance": 3, "wl": false, "topic": "ai-ran 비즈니스"}, {"title": "Maxis strengthens its nationwide network infrastructure with Nokia’s optical transport tec", "summary": "맥시스가 노키아의 광전송 기술을 도입해 전국적인 네트워크 인프라를 대폭 강화했다. AI 및 기업용 네트워크 수요 증가에 대응하기 위한 조치로 전송 용량과 안정성을 높였다. 노키아는 이번 공급을 통해 아시아 지역 광전송 시장에서의 입지를 한층 공고히 했다. 대형 통신사의 인프라 고도화 과정에서 노키아의 기술력이 채택되었다는 점에서 의미가 있다.", "source": "telecomtv.com", "date": "2026-09-04 17:09", "url": "https://www.telecomtv.com/content/nokia/maxis-strengthens-its-nationwide-network-infrastructure-with-nokia-s-optical-transport-technology-56172/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 맥시스 수주"}, {"title": "Telecom Egypt to extend Red2Med system to Taba with petabit link - Developing Telecoms", "summary": "텔레콤이집트가 페타비트급 링크를 통해 Red2Med 시스템을 타바 지역까지 확장하기로 했다. 중동과 지중해를 잇는 핵심 해저 및 육상 광통신 경로의 용량을 대폭 늘리는 대형 인프라 프로젝트다. 데이터 트래픽 급증에 대응하고 지역 허브로서의 지위를 강화하기 위한 조치다. 글로벌 통신 인프라 확충의 일환으로 관련 장비 수요를 견인한다.", "source": "Developing Telecoms", "date": "2026-09-04 14:58", "url": "https://developingtelecoms.com/telecom-technology/optical-fixed-networks/20777-telecom-egypt-to-extend-red2med-system-to-taba-with-petabit-link.html", "category": "contract", "importance": 3, "wl": false, "topic": "텔레콤이집트 red2med"}, {"title": "Ericsson and Uni of Tokyo explore connectivity and AI scenarios for 2035 - Telecompaper", "summary": "에릭슨과 도쿄대학교가 2035년을 내다보며 차세대 연결성과 AI 시나리오를 공동 연구하기로 했다. 장기적인 통신 기술 진화와 인공지능 접목 방안을 모색하기 위한 산학협력 프로젝트다. 미래 네트워크 패러다임을 선점하기 위한 기초 연구 성격이 강하다. 글로벌 장비사들의 선행 연구 방향성을 보여준다.", "source": "Telecompaper", "date": "2026-09-04 14:41", "url": "https://www.telecompaper.com/news/ericsson-and-uni-of-tokyo-explore-connectivity-and-ai-scenarios-for-2035--1581697", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 도쿄대 연구"}, {"title": "Nokia Opens First Saudi Arabia R&D Centre - News Ghana", "summary": "노키아가 사우디아라비아에 첫 번째 연구개발 센터를 공식 개소했다. AI 기반 네트워크 기술 개발을 중동 현지에서 주도하며 지역 파트너십을 강화한다. 중동 정부의 첨단 기술 육성 기조와 맞물려 협력 관계를 공고히 하고 있다. 글로벌 R&D 네트워크 확대를 통한 기술 경쟁력 확보 조치다.", "source": "News Ghana", "date": "2026-09-04 14:09", "url": "https://newsghana.com.gh/nokia-opens-first-saudi-arabia-rd-centre/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 r&d"}, {"title": "[최홍석 칼럼] AI 에이전트가 달리려면 어떤 도로가 필요한가", "summary": "06) Indosat Ooredoo Hutchison는 2026년 3월 MWC에서 노키아·엔비디아와 함께 동남아시아 최초의 AI-RAN 기반 레이어3 5G 통화를 실증했습니다 /* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
