  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}

ummary": "AST SpaceMobile이 일본에서의 대규모 자금 조달과 제휴를 통해 국가 위성 통신망 구축에 나섰다. 스타링크에 대항하는 저궤도 위성 통신 플레이어로 주목받고 있다. 위성 기반 직접 통신 시장의 지형 변화를 보여준다.", "source": "Yahoo Finance", "date": "2026-09-06 23:25", "url": "https://finance.yahoo.com/markets/stocks/articles/forget-starlink-japan-1-billion-142530511.html", "category": "contract", "importance": 4, "wl": false, "topic": "ast스페이스모바일 일본 위성 서비스"}, {"title": "ASTS Stock Eyes Weekly Comeback: AT&T Says AST SpaceMobile Satellite Offering Will 'Come T", "summary": "AT&T가 AST 스페이스모바일의 위성통신 서비스 제공이 임박했다고 밝혔다. 양사의 협력을 통해 위성 기반 직접 통신 서비스가 구체화되고 있다. 위성통신 시장에서의 경쟁 구도를 강화하는 중요한 행보로 평가된다.", "source": "stocktwits.com", "date": "2026-09-06 17:21", "url": "https://stocktwits.com/news-articles/markets/equity/asts-at-and-t-satellite-offering-next-year/cZZn4ASR7DU", "category": "contract", "importance": 4, "wl": false, "topic": "at&t 위성통신"}, {"title": "美 뉴욕 가는 길 넓어졌다…유나이티드항공, 인천~뉴어크 매일 운항", "summary": "유나이티드항공은 올해 2분기 기준 450대 이상의 항공기에 스타링크 기반 위성통신 와이파이를 도입했습니다. 연말까지 이를 약 1000대로 확대하고 내년 말까지 전 기단에 설치할 계획입니다. 프리미엄 항공 서비스 수요를 겨냥한 기단 개편과 초고속 인터넷 구축이 병행됩니다. 항공업계의 기내 위성인터넷 도입 경쟁이 가속화되고 있습니다.", "source": "newsis.com", "date": "2026-09-06 16:14", "url": "https://www.newsis.com/view/NISX20260906_0003778045", "category": "contract", "importance": 4, "wl": false, "topic": "스타링크 위성통신"}, {"title": "中·싱가포르 연구진 “ 스타링크 최신 단말기 해킹 성공” [차이나우]", "summary": "중국과 싱가포르 기반 사이버보안 연구진이 스페이스X의 위성 인터넷 서비스 스타링크 최신 사용자 단말기 해킹에 성공했다고 밝혔습니다. 이번 해킹을 통해 연구진은 관리자 권한을 확보했다고 주장했습니다. 저궤도 위성 통신망과 위성 단말기의 보안성에 대한 우려가 제기되고 있습니다. 글로벌 위성 인터넷 인프라의 보안 취약점 점검이 요구되는 상황입니다.", "source": "segye.com", "date": "2026-09-06 07:19", "url": "https://www.segye.com/newsView/20260904502034?OutUrl=naver", "category": "tech", "importance": 4, "wl": false, "topic": "스타링크 해킹"}, {"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 6G의 3가지 핵심 축으로 AI 네이티브 네트워크를 발표하며 통신 밸류체인 재편을 예고했다. 차세대 통신 기술 표준화 및 AI 융합 트렌드를 보여준다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g 네트워크"}, {"title": "SpaceX Just Launched AST SpaceMobile's Biggest Bet To Advance Cell Service From Space - st", "summary": "SpaceX가 우주 기반 세포 통신 서비스를 발전시키기 위해 AST SpaceMobile 관련 발사 임무를 진행했다. 저궤도 위성 통신 및 Direct-to-Cell 서비스 분야의 협력과 경쟁 구도를 보여준다. 위성 통신 시장의 확장세를 나타낸다.", "source": "stocktwits.com", "date": "2026-09-06 03:52", "url": "https://stocktwits.com/news-articles/markets/equity/spacex-launches-ast-spacemobile-biggest-satellites-cell-service-from-space/cZK0HS1R7IN", "category": "contract", "importance": 4, "wl": false, "topic": "spacex 스타링크 ast스페이스모바일"}, {"title": "Delta Picks Amazon Over Starlink for In-Flight Wi-Fi - MiGFlug", "summary": "델타항공이 기내 와이파이 제공을 위해 스타링크 대신 아마존의 위성 인터넷 서비스를 선택했다. 저궤도 위성 통신 시장에서 아마존과 스페이스X 간의 경쟁 구도를 보여주는 사례다.", "source": "MiGFlug", "date": "2026-09-05 20:56", "url": "https://migflug.com/afterburner/delta-picks-amazon-over-starlink-for-in-flight-wi-fi/", "category": "contract", "importance": 4, "wl": false, "topic": "델타항공 아마존 위성인터넷"}, {"title": "돌연 파리 우주정상회의 안 간다는 스페이스X‥이유는?", "summary": "스페이스X가 파리 우주정상회의에 불참하기로 결정했습니다. 마크롱 대통령은 지난해 미국 스타링크의 대안으로 유럽 합작 위성 기업에 1조 원을 투자한 바 있습니다. 유럽은 위성을 비유럽 지역에 의존하는 것을 경계하며 독자적인 우주 인프라 구축을 추진 중입니다. 미·유럽 간 위성 통신 패권을 둘러싼 긴장감이 고조되고 있습니다.", "source": "imnews.imbc.com", "date": "2026-09-05 20:21", "url": "https://imnews.imbc.com/replay/2026/nwdesk/article/6849839_37004.html", "category": "policy", "importance": 4, "wl": false, "topic": "스타링크 우주정상회의"}, {"title": "머스크, 스타링크 로 우크라 훈장...EU 속타는 이유는 [김기혁의 테슬라...", "summary": "러시아-우크라이나 전쟁 발발 이후 러시아군의 공세로 우크라이나의 지상 통신망이 파괴되었습니다. 이 위기 상황에서 스페이스X의 저궤도 위성 인터넷 서비스 스타링크가 핵심 통신망 역할을 수행했습니다. 일론 머스크는 스타링크 지원 공로로 우크라이나 훈장을 받았습니다. 유럽 국가들은 저궤도 위성 의존도 심화에 대한 복잡한 속내를 드러내고 있습니다.", "source": "sedaily.com", "date": "2026-09-05 20:01", "url": "https://www.sedaily.com/article/20087327?ref=naver", "category": "carrier", "importance": 4, "wl": false, "topic": "스타링크 우크라이나"}, {"title": "[아참마당] 저궤도 위성이 바꾸는 통신의 미래", "summary": "독자적인 6G 위성통신 기술과 생태계 확보의 중요성을 강조하며, 비면허 주파수까지 위성 직접연결이 확대되는 동향을 분석했다. 차세대 위성통신 전략이다.", "source": "cctoday.co.kr", "date": "2026-09-07 06:02", "url": "https://www.cctoday.co.kr/news/articleView.html?idxno=2236218", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 6g 통신 미래"}, {"title": "북한 '은밀한 영상' 찍던 그 회사…\"이젠 공간정보 플랫폼으로 진화\"", "summary": "위성 영상 분야가 공간정보 플랫폼으로 진화하고 있습니다. 벤터는 10기의 위성을 500㎞ 저궤도에 띄워 매일 대규모 지상을 촬영하고 있습니다. 30㎝급의 고해상도 시계열 자료 확보가 위성 산업의 핵심 경쟁력으로 꼽힙니다. 저궤도 위성을 활용한 지구 관측 역량이 한층 고도화되고 있습니다.", "source": "mt.co.kr", "date": "2026-09-07 05:00", "url": "https://www.mt.co.kr/future/2026/09/07/2026090217280253293", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성영상"}, {"title": "[서학!스타] 로켓랩(RKLB), 94번째 일렉트론 발사 성공…2026년 들어 15번...", "summary": "로켓랩이 94번째 일렉트론 발사에 성공하며 2026년 들어 15번째 발사 기록을 세웠습니다. 뉴질랜드 마히아 발사 복합단지에서 일본 신스펙티브의 최신 지구관측 위성을 저궤도에 투입했습니다. 이번 임무는 저궤도 위성 발사 시장에서 로켓랩의 신뢰성을 입증했습니다. 소형 발사체와 저궤도 위성 연계 사업이 활발히 진행 중입니다.", "source": "cbci.co.kr", "date": "2026-09-07 01:00", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=604366", "category": "tech", "importance": 3, "wl": false, "topic": "로켓랩 위성발사"}, {"title": "SpaceX Falcon 9 rocket launches 27 Starlink satellites, lands on ship at sea (video) - Yah", "summary": "SpaceX가 팰컨 9 로켓을 이용해 스타링크 위성들을 추가 발사하고 해상 착륙에 성공했다. 저궤도 위성 통신망 확장을 위한 지속적인 인프라 구축 활동이다.", "source": "Yahoo", "date": "2026-09-07 00:54", "url": "https://www.yahoo.com/news/science/articles/spacex-falcon-9-rocket-launches-155411399.html", "category": "tech", "importance": 3, "wl": false, "topic": "spacex 스타링크 로켓 발사"}, {"title": "추락하나했더니 ‘주가 재추진’…시총 2조달러 재입성한 스페이스X", "summary": "스페이스X가 시가총액 2조 달러를 재입성하며 글로벌 자본시장의 주목을 받고 있습니다. 기업 가치 산정 공식이 기존 로켓과 스타링크 중심에서 AI 영역으로 확대되고 있습니다. 오펜하이머는 스페이스X의 대규모 AI 컴퓨팅 능력 확충을 높게 평가했습니다. 위성통신과 AI의 결합이 기업 가치 급등을 견인하고 있습니다.", "source": "mk.co.kr", "date": "2026-09-06 21:43", "url": "https://www.mk.co.kr/article/12145621", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 스타링크"}, {"title": "Reinventing Business Internet from the Ground Up and the Sky Down - swxlocalsports.com", "summary": "지상과 하늘을 연결하는 비즈니스 인터넷 서비스의 혁신 방안을 다루고 있다. 차세대 네트워크 인프라 구축과 관련된 기술적 동향을 소개한다.", "source": "swxlocalsports.com", "date": "2026-09-06 17:22", "url": "https://www.swxlocalsports.com/online_features/tech_talk_and_innovation/reinventing-business-internet-from-the-ground-up-and-the-sky-down/article_044b6e08-cb29-5bcb-99cb-953f5a325d3e.html", "category": "tech", "importance": 3, "wl": false, "topic": "비즈니스 인터넷 혁신"}, {"title": "HBM·CXL 쏟아지자… 큐알티 신뢰성 평가 사업에 기회 커진다", "summary": "HBM과 CXL 시장 확대와 함께 큐알티의 신뢰성 평가 사업 기회가 커지고 있습니다. 저궤도 위성 시장의 성장이 새로운 부품 시험 수요를 창출하고 있습니다. 위성 발사 횟수 증가로 관련 전자장비 테스트 수요가 늘어나는 추세입니다. 국내 기업들이 해외 의존도를 낮추고 특화 시험 역량을 확보하고 있습니다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 15:46", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484275", "category": "other", "importance": 3, "wl": false, "topic": "큐알티 저궤도위성"}, {"title": "Spectrum Rocket Reaches Orbit From Andoya, Norway - srpske.rs", "summary": "노르웨이 안도야에서 발사된 스펙트럼 로켓이 궤도에 진입했다. 유럽 지역의 위성 발사 인프라 확충과 우주 진출 역량 강화를 보여준다.", "source": "srpske.rs", "date": "2026-09-06 15:10", "url": "https://srpske.rs/en/news/nauka/2026/09/06/isar-aerospace-spectrum-rocket-reaches-orbit-andoya", "category": "tech", "importance": 3, "wl": false, "topic": "노르웨이 로켓 궤도 진입"}, {"title": "독일 이자르, 유럽 본토 첫 상업 위성 발사 성공", "summary": "독일 이자르가 유럽 본토 첫 상업 위성 발사에 성공했습니다. 소형 위성과 위성군 발사가 늘어나면서 저궤도 내 우주교통 관리와 충돌 회피의 중요성이 대두되고 있습니다. 이번 발사는 유럽의 자체 발사체 접근성 확보 측면에서 의미 있는 성과입니다. 상업용 로켓 발사 시장의 경쟁 구도에 변화가 예상됩니다.", "source": "edaily.co.kr", "date": "2026-09-06 14:32", "url": "https://www.edaily.co.kr/News/Read?newsId=01633446645577496&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "tech", "importance": 3, "wl": false, "topic": "이자르 위성발사"}, {"title": "Keysight Technologies: Powering India’s 6G, AI and semiconductor ambitions - tele.net.in", "summary": "키사이트 테크놀로지스가 인도의 6G, AI 및 반도체 산업 육성을 지원하는 역할을 수행하고 있다. 차세대 통신 연구개발 및 인프라 구축 협력 사례다.", "source": "tele.net.in", "date": "2026-09-06 13:45", "url": "https://tele.net.in/companies/keysight-technologies-powering-indias-6g-ai-and-semiconductor-ambitions-12490603", "category": "tech", "importance": 3, "wl": false, "topic": "키사이트 6g ai 인도"}, {"title": "獨스타트업, 유럽서 첫 상업용 로켓 발사 성공…우주 자립 시동", "summary": "독일 스타트업 스펙트럼이 유럽에서 첫 상업용 로켓 발사에 성공하며 우주 자립을 선언했습니다. 양산 체제를 갖추면 저궤도로 민간 및 군사 위성을 실어 나르게 됩니다. 탑재 능력은 약 1톤이며 이자르는 뮌헨 공장에서 연간 30기 이상 생산이 가능하다고 밝혔습니다. 유럽 민간 우주 로켓 산업의 상업화가 본격 궤도에 올랐습니다.", "source": "news1.kr", "date": "2026-09-06 13:35", "url": "https://www.news1.kr/world/europe/6281311", "category": "tech", "importance": 3, "wl": false, "topic": "독일 스펙트럼 로켓"}, {"title": "ASTS Stock Rises Overnight: AST SpaceMobile And SpaceX Reportedly Chase Prized Satellite S", "summary": "AST SpaceMobile과 SpaceX의 위성 서비스 협력 기대감으로 주가가 상승했다. 위성 통신 및 저궤도 스펙트럼 확보 경쟁이 치열해지고 있음을 시사한다.", "source": "stocktwits.com", "date": "2026-09-06 10:38", "url": "https://stocktwits.com/news-articles/markets/equity/asts-spacex-reportedly-chase-prized-satellite-spectrum/cZYBgpkRJZH", "category": "other", "importance": 3, "wl": false, "topic": "ast스페이스모바일 주가 상승"}, {"title": "아마존, 머스크의 스타링크 본격 추격 - 미주조선일보", "summary": "아마존이 위성 인터넷 프로젝트를 통해 스페이스X의 스타링크를 본격적으로 추격하고 있다. 저궤도 위성 통신 시장에서의 양강 구도 형성과 경쟁 가속화를 보여준다.", "source": "미주조선일보", "date": "2026-09-06 06:38", "url": "https://chosundaily.com/bbs/board.php?bo_table=hotclick&wr_id=31520&sca=%EA%B2%BD%EC%A0%9C&spt=-31748&page=9", "category": "tech", "importance": 3, "wl": false, "topic": "아마존 스타링크 추격"}, {"title": "Private German rocket makes history, reaches orbit from European soil - Space", "summary": "독일의 민간 로켓이 유럽 본토에서 발사되어 최초로 궤도 진입에 성공했다. 우주 발사체 시장의 다변화와 위성 인프라 진입 장벽 완화를 의미한다.", "source": "Space", "date": "2026-09-06 05:51", "url": "https://www.space.com/space-exploration/launches-spacecraft/isar-aerospace-second-launch-norway-andoya-spaceport-spectrum-rocket", "category": "tech", "importance": 3, "wl": false, "topic": "독일 민간 로켓 궤도 진입"}, {"title": "저궤도 명당을 잡아라...우주도 '부동산 전쟁'", "summary": "전체 위성의 90％가 데이터 송수신이 빠른 고도 500∼1,000km 저궤도에 몰려 있습니다. 매일 같은 구역을 관측할 수 있는 태양동기궤도 등이 명당으로 꼽히며 우주 부동산 전쟁이 치열합니다. 거대 자본을 앞세운 기업들의 저궤도 선점 경쟁이 가속화되고 있습니다. 효율적인 궤도 활용이 위성 통신 사업의 핵심 요소로 자리 잡았습니다.", "source": "ytn.co.kr", "date": "2026-09-06 05:35", "url": "https://www.ytn.co.kr/_ln/0105_202609060535437991", "category": "other", "importance": 3, "wl": false, "topic": "저궤도 부동산전쟁"}, {"title": "LIG \"양자레이더, 새처럼 작게 탐지되는 스텔스기도 잡는다\"", "summary": "LIG가 보안성 검토를 거쳐 공개한 사업 현황에 따르면 양자레이더와 저궤도 위성 체계 개발이 진행 중입니다. 원자기반 항법용 양자 중력 센서와 은닉표적 탐지용 센서 개발이 포함되었습니다. KRISS 등과 협력하여 2030년대까지 관련 기술 확보에 나섭니다. 첨단 국방 기술과 저궤도 위성 인프라의 융합이 추진되고 있습니다.", "source": "zdnet.co.kr", "date": "2026-09-05 16:29", "url": "https://zdnet.co.kr/view/?no=20260905162848", "category": "tech", "importance": 3, "wl": false, "topic": "lig 양자레이더"}, {"title": "Jeff Bezos' Blue Origin Hires 47 Amazon Satellite Engineers To Build Rival TeraWave Networ", "summary": "제프 베이조스의 블루오리진이 아마존의 위성 엔지니어들을 대거 영입하여 테라웨이브 네트워크 구축에 나선다. 우주 통신 및 위성 네트워크 인프라 개발을 위한 인재 확보 경쟁을 보여준다.", "source": "International Business Times Australia", "date": "2026-09-05 16:00", "url": "https://www.ibtimes.com.au/blue-origin-engineers-amazon-leo-terawave-1875053", "category": "contract", "importance": 3, "wl": false, "topic": "블루오리진 아마존 엔지니어 영입"}, {"title": "테슬라-스페이스X 합병설 재부상...중국 생산망이 최대 걸림돌", "summary": "테슬라와 스페이스X의 합병설이 재부상했으나 중국 생산망이 최대 걸림돌로 지적되었습니다. 테슬라는 태양광 패널과 배터리를 공급하고 스페이스X는 스타링크와 그록 AI를 제공하는 시너지가 기대됩니다. 그러나 테슬라의 상하이 생산 거점이 글로벌 공급망에서 차지하는 비중이 변수입니다. 양사의 결합을 통한 미래 모빌리티와 우주통신 생태계 구축 가능성이 논의되고 있습니다.", "source": "digitaltoday.co.kr", "date": "2026-09-05 15:02", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=698509", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 테슬라"}, {"title":   {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
