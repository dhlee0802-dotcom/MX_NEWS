  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}

</style>
</head>

elations/us-china-tensions/china-s-huawei-heads-to-trial-in-us-over-sanctions-and-trade-secrets", "category": "policy", "importance": 5, "wl": false, "topic": "화웨이 미국 제재 영업비밀 재판"}, {"title": "Was Huawei’s rise built on crime? A US jury will decide", "summary": "중국 화웨이가 미국 법원에서 지식재산권 도용 및 금융 사기 혐의로 형사 재판을 받게 되었습니다. 멍완저우 부회장 석방 이후 5년 만에 회사 자체가 피고로 기소된 사안입니다. 검찰은 화웨이가 조직적으로 미국 기업의 지식재산권을 침해하고 대이란 제재를 위반했다고 주장했습니다. 재판 결과에 따라 화웨이에 대한 글로벌 제재 수위와 대외 신뢰도에 큰 타격이 예상됩니다.", "source": "Financial Times Tech", "date": "2026-09-06 21:00", "url": "https://www.ft.com/content/9422805f-519c-4b22-839c-cbd7a6464f07?syn-25a6b1a6=1", "category": "policy", "importance": 5, "wl": true, "topic": "화웨이 재판"}, {"title": "3つ折りスマホ「HUAWEI Mate XT 2」発表 のぞき見を防止、Kirin 9050 Pro×AIも搭載 約46万円から", "summary": "화웨이가 세계 최초로 3중 폴더블 스마트폰 신제품 'HUAWEI Mate XT 2 | ULTIMATE DESIGN'을 발표했습니다. 독자적인 칩셋과 3중 접이식 구조를 적용하여 시장에 본격 출시됩니다. 프리미엄 폴더블폰 시장에서의 기술적 혁신을 보여주는 사례입니다.", "source": "ITmedia Mobile", "date": "2026-09-08 00:16", "url": "https://www.itmedia.co.jp/mobile/articles/2609/08/news049.html", "category": "tech", "importance": 4, "wl": true, "topic": "화웨이 폴더블폰"}, {"title": "Huawei Kirin 9050 Pro Launches: LogicFolding Moves From Roadmap to Silicon - Tech Times", "summary": "화웨이의 차세대 프로세서인 기린 9050 프로가 로드맵 단계를 넘어 실제 실리콘 양산 단계에 진입했다. 첨단 반도체 칩 개발 및 제조 능력을 입증하는 성과다. 경쟁사의 반도체·부품 수급 역량을 보여준다.", "source": "Tech Times", "date": "2026-09-07 23:48", "url": "https://www.techtimes.com/articles/326836/20260907/huawei-kirin-9050-pro-launches-logicfolding-moves-roadmap-silicon.htm", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 기린 9050 프로 실리콘 양산"}, {"title": "Huawei unveils first major smartphone chip for six years - Telecoms", "summary": "화웨이가 수년 만에 주요 스마트폰용 자체 칩셋을 성공적으로 공개하며 독자 기술력 확보를 과시했다. 미국의 제재 속에서도 반도체 설계 역량을 유지하고 있음을 보여준다. 경쟁사의 핵심 기술력 진화 사례다.", "source": "Telecoms", "date": "2026-09-07 23:31", "url": "https://www.telecoms.com/mobile-devices/huawei-unveils-first-major-smartphone-chip-for-six-years", "categor rconnects-for-ai-computing.html", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 npo 광인터커넥트"}, {"title": "Huawei's SingleRAN rebuilds radio software for AI - Telecoms", "summary": "화웨이가 인공지능 시대에 맞춰 무선 네트워크 소프트웨어를 재구축하는 싱글랜(SingleRAN) 기술 전략을 공개했다. AI 연동성을 높여 무선 장비의 효율을 극대화하려는 시도다. 경쟁사의 핵심 기술 고도화 동향이다.", "source": "Telecoms", "date": "2026-09-07 22:48", "url": "https://www.telecoms.com/telecoms-infrastructure/huawei-s-singleran-rebuilds-radio-software-for-ai", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 싱글랜 ai 무선 소프트웨어 재구축"}, {"title": "Butterfly monitoring with AI and 5G networks - Ericsson", "summary": "에릭슨이 인공지능(AI)과 5G 네트워크를 활용한 나비 모니터링 솔루션 및 기술 적용 사례를 소개했다. 차세대 통신 인프라의 산업별 융합 가능성을 보여주는 기술 동향이다. 네트워크 장비 업계의 활용 범위를 넓히는 사례로 참고할 만하다.", "source": "Ericsson", "date": "2026-09-07 21:01", "url": "https://www.ericsson.com/en/cases/2026/butterfly-monitoring-biodiversity-insights", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 ai 5g 나비 모니터링"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - SDxCentral", "summary": "라쿠텐 심포니의 클라우드 RAN 기술이 타발의 다중 사업자 실내 공유 네트워크 구축 프로젝트에 핵심 동력을 제공했다. 가상화 기반 오픈랜 솔루션의 상용화 확대를 보여준다. 경쟁사의 솔루션 수출 성과다.", "source": "SDxCentral", "date": "2026-09-07 20:37", "url": "https://www.sdxcentral.com/news/rakuten-symphony-cloud-ran-tech-powers-tawals-multi-operator-indoor-network/", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐 심포니 타발 실내 네트워크 구축"}, {"title": "Malaysia considers Huawei's Ascend 910C processors for a RM2 billion national AI program -", "summary": "말레이시아가 국가 AI 프로그램을 위해 화웨이의 어센드 910C 프로세서 도입을 검토하고 있다. 대규모 국가 AI 인프라 사업에서 중국산 칩셋 활용 여부가 주목된다. 통신 및 컴퓨팅 인프라 분야의 지정학적 공급망 이슈다.", "source": "Global Sources", "date": "2026-09-07 19:23", "url": "https://www.globalsources.com/sourcing-digest/malaysia-evaluates-huawei-ascend-910c-chips-for-a-landmark-sovereign-ai-initiative/?source=GSOLHP_SKC_2", "category": "contract", "importance": 3, "wl":   const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
