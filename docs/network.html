  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .imp.i4{background:var(--crit-bg);color:var(--crit)}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}

  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}

</style>

: 3, "wl": true, "topic": "소프트뱅크 성층권 엣지컴퓨팅 실험"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - Fierce Network", "summary": "스페인 마스오렌지가 에릭슨과 협력하여 6GHz 대역 스펙트럼 테스트를 진행했다. 이는 미래 6G 상용화를 위한 초기 단계의 기술 검증 작업이다. 양사는 차세대 이동통신 주파수 활용 가능성을 타진하며 6G 주도권 확보를 꾀하고 있다.", "source": "Fierce Network", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 3, "wl": false, "topic": "마스오렌지 에릭슨 6ghz 스펙트럼 테스트"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤과 에릭슨은 독일 함부르크의 알텐베르더 컨테이너 터미널에 프라이빗 5G 네트워크를 구축했다. 이는 산업용 5G가 현장에서 어떻게 활용될 수 있는지를 보여주는 7년간의 셀룰러 실험의 최신 성과다. 장비 공급사인 에릭슨의 산업용 프라이빗 네트워크 시장 공략을 보여준다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 3, "wl": true, "topic": "에릭슨 프라이빗5g"}, {"title": "Spain’s MásOrange signals a next step in the 6G story - telecomtv.com", "summary": "스페인의 마스오렌지가 6G 시대를 향한 다음 단계로 6GHz 주파수 대역 테스트를 수행했다. 향후 차세대 통신 표준 준비를 위한 네트워크 인프라 검증의 일환이다. 통신사의 기술 진화 방향성을 보여주는 사례다.", "source": "telecomtv.com", "date": "2026-09-04 23:32", "url": "https://www.telecomtv.com/content/6g/spain-s-m-sorange-signals-a-next-step-in-the-6g-story-56174/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "마스오렌지 6g 준비 차원 스펙트럼 테스트"}, {"title": "BSNL's homegrown 4G network carries 6 PB data per day: C-DoT - The Economic Times", "summary": "인도 국영 C-DoT가 개발한 자국산 4G 네트워크(BSNL 공급)가 하루에 6 PB(페타바이트)의 데이터를 처리하고 있습니다. 인도의 통신 장비 국산화 정책(Make in India)과 토종 장비의 실질적 트래픽 처리 성과를 보여줍니다. 인도 통신 시장의 자립화 동향을 나타냅니다.", "source": "The Economic Times", "date": "2026-09-04 23:32", "url": "https://economictimes.indiatimes.com/industry/telecom/telecom-news/bsnls-homegrown-4g-network-carries-6-pb-data-per-day-c-dot/articleshow/133767038.cms", "category": "tech", "importance": 3, "wl": false, "topic": "c-dot 기술"}, {"title": "Huawei latest SingleRAN 22.1 launch targets the Agentverse - Total Telecom", "summary": "화웨이가 최신 무선 접속 네트워크 솔루션인 'SingleRAN 22.1'을 출시하며 에이전트버스(Agentverse) 환경 공략에 나섰다. AI 에이전트와 연동하여 네트워크 자율 운영 효율성을 극대화하는 것이 특징이다. 화웨이의 차세대 무선 장비 기술력 과시다.", "source": "Total Telecom", "date": "2026-09-04 22:16", "url": "https://totaltele.com/huawei-latest-singleran-22-1-launch-targets-the-agentverse/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 싱글ran 22.1 에이전트버스 타겟 출시"}, {"title": "All types of Chinese businesses using Huawei tech solutions: Report - Huawei Central", "summary": "보고서에 따르면 중국 내 다양한 업종의 기업들이 디지털 인프라 구축을 위해 화웨이의 기술 솔루션을 광범위하게 채택하고 있다. 내수 시장에서 화웨이의 엔터프라이즈 사업 입지가 더욱 탄탄해지고 있음을 보여준다. 경쟁사의 실적 및 사업 확장 동향이다.", "source": "Huawei Central", "date": "2026-09-04 21:14", "url": "https://www.huaweicentral.com/all-types-of-chinese-businesses-using-huawei-tech-solutions-report/", "category": "earnings", "importance": 3, "wl": false, "topic": "중국 기업 전방위 화웨이 기술 솔루션 활용"}, {"title": "딥시크, 내몽골 1GW 데이터센터에 ' 화웨이 칩 16만개' 투입 추진", "summary": "중국 인공지능(AI) 스타트업 딥시크가 자국 통신장비 ·반도체 기업 화웨이 의 AI 가속기 도입을 추진하며 대규모 컴퓨팅 거점 구축에 속도를 내고 있다. 4일(현지시간) 블룸버그 통신 에 따르면 딥시크는 내몽골 자치구에...", "source": "joseilbo.com", "date": "2026-09-04 21:13", "url": "http://www.joseilbo.com/news/news_read.php?uid=575124&class=78&grp=", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Huawei Earthquake early alerts feature reaches over 100 million users - Huawei Central", "summary": "화웨이 스마트폰 및 기기에 탑재된 지진 조기 경보 기능의 활성 사용자가 1억 명을 돌파했다. 통신 네트워크와 센서를 연동하여 재난 발생 시 신속하게 경고를 전달하는 공공 안전 기능이다. 화웨이 기술 생태계의 사용자 규모 확대를 보여준다.", "source": "Huawei Central", "date": "2026-09-04 20:04", "url": "https://www.huaweicentral.com/huawei-earthquake-alerts-100-million-users/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 지진 조기 경보 1억 사용자 돌파"}, {"title": "AI-RAN Business Case 2026: Can AI Cut Mobile Network Costs and Double Spectrum Capacity? -", "summary": "2026년 AI-RAN 비즈니스 모델을 통해 모바일 네트워크 비용을 절감하고 스펙트럼 용량을 두 배로 늘릴 수 있는지에 대한 분석이 제기됐다. 인공지능 도입이 통신 사업자의 CAPEX 및 OPEX를 낮추는 핵심 수단으로 주목받고 있다. 차세대 장비 시장의 핵심 트렌드를 보여준다.", "source": "TelecomLead", "date": "2026-09-04 19:44", "url": "https://telecomlead.com/telecom-services/ai-ran-business-case-2026-can-ai-cut-mobile-network-costs-and-double-spectrum-capacity-127608", "category": "tech", "importance": 3, "wl": false, "topic": "ai-ran 비즈니스 케이스 비용 절감 분석"}, {"title": "Nokia's Index Comeback Collides With a Pivotal Quarter of Promises and Setbacks - AD HOC N", "summary": "노키아의 지수 복귀에 따른 주가 반등세가 중요한 분기점과 맞물려 실적 약속과 차질 사이에서 시험대에 올랐다. 향후 실적 발표와 사업 성과가 주가 유지의 핵심 변수로 작용할 전망이다. 경쟁사의 재무 및 시장 평가 동향이다.", "source": "AD HOC NEWS", "date": "2026-09-04 18:11", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/nokia-s-index-comeback-collides-with-a-pivotal-quarter-of-promises-and/70053646", "category": "earnings", "importance": 3, "wl": false, "topic": "노키아 주가 반등과 실적 갈림길"}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - Mobile Europe", "summary": "노키아가 사우디아라비아에 인공지능 중심의 연구개발(R&D) 센터를 신설했다. 중동 지역에서 AI 기반 네트워크 기술 개발을 가속화하기 위한 거점 마련이다. 글로벌 장비 업체의 지역별 R&D 투자 전략을 보여준다.", "source": "Mobile Europe", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 ai 집중 r&d 센터 신설"}, {"title": "Maxis strengthens its nationwide network infrastructure with Nokia’s optical transport tec", "summary": "맥시스가 노키아의 광전송 기술을 채택하여 전국적인 네트워크 인프라를 한층 강화했다. 데이터 트래픽 증가에 대응하기 위한 인프라 고도화 작업이다. 노키아의 장비 공급 성과를 나타낸다.", "source": "telecomtv.com", "date": "2026-09-04 17:09", "url": "https://www.telecomtv.com/content/nokia/maxis-strengthens-its-nationwide-network-infrastructure-with-nokia-s-optical-transport-technology-56172/", "category": "contract", "importance": 3, "wl": false, "topic": "맥시스 노키아 광전송 장비 전국망 강화"}, {"title": "Nokia Ind ory": "policy", "importance": 4, "wl": false, "topic": "t모바일 엘리엇 압박 합병 논쟁 재점화"}, {"title": "Global Telecom Capex Ranking 2026: AT&T, Deutsche Telekom, China Mobile, NTT and Verizon L", "summary": "AT&T, 도이치텔레콤, 차이나모바일, NTT, 버라이즌 등 전 세계 주요 통신사들의 2026년 글로벌 설비투자(CAPEX) 순위와 투자 규모가 공개되었다. 통신사들의 투자는 전 세계 네트워크 장비 시장의 수요를 결정짓는 핵심 지표다. 글로벌 통신 인프라 투자 흐름을 보여주는 대형 지표다.", "source": "TelecomLead", "date": "2026-09-03 22:48", "url": "https://telecomlead.com/5g/global-telecom-capex-ranking-2026-att-deutsche-telekom-china-mobile-ntt-and-verizon-lead-network-investment-127592", "category": "earnings", "importance": 4, "wl": false, "topic": "글로벌 통신사 2026년 캡엑스 순위"}, {"title": "Elliott bursts into Deutsche Telekom and opposes the merger with T-Mobile US - Demócrata", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤 지분을 대거 인수하며 경영에 개입해 T모바일 US와의 합병에 반대하고 나섰다. 대형 통신사의 지배구조와 미주 사업 전략에 큰 파장을 일으킬 수 있는 중대 사안이다. 글로벌 통신 시장의 M&A 구도에 영향을 미칠 전망이다.", "source": "Demócrata", "date": "2026-09-03 19:00", "url": "https://www.democrata.es/en/economy/elliott-bursts-into-deutsche-telekom-and-opposes-the-merger-with-t-mobile-us/", "category": "other", "importance": 4, "wl": false, "topic": "도이치텔레콤 엘리엇"}, {"title": "[기획] 통신3사, AIDC 수조원대 투자 - 소년한국일보", "summary": "통신 3사가 AI 데이터센터(AIDC) 인프라 구축을 위해 수조 원대 규모의 투자를 단행하고 있다. AI 수요 급증에 대응하기 위한 통신사들의 핵심 인프라 투자 방향을 보여준다.", "source": "소년한국일보", "date": "2026-09-05 14:57", "url": "https://www.kfenews.co.kr/news/articleViewAmp.html?idxno=663915", "category": "other", "importance": 3, "wl": false, "topic": "통신3사 ai 데이터센터"}, {"title": "[뉴스+]SKT는 '수요'·KT는 '이음'·카카오는 '편리'…'모두의 AI' 3色 경쟁 본격화 - 비즈니스플러스", "summary": "SKT의 '수요', KT의 '이음' 등 국내 통신사들이 모두의 AI 개발을 위한 3색 경쟁에 본격 돌입했다. 통신사들의 AI 원천 기술 확보 및 서비스 다각화 전략을 다룬다.", "source": "비즈니스플러스", "date": "2026-09-05 13:57", "url": "https://www.businessplus.kr/news/articleView.html?idxno=116431", "category": "other", "importance": 3, "wl": false, "topic": "skt ai 개발"}, {"title": "[단독] '모두의 AI' 카카오·SKT·KT, 운영비로 100억씩 받는다 - 머니투데이 - mt.co.kr", "summary": "정부의 모두 ce": "AD HOC NEWS", "date": "2026-09-05 01:54", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/t-mobile-us-stock-falls-on-cfo-transition-while-guidance-stays-strong/70055780", "category": "earnings", "importance": 3, "wl": false, "topic": "t모바일 us cfo 교체 가이드라인 유지"}, {"title": "Telekom stock falls after Elliott rally as OTE rebrands in Greece - AD HOC NEWS", "summary": "엘리엇 관련 호재로 상승했던 도이치텔레콤 주가가 하락세를 보인 가운데 자회사 OTE가 그리스에서 리브랜딩을 단행했다. 통신사의 브랜드 개편과 지주사 차원의 주가 변동성이 맞물려 진행되고 있다.", "source": "AD HOC NEWS", "date": "2026-09-05 01:32", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/telekom-stock-falls-after-elliott-rally-as-ote-rebrands-in-greece/70055659", "category": "other", "importance": 3, "wl": false, "topic": "도이치텔레콤 주가"}, {"title": "Jio’s self-reliance push rewires the Telugu states - Communications Today", "summary": "Reliance Jio의 자립화 및 기술 내재화 추진 전략이 텔루구어 지역의 통신 환경을 재편하고 있습니다. 현지 맞춤형 인프라 확충과 디지털 서비스 보급을 통해 시장 지배력을 강화하고 있습니다.", "source": "Communications Today", "date": "2026-09-05 01:17", "url": "https://www.communicationstoday.co.in/jios-self-reliance-push-rewires-the-telugu-states/", "category": "strategy", "importance": 3, "wl": false, "topic": "릴라이언스지오 전략"}, {"title": "T-Mobile hands CFO reins to ex-Shell exec Jessica Uhl, as Osvaldik retires", "summary": "미국 이동통신사 티모바일(T-Mobile)은 피터 오스발딕 최고재무책임자(CFO)가 퇴임함에 따라 전 셸(Shell) 임원인 제시카 울을 신임 CFO로 임명한다고 밝혔다. 제시카 울은 내년 2월에 취임하며, 오스발딕은 2027년 7월 공식 은퇴 전까지 전략 고문으로 활동할 예정이다. 이번 최고재무책임자 교체는 통신사의 안정적인 재무 전략 유지와 리더십 변화를 보여주는 주요 임원 인사다. 티모바일의 재무 책임자 변경은 향후 통신 인프라 투자 및 경영 전략에 영향을 미칠 수 있다.", "source": "Light Reading", "date": "2026-09-05 01:12", "url": "https://www.lightreading.com/business-transformation/t-mobile-hands-cfo-reins-to-ex-shell-exec-jessica-uhl-as-osvaldik-retires", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 인사"}, {"title": "LS일렉트릭, KT클라우드와 AI 데이터센터 인프라 공급·개발 맞손 - koreasprint.com", "summary": "LS일렉트릭이 KT클라우드와 손잡고 AI 데이터센터 인프라 공급 및 개발에 나선다. AI 데이터센터 인프라 확장을 위한 통신 자회 let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
