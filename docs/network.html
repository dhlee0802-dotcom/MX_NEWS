<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}

  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}

  .imp.i1{background:var(--low-bg);color:var(--low)}

  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>

ink? Japan’s $1 Billion BlueBird Play Makes ASTS the National Satellite OS - Y", "summary": "일본에서 1억 달러 규모의 블루버드 프로젝트가 추진되며 AST 스페이스모바일이 국가 위성 통신 파트너로 부상했다. 스타링크에 대항하는 새로운 위성 통신 축으로 주목받고 있다. 글로벌 시장에서 위성 통신 영토를 확장하는 계기가 됐다.", "source": "Yahoo Finance", "date": "2026-09-06 23:25", "url": "https://finance.yahoo.com/markets/stocks/articles/forget-starlink-japan-1-billion-142530511.html", "category": "contract", "importance": 4, "wl": false, "topic": "에스티에스페이스모바일 위성"}, {"title": "추락하나했더니 ‘주가 재추진’…시총 2조달러 재입성한 스페이스X", "summary": "스페이스X의 기업 가치가 로켓 중심에서 위성통신과 AI를 결합한 형태로 확장되며 시총 2조 달러에 재입성했다. 자본시장은 스타링크의 성장과 함께 AI 컴퓨팅 능력 확대에 주목하고 있다. 우주항공과 통신, AI 기술의 융합이 기업 가치를 견인하고 있다.", "source": "mk.co.kr", "date": "2026-09-06 21:43", "url": "https://www.mk.co.kr/article/12145621", "category": "other", "importance": 4, "wl": false, "topic": "스페이스x 기업가치"}, {"title": "두 달 전 투자한 스페이스X 주식 10,000달러, 현재 가치 확인해보니", "summary": "스페이스X의 스타링크 가입자 수가 1200만 명을 돌파하고 스타실드 정부 계약 및 AI 부문 매출이 성장을 견인하고 있다. 우주 기반 통신 서비스와 방산 계약의 확대가 재무적 성과로 이어지고 있다. 장기 컴퓨팅 수요에 대응한 인프라 확장이 진행 중이다.", "source": "coinreaders.com", "date": "2026-09-06 07:50", "url": "http://coinreaders.com/256743", "category": "other", "importance": 4, "wl": false, "topic": "스타링크 가입자매출"}, {"title": "中·싱가포르 연구진 “ 스타링크 최신 단말기 해킹 성공” [차이나우]", "summary": "중국과 싱가포르의 사이버보안 연구진이 스타링크의 최신 사용자 단말기를 해킹해 관리자 권한을 확보했다고 밝혔다. 이번 취약점 분석으로 위성과 지상 단말 간 보안 이슈가 제기되었다. 위성 인터넷 시스템의 보안성 검증과 대책 마련이 요구된다.", "source": "segye.com", "date": "2026-09-06 07:19", "url": "https://www.segye.com/newsView/20260904502034?OutUrl=naver", "category": "tech", "importance": 4, "wl": false, "topic": "스타링크 단말기해킹"}, {"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 통신 밸류체인을 재편할 AI 네이티브 네트워크 등 6G의 3대 축을 발표했다. 차세대 통신 표준과 인공지능이 결합된 네트워크 청사진을 제시했다. 6G 기술 개발 및 연구 방향을 가늠할 수 있는 중요 발표다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g"}, {"title": "Delta Picks Amazon Over Starlink for In-Flight Wi-Fi - migflug.com", "summary": "델타항공이 기내 와이파이 제공을 위해 스타링크 대신 아마존(카이퍼)을 선택했다. 위성 기반 기내 통신 서비스 시장에서 아마존이 주요 고객을 확보하며 경쟁 구도에 변화를 주고 있다. 저궤도 위성 통신을 둘러싼 기업 간 수주 다툼의 결과다.", "source": "migflug.com", "date": "2026-09-05 20:56", "url": "https://migflug.com/afterburner/delta-picks-amazon-over-starlink-for-in-flight-wi-fi/", "category": "contract", "importance": 4, "wl": false, "topic": "아마존 위성"}, {"title": "\"지구-달 사이에 30기 큐브샛 띄운다\"… 中, 5개국 규합 '3D 위성 관측망...", "summary": "중국이 5개국과 규합해 지구와 달 사이를 잇는 30기 규모의 3D 초소형 위성 관측망 네트워크 프로젝트를 출범시켰다. 저궤도부터 심우주까지 우주 영역 확장을 위한 다국적 협력이 추진된다. 미래 우주 활동을 위한 위성 인프라 구축 경쟁의 일환이다.", "source": "g-enews.com", "date": "2026-09-07 06:36", "url": "https://www.g-enews.com/view.php?ud=2026090700302241120c8c1c064d_1", "category": "tech", "importance": 3, "wl": false, "topic": "중국 초소형위성망"}, {"title": "[아참마당] 저궤도 위성이 바꾸는 통신의 미래", "summary": "독자적인 6G 위성통신 기술과 산업 생태계 확보의 중요성을 강조했다. 특히 이동통신 주파수를 넘어 비면허 주파수까지 위성 직접연결 영역이 확대되는 트렌드를 면밀히 살펴야 한다고 제언했다.", "source": "cctoday.co.kr", "date": "2026-09-07 06:02", "url": "https://www.cctoday.co.kr/news/articleView.html?idxno=2236218", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 6g"}, {"title": "북한 '은밀한 영상' 찍던 그 회사…\"이젠 공간정보 플랫폼으로 진화\"", "summary": "벤터가 10기의 위성을 저궤도에 띄워 고해상도 시계열 공간정보 플랫폼을 구축하고 있다. 매일 대규모 지상을 촬영하여 정밀한 관측 데이터를 제공하는 방식이다. 저궤도 위성 활용 분야가 다방면으로 확장되고 있다.", "source": "mt.co.kr", "date": "2026-09-07 05:00", "url": "https://www.mt.co.kr/future/2026/09/07/2026090217280253293", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성플랫폼"}, {"title": "[서학!스타] 로켓랩(RKLB), 94번째 일렉트론 발사 성공…2026년 들어 15번...", "summary": "로켓랩이 일렉트론 로켓 발사에 성공하며 일본 신스펙티브의 지구관측 위성을 저궤도에 투입했다. 올해 다수의 발사 임무를 성공적으로 수행하며 소형 위성 발사 시장에서 입지를 다지고 있다. 민간 우주 기업의 발사 서비스 경쟁력을 보여준다.", "source": "cbci.co.kr", "date": "2026-09-07 01:00", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=604366", "category": "contract", "importance": 3, "wl": false, "topic": "로켓랩 위성발사"}, {"title": "SpaceX Falcon 9 rocket launches 27 Starlink satellites, lands on ship at sea (video) - Yah", "summary": "스페이스X가 팰컨 9 로켓을 통해 스타링크 위성 27기를 성공적으로 발사하고 해상 착륙시켰다. 위성 통신망 확장을 위한 지속적인 인프라 구축 작업의 일환이다. 저궤도 위성 발사 역량을 꾸준히 입증하고 있다.", "source": "Yahoo", "date": "2026-09-07 00:54", "url": "https://www.yahoo.com/news/science/articles/spacex-falcon-9-rocket-launches-155411399.html", "category": "tech", "importance": 3, "wl": false, "topic": "스페이스x 위성"}, {"title": "[김대호 진단] 반도체 열전 (51) 아마존... AWS 클라우드 혁명의 비밀", "summary": "아마존의 카이퍼 프로젝트는 3200개 이상의 저궤도 인공위성을 통해 전 지구를 초고속 인터넷망으로 덮는 계획이다. 일론 머스크의 스타링크와 정면 승부를 예고하며 우주 인터넷 시장의 경쟁을 심화시키고 있다. 단순 오지 인터넷을 넘어 다양한 위성 통신 서비스를 지향한다.", "source": "g-enews.com", "date": "2026-09-07 00:00", "url": "https://www.g-enews.com/view.php?ud=202609040949484704906806b77b_1", "category": "tech", "importance": 3, "wl": false, "topic": "카이퍼 위성인터넷"}, {"title": "美 뉴욕 가는 길 넓어졌다…유나이티드항공, 인천~뉴어크 매일 운항", "summary": "유나이티드항공은 450대 이상의 항공기에 스타링크 기반 위성통신 와이파이를 도입했다고 밝혔다. 연말까지 1000대로 확대하고 내년 말까지 전 기단에 구축할 계획이다. 기내 초고속 인터넷 서비스를 통한 승객 서비스 경쟁이 가속화되고 있다.", "source": "newsis.com", "date": "2026-09-06 16:14", "url": "https://www.newsis.com/view/NISX20260906_0003778045", "category": "contract", "importance": 3, "wl": false, "topic": "스타링크 항공기적용"}, {"title": "Spectrum Rocket Reaches Orbit From Andoya, Norway - srpske.rs", "summary": "노르웨이 안되야 발사장에서 스펙트럼 로켓이 궤도 진입에 성공했다. 유럽 본토에서 발사된 민간 로켓의 첫 궤도 진입 기록이다. 우주 산업 및 발사체 기술의 진전을 나타낸다.", "source": "srpske.rs", "date": "2026-09-06 15:10", "url": "https://srpske.rs/en/news/nauka/2026/09/06/isar-aerospace-spectrum-rocket-reaches-orbit-andoya", "category": "tech", "importance": 3, "wl": false, "topic": "유럽 로켓"}, {"title": "독일 이자르, 유럽 본토 첫 상업 위성 발사 성공", "summary": "독일 이자르가 유럽 본토에서 첫 상업용 소형 위성 발사에 성공했다. 소형 위성 및 위성군 발사 증가로 저궤도의 우주교통 관리와 충돌 회피의 중요성이 커지고 있다. 유럽의 독자적 발사체 접근성 확보를 위한 진전이다.", "source": "edaily.co.kr", "date": "2026-09-06 14:32", "url": "https://www.e .", "source": "wikitree.co.kr", "date": "2026-09-06 00:32", "url": "https://www.wikitree.co.kr/articles/1157497", "category": "other", "importance": 2, "wl": false, "topic": "스타링크 기술발전"}, {"title": "머스크, 스타링크로 우크라 훈장...EU 속타는 이유는 [김기혁의 테슬라월드] - 서울경제", "summary": "일론 머스크의 스타링크가 우크라이나 지원 등으로 주목받는 가운데 유럽연합(EU)의 위성 통신 독자 구축 속도가 타격을 받는 상황을 다뤘다. 위성 통신 패권을 둘러싼 지정학적 고민을 보여준다.", "source": "서울경제", "date": "2026-09-05 20:00", "url": "https://m.sedaily.com/amparticle/20087327", "category": "other", "importance": 2, "wl": false, "topic": "스타링크 우크라이나"}], "competitor": [{"title": "화웨이 , 美 법정서 ‘성장 과정 불법성’ 가린다", "summary": "중국 통신장비 업체 화웨이가 미국에서 대형 형사재판의 심판대에 올랐다. 영업비밀 탈취 및 이란·북한 제재 우회 등 20년에 걸친 성장 과정의 불법성 여부가 다뤄진다. 미국 검찰과 화웨이 간의 치열한 법적 공방이 예상된다.", "source": "g-enews.com", "date": "2026-09-07 04:02", "url": "https://www.g-enews.com/view.php?ud=2026090623002345259a1f309431_1", "category": "policy", "importance": 5, "wl": false, "topic": "화웨이 미국재판"}, {"title": "Was Huawei’s rise built on crime? A Brooklyn jury will decide", "summary": "화웨이 전 재무이사 멍완저우가 캐나다에서 석방된 지 5년 만에 화웨이 본사에 대한 공식적인 형사 재판이 브루클린 배심원단 앞에서 시작될 예정입니다. 이번 재판은 과거 화웨이의 급성장 과정에서 제기된 범죄 혐의와 불법 행위 의혹을 본격적으로 다루는 중대한 사법 절차입니다. 글로벌 통신장비 시장을 주도해 온 화웨이의 기업 이미지와 경영 전략에 큰 타격이 될 수 있는 사안입니다. 통신장비 업계 전반의 컴플라이언스 및 지정학적 리스크를 가늠할 핵심 이벤트로 주목받고 있습니다.", "source": "Financial Times Tech", "date": "2026-09-06 21:00", "url": "https://www.ft.com/content/9422805f-519c-4b22-839c-cbd7a6464f07?syn-25a6b1a6=1", "category": "exec", "importance": 4, "wl": true, "topic": "화웨이 재판"}, {"title": "‘관세 폭탄’ 美에 등 돌린 加, 中과 8년 만에 군사 교류", "summary": "과거 화웨이 창업자 딸 체포 사건으로 악화되었던 캐나다와 중국의 관계가 최근 국방 대화 재개 등으로 변화하고 있다. 캐나다 총리의 취임 이후 양국 간 군사 교류 및 협력 강화 움직임이 나타났다. 미중 갈등 속에서 캐나다의 외교적 행보가 주목받고 있다.", "source": "kmib.co.kr", "date": "2026-09-06 18:38", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000009486&cp=nv", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 캐나다관계"}, {"title": "통신 장비 주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게", "summary": "통신 장비 시장에서 3G부터 5G까지 선도업체로의 매출 쏠림 현상이 반복되고 있음을 진단했다. 특히 엔비디아가 AI 기지국(AI-RAN) 시장으로 사업 영역을 넓히는 트렌드가 장비 업계에 미치는 파장을 분석했다. 차세대 네트워크 장비 시장의 경쟁 구도를 보여준다.", "source": "metroseoul.co.kr", "date": "2026-09-06 09:44", "url": "http://www.metroseoul.co.kr/article/20260906500019", "category": "other", "importance": 4, "wl": false, "topic": "엔비디아 ai 기지국"}, {"title": "Maxis Deploys Nokia Optical Transport Technology To Boost AI And Enterprise Network Capaci", "summary": "말레이시아 통신사 막시스가 인공지능(AI) 및 기업용 네트워크 용량을 대폭 강화하기 위해 노키아의 광전송 기술(Optical Transport Technology)을 도입하기로 했습니다. 급증하는 데이터 트래픽과 AI 연산 수요를 수용하기 위한 핵심 인프라 구축으로 노키아의 장비 공급 역량을 보여주는 대형 계약입니다.", "source": "Pokde.Net", "date": "2026-09-06 05:55", "url": "https://pokde.net/system/service/telco-isp/maxis-deploys-nokia-optical-transport-technology", "category": "contract", "importance": 4, "wl": false, "topic": "막시스 노키아 수주"}, {"title": "[글로벌 포커스] 수에즈 품은 이집트, 미·중 'AI 패권 전쟁'의 새로운 ...", "summary": "중국 통신장비 업체 화웨이가 이집트에 두 개의 컴퓨팅 클러스터를 구축하기 위한 입찰 제안서를 제출했다. AI 모델 훈련용 최신 인프라를 포함한 선제적 공세에 나섰다. 미중 AI 패권 전쟁 속에서 아프리카 지역 장비 수주 경쟁이 심화되고 있다.", "source": "newsian.co.kr", "date": "2026-09-05 06:50", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=94828", "category": "contract", "importance": 4, "wl": false, "topic": "화웨이 이집트입찰"}, {"title": "Huawei Trial Draws Investor Attention To Key Telecom Network Suppliers - londoninsider.co.", "summary": "화웨이에 대한 사법 리스크와 재판 진행이 본격화되면서 글로벌 투자자들의 관심이 에릭슨, 노키아 등 핵심 통신 네트워크 장비 공급업체들의 반사이익 여부로 쏠리고 있습니다. 글로벌 통신장비 시장의 공급망 재편 가능성을 시사하는 분석입니다.", "source": "londoninsider.co.uk", "date": "2026-09-07 06:26", "url": "https://londoninsider.co.uk/huawei-trial-draws-investor-attention-to-key-telecom-network-suppliers/", "category": "exec", "importance": 3, "wl": false, "topic": "화웨이재판 통신장비주"}, {"title": "3 Telecom Stocks Investors May Watch As Huawei Trial Puts Network Suppliers In Focus - sim", "summary": "화웨이에 대한 본격적인 형사 재판이 시작되면서 글로벌 투자자들의 시선이 주요 통신 네트워크 장비 공급업체들로 향하고 있습니다. 지정학적 리스크와 경쟁 구도 변화 속에서 에릭슨, 노키아 등 경쟁사들의 수혜 여부와 시장 판도에 미칠 파장에 관심이 집중됩니다.", "source": "simplywall.st", "date": "2026-09-07 05:30", "url": "https://simplywall.st/stocks/us/tech/nyse-bdc/belden/news/3-telecom-stocks-investors-may-watch-as-huawei-trial-puts-ne/amp", "category": "other", "importance": 3, "wl": false, "topic": "통신장비주 화웨이재판"}, {"title": "마이크론, YMTC 특허 7번째 무효 판단 받았다...쟁점특허 27건", "summary": "미국 마이크론이 중국 YMTC를 상대로 제기된 메모리 반도체 특허 침해 소송에서 방어전을 치르고 있습니다. YMTC가 제기한 총 27건의 쟁점 특허 중 마이크론이 미국 특허심판원(PTAB)에 무효 심판을 청구한 가운데, YMTC가 마이크론의 특허를 무효화시키는 등 치열한 법적 공방이 이어지고 있습니다. 글로벌 반도체 기업 간의 특허 분쟁 동향으로 경쟁사 및 반도체 업계 소식에 해당합니다.", "source": "ZDNet Korea", "date": "2026-09-06 19:44", "url": "https://zdnet.co.kr/view/?no=20260906193737", "category": "other", "importance": 3, "wl": true, "topic": "마이크론 ymtc 특허분쟁"}, {"title": "Nokia, Ericsson, IBM, to Blackberry: How humbled tech giants reinvented for a comeback - T", "summary": "노키아, 에릭슨, IBM, 블랙베리 등 과거 위기를 맞았던 글로벌 기술 거인들이 어떻게 비즈니스 모델을 재편하고 부활에 성공했는지 그 전략을 조명합니다. 급변하는 시장 환경 속에서 통신장비 및 IT 기업들이 생존을 위해 체질 개선을 이뤄낸 과정은 업계의 중요한 벤치마킹 사례입니다. 주요 경쟁사인 에릭슨과 노키아의 기업 전략을 다루고 있습니다.", "source": "The Indian Express", "date": "2026-09-06 17:07", "url": "https://indianexpress.com/article/explained/explained-economics/nokia-ericsson-ibm-blackberry-comeback-10865506/", "category": "other", "importance": 3, "wl": false, "topic": "노키아 에릭슨 기업변신"}, {"title": "수급 악화로 주가 빠졌지만… RFHIC 반등 기대 커지는 까닭", "summary": "5G 단독모드(SA)와 6G 투자가 확대됨에 따라 RFHIC가 공급하는 고주파·고전력 반도체 등 통신 장비 부품의 새로운 수요 창출 기대감을 다뤘다. 차세대 통신망 고도화에 따른 부품 업체의 수혜 전망이다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 09:04", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484216", "category": "tech", "importance": 3, "wl": false, "topic": "rfhic 장비 수요"}, {"title": "ソフトバンクが〝空飛ぶ基地局〟HAPSの商用化に向けた試験サービスに成功 - @DIME アットダイム", "summary": "소프트뱅크가 성층권 통신 플랫폼인 HAPS(하늘의 기지국)의 상용화를 위한 시험 서비스에 성공했다. 차세대 공중 무선 네트워크 인프라 기술의 상용화 가능성을 검증한 성과다.", "source": "@DIME アットダイム", "date": "2026-09-06 06:29", "url": "https://dime.jp/genre/2150592/", "category": "tech", "importance": 3, "wl": false, "topic": "소프트뱅크 haps"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "주요 통신 임원들이 모여 5G의 더 큰 상업적 기회는 소비자용 시장이 아니라 산업용 자동화와 스마트 팩토리에 있다고 강조했습니다. 프라이빗 5G 네트워크와 제조 현장의 디지털 전환을 가속화하기 위한 장비사 및 통신사들의 전략적 방향성을 제시합니다. 5G 통신장비 및 인프라의 B2B 시장 전망을 다룹니다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "5g 산업용자동화"}, {"title": "Huawei Enterprise AI Push Is Reshaping Industrial Infrastructure - urbanacres.in", "summary": "화웨이가 엔터프라이즈 및 산업용 인공지능(AI) 솔루션 확장을 가속화하며 산업 인프라의 디지털 전환을 주도하고 있습니다. 통신망과 클라우드, AI를 결합한 B2B 인프라 전략을 통해 글로벌 기업 시장 공략에 박차를 가하는 화웨이의 행보를 다룹니다.", "source": "urbanacres.in", "date": "2026-09-05 11:27", "url": "https://urbanacres.in/huawei-enterprise-ai-push-is-reshaping-industrial-infrastructure/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 엔터프라이즈ai"}, {"title": "Nokia Tests Network APIs in Healthcare - Telecom Reseller / Technology Reseller News", "summary": "노키아가 헬스케어 분야에서 네트워크 API 테스트를 성공적으로 진행하며 통신 서비스의 새로운 활용 가능성을 입증하고 있습니다. 통신망의 프로그래밍 가능성을 높여 의료 및 기업용 서비스 혁신을 지원하는 노키아의 차세대 기술 전략의 일환입니다. 경쟁사의 기술 개발 동향을 보여주는 사례입니다.", "source": "Telecom Reseller / Technology Reseller News", "date": "2026-09-05 08:15", "url": "https://telecomreseller.com/2026/09/04/nokia-tests-network-apis-in-healthcare/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 네트워크api"}, {"title": "Is Nokia Oyj (HLSE:NOKIA) A Bargain Following Its AI And Broadband Expansion? - simplywall", "summary": "노키아(NOKIA)가 AI 및 광대역 통신망 확장 사업을 본격화하는 가운데 현재 주가가 저평가된 매력적인 투자 기회인지 분석합니다. 통신장비 시장에서 브로드밴드 수요와 AI 연계 솔루션이 향후 실적에 미칠 영향에 대한 시장의 평가를 다룹니다.", "source": "simplywall.st", "date": "2026-09-07 03:38", "url": "https://simplywall.st/stocks/fi/tech/hel-nokia/nokia-oyj-shares/news/is-nokia-oyj-hlsenokia-a-bargain-following-its-ai-and-broadb", "category": "other", "importance": 2, "wl": false, "topic": "노키아 주가전망"}, {"title": "Nokia stock holds as investors await a fresh catalyst - AD HOC NEWS", "summary": "투자자들이 새로운 실적 모멘텀이나 시장 촉매제를 기다리는 가운데 노키아의 주가가 박스권에서 지지선을 유지하고 있습니다. 글로벌 통신장비 시장의 수요 회복 신호와 주가 흐름을 진단하는 금융 시장 분석입니다.", "source": "AD HOC NEWS", "date": "2026-09-07 02:20", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/nokia-stock-holds-as-investors-await-a-fresh-catalyst/70060893", "category": "other", "importance": 2, "wl": false, "topic": "노키아 주가동향"}, {"title": "Telecom news: InCoax Networks, Nokia, Sjoberg’s, Telit Cinterion, Array Digital Infrastruc", "summary": "인코액스 네트워크, 노키아, 시에베리스, 텔리트 샌테리온 등 주요 통신 및 기술 기업들의 최신 업계 동향과 파트너십 소식을 전달합니다. 글로벌 통신장비 시장에서의 기술 협력과 제품 공급 관련 단신 모음입니다.", "source": "TelecomLead", "date": "2026-09-05 16:34", "url": "https://telecomlead.com/news/telecom-news-incoax-networks-nokia-sjobergs-telit-cinterion-array-digital-infrastructure-127613", "category": "other", "importance": 2, "wl": false, "topic": "노키아 인코액스"}], "policy": [{"title": "티빙 유출 사고 보상 신청 7일 시작… 4000만 계정 피해 어떻게 갚나", "summary": "과기정통부 민관합동조사단이 티빙 유출 사고를 중대 침해사고로 분류하고 조사 결과를 발표했다. 4000만 계정 규모의 피해에 대해 2차 피해 방지 및 보상 신청 절차가 시작됐다. 정부는 재발 방지 대책 이행 점검과 과징금 부과를 추진할 방침이다.", "source": "wikitree.co.kr", "date": "2026-09-06 16:02", "url": "https://www.wikitree.co.kr/articles/1157593", "category": "outage", "importance": 5, "wl": false, "topic": "과기정통부 티빙사고"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 트라이(TRAI)가 제안한 5G 네트워크 슬라이싱 관련 서비스 품질(QoS) 규제 지침에 대해 현지 통신사들이 반대 입장을 표명했습니다. 규제 당국은 슬라이싱이 활성화된 구역의 통신 리소스 모니터링을 통해 무선 자원 사용률을 80% 이하로 유지해 여유 공간을 확보할 것을 제안했으나, 통신사들은 현실적인 제약과 효율성 저하를 우려하고 있습니다. 5G 인프라 활용과 망 운용에 직결되는 규제 이슈로 정책적 중요성이 큽니다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 4, "wl": true, "topic": "trai 5g슬라이싱 규제"}, {"title": "'5G Spectrum Auction' Expected in Korea Next Year... Beneficiaries Among Telecom Equipment", "summary": "내년 국내 5G 주파수 경매가 전망되는 가운데 통신장비주들의 수혜 기대감이 커지고 있다. 국내 통신 시장의 네트워크 투자가 활성화될 경우 장비 업계에 미치는 긍정적 영향이 분석됐다. 정부의 주파수 정책과 장비 시장의 상관관계를 다뤘다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/en/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 주파수 경매"}, {"title": "[2027 AI예산 해부⑤·完] 컨트롤타워 ‘삼각편대’ 2기 돌입…범정부 A...", "summary": "과학기술정보통신부는 2027년 AI 예산으로 전년 대비 84.3% 증가한 9조 4000억원을 편성했다. GPU 및 데이터 등 공통 인프라 확충에 대규모 재정이 투입된다. 대통령실과 국가AI전략위 등과의 협력을 통해 국가 AI 생태계를 가속화할 방침이다.", "source": "ddaily.co.kr", "date": "2026-09-07 06:00", "url": "https://www.ddaily.co.kr/page/view/2026090417453143441", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai 예산"}, {"title": "[공간사회학] ‘AI의 심장’과 전력·용수·소음·주민수용성의 충돌…서울 구청장들이 데이터센터에 제동 건 이유 - 뉴스스페이스", "summary": "서울시 구청장들이 AI의 심장으로 불리는 데이터센터 건립 계획에 전력, 용수 공급 부족, 소음 및 주민 수용성 갈등을 이유로 잇따라 제동을 걸고 나섰습니다. 급증하는 AIDC 수요와 지역사회 환경권 간의 충돌을 다루며 인프라 구축 과정의 규제와 갈등을 심층 분석합니다.", "source": "뉴스스페이스", "date": "2026-09-07 05:00", "url": "https://www.newsspace.kr/news/article.html?no=15524", "category": "policy", "importance": 3, "wl": false, "topic": "서울시 데이터센터 제동"}, {"title": "[단독]갈수록 비싸지는 차세대 칩 '베라루빈'…정부, 대당 275억 예산 책...", "summary": "과학기술정보통신부는 내년 GPU 서버 확충 예산으로 3조 8500억원을 배정했다. 해당 예산은 전액 차세대 칩인 베라루빈 NVL72 서버 랙 구축에 활용될 예정이다. 이는 기존에 밝힌 첨단 GPU 확보 물량과는 별도의 추가 공급 물량이다.", "source": "mt.co.kr", "date": "2026-09-07 05:00", "url": "https://www.mt.co.kr/tech/2026/09/07/2026090612584118295", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 gpu예산"}, {"title": "[단독] 과기정통부 , 미국 이어 유럽에 'AI 공동연구랩' 세운다", "summary": "과기정통부와 정보통신기획평가원이 미국에 이어 유럽에 '글로벌 AI 공동연구랩' 구축을 추진한다. 글로벌 연구 협력을 확대하기 위해 내년 현지 공동연구랩 설립을 위한 예산과 사업을 본격화할 계획이다. 국내 AI 기술 경쟁력 강화에 기여할 것으로 기대된다.", "source": "mt.co.kr", "date": "2026-09-07 04:11", "url": "https://www.mt.co.kr/tech/2026/09/07/2026090614085160950", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai공동연구"}, {"title": "Puzzle of Airtel’s licence status as CA issues new notice - Business Daily", "summary": "케냐 통신 당국이 에어텔의 라이선스 상태와 관련하여 새로운 통지문을 발부하며 규제 절차에 들어갔다. 통신 사업자 면허 및 규제 준수 여부를 둘러싼 갈등을 다뤘다.", "source": "Business Daily", "date": "2026-09-07 03:15", "url": "https://www.businessdailyafrica.com/bd/corporate/companies/puzzle-of-airtel-s-licence-status-as-ca-issues-new-notice-5585994", "category": "policy", "importance": 3, "wl": false, "topic": "케냐 통신사 규제"}, {"title": "Communications Minister Jyotiraditya Scindia releases revised TDIP guidelines to boost tel", "summary": "인도 통신부가 통신 부문 촉진을 위해 개정된 TDIP 가이드라인을 발표했다. 통신 사업 환경을 개선하고 인프라 투자를 장려하기 위한 규제 정비 조치다. 국가 차원의 통신 정책 변화를 보여준다.", "source": "News On AIR", "date": "2026-09-06 22:10", "url": "https://newsonair.gov.in/communications-minister-jyotiraditya-scindia-releases-revised-tdip-guidelines-to-boost-telecom-sector/", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신부 규제"}, {"title": "전화·검색·카톡 파고드는 ‘모두의 AI’… 생활 속 실행력 승부수", "summary": "과기정통부가 주관한 '모두의 AI' 사업 착수 간담회가 개최됐다. 배경훈 부총리 겸 장관은 일상 서비스 전반에 파고드는 AI 생태계에서 확실한 차별점을 만들어야 한다고 강조했다. 대국민 AI 서비스 출시를 위한 본격적인 행보가 시작됐다.", "source": "dt.co.kr", "date": "2026-09-06 18:38", "url": "https://www.dt.co.kr/article/12082349?ref=naver", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 모두의ai"}, {"title": "AIDC 가르는 '기술기준' 나왔다", "summary": "정부가 'AIDC 산업 진흥에 관한 특별법' 시행령을 제정하면서 인공지능 데이터센터(AIDC)의 기술 기준을 절대 전력량 또는 AI 장비 전력 비중 충족 방식으로 정의했습니다. 최대 100메가와트(MW) 규모의 대형 센터를 대상으로 전력계통영향평가 면제 인센티브를 부여하는 방안이 논의되고 있습니다. 국가 차원의 AI 인프라 및 데이터센터 관련 제도로 통신·전력 인프라 연관성이 있으나 정책 분야에 해당합니다.", "source": "전자신문", "date": "2026-09-06 16:00", "url": "https://www.etnews.com/20260904000248", "category": "policy", "importance": 3, "wl": true, "topic": "정부 aidc 기술기준"}, {"title": "우주청·유엔, AI 통한 우주전파재난 대응 방안 논의", "summary": "우주항공청과 유엔이 태양 활동으로 인한 위성 및 통신 장애·피해를 예방하기 위해 AI를 활용한 우주전파재난 대응 방안을 모색한다. 정부 차원의 정책 및 재난 대응 협력 기사다.", "source": "viva100.com", "date": "2026-09-06 15:34", "url": "https://www.viva100.com/article/20260906500532", "category": "policy", "importance": 3, "wl": false, "topic": "우주청 유엔 우주전파재난"}, {"title": "Rural calls, data to become cheaper by Q1 2027 – Sam George - MyJoyOnline", "summary": "가나 정부가 2027년 1분기까지 농어촌 지역의 음성 통화 및 데이터 요금을 인하하겠다는 계획을 밝혔다. 통신 소외 지역의 접근성 개선 및 요금 규제 정책이다.", "source": "MyJoyOnline", "date": "2026-09-06 14:48", "url": "https://www.myjoyonline.com/rural-calls-data-to-become-cheaper-by-q1-2027-sam-george/", "category": "policy", "importance": 3, "wl": false, "topic": "가나 통신 정책"}, {"title": "9.4조 AI 승부수 띄운 정부… '보안·전국민 서비스'로 생태계 가속", "summary": "과기정통부는 내년도 AI 관련 예산이 전년 대비 84.3% 증가한 9조 4211억원으로 편성됐다고 밝혔다. 미토스 쇼크 대응과 보안 및 전국민 서비스 확대를 위한 재정 투입이다. 전체 예산의 큰 비중을 AI 생태계 가속화에 집중할 계획이다.", "source": "newscj.com", "date": "2026-09-06 14:18", "url": "https://www.newscj.com/news/articleView.html?idxno=3430376", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai예산"}, {"title": "'애프터마켓' 일주일 앞으로…대형주 넘어 코스닥까지 '밤 8시 실시간 거래' 문턱 넓어진다", "summary": "한국거래소(KRX)의 '애프터마켓' 개장이 일주일 앞으로 다가온 가운데 코스피·코스닥 상장주식 대부분을 오후 8시까지 실시간으로 거래할 수 있게 됩니다. 대형주 중심이었던 야간 거래가 중소형주까지 확대되면서 KRX와 넥스트레이드 간의 저녁 거래 주도권 경쟁이 본격화될 전망입니다. 자본시장 제도 개편 및 거래소 경쟁 소식으로 통신 정책과는 별개의 금융 정책 이슈입니다.", "source": "전자신문", "date": "2026-09-06 13:00", "url": "https://www.etnews.com/20260904000253", "category": "policy", "importance": 3, "wl": true, "topic": "한국거래소 애프터마켓"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - migflug.com", "summary": "미 연방항공청(FAA)의 5G 전파고도계 관련 규제 이슈가 마무리 국면에 접어들었다. 항공기 안전과 5G 통신 서비스 간의 오랜 갈등이 해소되며 통신사들의 원활한 5G 투자에 기여할 전망이다.", "source": "migflug.com", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "미국 faa 5g 규제"}, {"title": "Telcos oppose TRAI’s 5G network slicing rules, cite regulatory overreach - Communications ", "summary": "인도 통신사들이 규제 당국인 TRAI의 5G 네트워크 슬라이싱 규정 초안에 대해 규제 과잉이라며 강력하게 반발하고 나섰다. 5G 차세대 네트워크 서비스와 관련된 통신 정책 및 규제 마찰을 보여준다.", "source": "Communications Today", "date": "2026-09-05 14:25", "url": "https://www.communicationstoday.co.in/telcos-oppose-trais-5g-network-slicing-rules-cite-regulatory-overreach/", "category": "policy", "importance": 3, "wl": false, "topic": "인도통신규제당국 5g규제"}, {"title": "LIVE: | Islamabad 5G Spectrum Auction 2026 | PTA Inaugural Ceremony | Geo News James Haske", "summary": "파키스탄 이슬라마바드에서 5G 주파수 경매 및 PTA 취임식이 생중계되는 등 통신 인프라 고도화 작업이 진행 중이다. 국가 주도의 신규 주파수 확보 및 5G 도입 절차를 보여준다.", "source": "Mshale", "date": "2026-09-05 14:17", "url": "https://mshale.com/9bf82a2b/01c0c54dNsw9aucTWYE", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 5g 주파수 경매"}, {"title": "2027년 5G 경매 전망, 통신장비 투자 재논의 - tokenpost.kr", "summary": "2027년 국내 5G 추가 주파수 경매가 실시될 것으로 예상되면서 통신사들의 망 투자 계획과 통신장비 공급사들의 수혜 여부에 대한 재논의가 이루어지고 있습니다. 주파수 정책 변화가 통신사들의 설비투자(CAPEX) 집행에 미치는 파장을 다룹니다.", "source": "tokenpost.kr", "date": "2026-09-05 08:38", "url": "https://www.tokenpost.kr/news/tech/402820", "category": "policy", "importance": 3, "wl": false, "topic": "2027 5g 경매 전망"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니] - 아시아경제", "summary": "내년 국내 이동통신 시장에서 5G 추가 주파수 경매가 진행될 것으로 전망되면서 통신장비주와 수혜 기업들에 대한 투자자들의 관심이 집중되고 있습니다. 주파수 재할당 및 신규 할당에 따라 통신사들의 네트워크 투자가 재개될 가능성이 거론되며 장비 업계의 실적 개선 기대감이 높아지고 있습니다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 3, "wl": false, "topic": "국내 5g주파수 경매"}, {"title": "[단독] 4000억 AI혁신펀드 13%만 가동… 3곳은 투자 0원", "summary": "국회 국정감사 자료에 따르면 과기정통부가 조성한 4000억원 규모의 AI 혁신펀드 중 일부만 가동되고 일부 자펀드는 투자가 전무한 것으로 나타났다. 민간 투자 활성화를 위해 조성된 펀드의 집행 효율성을 높여야 한다는 지적이 제기된다.", "source": "seoul.co.kr", "date": "2026-09-07 05:05", "url": "https://www.seoul.co.kr/news/economy/2026/09/07/20260907032005?wlog_tag3=naver", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 ai펀드"}, {"title": "[세종만사]공공기관 기능개혁, 발표 다음날 이례적 '사후 홍보전'", "summary": "과기정통부 장관이 유임되면서 이재명 정부의 AI 프로젝트를 계속 진두지휘하게 됐다. 정책 연속성을 바탕으로 주요 AI 관련 정책과 예산 집행에 속도가 붙을 전망이다. 내부적으로는 정책 안정성에 대한 기대감이 높다.", "source": "etnews.com", "date": "2026-09-06 14:01", "url": "https://www.etnews.com/20260906000071", "category": "exec", "importance": 2, "wl": false, "topic": "과기정통부 장관유임"}, {"title": "충남도 ‘1조 원대 AI 모빌리티 실증 콤플렉스’ 첫 관문 통과", "summary": "충남도의 1조원대 AI 모빌리티 실증 콤플렉스 사업이 과기정통부의 구축형 R&D 사업추진심사 대상에 선정됐다. 내년 상반기 최종 본심사를 거쳐 2028년부터 국비와 지방비가 투입될 예정이다. 지역 기반 AI 실증 인프라 구축의 첫 관문을 통과했다.", "source": "munhwa.com", "date": "2026-09-06 12:44", "url": "https://www.munhwa.com/article/11614816?ref=naver", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 ai모빌리티"}], "carrier": [{"title": "\"AI 데이터센터에 모듈러 접목\" … GS건설·LGU+ 표준모델 개발", "summary": "GS건설이 급증하는 인공지능(AI) 데이터센터 수요에 대응하기 위해 LG유플러스 등 5개사와 협력하여 사전 제작형 모듈러 데이터센터(PMDC) 표준모델 공동 개발에 나섰습니다. 설계, 시공, 운영 등 각사의 전문 역량을 결집하여 공기를 단축하고 하이퍼스케일 데이터센터 수행 경쟁력을 높일 계획입니다. 통신사의 데이터센터 인프라 확장 및 건설사와의 협력을 다루는 핵심 사업입니다.", "source": "매일경제 IT", "date": "2026-09-06 17:12", "url": "https://www.mk.co.kr/news/realestate/12145461", "category": "contract", "importance": 4, "wl": true, "topic": "gs건설 lg유플러스 데이터센터"}, {"title": "After 10 years of India feat, Jio sets its sights on global market: Akash Ambani", "summary": "인도 통신사 릴라이언스 지오가 인도 내 디지털 연결성 보급을 달성한 데 이어 글로벌 시장 진출을 공식화했습니다. 아카시 암바니 회장은 지오가 지난 10년 동안 모든 인도인에게 저렴하고 접근 가능한 고품질 디지털 인프라를 제공해 온 성과를 바탕으로 해외 시장으로 영역을 넓힐 것이라고 밝혔습니다. 인도 최대 통신사의 글로벌 전략 전환을 보여주는 중요한 발표입니다. 삼성전자 네트워크사업부의 주요 고객사이자 파트너의 전략 변화로 높은 보고 가치를 가집니다.", "source": "ET Telecom", "date": "2026-09-06 14:11", "url": "https://telecom.economictimes.indiatimes.com/news/industry/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market-akash-ambani/133826619", "category": "exec", "importance": 4, "wl": true, "topic": "릴라이언스 지오 글     <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
