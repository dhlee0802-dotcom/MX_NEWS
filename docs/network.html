<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;

    --bg:#f6f8fb; --card:#ffffff;

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}

  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}

  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

rks to reshape the telecom value chai", "summary": "퀄컴이 6G의 3대 축으로 AI 네이티브 네트워크를 제시하며 통신 밸류체인 재편을 예고했습니다. AI와 통신 기술의 융합이 차세대 네트워크 표준의 핵심으로 자리잡고 있음을 보여줍니다. 글로벌 칩셋 및 장비 제조사들의 6G R&D 전략을 보여주는 중요 발표입니다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g"}, {"title": "SPCX Stock: SpaceX's Wireless Ambitions Fuel T-Mobile Acquisition Speculation - Stocktwits", "summary": "스페이스X의 무선 통신 야망이 티모바일 인수 추측을 불러일으키며 관련 주식에 영향을 미쳤다. 우주 기반 위성통신과 지상파 이동통신 강자의 결합 가능성이 시장의 이목을 끌고 있다. 양사의 제휴가 심화되는 가운데 초대형 딜로 이어질지에 대한 투기적 관심이 고조되고 있다. 향후 통신과 위성산업 간의 경계가 무너지는 메가 트렌드를 반영한다.", "source": "Stocktwits", "date": "2026-09-06 02:58", "url": "https://stocktwits.com/news-articles/markets/equity/spcx-stock-space-x-s-wireless-ambitions-fuel-t-mobile-acquisition-speculation/cZ1G8HBR7X1", "category": "contract", "importance": 4, "wl": false, "topic": "스페이스x 티모바일 인수설"}, {"title": "갈링하우스, 네덜란드 110억달러 금 이송 중 70%가 서류상 거래라며 낡은...", "summary": "코인페이퍼(coinpaper.com)에 따르면 이 작업에는 대규모 운송과 검증 절차가 뒤따랐다.갈링하우스는 이 같은 속도를 자율주행차·인공지능(AI)· 스타링크 (Starlink) 같은 다른 기술 분야의 발전 속도와 대비시켰다....", "source": "wikitree.co.kr", "date": "2026-09-06 00:32", "url": "https://www.wikitree.co.kr/articles/1157497", "category": "other", "importance": 4, "wl": false, "topic": ""}, {"title": "Japan's Rakuten to debut satellite-to-cell service with Starlink rival AST - Nikkei Asia", "summary": "일본 라쿠텐 모바일이 스타링크의 라이벌인 AST 스페이스모바일과 손잡고 위성-셀룰러 직접통신 서비스를 선보일 예정이다. 지상 기지국 커버리지의 한계를 극복하고 전국적인 통신망을 구축하기 위한 핵심 전략이다. 위성통신을 활용한 사각지대 해소가 본격화되고 있다. 일본 통신 시장의 기술 경쟁을 촉발하는 대형 이벤트이다.", "source": "Nikkei Asia", "date": "2026-09-05 01:20", "url": "https://asia.nikkei.com/business/telecommunication/japan-s-rakuten-to-debut-satellite-to-cell-service-with-starlink-rival-ast", "category": "tech", "importance": 4, "wl": false, "topic": "라쿠텐모바일 위성통신"}, {"title": "\"운전대 없는 사이버캡 뜬다\"...테슬라(TSLA), 주가 5.4% 급등 환", "summar ions beyond 6G via just-in-time IMU-assisted beam man", "summary": "6G를 넘어선 서브테라헤르츠 대역의 모바일 통신을 위한 초정밀 빔 제어 기술에 대한 학술 연구 보도입니다. 차세대 무선 통신 기술의 학술적 진전을 나타내며 향후 표준화의 기초 자료가 됩니다.", "source": "Nature", "date": "2026-09-05 09:46", "url": "https://www.nature.com/articles/s44459-026-00077-4", "category": "tech", "importance": 3, "wl": false, "topic": "네이처 6g통신"}, {"title": "'Huge activity' in space sector as private industry expands, India eyes big share of space", "summary": "민간 우주 산업의 급격한 성장과 함께 인도가 글로벌 우주 시장에서 큰 지분을 차지하기 위한 움직임을 보이고 있습니다. 위성 및 우주 인프라 확충에 대한 국가적 의지를 나타냅니다. 향후 아시아 지역 우주 통신 시장의 잠재력을 시사합니다.", "source": "India's News.Net", "date": "2026-09-05 08:30", "url": "https://www.indiasnews.net/news/279286686/huge-activity-in-space-sector-as-private-industry-expands-india-eyes-big-share-of-space-economy-ispa-dg", "category": "tech", "importance": 3, "wl": false, "topic": "인디아뉴스 우주산업"}, {"title": "우크라이나 전 국방장관, 팔란티어 CEO와 손잡고 방산 스타 트업 설립", "summary": "특히 2022년 러시아의 전면 침공 직후 엑스(X·옛 트위터)를 통해 일론 머스크에게 직접 지원을 요청, 스페이스X의 ' 스타링크 (Starlink)' 위성 인터넷 단말기 지원을 신속하게 이끌어내며 국제적인 주목을 받았다. 이후...", "source": "theguru.co.kr", "date": "2026-09-05 07:52", "url": "https://www.theguru.co.kr/news/article.html?no=106717", "category": "exec", "importance": 3, "wl": false, "topic": ""}, {"title": "[미리보는 AINEX 2026]〈상〉AI시대 우주·지상·해저 '초연결' 네트워크 ...", "summary": "AINEX 2026 컨퍼런스에서 서울대 교수와 삼성전자 부사장이 각각 AI 메가 프로젝트를 위한 네트워크 진화 방안과 인프라 기술을 주제로 기조강연을 진행합니다. 차세대 네트워크 고도화와 AI 인프라 트렌드를 제시합니다.", "source": "etnews.com", "date": "2026-09-05 06:01", "url": "https://www.etnews.com/20260904000311", "category": "tech", "importance": 3, "wl": false, "topic": "전자신문 ai넥스"}, {"title": "Starlink Is Throttling Certain Users, With Little Explanation - PCMag Australia", "summary": "스타링크가 일부 사용자를 대상으로 명확한 설명 없이 속도 제한(Throttling)을 적용하고 있다는 소비자 불만 보도입니다. 저궤도 위성 인터넷 서비스의 망 품질 관리 및 트래픽 정책 이슈를 다룹니다. 가입자 증가에 따른 네트워크 품질 유지 과제를 보여줍니다.", "source": "PCMag Australia", "date": "2026-09-05 03:13", "url": "https://au.pcmag.com/networking/119708/starlink-is-throttling-certain-users-with-little-explanation", "category": "tech", "importance": 3, "wl": false, "topic": "스타링크 속도제한"}, {"title": "UK satco Open Cosmos lands role in national defence comms push - telcotitans.com", "summary": "영국 위성기업 오픈코스모스가 국가 방위 통신 사업에 참여하는 계약을 체결했습니다. 위성 기반 방산 통신 인프라 구축에서 민간 기업의 역할이 커지고 있음을 보여줍니다. 군사 및 국가 안보 영역에서의 저궤도 위성 활용이 확대되고 있습니다.", "source": "telcotitans.com", "date": "2026-09-05 01:49", "url": "https://www.telcotitans.com/infrawatch/uk-satco-open-cosmos-lands-role-in-national-defence-comms-push/10844.article", "category": "contract", "importance": 3, "wl": false, "topic": "오픈코스모스 방산"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - fierce-network.co", "summary": "마스오렌지와 에릭슨이 6G 미래를 향한 초기 단계로 6 GHz 주파수 대역을 테스트했다. 양사는 차세대 네트워크 인프라 확보를 위해 협력하고 있으며, 상용화 가능성을 점검했다. 이번 테스트는 유럽 통신 시장에서 6G 기술 주도권을 선점하기 위한 전략의 일환이다. 향후 초고속·저지연 통신 환경 구현을 위한 핵심 기술 기반을 다지는 계기가 될 것으로 전망된다.", "source": "fierce-network.com", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 6g 시험"}, {"title": "Spain’s MásOrange signals a next step in the 6G story - telecomtv.com", "summary": "스페인의 마스오렌지가 6G 기술 발전의 다음 단계를 시연했다. 차세대 네트워크 표준 연구 및 주파수 활용 가능성을 검증하며 기술력을 입증하고 있다. 유럽 통신 시장 내에서 선도적인 위치를 확보하기 위한 R&D 투자의 연장선이다. 향후 통신 인프라 혁신을 가속화할 중요한 마일스톤이 될 전망이다.", "source": "telecomtv.com", "date": "2026-09-04 23:32", "url": "https://www.telecomtv.com/content/6g/spain-s-m-sorange-signals-a-next-step-in-the-6g-story-56174/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "마스오렌지 6g 시험"}, {"title": "SpaceXの次世代「Starlink V3」、通信容量を約10倍に Starshipでの本格展開近づく - 財経新聞", "summary": "스페이스X의 차세대 위성 스타링크 V3가 통신 용량을 약 10배 늘리며 스타십을 통한 본격적인 발사 배치가 다가오고 있다. 위성통신 인프라의 성능이 대폭 향상되면서 글로벌 통신 시장에 미치는 파급력이 커지고 있다. 우주 인터넷의 대중화를 가속화할 핵심 기술 발전이다.", "source": "財経新聞", "date": "2026-09-04 20:39", ": "네이버와 SK텔레콤 등이 과기정통부의 국산 보안 AI 개발 사업에 참여하며 각사의 통신, 플랫폼, AI 역량을 결합합니다. 통신사의 AI 생태계 확장 전략을 다룹니다.", "source": "yna.co.kr", "date": "2026-09-06 09:30", "url": "https://www.yna.co.kr/view/AKR20260904152200017?input=1195m", "category": "tech", "importance": 3, "wl": false, "topic": "연합뉴스 보안ai"}, {"title": "AIDC도 조립식으로 짓는다…LGU+, GS건설과 표준모델 개발", "summary": "LG유플러스가 GS건설 등 전문기업들과 손잡고 100MW급 사전제작형 모듈러 데이터센터 표준모델 개발에 속도를 내며 AIDC 공급 경쟁력 강화를 추진한다.", "source": "ZDNet Korea", "date": "2026-09-06 09:09", "url": "https://zdnet.co.kr/view/?no=20260906090941", "category": "contract", "importance": 3, "wl": true, "topic": "엘지유플러스 데이터센터"}, {"title": "KT 야구장이 AI 실험실로…응원하고 번역하고 얼굴로 입장", "summary": "KT가 수원 KT위즈파크를 무대로 얼굴 인식 입장, 실시간 영어 번역, AI 응원 문구 제작 등 다양한 인공지능 기술을 적용한 스포츠 관람 실증 서비스를 제공한다.", "source": "ZDNet Korea", "date": "2026-09-06 09:04", "url": "https://zdnet.co.kr/view/?no=20260904233440", "category": "contract", "importance": 3, "wl": true, "topic": "케이티 야구장기술"}, {"title": "카톡에 “등본 떼줘” 요청하면 은행 제출까지…‘모두의 AI’ 연내 출격", "summary": "과기정통부 장관과 SK텔레콤 등 사업자들이 참석한 '모두의 AI' 착수 간담회에서 국산 AI 서비스 상용화 목표가 논의되었습니다. 정부와 통신사의 긴밀한 AI 협력 체계를 보여줍니다.", "source": "sentv.co.kr", "date": "2026-09-06 08:02", "url": "https://www.sentv.co.kr/article/view/sentv202609040192", "category": "policy", "importance": 3, "wl": false, "topic": "센트럴경제 모두의ai"}, {"title": "제각각 통신 방식 통일…軍, 전군 드론 '통신표준' 만든다 - 뉴스1", "summary": "군이 전군 드론의 통신 방식을 통일하기 위해 자체 통신 표준을 정비하고 있습니다. 5G, 6G 위성통신, PS-LTE 등을 대상으로 군 특화 무선 통신 인프라를 구축하려는 움직임입니다.", "source": "뉴스1", "date": "2026-09-06 07:00", "url": "https://www.news1.kr/amp/diplomacy/defense-diplomacy/6280619", "category": "tech", "importance": 3, "wl": false, "topic": "뉴스1 군통신표준"}, {"title": "Verizon Waives Charges for Hurricane Lowell, Prepares Network in Hawai'i - Yahoo Finance", "summary": "버라이즌이 허리케인 로웰 내습에 대비해 하와이 지역 네트워크를 점검하고 관련 요금 청구를 면제하기로 했다. 자연재해 상황에서 안정적인 통신망 유지와 가입자 지원을 위한 조치이다. 통신사의 비상 대응 체계와 공공 책임 갹출을 보여준다. 네트워크 안정성 확보와 고객 서비스의 중요성을 시사한다.", "source": "Yahoo Finance", "date": "2026-09-06 06:29", "url": "https://finance.yahoo.com/technology/articles/verizon-waives-charges-hurricane-lowell-212900457.html", "category": "other", "importance": 3, "wl": false, "topic": "버라이즌 재난지원"}, {"title": "ソフトバンクが〝空飛ぶ基地局〟HAPSの商用化に向けた試験サービスに成功 - @DIME アットダイム", "summary": "소프트뱅크가 하늘을 나는 기지국으로 불리는 성층권 통신 플랫폼(HAPS)의 상용화를 위한 시험 서비스에 성공했다. 지상 기지국의 전파 사각지대를 해소하고 재난 시 통신망을 유지할 수 있는 혁신적인 인프라 기술이다. 차세대 무선 통신망 구축의 지평을 넓히는 성과이다.", "source": "@DIME アットダイム", "date": "2026-09-06 06:29", "url": "https://dime.jp/genre/2150592/", "category": "tech", "importance": 3, "wl": false, "topic": "소프트뱅크 haps"}, {"title": "통신3사 AI 데이터센터 확장에 탄소배출 관리 부담 커진다, 재생에너지...", "summary": "통신3사가 AI 데이터센터 확장과 5G 통신 장비 증설로 인해 전력 사용량과 탄소 배출량이 증가하여 재생에너지 확보 부담이 커지고 있습니다. 통신 인프라 확충이 환경 및 에너지 이슈와 직결됨을 보여줍니다.", "source": "businesspost.co.kr", "date": "2026-09-06 06:00", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=446333", "category": "tech", "importance": 3, "wl": false, "topic": "비즈니스포스트 탄소배출"}, {"title": "Gov’t to upgrade all rural telephony networks to 4G capability – Sam George - MyJoyOnline", "summary": "정부 주도로 모든 농어촌 지역의 통신망을 4G로 업그레이드하는 사업이 추진됩니다. 통신 소외 지역의 모바일 인프라 현대화와 커버리지 확대를 위한 장비 수요 발생을 예고합니다.", "source": "MyJoyOnline", "date": "2026-09-06 01:48", "url": "https://www.myjoyonline.com/govt-to-upgrade-all-rural-telephony-networks-to-4g-capability-sam-george/", "category": "tech", "importance": 3, "wl": false, "topic": "마이조이온라인 농어촌"}, {"title": "T-Mobile CEO appears to have given up on the postpaid crown as he talks up new categories ", "summary": "티모바일 CEO가 후발 주자로서 전통적인 가입자 순증 경쟁에서 벗어나 새로운 사업 카테고리 개척에 집중하겠다는 의사를 밝혔다. 무선 가입자 점유율 경쟁보다는 신사업과 수익성 중심의 경영으로 선회하고 있음을 시사한다. 통신사 수장의 전략적 방향 전환을 보여준다.", "source": "PhoneArena", "date": "2026-09-06 01:32", "url": "https://www.phonearena.com/news/t-mobile-losing-share-value-under-srini-gopalan_id183107", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 경영전략"}, {"title": "After 10 years of India feat, Jio sets its sights on global market - The Economic Times", "summary": "인도 시장에서 10년간 성과를 거둔 릴라이언스지오가 글로벌 시장 진출을 본격적으로 겨냥하고 있습니다. 인도 통신 시장에서의 입지를 바탕으로 해외 사업 확장 및 글로벌 전략을 모색하는 내용입니다.", "source": "The Economic Times", "date": "2026-09-06 01:21", "url": "https://m.economictimes.com/industry/telecom/telecom-news/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market/articleshow/133808067.cms", "category": "other", "importance": 3, "wl": false, "topic": "릴라이언스지오 글로벌"}, {"title": "Vodafone Launches 4K TV Box With Netflix, HBO Max and 300+ Cloud Games - TelecomTalk", "summary": "보다폰이 넷플릭스, HBO 맥스, 300개 이상의 클라우드 게임을 지원하는 4K TV 박스를 출시했습니다. 통신사의 미디어 및 홈 엔터테인먼트 서비스 확장 전략입니다.", "source": "TelecomTalk", "date": "2026-09-05 22:46", "url": "https://telecomtalk.info/vodafone-4ktvbox-with-netflix-hbo-max-300cloud-games/1011587/", "category": "other", "importance": 3, "wl": false, "topic": "보다폰 서비스"}, {"title": "공장 환경을 위한 무선 공존 설계", "summary": "공장 환경에서 장비 간격 확보와 전파 조사를 통한 프라이빗 5G(이음 5G) 무선 공존 설계 전략을 다룹니다. 스마트팩토리 구축을 위한 특화망 인프라 설계 지침을 제공합니다.", "source": "hellot.net", "date": "2026-09-05 20:32", "url": "https://www.hellot.net/news/article.html?no=114796", "category": "tech", "importance": 3, "wl": false, "topic": "헬로티 프라이빗5g"}, {"title": "[헬로즈업] “와이파이는 한계, 외산 모듈은 고비용”…175억 달러 특화...", "summary": "5G 특화망이 스마트팩토리와 물류 현장의 디지털 전환을 이끄는 핵심 인프라로 부상하면서 모듈형 장비 중심으로 생태계가 개편되고 있습니다. 특화망 장비 시장의 기술 트렌드를 조명합니다.", "source": "hellot.net", "date": "2026-09-05 20:12", "url": "https://www.hellot.net/news/article.html?no=114794", "category": "tech", "importance": 3, "wl": false, "topic": "헬로티 5g특화망"}, {"title": "Pakistan’s 5G Rollout Slows Amid Rising Power Costs - digitalpakistan.pk", "summary": "파키스탄의 5G 상용화 속도가 전력 비용 상승 등의 제약으로 인해 둔화되고 있습니다. 통신 인프라 확대 과정에서 운영 비용과 전력 공급이 주요 병목 현상으로 작용하고 있음을 보여줍니다.", "source": "digitalpakistan.pk", "date": "2026-09-05 17:00", "url": "https://digitalpakistan.pk/pakistans-5g-rollout-slows-amid-rising-power-costs/", "category": "tech", "importance": 3, "wl": false, "topic": "디지털 }

const COMPANIES=[

  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],

function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}

  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],

];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}

    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출

      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);

    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);

      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{

      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
