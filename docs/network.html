<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}

  .tabbar::-webkit-scrollbar{display:none}

  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}

  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

ma.", "summary": "릴라이언스 지오와 세계이동통신사업자연합회(GSMA)가 인도 규제 당국(TRAI)에 망중립성 원칙을 위배할 소지가 있는 네트워크 슬라이싱 도입을 촉구하고 있다는 보도입니다. 통신 서비스의 품질 차등화와 공정 경쟁 원칙을 둘러싼 규제 논쟁을 촉발하고 있습니다. 통신 정책 및 규제 환경에 직접적인 타격을 주는 중요 사안입니다. 경영진 보고 가치가 높습니다.", "source": "medianama.com", "date": "2026-09-07 17:10", "url": "https://www.medianama.com/2026/09/223-jio-gsma-network-slicing-net-neutrality/", "category": "policy", "importance": 4, "wl": false, "topic": "인도 릴라이언스 지오 gsma 망중립성 위반 논란"}, {"title": "[미리보는 AINEX 2026]〈중〉AI 입는 지상망…6G·AI-RAN·AIDC 전략 공개", "summary": "AINEX 2026에서 SK텔레콤과 LG유플러스가 6G·AI 기반 네트워크 전략을 발표하며, 삼성전자 등 국내외 장비업체들이 AI 네트워크와 AIDC 인프라 기술을 소개하는 통신사 및 장비사 동향이다.", "source": "etnews.com", "date": "2026-09-07 14:22", "url": "https://www.etnews.com/20260907000325", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 6g 전략"}, {"title": "Telecom operators oppose TRAI’s proposed QoS rules for5G network slicing - tele.net.in", "summary": "인도 통신사들이 TRAI의 5G 네트워크 슬라이싱 서비스 품질(QoS) 규제안에 대해 공식적으로 반대 의사를 표명했습니다. 망 품질 관리 기준을 정부가 일률적으로 개입하는 것에 대해 통신 산업계가 우려를 나타내고 있습니다. 5G 상용화의 핵심 수익 모델인 네트워크 슬라이싱 사업에 직접적인 영향을 미치는 규제 이슈입니다. 경영진 보고 가치가 높은 규제 동향입니다.", "source": "tele.net.in", "date": "2026-09-07 14:19", "url": "https://tele.net.in/national-news/telecom-operators-oppose-trais-proposed-qos-rules-for5g-network-slicing-12501360", "category": "policy", "importance": 4, "wl": false, "topic": "인도 통신사 trai 5g 슬라이싱 규제 반발"}, {"title": "Sceyeとソフトバンク、日本での成層圏接続性の実証実験を完了し、HAPSの商用化に向けて前進（共同通信PRワイヤー） - 毎日新聞", "summary": "소프트뱅크가 성층권 통신 전문 기업 Sceye와 함께 일본 내 성층권 연결성 실증 실험을 성공적으로 완료하고 HAPS 상용화를 향해 한 걸음 더 전진했습니다. 양사는 고고도 플랫폼을 활용한 무선 네트워크 전송 기술 검증을 마쳤습니다. 차세대 무선 통신 커버리지 확장과 재난 대비 통신망 구축을 위한 핵심 기술 협력입니다. 글로벌 통신사의 첨단 인프라 실증 단계 진입을 보여줍니다.", "source": "毎日新聞", "date": "2026-09-07 11:34", "url": "https://mainichi.jp/articles/20260907/pls/00m/020/535000c", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 sceye haps 실증 완료"}, {"title": "이통3사 5G SA 전환 속도전…앞서가는 KT에 SKT·LGU+ \"연내 상용화\" - newsworks.co.kr", "summary": "통신 3사의 5G 단독모드(SA) 전환 경쟁이 치열해진 가운데, 상대적으로 앞서가는 KT에 맞서 SK텔레콤과 LG유플러스가 연내 상용화를 목표로 속도를 내고 있다. 5G 고도화를 위한 국내 통신사의 기술 전환 로드맵이 본격화되고 있다.", "source": "newsworks.co.kr", "date": "2026-09-07 11:07", "url": "https://www.newsworks.co.kr/news/articleViewAmp.html?idxno=852826", "category": "tech", "importance": 4, "wl": false, "topic": "kt 5g"}, {"title": "PTA approves Ufone-Telenor Merger: Reshaping Telecom Landscape - TechJuice", "summary": "파키스탄 통신청(PTA)이 유폰과 텔레노르의 합병을 최종 승인했다. 이번 대형 M&A로 인해 현지 통신 시장의 경쟁 구도와 구조적 재편이 본격화될 전망이다.", "source": "TechJuice", "date": "2026-09-06 18:54", "url": "https://www.techjuice.pk/pta-approves-ufone-telenor-merger-reshaping-telecom-landscape/", "category": "contract", "importance": 4, "wl": false, "topic": "파키스탄 통신 m&a"}, {"title": "「空飛ぶ基地局」通信試験が国内初成功、災害時やクマ監視への活用期待…ソフトバンクが２０２７年度以降の商用化目指す - au Webポータル", "summary": "소프트뱅크가 국내 최초로 '하늘 위의 기지국'으로 불리는 성층권 통신 플랫폼(HAPS)의 통신 시험에 성공하며 2027년 이후 상용화를 공식화했습니다. 재난 발생 시 긴급 통신 지원과 야생동물 감시 등 다양한 분야에서 활용될 것으로 기대를 모으고 있습니다. 지상망의 한계를 뛰어넘어 공중에서 무선 서비스를 제공하는 파괴적인 통신 인프라 혁신입니다. 통신사의 차세대 네트워크 R&D 성과로 주목할 가치가 높습니다.", "source": "au Webポータル", "date": "2026-09-06 17:06", "url": "https://article.auone.jp/0c0608b8-d789-483a-aa34-dbfbcddf82c9", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 성층권 통신 플랫폼 haps 상용화"}, {"title": "[리포트] 신세계부터 KT까지.. 강원 AI 데이터센터 투자 '주목' ::::: 기사 - 춘천MBC", "summary": "강원도가 추진하는 AI 데이터센터 투자 유치에 신세계와 KT 등 대기업이 참여하며 큰 주목을 받고 있다. 지역 인프라 발전과 통신사의 신사업 확장이 맞물린 사례다.", "source": "춘천MBC", "date": "2026-09-07 18:38", "url": "https://chmbc.co.kr/article/ftwJMXORj1Fzj_yX8NrsGW", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai"}, {"title": "Movistar Spain launches 2 Gbps fibre for B2B clients - Telecompaper", "summary": "스페인의 모비스타(Movistar)가 기업 고객(B2B)을 대상으로 최고 2Gbps 속도를 지원하는 초고속 광대역 통신 서비스를 새롭게 출시했습니다. 기업용 디지털 전환 수요에 맞춰 유선 네트워크의 대역폭과 품질을 대폭 강화하려는 전략입니다. 유럽 통신사들의 기업용 초고속인터넷 서비스 고도화 동향을 보여줍니다.", "source": "Telecompaper", "date": "2026-09-07 17:58", "url": "https://www.telecompaper.com/news/movistar-spain-launches-2-gbps-fibre-for-b2b-clients--1581890", "category": "contract", "importance": 3, "wl": false, "topic": "모비스타 스페인 b2b 2gbps 광랜 출시"}, {"title": "IPTV 정체 속 티빙 해킹까지…KT, ‘OTT 합병’ 셈법 복잡해진다 - 아시아투데이", "summary": "IPTV 사업이 정체된 가운데 티빙의 해킹 사고까지 겹치면서 KT의 OTT 사업 합병 및 제휴 셈법이 복잡해지고 있다. 미디어 사업 다각화를 추진하는 KT의 전략적 고민이 깊어지는 국면이다.", "source": "아시아투데이", "date": "2026-09-07 17:37", "url": "http://www.asiatoday.co.kr/kn/view.php?key=20260907010002526", "category": "contract", "importance": 3, "wl": false, "topic": "kt iptv"}, {"title": "Makedonski Telekom unveils 5G SA network - Telecompaper", "summary": "마케도니아 텔레콤이 차세대 단독모드(5G SA) 네트워크 구축을 완료하고 상용 서비스를 공식 개시했습니다. 5G 코어망과 최신 무선 접속망 기술을 도입하여 초고속·저지연 통신 서비스를 제공합니다. 유럽 지역 통신사들의 5G 고도화 및 인프라 업그레이드 현황을 보여주는 사례입니다. 네트워크 장비 조달과 직결되는 통신사 동향입니다.", "source": "Telecompaper", "date": "2026-09-07 17:28", "url": "https://www.telecompaper.com/news/makedonski-telekom-unveils-5g-sa-network--1581871", "category": "contract", "importance": 3, "wl": false, "topic": "마케도니아 텔레콤 5g sa 네트워크 상용화"}, {"title": "SKT, 보안 AI 국가사업 '고배'···네이버 컨소시엄 우위", "summary": "과기정통부의 사이버보안 특화 AI 파운데이션모델 사업 최종 사업자로 네이버클라우드 컨소시엄이 선정되면서 SK텔레콤 컨소시엄이 고배를 마신 국가 사업 선정 결과다.", "source": "finomy.com", "date": "2026-09-07 17:28", "url": "http://www.finomy.com/news/articleView.html?idxno=260904", "category": "policy", "importance": 3, "wl": false, "topic": "sk텔레콤 보안ai 사업"}, {"title": "[재계 투데이] 삼성 , 하반기 신입 공채 실시 外", "summary": "삼성의 하반기 신입 공채 소식과 함께 KT의 5G 네트워크 슬라이싱 기술 및 인파 밀집도 측정 앱 활용 사례를 전하는 통신 기술 협력 보도다.", "source": "news.dealsitetv.com", "date": "2026-09-07 17:22", "url": "https://news.dealsitetv.com/articles/175706", "category": "tech", "importance": 3, "wl": false, "topic": "삼성 하반기 공채"}, {"title": "[CAPEX | 통신] 3사 영업익 2년 새 13.5% 증가…투자는 10.4% 감소 - 리더스팩트", "summary": "통신 3사의 최근 영업이익이 증가한 반면 설비투자(CAPEX)는 감소한 것으로 나타났다. 수익성 중심의 경영 기조 속에서 네트워크 투자가 축소되는 추세를 보여주는 지표다.", "source": "리더스팩트", "date": "2026-09-07 17:19", "url": "https://www.leadersfact.co.kr/news/articleView.html?idxno=23504", "category": "earnings", "importance": 3, "wl": false, "topic": "통신3사 capex"}, {"title": "AIDC 키우는 통신3사…SKT '분업', KT '네트워크', LGU+ '표준화' - v.daum.net", "summary": "통신 3사가 AI 데이터센터(AIDC) 인프라 확충에 본격 나선 가운데 각기 다른 전략을 취하고 있다. SK텔레콤은 분업, KT는 네트워크 중심, LG유플러스는 표준화를 내세우고 있다. 각사의 강점을 살린 AIDC 구축 경쟁이 시장 주도권을 가를 전망이다.", "source": "v.daum.net", "date": "2026-09-07 17:13", "url": "https://v.daum.net/v/20260907171305156", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai"}, {"title": "Vodafone delivers 5G emergency unit to Spain's UME - Telecompaper", "summary": "스페인 보다폰이 재난 및 비상 상황에 대응하기 위해 스페인 군사응급부대(UME)에 최첨단 5G 긴급 통신 유닛을 무상으로 전달하고 지원 체계를 구축했습니다. 재난 현장에서 신속하게 무선 통신망을 복구하고 지휘 통제를 돕는 공익적 인프라 지원 성격입니다. 통신사의 재난 대비 비상 네트워크 운용 역량을 보여줍니다.", "source": "Telecompaper", "date": "2026-09-07 16:58", "url": "https://www.telecompaper.com/news/vodafone-delivers-5g-emergency-unit-to-spains-ume--1581880", "category": "other", "importance": 3, "wl": false, "topic": "보다폰 스페인 긴급 통신 유닛 지원"}, {"title": "데이터센터 다음은 로봇 훈련장…中 통신사, 피지컬 AI 학습 시장 공략", "summary": "중국 통신사 차이나텔레콤이 5G 통신망과 클라우드 인프라를 활용해 로봇 학습 데이터 시장을 공략하는 통신사 신사업 동향이다.", "source": "dt.co.kr", "date": "2026-09-07 16:57", "url": "https://www.dt.co.kr/article/12082561?ref=naver", "category": "tech", "importance": 3, "wl": false, "topic": "차이나텔레콤 로봇 ai"}, {"title": "楽天モバイル、一部エリアで10月以降もKDDIローミングを継続する方針を改めてお知らせ (ケータイ Watch) - Yahoo!ニュース", "summary": "라쿠텐모바일이 일부 지역에서 10월 이후에도 KDDI의 이동통신 로밍 서비스를 지속 제공하기로 한 방침을 다시 한번 알렸습니다. 현재 양사 간에는 세부 조건을 맞추기 위한 최종 협의가 진행 중입니다. 자체 기지국 구축이 완료되지 않은 지역의 서비스 연속성을 보장하기 위한 조치입니다. 통신사 간 망 임차 계약의 연장선에 있는 중요 사안입니다.", "source": "Yahoo!ニュース", "date": "2026-09-07 16:56", "url": "https://news.yahoo.co.jp/articles/0de39bee7ed4a8273685bea495f9a6778b9b5ba1/images/000", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐모바일 kddi 로밍 연장"}, {"title": "KT '티오더 기술탈취' 의혹 재점화", "summary": "통신 망 장애가 발생한 매장에서 KT 영업직원이 자사 하이오더 사용을 권유했다는 티오더 측의 기술탈취 의혹 제기 보도로 통신 장애 관련 영업 논란을 다룬다." per.com/news/hrvatski-telekom-debuts-vibe-coding-contest--1581762", "category": "tech", "importance": 3, "wl": false, "topic": "크로아티아 텔레콤 바이브 코딩 콘테스트"}, {"title": "[전파칼럼] AI 시대 보이지 않는 안전망, 전자기 복원력", "summary": "AI 기반 자율시스템과 핵심 인프라에서 작은 센서 오류나 순간적인 통신 장애가 기능 상실로 이어질 수 있음을 지적하며 전자기 복원력의 중요성을 강조한 칼럼이다.", "source": "etnews.com", "date": "2026-09-07 16:01", "url": "https://www.etnews.com/20260907000137", "category": "outage", "importance": 3, "wl": false, "topic": "통신 장애 복원력"}, {"title": "송주영 연구위원 \"국내 통신 사 첫 클라우드 전산실…서버 복구 빨라서 ...", "summary": "국내 통신사 최초의 클라우드 전산실 도입을 다루며 요금 정산 등 장애 발생 시 고객 서비스에 미치는 영향과 서버 복구의 중요성을 다룬 통신사 인프라 보도다.", "source": "hankyung.com", "date": "2026-09-07 15:54", "url": "https://www.hankyung.com/article/2026090778701", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 클라우드 전산실"}, {"title": "LG유플러스, PMDC 얼라이언스 출범…AI 데이터센터 건축기간 줄인다 - 사회적경제뉴스", "summary": "LG유플러스가 'PMDC 얼라이언스'를 출범하고 AI 데이터센터 건축 기간 단축에 나선다. 건설사와 협력하여 모듈러 데이터센터 표준 모델을 개발함으로써 인프라 구축 속도를 혁신적으로 줄인다는 전략이다.", "source": "사회적경제뉴스", "date": "2026-09-07 15:43", "url": "http://www.senews.kr/40879", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai"}, {"title": "Vodafone Idea Shares Hit 25-Month High Amid Rebranding and SRK Campaign - Whalesbook", "summary": "보다폰 아이디어의 주가가 브랜드 리브랜딩 성공과 유명 배우(SRK)를 기용한 대규모 마케팅 캠페인의 호조에 힘입어 25개월 만에 최고치를 기록했습니다. 구조조정과 마케팅 혁신을 통해 회생을 노리는 인도 통신사의 시장 반응을 보여줍니다. 통신사의 경영 정상화 과정과 주가 흐름을 파악하는 데 유의미한 소식입니다.", "source": "Whalesbook", "date": "2026-09-07 15:34", "url": "https://www.whalesbook.com/news/English/telecom/Vodafone-Idea-Shares-Hit-25-Month-High-Amid-Rebranding-and-SRK-Campaign/6a9e5af540007e01b83c8679", "category": "earnings", "importance": 3, "wl": false, "topic": "보다폰 아이디어 주가 25개월 최고치"}, {"title": "KT 2년 새 경력 5천 명 줄이고 신입 채용은 배로 늘려, 박윤영 AX 중심 젊은피 교체 '속도' - businesspost.co.kr", "summary": "KT가 박윤영 부임 이후 AX(AI 전환) 중심의 젊은 인재 교체에 속도를 내고 있다. 최근 2년 동안 경력직을 줄이고 신입 채용을 확대하는 등 인력 구조 혁신을 단행하고 있다.", "source": "businesspost.co.kr", "date": "2026-09-07 15:07", "url": "https://m.businesspost.co.kr/BP?command=mobile_view&num=446552", "category": "exec", "importance": 3, "wl": false, "topic": "kt 조직"}, {"title": "NTT Docomo Business to secure solar farm remote monitoring networks - Telecompaper", "summary": "NTT도코모 비즈니스가 태양광 발전소 시설을 원격으로 모니터링하기 위한 안정적인 통신 네트워크 구축 및 보안 서비스를 확보한다는 소식입니다. 재생에너지 인프라 관리와 기업용 사물인터넷(IoT) 통신망 활용의 융합을 보여줍니다. 통신사의 B2B 솔루션 확장 전략을 담고 있습니다. 네트워크 활용 범용성 확대 차원에서 참고할 만합니다.", "source": "Telecompaper", "date": "2026-09-07 14:57", "url": "https://www.telecompaper.com/news/ntt-docomo-business-to-secure-solar-farm-remote-monitoring-networks--1581863", "category": "tech", "importance": 3, "wl": false, "topic": "ntt도코모 비즈니스 태양광 발전소 원격 모니터링"}, {"title": "Weekly Recap: Deutsche Telekom AG €5bn buyback and CFO transition - TradingView", "summary": "도이치텔레콤이 5블리언(50억) 유로 규모의 대규모 자사주 매입 프로그램과 함께 최고재무책임자(CFO)의 리더십 전환을 단행한 주간 실적 및 경영 동향 요약입니다. 유럽 최대 통신사의 견고한 주주 환원 정책과 경영진 세대교체를 동시에 보여줍니다. 글로벌 대형 통신사의 경영 전략과 재무 리더십 변화를 파악하는 주요 보고 가치를 지닙니다.", "source": "TradingView", "date": "2026-09-07 14:14", "url": "https://www.tradingview.com/news/tradingview:0ccb722fa12d2:0-weekly-recap-deutsche-telekom-ag-5bn-buyback-and-cfo-transition/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 자사주 매입 및 cfo 교체"}, {"title": "Vodafone Idea shares rally to market value of ₹168,040 cr - NewsBytes", "summary": "보다폰 아이디어의 주가 랠리가 이어지면서 회사의 전체 시가총액이 168,040억 루피 규모로 급증했습니다. 재무적 위기를 극복하고 시장의 신뢰를 회복해 나가는 통신사의 가치 상승을 조명합니다. 인도 통신 시장의 지형 변화와 주요 사업자의 재무 동향을 보여주는 중요한 지표입니다.", "source": "NewsBytes", "date": "2026-09-07 14:09", "url": "https://www.newsbytesapp.com/news/business/vodafone-idea-shares-rally-to-market-value-of-rs168040-cr/tldr", "category": "earnings", "importance": 3, "wl": false, "topic": "보다폰 아이디어 시가총액 급증"}, {"title": "구현모 시절 인수한 KT 엡실론, 1년 만에 다시 적자 전환 - 시사저널e", "summary": "구현모 전 대표 시절 인수한 KT의 해외 자회사 엡실론이 인수 1년 만에 다시 적자로 돌아섰다. 해외 B2B 인프라 사업 확장을 위해 야심 차게 인수한 자회사의 실적 부진으로 KT의 글로벌 전략이 시험대에 올랐다.", "source": "시사저널e", "date": "2026-09-07 14:07", "url": "https://www.sisajournal-e.com/news/articleView.html?idxno=423551", "category": "earnings", "importance": 3, "wl": false, "topic": "kt 실적"}, {"title": "[KT 특별세무조사 - ④] KT 결합상품 거래 ‘도마 위’…밀리의서재 이어 지니뮤직도 검증대 오르나 - 필드뉴스", "summary": "KT에 대한 특별세무조사 과정에서 결합상품 거래가 도마 위에 올랐다. 밀리의서재에 이어 지니뮤직 등 주요 계열사와의 거래 구조까지 검증 대상이 확대될지 업계의 이목이 집중되고 있다.", "source": "필드뉴스", "date": "2026-09-07 13:41", "url": "https://www.fieldnews.kr/news/articleView.html?idxno=31330", "category": "policy", "importance": 3, "wl": false, "topic": "kt 세무조사"}, {"title": "Vodafone Idea share price up 4% today | Rises over 20% in one month — what's fueling telec", "summary": "보다폰 아이디어 주가가 하루 만에 4% 급등하며 최근 한 달간 20%가 넘는 가파른 상승세를 보이고 있는 배경과 원인을 분석한 금융 기사입니다. 리브랜딩과 마케팅 효과가 투자 심리를 자극하고 있습니다. 인도 통신 시장의 반등 주역인 해당 통신사의 실적 및 주가 회복세를 보여줍니다.", "source": "Livemint", "date": "2026-09-07 13:35", "url": "https://www.livemint.com/market/stock-market-news/vodafone-idea-share-price-up-4-today-rises-over-20-in-one-month-whats-fueling-telecom-stock-11788754415169.html", "category": "earnings", "importance": 3, "wl": false, "topic": "보다폰 아이디어 주가 상승세"}, {"title": "통신사 및 장비·부품사 총출동… 5G 테마 종목별 온도 차 명확 - 핀포인트뉴스", "summary": "국내 통신사와 네트워크 장비 및 부품사들이 총출동한 가운데 5G 관련 테마주의 종목별 주가 온도 차가 명확하게 나타나고 있습니다. 통신 서비스 실적과 장비 조달 상황에 따라 관련 기업들의 주식 시장 반응이 엇갈리고 있는 상황입니다. 통신사들의 투자 규모와 장비 업계의 실적 연동성을 시장 관점에서 조명하고 있습니다. 업계 동향을 파악하는 데 유용한 증권가 소식입니다.", "source": "핀포인트뉴스", "date": "2026-09-07 13:17", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484543", "category": "earnings", "importance": 3, "wl": false, "topic": "핀포인트뉴스 5g 테마"}, {"title": "BSNL Beats Jio and Airtel in Mobile Subscriber Additions in This Telecom Circle - telecomt", "summary": "인도 국영 통신사 BSNL이 특정 통신 서클(지역)에서 민간 거대 통신사인 지오(Jio)와 에어텔(Airtel)을 제치고 모바일 가입자 순증 수 1위를 기록했습니다. 인도 통신 시장에서 국영 통신사의 반격과 가입자 유치 경쟁 구도의 변화를 보여주는 주목할 만한 성과입니다. 신흥 통신 시장의 점유율 변동을 파악하는 데 중요한 지표입니다.", "source": "telecomtalk.info", "date": "2026-09-07 13:06", "url": "ht /* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
