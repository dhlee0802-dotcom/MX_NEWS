<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}

  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

st flight for 1,600-satellite LEO network", "summary": "릴라이언스 지오가 2027년 9월 저궤도 위성 네트워크 테스트를 목표로 위성 통신 사업을 추진 중임.", "source": "ET Telecom", "date": "2026-09-08 10:43", "url": "https://telecom.economictimes.indiatimes.com/news/portal-in-portal/satcom/reliance-jio-eyes-september-2027-test-flight-for-1600-satellite-leo-network/133903064", "category": "tech", "importance": 4, "sid": "satellite", "topic": "릴라이언스 지오 위성"}, {"title": "KT·KAIST, 피지컬 AI로 자동화 공장 만든다 - 조선일보", "summary": "KT와 KAIST가 피지컬 AI 기술을 활용하여 자동화 공장 구축을 추진함. 산업용 AI 네트워크 기술의 실질적 적용 사례로 주목됨.", "source": "조선일보", "date": "2026-09-08 10:39", "url": "https://www.chosun.com/economy/tech_it/2026/09/08/ZHKU76C3E5GBRP2ETCEIN2JWOQ/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt ai"}, {"title": "삼성전자, 美 특허 전략 강화…\"AI·6G·메모리 IP 영토 확장\" - 비즈월드", "summary": "삼성전자가 AI, 6G, 메모리 분야의 특허 전략을 강화합니다. 차세대 통신 기술 및 IP 영토 확장을 통해 글로벌 경쟁력을 확보하려는 전략입니다.", "source": "비즈월드", "date": "2026-09-08 10:22", "url": "http://www.bizwnews.com/news/articleView.html?idxno=145549", "category": "tech", "importance": 4, "sid": "satellite", "topic": "삼성전자 6g 전략"}, {"title": "막대한 AI 인프라 투자 규모…GSMA가 SKT 주목한 이유", "summary": "GSMA가 SK텔레콤의 AI 인프라 투자 방식을 주목함. 외부 자본 활용 및 그룹사 역량 결합을 통해 AI 데이터센터(AIDC) 구축의 통제권을 유지하면서 효율적인 투자를 진행하는 전략이 업계의 모범 사례로 평가됨. 통신사의 인프라 확장 모델로서 의미를 지님.", "source": "ZDNet Korea", "date": "2026-09-08 10:03", "url": "https://zdnet.co.kr/view/?no=20260908100356", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai 인프라"}, {"title": "애플 폴더블 출격 임박…삼성, 글로벌서 '웰컴 투 폴더블'", "summary": "삼성전자가 갤럭시Z폴드8 시리즈를 활용한 글로벌 옥외 광고 캠페인을 진행한다. 애플 첫 폴더블폰 공개가 임박한 시점에 세계 주요 도시에서 갤럭시 폴드 브랜드와 제품 경쟁력을 다시 부각하려는 의도로 풀이된다. 삼성전자는 세계 주요 랜드마크에서 '웰컴 투 폴더블' 캠페인을 전개한다.", "source": "전자신문", "date": "2026-09-08 09:57", "url": "https://www.etnews.com/20260908000095", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 폴더블 광고"}, {"title": "India joins US-led global initiative to shape next-generation 6G networks 5", "category": "policy", "importance": 4, "sid": "policy", "topic": "ofcom 광케이블 전환 마일스톤"}, {"title": "SK브로드밴드, DC 떼내자 성장재원 논란…SKT는 1.88조 확보 - PRESS9", "summary": "SK브로드밴드가 데이터센터(DC) 사업을 떼어내어 독립시키는 구조 개편을 단행한 가운데, 모회사 SK텔레콤이 1.88조 원 규모의 성장 재원을 확보하게 되었다. AI 및 클라우드 인프라 사업 투자를 위한 대규모 자본 재배치다. 통신 대기업의 대형 지배구조 및 사업 재편 딜이다.", "source": "PRESS9", "date": "2026-09-09 16:46", "url": "http://www.press9.kr/news/articleView.html?idxno=82485", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk브로드밴드 데이터센터 분할 및 sk텔레콤 재원 확보"}, {"title": "경찰 보급 보디캠 ‘중국산’ 의혹…KT컨소시엄 수사 - ichannela.com", "summary": "경찰청이 보급한 보디캠 사업에 중국산 장비가 국산으로 둔갑해 납품되었다는 의혹과 관련해 KT컨소시엄에 대한 경찰 수사가 진행 중이다. 공공 통신·보안 장비 조달 과정의 규제 위반 및 납품 비리 의혹을 다룬다. 대형 컨소시엄 사업의 법적 리스크다.", "source": "ichannela.com", "date": "2026-09-09 16:31", "url": "https://ichannela.com/news/detail/000000549534.do", "category": "policy", "importance": 4, "sid": "carrier", "topic": "경찰 보디캠 중국산 의혹 kt컨소시엄 수사"}, {"title": "Huawei heads to trial in US over Iran deals - The Arkansas Democrat-Gazette", "summary": "화웨이가 이란과의 불법 거래 및 대북제재 위반 등 혐의와 관련해 미국 법정에 출두하여 본격적인 재판을 받게 됐다. 글로벌 사업 과정에서의 제재 회피 혐의가 주요 쟁점이다. 화웨이의 사법 리스크가 중대 국면에 접어들었다.", "source": "The Arkansas Democrat-Gazette", "date": "2026-09-09 16:31", "url": "https://www.arkansasonline.com/news/2026/sep/09/huawei-heads-to-trial-in-us-over-iran-deals/", "category": "other", "importance": 4, "sid": "competitor", "topic": "화웨이 이란 거래 미국 재판 회부"}, {"title": "Huawei feels the enduring love of Spain's telcos – to EU's horror", "summary": "유럽연합의 강력한 퇴출 압박과 제재 노력에도 불구하고, 스페인 총리가 유용한 동맹으로 자리 잡으면서 현지 통신사들은 화웨이 장비를 열성적으로 도입하고 있다. 스페인 통신사들은 EU의 반대에도 불구하고 화웨이와의 오랜 협력 관계를 유지하며 네트워크 구축을 지속하고 있다. 이러한 행보는 유럽 전역의 대중국 통신장비 제재 기조와 대조를 이루며 글로벌 장비 시장의 경쟁 구도에 변수로 작용하고 있다. 스페인 통신 시장에서의 화웨이 입지 유지는 경쟁사들의 유럽 내 점유율 확대 전략에 타격을 줄 수 있다.", "source": "Light Reading", "date": "2026-09-09 16:30", "url": "https://www.lightreading.com/regulatory-politics/huawei-feels-the-enduring-love-of-spain-s-telcos-to-eu-s-horror", "category": "contract", "importance": 4, "sid": "competitor", "topic": "화웨이 스페인 수주"}, {"title": "Nokia Selected by Planters Broadband Cooperative to Build AI-ready Fiber Network for Under", "summary": "", "source": "NewswireToday", "date": "2026-09-09 16:00", "url": "https://www.newswiretoday.com/news/186832/Nokia-Selected-by-Planters-Broadband-Cooperative-to-Build-AI-ready-Fiber-Network-for-Underserved-Communities-in-Southeast-Georgia/", "category": "policy", "importance": 4, "sid": "competitor", "topic": ""}, {"title": "AT&T Business adds Amazon Leo to managed connectivity range - Telecompaper", "summary": "AT&T 비즈니스가 관리형 연결 서비스 범위에 아마존 레오 저궤도 위성 브로드밴드를 추가했다. 기업 고객의 네트워크 탄력성을 높이기 위한 전략적 행보이다. 위성통신 기반 상용 서비스의 저변이 확대되고 있다.", "source": "Telecompaper", "date": "2026-09-09 15:57", "url": "https://www.telecompaper.com/news/att-business-adds-amazon-leo-to-managed-connectivity-range--1582143", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 위성통신"}, {"title": "Satellite Broadband In India Gets Push As DCC Approves Spectrum Usage Charges - Swarajya", "summary": "", "source": "Swarajya", "date": "2026-09-09 15:37", "url": "https://swarajyamag.com/news-brief/satellite-broadband-in-india-gets-push-as-dcc-approves-spectrum-usage-charges", "category": "policy", "importance": 4, "sid": "policy", "topic": ""}, {"title": "KT클라우드, AI 데이터센터 1GW 확장…전력·구축 경쟁력 함께 키운다 - 위키리크스한국", "summary": "KT클라우드가 AI 데이터센터 용량을 1GW 규모로 대폭 확장하며 전력 인프라와 구축 경쟁력을 동시에 키워나가고 있다. 폭증하는 AI 연산 및 클라우드 수요를 소화하기 위한 대규모 인프라 투자 전략이다.", "source": "위키리크스한국", "date": "2026-09-09 15:20", "url": "https://www.wikileaks-kr.org/news/articleView.html?idxno=191800", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai 데이터센터 확장"}, {"title": "Apple forays into India's business messasging segment with Reliance Jio", "summary": "애플이 지역 통신사들과의 파트너십을 통해 미국, 영국, 독일, 프랑스, 스페인 등 주요 시장에서 비즈니스 RCS 도입을 점진적으로 활성화하고 있으며, 릴라이언스 지오(Reliance Jio)와 손잡고 인도 비즈니스 메시징 시장에도 진출한다. 서비스 가격은 통신사가 결정하며 시장별로 상이하다. 통신사와 빅테크 간의 차세대 메시징 협력 사례다.", "source": "ET Telecom", "date": "2026-09-09 15:16", "url": "https://telecom.economictimes.indiatimes.com/news/devices/apple-forays-into-indias-business-messasging-segment-with-reliance-jio/133955927", "category": "contract", "importance": 4, "sid": "carrier", "topic": "애플 비즈니스 메시징"}, {"title": "Huawei Technologies faces racketeering trial in US - BGNES", "summary": "화웨이가 미국 시장 내 과거 사업 거래와 관련하여 조직범죄 혐의로 정식 재판에 회부됐다. 글로벌 통신장비 시장 구도에 영향을 미칠 법적 리스크다.", "source": "BGNES", "date": "2026-09-09 15:14", "url": "http://www.bgnes.com/economy/huawei-technologies-faces-racketeering-trial-in-us", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 내 조직범죄 혐의 재판 회부"}, {"title": "민주당, 배달수수료 상한제 입법 재시동…국감 앞두고 플랫폼 압박", "summary": "더불어민주당이 국정감사를 앞두고 배달 수수료 상한제 도입 등 배달 플랫폼 규제 입법을 재추진한다. 공정거래위원회도 자율규제 한계를 인정하며 법제화 가능성을 열어둔 상태로, 업계와 전문가들은 합리적인 비용 분담 방안 설계를 강조하고 있다.", "source": "전자신문", "date": "2026-09-09 15:07", "url": "https://www.etnews.com/20260909000254", "category": "policy", "importance": 4, "sid": "policy", "topic": "더불어민주당 배달플랫폼 규제"}, {"title": "\"美 통신망 뒤흔든 '솔트 타이푼', 25% 잔존 '화웨이 장비 '가 침투 교두...", "summary": "미국 통신망을 뒤흔든 '솔트 타이펀' 사태의 원인으로 잔존한 중국산 화웨이 장비가 지목됐다. 주요국들이 고위험 장비 퇴출을 제도화한 가운데 미국은 FCC를 통해 철거를 지원하고 있다. 국내에서도 통신망 보안 강화를 위한 제도적 대책이 촉구되고 있다.", "source": "weekly.hankooki.com", "date": "2026-09-09 15:04", "url": "https://weekly.hankooki.com/news/articleView.html?idxno=7183314", "category": "policy", "importance": 4, "sid": "policy", "topic": "솔트 타이펀 화웨이 장비 안보 위협"}, {"title": "NTT Docomo and PLDT demonstrate weather-controlled base stations - Telecompaper", "summary": "NTT도코모와 PLDT가 날씨 예보와 연동되는 친환경 기지국 기술을 시연했다. 재생에너지 활용도를 극대화하는 통신 장비 운영 기술이다. 차세대 기지국 운용 효율화 방안을 보여준다.", "source": "Telecompaper", "date": "2026-09-09 14:52", "url": "https://www.telecompaper.com/news/ntt-docomo-and-pldt-demonstrate-weather-controlled-base-stations--1582124", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 친환경 기지국 ce": 4, "sid": "satellite", "topic": "소프트뱅크 sceye haps 실증 실험"}, {"title": "FCC Returns $3.08 Billion to Treasury after Spectrum Auction Pays Off Rip-and-Replace Loan", "summary": "미국 FCC가 주파수 경매 수익을 활용해 화웨이 등 중국산 장비 퇴출(Rip-and-Replace) 대출 상환을 완료하고 남은 자금을 국고로 반환했다. 미 정부 차원의 중국산 통신장비 제재 및 보안 강화 정책의 일환이다. 글로벌 통신장비 시장에 큰 영향을 미친다.", "source": "Broadband Breakfast", "date": "2026-09-09 05:14", "url": "https://broadbandbreakfast.com/fcc-returns-3-08-billion-to-treasury-after-spectrum-auction-pays-off-rip-and-replace-loan/", "category": "policy", "importance": 4, "sid": "policy", "topic": "fcc 장비제거"}, {"title": "Verizon’s multi-billion Corning fiber supply deal supports fiber broadband, AI expansion -", "summary": "버라이즌의 다년간 수십억 달러 규모 코닝 광섬유 공급 계약은 광대역 통신망과 AI 인프라 확장을 지원한다. 데이터 트래픽 증가에 대응하기 위한 핵심 네트워크 투자다. 통신 장비 및 자재 수요를 크게 견인한다.", "source": "Lightwave Online", "date": "2026-09-09 05:02", "url": "https://www.lightwaveonline.com/home/press-release/55403609/verizons-multi-billion-corning-fiber-supply-deal-supports-fiber-broadband-ai-expansion", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 광섬유"}, {"title": "AT&T Business Expands Work with Amazon Leo for Resilient Connectivity - Via Satellite", "summary": "AT&T 비즈니스가 복원력 있는 연결성을 위해 아마존 Leo 위성과의 협력을 확대한다. 저궤도 위성을 활용한 기업용 브로드밴드 서비스를 강화하는 내용이다. 위성통신 시장에서의 경쟁 구도를 보여준다.", "source": "Via Satellite", "date": "2026-09-09 04:25", "url": "https://www.satellitetoday.com/connectivity/2026/09/08/att-business-expands-work-with-amazon-leo-for-resilient-connectivity/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at앤트 위성"}, {"title": "AT&T Business Customers to Get Amazon Leo Satellite Broadband... Eventually - PCMag UK", "summary": "AT&T 비즈니스 고객들이 향후 아마존 레오 위성 브로드밴드 서비스를 이용할 수 있게 된다. 위성 통신을 활용한 기업용 연결성 서비스가 확대된다.", "source": "PCMag UK", "date": "2026-09-09 04:09", "url": "https://uk.pcmag.com/networking/167148/att-business-customers-to-get-amazon-leo-satellite-broadband-eventually", "cate s/gurufocus:ce2c634c9094b:0-verizon-edged-lower-as-80-million-fiber-miles-chase-ai-traffic/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광케이블 계약"}, {"title": "Rakuten Symphony cloud RAN tech powers Tawal’s multi-operator indoor network - SDxCentral", "summary": "라쿠텐 심포니의 클라우드 RAN 기술이 타왈의 다중 통신사 실내망 구축에 적용됐다. 클라우드 기반 가상화 무선 접속망 솔루션의 상용화 성과다. 오픈랜 생태계 확장을 보여주는 대형 계약이다.", "source": "SDxCentral", "date": "2026-09-09 01:28", "url": "https://www.sdxcentral.com/news/rakuten-symphony-cloud-ran-tech-powers-tawals-multi-operator-indoor-network/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "라쿠텐 심포니 타왈 실내망 구축"}, {"title": "Verizon powers American AI with billions-strong Corning fiber deal - SDxCentral", "summary": "버라이즌이 수십억 달러 규모의 코닝 광섬유 계약을 통해 미국 내 AI 인프라 확장을 위한 통신망 동력을 확보했다. 대규모 광대역 투자를 통해 고도화된 연결성 서비스를 제공할 계획이다.", "source": "SDxCentral", "date": "2026-09-09 01:28", "url": "https://www.sdxcentral.com/news/verizon-powers-american-ai-with-billions-strong-corning-fiber-deal/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광섬유 계약"}, {"title": "Bell, Rogers and Telus Lead Canada’s Wi-Fi 7 Shift as Fibre Pulls Ahead - iPhone in Canada", "summary": "벨, 로저스, 텔러스 등 캐나다 주요 통신사들이 광케이블 인프라 확충과 함께 와이파이 7(Wi-Fi 7) 기술 도입을 주도하고 있습니다. 유무선 홈브로드밴드 고도화 트렌드를 보여줍니다.", "source": "iPhone in Canada", "date": "2026-09-09 01:25", "url": "https://www.iphoneincanada.ca/2026/09/08/bell-rogers-and-telus-lead-canadas-wi-fi-7-shift-as-fibre-pulls-ahead/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "캐나다 통신사 와이파이7 전환"}, {"title": "Verizon and Corning announce fiber agreement | About Verizon - Verizon", "summary": "버라이즌이 코닝과 대규모 광케이블 공급 계약을 체결했습니다. FTTP 광대역 인터넷망 구축과 AI 인프라 확장을 뒷받침하기 위한 수조 원 규모의 전략적 파트너십입니다. 고속 데이터 트래픽 증가에 대응하기 위한 핵심 네트워크 투자입니다. 통신사의 인프라 조달 및 장기 공급망 확보를 나타냅니다.", "source": "Verizon", "date": "2026-09-09 01:22", "url": "https://www.verizon.com/about/news/verizon-corning-broadband-ai-fiber-agreement", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 광케이블"}, {"title": "삼성전자, 프랑스 미스트랄 AI에 지분 투자…반도체 특화 AI 공동 개발", "summary": "삼성전자가 프랑스의 대표 AI 기업 '미스트랄 AI'에 지분 투자를 단행하고 반도체 특화 AI 모델을 공동 개발하기 위한 전략적 파트너십을 체결했다. 유럽의 AI 거점과의 협력을 통해 AI 경쟁력을 강화하려는 포석이다.", "source": "ZDNet Korea", "date": "2026-09-09 01:00", "url": "https://zdnet.co.kr/view/?no=20260908192706", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성전자 미스트랄 ai 지분 투자 협력"}, {"title": "Verizon loads up on Corning's fiber for network expansion and AI infrastructure", "summary": "버라이즌은 네트워크 확장 및 인공지능(AI) 인프라 지원을 위해 코닝과 수십억 달러 규모의 광케이블 공급 계약을 체결했다. 계약에 따라 2027년부터 2032년까지 8000만 마일 이상의 광케이블을 공급받게 된다. 이번 대규모 투자는 버라이즌의 통신망 고도화와 AI 연계 인프라 구축 가속화를 위한 전략적 행보로 평가된다.", "source": "Light Reading", "date": "2026-09-09 00:56", "url": "https://www.lightreading.com/data-centers/verizon-loads-up-on-corning-s-fiber-for-network-expansion-and-ai-infrastructure", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 장비계약"}, {"title": "Ericsson says telco-grade AI RAN must deliver measurable gains at scale", "summary": "에릭슨의 전략적 RAN 리더십 총괄 가브리엘 포글란더는 RCR테크 텔코 AI 포럼에서 텔코급 AI RAN이 대규모 환경에서 측정 가능한 성과를 반드시 입증해야 한다고 강조했다. AI-RAN이 네트워크 전반에 AI를 내재화하는 광범위한 전환의 교두보 역할을 해야 한다는 설명이다. 글로벌 통신장비 경쟁사가 차세대 무선 접속망(RAN)과 AI의 결합 방향성을 제시한 핵심 발언이다. 삼성전자 네트워크사업부의 AI 기반 6G 및 차세대 네트워크 전략 수립에 시사점을 준다.", "source": "RCR Wireless", "date": "2026-09-09 00:44", "url": "https://rcrwireless.com/20260908/carriers/ericsson-ai-ran", "category": "tech", "importance": 4, "sid": "competitor", "topic": "에릭슨 ai"}, {"title": "Corning Secures Another Multi-Billion-Dollar Long-Term Deal with Verizon as AI Fiber Deman", "summary": "AI 광섬유 수요 증가 속에서 코닝이 버라이즌과 또 다른 수십억 달러 규모의 장기 계약을 체결했다. 통신 인프라 시장의 대형 수주 계약이다.", "source": "finance.biggo.com", "date": "2026-09-09 00:35", "url": "https://finance.biggo.com/news/b2d3dbda-4a06-4b4d-bc0d-7246a65f5c6e", "category": "contract", "importance": 4, "sid": "carrier", "topic": "코닝 버라이즌"}, {"title": "Digital Communications Commission approves TRAI recommendations on Satcom Spectrum - PGuru", "summary": "디지털통신위원회(DCC)가 위성통신(Satcom) 주파수에 대한 TRAI의 권고안을 최종 승인했습니다. 인도 내 위성통신 상용화를 위한 규제적 기반이 마련되었습니다. 위성 사업자들의 시장 진입이 가속화될 전망입니다. 통신 규제 환경의 큰 변화입니다.", "source": "PGurus", "date": "2026-09-09 00:33", "url": "https://www.pgurus.com/digital-communications-commission-approves-trai-recommendations-on-satcom-spectrum/", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도위성통신 정책"}, {"title": "Verizon and Corning announce multi-year, multi-billion dollar supply agreement for broadba", "summary": "버라이즌과 코닝이 광대역 통신망 구축을 위한 다년간 수십억 달러 규모의 대형 공급 계약을 체결했습니다. 미국 전역의 통신 인프라 현대화와 고속 인터넷 보급을 위한 핵심 물량입니다. 장비 공급업체와 통신사 간의 장기 파트너십을 재확인했습니다. 인프라 산업 전반에 안정적인 성장 동력을 제공합니다.", "source": "WebWire", "date": "2026-09-09 00:30", "url": "http://webwire.com/ViewPressRel.asp?SESSIONID=&aId=360172", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 다년간 공급 계약"}, {"title": "China’s Huawei Technologies faces racketeering trial in New York - Boston Herald", "summary": "중국 화웨이 테크놀로지가 미국 뉴욕 법원에서 조직범죄 혐의 관련 재판을 앞두고 있습니다. 미·중 기술 패권 갈등 속에서 화웨이의 법적 리스크가 심화되는 국면을 다룹니다.", "source": "Boston Herald", "date": "2026-09-09 00:28", "url": "https://www.bostonherald.com/2026/09/08/huawei-racketeering-trial/", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 뉴욕 공판"}, {"title": "Stronger Connections, Smarter Growth: Spectrum and Southern Bank Build a Future-Ready Netw", "summary": "차터 커뮤니케이션스의 스펙트럼(Spectrum) 브랜드가 서던 뱅크와 손잡고 미래 지향적인 기업용 네트워크 인프라를 구축한다. 통신사의 B2B 인프라 서비스 확장 사례이다.", "source": "Charter Communications", "date": "2026-09-09 00:24", "url": "https://corporate.charter.com/newsroom/spectrum-fiber-internet-powers-southern-bank-growth", "category": "contract", "importance": 4, "sid": "carrier", "topic": "차터커뮤니케이션스 네트워크"}, {"title": "Verizon, Corning ink fibre supply deal - Mobile World Live", "summary": "버라이즌(Verizo e": "Lessons from a war zone: how Ukraine's Kyivstar harnesses Starlink to keep users online", "summary": "우크라이나 통신사 키이스타가 전시 상황에서 통신망 유지를 위해 스타링크 위성통신을 하이브리드 방식으로 도입했습니다. 750만 명 이상의 가입자가 지상망과 위성망을 결합한 시스템을 이용하고 있습니다. 이는 전시 상황에서 통신 인프라의 회복탄력성을 확보하기 위한 전략적 조치입니다.", "source": "Light Reading", "date": "2026-09-10 16:00", "url": "https://www.lightreading.com/satellite/lessons-from-a-war-zone-how-ukraine-s-kyivstar-harnesses-starlink-to-keep-users-online", "category": "tech", "importance": 4, "sid": "satellite", "topic": "키이스타 스타링크"}, {"title": "Nokia and Orange France complete first worldwide live service provider network tomography ", "summary": "노키아와 오렌지 프랑스가 세계 최초로 라이브 서비스 제공업체 네트워크 토모그래피 기술을 성공적으로 구현했다. 이 기술은 네트워크 내부의 트래픽 흐름을 정밀하게 분석하여 성능을 최적화한다. 노키아는 이번 성과를 통해 AI 기반 네트워크 관리 기술의 선두 주자임을 입증했다.", "source": "Nokia", "date": "2026-09-10 16:00", "url": "https://www.nokia.com/newsroom/nokia-and-orange-france-complete-first-worldwide-live-service-provider-network-tomography-trial-supporting-ai-ready-infrastructure/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 오렌지 협력"}, {"title": "KT, ‘AI 네트워크 ’ HD현대삼호 조선소에 깐다", "summary": "과기정통부와 NIA가 주관하는 고성능 AI 네트워크 기반조성 사업에 KT 컨소시엄이 참여한다. KT는 지난 7월 삼성전자, HD현대삼호 등과 함께 우선협상대상자로 선정되었다. 조선소 현장에 AI 네트워크를 적용해 산업용 통신 가치를 검증한다.", "source": "dailian.co.kr", "date": "2026-09-10 16:00", "url": "https://www.dailian.co.kr/news/view/1688943/?sc=Naver", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt hd현대삼호 고성능 ai 네트워크"}, {"title": "KT, 조선소에 'AI 용접로봇' 투입...AI 네트워크 산업현장 적용", "summary": "KT가 HD현대삼호 조선소에 AI 용접로봇을 투입하기 위한 고성능 AI 네트워크 구축 사업을 추진한다. KT는 지난 7월 삼성전자 등과 함께 우선협상대상자로 선정된 바 있다. AI를 활용해 통신망을 지능적으로 운영하고 피지컬 AI 환경을 제공한다.", "source": "fnnews.com", "date": "2026-09-10 15:57", "url": "https://www.fnnews.com/news/202609101533384918", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt hd현대삼호 ai 용접로봇 투입"}, {"title": "KT, HD현대삼호 조선소에 고성능 AI 네트워크 구축⋯피지컬 AI 실증 본격...", "summary": "KT가 과기 e": "전자신문", "date": "2026-09-10 14:17", "url": "https://www.etnews.com/20260910000282", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt lgu+ ai"}, {"title": "[단독] 라포랩스, SK스토아 인수 재시동…SK텔레콤과 SPA 체결", "summary": "라포랩스가 SK텔레콤과 SK스토아 인수를 위한 수정 주식매매계약(SPA)을 체결했습니다. 지난 7월 자진 철회 이후 재추진되는 건으로, 통신사의 비통신 자산 매각 전략의 일환입니다.", "source": "전자신문", "date": "2026-09-10 14:13", "url": "https://www.etnews.com/20260910000271", "category": "contract", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 sk스토아 매각"}, {"title": "Verizon Waves Off Starlink, Bets On Cities And Old Phone Buildings - Stocktwits", "summary": "버라이즌이 스페이스X의 스타링크 등 위성통신 대신 도심 지역 및 기존 유선 인프라와 지상망 강화에 집중하는 전략을 고수하고 있다. 위성통신과 지상 통신 간 전략적 차이를 보여준다.", "source": "Stocktwits", "date": "2026-09-10 13:47", "url": "https://stocktwits.com/news-articles/markets/equity/verizon-waves-off-starlink-bets-on-cities-and-old-phone-buildings/cZt7idaRJCG", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 위성통신 전략"}, {"title": "“통신망에 남은 중국 통신 장비 정부 보안대책 필요”", "summary": "미국, 영국, 호주, EU 등 글로벌 주요국들이 중국산 통신 장비를 국가안보 및 공급망 위협 요소로 규정하고 퇴출을 제도화하고 있다. FCC의 철거 예산 지원과 영국의 2027년 시한 설정 등이 대표적이다. 국내에서도 통신망에 남은 고위험 장비에 대한 정부 차원의 보안 대책이 요구되고 있다.", "source": "knnews.co.kr", "date": "2026-09-10 13:40", "url": "https://www.knnews.co.kr/news/articleView.php?idxno=1550584", "category": "policy", "importance": 4, "sid": "policy", "topic": "글로벌 주요국 고위험 통신 장비 규제"}, {"title": "AI시대 新유형 특화망 발굴 착수…이용지침 만든다 - 전자신문", "summary": "과기정통부가 AI 시대에 대응하여 특화망(이음5G) 이용 지침을 마련하고 신유형 발굴에 착수합니다. 국내 통신 정책 및 규제 변화에 관한 내용입니다.", "source": "전자신문", "date": "2026-09-10 13:36", "url": "https://www.etnews.com/20260910000241", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 특화망"}, {"title": "\"AI로 위성 영상 실시간 분석\"…한화시스템, '우주AI 솔루션' 첫 선", "summary": "한화시스템이 우주항공 및 AI 분야 대규모 투자 계획의 일환으로 초저궤도 SAR 위성과 우주 AI 데이터센터, 저궤도 위성 통신망 구축 등에 약 20조원을 투입한다고 밝혔다. 위성 영상을 실제 의사결정에 활용하는 우주 AI 솔루션을 선보이며 관련 시장 공략에 나선다.", "source": "newsworks.co.kr", 이 주도하는 '모두의 AI' 컨소시엄에 합류했다. 통신사와 금융권이 협력하여 AI 생태계를 확장하는 대표적 B2B 서비스 개발 사례이다.", "source": "연합뉴스", "date": "2026-09-10 10:50", "url": "https://www.yna.co.kr/amp/view/AKR20260910055000002", "category": "tech", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 ai컨소시엄"}, {"title": "Verizon And Corning Sign Multi-Billion-Dollar Fiber Deal For Broadband And AI Infrastructu", "summary": "버라이즌이 코닝과 광대역 및 AI 인프라 확장을 위해 수십억 달러 규모의 대형 광케이블 공급 계약을 체결했다. 이번 계약을 통해 8,000만 마일 이상의 고밀도 광섬유를 확보하여 초고속 인터넷 및 AI 데이터센터 트래픽에 대응한다. 양사는 수년에 걸친 파트너십을 통해 미국 전역의 네트워크 고도화를 가속화할 방침이다. 통신사의 대규모 인프라 투자 계약으로 업계 파급력이 크다.", "source": "Pulse 2.0", "date": "2026-09-10 10:42", "url": "https://pulse2.com/verizon-and-corning-sign-multi-billion-dollar-fiber-deal-for-broadband-and-ai-infrastructure/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 코닝 광케이블 계약"}, {"title": "2027년 통신장비 쇼티지 온다∙∙∙한국 중견업체 반사이익 주목 - leadeconomy.co.kr", "summary": "2027년 글로벌 통신장비 시장에 심각한 공급 부족 현상이 닥칠 것으로 전망되면서 국내 중견 장비 및 부품 업체들의 반사이익이 주목받고 있습니다. AI 데이터센터 투자와 맞물려 통신 인프라 수요가 급증하는 반면 주요 벤더들의 생산 능력이 한계에 달할 것이라는 분석입니다. 관련 수혜주에 대한 기대감이 커지고 있습니다.", "source": "leadeconomy.co.kr", "date": "2026-09-10 10:31", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9652", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "통신장비 쇼티지 전망"}, {"title": "2027년 통신장비 쇼티지 온다∙∙∙한국 중견업체 반사이익 주목 - 리드경제", "summary": "2027년 글로벌 통신장비 시장에 공급 부족 쇼티지가 발생할 것으로 전망되는 가운데, 국내 중견 통신장비 및 부품업체들이 누릴 반사이익에 대한 기대감이 높아지고 있다. 장비 수급 불균형에 따른 업계 지형 변화 분석이다.", "source": "리드경제", "date": "2026-09-10 10:31", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9652", "category": "tech", "importance": 4, "sid": "competitor", "topic": "통신장비 쇼티지 전망 중견업체 반사이익"}, {"title": "Charter at Goldman Sachs conference: growth push after Cox deal - Investing.com", "summary": "차터 커뮤니케이션스가 골드만 삭스 컨퍼런스에서 콕스(Cox) 인수 거래 이후의 본격적인 성장 추진 전략을 밝혔다. 케이블 및 브로드밴드 사업자의 대규모 확장 계획을 가늠할 수 있다. 주요 통신사의 경영 전략 발표다.", "source": "Investing.com", " impress.co.jp", "summary": "도코모가 필리핀에서 태양광 이용률을 38%에서 61%로 높인 그린 기지국 실증 결과를 공개했다.", "source": "k-tai.watch.impress.co.jp", "date": "2026-09-10 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2139533.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "ntt 도코모 pldt 그린 기지국 실증"}, {"title": "[石野純也の「スマホとお金」]5Gも光も使えて通信障害に強い、すぐにネットが使える新サービス「auひかりプラス」の隠れた魅力と裏側", "summary": "KDDI가 기존 광회선(FTTH)에 더해 4G와 5G 모바일 통신까지 하나의 계약으로 모두 지원하는 새로운 고정 통신 서비스 'au히かりプラス'를 도입한다. 유무선 통합 서비스를 통해 사용자가 루터를 가지고 즉시 통신을 시작할 수 있는 편의성을 제공한다. 일본 이동통신 시장에서 유무선 결합 및 신규 서비스 경쟁력을 강화하는 전략적 행보이다. 삼성전자의 일본 통신사 대상 장비 및 홈 게이트웨이 영업에 시사점을 준다.", "source": "ケータイ Watch", "date": "2026-09-10 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/column/value/2139538.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kddi 유무선 통합 서비스 au히かり플러스 도입"}, {"title": "ドコモ、フィリピンでグリーン基地局実証 太陽光利用率38％→61％ - ケータイ Watch", "summary": "도코모가 필리핀에서 친환경 기지국 실증을 통해 태양광 이용률을 대폭 끌어올렸다. 기지국 운영의 탄소 감축 효과를 입증했다. 통신 인프라의 친환경 전환 기술이다.", "source": "ケータイ Watch", "date": "2026-09-10 00:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2139533.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 친환경 기지국"}, {"title": "PLDT and DoCoMo demo base station energy innovation - Developing Telecoms", "summary": "PLDT와 도코모가 기지국 에너지 혁신을 위한 친환경 솔루션 데모를 공동 개최했다. 통신 장비의 전력 효율을 높이고 탄소 배출을 줄이기 위한 기술 협력이다.", "source": "Developing Telecoms", "date": "2026-09-10 00:00", "url": "https://developingtelecoms.com/telecom-technology/energy-sustainability/20798-pldt-and-docomo-demo-base-station-energy-innovation.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "도코모 친환경 기지국"}], "2026-09-11": [{"title": "US Plans to Push Huawei Out of Africa, Where It Holds 52% of the 5G Market - mediasat.info", "summary": "미국 정부가 5G 시장의 절반 이상을 장악하고 있는 아프리카 지역에서 화웨이의 영향력을 줄이기 위해 본격적인 견제와 대항마 지원에 나섰다. 중국산 통신장비 배제를 위한 지정학적 경쟁이 심화되는 양상이다.", "source": "mediasat.info", "date": "2026 petitor", "topic": "노키아 ai 팩토리 수주"}, {"title": "Amazon Leo adds new Arianespace launches - Advanced Television", "summary": "아마존의 저궤도 위성 프로젝트(Amazon Leo)가 아리안스페이스와 추가 발사 계약을 체결했다. Kuiper 콘스탈레이션 구축을 위한 발사 수주 및 협력 확대의 일환이다.", "source": "Advanced Television", "date": "2026-09-11 20:53", "url": "https://www.advanced-television.com/2026/09/11/amazon-leo-adds-new-arianespace-launches/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아마존 위성수주"}, {"title": "Vietnam Auctions 900 MHz Spectrum for 4G, 5G Expansion - Telecom Review Asia", "summary": "베트남이 4G 및 5G 네트워크 확장을 위해 900MHz 대역 주파수 경매를 진행했다. 동남아 통신 시장의 주파수 확보 및 인프라 투자 가속화를 보여주는 규제·정책 이벤트다.", "source": "Telecom Review Asia", "date": "2026-09-11 20:43", "url": "https://www.telecomreviewasia.com/news/network-news/30245-vietnam-auctions-900-mhz-spectrum-for-4g-5g-expansion/", "category": "policy", "importance": 4, "sid": "policy", "topic": "베트남 900mhz 주파수 경매"}, {"title": "SBI Agreed To Provide $3.5 Billion Of Debt Financing To Vodafone Idea - Times Now", "summary": "SBI 컨소시엄이 보다폰 인디아(Vodafone Idea)에 35억 달러(약 35,000억 원) 규모의 부채 금융 제공에 합의했다. 이번 자금 조달로 보다폰 인디아는 턴어라운드와 재무 구조 개선에 속도를 낼 전망이다. 인도 통신 시장에서 대규모 자금 확보가 이루어지며 장비 투자 확대 가능성이 제기된다. 주요 통신사의 대규모 자금 조달은 글로벌 통신장비 시장의 투자 심리에 긍정적 영향을 미칠 것으로 평가된다.", "source": "Times Now", "date": "2026-09-11 20:05", "url": "https://www.timesnownews.com/business-economy/companies/sbi-agreed-to-provide-3-5-billion-of-debt-financing-to-vodafone-idea-article-156139812", "category": "contract", "importance": 4, "sid": "competitor", "topic": "보다폰인도네시아 수주"}, {"title": "Vodafone Idea secures $3.5bn debt backing from SBI-led lenders - Developing Telecoms", "summary": "인도 통신사 보다폰 아이디어가 SBI 주도 대출 기관으로부터 35억 달러 규모의 부채 자금 조달을 확보했다. 이번 자금 유치를 통해 네트워크 투자 및 인프라 확장을 가속화할 전망이다. 인도 통신 시장의 주요 재무 건전성 개선 사례로 의미가 크다.", "source": "Developing Telecoms", "date": "2026-09-11 19:59", "url": "https://developingtelecoms.com/telecom-business/operator-news/20815-vodafone-idea-secures-3-5bn-debt-backing-from-sbi-led-lenders.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보더폰인도 자금조달"}, {"title": "Huawei labeled a 'criminal enterprise' as trial begins in US - NewsBytes", "summary": "미국에서 열린 재판에서 화웨이가 '범죄 기업'으로 지목되며 본격적인 공방이 시작됐다. 미 정부의 대중국 제재 기조 속에서 화웨이의 법적 압박이 가중되는 국면이다. 주요 경쟁사의 법적 리스크 심화는 글로벌 장비 시장의 경쟁 지형에 큰 파장을 일으킨다. 향후 제재 수위 변화를 예의주시해야 한다.", "source": "NewsBytes", "date": "2026-09-11 19:57", "url": "https://www.newsbytesapp.com/news/business/us-prosecutor-calls-huawei-a-criminal-enterprise-as-trial-begins/story", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 미국 재판"}, {"title": "AT&T Business expands connectivity with Amazon Leo satellite - TipRanks", "summary": "AT&T 비즈니스가 아마존 카이퍼와의 협력을 통해 기업용 위성 연결 서비스를 확장한다. 기업 고객에게 지상망과 위성이 결합된 끊김 없는 하이브리드 네트워크를 제공한다. B2B 통신 시장에서 위성 기술의 활용도가 한층 높아졌다.", "source": "TipRanks", "date": "2026-09-11 19:57", "url": "https://www.tipranks.com/news/the-fly/att-business-expands-connectivity-with-amazon-leo-satellite-thefly-news", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 비즈니스 아마존 카이퍼 위성 연동"}, {"title": "Jio is putting 1600 satellites in orbit, will provide satellite internet like Starlink: Re", "summary": "릴라이언스 지오가 1600개의 위성을 궤도에 올려 위성 인터넷 서비스를 제공할 계획임. 인도 시장의 위성통신 경쟁 본격화임.", "source": "India Today", "date": "2026-09-11 19:49", "url": "https://www.indiatoday.in/amp/technology/news/story/jio-is-putting-1600-satellites-in-orbit-will-provide-satellite-internet-like-starlink-report-2992432-2026-09-11", "category": "tech", "importance": 4, "sid": "satellite", "topic": "릴라이언스 지오 위성"}, {"title": "Docomo lights Nokia open RAN base station - Mobile World Live", "summary": "일본 NTT도코모가 노키아의 최신 오픈랜(Open RAN) 기지국 장비를 상용망에 도입하고 운용을 시작했다. 멀티벤더 환경에서의 오픈랜 상용화를 가속화하는 중요한 진전으로 평가된다. 향후 개방형 무선 접속망 시장 확대에 긍정적인 영향을 미칠 것으로 기대된다.", "source": "Mobile World Live", "date": "2026-09-11 19:05", "url": "https://www.mobileworldlive.com/docomo/docomo-lights-nokia-open-ran-base-station/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 오픈랜"}, {"title": "Nokia and Orange claim a first with network tomography trial - Telecoms", "summary": "노키아와 오렌지가 세계 최초의 네트워크 토모그래피 라이브 시험에 성공했다. AI 기반 분석을 통해 통신망 내부를 투시하듯 상태를 파악하는 기술이다. 양사의 기술 협력 성과가 주목받고 있다.", "source": "Telecoms", "date": "2026-09-11 19:04", "url": "https://www.telecoms.com/fibre/nokia-and-orange-claim-a-first-with-network-tomography-trial", "category": "tech", "importance": 4, "sid": "competitor", "topic": "노키아 오렌지 ai 네트워크"}, {"title": "AT&T Business Expands Partnership With Amazon Leo - Inside Towers", "summary": "AT&T 비즈니스가 아마존의 저궤도 위성 통신 서비스인 '아마존 레오(Amazon Leo)'와의 파트너십을 확대한다. 기업 및 공공 부문 고객을 대상으로 위성 브로드밴드 서비스 연계 네트워크를 확장한다. 위성통신과 지상파 통신의 결합 전략을 보여준다.", "source": "Inside Towers", "date": "2026-09-11 19:02", "url": "https://insidetowers.com/att-business-expands-partnership-with-amazon-leo/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "at&t 아마존"}, {"title": "Iridium, Deutsche Telekom IoT, Toyota demo voice messaging over satellite - Computer Weekl", "summary": "이리디움, 도이치텔레콤 IoT, 토요타가 저궤도 위성을 통한 위성 음성 메시징 기술 시연을 성공적으로 마쳤다. 지상망 음영 지역을 해소하기 위한 위성-셀룰러 연동 기술 발전을 입증한다.", "source": "Computer Weekly", "date": "2026-09-11 18:56", "url": "https://www.computerweekly.com/news/366650197/Iridium-Deutsche-Telekom-IoT-Toyota-demo-voice-messaging-over-satellite", "category": "tech", "importance": 4, "sid": "satellite", "topic": "도이치텔레콤 위성통신"}, {"title": "Russia Launches First 5G Networks After Years of Delays - The Moscow Times", "summary": "러시아가 수년간의 지연 끝에 첫 5G 네트워크를 공식 출시했다. 서방의 제재와 장비 조달 난항 속에서 통신 인프라 구축을 강행한 것으로, 향후 러시아 통신 시장과 장비 공급망에 미치는 영향이 주목된다.", "source": "The Moscow Times", "date": "2026-09-11 18:56", "url": "https://www.themoscowtimes.com/2026/09/11/russia-launches-first-5g-networks-after-years-of-delays-a93685", "category": "tech", "importance": 4, "sid": "carrier", "topic": "러시아 첫 5g 네트워크 상용화"}, {"title": "Deutsche Telekom (XTRA:DTE) Revamps Its Leadership Team, Is The Valuation Gap Still Justif", "summary": "도이치텔레콤이 리더십 팀을 개편하며 경영 체제를 정비했다. 최고경영진 교체 및 조직 개편을 통해 미래 전략 추진에 박차를 가하고 있다. 유럽 최대 통신사의 경영 전략 변화로 주목받고 있다.", "source": "simplywall.st", "date": "2026-09-11 18:48", "url": "https://simplywall.st/stocks/de/telecom/etr-dte/deutsche-telekom-shares/news/deutsche-telekom-xtradte-revamps-its-leadership-team-is-the", "category": "exec", "importance": 4, "sid": "carrier", "topic": "도이치텔레콤 경영진"}, {"title": "つながりやすさ改善？ドコモ、ノキア製最新型基地局運用開始 - jetstream.blog", "summary": "NTT 도코모가 노키아의 최신형 기지국 장비를 도입해 통신 연결성과 망 품질 개선에 나섰다. 멀티벤더 오픈랜 환경에서 장비 운용 효율성을 높이는 계기가 될 전망이다.", "source": "jetstream.blog", "date": "2026-09-11 18:41", "url": "https://jetstream.blog/2026/09/11/docomo-new-nokia-oran-base-station-launch/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 도코모 기지국 공급"}, {"title": "Vodafone Idea Gets $3.5 Billion Loan From SBI-Led Lenders: Report - APAC Media", "summary": "보다폰 아이디어가 SBI 주도 은행단으로부터 35억 달러의 대출을 승인받아 재무적 숨통이 트였다는 보도입니다.", "source": "APAC Media", "date": "2026-09-11 18:41", "url": "https://apacnewsnetwork.com/2026/09/vodafone-idea-3-5-billion-loan-sbi/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰인도 자금 조달"}, {"title": "India approves 5% spectrum charge for satellite players – report", "summary": "인도 정부가 위성 사업자에 대해 5%의 스펙트럼 사용료를 부과하는 방안을 승인하며 규제 불확실성을 해소했다. 이번 조치는 그동안 지연되었던 저궤도(LEO) 및 중궤도(MEO) 광대역 서비스의 현지 출시를 가속화할 전망이다. 인도 위성통신 시장의 경쟁이 본격화되는 계기가 될 것으로 보인다.", "source": "Light Reading", "date": "2026-09-11 18:31", "url": "https://www.lightreading.com/satellite/india-approves-5-spectrum-charge-for-satellite-players-report", "category": "policy", "importance": 4, "sid": "satellite", "topic": "인도 위성 규제"}, {"title": "Ericsson deploys private 5G network at US airport - Mobile Europe", "summary": "에릭슨이 미국 공항 내 프라이빗 5G 네트워크 배포를 완료했다. 공항이라는 특수 환경에서의 통신 인프라 수주 및 구축으로, 경쟁사의 버티컬 시장 공략 확대를 보여준다.", "source": "Mobile Europe", "date": "2026-09-11 18:16", "url": "https://www  "other", "importance": 4, "sid": "policy", "topic": ""}, {"title": "대한항공·아시아나, 15일부터 ‘스타링크’ 기내 무료 와이파이 개시 - 매일일보", "summary": "대한항공과 아시아나항공이 오는 15일부터 스페이스X의 스타링크를 활용한 기내 무료 와이파이 서비스를 전격 개시한다. 전 좌석을 대상으로 고속 인터넷을 무료 제공하며 항공 업계에 새로운 바람을 일으키고 있다.", "source": "매일일보", "date": "2026-09-11 17:53", "url": "https://www.m-i.kr/news/articleViewAmp.html?idxno=1413046", "category": "contract", "importance": 4, "sid": "carrier", "topic": "대한항공 아시아나항공 스타링크 도입"}, {"title": "정부, SMR 특별법 시행…2035년 경수형 상용화 본격", "summary": "과학기술정보통신부가 소형모듈원자로 개발 촉진 및 지원에 관한 특별법과 시행령을 시행하며 2035년 경수형 상용화를 본격 추진한다. 5년마다 시스템 개발 기본계획을 수립하고 연도별 시행계획을 마련할 방침이다.", "source": "dailian.co.kr", "date": "2026-09-11 17:52", "url": "https://www.dailian.co.kr/news/view/1689485/?sc=Naver", "category": "policy", "importance": 4, "sid": "policy", "topic": "과기정통부 smr정책"}, {"title": "'중동 화염' 뚫고 … 수주 휩쓰는 삼성E&A", "summary": "삼성E&A가 해외 건설 수주 가뭄 속에서 대형 화공 플랜트 프로젝트를 잇달아 따내며 수주 실적을 빠르게 확대하고 있다. 회사의 해외 사업 경쟁력을 보여준다.", "source": "매일경제 IT", "date": "2026-09-11 17:50", "url": "https://www.mk.co.kr/news/realestate/12150688", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성e&a 해외수주"}, {"title": "대한항공 15일 '기내 무료 와이파이' 제공..스타링크 기반 - v.daum.net", "summary": "대한항공이 오는 15일부터 스타링크 기반의 '기내 무료 와이파이' 서비스를 제공하기 시작한다. 항공사들의 저궤도 위성 통신 도입이 본격화되고 있다.", "source": "v.daum.net", "date": "2026-09-11 17:42", "url": "https://v.daum.net/v/9MiIWo9UA3?f=p", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스타링크 위성수주"}, {"title": "A Historic Deal Between Apple and Amazon to Boost Satellite Services on the iPhone - آي-فو", "summary": "애플과 아마존이 아이폰 위성 서비스 강화를 위해 협력합니다. 위성통신 기술을 활용한 모바일 서비스 혁신 사례입니다.", "source": "آي-فون إسلام", "date": "2026-09-11 17:40", "url": "https://iphoneislam.com/language/en/2026/04/a-historic-deal-between-apple-and-amazon-to-boost-satellite-services-on-the-iphone/165317", "category": "tech", "importance": 4, "sid": "satellite", "topic": "애플 아마존 위성 협력"}, {"title": "3만원 기내 와이파이 무료로…대한항공·아시아나 스 cationstoday.co.in/att-bundles-amazon-leo-satellite-broadband/", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 위성"}, {"title": "KDDIとWi2、5Gミリ波をバックホールに活用 “ロッキン2026”で導入する大容量フリーWi-Fiの仕組み", "summary": "KDDIとワイヤ・アンド・ワイヤレスは、野外フェス「ROCK IN JAPAN FESTIVAL 2026」において5Gミリ波をバックホールに活用したキャリアフリーWi-Fiを商用導入する。本ソリューションは回線や端末のミリ波対応を問わず利用でき、混雑する飲食エリアなどの通信環境を大幅に強化する。さらにStarlink活用Wi-FiやDual Band Massive MIMO対応の車載型基地局4台を配備し、快適なイベント運営を支援する…", "source": "ITmedia Mobile", "date": "2026-09-11 12:28", "url": "https://www.itmedia.co.jp/mobile/articles/2609/11/news069.html", "category": "policy", "importance": 4, "sid": "satellite", "topic": ""}, {"title": "KDDI、ロッキンで5Gミリ波バックホールのフリーWi-Fiを提供", "summary": "KDDI가 대형 야외 음악 페스티벌에서 5G 밀리파를 백홀로 활용하는 대용량 프리 와이파이 서비스를 제공한다. 통신사에 관계없이 누구나 이용할 수 있어 대규모 군중 밀집 지역의 통신 품질을 대폭 개선한다. 차세대 무선 기술의 실증 무대로 활용된다. 현장 통신 인프라 역량을 보여주는 사례다.", "source": "ケータイ Watch", "date": "2026-09-11 12:21", "url": "https://k-tai.watch.impress.co.jp/docs/news/2140162.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kddi 밀리파 wi-fi"}, {"title": "KT Deploys 5G and AI Welding Robots at HD Hyundai Samho Shipyard in South Korea, Accelerat", "summary": "KT가 HD현대삼호중공업 조선소에 5G 통신망과 AI 용접 로봇을 구축하여 현장 디지털 전환과 피지컬 AI 상용화를 가속화한다. 국내 B2B 통신 인프라 공급의 대표적 사례다.", "source": "finance.biggo.com", "date": "2026-09-11 12:09", "url": "https://finance.biggo.com/news/1ac49668-54cf-46b8-b4e9-1c071d55c370", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 현대삼호중공업 5g 로봇"}, {"title": "Verizon signs optical fiber deal with Corning to support its broadband, AI push - internat", "summary": "버라이즌이 브로드밴드 및 AI 인프라 확장을 위해 코닝과 대규모 광케이블 공급 계약을 체결했다. AI 데이터센터 및 고속 통신망 구축을 위한 필수 인프라 확보 조치다. 통신사의 대규모 설비 투자는 장비 및 부품 생태계에 큰 영향을 미친다.", "source": "internationalfinance.com", "date": "2026-09-11 12:00", "url": "https://internationalfinance.com/telecom/verizon-signs-optical-fiber-deal-with-corning-to-support-its-broadband-ai-push/", "category": "contract", "imp opic": "삼성전자 6g총회"}, {"title": "FCC Interested in 1.6 GHz Auction in 2028, NTIA Official Says - Broadband Breakfast", "summary": "미국 FCC가 2028년 1.6 GHz 대역 주파수 경매 개최에 관심을 보이고 있다고 NTIA 관리가 밝혔다.", "source": "Broadband Breakfast", "date": "2026-09-12 06:36", "url": "https://broadbandbreakfast.com/fcc-interested-in-1-6-ghz-auction-in-2028-ntia-official-says/", "category": "policy", "importance": 4, "sid": "policy", "topic": "fcc 주파수 경매"}, {"title": "China's Huawei Technologies faces racketeering trial in New York - ABC News - Breaking New", "summary": "중국 화웨이 테크놀로지가 뉴욕 법원에서 공갈 혐의 관련 재판에 직면했습니다. 미국 정부와 중국 장비사 간의 사법적 리스크가 심화되고 있음을 보여줍니다. 글로벌 통신장비 경쟁 구도에 중대한 영향을 미치는 규제·법적 이슈입니다.", "source": "ABC News - Breaking News, Latest News and Videos", "date": "2026-09-12 06:30", "url": "https://abcnews.com/US/wireStory/chinas-huawei-technologies-faces-racketeering-trial-new-york-136264518", "category": "policy", "importance": 4, "sid": "competitor", "topic": "화웨이 뉴욕 재판 회부"}, {"title": "US Carriers Back Chinese Telecom Ban but Warn Interconnection Scope Could Wall Off Global ", "summary": "미국 통신사들이 중국산 장비 금지 정책을 지지하면서도, 상호 연결성 문제로 인한 글로벌 네트워크 단절 가능성을 경고함.", "source": "Tech Times", "date": "2026-09-12 06:16", "url": "https://www.techtimes.com/articles/327380/20260911/us-carriers-back-chinese-telecom-ban-warn-interconnection-scope-could-wall-off-global-traffic.htm", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 통신 정책"}, {"title": "ドコモ、ノキア製最新基地局装置で世界初のマルチベンダー商用運用スタート - excite.co.jp", "summary": "NTT 도코모가 노키아 최신 기지국을 통한 세계 최초 멀티벤더 상용 운용을 시작했습니다.", "source": "excite.co.jp", "date": "2026-09-12 06:13", "url": "http://www.excite.co.jp/news/article/k_tai_watch_1471252820539949870/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "엔티티도코모 노키아"}, {"title": "[심층리포트] 개인정보 유출 과징금 감경 40%, SKT·KT·쿠팡 3대 심결로 본 증빙 설계법 - 한국데이터경제신문", "summary": "개인정보 유출 사고에 따른 과징금 감경 40% 적용과 관련해 SKT, KT, 쿠팡의 심결 사례를 통해 증빙 설계법을 분석했다. 통신사 규제 준수 및 컴플라이언스 기준 확립에 중요한 정책적 시사점을 제공한다. 통신 .com/article/image_detail/32304726/?img_id=56313251", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 수주"}, {"title": "Nokia Stock Jumps As AI, Index Comeback Fuel Momentum - timothysykes.com", "summary": "노키아 주가가 AI 수요 증가와 지수 편입 등에 힘입어 상승세를 보이고 있습니다.", "source": "timothysykes.com", "date": "2026-09-12 05:47", "url": "https://timothysykes.com/news/nokia-corporation-sponsored-nok-news-2026_09_11-2/", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "노키아 실적"}, {"title": "Verizon Waves Off Starlink, Bets On Cities And Old Phone Buildings - Stocktwits", "summary": "버라이즌이 스타링크 대신 도시 인프라와 기존 통신 시설 활용에 집중하는 전략을 선택했습니다. 지상망 중심의 서비스 강화 전략입니다.", "source": "Stocktwits", "date": "2026-09-12 04:41", "url": "https://stocktwits.com/news-articles/markets/equity/verizon-waves-off-starlink-bets-on-cities-and-old-phone-buildings/cZt7idaRJCG", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 위성통신"}, {"title": "Ghana approves three bidders for 5G - Connecting Africa", "summary": "가나 정부가 5G 입찰을 위한 3개 입찰자를 승인했다. 아프리카 국가의 5G 네트워크 상용화 추진을 위한 사업자 선정 절차가 진행 중임을 보여준다.", "source": "Connecting Africa", "date": "2026-09-12 03:44", "url": "https://www.connectingafrica.com/5g-networks/ghana-approves-three-bidders-for-5g", "category": "contract", "importance": 4, "sid": "carrier", "topic": "가나 5g"}, {"title": "SBI-Led Lenders Agree $3.5 Bn Debt For Vodafone Idea - BW Businessworld", "summary": "SBI 주도 대출 기관들이 보다폰 인디아를 위해 35억 달러어치의 부채 패키지에 합의했다. 자금난을 해소하고 네트워크 투자 자금을 확보하는 데 성공했다. 인도 통신 시장의 건전성을 유지하는 데 기여하는 대형 계약이다. 회사의 장기 성장 기반을 다지는 계기가 된다.", "source": "BW Businessworld", "date": "2026-09-12 03:38", "url": "https://www.businessworld.in/article/sbi-led-lenders-agree-3-5-bn-debt-for-vodafone-idea-623193", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰인도 자금조달"}, {"title": "世界初、ノキア製最新型基地局装置のマルチベンダー構成による商用運用を開始 - RBB TODAY", "summary": "세계 최초로 노키아의 최신형 기지국 장비를 멀티벤더 구성으로 실제 상용 네트워크에 적용하는 운용이 시작되었다. 통신 사업자가 특정 벤 africa.com/news/7176/ericsson-says-ghanas-5g-rollout-could-support-next-phase-of-digital-growth", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 가나 5g 상용화 지원"}, {"title": "US EXIM lends Africell $100 million to counter Huawei - Billionaires.Africa", "summary": "미국 수출입은행이 아프리카 통신사 아프리셀에 1억 달러의 대출을 지원하기로 결정했다. 이는 아프리카 시장에서 5G 점유율 52%를 차지하고 있는 화웨이의 영향력을 견제하기 위한 조치다. 미국의 자금 지원은 아프리카 내 친서구 통신망 확장을 목표로 하고 있다. 이를 통해 글로벌 통신장비 시장에서 미·중 간의 패권 경쟁이 더욱 격화될 전망이다.", "source": "Billionaires.Africa", "date": "2026-09-13 20:50", "url": "https://www.billionaires.africa/2026/09/13/lebanese-telecoms-tycoon-ziad-dallouls-africell-gets-100-million-from-washington-to-counter-huawei-in-africa/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "화웨이 아프리카 수주"}, {"title": "人が密集しても通信はサクサク！ドコモの世界初「次世代・基地局」が本格稼働、スタジアムや都市部へ拡大スタート - DXマガジン", "summary": "NTT도코모가 밀집 지역과 스타디움 등에서 트래픽을 원활하게 처리할 수 있는 세계 최초의 차세대 기지국 가동을 본격화했다. 대규모 트래픽 분산과 통신 품질 향상을 위한 신형 기지국 인프라가 실가동에 돌입했다. 통신사의 네트워크 고도화 투자와 차세대 기지국 도입 성과를 보여주는 대목이다. 향후 장비 수요 확대로 이어질 수 있다.", "source": "DXマガジン", "date": "2026-09-13 20:32", "url": "https://dxmagazine.jp/news/2650ko135/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 기술"}, {"title": "人が密集しても通信はサクサク！ドコモの世界初「次世代・基地局」が本格稼働、スタジアムや都市部へ拡大スタート - dxmagazine.jp", "summary": "NTT도코모가 세계 최초로 차세대 멀티벤더 기지국을 본격 가동하며 스타디움과 도심 지역으로 확산에 나섰다. 개방형 무선 접속망(Open RAN) 상용화의 진전을 보여준다. 네트워크 장비 공급사 간 협력과 기술 적용 사례로 의미가 크다.", "source": "dxmagazine.jp", "date": "2026-09-13 20:32", "url": "https://dxmagazine.jp/news/2650ko135/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "ntt도코모 차세대기지국"}, {"title": "[차이나 급보] 대만 양자 참관기: 반도체를 넘어 양자 산업을 준비하는...", "summary": "브렌던 카 FCC 위원장이 5G, 6G, AI, 인공위성, 양자 컴퓨팅 등 첨단 기술 및 인프라의 중요성을 강조한 대만 양자 산업 참관기이다. 주요국 규제 기관장의 첨단 기술 패권 구상을 보여주는 보도이다. 글로벌 통신 및 장비 시장의 정책 환경을 가늠하는 데 유용하다.", "source": "hellodd.com", "date": "2026-09-13 18:28", "url": "http://www.hellodd.com/news/articleView.html?idxno=113154", px?No=4224677", "category": "policy", "importance": 4, "sid": "satellite", "topic": "중국 ai 6g 특허 전략"}, {"title": "AI·6G 특허전쟁 판 바뀐다…중국, CIPAC서 ‘IP 대전환’ 선언 - asandaily.kr", "summary": "중국이 CIPAC 컨퍼런스에서 IP 대전환을 선언하며 AI와 6G 특허 전쟁의 판도를 바꾸고 있습니다.", "source": "asandaily.kr", "date": "2026-09-13 16:37", "url": "https://asandaily.kr/View.aspx?No=4224677", "category": "tech", "importance": 4, "sid": "satellite", "topic": "중국 6g 특허"}, {"title": "대교 이어 목화·시범까지 … 여의도 래미안 벨트", "summary": "삼성물산 건설부문이 여의도 목화아파트 재건축 사업 시공사로 최종 선정되었습니다. 지난해 대교아파트에 이어 목화아파트까지 수주하며 여의도 일대에 래미안 벨트를 구축하고 있습니다.", "source": "매일경제 IT", "date": "2026-09-13 16:30", "url": "https://www.mk.co.kr/news/realestate/12151399", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성물산 여의도 목화 수주"}, {"title": "‘Y’ 형상 외관 설계 적용…삼성물산, 5122억 규모 여의도 목화아파트 재건축 수주", "summary": "삼성물산 건설부문이 5122억 규모의 여의도 목화아파트 재건축 사업을 수주하여 래미안 와이니티로 명명하고 한강 조망 특화 설계를 추진합니다.", "source": "매일경제 IT", "date": "2026-09-13 16:05", "url": "https://www.mk.co.kr/news/realestate/12151391", "category": "contract", "importance": 4, "sid": "competitor", "topic": "삼성물산 래미안 와이니티 수주"}, {"title": "韓 휴머노이드, 美 수출길 막혔다…“정부, 특단의 대책 서둘러야”", "summary": "미국 연방통신위원회(FCC)가 외국산 휴머노이드 및 자율주행로봇 수입 규제를 시행함에 따라 국내 로봇 기업들의 대미 수출길에 비상이 걸렸다. 신규 승인 미필 시 미국 내 유통과 판매가 금지되는 등 타격이 예상되어 정부 차원의 대책이 시급하다는 지적이다.", "source": "전자신문", "date": "2026-09-13 16:00", "url": "https://www.etnews.com/20260911000247", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 로봇규제"}, {"title": "ASTS Stock Jumps Overnight: Retail Eyes Potential Win As Japan's $1B 'Starlink' Award Near", "summary": "AST 스페이스모바일(AST SpaceMobile)의 주가가 일본의 10억 달러 규모 스타링크 경쟁 계약(라쿠텐 연계 등) 임박 소식에 급등했다. 저궤도 위성 직접 통신(Direct-to-Cell) 분야의 대형 국가별 계약 진행 상황을 보여준다. 글로벌 위성통신 시장의 핵심 수주전 동향이다.", "source": "Stocktwits", "date": "2026-09-13 15:44", "url": "https://stocktwits.com/news-articles/markets/equity/asts-retail-eyes-win-japans-1b-starlink-award/cZKf4wOR7di", "category": "contract", "importance": 4, "sid": "satellite", "topic": "ast 스페이스모바일 일본 수주"}, {"title": "Amazon, AT&T Join Forces To Challenge SpaceX's Satellite Dominance - Aero-News.net", "summary": "아마존과 AT&T가 손잡고 스페이스X의 위성 통신 독점에 도전한다. 기업용 위성 브로드밴드 확장을 위한 양사의 협력으로, 위성통신 및 위성-지상 통합 서비스 시장 구도에 큰 변화를 예고한다.", "source": "Aero-News.net", "date": "2026-09-13 15:36", "url": "https://www.aero-news.net/index.cfm?do=main.textpost&id=245D7BFA-024C-403F-955A-2EAAC07012B7", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아마존 at&t 위성"}, {"title": "앤트로픽 \"AI 개발 속도 조절해야\"...머스크·알트먼도 공감", "summary": "앤트로픽의 다리오 아모데이 CEO가 최첨단 AI 모델의 역량 개선 속도를 늦추자고 제안했다. 시장 주도권을 다투는 오픈AI의 샘 알트먼과 일론 머스크도 여기에 공감하면서 AI 안전 논의가 새 국면을 맞았다. AI 업계의 기술 개발 속도 조절과 안전성 확보 방안을 다룬다.", "source": "ZDNet Korea", "date": "2026-09-13 15:30", "url": "https://zdnet.co.kr/view/?no=20260913143726", "category": "tech", "importance": 4, "sid": "competitor", "topic": "앤트로픽 ai"}, {"title": "대한항공, 기내 무료 와이파이 서비스 개시", "summary": "대한항공이 스페이스X의 스타링크 기반 기내 와이파이 서비스를 전 좌석을 대상으로 15일부터 전격 개시한다고 공식 발표했습니다. 음성·영상 통화와 라이브 방송 등 고속 인터넷을 제공하며, 한진그룹 항공사들의 본격적인 저궤도 위성 통신 도입을 알리는 대형 계약입니다.", "source": "kgnews.co.kr", "date": "2026-09-13 15:08", "url": "https://www.kgnews.co.kr/news/article.html?no=911290", "category": "contract", "importance": 4, "sid": "satellite", "topic": "대한항공 스타링크 기내 와이파이 도입"}, {"title": "포스텍·LB세미콘, 140GHz 위상배열 송수신 모듈 세계 첫 개발 - hidomin.com", "summary": "포스텍과 LB세미콘이 140GHz 위상배열 송수신 모듈을 세계 최초로 개발했다. 차세대 6G 통신 상용화를 위한 핵심 원천 기술을 확보했다는 점에서 의미가 크다.", "source": "hidomin.com", "date": "2026-09-13 15:06", "url": "https://www.hidomin.com/news/articleView.html?idxno=720849", "category": "tech", "importance": 4, "sid": "satellite", "topic": "포스텍 위상배열 모듈 개발"}, {"title": "포스텍·LB세미콘, 140GHz 위상배열 송수신 모듈 세계 첫 개발", "summary": "포스텍과 LB세미콘이 140GHz 위상배열 송수신 모듈을 세계 최초로 개발했다. 이 기술은 향후 6G 차세대 무선 네트워크를 비롯해 자율주행차, 국방 센싱 등 첨단산업에 활용될 예정이다. 국내 연구진의 차세대 6G 원천 기술 확보를 보여준다.", "source": "hidomin.com", "date": "2026-09-13 15:06", "url": "https://www.hidomin.com/news/articleView.html?idxno=720849", "category": "tech", "importance": 4, "sid": "satellite", "topic": "포스텍 lb세미콘 6g 모듈"}, {"title": "아시아나항공, 15일 A350·A330 부터 스타링크 기내 와이파이 무료 제공", "summary": "아시아나항공이 오는 15일부터 일부 항공편(A350·A330)을 시작으로 스타링크 기반의 무료 기내 와이파이 서비스를 제공합니다. 한진그룹 5개 항공사의 스타링크 도입 결정에 따른 후속 조치로, 항공기 내 위성통신 서비스 상용화가 빠르게 확산되고 있습니다.", "source": "thefirstmedia.net", "date": "2026-09-13 15:02", "url": "http://www.thefirstmedia.net/news/articleView.html?idxno=208439", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아시아나항공 스타링크 기내 와이파이"}, {"title": "과거 경매가에 묶인 주파수 재할당…\"현재 가치 반영하는 별도 기준 필요\" - 뉴시스", "summary": "뉴시스 보도에 따르면 과거 경매가에 묶인 주파수 재할당 대가 산정 방식에 대해 현재 가치를 반영하는 별도 기준이 필요하다는 지적이 제기됐다. 통신사의 설비 투자 부담을 완화하고 차세대 네트워크 전환을 촉진하기 위한 제도 개선 요구가 커지고 있다.", "source": "뉴시스", "date": "2026-09-13 14:56", "url": "https://mobile.newsis.com/view_amp.html?ar_id=NISX20260913_0003787296", "category": "policy", "importance": 4, "sid": "policy", "topic": "주파수 재할당 제도 개편"}, {"title": "KT ‘모두의 AI’ 승부수 띄운다…6000만 서비스에 AI 장착 - munhwa.com", "summary": "KT가 6000만 서비스에 AI를 장착하는 '모두의 AI' 전략을 본격 추진합니다. 생활 속 플랫폼과 연동하여 AI 대중화를 이끌겠다는 구상입니다. 통신 본업을 넘어 AI 서비스 생태계 주도권을 잡기 위한 행보입니다.", "source": "munhwa.com", "date": "2026-09-13 14:42", "url": "https://www.munhwa.com/article/11616598", "category": "other", "importance": 4, "sid": "carrier", "topic": "kt 모두의ai"}, {"title": "KT ‘모두의 AI’ 승부수 띄운다…6000만 서비스에 AI 장착 - 문화일보", "summary": "KT가 6,000만 서비스 접점에 AI를 탑재하는 '모두의 AI' 전략을 전격 발표했다. 앱 설치 없이 기존 포털이나 쇼핑 플랫폼에서 국산 AI 서비스를 바로 쓸 수 있도록 생태계를 확장한다. AI 일상화와 플랫폼 경쟁력 강화를 위한 승부수로 평가된다.", "source": "문화일보", "date": "2026-09-13 14:42", "url": "https://www.munhwa.com/article/11616598", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt ai전략"}, {"title": "위성통신 시장 커지자…주파수 확보 경쟁도 본격화 - dt.co.kr", "summary": "위성통신 시장이 급성장함에 따라 핵심 자원인 주파수 확보를 위한 글로벌 통신사 및 위성 사업자 간 경쟁이 본격화되고 있다. 한정된 주파수 대역을 선점하기 위한 규제 기관의 정책 조율과 업계의 로비가 치열해지고 있다. 위성 산업 성장의 핵심 병목 구간으로 꼽힌다.", "source": "dt.co.kr", "date": "2026-09-13 14:11", "url": "https://www.dt.co.kr/article/12083072", "category": "policy", "importance": 4, "sid": "policy", "topic": "위성통신 주파수경쟁"}, {"title": "위성통신 시장 커지자… 주파수 확보 경쟁도 본격화", "summary": "위성통신 시장의 급성장과 함께 글로벌 주파수 확보 경쟁이 본격화되고 있다. 스페이스X는 1만 개 이상의 스타링크 위성을 운용하며 가정용을 넘어 기업, 항공, 해상 등으로 서비스 영역을 공격적으로 넓히고 있으며 아마존 등 경쟁사 역시 3200개 이상의 위성으로 저궤도 인프라 구축에 가세했다. 글로벌 위성통신 시장의 주도권 경쟁 심화를 보여주는 동향이다.", "source": "dt.co.kr", "date": "2026-09-13 14:11", "url": "https://www.dt.co.kr/article/12083072?ref=naver", "category": "strategy", "importance": 4, "sid": "satellite", "topic": "스페이스x 위성통신"}, {"title": "쓰던 앱에 AI 버튼 ‘쏙’…KT, 6000만 접점 공략 - v.daum.net", "summary": "KT가 일상 앱에 AI 버튼을 탑재하여 6,000만 명의 고객 접점을 공략하는 '모두의 AI' 전략을 발표했다. 생활 밀착형 AI 서비스 확대를 위한 통신사의 혁신 행보이다.", "source": "v.daum.net", "date": "2026-09-13 14:00", "url": "https://v.daum.net/v/20260913140000910?f=p", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt ai 전략"}, {"title": "SKT·KT·LG유플러스 '아이폰18' 전초전...야구·축구·로밍 '총동원' - 테크M", "summary": "SK텔레콤, KT, LG유플러스 등 국내 이동통신 3사가 차세대 '아이폰18' 출시를 앞두고 야구, 축구, 로밍 등 다양한 콘텐츠와 마케팅을 총동원해 전초전 경쟁을 벌이고 있습니다. 신형 플래그십 단말 가입자 유치를 위한 통신사들의 마케팅 경쟁이 본격화되고 있습니다. 통신사들의 단말기 출시 사전 마케팅 및 가입자 확보 전략을 보여줍니다.", "source": "테크M", "date": "2026-09-13 13:24", "url": "https://www.techm.kr/news/articleView.html?idxno=155183", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt 아이폰18"}, {"title": "India joins 24 nations in global 6G push, endorses call for secure and resilient networks ", "summary": "인도가 안전하고 회복력 있는 차세대 네트워크 구축을 위한 글로벌 6G 추진 연합의 24개국에 합류했다. 국가 간 표준화 협력과 보안 주도권 확보를 위한 공조를 강화한다.", "source": "organiser.org", "date": "2026-09-13 13:02", "url": "https://organiser.org/2026/09/13/380298/bharat/india-joins-24-nations-in-global-6g-push-endorses-call-for-secure-and-resilient-networks/", "category": "policy", "importance": 4, "sid": "satellite", "topic": "인도 글로벌 6g 동참"}, {"title": "애플 아이폰17, 출시 첫해 230조 역대 최대 매출", "summary": "애플의 아이폰17 시리즈가 출시 첫해 역대 최대 매출을 기록하며 삼성전자 MX 및 네트워크 사업부 연매출의 1.8배 "importance": 4, "sid": "carrier", "topic": "lg유플러스 보안 전략"}, {"title": "ノキアがNTTドコモに納めた「MantaRay SON」を紹介――これで長年、苦しんできたネットワーク品質の改善に期待：石川温のスマホ業界新聞 - ITmedia Mobile -", "summary": "노키아가 NTT도코모에 공급한 지능형 네트워크 관리 솔루션 'MantaRay SON'을 소개하며, 오랜 기간 도코모가 겪어온 네트워크 품질 문제 개선에 기여할 것으로 기대된다. 개방형 무선접속망 생태계에서의 노키아 기술력을 입증하는 사례다.", "source": "ITmedia", "date": "2026-09-13 11:00", "url": "https://www.itmedia.co.jp/mobile/amp/2609/13/news011.html", "category": "contract", "importance": 4, "sid": "competitor", "topic": "도코모 노키아 오픈랜 상용화"}, {"title": "KT, 세계 최대 미디어 전시회 IBC 2026 참가 - 연합뉴스", "summary": "KT가 세계 최대 미디어 전시회 'IBC 2026'에 참가해 글로벌 미디어 기술을 선보인다. 이번 전시회를 통해 국내 협력사들의 해외 판로 개척과 글로벌 미디어 시장 진출을 지원할 계획이다. KT의 미디어 경쟁력을 알리고 파트너십을 확장하는 무대가 될 전망이다. 글로벌 미디어 생태계 내 입지를 다지는 행보로 평가된다.", "source": "연합뉴스", "date": "2026-09-13 10:59", "url": "https://www.yna.co.kr/amp/view/PYH20260913035500013", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 글로벌전시"}, {"title": "T-Mobile completed acquisition of most U.S. Cellular wireless assets in 2025 - eciks.org", "summary": "티모바일이 2025년에 US셀룰러의 무선 자산 인수를 대부분 완료했다. 이번 인수를 통해 티모바일은 가입자 기반을 확충하고 네트워크 커버리지를 대폭 강화하게 됐다. 미국 이동통신 시장의 경쟁 구도 재편과 주파수 및 망 확장에 직결되는 대형 딜이다. 통신사 사업 전략 측면에서 중요도가 높다.", "source": "eciks.org", "date": "2026-09-13 10:55", "url": "https://eciks.org/26445-t-mobile-uscellular-acquisition", "category": "contract", "importance": 4, "sid": "carrier", "topic": "티모바일 인수"}, {"title": "KT, 앰로직과 미디어 단말 칩셋 공급망 협력 - 디지털데일리", "summary": "KT가 앰로직과 협력하여 미디어 단말 칩셋 공급망을 다변화하고 협력사 수출을 지원합니다. 글로벌 파트너십 구축 소식입니다.", "source": "디지털데일리", "date": "2026-09-13 10:17", "url": "https://www.ddaily.co.kr/page/view/2026091309294001690", "category": "contract", "importance": 4, "sid": "carrier", "topic": "kt 앰로직 미디어칩 mou"}, {"title": "KT, 세계 최대 미디어 전시회 참가…미디어 단말 칩셋 공급 MOU - 머니투데이 - mt.co.kr", "summary": "KT가 세계 최대 미디어 전시회에 참가하여 앰로직과 미디어 단말 칩셋 공급 MOU를 맺었다. 글로벌 공급망 협력 강화 성과이다.", "source": "mt.co.kr", "date": "2026-09-13 10:00", "url": "https://www.mt.co.kr/amp 3075723", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국 위성통신 주파수 공급"}, {"title": "Code Hidden In 'White-Labeled' Routers Gives Chinese Servers Full Control - bgr.com", "summary": "화이트라벨 라우터 제품에 숨겨진 코드로 인해 중국 서버가 네트워크 장비를 완전히 제어할 수 있는 보안 취약점과 백도어 논란이 제기되었다. 네트워크 장비의 보안성과 신뢰성에 직결되는 중대한 사안이다. 화웨이 등 통신장비 보안 이슈에 해당하므로 경쟁사 카테고리 및 중요도 4를 부여한다.", "source": "bgr.com", "date": "2026-09-13 08:17", "url": "https://www.bgr.com/2253258/zbtlink-routers-backdoor-chinese-server-control/", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 백도어 백색가전"}, {"title": "삼성전자, 반도체 공장 운영 비법 '공공나노팹'에 전수", "summary": "과기정통부가 포항공과대학교 나노융합기술원에서 '삼성전자-나노융합기술원 공공나노팹 운영 효율화 컨설팅 성과보고회'를 개최했다. 삼성전자의 반도체 팹 운영 노하우를 공공 시설에 이식하여 효율성을 높인 대표적 민관 협력 사례다. 국가 반도체 인프라 경쟁력 강화를 지원한다.", "source": "thelec.kr", "date": "2026-09-13 08:12", "url": "https://www.thelec.kr/news/articleView.html?idxno=62202", "category": "contract", "importance": 4, "sid": "carrier", "topic": "삼성전자 공공나노팹"}, {"title": "스페이스X 225달러 찍고 151달러로… 스타 십·AI 투자가 반등 열쇠 될까", "summary": "스페이스X의 2분기 매출이 스타링크와 AI 컴퓨트 등 사업 성장에 힘입어 크게 증가했다. 회사는 오는 12월부터 대규모 자금 조달 및 스타십 수익 창출 비행을 계획하고 있다.", "source": "coinreaders.com", "date": "2026-09-13 08:04", "url": "http://coinreaders.com/257921", "category": "earnings", "importance": 4, "sid": "satellite", "topic": "스페이스x 실적발표"}, {"title": "자체 위성망 보유 英, 스페이스X ‘ 스타 실드’ 도입…안보 주권 논쟁", "summary": "영국이 스타링크 기술을 기반으로 한 스페이스X의 군사 위성 네트워크 '스타 실드'를 도입하며 안보 주권 논쟁이 제기되었다. 해당 네트워크는 최고 수준의 보안과 우선순위를 제공한다.", "source": "g-enews.com", "date": "2026-09-13 08:02", "url": "https://www.g-enews.com/view.php?ud=20260912164449966fda4f5ab74_1", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스페이스x 군사위성"}, {"title": "美의회, 中 통신 기에 우려 목소리…국내도 점검필요", "summary": "미국 정부가 중국계 해킹조직의 통신망 침투 사건 이후 중국계 통신 장비와 관련 인프라에 대한 우려를 표명하며 국내에서도 점검과 예방 체계 마련의 필요성이 제기되었다.", "source": "g-enews.com", "date": "2026-09-13 08:00", "url": "https://www.g-enews.com/view.php?ud=2026091109303160963d7a510102_1", "category": "policy", "importance": 4, "sid": "policy", "topic": "미국정부 중국통신장비"}, {"title": "Nokia Oyj To Invest $30M To Expand Pennsylvania Chip Facility, Generate $500M Over Five-Ye", "summary": "노키아가 미국 펜실베이니아주 칩 생산 시설 확장을 위해 3000만 달러를 투자한다고 밝혔다. 향후 5년간 5억 달러의 경제적 가치를 창출할 것으로 기대되며, 북미 지역 반도체 및 통신 장비 공급망 강화 전략의 일환이다. 현지 생산 거점을 넓혀 미국 시장 공략을 가속화한다.", "source": "Stocktwits", "date": "2026-09-13 07:52", "url": "https://stocktwits.com/news-articles/markets/equity/nokia-oyj-to-invest-30-m-to-expand-pennsylvania-chip-facility-generate-500-m-over-five-years/cZKhPHkR74p", "category": "contract", "importance": 4, "sid": "competitor", "topic": "노키아 펜실베이니아 투자"}, {"title": "[인공지능 줌인] 다음 인공지능의 병목은?...메모리칩에서 광 네트워크 로", "summary": "AI 데이터센터의 병목 현상을 해소하기 위해 메모리칩에서 광 네트워크로 전환이 가속화되는 가운데, 삼성전자와 SK하이닉스가 HBM3E 계약 가격을 인상했습니다. 데이터센터 네트워크 스위치와 광 네트워크 기술 도입 확대는 통신장비 시장에 큰 영향을 미칩니다. 핵심 부품 공급과 기술 전환 흐름을 보여줍니다.", "source": "wikileaks-kr.org", "date": "2026-09-13 06:18", "url": "http://www.wikileaks-kr.org/news/articleView.html?idxno=191580", "category": "tech", "importance": 4, "sid": "competitor", "topic": "삼성전자 hbm3e 가격 인상 및 광 네트워크 전환"}, {"title": "짐바브웨, 스타링크 와 지상 기지국 결합해 통신망 효율화 추진", "summary": "짐바브웨에서 스타링크 가입자 증가로 피크 시간대 대역폭 제한이 발생하자 현지 지상국 텔레포트와 거점망을 결합하여 통신망 효율화를 추진하고 있습니다. 저궤도 위성 네트워크와 지상 기지국 인프라를 연동하여 트래픽 병목을 해소하는 모범 사례입니다. 신흥국의 위성-지상 하이브리드 통신망 구축 동향을 보여줍니다.", "source": "digitaltoday.co.kr", "date": "2026-09-13 06:08", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=700161", "category": "contract", "importance": 4, "sid": "satellite", "topic": "짐바브웨 스타링크 지상국 결합 통신망 효율화"}, {"title": "[금주 재판일정] 尹 '재판 위증' 항소심 선고…SKT 과징금 1300억 취소 소송 시작 - 뉴스핌", "summary": "SK텔레콤의 과징금 1,300억 원 취소 소송이 본격적인 재판 절차에 돌입했다. 규제 기관과 통신사 간의 법적 공방이 치열해질 전망이다. 통신 규제 및 정책 리스크와 직결된 중요 사안이다. 업계의 이목이 집중된다.", "source": "뉴스핌", "date": "2026-09-13 06:00", "url": "https://www.newspim.com/news/view/20260911001071", "category": "policy", "importance": 4, "sid": "carrier", "topic": "sk텔레콤 과징금취소소송"}, {"titl  "2026-09-14 22:20", "url": "https://cryptobriefing.com/verizon-6g-forum-aws-cisco-intel-nvidia/", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 혁신 포럼"}, {"title": "Nex-Tech Wireless Signs Ericsson for Four-Year 5G Standalone Rollout - Securities.io", "summary": "넥스테크 와이어리스가 에릭슨과 4년 계약을 맺고 5G 독립형(SA) 네트워크 구축을 본격 추진한다. 농촌 지역 망 현대화를 위한 대규모 장비 공급 계약으로 에릭슨의 북미 입지를 다지는 계기다.", "source": "Securities.io", "date": "2026-09-14 22:17", "url": "https://www.securities.io/nex-tech-wireless-signs-ericsson-for-four-year-5g-standalone-rollout/", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 넥스테크와이어리스 계약"}, {"title": "ZTE Unveils an End-to-End AI Video Solution to Fully Empower Operators' Video Services - T", "summary": "중흥(ZTE)이 통신사의 비디오 서비스를 지원하기 위한 엔드투엔드 AI 비디오 솔루션을 글로벌 시장에 선보였다.", "source": "Telecompaper", "date": "2026-09-14 22:17", "url": "https://www.telecompaper.com/partner-content/zte-unveils-an-end-to-end-ai-video-solution-to-fully-empower-operators-video-services--1582627", "category": "tech", "importance": 4, "sid": "competitor", "topic": "중흥 ai 비디오 솔루션 공개"}, {"title": "Samsung comes out against 6G overhaul for sensing", "summary": "삼성전자가 미국 버라이즌과 5G 기반의 ISAC(통신·센싱 융합) 기술을 시연했습니다. 삼성전자는 6G 도입을 위해 기존 통신망을 완전히 재설계해야 한다는 주장에 대해 신중한 입장을 보였습니다. 이번 시연은 5G 인프라를 활용한 기술 고도화 가능성을 타진하는 차원입니다. 글로벌 시장에서 버라이즌과의 협력을 통해 기술 경쟁력을 입증하고 있습니다.", "source": "Light Reading", "date": "2026-09-14 22:10", "url": "https://www.lightreading.com/5g/samsung-comes-out-against-6g-overhaul-for-sensing", "category": "tech", "importance": 4, "sid": "carrier", "topic": "삼성전자 버라이즌 협력"}, {"title": "ZTE and Antel complete LatAm's first symmetric 50G PON trial - Telecompaper", "summary": "ZTE가 아르헨티나 안텔(Antel)과 함께 라틴아메리카 최초로 대칭형 50G PON 기술 시험을 성공적으로 완료함. 차세대 광통신 기술인 50G PON의 상용화 가능성을 확인한 사례임. ZTE는 글로벌 광대역 통신 시장에서 기술 리더십을 확보하려는 전략을 추진 중임.", "source": "Telecompaper", "date": "2026-09-14 22:05", "url": "https://www.telecompaper.com/news/zte-and-antel-complete-latams-first-symmetric-50g-pon-trial--1582625", "category": "tech", "importance": 4, "sid": "competitor", "topic": "zte 수주"}, {"title": "Nex-Tech Wireless selects Ericsson in four-year deal to modernize rural Kansas network and", "summary": "넥스-테크 와이어리스가 미국 캔자스주 농촌 지역의 네트워크 현대화를 위해 에릭슨을 공급사로 선정함. 4년 계약을 통해 해당 지역의 모바일 서비스를 고도화할 예정임. 에릭슨은 이번 수주를 통해 미국 내 농촌 지역 통신 인프라 시장에서의 입지를 강화함.", "source": "PR Newswire", "date": "2026-09-14 22:00", "url": "https://www.prnewswire.com/news-releases/nex-tech-wireless-selects-ericsson-in-four-year-deal-to-modernize-rural-kansas-network-and-launch-5g-standalone-302876013.html", "category": "contract", "importance": 4, "sid": "competitor", "topic": "에릭슨 수주"}, {"title": "Verizon tested a network that senses crowds without cameras. It also tracked drones. - Sto", "summary": "버라이즌이 카메라 없이도 네트워크 전파를 통해 군중을 감지하고 드론을 추적할 수 있는 차세대 네트워크 감지 기술을 테스트했다. 통신망의 다기능 활용성을 보여주는 실증 보도다.", "source": "Stock Titan", "date": "2026-09-14 22:00", "url": "https://www.stocktitan.net/news/VZ/verizon-leads-6g-momentum-with-nine-new-forum-members-and-successful-gumqrxw33fyz.html", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 군중 감지 네트워크"}, {"title": "楽天モバイル 強制解約撤回 「総合的に検討し 経営判断」 - テレ東BIZ", "summary": "라쿠텐모바일이 楽天ID 미연계 강제 해약 방침을 철회한 것에 대해 종합적으로 검토한 경영 판단이라고 밝혔다. 80번 기사의 동일 이슈다.", "source": "テレ東BIZ", "date": "2026-09-14 22:00", "url": "https://txbiz.tv-tokyo.co.jp/txn/news_txn/post_348638", "category": "policy", "importance": 4, "sid": "carrier", "topic": "라쿠텐모바일 자동해약 철회 (테레토)"}, {"title": "Verizon adds more firepower to its 6G Innovation Forum - Fierce Network", "summary": "버라이즌이 6G 혁신 포럼의 규모를 확대하며 차세대 통신 기술 주도권 확보에 나섬. 6G 표준화 및 기술 연구를 위해 생태계 파트너들과 협력을 강화하고 있음. 버라이즌은 AI와 통신이 결합된 미래 네트워크 인프라 구축을 전략적 목표로 삼고 있음.", "source": "Fierce Network", "date": "2026-09-14 21:57", "url": "https://www.fiercewireless.com/wireless/verizon-adds-more-firepower-its-6g-innovation-forum", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g"}, itle": "[더벨][유캐스트 IPO] 공모자금 60% 시설투자 배정, 양산전환 기반 마련", "summary": "유캐스트가 이동기지국 및 5G 특화망 사업 확대를 위해 생산 역량을 확보함.", "source": "thebell.co.kr", "date": "2026-09-14 08:02", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609101619550520106389", "category": "contract", "importance": 4, "sid": "competitor", "topic": "유캐스트 ipo"}, {"title": "Trump rejects calls from tech bosses for AI slowdown", "summary": "트럼프 대통령이 AI 개발 속도 조절을 요구하는 기술 기업 경영진들의 주장을 거부하며 규제 반대 입장을 분명히 함.", "source": "Financial Times Tech", "date": "2026-09-14 06:34", "url": "https://www.ft.com/content/cae60732-f929-4735-a627-db8c14e7c7ed?syn-25a6b1a6=1", "category": "policy", "importance": 4, "sid": "policy", "topic": "트럼프 ai 규제"}, {"title": "SBI-Led Lenders Agree $3.5 Bn Debt For Vodafone Idea - businessworld.in", "summary": "SBI 주도 은행 컨소시엄이 보다폰 아이디어를 위한 35억 달러 규모의 부채 조달에 합의했다. 대규모 자금 유치로 재무적 숨통을 트게 된 통신사의 인프라 투자가 가능해졌다.", "source": "businessworld.in", "date": "2026-09-14 05:10", "url": "https://www.businessworld.in/article/sbi-led-lenders-agree-3-5-bn-debt-for-vodafone-idea-623193", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰인도네시아 부채 조달"}, {"title": "Vodafone Idea: భారీ నిధులు సమీకరించిన వీఐ.. SBI ఆధ్వర్యంలో **₹35,000 కోట్ల** డెట్! - whale", "summary": "인도의 통신사 보다폰 인디아(Vodafone Idea)가 SBI 주도의 컨소시엄으로부터 35,000코로(약 350억 루피) 규모의 대규모 부채 자금을 조달하는 데 성공했다. 이번 자금 조달은 통신사의 재무 구조 개선과 디지털 인프라 투자를 가속화하기 위한 핵심 조치로 평가된다. 대규모 금융 지원을 바탕으로 보다폰 인디아는 네트워크 경쟁력을 강화하고 시장 내 입지를 다질 것으로 전망된다.", "source": "whalesbook.com", "date": "2026-09-14 05:09", "url": "https://www.whalesbook.com/news/Telugu/bankingfinance/Vodafone-Idea-Secures-indian-rupee35000-Crore-Debt-Led-by-SBI/6aa6f38e75fe79b492e5cba3", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰인도네시아 수주"}, {"title": "Vodafone Idea ਨੂੰ ਮਿਲੀ ਵੱਡੀ ਰਾਹਤ: SBI ਦੀ ਅਗਵਾਈ ਵਿੱਚ ਮਿਲਿਆ **₹35,000 ਕਰੋੜ** ਦਾ ਕਰਜ਼ਾ - Whal", "summary": "SBI의 주도 하에 보다폰 인디아가 3,500억 루피 규모의 대규모 거액 대출을 유치하며 큰 숨을 돌리게 됐다. 재무적 위기를 겪던 인도 통신사가 대규모 자금을 확보함에 따라 향후 인프라 투자와 장비 조달에 긍정적 모멘텀이 마련됐다. 통신사의 대형 자금 조달 건이다.", "source": "Whalesbook", "date": "2026-09-14 04:57", "url": "https://www.whalesbook.com/news/Punjabi/bankingfinance/Vodafone-Idea-Secures-indian-rupee35000-Crore-Debt-Led-by-SBI/6aa6f38e75fe79b492e5cba3", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰인디아 sbi 대출 확보"}, {"title": "[리포트랩] 2027년 통신장비 슈퍼사이클 전망…RFHIC·KMW 주목 : 네이버 블로그 - Naver Blog", "summary": "2027년 통신장비 시장이 슈퍼사이클에 진입할 것이라는 전망과 함께 RFHIC, KMW 등 국내외 부품 및 장비 업체들의 수혜가 예상된다는 분석입니다. 글로벌 통신 인프라 투자 회복 기대를 보여줍니다. 네트워크사업부 모니터링 가치가 높습니다.", "source": "Naver Blog", "date": "2026-09-14 04:53", "url": "https://blog.naver.com/PostView.naver?blogId=dealsite&logNo=224410517787&redirect=Dlog", "category": "earnings", "importance": 4, "sid": "competitor", "topic": "2027년 통신장비 슈퍼사이클 전망"}, {"title": "India joins US-led 6G initiative with 25 countries - dailynews.lk", "summary": "인도가 미국이 주도하는 25개국 참여의 6G 협력 이니셔티브에 공식 가입했다. 글로벌 통신 표준화 과정에서 안보와 회복력을 갖춘 네트워크 구축을 목표로 한다. 주요국 간의 긴밀한 기술 동맹을 통해 차세대 통신 주도권을 확보하려는 전략의 일환이다. 향후 글로벌 6G 연구개발과 생태계 확장 가속화가 예상된다.", "source": "dailynews.lk", "date": "2026-09-14 04:42", "url": "https://dailynews.lk/2026/09/14/world/1038820/india-joins-us-led-6g-initiative-with-25-countries/", "category": "policy", "importance": 4, "sid": "satellite", "topic": "인도 6g 글로벌 연대"}, {"title": "TRAI Sets New Rules for AI Business Calls to Reduce Spam Blocking - Whalesbook", "summary": "인도 규제 당국이 스팸 차단을 줄이고 효율성을 높이기 위해 AI 기반 비즈니스 통화에 대한 새로운 규제 지침을 마련했다. 통신 규제 변화는 통신사의 서비스 운영과 인프라에 직접적인 영향을 미친다.", "source": "Whalesbook", "date": "2026-09-14 04:29", "url": "https://www.whalesbook.com/news/English/sebiexchange/TRAI-Sets-New-Rules-for-AI-Business-Calls-to-Reduce-Spam-Blocking/6aa6f38e75fe79b492e5cba8", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도통신규제위원회 ai 규제"}, {"title": "Vodafone Idea: कर्ज के जाल से निकलेगी कंपनी? SBI के नेतृत्व में मिला **₹35,000 करोड़** का ", "summary": "보다폰 아이디어가 빚의 늪에서 벗어나기 위해 SBI(인도국립은행)가 주도하는 컨소시엄으로부터 35,000억 루피 규모의 대출 지원을 확보했습니다. 인도 통신사가 대규모 자금을 수혈받아 재무적 숨통을 트이고 향후 네트워크 설비 투자(Capex)를 집행할 수 있는 기반을 마련했습니다. 통신사의 대규모 부채 구조조정과 자금 조달은 장비 업계의 수주 환경에 직접적인 호재로 작용합니다. 보다폰 아이디어의 회생 및 투자를 위한 결정적 전기가 마련되었습니다.", "source": "Whalesbook", "date": "2026-09-14 04:17", "url": "https://www.whalesbook.com/news/Hindi/bankingfinance/Vodafone-Idea-Secures-indian-rupee35000-Crore-Debt-Led-by-SBI/6aa6f38e75fe79b492e5cba3", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보더폰아이디어 대출"}, {"title": "Vodafone Idea Secures ₹35,000 Crore Debt Led by SBI - Whalesbook", "summary": "보다폰 아이디어가 인도 최대 은행인 SBI가 주도하는 컨소시엄으로부터 35,000 크로어 규모의 대규모 부채 자금을 조달하는 데 성공했다. 대규모 자금 확보를 통해 재무구조 개선과 네트워크 투자 여력을 확보할 것으로 기대된다.", "source": "Whalesbook", "date": "2026-09-14 04:09", "url": "https://www.whalesbook.com/news/English/bankingfinance/Vodafone-Idea-Secures-indian-rupee35000-Crore-Debt-Led-by-SBI/6aa6f38e75fe79b492e5cba3", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보다폰아이디어 대규모 부채"}, {"title": "T-Mobile US CEO Maps 5G, Broadband and AI Growth Strategy at Goldman Sachs Conference - Ya", "summary": "T-Mobile US CEO가 골드만삭스 컨퍼런스에서 5G, 광대역 인터넷, AI 성장 전략을 발표했습니다. 주요 통신사의 중장기 네트워크 고도화 및 신사업 청사진을 제시하는 내용입니다.", "source": "Yahoo Finance", "date": "2026-09-14 04:02", "url": "https://finance.yahoo.com/technology/ai/articles/t-mobile-us-ceo-maps-190200025.html", "category": "exec", "importance": 4, "sid": "carrier", "topic": "티모바일 ceo"}, {"title": "스페이스X, 스타십 배분 딜레마… 스타링크 냐 달·화성이냐", "summary": "스페이스X가 차세대 스타링크 위성 대량 발사와 NASA 달 착륙선 개발, AI 데이터센터 및 화성 개척 프로젝트 사이에서 스타십 발사 배분을 고심하고 있다. 저궤도 위성 인프라 대량 확충 계획과 관련된 전략적 딜레마를 보여준다.", "source": "g-enews.com", "date": "2026-09-14 04:00", "url": "https://www.g-enews.com/view.php?ud=202609132004221139a1f309431_1", "category": "contract", "importance": 4, "sid": "satellite", "topic": "스페이스x 스타십 스타링크"}, {"title": "Vi eyes 35,000-crore loan to fund next decade's capex - The Economic Times", "summary": "보다폰 아이디어가 향후 10년간의 설비투자(Capex) 재원을 마련하기 위해 35,000코루(약 35,000억 루피) 규모의 대규모 대출 조달을 추진하고 있습니다. 인도 통신 시장에서 생존과 5G망 확충을 위한 막대한 자금 확보에 나섰습니다. 통신사의 대규모 자금 조달은 향후 네트워크 장비 발주와 인프라 투자의 직결되는 핵심 요인입니다. 보다폰 아이디어의 공격적인 망 투자 재원 마련 움직임을 보여주는 중대 사안입니다.", "source": "The Economic Times", "date": "2026-09-14 03:58", "url": "https://m.economictimes.com/industry/telecom/telecom-news/vi-eyes-35000-crore-loan-to-fund-next-decades-capex/articleshow/134220187.cms", "category": "contract", "importance": 4, "sid": "carrier", "topic": "보더폰아이디어 투자"}, {"title": "ASTS Stock Slides Premarket: AT&T Says SpaceX And Amazon Could Rival AST SpaceMobile In Sa", "summary": "AT&T가 스페이스엑스와 아마존이 AST스페이스모바일의 강력한 라이벌이 될 수 있다고 언급하면서 ASTS 주가가 프레마켓에서 하락세를 보였습니다. 위성 직접통신(Direct-to-Cell) 시장의 경쟁 심화를 보여줍니다. 위성통신 부문의 중요 시장 동향입니다.", "source": "Stocktwits", "date": "2026-09-14 03:53", "url": "https://stocktwits.com/news-articles/markets/equity/asts-stock-slides-premarket-att-flags-spacex-amazon-as-rivals/cZBfYzqRebM", "category": "other", "importance": 4, "sid": "satellite", "topic": "ast스페이스모바일 주가 하락 및 위성 경쟁"}, {"title": "Trai moves to keep legit AI calls off spam list - economictimes.com", "summary": "TRAI가 합법적인 AI 통화가 스팸 목록에 포함되지 않도록 규정을 마련 중입니다. 통신사 규제 관련 보도입니다.", "source": "economictimes.com", "date": "2026-09-14 03:51", "url": "https://m.economictimes.com/industry/telecom/telecom-news/trai-moves-to-keep-legit-ai-calls-off-spam-list/articleshow/134219315.cms", "category": "policy", "importance": 4, "sid": "carrier", "topic": "trai 스팸방지"}, {"title": "Trai moves to keep legit AI calls off spam list - The Economic Times", "summary": "인도 통신규제청(TRAI)이 적법한 AI 기반 비즈니스 전화가 스팸 전화 목록에 차단되지 않도록 보호하는 새로운 규제 조치를 마련했다는 정책 뉴스이다.", "source": "The Economic Times", "date": "2026-09-14 03:51", "url": "https://m.economictimes.com/industry/telecom/telecom-news/trai-moves-to-keep-legit-ai-calls-off-spam-list/articleshow/134219315.cms", "category": "policy", "importance": 4, "sid": "policy", "topic": "trai 합법적 ai 통화 스팸 제외"}, {"title": "Airtel, Jio allege unfair practices by Vi, seek intervention from Trai - Business Standard", "summary": "에어텔과 지오가 보다폰아이디어의 불공정 관행을 주장하며 TRAI에 공식 개입과 조사를 요구했다. 128번 기사의 동일 이슈다.", "source": "Business Standard", "date": "2026-09-14 03:22", "url": "https://www.business-standard.com/industry/news/vodafone-idea-denies-bharti-airtel-jio-s-charge-of-unfair-practice-126091300696_1.html", "category": "policy", "importance": 4, "sid": "carrier", "topic": "에어텔 지오 trai 보다폰아이디어 제소"}, {"title": "Jio plans 1,600 satellites to rival Starlink - newskarnataka.com", "summary": "인도 통신사 릴라이언스 지오가 스타링크에 대항하기 위해 1,600개의 자체 위성을 발사할 계획입니다.", "source": "newskarnataka.com", "date": "2026-09-14 03:00", "url": "https://newskarnataka.com/technology/jio-plans-1600-satellites-to-rival-starlink/13092026/", "category": "tech", "importance": 4, "sid": "satellite", "topic": "릴라이언스 지오 위성"}, {"title": "주가 -90% 버텼더니...\"각국 국방부서 러브콜\" 대박 난 이 회사", "summary": "미국 블랙스카이가 지구 저궤도에 초소형 관측 위성을 띄워 전략거점을 실시간 감시하는 기술로 각국 국방부로부터 러브콜을 받으며 주목받고 있는 위성 인프라 및 방산 분야 동향이다.", "source": "mt.co.kr", "date": "2026-09-14 03:00", "url": "https://www.mt.co.kr/stock/2026/09/14/2026091319380127016", "category": "contract", "importance": 4, "sid": "satellite", "topic": "미국 블랙스카이 관측위성"}, {"title": "楽天モバイルが強制解約を撤回 - oita-press.co.jp", "summary": "라쿠텐모바일의 강제 해약 방침 철회 소식이다. 80번 기사의 동일 이슈다.", "source": "oita-press.co.jp", "date": "2026-09-14 02:27", "url": "https://www.oita-press.co.jp/1002000000/2026/09/14/NP2026091401000558?amp=true", "category": "policy", "importance": 4, "sid": "carrier", "topic": "라쿠텐모바일 자동해약 철회 (오이타프레스)"}, {"title": "Amazon Seeks to Acquire Globalstar .. And Apple is at the Heart of the Storm - آي-فون إسلا", "summary": "아마존이 글로벌스타 인수를 추진 중이며 애플과의 관계가 핵심이라는 보도임.", "source": "آي-فون إسلام", "date": "2026-09-14 02:14", "url": "https://iphoneislam.com/language/en/2026/04/amazon-seeks-to-acquire-globalstar-and-apple-is-at-the-heart-of-the-storm/164772", "category": "contract", "importance": 4, "sid": "satellite", "topic": "아마존 글로벌스타 인수"}, {"title": "스타링크 가 뭐길래? 대한항공·아시아나항공도 속속 도입", "summary": "대한항공과 아시아나항공이 9월 15일부터 스페이스X의 저궤도 위성통신 서비스 '스타링크' 기반 기내 와이파이를 국내 항공사 최초로 상용화한다. 양사는 별도 요금이나 회원 자격 없이 모든 승객에게 무료로 개방하는 파격적인 방식을 채택했다. 고도 550㎞ 저궤도 위성을 활용해 기존 정지궤도 위성보다 지연 시간이 크게 줄어든 고속 통신 서비스를 제공한다. 저궤도 위성통신(Starlink)의 국내 대중교통 및 상업 시장 본격 진입을 알리는 대형 계약 및 서비스 런칭이다.", "source": "traveltimes.co.kr", "date": "2026-09-14 01:18", "url": "https://www.traveltimes.co.kr/news/articleView.html?idxno=500387", "category": "contract", "importance": 4, "sid": "satellite", "topic": "대한항공 아시아나 스타링크 도입"}, {"title": "[김승조의 혁신의 우주경제] 첸쉐썬 이어받은 중국 우주 굴기, 스페이스...", "summary": "중국이 저궤도 우주 통신망인 궈왕과 첸판을 앞세워 스페이스X의 스타링크에 맞서고 있다. ITU에 대규모 위성 등록을 신청하며 글로벌 우주 인터넷 패권 경쟁을 벌이고 있다.", "source": "joongang.co.kr", "date": "2026-09-14 00:16", "url": "https://www.joongang.co.kr/article/25461513", "category": "strategy", "importance": 4, "sid": "satellite", "topic": "중국 궈왕 첸판 스타링크 대항"}], "2026-09-15": [{"title": "Samsung and Verizon complete 6G-focused ISAC trial on virtualised network - New Electronic", "summary": "삼성전자와 버라이즌이 가상화된 네트워크 환경에서 6G 중심의 ISAC(통신·센싱 통합) 시험을 완료했다. 기존 네트워크 장비의 하드웨어 교체 없이 소프트웨어 업그레이드만으로 센싱 기능을 구현할 수 있음을 입증했다. 차세대 6G 표준 경쟁에서 유리한 고지를 선점하게 됐다.", "source": "New Electronics", "date": "2026-09-15 17:13", "url": "https://www.newelectronics.co.uk/content/news/samsung-and-verizon-complete-6g-focused-isac-trial-on-virtualised-network", "category": "tech", "importance": 5, "sid": "satellite", "topic": "삼성전자 6g 센싱"}, {"title": "Samsung, Verizon trial 6G sensing technology over existing 5G network - Mobile Europe", "summary": "삼성전자와 버라이즌이 기존 5G 네트워크 기반 위에서 6G 센싱 기술을 실증하는 데 성공했습니다. 통신망이 주변 환경을 감지하고 군중 상태를 파악하는 지능형 인프라 기능을 시연했습니다. 차세대 표준화 경쟁에서 기술력을 과시했습니다.", "source": "Mobile Europe", "date": "2026-09-15 15:00", "url": "https://www.mobileeurope.co.uk/samsung-verizon-trial-6g/", "category": "tech", "importance": 5, "sid": "carrier", "topic": "삼성전자 버라이즌 6g 센싱 시험"}, {"title": "KDDI、27年にも衛星経由で音声通話 圏外解消へ次世代スターリンク活用 - BigGo ファイナンス", "summary": "KDDI가 2027년에 위성 경유 음성  15:12", "url": "http://www.smedaily.co.kr/news/articleView.html?idxno=363245", "category": "tech", "importance": 4, "sid": "carrier", "topic": "버라이즌 6g 기술 실증"}, {"title": "KT클라우드 \"2031년까지 1GW AIDC 공급\" - chosun.com", "summary": "KT클라우드가 2031년까지 1GW 규모의 AI 데이터센터(AIDC) 인프라를 공급하겠다는 중장기 비전을 발표했다. AI 인프라 시장 공략을 위한 대규모 투자 계획이다.", "source": "chosun.com", "date": "2026-09-15 15:05", "url": "https://www.chosun.com/economy/tech_it/2026/09/15/HNOV7CG2SVCAPOQESSGYQ3G7HE/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt클라우드 데이터센터"}, {"title": "KT클라우드 \"2031년까지 1GW AIDC 공급\" - 조선일보", "summary": "KT클라우드가 2031년까지 1GW 규모의 AI 데이터센터(AIDC) 인프라를 공급하겠다는 중장기 비전을 제시했다. 폭증하는 AI 인프라 수요에 대응하기 위한 통신 자회사의 대규모 인프라 투자 전략이다.", "source": "조선일보", "date": "2026-09-15 15:05", "url": "https://www.chosun.com/economy/tech_it/2026/09/15/HNOV7CG2SVCAPOQESSGYQ3G7HE/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt클라우드 ai인프라"}, {"title": "누리호 5차 발사, 역대 최다 위성 15기 싣고 내달 7일 발사…초소형군집위성 첫선", "summary": "우주항공청과 한국항공우주연구원은 누리호 5차 발사에 역대 최다인 15기의 위성을 탑재해 내달 7일 발사한다고 밝혔다. 국내 첫 초소형군집위성 5기와 우주 기술 실증을 위한 큐브위성 10기가 실려 의약품 결정화, 우주 방사선, 광통신 등 다양한 임무를 수행한다. 한국의 독자 우주 발사 능력 고도화와 위성 군집 운용 역량을 입증하는 중요한 계기가 될 것이다. 국내 우주 산업의 기술적 진보를 보여주는 대형 이벤트다.", "source": "전자신문", "date": "2026-09-15 15:04", "url": "https://www.etnews.com/20260915000342", "category": "tech", "importance": 4, "sid": "satellite", "topic": "우주항공청 누리호 발사"}, {"title": "AI 시대 결제 전 문자로 승인...…SKT, 글로벌 16개사와 표준화 논의 - 뉴스핌", "summary": "SK텔레콤이 AI 시대 결제 전 문자 승인 기능과 관련해 글로벌 16개사와 RCS 표준화 논의를 진행하고 있다.", "source": "뉴스핌", "date": "2026-09-15 15:00", "url": "https://www.newspim.com/news/view/20260915000915", "category": "tech", "importance": 4, "sid": "carrier", "topic": "skt ai결제 표준화"}, {"title": "삼성전자, 통신망으로 군중 밀집 감지…美서 6G 기술 실증 - 매일일보", "summary": "삼성전자가 미국에서 버라이즌과 함께 통신망을 이용해 군중 밀집도를 감지하는 6G ISAC 기술 실증을 성공적으로 마쳤다. 통신 장비의 새로운 부가가치를 창출하는 성과이다.", "source": "매일일보", "date": "2026-09-15 14:37", "url": "http://www.m-i.kr/news/articleVie
