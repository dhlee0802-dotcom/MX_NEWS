<style>
  :root{

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}

  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
</style>
</head>

he Economic ", "summary": "인도 통신규제위원회(DCC)가 위성통신(Satcom) 스펙트럼 수수료 및 주파수 할당 조건에 대해 곧 결정을 내릴 예정이다. 이번 규제 결정은 향후 인도 위성통신 시장의 진입 장벽과 사업자 간 경쟁 구도에 큰 영향을 미칠 전망이다. 통신사들의 주파수 비용 부담과 직결되는 사안이다.", "source": "The Economic Times", "date": "2026-09-03 04:01", "url": "https://economictimes.indiatimes.com/industry/telecom/satcom-spectrum-fee-dcc-may-soon-decide-airwave-charges-allocation-terms/articleshow/133719014.cms", "category": "policy", "importance": 3, "wl": false, "topic": "릴라이언스지오 규제"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에서의 프라이빗 5G 구축을 위한 새로운 규제 완화 계획을 마련했다. 그러나 이번 방안에도 불구하고 구체적인 주파수 할당 계획은 포함되지 않아 실효성에 대한 의문이 제기되고 있다. 중국 당국은 산업용 5G 보급을 촉진하려 하나 통신사들의 적극적 참여를 이끌어낼 핵심 요소가 빠져 있다는 지적이다. 관련 업계는 향후 주파수 정책의 구체화 여부를 주시하고 있다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 규제"}, {"title": "Foreign Air Carriers To Challenge FCC Altimeters Order - Law360", "summary": "외국 항공사들이 미 연방통신위원회(FCC)의 고도계 관련 명령에 대해 법적 대응이나 도전에 나설 채비를 하고 있습니다. 항공기 무선 주파수 및 통신 장비 간섭 문제와 직결된 규제 이슈입니다. 통신 규제 당국과 항공 업계 간의 조율이 요구됩니다.", "source": "Law360", "date": "2026-09-02 08:16", "url": "https://www.law360.com/articles/2520343/foreign-air-carriers-to-challenge-fcc-altimeters-order", "category": "policy", "importance": 3, "wl": false, "topic": "외항사 fcc 고도계 명령 도전"}, {"title": "티빙, 해킹사고로 3954만 계정 정보 유출…암호화키도 뚫려", "summary": "과학기술정보 통신 부는 3일 정부서울청사에서 민관합동조사단의 티빙 침해사고 조사 결과를 이같이... 이에 과기정통부 는 6월 2일 KISA와 현장조사에 착수하고 다음 날 민관합동조사단을 구성해 피해 규모와 공격...", "source": "newsfc.co.kr", "date": "2026-09-03 14:52", "url": "http://www.newsfc.co.kr/news/articleView.html?idxno=80896", "category": "other", "importance": 2, "wl": false, "topic": ""}, {"title": "네이버클라우드, 국가 보안 AI 개발 나선다… GPU 4000장 투입", "summary": "과기정통부 는 이달 중 네이버클라우드와 협약을 체결하고 GPU 지원을 통해 사이버보안 특화모델 개발에... 전력·금융·과학기술· 통신 ·반도체·방위산업·항공우주 .pressian.com/pages/articles/2026090314450825611?utm_source=naver&utm_medium=search", "category": "other", "importance": 2, "wl": false, "topic": ""}, {"title": "티빙 3954만 계정 털렸다…암호화키까지 뚫려", "summary": "과기정통부 는 정보 통신 망법 위반에 따라 최대 3000만원의 과태료를 부과할 예정이다. 과기정통부 는 티빙에 이달까지 재발 방지 이행계획을 제출하도록 했다. 내년 1월부터 이행 여부를 점검할 방침이다. 이번 사고는...", "source": "newsfreezone.co.kr", "date": "2026-09-03 14:46", "url": "https://www.newsfreezone.co.kr/news/articleView.html?idxno=707370", "category": "other", "importance": 2, "wl": false, "topic": ""}], "carrier": [{"title": "Deutsche Telekom Names New CFO, CTO in Management Reshuffle - Bloomberg.com", "summary": "도이치텔레콤이 최고재무책임자(CFO)와 최고기술책임자(CTO)를 포함한 대규모 경영진 물갈이를 단행했다. 유럽 최대 통신사의 핵심 기술 및 재무 수장이 동시 교체됨에 따라 향후 네트워크 장비 투자 전략에 중대한 변화가 예고된다.", "source": "Bloomberg.com", "date": "2026-09-02 21:31", "url": "https://www.bloomberg.com/news/articles/2026-09-02/deutsche-telekom-names-new-cfo-cto-in-management-reshuffle", "category": "exec", "importance": 5, "wl": false, "topic": "도이치텔레콤 경영진"}, {"title": "[AI 고속도로] HPE, AI 서버·네트워킹 수요에 분기 최대 매출…공급 부족은 과제", "summary": "HPE가 인공지능(AI) 서버와 데이터센터 네트워킹 수요가 급증한 데 힘입어 사상 최대 분기 매출인 122억 달러를 기록했다. 기업들의 AI 인프라 투자가 서버를 넘어 네트워크 장비 영역으로 본격 확산되고 있음을 보여준다. 늘어나는 수요에 힘입어 연간 실적 전망도 상향 조정되었으나, 메모리 등 핵심 부품 공급 부족 현상이 여전히 과제로 지적됐다. 글로벌 AI 네트워킹 시장의 가파른 성장이 주목된다.", "source": "ZDNet Korea", "date": "2026-09-03 13:30", "url": "https://zdnet.co.kr/view/?no=20260903132838", "category": "earnings", "importance": 4, "wl": true, "topic": "hpe 수주"}, {"title": "베트남은 5G 주파수 확보를 위해 2026년 9월 15일부터 2G 네트워크를 완전히 공식적으로 폐쇄할 예정이다. - Vietnam.vn", "summary": "베트남 정부가 5G 주파수 확보를 위해 2026년 9월 15일부터 2G 네트워크를 완전히 폐쇄한다고 재확인했습니다. 구형 네트워크 종료는 주파수 재배치와 통신망 효율화의 핵심 전략입니다. 통신사의 주파수 전환 정책을 보여주는 대표적 사례입니다.", "source": "Vietnam.vn", "date": "2026-09-03 12:05", "url": "https://www.vietnam.vn/ko/viet-nam-chinh-thuc-tat-hoan-toan-mang-2g-tu-ngay-15-9-2026-nham-giai-phong-tan-so-cho-5g", "category": "policy", "importance": 4, "wl": false, "topic": "베트남 2026년 9월 2g 네트워크 폐쇄 공식화"}, {"title": "[속보] 정부, 보안 특화 AI모델 사업자로 네이버 선정 … SKT 탈락 - 뉴데일리", "summary": "정부의 보안 특화 AI 모델 개발 사업자 선정 경쟁에서 SK텔레콤 컨소시엄이 네이버에 패해 탈락했다. 통신사의 공공 AI 인프라 수주 무산과 관련된 주요 뉴스이다.", "source": "뉴데일리", "date": "2026-09-03 09:43", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/03/2026090300066.html", "category": "contract", "importance": 4, "wl": false, "topic": "sk텔레콤 탈락"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증 - 조선일보", "summary": "LG유플러스가 연세대학교와 함께 AI-RAN(무선 접속망) 네트워크 전환 기술 검증을 성공적으로 마쳤다. 차세대 통신망 핵심 기술인 AI-RAN 도입을 위한 국내 산학 협력의 중요한 진전이다.", "source": "조선일보", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/", "category": "tech", "importance": 4, "wl": false, "topic": "lg유플러스 기술"}, {"title": "DT hires AWS's Jan Hofmeyr as CTO", "summary": "도이치텔레콤이 AWS의 얀 호프메이어를 새로운 최고기술책임자(CTO)로 영입한다고 발표했다. 얀 호프메이어는 2026년 11월부로 공식 취임해 기술 부문을 총괄할 예정이다. 이와 함께 크리스티안 일렉 최고재무책임자(CFO)는 2027년 5월에 퇴임할 계획이다. 이번 고위급 인사 밎 조직 개편은 도이치텔레콤의 향후 기술 전략에 중요한 변화를 가져올 것으로 전망된다.", "source": "Light Reading", "date": "2026-09-02 23:47", "url": "https://www.lightreading.com/broadband/dt-hires-aws-s-jan-hofmeyr-as-cto", "category": "exec", "importance": 4, "wl": true, "topic": "도이치텔레콤 인사"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "일본 KDDI가 7GHz 대역에서 세계 최고 수준인 3.6 Gbps 야외 무선 전송 시연에 성공했다. 차세대 6G 유력 후보 주파수를 활용한 실증 테스트로 통신 기술 경쟁력을 입증했다.", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g기술"}, {"title": "Charter Communications announces resignation of CFO - telecompaper.com", "summary": "미국 통신·케이블 기업 차터 커뮤니케이션즈의 최고재무책임자(CFO) 제시카 피셔가 사임 의사를 밝히며 경영진 교체 소식이 전해졌다. 주요 임원의 이탈이 향후 재무 전략에 미칠 영향이 주목된다.", "source": "telecompaper.com", "date": "2026-09-02 16:00", "url": "https://www.telecompaper.com/news/charter-communications-announces-resignation-of-cfo--1581381", "category": "exec", "importance": 4, "wl": false, "topic": "차터커뮤니케이션즈 임원사임"}, {"title": "[통신] 베트남 9월 15일 2G 네트워크 완전 종료 예정 - 굿모닝베트남미디어", "summary": "베트남이 5G 주파수 확보와 네트워크 고도화를 위해 오는 9월 15일 2G 네트워크 서비스를 완전히 종료할 예정입니다. 레거시 망 폐지를 통해 주파수 효율성을 높이고 차세대 통신 투자를 가속화합니다. 글로벌 통신사들의 2G 일몰 트렌드의 일환입니다.", "source": "굿모닝베트남미디어", "date": "2026-09-02 14:24", "url": "https://www.goodmorningvietnam.co.kr/news/article.html?no=83373", "category": "policy", "importance": 4, "wl": false, "topic": "베트남 9월 15일 2g 네트워크 완전 종료"}, {"title": "AT&T ditching phone landlines, members of Congress call on FCC to block - substack.com", "summary": "미국 통신사 AT&T가 전통적인 유선 전화 서비스(PSTN) 철수를 추진하는 가운데, 미 의회 의원들이 연방통신위원회(FCC)에 이를 저지해 줄 것을 공식 촉구하고 나섰다. 규제 당국의 결정이 주목되는 이슈다.", "source": "substack.com", "date": "2026-09-02 02:42", "url": "https://substack.com/app-link/post?publication_id=8143692&post_id=212742975&utm_source=post-email-title&utm_campaign=email-post-title&isFreemail=true&r=8eo9l&token=eyJ1c2VyX2lkIjoxNDEyMTU2MSwicG9zdF9pZCI6MjEyNzQyOTc1LCJpYXQiOjE3ODgyODQ1NDUsImV4cCI6MTc5MDg3NjU0NSwiaXNzIjoicHViLTgxNDM2OTIiLCJzdWIiOiJwb3N0LXJlYWN0aW9uIn0.ntnMdYlsDCD3ZGZc0sUQQrV7oCG_e6xiTZA0uoYjuuI", "category": "policy", "importance": 4, "wl": false, "topic": "at&t 유선전화폐지"}, {"title": "AT&T goes to the mat over Charter's use of 'fiber-powered' label for HFC", "summary": "AT&T가 차터 커뮤니케이션즈를 상대로 HFC 네트워크를 통해 제공되는 초고속 인터넷 서비스에 '광섬유 기반(fiber-powered)'이라는 표현을 사용하는 것이 소비자를 오인하게 만드는 허위 광고라며 소송을 제기했다. 이번 소송은 광고 규제 기관의 관련 판정이 내려진 지 몇 달 만에 이뤄졌다. 통신사 간 마케팅 용어 사용을 둘러싼 법적 공방은 시장 경쟁이 치열해지고 있음을 보여준다. 업계는 이번 소송의 결과가 브로드밴드 마케팅 관행에 미칠 파장을 주시하고 있다.", "source": "Light Reading", "date": "2026-09-02 00:55", "url": "https://www.lightreading.com/broadband/at-t-goes-to-the-mat-over-charter-s-use-of-fiber-powered-label-for-hfc", "category": "policy", "importance": 4, "wl": true, "topic": "at&t 수주"}, {"title": "Charter CFO Jessica Fischer to join Google-Blackstone's TPU neocloud - Data Center Dynamic" <script>
const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};
const SEC_NAME={competitor:"경쟁사",carrier:"통신사",satellite:"위성",policy:"정책·규제",outage:"Outage"};
const TABS=[
  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성",       secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
