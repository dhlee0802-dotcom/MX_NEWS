ia-mulls-removal-of-legacy-chinese-telecoms-kit-report/", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 제재"}, {"title": "Nokia takes aim at healthcare with network deal - Mobile World Live", "summary": "노키아가 의료(헬스케어) 분야를 겨냥한 특화 네트워크 공급 계약을 체결하며 사업 다각화에 나섰다. 전통적인 통신사 시장을 넘어 병원 및 의료 기관의 디지털 전환과 안정적인 원내 통신망 구축을 공략한다. 통신 장비 벤더들의 B2B 특화망 진출 전략을 보여주는 대표적인 사례다. 경쟁사의 신규 시장 개척 동향으로 가치가 높다.", "source": "Mobile World Live", "date": "2026-09-03 21:17", "url": "https://www.mobileworldlive.com/industry/nokia-takes-aim-at-healthcare-with-network-deal/", "category": "contract", "importance": 4, "wl": false, "topic": "노키아 헬스케어 네트워크 계약"}, {"title": "Huawei Enterprise AI Push Is Reshaping Industrial Infrastructure - urbanacres.in", "summary": "화웨이의 엔터프라이즈 AI 추진 전략이 산업용 인프라를 재편하고 있다. 제조, 물류 등 다양한 산업 분야에서 AI 기반 네트워크와 클라우드 솔루션 적용이 가속화된다. B2B 시장 공략을 강화하는 모양새다.", "source": "urbanacres.in", "date": "2026-09-05 11:27", "url": "https://urbanacres.in/huawei-enterprise-ai-push-is-reshaping-industrial-infrastructure/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 인프라"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신사업자들이 통신규제당국(Trai)이 제안한 5G 슬라이싱 서비스 품질(QoS) 규제안에 반대 입장을 표명했다. 당국은 슬라이싱 활성화 지역의 자원 사용을 모니터링해 자원 활용률이 80%를 넘지 않도록 하는 방안을 제안했으나, 업계는 실효성과 기술적 한계를 지적하고 있다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "인도 trai 5g 슬라이싱"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니]", "summary": "미국과 중국이 각각 AI 에이전트와 로봇 분야에서 빠르게 앞서가고 있는 만큼 국내에서는 네트워크 ... 그는 \" 삼성전자 의 내수 점유율이 높고 해외와는 달리 에릭슨, 노키아 컨소시엄이 국내 중소 장비 업체들과...", "source": "view.asiae.co.kr", "date": "2026-09-05 08:19", "url": "https://view.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다", "summary": "노키아와 나주에서 머신러닝 기반의 채널 추정 기술을 시험한 뒤 삼성전자 와 함께 성남 일대 상용망에 AI... LG유플러스는 연세대 등과 손을 잡고 이종 네트워크 간 연동 안정성에 초점을 맞췄다. AI가 주변 무선 품질을...", "source": "yna.co.kr", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/view/AKR20260904023000017?input=1195m", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Nokia Tests Network APIs in Healthcare - Telecom Reseller / Technology Reseller News", "summary": "노키아가 헬스케어 분야를 겨냥한 네트워크 API 테스트를 진행했다. 통신장비 기업의 디지털 헬스케어 생태계 확장 전략을 보여준다. 향후 통신사들의 API 수익화 모델 다변화에 기여할 것으로 기대된다.", "source": "Telecom Reseller / Technology Reseller News", "date": "2026-09-05 06:30", "url": "https://telecomreseller.com/2026/09/04/nokia-tests-network-apis-in-healthcare/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 기술"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - fierce-network.co", "summary": "스페인 마스오렌지와 에릭슨이 6G 미래를 향한 초기 단계로 6 GHz 주파수 대역 테스트를 진행했다. 차세대 이동통신 상용화를 위한 주파수 특성 검증과 네트워크 성능 고도화를 목표로 한다. 글로벌 장비사들의 6G 선점 경쟁을 보여준다.", "source": "fierce-network.com", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 기술"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - Whalesbook", "summary": "BSNL의 4G 네트워크가 일일 트래픽 6 페타바이트(PB) 마일스톤을 돌파했다. 인도 국산 기술로 구축된 통신망이 대규모 가입자의 데이터 수요를 안정적으로 소화하고 있음을 입증한다. 국가 주도 통신 인프라 구축의 성공적인 지표로 평가받는다. 글로벌 장비 시장에서 국산화 모델의 가능성을 보여준다.", "source": "Whalesbook", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "tech", "importance": 3, "wl": false, "topic": "c-dot bsnl 4g"}, {"title": "Huawei latest SingleRAN 22.1 launch targets the Agentverse - totaltele.com", "summary": "화웨이가 최신 SingleRAN 22.1 버전을 출시 rly-6-pb-data-daily-c-dots-rk-upadhyay/133759314", "category": "contract", "importance": 3, "wl": true, "topic": "bsnl 4g 네트워크"}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - Mobile Europe", "summary": "노키아가 사우디아라비아에 AI 중심의 연구개발(R&D) 센터를 새롭게 열었다. 중동 지역의 디지털 전환과 인공지능 기반 네트워크 연구를 가속화하기 위한 거점이다. 현지 파트너십 강화를 통한 글로벌 시장 공략 전략이다.", "source": "Mobile Europe", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 r&d"}, {"title": "Maxis strengthens its nationwide network infrastructure with Nokia’s optical transport tec", "summary": "맥시스가 노키아의 광학 전송 기술을 도입해 전국적인 네트워크 인프라를 대폭 강화했다. 트래픽 증가에 대응하고 전송망의 안정성과 용량을 확충하기 위한 조치다. 노키아의 글로벌 장비 공급 실적을 보여주는 사례다.", "source": "telecomtv.com", "date": "2026-09-04 17:09", "url": "https://www.telecomtv.com/content/nokia/maxis-strengthens-its-nationwide-network-infrastructure-with-nokia-s-optical-transport-technology-56172/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 수주"}, {"title": "Telcos oppose Trai’s proposed 5G slicing service quality rules", "summary": "인도 통신사들이 통신규제당국(Trai)이 제안한 5G 슬라이싱 서비스 품질 측정 방식에 대해 기술적으로 비현실적이며 심각한 운영 부담을 초래할 수 있다고 반대 입장을 재확인했다.", "source": "Mint", "date": "2026-09-04 16:20", "url": "https://www.livemint.com/industry/telecom/reliance-jio-airtel-vodafone-idea-trai-5g-slicing-norms-service-quality-rules-telecom-companies-india-11788502641215.html", "category": "policy", "importance": 3, "wl": true, "topic": "인도 통신사 5g 슬라이싱"}, {"title": "Nokia may exit the consumer smartphone market - Zamin.uz", "summary": "노키아가 소비자용 스마트폰 시장에서 철수할 가능성이 있다는 외신 보도이다. 네트워크 장비 사업 집중을 위한 포트폴리오 재편의 일환이다.", "source": "Zamin.uz", "date": "2026-09-04 15:54", "url": "https://zamin.uz/en/technology/220178-nokia-may-exit-the-consumer-smartphone-market.html", "category": "exec", "importance": 3, "wl": false, "topic": "노키아 스마트폰"}, {"title": "[최홍석 칼럼] AI 에이전트가 달리려면 어떤 도로가 필요한가", "summary": "06) Ind 38", "url": "https://www.fierce-network.com/wireless/dt-gets-pushback-elliott-over-t-mobile-merger-plans-reports", "category": "policy", "importance": 4, "wl": false, "topic": "도이치텔레콤 m&a"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "도이치텔레콤이 최고재무책임자(CFO) 퇴임 등 대규모 임원진 개편과 함께 AWS 출신 얀 호프메이어를 영입하는 세대교체를 단행했다. AI와 차세대 네트워크 경쟁력 강화를 위한 전사적 쇄신 조치다. 전통적인 통신사에서 테크 기반 기업으로의 전환을 가속화하고 있다. 업계 판도에 영향을 미칠 수 있는 최고위급 인사다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 세대교체 cto 영입"}, {"title": "Elliott's Telekom Gambit Puts a €70bn Activist Against Bonn's US Merger Ambitions - AD HOC", "summary": "70억 유로 규모의 지분을 확보한 행동주의 펀드 엘리엇이 본사의 미국 합병 야망에 제동을 걸며 전면적인 충돌이 예고됐다. 도이치텔레콤의 대서양 횡단 M&A 전략에 막대한 변수가 발생했다. 글로벌 통신 업계의 지배구조와 자본 전략을 뒤흔드는 대형 이벤트다.", "source": "AD HOC NEWS", "date": "2026-09-04 01:41", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/elliott-s-telekom-gambit-puts-a-70bn-activist-against-bonn-s-us-merger/70050413", "category": "earnings", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 70억 유로 미국 합병"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - Barron's", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤의 T-Mobile US 합병 전략에 반대한다는 소식이 전해진 가운데 T-Mobile 주가가 상승했다. 대형 M&A 및 지배구조 이슈가 시장에 미치는 영향을 보여준다. 통신사 간 거대 자본 거래와 전략적 방향성에 대한 투자자들의 높은 관심을 반영한다. 글로벌 통신 시장의 판도를 흔들 수 있는 중대 사안이다.", "source": "Barron's", "date": "2026-09-04 01:24", "url": "https://www.barrons.com/articles/t-mobile-stock-report-elliott-deutsche-telekom-merger-2880aac4", "category": "earnings", "importance": 4, "wl": false, "topic": "t모바일 주가 엘리엇 도이치텔레콤"}, {"title": "Jan Hofmeyr named DT's new Board of Management member for product and technology - fierce-", "summary": "AWS 출신의 얀 호프메이어가 도이치텔레콤의 제품 및 기술 담당 새로운 이사회 멤버이자 CTO로 공식 임명됐다. 클라우드 및 AI 전문가의 영입으로 통신망의 클라우드화와 지능화가 더욱 탄력을 받을 전망이다. 기술 전략 수립의 핵심 인물로 부상하며 업계의 이목을 집중시키고 있다. 통신사 리더십 변화의 중요한 마일스톤이다.", "source": "fierce-network.com", "date": "2026-09-04 00:54", "url": "https://www.fierce-network.com/newswire/jan-hofmeyr-named-dts-new-board-management-member-product-and-technology", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 cto 얀 호프메이어"}, {"title": "Elliott Management builds Deutsche Telekom stake, opposes possible T-Mobile merger - repor", "summary": "엘리엇 매니지먼트가 도이치텔레콤 지분을 확보하며 주주 행동주의를 개시하고, 잠재적인 T-Mobile US 합병안에 반대 입장을 분명히 했다. 글로벌 통신 시장의 거대 합병 계획에 중대한 변수가 발생했다. 경영진과 행동주의 펀드 간의 치열한 공방이 예상된다. 통신 산업 전반의 투자와 전략에 큰 파장을 미칠 사안이다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:17", "url": "https://www.datacenterdynamics.com/en/news/elliott-management-builds-deutsche-telekom-stake-opposes-possible-t-mobile-merger-reports/", "category": "earnings", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분 t모바일 합병 반대"}, {"title": "Deutsche Telekom anoints CTO with Comcast chief network veteran and AWS VP Jan Hofmeyr - S", "summary": "도이치텔레콤이 컴캐스트의 수석 네트워크 베테랑이자 AWS 부사장인 얀 호프메이어(Jan Hofmeyr)를 새로운 최고기술책임자(CTO)로 임명했다. 클라우드와 네트워크 분야의 전문 인력을 최고 경영진으로 영입하여 기술 혁신을 가속화하려는 강력한 의도다. AI와 차세대 네트워크 융합 전략에 큰 변화가 예상된다. 글로벌 통신사의 리더십 교체로 중요도가 높다.", "source": "SDxCentral", "date": "2026-09-03 22:32", "url": "https://www.sdxcentral.com/news/deutsche-telekom-anoints-cto-with-comcast-chief-network-veteran-and-aws-vp-jan-hofmeyr/", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 cto 영입"}, {"title": "楽天モバイルの東京地下対策は本当に効いたのか？地下42mで格安SIM4社を実測 - ライブドアニュース", "summary": "라쿠텐모바일의 도쿄 지하 통신망 개선 대책이 실제로 효과가 있었는지를 검증하기 위해 지하 42m 깊이에서 알뜰폰 4사의 통신 품질을 실측했다. 자사 망의 음영 지역 해소 성과를 확인하려는 시도다. 지하철 등 특수 환경에서의 커버리지 경쟁력을 평가한다. 통신사의 망 품질 개선 노력을 보여준다.", "source": "ライブドアニュース", "date": "2026-09-05 19:13", "url": "https://news.livedoor.com/article/detail/32250745/?from_page=internal", "category": "tech", "importance": 3, "wl": false, "topic": "라쿠텐모바일 지하 통신"}, {"title": "改めて。楽天モバイル「KDDI ローミング契約」2026年10月以降も継続 - jetstream.blog", "summary": "라쿠텐모바일과 KDDI 간의 로밍 계약이 2026년 10월 이후에도 계속 유지되는 것으로 확인되었다. 앞선 우려와 달리 일부 지역에서의 로밍 협력이 연장되면서 망 안정성이 유지될 전망이다. 자사 망 구축 부담을 완화하고 통신 품질을 담보하기 위한 조치다. 가입자 이탈을 방지하고 서비스 연속성을 확보하는 데 기여한다.", "source": "jetstream.blog", "date": "2026-09-05 19:10", "url": "https://jetstream.blog/2026/09/05/rakuten-mobile-kddi-roaming-agreement-continues-after-october-2026/", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐모바일 로밍 계약"}, {"title": "[기획] 통신3사, AIDC 수조원대 투자 - 소년한국일보", "summary": "통신3사가 AI 데이터센터(AIDC) 인프라 구축을 위해 수조원대 규모의 투자를 단행한다. AI 인프라 확대를 통한 통신사의 신사업 투자 전략을 보여준다.", "source": "소년한국일보", "date": "2026-09-05 14:57", "url": "https://www.kfenews.co.kr/news/articleViewAmp.html?idxno=663915", "category": "contract", "importance": 3, "wl": false, "topic": "통신3사 aidc 투자"}, {"title": "Retail Media in Korea: KT Connects 3,000 CU Stores - Sixteen:Nine", "summary": "KT가 리테일 미디어 분야에서 한국 내 CU 편의점 3,000여 곳에 통신 및 디지털 인프라를 연결하는 사업을 추진한다. 편의점 매장을 거점으로 한 디지털 사이니지와 미디어 네트워크를 구축하는 협력이다. 통신사의 네트워크 기술이 유통 및 광고 시장으로 확장되는 대표적 B2B 사례다.", "source": "Sixteen:Nine", "date": "2026-09-05 14:53", "url": "https://invidis.com/news/2026/09/retail-media-in-korea-kt-connects-3000-cu-stores/", "category": "contract", "importance": 3, "wl": false, "topic": "kt cu 편의점 리테일 미디어"}, {"title": "Deutsche Telekom Peoplewatch: change-at-the-top in finance, infra, and tech - telcotitans.", "summary": "도이치텔레콤이 재무, 인프라, 기술 등 주요 핵심 부서에서 대대적인 최고 경영진 및 임원 교체를 단행했다. 조직 쇄신과 미래 전략 실행을 위한 인적 쇄신의 일환이다. 경영진 개편을 통해 급변하는 통신 시장 환경에 대응하려는 체질 개선 작업이다. 통신사의 중장기 전략 방향에 영향을 미친다.", "source": "telcotitans.com", "date": "2026-09-05 14:04", "url": "https://www.telcotitans.com/deutsche-telekomwatch/deutsche-telekom-peoplewatch-change-at-the-top-in-finance-infra-and-tech/10839.article", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 임원진 개편"}, {"title": "[뉴스+]SKT는 '수요'·KT는 '이음'·카카오는 '편리'…'모두의 AI' 3色 경쟁 본격화 - 비즈니스플러스", "summary": "SK텔레콤, KT, 카카오 등 주요 기업들이 '모두의 AI'를 표방하며 각양각색의 3색 AI 경쟁에 본격 돌입했다. 정부 지원을 바탕으로 국내 거대언어모델 및 AI 응용 서비스의 대중화를 이끈다. 통신사와 테크 기업 간의 AI 주도권 경쟁이 심화되고 있다. 인프라와 클라우드 자원 수요를 견인한다.", "source": "비즈니스플러스", "date": "2026-09-05 13:57", "url": "https://www.businessplus.kr/news/articleView.html?idxno=116431", "category": "tech", "importance": 3, "wl": false, "topic": "과기정통부 모두의 ai 개발"}, {"title": "[단독] '모두의 AI' 카카오·SKT·KT, 운영비로 100억씩 받는다 - 머니투데이 - 머니투데이", "summary": "정부 주도의 '모두의 AI' 프로젝트에 참여하는 카카오, SK텔레콤, KT 등 3개사가 각각 운영비로 100억 원씩을 지원받게 되었다. 국가 AI 인프라 생태계를 활성화하기 위한 대규모 공공 지원 사업이다. 통신사와 테크 거물들의 AI 기술 상용화에 직접적인 재정적 뒷받침이 된다. 관련 인프라 투자에 긍정적이다.", "source": "머니투데이", "date": "2026-09-05 13:48", "url": "https://www.mt.co.kr/tech/2026/09/04/2026090407422079624", "category": "contract", "importance": 3, "wl": false, "topic": "과기정통부 모두의 ai 운영비"}, {"title": "High on subscriber gains, Vodafone Idea flexes its creative muscle - TradingView", "summary": "보다폰 인도가 가입자 증가세에 힘입어 크리에이티브 역량을 발휘하며 마케팅과 브랜드 활동을 강화하고 있다. 인도 통신 시장에서의 경쟁력을 유지하기 위한 전략이다. 가입자 지표 개선이 실적 회복에 긍정적인 신호로 작용하고 있다. 인도 통신 시장의 경쟁 구도를 보여준다.", "source": "TradingView", "date": "2026-09-05 12:33", "url": "https://www.tradingview.com/news/moodys:5b1ba7fb7a5c4:0-high-on-subscriber-gains-vodafone-idea-flexes-its-creative-muscle/", "category": "earnings", "importance": 3, "wl": false, "topic": "보다폰인도 가입자 실적"}, {"title": "Ambani’s tech titan IPO story isn’t yet credible - The Economic Times", "summary": "암바니의 테크 타이탄 IPO 스토리가 아직 완전히 신뢰성을 확보하지 못했다는 분석 기사다. 상장 계획을 둘러싼 시장의 기대와 우려가 공존하고 있음을 지적한다. 대규모 통신 및 테크 기업의 기업가치 산정에 대한 논란을 다룬다. 통신 시장의 투자 환경에 시사점을 준다.", "source": "The Economic Times", "date": "2026-09-05 11:46", "url": "https://economictimes.indiatimes.com/markets/ipos/fpos/jio-ipo-ambanis-tech-titan-ipo-story-isnt-yet-credible/articleshow/133785076.cms?UTM_Source=Google_Newsstand&UTM_Campaign=RSS_Feed&UTM_Medium=Referral", "category": "earnings", "importance": 3, "wl": false, "topic": "릴라이언 23000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai"}, {"title": "카카오·SKT·KT, 전국민 무료 AI 개발…연내 500만 월 이용 목표 - 하이테크정보", "summary": "카카오, SKT, KT가 전국민 무료 AI 개발에 착수하여 연내 월 이용자 500만을 목표로 한다. 통신사와 빅테크 간의 AI 서비스 협력 동향이다.", "source": "하이테크정보", "date": "2026-09-05 06:17", "url": "https://www.hitech.co.kr/news/articleView.html?idxno=60895", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai 개발"}, {"title": "LG유플러스, MWC서 AI 보안성 정밀 진단… '글로벌 레드팀 챌린지' 출격 - 데일리뉴스", "summary": "LG유플러스가 MWC에서 AI 보안성 정밀 진단을 위한 '글로벌 레드팀 챌린지'에 출격한다. 통신사의 AI 보안 기술력 강화 및 글로벌 역량 제고 측면에서 의미가 있다.", "source": "데일리뉴스", "date": "2026-09-05 06:03", "url": "https://idailynews.co.kr/article/lg%EC%9C%A0%ED%94%8C%EB%9F%AC%EC%8A%A4-mwc%EC%84%9C-ai-%EB%B3%B4%EC%95%88%EC%84%B1-%EC%A0%95%EB%B0%80-%EC%A7%84%EB%8B%A8-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%A0%88%EB%93%9C%ED%8C%80-%EC%B1%8C%EB%A6%B0%EC%A7%80-%EC%B6%9C%EA%B2%A9-f98f16dad586d678a551", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai 보안"}, {"title": "KDDIが光回線＋5Gの「auひかりプラス」を提供する狙い 光コラボを生かして全国展開も視野に", "summary": "KDDI가 9월 17일 출시하는 광회선과 5G SA 융합 서비스 'auひかりプラス'는 개통 대기 시간 단축과 장애 시 자동 백업 기능을 제공한다. 그룹 내 프로바이더 경쟁을 해소하고 NTT 광콜라보를 활용해 전국적인 사업 효율성과 가입자 확대를 노리는 전략적 상품이다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "tech", "importance": 3, "wl": true, "topic": "kddi auひかりプラス"}, {"title": "T-Mobile appoints Shell veteran as next CFO - cfodive.com", "summary": "티모바일이 셸 출신의 베테랑 임원을 새로운 최고재무책임자(CFO)로 임명했다. 리더십 교체를 통해 재무 건전성을 다지고 차세대 전략을 추진할 계획이다. 주요 통신사의 임원진 개편 소식이다.", "source": "cfodive.com", "date": "2026-09-05 05:29", "url": "https://www.cfodive.com/news/tmobile-shell-ge-vernova-veteran-cfo-telecom-merger/829726/", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 인사"}, {"title": "TELUS (TSX:T): Dividend Aristocrat Exit And AI Pivot Explained - Kalkine Media", "summary": "캐나다 텔러스(TELUS)가 오랜 기간 유지해 온 배당 귀족주 지위의 변화와 AI 중심 사업 피벗 전략을 설명한다. 전통적인 통신 사업에서 벗어나 디지털 및 인공지능 분야로 체질을 개선하려는 경영 전략이다. 대규모 투자가 수반되는 전환 과정에서 재무적 변화가 주목받고 있다. 통신사의 비즈니스 모델 진화를 보여준다.", "source": "Kalkine Media", "date": "2026-09-05 02:24", "url": "https://kalkinemedia.com/ca/stocks/communication/telus-tsxt-dividend-aristocrat-exit-and-ai-pivot-explained", "category": "tech", "importance": 3, "wl": false, "topic": "텔러스 배당 및 ai 피벗"}, {"title": "What’s up with… OpenAI, Deutsche Telekom, Ciena - telecomtv.com", "summary": "도이치텔레콤이 오픈AI 및 시에나(Ciena) 등 주요 기술 기업들과 협력하여 네트워크 및 서비스 혁신을 추진하고 있다. AI 기술 도입과 광인프라 고도화를 통해 차세대 통신 서비스를 준비하는 모습이다. 글로벌 통신사와 테크 자이언트 간의 협력 트렌드를 보여준다. 향후 장비 및 솔루션 수요에 영향을 미친다.", "source": "telecomtv.com", "date": "2026-09-04 23:54", "url": "https://www.telecomtv.com/content/ai/what-s-up-with-openai-deutsche-telekom-ciena-56175/", "category": "tech", "importance": 3, "wl": false, "topic": "도이치텔레콤 오픈ai 시에나"}, {"title": "Deutsche Telekom eyes synergies from Greek move - Mobile World Live", "summary": "도이치텔레콤이 자회사 OTE의 그리스 리브랜딩 및 사업 재편을 통해 유럽 지역 내 시너지 창출을 모색하고 있다. 지역별 자회사의 역량을 통합하여 효율성을 높이고 그룹 전체의 수익성을 극대화하려는 전략이다. 글로벌 통신사의 경영 효율화 및 그룹 시너지 창출 사례다.", "source": "Mobile World Live", "date": "2026-09-04 21:13", "url": "https://www.mobileworldlive.com/europe/deutsche-telekom-eyes-synergies-from-greek-move/", "category": "tech", "importance": 3, "wl": false, "topic": "도이치텔레콤 그리스 시너지"}, {"title": "[오늘의 ESG] 삼성전자 ·SKT·유한킴벌리·롯데웰푸드·현대홈쇼핑·대상...", "summary": "삼성전자 ·SKT·유한킴벌리·롯데웰푸드·현대홈쇼핑·대상그룹·한진·티웨이항공 등 기업들이 4일 다양한... 생활 전반에 필요한 물품 지원은 물론 정보 접근성 확대, 또래 네트워크 구축, 지역사회 연계 등을 통해...", "source": "financialreview.co.kr", "date": "2026-09-04 17:54", "url": "http://www.financialreview.co.kr/news/articleView.html?idxno=44638", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Tele Columbus slashes investments by 50% in selective capital allocation in H1 - telecompa", "summary": "텔레 콜럼버스(Tele Columbus)가 상반기 실적 부진에 대응하여 자본 배분의 일환으로 투자를 50% 대폭 삭감했다. 통신 인프라 구축 및 네트워크 확장 계획에 차질이 빚어질 수 있다. 통신사들의 재무   return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
