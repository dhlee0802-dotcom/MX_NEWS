e-idea-for-one-time-spectrum-charges/42522031", "category": "policy", "importance": 4, "wl": false, "topic": "보다폰인도 규제"}, {"title": "Elliott pushes Deutsche Telekom to prioritize buybacks over T-Mobile US mega-merger - Fier", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤을 상대로 T모바일 US와의 초대형 합병보다 자사주 매입에 우선순위를 둘 것을 촉구했다.", "source": "Fierce Network", "date": "2026-09-04 07:38", "url": "https://www.fierce-network.com/wireless/dt-gets-pushback-elliott-over-t-mobile-merger-plans-reports", "category": "policy", "importance": 4, "wl": false, "topic": "도이치텔레콤 t모바일 메가딜"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "도이치텔레콤이 대규모 경영진 쇄신의 일환으로 AWS 출신 얀 호프메이어를 영입하고 최고재무책임자(CFO)가 퇴임하는 등 대대적인 인적 개편을 단행했다. AI와 차세대 네트워크 역량을 강화하려는 의도가 반영되었다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 임원"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - Barron's", "summary": "엘리엇 매니지먼트가 도이치텔레콤과 T-Mobile US 간의 합병 계획에 반대한다는 입장을 표명한 가운데, T-Mobile 주가는 오히려 상승세를 나타냈다. 시장은 행동주의 펀드의 개입이 지배구조와 M&A 전략에 미칠 파장을 주시하고 있다.", "source": "Barron's", "date": "2026-09-04 01:24", "url": "https://www.barrons.com/articles/t-mobile-stock-report-elliott-deutsche-telekom-merger-2880aac4", "category": "other", "importance": 4, "wl": false, "topic": "도이치텔레콤 인수합병"}, {"title": "Global Telecom Capex Ranking 2026: AT&T, Deutsche Telekom, China Mobile, NTT and Verizon L", "summary": "2026년 글로벌 텔레콤 캐피탈 엑스펜디처(Capex) 순위에서 AT&T, 도이치텔레콤, 차이나모바일, NTT, 버라이즌 등이 상위권을 차지했다. 주요 통신사들의 설비투자 규모와 인프라 고도화 방향을 보여주는 지표다. 글로벌 통신 시장의 장비 조달 수요를 가늠할 수 있어 장비 제조사들에게 중요한 참고 자료가 된다. 각 통신사의 투자 순위 변동은 네트워크 장비 시장의 수주 환경에 직접적인 영향을 미친다.", "source": "TelecomLead", "date": "2026-09-03 22:48", "url": "https://telecomlead.com/5g/global-telecom-capex-ranking-2026-att-deutsche-telekom-china-mobile-ntt-and-verizon-lead-network-investment-127592", "category": "earnings", "importance": 4, "wl": false, "topic": "at&t 실적"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - AD HOC NEWS", "summary": "버라이즌 커뮤니케이션스가 프론티어(Frontier) 인수를 확정하고 최고경영자(CEO) 교체 뉴스가 전해지면서 주가가 상승세를 보였다. 이번 인사는 유무선 통합 네트워크 경쟁력을 강화하기 위한 대형 딜로 평가받는다. 버라이즌은 광통신 인프라 확장을 통해 기업 및 소비자 대상 서비스를 다각화할 계획이다. 리더십 변화와 대규모 인수가 맞물려 향후 시장 구도에 큰 변화가 예상된다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "contract", "importance": 4, "wl": false, "topic": "버라이즌 m&a"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - PRESS9", "summary": "SK텔레콤과 LG유플러스 등 국내 이동통신사들이 5G SA 고도화와 향후 주파수 경매 일정을 앞두고 줄여왔던 네트워크 투자를 다시 늘릴 가능성이 제기되고 있다.", "source": "PRESS9", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "통신사 망 투자 재개"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신사들이 트라이(Trai)가 제안한 5G 네트워크 슬라이싱 서비스 품질(QoS) 측정 기준에 반대 입장을 표명했다. 슬라이싱 활성화 지역의 무선 자원 이용률을 80% 이하로 제한하려는 규제안이 기술적으로 비현실적이고 운영상 부담을 초래할 것이라는 지적이다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "인도 통신사 5g 슬라이싱 품질 규제 반발"}, {"title": "KT, ‘모두의 AI’ 이음 본격화...생활 속 ‘1인 1 AI 에이전트’ 구현 - fnnews1.com", "summary": "KT가 '모두의 AI' 프로젝트와 연계된 '이음' 플랫폼을 본격 가동하며 생활 속 1인 1 AI 에이전트 구현에 나선다. 일상 밀착형 AI 서비스 대중화를 추진 중이다.", "source": "fnnews1.com", "date": "2026-09-05 10:52", "url": "https://www.fnnews1.com/news/articleViewAmp.html?idxno=108102", "category": "contract", "importance": 3, "wl": false, "topic": "kt ai"}, {"title": "KT, BGF네트웍스와 리테일 미디어 사업 계약…CU 디지털 사이니지 광고 운영 - 더퍼블릭", "summary": "KT가 BGF네트웍스와 리테일 미디어 사업 계약을 체결하고 CU 편의점의 디지털 사이니지 광고 운영을 맡는다. 통신 인프라를 활용한 미디어 및 광고 사업 영역 확장에 나선다.", "source": "더퍼블릭", "date": "2026-09-05 08:52", "url": "https://www.thepublic.kr/news/articleViewAmp.html?idxno=317521", "category": "contract", "importance": 3, "wl": false, "topic": "kt 수주"}, {"title": "楽天モバイル、ＩＤ未連携で強制解約｜四国新聞WEB朝刊 - 四国新聞", "summary": "라쿠텐모바일이 楽天ID가 연동되지 않은 이용자들을 대상으로 강제 해약 조치를 단행할 방침이다. 가입자 데이터 정비와 생태계 통합을 강화하기 위한 엄격한 내부 정책 집행이다. 일부 가입자 규모에 영향을 미칠 수 있으나 서비스 품질 관리와 플랫폼 일원화 차원의 결정이다.", "source": "四国新聞", "date": "2026-09-05 08:32", "url": "https://www.shikoku-np.co.jp/dg/article.aspx?id=K2026090500000013400", "category": "exec", "importance": 3, "wl": false, "topic": "라쿠텐모바일 가입자"}, {"title": "AT&T service restored after issues affecting 911 service throughout central Ohio agencies ", "summary": "오하이오주 중부 지역 기관들의 911 서비스에 영향을 미쳤던 AT&T의 통신 서비스가 복구 완료되었다. 장애 발생 기간 동안 해당 지역의 응급 대응 체계가 일시적인 어려움을 겪었으나 신속한 조치로 정상화되었다. 통신사는 정확한 장애 원인을 조사하는 한편 재발 방지 대책을 강구하고 있다. 안정적인 공공 통신망 운영의 중요성을 다시 한번 일깨운 사건이다.", "source": "10TV", "date": "2026-09-05 07:18", "url": "https://www.10tv.com/video/news/local/att-service-restored-after-issues-affecting-911-service-throughout-central-ohio-agencies/530-42170895-d7c3-468f-89f7-6e1a2ff3abb3", "category": "outage", "importance": 3, "wl": false, "topic": "at&t 장애"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - 연합뉴스", "summary": "통신사들이 전통적인 기지국 인프라를 AI 데이터센터로 전환하며 새로운 비즈니스 모델 발굴과 체질 개선에 나서고 있다.", "source": "연합뉴스", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR20260904023000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 기지국 ai 데이터센터"}, {"title": "LG유플러스, MWC서 AI 보안성 정밀 진단… '글로벌 레드팀 챌린지' 출격 - 데일리뉴스", "summary": "LG유플러스가 MWC 등 글로벌 무대에서 AI 보안성 정밀 진단을 위한 '글로벌 레드팀 챌린지'에 출격한다. 통신 서비스 전반의 AI 보안 안정성을 검증받기 위한 행보이다.", "source": "데일리뉴스", "date": "2026-09-05 06:03", "url": "https://idaily   ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
