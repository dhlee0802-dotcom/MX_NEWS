<style>

  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}

  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}

  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}

</style>
</head>

[글로벌 포커스] 수에즈 품은 이집트, 미·중 'AI 패권 전쟁'의 새로운 ...", "summary": "중국 통신장비 업체 화웨이가 이집트에 컴퓨팅 클러스터 2개를 구축하기 위한 입찰 제안서를 제출하며 공세를 펴고 있다. 화웨이는 12개월 내 구축 완료와 최신 AI 모델 훈련용 장비 공급을 약속했다. 미·중 AI 패권 전쟁 속에서 아프리카 시장을 겨냥한 장비 공급 경쟁이 치열해지고 있다.", "source": "newsian.co.kr", "date": "2026-09-05 06:50", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=94828", "category": "competitor", "importance": 4, "wl": false, "topic": "화웨이 수주"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다", "summary": "통신사의 AI 데이터센터 및 기지국 지능화 전환 흐름 속에서, 노키아가 머신러닝 기반 채널 추정 기술을 시험하고 삼성전자가 성남 일대 상용망에서 AI 기지국 기술을 적용했다. 글로벌 경쟁사와 삼성전자의 AI-RAN(AI 기반 무선 접속망) 기술 실증 협력을 보여주는 핵심 기술 동향이다. 네트워크사업부 직접 연관 사안으로 중요도가 높다.", "source": "yna.co.kr", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/view/AKR20260904023000017?input=1195m", "category": "tech", "importance": 4, "wl": false, "topic": "삼성전자·노키아 ai 기지국 상용망 시험"}, {"title": "마이크론, YMTC 특허 7번째 무효 판단 받았다...쟁점특허 27건", "summary": "미국 마이크론이 중국 YMTC를 상대로 제기한 특허침해소송에서 무효심판 방어가 난항을 겪고 있다. YMTC가 제기한 특허 27건 중 다수에 대해 마이크론이 무효심판을 청구했으나 뚜렷한 성과를 거두지 못하고 있다. 양사 간의 첨예한 반도체 특허 공방이 지속되고 있다.", "source": "ZDNet Korea", "date": "2026-09-06 19:44", "url": "https://zdnet.co.kr/view/?no=20260906193737", "category": "tech", "importance": 3, "wl": true, "topic": "마이크론 특허분쟁"}, {"title": "수급 악화로 주가 빠졌지만… RFHIC 반등 기대 커지는 까닭 - 핀포인트뉴스", "summary": "국내 통신장비 부품업체인 알에프텍의 주가 반등 기대감과 실적 개선 가능성을 다룬 기사다. 5G 단독모드(SA)와 6G 투자 확대에 따른 고주파·고전력 부품 수요 증가 전망을 포함한다. 통신장비 부품 생태계의 동향을 파악하는 데 유효하다.", "source": "핀포인트뉴스", "date": "2026-09-06 09:56", "url": "https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=484216", "category": "earnings", "importance": 3, "wl": false, "topic": "알에프텍 실적 및 반등 기대"}, {"title": "ASUS、Wi-Fi 7対応のデュアルバンドルーター「RT-BE3600J Pro」新発売", "summary": "에이수스 재팬이 와이파이 7 및 메시 와이파이를 지원하는 듀얼밴드 라우터 'RT-BE3600J Pro'를 출시한다. 차세대 무선 통신 표준인 와이파이 7 도입을 통해 가정 내 네트워크 성능을 강화하려는 전략이다. 네트워크 장비 시장의 하드웨어 트렌드를 보여준다.", "source": "ケータイ Watch", "date": "2026-09-06 08:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2138376.html", "category": "tech", "importance": 3, "wl": true, "topic": "에이수스 라우터"}, {"title": "シャオミが「IFA 2026」に初出展、「Xiaomi 18 Fold」も展示", "summary": "샤오미가 독일 베를린에서 열리는 'IFA 2026'에 처음으로 공식 출전한다. 이번 전시에서 샤오미는 폴더블 스마트폰인 'Xiaomi 18 Fold'를 포함한 최신 제품군을 선보일 예정이다. 글로벌 시장에서의 브랜드 영향력을 확대하고 유럽 가전 및 모바일 시장 공략을 가속화하려는 행보로 풀이된다.", "source": "ケータイ Watch", "date": "2026-09-06 06:00", "url": "https://k-tai.watch.impress.co.jp/docs/news/2138407.html", "category": "tech", "importance": 3, "wl": true, "topic": "샤오미 ifa"}], "policy": [{"title": "'5G Spectrum Auction' Expected in Korea Next Year... Beneficiaries Among Telecom Equipment", "summary": "내년 국내 5G 주파수 경매가 전망되는 가운데 통신장비주들의 수혜 여부에 대한 분석 기사다. 국내 네트워크 투자 재개 및 장비 수요 회복 가능성을 시사한다. 삼성전자 등 국내 네트워크 장비 업계에 미치는 영향이 주목된다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/en/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "한국 5g 주파수 경매 전망"}, {"title": "[2027 AI예산 해부⑤·完] 컨트롤타워 ‘삼각편대’ 2기 돌입…범정부 A...", "summary": "과학기술정보통신부의 2027년 AI 예산이 전년 대비 84.3% 증가한 9조 4000억 원으로 편성됐다. 대통령실과 국가AI전략위, 과기정통부를 중심으로 한 범정부 컨트롤타워 삼각편대가 본격 가동된다. GPU 및 데이터 공통 인프라 확충과 산업계 전반의 AI 생태계 조성이 추진된다.", "source": "ddaily.co.kr", "date": "2026-09-07 06:00", "url": "https://www.ddaily.co.kr/page/view/2026090417453143441", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 정책"}, {"title": "Communications Minister Jyotiraditya Scindia releases revised TDIP guidelines to boost tel", "summary": "인도 통신부가 통신 인프라 및 제조업 성장을 촉진하기 위해 수정된 TDIP 지침을 발표했다. 통신 장비 조달 및 제조 생태계에 영향을 미치는 규제 정책이다. 글로벌 통신사 및 장비 공급사의 현지 전략에 연관된다.", "source": "News On AIR", "date": "2026-09-06 22:10", "url": "https://newsonair.gov.in/communications-minister-jyotiraditya-scindia-releases-revised-tdip-guidelines-to-boost-telecom-sector/", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신부 tdip 지침 개정"}, {"title": "우주청·유엔, AI 통한 우주전파재난 대응 방안 논의", "summary": "우주항공청과 UN이 태양 활동으로 인한 위성 및 통신 장애·피해를 예방하기 위한 우주전파재난 대응 방안에 인공지능을 활용하는 방안을 논의한다. 정부 및 국제기구 차원의 통신 재난 예방 정책 및 제도 논의에 해당한다.", "source": "viva100.com", "date": "2026-09-06 15:34", "url": "https://www.viva100.com/article/20260906500532", "category": "policy", "importance": 3, "wl": false, "topic": "우주항공청·유엔 우주전파재난 대응"}, {"title": "제각각 통신 방식 통일…軍, 전군 드론 '통신표준' 만든다 - 뉴스1", "summary": "군이 제각각이던 통신 방식을 통일하기 위해 전군 드론 통신표준 제정에 나선다. 5G, 6G 위성통신, PS-LTE 등을 대상으로 지연시간과 신뢰성을 고려한 통합관제체계를 구축한다. 특화망 및 공공 통신 장비 수요와 연관된다.", "source": "뉴스1", "date": "2026-09-06 07:00", "url": "https://www.news1.kr/amp/diplomacy/defense-diplomacy/6280619", "category": "tech", "importance": 3, "wl": false, "topic": "한국군 드론 통신표준 제정"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "미국 연방항공청(FAA)의 5G 전파고도계 관련 규제 및 갈등이 마무리 단계에 접어들었다. 항공기 전파 간섭 문제로 지연되었던 5G 주파수 활용과 통신망 구축의 장애물이 해소된다. 통신사의 5G 투자 확대에 긍정적 요인이다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "미국 faa 5g 전파고도계 규칙 종료"}, {"title": "Telcos oppose TRAI’s 5G network slicing rules, cite regulatory overreach - Communications ", "summary": "인도 통신사들이 TRAI의 5G 네트워크 슬라이싱 규제안에 대해 과도한 규제라며 반대 입장을 표명했습니다.", "source": "Communications Today", "date": "2026-09-05 14:25", "url": "https://www.communicationstoday.co.in/telcos-oppose-trais-5g-network-slicing-rules-cite-regulatory-overreach/", "category": "policy", "importance": 3, "wl": false, "topic": "바르티 에어텔 규제반대"}, {"title": "LIVE: | Islamabad 5G Spectrum Auction 2026 | PTA Inaugural Ceremony | Geo News James Haske", "summary": "파키스탄이 5G 주파수 경매를 위한 행사 및 절차를 진행하고 있다. 신규 통신망 도입을 위한 주파수 할당 정책의 일환이다. 장비 공급사들에게 새로운 시장 기회를 제공한다.", "source": "Mshale", "date": "2026-09-05 14:17", "url": "https://mshale.com/9bf82a2b/01c0c54dNsw9aucTWYE", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 5g 주파수 경매"}, {"title": "Putting Customer Protection First: Why Consent Verification alestate/12145229", "category": "contract", "importance": 4, "wl": true, "topic": "lg유플러스 pmdc 표준모델"}, {"title": "Charter Stock Outlook: Can the $34.5B Cox Merger Help CHTR Recover Before Earnings? - Trad", "summary": "차터커뮤니케이션즈의 345억 달러 규모 콕스(Cox) 인수 추진이 실적 회복에 미칠 영향에 대한 시장 전망입니다. 대규모 M&A 딜로 업계의 주목을 받고 있습니다.", "source": "TradingKey", "date": "2026-09-06 07:20", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/261998863-charter-stock-outlook-cox-merger-chtr-before-earnings-tradingkey", "category": "contract", "importance": 4, "wl": false, "topic": "차터커뮤니케이션즈 인수"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신규제당국(TRAI)이 제안한 5G 슬라이싱 품질 서비스 규범에 대해 통신사들이 반발하고 있다. TRAI는 슬라이싱이 활성화된 지역에서 무선 자원 활용률이 80%를 초과하지 않도록 모니터링할 것을 제안했으나, 통신사들은 이러한 규제가 네트워크 효율성을 저해할 수 있다고 주장한다. 5G 네트워크 운영의 자율성과 규제 간의 갈등이 심화되고 있다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 4, "wl": true, "topic": "인도 통신규제당국 규제"}, {"title": "2027년 5G 경매 전망, 통신장비 투자 재논의 - tokenpost.kr", "summary": "2027년 5G 주파수 경매 전망에 따라 통신장비 투자에 대한 재논의가 활발해지고 있다. 주파수 경매는 통신사의 설비 투자(CAPEX)와 직결되는 사안으로, 장비 제조사들에게는 수주 물량 확보를 위한 중요한 변수다. 정부의 주파수 정책 방향에 따라 향후 국내 통신장비 시장의 투자 규모가 결정될 것으로 보인다.", "source": "tokenpost.kr", "date": "2026-09-05 08:38", "url": "https://www.tokenpost.kr/news/tech/402820", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 주파수 경매"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니]", "summary": "국내 5G 주파수 경매 전망에 따른 통신장비주 수혜 분석 기사다. 삼성전자의 높은 내수 점유율과 에릭슨·노키아 컨소시엄 및 국내 중소 장비 업체 간의 협력 구도가 언급된다. 국내 네트워크 장비 투자와 통신 정책 변화에 따른 시장 영향을 심층적으로 다룬다.", "source": "view.asiae.co.kr", "date": "2026-09-05 08:19", "url": "https://view.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "한국 5g 주파수 경매 전망 및 통신장비주 수혜"}, {"title"   const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
