<!DOCTYPE html>
<html lang="ko">
<head>

<title>Network CI Dashboard</title>
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#1C2B3A; --ink-soft:#5B6B7B;
  --line:#DDE4EA; --brand:#155EA2; --brand-soft:#E8F1F9;
  --alert:#C0392B; --alert-bg:#FBEDEB;
  --imp5:#C0392B; --imp4:#D97C2B; --imp3:#155EA2; --imp2:#7C8A98;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55}
a{color:inherit; text-decoration:none}
.wrap{max-width:920px; margin:0 auto; padding:0 16px 60px}

header{padding:22px 0 14px}
header h1{font-size:21px; font-weight:800; letter-spacing:-.3px}
header h1 span{color:var(--brand)}
.meta{margin-top:4px; font-size:12.5px; color:var(--ink-soft)}

/* Outage 경보 배너 */
.alert-banner{display:none; background:var(--alert-bg); border:1px solid #EBC4BE;
  border-left:4px solid var(--alert); border-radius:8px; padding:12px 14px; margin-bottom:14px}
.alert-banner.on{display:block}
.alert-banner .ab-head{font-weight:800; color:var(--alert); font-size:14px; margin-bottom:6px}
.alert-banner a{display:block; font-size:13.5px; padding:2px 0; color:#7A2A20}
.alert-banner a:hover{text-decoration:underline}

/* 탭 */
nav{position:sticky; top:0; z-index:10; background:var(--bg);
  display:flex; gap:2px; overflow-x:auto; padding:6px 0 10px; -webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  border-radius:20px; padding:7px 14px; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap}
nav button .n{margin-left:5px; font-size:11.5px; color:#9AA7B3}
nav button.active{background:var(--brand); border-color:var(--brand); color:#fff}
nav button.active .n{color:#CFE2F3}
nav button.tab-outage.has-alert{border-color:var(--alert); color:var(--alert)}
nav button.tab-outage.has-alert.active{background:var(--alert); color:#fff}

h2.group{font-size:13px; font-weight:700; color:var(--ink-soft); margin:18px 0 8px}

/* 기사 카드 */
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:10px}
.card .row1{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap}
.imp{flex:none; min-width:26px; text-align:center; border-radius:6px;
  font-size:11.5px; font-weight:800; color:#fff; padding:2px 6px}
.imp.i5{background:var(--imp5)} .imp.i4{background:var(--imp4)}
.imp.i3{background:var(--imp3)} .imp.i2,.imp.i1{background:var(--imp2)}
.chip{flex:none; font-size:11.5px; font-weight:700; color:var(--brand);
  background:var(--brand-soft); border-radius:6px; padding:2px 8px}
.chip.c-outage{color:var(--alert); background:var(--alert-bg)}
.sec-tag{font-size:11.5px; color:#9AA7B3; font-weight:600}
.card h3{font-size:15.5px; font-weight:700; line-height:1.4}
.card h3 a:hover{color:var(--brand); text-decoration:underline}
.card p{margin-top:6px; font-size:13.5px; color:#3D4C5B}
.card .foot{margin-top:8px; font-size:12px; color:var(--ink-soft)}
.empty{padding:40px 0; text-align:center; color:var(--ink-soft); font-size:14px}

@media (max-width:520px){
  .card{padding:12px 13px}
  .card h3{font-size:15px}
}
</style>
</head>

 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "tech", "importance": 5, "wl": false, "topic": "삼성 zte특허소송"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨은 사우디아라비아 통신사 stc와 다년간의 5G 네트워크 확장 계약을 체결했다. 이번 협력을 통해 에릭슨은 사우디 내 5G 인프라를 고도화하고 커버리지를 넓히는 작업을 지원한다. 양사는 통신망 현대화를 추진하며 긴밀한 파트너십을 이어가고 있다. 이는 글로벌 통신장비 시장에서 에릭슨의 입지를 강화하는 주요 계약이다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 stc수주"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 화웨이 제재가 완제품을 넘어 핵심 부품 공급망까지 본격적으로 확전되면서 국내 통신장비 및 부품 업체들에 반사이익 기대감이 쏠리고 있다. 글로벌 통신망에서 중국산 장비가 배제되는 추세가 가속화되면서 대안을 찾는 글로벌 통신사들의 수요가 국내 기업으로 향할 수 있다는 분석이다. 삼성전자 네트워크사업부의 글로벌 수주 전에 직접적인 영향을 미치는 지정학적 호재다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이제재 국내장비업체"}, {"title": "Huawei Profit Plunges 36% As AI, Chip Investment And Rising Costs Squeeze Margins - Tekedi", "summary": "화웨이의 순이익이 인공지능 및 칩 투자 비용 증가와 전반적인 비용 상승 압박으로 인해 36% 급감했다. 대규모 미래 기술 투자와 미중 갈등에 따른 공급망 비용이 마진을 크게 압박한 것으로 나타났다. 글로벌 통신장비 경쟁사의 재무 건전성과 수익성 악화를 보여주는 중요 지표다. 삼성전자 네트워크사업부의 경쟁 전략 수립에 시사점을 준다.", "source": "Tekedia", "date": "2026-09-01 19:49", "url": "https://www.tekedia.com/huawei-profit-plunges-36-as-ai-chip-investment-and-rising-costs-squeeze-margins/", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 실적"}, {"title": "[6G격전] ②동맹 없인 미래도 없다 - 한스경제", "summary": "6G 통신 패권 경쟁이 격화되는 가운데 단독 플레이가 아닌 글로벌 생태계 동맹 구축이 미래 생존의 필수 조건으로 부각되고 있다. 차세대 표준 선점과 기술 복잡성 극복을 위해 주요 장비 제조사와 통신사 간의 연합 전선이 중요해지고 있다. 글로벌 6G 시장의 경쟁 구도 변화를 다룬 분석 기사다. 삼성전자의 6G 글로벌 파트너십 전략 수립에 시사점을 준다.", "source": "한스경제", "date": "2026-09-01 15:50", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=861251", "category": "tech", "importance": 4, "wl": false, "topic": "6g격전 동맹"}, {"title": "Ericsson says 5G SA is core network for AI era, sets out foundation for 6G evolution - 디지털", "summary": "에릭슨은 5G 단독모드(SA)가 인공지능 시대의 핵심 코어 네트워크이며 향후 6G 진화의 토대가 된다고 강조했다. 5G SA 전환이 지능형 네트워크와 차세대 통신 발전을 위한 필수 조건임을 역설했다. 글로벌 장비 업계의 차세대 네트워크 표준 및 아키텍처 방향성을 제시하는 내용이다. 삼성전자의 6G 및 5G SA 전략 수립에 중요한 참고 자료다.", "source": "디지털투데이", "date": "2026-09-01 15:31", "url": "https://www.digitaltoday.co.kr/en/view/98844/ericsson-says-5g-sa-is-core-network-for-ai-era-sets-out-foundation-for-6g-evolution", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 5gsa"}, {"title": "Opinion: Huawei: They may rip out our networks, but they'll never take our patents! - Fier", "summary": "화웨이가 각국 통신망에서 장비가 퇴출당하더라도 강력한 특허 포트폴리오를 바탕으로 영향력을 유지할 것이라는 업계 분석이 제기됐다. 지정학적 갈등으로 인해 장비 공급에는 타격을 입었으나 지식재산권(IP)을 통한 수익 창출 능력은 건재하다는 평가다. 글로벌 통신장비 시장의 복잡한 경쟁 구도를 보여준다. 화웨이의 특허 전략을 주시해야 한다.", "source": "Fierce Network", "date": "2026-09-03 03:01", "url": "https://www.fierce-network.com/modernization/opinion-huawei-they-may-rip-out-our-networks-theyll-never-take-our-patents", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 특허"}, {"title": "Ericsson and FIS team up to create enterprise digital wallet infrastructure offering - Tel", "summary": "에릭슨이 FIS와의 협력을 통해 기업용 디지털 지갑 인프라 솔루션을 시장에 선보인다. 통신 인프라와 금융 기술을 결합하여 새로운 수익 모델을 창출하려는 시도이다. 통신장비 외의 신사업 확장 전략을 보여준다. 에릭슨의 포트폴리오 다변화 동향으로 파악할 수 있다.", "source": "Telecompaper", "date": "2026-09-02 22:10", "url": "https://www.telecompaper.com/news/ericsson-and-fis-team-up-to-create-enterprise-digital-wallet-infrastructure-offering--1581496", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 월렛파트너십"}, {"title": "Nokia opens Saudi Arabia R&D centre - Mobile World Live", "summary": "노키아가 사우디아라비아에 AI 네트워크 자동화에 특화된 연구개발(R&D) 센터를 개소했다. 현지 정부와의 협력을 바탕으로 차세대 통신 기술 연구를 주도할 계획이다. 중동 지역의 디지털 인프라 수요에 발맞춘 전략적 거점 확보의 의미를 가진다. 경쟁사의 글로벌 R&D 투자 동향이다.", "source": "Mobile World Live", "date": "2026-09-02 21:07", "url": "https://www.mobileworldlive.com/nokia/nokia-opens-saudi-arabia-rd-centre/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디연구소설립"}, {"title": "Saudi’s ACES announces 5G and 6G partnership with Movandi - Developing Telecoms", "summary": "사우디아라비아의 인프라 기업 ACES가 모반디와 5G 및 6G 기술 협력을 위한 파트너십을 체결했다. 양사는 차세대 무선 통신 인프라 구축과 관련 기술 상용화를 위해 힘을 모으기로 했다. 중동 지역의 선제적인 차세대 네트워크 투자 흐름을 보여준다. 통신장비 및 솔루션 생태계의 확장 사례다.", "source": "Developing Telecoms", "date": "2026-09-02 20:57", "url": "https://www.developingtelecoms.com/telecom-business/telecom-regulation/20770-saudis-aces-announces-5g-and-6g-partnership-with-movandi.html", "category": "contract", "importance": 3, "wl": false, "topic": "사우디aces 5g 6g파트너십"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "AI-RAN, 6G 등 차세대 네트워크 투자 확대 방안을 논의하고 있다. 통신사들은 이미 기존 기지국과 회선... 현행 국가전략 기술 사업화시설 세액공제는 대기업 기준 15%지만 개방형 시설은 이용내역 입증 등의 문제로...", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "tech", "importance": 3, "wl": false, "topic": ""}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "특히 5G 단독모드(SA)와 AI-RAN, 6G 등에 대한 투자 지원과 함께 서비스 특성에 맞는 네트워크 품질을 제공할 수... 과학 기술 정보통신부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토하겠다고 밝혔습니다....", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "tech", "importance": 3, "wl": false, "topic": ""}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "한국 정부와 국내 기업들을 상대로 기술 력을 적극 알려 협력 방안을 모색하겠다는 것이다. 오브레곤 헤드는 “데이터를 빠르게 처리하는 6G 와 AI 기능이 ISAC과 합쳐지면 기술 효율성이 더욱 개선될 것”이라고 내다봤다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category":   }
  return out;
}

/* 주요·최신 탭 */
function renderTop(){
  let tops = [];
  META.sections.forEach(s => (DATA[s.id]||[]).forEach(a => {
    if((a.importance||0) >= 4) tops.push({...a, sid:s.id});
  }));
  tops.sort((x,y) => (y.importance-x.importance) || (y.date>x.date?1:-1));
  tops = dedupeByTopic(tops).slice(0,12);
  let h = "";
  if(tops.length){ h += `<h2 class="group">중요 기사 (중요도 4 이상)</h2>` + tops.map(a=>card(a,true)).join(""); }
  if(LATEST.length){ h += `<h2 class="group">최신 기사</h2>` + LATEST.map(a=>card(a,true)).join(""); }
  return h || `<div class="empty">최근 48시간 내 수집된 기사가 없습니다</div>`;
}

function renderSection(sid){
  const items = DATA[sid] || [];
  if(!items.length) return `<div class="empty">최근 48시간 내 해당 섹션 기사가 없습니다</div>`;
  return items.map(a=>card(a,false)).join("");
}

/* Outage 경보 배너: outage 섹션 중요도 4+ */
function renderAlert(){
  const alerts = (DATA.outage||[]).filter(a => (a.importance||0) >= 4);
  if(!alerts.length) return false;
  document.getElementById("alertList").innerHTML =
    alerts.slice(0,3).map(a =>
      `<a href="${esc(a.url)}" target="_blank" rel="noopener">• ${esc(a.title)} <small>(${esc(a.source)}, ${esc(a.date)})</small></a>`
    ).join("");
  document.getElementById("alertBanner").classList.add("on");
  return true;
}

/* 탭 구성 */
const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");
const tabDefs = [{id:"top", name:"주요·최신", count:null}]
  .concat(META.sections.map(s => ({id:s.id, name:s.name, count:(DATA[s.id]||[]).length})));

function select(id){
  [...tabsEl.children].forEach(b => b.classList.toggle("active", b.dataset.id===id));
  contentEl.innerHTML = (id==="top") ? renderTop() : renderSection(id);
  window.scrollTo(0,0);
}

tabDefs.forEach(t => {
  const b = document.createElement("button");
  b.dataset.id = t.id;
  b.innerHTML = esc(t.name) + (t.count!==null ? `<span class="n">${t.count}</span>` : "");
  if(t.id==="outage") b.classList.add("tab-outage");
  b.onclick = () => select(t.id);
  tabsEl.appendChild(b);
});

document.getElementById("meta").textContent = "업데이트 " + META.generated + " (KST, 최근 48시간)";
const hasAlert = renderAlert();
if(hasAlert) document.querySelector(".tab-outage")?.classList.add("has-alert");
select("top");

/* 5분 자동 새로고침 */
setTimeout(() => location.reload(), 5*60*1000);
</script>
