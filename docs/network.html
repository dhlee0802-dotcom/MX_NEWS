재원 확보와 시장 가치 평가에 큰 파장을 불러일으킬 전망이다.", "source": "telecomtalk.info", "date": "2026-09-04 15:47", "url": "https://telecomtalk.info/jio-ipo-timeline-surfaces-could-happen-in/1011543/", "category": "strategy", "importance": 4, "wl": false, "topic": "릴라이언스 지오 ipo"}, {"title": "KDDI achieves 3.6 Gbps outdoor transmission in 7 GHz 6G candidate band - Telecompaper", "summary": "KDDI가 7 GHz 6G 후보 대역에서 야외 전송 테스트를 통해 3.6 Gbps의 초고속 전송을 달성했다. 차세대 6G 이동통신 표준화와 상용화를 대비한 핵심 무선 기술 검증에서 성과를 냈다. 고주파수 대역 활용과 대용량 데이터 전송 능력을 입증하여 향후 6G 네트워크 리더십을 확보하는 데 기여할 전망이다.", "source": "Telecompaper", "date": "2026-09-04 15:31", "url": "https://www.telecompaper.com/news/kddi-achieves-36-gbps-outdoor-transmission-in-7-ghz-6g-candidate-band--1581713", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 통신사 릴라이언스 지오가 축제 시즌인 나브라트리와 디왈리 기간에 맞춰 최대 4조 달러 규모의 기업공개(IPO)를 추진하며 이르면 다음 주 로드쇼를 시작할 예정이다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "contract", "importance": 4, "wl": true, "topic": "릴라이언스지오 ipo"}, {"title": "Bombay HC quashes ₹2,113 crore DoT demand against Vodafone Idea - scanx.trade", "summary": "인도 뭄바이 고등법원이 통신부(DoT)가 보다폰 아이디어를 대상으로 제기한 2,113억 루피 규모의 요금 청구를 기각했다. 통신사의 재정적 부담을 크게 덜어주는 중대 판결이다. 규제 리스크 해소에 따른 기업 가치 회복에 기여할 전망이다.", "source": "scanx.trade", "date": "2026-09-04 09:28", "url": "https://scanx.trade/stock-market-news/companies/bombay-high-court-quashes-2-113-crore-dot-demand-notices-against-vodafone-idea-for-one-time-spectrum-charges/42522031", "category": "policy", "importance": 4, "wl": false, "topic": "보다폰 아이디어 dot 요구 취소"}, {"title": "[단독] \"5G 한계 지웠다\" 삼성, 日 KDDI와 7GHz 대역서 3.6Gbps 역대급 속도 입증 The Guru - Investing.com 한국어", "summary": "삼성전자가 일본 KDDI와 함께 7GHz 대역에서 3.6Gbps의 5G 속도를 구현하며 차세대 통신 기술 우수성을 입증했다.", ress9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "skt lgu+ 망투자"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - 연합뉴스", "summary": "통신사들이 기지국 인프라를 AI 데이터센터로 활용하는 등 새로운 비즈니스 모델로의 변신을 시작했다.", "source": "연합뉴스", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR20260904023000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 데이터센터"}, {"title": "LG유플러스, MWC서 AI 보안성 정밀 진단… '글로벌 레드팀 챌린지' 출격 - 데일리뉴스", "summary": "LG유플러스가 MWC에서 AI 보안성 정밀 진단을 선보이며 글로벌 레드팀 챌린지에 출격한다. 통신망 및 AI 서비스의 보안 안정성을 검증하기 위한 행보이다.", "source": "데일리뉴스", "date": "2026-09-05 06:03", "url": "https://idailynews.co.kr/article/lg%EC%9C%A0%ED%94%8C%EB%9F%AC%EC%8A%A4-mwc%EC%84%9C-ai-%EB%B3%B4%EC%95%88%EC%84%B1-%EC%A0%95%EB%B0%80-%EC%A7%84%EB%8B%A8-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%A0%88%EB%93%9C%ED%8C%80-%EC%B1%8C%EB%A6%B0%EC%A7%80-%EC%B6%9C%EA%B2%A9-f98f16dad586d678a551", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai 보안 진단"}, {"title": "Telco operators reject quality of service norms for 5G slicing - The Economic Times", "summary": "인도의 통신 사업자들이 5G 네트워크 슬라이싱(Slicing) 서비스에 대한 서비스 품질(QoS) 규제 지침에 대해 반대 입장을 표명했다. 정부의 엄격한 규제가 차세대 서비스의 유연한 상용화와 수익 창출을 저해할 수 있다는 우려다. 통신 규제 기관과 사업자 간의 정책 조율 과정에서 마찰이 예상되는 대목이다.", "source": "The Economic Times", "date": "2026-09-05 04:38", "url": "https://m.economictimes.com/industry/telecom/telecom-giants-reject-trais-5g-slicing-qos-norms-amidst-net-neutrality-debate/amp_articleshow/133776604.cms", "category": "policy", "importance": 3, "wl": false, "topic": "인도 5g 규제"}, {"title": "Charter Communications stock falls as CFO transition and weak sentiment weigh - ad-hoc-new", "summary": "차터 커뮤니케이션즈의 CFO 교체 소식과 약세인 시장 심리가 겹치면서 주가가 하락했다. 주요 경영진의 이탈이 투자자들의 단기 불안감으로 작용했다. 회사의 향후 재무 전략 실행에 미칠 영향을 주시하고 있다.", "source": "ad-hoc-news.de", "date": "2026-09-05 02:31", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/charter-communications-stock-falls-as-cfo-transition-and-weak-sentiment/70055980", "category": "earnings", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션즈 주가"}, {"title": "TELUS (TSX:T): Dividend Aristocrat Exit And AI Pivot Explained - Kalkine Media", "summary": "캐나다 통신사 텔러스의 배당 정책 변화와 AI 중심 사업 피벗 전략을 분석했다. 전통적인 통신 수익 구조에서 인공지능 부문으로의 전환을 다루고 있다.", "source": "Kalkine Media", "date": "2026-09-05 02:24", "url": "https://kalkinemedia.com/ca/stocks/communication/telus-tsxt-dividend-aristocrat-exit-and-ai-pivot-explained", "category": "other", "importance": 3, "wl": false, "topic": "텔러스 배당 및 ai 피벗"}, {"title": "Verizon Communications stock gains as Q2 2026 earnings beat and outage reports test sentim", "summary": "버라이즌의 2026년 2분기 호실적이 발표되면서 주가가 상승세를 보였다. 시장 예상치를 웃도는 실적에도 불구하고 최근 발생한 네트워크 장애 보도가 투자 심리를 시험하는 요인으로 작용했다. 탄탄한 재무 성과가 장애 우려를 일부 상쇄하는 모습을 보였다. 향후 안정적인 서비스 운영이 주가 흐름의 중요 변수가 될 전망이다.", "source": "ad-hoc-news.de", "date": "2026-09-05 02:16", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-as-q2-2026-earnings-beat-and-outage/70055902", "category": "earnings", "importance": 3, "wl": false, "topic": "버라이즌 실적"}, {"title": "T-Mobile US stock falls on CFO transition while guidance stays strong - ad-hoc-news.de", "summary": "티모바일 US가 CFO 교체 소식을 발표한 가운데 회사의 실적 가이던스는 견조하게 유지되었다. 경영진 리더십 변화에 따른 일시적 주가 하락이 있었으나 펀더멘털은 탄탄하다는 평가다. 향후 재무 전략의 연속성이 유지될지 시장이 주목하고 있다.", "source": "ad-hoc-news.de", "date": "2026-09-05 01:54", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/t-mobile-us-stock-falls-on-cfo-transition-while-guidance-stays-strong/70055780", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 인사"}, {"title": "LS일렉트릭, KT클라우드와 AI 데이터센터 인프라 공급·개발 맞손 - koreasprint.com", "summary": "LS일렉트릭과 KT클라우드가 AI 데이터센터 인프라 공급 및 개발을 위해 맞손을 잡았다.", "source": "koreasprint.com", "date": "2026-09-05 00:20", "url": "https://www.koreasprint.com/news/articleView.html?idxno=18674", "category": "contract", "importance": 3, "wl": false, "topic": "kt클라우드 ls일렉트릭 ai dc 협력"}, {"title" rk plan runs into cost and spectrum snags - Communication", "summary": "인도의 200억 루피 규모 비상 네트워크 계획이 비용 및 주파수 문제에 직면했다. 관련 통신업계의 인프라 구축 차질과 재정적 부담이 제기되고 있다. 향후 예산 조정과 주파수 할당 방식에 대한 재검토가 예상된다.", "source": "Communications Today", "date": "2026-09-04 13:18", "url": "https://www.communicationstoday.co.in/indias-%E2%82%B920000cr-emergency-network-plan-runs-into-cost-and-spectrum-snags/", "category": "contract", "importance": 3, "wl": false, "topic": "인도 통신사 긴급 네트워크 계획"}, {"title": "T-Mobile's Gopalan bets on AI, home internet to revive subscriber growth - Business Standa", "summary": "티모바일의 최고경영진이 AI 기술 도입과 홈 인터넷(FWA) 사업 확장을 통해 가입자 성장 모멘텀을 되살리겠다는 전략을 밝혔다. 무선 시장 경쟁이 치열해진 가운데 신사업을 통한 돌파구 마련에 집중하고 있다. 가입자 기반을 확대하고 수익 다변화를 꾀하려는 경영 전략의 일환이다.", "source": "Business Standard", "date": "2026-09-04 12:48", "url": "https://www.business-standard.com/amp/companies/news/t-mobile-s-gopalan-bets-on-ai-home-internet-to-revive-subscriber-growth-126090400143_1.html", "category": "strategy", "importance": 3, "wl": false, "topic": "티모바일 전략"}, {"title": "Reinventing Business Internet from the Ground Up and the Sky Down - Navajo-Hopi Observer", "summary": "지상 인프라와 위성 통신을 결합하여 기업용 인터넷 인프라를 전면적으로 혁신하는 방안이 추진되고 있다. 지상망과 하늘의 위성망을 융합해 음영 지역 없는 고속 연결을 제공하는 것이 골자다. 차세대 기업용 통신 서비스 시장의 새로운 트렌드를 보여준다.", "source": "Navajo-Hopi Observer", "date": "2026-09-04 11:17", "url": "https://www.nhonews.com/online_features/tech_talk_and_innovation/reinventing-business-internet-from-the-ground-up-and-the-sky-down/article_124462fe-1053-5caf-b6d3-bcc1f097ece5.html", "category": "strategy", "importance": 3, "wl": false, "topic": "기업용 인터넷"}, {"title": "T-Mobile CFO Peter Osvaldik to step down in February 2027, Jessica Uhl to succeed", "summary": "티모바일의 피터 오스발딕 CFO가 2027년 2월 사임하고 제시카 율이 후임으로 임명된다. 이번 발표는 행동주의 펀드 엘리엇 인베스트먼트가 도이치텔레콤의 주식을 확보한 가운데 티모바일과의 합병 계획 재고를 요구하는 과정에서 나왔다.", "source": "ET Telecom", "date": "2026-09-04 10:57", "url": "https://telecom.economictimes.indiatimes.com/news/industry/t-mobile-cfo-peter-osvaldik-t   {id:"sat",    name:"🛰 위성·6G",    secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
