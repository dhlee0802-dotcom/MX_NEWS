": 3, "wl": false, "topic": ""}, {"title": "대한항공 기내서 ‘공짜 와이파이’...9월 스타링크 도입 - mk.co.kr", "summary": "대한항공이 오는 9월부터 기내에서 무료로 고속 와이파이를 즐길 수 있는 스타링크 서비스를 도입한다. 기존 유료 위성인터넷 서비스를 전면 개편하여 승객들에게 차별화된 기내 경험을 제공한다는 방침이다. 스페이스X의 저궤도 위성망을 활용함으로써 비행 중에도 지상과 다름없는 끊김 없는 인터넷 환경이 조성된다. 국내 항공사의 스타링크 도입은 향후 국내 항공 업계의 기내 통신 서비스 경쟁을 촉발할 것으로 보인다.", "source": "mk.co.kr", "date": "2026-09-02 14:32", "url": "https://www.mk.co.kr/news/business/12142298", "category": "contract", "importance": 3, "wl": false, "topic": "대한항공 스타링크"}, {"title": "에이스테크, 항우연 저궤도 위성통신 안테나 개발 수주…위성·방산 통신 확대 - 네이트", "summary": "에이스테크가 항우연으로부터 저궤도 위성통신 안테나 개발 건을 수주하여 위성 및 방산 통신 역량을 강화한다. 저궤도 위성 통신 인프라 수요가 증가하는 시점에서 거둔 이번 성과는 회사의 기술력을 대외적으로 인정받은 결과다. 회사는 향후 우주 항공 및 특수 통신 시장에서의 추가 수주를 기대하고 있다. 지속적인 R&D 투자를 통해 차세대 통신 장비 전문기업으로의 도전을 이어가고 있다.", "source": "네이트", "date": "2026-09-02 14:28", "url": "https://news.nate.com/view/20260902n21710", "category": "contract", "importance": 3, "wl": false, "topic": "에이스테크 항우연"}, {"title": "스페이스X, AI 데이터센터 수장 교체…인력 이탈·장애 속 운영 안정화 총력 - 디지털투데이", "summary": "스페이스X가 AI 데이터센터 사업을 총괄하는 수장을 교체하며 내부 인력 이탈과 통신 장애 등 운영 불안정성 해소에 총력을 기울이고 있다. 급격한 사업 확장 과정에서 발생한 기술적·조직적 문제를 수습하고 차세대 인프라 구축에 속도를 내려는 조치다. 경영진 개편을 통해 스타링크와 AI 데이터센터 간의 시너지를 극대화하고 서비스 신뢰도를 높인다는 전략이다. 우주 통신과 AI의 융합을 추진하는 동사의 향후 행보에 업계의 이목이 집중되고 있다.", "source": "디지털투데이", "date": "2026-09-02 14:04", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697624", "category": "exec", "importance": 3, "wl": false, "topic": "스페이스x ai"}, {"title": "ASTS Stock Hits One-Month Low: Insider Buys The Dip After BlueBird Deployments, Japan Win ", "summary": "AST스페이스모바일의 주가가 한 달 내 최저치로 하락한 가운데, 내부자가 블루버드 위성 배치와 일본 시장 진출 성과를 계기로 저가 매수에 나섰다. 회사는 최근 저궤도 위성 통신 서비스를 위한 핵심 위성 발사를 진행하며 글로벌 통신사들과의 협력을 확대하고 있다. 이번 주가 하락은 단기적인 시장 변동성에 기인한 것으로 분석되며, 향후 실질적인 상용화 성과에 따라 반등 가능성이 제기된다. 시장에서는 회사의 혁신적인 위성-셀룰러(D2D) 기술 상용화 진척 상황을 주시하고 있다.", "source": "Asianet Newsable", "date": "2026-09-02 11:40", "url": "https://newsable.asianetnews.com/markets/asts-stock-hits-one-month-low-insider-buys-the-dip-after-bluebird-deployments-japan-win-articleshow-acp217e", "category": "contract", "importance": 3, "wl": false, "topic": "ast스페이스모바일 주가"}, {"title": "인텔리안테크, 美 공장 첫 출하…북미 위성통신 공급망 가동 - 전자신문", "summary": "인텔리안테크가 미국 공장에서 첫 제품을 성공적으로 출하하며 본격적인 북미 위성통신 공급망 가동에 돌입했다. 현지 생산 거점 구축을 통해 급증하는 북미 지역의 저궤도 위성 안테나 수요에 신속하게 대응할 수 있게 됐다. 이번 가동은 글로벌 통신 사업자들과의 파트너십을 강화하고 물류 효율성을 높이는 중요한 계기가 될 것이다. 회사는 북미 시장을 교두보 삼아 글로벌 위성통신 장비 시장 점유율을 더욱 확대할 방침이다.", "source": "전자신문", "date": "2026-09-02 11:15", "url": "https://www.etnews.com/20260902000178", "category": "contract", "importance": 3, "wl": false, "topic": "인텔리안테크 미국"}, {"title": "Seraphim Space Launches New Space ETF with Initial 23-Company Portfolio - satnews.com", "summary": "세라핌 스페이스가 초기 23개 우주 관련 기업 포트폴리오를 담은 새로운 우주 산업 ETF를 출시했다. 우주 통신 및 위성 산업 전반에 대한 투자 자본 유입을 촉진하는 계기이다.", "source": "satnews.com", "date": "2026-09-02 02:42", "url": "https://satnews.com/2026/09/01/seraphim-space-launches-new-space-etf-with-initial-23-company-portfolio/", "category": "other", "importance": 3, "wl": false, "topic": "세라핌스페이스 펀드"}, {"title": "New Helium CEO channels Starlink with enabler platform debut - telcotitans.com", "summary": "탈중앙화 무선 통신 프로젝트 헬륨의 새로운 최고경영자가 스타링크를 연상시키는 혁신적인 인에이블러 플랫폼을 전격 공개했습니다. 위성 및 무선 통신을 아우르는 새로운 서비스 모델을 제시합니다. 신사업 진출 소식입니다.", "source": "telcotitans.com", "date": "2026-09-02 01:05", "url": "https://www.telcotitans.com/network-and-it/new-helium-ceo-channels-starlink-with-enabler-platform-debut/10829.article", "category": "contract", "importance": 3, "wl": false, "topic": "헬륨 신임 ceo 스타스타링크 스타일 플랫폼 데뷔"}], "competitor": [{"title": "DX 적자 속… 삼성전자 동행, 서초 이어 16~30일 이재용 자택 앞 집회", "summary": "삼성전자 DX부문이 올해 2분기 출범 이후 처음으로 분기 영업적자를 기록한 가운데, 스마트폰과 네트워크 사업을 담당하는 MX사업부의 실적 부진이 조명됐다. 글로벌 인프라 투자 정체와 경쟁 심화로 인해 네트워크 사업부를 포함한 DX 부하 사업들의 수익성이 악화된 것으로 나타났다. 회사는 사업 효율화와 체질 개선을 통해 수익성 반등을 모색하고 있다. 대형 제조사의 실적 부진은 통신 장비 시장 전반의 침체 분위기를 반영한다.", "source": "inews24.com", "date": "2026-09-03 11:26", "url": "http://www.inews24.com/view/2001496", "category": "earnings", "importance": 4, "wl": false, "topic": "삼성전자 실적"}, {"title": "브로드컴 “AI칩 매출 3배↑”… 삼성 수혜 기대감 커진다", "summary": "브로드컴이 맞춤형 AI 가속기와 AI 네트워크 반도체 수요 급증에 힘입어 분기 AI칩 매출이 3배 이상 급증했다고 밝혔다. 인공지능 인프라 투자 열풍에 힘입어 데이터센터 및 네트워크 칩 시장의 고성장이 지속되고 있음을 입증했다. 이 과정에서 글로벌 파운드리 강자인 삼성전자와의 협력 가능성이 다시 한번 시장의 주목을 받고 있다. 주요 빅테크들의 AI 네트워크 투자 확대는 관련 장비 및 반도체 생태계 전반에 훈풍을 불어넣고 있다.", "source": "dt.co.kr", "date": "2026-09-03 08:45", "url": "https://www.dt.co.kr/article/12081849?ref=naver", "category": "earnings", "importance": 4, "wl": false, "topic": "브로드컴 실적"}, {"title": "Ericsson adaptive inventory", "summary": "에릭슨이 AI 및 자율 네트워크 시대의 요구를 충족하기 위해 에릭슨 어댑티브 인벤토리(EAI) 솔루션 프로필을 업데이트했다. 통신사의 네트워크 운영 효율성을 높이고 자율형 네트워크 전환을 지원하는 핵심 기술이다.", "source": "RCR Wireless", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-Channel", "category": "tech", "importance": 4, "wl": true, "topic": "에릭슨 적응형 인벤토리 솔루션"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 드론 실시간 추적 등의 기능을 담은 6G 통신 신기술을 전격 공개할 예정이라고 밝혔다. 한국 정부와 주요 기업들을 상대로 기술력을 적극 알리고 협력 방안을 모색하겠다는 전략이다. 고속 데이터 처리 능력을 갖춘 6G와 AI 기능이 통신·레이더 통합 감지(ISAC) 기술과 결합해 통신 효율을 극대화할 것이라고 전망했다. 글로벌 통신 장비 강자의 차세대 기술 시연은 국내 통신 생태계에도 큰 자극제가 될 것이다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디아라비아 통신사 STC와 다년 간의 5G 네트워크 확장 계약을 체결했습니다. 양사는 인프라 고도화와 디지털 전환을 위해 긴밀히 협력하기로 했습니다. 대규모 장비 공급 계약으로 에릭슨의 실적에 긍정적 영향을 미칩니다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 stc 5g망 확장 계약"}, {"title": "Samsung wins ZTE 5G patent case, raising difficult questions for UK courts - IAM Patent", "summary": "삼성전자가 통신 장비 관련 5G 특허 소송에서 승소하며 영국 법원에 중요한 법적 선례를 남겼습니다. 글로벌 지식재산권 공방에서 우위를 점하며 업계의 주목을 받고 있습니다. 특허 라이선스 및 경쟁 구도에 영향을 미치는 사안입니다.", "source": "IAM Patent", "date": "2026-09-01 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "contract", "importance": 4, "wl": false, "topic": "삼성전자 화웨이 zte 특허 소송 승소"}, {"title": "Qualcomm stakes its claim on an AI-native 6G future - Mobile World Live", "summary": "퀄컴이 AI 기반의 네이티브 6G 미래 비전을 공식 선언하며 차세대 통신 시장 선점을 위한 청사진을 제시했다. AI 기술을 무선 접속망 설계 단계부터 내재화하여 통신 효율성과 자율성을 극대화하겠다는 전략이다. 주요 장비 제조사 및 통신사들과의 협력을 통해 6G 표준화 과정에서 주도권을 잡겠다는 의지를 드러냈다. 글로벌 통신 반도체 및 장비 생태계에서 AI와 6G의 융합 가속화는 향후 경쟁 구도에 지대한 영향을 미칠 전망이다.", "source": "Mobile World Live", "date": "2026-09-01 20:04", "url": "https://www.mobileworldlive.com/qualcomm-stakes-its-claim-on-an-ai-native-6g-future/", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g"}, {"title": "우리넷, NIA ‘AI 네트워크 장비 실증’ 주관기관 선정…상용화 추진", "summary": "우리넷이 한국지능정보사회진흥원(NIA)의 'AI 네트워크 장비 실증' 사업 주관기관으로 선정되어 상용화 추진에 나섰다. 회사는 후속 과제인 '6G 수십테라급 초정밀 전달망 시스템 기술 개발'을 통해 관련 기능을 고도화할 계획이다. AI 데이터센터, 원격 로봇수술, 스마트팩토리 등 지연이나 손실에 민감한 응용처에 필수적인 네트워크 장비를 검증한다. 이번 주관기관 선정으로 차세대 광전송 및 통신 장비 시장에서의 입지를 넓히고 있다.", "source": "edaily.co.kr", "date": "2026-09-03 16:46", "url": "https://www.edaily.co.kr/News/Read?newsId=04572326645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "contract", "importance": 3, "wl": false, "topic": "우리넷 nia"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "알에프텍이 5G 통신 장비와 방산 RF 기술 경쟁력을 강화하기 위해 연구개발 조직을 자회사 ‘RFTC’로 분리하고 사업 확대에 나섰다. 5G 안테나 및 필터 기술의 독립적 플랫폼 고도화를 통해 급변하는 통신 및 방산 시장 수요에 신속히 대응할 방침이다. 전문화된 조직 구성을 통해 기술 개발 속도를 높이고 신규 수주 경쟁력을 강화하려는 전략이다. 이번 자회사 출범은 회사의 특화된 RF 장비 사업 확장에 중요한 전환점이 될 것이다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "tech", "importance": 3, "wl": false, "topic": "알에프텍 rftc"}, {"title": "우리넷, AI 데이터센터 겨냥 '16Tbps급 네트워크' 실증… 6G 까지 기술 확...", "summary": "우리넷이 AI 데이터센터를 겨냥한 16Tbps급 대용량 네트워크 실증에 나서며 6G 기술까지 시야를 넓히고 있다. 인공지능 연산에 필요한 대규모 데이터를 손실 없이 정해진 시간에 전달하는 초고속 네트워크 기술을 시험망에서 검증 중이다. 광전송망 기술을 고도화하여 향후 차세대 통신 인프라 시장에서 주도권을 잡겠다는 복안이다. 고성능 네트워크 장비 개발을 위한 업계의 기술 경쟁이 치열해지고 있다.", "source": "joongangenews.com", "date": "2026-09-03 15:18", "url": "https://www.joongangenews.com/news/articleView.html?idxno=545385", "category": "tech", "importance": 3, "wl": false, "topic": "우리넷 ai"}, {"title": "국내외 통신사 CAPEX 절감 및 인프라 투자 정체… 통신 장비 테마 약세 흐...", "summary": "국내외 통신사들의 CAPEX 절감과 인프라 투자 정체로 인해 통신 장비 테마 전반이 약세 흐름을 보이고 있다. 단순한 5G 망 구축 수요만으로는 성장에 한계가 있어 데이터센터, 광통신, 위성통신, 초고주파 등 신사업 분야에서의 실적 확보가 중요해졌다. 통신 장비 기업들은 전통적인 통신사 투자의 부진을 타개하기 위해 포트폴리오 다변화에 주력하고 있다. 장기적인 업황 반등을 위해서는 새로운 기술 영역에서의 실질적인 수주가 필수적이다.", "source": "pinpointnews.co.kr", "date": "2026-09-03 14:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=483544", "category": "other", "importance": 3, "wl": false, "topic": "통신장비 테마"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - The Fast", "summary": "에릭슨이 사우디아라비아 모빌리와 손잡고 AI 기반 RAN 및 자율 네트워크 기술을 고도화합니다. 이번 협력을 통해 중동 지역의 차세대 통신망 혁신을 가속화할 방침입니다. 에릭슨의 글로벌 통신 장비 시장 입지를 강화하는 계기가 됩니다.", "source": "The Fast Mode", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 모빌리 ai ran 협력"}, {"title": "알에프텍, 5G 기술 방산으로 확대…RF 자회사 'RFTC' 출범", "summary": "알에프텍이 과거 삼성전자에 5G 안테나 필터 유닛을 공급하며 RF 장비 시장에 진입했던 이력을 바탕으로 방산 분야로 기술을 확장하고 있다. 매시브 다이입출력(Massive MIMO) 기지국용 안테나 및 필터 공급을 통해 탄탄한 설계와 제조 검증 역량을 쌓아왔다. 통신 장비 시장에서 다진 기술력을 발판 삼아 새로운 응용처로 사업 영역을 넓혀가는 모범적인 사례다. 삼성전자와의 협력 경험은 회사의 기술적 신뢰성을 높이는 중요한 자산이다.", "source": "fnnews.com", "date": "2026-09-03 13:41", "url": "https://www.fnnews.com/news/202609031334337249", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 삼성전자"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 6G 기지국을 활용해 드론을 탐지할 수 있는 기술 시연을 공개했습니다. 차세대 이동통신 인프라가 통신을 넘어 다양한 센싱 기능을 수행할 수 있음을 보여줍니다. 향후 네트워크 기술의 활용 범위를 넓히는 연구 성과입니다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 6g 기지국 드론 탐지 기술"}, {"title": "Ericsson powers Saudi Arabia’s next phase of digital transformation and innovation - Tahaw", "summary": "에릭슨이 사우디아라비아의 차세대 디지털 전환과 혁신을 기술적으로 뒷받침하고 있습니다. 대규모 통신 인프라 구축 프로젝트를 안정적으로 수행 중입니다. 중동 시장에서 에릭슨의 입지가 더욱 공고해지고 있습니다.", "source": "TahawulTech.com", "date": "2026-09-03 07:04", "url": "https://www.tahawultech.com/home-slide/ericsson-powers-saudi-arabias-next-phase-of-digital-transformation-and-innovation/", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 사우디 디지털 전환 주도"}, {"title": "Can Nokia's Saudi AI Network Automation Expansion Drive Growth? - Yahoo Finance Singapore", "summary": "노키아의 사우디아라비아 AI 네트워크 자동화 사업 확장이 기업의 실적 성장을 견인할 수 있을지 분석했습니다. 중동 지역에서의 공격적인 투자가 장기적 가치 창출로 이어질지 주목됩니다. 시장의 기대를 반영합니다.", "source": "Yahoo Finance Singapore", "date": "2026-09-03 00:53", "url": "https://sg.finance.yahoo.com/news/nokias-saudi-ai-network-automation-155300075.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 ai 자동화 확장 성과"}, {"title": "FIS stock gains on Ericsson wallet partnership and Q2 banking growth - ad-hoc-news.de", "summary": "에릭슨이 금융 IT 기업 FIS와의 월렛 파트너십 체결 소식에 힘입어 주가가 상승했습니다. 통신 기술과 금융 서비스의 융합을 통한 신사업 확장을 추진하고 있습니다. 비즈니스 다변화 전략의 3, "wl": false, "topic": "에릭슨 fis 월렛 파트너십 성장 전망"}, {"title": "Nokia partners with Saudi Arabia on network automation R&D - Telecoms", "summary": "노키아가 사우디아라비아와 손잡고 네트워크 자동화 분야의 R&D 협력을 본격화합니다. AI 기술을 접목한 차세대 통신 인프라 구축을 주도할 계획입니다. 현지 정부와의 긴밀한 파트너십을 구축합니다.", "source": "Telecoms", "date": "2026-09-02 00:05", "url": "https://www.telecoms.com/automation/nokia-partners-with-saudi-arabia-on-network-automation-r-d", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 네트워크 자동화 협력"}], "policy": [{"title": "India weighs ‘rip and replace’ plan for Chinese telecom gear - Communications Today", "summary": "인도 정부가 자국 통신망에서 중국산 통신 장비를 전면 교체하는 '립 앤 리플레이스' 계획을 검토하고 있습니다. 국가 안보를 이유로 화웨이 등 중국 장비 업체를 배제하려는 글로벌 규제 흐름의 연장선입니다. 글로벌 통신 장비 시장의 판도에 큰 파장을 일으킬 사안입니다.", "source": "Communications Today", "date": "2026-09-01 19:18", "url": "https://www.communicationstoday.co.in/india-weighs-rip-and-replace-plan-for-chinese-telecom-gear/", "category": "policy", "importance": 5, "wl": false, "topic": "인도 중국산 통신장비 퇴출 검토"}, {"title": "美, 반도체 완제품까지 관세 확대 검토…\"미국서 생산하면 감면\"", "summary": "미국 정부가 반도체 완제품까지 관세 부과 범위를 확대하는 방안을 검토하면서 한국 반도체 기업들의 현지 투자 전략에 비상이 걸렸다. 데이터센터 서버에는 메모리뿐만 아니라 고성능 네트워크 반도체와 가속기 등이 대거 탑재되기 때문에 통과 관세의 파장이 클 것으로 예상된다. 미국 내 직접 생산을 유도하는 이번 조치는 글로벌 공급망 재편을 가속화할 것이다. 국내 장비 및 부품 업계 역시 미 정부의 통상 정책 변화를 예의주시하고 있다.", "source": "view.asiae.co.kr", "date": "2026-09-03 08:52", "url": "https://view.asiae.co.kr/article/2026090308520068893", "category": "policy", "importance": 4, "wl": false, "topic": "미국 관세"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 대중국 화웨이 제재가 완제품을 넘어 부품 공급망 전반으로 확산되면서 국내 통신 장비 및 부품 업체들이 반사이익을 얻을 수 있다는 분석이 제기되었습니다. 글로벌 공급망 재편 속에서 한국 기업들의 기회가 모색되고 있습니다. 장비 산업 내 중요한 전략적 변화입니다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 제재 부품 확산 및 국내 장비업체 수혜"}, {"title": "AT&T ditching phone landlines, members of Con 제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "국내 통신 3사가 세제 혜택, 주파수 할당 체계 개편, 규제 완화 등 3박자를 갖춘 네트워크 및 AIDC 지원 확대 패키지를 요구했다. 과기정통부 통신정책기획과장은 민관협의체를 통해 투자환경 개선 방안을 구체적으로 논의하겠다고 화답했다. 3G 서비스 종료 등 레거시 망 정리를 통해 5G 및 6G 투자를 위한 여력을 확보해야 한다는 데 공감대가 형성됐다. 통신 인프라 투자를 촉진하기 위한 정부와 업계 간의 제도 개선 논의가 본격화되고 있다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 3, "wl": false, "topic": "과학기술정보통신부 네트워크"}, {"title": "The Kingsbury Commitment Promised Competition. AT&T Got 98% of Long Distance - Broadband B", "summary": "과거 AT&T의 장거리 전화 독점 체제를 형성했던 킹스베리 협약의 역사적 의미와 경쟁 촉진 약속의 이면을 되돌아보았습니다. 미국 통신 규제 역사에 관한 회고성 분석입니다. 산업사적 관점의 기사입니다.", "source": "Broadband Breakfast", "date": "2026-09-02 21:30", "url": "https://broadbandbreakfast.com/the-kingsbury-commitment-promised-competition-at-t-got-98-of-long-distance/", "category": "policy", "importance": 3, "wl": false, "topic": "킹스베리 협약 및 at&t 장거리 독점 역사"}, {"title": "Senate Panel Pushes For Lower Mobile Phone Taxes To Support 5G Rollout - PhoneWorld", "summary": "파키스탄 상원 패널이 5G 전국망 조기 구축을 지원하기 위해 모바일폰 관련 세금을 대폭 인하할 것을 촉구하고 나섰다. 높은 통신세가 단말기 보급과 데이터 이용을 가로막아 국가 디지털 경제 성장의 발목을 잡고 있다는 지적이다. 정부 차원에서 세제 개편을 통해 통신사의 투자 여력을 확보하고 가입자 진입 장벽을 낮추려는 움직임이 가시화되고 있다. 이번 조치가 성사될 경우 파키스탄 내 모바일 및 5G 인프라 투자가 탄력을 받을 것으로 보인다.", "source": "PhoneWorld", "date": "2026-09-02 13:54", "url": "https://www.phoneworld.com.pk/senate-panel-lower-mobile-phone-taxes-5g-rollout/", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 상원"}, {"title": "Foreign Air Carriers To Challenge FCC Altimeters Order - Law360", "summary": "외국 항공사들이 미국 FCC의 항공기 고도계 관련 명령에 대해 공동으로 법적 대응에 나설 채비를 하고 있다. 5G 통신 주파수 확산에 따른 전파 간섭 문제로 인해 고도계 오작동 우려가 제기되면서 규제 당국과 업계 간 갈등이 지속되고 있다. 항공 안전과 원활한 통신 서비스 도입 사이의 접점을 찾는 과정에서 이해관계자 간 마찰이 불가피한 상황이다. 이번 법적 공방의 결과는 향후 5G 전파 간섭 규제 정책에 큰 선례가 될 수 있다.", "source": "Law360", "date": "2026-09-02 08:16", "url": "https://www.law360.com/articles/2520343/fo , "date": "2026-09-03 17:27", "url": "https://www.datatooza.com/article/20260903172751600752ef3ef162_80", "category": "contract", "importance": 4, "wl": false, "topic": "lg유플러스 수주"}, {"title": "Deutsche Telekom shares rise as sources say Elliott builds stake, opposes T-Mobile deal - ", "summary": "엘리엇의 지분 매입 소식과 T모바일 딜 반대 입장이 전해지면서 도이치텔레콤 주가가 상승했다. 시장은 행동주의 펀드의 개입이 회사의 자본 배치 및 합병 전략에 어떤 변화를 가져올지 주시하고 있다. 통신사 경영권 및 M&A 이슈와 직결된다.", "source": "TradingView", "date": "2026-09-03 17:21", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N44V0JM:0-deutsche-telekom-shares-rise-as-sources-say-elliott-builds-stake-opposes-t-mobile-deal/", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 지분경쟁"}, {"title": "SKT·KT·LGU+, 정부에 '네트워크 투자' 지원 촉구 - 블로터", "summary": "SK텔레콤, KT, LG유플러스 등 국내 통신 3사가 정부를 향해 네트워크 투자에 대한 적극적인 지원을 촉구했다. 5G 및 차세대 통신망 고도화를 위한 세제 혜택과 정책적 뒷받침을 요구하는 목소리를 전달했다. 국내 통신 인프라 투자 활성화 여부에 영향을 미치는 사안이다.", "source": "블로터", "date": "2026-09-03 15:57", "url": "https://www.bloter.net/news/articleView.html?idxno=672549", "category": "policy", "importance": 4, "wl": false, "topic": "sk텔레콤 정책"}, {"title": "LS일렉·KT클라우드 맞손···AI 데이터센터 전력 인프라 공략 - 이뉴스투데이", "summary": "LS일렉트릭과 KT클라우드가 손잡고 AI 데이터센터 전력 인프라 시장 공략에 나섰다.", "source": "이뉴스투데이", "date": "2026-09-03 15:45", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2466379", "category": "contract", "importance": 4, "wl": false, "topic": "kt클라우드 인프라"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "SK텔레콤과 LG유플러스 등 국내 통신사들이 5G SA 고도화와 주파수 경매 변수를 앞두고 망 투자 확대 여부를 저울질하고 있다. 특히 기지국과 AI 기술을 결합해 운영 효율을 극대화하는 AI-RAN 기술 도입이 화두로 떠올랐다. SK텔레콤은 정부의 AI-RAN 관련 국책 사업에 참여하여 삼성전자, 에릭슨, 노키아 등 주요 장비 제조사들과 실증 작업을 진행하고 있다. 차세대 네트워크 전환을 위한 통신사와 장비사 간의 협력은 향후 통신 인프라 시장의 향방을 가를 핵심 변수다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "contract", "importance": 4, "wl": false, "topic": "sk텔레콤 ai"}, {"title": "Telekom's Boardroom Reshuffle Puts a 48-Quarter Winning Streak to the Test - AD HOC NEWS", "summary": "도이치텔레콤의 이사회 개편이 오랜 기간 이어져 온 실적 호조세를 시험대에 올리게 되었다. 경영진 변화가 회사의 지속적인 성과 창출에 미칠 영향에 대한 시장의 우려와 기움이 공존한다.", "source": "AD HOC NEWS", "date": "2026-09-03 10:30", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/telekom-s-boardroom-reshuffle-puts-a-48-quarter-winning-streak-to-the-test/70046488", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 경영진"}, {"title": "Elliott Builds Stake in Deutsche Telekom Amid T-Mobile Merger Talks - Global Banking & Fin", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤의 지분을 대거 매입하며 영향력 행사에 나섰다. T-모바일과의 합병 논의 등 굵직한 통신사 간 M&A 및 지배구조 개편 이슈와 맞물려 시장의 이목이 집중되고 있다. 엘리엇의 참전은 도이치텔레콤의 자산 재배치와 주주 환원 정책에 상당한 압박으로 작용할 전망이다. 유럽과 미국을 잇는 거대 통신 자본의 전략적 행보는 글로벌 통신 업계의 M&A 구도에 변수가 되고 있다.", "source": "Global Banking & Finance Review", "date": "2026-09-03 10:18", "url": "https://www.globalbankingandfinance.com/elliott-built-stake-deutsche-telekom-opposes-t-mobile-merger/", "category": "contract", "importance": 4, "wl": false, "topic": "도이치텔레콤 엘리엇"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "일본 KDDI가 6G 후보 주파수인 7GHz 대역에서 세계 최고 수준인 3.6 Gbps 옥외 무선 전송에 성공했습니다. 차세대 이동통신 기술 상용화를 위한 실증 시험의 중요한 진전입니다. 주요 통신사의 선도적 기술 확보를 보여줍니다.", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 7ghz 대역 3.6 gbps 옥외 전송"}, {"title": "AT&T goes to the mat over Charter's use of 'fiber-powered' label for HFC", "summary": "AT&T가 차터 커뮤니케이션즈를 상대로 HFC 네트워크를 통해 제공되는 광대역 서비스에 '파이버 파워드'라는 표현을 사용하는 것은 소비자에게 혼란을 주는 허위 광고라며 소송을 제기했다. 통신 사업자 간 마케팅 및 브랜드 명칭을 둘러싼 법적 공방이 심화되고 있다.", "source": "Light Reading", "date": "2026-09-02 00:55", "url": "https://www.lightreading.com/broadband/at-t-goes-to-the-mat-over-charter-s-use-of-fiber-powered-label-for-hfc", "category": "policy", "importance": 4, "wl": true, "topic": "at&t 대 차터 허위광고 소송"}, {"title": "Keppel, Singtel land major DC deals in Japan, Singapore", "summary": "케펠 DC REIT가 도쿄 내 하이퍼스케일 데이터센터 두 곳의 과반수 지분을 인수할 예정이며, 싱텔과 KKR은 STT GDC 지분 52억 달러 인수를 완료했다. 아시아 지역 내 대규모 데이터센터 인프라 투자가 가속화되고 있다.", "source": "Light Reading", "date": "2026-09-01 22:43", "url": "https://www.lightreading.com/data-centers/keppel-dc-reit-expands-japan-assets-as-singtel-kkr-close-5-2b-stt-gdc-deal", "category": "contract", "importance": 4, "wl": true, "topic": "케펠 싱텔 데이터센터 거래"}, {"title": "Debt Reduction Meets Digital Ambition: Inside The Structure Of Jio Platforms’ Mega IPO - i", "summary": "지오 플랫폼스의 대규모 기업공개(IPO) 추진 구조와 부채 감축 및 디지털 사업 야망 간의 연계성을 분석했다. 방대한 통신 및 디지털 인프라 투자를 감당하기 위한 자본 재편 작업이다. 인도 통신 시장에서의 막대한 영향력을 재확인시키는 재무적 사건이다.", "source": "inventiva.co.in", "date": "2026-09-01 19:56", "url": "https://www.inventiva.co.in/stories/debt-reduction-meets-digital-ambition-inside-the-structure-of-jio-platforms-mega-ipo/", "category": "earnings", "importance": 4, "wl": false, "topic": "릴라이언스지오 ipo"}, {"title": "[인도 특징주] 릴라이언스 지오 IPO 승인 획득…투자자들이 알아야 할 7가지 위험 요소 - 네이트", "summary": "인도 릴라이언스 지오가 기업공개(IPO) 승인을 획득하며 대규모 상장 절차에 돌입했다. 인도 최대 통신사인 지오의 상장은 그룹 전체의 자금력을 강화하고 향후 5G 및 차세대 통신 인프라 투자를 가속화하는 계기가 될 전망이다. 다만 규제 리스크와 시장 경쟁 심화 등 투자자들이 유의해야 할 위험 요소들도 함께 제기되고 있다. 지오의 성공적인 증시 입성은 글로벌 통신 및 빅테크 시장에 큰 파장을 불러일으킬 것으로 보인다.", "source": "네이트", "date": "2026-09-01 19:01", "url": "https://news.nate.com/view/20260901n35973?mid=n1101", "category": "contract", "importance": 4, "wl": false, "topic": "릴라이언스지오 인도"}, {"title": "울산 시내버스 726대 차세대 와이파이로 전면 교체", "summary": "울산시가 시내버스 762대의 노후 와이파이 장비를 철거하고 5G 백홀 기반의 차세대 와이파이 7 장비로 전면 교체한다. 기존에 제각각이던 통신 장비를 일원화하여 대역폭을 넓히고 통신 품질을 대폭 향상시킨다는 방침이다. 백홀망 고도화를 통해 버스 승객들에게 끊김 없는 고속 무선인터넷 환경을 제공할 수 있게 됐다. 지자체의 대중교통 공공와이파이 인프라 고도화는 모바일 네트워크 활용도를 높이는 계기가 된다.", "source": "iusm.co.kr", "date": "2026-09-03 18:20", "url": "https://www.iusm.co.kr/news/articleView.html?idxno=1067423", "category": "contract", "importance": 3, "wl": false, "topic": "울산시 와이파이"}, {"title": "티빙 개인정보 유출 보상 1인당 2만원… SKT와 비슷 - IT조선", "summary": "티빙 개인정보 유출 보상금으로 1인당 2만 원이 책정된 것이 SKT의 사례와 유사하다는 점을 보도했다. 통신 및 미디어 플랫폼의 보안 사고 및 소비자 보상 정책을 비교한다.", "source": "IT조선", "date": "2026-09-03 18:01", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169458", "category": "outage", "importance": 3, "wl": false, "topic": "kt 보안사고"}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "우리넷이 한국지능정보사회진흥원(NIA)의 KOREN 기반 AI 네트워크 장비 시범도입 실증 사업 주관기관으로 선정되어 16Tbps급 국산 장비 상용화에 나선다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "contract", "importance": 3, "wl": true, "topic": "우리넷 ai 네트워크 장비 실증"}, {"title": "[통신3사 AI 경량화] KT, 기업용 AI 크기 세분화…‘B2B’ 전략 : 네이버 블로그 - Naver Blog", "summary": "KT가 B2B 시장을 겨냥해 기업용 AI 크기를 세분화하는 맞춤형 전략을 추진한다. 다양한 규모의 기업 고객 수요에 맞춘 AI 솔루션 공급을 확대하고 있다.", "source": "Naver Blog", "date": "2026-09-03 17:40", "url": "https://blog.naver.com/PostView.naver?blogId=dealsite&logNo=224399940686&redirect=Dlog", "category": "tech", "importance": 3, "wl": false, "topic": "kt 인공지능"}, {"title": "통신3사, “AI 네트워크는 국가 전략 인프라, 지원책 절실” 한목소리", "summary": "국내 통신 3사가 5G 단독모드 및 6G 등 차세대 기술 투자가 시급한 시점이나 시장 성정 정체로 수익 창출이 어렵다며 정부의 적극적인 지원책을 한목소리로 촉구했다. 네트워크 정책의 패러다임을 전환하여 국가 전략 인프라로서의 통신망에 대한 제도적 지원이 절실하다는 입장이다. 투자가 실제 현장 실증과 초기 수요로 이어져야 지속 가능한 성장이 가능하다는 지적이다. 통신 업계와 정부 간의 정책 공조 방향에 이목이 쏠리고 있다.", "source": "kidd.co.kr", "date": "2026-09-03 17:40", "url": "https://kidd.co.kr/news/247290", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 ai"}, {"title": "“매장도 광고 플랫폼” KT, CU와 손잡고 리테일 미디어 확대 - 디지틀조선TV", "summary": "KT가 CU와 협력하여 오프라인 매장을 광고 플랫폼으로 활용하는 리테일 미디어 사업을 확대한다.", "source": "디지틀조선TV", "date": "2026-09-03 17:03", "url": "https://www.dizzotv.com/site/data/html_dir/2026/09/03/2026090380195.html", "category": "contract", "importance": 3, "wl": false, "topic": "kt 광고사업"}, {"title": "성남교육지원청-KT그룹, 초등 방과후·돌봄 대상 무상 'AI·로봇 코딩 교실' 본격 운영 - 누리일보", "summary": "성남교육지원청과 KT그룹이 초등학생 방과후 돌봄 아동을 대상으로 무상 AI 및 로봇 코딩 교육 교실을 본격 운영한다.", "source": "누리일보", "date": "2026-09-03 15:50", "url": "https://nuriilbo.com/news/article.html?no=902826", "category": "contract", "importance": 3, "wl": false, "topic": "kt 인프라"}, {"title": "\"은행·증권·보험·연금 한눈에\"…해빗팩토리, SKT 손잡고 ‘금융 AI’ 출격 - 조세일보", "summary": "핀테크 기업 해빗팩토리가 SKT와 손잡고 금융 AI 서비스를 선보인다. SKT의 AI 기술력을 바탕으로 자산관리 및 노후설계 영역으로 AI 적용 범위를 확장한다.", "source": "조세일보", "date": "2026-09-03 15:05", "url": "https://m.joseilbo.com/news/view.htm?newsid=575025", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 인공지능"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤은 AWS의 얀 호프메이어를 신임 CTO로 영입하며, 크리스티안 일렉 CFO는 2027년 5월에 퇴임할 예정이라고 발표했다. 이번 최고 기술 책임자 영입은 통신사의 클라우드 및 네트워크 기술 혁신 전략에 영향을 미칠 것으로 예상된다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 임원 인사"}, {"title": "Japanese 6G groups sign MoU on human augmentation use cases - Telecompaper", "summary": "일본의 여러 6G 연구 그룹들이 인체 증강(Human augmentation) 유스케이스 발굴을 위한 업무협약(MoU)을 체결했습니다. 차세대 이동통신 환경에서의 새로운 응용 서비스 연구를 협력합니다. 미래 기술 표준화 움직임입니다.", "source": "Telecompaper", "date": "2026-09-03 14:56", "url": "https://www.telecompaper.com/news/japanese-6g-groups-sign-mou-on-human-augmentation-use-cases--1581567", "category": "tech", "importance": 3, "wl": false, "topic": "일본 6g 연구 그룹 인체 증강 mou 체결"}, {"title": "[ET톡] 6G 1등 국가의 조건", "summary": "과거 5G 세계 최초 상용화의 아 상처를 교훈 삼아 진정한 의미의 최고 기술을 갖춘 6G 1등 국가가 되어야 한다는 목소리가 커지고 있다. 단순한 타이틀 획득보다는 기술력과 산업 생태계 전반에서 우위를 점하는 것이 실질적인 목표여야 한다는 지적이다. 정부와 업계는 차세대 네트워크 표준 선점과 핵심 기술 자립을 위해 역량을 모으고 있다. 6G 시대의 경쟁력은 철저한 기술 준비와 내실 있는 투명성에 달려 있다.", "source": "etnews.com", "date": "2026-09-03 13:44", "url": "https://www.etnews.com/20260903000237", "category": "policy", "importance": 3, "wl": false, "topic": "6g 1등 국가"}, {"title": "VodafoneThree to launch debut TV service in challenge to UK rivals", "summary": "영국 통신 그룹인 보다폰스리가 새로운 TV 플랫폼을 도입하여 영국의 브로드밴드 사업을 두 배로 확대하려는 전략을 추진한다.", "source": "Financial Times Tech", "date": "2026-09-03 13:00", "url": "https://www.ft.com/content/b44fcdbd-4c0e-4032-b81a-98e309991388", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰스리 tv 서비스 출시"}, {"title": "베트남은 5G 주파수 확보를 위해 2026년 9월 15일부터 2G 네트워크를 완전히 공식적으로 폐쇄할 예정이다. - vietnam.vn", "summary": "베트남 정부가 다가오는 2026년 9월 15일부터 2G 네트워크를 공식적으로 전면 폐쇄하고 5G 주파수 확보에 나선다. 한정된 주파수 자원을 효율적으로 재배치하여 5G 인프라 투자를 촉진하고 국가 디지털 경쟁력을 제고하기 위한 조치다. 통신사들은 남아있는 2G 가입자들을 빠르게 상위 네트워크로 이전시키는 작업을 진행하고 있다. 이번 2G 완전 종료 계획은 베트남 통신 시장이 차세대 고도화 단계로 완전히 진입하는 분수령이 될 것이다.", "source": "vietnam.vn", "date": "2026-09-03 12:05", "url": "https://www.vietnam.vn/ko/viet-nam-chinh-thuc-tat-hoan-toan-mang-2g-tu-ngay-15-9-2026-nham-giai-phong-tan-so-cho-5g", "category": "policy", "importance": 3, "wl": false, "topic": "베트남 네트워크"}, {"title": "LG유플러스, AI상담원에 ‘감독관’ 붙인다…어라이즈AI와 손잡아 - 디잇플러스", "summary": "LG유플러스가 AI 상담원의 품질을 관리하는 감독관 시스템 도입을 위해 어라이즈AI와 협력한다. 고객센터의 AI 전환 및 품질 고도화를 추진한다.", "source": "디잇플러스", "date": "2026-09-03 10:30", "url": "https://www.theitplus.kr/news/articleView.html?idxno=2167", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 인공지능"}, {"title": "KT, 국가 공공사업 수주 '압도적'…해킹에 제동 걸리나 - SR타임스", "summary": "KT가 국가 공공사업 수주에서 압도적인 성과를 거두는 가운데 최근 발생한 해킹 등 보안 사고가 향후 수주전에 어떤 제동을 걸지 분석했다.", "source": "SR타임스", "date": "2026-09-03 10:22", "url": "https://www.srtimes.kr/news/articleView.html?idxno=211462", "category": "policy", "importance": 3, "wl": false, "topic": "kt 정책"}, {"title": "CHTR Stock Pops As Spectrum, Cox, Liberty Deals Reshape Charter - timothysykes.com", "summary": "스펙트럼, 콕스, 리버티 등의 인수합병 및 지분 제휴 딜이 차터 커뮤니케이션스의 기업 구조를 재편하며 주가 상승을 이끌었습니다. 미국 케이블 통신 업계의 대형 제휴 소식입니다. 통신 및 미디어 시장의 구도 변화를 보여줍니다.", "source": "timothysykes.com", "date": "2026-09-03 05:47", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02-2/", "category": "contract", "importance": 3, "wl": false, "topic": "차터 스펙트럼 콕스 리버티 m&a 딜"}, {"title": "CHTR Stock Pops As Charter Leans Into Scale And Streaming Bundles - timothysykes.com", "summary": "차터 커뮤니케이션스가 규모의 경제를 활용하고 스트리밍 번들 상품을 강화하면서 주가 반등을 이끌어내고 있습니다. 케이블 TV와 초고속인터넷을 결합한 경쟁력 강화 전략입니다. 사업 모델 다변화입니다.", "source": "timothysykes.com", "date": "2026-09-03 04:03", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "contract", "importance": 3, "wl": false, "topic": "차터 규모 확장 및 스트리밍 번들 전략"}, {"title": "New star in comms firmament – Softbank positions HAPS between terrestrial and satellite", "summary": "소프트뱅크의 최신 HAPS(고고도 플랫폼 정거장) 실증 시험은 성층권이 통신 사각지대를 해소하는 것을 넘어 광역 셀룰러, 프라이빗 네트워크, 드론, 에지 컴퓨팅을 결합할 수 있는 잠재력을 보여주었다.", "source": "RCR Wireless", "date": "2026-09-03 01:08", "url": "https://rcrwireless.com/20260902/network-infrastructure/softbank-positions-haps-between-terrestrial-and-satellite", "category": "tech", "importance": 3, "wl": true, "topic": "소프트뱅크 haps 위성 통신"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 로봇과 드론 등 피지컬 AI 장비가 AI-RAN 시험망과 5G 망을 자유롭게 오가는 환경에서 네트워크 전환 기술 검증에 성공했다. 무선 환경이 수시로 변하는 상황에서도 최적의 네트워크 경로를 자동으로 선택하고 안정적인 연결을 유지하는 핵심 기술이다. 차세대 AI 네트워크 인프라의 상용화를 앞당기는 중요한 기술적 진전으로 평가된다. 통신사와 학계의 협력을 통한 실증 작업이 활발히 이루어지고 있다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 연세대"}, {"title": "\"삐, 공사장 탐지됐습니다\"…AI가 미리 찾는 통신망 위험 - 네이트", "summary": "국내 통신사들이 AI 기술을 활용해 공사장 등 통신망 인근의 위험 요소를 사전에 감지하는 시스템을 도입하고 있다. 굴착 공사 등으로 인한 지하 통신 케이블 파손 사고를 예방하기 위해 인공지능 영상 분석 및 탐지 기술이 적용된다. 통신망 안정성을 높이고 대규모 장애를 미연에 방지하기 위한 선제적 대응의 일환이다. AI 기반의 인프라 관리 고도화는 통신사들의 운영 효율성을 크게 향상시킬 것으로 기대된다.", "source": "네이트", "date": "2026-09-03 00:31", "url": "https://m.news.nate.com/view/20260903n00346?mid=m02&list=recent&cpcd=", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 통신망"}, {"title": "[봇규의 헬로BOT] ‘피지컬 AI 1강’으로 ② | 실증은 늘렸다, 근데 산업...", "summary": "제조 장비, 물류 시스템, 드론 등 산업 현장에서 자율적으로 움직이는 피지컬 AI 구현을 위한 통신 인프라의 중요성이 강조되고 있다. 자립형 5G 단독모드(5G SA)와 AI 무선접속망(AI-RAN)을 현장에 구축하여 초고속·초저지연 환경을 제공하는 것이 핵심이다. 산업용 로봇의 원활한 제어와 실시간 데이터 처리를 위해 차세대 네트워크 기술 도입이 필수적이다. 스마트팩토리 고도화를 위한 통신 업계의 기술 개발 경쟁이 이어지고 있다.", "source": "hellot.net", "date": "2026-09-03 00:08", "url": "https://www.hellot.net/news/article.html?no=114727", "category": "tech", "importance": 3, "wl": false, "topic": "기타 로봇"}, {"title": "NTT's Transatel brings eSIM Bootstrap service to Samsung Galaxy Z phones - Telecompaper", "summary": "NTT의 트랜사텔이 삼성 갤럭시 Z 시리즈에 eSIM 부트스트랩 서비스를 제공하기 시작했습니다. 사용자의 원활한 초기 네트워크 연결을 지원합니다. 통신 서비스와 제조사 간의 협업입니다.", "source": "Telecompaper", "date": "2026-09-03 00:02", "url": "https://www.telecompaper.com/news/ntts-transatel-brings-esim-bootstrap-service-to-samsung-galaxy-z-phones--1581526", "category": "contract", "importance": 3, "wl": false, "topic": "ntt 트랜사텔 삼성 갤럭시 esim 지원"}, {"title": "What’s up with… Deutsche Telekom, 4iG, WIOCC - telecomtv.com", "summary": "도이치텔레콤을 비롯한 유럽 주요 통신사들의 최근 사업 동향과 시장 변화를 다뤘다. 유럽 통신 인프라 시장의 주요 플레이어들의 전략적 움직임을 점검하는 분석이다.", "source": "telecomtv.com", "date": "2026-09-02 23:55", "url": "https://www.telecomtv.com/content/digital-platforms-services/what-s-up-with-deutsche-telekom-4ig-wiocc-56163/amp/", "category": "other", "importance": 3, "wl": false, "topic": "도이치텔레콤 동향"}, {"title": "DT hires AWS's Jan Hofmeyr as CTO", "summary": "도이치텔레콤이 AWS 임원인 얀 호프메이어를 2026년 11월부로 CTO에 임명하고, 크리스티안 일렉 CFO는 2027년 5월에 은퇴한다고 밝혔다. 통신 인프라와 재무 부문의 리더십 변화를 통해 차세대 네트워크 전략에 변화가 예상된다.", "source": "Light Reading", "date": "2026-09-02 23:47", "url": "https://www.lightreading.com/broadband/dt-hires-aws-s-jan-hofmeyr-as-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 임원 영입"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에서의 프라이빗 5G 배포를 위한 새로운 계획을 마련했으나, 구체적인 주파수 할당 계획은 포함되지 않았다. 향후 산업용 네트워크 시장 확대에 제약 요인으로 작용할 수 있다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 프라이빗 5g 규제 완화"}, {"title": "Deutsche GigaNetz restructures premium portfolio in response to trend in high-speed tariff", "summary": "독일 통신 인프라 사업자 도이치 기가넷이 고속 인터넷 요금제 트렌드 변화에 대응해 프리미엄 포트폴리오를 개편했다. 초고속 브로드밴드 시장의 가입자 유치 경쟁을 반영한다.", "source": "Telecompaper", "date": "2026-09-02 22:39", "url": "https://www.telecompaper.com/news/deutsche-giganetz-restructures-premium-portfolio-in-response-to-trend-in-high-speed-tariff-market--1581503", "category": "other", "importance": 3, "wl": false, "topic": "도이치기가넷 요금제"}, {"title": "Charter Communications (CHTR) CFO to leave; longtime insider to step in - Stock Titan", "summary": "미국 대형 통신 및 케이블 기업 차터 커뮤니케이션스의 최고재무책임자(CFO)가 사임하고 오랜 기간 재직해 온 내부 인사가 그 자리를 이어받습니다. 최고경영진 교체를 통한 조직 개편입니다. 경영 안정성을 도모합니다.", "source": "Stock Titan", "date": "2026-09-02 22:10", "url": "https://www.stocktitan.net/sec-filings/CHTR/8-k-charter-communications-inc-mo-reports-material-event-416f161ea11d.html", "category": "exec", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션스 cfo 사임 및 내부 승계"}, {"title": "NTT Transatel enhances the eSIM Bootstrap Connectivity Experience on the latest Samsung Ga", "summary": "NTT 산하의 트랜사텔이 최신 삼성 갤럭시 기기에서 eSIM 부트스트랩 연결 경험을 향상시킵니다. 글로벌 로밍 및 네트워크 접속 편의성을 높이는 협력입니다. 삼성 단말기를 매개로 한 통신 서비스 개선 사례입니다.", "source": "Yahoo Finance", "date": "2026-09-02 21:00", "url": "https://finance.yahoo.com/technology/articles/ntt-transatel-enhances-esim-bootstrap-120000663.html", "category": "contract", "importance": 3, "wl": false, "topic": "ntt 트랜사텔 삼성 갤럭시 esim 협력"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "AI 국가 경쟁력을 확보하기 위해 3G 같은 구형 레거시 네트워크를 유지하는 부담을 덜고 5G SA나 6G 등 차세대 망 투자를 지원해야 한다는 주장이 제기됐다. 과기정통부 관계자는 새로운 통신 서비스 창출을 위해 네트워크 투자의 편익을 높이는 방안을 검토하겠다고 밝혔다. 통신사들이 과도한 유지보수 비용 속에서 미래 인프라 투자를 감당하기 위해서는 정부의 정책적 뒷받침이 필수적이다. 차세대 네트워크 고도화는 국가 AI 생태계의 근간을 이룬다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 3, "wl": false, "topic": "ai 국가 경쟁력"}, {"title": "Vi Gets a New Look: Unveils 3D Brand Identity and Teases Major Transformation With Shah Ru", "summary": "보다폰 아이디어가 3D 브랜드 아이덴티티를 공개하고 샤룩 칸과 함께 대규모 브랜드 변화를 예고했다. 통신 시장 내 경쟁력 회복을 위한 전면적인 이미지 개편 작업의 일환이다. 가입자 이탈을 막고 반등을 모색하기 위한 경영 전략을 담고 있다.", "source": "paidfreedroid.com", "date": "2026-09-02 20:01", "url": "https://paidfreedroid.com/2026/09/vi-shah-rukh-khan-rebrand-3d-logo-network-change.html/amp", "category": "other", "importance": 3, "wl": false, "topic": "보다폰아이디어 경영전략"}, {"title": "Verizon deploys Frontline Crisis Response teams in Indiana, Hawaii - Telecompaper", "summary": "버라이즌이 인디애나주와 하와이주 등 재난 발생 지역에 특수 위기 대응 팀인 '프론트라인'을 긴급 배치했습니다. 공공 안전 및 비상 통신 지원 임무를 수행합니다. 통신사의 공공 안전망 역할입니다.", "source": "Telecompaper", "date": "2026-09-02 19:57", "url": "https://www.telecompaper.com/news/verizon-deploys-frontline-crisis-response-teams-in-indiana-hawaii--1581470", "category": "contract", "importance": 3, "wl": false, "topic": "버라이즌 프론트라인 위기 대응 팀 파견"}, {"title": "Telekom's Success Paradox: When Outperformance Becomes the Bear Case - AD HOC NEWS", "summary": "도이치텔레콤의 뛰어난 실적 아웃퍼폼이 오히려 시장에서 리스크 요인으로 작용할 수 있다는 역설적 분석을 다뤘다. 고공행진하는 실적에 대한 향후 지속 가능성 평가를 담고 있다.", "source": "AD HOC NEWS", "date": "2026-09-02 19:31", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/telekom-s-success-paradox-when-outperformance-becomes-the-bear-case/70042597", "category": "earnings", "importance": 3, "wl": false, "topic": "도이치텔레콤 실적"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "통신사들이 AI-RAN, 6G 등 차세대 네트워크 투자를 확대하기 위해 기존의 기지국 중심 CAPEX 투자 지표를 보완해야 한다고 목소리를 높였다. 현행 국가전략기술 사업화시설 세액공제 제도가 개방형 시설의 특성을 충분히 반영하지 못하고 있다는 지적이다. 대기업 기준 세액공제 혜택의 실효성을 높이기 위해 이용 내역 입증 등 까다로운 요건을 개선해야 한다는 목소리가 커지고 있다. 통신 인프라 투자를 유도하기 위한 세제 지원의 실효성 제고가 시급하다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 3, "wl": false, "topic": "ai 투자 통신사"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "AI 서비스 확산으로 5년 뒤 트래픽이 최대 5배 폭증할 것으로 예상됨에 따라 네트워크를 국가 AI 인프라로 육성해야 한다는 주장이 나왔다. 5G SA, AI-RAN, 6G 등에 대한 투자 지원과 함께 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안이 과기정통부 차원에서 검토되고 있다. 폭발적인 데이터 수요를 감당하기 위한 초고속·초저지연 통신망 확충이 국가적 과제로 부상했다. 통신 인프라 강화를 위한 정부와 업계의 공조가 속도를 내고 있다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 3, "wl": false, "topic": "ai 트래픽"}, {"title": "BTC to launch commercial 5G services in Gabarone in October - Telecompaper", "summary": "BTC가 보츠와나에서 10월 중 상용 5G 서비스를 공식 출시할 예정입니다. 아프리카 지역의 모바일 통신 인프라 현대화 작업이 속도를 내고 있습니다. 신규 장비 도입과 네트워크 확장을 동반합니다.", "source": "Telecompaper", "date": "2026-09-02 17:34", "url": "https://www.telecompaper.com/news/btc-to-launch-commercial-5g-services-in-gabarone-in-october--1581407", "category": "contract", "importance": 3, "wl": false, "topic": "btc 보츠와나 5g 상용 서비스"}, {"title": "\"AI 시대, 트래픽 5배 증가…네트워크 지원 필요\"", "summary": "AI 시대 도래로 트래픽이 5배 이상 급증함에 따라 초고속·초저지연 네트워크 구축을 위한 기술 투자와 정부 지원의 필요성이 제기됐다. 특히 글로벌 데이터 트래픽의 대다수를 처리하는 해저케이블과 6G 지상망, 저궤도 위성망을 아우르는 통합 인프라 구축이 시급하다. 안정적인 통신망 확충은 국가 디지털 경쟁력을 좌우하는 핵심 요소다. 정부와 통신 업계는 미래 지향적인 네트워크 인프라 마스터플랜 마련에 주력하고 있다.", "source": "news.bizwatch.co.kr", "date": "2026-09-02 17:28", "url": "https://news.bizwatch.co.kr/article/mobile/2026/09/02/0038", "category": "policy", "importance": 3, "wl": false, "topic": "ai 시대 트래픽"}, {"title": "Charter Communications announces resignation of CFO - Telecompaper", "summary": "차터 커뮤니케이션스가 제시카 피셔 최고재무책임자의 사임 사실을 공식 발표했습니다. 후임 인선 작업과 함께 재무 부문의 리더십 변화가 예고되었습니다. 주요 임원 퇴임 소식입니다.", "source": "Telecompaper", "date": "2026-09-02 16:00", "url": "https://www.telecompaper.com/news/charter-communications-announces-resignation-of-cfo--1581381", "category": "exec", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션스 cfo 사임 발표"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계 전문가들이 통신사의 'AI를 위한 네트워크(NW for AI)' 투자를 촉진하기 위해 망 중립성 가이드라인 정비와 주파수 할당 대가 및 전파사용료 인하가 시급하다고 입을 모았다. 통신사들이 막대한 인프라 투자 비용을 감내할 수 있도록 정부가 규제 완화와 인센티브를 제공해야 한다는 주장이다. 네트워크 고도화가 곧 AI 국가 경쟁력으로 이어지는 만큼 민관의 긴밀한 협력이 강조되고 있다. 제도적 지원을 통한 투자 유인책 마련이 핵심 과제로 꼽힌다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 ai"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "통신사가 연간 막대한 규모로 부담하는 주파수 할당 대가와 전파사용료 등 정책적 비용을 대폭 낮춰 설비투자 및 AI 인프라 투자로 연계해야 한다는 제안이 국회 토론회에서 제기됐다. 재할당 비용 절감이 통신사들의 선제적인 네트워크 확충 여력을 결정짓는 핵심 변수라는 지적이다. AI 시대의 폭증하는 트래픽을 수용하기 위해서는 통신망 투자 유인을 극대화하는 제도적 개선이 필수적이다. 정부의 전향적인 정책 변화에 업계의 이목이 집중되고 있다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 3, "wl": false, "topic": "ai 시대 인프라"}, {"title": "드론부터 딥보이스까지…KT, ‘AI 안전망’ 띄운다 - 데일리안", "summary": "KT가 드론과 딥보이스 탐지 기술 등을 활용한 종합적인 'AI 안전망' 서비스를 구축한다고 밝혔습니다. 통신 인프라와 AI를 결합하여 사회 안전 가치를 높이려는 전략입니다. 국내 통신사의 신사업 추진 동향입니다.", "source": "데일리안", "date": "2026-09-02 15:09", "url": "https://www.dailian.co.kr/news/view/1685574/%EB%93%9C%EB%A1%A0-%EB%94%A5%EB%B3%B4%EC%9D%B4%EC%8A%A4%EA%B9%8C%EC%A7%80KT-%E2%80%98AI-%EC%95%88%EC%A0%84%EB%A7%9D%E2%80%99-2026", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai 안전망 기술 도입"}, {"title": "HPE scores Wi-Fi and AI goals as 5G and VMware lose out", "summary": "영국 토트넘 홋스퍼 스타디움이 수백만 달러 규모의 업그레이드를 통해 와이파이 7과 AI 기능을 갖춘 HPE 기술을 도입했다. 대형 공공 장소의 첨단 네트워크 인프라 구축 사례를 보여준다.", "source": "Light Reading", "date": "2026-09-02 15:00", "url": "https://www.lightreading.com/wifi/hpe-scores-wi-fi-and-ai-goals-as-5g-and-vmware-lose-out", "category": "contract", "importance": 3, "wl": true, "topic": "토트넘 스타디움 hpe 장비 도입"}, {"title": "NTT Docomo spins out AI venture targeting rebate management - Telecompaper", "summary": "일본 NTT 도코모가 리베이트 관리 솔루션에 특화된 AI 전문 신생 벤처 기업을 사내 분사(Spin-out)시켰습니다. 통신 서비스 생태계를 확장하고 신사업 동력을 확보하기 위한 전략입니다. 통신사의 자회사 독립 사례입니다.", "source": "Telecompaper", "date": "2026-09-02 14:51", "url": "https://www.telecompaper.com/news/ntt-docomo-spins-out-ai-venture-targeting-rebate-management--1581423", "category": "contract", "importance": 3, "wl": false, "topic": "ntt 도코모 리베이트 관리 ai 벤처 분사"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신사들이 매년 주파수 할당 대가 약 8000억 원, 전파사용료 약 2000억 원 등 막대한 규제 비용을 부담하면서 '투자는 하고 서비스는 팔지 못하는' 이중고에 시달리고 있다. 6G 상용화를 앞두고 AI 네트워크 투자가 본격화되는 시점에서 이러한 고정비용 부담은 통신사의 재정 압박을 가중시키고 있다. 업계는 차세대 인프라 전환을 가속화하기 위해 정부가 정책적 비용을 대폭 완화해야 한다고 거듭 촉구하고 있다. 과도한 규제 비용이 통신 산업의 미래 투자를 가로막는 걸림돌로 작용하고 있다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 규제비용"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "AI 3대 강국 도약을 위해 인프라 구축이 우선돼야 하며, 망 및 AIDC 부문에서 민간 투자를 적극적으로 이끌어내야 한다는 전문가 제언이 나왔다. 주파수 할당 대가와 전파사용료 등 통신사들의 정책성 비용 부담을 낮춰 실제 투자 확대로 이어지는지 점검하고 제도를 전면 재검토해야 한다는 지적이다. 또한 AIDC(AI 데이터센터) 투자를 활성화하기 위해 관련 시행령을 정교하게 다듬어야 한다고 강조했다. 민관이 협력하여 차세대 디지털 인프라 생태계를 다져야 할 시점이다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 3, "wl": false, "topic": "ai 3대 강국"}, {"title": "[현장] \"컴퓨팅 자원만으론 AI 3강 못 간다\"…AI 네트워크 투자 물꼬 트려면 - 데일리안", "summary": "인공지능 시대에 컴퓨팅 자원 확보를 넘어 AI 네트워크 투자의 물꼬를 트기 위한 전문가 현장 간담회가 개최되었습니다. 통신 인프라 고도화와 투자 촉진을 위한 정책적 제언이 오갔습니다. 통신사들의 네트워크 투자 방향성에 시사점을 줍니다.",   {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성",       secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
