<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

": "우주항공청이 내년 예산 1조 6491억 원을 편성했습니다. 저궤도 위성 통신 기술 개발 및 우주 AI 데이터센터 구축 등 핵심 사업에 투자가 집중됩니다.", "source": "gndomin.com", "date": "2026-09-02 18:14", "url": "http://www.gndomin.com/news/articleView.html?idxno=487739", "category": "policy", "importance": 4, "wl": false, "topic": "우주항공청 예산"}, {"title": "에이스테크놀로지, 항우연 저궤도 위성 통신 핵심 안테나 개발 수주", "summary": "에이스테크놀로지가 한국항공우주연구원의 저궤도 위성 통신 자립화 사업에서 지상국용 안테나 개발을 수주했습니다. 위성 통신 핵심 부품의 국산화 사례입니다.", "source": "metroseoul.co.kr", "date": "2026-09-02 16:38", "url": "http://www.metroseoul.co.kr/article/20260902500539", "category": "contract", "importance": 4, "wl": false, "topic": "에이스테크놀로지 수주"}, {"title": "6G and AI are on a collision course", "summary": "퀄컴 임원진은 6G가 향상된 연결성과 센싱 능력을 제공하며 AI 유스케이스 및 차세대 AI 네이티브 기기들과 직접적으로 융합될 것이라고 밝혔다. 통신과 AI의 결합은 차세대 네트워크 아키텍처 설계의 핵심 요소로 자리 잡고 있으며, 향후 모바일 및 통신 기기 전반에서 인공지능과의 결합이 가속화될 전망이다.", "source": "Light Reading", "date": "2026-09-03 22:00", "url": "https://www.lightreading.com/6g/6g-and-ai-are-on-a-collision-course", "category": "tech", "importance": 3, "wl": true, "topic": "퀄컴 6g 및 ai 융합"}, {"title": "테슬라 '사이버캡' 공개 운행 시작…일론 머스크식 자율주행 전략, 성공...", "summary": "테슬라가 로보택시 서비스인 사이버캡에 스타링크 연결을 도입하여 운영 효율을 높이고 있습니다. 자율주행과 위성 통신을 결합한 서비스 모델의 확장 사례입니다.", "source": "digitaltoday.co.kr", "date": "2026-09-03 19:26", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697995", "category": "tech", "importance": 3, "wl": false, "topic": "테슬라 스타링크"}, {"title": "[ET톡] 6G 1등 국가의 조건", "summary": "6G 1등 국가를 위한 기술 경쟁력 확보가 강조되었습니다. 세계 최초 상용화보다는 최고 기술을 갖추는 것이 중요하며, 5G의 경험을 반면교사 삼아야 한다는 의견입니다.", "source": "etnews.com", "date": "2026-09-03 13:44", "url": "https://www.etnews.com/20260903000237", "category": "policy", "importance": 3, "wl": false, "topic": "6g 기술 경쟁력"}, {"title": "Satcom spectrum fee: DCC may soon decide airwave charges, allocation terms", "summary": "인도 통신위원회(DCC)가 정지궤도(GSO) 기반 고정 위성 네트워크의 주파수 요금 및 할당 조건을 곧 결정할 예정이다. 현재 일부 사업자만 위성 서비스를 제공하며 조정총수입의 3~4% 수준의 주파수 요금을 납부하고 있다. 인도 위성통신 시장의 규제 확정과 비용 구조 개편에 중요한 전환점이 될 전망이다.", "source": "ET Telecom", "date": "2026-09-03 11:10", "url": "https://telecom.economictimes.indiatimes.com/news/portal-in-portal/satcom/satcom-spectrum-fee-dcc-may-soon-decide-airwave-charges-allocation-terms/133723333", "category": "policy", "importance": 3, "wl": true, "topic": "인도 위성통신 주파수 요금"}, {"title": "[INdustrial Technology] (주)뉴로랩, “소방관 대신 화재현장 진압”… ...", "summary": "뉴로랩의 화재진압 로봇 FL30이 5G 망과 스타링크 위성통신을 활용해 원격 제어됩니다. 오지에서도 통신이 가능하여 소방관의 안전 확보와 대응력 향상에 기여할 것으로 기대됩니다.", "source": "fpn119.co.kr", "date": "2026-09-03 10:02", "url": "http://fpn119.co.kr/256067", "category": "tech", "importance": 3, "wl": false, "topic": "뉴로랩 화재진압 로봇"}, {"title": "AIT-E, 글로벌 선박통신 솔루션업체 '아게 헴펠 그룹' 협력업체 등록 완...", "summary": "AIT-E가 아게 헴펠 그룹과 협력하여 스타링크 마리타임 공식 리셀러로서 선박용 위성 인터넷 서비스를 제공합니다. 해상 위성 통신 시장의 확대 사례입니다.", "source": "paxetv.com", "date": "2026-09-03 09:26", "url": "http://www.paxetv.com/news/articleView.html?idxno=280912", "category": "contract", "importance": 3, "wl": false, "topic": "스타링크 마리타임"}, {"title": "'소형 발사체 강자' 로켓랩, 일렉트론 94번째 발사 성공", "summary": "로켓랩이 일렉트론 로켓을 통해 신스펙티브의 위성을 저궤도에 성공적으로 투입했습니다. 소형 발사체 시장의 활성화를 보여줍니다.", "source": "choicenews.co.kr", "date": "2026-09-03 08:56", "url": "http://www.choicenews.co.kr/news/articleView.html?idxno=170900", "category": "tech", "importance": 3, "wl": false, "topic": "로켓랩 위성 발사"}, {"title": "[LIG D&A 50년-63] 미래 위한 역량 강화 및 인프라 투자 확대", "summary": "LIG넥스원이 우주사업부를 통해 저궤도 위성 및 지상체 사업 역량을 강화하고 있습니다. 위성 통신 분야의 수주 경쟁력을 높이려는 전략입니다.", "source": "thebigdata.co.kr", "date": "2026-09-03 08:46", "url": "http://www.thebigdata.co.kr/view.php?ud=202609030151236989570d99e4c8_23", "category": "tech", "importance": 3, "wl": false, "topic": "lig넥스원 우주사업"}, {"title": "비쉐이, 히트싱크 없이 고전력 구현하는 박막 고주파 칩 저항기 출시", "summary": "비쉐이가 저궤도 위성 및 5G·6G 네트워크용 고주파 칩 저항기를 출시했습니다. 위성 통신 인프라 확장에 따른 부품 수요 대응 사례입니다.", "source": "etnews.com", "date": "2026-09-03 08:42", "url": "https://www.etnews.com/20260901000221", "category": "tech", "importance": 3, "wl": false, "topic": "비쉐이 위성 부품"}, {"title": "New star in comms firmament – Softbank positions HAPS between terrestrial and satellite", "summary": "소프트뱅크의 고고도 무선통신(HAPS) 시험은 성층단이 단순한 커버리지 공백 메우기를 넘어 광역 셀룰러, 사설망, 드론, 에지 컴퓨팅을 하나로 결합하는 플랫폼이 될 수 있음을 시사한다. 지상망과 위성망을 잇는 새로운 통신 인프라로서의 가능성을 입증하고 있다.", "source": "RCR Wireless", "date": "2026-09-03 01:08", "url": "https://rcrwireless.com/20260902/network-infrastructure/softbank-positions-haps-between-terrestrial-and-satellite", "category": "tech", "importance": 3, "wl": true, "topic": "소프트뱅크 haps 플랫폼"}, {"title": "안보 위협하는 신흥기술…중견국 리더십 발휘해야 [왜냐면]", "summary": "AI 도입이 저궤도 위성의 군사화와 무기화를 가속화하고 있습니다. 신흥 기술이 가져오는 안보 위협에 대한 대응 필요성을 강조합니다.", "source": "hani.co.kr", "date": "2026-09-02 19:08", "url": "https://www.hani.co.kr/arti/opinion/because/1275953.html", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 안보"}, {"title": "전쟁의 패러다임 변화: 초고속 데이터 주도형 전쟁 [박찬근의 미래전 이...", "summary": "미래전에서 저궤도 위성 통신 모듈을 신속하게 탑재할 수 있는 개방형 아키텍처의 중요성이 강조되고 있습니다. 데이터 주도형 전쟁에서의 유연한 생태계 조성이 핵심입니다.", "source": "sedaily.com", "date": "2026-09-02 16:04", "url": "https://www.sedaily.com/article/20086371?ref=naver", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 군사"}, {"title": "인텔리안테크, 美생산공장 가동…게이트웨이 안테나 첫 출하", "summary": "인텔리안테크가 미국 생산공장을 가동하고 게이트웨이 안테나를 첫 출하했습니다. 저궤도 및 정지궤도 위성 인프라 수요 증가에 대응하기 위한 북미 현지 생산 체제입니다.", "source": "zdnet.co.kr", "date": "2026-09-02 15:23", "url": "https://zdnet.co.kr/view/?no=20260902152242", "category": "tech", "importance": 3, "wl": false, "topic": "인텔리안테크 위성"}, {"title": "전북대 노예훈 박사과정생 학문후속세대 지원사업 선정.. ' 6G 전이중통신...", "summary": "전북대 연구팀이 6G 전이중 무선통신 시스템을 위한 핵심 수신기 기술을 연구 중입니다. 신호 제거 기술을 통해 성능 저하를 최소화하는 것이 목표입니다.", "source": "veritas-a.com", "date": "2026-09-03 14:50", "url": "https://www.veritas-a.com/news/articleView.html?idxno=626092", "category": "tech", "importance": 2, "wl": false, "topic": "6g 전이중통신 기술"}], "competitor": [{"title": "브로드컴, 분기 매출 300억불 육박… 삼성 ·SK, ‘슈퍼 사이클’ 더 오래...", "summary": "브로드컴이 분기 매출 300억 달러에 육박하는 실적을 기록하며 AI 데이터센터 네트워크 칩 시장에서의 영향력을 입증했습니다. 브로드컴의 성장은 삼성전자와 SK하이닉스의 반도체 슈퍼 사이클 수혜가 지속될 것이라는 전망을 뒷받침합니다.", "source": "ceoscoredaily.com", "date": "2026-09-03 17:22", "url": "https://www.ceoscoredaily.com/page/view/2026090314232658186", "category": "tech", "importance": 4, "wl": false, "topic": "브로드컴 반도체 실적"}, {"title": "브로드컴 “AI칩 매출 3배↑”… 삼성 수혜 기대감 커진다", "summary": "브로드컴이 AI 가속기와 AI 네트워크 반도체 수요 급증으로 매출이 3배 증가했습니다. 이 과정에서 삼성전자와의 협력 가능성이 다시 주목받고 있어 향후 파운드리 및 메모리 분야의 수혜가 기대됩니다.", "source": "dt.co.kr", "date": "2026-09-03 08:45", "url": "https://www.dt.co.kr/article/12081849?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "브로드컴 ai칩 매출"}, {"title": "美 '팍스 실리카' 맞불…中, 제3세계로 AI 인프라 확장", "summary": "중국이 제3세계로 AI 인프라를 확장하는 가운데, 화웨이 등 중국 기업들이 반도체 국산화에 속도를 내고 있습니다. 미국과의 기술 패권 경쟁 속에서 핵심 부품 자립을 시도하는 전략적 움직임입니다.", "source": "hankyung.com", "date": "2026-09-02 18:23", "url": "https://www.hankyung.com/article/2026090203721", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 반도체 국산화"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 한국에서 드론 실시간 추적 통신 기술을 공개합니다. 6G와 AI 기능이 결합된 ISAC 기술을 통해 기술 효율성을 개선하고 한국 파트너들과 협력을 모색할 계획입니다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 기술"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "바이트댄스가 중국 네이멍구에 대규모 AI 데이터센터 건설을 추진 중입니다. 화웨이를 비롯한 글로벌 기업들이 해당 지역에 컴퓨팅 시설 투자를 진행해 왔습니다. 중국 내 AI 인프라 확충 동향을 나타냅니다.", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 데이터센터 투자"}, {"title": "치솟는 부품값에…고개 숙인 HPE 주가", "summary": "휴렛팩커드엔터프라이즈(HPE)가 AI 서버 및 네트워크 장비 수요 급증으로 시장 예상을 웃도는 실적을 기록했습니다. AI 서버 가격의 상당 부분을 차지하는 엔비디아 GPU와 삼성전자·SK하이닉스의 D램 등 부품 가격 상승이 주요 변수로 작용했습니다.", "source": ", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-Channel", "category": "tech", "importance": 2, "wl": true, "topic": "에릭슨 적응형 인벤토리"}, {"title": "화웨이 코리아가 한국 대학생 9명을 선전으로 부른 이유는", "summary": "화웨이가 한국 대학생들을 대상으로 기술 협력을 강화하며 인재 확보에 나서고 있습니다. 반도체 및 통신 장비 소프트웨어 분야의 우수 인력을 초기 단계부터 선점하려는 전략입니다.", "source": "econovill.com", "date": "2026-09-02 10:40", "url": "https://www.econovill.com/news/articleView.html?idxno=749636", "category": "other", "importance": 2, "wl": false, "topic": "화웨이 인재 확보"}, {"title": "Render previews agentic AI expansion", "summary": "렌더 네트웍스가 에이전틱 AI 엔진의 차세대 확장 기능인 '쿼터마스터(Quartermaster)'를 미리 공개했다. 이 기능은 하이퍼스케일러들이 수동 엔지니어링 주기를 거치지 않고도 중계망 네트워크 프로젝트를 직접 구성하고 청사진을 만들 수 있도록 지원한다. 네트워크 자동화 및 설계 효율성 향상이 기대된다.", "source": "Light Reading", "date": "2026-09-01 23:25", "url": "https://www.lightreading.com/ai-machine-learning/render-previews-agentic-ai-expansion", "category": "tech", "importance": 2, "wl": true, "topic": "렌더네트워크 에이전틱 ai"}, {"title": "Calix hires new CMO", "summary": "칼릭스가 SAP, 오라클, 서비스나우 등에서 리더십 역할을 맡았던 유르겐 린드너를 신임 최고마케팅책임자(CMO)로 임명했다.", "source": "Light Reading", "date": "2026-09-02 03:28", "url": "https://www.lightreading.com/ai-machine-learning/calix-hires-new-cmo", "category": "exec", "importance": 1, "wl": true, "topic": "칼릭스 임원 영입"}], "policy": [{"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도가 국가 안보 우려를 이유로 기존에 설치된 중국산 노후 통신 장비의 철거 및 교체(Rip and Replace) 검토에 착수했다. 주요국 정부 차원에서 안보 위협을 명목으로 중국산 통신장비 배제를 가속화하는 조치로, 글로벌 장비 시장의 판도에 큰 영향을 미칠 전망이다. 삼성전자 등 비중국계 장비사들에게는 인도 시장 내 추가 수주 기회로 작용할 수 있다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도 중국산 통신장비 제재"}, {"title": "GAO issues broadband program to-dos for FCC, NTIA", "summary": "미국 회계감사원(GAO)이 연방정부의 광대역 통신 프로그램 현황을 평가하고 FCC와 NTIA에 구체적인 권고사항을 전달했다. 이번 권고는 브로드밴드 매핑 데이터의 정확성 향상과 프로그램의 지속 가능성 확보에 초점을 맞추었다. 연방 차원의 통신망 구축 사업 효율성을 높이기 위한 관리 체계 강화가 요구된다.", "source": "Light Reading", "date": "2026-09-03 21:00", "url": "https://www.lightreading.com/broadband/gao-issues-broadband-program-to-dos-for-fcc-ntia", "category": "policy", "importance": 3, "wl": true, "topic": "미국 회계감사원 통신 프로그램 권고"}, {"title": "AI regulatory regime should be nimble, not over-constraining: Top PM advisor", "summary": "인도의 최고 PM 자문가는 AI 규제 체제가 지나치게 구속력 있기보다는 유연해야 한다고 밝혔다. 현재 인도는 독립적인 AI 법률이 없으나, 2026년 2월 IT 규칙 개정을 통해 AI와 딥페이크 규제 규범을 마련한 바 있다. 향후 인도의 AI 정책 방향성에 업계의 관심이 쏠리고 있다.", "source": "ET Telecom", "date": "2026-09-03 16:55", "url": "https://telecom.economictimes.indiatimes.com/news/policy/ai-regulatory-regime-should-be-nimble-not-over-constraining-top-pm-advisor/133729523", "category": "policy", "importance": 3, "wl": true, "topic": "인도 ai 규제 정책"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에서의 프라이빗 5G 구축을 위한 새로운 계획을 마련했으나, 핵심인 주파수 할당 계획은 포함되지 않았다. 이번 조치는 산업용 5G 보급을 장려하기 위한 정책적 시도이나 실효성에 대한 의문이 제기되고 있다. 향후 세부적인 주파수 정책 발표 여부가 주목된다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 프라이빗 5g 정책"}, {"title": "KCA, 경기항공고와 AI 정보보호·항공통신 인재 키운다", "summary": "한국방송통신전파진흥원(KCA)은 경기항공고와 AI 기반 정보보호 및 항공산업 미래인재 양성을 위한 업무협약을 체결했다. AI 기반 정보보호 자격 취득반과 항공무선통신사 특별반을 운영하며, 정보보호 및 항공 통신 분야의 전문 인력을 양성할 계획이다.", "source": "ZDNet Korea", "date": "2026-09-03 17:47", "url": "https://zdnet.co.kr/view/?no=20260903174740", "category": "tech", "importance": 2, "wl": true, "topic": "kca 인재 양성 협약"}], "carrier": [{"title": "통신3사, “AI 네트워크는 국가 전략 인프라, 지원책 절실” 한목소리", "summary": "통신3사가 AI 네트워크를 국가 전략 인프라로 규정하고 정부의 지원책을 촉구했습니다. 5G SA 및 6G 투자에 필요한 재원 마련과 정책적 지원이 절실하다는 입장입니다.", "source": "kidd.co.kr", "date": "2026-09-03 17:40", "url": "https://kidd.co.kr/news/247290", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 네트워크 투자 지원"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "SK텔레콤과 LG유플러스가 AI-RAN 기술을 활용한 네트워크 운영 효율화에 나섰습니다. SK텔레콤은 정부 사업의 일환으로 삼성전자, 에릭슨, 노키아 등과 함께 AI-RAN 실증을 진행 중입니다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 ai-ran 실증"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 AI-RAN 네트워크 전환 기술을 검증했습니다. 로봇 등 피지컬 AI 장비가 5G 망과 AI-RAN 시험망을 이동할 때 최적의 네트워크를 선택하는 기술을 구현했습니다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 4, "wl": false, "topic": "lg유플러스 ai-ran 실증"}, {"title": "\"5G·6G도 국가전략자산\"… 통신 3사, AI 네트워크 투자 지원 촉구", "summary": "통신 3사가 AI 시대 네트워크 고도화를 위해 6G 및 저궤도 위성 등 차세대 인프라에 대한 정부의 투자 지원을 촉구했습니다. AI 기반 네트워크 전환을 위한 정책적 뒷받침이 핵심입니다.", "source": "newscj.com", "date": "2026-09-02 17:36", "url": "https://www.newscj.com/news/articleView.html?idxno=3429661", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai 네트워크"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크가 고치현 무로토곶 인근에서 성층권 통신 플랫폼(HAPS)의 고고도 비행 시험을 성공적으로 완료했다. 이번 테스트는 드론과 에지 컴퓨팅 시스템 간의 연결성을 검증하기 위해 진행되었다. 소프트뱅크는 2027년 상용화를 목표로 기술 고도화를 추진 중이며, 향후 통신 사각지대 해소 및 차세대 인프라 확장에 기여할 것으로 기대된다.", "source": "Light Reading", "date": "2026-09-03 23:20", "url": "https://www.lightreading.com/satellite/softbank-completes-stratospheric-haps-trial-eyes-2027-deployment", "category": "tech", "importance": 3, "wl": true, "topic": "소프트뱅크 haps 시험"}, {"title": "Minnesota operator taps MoCA Access tech to connect MDUs", "summary": "미국 Sjoberg Inc.가 InCoax 및 노키아와 협력하여 MoCA Access 기술을 도입했다. 이를 통해 다세대 주택(MDU) 환경에서 기가비트 속도의 초고속 인터넷 서비스를 성공적으로 개통했다. 이번 협력은 지역 통신 사업자들의 노후 가입자망 환경에서의 브로드밴드 서비스 품질을 향상시키는 계기가 될 전망이다.", "source": "Light Reading", "date": "2026-09-03 23:13", "url": "https://www.lightreading.com/broadband/minnesota-operator-taps-moca-access-tech-to-connect-mdus", "category": "tech", "importance": 3, "wl": true, "topic": "노키아 moca 기술 도입"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": "영국 통신사 VMO2가 북아일랜드 지역에서 5G 단독모드(SA) 서비스를 개시했다. 이와 함께 오렌지의 프라이빗 5G 커버리지 제공 계획, 노키아의 API 고객 확보 등 주요 통신사들의 5G 고도화 및 기업용 서비스 경쟁이 심화되고 있다. 통신사들은 네트워크 인프라 고도화를 통해 기업 시장 공략을 가속화하고 있다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 3, "wl": true, "topic": "vmo2 5g sa 서비스"}, {"title": "울산 시내버스, 차세대 와이파이로 싹 바꾼다", "summary": "울산시가 시내버스 762대의 노후 와이파이 장비를 5G 백홀 기반의 와이파이 7으로 전면 교체합니다. 통신 품질 향상과 실시간 장애 대응 효율 개선이 목적입니다.", "source": "ujeil.com", "date": "2026-09-03 20:46", "url": "http://www.ujeil.com/news/articleView.html?idxno=391509", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이"}, {"title": "VodafoneThree declares 5G network slicing war on BT", "summary": "보다폰과 삼(Three)의 합병 법인인 보다폰트리가 BT를 상대로 5G 네트워크 슬라이싱 서비스 경쟁을 선언했다. 새롭게 선보인 '슈퍼모바일' 상품은 품질 보증을 차별화 요소로 내세우고 있다. 통신사 간의 네트워크 슬라이싱 기술을 활용한 서비스 경쟁이 본격화될 것으로 보인다.", "source": "Light Reading", "date": "2026-09-03 18:23", "url": "https://www.lightreading.com/5g/vodafonethree-declares-5g-network-slicing-war-on-bt", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰트리 5g 네트워크 슬라이싱"}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "우리넷이 국책과제로 개발한 16Tbps급 패킷-광-전달망 시스템을 한국지능정보사회진흥원(NIA)의 '2026 KOREN 기반 AI NETWORK 장비 시범도입 실증' 사업을 통해 실제 운용 환경에서 검증한다. 이번 실증을 통해 국산 고성능 네트워크 장비의 상용화가 가속화될 전망이다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "tech", "importance": 3, "wl": true, "topic": "우리넷 ai 네트워크 실증"}, {"title": "플리토, 육군에 AI 민원상담 구축…장병·국민 문의 24시간 대응", "summary": "플리토가 이스트소프트, 와이즈넛과 컨소시엄을 구성해 육군본부와 'AI 기반 민원상담체계 개발'을 위한 업무협약을 체결했다. 보안이 중요한 군 폐쇄망에서도 24시간 작동하는 AI 민원 처리 시스템을 구축하여 국방 분야의 AI 전환(AX)을 추진한다.", "source": "ZDNet Korea", "date": "2026-09-03 17:36", "url": "https://zdnet.co.kr/view/?no=20260903173519", "category": "contract", "importance": 3, "wl": true, "topic": "플리토 육군 ai 민원상담"}, {"title": "Distributed AI inference is redrawing the network map (Reader Forum)", "summary": "AI가 중앙집중형 학습에서 분산형 추론으로 전환됨에 따라 네트워크 아키텍처가 근접성, 지연 시간, 탄력성을 중심으로 재편되고 있다. 메트로 광섬유, 에지 연결성, 광학 인프라가 AI 컴퓨팅 성능만큼이나 핵심적인 요소로 자리 잡고 있으며, 통신사들의 인프라 전략에도 큰 변화를 요구하고 있다.", "source": "RCR Wireless", "date": "2026-09-03 17:00", "url": "https://rcrwireless.com/20260903/network-infrastructure/distributed-ai-redrawing-the-network-map-reader-forum", "category": "tech", "importance": 3, "wl": true, "topic": "ai 분산 추론 네트워크"}, {"title": "AI pushes fiber networks toward a capacity crunch, AFL says", "summary": "AI 트래픽 급증으로 인해 기존 광섬유 네트워크가 용량 한계에 직면할 위험이 커지고 있다. 광섬유 가용성과 전력 제약의 복합적인 문제가 AI 인프라 구축에 추가적인 도전 과제를 제시하고 있으며, 인프라 투자 확충의 필요성이 강조되고 있다.", "source": "RCR Wireless", "date": "2026-09-03 16:07", "url": "https://rcrwireless.com/20260903/networks/ai-fiber-afl", "category": "tech", "importance": 3, "wl": true, "topic": "ai 광섬유 네트워크 용량"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 아마존웹서비스(AWS)의 얀 호프메이어를 차기 최고기술책임자(CTO)로 영입했다. 이번 인사를 통해 도이치텔레콤은 클라우드 및 네트워크 인프라 기술 역량을 강화할 계획이다. 주요 통신사와 빅테크 간의 인재 이동이 활발해지는 추세를 보여준다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 cto 영입"}, {"title": "VodafoneThree to launch debut TV service in challenge to UK rivals", "summary": "영국 통신 그룹 보다폰트리가 영국 내 라이벌들에 맞서 TV 플랫폼 서비스를 신규 런칭했다. 이번 TV 플랫폼 도입을 통해 홈 브로드밴드 사업 규모를 두 배로 키우겠다는 전략이다. 통신사의 미디어 결합 상품 경쟁이 치열해지고 있다.", "source": "Financial Times Tech", "date": "2026-09-03 13:00", "url": "https://www.ft.com/content/b44fcdbd-4c0e-4032-b81a-98e309991388?syn-25a6b1a6=1", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰트리 tv 서비스"}, {"title": "Canadian Pension Fund La Caisse buys 24% stake in Brookfield-backed Altius for ₹12,100 cr", "summary": "캐나다 연기금 라 케이스(La Caisse)가 브룩필드가 지원하는 알티우스(Altius)의 지분 24%를 인수했다. 거래 완료 후에도 브룩필드는 최대 투자자로 남게 되며, 싱가포르 GIC 등도 주주로 참여한다. 통신 인프라 및 통신탑 자산을 둘러싼 대규모 글로벌 투자 자금의 이동을 보여준다.", "source": "ET Telecom", "date": "2026-09-03 11:08", "url": "https://telecom.economictimes.indiatimes.com/news/industry/canadian-pension-fund-la-caisse-buys-24-stake-in-brookfield-backed-altius-for-12100-cr/133723304", "category": "contract", "importance": 3, "wl": true, "topic": "캐나다 연기금 알티우스 지분 인수"}, {"title": "[봇규의 헬로BOT] ‘피지컬 AI 1강’으로 ② | 실증은 늘렸다, 근데 산업...", "summary": "제조 및 물류 현장에서 5G SA와 AI-RAN을 구축하여 피지컬 AI 장비의 자율성을 높이는 기술이 주목받고 있습니다. 산업 현장의 효율성을 극대화하기 위한 네트워크 인프라의 중요성이 커지고 있습니다.", "source": "hellot.net", "date": "2026-09-03 00:08", "url": "https://www.hellot.net/news/article.html?no=114727", "category": "tech", "importance": 3, "wl": false, "topic": "ai-ran 산업 현장 적용"}, {"title": "India’s data-centre operators had a strong FY26 as capacity filled up", "summary": "인도의 데이터센터 운영사들이 FY26에 가장 빠른 매출 성장과 강력한 영업이익률을 기록했다. 데이터센터 용량이 빠르게 채워지면서 주요 운영사들의 실적이 개선되고 있으며, 인프라 확장이 지속되고 있다.", "source": "Mint", "date": "2026-09-02 16:27", "url": "https://www.livemint.com/industry/india-data-centre-operators-profit-growth-ai-revenue-11788319433193.html", "category": "earnings", "importance": 3, "wl": true, "topic": "인도 데이터센터 실적"}, {"title": "통신사도 통신장비도 AI로 달라진다…통신망 운영의 새 기준은 '예측'", "summary": "국내 통신사들이 AI를 활용해 네트워크 이상 징후를 사전에 감지하고 운영 효율을 높이는 시스템을 도입하고 있습니다. 에릭슨, 노키아 등 글로벌 장비사들도 AI 기반 네트워크 솔루션을 강화하는 추세입니다. 이는 통신망 운영의 지능화 트렌드를 보여줍니다.", "source": "popcornnews.net", "date": "2026-09-02 15:50", "url": "http://www.popcornnews.net/news/articleView.html?idxno=131622", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 네트워크"}, {"title": "HPE scores Wi-Fi and AI goals as 5G and VMware lose out", "summary": "영국 토트넘 홋스퍼 스타디움이 Wi-Fi 7과 AI 기능이 포함된 HPE 기술로 멀티미디어 인프라 업그레이드를 완료했다. 이 과정에서 5G 및 VMware 기술은 배제되고 HPE가 채택되었다. 대형 경기장 환경에서 최신 무선 네트워크와 AI의 결합 사례를 보여준다.", "source": "Light Reading", "date": "2026-09-02 15:00", "url": "https://www.lightreading.com/wifi/hpe-scores-wi-fi-and-ai-goals-as-5g-and-vmware-lose-out", "category": "contract", "importance": 3, "wl": true, "topic": "hpe 토트넘 스타디움 인프라"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤이 AI 기지국 보급 확대 정책을 통해 통신 본업의 가치를 높이고 있습니다. 데이터센터와 기지국이 AI 성장의 양대 축으로 주목받고 있습니다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai 네트워크"}, {"title": "스테이지파이브, 로플랫 인수…제4이통 대신 ‘AI 통신’으로 승부", "summary": "스테이지파이브가 제4이통 사업 무산 이후 로플랫을 인수하며 AI 통신 사업으로 승부수를 띄웠습니다.", "source": "edaily.co.kr", "date": "2026-09-02 08:48", "url": "https://www.edaily.co.kr/News/Read?newsId=02794566645576184&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "other", "importance": 3, "wl": false, "topic": "스테이지파이브 사업 전환"}, {"title": "JioHotstar debuts in UK, Canada, Singapore with a new slate", "summary": "지오핫스타(JioHotstar)가 남아시아 디아스포라와 글로벌 시청자들을 겨냥해 영국, 캐나다, 싱가포르 등 글로벌 시장에 신규 콘텐츠 라인업과 함께 공식 진출했다. 해외 거주 인도인들을 대상으로 한 미디어 및 스트리밍 서비스 확장이 가속화되고 있다.", "source": "Mint", "date": "2026-09-02 08:01", "url": "https://www.livemint.com/industry/media/jiohotstar-debuts-in-uk-canada-singapore-with-a-new-slate-11788250565743.html", "category": "contract", "importance": 3, "wl": true, "topic": "지오핫스타 글로벌 진출"}, {"title": "Charter CFO heading to Google-Blackstone data center JV", "summary": "차터 커뮤니케이션즈의 제시카 피셔 CFO가 사임하고 구글-블랙스톤 AI 데이터 센터 합작법인으로 이동한다. 차터는 즉시 후임 CFO 인선 작업에 착수했다. 주요 통신 및 케이블 업계 핵심 임원의 AI 인프라 분야 이동을 보여주는 사례다.", "source": "Light Reading", "date": "2026-09-02 03:54", "url": "https://www.lightreading.com/cable-technology/charter-cfo-heading-to-google-blackstone-data-center-jv", "category": "exec", "importance": 3, "wl": true, "topic": "차터 커뮤니케이션즈 cfo 이동"}, {"title": "TDS acquires Granite State Communications", "summary": "TDS 텔레커뮤니케이션이 그래니트 스테이트 커뮤니케이션즈의 광섬유 및 음성 사업 부문 인수를 완료했다. 이번 인수를 통해 뉴햄프셔 지역 내 TDS의 광섬유 서비스 커버리지가 1만 1,000개 이상의 주소지로 확대된다. 지역 통신 사업자들의 인프라 확장을 위한 M&A가 활발히 이루어지고 있다.", "source": "Light Reading", "date": "2026-09-02 03:29", "url": "https://www.lightreading.com/fttx/tds-acquires-granite-state-communications", "category": "contract", "importance": 3, "wl": true, "topic": "tds 그래니트 스테이트 인수"}, {"title": "AT&T goes to the mat over Charter's use of 'fiber-powered' label for HFC", "summary": "AT&T가 차터 커뮤니케이션즈를 상대로 혼합광고동축망(HFC)을 통해 제공되는 초고속인터넷에 '광섬유 기반'이라는 표현을 사용한 것은 허위 광고라며 소송을 제기했다. 유선 통신 시장에서 마케팅 용어와 기술 방식을 둘러싼 경쟁사 간 법적 공방이 격화되고 있다.", "source": "Light Reading", "date": "2026-09-02 00:55", "url": "https://www.lightreading.com/broadband/at-t-goes-to-the-mat-over-charter-s-use-of-fiber-powered-label-for-hfc", "category": "policy", "importance": 3, "wl": true, "topic": "at&t 차터 광고 소송"}, {"title": "Cable One's carrier services unit beefs up wholesale ordering system", "summary": "케이블원의 사업부인 스파크라이트 캐리어 서비스가 도매 주문 관리 플랫폼을 간소화했다. 이번 시스템 개편을 통해 중계 및 최종 구간 연결 서비스의 효율성이 향상될 것으로 기대된다. 통신 사업자들의 인프라 운영 효율화 노력이 지속되고 있다.", "source": "Light Reading", "date": "2026-09-03 05:59", "url": "https://www.lightreading.com/cable-technology/cable-one-s-carrier-services-unit-beefs-up-wholesale-ordering-system", "category": "tech", "importance": 2, "wl": true, "topic": "케이블원 도매 주문 시스템"}, {"title": "Appledore Webinar: Closing the Agent-Ready Data Gap for Autonomous Networks", "summary": "네트워크 운영의 자율성 진전을 위해서는 AI 모델과 에이전트에 데이터를 공급할 운영 데이터의 준비 상태가 중요하며, 이는 단순한 데이터 레이크 이상의 과제임을 다루는 웨비나가 개최되었다. 자율주행 네트워크 구현을 위한 데이터 인프라의 중요성이 강조되었다.", "source": "RCR Wireless", "date": "2026-09-02 22:06", "url": "https://pages.rcrtech.com/webinar-closing-the-agent-ready-data-gap-for-autonomous-networks", "category": "tech", "importance": 2, "wl": true, "topic": "앱플레어 자율 네트워크 웨비나"}, {"title": "Helium seeks new heights for Wi-Fi offload model", "summary": "헬륨이 통신사, MVNO, 소매 브랜드가 무선 연결성을 쉽게 출시하고 관리할 수 있도록 지원하는 새로운 플랫폼을 논의했다. 이 모델은 Wi-Fi 오프로드를 통해 통신망 트래픽 부담을 줄이고 비용 효율성을 높이는 것을 목표로 한다. 신규 무선 인프라 모델의 시장 안착 여부가 주목된다.", "source": "Light Reading", "date": "2026-09-02 21:49", "url": "https://www.lightreading.com/wifi/helium-seeks-new-heights-for-wi-fi-offload-model", "category": "tech", "importance": 2, "wl": true, "topic": "헬륨 wi-fi 오프로드"}, {"title": "LoRaWAN is powering the next phase of IoT (Reader Forum)", "summary": "LoRaWAN이 대규모 LPWAN 구현 가능성을 입증한 가운데, 유틸리티, 건물, 산업, 농업 전반에 걸친 구축 사례를 바탕으로 경제성과 효율성에 초점이 맞춰지고 있다. IoT 생태계 확장에 기여하고 있는 무선 기술의 동향을 보여준다.", "source": "RCR Wireless", "date": "2026-09-02 18:44", "url": "https://rcrwireless.com/20260902/opinion/lorawan-is-powering-the-next-phase-of-iot-reader-forum", "category": "tech", "importance": 2, "wl": true, "topic": "lorawan iot 인프라"}, {"title": "Greenwatch: Small signs of progress amid bleak picture of data center sustainability", "summary": "8월 통신 지속가능성 뉴스 브리핑을 통해 친환경 데이터 센터 인프라, 자원 순환성, 산불이 미치는 영향 등에 대한 소식이 다뤄졌다. 통신 및 IT 업계 전반에서 탄소 감축과 인프라 지속가능성 확보가 중요한 화두로 자리 잡고 있음을 보여준다.", "source": "Light Reading", "date": "2026-09-02 16:00", "url": "https://www.lightreading.com/sustainability/greenwatch-small-signs-of-progress-amid-bleak-picture-of-data-center-sustainability", "category": "other", "importance": 2, "wl": true, "topic": "그린워치 데이터센터 지속가능성"}, {"title": "AT&T, Nvidia back plan to bridge gap on skilled labor", "summary": "엔비디아, AT&T, GM 등 주요 기업들이 100만 명의 숙련된 기술 전문 인력을 양성하고 개발하기 위한 이니셔티브를 지원하고 나섰다. 산업 전반의 디지털 전환에 const NEWS_LATEST = [{"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크가 고치현 무로토곶 인근에서 성층권 통신 플랫폼(HAPS)의 고고도 비행 시험을 성공적으로 완료했다. 이번 테스트는 드론과 에지 컴퓨팅 시스템 간의 연결성을 검증하기 위해 진행되었다. 소프트뱅크는 2027년 상용화를 목표로 기술 고도화를 추진 중이며, 향후 통신 사각지대 해소 및 차세대 인프라 확장에 기여할 것으로 기대된다.", "source": "Light Reading", "date": "2026-09-03 23:20", "url": "https://www.lightreading.com/satellite/softbank-completes-stratospheric-haps-trial-eyes-2027-deployment", "category": "tech", "importance": 3, "sid": "carrier", "topic": "소프트뱅크 haps 시험"}, {"title": "Minnesota operator taps MoCA Access tech to connect MDUs", "summary": "미국 Sjoberg Inc.가 InCoax 및 노키아와 협력하여 MoCA Access 기술을 도입했다. 이를 통해 다세대 주택(MDU) 환경에서 기가비트 속도의 초고속 인터넷 서비스를 성공적으로 개통했다. 이번 협력은 지역 통신 사업자들의 노후 가입자망 환경에서의 브로드밴드 서비스 품질을 향상시키는 계기가 될 전망이다.", "source": "Light Reading", "date": "2026-09-03 23:13", "url": "https://www.lightreading.com/broadband/minnesota-operator-taps-moca-access-tech-to-connect-mdus", "category": "tech", "importance": 3, "sid": "carrier", "topic": "노키아 moca 기술 도입"}, {"title": "티빙, 3954만개 계정정보 유출…이유는 보안체계 부실", "summary": "티빙에서 3954만 개의 계정 정보가 유출되었습니다. 과기정통부 조사 결과 보안 체계 부실이 확인되었습니다.", "source": "mediaus.co.kr", "date": "2026-09-03 22:46", "url": "https://www.mediaus.co.kr/news/articleView.html?idxno=318042", "category": "outage", "importance": 5, "sid": "outage", "topic": "티빙 개인정보 유출"}, {"title": "6G and AI are on a collision course", "summary": "퀄컴 임원진은 6G가 향상된 연결성과 센싱 능력을 제공하며 AI 유스케이스 및 차세대 AI 네이티브 기기들과 직접적으로 융합될 것이라고 밝혔다. 통신과 AI의 결합은 차세대 네트워크 아키텍처 설계의 핵심 요소로 자리 잡고 있으며, 향후 모바일 및 통신 기기 전반에서 인공지능과의 결합이 가속화될 전망이다.", "source": "Light Reading", "date": "2026-09-03 22:00", "url": "https://www.lightreading.com/6g/6g-and-ai-are-on-a-collision-course", "category": "tech", "importance": 3, "sid": "satellite", "topic": "퀄컴 6g 및 ai 융합"}, {"title": "GAO issues broadband program to-dos for FCC, NTIA", "summary": "미국 회계감사원(GAO)이 연방정부의 광대역 통신 프로그램 현황을 평가하고 FCC와 NTIA에 구체적인 권고사항을 전달했다. 이번 권고는 브로드밴드 매핑 데이 function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
