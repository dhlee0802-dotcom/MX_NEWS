d AI S", "summary": "독일 도이치텔레콤이 300억 유로 규모의 광랜, 5G, 클라우드 및 AI 인프라 투자를 주도할 새로운 리더십 팀을 구축했습니다. 유럽 최대 통신사의 대규모 인프라 투자와 경영 전략을 이끌어갈 핵심 진용이 꾸려졌습니다. 유럽 통신 시장에 미치는 파급력이 큽니다.", "source": "TelecomLead", "date": "2026-09-02 21:16", "url": "https://telecomlead.com/telecom-services/deutsche-telekom-builds-new-leadership-team-to-drive-e30-billion-fiber-5g-cloud-and-ai-strategy-127564", "category": "contract", "importance": 4, "wl": false, "topic": ""}, {"title": "\"업무 맥락까지 파악하는 AI 동료\"…KT 에이전틱 데이터 플로우 구축 - 네이트", "summary": "KT가 업무 맥락까지 파악하는 AI 동료인 '에이전틱 데이터 플로우'를 구축했다. 기업 내부 업무 효율화를 극대화하는 AI 솔루션 도입 사례다. 통신사의 B2B AI 역량 강화를 보여준다.", "source": "네이트", "date": "2026-09-04 10:16", "url": "https://news.nate.com/view/20260904n09116", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai 동료 솔루션"}, {"title": "\"아이폰 울트라, 17프로보다 80% 비싸…가격도 울트라\"", "summary": "[지디넷코리아]다음 주 애플이 아이폰18 프로와 첫 폴더블 아이폰을 공개할 것으로 예상되는 가운데, 아이폰18 프로와 폴더블폰인 ‘아이폰 울트라’ 가격 정보가 잇따라 유출됐다.폰아레나 등 외신은 3일(현지시간) 유출 정보를 인용해 아이폰 울트라와 아이폰18 프로 시리즈의 예상 가격을 보도했다.그 동안 아이폰 울트라 가격은 2000~2500달러(약 271만원~340만원) 수준으로 예상돼 왔다.…", "source": "ZDNet Korea", "date": "2026-09-04 08:53", "url": "https://zdnet.co.kr/view/?no=20260904084125", "category": "other", "importance": 3, "wl": true, "topic": ""}, {"title": "울산 시내버스 762대 '와이파이7' 달린다…10월부터 서비스", "summary": "시는 이번 사업을 통해 기존 장비 를 모두 철거하고 5G 백홀(Backhaul) 기반의 와이파이7로 통합해 통신 품질을 높이는 동시에 실시간 장애 대응과 유지관리 효율도 개선할 계획이다. 백홀은 통신사 기지국의 네트워크와...", "source": "enewstoday.co.kr", "date": "2026-09-04 08:45", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2466682", "category": "outage", "importance": 3, "wl": false, "topic": ""}, {"title": "LS일렉트릭, KT클라우드와 AI 데이터센터 인프라 공급·개발 ‘맞손’ - FA저널", "summary": "LS일렉트릭이 KT클라우드와 손잡고 AI 데이터센터 인프라 공급 및 개발에 나선다. 급증하는 AI 수요에 대응하기 위해 데이터센터 기반시설 구축 역량을 결합한다. 통신사의 AI 인프라 확장 전략을 보여주는 협력 계약이다. 네트워크 장비 및 데이터센터 시장에 시사점을 준다.", "source": "FA저널", "date": "2026-09-04 08:10", "url": "https://www.fajournal.com/news/articleView.html?idxno=21310", "category": "cont s set to lead T-Mobile’s finances in 2027 - Stock Titan", "summary": "셸의 전직 최고재무책임자(CFO)가 오는 2027년부터 티모바일의 재무 부문을 이끌 새 수장으로 내정되었습니다. T모바일 US의 차세대 재무 전략과 AI 및 기업용 비즈니스 성장을 뒷받침할 핵심 경영진 인사입니다. 주요 통신사의 리더십 교체 소식입니다.", "source": "Stock Titan", "date": "2026-09-04 05:08", "url": "https://www.stocktitan.net/news/TMUS/t-mobile-announces-planned-chief-financial-officer-ocasik76f1w8.html", "category": "other", "importance": 3, "wl": false, "topic": "티모바일 최고재무책임자 영입"}, {"title": "VodafoneThree unveils SuperMobile 5G+ national network slice service - BeBeez Internationa", "summary": "보다폰쓰리가 슈퍼모바일 5G+ 전국망 네트워크 슬라이싱 서비스를 공식 출시했다. 기업 및 특수 목적 고객을 위한 맞춤형 고속 통신 서비스 상용화의 일환이다.", "source": "BeBeez International", "date": "2026-09-04 02:09", "url": "https://bebeez.eu/2026/09/03/vodafonethree-unveils-supermobile-5g-national-network-slice-service/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰쓰리 5g 네트워크 슬라이싱"}, {"title": "VodafoneThree revs 5G SA engine with SuperMobile pitched as competitive edge - telcotitans", "summary": "영국의 보다폰쓰리가 5G 단독모드(SA) 엔진을 본격 가동하고 '슈퍼모바일' 서비스를 경쟁 우위 요소로 내세우며 마케팅을 강화하고 있다. 차세대 5G 코어망 기반 서비스 상용화 사례이다.", "source": "telcotitans.com", "date": "2026-09-04 00:51", "url": "https://www.telcotitans.com/vodafonewatch/vodafonethree-revs-5g-sa-engine-with-supermobile-pitched-as-competitive-edge/10838.article", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰쓰리 5g sa 상용화"}, {"title": "Vodafone Follows Bharti Airtel: 5G Network Slicing Live with Minimum 15 Mbps Speeds - Tele", "summary": "바르티에어텔의 선례를 따라 보다폰도 최저 15Mbps 속도를 보장하는 5G 네트워크 슬라이싱 상용 서비스를 개시했다. 맞춤형 고품질 통신 서비스 제공을 위한 5G SA 기반 기술 도입 사례이다.", "source": "TelecomTalk", "date": "2026-09-04 00:05", "url": "https://telecomtalk.info/vodafone-follows-airtel-5g-network-slicing-live/1011530/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 5g 네트워크 슬라이싱"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크는 고치현 무로토곶 앞바다에서 성층권 통신 플랫폼인 ding", "summary": "버티컬 시스템즈의 리서치 결과 AT&T가 이더넷 리더보드 순위에서 1위를 차지했습니다. 기업용 통신 및 네트워크 서비스 시장에서의 강력한 경쟁력을 입증했습니다. 미국 주요 통신사의 B2B 인프라 성과입니다.", "source": "Light Reading", "date": "2026-09-03 22:00", "url": "https://www.lightreading.com/broadband/at-t-tops-ethernet-leaderboard-amid-ranking-shakeup-vertical-systems", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 이더넷 리더보드 1위"}, {"title": "Sceye, SoftBank demo high-altitude platform systems connectivity - Computer Weekly", "summary": "세예(Sceye)와 소프트뱅크가 고고도 플랫폼 시스템(HAPS)을 이용한 통신 연결 시연을 성공적으로 진행했다. 지상 기지국의 한계를 극복하기 위한 차세대 공중 통신망 기술 검증 단계이다. 6G 및 차세대 무선 통신 기술 트렌드에 해당한다.", "source": "Computer Weekly", "date": "2026-09-03 20:18", "url": "https://www.computerweekly.com/news/366649923/Sceye-SoftBank-demo-high-altitude-platform-systems-connectivity", "category": "tech", "importance": 3, "wl": false, "topic": "소프트뱅크 고고도 통신"}, {"title": "Vietnam shuts down its 2G networks nationwide - mediasat.info", "summary": "베트남이 전국적으로 2G 네트워크 서비스를 공식적으로 종료했다. 노후 네트워크를 정리하고 주파수 자원을 4G 및 5G로 전환하기 위한 통신사의 망 구조조정 조치다. 글로벌 통신 인프라 전환 트렌드를 보여준다.", "source": "mediasat.info", "date": "2026-09-03 19:17", "url": "https://mediasat.info/en/2026/09/03/vietnam-shuts-down-its-2g-networks-nationwide/", "category": "tech", "importance": 3, "wl": false, "topic": "베트남 2g 네트워크 종료"}, {"title": "Orange plans new subsea cable linking La Reunion to South Africa - Developing Telecoms", "summary": "프랑스 통신사 오렌지(Orange)가 레위니옹섬과 남아프리카공화국을 연결하는 신규 해저 케이블 구축 프로젝트를 추진한다. 대륙 간 통신 용량 확대와 인프라 고도화를 위한 대형 프로젝트이다.", "source": "Developing Telecoms", "date": "2026-09-03 18:52", "url": "https://developingtelecoms.com/telecom-business/operator-news/20774-orange-plans-new-subsea-cable-linking-la-reunion-to-south-africa.html", "category": "contract", "importance": 3, "wl": false, "topic": "오렌지 해저 케이블 수주"}, {"title": "울산 시내버스 762대 차세대 와이파이로 전면 교체", "summary": "울산시는 구축 시기에 따라 서로 다른 장비 로 운영돼 온 시내버스 762대의 노후 와이파이 장비 를 철거하고, 5세대 이동통신( 5G ) 백홀 기반의 와이파이 7 장비 를 설치한다. 백홀은 통신사 기지 a", "summary": "", "source": "globalbankingandfinance.com", "date": "2026-09-03 10:18", "url": "https://www.globalbankingandfinance.com/elliott-built-stake-deutsche-telekom-opposes-t-mobile-merger/", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "VodafoneThree Takes Aim at EE With “Up to 4x Faster” 5G+ Plans - Tech Advisor", "summary": "보다폰트리가 경쟁사 EE를 겨냥해 최대 4배 빠른 속도를 내세운 5G+ 요금제 및 네트워크 서비스를 선보였습니다. 영국 통신 시장에서 가입자 유치를 위한 고속 네트워크 마케팅을 전개하고 있습니다. 통신사의 서비스 경쟁 심화를 보여줍니다.", "source": "Tech Advisor", "date": "2026-09-03 08:02", "url": "https://www.techadvisor.com/article/3225803/vodafonethree-takes-aim-at-ee-with-up-to-4x-faster-5g-plans.html", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰트리 5g 플러스"}, {"title": "CHTR Stock Pops As Spectrum, Cox, Liberty Deals Reshape Charter - timothysykes.com", "summary": "스펙트럼, 콕스(Cox), 리버티 관련 거래들이 차터 커뮤니케이션스의 구조 재편을 이끌어내며 주가 상승을 견인했다. 미국 케이블 및 통신 시장의 합종연횡과 사업 재편 흐름을 보여준다.", "source": "timothysykes.com", "date": "2026-09-03 05:47", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02-2/", "category": "other", "importance": 3, "wl": false, "topic": "차터 m&a 재편"}, {"title": "CHTR Stock Pops As Charter Leans Into Scale And Streaming Bundles - timothysykes.com", "summary": "차터가 대규모 인프라 규모(Scale)와 스트리밍 번들 결합 상품 전략을 강화하면서 주가 상승을 이끌어냈다. 미디어와 초고속인터넷을 결합한 통신사의 서비스 경쟁력 제고 방안을 보여준다.", "source": "timothysykes.com", "date": "2026-09-03 04:03", "url": "https://timothysykes.com/news/charter-communications-inc-chtr-news-2026_09_02/", "category": "other", "importance": 3, "wl": false, "topic": "차터 규모의 경제 전략"}, {"title": "Spectrum COO Nick Jeffery Touts \"The Great Cable Comeback\" As He Assumes Charter Exec Post", "summary": "차터 커뮤니케이션스의 닉 제퍼리(Nick Jeffery) 최고운영책임자(COO)가 케이블 사업의 부활을 강조하며 새로운 경영진 역할을 맡게 되었다. 케이블 및 통신 서비스 시장에서 기업의 전략적 변화를 예고하는 인사이다.", "source": "Deadline", "date": "2026-09-03 01:43", "url": "https://deadline.com/2026/09/charter-spectrum-coo-nick-jeffery-great-       const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
