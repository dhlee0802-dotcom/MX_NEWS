<style>

  .cat.exec{background:#fff6d9;color:#9a7b00}

  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}

  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}

</style>

3c_occupied_crimea_plans/", "category": "outage", "importance": 2, "wl": false, "topic": "크림반도 통신장애"}], "satellite": [{"title": "ASTS Stock Rises Overnight: AST SpaceMobile And SpaceX Reportedly Chase Prized Satellite S", "summary": "AST스페이스모바일과 스페이스X 간의 위성 관련 협력 및 수주 동향이 보도되었다. 저궤도 위성 통신 서비스 확대를 위한 양사의 행보가 주목받고 있다. 관련 주가 상승 등 시장의 관심이 집중된다.", "source": "stocktwits.com", "date": "2026-09-06 10:38", "url": "https://stocktwits.com/news-articles/markets/equity/asts-spacex-reportedly-chase-prized-satellite-spectrum/cZYBgpkRJZH", "category": "contract", "importance": 4, "wl": false, "topic": "ast스페이스모바일 협력"}, {"title": "ASTS Stock Jumps Overnight: Rakuten CEO Calls AST Satellite Push ‘Critical’ For Japan Secu", "summary": "라쿠텐 CEO가 AST 위성통신 도입이 일본 안보와 통신망 확충에 결정적이라고 강조했다. 주식 시장에서도 위성 서비스 추진 기대감으로 주가가 상승했다.", "source": "stocktwits.com", "date": "2026-09-06 08:20", "url": "https://stocktwits.com/news-articles/markets/equity/asts-rakuten-japan-security-spacex-rivalry/cZKyRhER7On", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐모바일 위성통신"}, {"title": "中·싱가포르 연구진 “ 스타링크 최신 단말기 해킹 성공” [차이나우]", "summary": "중국과 싱가포르 연구진이 스페이스X의 스타링크 최신 사용자 단말기를 해킹해 관리자 권한을 확보했다고 밝혔다. 이번 취약점 발견으로 위성통신 보안성에 대한 우려가 제기되고 있다.", "source": "segye.com", "date": "2026-09-06 07:19", "url": "https://www.segye.com/newsView/20260904502034?OutUrl=naver", "category": "tech", "importance": 4, "wl": false, "topic": "스타링크 단말기해킹"}, {"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 AI 네이티브 네트워크를 중심으로 한 6G 통신의 3대 핵심 축을 공개했다. 차세대 통신 가치 밸류체인을 재편할 혁신 기술 로드맵을 제시했다. 통신 장비 및 반도체 업계의 기술 표준 방향성을 보여준다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g"}, {"title": "SpaceX Just Launched AST SpaceMobile's Biggest Bet To Advance Cell Service From Space - st", "summary": "스페이스X가 AST스페이스모바일의 대형 위성을 발사하며 우주 기반 셀룰러 통신 서비스 진전을 이뤘다. 양사의 협력을 통해 우주 통신망 구축이 가속화되고 있다. 저궤도 위성 통신의 상용화 기대감을 높인다.", "source": "stocktwits.com", "date": "2026-09-06 03:52", "url": "https://stocktwits.com/news-articles/markets/equity/spacex-launches-ast-spacemobile-biggest-satellites-cell-service-from-space/cZK0HS1R7IN", "category": "contract", "importance": 4, "wl": false, "topic": "ast스페이스모바일 발사"}, {"title": "ASTS Stock Slides Premarket: AT&T Says SpaceX And Amazon Could Rival AST SpaceMobile In Sa", "summary": "AT&T는 스페이스X와 아마존이 위성 통신(D2C) 분야에서 AST 스페이스모바일의 강력한 라이벌이 될 수 있다고 언급했다. 이 여파로 ASTS 주가가 프리마켓에서 하락세를 보였다. 저궤도 위성 통신 시장의 패권을 쥐기 위한 경쟁 구도가 격화되고 있다.", "source": "stocktwits.com", "date": "2026-09-06 02:32", "url": "https://stocktwits.com/news-articles/markets/equity/asts-stock-slides-premarket-att-flags-spacex-amazon-as-rivals/cZBfYzqRebM", "category": "other", "importance": 4, "wl": false, "topic": "ast스페이스모바일 위성경쟁"}, {"title": "Delta Picks Amazon Over Starlink for In-Flight Wi-Fi - MiGFlug", "summary": "델타항공이 기내 Wi-Fi 서비스 파트너로 스타링크 대신 아마존(카이퍼)을 선택했다. 위성 통신 시장에서 아마존이 주요 고객을 확보하며 스타링크와 경쟁 구도를 형성하고 있다. 항공기 기내 인터넷 시장의 장비 및 서비스 수주전 성과다.", "source": "MiGFlug", "date": "2026-09-05 20:56", "url": "https://migflug.com/afterburner/delta-picks-amazon-over-starlink-for-in-flight-wi-fi/", "category": "contract", "importance": 4, "wl": false, "topic": "아마존 위성통신"}, {"title": "ASTS Stock Eyes Weekly Comeback: AT&T Says AST SpaceMobile Satellite Offering Will 'Come T", "summary": "AT&T는 AST SpaceMobile의 위성통신 서비스가 곧 제공될 것이라고 밝혔다. 이번 서비스는 위성을 통한 직접 연결을 지원하며 통신망 커버리지를 크게 확대할 것으로 기대된다. 경쟁 구도 측면에서 위성통신 시장의 상용화 경쟁이 가속화되고 있다. 이는 통신사들의 서비스 차별화와 미래 인프라 투자 전략에 중요한 의미를 갖는다.", "source": "stocktwits.com", "date": "2026-09-05 12:15", "url": "https://stocktwits.com/news-articles/markets/equity/asts-at-and-t-satellite-offering-next-year/cZZn4ASR7DU", "category": "contract", "importance": 4, "wl": false, "topic": "at&t 위성통신"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - Fierce Network", "summary": "마스오렌지(MásOrange)와 에릭슨이 6 GHz 스펙트럼 테스트를 성공적으로 진행하며 차세대 6G 시대를 향한 초기 발걸음을 내디뎠다. 양사는 고주파수 대역 활용성을 검증하고 향후 모바일 네트워크 진화를 위한 기술 기반을 다지고 있다.", "source": "Fierce Network", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6ghz 스펙트럼"}, {"title": "ASTS Stock Hits One-Month Low: Insider Buys The Dip After BlueBird Deployments, Japan Win ", "summary": "AST스페이스모바일의 위성 배치 및 글로벌 지역 수주 성과 이후 주가 움직임이 전해졌다. 내부자 매수 등 투자자들의 반응이 나타나고 있다. 저궤도 위성 통신 사업의 진척 상황을 보여준다.", "source": "stocktwits.com", "date": "2026-09-06 18:13", "url": "https://stocktwits.com/news-articles/markets/equity/asts-insider-buys-dip-bluebird-deployments-japan-win/cZsA9MwRJuG", "category": "contract", "importance": 3, "wl": false, "topic": "ast스페이스모바일 동향"}, {"title": "[미국 주식 돋보기] 스페이스X AI투자 통했다…2조클럽 재입성", "summary": "스페이스X의 기업 가치가 기존 로켓과 스타링크 중심에서 위성통신과 AI 분야로 확대되고 있다. 자본시장에서 스타링크의 성장성과 AI 컴퓨팅 역량이 주목받고 있다.", "source": "mk.co.kr", "date": "2026-09-06 17:10", "url": "https://www.mk.co.kr/article/12145451", "category": "other", "importance": 3, "wl": false, "topic": "스타링크 스페이스x가치"}, {"title": "美 뉴욕 가는 길 넓어졌다…유나이티드항공, 인천~뉴어크 매일 운항", "summary": "유나이티드항공이 보유 항공기에 스타링크 기반 와이파이를 대거 도입하고 있으며 연말까지 대상을 확대할 계획이다. 저궤도 위성통신 서비스의 B2B 항공 시장 확장을 보여준다.", "source": "newsis.com", "date": "2026-09-06 16:14", "url": "https://www.newsis.com/view/NISX20260906_0003778045", "category": "contract", "importance": 3, "wl": false, "topic": "스타링크 항공기적용"}, {"title": "HBM·CXL 쏟아지자… 큐알티 신뢰성 평가 사업에 기회 커진다", "summary": "저궤도 위성 시장의 성장에 따라 관련 부품과 전자장비에 대한 시험 및 신뢰성 평가 수요가 증가하고 있다. 국내 기업들에게 새로운 사업 기회가 창출되고 있다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 15:46", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484275", "category": "other", "importance": 3, "wl": false, "topic": "큐알티 위성부품시험"}, {"title": "독일 이자르, 유럽 본토 첫 상업 위성 발사 성공", "summary": "독일 이자르 , {"title": "[글로벌 포커스] 수에즈 품은 이집트, 미·중 'AI 패권 전쟁'의 새로운 ...", "summary": "중국 통신장비 업체 화웨이가 이집트에 AI 모델 훈련용 컴퓨팅 클러스터 구축 입찰 제안서를 제출하며 선제공격에 나섰다. 미·중 AI 패권 경쟁 속에서 화웨이의 해외 인프라 확장이 주목받고 있다.", "source": "newsian.co.kr", "date": "2026-09-05 06:50", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=94828", "category": "contract", "importance": 4, "wl": false, "topic": "화웨이 이집트수주"}, {"title": "고고도 기지국?…소프트뱅크, 성층권서 엣지컴퓨팅 실험", "summary": "일본 소프트뱅크가 성층권에서 엣지컴퓨팅 실험을 진행하며 HAPS의 발전 가능성을 타진하고 있다. HAPS는 스타링크 같은 위성통신과 지상 이동통신을 잇는 새로운 네트워크 계층으로 주목받고 있다.", "source": "zdnet.co.kr", "date": "2026-09-05 06:01", "url": "https://zdnet.co.kr/view/?no=20260904222208", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 성층권통신"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤(Deutsche Telekom)과 에릭슨(Ericsson)이 독일 함부르크의 알텐베르더 컨테이너 터미널에 프라이빗 5G 네트워크를 구축했다. 이는 7년 동안 이어져 온 양사의 셀룰러 기술 실험의 최신 성과로, 산업용 5G가 실제 현장에서 어떻게 구현되는지 보여주는 사례다. 제조 및 물류 현장에서의 스마트팩토리 가속화와 함께 통신 장비 시장에서의 입지를 다지는 계기가 되고 있다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 4, "wl": true, "topic": "에릭슨 수주"}, {"title": "Huawei latest SingleRAN 22.1 launch targets the Agentverse - Total Telecom", "summary": "화웨이가 에이전트버스(Agentverse)를 겨냥한 최신 'SingleRAN 22.1' 솔루션을 공식 출시했다. AI 에이전트 시대를 맞아 통신망의 자율성과 지능형 무선 접속 네트워크 성능을 극대화하는 차세대 장비 기술이다.", "source": "Total Telecom", "date": "2026-09-04 22:16", "url": "https://totaltele.com/huawei-latest-singleran-22-1-launch-targets-the-agentverse/", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 싱글란 출시"}, {"title": "‘관세 폭탄’ 美에 등 돌린 加, 中과 8년 만에 군사 교류", "summary": "캐나다가 과거 화웨이 창업자 딸 체포 사건으로 악화되었던 중국과의 관계를 회복하며 국방 대화에 나섰다. 과거 통신장비 관련 갈등이 양국 관계의 분수령이었음을 보여준다.", "source": "kmib.co.kr", "date": "2026-09-06 18:38", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000009486&cp=nv", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 캐나다외교"}, {"title": "Nokia, Ericsson, IBM, to Blackberry: How humbled tech giants reinvented for a comeback - T", "summary": "노키아, 에릭슨, IBM, 블랙베리 등 과거의 거대 테크 기업들이 어떻게 혁신을 통해 시장에 성공적으로 재기했는지 그 비결을 조명했다. 글로벌 통신 장비 및 IT 명가들의 턴어라운드 전략이 업계에 시사점을 준다.", "source": "The Indian Express", "date": "2026-09-06 17:07", "url": "https://indianexpress.com/article/explained/explained-economics/nokia-ericsson-ibm-blackberry-comeback-10865506/", "category": "other", "importance": 3, "wl": false, "topic": "노키아 에릭슨 재기"}, {"title": "“横ワイド”が折りたたみの標準になる？ コンテンツ視聴に便利な4：3画面の是非", "summary": "펼쳤을 때 4:3 비율의 가로 와이드 화면을 제공하는 폴더블 스마트폰이 시장의 주목을 받고 있다. 삼성과 화웨이에 이어 애플도 이 시장에 진입할 것으로 전망되는 가운데 콘텐츠 시청 편의성과 경량화가 화두다. 새로운 폼팩터가 모바일 시장의 표준으로 자리잡을지 업계의 관심이 쏠린다.", "source": "ITmedia Mobile", "date": "2026-09-06 10:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/06/news006.html", "category": "tech", "importance": 3, "wl": true, "topic": "삼성전자 폴더블폰"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "통신 임원들은 5G의 더 큰 사업적 기회가 소비자 시장보다는 산업 자동화 영역에 있다고 입을 모았다. 스마트팩토리와 물류 혁신을 위한 프라이빗 5G 및 기업용 네트워크 수요가 가속화되고 있다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "other", "importance": 3, "wl": false, "topic": "5g 산업자동화"}, {"title": "Huawei Enterprise AI Push Is Reshaping Industrial Infrastructure - urbanacres.in", "summary": "화웨이의 기업용 AI 추진 전략이 산업 인프라 전반을 재편하고 있다. 제조, 물류 등 다양한 산업 현장에 AI와 5G 통신을 결합한 디지털 인프라 솔루션을 확산시키고 있다.", "source": "urbanacres.in", "date": "2026-09-05 11:27", "url": "https://urbanacres.in/huawei-enterprise-ai-push-is-reshaping-industrial-infrastructure/", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 엔터프라이즈ai"}, {"title": "Nokia Tests Network APIs in Healthcare - Telecom Reseller / Technology Reseller News", "summary": "노키아가 헬스케어 분야를 대상으로 네트워크 API 테스트를 진행하고 있다. 통신 네트워크의 프로그래밍 가능성을 높여 의료 분야를 비롯한 다양한 산업군에서 새로운 디지털 솔루션을 창출하려는 시도다.", "source": "Telecom Reseller / Technology Reseller News", "date": "2026-09-05 08:15", "url": "https://telecomreseller.com/2026/09/04/nokia-tests-network-apis-in-healthcare/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 네트워크api"}, {"title": "The Swedish company Ericsson intends to gain a foothold in the Turkmen market of telecommu", "summary": "스웨덴의 통신 장비 기업 에릭슨이 투르크메니스탄 통신 시장에 본격적으로 발을 들여놓을 채비를 하고 있다. 중앙아시아 지역의 통신 인프라 현대화 수요를 공략하기 위한 시장 진출 움직임이다.", "source": "Turkmenportal.com", "date": "2026-09-05 06:17", "url": "https://turkmenportal.com/en/news/54025-shvedskaya-kompaniya-ericsson-namerena-zakrepitsya-na-turkmenskom-rynke-telekommunikacionnyh-uslug--------------------------", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 투르크메니스탄"}, {"title": "Ericsson and FIS bundle wallet and payments stack - tech.africa", "summary": "에릭슨(Ericsson)이 FIS와 손잡고 모바일 월렛 및 결제 스택을 번들로 결합하는 협력을 추진한다. 통신 인프라와 금융 기술을 융합하여 통신사들에게 새로운 부가 서비스 솔루션을 제공한다는 전략이다.", "source": "tech.africa", "date": "2026-09-05 05:13", "url": "https://tech.africa/ericsson-fis-wallet-platform/", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 핀테크협력"}, {"title": "T-Mobile hands CFO reins to ex-Shell exec Jessica Uhl, as Osvaldik retires", "summary": "미국의 주요 이동통신사인 T-Mobile이 새로운 최고재무책임자(CFO)로 전 셸(Shell) 임원인 제시카 울(Jessica Uhl)을 임명했다. 기존 CFO인 피터 오스발딕(Peter Osvaldik)이 내년 2월 퇴임하고 2027년 7월에 최종 은퇴함에 따라 예정된 수순으로 경영진 교체가 이루어진다. 이번 인사는 통신 업계의 거대 기업인 T-Mobile의 재무 전략을 이끌어갈 리더십 개편의 일환으로 주목받고 있다.", "source": "Light Reading", "date": "2026-09-05 01:12", "url": "https://www.lightreading.com/business-transformation/t-mobile-hands-cfo-reins-to-ex-shell-exec-jessica-uhl-as-osvaldik-retires", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원인사"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - whalesbook.com", "summary": "인도 BSNL의 국산 4G 네트워크가 일일 6 페타바이트 트래픽 마일스톤을 달성하며 안정적인 운용 능력을 입증했다.", "source": "whalesbook.com", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "tech", "importance": 3, "wl": false, "topic": "bsnl 국산화 4g"}, {"title": "Ciena expects supply constraints to push backlog past $10B by year's end", "summary": "광통신 및 네트워크 장비업체 시에나(Ciena)의 매출이 AI 관련 네트워킹 지출 급증에 힘입어 가파르게 상승하고 있다. 그러나 연말까지 수주 잔고가 100억 달러를 넘어설 것으로 예상되는 가운데 공급망 문제로 인해 수요 대응에 차질을 빚고 있다. 주식 시장은 이러한 공급 제약 요인에 대해 다소 우려 섞인 시선을 유지하고 있다.", "source": "Light Reading", "date": "2026-09-04 22:03", "url": "https://www.lightreading.com/finance/ciena-expects-supply-issues-will-push-backlog-past-10b-by-year-s-end", "category": "other", "importance": 3, "wl": true, "topic": "시에나 실적"}, {"title": "Ericsson (NASDAQ:ERIC) Given Consensus Recommendation of \"Hold\" by Analysts - MarketBeat", "summary": "시장 분석가들이 에릭슨(Ericsson) 주식에 대해 컨센서스 추천 의견으로 '보유(Hold)'를 제시했다. 글로벌 통신 장비 시장의 시황과 실적 전망에 기반한 평가다.", "source": "MarketBeat", "date": "2026-09-05 17:17", "url": "https://www.marketbeat.com/instant-alerts/consensus-ericsson-nasdaq-eric-given-consensus-recommendation-of-hold-by-analysts-2026-09-05/", "category": "other", "importance": 2, "wl": false, "topic": "에릭슨 주식전망"}, {"title": "Telecom news: InCoax Networks, Nokia, Sjoberg’s, Telit Cinterion, Array Digital Infrastruc", "summary": "인코액스 네트워크, 노키아, 쇼베르 등 글로벌 통신 인프라 및 장비 관련 최신 동향이 보도되었다. 통신 장비 시장 내 주요 기업들의 기술 제휴 및 사업 소식이 공유됐다.", "source": "TelecomLead", "date": "2026-09-05 16:34", "url": "https://telecomlead.com/news/telecom-news-incoax-networks-nokia-sjobergs-telit-cinterion-array-digital-infrastructure-127613", "category": "other", "importance": 2, "wl": false, "topic": "노키아 통신동향"}, {"title": "Telecom news: QuantalRF, In-Building Wireless Market, Scientel Solutions - TelecomLead", "summary": "콴탈RF, 인빌딩 무선 시장, 사이언텔 솔루션 등 통신 장비 및 인프라 분야의 최신 시장 동향이 보도되었다. 관련 기업들의 기술 개발 및 생태계 확장 소식이 전해졌다.", "source": "TelecomLead", "date": "2026-09-05 16:12", "url": "https://telecomlead.com/news/telecom-news-quantalrf-in-building-wireless-market-scientel-solutions-127615", "category": "other", "importance": 2, "wl": false, "topic": "통신장비 시장동향"}], "policy": [{"title": "9.4조 AI 승부수 띄운 정부… '보안·전국민 서비스'로 생태계 가속", "summary": "과기정통부가 내년도 AI 관련 예산을 전년 대비 대폭 늘린 9조 4211억 원으로 편성했다. 정부의 대규모 재정 투입을 통해 국가 AI 생태계 가속화와 보안 역량 강화를 추진한다.", "source": "newscj.com", "date": "2026-09-06 14:18", "url": "https://www.newscj.com/news/articleView.html?idxno=3430376", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 ai예산"}, {"title": "2027년 5G 경매 전망, 통신장비 투자 재논의 - tokenpost.kr", "summary": "2027년 5G 주파수 경매 전망에 발맞추어 통신사들의 네트워크 장비 투자 계획이 다시 논의되고 있다. 주파수 할당에 따른 통신 장비업체들의 수주 환경 변화가 예상된다.", "source": "tokenpost.kr", "date": "2026-09-05 08:38", "url": "https://www.tokenpost.kr/news/tech/402820", "category": "policy", "importance": 4, "wl": false, "topic": "5g 경매 장비투자"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니] - 아시아경제", "summary": "내년 국내에서 5G 주파수 경매가 진행될 것으로 전망되면서 통신장비주들의 수혜 여부에 업계의 관심이 집중되고 있다. 통신사들의 추가 주파수 확보와 네트워크 투자 재개 기대감이 관련 장비업체들의 주가에 영향을 미치는 양상이다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 5g경매"}, {"title": "FCC Pays Back $3.08B 'Rip And Replace' Treasury Loan - Law360", "summary": "미국 FCC가 중국산 장비 퇴출(Rip and Replace) 프로그램과 관련해 30억 달러가 넘는 재무부 차입금을 상환했다. 화웨이 등 장비 교체 사업의 재정 집행이 이어지고 있다. 국가 안보 차원의 통신 장비 규제 정책이다.", "source": "Law360", "date": "2026-09-05 06:16", "url": "https://www.law360.com/amp/articles/2521986", "category": "policy", "importance": 4, "wl": false, "topic": "fcc 장비 교체"}, {"title": "전화·검색·카톡 파고드는 ‘모두의 AI’… 생활 속 실행력 승부수", "summary": "과학기술정보통신부가 '모두의 AI' 프로젝트 사업자 간담회를 개최했다. 정부 주도의 AI 서비스 확산과 새로운 가치 창출을 위한 정책 방향을 논의했다.", "source": " wsvalue.kr/news/articleView.html?idxno=24565", "category": "tech", "importance": 4, "wl": false, "topic": "lg유플러스 ai데이터센터"}, {"title": "“PMDC 표준모델 공동개발”…GS건설, 모듈러로 AI데이터센터 공기 단축", "summary": "GS건설이 LG유플러스 등 5개사와 함께 인공지능(AI) 데이터센터 수요에 대응하기 위한 하이퍼스케일 사전 제작형 모듈러 데이터센터(PMDC) 표준모델을 공동 개발한다. 설계와 시공, 운영 역량을 결집해 데이터센터 밸류체인을 확대하고 수행 경쟁력을 높인다는 방침이다.", "source": "매일경제 IT", "date": "2026-09-06 10:14", "url": "https://www.mk.co.kr/news/realestate/12145229", "category": "contract", "importance": 4, "wl": true, "topic": "gs건설 pmdc 표준모델"}, {"title": "\"저궤도 위성만으로 지상망 대체 어렵다”", "summary": "미국 이동통신 3사가 저궤도 위성만으로는 지상망 대체가 어렵다고 보고 스타링크 모바일과의 MVNO 계약에 소극적인 태도를 보이고 있다. 대신 다양한 위성 사업자와 협력해 음영지역 해소를 추진하고 있다.", "source": "zdnet.co.kr", "date": "2026-09-06 08:42", "url": "https://zdnet.co.kr/view/?no=20260906084139", "category": "tech", "importance": 4, "wl": false, "topic": "미국통신사 저궤도위성"}, {"title": "Charter Stock Outlook: Can the $34.5B Cox Merger Help CHTR Recover Before Earnings? - Trad", "summary": "차터 커뮤니케이션스의 345억 달러 규모 콕스 인수합병이 실적 개선에 미칠 영향에 관심이 모이고 있다. 대형 M&A를 통한 시장 재편 가능성이 제기된다.", "source": "TradingKey", "date": "2026-09-06 07:20", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/261998863-charter-stock-outlook-cox-merger-chtr-before-earnings-tradingkey", "category": "contract", "importance": 4, "wl": false, "topic": "차터커뮤니케이션스 콕스 인수"}, {"title": "내년 국내서 '5G 주파수 경매' 전망…통신장비주 수혜주는 [주末머니]", "summary": "국내에서 내년 5G 추가 주파수 경매가 예상되는 가운데 통신 장비주들의 수혜 전망이 제기되었다. 삼성전자의 높은 내수 점유율과 함께 국내 중소 장비 업체 및 에릭슨·노키아 컨소시엄의 구도가 언급된다. 통신 정책 변화에 따른 장비 시장의 변화를 분석한다.", "source": "view.asiae.co.kr", "date": "2026-09-05 08:19", "url": "https://view.asiae.co.kr/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "한국 5g 주파수 경매 수혜주"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다", "summary": "통신사들이 기지국을 AI 데이터센터로 활용하는 변신을 시작한 가운데, 노키아와 삼성전자가 국내 상용망에서 머신러닝 기반 채널 추정 기술 등 AI 통신 기술 실증에 나섰다. 통신 장비 제조사의 차세대 AI-RAN 기술 경쟁력을 보여준다.", "source": "yna.co.kr", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/view/AKR20260904023000017?input=1195m", "category": "tech", "importance": 4, "wl": false, "topic": "삼성전자 ai 기지국"}, {"title": "KDDIが光回線＋5Gの「auひかりプラス」を提供する狙い 光コラボを生かして全国展開も視野に", "summary": "일본 KDDI가 광회선과 5G SA를 결합한 신서비스 'auひかりプラス(au 히카리 플러스)'를 9월 17일에 출시한다. 즉시 개통 서비스, 장애 시 자동 백업, 유선 전화 VoLTE화 등의 부가 가치를 제공한다. 그룹 내 프로바이더 경쟁 해소와 NTT 광콜라보 활용을 통해 전국적인 사업 효율화와 가입자 확대에 나선다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "contract", "importance": 4, "wl": true, "topic": "kddi 신규서비스"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "summary": "인도 통신 시장에서 기존에 구축된 중국산 통신 장비를 철거하고 교체하는 방안이 검토되고 있다. 옴디아의 모바일 인프라 및 RAN 수석 애널리스트 레미 파스칼은 중국산 장비가 인도 통신망에서 수년간 운영되어 왔다고 언급했다. 국가 안보 및 공급망 리스크 관리 차원에서 노골적인 장비 교체 논의가 진전될지 업계의 이목이 집중되고 있다.", "source": "RCR Wireless", "date": "2026-09-04 23:22", "url": "https://rcrwireless.com/20260904/carriers/india-replace-chinese-equipment", "category": "policy", "importance": 4, "wl": true, "topic": "인도 통신사 규제"}, {"title": "Charter Communications stock steadies as investors eye recent revenue growth - AD HOC NEWS", "summary": "차터 커뮤니케이션스의 최근 매출 성장세에 힘입어 주가가 안정세를 보이고 있다.", "source": "AD HOC NEWS", "date": "2026-09-06 19:47", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/charter-communications-stock-steadies-as-investors-eye-recent-revenue/70059665", "category": "earnings", "importance": 3, "wl": false, "topic": "차터커뮤니케이션스 실적"}, {"title": "가을밤 수놓은 100만 인파…\"하늘 보는 모든 사람이 누릴 행복\" 쏘아올렸...", "summary": "대규모 인파가 몰린 축제 현장에서 KT의 5G 네트워크 슬라이싱 기술을 기반으로 한 CCTV 통합관제 시스템이 가동되어 안전을 관리했다. 통신 인프라의 고도화된 기술을 공공 안전에 적용한 우수 사례다.", "source": "newsroad.co.kr", "date": "2026-09-06 19:18", "url": "http://www.newsroad.co.kr/news/articleView.html?idxno=63867", "category": "tech", "importance": 3, "wl": false, "topic": "kt 네트워크 슬라이싱"}, {"title": "Verizon waives charges for Hurricane Lowell, prepares network in Hawaiʻi - Verizon", "summary": "미국 통신사 버라이즌(Verizon)이 허리케인 로웰(Lowell) 내습에 대비해 하와이 지역의 통신 네트워크를 사전 정비하고 피해 지역 요금을 면제 조치했다. 재난 상황에 대비한 통신망 비상 대응 체계를 가동 중이다.", "source": "Verizon", "date": "2026-09-06 18:32", "url": "https://www.verizon.com/about/news/hurricane-lowell-updates", "category": "outage", "importance": 3, "wl": false, "topic": "버라이즌 허리케인"}, {"title": "암표 잡고 실시간 번역까지…KT야구장 더 스마트해졌다 - 서울경제", "summary": "실시간 번역 및 암표 방지 시스템 등 KT 야구장의 스마트 기술 적용 현황을 보도했다.", "source": "서울경제", "date": "2026-09-06 17:58", "url": "https://www.sedaily.com/article/20087691", "category": "tech", "importance": 3, "wl": false, "topic": "kt 야구장 ai적용"}, {"title": "LG유플러스, PMDC 얼라이언스 출범…AI 데이터센터 건축기간 줄인다 - 네이트", "summary": "LG유플러스가 PMDC 얼라이언스를 출범하고 AI 데이터센터 건축 기간 단축을 추진한다. 건설업계와 협력하여 모듈러 데이터센터 표준모델을 공동 개발한다. 데이터센터 인프라 구축 효율성을 대폭 높일 것으로 기대된다.", "source": "네이트", "date": "2026-09-06 17:38", "url": "https://news.nate.com/view/20260906n13319", "category": "contract", "importance": 3, "wl": false, "topic": "lg유플러스 협력"}, {"title": "시민 생애 주기·하루 동선 따라 '더 나은 내일' 만든다", "summary": "대구시가 5G 구급차에 통신 장비를 구축하고 응급의료기관과 소방이 참여하는 AI 플랫폼 실증사업을 추진한다. 공공 부문의 5G 특화 인프라 확충과 응급 의료 디지털 전환을 보여준다.", "source": "idaegu.co.kr", "date": "2026-09-06 17:24", "url": "https://www.idaegu.co.kr/news/articleView.html?idxno=558741", "category": "contract", "importance": 3, "wl": false, "topic": "5g 구급차 실증"}, {"title": "\"AI 데이터센터에 모듈러 접목\" … GS건설·LGU+ 표준모델 개발", "summary": "GS건설이 급증하는 AI 데이터센터 수요에 대응하기 위해 LG유플러스 등 5개사와 협력하여 모듈러 기술을 접목한 사전 제작형 모듈러 데이터센터(PMDC) 표준모델 공동 개발에 나선다. 설계, 시공, 운영 역량을 결집해 공기를 단축하고 경쟁력을 높인다는 전략이다.", "source": "매일경제 IT", "date": "2026-09-06 17:12", "url": "https://www.mk.co.kr/news/realestate/12145461", "category": "contract", "importance": 3, "wl": true, "topic": "gs건설 lgu+ 데이터센터"}, {"title": "Rural calls, data to become cheaper by Q1 2027 – Sam George - MyJoyOnline", "summary": "가나 정부가 농어촌 지역의 음성 통화 및 데이터 요금을 내년 1분기까지 인하하겠다고 밝혔다. 보편적 통신 서비스 접근성 확대를 위한 정책이다. 통신 사업자의 서비스 요금 규제를 다룬다.", "source": "MyJoyOnline", "date": "2026-09-06 14:48", "url": "https://www.myjoyonline.com/rural-calls-data-to-become-cheaper-by-q1-2027-sam-george/", "category": "policy", "importance": 3, "wl": false, "topic": "가나 통신 정책"}, {"title": "After 10 years of India feat, Jio sets its sights on global market: Akash Ambani", "summary": "인도 릴라이언스 지오(Jio)가 인도 시장 성공을 발판 삼아 글로벌 시장 진출에 시동을 걸었다. 무케시 암바니 회장의 비전에 따라 10년 전 저렴하고 접근성 높은 디지털 연결성을 인도 전역에 보급했던 경험을 바탕으로 삼는다. 아카시 암바니 대표는 지오가 이제 세계 무대로 시선을 넓히고 있음을 강조했다.", "source": "ET Telecom", "date": "2026-09-06 14:11", "url": "https://telecom.economictimes.indiatimes.com/news/industry/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market-akash-ambani/133826619", "category": "contract", "importance": 3, "wl": true, "topic": "릴라이언스 지오 글로벌"}, {"title": "「繋がりづらくなる」懸念強まる楽天モバイル、終了予定のauローミングに言及「詰めの協議中」一部地域は継続へ - オタク総研", "summary": "라쿠텐모바일의 수신 감도 악화 우려 속에서 종료 예정이던 au 로밍 협상이 진행 중이며 일부 지역은 지속된다고 전했다.", "source": "オタク総研", "date": "2026-09-06 11:30", "url": "https://0115765.com/archives/203995", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐모바일 로밍계약"}, {"title": "티빙 3954만 계정 유출…'보안 독파모·모두의 AI' 시동[뉴스잇(IT)쥬]", "summary": "SK텔레콤, KT 등 통신사가 과기정통부와 간담회를 갖고 '모두의 AI' 사업 협력 방안을 논의했다. ICT 산업의 빠른 변화 속에서 대국민 AI 서비스 확산을 도모한다.", "source": "news1.kr", "date": "2026-09-06 11:02", "url": "https://www.news1.kr/it-science/cc-newmedia/6281234", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 모두의ai"}, {"title": "'투자 한파' 맞은 AI 스타트업…상장사 손잡고 판로 뚫는다", "summary": "투자 한파를 맞은 국내 AI 스타트업들이 SK텔레콤, KT 등 코스피·코스닥 상장사들과 손잡고 기술 실증(PoC)부터 고객사 연계, 공동 사업화까지 협력 범위를 넓히고 있다. 상장사가 보유한 인프라와 고객망을 활용해 초기 기업들이 신규 시장에 진출하려는 움직임이 활발해지고 있다.", "source": "ZDNet Korea", "date": "2026-09-06 10:50", "url": "https://zdnet.co.kr/view/?no=20260906102957", "category": "other", "importance": 3, "wl": true, "topic": "통신사 ai스타트업 협력"}, {"title": "통신 장비 주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게", "summary": "3G부터 5G를 거치며 무선 장비 업체 수는 줄었지만 선도업체 매출은 늘어나는 쏠림 현상이 반복되고 있다. 엔비디아의 AI 기지국(AI-RA   const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
