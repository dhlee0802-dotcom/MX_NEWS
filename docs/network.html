h.africa/ericsson-fis-wallet-platform/", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 fis 지갑 연동"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - Fierce Network", "summary": "마스오렌지(MasOrange)와 에릭슨이 6GHz 주파수 대역을 활용한 테스트를 진행하며 6G 미래를 향한 초기 단계의 기술 검증에 착수했다. 이번 테스트는 차세대 이동통신 표준인 6G 상용화를 위한 주파수 가용성 확보와 성능 평가에 중요한 의미를 가진다. 양사는 협력을 통해 미래 네트워크 기술 주도권을 선점하고자 한다.", "source": "Fierce Network", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 6ghz 스펙트럼"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - whalesbook.com", "summary": "인도 국영통신사 BSNL의 자국화 4G 네트워크가 일일 트래픽 6 페타바이트를 기록하며 순항 중이라는 장비 운영 성과 보도입니다.", "source": "whalesbook.com", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "contract", "importance": 3, "wl": false, "topic": "bsnl 4g 네트워크"}, {"title": "Spain’s MásOrange signals a next step in the 6G story - telecomtv.com", "summary": "스페인의 마스오렌지와 에릭슨이 6G 시대를 향한 다음 단계의 기술 진전을 알렸다. 6GHz 대역 테스트 등을 통해 차세대 네트워크 인프라 구축의 발판을 마련하고 있으며, 글로벌 통신 장비 시장에서 6G 기술 표준 선점을 위한 경쟁이 본격화되고 있음을 보여준다.", "source": "telecomtv.com", "date": "2026-09-04 23:32", "url": "https://www.telecomtv.com/content/6g/spain-s-m-sorange-signals-a-next-step-in-the-6g-story-56174/", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 6g 스토리"}, {"title": "수급 악화로 주가 빠졌지만… RFHIC 반등 기대 커지는 까닭", "summary": "5G SA 및 6G 투자 확대에 따른 통신 장비 시장의 새로운 수요를 분석한 기사다. RFHIC가 공급하는 고주파 반도체 부품의 성장 기대를 다룬다. 국내 부품 업체의 차세대 통신망 준비 동향이다.", "source": "pinpointnews.co.kr", "date": "2026-09-06 09:04", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484216", "category": "tech", "importance": 2, "wl": false, "topic": "rfhic 반도체 수요"}, {"title": "Ericsson (NASDAQ:ERIC) Given Consensus Recommendation of \"Hold\" by Analysts - MarketBeat", "summary": "시장조사기관과 애널리스트들이 에릭슨(Ericsson) 주식에 대해 '보류(Hold)' 투자의견을 제시했다. 단기적인 실적 전망과 글로벌 통신 장비 시장의 시황을 반영한 결과로 분석된다.", "source": "MarketBeat", "date": "2026-09-05 17:17", "url": "https://www.marketbeat.com/instant-alerts/consensus-ericsson-nasdaq-eric-given-consensus-recommendation-of-hold-by-analysts-2026-09-05/", "category": "other", "importance": 2, "wl": false, "topic": "에릭슨 주식 투자의견"}, {"title": "Telecom news: QuantalRF, In-Building Wireless Market, Scientel Solutions - TelecomLead", "summary": "퀀탈RF와 인빌딩 무선 시장, 센티엘 솔루션 등 글로벌 통신 인프라 및 부품 관련 최신 동향이 보도되었다.", "source": "TelecomLead", "date": "2026-09-05 16:12", "url": "https://telecomlead.com/news/telecom-news-quantalrf-in-building-wireless-market-scientel-solutions-127615", "category": "other", "importance": 2, "wl": false, "topic": "퀀탈rf 통신 뉴스"}, {"title": "All types of Chinese businesses using Huawei tech solutions: Report - Huawei Central", "summary": "보고서에 따르면 다양한 분야의 중국 기업들이 화웨이의 기술 솔루션을 광범위하게 활용하고 있는 것으로 나타났다. 화웨이의 기술 생태계가 산업 전반으로 깊숙이 침투하고 있음을 보여준다.", "source": "Huawei Central", "date": "2026-09-04 21:14", "url": "https://www.huaweicentral.com/all-types-of-chinese-businesses-using-huawei-tech-solutions-report/", "category": "other", "importance": 2, "wl": false, "topic": "화웨이 기술 솔루션 확산"}], "policy": [{"title": "2027년 5G 경매 전망, 통신장비 투자 재논의 - tokenpost.kr", "summary": "2027년 5G 주파수 경매 전망과 이에 따른 통신장비 투자 계획의 재논의 필요성을 다룬 기사입니다. 통신 정책 및 장비 시장 투자 방향에 직접적인 영향을 미칩니다.", "source": "tokenpost.kr", "date": "2026-09-05 08:38", "url": "https://www.tokenpost.kr/news/tech/402820", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 주파수 경매"}, {"title": "FCC Pays Back $3.08B 'Rip And Replace' Treasury Loan - Law360", "summary": "미국 FCC가 화웨이·ZTE 등 중국산 장비 퇴출을 위한 '립 앤 리플레이스(Rip and Replace)' 프로그램의 재무부 대출금 30억 8천만 달러를 상환했다. 미 정부 주도의 중국산 장비 퇴출 정책의 일환이다.", "source": "Law360", "date": "2026-09-05 06:16", "url": "https://www.law360.com/amp/articles/2521986", "category": "policy", "importance": 4, "wl": false, "topic": "미국 fcc 장비 교체 기금"}, {"title": "Telcos push back on Trai’s proposed 5G slicing norms - financialexpress.com", "summary": "인도 규제당국(TRAI)이 제안한 5G 네트워크 슬라이싱 규제 방안에 대해 통신사들이 강하게 반발하며 반대 의견을 개진하고 있다는 규제 관련 갈등 보도입니다. 통신 사업 전략과 망 운용에 직접적인 영향을 미칩니다.", "source": "financialexpress.com", "date": "2026-09-04 21:49", "url": "https://www.financialexpress.com/business/news/telcos-push-back-on-trais-proposed-5g-slicing-norms/4332144/", "category": "policy", "importance": 4, "wl": false, "topic": "트라이 5g 슬라이싱"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "미국 연방항공청(FAA)의 5G 무선 고도계 규제가 최종 타결되며 항공기와 5G 통신 간 주파수 간섭 갈등이 해소되었다. 통신사 주파수 활용 환경이 개선된다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "미국 faa 5g 규제"}, {"title": "Canada publishes Responsible Data Centre Development Principles - Telecompaper", "summary": "캐나다 정부가 책임 있는 데이터센터 개발 원칙을 공식 발표했다는 정책 규제 기사입니다.", "source": "Telecompaper", "date": "2026-09-05 00:21", "url": "https://www.telecompaper.com/news/canada-publishes-responsible-data-centre-development-principles--1581820", "category": "policy", "importance": 3, "wl": false, "topic": "캐나다 데이터센터"}, {"title": "All 56 Federal Broadband Plans Approved. Construction Comes Next - Broadband Breakfast", "summary": "미국 연방 광대역 통신 계획 승인 완료 및 건설 단계 진입을 다룬 통신 정책 기사이다. 인프라 구축 예산 집행을 다룬다.", "source": "Broadband Breakfast", "date": "2026-09-04 22:05", "url": "https://broadbandbreakfast.com/all-56-federal-broadband-plans-approved-construction-comes-next/", "category": "policy", "importance": 3, "wl": false, "topic": "미국 광대역 통신망"}, {"title": "Media: Trump’s snub throws Macron’s space summit into turmoil - caliber.az", "summary": "", "source": "caliber.az", "date": "2026-09-05 15:09", "url": "https://caliber.az/en/post/media-trump-s- ted in Korea Next Year... Beneficiaries Among Telecom Equipment", "summary": "내년 한국에서 추가 5G 주파수 경매가 예상됨에 따라 국내 통신장비 업체들의 수혜 기대감이 커지고 있다. 국내 통신사 네트워크 투자 및 장비 시장에 직접적 영향을 미치는 정책·시장 이벤트이다.", "source": "아시아경제", "date": "2026-09-05 08:19", "url": "https://www.asiae.co.kr/en/article/2026090320502060845", "category": "policy", "importance": 4, "wl": false, "topic": "한국 5g 주파수 경매"}, {"title": "KDDIが光回線＋5Gの「auひかりプラス」を提供する狙い 光コラボを生かして全国展開も視野に", "summary": "KDDI는 광회선과 5G SA를 융합한 신서비스 'auひかりプラス'를 9월 17일부터 제공한다. 개통 시 즉시 이용과 장애 시 자동 백업 기능을 제공하며, 그룹 내 프로바이더 경쟁 해소와 NTT 광콜라보 활용을 통해 전국적인 사업 효율화와 확장을 꾀한다. 이번 서비스 출시는 통신사의 유무선 결합 상품 경쟁력을 한층 높일 것으로 전망된다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "contract", "importance": 4, "wl": true, "topic": "kddi 신규 서비스"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "summary": "인도 통신망에 구축된 레거시 중국산 장비의 전면 철거 및 교체 가능성이 검토되고 있다. 옴디아의 분석가에 따르면 현재 인도 통신 인프라에 도입된 중국산 장비는 수년간 운영되어 왔으나, 안보 및 공급망 리스크 관리 차원에서 교체 논의가 이어지고 있다. 이는 글로벌 통신 장비 시장의 보안 강화 기조와 맞물려 주목을 받고 있다.", "source": "RCR Wireless", "date": "2026-09-04 23:22", "url": "https://rcrwireless.com/20260904/carriers/india-replace-chinese-equipment", "category": "policy", "importance": 4, "wl": true, "topic": "인도 중국산 장비 교체"}, {"title": "Verizon waives charges for Hurricane Lowell, prepares network in Hawaiʻi - Verizon", "summary": "미국 통신사 버라이즌이 허리케인 로웰 내습에 대비해 하와이 지역 고객의 통신 요금을 면제하고 네트워크 비상 대응 태세에 돌입한 기사입니다. 재난 상황에서의 통신사 인프라 운영 동향을 다룹니다.", "source": "Verizon", "date": "2026-09-06 18:32", "url": "https://www.verizon.com/about/news/hurricane-lowell-updates", "category": "other", "importance": 3, "wl": false, "topic": "버라이즌 허리케인 대응"}, {"title": "LG유플러스, PMDC 얼라이언스 출범…AI 데이터센터 건축기간 줄인다 - 네이트", "summary": "LG유플러스가 PMDC 얼라이언스를 출범해 AI 데이터센터 건축 기간을 단축한다. 건설사들과의 협력으로 효율적인 인프라 구축을 도모한다.", "source": "네이트", "date": "2026-09-06 17:38", "url": "https://news.nate.com/view/20260906n13319", m/telecom-equipment/top-10-telecom-tower-deals-of-2026-mtn-ihs-towers-altius-macquarie-and-cvc-drive-infrastructure-ma-127617", "category": "contract", "importance": 3, "wl": false, "topic": "글로벌 통신 타워 딜"}, {"title": "Retail Media in Korea: KT Connects 3,000 CU Stores - Sixteen:Nine", "summary": "KT가 CU 편의점 3,000개 점포에 리테일 미디어를 구축하며 디지털 광고 및 플랫폼 사업을 확장하고 있다는 통신사 인프라 제휴 보도입니다.", "source": "Sixteen:Nine", "date": "2026-09-05 14:53", "url": "https://invidis.com/news/2026/09/retail-media-in-korea-kt-connects-3000-cu-stores/", "category": "contract", "importance": 3, "wl": false, "topic": "kt 리테일 미디어"}, {"title": "LIVE: | Islamabad 5G Spectrum Auction 2026 | PTA Inaugural Ceremony | Geo News James Haske", "summary": "파키스탄 이슬라마바드에서 5G 주파수 경매 및 PTA 취임식이 생중계되었다. 신흥 시장의 5G 네트워크 도입 본격화 내용이다.", "source": "Mshale", "date": "2026-09-05 14:17", "url": "https://mshale.com/9bf82a2b/01c0c54dNsw9aucTWYE", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 5g 경매"}, {"title": "Deutsche Telekom Peoplewatch: change-at-the-top in finance, infra, and tech - telcotitans.", "summary": "도이치텔레콤이 재무, 인프라, 기술 부문에서 최고경영진 및 주요 임원을 교체하는 조직 개편을 단행했다는 인사 보도입니다.", "source": "telcotitans.com", "date": "2026-09-05 14:04", "url": "https://www.telcotitans.com/deutsche-telekomwatch/deutsche-telekom-peoplewatch-change-at-the-top-in-finance-infra-and-tech/10839.article", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영진"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신사업자들은 인도트라이(Trai)가 제안한 5G 네트워크 슬라이싱 관련 서비스 품질(QoS) 규범에 대해 거부 입장을 밝혔다. TRAI는 슬라이싱 자원 사용량을 모니터링하여 무선 자원 활용률이 80%를 넘지 않도록 제안했으나, 통신사들은 이에 대한 우려를 표명하고 있다. 이번 규제 논쟁은 향후 5G 네트워크 운용 자율성과 효율성에 큰 영향을 미칠 것으로 보인다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "인도 trai   return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
