<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

의 주요 통신사들이 정부가 추진하는 5G 네트워크 슬라이싱 관련 서비스 품질(QoS) 규범에 대해 거부 의사를 표명했다. 엄격한 규제가 기술 혁신과 자율적인 망 운용을 저해할 수 있다는 입장을 보이고 있다. 통신 규제 당국과 업계 간의 정책 조율 과정에서 마찰이 발생하고 있다. 향후 인도의 5G 고도화 및 서비스 상용화 속도에 영향을 미칠 핵심 규제 이슈이다.", "source": "The Economic Times", "date": "2026-09-05 04:38", "url": "https://m.economictimes.com/industry/telecom/telecom-giants-reject-trais-5g-slicing-qos-norms-amidst-net-neutrality-debate/articleshow/133776604.cms", "category": "policy", "importance": 4, "wl": false, "topic": "인도 5g 규제"}, {"title": "Spectrum-Cox Merger Update: Will Your Bill And Service Change? - CableTV.com", "summary": "스펙트럼(Spectrum)의 운영사인 차터 커뮤니케이션스와 콕스(Cox) 간의 잠재적 합병 및 인수 추진 상황이 다뤄졌다. 케이블 업계의 대형 M&A가 성사될 경우 요금 체계와 서비스 환경에 미칠 변화가 주목된다. 미국 유선 방송 및 초고속인터넷 시장의 지형도를 바꿀 수 있는 대형 딜이다. 향후 규제 당국의 심사 결과와 시장 재편 방향에 이목이 쏠리고 있다.", "source": "CableTV.com", "date": "2026-09-05 03:19", "url": "https://www.cabletv.com/news/cox-spectrum-merger-will-price-increase", "category": "contract", "importance": 4, "wl": false, "topic": "차터 커뮤니케이션스 m&a"}, {"title": "India weighs rip-and-replace of legacy Chinese telecoms equipment", "summary": "인도 통신 시장에서 기존에 구축된 중국산 통신 장비에 대한 '립 앤 리플레이스(전면 교체)' 방안이 검토되고 있다. 옴디아의 분석에 따르면 중국산 장비가 수년간 인도 통신망에서 운영되어 온 만큼 안보 우려에 따른 정책적 변화가 예상된다. 국가 안보와 공급망 다변화를 위한 통신 규제 강화의 일환이다. 글로벌 장비 시장의 지형도에 큰 영향을 미칠 수 있는 이슈다.", "source": "RCR Wireless", "date": "2026-09-04 23:22", "url": "https://rcrwireless.com/20260904/carriers/india-replace-chinese-equipment", "category": "policy", "importance": 4, "wl": true, "topic": "인도통신사 장비"}, {"title": "T-Mobile CFO Peter Osvaldik to step down in February 2027, Jessica Uhl to succeed", "summary": "티모바일은 피터 오스발딕 CFO의 사임과 제시카 울의 후임 인선을 발표했다. 이번 발표는 행동주의 투자자 엘리엇 인베스트먼트가 도이치텔레콤의 지분을 확보한 가운데 독일 통신 그룹에 티모바일과의 합병 포기를 촉구한 보도와 맞물려 나왔다. 통신사의 고위 경영진 교체 및 대주주 간의 전략적 이해관계 변화를 시사한다. 글로벌 통신 시장의 지배구조 개편 가능성을 보여준다.", "source": "ET Telecom", "date": "2026-09-04 10:57", "url": "https://telecom.economictimes.indiatimes.com/news/industry/t-mobile-cfo-peter-osvaldik-to-step-down-in-february-2027-jessica-uhl-to-succeed/133749414", "category": "contract", "importance": 4, "wl": true, "topic": "티모바일 경영진"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 통신사 릴라이언스 지오가 나브라트리 및 디왈리 기간에 맞추어 40억 달러 규모의 대형 IPO를 추진하고 있다. 10월 중순 로드쇼가 시작될 가능성이 제기되며 연말 시즌 전 자금 조달을 가속화하고 있다. 인도 최대 통신사의 상장을 통한 대규모 자본 시장 진입이다. 글로벌 통신 업계의 투자 및 자본 재편 이벤트로 주목받는다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "contract", "importance": 4, "wl": true, "topic": "릴라이언스지오 ipo"}, {"title": "Bombay HC quashes ₹2,113 crore DoT demand against Vodafone Idea - scanx.trade", "summary": "인도 고등법원이 인도 통신부(DoT)가 보다폰아이디어를 상대로 제기한 2,113억 루피 규모의 요금 및 채권 청구를 기각했다. 이번 판결로 재정적 압박을 겪어온 보다폰아이디어는 심각한 사법 리스크를 일부 해소하게 되었다. 통신사의 재무 건전성과 정부 간 규제 소송 결과라는 점에서 업계의 큰 주목을 받고 있다. 회사의 장기 생존과 투자 여력 확보에 중요한 분수령이 될 전망이다.", "source": "scanx.trade", "date": "2026-09-04 09:28", "url": "https://scanx.trade/stock-market-news/companies/bombay-high-court-quashes-2-113-crore-dot-demand-notices-against-vodafone-idea-for-one-time-spectrum-charges/42522031", "category": "policy", "importance": 4, "wl": false, "topic": "보다폰아이디어 규제"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - Barron's", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤과 T-모바일 간의 잠재적 합병 또는 추가 통합 계획에 반대한다는 입장을 표명한 가운데 T-모바일 주가가 상승했다. 주주 가치 관점에서 무리한 대형 M&A 추진에 제동을 걸려는 움직임이다. 글로벌 통신 거물의 지배구조와 M&A 시나리오에 큰 파장을 일으키고 있다.", "source": "Barron's", "date": "2026-09-04 01:24", "url": "https://www.barrons.com/articles/t-mobile-stock-report-elliott-deutsche-telekom-merger-2880aac4", "category": "strategy", "importance": 4, "wl": false, "topic": "도이치텔레콤 m&a"}, {"title": "Jan Hofmeyr named DT's new Board of Management member for product and technology - Fierce ", "summary": "AWS 출신의 얀 호프마이어가 도이치텔레콤의 제품 및 기술 담당 이사회 멤버 겸 CTO로 공식 선임됐다. 클라우드와 AI 역량을 통신 코어망에 접목하기 위한 전격적인 외부 인재 영입이다. 글로벌 통신 업계에서 빅테크 출신 기술 임원 선임 트렌드를 보여주는 대표적인 사례다.", "source": "Fierce Network", "date": "2026-09-04 00:54", "url": "https://www.fierce-network.com/newswire/jan-hofmeyr-named-dts-new-board-management-member-product-and-technology", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 임원"}, {"title": "Global Telecom Capex Ranking 2026: AT&T, Deutsche Telekom, China Mobile, NTT and Verizon L", "summary": "2026년 글로벌 통신사들의 설비투자(Capex) 순위가 공개된 가운데 AT&T, 도이치텔레콤, 차이나모바일, NTT, 버라이즌 등이 상위권을 차지했다. 이들 주요 통신사업자는 5G 고도화 및 차세대 네트워크 인프라 구축에 막대한 자금을 투입하고 있다. 글로벌 장비 시장의 수요 향방을 가늠할 수 있는 핵심 지표를 제공한다. 통신 장비 벤더들의 영업 전략 수립에 중요한 참고 자료가 된다.", "source": "TelecomLead", "date": "2026-09-03 22:48", "url": "https://telecomlead.com/5g/global-telecom-capex-ranking-2026-att-deutsche-telekom-china-mobile-ntt-and-verizon-lead-network-investment-127592", "category": "contract", "importance": 4, "wl": false, "topic": "글로벌 통신사 투자"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - PRESS9", "summary": "SK텔레콤과 LG유플러스 등 국내 통신사들이 그동안 줄여왔던 망 로그 및 설비 투자를 다시 늘릴 가능성이 제기되고 있다. 5G 단독모드(SA) 전환과 다가오는 주파수 경매가 주요 변수로 작용할 전망이다.", "source": "PRESS9", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "policy", "importance": 4, "wl": false, "topic": "skt lgu+ 망 투자"}, {"title": "'모두의 AI' 연내 출시···SKT·카카오·KT 청사진 공개 - 서울파이낸스", "summary": "정부 주도의 '모두의 AI' 프로젝트에 참여하는 SK텔레콤, KT, 카카오 등 주요 사업자들의 연내 서비스 출시 청사진이 공개됐다. 전 국민이 무료로 이용할 수 있는 국산 AI 서비스 개발에 본격 착수한다. 통신사와 빅테크 간의 AI 서비스 경쟁이 본격화되고 있다.", "source": "서울파이낸스", "date": "2026-09-05 10:00", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637258", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - 연합뉴스", "summary": "통신사들이 전통적인 기지국과 통신 인프라를 AI 데이터센터로 전환하는 변신을 시작했다. 엣지 컴퓨팅과 AI 인프라의 결합을 통해 새로운 수익 모델을 모색하는 통신사 동향을 다뤘다.", "source": "연합뉴스", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR20260904023000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 데이터센터"}, {"title": "KDDIが光回線＋5Gの「auひかりプラス」を提供する狙い 光コラボを生かして全国展開も視野に", "summary": "KDDI는 광회선과 5G SA를 융합한 신서비스 'au히かりプラス'를 9월 17일에 제공한다고 밝혔다. 즉시 이용 개통 및 장애 시 자동 백업을 지원하며 고정 전화도 VoLTE화하여 부가가치를 높였다. NTT 광콜라보레이션을 활용해 전국적인 사업 효율화와 가입자 확대 전략을 펼친다. 통신사의 유무선 통합 가입자 확보 전략을 보여준다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "contract", "importance": 3, "wl": true, "topic": "kddi au히かり"}, {"title": "AT&T Prepares for Hurricane Lowell - AT&T Newsroom", "summary": "미국 통신사 AT&T가 허리케인 로웰(Lowell)의 접근에 대비해 네트워크 비상 대응 체제와 인프라 점검에 나섰다. 재난 상황에서의 통신망 안정성 확보 및 장비 지원 활동이다.", "source": "AT&T Newsroom", "date": "2026-09-05 03:33", "url": "https://about.att.com/pages/disaster_relief/2026/hurricane-lowell.html", "category": "tech", "importance": 3, "wl": false, "topic": "at&t 허리케인 대비"}, {"title": "TELUS (TSX:T): Dividend Aristocrat Exit And AI Pivot Explained - kalkinemedia.com", "summary": "캐나다 통신사 텔러스의 배당 귀족주 지위 변화와 인공지능(AI) 중심의 사업 피벗 전략에 대한 분석이 다뤄졌다. 전통적인 통신 수익 모델에서 벗어나 디지털 및 AI 서비스 기업으로 체질을 개선하려는 행보가 주목받고 있다. 회사의 자본 배분 전략과 미래 성장 동력 확보 방안을 평가하고 있다.", "source": "kalkinemedia.com", "date": "2026-09-05 02:24", "url": "https://kalkinemedia.com/ca/stocks/communication/telus-tsxt-dividend-aristocrat-exit-and-ai-pivot-explained", "category": "strategy", "importance": 3, "wl": false, "topic": "텔러스 ai"}, {"title": "Verizon Communications stock gains as Q2 2026 earnings beat and outage reports test sentim", "summary": "버라이즌(Verizon)이 2026년 2분기 시장 예상치를 상회하는 실적을 발표하며 주가가 상승세를 보였다. 호실적에도 불구하고 일부 지역에서 발생한 네트워크 장애 보도가 투자 심리를 테스트하는 요인으로 작용했다. 탄탄한 재무 성과가 일시적 장애에 대한 우려를 상쇄하는 모습을 보였다. 회사의 견조한 펀더멘털을 재확인하는 계기가 되었다.", "source": "ad-hoc-news.de", "date": "2026-09-05 02:16", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-as-q2-2026-earnings-beat-and-outage/70055902", "category": "earnings", "importance": 3, "wl": false, "topic": "버라이즌 실적"}, {"title": "LS일렉트릭, KT클라우드와 AI 데이터센터 인프라 공급·개발 맞손 - koreasprint.com", "summary": "LS일렉트릭이 kt클라우드와 AI 데이터센터 인프라 공급 및 개발을 위한 상호 협력을 체결했다. 전력 시설과 데이터센터 설비 간의 시너지를 모색한다.", "source": "koreasprint.com", "date": "2026-09-05 00:20", "url": "https://www.koreasprint.com/news/articleView.html?idxno=18674", "category": "contract", "importance": 3, "wl": false, "topic": "kt클라우드 데이터센터"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - Whalesbook", "summary": "인도 국영 통신사 BSNL의 4G 네트워크 일일 트래픽이 6 페타바이트를 돌파하는 마일스톤을 달성했다. 국산 장비 및 자체 망 구축을 추진해온 BSNL의 가입자 트래픽이 꾸준히 증가하고 있음을 보여준다. 인도 이동통신 시장에서 국영 통신사의 입지 변화를 가늠할 수 있는 지표다.", "source": "Whalesbook", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "tech", "importance": 3, "wl": false, "topic": "bsnl 4g"}, {"title": "AT&T Delivers Value, Reliability, and Confidence with New Samsung Galaxy S26 FE - AT&T New", "summary": "미국 통신사 AT&T가 삼성전자의 신제품 갤럭시 S26 FE를 출시하며 가치와 안정성을 제공한다. 주요 통신사의 단말 라인업 확충 및 프로모션 소식이다.", "source": "AT&T Newsroom", "date": "2026-09-04 23:00", "url": "https://about.att.com/story/2026/samsung-galaxy-s26-fe.html", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 삼성 스마트폰"}, {"title": "Deutsche Telekom eyes synergies from Greek move - Mobile World Live", "summary": "도이치텔레콤이 그리스 자회사 OTE 인수 및 경영 효율화 과정에서 창출될 시너지 효과에 주목하고 있다. 유럽 전역의 포트폴리오를 정비하고 수익성을 극대화하려는 전략의 연장선이다. 해외 사업 재편을 통한 그룹 차원의 경쟁력 강화 방안을 모색하고 있다.", "source": "Mobile World Live", "date": "2026-09-04 21:13", "url": "https://www.mobileworldlive.com/europe/deutsche-telekom-eyes-synergies-from-greek-move/", "category": "strategy", "importance": 3, "wl": false, "topic": "도이치텔레콤 인수"}, {"title": "Verizon Layoffs Hit 16,600 as Record Quarter Funds the Cuts - financefeeds.com", "summary": "버라이즌이 역대급 실적을 기록한 가운데 1만 6천여 명 규모의 대규모 감원을 단행했다. 호실적 라 분야에서 전략적 제휴를 체결했다. 스마트 빌딩과 도시 전체에 최적화된 통신 환경을 구축하기 위한 협력을 추진한다. 부동산 자산과 통신 네트워크를 결합하여 새로운 인프라 사업 모델을 창출하려는 시도이다. 향후 기업용 스마트 시티 인프라 시장에서 시너지가 기대된다.", "source": "Telecompaper", "date": "2026-09-04 15:23", "url": "https://www.telecompaper.com/news/mitsui-fudosan-ntt-docomo-form-telecom-and-property-alliance--1581705", "category": "contract", "importance": 3, "wl": false, "topic": "ntt 도코모 제휴"}, {"title": "Telecom Egypt to extend Red2Med system to Taba with petabit link - Developing Telecoms", "summary": "통신 이집트가 타바 지역까지 Red2Med 시스템을 확장하기 위해 페타비트급 링크를 구축한다. 중동 지역의 백본 네트워크 용량 증대 및 통신 인프라 고도화 사업이다. 통신사의 인프라 투자 사례다.", "source": "Developing Telecoms", "date": "2026-09-04 14:58", "url": "https://developingtelecoms.com/telecom-technology/optical-fixed-networks/20777-telecom-egypt-to-extend-red2med-system-to-taba-with-petabit-link.html", "category": "contract", "importance": 3, "wl": false, "topic": "통신이집트 광대역 링크"}, {"title": "KT, '모두의 AI' 프로젝트 이음 본격화…멀티모델·토큰팩토리 결집", "summary": "KT가 과기정통부 주관 '모두의 AI' 사업 설명회에서 국내 AI 기업들과 '이음' 개발을 본격화한다고 밝혔다. 앱, 웹, IPTV 등 다양한 채널을 연계하여 일상 서비스를 하나의 AI 에이전트로 연결하는 비전을 공개했다. 통신사의 AI 서비스 생태계 구축 전략을 보여준다.", "source": "전자신문", "date": "2026-09-04 14:56", "url": "https://www.etnews.com/20260904000277", "category": "contract", "importance": 3, "wl": true, "topic": "kt 모두의ai"}, {"title": "Telekom's Boardroom Clock Is Ticking on a $300bn Question - ad-hoc-news.de", "summary": "도이치텔레콤 이사회 앞에 3,000억 달러 규모의 거대 전략적 질문과 결단이 놓여 있다는 분석이 제기됐다. 향후 글로벌 포트폴리오와 투자 방향을 결정해야 하는 기로에 서 있다.", "source": "ad-hoc-news.de", "date": "2026-09-04 14:41", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/telekom-s-boardroom-clock-is-ticking-on-a-300bn-question/70052749", "category": "strategy", "importance": 3, "wl": false, "topic": "도이치텔레콤 전략"}, {"title": "KDDI to Launch \"au Hikari Plus\" Home Service Combining Fiber and 5G on the 17th - finance.", "summary": "", "source": "finance.biggo.com", "date": "2026-09-04 14:35", "url": "https://finance.biggo.com/news/8f5ed967-77dc-4882-9358-eaabe101e258", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "5G SAと光回線が合体した「auひかりプラス」登場、回線障害時に自動切り替えなど『途切れない通信』実現へ - buzzap.jp", "summary": "5G SA와 유선 초고속인터넷이 결합된 'au 히카리 플러스'가 등장하여 회선 장애 시 5G로 자동 전환되는 '끊김 없는 통신'을 실현한다. 유무선 네트워크의 결합을 통해 네트워크 안정성과 가입자 체감 품질을 극대화하는 혁신적인 서비스이다. 통신사의 서비스 차별화 전략을 잘 보여준다. 향후 안정적인 홈 브로드밴드 시장에서 강력한 무기가 될 전망이다.", "source": "buzzap.jp", "date": "2026-09-04 13:40", "url": "https://buzzap.jp/news/20260904-au-hikari-plus-5g-sa-ftth/", "category": "contract", "importance": 3, "wl": false, "topic": "kddi auひかりプラス"}, {"title": "T-Mobile's Gopalan bets on AI, home internet to revive subscriber growth - business-standa", "summary": "티모바일의 최고경영자(CEO)인 시반 고팔란(Srinivasan Gopalan)이 AI 기술 도입과 홈 인터넷 사업 확장을 통해 가입자 성장 모멘텀을 되살리겠다는 전략을 밝혔다. 무선 통신을 넘어 가정용 초고속인터넷 시장으로 영역을 확장하여 신규 수익원을 창출하겠다는 복안이다. AI 기반의 망 운영 효율화와 고객 서비스 혁신도 함께 추진된다. 경쟁 심화 환경 속에서 새로운 성장 돌파구를 마련할지 주목된다.", "source": "business-standard.com", "date": "2026-09-04 12:48", "url": "https://www.business-standard.com/amp/companies/news/t-mobile-s-gopalan-bets-on-ai-home-internet-to-revive-subscriber-growth-126090400143_1.html", "category": "contract", "importance": 3, "wl": false, "topic": "티모바일 전략"}, {"title": "NTT Docomo to Invest in Mitsui Fudosan Telecom Equipment Unit, Build High-Speed Networks a", "summary": "NTT 도코모가 미쓰이 부동산의 통신 장비 자회사에 출자하여 고속 네트워크 구축을 공동으로 추진한다. 부동산 개발 프로젝트와 연계하여 최첨단 통신 인프라를 선제적으로 도입하려는 전략이다. 도시 인프라와 통신 기술의 융합을 통해 안정적인 기업 수익원을 확보하고자 한다. 양사의 협력은 향후 스마트 인프라 시장의 표준을 제시할 가능성이 높다.", "source": "finance.biggo.com", "date": "2026-09-04 09:06", "url": "https://finance.biggo.com/news/4fe5cb07-5939-4f7f-8954-7c686bca82ca", "category": "contract", "importance": 3, "wl": false, "topic": "ntt 도코모 투자"}, {"title": "【悲報】楽天モバイルのKDDIローミングが2026年9月末完全終了で都市部で圏外連発！？予想される危機と今すぐやるべき対策を徹底解説！【10月大移動】 Ignacio Buse (", "summary": "2026년 9월 말로 예정된 라쿠텐 모바일에 대한 KDDI의 로밍 서비스 완전 종료로 인해 도시 지역에서 발생할 수 있는 신호 공백과 이용자들의 우려를 분석했다. 자체 망 구축을 완료한 라쿠텐의 로밍 축소에 따라 일부 가입자들이 겪을 수 있는 연결성 문제를 지적했다. 통신사 간의 로밍 계약 종료가 시장 경쟁 구도와 가입자 이탈에 미치는 영향을 다루고 있다. 향후 라쿠텐의 망 품질 유지 능력이 시험대에 올랐다.", "source": "Mshale", "date": "2026-09-04 09:03", "url": "https://mshale.com/51e38eef/a21a47a8GAceDCRcawIOA1U", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐 모바일 終了"}, {"title": "[애널픽] 무선통신장비주 주목...\"피지컬AI 통신망 투자 본격화\" - 뷰어스", "summary": "피지컬 AI 시대가 도래함에 따라 무선통신장비주에 대한 주목도가 높아지고 있으며 통신망 투자가 본격화될 것이라는 분석이다. 통신사의 인프라 투자 확대 기조를 다루었다.", "source": "뷰어스", "date": "2026-09-04 08:49", "url": "https://theviewers.co.kr/View.aspx?No=4212481", "category": "tech", "importance": 3, "wl": false, "topic": "무선통신장비주 통신망 투자"}, {"title": "울산 시내버스 762대 '와이파이7' 달린다…10월부터 서비스", "summary": "시는 이번 사업을 통해 기존 장비 를 모두 철거하고 5G 백홀(Backhaul) 기반의 와이파이7로 통합해 통신 품질을 높이는 동시에 실시간 장애 대응과 유지관리 효율도 개선할 계획이다. 백홀은 통신사 기지국의 네트워크와...", "source": "enewstoday.co.kr", "date": "2026-09-04 08:45", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2466682", "category": "outage", "importance": 3, "wl": false, "topic": ""}, {"title": "Physical AI時代の通信キャリア戦略 「通信インフラ」から現実世界の「神経網」へ - ビジネスネットワーク", "summary": "피지컬 AI(Physical AI) 시대에 발맞추어 통신 캐리어의 전략이 단순한 '통신 인프라' 제공을 넘어 현실 세계를 연결하는 '신경망' 구축으로 진화해야 한다는 분석이 제기됐다. AI와 5G·6G 네트워크가 결합하여 물리적 공간의 모든 요소를 실시간으로 제어하는 인프라로 탈바꿈하고 있다. 통신사들의 비즈니스 모델 전환과 미래 투자 방향성을 제시하는 내용이다. 향후 네트워크 장비 벤더들의 기술 개발 방향에도 큰 시사를 준다.", "source": "ビジネスネットワーク", "date": "2026-09-04 07:12", "url": "https://businessnetwork.jp/article/35578/", "category": "contract", "importance": 3, "wl": false, "topic": "디지털 신경망 전략"}, {"title": "T-Mobile taps former Shell CFO Jessica Uhl to help steer next phase of AI and enterprise g", "summary": "티모바일 US(T-Mobile US)가 전 셸(Shell) 최고재무책임자(CFO)인 제시카 울(Jessica Uhl)을 신임 CFO로 영입했다. 이번 인사는 AI 도입과 기업용(B2B) 시장 성장을 가속화하기 위한 전략적 조치이다. 재무 전문성을 바탕으로 회사의 차세대 성장 동력 발굴을 재정비할 계획이다. 향후 티모바일의 기업 전략 추진에 중요한 역할을 할 것으로 기대된다.", "source": "Fierce Network", "date": "2026-09-04 07:07", "url": "https://www.fierce-network.com/wireless/t-mobile-names-jessica-uhl-next-cfo", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 인사"}, {"title": "VodafoneThree revs 5G SA engine with SuperMobile pitched as competitive edge - telcotitans", "summary": "보다폰쓰리가 5G SA(단독모드) 엔진을 본격 가동하며 '슈퍼모바일'을 경쟁 우위 요소로 내세웠다. 향상된 네트워크 성능을 바탕으로 가입자 유치전에 총력을 기울이고 있다. 독립형 5G 기반의 부가가치 서비스 제공이 가속화되고 있다.", "source": "telcotitans.com", "date": "2026-09-04 00:51", "url": "https://www.telcotitans.com/vodafonewatch/vodafonethree-revs-5g-sa-engine-with-supermobile-pitched-as-competitive-edge/10838.article", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰쓰리 5g"}, {"title": "VodafoneThree intros tiered 5G SA slicing portfolio for consumers, enterprises, critical s", "summary": "보다폰 쓰리가 영국 시장에서 소비자 및 기업을 위한 계층형 5G SA 슬라이싱 서비스 포트폴리오를 출시했다. 인터넷 TV 서비스와 결합하여 패스트트랙 연결성을 제공한다. 5G 독립모드 기반의 차별화된 수익 모델 창출을 시도하고 있다. 통신사의 서비스 고도화와 가입자 타겟팅 전략을 보여준다.", "source": "RCR Wireless", "date": "2026-09-04 00:21", "url": "https://rcrwireless.com/20260903/5g/vodafonethree-tiered-5g-sa-slicing-enterprises-critical-services", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰 5g"}, {"title": "VodafoneThree joins the slicing set with SuperMobile launch - telecomtv.com", "summary": "보다폰쓰리가 '슈퍼모바일(SuperMobile)' 출시와 함께 네트워크 슬라이싱 서비스 시장에 진입했다. 차별화된 속도와 품질을 내세운 기업 및 개인용 5G 요금제를 선보였다. 합병 이후 시장 지배력을 확대하기 위한 핵심 서비스 상품이다.", "source": "telecomtv.com", "date": "2026-09-03 23:51", "url": "https://www.telecomtv.com/content/5g/vodafonethree-joins-the-slicing-set-with-supermobile-launch-56169/amp/", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰쓰리 서비스"}, {"title": "AT&T tops Ethernet Leaderboard amid ranking shakeup – Vertical Systems", "summary": "버티컬 시스템즈의 조사 결과 AT&T가 미국 캐리어 이더넷 리더보드에서 선두 자리를 유지했다. 다른 통신사들의 순위 변동 속에서도 경쟁력을 입증했다. 기업용 네트워크 및 이더넷 서비스 시장에서의 입지를 보여준다. 주요 통신사의 B2B 연결성 서비스 역량을 평가하는 지표다.", "source": "Light Reading", "date": "2026-09-03 23:44", "url": "https://www.lightreading.com/broadband/at-t-tops-ethernet-leaderboard-amid-ranking-shakeup-vertical-systems", "category": "contract", "importance": 3, "wl": true, "topic": "at&t 이더넷"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - ad-hoc-news.de", "summary": "버라이즌이 프론티어(Frontier) 인수 건과 최고경영진(CEO) 교체 소식을 발표하며 주가가 상승세를 기록했다. 이번 M&A는 유무선 통합 가속화와 광대역 네트워크 커버리지 확대를 위한 전략적 결정이다. 경영진 변화와 대형 거래 추진이 동시에 이루어지면서 사업 구조 재편에 대한 기대감이 커지고 있다. 향후 인수 후 통합(PMI) 과정과 시너지 창출 여부가 핵심 과제로 꼽힌다.", "source": "ad-hoc-news.de", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "exec", "importance": 3, "wl": false, "topic": "버라이즌 m&a"}, {"title": "Deutsche Telekom stock rises on Elliott stake news - TradingView", "summary": "엘리엇의 지분 인수 소식이 전해진 직후 도이치텔레콤 주가가 상승세를 탔다. 기업 가치 상승에 대한 기대감이 주식 시장에 즉각 반영된 결과다.", "source": "TradingView", "date": "2026-09-03 22:43", "url": "https://www.tradingview.com/news/gurufocus:4988ef115094b:0-deutsche-telekom-stock-rises-on-elliott-stake-news/", "category": "earnings", "importance": 3, "wl": false, "topic": "도이치텔레콤 주가"}, {"title": "Airtel ARPU Could Hit Rs 325 by FY29 - TelecomTalk", "summary": "바티에어텔의 평균가입자당매출(ARPU)이 프리미엄화와 요금 인상을 바탕으로 2029 회계연도까지 325루피에 이를 것이라는 전망이 나왔다. 이러한 ARPU 상승은 통신사의 수익성 개선과 밀접한 연관이 있다. 인도의 통신 시장 경쟁 구도 속에서 프리미엄 서비스 전략이 주목받고 있다. 향후 지속적인 가입자 가치 제고가 재무 건전성에 긍정적 영향을 미칠 것으로 기대된다.", "source": "TelecomTalk", "date": "2026-09-03 19:55", "url": "https://telecomtalk.info/airtel-arpu-could-hit-rs-325-by-fy29/1011523/", "category": "earnings", "importance": 3, "wl": false, "topic": "바티에어텔 실적"}, {"title": "Chunghwa Telecom, Askey Launch 5G Platform for Construction Robots - Telecom Review Asia", "summary": "중화텔레콤이 에스키와 함께 건설 로봇을 위한 5G 플랫폼을 출시했다. 초고속 통신망을 활용해 현장 로봇을 원격 제어하고 모니터링하는 산업용 5G 서비스 상용화 사례다.", "source": "Telecom Review Asia", "date": "2026-09-03 19:44", "url": "https://www.telecomreviewasia.com/news/technology-news/30170-chunghwa-telecom-askey-launch-5g-platform-for-construction-robots/", "category": "tech", "importance": 3, "wl": false, "topic": "중화텔레콤 5g 로봇"}, {"title": "Orange plans new subsea cable linking La Reunion to South Africa - Developing Telecoms", "summary": "프랑스 통신사 오렌지(Orange)가 레위니옹 섬과 남아프리카공화국을 연결하는 신규 해저케이블 구축 계획을 발표했다. 대서양 및 아프리카 지역의 국제 트래픽 수용 능력을 확충하기 위한 인프라 투자다. 글로벌 네트워크 연결성 강화에 기여할 전망이다.", "source": "Developing Telecoms", "date": "2026-09-03 18:52", "url": "https://developingtelecoms.com/telecom-business/operator-news/20774-orange-plans-new-subsea-cable-linking-la-reunion-to-south-africa.html", "category": "contract", "importance": 3, "wl": false, "topic": "오렌지 해저케이블"}, {"title": "울산 시내버스 762대 차세대 와이파이로 전면 교체", "summary": "울산시는 구축 시기에 따라 서로 다른 장비 로 운영돼 온 시내버스 762대의 노후 와이파이 장비 를 철거하고, 5세대 이동통신( 5G ) 백홀 기반의 와이파이 7 장비 를 설치한다. 백홀은 통신사 기지국의 백본망과 버스 내부...", "source": "iusm.co.kr", "date": "2026-09-03 18:20", "url": "https://www.iusm.co.kr/news/articleView.html?idxno=1067423", "category": "exec", "importance": 3, "wl": false, "topic": ""}, {"title": "Deutsche Telekom competitors slow fibre investments in 2025 as costs rise - Telecompaper", "summary": "비용 상승 압박으로 인해 도이치텔레콤의 경쟁사들이 2025년 광섬유(Fibre) 인프라 투자를 늦추고 있는 것으로 나타났다. 반면 도이치텔레콤은 인프라 고도화를 지속하며 시장 우위를 점하려 하고 있다. 유럽 유선 통신 시장의 투자 위축 국면에서 사업자 간 희비가 엇갈리고 있다.", "source": "Telecompaper", "date": "2026-09-03 17:28", "url": "https://www.telecompaper.com/news/deutsche-telekom-competitors-slow-fibre-investments-in-2025-as-costs-rise--1581594", "category": "strategy", "importance": 3, "wl": false, "topic": "도이치텔레콤 투자"}, {"title": "楽天モバイル、ローミング縮小後もシェア拡大。ほか3社は減少：アンケート調査 - 携帯総合研究所", "summary": "라쿠텐 모바일이 로밍 서비스 축소 이후에도 가입자 점유율을 지속적으로 확대하고 있는 반면 타사들은 감소세를 보였다는 조사 결과가 나왔다. 자체 망 안정화와 공격적인 마케팅이 주효하여 가입자 유치 경쟁에서 우위를 점하고 있음을 보여준다. 일본 통신 시장의 구조적 변화를 시사하는 중요한 지표이다.", "source": "携帯総合研究所", "date": "2026-09-03 16:49", "url": "https://mobilelaby.com/blog-entry-mno-share-survey-rakuten-mobile-grows-au-declines.html", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐 모바일 가입자"}, {"title": "[NNA] NTT도코모, 필리핀에서 위성 직접 통신 로밍 개시 - 네이트", "summary": "일본 NTT도코모가 필리핀에서 위성 직접 통신 로밍 서비스를 개시했다. 이동통신사와 위성통신 사업자 간 협력을 통한 글로벌 통신 커버리지 확대 사례다.", "source": "네이트", "date": "2026-09-03 15:43", "url": "https://news.nate.com/view/20260903n26737", "category": "contract", "importance": 3, "wl": false, "topic": "ntt도코모 위성 로밍"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 AWS의 잔 호프메이어를 차기 CTO로 영입했다. 클라우드와 통신 인프라의 융합을 가속화하기 위한 전략적 인사로 평가된다. 주요 통신사의 기술 수장 교체를 통해 디지털 전환 역량을 강화하려 한다. 네트워크 가상화 및 클라우드 네이티브 전환에 미칠 영향이 주목된다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 경영진"}, {"title": "AWSが日米つなぐ新海底ケーブル「Sta’O’Nuk」発表、2029年に稼働へ - ビジネスネットワーク", "summary": "아마존 웹 서비스(AWS)가 미국과 일본을 직접 연결하는 새로운 해저 케이블 'Sta’O’Nuk' 프로젝트를 발표하고 2029년 가동을 목표로 추진한다. 태평양 횡단 데이터 트래픽의 급증에 대응하여 안정적이고 대용량의 클라우드 인프라 전송 경로를 확보하려는 목적이다. 글로벌 빅테크 기업들의 해저 케이블 투자가 가속화되고 있음을 보여준다. 향후 국제 네트워크 대역폭 공급과 글로벌 데이터 전송 환경에 큰 영향을 미칠 전망이다.", "source": "ビジネスネットワーク", "date": "2026-09-03 14:55", "url": "https://businessnetwork.jp/article/36951/", "category": "contract", "importance": 3, "wl": false, "topic": "aws 해저케이블"}, {"title": "VodafoneThree to launch debut TV service in challenge to UK rivals", "summary": "영국 통신사 보다폰 쓰리가 TV 플랫폼 서비스를 새롭게 출시하며 광대역 사업 규모를 두 배로 확대하려는 전략을 추진한다. 홈 엔터테인먼트와 유선 인터넷을 결합하여 가입자를 유치하려는 목적이다. 통신사의 번들링 상품 강화 및 가입자 기반 확장 전략을 보여준다.", "source": "Financial Times Tech", "date": "2026-09-03 13:00", "url": "https://www.ft.com/content/b44fcdbd-4c0e-4032-b81a-98e309991388?syn-25a6b1a6=1", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰 쓰리 tv"}, {"title": "AT&T (T) Q2 2026 Earnings Call Transcript - Fortune", "summary": "AT&T가 2026년 2분기 실적 발표 컨퍼런스 콜을 개최하고 주요 재무 지표와 사업 성과를 공유했다. 매출과 가입자 증가 추세, 그리고 향후 가이던스가 시장의 관심을 모았다. 통신 인프라 투자 규모와 수익성 개선 전략이 주요 화두로 다뤄졌다. 회사의 경영 건전성과 향후 투자 방향을 가늠할 수 있는 중요한 지표를 제공했다.", "source": "Fortune", "date": "2026-09-03 12:48", "url": "https://fortune.com/company/att/earnings/q2-2026/", "category": "earnings", "importance": 3, "wl": false, "topic": "at&t 실적"}, {"title": "Elliott builds stake in Deutsche Telekom - Bilyonaryo Business", "summary": "엘리엇 매니지먼트의 도이치텔레콤 지분 인수 뉴스가 글로벌 비즈니스 매체들을 통해 비중 있게 다뤄졌다.", "source": "Bilyonaryo Business", "date": "2026-09-03 12:38", "url": "https://bilyonaryo.com/elliott-builds-stake-in-deutsche-telekom/", "category": "earnings", "importance": 3, "wl": false, "topic": "도이치텔레콤 지분"}]};

  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성·6G",    secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
