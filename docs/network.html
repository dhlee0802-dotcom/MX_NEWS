<style>

  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}

</style>
</head>

rone-tracking-network-tech-in-korea", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 한국 드론 추적 네트워크 기술 공개"}, {"title": "에이스테크놀로지, 항우연 저궤도 위성통신 핵심 안테나 개발 수주 - 메트로신문", "summary": "에이스테크놀로지가 항우연 주관 저궤도 위성통신 핵심 안테나 개발 과제를 수주했습니다. 위성통신 지상국 핵심 장비 국산화 및 기술력 확보에 기여합니다. 관련 사업 포트폴리오 다각화 수주입니다.", "source": "메트로신문", "date": "2026-09-02 16:06", "url": "https://www.metroseoul.co.kr/article/20260902500539", "category": "contract", "importance": 4, "wl": false, "topic": "에이스테크 위성 안테나"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디아라비아 통신사 stc와 다년간의 5G 네트워크 확장 계약을 체결했다. 사우디 전역의 5G 커버리지와 데이터 처리 성능을 대폭 강화하는 대형 인프라 프로젝트다. 양사의 파트너십을 통해 중동 지역 통신 고도화가 가속화될 전망이다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 stc 5g 네트워크 확장 계약"}, {"title": "[애널픽] 무선통신장비주 주목...\"피지컬AI 통신망 투자 본격화\" - 뷰어스", "summary": "증권가에서 피지컬 AI 구현을 위한 무선통신장비주들의 본격적인 인프라 투자 수혜를 주목해야 한다는 분석이 나왔다. AI 시대를 맞아 통신 장비 수요가 회복될 것이라는 전망을 담고 있다.", "source": "뷰어스", "date": "2026-09-04 08:49", "url": "https://theviewers.co.kr/View.aspx?No=4212481", "category": "other", "importance": 3, "wl": false, "topic": "무선통신장비주 피지컬ai 통신망 투자 주목"}, {"title": "Nokia (HLSE:NOKIA) Targets Digital Healthcare With Network As Code - Yahoo Finance", "summary": "노키아가 'Network as Code' 플랫폼을 통해 디지털 헬스케어 분야로 영역을 확대하고 있다. 네트워크 API를 활용해 의료 앱의 보안과 본인 인증 절차를 간소화하는 전략을 추진한다. 이를 통해 통신 장비 외에 새로운 소프트웨어 수익 모델을 모색하고 있다.", "source": "Yahoo Finance", "date": "2026-09-04 03:16", "url": "https://finance.yahoo.com/technology/ai/articles/nokia-hlse-nokia-targets-digital-181601230.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 디지털 헬스케어 네트워크 api"}, {"title": "Ciena sees AI driving multi-year optical infrastructure investment cycle", "summary": "시에나는 AI가 네트워크 인프라의 다년간에 걸친 재구축을 주도하고 있으며, 장거리 네트워크부터 데이터센터 패브릭에 이르기까지 광 네트워크 연결의 중요성을 높이고 대역폭 수요를 급증시키고 있다고 진단했다. AI 인프라 확충에 따른 광통신 장비 및 전송망 투자의 확대 추세를 반영한다. 글로벌 네트워크 장비 시장의 수요 변화를 분석하는 데 중요한 기초 자료다.", "source": "RCR Wireless", "date": "2026-09-04 00:25", "url": "https://rcrwireless.com/20260903/connectivity/ciena-ai-optical", "category": "tech", "importance": 3, "wl": true, "topic": "시에나 광네트워크"}, {"title": "Ericsson Japan begins AI network research with Tokyo partners - Telecoms Tech News", "summary": "에릭슨 재팬이 도쿄 파트너들과 함께 AI 기반 네트워크 연구를 시작한다. 차세대 이동통신 환경에서 인공지능을 활용한 무선망 최적화 및 자율주행 네트워크 기술을 공동 개발할 계획이다. 도쿄 지역 파트너들과의 협력을 통해 일본 시장 내 기술 리더십을 강화한다.", "source": "Telecoms Tech News", "date": "2026-09-04 00:16", "url": "https://www.telecomstechnews.com/news/ericsson-japan-begins-ai-network-research-with-tokyo-partners/", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 일본 ai 네트워크 연구"}, {"title": "Nokia and BeeHealthy Bring Network-based Verification to Digital Healthcare - NewswireToda", "summary": "노키아와 비헬시가 디지털 헬스케어 분야의 보안과 편의성을 높이기 위해 네트워크 기반 인증 솔루션을 도입한다. 의료 서비스 이용자의 신원 확인 프로세스를 혁신하는 협력이다.", "source": "NewswireToday", "date": "2026-09-04 00:01", "url": "https://www.newswiretoday.com/news/186783/Nokia-and-BeeHealthy-Bring-Network-based-Verification-to-Digital-Healthcare/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 비헬시 네트워크 인증 도입"}, {"title": "Minnesota operator taps MoCA Access tech to connect MDUs", "summary": "미국 미네소타주의 통신 사업자인 쇼베르 Inc.는 인코액스와 노키아와의 파트너십을 통해 다가구 주택(MDU) 환경에서 기가바이트 속도의 MoCA Access 기술을 상용화했다고 발표했다. 노키아는 이번 협력을 통해 초고속 유선 액세스 네트워크 장비 공급 역량을 입증했다. 경쟁사인 노키아의 구체적인 장비 공급 및 기술 적용 사례다. 국내외 통신 장비 시장의 기술 도입 추이를 보여준다.", "source": "Light Reading", "date": "2026-09-03 23:13", "url": "https://www.lightreading.com/broadband/minnesota-operator-taps-moca-access-tech-to-connect-mdus", "category": "contract", "importance": 3, "wl": true, "topic": "노키아 수주"}, {"title": "Chinese businesses of all stripes are turning to Huawei - The Economist", "summary": "중국 내 다양한 산업 분야의 기업들이 서구권의 제재 속에서도 자국산 기술 자립을 위해 화웨이 제품과 솔루션 도입을 늘리고 있다. 내수 시장을 중심으로 한 화웨이의 입지 강화 현상을 조명한다.", "source": "The Economist", "date": "2026-09-03 22:08", "url": "https://www.economist.com/business/2026/09/03/chinese-businesses-of-all-stripes-are-turning-to-huawei", "category": "other", "importance": 3, "wl": false, "topic": "중국 기업 화웨이 장비 도입 확산"}, {"title": "The era of AI-native RAN starts now - Nokia", "summary": "노키아가 AI 네이티브 무선 접속망(RAN) 시대의 본격적인 개막을 선언했다. 기지국과 코어망 전반에 인공지능을 내재화하여 네트워크 자율 운영과 성능 극대화를 도모하는 기술 전략을 공개했다.", "source": "Nokia", "date": "2026-09-03 21:05", "url": "https://www.nokia.com/blog/the-era-of-ai-native-ran-starts-now/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai 네이티브 ran 비전"}, {"title": "Sceye, SoftBank demo high-altitude platform systems connectivity - Computer Weekly", "summary": "소프트뱅크와 Sceye가 고고도 플랫폼 시스템(HAPS) 연동 시연을 진행했다. 차세대 공중 통신 인프라 확보를 위한 기술 개발 협력이다.", "source": "Computer Weekly", "date": "2026-09-03 20:18", "url": "https://www.computerweekly.com/news/366649923/Sceye-SoftBank-demo-high-altitude-platform-systems-connectivity", "category": "tech", "importance": 3, "wl": false, "topic": "소프트뱅크 기술"}, {"title": "Nokia deploys Gibabit Connect with InCoax MoCA Access for apartments on Sjoberg's network ", "summary": "노키아가 스웨덴 Sjöberg 네트워크의 아파트 단지를 대상으로 InCoax MoCA Access 기술을 활용한 기가비트 커넥트 솔루션을 구축한다. 기존 구내 가입자망 인프라를 활용해 고속 초고속 인터넷 서비스를 제공하는 프로젝트다. 주거 밀집 지역의 통신 환경 개선을 지원한다.", "source": "telecompaper.com", "date": "2026-09-03 19:46", "url": "https://www.telecompaper.com/news/nokia-deploys-gibabit-connect-with-incoax-moca-access-for-apartments-on-sjobergs-network-in-minnesota--1581634", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 스웨덴 아파트망 기가비트 공급"}, {"title": "Nokia and BeeHealthy target healthcare with network verification - Telecoms", "summary": "노키아와 비헬시가 네트워크 기반 번호 인증 기술을 활용해 디지털 헬스케어 서비스 접근성을 개선하기 위한 파트너십을 체결했다. 의료 플랫폼 보안 강화에 기여할 것으로 기대된다.", "source": "Telecoms", ompaper.com", "date": "2026-09-02 17:18", "url": "https://www.telecompaper.com/news/swiss-telecoms-regulator-announces-mobile-spectrum-auction-for-q2-2027--1581438", "category": "policy", "importance": 4, "wl": false, "topic": "스위스 주파수 경매"}, {"title": "'모두의 AI' 연내 서비스 목표…SKT·카카오·KT 청사진 제시 - 네이트", "summary": "SKT와 카카오, KT가 '모두의 AI' 연내 서비스를 위한 청사진을 제시했습니다. 통신사와 플랫폼 기업 간의 AI 분야 협업 로드맵입니다. AI 생태계 확장을 위한 통신사들의 전략을 담고 있습니다.", "source": "네이트", "date": "2026-09-04 11:04", "url": "https://m.news.nate.com/view/20260904n11609?mid=m02&list=recent&cpcd=", "category": "tech", "importance": 3, "wl": false, "topic": "skt ai 서비스"}, {"title": "\"AI앱 1900개가 회사 업무\"…SKB, 상품부터 조직까지 AI로 재설계", "summary": "SK브로드밴드는 상품 서비스, 네트워크 및 IPTV 운영, 사내 업무 방식까지 회사 전반을 AI 중심으로 재설계하여 'AI 네이티브 서비스 컴퍼니'로 전환하겠다고 발표했다. 통신과 미디어 영역을 넘어 전사적 업무와 네트워크 운영에 인공지능을 내재화하겠다는 구상이다. 통신사의 인프라 및 서비스 고도화 전략을 보여준다.", "source": "ZDNet Korea", "date": "2026-09-04 10:54", "url": "https://zdnet.co.kr/view/?no=20260904105439", "category": "tech", "importance": 3, "wl": true, "topic": "sk브로드밴드 ai"}, {"title": "\"업무 맥락까지 파악하는 AI 동료\"…KT 에이전틱 데이터 플로우 구축 - 네이트", "summary": "KT가 업무 맥락을 파악하는 AI 동료를 위한 에이전틱 데이터 플로우를 구축합니다. 기업 내부 업무 효율화를 위한 통신사의 AI 솔루션 도입 사례입니다.", "source": "네이트", "date": "2026-09-04 10:16", "url": "https://news.nate.com/view/20260904n09116", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai 동료"}, {"title": "\"라쿠텐 쇼핑·금융 계정 없으면 휴대폰도 쓰지마\"", "summary": "일본 제4이통사인 라쿠텐모바일은 온라인 쇼핑과 금융 등 그룹 서비스의 공통 계정인 '라쿠텐ID'와 휴대전화 회선 연동을 의무화하며, 이에 따르지 않을 경우 계약 자동 종료와 번호 소멸 조치를 취하기로 했다. 소비자를 그룹 생태계에 완전히 편입시키기 위한 초강수 전략이다. 통신 서비스 가입 정책의 큰 변화를 보여준다.", "source": "ZDNet Korea", "date": "2026-09-04 10:04", "url": "https://zdnet.co.kr/view/?no=20260904100417", "category": "contract", "importance": 3, "wl": true, "topic": "라쿠텐모바일 계정연동"}, {"title": "삼성전자·SKT, IFA 2026서 ‘삼성 크리에이터 허브’ 운영·자원순환 캠페인 시행 - 여성소비자신문", "summary": "삼성전자와 SKT가 IFA 2026에서 크리에이터 허브 운영 및 자원순환 캠페인을 시행합니다. 글로벌 전시회에서의 양사 협력 및 ESG 활동입니다.", "source": "여성소비자신문", "date": 86990", "category": "contract", "importance": 3, "wl": false, "topic": "kt클라우드 데이터센터"}, {"title": "Verizon advances its Carrier Ethernet standing amidst M&A market shuffle - Lightwave Onlin", "summary": "통신 M&A 시장의 재편 속에서 버라이즌이 기업용 캐리어 이더넷(Carrier Ethernet) 시장에서의 입지와 경쟁력을 강화하고 있다. B2B 네트워크 서비스 확대를 위한 전략적 행보다.", "source": "Lightwave Online", "date": "2026-09-04 05:53", "url": "https://www.lightwaveonline.com/home/article/55403011/verizon-advances-its-carrier-ethernet-standing-amidst-ma-market-shuffle", "category": "other", "importance": 3, "wl": false, "topic": "버라이즌 m&a 속 캐리어 이더넷 강화"}, {"title": "T-Mobile sets CFO transition", "summary": "미국의 주요 통신사 티모바일은 셸의 전 최고재무책임자(CFO)인 제시카 울을 2027년 2월 새로운 CFO로 임명할 계획이라고 밝혔다. 기존 CFO인 피터 오스발딕은 2027년 7월 1일 공식 퇴임 전까지 전략적 자문 역할을 맡게 된다. 이번 경영진 교체는 통신사의 재무 전략 및 장기 운영 계획에 변화를 줄 수 있는 주요 인사 이동이다. 통신 산업 전반의 리더십 변화 동향을 파악하는 데 참고가 된다.", "source": "Light Reading", "date": "2026-09-04 05:49", "url": "https://www.lightreading.com/finance/t-mobile-sets-cfo-transition", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원"}, {"title": "[통신3사 AI 경량화] KT, 기업용 AI 크기 세분화…‘B2B’ 전략 : 네이버 블로그 - Naver Blog", "summary": "KT가 기업용 AI 크기를 세분화하는 B2B 전략을 추진합니다. 통신사의 기업 고객 대상 AI 솔루션 다변화 동향입니다. 네트워크 인프라와는 간접적으로 연관된 AI 소프트웨어 전략입니다.", "source": "Naver Blog", "date": "2026-09-04 05:40", "url": "https://blog.naver.com/PostView.naver?blogId=dealsite&logNo=224399940686&redirect=Dlog", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai 서비스"}, {"title": "T-Mobile US (TMUS) lines up new CFO with big bonus and stock grants - stocktitan.net", "summary": "T모바일 US가 새로 영입한 최고재무책임자(CFO)에게 거액의 보너스와 주식 보상을 지급하기로 계약했다. 주요 통신사의 임원 영입 조건에 관한 소식이다.", "source": "stocktitan.net", "date": "2026-09-04 05:20", "url": "https://www.stocktitan.net/sec-filings/TMUS/8-k-t-mobile-us-inc-reports-material-event-04dad4773908.html", "category": "exec", "importance": 3, "wl": false, "topic": "t모바일 us 신임 cfo 대규모 보상 계약"}, {"title": "Shell’s former finance chief is set to   ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
