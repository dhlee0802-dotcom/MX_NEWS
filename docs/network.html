<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}

  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .imp.i4{background:var(--crit-bg);color:var(--crit)}

  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}

  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}

</style>
</head>

": "MiGFlug", "date": "2026-09-03 02:07", "url": "https://migflug.com/afterburner/es/delta-picks-amazon-over-starlink-for-in-flight-wi-fi/", "category": "contract", "importance": 4, "wl": false, "topic": "아마존 스타링크 기내 와이파이"}, {"title": "OHB lands €1bn SES contract as Europe’s IRIS² advances - telcotitans.com", "summary": "OHB가 유럽의 차세대 위성통신 사업인 IRIS² 프로젝트와 관련해 1유로억 규모의 SES 계약을 체결했습니다. 유럽 연합의 독자적인 보안 통신망 구축을 위한 핵심 위성 제작 사업이 본격화되고 있습니다. 우주 안보와 통신 주권 강화를 위한 중요한 전환점이 될 것입니다.", "source": "telcotitans.com", "date": "2026-09-03 01:06", "url": "https://www.telcotitans.com/infrawatch/ohb-lands-1bn-ses-contract-as-europes-iris-advances/10833.article", "category": "contract", "importance": 4, "wl": false, "topic": "유럽 위성통신 수주"}, {"title": "Hungary's 4iG Group and SpaceX sign Europe's first Starlink - mediasat.info", "summary": "헝가리 4iG 그룹과 스페이스X가 손잡고 유럽 최초로 스타링크 서비스 도입 계약을 체결했습니다. 동유럽 지역의 위성통신 서비스 확대와 가입자 확보가 본격화될 것으로 보입니다. 저궤도 위성 기반의 통신 서비스가 유럽 시장에서 영향력을 넓히는 계기가 마련되었습니다.", "source": "mediasat.info", "date": "2026-09-02 17:14", "url": "https://mediasat.info/en/2026/09/02/starlink-mobile-is-coming-to-hungary-and-the-balkans/", "category": "contract", "importance": 4, "wl": false, "topic": "스타링크 계약"}, {"title": "대한항공 기내서 ‘공짜 와이파이’...9월 스타링크 도입 - 매일경제", "summary": "대한항공이 기내에서 무료로 이용할 수 있는 고속 와이파이 서비스를 위해 9월부터 스타링크를 도입합니다. 국내 대형 항공사의 저궤도 위성통신 채택으로 기내 통신 품질이 대폭 향상될 예정입니다.", "source": "매일경제", "date": "2026-09-02 14:32", "url": "https://www.mk.co.kr/news/business/12142298", "category": "contract", "importance": 4, "wl": false, "topic": "대한항공 스타링크 도입"}, {"title": "에이스테크, 항우연 저궤도 위성통신 안테나 개발 수주…위성·방산 통신 확대 - 네이트", "summary": "에이스테크가 항우연과의 계약을 통해 저궤도 위성통신 안테나 개발에 착수합니다. 위성 및 방산 통신 사업 확장을 위한 중요한 발판을 마련했습니다.", "source": "네이트", "date": "2026-09-02 14:28", "url": "https://news.nate.com/view/20260902n21710", "category": "contract", "importance": 4, "wl": false, "topic": "에이스테크 위성통신 수주"}, {"title": "ASTS Stock Hits One-Month Low: Insider Buys The Dip After BlueBird Deployments, Japan Win ", "su =82116", "category": "tech", "importance": 4, "wl": false, "topic": "skt lgu+ ai-ran 검증 및 장비사 협력"}, {"title": "DX 적자 속… 삼성전자 동행, 서초 이어 16~30일 이재용 자택 앞 집회", "summary": "삼성전자 DX부문이 올해 2분기 사상 첫 분기 적자를 기록한 가운데, 스마트폰을 담당하는 MX 및 네트워크 사업부도 매출 감소와 영업손실을 냈습니다. 네트워크사업을 포함한 실적 부진 상황을 보여줍니다. 사업부 실적 악화에 대한 중요한 경영 정보입니다.", "source": "inews24.com", "date": "2026-09-03 11:26", "url": "http://www.inews24.com/view/2001496", "category": "earnings", "importance": 4, "wl": false, "topic": "삼성전자 dx부문 및 네트워크사업부 실적"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 차세대 6G 기지국을 활용해 공중의 드론을 탐지할 수 있는 신기술을 시연했다. 통신 기지국 인프라가 무선 통신을 넘어 상공 감시 및 보안 기능까지 수행할 수 있음을 입증한 것이다. 에릭슨의 차세대 기술 리더십을 보여주는 중요한 연구 성과다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 기지국 드론 탐지 기술"}, {"title": "[노태문 치킨게임] '점유율 확대' 카드 재탕…박리다매 언제 벗어나나", "summary": "삼성전자 반기보고서에 따르면 스마트폰과 네트워크를 담당하는 MX 사업부 등의 실적이 전년 동기 대비 악화되었습니다. 박리다매 전략과 점유율 확대 경쟁 속에서 사업부의 수익성 저하가 확인되었습니다. 네트워크사업부를 포함한 DX부문의 실적 상황을 보여줍니다.", "source": "news.dealsitetv.com", "date": "2026-09-03 08:02", "url": "https://news.dealsitetv.com/articles/175439", "category": "earnings", "importance": 4, "wl": false, "topic": "삼성전자 mx 및 네트워크사업부 실적 부진"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증 - 조선일보", "summary": "LG유플러스가 연세대와 함께 차세대 통신 기술인 AI-RAN 네트워크 전환 기술 검증에 성공했습니다. 인공지능과 무선 통신망을 결합하여 망 효율성을 극대화하는 미래 기술 확보에 주력하고 있습니다. 6G 시대를 대비한 핵심 네트워크 혁신 기술로 주목받습니다.", "source": "조선일보", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/", "category": "tech", "importance": 4, "wl": false, "topic": "lg유플러스 ai-ran"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 6G와 AI 기능이 결합된 ISAC 기술을 활용한 '드론 실시간 추적' 통신 기술을 공개하고 국내 기업들과 협력을 모색합니다. 글로벌 통신 장비사의 차세대 기술 시연 및 전략 발표입니다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 한국 드론 실시간 추적 기술 공개"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아 대표가 AI 랜, ISAC, 차별화된 커넥티비티와 6G로 이어지는 기술 리더십을 강조하며 AI 시대 네트워크 청사진을 제시했습니다. 글로벌 장비사의 차세대 기술 전략 발표입니다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 ai-ran isac 6g 청사진 제시"}, {"title": "Huawei profits fall in H1 on revenues up 10% - telecompaper.com", "summary": "화웨이의 상반기 매출은 10% 증가했으나 순이익은 감소한 것으로 나타났다. 매출 성장에도 불구하고 비용 압박과 투자 증가가 수익성에 영향을 미쳤다. 글로벌 제재 속 화웨이의 재무 건전성이 주목받고 있다.", "source": "telecompaper.com", "date": "2026-09-02 16:01", "url": "https://www.telecompaper.com/news/huawei-profits-fall-in-h1-on-revenues-up-10--1581432", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 실적 발표"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디아라비아 통신사 STC와 5G 네트워크 확장을 위한 다년 계약을 체결했다. 이번 계약을 통해 에릭슨은 STC의 전국망 인프라 고도화와 차세대 통신 서비스 제공을 지원하게 된다. 중동 거대 통신사와의 대규모 장비 공급 계약 확정 보도다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 stc 5g 확장 계약"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "에릭슨이 전파 송출 한 번으로 고속 데이터 전송과 사물 위치·거리·속도 탐지를 동시에 처리하여 통신용과 레이더용 주파수를 따로 할당할 필요가 없는 6G 신기술을 공개했습니다. 장비사의 차세대 무선 통신 기술 발표입니다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 기지국 드론 탐지 6g 신기술"}, {"title": "Samsung wins ZTE 5G patent case, raising difficult questions for UK courts - IAM Patent", "summary": "삼성전자가 ZTE와의 5G 특허 소송에서 승소하며 영국 법원에 중대한 법적 질문을 제기했다. 글로벌 통신 특허 라이선스 시장에 적지 않은 파장을 일으킬 것으로 보인다. 양사 간 지식재산권 공방이 주목받고 있다.", "source": "IAM Patent", "date": "2026-09-01 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "tech", "importance": 4, "wl": false, "topic": "삼성전자 화웨이 특허 소송"}, {"title": "Qualcomm stakes its claim on an AI-native 6G future - Mobile World Live", "summary": "퀄컴이 AI 네이티브 기반의 차세대 6G 통신 미래를 향한 자사 기술 청사진과 로드맵을 공개했습니다. 인공지능이 내장된 무선 통신 표준 선점을 위한 글로벌 기술 경쟁이 가열되고 있습니다.", "source": "Mobile World Live", "date": "2026-09-01 20:04", "url": "https://www.mobileworldlive.com/qualcomm-stakes-its-claim-on-an-ai-native-6g-future/", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g 비전"}, {"title": "Huawei Profit Plunges 36% As AI, Chip Investment And Rising Costs Squeeze Margins - tekedi", "summary": "인공지능 및 칩 투자 확대와 비용 상승의 여파로 화웨이의 순이익이 36% 급감했다. 매출은 소폭 증가했으나 수익성 지표가 악화되었다. 미중 기술 분쟁 속 막대한 R&D 비용이 부담으로 작용하고 있다.", "source": "tekedia.com", "date": "2026-09-01 19:49", "url": "https://www.tekedia.com/huawei-profit-plunges-36-as-ai-chip-investment-and-rising-costs-squeeze-margins/", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 순이익 급감"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "알에프텍이 5G 통신 장비와 방산 RF 기술 경쟁력 강화를 위해 연구개발 조직을 자회사 'RFTC'로 분리하고 사업을 확대합니다. 5G 통신 장비 부품사의 조직 개편 및 전문화 전략입니다. 협력사의 장비 사업 행보를 보여줍니다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 r&d 자회사 rftc 분리"}, {"title": "알에프텍 “드론 막는 RF기술력 강화”", "summary": "알에프텍이 5G 안테나·필터 기술과 방산 RF 기술의 플랫폼 고도화를 위해 전문 자회사 RFTC를 출범합니다. 5G 통신 장비 역량 강화를 위한 조치입니다. 장비 부품 생태계의 변화를 나타냅니다.", "source": "biz.heraldcorp.com", "date": "2026-09-03 15:27", "url": "https://biz.heraldcorp.com/article/10861859?ref=naver", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 rftc 자회사 설립"}, {"title": "알에프텍, RF 전문 자회사 'RFTC' 출범", "summary": "알에프텍이 5G 통신 장비 및 방산 RF 기술 경쟁력 확보를 목적으로 자회사 RFTC를 신설하고 이달부터 본격적인 운영에 들어갑니다. 통신 장비 연구개발 역량 집중을 위한 개편입니다. 관련 업계 동향에 해당합니다.", "source": "newspim.com", "date": "2026-09-03 15:25", "url": "https://www.newspim.com/news/view/20260903000886", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 rf 자회사 rftc 출범"}, {"title": "알에프텍, RF 전문 자회사 'RFTC' 출범… 5G ·방산 사업 본격 확대", "summary": "알에프텍이 5G 통신 장비 및 방산 RF 기술 강화를 위해 R&D 조직을 분할하여 자회사 RFTC를 설립했습니다. 5G 장비 부품의 전문성 제고를 위한 조치입니다. 장비 시장 공급망의 한 축을 이룹니다.", "source": "view.asiae.co.kr", "date": "2026-09-03 14:23", "url": "https://view.asiae.co.kr/article/2026090314231334445", "category": "contract", "importance": 3, "wl": false, "topic": "알에프텍 rftc 자회사 신설"}, {"title": "국내외 통신사 CAPEX 절감 및 인프라 투자 정체… 통신 장비 테마 약세 흐...", "summary": "국내외 통신사들의 CAPEX 절감과 인프라 투자 정체로 인해 통신 장비 테마가 약세를 보이고 있습니다. 5G 망 구축을 넘어 데이터센터, 위성통신 등 신사업에서의 실제 수주와 매출 확보가 중요해졌습니다. 장비 시장의 투자 위축 상황을 진단합니다.", "source": "pinpointnews.co.kr", "date": "2026-09-03 14:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=483544", "category": "earnings", "importance": 3, "wl": false, "topic": "통신사 capex 절감 장비 테마 약세"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - thefastm", "summary": "에릭슨과 모빌라이가 사우디아라비아에서 AI 기반 RAN 및 자율 네트워크 기술 고도화를 위한 협력을 진전시켰다. 이번 협력을 통해 양사는 사우디 통신망의 지능화와 자동화 수준을 한층 높일 계획이다. 중동 지역 통신 인프라 시장에서 에릭슨의 입지가 강화되고 있다.", "source": "thefastmode.com", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 모빌라이 ai ran 협력"}, {"title": "알에프텍, 5G 기술 방산으로 확대…RF 자회사 'RFTC' 출범", "summary": "알에프텍은 지난 2019년 삼성전자에 5G 안테나 필터 유닛을 공급하며 RF 장비 시장에 진입한 이후 Massive MIMO 기지국용 안테나 유닛 등을 공급하며 역량을 축적해 왔습니다. 삼성전자 네트워크사업과의 협력 이력을 조명합니다. 장비 생태계 협력 관계를 보여 udis-aces-announces-5g-and-6g-partnership-with-movandi.html", "category": "contract", "importance": 3, "wl": false, "topic": "사우디 에이세스 파트너십"}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "유럽 지역 통신 소식에 따르면 페어폰이 시리즈 C 투자 유치를 마쳤으며 스파크와 헬라스 샛이 양자 보안 통신을 도입했다. 또한 노키아가 사우디아라비아에서 네트워크 자동화 기술을 개발 중이며 에릭슨은 FIS와의 제휴를 통해 핀테크 제안을 강화했다. 글로벌 통신 및 장비사들의 다각적인 기술 협력이 활발하게 이루어지고 있다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "https://www.lightreading.com/smartphones-devices/eurobites-fairphone-opens-series-c-funding-round-after-happy-h1", "category": "contract", "importance": 3, "wl": true, "topic": "에릭슨 핀테크 제휴"}, {"title": "화웨이 코리아가 한국 대학생 9명을 선전으로 부른 이유는", "summary": "화웨이 도 얻는 것이 있다. 반도체와 통신 장비 소프트웨어 분야에서 한국 대학이 배출하는 인력의 수준이 높은 만큼 초기 단계부터 접점을 만드는 일은 기업의 기술 협력 기반을 넓히는 선택이 되기 때문이다. AI와 5G...", "source": "econovill.com", "date": "2026-09-02 10:40", "url": "https://www.econovill.com/news/articleView.html?idxno=749636", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "[모닝 리포트] \"RFHIC, 내년 글로벌 5G 투자 수혜 기대\" - 뉴스핌", "summary": "증권가에서 RFHIC가 내년 글로벌 5G 투자 확대의 수혜를 입을 것으로 전망했다. 무선통신 부품 공급사의 실적 개선 기대감을 반영한다. 통신장비 생태계 전반의 투자 심리에 영향을 미친다.", "source": "뉴스핌", "date": "2026-09-02 08:32", "url": "https://www.newspim.com/news/view/20260902000075", "category": "earnings", "importance": 3, "wl": false, "topic": "rfhic 글로벌 5g 수혜"}, {"title": "한화투자證 “반도체 테스트 장비 발주 급증⋯삼성전자 HBM4 약진 연쇄효과” - v.daum.net", "summary": "한화투자증권은 반도체 테스트 장비 발주가 급증하고 있으며, 이는 삼성전자의 HBM4 약진과 연쇄적인 효과를 낸다고 분석했다. 메모리 반도체 공급망 전반의 수혜를 시사한다. 네트워크 부문보다는 반도체 실적에 초점이 맞춰져 있다.", "source": "v.daum.net", "date": "2026-09-02 07:50", "url": "https://v.daum.net/v/20260902075004698", "category": "earnings", "importance": 3, "wl": false, "topic": "한화투자증권 반도체 장비"}, {"title": "Nokia stock gains on Saudi Arabia R&D move and AI focus - AD HOC NEWS", "summary": "노키아가 사우디아라비아 R&D 진출 및 AI 집중 전략에 힘입어 주가 상승세를 기록했다. 인공지능 기반 통신 기술 투자에 대한 시장의 긍정적 평가가 반영되었다. 실적 개선 기대감이 작용하 :40", "url": "https://blog.naver.com/PostView.naver?blogId=dealsite&logNo=224399940686&redirect=Dlog", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai 기술"}, {"title": "LIG아큐버, LG유플러스와 291억원 규모 Core Probe 공급 계약 - 데이터투자", "summary": "LIG아큐버가 LG유플러스와 291억 원 규모의 Core Probe 공급 계약을 체결했습니다. 통신망의 안정성과 품질 관리를 위한 핵심 장비 도입이 원활히 진행되고 있습니다. 양사 간의 견고한 파트너십을 바탕으로 네트워크 고도화가 추진됩니다.", "source": "데이터투자", "date": "2026-09-03 17:27", "url": "https://www.datatooza.com/article/20260903172751600752ef3ef162_80", "category": "contract", "importance": 3, "wl": false, "topic": "lg유플러스 코어 프로브 계약"}, {"title": "Deutsche Telekom shares rise as sources say Elliott builds stake, opposes T-Mobile deal - ", "summary": "엘리엇의 지분 매입 소식과 T모바일 거래 반대 움직임이 전해지면서 도이치텔레콤의 주가가 상승했다. 주주 행동주의 개입에 따른 시장의 즉각적인 반응이다.", "source": "TradingView", "date": "2026-09-03 17:21", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N44V0JM:0-deutsche-telekom-shares-rise-as-sources-say-elliott-builds-stake-opposes-t-mobile-deal/", "category": "earnings", "importance": 3, "wl": false, "topic": "도이치텔레콤 주가 상승"}, {"title": "Deutsche Telekom reshuffles leadership team - Mobile Europe", "summary": "도이치텔레콤이 최고재무책임자(CFO) 등 주요 경영진을 교체하는 대규모 조직 개편을 단행했습니다. 이번 인사를 통해 변화하는 통신 시장 환경에 대응하고 재무 및 기술 전략의 새로운 발판을 마련할 계획입니다. 글로벌 통신 시장에서 선도적인 위치를 공고히 하기 위한 리더십 쇄신 차원에서 추진되었습니다.", "source": "Mobile Europe", "date": "2026-09-03 17:21", "url": "https://www.mobileeurope.co.uk/deutsche-telekom-appointments-leadership/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영진 개편"}, {"title": "“매장도 광고 플랫폼” KT, CU와 손잡고 리테일 미디어 확대 - 디지틀조선TV", "summary": "KT가 CU와 협력하여 오프라인 매장을 광고 플랫폼으로 활용하는 리테일 미디어 사업을 확대합니다. 편의점 인프라를 활용한 디지털 사이니지 사업이 가속화되고 있습니다. 새로운 광고 수익 모델 창출에 주력하고 있습니다.", "source": "디지틀조선TV", "date": "2026-09-03 17:03", "url": "https://www.dizzotv.com/site/data/html_dir/2026/09/03/2026090380195.html", "category": "contract", "importance": 3, "wl": false, "topic": "kt 광고 사업"}, {"title": "울산 시내버스 와이파이 업그레이드… function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
/* 회사 별칭 매핑: 한/영 표기가 달라도 같은 키로 묶어 2건 제한 적용 */
const COMPANIES=[
  ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
