<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네트워크 뉴스 모니터링</title>
<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .blk-hd{padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;display:flex;align-items:baseline;gap:8px}
  .blk-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .blk-hd.imp h3{color:var(--crit)}
  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hd-top">
    <h1>Samsung Network <span>뉴스 모니터링</span></h1>
    <button class="noti-btn" id="notiBtn" onclick="toggleNoti()">🔕 알림 꺼짐</button>
  </div>
  <div class="hd-meta" id="lastUpdate">news_data.js 없음</div>
  <div class="tabbar" id="tabbar"></div>
</header>

 원을 편성하고, 다목적실용위성 8호, KPS 및 저궤도 위성 통신 기술개발 등에 자금을 투입합니다.", "source": "gndomin.com", "date": "2026-09-02 18:14", "url": "http://www.gndomin.com/news/articleView.html?idxno=487739", "category": "policy", "importance": 3, "wl": false, "topic": "우주항공청 예산 편성"}, {"title": "\"AI 시대, 트래픽 5배 증가…네트워크 지원 필요\"", "summary": "AI 시대 트래픽 폭증으로 초고속·초저지연 네트워크 투자가 필요하며, 해저케이블과 6G 지상망에 결합 가능한 저궤도 위성망의 중요성이 커졌다. 차세대 인프라 확충 필요성을 다룬다. 통신망 고도화 트렌드를 보여준다.", "source": "news.bizwatch.co.kr", "date": "2026-09-02 17:28", "url": "https://news.bizwatch.co.kr/article/mobile/2026/09/02/0038", "category": "tech", "importance": 3, "wl": false, "topic": "ai 시대 트래픽 증가 해저케이블 위성"}, {"title": "Hungary's 4iG Group and SpaceX sign Europe's first Starlink - mediasat.info", "summary": "헝가리 4iG 그룹과 스페이스엑스가 유럽 최초로 스타링크 서비스 도입 계약을 체결했다. 저궤도 위성통신 서비스의 유럽 지역 확산을 보여주는 사례이다. 통신 및 위성 분야의 새로운 제휴 동향을 나타낸다. 관련 인프라 협력이 점차 확대될 전망이다.", "source": "mediasat.info", "date": "2026-09-02 17:14", "url": "https://mediasat.info/en/2026/09/02/starlink-mobile-is-coming-to-hungary-and-the-balkans/", "category": "contract", "importance": 3, "wl": false, "topic": "스페이스엑스 스타링크 수주"}], "competitor": [{"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도가 국가 안보 우려를 이유로 기존에 설치된 중국산 통신 장비의 교체 및 철거를 검토 중인 것으로 알려졌다. 화웨이 등 중국 장비 의존도를 낮추기 위한 이번 조치가 확정될 경우 글로벌 통신장비 시장의 판도와 장비 공급망에 큰 파장을 미칠 것으로 예상된다. 주요 국가들의 보안 규제 강화 기조와 맞물려 업계의 이목이 집중되고 있다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 4, "wl": true, "topic": "인도 중국산 통신장비 퇴출"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 6G와 AI가 결합된 드론 실시간 추적 및 ISAC 통신 기술을 공개할 예정이다. 한국 정부와 기업들을 상대로 기술력을 알려 협력 방안을 모색한다. 글로벌 통신장비 경쟁사의 최신 기술 발표 및 전략 행사이다. 업계 주목도가 높은 사안이다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 드론 실시간 추적 6g"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI 랜, ISAC, 6G로 이어지는 기술 리더십을 바탕으로 한국 고객과 파트너를 위한 차세대 네트워크 청사진을 제시했다. AI 시대의 경쟁력이 네트워크에서 시작된다고 강조했다. 글로벌 경쟁사의 기술 전략 발표이다. 업계에 미치는 영향력이 크다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 ai-ran isac 6g 청사진"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "에릭슨이 전파 송출 한 번으로 데이터 전송과 사물 탐지를 동시에 처리해 통신용과 레이더용 주파수를 따로 할당할 필요가 없는 6G 신기술을 공개했다. 하나의 기지국 장비로 두 기능을 수행할 수 있는 혁신 기술이다. 글로벌 경쟁사의 차세대 기술 발표이다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 기지국 레이더 6g 신기술"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "바이트댄스가 중국 네이멍구에 대규모 AI 데이터센터 건설을 추진 중인 가운데, 과거 화웨이와 알리바바 등 주요 IT·통신장비 기업들이 해당 지역에 컴퓨팅 시설 관련 투자를 진행한 바 있습니다.", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 데이터센터 인프라"}, {"title": "VodafoneThree declares 5G network slicing war on BT", "summary": "보다폰 쓰리가 BT의 동급 서비스와 차별화된 보증을 제공하는 새로운 슈퍼모바일 상품을 통해 5G 네트워크 슬라이싱 시장에서 경쟁을 선언했다. 이번 서비스 출시는 기업 및 소비자 고객을 대상으로 맞춤형 품질 보장을 내세워 가입자 유치 경쟁을 심화시키고 있다. 통신사 간 차세대 네트워크 기술 활용 경쟁이 가속화되는 양상이다.", "source": "Light Reading", "date": "2026-09-03 18:23", "url": "https://www.lightreading.com/5g/vodafonethree-declares-5g-network-slicing-war-on-bt", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰 쓰리 5g 네트워크 슬라이싱"}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "우리넷이 국책과제로 개발한 16Tbps급 패킷-광-전달망 시스템을 실제 운용 환경에서 검증하는 NIA의 시범도입 실증 사업 주관기관으로 선정되었다. 이번 사업을 통해 국산 장비의 성능과 안정성을 검증하고 상용화에 속도를 낼 계획이다. 국내 통신장비 업체의 AI 네트워크 기반 기술 상용화 시험대로 평가된다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "contract", "importance": 3, "wl": true, "topic": "우리넷 16tbps ai 네트워크"}, {"title": "TSMC 장비 조달 수요, 반년 만에 1.9배 늘어…“팹 20개 동시에 지어도 부족”", "summary": "TSMC가 올해 장비 조달 수요 추정치를 지난해 말 대비 1.9배로 상향 조정했다. 대만과 해외에서 팹 약 20곳을 동시에 건설하고 있음에도 고객 수요가 공급을 앞서고 있어 글로벌 반도체 장비 수요가 매우 높음을 시사한다.", "source": "전자신문", "date": "2026-09-03 13:18", "url": "https://www.etnews.com/20260903000214", "category": "earnings", "importance": 3, "wl": true, "topic": "tsmc 장비 조달 수요 급증"}, {"title": "VodafoneThree to launch debut TV service in challenge to UK rivals", "summary": "영국 통신 그룹 보다폰쓰리가 영국 라이벌들에 대항하여 첫 TV 서비스를 출시할 계획이다. TV 플랫폼 추가를 통해 브로드밴드 사업 규모를 두 배로 키우겠다는 전략이다.", "source": "Financial Times Tech", "date": "2026-09-03 13:00", "url": "https://www.ft.com/content/b44fcdbd-4c0e-4032-b81a-98e309991388?syn-25a6b1a6=1", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 tv 서비스 출시"}, {"title": "Ericsson adaptive inventory", "summary": "에릭슨이 AI 및 자율 네트워크 시대의 요구에 대응하기 위해 '에릭슨 어댑티브 인벤토리(EAI)' 솔루션 프로필을 업데이트했다. 운영 데이터의 자율성을 높이고 네트워크 관리 효율성을 극대화하기 위한 장비 업계의 기술 전략을 담고 있다.", "source": "RCR Wireless", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-Channel", "category": "tech", "importance": 3, "wl": true, "topic": "에릭슨 적응형 인벤토리"}, {"title": "Eurobites: Fairphone opens Series C funding round after happy H1", "summary": "페어폰이 상반기 실적 호조에 힘입어 C라운드 투자 유치를 시작했으며, 스파크와 헬라스 셋은 양자 암호통신을 도입했다. 또한 노키아가 사우디아라비아에서 네트워크 자동화 기술을 개발하고, 에릭슨은 FIS와의 협력을 통해 핀테크 제안을 강화하고 있다. 글로벌 통신장비 및 기술 기업들의 주요 사업 다각화와 지역별 수주 동향을 보여준다.", "source": "Light Reading", "date": "2026-09-02 20:06", "url": "https://www.lightreading.com/smartphones-devices/eurobites-fairphone-opens-series-c-funding-round-after-happy-h1", "category": "contract", "importance": 3, "wl": true, "topic": "노키아 에릭슨 동향"}, {"title": "美 '팍스 실리카' 맞불…中, 제3세계로 AI 인프라 확장", "summary": "미국의 대중국 견제에 맞서 중국이 제3세계로 AI 인프라 확장을 꾀하고 있으며, ESS와 광통신 등 일부 공급망에서 중국 비중이 높은 반면 반도체 장비와 첨단 칩 부문에서는 화웨이 등이 국산화 속도를 내고 있습니다.", "source": "hankyung.com", "date": "2026-09-02 18:23", "url": "https://www.hankyung.com/article/2026090203721", "category": "policy", "importance": 3, "wl": false, "topic": "화웨이 공급망 분석"}, {"title": "통신사도 통신장비도 AI로 달라진다…통신망 운영의 새 기준은 '예측'", "summary": "국내 통신사들이 AI를 활용해 네트워크 이상 징후를 사전 감지하는 시스템을 적용하는 가운데, 에릭슨과 노키아 등 글로벌 통신장비 업체들도 AI 기반 네트워크 운영 솔루션을 강화하고 있습니다.", "source": "popcornnews.net", "date": "2026-09-02 15:50", "url": "http://www.popcornnews.net/news/articleView.html?idxno=131622", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 ai 네트워크 운영"}, {"title": "Telecom news: Tarana Wireless, Itellum, Ericsson, Gemtek Technology, Dixon Technologies - ", "summary": "에릭슨(Ericsson)을 비롯한 타라나 와이어리스, 젬텍 테크놀로지 등 글로벌 통신장비 및 부품사들의 최신 계약 및 기술 공급 동향을 보도했다. 글로벌 장비 시장의 수주 및 파트너십 흐름을 보여준다.", "source": "TelecomLead", "date": "2026-09-02 13:20", "url": "https://telecomlead.com/news/telecom-news-tarana-wireless-itellum-ericsson-gemtek-technology-dixon-technologies-127544", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 통신 장비 동향"}, {"title": "Telecom news: Midwest Fiber Networks, Midwest Fiberpath, Forward, QA Cafe - TelecomLead", "summary": "미드웨스트 파이버 네트워크와 파워포인트 등 광섬유 및 통신 인프라 관련 기업들의 최신 사업 및 기술 협력 동향을 전했다. 통신 인프라 구축 생태계를 보여준다.", "source": "TelecomLead", "date": "2026-09-02 13:16", "url": "https://telecomlead.com/news/telecom-news-midwest-fiber-networks-midwest-fiberpath-forward-qa-cafe-127550", "category": "contract", "importance": 3, "wl": false, "topic": "미드웨스트 파이버 네트워크 동향"}, {"title": "가성비 중국폰 옛말… 화웨이 ·샤오미 메모리난에 가격 일제히 올려", "summary": "화웨이는 올해 상반기 매출이 전년 동기 대비 9.6% 늘었으나 순이익은 36% 감소했다고 발표했으며, 이는 R&D 비용 확대와 메모리 가격 상승이 영향을 미쳤습니다.", "source": "sedaily.com", "date": "2 : "tech", "importance": 2, "wl": false, "topic": "우리넷 koren ai 광네트워크 실증"}, {"title": "우리넷, NIA ‘AI 네트워크 장비 실증’ 주관기관 선정…상용화 추진", "summary": "우리넷이 NIA의 AI 네트워크 장비 시범도입 실증 주관기관으로 선정되어 상용화를 추진한다. 6G 초정밀 전달망 시스템 개발 과제를 통해 AI 데이터센터 및 스마트팩토리용 네트워크 기술 고도화를 꾀한다. 국내 중소 장비사의 기술 실증 뉴스이다.", "source": "edaily.co.kr", "date": "2026-09-03 16:46", "url": "https://www.edaily.co.kr/News/Read?newsId=04572326645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "tech", "importance": 2, "wl": false, "topic": "우리넷 nia ai 네트워크 장비 실증"}, {"title": "우리넷, 'KOREN 기반 AI 네트워크 장비 시범도입 실증' 주관", "summary": "우리넷이 KOREN 기반 AI 네트워크 장비 실증을 주관하며 6G 초정밀 전달망 과제를 연계해 기능을 고도화한다. 기존 광전송망 기술을 바탕으로 사업 영역을 확장한다. 국내 통신 장비 업체의 R&D 및 실증 성과이다.", "source": "datanet.co.kr", "date": "2026-09-03 16:16", "url": "https://www.datanet.co.kr/news/articleView.html?idxno=214238", "category": "tech", "importance": 2, "wl": false, "topic": "우리넷 koren ai 네트워크 장비"}, {"title": "AI pushes fiber networks toward a capacity crunch, AFL says", "summary": "AFL의 노아 테일러가 RCR 인터뷰를 통해 광섬유 가용성과 전력 제약의 결합이 AI 인프라 구축에 추가적인 과제를 제시한다고 밝혔다. AI 데이터 트래픽 증가에 따라 인프라 수급 문제가 업계의 주요 화두로 떠오르고 있다.", "source": "RCR Wireless", "date": "2026-09-03 16:07", "url": "https://rcrwireless.com/20260903/networks/ai-fiber-afl", "category": "tech", "importance": 2, "wl": true, "topic": "afl ai 광섬유 병목"}, {"title": "알에프텍, R&D 조직 자회사 분리…RF 사업 확대", "summary": "국내 통신 장비 부품업체인 알에프텍이 5G 통신 장비 및 방산 RF 기술 경쟁력 강화를 위해 R&D 조직을 자회사 'RFTC'로 분리한다. 이달 중 운영 체계를 정비하고 사업을 확대할 계획이다. 국내 중소 장비 부품업계의 조직 개편 동향이다. 직접적인 글로벌 경쟁사나 메이저 수주 뉴스는 아니다.", "source": "sentv.co.kr", "date": "2026-09-03 15:46", "url": "https://www.sentv.co.kr/article/view/sentv202609030187", "category": "other", "importance": 2, "wl": false, "topic": "알에프텍 r&d 자회사 rftc 분리"}, {"title": "알에프텍 “드론 막는 RF기술력 강화”", "summary": "알에프텍이 5G 안테나·필터 기술과 방산 RF 기술을 독립적 플랫폼으로 고도화하기 위해 연구개발 조직을 자회사로 분리했다. RF 사업을 본격적으로 확대하겠다는 전략이다. 국내 통신 장비 부품 생태계의 변화를 보여준다. 기술 itle": "AI regulatory regime should be nimble, not over-constraining: Top PM advisor", "summary": "인도의 고위 정책 자문가가 AI 규제 체계가 과도하게 구속하기보다는 기민해야 한다는 입장을 밝혔다. 인도는 IT법 개정을 통해 AI와 딥페이크 규제 Norms를 마련 중이다.", "source": "ET Telecom", "date": "2026-09-03 16:55", "url": "https://telecom.economictimes.indiatimes.com/news/policy/ai-regulatory-regime-should-be-nimble-not-over-constraining-top-pm-advisor/133729523", "category": "policy", "importance": 2, "wl": true, "topic": "인도 ai 규제 기조"}, {"title": "The Kingsbury Commitment Promised Competition. AT&T Got 98% of Long Distance - Broadband B", "summary": "과거 킹스베리 약정이 약속했던 통신 경쟁 촉진 효과와 달리 AT&T가 장거리 전화 시장의 98%를 장악하게 된 역사적 배경을 분석했다. 통신 규제사와 독과점의 역사적 교훈을 다룬다.", "source": "Broadband Breakfast", "date": "2026-09-02 21:30", "url": "https://broadbandbreakfast.com/the-kingsbury-commitment-promised-competition-at-t-got-98-of-long-distance/", "category": "policy", "importance": 2, "wl": false, "topic": "킹스베리 약정 역사 분석"}], "carrier": [{"title": "Deutsche Telekom : reorganizes leadership functions - marketscreener.com", "summary": "Deutsche Telekom이 최고 경영진의 리더십 기능을 재조직하며 조직 체계를 정비했다. 거대 통신사의 경영 효율성 제고 및 지배구조 개편의 일환이다.", "source": "marketscreener.com", "date": "2026-09-03 19:15", "url": "https://www.marketscreener.com/news/deutsche-telekom-reorganizes-leadership-functions-ce7858d3de81f120", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 경영진 개편"}, {"title": "Deutsche Telekom shares rise as sources say Elliott builds stake, opposes T-Mobile deal - ", "summary": "엘리엇의 도이치텔레콤 지분 인수 및 T-Mobile 딜 반대 소식에 Deutsche Telekom 주가가 상승세를 보였다. 주요 주주의 경영 개입이 통신사 전략에 미치는 영향력을 보여준다.", "source": "TradingView", "date": "2026-09-03 17:21", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N44V0JM:0-deutsche-telekom-shares-rise-as-sources-say-elliott-builds-stake-opposes-t-mobile-deal/", "category": "contract", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분 인수"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "통신 3사가 AI-RAN 등 차세대 네트워크 투자를 재개하는 움직임을 보인다. SK텔레콤은 정부의 AI-RAN 사업에 참여해 삼성전자, 에릭슨 등과 실증을 진행한다. 5G SA와 주파수 경매 등이 주요 변수로 작용한다. 네트워크 장비 시장의 수요 변화를 예고하는 중요한 동향이다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 lg유플러스 망 투자"}, {"title": "Deutsche Telekom names Mirchandani CFO in shake-up - Briefs Finance", "summary": "Deutsche Telekom이 경영진 쇄신의 일환으로 미르찬디(Mirchandani)를 새로운 최고재무책임자(CFO)로 임명했다. 재무 리더십 교체를 통해 신사업 전략에 변화가 예상된다.", "source": "Briefs Finance", "date": "2026-09-03 06:44", "url": "https://www.briefs.co/news/deutsche-telekom-taps-dhananjay-mirchandani-as-next-cfo-in-b/", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 cfo 교체"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "KDDI가 7GHz 대역에서 세계 최고 수준인 3.6 Gbps 야외 전송 속도를 달성하며 6G 후보 주파수 실증에 성공했다. 차세대 통신 표준 준비와 주파수 활용 기술력을 입증하는 성과다. 향후 글로벌 6G 인프라 투자 방향에 중요한 시사점을 제공한다.", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g 야외 전송"}, {"title": "\"5G·6G도 국가전략자산\"… 통신 3사, AI 네트워크 투자 지원 촉구", "summary": "국내 통신 3사가 국회 정책 간담회에서 5G SA, AI-RAN, 6G뿐만 아니라 해저케이블과 저궤도 위성 등 AI 네트워크 인프라 투자 지원을 촉구했습니다.", "source": "newscj.com", "date": "2026-09-02 17:36", "url": "https://www.newscj.com/news/articleView.html?idxno=3429661", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai 네트워크 투자"}, {"title": "AI시대 네트워크 투자 해법...\"규제·세제 전면 손질\"", "summary": "KT와 LG유플러스 등 통신 3사는 해저케이블과 저궤도 위성 등 차세대 통신망에 대한 세액공제와 정부 보조금, 공공 수요 확보 지원을 강조했습니다.", "source": "zdnet.co.kr", "date": "2026-09-02 17:35", "url": "https://zdnet.co.kr/view/?no=20260902165531", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 세제 지원 요구"}, {"title": "통신3사 \"AI 강국 도약…투자 인센티브, 제도 체계화 필요\"", "summary": "통신 3사가 AI 시대에 요구되는 유무선 지상망과 해저케이블, 저궤도 위성 통신 등 핵심 인프라 확충을 위해 투자 인센티브와 제도 체계화를 요구했습니다.", "source": "newsway.co.kr", "date": "2026-09-02 16:32", "url": "https://www.newsway.co.kr/news/view?ud=2026090215431389718", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai 인프라 지원"}, {"title": "통신3사 \"AI망 지원\" 요구…정부, 세제·규제·AIDC 지원 추진(종합)", "summary": "KT 등이 차세대 네트워크의 범위를 지상 유무선망에서 해저케이블과 저궤도 위성까지 육·해·공으로 확대해 정책적으로 지원해야 한다고 주장했습니다.", "source": "news1.kr", "date": "2026-09-02 16:21", "url": "https://www.news1.kr/it-science/cc-newmedia/6277634", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 육해공 망 지원"}, {"title": "통신3사 \"AI 인프라 지원 넓혀달라\" 과기부 \"투자 여력 부족하진 않아\"", "summary": "통신사들이 AI 인프라 인정 범위를 해저케이블 및 저궤도 위성망까지 넓혀 세제 혜택과 인센티브를 달라고 건의한 데 대해 과기정통부는 투자 여력이 부족하지 않다는 입장을 밝혔습니다.", "source": "metroseoul.co.kr", "date": "2026-09-02 16:12", "url": "http://www.metroseoul.co.kr/article/20260902500514", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 세제 혜택 요구"}, {"title": "\"HBM·AIDC만 AI 인프라 아냐\"…통신3사 \"네트워크 투자 지원해야\"", "summary": "통신 3사가 AIDC뿐만 아니라 5G SA, AI-RAN, 6G 및 해저케이블과 저궤도 위성 등 연결망 인프라 전반에 대한 국가적 투자를 지원해달라고 촉구했습니다.", "source": "news1.kr", "date": "2026-09-02 15:09", "url": "https://www.news1.kr/it-science/cc-newmedia/6277550", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 네트워크 투자"}, {"title": "울산 시내버스, 차세대 와이파이로 싹 바꾼다", "summary": "울산시가 시내버스 노후 와이파이를 철거하고 5G 백홀 기반의 차세대 와이파이7로 전면 교체한다. 통신 품질 향상과 함께 실시간 장애 대응 효율성을 개선하는 사업이다. 공공 인프라의 통신 환경 개선 사례를 보여준다. 지역 단위 네트워크 고도화 동향이다.", "source": "ujeil.com", "date": "2026-09-03 20:46", "url": "http://www.ujeil.com/news/articleView.html?idxno=391509", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이7"}, {"title": "Vodafone has the best and fastest 5G network in Romania, according to Ookla - Business Rev", "summary": "Ookla 데이터에 따르면 Vodafone이 루마니아에서 가장 우수하고 빠른 5G 네트워크 품질을 제공하는 통신사로 선정됐다. 지속적인 네트워크 투자와 품질 우수성을 입증했다.", "source": "Business Review", "date": "2026-09-03 19:01", "url": "https://business-review.eu/tech/telecom/vodafone-has-the-best-and-fastest-5g-network-in-romania-according-to-ookla-300026", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰 루마니아 5g 품질"}, {"title": "울산 시내버스 762대 차세대 와이파이로 전면 교체", "summary": "울산시가 버스마다 제각각이던 노후 와이파이 장비를 철거하고 5G 백홀 기반의 와이파이7 장비를 설치한다. 백홀망과 버스 내부 간의 연동을 통해 통신 서비스를 고도화한다. 공공 교통 수단의 네트워크 품질 개선 작업이다. 관련 장비 도입 수요와 직결된다.", "source": "iusm.co.kr", "date": "2026-09-03 18:20", "url": "https://www.iusm.co.kr/news/articleView.html?idxno=1067423", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이7 교체"}, {"title": "울산 시내버스, 10월부터 '와이파이 7'로 전면 교체", "summary": "울산시가 10월부터 시내버스 전체 762대의 노후 장비를 철거하고 5G 백홀 기반 와이파이7로 전면 교체한다. 통신 품질 향상과 실시간 장애 대응 체계를 강화할 방침이다. 공공 와이파이 인프라의 세대 교체를 보여준다. 통신 서비스 품질 개선에 기여한다.", "source": "cnbnews.com", "date": "2026-09-03 17:58", "url": "https://www.cnbnews.com/news/articleView.html?idxno=1014302", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이7 10월 개통"}, {"title": "통신3사, “AI 네트워크는 국가 전략 인프라, 지원책 절실” 한목소리", "summary": "통신 3사가 5G SA와 6G 등 신기술 투자가 필요한 시점이나 시장 성정 정체로 수익 창출이 어렵다고 지적했다. AI 네트워크를 국가 전략 인프라로 규정하고 정부의 적극적인 지원책을 한목소리로 촉구했다. 통신사의 정책 건의 및 투자 부담 해소 요구를 담고 있다.", "source": "kidd.co.kr", "date": "2026-09-03 17:40", "url": "https://kidd.co.kr/news/247290", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 ai 네트워크 국가 인프라"}, {"title": "울산 시내버스 와이파이 업그레이드…10월 개통", "summary": "울산시가 5G 백홀망과 다중 링크 동작 기술을 적용해 대역폭을 넓힌 와이파이7으로 버스 장비를 교체한다. 야간과 주말을 활용해 순차 교체 작업을 진행한다. 디지털 인프라 고도화의 일환이다. 안정적인 통신 환경 구축을 목표로 한다.", "source": "sedaily.com", "date": "2026-09-03 16:57", "url": "https://www.sedaily.com/article/20086896?ref=naver", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이 업그레이드"}, {"title": "SKT·KT·LGU+, 정부에 '네트워크 투자' 지원 촉구", "summary": "국내 통신 3사가 정부에 네트워크 및 6G 투자 지원을 촉구하며 AI 네트워크의 국가 전략 인프라 지정과 현장 실증 연계를 강조했다. 통신사의 투자 의사결정에 영향을 미치는 정책적 요구를 다룬 ary": "울산시가 시내버스 전체 762대의 노후 와이파이를 철거하고 5G 백홀 기반 와이파이7으로 전면 교체하여 속도와 품질을 높인다. 통신 장애 대응 효율성을 개선하는 공공 인프라 사업이다. 대중교통 네트워크 환경을 업그레이드한다. 안정적인 무선 인터넷을 제공한다.", "source": "pressian.com", "date": "2026-09-03 10:34", "url": "https://www.pressian.com/pages/articles/2026090310015248848?utm_source=naver&utm_medium=search", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 공공와이파이 와이파이7"}, {"title": "Telekom's Boardroom Reshuffle Puts a 48-Quarter Winning Streak to the Test - AD HOC NEWS", "summary": "Deutsche Telekom의 이사회 대대적인 개편으로 인해 지난 48분기 동안 이어져 온 실적 성장 행진이 새로운 시험대에 올랐다. 경영진 변화가 실적 유지에 미칠 영향을 분석한다.", "source": "AD HOC NEWS", "date": "2026-09-03 10:30", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/telekom-s-boardroom-reshuffle-puts-a-48-quarter-winning-streak-to-the-test/70046488", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 이사회 개편"}, {"title": "울산 시내버스 762대 와이파이 싹 바꾼다…10월부터 '와이파이 7'", "summary": "울산시가 5G 백홀 기반으로 시내버스 와이파이 장비를 교체하며 데이터 전송 대역폭을 320MHz로 넓힌다. 제각각이던 규격을 정비하여 통신 품질을 높인다. 대중교통 공공와이파이 성능 개선 작업이다. 트래픽 처리 능력이 향상된다.", "source": "mhns.co.kr", "date": "2026-09-03 09:36", "url": "https://www.mhns.co.kr/news/articleView.html?idxno=758765", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이 대역폭"}, {"title": "울산시, 시내버스 와이파이 차세대 규격으로 전면 교체", "summary": "울산시가 상이한 장비로 운영되던 시내버스 와이파이를 5G 백홀 기반 와이파이7으로 전면 교체한다. 통신 품질 향상과 실시간 장애 대응 효율성을 동시에 도모한다. 공공 교통망 인프라 고도화 사업이다. 안정적인 서비스 환경을 조성한다.", "source": "ksilbo.co.kr", "date": "2026-09-03 09:32", "url": "https://www.ksilbo.co.kr/news/articleView.html?idxno=1066245", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이 품질 개선"}, {"title": "울산시, 10월부터 시내버스에서 끊김없이 인터넷 즐긴다", "summary": "울산시가 노후 와이파이를 철거하고 5G 백홀 전송로 기반의 와이파이7으로 시내버스 전 차량 장비를 교체한다. 10월부터 본격 운영에 들어가 인터넷 품질을 높인다. 공공 네트워크 환경 개선 프로젝트이다. 장애 대응 효율을 개선한다.", "source": "newsis.com", "date": "2026-09-03 09:23", "url": "https://www.newsis.com/view/NISX20260902_0003773857", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이 10월 운영"}, {"title": "울산 시내버스 와이파이 끊김 없이 더 빨라진다…762대 장비 교체", "summary": "울산시가 통신사 기지국 네트워크와 버스 단말기를 잇는 전송로인 백홀을 중심으로 시내버스 와이파이 장비를 교체한다. 노후 장비를 정비하여 통신 품질을 개선한다. 대중교통 무선 인프라 정비 사업이다. 원활한 데이터 전송을 지원한다.", "source": "news1.kr", "date": "2026-09-03 09:00", "url": "https://www.news1.kr/local/ulsan/6278080", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 시내버스 와이파이 백홀 교체"}, {"title": "VodafoneThree Takes Aim at EE With “Up to 4x Faster” 5G+ Plans - techadvisor.com", "summary": "VodafoneThree가 EE를 겨냥하여 최대 4배 빠른 속도를 제공한다고 주장하는 새로운 5G+ 요금제를 출시했다. 영국 통신 시장 내 경쟁 구도 강화와 가입자 유치 전략을 보여준다. 향후 통신사들의 네트워크 고도화 경쟁을 자극할 수 있다.", "source": "techadvisor.com", "date": "2026-09-03 08:02", "url": "https://www.techadvisor.com/article/3225803/vodafonethree-takes-aim-at-ee-with-up-to-4x-faster-5g-plans.html", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰스리 5g+ 요금제"}, {"title": "세제·주파수·규제 3박자… 이통3사 \"네트워크·AIDC지원 늘려야\"", "summary": "과기정통부와 통신 3사가 민관협의체를 통해 투자환경 개선과 3G 종료, 5G·6G 투자를 위한 패키지 지원 방안을 논의했다. 네트워크와 AI 데이터센터(AIDC) 인프라 지원의 필요성에 공감했다. 통신 정책 및 규제 완화 논의를 다룬다.", "source": "mt.co.kr", "date": "2026-09-03 04:00", "url": "https://www.mt.co.kr/tech/2026/09/03/2026090219553777599", "category": "policy", "importance": 3, "wl": false, "topic": "이통3사 네트워크 aidc 지원"}, {"title": "New star in comms firmament – Softbank positions HAPS between terrestrial and satellite", "summary": "소프트뱅크의 최신 HAPS(고고도 무인기) 시험 운행 결과, 성층권이 단순 커버리지 공백 해소를 넘어 광역 셀룰러, 프라이빗 네트워크, 드론, 엣지 컴퓨팅을 결합하는 복합 인프라로 활용될 가능성을 보여주었다. 차세대 무선 통신 커버리지 확장 기술로서 HAPS의 상용화 가능성이 주목받고 있다.", "source": "RCR Wireless", "date": "2026-09-03 01:08", "url": "https://rcrwireless.com/20260902/network-infrastructure/softbank-positions-haps-between-terrestrial-and-satellite", "category": "tech", "importance": 3, "wl": true, "topic": "소프트뱅크 haps 실증"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 로봇과 드론 등 피지컬 AI 장비의 AI-RAN 시험망 연동을 검증했다. 무선 환경 변화에 따라 최적의 네트워크를 자동으로 선택하고 안정적으로 연결하는 기술이다. 차세대 네트워크 운영 효율화 기술을 보여준다. 통신사의 기술 검증 동향이다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 연세대 ai-ran 검증"}, {"title": "“삐, 공사장 탐지됐습니다”… AI가 미리 찾는 통신망 위험 - 동아일보", "summary": "인공지능 기술을 활용해 공사장 등 통신망 주변의 위험 요소를 사전에 탐지하는 시스템이 도입됐다. 통신사의 안정적인 망 운영과 장애 예방 효율성을 높이는 기술이다. 네트워크 운용 고도화와 관련된 통신사 동향을 보여준다. 향후 망 안전성 강화에 기여할 것으로 기대된다.", "source": "동아일보", "date": "2026-09-03 00:30", "url": "https://www.donga.com/news/Economy/article/all/20260902/134592397/2", "category": "tech", "importance": 3, "wl": false, "topic": "동아일보 ai 통신망 감시"}, {"title": "[봇규의 헬로BOT] ‘피지컬 AI 1강’으로 ② | 실증은 늘렸다, 근데 산업...", "summary": "제조, 물류, 드론 등 산업 현장에서 자립형 5G SA와 AI-RAN을 구축하는 실증이 확대되고 있다. 물리적 AI 장비의 원활한 제어를 위한 네트워크 인프라의 중요성을 다룬다. 차세대 통신 기술의 산업 현장 적용 사례이다. 네트워크 고도화 수요를 반영한다.", "source": "hellot.net", "date": "2026-09-03 00:08", "url": "https://www.hellot.net/news/article.html?no=114727", "category": "tech", "importance": 3, "wl": false, "topic": "피지컬 ai 5g sa ai-ran 구축"}, {"title": "What’s up with… Deutsche Telekom, 4iG, WIOCC - telecomtv.com", "summary": "Deutsche Telekom, 4iG, WIOCC 등 유럽 주요 통신 및 인프라 기업들의 최신 경영 전략과 시장 동향을 점검했다. 글로벌 통신업계의 구조적 변화를 다룬다.", "source": "telecomtv.com", "date": "2026-09-02 23:55", "url": "https://www.telecomtv.com/content/digital-platforms-services/what-s-up-with-deutsche-telekom-4ig-wiocc-56163/amp/", "category": "contract", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영 동향"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에서의 프라이빗 5G 구축을 위한 새로운 계획을 마련했으나, 구체적인 주파수 할당 계획은 포함되지 않은 것으로 나타났다. 산업용 5G 확산을 위한 정책적 지원 시도에도 불구하고 핵심 자원인 주파수 문제로 인해 실효성에 대한 의문이 제기되고 있다. 향후 세부 규제와 주파수 정책의 방향이 주목된다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 3, "wl": true, "topic": "중국 프라이빗 5g 규제 완화"}, {"title": "Deutsche GigaNetz restructures premium portfolio in response to trend in high-speed tariff", "summary": "Deutsche GigaNetz가 초고속 인터넷 요금제 트렌드 변화에 대응하기 위해 프리미엄 서비스 포트폴리오를 전면 개편했다. 가입자 확보를 위한 요금 경쟁력 강화 조치다.", "source": "Telecompaper", "date": "2026-09-02 22:39", "url": "https://www.telecompaper.com/news/deutsche-giganetz-restructures-premium-portfolio-in-response-to-trend-in-high-speed-tariff-market--1581503", "category": "contract", "importance": 3, "wl": false, "topic": "도이치 기가네츠 포트폴리오 개편"}, {"title": "AI 국가 경쟁력 확보하려면 “네트워크 고도화에 정부 지원 필요”", "summary": "레거시 네트워크 유지와 5G SA·6G 투자 병행의 비효율성을 지적하며 네트워크 고도화를 위한 정부 지원을 촉구했다. 과기정통부는 새로운 서비스 창출에 따른 네트워크 편익을 언급했다. 통신 정책 방향을 다룬 토론 내용이다.", "source": "byline.network", "date": "2026-09-02 20:20", "url": "https://byline.network/?p=9004111222617950", "category": "policy", "importance": 3, "wl": false, "topic": "ai 네트워크 고도화 정부 지원"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "AI-RAN, 6G 등 차세대 네트워크 투자 확대에 맞춰 기지국 중심의 CAPEX 지표를 보완해야 한다는 지적이다. 개방형 시설 세액공제 적용 등 제도 개선을 논의한다. 통신 인프라 투자 촉진을 위한 정책 제안이다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 차세대 네트워크 capex 지표"}, {"title": "AI 트래픽 5년 뒤 최대 5배…\"네트워크도 국가 AI 인프라로 키워야\"", "summary": "AI 트래픽 폭증에 대비해 5G SA, AI-RAN, 6G 등에 대한 투자 지원과 네트워크 품질 확보의 중요성을 강조했다. 과기정통부는 개방형 AIDC를 특별법상 지원 대상에 포함하는 방안을 검토한다. 국가 AI 인프라로서의 네트워크 육성 방안이다.", "source": "mbn.mk.co.kr", "date": "2026-09-02 18:01", "url": "http://mbn.mk.co.kr/pages/news/newsView.php?category=mbn00006&news_seq_no=5216555", "category": "policy", "importance": 3, "wl": false, "topic": "ai 트래픽 네트워크 국가 인프라"}, {"title": "망 투자는 늘고, 수익 길은 좁고…통신3사 “AI시대 정책 다시 짜야”(종...", "summary": "통신 3사가 망 투자 부담과 수익 구조의 한계를 지적하며 3G 종료 및 5G SA·6G 투자 관련 정책을 재정비해달라고 요구했다. 과기정통부는 새로운 네트워크 투자의 의미를 함께 논의했다. 통신 규제 및 정책 개선 요구를 담고 있다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 3, "wl": false, "topic": "통신3사 ai시대 정책 재정비"}, {"title": "JioPC New Plans Starting at Rs 1000 Launched for Everyone - TelecomTalk", "summary": "Reliance Jio가 모든 이용자를 대상으로 1000루피부터 시작하는 신형 JioPC 요금제 및 상품을 공식 출시했다. 저가형 컴퓨팅 및 통신 결합 서비스로 디지털 보급을 확대한다.", "source": "TelecomTalk", "date": "2026-09-02 17:13", "url": "https://telecomtalk.info/jiopc-new-plans-starting-at-rs-1000/1011469/", "category": "contract", "importance": 3, "wl": false, "topic": "릴라이언스 지오 pc 출시"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계가 통신사의 AI 네트워크 및 데이터센터 투자를 촉진하기 위해 망 중립성 가이드라인 정비와 주파수 할당 대가 및 전파사용료 인하가 필요하다고 제언했다. 통신 인프라 투자를 위한 제도 개선 요구이다. 정책적 시사점을 제공한다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 ai nw dc 투자 지원 학계"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "국회 토론회에서 통신사가 부담하는 연간 조 단위의 주파수 할당 대가와 전파사용료를 설비투자 및 AI 인프라 투자와 연계해 경감해야 한다는 주장이 제기되었다. 통신사의 투자 여력 확보를 위한 정책 제안이다. 규제 완화 논의를 다룬다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url": "http://www.newstomato.com/ReadNews.aspx?no=1312287&inflow=N", "category": "policy", "importance": 3, "wl": false, "topic": "ai 시대 인프라 투자 주파수 감면"}, {"title": "JioHotstar Goes Global, Launches in 3 Other Countries - TelecomTalk", "summary": "JioHotstar가 서비스 영역을 확장하여 다른 3개 국가에 공식 론칭하며 글로벌 진출을 본격화한다. 콘텐츠 플랫폼의 해외 시장 공략 가속화를 보여준다.", "source": "TelecomTalk", "date": "2026-09-02 14:32", "url": "https://telecomtalk.info/jiohotstar-goes-global-launches-in-3-countries/1011457/", "category": "contract", "importance": 3, "wl": false, "topic": "지오핫스타 글로벌 진출"}, {"title": "Vodafone Idea shares jump 3% after brand revamp, Shah Rukh Khan joins as ambassador - Zee ", "summary": "Vodafone Idea 주가가 대대적인 브랜드 개편 및 배우 샤룩 칸의 홍보대사 합류 소식에 힘입어 3% 상승했다. 투자자들의 기대감이 주가에 긍정적으로 작용했다.", "source": "Zee Business", "date": "2026-09-02 14:21", "url": "https://www.zeebiz.com/market-news/news-vodafone-idea-shares-jump-3-after-brand-revamp-shah-rukh-khan-joins-as-ambassador-401527", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰 인도 주가 상승"}, {"title": "“AI 투자는 하고, 서비스는 못 팔고”…통신사 규제비용에 연 1조원 부...", "summary": "통신사가 매년 주파수 할당 대가와 전파사용료 등으로 부담하는 규제 비용이 약 1조원에 달하며, 6G 상용화와 AI 네트워크 투자를 앞두고 비용 부담 완화가 시급하다는 지적이다. 통신사의 재정 부담과 제도 개선 필요성을 다룬다.", "source": "ddaily.co.kr", "date": "2026-09-02 14:17", "url": "https://www.ddaily.co.kr/page/view/2026090212060398870", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 규제비용 1조원 6g 투자"}, {"title": "AI 3대 강국 도약, 인프라부터…\"망·AIDC 민간투자 끌어내야\" [현장]", "summary": "AI 강국 도약을 위해 주파수 할당 대가와 전파사용료 등 정책성 비용의 부담을 낮추고 민간 투자를 유인해야 한다는 전문가 제언이다. AIDC 투자 활성화를 위한 시행령 정교화도 주문했다. 통신 인프라 관련 정책 토론 내용이다.", "source": "inews24.com", "date": "2026-09-02 14:02", "url": "http://www.inews24.com/view/2001096", "category": "policy", "importance": 3, "wl": false, "topic": "ai 3대 강국 망 aidc 민간투자"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤이 통신 본업 회복과 함께 신규 주파수 할당, 5G SA 상용화, AI 기지국 보급 확대 정책이 논의될 가능성이 크다고 진단했다. 데이터센터와 기지국이 AI 성장의 양대 축으로 평가받는다. 통신사의 실적 및 전략 동향을 보여준다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "earnings", "importance": 3, "wl": false, "topic": "sk텔레콤 통신 본업 회복 ai 기지국"}, {"title": "여의도 뒤덮을 100만 인파...LG유플러스, 이동기지국·AI로 통신 장애 막는다 - 소비자경제", "summary": "LG유플러스가 대규모 인파가 몰리는 행사에서 이동기지국과 AI 기술을 동원해 통신 장애 예방에 나선다. 트래픽 폭주 상황에 대응하여 안정적인 통신 품질을 유지하려는 목적이다. 통신사의 현장 망 운영 전략을 보여준다. 네트워크 안정성 확보를 위한 조치이다.", "source": "소비자경제", "date": "2026-09-02 12:52", "url": "http://www.dailycnc.com/news/articleView.html?idxno=244607", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 이동기지국"}, {   ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
