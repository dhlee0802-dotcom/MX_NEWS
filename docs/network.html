usiness/12142298", "category": "contract", "importance": 3, "wl": false, "topic": "매일경제 스타링크 도입"}, {"title": "스페이스X, AI 데이터센터 수장 교체…인력 이탈·장애 속 운영 안정화 총력 - 디지털투데이", "summary": "스페이스X가 AI 데이터센터 총괄 수장을 교체하며 인력 이탈과 네트워크 장애 대응 등 운영 안정화에 총력을 기울이고 있다. 급격한 사업 확장 속에서 인프라 안정성 확보가 최우선 과제로 부상했다. 경영진 교체가 향후 위성 및 데이터센터 전략에 미칠 영향이 주목된다.", "source": "디지털투데이", "date": "2026-09-02 14:04", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697624", "category": "exec", "importance": 3, "wl": false, "topic": "스페이스x ai 수장"}, {"title": "Can Europe take on Elon Musk’s Starlink? - The Times", "summary": "유럽연합이 일론 머스크의 스타링크 독점에 대응하기 위한 자체 위성통신망 구축 방안을 모색하고 있다. 안보 및 통신 주권 확보가 유럽 내 위성 인프라 투자 확대를 이끄는 핵심 동인이다. 글로벌 위성통신 시장에서 미·유럽 간 경쟁이 심화할 전망이다.", "source": "The Times", "date": "2026-09-02 14:00", "url": "https://www.thetimes.com/business/technology/article/eutelsat-oneweb-europe-space-race-starlink-9lf5pntb7", "category": "other", "importance": 3, "wl": false, "topic": "스타링크 유럽 경쟁"}, {"title": "ASTS Down 46.3%, Insiders Buying, Earnings Make Or Break! | ASTS Stock Analysis Cbse 12th ", "summary": "위성통신사 AST 스페이스모바일의 주가 하락 및 내부자 매수, 실적 발표를 앞둔 시장의 기대와 우려를 다룬 분석 기사이다.", "source": "Mshale", "date": "2026-09-02 12:32", "url": "https://mshale.com/822d1196/ef7039f5-gAFt7ylJec", "category": "earnings", "importance": 3, "wl": false, "topic": "ast스페이스모바일 주가"}, {"title": "인텔리안테크, 美 공장 첫 출하…북미 위성통신 공급망 가동 - 전자신문", "summary": "인텔리안테크가 미국 공장에서 첫 제품을 출하하며 북미 위성통신 공급망 가동에 돌입했다. 현지 생산 거점 확보를 통해 미국 시장 내 수주 대응력이 크게 향상될 전망이다. 글로벌 위성 안테나 시장에서의 경쟁 우위 선점이 기대된다.", "source": "전자신문", "date": "2026-09-02 11:15", "url": "https://www.etnews.com/20260902000178", "category": "contract", "importance": 3, "wl": false, "topic": "인텔리안테크 미국 공장"}, {"title": "Live: SpaceX Falcon 9 Rocket Launches Three BlueBird Direct-to-cell Satellites From Cape C", "summary": "스페이스X가 팰컨 9 로켓을 이용해 3개의 블루버드 다이렉트투셀(Direct-to-cell) 위성을 케이프커내버럴에서 성공적으로 발사했다. 이번 발사는 저궤도 위성과 지상 스마트폰 간 직접 통신 상용화를 위한 핵심 단계다. 위성통신 분야의 기술 발전 속도가 한층 가속화될 전망이다.", "source": "Mshale", "date": "2026-09-02 08:44", "url": "https://mshale.com/0006d2f6/a65fb8a58QC-T99MDuA", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 위성 발사"}, {"title": "Starlink leads satellite internet boom but other players are set to launch - thenationalne", "summary": "스타링크가 글로벌 위성 인터넷 시장을 주도하는 가운데 다수의 경쟁사들도 시장 진입을 준비하고 있다. 저궤도 위성 발사 비용 감소와 기술 성숙이 신규 진입을 촉진하고 있다. 향후 위성통신 시장은 다자 간 경쟁 체제로 전환될 가능성이 높다.", "source": "thenationalnews.com", "date": "2026-09-02 03:37", "url": "https://www.thenationalnews.com/news/uae/2026/09/01/starlink-spearheads-satellite-internet-boom-but-other-players-are-set-to-launch/", "category": "other", "importance": 3, "wl": false, "topic": "스타링크 위성 인터넷"}, {"title": "AMZN or SPCX: One Stock Could Capture 76% of a $107B Satellite Market, Says Wells Fargo - ", "summary": "웰스파고 분석에 따르면 아마존(AMZN)과 스페이스X(SPCX) 중 한 곳이 1,070억 달러 규모의 위성 시장의 76%를 장악할 수 있다는 전망이 제기되었다. 거대 자본을 가진 플레이어 중심의 시장 재편이 예고되고 있다. 위성통신 생태계의 독과점 우려와 함께 관련 투자 전략 수정이 불가피하다.", "source": "TipRanks", "date": "2026-09-01 21:06", "url": "https://www.tipranks.com/news/amzn-or-spcx-one-stock-could-capture-76-of-a-107b-satellite-market-says-wells-fargo", "category": "other", "importance": 3, "wl": false, "topic": "웰스파고 위성 시장 전망"}], "competitor": [{"title": "러트닉 美 상무장관, “미국서 안 만들면 반도체 관세”…표적 관세 언급", "summary": "하워드 러트닉 미국 상무장관이 미국 내에서 생산하지 않는 반도체에 대해 '표적 관세'를 부과하겠다는 입장을 공식화했다. 미국 내 생산 시 관세를 면제하고 그렇지 않으면 세계 최대 시장 진입 대가로 관세를 물리겠다는 구상이다. 관세 대상은 칩뿐만 아니라 노트북, 게임기, 데이터센터 서버 등 반도체 탑재 완제품까지 확대될 수 있어 글로벌 반도체 업계가 바짝 긴장하고 있다. 국가 간 통상 압박과 공급망 재편에 중대한 파장을 미칠 규제 이슈다.", "source": "전자신문", "date": "2026-09-03 10:12", "url": "https://www.etnews.com/20260903000086", "category": "policy", "importance": 5, "wl": true, "topic": "미국 상무장관 반도체 표적 관세 언급"}, {"title": "Ericsson Shows How 6G Base Stations Can Detect Drones - thelec.net", "summary": "에릭슨이 6G 기지국을 활용해 드론을 탐지할 수 있는 기술을 시연했다. 해당 기술은 향후 차세대 이동통신망의 활용 범위를 넓히는 핵심 기능을 제공할 것으로 전망된다. 경쟁사의 주요 신기술 출시 및 R&D 성과로서 시장 경쟁 구도에 영향을 미친다. 삼성전자 네트워크사업부의 6G 기술 개발 전략 수립에 있어 중요한 참고 지표가 된다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 드론 탐지 기술"}, {"title": "Deutsche Telekom Announces Management Changes Across Finance and Technology - The Fast Mod", "summary": "도이체텔레콤이 재무 및 기술 전반에 걸쳐 경영진 변경을 단행했다. 글로벌 통신 리더의 최고경영진 교체로 경쟁사 및 시장 동향 파악에 중요성이 높다.", "source": "The Fast Mode", "date": "2026-09-03 09:00", "url": "https://www.thefastmode.com/leadership-and-management/50460-deutsche-telekom-announces-management-changes-across-finance-and-technology", "category": "exec", "importance": 5, "wl": false, "topic": "도이체텔레콤 경영진"}, {"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도가 국가 안보 우려를 이유로 기존에 설치된 중국산 레거시 통신 장비의 철거 및 교체(Rip and Replace)를 검토하고 있는 것으로 전해졌다. 화웨이와 ZTE 등 중국산 장비에 대한 각국의 제재 및 퇴출 움직임의 연장선상에 있는 사안이다. 인도 시장에서 중국산 장비가 실제로 퇴출될 경우 에릭슨, 노키아 등 글로벌 통신장비 경쟁사들의 수혜가 예상된다. 이는 글로벌 통신장비 시장의 판도를 바꿀 수 있는 중대한 규제 이슈다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도 중국산 통신장비 퇴출 검토"}, {"title": "Nokia opens Saudi Arabia R&D centre - mobileworldlive.com", "summary": "노키아가 사우디아라비아에 AI 기반 네트워크 자동화 연구개발 센터를 설립했다. 중동 지역 통신 인프라 고도화와 AI 네트워크 시장 선점을 위한 거점 역할을 수행할 예정이다. 경쟁사의 주요 R&D 투자 확대 발표로서 업계의 주목을 받는다. 글로벌 장비사들의 중동 시장 공략 경쟁을 보여주는 사례다.", "source": "mobileworldlive.com", "date": "2026-09-02 21:07", "url": "https://www.mobileworldlive.com/nokia/nokia-opens-saudi-arabia-rd-centre/", "category": "tech", "importance": 5, "wl": false, "topic": "노키아 사우디아라비아 r&d센터 개소"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 6G와 AI 기능이 결합된 '드론 실시간 추적' 통신 기술을 공개할 예정이다. 한국 정부와 국내 통신사를 상대로 차세대 기술력을 적극 알리고 협력 방안을 모색한다. 글로벌 통신장비 경쟁사의 기술 리더십 강화 행보다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 6g 드론 기술"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI 랜(AI-RAN), ISAC, 6G로 이어지는 차세대 네트워크 기술 리더십을 강조했다. 에릭슨은 AI 시대의 경쟁력이 네트워크에서 시작된다며 국내 파트너들과의 협력을 다지고 있다. 주요 경쟁사의 최신 기술 전략 발표로 중요도가 매우 높다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 ai-ran 6g"}, {"title": "에릭슨코리아, AI 기반 통신망· 6G 기술 로드맵 공개", "summary": "에릭슨코리아가 '이노베이션 데이 2026 코리아'를 개최하고 AI 기반 통신망 발전 전략과 6G 기술 로드맵을 전격 공개했다. 국내 주요 통신사와 산업계 관계자들이 대거 참석하여 차세대 네트워크 진화 방향을 공유했다.", "source": "biz.heraldcorp.com", "date": "2026-09-02 16:10", "url": "https://biz.heraldcorp.com/article/10860523?ref=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨코리아 6g 로드맵"}, {"title": "에릭슨 코리아, ‘Ericsson Innovation Day 2026 Korea’ 개최…AI 시대 네...", "summary": "에릭슨이 MWC 2026 주요 기술과 국내 5G SA, 5G Advanced, AI 및 6G 기술 진화 방향을 공유하는 행사를 열었다. 글로벌 통신장비 시장을 주도하는 에릭슨의 최신 비전이 국내 파트너들에게 소개되었다.", "source": "segye.com", "date": "2026-09-02 16:09", "url": "https://www.segye.com/newsView/20260902515277?OutUrl=naver", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨코리아 이노베이션데이"}, {"title": "에릭슨코리아 \"AI-RAN·ISAC로 6G 네트워크 전환 앞당길 것\"", "summary": "에릭슨코리아가 미디어 브리핑을 통해 AI-RAN과 ISAC 중심의 6G 네트워크 전환을 앞당기겠다고 선언했다. 150년 역사의 통신장비 강자가 제시하는 차세대 망 진화 방향이 업계의 이목을 집중시키고 있다.", "source": "aitimes.com", "date": "2026-09-02 15:08", "url": "https://www.aitimes.com/news/articleView.html?idxno=214748", "category": "tech", "importance": 5, "wl": false, "topic": "아시아타임즈 에릭슨 6g 전환"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디아라비아 통신사 stc와 다년간의 5G 네트워크 확장 계약을 체결했다. 이번 계약을 통해 stc의 5G 인프라를 대규모로 업그레이드하고 디지털 전환을 지원하게 된다. 주요 통신사와 장비사 간의 수조 원대 또는 대규모 장비 공급 계약에 해당한다. 글로벌 5G 장비 시장에서 에릭슨의 입지가 더욱 강화될 것으로 보인다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 5, "wl": false, "topic": "에릭슨 stc 5g 계약"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - leadeconomy.co.kr", "summary": "미국의 대중국 화웨이 제재가 완성품을 넘어 부품 공급망 영역까지 본격적으로 확산되면서 국내 장비 및 부품 업체들이 반사이익과 공급망 재편의 기로에 놓였다. 글로벌 통신장비 시장 구도를 바꾸는 주요 제재 이슈에 해당한다. 삼성전자 네트워크사업부의 글로벌 부품 조달 및 경쟁 전략에 중대한 시사점을 준다.", "source": "leadeconomy.co.kr", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 5, "wl": false, "topic": "화웨이 제재 부품 확산"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "에릭슨이 하나의 전파 송출로 데이터 전송과 사물 탐지를 동시에 처리하여 통신용과 레이더용 주파수를 따로 할당할 필요가 없는 6G 신기술을 선보였다. 단일 장비로 두 기능을 수행하는 혁신적 장비 솔루션이다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 5, "wl": false, "topic": "전자신문 에릭슨 6g 주파수"}, {"title": "Samsung wins ZTE 5G patent case, raising difficult questions for UK courts - IAM Patent", "summary": "삼성전자가 ZTE와의 5G 특허 소송에서 승소하며 영국 법원 등 글로벌 법적 공방에 중요한 선례를 남겼다. 이번 판결은 글로벌 통신장비 시장에서 삼성전자의 지적재산권(IP) 보호와 라이선스 협상력 강화에 크게 기여할 것으로 평가된다. 경쟁사와의 특허 분쟁 확정 보도로서 중요도가 매우 높다. 글로벌 장비 제조사 간의 법적·기술적 구도에 중대한 영향을 미친다.", "source": "IAM Patent", "date": "2026-09-01 21:40", "url": "https://www.iam-media.com/article/samsung-wins-zte-5g-patent-case-raising-difficult-questions-uk-courts", "category": "contract", "importance": 5, "wl": false, "topic": "삼성전자 zte 5g 특허 소송 승소"}, {"title": "Qualcomm stakes its claim on an AI-native 6G future - mobileworldlive.com", "summary": "퀄컴이 AI 네이티브 기반의 6G 미래 비전과 기술 로드맵을 공개했다. 차세대 통신 표준 선점을 위한 글로벌 칩 메이커들의 기술 경쟁이 본격화되고 있음을 보여준다. 에릭슨, 노키아 등 통신장비 경쟁사들의 전략에도 직접적인 영향을 미칠 전망이다.", "source": "mobileworldlive.com", "date": "2026-09-01 20:04", "url": "https://www.mobileworldlive.com/qualcomm-stakes-its-claim-on-an-ai-native-6g-future/", "category": "tech", "importance": 5, "wl": false, "topic": "퀄컴 ai 6g"}, {"title": "Huawei Profit Plunges 36% As AI, Chip Investment And Rising Costs Squeeze Margins - Tekedi", "summary": "화웨이의 순이익이 AI 및 칩 투자 확대와 비용 상승의 압박으로 인해 36% 급감했다. 대규모 연구개발 비용 지출과 글로벌 제재 환경이 수익성에 큰 부담으로 작용하고 있음을 보여준다. 주요 경쟁사의 실적 악화 보도로서 업계 판도 분석에 중요한 자료다. 삼성전자 네트워크사업부의 글로벌 경쟁 전략 수립 시 참고할 만한 주요 재무 지표다.", "source": "Tekedia", "date": "2026-09-01 19:49", "url": "https://www.tekedia.com/huawei-profit-plunges-36-as-ai-chip-investment-and-rising-costs-squeeze-margins/", "category": "earnings", "importance": 5, "wl": false, "topic": "화웨이 실적 이익 급감"}, {"title": "India weighs ‘rip and replace’ plan for Chinese telecom gear - Communications Today", "summary": "인도 정부가 자국 통신망에서 중국산 장비를 전면 철거하고 교체하는 '립 앤 리플레이스(Rip and Replace)' 정책 도입을 저울질하고 있다. 이는 글로벌 통신장비 시장에서 화웨이와 ZTE 등 중국산 장비에 대한 안보적 제재 및 퇴출 움직임의 연장선상에 있다. 경쟁사에 대한 각국의 제재 및 반입 금지 조치로 중요도 5점에 해당한다. 삼성전자 등 비중국계 장비사들에게 새로운 시장 기회 요인으로 작용할 전망이다.", "source": "Communications Today", "date": "2026-09-01 19:18", "url": "https://www.communicationstoday.co.in/india-weighs-rip-and-replace-plan-for-chinese-telecom-gear/", "category": "policy", "importance": 5, "wl": false, "topic": "인도 중국산 통신장비 제재"}, {"title": "Ericsson says 5G SA is core network for AI era, sets out foundation for 6G evolution - 디지털", "summary": "에릭슨이 5G 단독모드(SA)가 인공지능(AI) 시대의 핵심 코어망이며 6G 진화의 기반이 된다고 발표했다. 향후 통신망 아키텍처가 AI 중심의 SA 구조로 전환될 것임을 강조하는 전략이다. 경쟁사의 주요 기술 전략 발표에 해당하여 중요도가 높다. 삼성전자 네트워크사업부의 5G SA 및 AI 코어망 솔루션 전략에 시사점을 준다.", "source": "디지털투데이", "date": "2026-09-01 15:31", "url": "https://www.digitaltoday.co.kr/en/view/98844/ericsson-says-5g-sa-is-core-network-for-ai-era-sets-out-foundation-for-6g-evolution", "category": "tech", "importance": 5, "wl": false, "topic": "에릭슨 5g sa ai 시대 코어망"}, {"title": "[AI 고속도로] HPE, AI 서버·네트워킹 수요에 분기 최대 매출…공급 부족은 과제", "summary": "HPE가 인공지능(AI) 서버와 데이터센터 네트워킹 수요 확대에 힘입어 2026 회계연도 3분기 전년 동기 대비 34% 증가한 122억 달러의 사상 최대 분기 매출을 기록했다. 기업들의 AI 인프라 투자가 서버를 넘어 네트워크 장비로 확산되고 있으나 메모리 등 부품 공급 부족이 과제로 지적됐다.", "source": "ZDNet Korea", "date": "2026-09-03 13:30", "url": "https://zdnet.co.kr/view/?no=20260903132838", "category": "earnings", "importance": 4, "wl": true, "topic": "hpe ai 서버 네트워킹 분기 최대 매출"}, {"title": "TSMC 장비 조달 수요, 반년 만에 1.9배 늘어…“팹 20개 동시에 지어도 부족”", "summary": "TSMC가 올해 장비 조달 수요 추정치를 지난해 말 대비 1.9배로 상향 조정했다. 대만과 해외에서 20곳의 팹을 동시에 건설하고 있음에도 고객 수요가 공급을 웃돌고 있다는 설명이다. 반도체 위탁생산 시장에서 첨단 공정 장비 수요가 폭증하고 있음을 보여주는 지표다. 글로벌 반도체 장비 및 공급망 시장에 큰 영향을 미치는 발표다.", "source": "전자신문", "date": "2026-09-03 13:18", "url": "https://www.etnews.com/20260903000214", "category": "earnings", "importance": 4, "wl": true, "topic": "tsmc 장비 조달 수요 증가"}, {"title": "Ericsson powers Saudi Arabia’s next phase of digital transformation and innovation - Tahaw", "summary": "에릭슨이 사우디아라비아의 차세대 디지털 전환과 기술 혁신을 기술적으로 뒷받침하고 있다. 현지 통신사들과의 긴밀한 협력을 통해 국가 단위 프로젝트에 참여한다. 글로벌 장비사의 시장 지배력을 보여준다.", "source": "TahawulTech.com", "date": "2026-09-03 07:04", "url": "https://www.tahawultech.com/home-slide/ericsson-powers-saudi-arabias-next-phase-of-digital-transformation-and-innovation/", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 사우디아라비아 디지털 전환 파트너"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관들이 산업 현장에서의 프라이빗 5G 배치를 촉진하기 위한 새로운 계획을 마련했다. 그러나 업계에서는 여전히 구체적인 주파수 할당 계획이나 명확한 신호가 부족하다는 지적이 나오고 있다. 중국 시장의 특수한 규제 환경과 통신 정책 변화는 글로벌 통신장비 시장 구도에 영향을 미친다. 향후 구체적인 주파수 정책이 수반될지 여부가 관건이다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 4, "wl": true, "topic": "중국 프라이빗 5g 규제 완화"}, {"title": "Ericsson adaptive inventory", "summary": "에릭슨이 인공지능(AI)과 자율주행 네트워크 시대의 요구에 맞춘 '에릭슨 어댑티브 인벤토리(EAI)' 솔루션의 최신 프로필을 공개했다. 이 솔루션은 급변하는 네트워크 환경에서 운영 효율성을 높이고 자율 네트워크 구축을 지원하도록 설계되었다. 주요 통신장비사인 에릭슨의 최신 기술 및 소프트웨어 플랫폼 역량을 보여준다. 자율형 네트워크 전환을 추진하는 통신사들에게 핵심적인 툴로 작용한다.", "source": "RCR Wireless", "date": "2026-09-02 22:50", "url": "https://www.ericsson.com/49d034/assets/local/oss-bss/doc/ericsson-adaptive-inventory.pdf?utm_medium=advertorial&utm_source=RCR-Wireless-&utm_campaign=bcss_Athena2026D1-_bss-oss_23072026_awareness&utm_content=RCR-Wireless-Channel", "category": "tech", "importance": 4, "wl": true, "topic": "에릭슨 어댑티브 인벤토리 솔루션"}, {"title": "Saudi’s ACES announces 5G and 6G partnership with Movandi - Developing Telecoms", "summary": "사우디아라비아의 인프라 기업 ACES가 모반디(Movandi)와 손잡고 5G 및 6G 통신 인프라 협력을 체결했다. 중동 지역의 차세대 무선 통신망 고도화를 목표로 한다. 통신 인프라 분야의 전략적 제휴로 업계 동향 파악에 유용하다.", "source": "Developing Telecoms", "date": "2026-09-02 20:57", "url": "https://www.developingtelecoms.com/regions/central-eastern-europe-telecommunications/20770-saudis-aces-announces-5g-and-6g-partnership-with-movandi.html", "category": "contract", "importance": 4, "wl": false, "topic": "사우디 aces 모반디 5g 6g 파트너십"}, {"title": "HPE scores Wi-Fi and AI goals as 5G and VMware lose out", "summary": "영국 프리미어리그 토트넘 홋스퍼 스타디움이 와이파이 7과 AI 기능이 포함된 HPE의 차세대 네트워크 장비로 멀티미니언 달러 규모의 업그레이드를 거의 완료했다. 이번 구축 과정에서 5G와 VMware 기술은 채택되지 못하고 HPE가 수혜를 입었다. 주요 대형 경기장의 인프라 수주전에서 HPE가 성과를 거둔 사례다. 엔터프라이즈 네트워킹 시장에서 HPE의 기술력과 입지를 보여준다.", "source": "Light Reading", "date": "2026-09-02 15:00", "url": "https://www.lightreading.com/wifi/hpe-scores-wi-fi-and-ai-goals-as-5g-and-vmware-lose-out", "category": "contract", "importance": 4, "wl": true, "topic": "hpe 토트넘 스타디움 와이파이 7 공급"}, {"title": "Nokia partners with Saudi Arabia on network automation R&D - Telecoms", "summary": "노키아가 사우디아라비아와 네트워크 자동화 연구개발 분야에서 손을 잡았다. 중동 지역의 디지털 인프라 고도화를 위한 전략적 협력이다. 경쟁사의 대형 프로젝트 수주 및 거점 확보 성과에 해당한다.", "source": "Telecoms", "date": "2026-09-02 00:05", "url": "https://www.telecoms.com/automation/nokia-partners-with-saudi-arabia-on-network-automation-r-d", "category": "contract", "importance": 4, "wl": false, "topic": "노키아 사우디아라비아 네트워크 자동화 파트너십"}, {"title": "Ericsson and Mobily Partner for AI Networks in Saudi Arabia - intlbm", "summary": "에릭슨이 사우디아라비아 통신사 모빌리(Mobily)와 손잡고 AI 기반 네트워크 구축을 위한 파트너십을 체결했다. 양사는 자율주행 네트워크와 차세대 무선접속망(RAN) 고도화를 위해 협력할 예정이다. 주요 통신사와 장비사 간의 전략적 제휴로 경영진 보고 가치가 높다. 중동 5G 및 AI 네트워크 시장에서의 수주 경쟁력을 보여준다.", "source": "intlbm", "date": "2026-09-01 20:24", "url": "https://intlbm.com/2026/09/01/ericsson-and-mobily-partner-for-ai-networks-in-saudi-arabia/", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 모빌리 파트너십"}, {"title": "[6G격전] ②동맹 없인 미래도 없다 - hansbiz.co.kr", "summary": "6G 통신 표준 선점을 위해 글로벌 기업 간의 기술 동맹과 협력이 필수적이라는 분석 기사다. 차세대 이동통신 시장에서의 경쟁 구도와 협력 전략을 조명한다.", "source": "hansbiz.co.kr", "date": "2026-09-01 15:50", "url": "https://www.hansbiz.co.kr/news/articleView.html?idxno=861251", "category": "tech", "importance": 4, "wl": false, "topic": "6g 격전 동맹 중요성"}, {"title": "ZTE Smart Home and MoraRepublic Expand FWA and FTTH Services in Indonesia - openPR.com", "summary": "ZTE가 인도네시아 시장에서 스마트홈 파트너들과 협력하여 고정무선접속(FWA) 및 광랜(FTTH) 서비스를 대폭 확장한다. 동남아시아 유선 및 무선 초고속인터넷 인프라 시장 공략을 가속화하는 행보이다. 경쟁사의 주요 시장 확장 및 수주 관련 경영진 보고 가치가 있는 소식이다.", "source": "openPR.com", "date": "2026-09-01 14:52", "url": "https://www.openpr.com/news/4618163/zte-smart-home-and-morarepublic-expand-fwa-and-ftth-services", "category": "contract", "importance": 4, "wl": false, "topic": "zte 인도네시아 fwa ftth 확장"}, {"title": "Nokia and BeeHealthy will replace texted codes in healthcare apps with silent phone checks", "summary": "노키아가 비헬시(BeeHealthy)와 협력하여 헬스케어 앱 내에서 문자 인증코드를 무음 전화 확인 방식으로 대체한다. 통신 기술을 활용한 인증 보안 솔루션 개선 사례다. 응용 서비스 다변화 동향을 보여준다.", "source": "Stock Titan", "date": "2026-09-03 14:26", "url": "https://www.stocktitan.net/news/NOK/nokia-and-bee-healthy-bring-network-based-verification-to-digital-5p0m6ga7ntts.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 비헬시 헬스케어 앱 협력"}], "policy": [{"title": "정부 ‘보안 특화 AI’ 개발 사업자로 네이버 컨소시엄 선정 - 동아일보", "summary": "정부가 추진하는 보안 특화 5G SA·6G 투자의 효율성을 높이기 위한 민관의 협력이 강조되고 있다.", "source": "ddaily.co.kr", "date": "2026-09-02 17:44", "url": "https://www.ddaily.co.kr/page/view/2026090217140450475", "category": "policy", "importance": 4, "wl": false, "topic": "디지털데일리 통신사 정책"}, {"title": "[현장] 통신업계 \"네트워크도 AI 인프라로 봐야\"…정책 지원 촉구", "summary": "국회 토론회에서 통신업계가 네트워크를 AI 인프라로 간주하고 6G 등 차세대 망 투자를 위한 정책적 지원을 촉구했다. 통신 수익만으로는 감당하기 힘든 투자를 유도하기 위한 인프라 지원책 마련이 시급하다는 지적이다.", "source": "newspost.kr", "date": "2026-09-02 16:42", "url": "https://www.newspost.kr/news/articleView.html?idxno=225400", "category": "policy", "importance": 4, "wl": false, "topic": "국회 네트워크 ai 지원"}, {"title": "통신3사 \"AI망 지원\" 요구…정부, 세제·규제·AIDC 지원 추진(종합)", "summary": "정부가 5G SA에서 AI-RAN, 6G로 이어지는 네트워크 고도화를 지원하기 위해 세제와 주파수 정책을 손보겠다고 밝혔다. 민관협의체를 통해 통신사의 투자 여력을 높이기 위한 실질적인 방안이 논의 중이다.", "source": "news1.kr", "date": "2026-09-02 16:21", "url": "https://www.news1.kr/it-science/cc-newmedia/6277634", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 ai망 지원"}, {"title": "\"GPU만 쌓아선 AI 3강 못 간다…개방형 AIDC·네트워크 지원해야\"", "summary": "AIDC와 5G·6G 연결망을 국가 전략 시설로 지정하여 세제 및 투자 지원을 확대해야 한다는 주장이 제기됐다. 레거시 망 전환 비용과 차세대 통신망 투자를 연계하는 세제 개편 검토가 요구된다.", "source": "fnnews.com", "date": "2026-09-02 15:56", "url": "https://www.fnnews.com/news/202609021416214484", "category": "policy", "importance": 4, "wl": false, "topic": "파이낸셜뉴스 aidc 네트워크 지원"}, {"title": "학계·업계 \"정부, 통신사 AI NW·DC 투자비 지원 확대해야\"", "summary": "학계와 업계 전문가들이 정부를 향해 통신사의 AI 네트워크 및 데이터센터(DC) 투자 비용 지원을 대폭 확대해달라고 촉구했다. 6G 및 DC 연결망에 대한 정부의 정책적 인센티브가 절실하다는 의견이다.", "source": "techm.kr", "date": "2026-09-02 15:38", "url": "https://www.techm.kr/news/articleView.html?idxno=154867", "category": "policy", "importance": 4, "wl": false, "topic": "테크엠 ai nw dc 지원"}, {"title": "AI 시대 인프라 투자 해법은…\"통신망 투자 유인·AIDC 지원 확대\"", "summary": "연간 수천억 원에 달하는 주파수 할당 대가와 전파사용료 부담을 완화하여 설비투자와 AI 인프라 투자 확대로 이어지도록 제도를 연계할 필요성이 제기됐다. 국회 차원에서 통신사 투자 유인책이 논의되고 있다.", "source": "newstomato.com", "date": "2026-09-02 15:20", "url" ve-charges-allocation-terms/articleshow/133719014.cms", "category": "policy", "importance": 3, "wl": false, "topic": "위성통신 규제"}, {"title": "Senate Panel Pushes For Lower Mobile Phone Taxes To Support 5G Rollout - PhoneWorld", "summary": "파키스탄 상원 패널이 5G 전국 확산을 지원하기 위해 모바일폰 관련 세금 인하를 촉구하고 있다. 통신 인프라 투자를 가속화하기 위한 정부 차원의 세제 혜택 및 규제 완화 필요성이 제기된다. 통신사들의 CAPEX 부담을 완화하는 정책적 지원이 논의되는 중이다.", "source": "PhoneWorld", "date": "2026-09-02 13:54", "url": "https://www.phoneworld.com.pk/senate-panel-lower-mobile-phone-taxes-5g-rollout/", "category": "policy", "importance": 3, "wl": false, "topic": "폰월드 5g 세금 인하"}, {"title": "Foreign Air Carriers To Challenge FCC Altimeters Order - Law360", "summary": "외항사들이 FCC의 고도계 관련 명령에 대해 법적 대응 및 이의 제기를 준비 중이다. 항공 안전과 5G 통신 주파수 간 간섭 문제를 둘러싼 규제 당국과 업계 간의 갈등이 지속되고 있다. 향후 정책 결정에 따라 통신사 투자 방향에 영향이 미칠 수 있다.", "source": "Law360", "date": "2026-09-02 08:16", "url": "https://www.law360.com/articles/2520343/foreign-air-carriers-to-challenge-fcc-altimeters-order", "category": "policy", "importance": 3, "wl": false, "topic": "로앤서티 항공사 fcc"}, {"title": "[인도 특징주] 릴라이언스 지오 IPO 승인 획득...투자자들이 알아야 할 ...", "summary": "인도의 규제 기관들이 라이선스 발급, 주파수 할당, 네트워크 구축 의무 등 통신 부문의 핵심 측면들을 강력하게 감독하고 있다. 릴라이언스 지오 등 현지 사업자들의 컴플라이언스 관리 중요성이 부각된다.", "source": "newspim.com", "date": "2026-09-01 18:59", "url": "https://www.newspim.com/news/view/20260901001226", "category": "policy", "importance": 3, "wl": false, "topic": "뉴스핌 인도 통신 규제"}, {"title": "[속보]티빙 3954만개 계정 정보 유출…탈퇴·휴면 회원까지 털렸다", "summary": "과학기술정보 통신 부는 3일 민관합동조사단의 티빙 침해사고 조사 결과를 발표했다. 유출 계정은 활성... 법정 기한인 사고 인지 후 24시간을 넘겼다. 과기정통부 는 티빙에 최대 3000만원의 과태료를 부과할 예정이다.", "source": "donga.com", "date": "2026-09-03 14:39", "url": "https://www.donga.com/news/Economy/article/all/20260903/134598915/1", "category": "other", "importance": 2, "wl": false, "topic": ""}, {"title": "[속보] 과기부 \"티빙 해킹 공격자 특정 못해\"", "summary": "과학기술정보 통신 부( 과기정통부 )는 3일 티빙 침해사고에 대한 민관합동조사단 조사결과를 통해 티빙 해킹 공격자를 특정하지 못했다고 밝혔다.", "source": "kgnews.co.kr", "date": "2026 납' 제안…첨단산업 전력망 투자재원 조달", "summary": "한국전력이 반도체와 AI 데이터센터 확대로 급증하는 전력망 투자 재원을 조달하기 위해 삼성전자와 SK하이닉스 등 대규모 전력수요 기업에 장래 전기요금을 미리 납부하게 하는 '대규모 전기요금 선납제도'를 제안했다. 한전의 재무 부담을 덜고 기업에게는 안정적인 전력 인프라를 제공하는 방식이다. 첨단 산업의 전력망 구축과 전력 수급 안정을 위한 민관 협력 방안으로 주목받고 있다.", "source": "전자신문", "date": "2026-09-03 10:26", "url": "https://www.etnews.com/20260903000103", "category": "contract", "importance": 4, "wl": true, "topic": "한전 삼성전자 sk하이닉스 전기요금 선납제 추진"}, {"title": "LG·보안업계 뭉친 연합군 통했다…네이버, SKT 꺾고 `K-미토스` 개발 (종합) - 디지털데일리", "summary": "네이버 컨소시엄이 SK텔레콤 컨소시엄을 제치고 정부의 보안 특화 AI 개발 사업인 'K-미토스' 사업자로 최종 선정되었다. 통신사의 AI 국책 사업 수주전 결과다.", "source": "디지털데일리", "date": "2026-09-03 10:16", "url": "https://www.ddaily.co.kr/page/view/2026090310122915637", "category": "contract", "importance": 4, "wl": false, "topic": "sk텔레콤 ai"}, {"title": "네이버, 사우디서 MOU 8건…예약·결제에 우주까지 '슈퍼앱' 확장", "summary": "네이버가 사우디아라비아에서 글로벌 빅테크 및 현지 기관들과 8건의 MOU를 체결하며 슈퍼앱 생태계 구축에 속도를 내고 있다. 사우디 국립주택공사(NHC)와의 합작법인 '네이버 이노베이션'을 필두로 공간정보, 부동산 행정, 예약·결제뿐만 아니라 우주 기술까지 협력 범위를 넓혔다. 네이버의 플랫폼 기술력이 중동 시장에서 인프라 및 스마트시티 구축의 핵심으로 자리잡고 있음을 보여준다.", "source": "전자신문", "date": "2026-09-03 09:38", "url": "https://www.etnews.com/20260903000050", "category": "contract", "importance": 4, "wl": true, "topic": "네이버 사우디아라비아 슈퍼앱 우주 협력 mou"}, {"title": "Spectrum COO Nick Jeffery Touts \"The Great Cable Comeback\" As He Assumes Charter Exec Post", "summary": "케이블 통신사 스펙트럼(Charter)의 COO 닉 제퍼리가 케이블의 부활을 이끌며 경영진으로서의 새로운 역할을 맡았다. 주요 통신사 경영진의 전략 발표 소식이다.", "source": "Deadline", "date": "2026-09-03 01:43", "url": "https://deadline.com/2026/09/charter-spectrum-coo-nick-jeffery-great-cable-comeback-1237064469/", "category": "exec", "importance": 4, "wl": false, "topic": "스펙트럼 닉 제퍼리 최고경영자 복귀"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증 - 조선일보", "summary": "LG유플러스가 연세대학교와 함께 차세대 통신 기술인 AI-RAN(인공지능 무선 접속망) 네트워크 전환 기술 검증에 성공했다. 국내 통신사의 주요 차세대 네트워크 기술 개발 성과다.", "source": "조선일보", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/", "category": "tech", "importance": 4, "wl": false, "topic": "lg유플러스 ai-ran"}, {"title": "DT hires AWS's Jan Hofmeyr as CTO", "summary": "도이체텔레콤이 AWS의 임원인 잔 호프메이어를 2026년 11월 자사 최고기술책임자(CTO)로 영입한다고 밝혔다. 이와 함께 크리스티안 일렉 최고재무책임자(CFO)는 2027년 5월에 퇴임할 예정임을 함께 발표했다. 주요 통신사의 고위 경영진 교체는 향후 기술 전략과 투자 방향성에 큰 영향을 미친다. 이번 인사를 통해 도이체텔레콤은 클라우드 및 네트워크 기술 역량을 강화할 것으로 전망된다.", "source": "Light Reading", "date": "2026-09-02 23:47", "url": "https://www.lightreading.com/broadband/dt-hires-aws-s-jan-hofmeyr-as-cto", "category": "exec", "importance": 4, "wl": true, "topic": "도이체텔레콤 최고기술책임자 영입"}, {"title": "KDDI Achieves World-Leading 3.6 Gbps Outdoor Transmission in 7 GHz Band, a 6G Candidate Sp", "summary": "일본 KDDI가 6G 후보 주파수인 7GHz 대역에서 세계 최고 수준인 3.6Gbps 야외 전송 속도를 달성했다고 발표했다. 차세대 이동통신 주파수 활용 및 기술 검증 실적에 해당한다. 주요 통신사의 네트워크 기술 진화 동향으로 중요도가 높다.", "source": "finance.biggo.com", "date": "2026-09-02 18:28", "url": "https://finance.biggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 7ghz 대역 3.6gbps 달성"}, {"title": "AI 투자 늘리는 통신사…“기지국 중심 CAPEX 지표 보완해야”", "summary": "통신사들이 AI-RAN과 6G 등 차세대 네트워크 투자를 확대하기 위해 기존 기지국 중심의 CAPEX 투자 지표를 보완해야 한다고 목소리를 높이고 있다. 개방형 시설에 대한 세액공제 확대 등 제도적 개선이 논의되고 있다.", "source": "dealsite.co.kr", "date": "2026-09-02 18:18", "url": "https://dealsite.co.kr/articles/168312", "category": "policy", "importance": 4, "wl": false, "topic": "통신사 capex 6g 투자"}, {"title": "[ 6G 격전] ③보안에 사활...양자내성암호로 '리셋'", "summary": "6G 통신 표준화 과정에서 보안의 중요성이 커지면서 양자내성암호(PQC) 기술 도입과 선행 연구가 활발하다. LG전자 등 주요 기업들이 AI 기반 6G 보안 기술 협력을 추진하고 있다.", "source": "hansbiz.co.kr", "date": "2026-09-02 16:08", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=861636", "category": "tech", "importance": 4, "wl": false, "topic": "한스비즈 6g 보안 양자내성"}, {"title": "Charter Communications announces resignation of CFO - Telecompaper", "summary": "미국 대형 케이블 및 통신사 차터 커뮤니케이션스의 최고재무책임자(CFO)가 사임한다고 공식 발표했다. 주요 통신사의 최고경영진 교체 및 이탈은 경영 전략에 영향을 미치는 중요 사안이다.", "source": "Telecompaper", "date": "2026-09-02 16:00", "url": "https://www.telecompaper.com/news/charter-communications-announces-resignation-of-cfo--1581381", "category": "exec", "importance": 4, "wl": false, "topic": "차터 커뮤니케이션스 cfo 사임"}, {"title": "\"HBM·AIDC만 AI 인프라 아냐\"…통신3사 \"네트워크 투자 지원해야\"", "summary": "통신 3사가 AI 기술을 활용해 기지국과 네트워크 서버 간 트래픽을 실시간 분석하는 차세대 통신망 기술의 중요성을 역설했다. 2030년 상용화될 6G를 겨냥한 인프라 선점 경쟁이 본격화되고 있다.", "source": "news1.kr", "date": "2026-09-02 15:09", "url": "https://www.news1.kr/it-science/cc-newmedia/6277550", "category": "tech", "importance": 4, "wl": false, "topic": "뉴스1 6g 네트워크 기술"}, {"title": "[현장] \"컴퓨팅 자원만으론 AI 3강 못 간다\"…AI 네트워크 투자 물꼬 트려면 - 데일리안", "summary": "컴퓨팅 자원 확충을 넘어 AI 3강 도약을 위해 AI 네트워크 투자의 물꼬를 터야 한다는 전문가 현장 진단 보도다. 국내 통신 인프라 및 AI 네트워크 투자 활성화의 필요성을 제기한다.", "source": "데일리안", "date": "2026-09-02 13:58", "url": "https://www.dailian.co.kr/news/view/1685489/%ED%98%84%EC%9E%A5-%EC%BB%B4%ED%93%A8%ED%8C%85-%EC%9E%90%EC%9B%90%EB%A7%8C%EC%9C%BC%EB%A1%A0-AI-3%EA%B0%95-%EB%AA%BB-2026", "category": "tech", "importance": 4, "wl": false, "topic": "ai 네트워크 투자 물꼬 트기"}, {"title": "The Government Saved Vodafone Idea. Can Shah Rukh Khan Make India Choose Vi? - Open Magazi", "summary": "인도 정부의 구제 금융 지원을 받은 보다폰 아이디어(Vi)가 유명 배우 샤룩 칸을 내세워 가입자 확보 마케팅과 대국민 브랜드 캠페인을 펼친다. 인도 통신 시장의 구조조정 및 마케팅 경쟁 구도를 보여준다.", "source": "Open Magazine", "date": "2026-09-02 11:36", "url": "https://openthemagazine.com/branding-marketing-and-advertising/the-government-saved-vodafone-idea-can-shah-rukh-khan-make-india-choose-vi", "category": "contract", "importance": 4, "wl": false, "topic": "인도 정부보다폰아이디어 구제 및 광고"}, {"title": "Charter CFO heading to Google-Blackstone data center JV", "summary": "차터 커뮤니케이션즈의 제시카 피셔 CFO가 오는 10월 15일부로 사임하고 구글과 블랙스톤이 공동 설립한 AI 데이터센터 합작법인으로 이동한다. 해당 합작사는 구글의 커스텀 텐서 처리 장치(TPU)를 활용할 예정이다. 이에 따라 차터는 즉시 후임 CFO 인선 작업에 착수했다. 주요 통신사의 핵심 재무 임원이 AI 및 클라우드 인프라 합작사로 이직하는 것은 통신과 빅테크 간 융합의 흐름을 보여준다.", "source": "Light Reading", "date": "2026-09-02 03:54", "url": "https://www.lightreading.com/cable-technology/charter-cfo-heading-to-google-blackstone-data-center-jv", "category": "exec", "importance": 4, "wl": true, "topic": "차터 커뮤니케이션즈 cfo 구글 합작사 이동"}, {"title": "Charter CFO Jessica Fischer to depart in October - TheDesk.net", "summary": "차터 커뮤니케이션스의 제시카 피셔 CFO가 다가오는 10월에 공식 퇴사할 예정이다. 최고경영진의 퇴임 일정 확정 보도에 해당한다.", "source": "TheDesk.net", "date": "2026-09-02 02:26", "url": "https://thedesk.net/2026/09/charter-cfo-jessica-fischer-to-depart-in-october/", "category": "exec", "importance": 4, "wl": false, "topic": "차터 cfo 10월 사임"}, {"title": "AT&T goes to the mat over Charter's use of 'fiber-powered' label for HFC", "summary": "AT&T가 차터 커뮤니케이션즈를 상대로 혼합광고동축망(HFC)을 통해 제공되는 초고속 인터넷 서비스에 '광섬유 기반(fiber-powered)'이라는 표현을 사용하는 것은 소비자를 오인하게 만드는 허위 광고라며 소송을 제기했다. 이번 소송은 광고 규제 기관의 판정이 내려진 지 수개월 만에 이뤄졌다. 통신사 간 마케팅 용어 및 브랜드 신뢰도를 둘러싼 법적 공방이 가열되고 있다. 통신 시장의 공정 경쟁과 마케팅 규제에 영향을 미치는 사안이다.", "source": "Light Reading", "date": "2026-09-02 00:55", "url": "https://www.lightreading.com/broadband/at-t-goes-to-the-mat-over-charter-s-use-of-fiber-powered-label-for-hfc", "category": "policy", "importance": 4, "wl": true, "topic": "at&t 차터 허위광고 소송"}, {"title": "Charter CFO Jessica Fischer to join Google-Blackstone's TPU neocloud - Data Center Dynamic", "summary": "차터 커뮤니케이션스의 재무 수장인 제시카 피셔 CFO가 구글과 블랙스톤이 합작한 네오클라우드 기업으로 자리를 옮긴다. 주요 통신사 임원의 거취 이동 소식이다.", "source": "Data Center Dynamics", "date": "2026-09-01 22:16", "url": "https://www.datacenterdynamics.com/en/news/charter-cfo-jessica-fischer-to-join-google-blackstones-tpu-neocloud/", "category": "exec", "importance": 4, "wl": false, "topic": "차터 cfo 구글 블랙스톤 네오클라우드 이직"}, {"title": "[인도 특징주] 릴라이언스 지오 IPO 승인 획득…투자자들이 알아야 할 7가지 위험 요소 - 네이트", "summary": "인도의 릴라이언스 지오가 IPO 승인을 획득하며 자금 조달에 나섰다. 방대한 가입자 기반을 가진 대형 통신사의 상장이 통신 시장 투자 구도에 미칠 파장이 클 것으로 예상된다. 향후 5G 및 네트워크 인프라 투자 재원 확보에 탄력이 붙을 전망이다.", "source": "네이트", "date": "2026-09-01 19:01", "url": "https://news.nate.com/view/20260901n35973?mid=n1101", "category": "contract", "importance": 4, "wl": false, "topic": "릴라이언스 지오 ipo"}, {"title": "SKT, AI 자율 네트워크 본격화…장애 예방부터 공공 AI까지 확대 - mstoday.co.kr", "summary": "SK텔레콤이 인공지능(AI)을 활용한 자율 네트워크 운용 체계를 본격화하며 장애 예방부터 공공 서비스까지 영역을 확대하고 있다. 네트워크 운용의 자동화와 지능화를 통해 장애 대응 시간을 획기적으로 단축하고 있다. 통신사들의 AI 기반 인프라 혁신 경쟁을 주도하는 행보로 평가된다.", "source": "mstoday.co.kr", "date": "2026-09-01 16:53", "url": "https://www.mstoday.co.kr/news/articleView.html?idxno=102470", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 자율 네트워크"}, {"title": "5일 걸리던 대응 30분 만에…SKT, AI로 '자율 네트워크' 속도 - 뉴스1", "summary": "SK텔레콤의 AI 기반 자율 네트워크 도입으로 장애 대응 소요 시간이 5일에서 30분 이내로 대폭 단축되었다. 인프라 관리 효율성이 극적으로 개선되면서 운영 비용 절감 효과도 기대된다. 통신망 지능화 트렌드를 선도하는 핵심 성과로 주목받고 있다.", "source": "뉴스1", "date": "2026-09-01 16:04", "url": "https://www.news1.kr/amp/it-science/cc-newmedia/6276310", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 ai 자율 네트워크"}, {"title": "“엔트로픽 지분 8조+AI 기지국…SK텔레콤, 단순 통신주 탈피하고 ‘K-AI 대표주’ 굳히나” - 뉴스퀘스트", "summary": "SK텔레콤이 엔트로픽 지분 투자와 AI 기지국 구축을 통해 단순 통신주를 넘어선 K-AI 대표주로 체질 개선을 시도하고 있다. AI 데이터센터와 통신 네트워크를 결합한 새로운 사업 모델이 주목받고 있다. 통신사의 미래 전략 변화를 보여주는 대표적 사례다.", "source": "뉴스퀘스트", "date": "2026-09-01 14:52", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=300015", "category": "contract", "importance": 4, "wl": false, "topic": "sk텔레콤 ai 지분"}, {"title": "KT, '에이전틱 데이터 플로우'로 AI 에이전트 키운다…'모두의 AI'에도 적용 - v.daum.net", "summary": "KT가 '에이전틱 데이터 플로우' 기술을 도입해 AI 에이전트의 성능을 높이고 자사 '모두의 AI'에도 적용한다.", "source": "v.daum.net", "date": "2026-09-03 14:39", "url": "https://v.daum.net/v/20260903143930048", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai"}, {"title": "국내외 통신사 CAPEX 절감 및 인프라 투자 정체… 통신 장비 테마 약세 흐...", "summary": "국내외 통신사들의 CAPEX 절감과 인프라 투자 정체로 인해 통신장비 테마가 약세를 보이고 있다. 5G 구축을 넘어 데이터센터, 광통신, 위성통신 등 새로운 성장 분야에서의 실제 수주 확보가 중요해졌다. 장비사들의 사업 다각화 압박이 거세지고 있다.", "source": "pinpointnews.co.kr", "date": "2026-09-03 14:18", "url": "https://www.pinpointnews.co.kr/news/articleView.html? <script>
const CAT_LABEL={outage:"통신 장애",contract:"수주/계약",tech:"기술/표준",earnings:"실적",exec:"경영/인사",policy:"정책/규제",other:"기타"};
const SEC_NAME={competitor:"경쟁사",carrier:"통신사",satellite:"위성",policy:"정책·규제",outage:"Outage"};
const TABS=[
  {id:"top",    name:"⭐ 주요·최신",  secs:["competitor","carrier","satellite","policy","outage"], mode:"top"},
  {id:"comp",   name:"🏭 경쟁사",     secs:["competitor"], impN:{competitor:5}},
  {id:"telco",  name:"📡 통신사",     secs:["carrier"],    impN:{carrier:5}},
  {id:"sat",    name:"🛰 위성",       secs:["satellite"],  impN:{satellite:5}},
  {id:"policy", name:"⚖️ 정책·규제",  secs:["policy"],     impN:{policy:5}},
  {id:"outage", name:"🚨 Outage",     secs:["outage"],     impN:{outage:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 회사명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
