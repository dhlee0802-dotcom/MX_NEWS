r Starlink, OneWeb, Jio Satellite", "summary": "통신부(DoT)가 스타링크, 원웹, 지오 위성 등 위성 사업자에 대해 5%의 스펙트럼 요금을 승인할 것으로 보입니다. 또한 국경 도시, 언덕, 섬 등 정부가 고지한 연결이 어려운 지역에 서비스를 제공하는 사업자에 대해서는 1%의 할인도 승인할 가능성이 있습니다. 위성통신 주파수 및 규제 관련 정책 동향입니다.", "source": "Mint", "date": "2026-09-08 23:29", "url": "https://www.livemint.com/industry/telecom/dot-likely-clears-5-spectrum-charge-for-starlink-oneweb-jio-satellite-11788872184649.html", "category": "policy", "importance": 4, "sid": "satellite", "topic": "스타링크 규제"}, {"title": "DoT clears 5% spectrum charge for Starlink, OneWeb, Jio Satellite", "summary": "인도 통신부(DoT)가 스타링크, 원웹, 지오 위성 등 위성 사업자에 대해 5%의 스펙트럼 사용료를 승인했다. 정부가 위성 통신 시장의 공식 허용과 규제 프레임워크를 마련하는 조치다.", "source": "Mint", "date": "2026-09-08 23:29", "url": "https://www.livemint.com/industry/telecom/dot-likely-clears-5-spectrum-charge-for-starlink-oneweb-jio-satellite-11788872184649.html", "category": "policy", "importance": 4, "sid": "satellite", "topic": "인도통신부 위성규제"}, {"title": "Digital Communications Commission approves Trai recommendations on satcom spectrum - The E", "summary": "디지털통신위원회가 위성통신 주파수에 대한 TRAI의 권고안을 승인했다. 인도 시장에서의 위성통신 규제 확정 및 제도 정비 진전이다.", "source": "The Economic Times", "date": "2026-09-08 23:26", "url": "https://m.economictimes.com/industry/telecom/telecom-news/digital-communications-commission-approves-trai-recommendations-on-satcom-spectrum/articleshow/133929645.cms", "category": "policy", "importance": 4, "sid": "policy", "topic": "인도 위성통신 주파수 정책"}, {"title": "Verizon signs new multi-year optical fibre supply deal with Corning - telecompaper.com", "summary": "버라이즌이 코닝과 새로운 다년간의 광섬유 공급 계약을 체결했습니다. 통신망 고도화와 장기적 인프라 확충을 위한 안정적인 자재 조달망을 확보했습니다. 글로벌 통신사의 대규모 장비 및 부품 계약입니다. 네트워크 장비 생태계에 중요한 공급 계약입니다.", "source": "telecompaper.com", "date": "2026-09-08 23:22", "url": "https://www.telecompaper.com/news/verizon-signs-new-multi-year-optical-fibre-supply-deal-with-corning--1582084", "category": "contract", "importance": 4, "sid": "carrier", "topic": "버라이즌 광케이블"}, {"title": "Amaz ellite Broadband For Busin", "summary": "AT&T가 아마존의 저궤도 위성 프로젝트인 '아마존 레오(Amazon Leo)'와 파트너십을 체결하고 기업용 위성 브로드밴드 서비스 확대에 나선다. 양사는 지상망과 위성 통신을 연계하여 원격 및 도서 지역의 기업 고객에게 끊김 없는 고속 연결성을 제공할 계획이다. 이번 협력을 통해 AT&T는 기업용 통신 시장에서의 경쟁력을 한층 더 강화할 것으로 기대된다.", "source": "Stocktwits", "date": "2026-09-08 12:12", "url": "https://stocktwits.com/news-articles/markets/equity/t-amzn-stocks-in-focus-at-and-t-amazon-leo-partner-to-expand-satellite-broadband-for-businesses/cZtE2toRJUv", "category": "contract", "importance": 4, "sid": "satellite", "topic": "at&t 파트너십"}, {"title": "Huawei leads China’s push to break reliance on foreign chip technology", "summary": "화웨이가 해외 반도체 기술 의존도를 낮추기 위해 중국 내 공급망 구축을 주도하고 있습니다. DUV 장비용 부품 생산을 위한 프로젝트 관리자 역할을 수행하며 미국의 수출 통제를 우회하려는 전략을 강화하고 있습니다.", "source": "Financial Times Tech", "date": "2026-09-08 11:57", "url": "https://www.ft.com/content/36333a53-4063-4aad-8df9-8d2f9d0048a3?syn-25a6b1a6=1", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 반도체 기술"}, {"title": "Can Huawei build China’s answer to ASML?", "summary": "화웨이가 미국의 수출 통제를 우회하고 DUV 장비 부품을 조달하기 위해 프로젝트 관리 역할을 수행하며 중국 내 반도체 장비 생태계 구축을 시도하고 있다. 미국의 제재 속에서도 공급망 자립을 위한 다방면의 노력이 지속되고 있다.", "source": "Financial Times Tech", "date": "2026-09-08 11:57", "url": "https://www.ft.com/content/36333a53-4063-4aad-8df9-8d2f9d0048a3?syn-25a6b1a6=1", "category": "tech", "importance": 4, "sid": "competitor", "topic": "화웨이 duv 장비 국산화"}, {"title": "KT, KAIST·다임리서치와 사람 없는 공장 만든다", "summary": "KT가 KAIST 및 다임리서치와 협력하여 로봇 관제 기술에 AI 에이전트와 초저지연 네트워크를 결합한 자율 제조 공장 구현에 나섭니다. 통신사의 네트워크 기술을 활용한 B2B 사업 확장 사례입니다.", "source": "ZDNet Korea", "date": "2026-09-08 11:43", "url": "https://zdnet.co.kr/view/?no=20260908114303", "category": "tech", "importance": 4, "sid": "carrier", "topic": "kt 로봇"}, {"title": "지하철부터 집까지…KT, 4개 그룹사로 무중단 네트워크 가동 - 연합뉴스", "summary": "KT가 그룹 내 4개 전문 계열사와 긴밀히 공조하여 24시간 중단 없는 유무선 통신 네트워크 가동 체계를 구축했다. 전국을 잇는 방대한 광케이블망과 통신 인프라를 안정적으로 사수하기 위한 통합 대응 역량을 강조했다. 국내 통신사의 망 관리 및 안정성 확보 전략이다.", " tries-in-global-6g-security-initiative-14024776.html", "category": "policy", "importance": 4, "sid": "satellite", "topic": "인도 6g 얼라이언스"}, {"title": "Arm, 서버 CPU용 IP '네오버스 CSS N4' 공개", "summary": "Arm이 서버 및 데이터센터용 CPU IP인 '네오버스 CSS N4'를 공개했습니다. 전력 효율 중심의 N시리즈와 성능 중심의 V시리즈 라인업을 강화하며 글로벌 데이터센터 반도체 시장에서의 입지를 넓히고 있습니다.", "source": "ZDNet Korea", "date": "2026-09-08 11:10", "url": "https://zdnet.co.kr/view/?no=20260907180808", "category": "tech", "importance": 4, "sid": "competitor", "topic": "arm 서버"}, {"title": "전 국민 무료 AI 사업자에 SKT·KT·카카오 확정…엔비디아 B200 512장 배정 - AI 매터스", "summary": "전 국민 무료 AI 사업자에 SKT, KT 등이 확정되며 엔비디아 가속기가 배정되었습니다. 통신사의 AI 인프라 사업 확장과 직결되는 정부 지원 프로젝트입니다.", "source": "AI 매터스", "date": "2026-09-08 11:05", "url": "https://aimatters.co.kr/news-report/51182/", "category": "tech", "importance": 4, "sid": "carrier", "topic": "과기정통부 ai사업"}, {"title": "Jio Platforms plans to kick off investor outreach for its IPO next week - Business Standar", "summary": "릴라이언스지오가 다음 주부터 IPO를 위한 투자자 대상 마케팅을 시작할 예정입니다. 인도 통신 시장의 대형 IPO로 업계의 주목을 받고 있습니다.", "source": "Business Standard", "date": "2026-09-08 11:04", "url": "https://www.business-standard.com/markets/ipo/jio-platforms-plans-to-kick-off-investor-outreach-for-its-ipo-next-week-126090800084_1.html", "category": "contract", "importance": 4, "sid": "carrier", "topic": "릴라이언스지오 ipo"}, {"title": "Arm, 모바일용 CSS 2 공개... 말리 GPU에 신경망 가속기 통합", "summary": "Arm이 모바일 기기용 반도체 설계자산 '모바일용 CSS 2'를 공개했습니다. 말리 GPU에 신경망 가속기를 통합하여 온디바이스 인공지능(AI) 처리 능력을 대폭 향상시키며 모바일 칩셋 생태계 공략을 가속화하고 있습니다.", "source": "ZDNet Korea", "date": "2026-09-08 11:00", "url": "https://zdnet.co.kr/view/?no=20260907180713", "category": "tech", "importance": 4, "sid": "competitor", "topic": "arm 모바일"}, {"title": "Supreme Court dismisses ₹363 crore GST demand against Vodafone Idea on tower business sale", "summary": "인도 대법원이 보다폰 아이디어가 타워 사업 매각 과정에서 부과받았던 363억 루피(약 363크로르) 규모의 상품서비스세(GST) 부과 처분을 기각했다. 이번 판결로 재정난을 겪고 있는 보다폰 아이디어는 대규모 세금 부담을 덜게 되었다. 이는 통신사의 재무 건전성 개선과 향후 네트워   ["에릭슨",["ericsson"]],["노키아",["nokia"]],["화웨이",["huawei"]],["zte",[]],["마베니어",["mavenir"]],
  ["라쿠텐",["rakuten"]],["skt",["sk텔레콤","sk telecom"]],["kt",["케이티","korea telecom"]],
  ["lg유플러스",["lgu+","lg uplus","lg u+"]],["버라이즌",["verizon"]],["at&t",["에이티앤티"]],
  ["t모바일",["t-mobile","tmobile"]],["에코스타",["echostar"]],["us cellular",["us셀룰러"]],["차터",["charter"]],
  ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else if(tab.mode==="daily"){
    const days=Object.keys(ARCH).sort().reverse();
    if(!days.length){ html+=block("📅 일자별 중요 기사","0건",""); }
    else{
      if(!archDay||!ARCH[archDay]) archDay=days[0];
      html+=`<div class="subbar">`+days.map(d=>`<div class="rchip${d===archDay?" on":""}" onclick="setArchDay('${d}')">${d.slice(5)}</div>`).join("")+`</div>`;
      html+=`<div class="subbar">`+[["전체",0],["긴급 5점",5],["중요 4점",4]].map(([lb,n])=>`<div class="rchip${n===archImp?" on":""}" onclick="setArchImp(${n})">${lb}</div>`).join("")+`</div>`;
      let items=(ARCH[archDay]||[]).map(a=>({...a,_sid:a.sid}));
      if(archImp) items=items.filter(a=>(a.importance||0)===archImp);
      const lbl=archImp?` (${archImp}점)`:"";
      html+=block("📅 "+archDay+" 중요 기사"+lbl,items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
    }
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
