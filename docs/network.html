mary": "말레이시아 통신사 맥시스(Maxis)가 전국적인 네트워크 인프라 강화를 위해 노키아의 광전송 기술(optical transport technology)을 도입했다. 노키아의 광 네트워크 장비 수주 확정 보도로 경쟁사 실적 관련 중요 소식이다.", "source": "telecomtv.com", "date": "2026-09-04 18:01", "url": "https://www.telecomtv.com/content/access-evolution/maxis-strengthens-its-nationwide-network-infrastructure-with-nokia-s-optical-transport-technology-56172/amp/", "category": "contract", "importance": 4, "wl": false, "topic": "맥시스 노키아 장비 공급"}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - mobileeurope.co.uk", "summary": "노키아가 사우디아라비아에 AI 중심의 연구개발(R&D) 센터를 공식 출범시켰다. 중동 시장 공략과 인공지능 기반 통신 솔루션 개발을 위한 전략적 투자다.", "source": "mobileeurope.co.uk", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 사우디 ai 센터"}, {"title": "Nokia Opens First Saudi Arabia R&D Centre - News Ghana", "summary": "노키아가 사우디아라비아에 첫 번째 연구개발 센터를 열었다. 중동 지역의 디지털 전환과 AI 네트워크 인프라 수요에 대응하기 위한 핵심 거점 구축이다.", "source": "News Ghana", "date": "2026-09-04 14:09", "url": "https://newsghana.com.gh/nokia-opens-first-saudi-arabia-rd-centre/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 사우디 첫 r&d"}, {"title": "Nokia opens new research and development center in Saudi Arabia to accelerate AI-powered n", "summary": "노키아가 사우디아라비아에 새로운 연구개발 센터를 열어 AI 기반 네트워크 가속화에 나선다. 현지 파트너십과 차세대 통신 기술 연구를 위한 거점 마련 소식이다.", "source": "Cyprus Shipping News", "date": "2026-09-04 11:33", "url": "https://cyprusshippingnews.com/2026/09/04/nokia-opens-new-research-and-development-center-in-saudi-arabia-to-accelerate-ai-powered-network-automation/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 사우디 r&d센터"}, {"title": "SoftBank completes stratospheric HAPS trial, eyes 2027 deployment", "summary": "소프트뱅크는 고고도 플랫폼(HAPS)을 활용한 성층권 통신 시험을 고치현 무로토곶 앞바다에서 성공적으로 완료했다. 이번 시험에서는 드론과 에지 컴퓨팅 시스템 간의 원활한 연결성을 검증하기 위한 종합적인 테스트가 진행됐다. 회사는 2027년 상용화를 목표로 기술 완성도를 높여가고 있으며, 사각지대 없는 통신 커버리지 확보를 추진하 le US merger - Telecoms", "summary": "엘리엇 매니지먼트가 도이치텔레콤의 T모바일 US 인수합병 계획에 제동을 걸며 무산을 요구하고 나섰다. 대형 통신사 간 지배구조 및 인수합병을 둘러싼 거대 자본의 갈등이다.", "source": "Telecoms", "date": "2026-09-04 17:33", "url": "https://www.telecoms.com/operator-ecosystem/elliott-wants-to-scuttle-deutsche-telekom-s-t-mobile-us-merger", "category": "other", "importance": 4, "wl": false, "topic": "도이치텔레콤 t모바일 합병"}, {"title": "KDDI achieves 3.6 Gbps outdoor transmission in 7 GHz 6G candidate band - Telecompaper", "summary": "KDDI가 7GHz 대역의 6G 후보 주파수를 이용해 야외 전송 테스트에서 3.6Gbps 속도를 달성했다. 차세대 6G 이동통신 표준화 및 대용량 데이터 전송 기술 확보를 위한 핵심 실증 성과다. 초고속 통신 상용화를 위한 기술 경쟁력이 한층 강화되었다.", "source": "Telecompaper", "date": "2026-09-04 15:31", "url": "https://www.telecompaper.com/news/kddi-achieves-36-gbps-outdoor-transmission-in-7-ghz-6g-candidate-band--1581713", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g 실증"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 릴라이언스 지오는 나브라트디-디왈리 축제 기간에 맞춰 최대 40억 달러 규모의 대형 기업공개(IPO)를 단행할 준비를 하고 있다. IPO 일정이 10월 중순 명절 시기와 맞물릴 경우 로드쇼는 빠르면 다음 주부터 시작될 수 있으며 시장의 큰 기대를 모으고 있다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "contract", "importance": 4, "wl": true, "topic": "지오 4억달러 ipo"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "도이치텔레콤이 대규모 경영진 쇄신의 일환으로 AWS 출신 얀 호프메이어를 영입해 AI 및 네트워크 총괄로 임명했다. 이번 개편은 최고재무책임자(CFO) 퇴임 등 세대교체 성격이 짙다. 차세대 네트워크 인프라 구축에 전사적 역량을 집중하겠다는 의지로 해석된다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 임원 인사"}, {"title": "Elliott Management ance": 3, "wl": false, "topic": "kt ai 개발"}, {"title": "KT, 전사 데이터 활용 체계 ‘에이전틱 데이터 플로우’ 구축…“조직 맥락 이해” - AI타임스", "summary": "KT가 전사 데이터 활용 체계인 '에이전틱 데이터 플로우'를 구축하여 조직 내 맥락 이해도를 높이고 AI 기반 업무 혁신을 추진한다.", "source": "AI타임스", "date": "2026-09-05 10:35", "url": "https://www.aitimes.com/news/articleView.html?idxno=214847", "category": "tech", "importance": 3, "wl": false, "topic": "kt 데이터 체계"}, {"title": "'데이터 무제한'이라더니… \"다 쓰면 400Kbps, 사진 1장 보내기도 버거워\" | - 더퍼블릭", "summary": "무제한 데이터 상품 소진 후 제공되는 속도 제한(QoS) 품질이 실사용에 미치는 불편과 통신 서비스 약관에 대한 소비자 불만을 다룬 기사다.", "source": "더퍼블릭", "date": "2026-09-05 08:43", "url": "https://www.thepublic.kr/news/articleViewAmp.html?idxno=317594", "category": "policy", "importance": 3, "wl": false, "topic": "통신사 데이터 품질 논란"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - 연합뉴스", "summary": "통신사들이 기존 기지국 인프라를 AI 데이터센터(DC) 거점으로 활용하는 등 체질 개선과 새로운 비즈니스 모델 발굴에 나서고 있다. 통신사 인프라 전략 변화를 조명한다.", "source": "연합뉴스", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR20260904023000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 기지국 ai 데이터센터"}, {"title": "LG유플러스, MWC서 AI 보안성 정밀 진단… '글로벌 레드팀 챌린지' 출격 - 데일리뉴스", "summary": "LG유플러스가 MWC 계기로 AI 보안성 정밀 진단을 위한 '글로벌 레드팀 챌린지'에 출격한다. AI 서비스의 신뢰성과 보안 검증 역량을 글로벌 수준으로 높이겠다는 전략이다.", "source": "데일리뉴스", "date": "2026-09-05 06:03", "url": "https://idailynews.co.kr/article/lg%EC%9C%A0%ED%94%8C%EB%9F%AC%EC%8A%A4-mwc%EC%84%9C-ai-%EB%B3%B4%EC%95%88%EC%84%B1-%EC%A0%95%EB%B0%80-%EC%A7%84%EB%8B%A8-%EA%B8%80%EB%A1%9C%EB%B2%8C-%EB%A0%88%EB%93%9C%ED%8C%80-%EC%B1%8C%EB%A6%B0%EC%A7%80-%EC%B6%9C%EA%B2%A9-f98f16dad586d678a551", "category": "tech", "importance": 3, "wl": false, "topic": "lg유플러스 ai 보안"}, {"title": "KDDIが光回線＋5Gの「auひかりプラス」を提供する狙い 光コラボを生かして全国展開も視野に", "summary": "KDDI가 9월 17일 출시하는 'au히かり플러스'는 광회선과 5G SA를 융합해 즉시 개통과 장애 시 자동 백업을 구현한 서비스다. NTT 광콜라보를 적극 활용하고 그룹 내 프로바이더 경쟁을 해소하여 전국적인 사업 효율화와 가입자 확대의 교두보로 삼겠다는 전략이다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedi rks a", "summary": "NTT도코모가 미쓰이부동산의 통신 장비 자회사에 투자하여 고속 네트워크 구축에 협력한다. 부동산 개발과 통신 인프라 투자를 연계하여 도심 내 대용량 통신 환경을 조성할 계획이다. 양사 간의 전략적 제휴로 통신 서비스 영역이 확장되고 있다.", "source": "finance.biggo.com", "date": "2026-09-04 09:06", "url": "https://finance.biggo.com/news/4fe5cb07-5939-4f7f-8954-7c686bca82ca", "category": "contract", "importance": 3, "wl": false, "topic": "ntt도코모 미쓰이부동산 제휴"}, {"title": "AI·6G 투자 시계 빨라진다…통신주 성장 기대감 '쑥'[애널리스트의 시각] - v.daum.net", "summary": "AI와 6G 투자 시계가 빨라지면서 통신주 전반의 실적 성장 기대감이 높아지고 있다. 통신사들의 차세대 네트워크 인프라 투자 방향성과 증권가 시각을 정리했다.", "source": "v.daum.net", "date": "2026-09-04 08:54", "url": "https://v.daum.net/v/20260904085405831?f=p", "category": "tech", "importance": 3, "wl": false, "topic": "통신주 ai 6g 투자"}, {"title": "울산 시내버스 762대 '와이파이7' 달린다…10월부터 서비스", "summary": "시는 이번 사업을 통해 기존 장비 를 모두 철거하고 5G 백홀(Backhaul) 기반의 와이파이7로 통합해 통신 품질을 높이는 동시에 실시간 장애 대응과 유지관리 효율도 개선할 계획이다. 백홀은 통신사 기지국의 네트워크와...", "source": "enewstoday.co.kr", "date": "2026-09-04 08:45", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2466682", "category": "outage", "importance": 3, "wl": false, "topic": ""}, {"title": "Physical AI時代の通信キャリア戦略 「通信インフラ」から現実世界の「神経網」へ - ビジネスネットワーク", "summary": "피지컬 AI 시대에 발맞추어 통신 캐리어가 단순한 통신 인프라 제공자를 넘어 현실 세계의 신경망 역할을 수행해야 한다는 전략적 방향성이 제시됐다. 네트워크가 AI와 결합하여 고도화되는 산업 트렌드를 반영한다.", "source": "ビジネスネットワーク", "date": "2026-09-04 07:12", "url": "https://businessnetwork.jp/article/35578/", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 물리 ai 전략"}, {"title": "T-Mobile taps former Shell CFO Jessica Uhl to help steer next phase of AI and enterprise g", "summary": "T-모바일이 전 셸(Shell) CFO인 제시카 울(Jessica Uhl)을 새 최고재무책임자(CFO)로 영입해 AI 및 엔터프라이즈 사업 성장을 지원토록 했다. 주요 통신사 경영진 교체 소식이다.", "source": "Fierce Network", "date": "2026-09-04 07:07", "url": "https://www.fierce-network.com/wireless/t-mobile-names-jessica-uhl-next-cfo", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 신임 cfo"}, {"title": "これが日本上空を飛ぶ「HAPS」、ソフトバンクが写真公開 スマホ通信試験に成功 - au   ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
