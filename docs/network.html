  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}

  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

iggo.com/news/7075d7ba-ff88-4365-8b22-6bff4412f1af", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g 주파수 검증"}, {"title": "우주항공청, 내년 예산 1조6491억…5290억 증액", "summary": "우주항공청의 내년 예산이 대폭 증액된 가운데 저궤도 위성 통신 기술개발에 205억 원이 편성됐다. KPS 개발 및 우주 AI 데이터센터 핵심기술 개발과 함께 국가 우주 인프라 투자가 본격화된다.", "source": "gndomin.com", "date": "2026-09-02 18:14", "url": "http://www.gndomin.com/news/articleView.html?idxno=487739", "category": "policy", "importance": 4, "wl": false, "topic": "우주항공청 내년 예산 증액"}, {"title": "대한항공 기내서 ‘공짜 와이파이’...9월 스타링크 도입 - 매일경제", "summary": "대한항공이 기내 와이파이 서비스 품질 향상을 위해 9월부터 스타링크 저궤도 위성통신을 도입한다. 항공기 내 통신 환경이 대폭 개선될 예정이며, 저궤도 위성 서비스의 상용화 적용 시장이 빠르게 넓어지고 있다.", "source": "매일경제", "date": "2026-09-02 14:32", "url": "https://www.mk.co.kr/news/business/12142298", "category": "tech", "importance": 4, "wl": false, "topic": "대한항공 스타링크 도입"}, {"title": "에이스테크, 항우연 저궤도 위성통신 핵심 안테나 개발 수주 - 머니투데이 - mt.co.kr", "summary": "에이스테크가 한국항공우주연구원으로부터 저궤도 위성통신용 핵심 안테나 개발 사업을 수주했다. 위성통신 및 방산 분야로 사업 영역을 확장하는 중요한 계기가 된다. 자체 기술 경쟁력을 바탕으로 우주 통신 시장 진출을 가속화하고 있다.", "source": "mt.co.kr", "date": "2026-09-02 13:57", "url": "https://www.mt.co.kr/stock/2026/09/02/2026090213353698193", "category": "contract", "importance": 4, "wl": false, "topic": "에이스테크 위성 안테나 수주"}, {"title": "인텔리안테크, 美 공장 첫 출하…북미 위성통신 공급망 가동 - 전자신문", "summary": "인텔리안테크가 미국 공장에서 첫 제품을 출하하며 북미 위성통신 공급망 가동을 본격화했다. 현지 위성 안테나 수요 급증에 대응하기 위한 생산 거점 확보의 결과다. 글로벌 위성통신 시장에서의 점유율 확대가 기대된다.", "source": "전자신문", "date": "2026-09-02 11:15", "url": "https://www.etnews.com/20260902000178", "category": "contract", "importance": 4, "wl": false, "topic": "인텔리안테크 미국 공장"}, {"title": "Sceye and SoftBank Corp. Complete Stratospheric Connectivity Demonstration in Japan, Advan", "summary": "소프트뱅크가 성층권 통신 플랫폼 시연을 성공적으로 완료하며 위성통신과 결합한 광역 커버리지 기술의 가능성을 입증했다. 차세대 공중 및 우주 통신 인프라 구축을 위한 주요 실증 사례다.", "source": "TradingView", "date": "2026-09-02 09:00", "url": "https://www.tradingview.com/news/prnewswire:eea940605e001:0-sceye-and-softbank-corp-complete-s 221", "category": "tech", "importance": 3, "wl": false, "topic": "비쉐이 박막 고주파 칩 저항기"}, {"title": "위성 170만기 시대 온다는데… 지구 궤도 ‘우주 교통’ 비상", "summary": "스타링크 등 대규모 위성망 확대로 지구 저궤도 혼잡이 가속화되고 우주 쓰레기와 전파 주파수 혼잡 심화 가능성이 제기됐다. 미국천문학회 등의 우주 교통 관리 경고를 다룬다.", "source": "biz.chosun.com", "date": "2026-09-03 06:01", "url": "https://biz.chosun.com/science-chosun/science/2026/09/03/7HRPQEAE5FHHXAF2BWQ43KGSE4/?utm_source=naver&utm_medium=original&utm_campaign=biz", "category": "tech", "importance": 3, "wl": false, "topic": "스타링크 저궤도 혼잡 우려"}, {"title": "우크라이나 전 장관 방산 창업… 팔란티어 CEO가 투자 주도", "summary": "우크라이나 전 장관이 방산 창업에 나선 가운데 팔란티어 CEO가 투자를 주도했다. 러시아군의 위성 인터넷 이용을 차단한 스타링크의 조치가 높게 평가받았다.", "source": "g-enews.com", "date": "2026-09-03 03:30", "url": "https://www.g-enews.com/view.php?ud=2026090220433795502bd56fbc3c_1", "category": "contract", "importance": 3, "wl": false, "topic": "우크라이나 전 장관 방산 창업"}, {"title": "저궤도 붐비자… 우주 쓰레기 늘고, 교통체증도", "summary": "스타링크 등 수천 기 규모의 대규모 저궤도 위성망 등장으로 우주 쓰레기와 교통체증이 심화되고 있다. 스페이스X의 로켓 발사 횟수 급증과 함께 우주 환경 관리의 중요성이 부각된다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/P75B75JQ6RGGJFUYQ7FOD7VYTU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 우주 쓰레기 증가"}, {"title": "안보 위협하는 신흥기술…중견국 리더십 발휘해야 [왜냐면]", "summary": "인공지능 도입이 저궤도 위성의 군사화와 무기화를 가속화하고 있다. 사이버 공격을 감행하는 에이전트 AI의 위협 속에서 신흥기술에 대한 중견국 리더십 발휘가 주문된다.", "source": "hani.co.kr", "date": "2026-09-02 19:08", "url": "https://www.hani.co.kr/arti/opinion/because/1275953.html", "category": "tech", "importance": 3, "wl": false, "topic": "인공지능 저궤도 위성 군사화"}, {"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 AI 네이티브 네트워크를 중심으로 통신 밸류체인을 재편할 6G의 세 가지 핵심 기조를 발표했다. 차세대 무선 통신 기술 표준 선점을 위한 전략이다.", "source": "finance.biggo.com", "date": "2026-09-02 16:40", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 3, "wl": false, "topic": "퀄컴 6g 비전 발표"}, {"title": "전쟁의 패러다임 변화: 초고속 데이터 주도형 전쟁 [박찬근의 미래전 이...", "summary": "개방형 모듈식 아키텍처 규격을 도입해 저궤도 위성 통신 모듈을 무기체계에 신속하게 탑재할 수 있는 유연한 생태계 조성이 강조됐다. 미래전의 초고속 데이터 주도권 확보 방안을 다룬다.", "source": "sedaily.com", "date": "2026-09-02 16:04", "url": "https://www.sedaily.com/article/20086371?ref=naver", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 통신 모듈 무기체계 적용"}, {"title": "인텔리안테크, 美생산공장 가동…게이트웨이 안테나 첫 출하", "summary": "인텔리안테크가 북미 생산공장을 가동하고 게이트웨이 안테나를 첫 출하했다. LEO 및 GEO 위성 인프라 확대에 대응하여 차세대 위성 통신 고주파 대역 대응 능력을 확보했다.", "source": "zdnet.co.kr", "date": "2026-09-02 15:23", "url": "https://zdnet.co.kr/view/?no=20260902152242", "category": "contract", "importance": 3, "wl": false, "topic": "인텔리안테크 북미 생산공장 가동"}, {"title": "스페이스X, AI 데이터센터 수장 교체…인력 이탈·장애 속 운영 안정화 총력 - 디지털투데이", "summary": "스페이스X가 AI 데이터센터 사업부의 수장을 교체하고 인력 이탈 및 네트워크 장애 등의 과제 속 운영 안정화에 나섰다. 위성통신과 결합된 인프라 사업의 내실을 다지기 위한 조치다.", "source": "디지털투데이", "date": "2026-09-02 14:04", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=697624", "category": "tech", "importance": 3, "wl": false, "topic": "스페이스x 임원 교체"}], "competitor": [{"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도 정부가 국가 안보 우려를 이유로 기존에 설치된 중국산 통신 장비를 교체하는 방안을 검토 중입니다. 이는 주요국 정부 차원의 중국산 장비 퇴출 움직임의 일환으로, 화웨이와 ZTE 등 글로벌 경쟁사들의 입지에 타격을 줄 전망입니다. 향후 인도 통신 시장의 장비 공급망이 대대적으로 재편될 것으로 보입니다. 이는 삼성전자를 비롯한 비중국계 통신장비 제조사들에게 중요한 사업적 기회가 될 수 있습니다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도 중국산 장비 퇴출"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디 STC와 다년간의 5G 네트워크 확장 계약을 체결했다. 이번 계약을 통해 STC는 사우디 전역의 5G 커버리지와 성능을 대폭 강화할 예정이다. 에릭슨은 중동 통신 시장에서의 대규모 수주를 통해 확고한 입지를 재확인했다. 글로벌 장비 시장의 수주 경쟁 구도에 중요한 영향을 미칠 전망이다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 5, "wl": false, "topic": "에릭슨 사우디 수주"}, {"title": "삼성물산, 스웨덴 SMR 사업 전략적 파트너 선정…유럽 교두보 확보", "summary": "삼성물산이 스웨덴 소형모듈원자로(SMR) 신규 원전 사업의 전략적 파트너로 선정되었습니다. GVH와 공동 EPC로 참여하여 소형모듈원자로 4기를 건설할 예정입니다. 이번 선정은 유럽 친환경 에너지 인프라 시장 진출을 위한 중요한 교두보를 마련한 성과입니다. 글로벌 엔지니어링 및 플랜트 시장에서의 삼성물산의 경쟁력을 보여주는 대형 딜입니다.", "source": "매일경제 IT", "date": "2026-09-03 16:26", "url": "https://www.mk.co.kr/news/realestate/12143496", "category": "contract", "importance": 4, "wl": true, "topic": "삼성물산 스웨덴 smr 파트너 선정"}, {"title": "Telstra deploys Ericsson AI scheduler nationwide to boost mobile performance - telecompape", "summary": "텔스트라가 에릭슨의 AI 기반 스케줄러를 전국망에 도입하여 모바일 성능을 향상했다. AI 스케줄러는 네트워크 트래픽을 실시간으로 분석하여 자원을 효율적으로 배분하는 기능을 수행한다. 이를 통해 사용자 경험을 개선하고 네트워크 운영 비용을 절감하는 효과를 거두고 있다. 글로벌 통신사의 장비 도입 및 네트워크 고도화 사례로 평가된다.", "source": "telecompaper.com", "date": "2026-09-03 14:48", "url": "https://www.telecompaper.com/news/telstra-deploys-ericsson-ai-scheduler-nationwide-to-boost-mobile-performance--1581561", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 텔스트라 공급"}, {"title": "Nokia opens Saudi Arabia R&D centre - Mobile World Live", "summary": "노키아가 사우디아라비아 리야드에 새로운 R&D 센터를 개소했다. 이 센터는 AI 기반 네트워크 자동화 기술 개발에 집중할 예정이다. 사우디의 디지털 인프라 구축을 지원하고 현지 기술 생태계와의 협력을 강화하려는 전략이다. 중동 지역에서의 입지 강화를 위한 포석으로 해석된다.", "source": "Mobile World Live", "date": "2026-09-02 21:07", "url": "https://www.mobileworldlive.com/nokia/nokia-opens-saudi-arabia-rd-centre/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 사우디 r&d"}, {"title": "Saudi’s ACES announces 5G and 6G partnership with Movandi - Developing Telecoms", "summary": "사우디 ACES가 모반디와 5G 및 6G 기술 파트너십을 체결했다. 차세대 통신 인프라 구축을 위한 협력으로 중동 지역의 기술 고도화가 예상된다. 국내 관련 부품 및 장비 기업들의 시장 참여 기회도 확대될 전망이다.", "source": "Developing Telecoms", "date": "2026-09-02 20:57", "url": "https://developingtelecoms.com/regions/middle-east-north-africa-telecommunications/20770-saudis-aces-announces-5g-and-6g-partnership-with-movandi.html", "category": "contract", "importance": 4, "wl": false, "topic": "사우디 aces 파트너십"}, {"title": "에릭슨, 연말 한국서 ‘드론 실시간 추적’ 통신 기술 공개", "summary": "에릭슨이 연말 한국에서 드론 실시간 추적 통신 기술을 공개할 예정이다. 한국 정부와 국내 기업을 대상으로 6G, AI, ISAC 기술 결합에 따른 효율성 개선 비전을 제시한다. 글로벌 경쟁사의 국내 기술 마케팅 및 협력 행보를 보여준다.", "source": "sedaily.com", "date": "2026-09-02 17:47", "url": "https://www.sedaily.com/article/20086435?ref=naver", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 드론 실시간 추적 기술"}, {"title": "Ericsson to Unveil Drone-Tracking Network Tech in Korea - en.sedaily.com", "summary": "에릭슨이 한국에서 드론 추적 네트워크 기술을 공개할 예정이다. 5G 네트워크를 활용하여 드론의 위치를 정밀하게 파악하고 제어하는 기술이다. 향후 드론 산업 및 보안 분야에서의 활용 가능성을 타진한다. 국내 시장에서의 기술력 각인을 위한 행보다.", "source": "en.sedaily.com", "date": "2026-09-02 17:46", "url": "https://en.sedaily.com/technology/2026/09/02/ericsson-to-unveil-drone-tracking-network-tech-in-korea", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 한국 기술 공개"}, {"title": "에릭슨, AI-RAN·ISAC으로 6G 청사진 제시", "summary": "에릭슨 코리아가 AI-RAN, ISAC, 6G로 이어지는 차세대 네트워크 기술 청사진을 제시했다. AI 시대 네트워크 경쟁력 확보를 위해 국내 고객 및 파트너와의 협력을 강조했다. 글로벌 장비사의 차세대 기술 리더십 전략을 담고 있다.", "source": "it.chosun.com", "date": "2026-09-02 17:22", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169352", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 ai-ran isac 청사진"}, {"title": "에이스테크놀로지, 항우연 저궤도 위성 통신 핵심 안테나 개발 수주", "summary": "에이스테크놀로지가 한국항공우주연구원의 저궤도 위성 통신 자립화 사업에서 지상국용 ESA(능동위상배열안테나) 개발을 수주했다. 국내 통신부품 업체의 위성 지상국 안테나 핵심 기술 개발 계약이다.", "source": "metroseoul.co.kr", "date": "2026-09-02 16:38", "url": "http://www.metroseoul.co.kr/article/20260902500539", "category": "contract", "importance": 4, "wl": false, "topic": "에이스테크 항우연 저궤도 위성 수주"}, {"title": "통신사도 통신장비도 AI로 달라진다…통신망 운영의 새 기준은 '예측'", "summary": "국내 통신사들이 AI를 활용한 네트워크 예측 시스템을 도입하는 가운데, 에릭슨과 노키아 등 글로벌 통신장비 업체들도 AI 기반 네트워크 운영 솔루션을 강화하고 있다. AI 기반 네트워크 자율 운영은 통신장비 업계의 핵심 경쟁력으로 부각되고 있다.", "source": "popcornnews.net", "date": "2026-09-02 15:50", "url": "http://www.popcornnews.net/news/articleView.html?idxno=131622", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 노키아 ai 네트워크 운영"}, {"title": "가성비 중국폰 옛말… 화웨이 ·샤오미 메모리난에 가격 일제히 올려", "summary": "중국 통신장비 업체 화웨이의 상반기 매출은 증가했으나 순이익은 연구개발 비용 확대와 메모리 가격 상승으로 인해 36% 감소했다. 메모리난 속에서 제품 가격 인상 조치도 단행했다. 글로벌 경쟁사의 실적 및 원가 압박을 보여준다.", "source": "sedaily.com", "date": "2026-09-02 06:01", "url": "https://www.sedaily.com/article/20086004?ref=naver", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 상반기 실적 및 가격"}, {"title": "Nvidia tips $3.5B into MediaTek in latest tech partnership", "summary": "엔비디아가 미디어텍과 데이터 센터 생태계 협력을 강화하며 35억 달러 규모의 채권 매입을 약속했습니다. 양사의 기술 파트너십은 AI 인프라 시장에서의 경쟁력을 높이기 위한 전략적 행보입니다. 대규모 자본 투입과 기술 결합은 관련 생태계에 큰 파급효과를 낳습니다. AI 및 반도체, 네트워크 인프라 전반의 경쟁 구도에 영향을 미치는 중요 딜입니다.", "source": "Light Reading", "date": "2026-09-02 00:21", "url": "https://www.lightreading.com/finance/nvidia-tips-3-5b-into-mediatek-in-latest-tech-partnership", "category": "contract", "importance": 4, "wl": true, "topic": "엔비디아 미디어텍 협력"}, {"title": "기지국이 드론까지 잡는다…에릭슨이 꺼낸 6G 통신 신기술", "summary": "에릭슨이 전파 송출 한 번으로 데이터 전송과 사물 탐지를 동시에 처리하는 6G 통신 신기술을 선보였다. 통신용과 레이더용 주파수를 따로 할당할 필요가 없어 주파수 효율성이 극대화된다. 경쟁사의 차세대 무선 통신 기술 혁신 사례이다.", "source": "thelec.kr", "date": "2026-09-01 23:14", "url": "https://www.thelec.kr/news/articleView.html?idxno=61661", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 통신 신기술"}, {"title": "Nokia Bell Labs sees bells toll in downsizing and wind-down of future network vision - SDx", "summary": "노키아 벨연구소가 미래 네트워크 비전 사업을 축소하고 인력 구조조정을 단행했다. 이는 노키아의 비용 절감 및 사업 효율화 전략의 일환으로 해석된다. 향후 연구개발 방향을 핵심 경쟁력 분야로 집중하려는 움직임으로 분석된다. 글로벌 통신장비 시장의 경쟁 심화 속에서 내실 다지기에 나선 모습이다.", "source": "SDxCentral", "date": "2026-09-01 23:01", "url": "https://www.sdxcentral.com/news/nokia-bell-labs-sees-bells-toll-in-downsizing-and-wind-down-of-future-network-vision/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 구조조정"}, {"title": "The era of AI-native RAN starts now - Nokia", "summary": "노키아가 AI 네이티브 RAN 시대의 개막을 선언하며 관련 비전과 기술 방향성을 제시했다. 무선접속망에 인공지능을 심층 결합하여 성능을 극대화하는 전략이다. 차세대 통신 장비 시장에서의 기술 우위를 확보하기 위한 포석이다.", "source": "Nokia", "date": "2026-09-03 21:03", "url": "https://www.nokia.com/blog/the-era-of-ai-native-ran-starts-now/", "category": "other", "importance": 3, "wl": false, "topic": "노키아 ai 네트워크"}, {"title": "Nokia and BeeHealthy target healthcare with network verification - Telecoms", "summary": "노키아가 비헬시와 손잡고 네트워크 검증 기술을 기반으로 헬스케어 시장을 공략한다. 통신 기술과 디지털 헬스케어의 융합을 통한 신규 서비스 모델 개발이다. 통신 장비 기업의 타 산업 진출 사례다.", "source": "Telecoms", "date": "2026-09-03 19:24", "url": "https://www.telecoms.com/network-software/nokia-and-beehealthy-target-healthcare-with-network-verification", "category": "other", "importance": 3, "wl": false, "topic": "노키아 헬스케어 협력"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "바이트댄스가 중국 네이멍구에 대규모 AI 데이터센터 건설을 추진한다. 화웨이를 비롯한 통신장비 및 빅테크 기업들이 해당 지역에 컴퓨팅 시설 투자를 진행해 왔다. 대형 데이터센터 인프라 투자 동향이다.", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "contract", "importance": 3, "wl": false, "topic": "바이트댄스 네이멍구 데이터센터"}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "우리넷이 국책과제로 개발한 16Tbps급 네트워크 장비를 실제 환경에서 검증하며 상용화에 나섭니다. NIA의 AI 네트워크 장비 시범 도입 사업 주관기관으로 선정되어 성능과 안정성을 입증할 계획입니다. 국내 중소 통신장비 업체의 고속 네트워크 장비 상용화 추진 사례입니다. 국산 장비의 AI 네트워크 시장 진입 가능성을 보여줍니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "contract", "importance": 3, "wl": true, "topic": "우리넷 ai 네트워크 상용화 시험"}, {"title": "NC AI, LG전자와 자율형 휴머노이드 개발…인간 동작 로봇에 이식", "summary": "NC AI와 les-recycling-of-nearly-5000-metric-tons-of-e-waste-in-saudi-arabia-475351", "category": "other", "importance": 3, "wl": false, "topic": "에릭슨 친환경 경영"}, {"title": "Volkswagen to make way for Nokia in Euro Stoxx 50 - Traders Union", "summary": "폭스바겐이 물러나고 노키아가 유로 스톡스 50 지수에 편입되는 내용의 증권가 소식이다. 유럽 시장에서 통신 장비 섹터의 비중 변화를 보여준다.", "source": "Traders Union", "date": "2026-09-02 17:30", "url": "https://tradersunion.com/news/companies/show/3189297-volkswagen-to-make/", "category": "other", "importance": 3, "wl": false, "topic": "노키아 주가지수 편입"}], "policy": [{"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 화웨이 제재가 부품 공급망까지 확대되면서 국내 장비 업체들에 미칠 영향이 주목된다. 중국산 장비 퇴출 기조가 강화됨에 따라 국내 부품사들에게 반사이익 또는 공급망 재편 기회가 제기된다. 규제 환경 변화에 따른 국내 기업들의 대응 전략이 요구된다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 4, "wl": false, "topic": "미국 화웨이 제재 부품"}, {"title": "GAO issues broadband program to-dos for FCC, NTIA", "summary": "미국 회계감사원(GAO)은 연방 광대역 프로그램의 현황을 평가하고, FCC와 NTIA에 광대역 매핑 데이터의 정확성 및 프로그램의 지속 가능성을 개선하기 위한 구체적인 권고안을 제시했습니다. 통신 인프라 확대를 위한 정부 지원 사업의 효율성을 높이기 위한 조치입니다. 향후 미국 내 광대역 통신망 구축 사업의 관리 체계가 강화될 것으로 보입니다. 이는 통신 사업자들의 보조금 활용 및 인프라 투자 계획에도 적지 않은 영향을 미칠 전망입니다.", "source": "Light Reading", "date": "2026-09-03 21:00", "url": "https://www.lightreading.com/broadband/gao-issues-broadband-program-to-dos-for-fcc-ntia", "category": "policy", "importance": 3, "wl": true, "topic": "미국 회계감사원 정책 권고"}, {"title": "미국 정부, AI 저작권 소송서 오픈AI 지지…\"학습 제한하면 혁신 저해\"", "summary": "미국 정부가 인공지능(AI) 학습과 저작권을 둘러싼 법적 공방에서 오픈AI 측 주장을 지지하고 나섰습니다. 저작권 규제로 AI 개발을 제한할 경우 미국의 기술 발전과 산업 경쟁력을 떨어뜨릴 수 있다는 판단입니다. 트럼프 행정부는 NYT의 소송에 대해 오픈AI를 지지하는 의견서를 제출했습니다. AI 기술 육성을 위한 미국 정부의 규제 완화 기조를 보여줍니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:28", "url": "https://zdnet.co.kr/view/?no=20260903171308", "category": "policy", "importance": 3, "wl": true, "topic": "미국 정부 오픈ai 저작권 소송 지지"}, {"title": "Satcom spectrum fee: DCC may soon decide airwave charges, allocation terms", "summary": "인도 정부가 위성통신 주파수 요금 및 할당 조건을 곧 결정할 예정입니다. 현재 정지궤도 위성 네트워크만 서비스가 허용되고 있으나, 향후 정책 변화에 따라 시장 환경이 달라질 전망입니다. 인도 위성통신 시장의 규제 및 제도 정비 움직임입니다. 향후 글로벌 위성 사업자들의 인도 진출에 큰 영향을 미칠 사안입니다.", "source": "ET Telecom", "date": "2026-09-03 11:10", "url": "https://telecom.economictimes.indiatimes.com/news/portal-in-portal/satcom/satcom-spectrum-fee-dcc-may-soon-decide-airwave-charges-allocation-terms/133723333", "category": "policy", "importance": 3, "wl": true, "topic": "인도 위성통신 주파수 정책"}, {"title": "보안 특화모델 참여 보안기업들 \"역할 아직 분배 안해\"", "summary": "과기정통부의 '사이버 보안 특화 AI 파운데이션 모델 개발' 사업에 네이버 클라우드 컨소시엄이 최종 선정되었습니다. 아직 세부 역할 분배가 안 된 상태이나 향후 본격적인 개발에 착수할 예정입니다. 정부 주도의 보안 분야 AI 기술 개발 지원 정책입니다. 국내 AI 생태계 강화에 기여할 것으로 보입니다.", "source": "ZDNet Korea", "date": "2026-09-03 19:05", "url": "https://zdnet.co.kr/view/?no=20260903114626", "category": "contract", "importance": 2, "wl": true, "topic": "과기정통부 사이버보안 ai 사업"}, {"title": "\"K-콘텐츠 뿌리는 방송…규제 아닌 전략산업으로”", "summary": "한국방송협회가 제63회 방송의 날 기념식을 열고 방송산업 경쟁력 강화와 규제 개선 필요성을 강조했습니다. 대통령은 방송 자율성 지원과 시대에 맞지 않는 규제 개선 의지를 표명했습니다. 미디어 산업 진흥을 위한 정책적 제언을 담고 있습니다.", "source": "ZDNet Korea", "date": "2026-09-03 19:00", "url": "https://zdnet.co.kr/view/?no=20260903181500", "category": "policy", "importance": 2, "wl": true, "topic": "한국방송협회 방송의날 행사"}, {"title": "KCA, 경기항공고와 AI 정보보호·항공통신 인재 키운다", "summary": "한국방송통신전파진흥원(KCA)이 경기항공고와 협력하여 AI 정보보호 및 항공통신 인재 양성을 위한 교육 프로그램을 운영합니다. 공공기관의 미래 통신 및 보안 인재 육성 활동입니다. 관련 산업의 전문 인력 저변 확대에 기여합니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:47", "url": "https://zdnet.co.kr/view/?no=20260903174740", "category": "contract", "importance": 2, "wl": true, "topic": "kca 경기항공고 인재 양성"}, {"title": "국회, 'AI기본사회법' 발의…공공서비스·국민 권리 강화", "summary": "국민이 AI 공공서비스를 차별 없이 이용하고 AI 판단에 대한 설명이나 재검토를 요구할 수 있도록 하는 '인공지능 기본사회 및 국민권리 보장에 관한 법률안'이 발의되었습니다. 현행 산업 중심 AI 법안을 국민 권리 관점에서 보완하려는 취지입니다. AI 활용에 따른 공공성과 권익 보호를 위한 제도적 기반 마련 시도입니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:09", "url": "https://zdnet.co.kr/view/?no=20260903170814", "category": "policy", "importance": 2, "wl": true, "topic": "국회 ai기본사회법 발의"}, {"title": "\"중학생까진 AI 안 돼\"…美 뉴욕시, 교실서 생성형 AI 사용 막는다", "summary": "미국 최대 학군인 뉴욕시가 초·중학교 교실에서 학생용 생성형 AI 사용을 1년간 금지합니다. 어린 학생들에게는 사고력과 상호작용이 우선되어야 한다는 판단에 따른 조치입니다. 교육 현장에서의 AI 기술 활용에 대한 규제 및 가이드라인 마련 사례입니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:03", "url": "https://zdnet.co.kr/view/?no=20260903170219", "category": "policy", "importance": 2, "wl": true, "topic": "미국 뉴욕시 교실 ai 금지"}, {"title": "AI regulatory regime should be nimble, not over-constraining: Top PM advisor", "summary": "인도 정부는 AI 규제 체계를 유연하게 유지해야 한다는 입장을 밝혔습니다. 2026년 2월 IT법 개정을 통해 AI 및 딥페이크 관련 규범을 마련한 바 있습니다. 주요국 정부의 디지털 및 AI 관련 정책 방향성을 보여줍니다. 통신 및 IT 인프라를 둘러싼 규제 환경 변화의 일환입니다.", "source": "ET Telecom", "date": "2026-09-03 16:55", "url": "https://telecom.economictimes.indiatimes.com/news/policy/ai-regulatory-regime-should-be-nimble-not-over-constraining-top-pm-advisor/133729523", "category": "policy", "importance": 2, "wl": true, "topic": "인도 ai 규제 기조"}, {"title": "China makes another run at deregulating private 5G", "summary": "중국 정부 기관이 산업 현장에서의 프라이빗 5G 배포를 위한 새로운 계획을 수립했습니다. 그러나 현재까지 주파수 할당에 대한 구체적인 계획은 제시되지 않아 실효성에 의문이 제기되고 있습니다. 산업용 5G 활성화를 위한 정부의 정책적 움직임이나 구체성 부족이 지적됩니다. 향후 세부 주파수 정책 발표 여부가 시장 활성화의 관건이 될 것입니다.", "source": "Light Reading", "date": "2026-09-02 22:55", "url": "https://www.lightreading.com/private-networks/china-makes-another-run-at-deregulating-private-5g", "category": "policy", "importance": 2, "wl": true, "topic": "중국 프라이빗 5g 계획"}], "carrier": [{"title": "Vietnam shuts down its 2G networks nationwide - mediasat.info", "summary": "베트남이 주파수 자원 효율화와 4G 및 5G 전환 가속화를 위해 전국적인 2G 네트워크 서비스를 최종 종료했다. 통신 인프라 고도화 정책의 일환으로 현지 모바일 생태계의 전면적인 세대교체가 이뤄지고 있다.", "source": "mediasat.info", "date": "2026-09-03 19:17", "url": "https://mediasat.info/en/2026/09/03/vietnam-shuts-down-its-2g-networks-nationwide/", "category": "policy", "importance": 4, "wl": false, "topic": "베트남 2g 서비스 종료"}, {"title": "SKT·KT·LGU+, 정부에 '네트워크 투자' 지원 촉구", "summary": "SK텔레콤, KT, LG유플러스가 정부에 차세대 네트워크 및 6G 투자 지원을 강력히 촉구했다. AI 네트워크의 국가 전략 인프라 지정을 요구하며 실질적인 투자 유인책 마련을 건의했다. 통신사의 설비투자 의사결정과 재원 확보에 직접적인 영향을 미치는 사안이다.", "source": "bloter.net", "date": "2026-09-03 15:58", "url": "https://www.bloter.net/news/articleView.html?idxno=672549", "category": "policy", "importance": 4, "wl": false, "topic": "통신3사 ai 네트워크 지원 촉구"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "SK텔레콤과 LG유플러스가 AI-RAN 기술 검증을 위해 삼성전자, 에릭슨, 노키아 등과 협력한다. 네트워크 운영 효율을 높이고 AI 기반 서비스를 지원하기 위한 기술 실증이다. 통신사의 인프라 투자 방향이 인공지능 중심으로 전환되고 있음을 보여준다.", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "통신사 ai-ran 협력"}, {"title": "AI-RAN 네트워크 전환 기술… LG유플러스, 연세대와 검증", "summary": "LG유플러스가 연세대와 함께 로봇과 드론 등 피지컬 AI 장비가 이동할 때 최적의 네트워크를 선택하는 AI-RAN 네트워크 전환 기술을 검증했다. AI 기반 네트워크 자동화 기술의 현장 실효성을 확인한 성과다.", "source": "chosun.com", "date": "2026-09-03 00:36", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/FMYZ7V4NBFGUFC6JUJK3PDSDMU/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "tech", "importance": 4, "wl": false, "topic": "lg유플러스 ai-ran 검증"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": "버진미디어오투(VMO2)가 북아일랜드에 5G 독립형(SA) 서비스를 도입했습니다. 오렌지는 중요 인프라를 위한 프라이빗 5G 수요를 지원하며, 노키아는 새로운 API 고객을 확보하는 등 유럽 통신사들의 5G 기술 고도화가 이어지고 있습니다. 통신사들의 SA 전환과 프라이빗 네트워크 구축은 B2B 시장 경쟁력을 좌우할 핵심 요소입니다. 이번 동향은 유럽 통신 시장에서 고성능 5G 인프라 도입이 본격화되고 있음을 보여줍니다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 3, "wl": true, "topic": "버진미디어오투 5g 고도화"}, {"title": "울산 시내버스, 차세대 와이파이로 싹 바꾼다", "summary": "울산시가 시내버스 762대의 노후 와이파이 장비를 5G 백홀 기반의 와이파이 7 장비로 전면 교체한다. 통신 품질 향상 및 실시간 장애 대응 효율화를 목표로 한 공공 와이파이 인프라 고도화 사업이다.", "source": "ujeil.com", "date": "2026-09-03 20:46", "url": "http://www.ujeil.com/news/articleView.html?idxno=391509", "category": "tech", "importance": 3, "wl": false, "topic": "울산시 버스 와이파이 교체"}, {"title": "우리넷, KOREN 기반 AI 광네트워크 실증 착수", "summary": "우리넷이 KOREN 기반 AI 광네트워크 실증 사업에 착수하며 6G 초정밀 전달망 시스템 기술 개발 과제를 추진한다고 밝혔다. 이번 실증을 통해 기존 광전송망 기술 역량을 강화하고 향후 사업 영역을 확대할 계획이다. AI 데이터센터 및 스마트팩토리 등 지연 없는 네트워크 수요에 대응하는 차세대 기술 확보에 나선다.", "source": "thelec.kr", "date": "2026-09-03 19:10", "url": "https://www.thelec.kr/news/articleView.html?idxno=61790", "category": "tech", "importance": 3, "wl": false, "topic": "우리넷 ai 네트워크 실증"}, {"title": "VodafoneThree declares 5G network slicing war on BT", "summary": "보다폰쓰리가 BT와의 경쟁을 위해 새로운 5G 네트워크 슬라이싱 기반 '슈퍼모바일' 서비스를 출시했습니다. 해당 서비스는 품질 보증을 내세우고 있어 향후 고객 유치 성과가 주목됩니다. 통신사 간 5G 네트워크 슬라이싱 기술을 활용한 차별화 경쟁이 치열해지고 있습니다. 이는 기업 및 소비자 대상 프리미엄 통신 서비스 시장의 경쟁 구도에 변화를 줄 것으로 보입니다.", "source": "Light Reading", "date": "2026-09-03 18:23", "url": "https://www.lightreading.com/5g/vodafonethree-declares-5g-network-slicing-war-on-bt", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 서비스 출시"}, {"title": "[포스트 오라클] 기업은행도 선택한 EDB…안정성으로 승부", "summary": "기업은행과 대형 자동차 제조사 및 통신사가 오라클에서 EDB로 업무 시스템 DB를 전환하고 있다. 장애 발생 시 SLO 준수를 약속하는 등 안정성 확보에 주력하고 있다. 통신사의 IT 인프라 및 소프트웨어 도입 사례이다.", "source": "bloter.net", "date": "2026-09-03 17:33", "url": "https://www.bloter.net/news/articleView.html?idxno=672659", "category": "contract", "importance": 3, "wl": false, "topic": "기업은행 edb dbms 도입"}, {"title": "Deutsche Telekom taps AWS' Jan Hofmeyr as next CTO", "summary": "도이치텔레콤이 AWS의 얀 호프마이어를 차기 CTO로 영입했습니다. 이번 인사는 2026년 11월부터 적용될 예정이며, 기존 경영진의 퇴임과 맞물려 기술 전략의 변화가 예상됩니다. 대형 통신사의 클라우드 전문 인력 영입은 네트워크 가상화 및 클라우드 전환 가속화를 시사합니다. 향후 도이치텔레콤의 기술 및 인프라 전략에 큰 변화가 있을 것으로 전망됩니다.", "source": "Light Reading", "date": "2026-09-03 15:00", "url": "https://www.lightreading.com/business-management/deutsche-telekom-taps-aws-jan-hofmeyr-as-next-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 경영진 교체"}, {"title": "VodafoneThree Takes Aim at EE With “Up to 4x Faster” 5G+ Plans - Tech Advisor", "summary": "보다폰스리가 기존 경쟁사를 겨냥하여 최대 4배 빠른 5G+ 요금제 출시를 발표했다. 영국의 모바일 통신 시장에서 가입자 유치 경쟁이 가열되고 있다. 통신사들의 마케팅 및 네트워크 품질 경쟁의 일환이다.", "source": "Tech Advisor", "date": "2026-09-03 08:02", "url": "https://www.techadvisor.com/article/3225803/vodafonethree-takes-aim-at-ee-with-up-to-4x-faster-5g-plans.html", "category": "other", "importance": 3, "wl": false, "topic": "보다폰스리 5g 요금제"}, {"title": "[봇규의 헬로BOT] ‘피지컬 AI 1강’으로 ② | 실증은 늘렸다, 근데 산업...", "summary": "제조 장비와 드론 등 실제 산업 현장에서 자립형 5세대 이동통신인 5G SA와 AI-RAN을 구축하는 실증 작업이 확대되고 있다.", "source": "hellot.net", "date": "2026-09-03 00:08", "url": "https://www.hellot.net/news/article.html?no=114727", "category": "tech", "importance": 3, "wl": false, "topic": "산업용 5g sa ai-ran"}, {"title": "DT hires AWS's Jan Hofmeyr as CTO", "summary": "도이치텔레콤이 AWS의 얀 호프마이어를 2026년 11월부로 CTO로 영입합니다. 또한 크리스티안 일렉 CFO가 2027년 5월 퇴임할 예정으로, 주요 경영진 교체를 통한 전략적 변화를 예고했습니다. 클라우드 전문가의 CTO 영입은 통신망의 클라우드 네이티브 전환 전략과 밀접한 연관이 있습니다. 향후 도이치텔레콤의 기술 투자 방향성에 중요한 이정표가 될 것입니다.", "source": "Light Reading", "date": "2026-09-02 23:47", "url": "https://www.lightreading.com/broadband/dt-hires-aws-s-jan-hofmeyr-as-cto", "category": "exec", "importance": 3, "wl": true, "topic": "도이치텔레콤 임원 영입"}, {"title": "드론부터 딥보이스까지…KT, ‘AI 안전망’ 띄운다 - 데일리안", "summary": "KT가 드론과 AI 기술을 결합한 지능형 안전망 서비스를 추진한다. 통신망을 활용한 재난 대응 및 안전 관리 솔루션의 일환이다. 통신사의 인공지능 기반 B2B 사업 다각화 사례다.", "source": "데일리안", "date": "2026-09-02 15:09", "url": "https://www.dailian.co.kr/news/view/1685574/%EB%93%9C%EB%A1%A0-%EB%94%A5%EB%B3%B4%EC%9D%B4%EC%8A%A4%EA%B9%8C%EC%A7%80KT-%E2%80%98AI-%EC%95%88%EC%A0%84%EB%A7%9D%E2%80%99-2026", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai 안전망 서비스"}, {"title": "HPE scores Wi-Fi and AI goals as 5G and VMware lose out", "summary": "영국 토트넘 홋스퍼 스타디움이 HPE 기술을 활용한 수백만 달러 규모의 네트워크 업그레이드를 완료했습니다. Wi-Fi 7과 AI 기능을 도입하여 경기장 내 연결성을 강화했습니다. 대규모 경기장의 인프라 고도화는 고성능 무선 기술 수요를 보여줍니다. 엔터프라이즈 네트워킹 시장의 최신 기술 적용 사례입니다.", "source": "Light Reading", "date": "2026-09-02 15:00", "url": "https://www.lightreading.com/wifi/hpe-scores-wi-fi-and-ai-goals-as-5g-and-vmware-lose-out", "category": "contract", "importance": 3, "wl": true, "topic": "토트넘 홋스퍼 네트워크 업그레이드"}, {"title": "“해킹 후유증 털었다”…SKT, 통신 본업 회복에 AI 가치 부각", "summary": "SK텔레콤의 통신 본업 회복과 AI 가치 부각 관련 증권가 분석이다. 신규 주파수 할당, 5G SA 상용화, AI 기지국 보급 확대 정책 논의 가능성이 언급되었다. 통신사 네트워크 전략과 증권가 전망을 다룬다.", "source": "asiatime.co.kr", "date": "2026-09-02 13:52", "url": "https://www.asiatime.co.kr/article/20260902500221", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 통신 본업 회복 및 ai"}, {"title": "스테이지파이브, 로플랫 인수…제4이통 대신 ‘AI 통신’으로 승부", "summary": "제4이통사 무산 이후 스테이지파이브가 로플랫을 인수하며 AI 통신 사업으로 방향을 선회했다. 과기정통부의 주파수 할당 취소 이후 알뜰폰 및 AI 통신 중심으로 사업 재편을 추진하고 있다. 통신 시장의 플레이어 동향을 보여준다.", "source": "edaily.co.kr", "date": "2026-09-02 08:48", "url": "https://www.edaily.co.kr/News/Read?newsId=02794566645576184&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "contract", "importance": 3, "wl": false, "topic": "스테이지파이브 로플랫 인수"}, {"title": "Charter CFO heading to Google-Blackstone data center JV", "summary": "차터의 제시카 피셔 CFO가 10월 15일 퇴사 후 구글과 블랙스톤의 AI 데이터 센터 합작법인으로 이직합니다. 차터는 현재 후임자를 물색 중입니다. 주요 통신사 고위 임원의 AI 인프라 분야로의 이동을 보여줍니다. 통신과 AI 데이터 센터 간의 인재 유입 현상을 시사합니다.", "source": "Light Reading", "date": "2026-09-02 03:54", "url": "https://www.lightreading.com/cable-technology/charter-cfo-heading-to-google-blackstone-data-center-jv", "category": "exec", "importance": 3, "wl": true, "topic": "차터 임원 이직"}, {"title": "Sky Mobile unleashes 'more reliable connection' and 'smoother performance' nationwide in m", "summary": "스카이모바일이 전국망에서 더 신뢰할 수 있는 연결과 부드러운 성능을 제공한다고 발표했다. 통신 서비스 품질 향상을 위한 망 운영 개선 조치다.", "source": "GB News", "date": "2026-09-02 01:12", "url": "https://www.gbnews.com/tech/sky-mobile-5g-plus", "category": "other", "importance": 3, "wl": false, "topic": "스카이모바일 네트워크 품질"}, {"title": "AT&T goes to the mat over Charter's use of 'fiber-powered' label for HFC", "summary": "AT&T가 차터의 HFC 네트워크 기반 광대역 서비스를 '광섬유 기반'으로 광고하는 것은 허위 광고라며 소송을 제기했습니다. 이는 통신사 간 마케팅 및 기술 용어 사용을 둘러싼 규제 및 법적 분쟁의 사례입니다. 통신 사업자 간의 치열한 마케팅 경쟁과 기술 정의에 대한 갈등을 보여줍니다. 향후 광대역 서비스 시장의 광고 및 마케팅 관행에 영향을 미칠 수 있습니다.", "source": "Light Reading", "date": "2026-09-02 00:55", "url": "https://www.lightreading.com/broadband/at-t-goes-to-the-mat-over-charter-s-use-of-fiber-powered-label-for-hfc", "category": "policy", "importance": 3, "wl": true, "topic": "at&t 차터 소송"}, {"title": "40 AI agents are already in use for clients. TELUS Digital will host demos at Dreamforce. ", "summary": "캐나다 통신사 텔러스가 고객 서비스를 위한 AI 에이전트를 도입하고 관련 데모 행사를 개최한다.", "source": "Stock Titan", "date": "2026-09-03 19:45", "url": "https://www.stocktitan.net/news/TU/telus-digital-to-host-agentforce-industry-sessions-and-exclusive-b7osxigv9b4p.html", "category": "other", "importance": 2, "wl": false, "topic": "텔러스 ai 에이전트"}, {"title": "TELUS Digital to Host Agentforce Industry Sessions and Exclusive Events at Hotel Zetta Dur", "summary": "텔러스 디지털이 업계 세션 및 독점 행사를 주최하며 기업용 솔루션을 홍보한다.", "source": "Yahoo Finance", "date": "2026-09-03 19:45", "url": "https://finance.yahoo.com/technology/ai/articles/telus-digital-host-agentforce-industry-104500152.html", "category": "other", "importance": 2, "wl": false, "topic": "텔러스 디지털 행사"}, {"title": "플리토, 육군에 AI 민원상담 구축…장병·국민 문의 24시간 대응", "summary": "플리토가 육군과 협력하여 보안이 중요한 군 폐쇄망에서 작동하는 AI 기반 민원상담체계를 구축합니다. 국방 분야의 AI 전환(AX)을 가속화하는 사례입니다. 공공 및 군사 보안 영역에서의 AI 솔루션 적용 가능성을 보여줍니다.", "source": "ZDNet Korea", "date": "2026-09-03 17:36", "url": "https://zdnet.co.kr/view/?no=20260903173519", "category": "contract", "importance": 2, "wl": true, "topic": "플리토 육군 ai 민원상담 구축"}, {"title": "Distributed AI inference is redrawing the network map (Reader Forum)", "summary": "AI 추론이 중앙 집중식에서 분산식으로 전환됨에 따라 네트워크 아키텍처가 근접성, 지연 시간, 복원력을 중심으로 재편 urce": "MobileSyrup", "date": "2026-09-02 02:34", "url": "https://mobilesyrup.com/2026/09/01/bell-30-100gb-win-back-plan-lucky-mobile-deal/", "category": "other", "importance": 2, "wl": false, "topic": "벨 캐나다 요금제"}, {"title": "AT&T, Nvidia back plan to bridge gap on skilled labor", "summary": "AT&T와 엔비디아, GM 등이 협력하여 100만 명의 숙련된 기술 인력을 양성하는 이니셔티브를 지원합니다. 통신 및 AI 산업의 인프라 구축을 위한 전문 인력 확보가 목적입니다. 산업 전반의 인프라 구축 역량을 강화하기 위한 민관 협력 사례입니다. 장기적인 기술 생태계 기반 조성에 기여할 것입니다.", "source": "Light Reading", "date": "2026-09-01 23:30", "url": "https://www.lightreading.com/ai-machine-learning/at-t-nvidia-back-plan-to-bridge-gap-on-skilled-labor", "category": "contract", "importance": 2, "wl": true, "topic": "at&t 인력 양성 이니셔티브"}, {"title": "Greenwatch: Small signs of progress amid bleak picture of data center sustainability", "summary": "8월 통신 지속가능성 뉴스 요약을 통해 친환경 데이터 센터 인프라, 순환 경제, 산불의 영향 등을 조명했습니다. 통신 및 데이터 센터 산업의 친환경 전환 노력을 다루고 있습니다. 업계 전반의 ESG 경영 기조를 반영하는 내용입니다.", "source": "Light Reading", "date": "2026-09-02 16:00", "url": "https://www.lightreading.com/sustainability/greenwatch-small-signs-of-progress-amid-bleak-picture-of-data-center-sustainability", "category": "tech", "importance": 1, "wl": true, "topic": "그린워치 지속가능성 소식"}, {"title": "India’s data-centre boom may add just $9bn to GDP by 2030", "summary": "무디스는 인도 데이터 센터 붐이 2030년까지 GDP에 미치는 영향이 제한적이며 고용 증가 효과도 미미할 것이라고 전망했습니다. 인프라 투자의 거시경제적 파급효과에 대한 분석입니다.", "source": "Mint", "date": "2026-09-01 23:09", "url": "https://www.livemint.com/industry/indias-data-centre-boom-may-add-just-9bn-to-gdp-by-2030-11788262261175.html", "category": "other", "importance": 1, "wl": true, "topic": "인도 데이터센터 경제 효과 분석"}]};
const NEWS_LATEST = [{"title": "6G and AI are on a collision course", "summary": "퀄컴 경영진은 6G가 연결성과 감지 기능을 향상시킬 뿐만 아니라 AI 네이티브 기기 및 AI 활용 사례와 직접적으로 교차할 것이라고 전망했습니다. AI 시대에는 사용자들이 AI 기능을 탑재한 기기를 휴대하게 될 것이며, 6G가 이를 뒷받침하는 핵심 인프라가 될 것으로 보입니다. 글로벌 통신 시장에서 6G와 AI의 융합이 가속화되는 가운데, 관련 인프라 기술 개발의 중요성이 커지고 있습니다. 이번 전망은 향후 차세대 통신 표준화 및 단말기 생태계 변화에 긍정적인 영향을 미칠 것으로 예상됩니다.", "source": "Light Reading", "date": "2026-09-03 22:00", "url": "https://www.lightreading.com/6g/6g-and-ai-are-on-a-collision-course", "category": "tech", "importance": 3, "sid": "satellite", "topic": "퀄컴 6g 전망"}, {"title": "Nokia's Sustainability Strategy: An Engine for Innovation, Collaboration, and Long-Term Im", "summary": "노키아의 지속가능성 전략과 혁신, 협력을 통한 장기적 가치 창출 방안을 다룬 보고서 성격의 기사다. 환경 및 사회적 책임 경영의 방향성을 설명하고 있다.", "source": "Morningstar", "date": "2026-09-03 21:35", "url": "https://www.morningstar.com/news/accesswire/1216238msn/nokias-sustainability-strategy-an-engine-for-innovation-collaboration-and-long-term-impact", "category": "other", "importance": 2, "sid": "competitor", "topic": "노키아 지속가능경영"}, {"title": "The era of AI-native RAN starts now - Nokia", "summary": "노키아가 AI 네이티브 RAN 시대의 개막을 선언하며 관련 비전과 기술 방향성을 제시했다. 무선접속망에 인공지능을 심층 결합하여 성능을 극대화하는 전략이다. 차세대 통신 장비 시장에서의 기술 우위를 확보하기 위한 포석이다.", "source": "Nokia", "date": "2026-09-03 21:03", "url": "https://www.nokia.com/blog/the-era-of-ai-native-ran-starts-now/", "category": "other", "importance": 3, "sid": "competitor", "topic": "노키아 ai 네트워크"}, {"title": "GAO issues broadband program to-dos for FCC, NTIA", "summary": "미국 회계감사원(GAO)은 연방 광대역 프로그램의 현황을 평가하고, FCC와 NTIA에 광대역 매핑 데이터의 정확성 및 프로그램의 지속 가능성을 개선하기 위한 구체적인 권고안을 제시했습니다. 통신 인프라 확대를 위한 정부 지원 사업의 효율성을 높이기 위한 조치입니다. 향후 미국 내 광대역 통신망 구축 사업의 관리 체계가 강화될 것으로 보입니다. 이는 통신 사업자들의 보조금 활용 및 인프라 투자 계획에도 적지 않은 영향을 미칠 전망입니다.", "source": "Light Reading", "date": "2026-09-03 21:00", "url": "https://www.lightreading.com/broadband/gao-issues-broadband-program-to-dos-for-fcc-ntia", "category": "policy", "importance": 3, "sid": "polic   for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
