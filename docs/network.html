<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}
  h1{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}

  .tabbar{display:flex;gap:2px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}

  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

const NEWS_DATA = {"outage": [{"title": "T-Mobile customers complain of widespread outages - Mashable", "summary": "T모바일 고객들이 광범위한 통신망 장애를 겪었다고 불만을 제기했다. 무선 통신 서비스 이용에 차질이 발생하여 사용자들이 불편을 겪었다. 통신망 운영의 안정성 점검이 필요한 사안이다.", "source": "Mashable", "date": "2026-09-06 19:50", "url": "https://mashable.com/article/widespread-outages-t-mobile-att-verizon-sprint/?utm_source=social&utm_medium=facebook&utm_campaign=mash-com-fb-main-link&utm_content=tech&fbclid=IwAR0kTWmIxKKc1z4YXH3X7kXlOdmtVzu_SraTzqK9c6j7xufhMvv7ch70aW4", "category": "outage", "importance": 3, "wl": false, "topic": "티모바일 장애"}, {"title": "AT&T Service Restored After Customers Hit By Widespread Cellular Outages In The USA Puerto", "summary": "미국 및 푸에르토리코 지역에서 발생했던 AT&T의 광범위한 셀룰러 통신망 장애 이후 서비스가 복구되었다. 대규모 가입자가 통신 중단 피해를 겪었다. 통신망 복구 완료에 대한 보도이다.", "source": "Mshale", "date": "2026-09-06 16:30", "url": "https://mshale.com/01e895f4/c2093bbeWh4bGBYDFw4LODQ", "category": "outage", "importance": 3, "wl": false, "topic": "에이티앤티 장애"}], "satellite": [{"title": "Sceyeとソフトバンク、日本での成層圏接続性の実証実験を完了し、HAPSの商用化に向けて前進 - Infoseek", "summary": "Sceye와 소프트뱅크가 일본 내 성층권 연결성 실증 실험을 완료하고 HAPS 상용화를 향해 한 걸음 더 전진했다. 차세대 공중 통신 플랫폼 개발의 기술적 진전을 보여준다. 고고도 무인기 통신 기술 상용화 가속화이다.", "source": "Infoseek", "date": "2026-09-07 11:34", "url": "https://news.infoseek.co.jp/article/kyodopr202609075393/", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 성층권"}, {"title": "[K방산 빅뱅①] 세계는 '메가 방산' 전쟁…한화가 KAI 원하는 이유", "summary": "한화그룹은 2040년까지 55조 원을 투자해 독자 발사체와 위성, 우주 AI 데이터센터, 저궤도 통신망을 구축한다는 AI 우주강국 전략을 발표했다. 김동관 수석부회장이 주도하는 이번 전략은 글로벌 메가 방산 경쟁에서 우위를 점하기 위한 포석이다. 독자적인 우주 통신 인프라와 국방 AI 데이터센터를 결합하여 종합 우주 방산 기업으로 도약한다는 목표다. 국내 방산 및 우주 통신 산업의 대규모 투자가 가속화되고 있다.", "source": "pinpointnews.co.kr", "date": "2026-09-07 09:56", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=484423", "category": "other", "importance": 4, "wl": false, "topic": "한화그룹 우주전략"}, {"title": "Japan's $1 Billion BlueBird Deal Positions AST SpaceMobile (NASDAQ: ASTS) As The Global Sa", "summary": "일본의 10억 달러 규모 블루버드 계약 체결이 AST 스페이스모바일을 글로벌 위성 통신 선두주자로 자리매김하게 만들었다고 평가했다. 대형 위성 통신 인프라 수주 및 상용화 가속화를 보여준다. 차세대 위성 통신 시장의 핵심 수주 딜이다.", "source": "foreignpolicyjournal.com", "date": "2026-09-07 08:57", "url": "https://www.foreignpolicyjournal.com/2026/09/06/japans-1-billion-bluebird-deal-positions-ast-spacemobile-nasdaq-asts-as-the-global-satellite-infrastructure-layer/", "category": "contract", "importance": 4, "wl": false, "topic": "에스티에스페이스모바일 계약"}, {"title": "추락하나했더니 ‘주가 재추진’…시총 2조달러 재입성한 스페이스X", "summary": "스페이스X가 시가총액 2조 달러에 재입성하며 미국 자본시장의 뜨거운 관심을 받고 있다. 시장에서는 스페이스X의 기업 가치 산정 공식이 로켓과 스타링크에서 로켓, 위성통신, AI 결합으로 확대되고 있다고 분석한다. 오펜하이머는 스페이스X의 AI 컴퓨팅 능력이 급격히 성장하고 있음을 강조했다. 우주 탐사와 위성 통신을 넘어 AI 인프라 기업으로 진화하고 있다.", "source": "mk.co.kr", "date": "2026-09-06 21:43", "url": "https://www.mk.co.kr/article/12145621", "category": "other", "importance": 4, "wl": false, "topic": "스페이스x 기업가치"}, {"title": "ASTS Stock Eyes Weekly Comeback: AT&T Says AST SpaceMobile Satellite Offering Will 'Come T", "summary": "AT&T가 AST 스페이스모바일의 위성 통신 서비스 제공이 곧 가시화될 것이라고 밝히며 주가 반등 기대감을 높였다. 지상 통신망과 위성 간 연계 서비스 상용화가 임박했음을 시사한다. 차세대 위성통신 협력 구도를 보여준다.", "source": "Stocktwits", "date": "2026-09-06 17:21", "url": "https://stocktwits.com/news-articles/markets/equity/asts-at-and-t-satellite-offering-next-year/cZZn4ASR7DU", "category": "contract", "importance": 4, "wl": false, "topic": "에스티에스페이스모바일 위성"}, {"title": "\"저궤도 위성만으로 지상망 대체 어렵다”", "summary": "미국 이동통신 3사인 AT&T, T모바일, 버라이즌은 저궤도 위성만으로 지상망을 대체하기는 어렵다는 입장을 보이고 있다. 현재 스타링크 모바일과의 MVNO 계약 체결에 적극적이지 않은 태도를 취하고 있다. 대신 주파수 자원을 공동 활용하고 여러 위성 사업자와 협력하여 통신 음영지역을 해소하는 전략을 취하고 있다. 지상 통신망 사업자와 저궤도 위성 사업자 간의 복잡한 경쟁과 협력 구도가 형성되고 있다.", "source": "zdnet.co.kr", "date": "2026-09-06 08:42", "url": "https://zdnet.co.kr/view/?no=20260906084139", "category": "competitor", "importance": 4, "wl": false, "topic": "이동통신사 스타링크"}, {"title": "中·싱가포르 연구진 “ 스타링크 최신 단말기 해킹 성공” [차이나우]", "summary": "중국과 싱가포르 기반 사이버보안 연구진이 스페이스X의 위성 인터넷 서비스 스타링크 최신 사용자 단말기를 해킹하는 데 성공했다고 주장했다. 이번 해킹을 통해 단말기의 관리자 권한을 확보하여 스타링크 위성과 시스템의 보안 취약점을 드러냈다. 전 세계 위성 인터넷망의 핵심 인프라인 단말 보안에 대한 우려가 커지고 있다. 스페이스X의 보안 대응 체계 강화가 시급한 과제로 떠올랐다.", "source": "segye.com", "date": "2026-09-06 07:19", "url": "https://www.segye.com/newsView/20260904502034?OutUrl=naver", "category": "tech", "importance": 4, "wl": false, "topic": "스타링크 보안해킹"}, {"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 AI 네이티브 네트워크를 중심으로 한 6G의 3대 핵심 축을 발표했다. 통신 밸류체인 전반을 재편할 차세대 기술 표준과 비전을 제시한다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g전략"}, {"title": "SpaceX Just Launched AST SpaceMobile's Biggest Bet To Advance Cell Service From Space - St", "summary": "SpaceX가 AST SpaceMobile의 대규모 위성을 발사하며 우주 기반 셀룰러 통신 서비스 진전을 이뤘다. 위성 직접 통신(Direct-to-Cell) 상용화를 위한 핵심 마일스톤이다.", "source": "Stocktwits", "date": "2026-09-06 03:52", "url": "https://stocktwits.com/news-articles/markets/equity/spacex-launches-ast-spacemobile-biggest-satellites-cell-service-from-space/cZK0HS1R7IN", "category": "contract", "importance": 4, "wl": false, "topic": "ast스페이스모바일 위성발사"}, {"title": "경희대 전자공학부 임영현 교수, 6G ·AI 반도체 클럭 신뢰성 높일 핵심 ...", "summary": "경희대학교 전자공학부 임영현 교수 연구팀이 6G 이동통신 후보 대역인 어퍼 미드밴드 통신칩과 AI 반도체의 클럭 신뢰성을 높일 핵심 기술을 개발했다. 이번 기술은 더 높은 주파수와 더 낮은 지터를 동시에 요구하는 차세대 SoC의 클럭 생성 회로로 활용된다. 데이터센터의 초고속 유선 인터페이스 등 다양한 차세대 시스템에 적용될 수 있다. 저잡음과 저전력이 강점인 서브샘플링 PLL 기술을 개선하여 성능을 크게 향상시켰다.", "source": "etnews.com", "date": "2026-09-07 11:31", "url": "https://www.etnews.com/20260907000204", "category": "tech", "importance": 3, "wl": false, "topic": "경희대학교 6g"}, {"title": "“JFK 아닌 뉴어크가 승부수”… 유나이티드항공, 인천 하늘길에 세 번...", "summary": "유나이티드항공이 인천~뉴어크 노선에 신규 취항하며 한국 승객을 겨냥한 차별화된 서비스를 강조했다. 넷플릭스 제휴 기내식, 한국어 자막 엔터테인먼트 등과 함께 내년 도입 예정인 스타링크 고속 와이파이를 소개했다. 장거리 국제선의 디지털 연결성을 강화하여 프리미엄 승객의 만족도를 높인다는 전략이다. 항공업계의 기내 위성인터넷 도입 경쟁이 본격화되고 있다.", "source": "digitalchosun.dizzo.com", "date": "2026-09-07 11:10", "url": "http://digitalchosun.dizzo.com/site/data/html_dir/2026/09/07/2026090780052.html", "category": "contract", "importance": 3, "wl": false, "topic": "유나이티드항공 스타링크"}, {"title": "독일 스타 트업, 유럽 대륙 첫 상업 로켓 궤도 진입...\"우주발사 새 시대...", "summary": "스페이스X는 캘리포니아 밴덴버그 우주군기지에서 팰컨9 로켓으로 스타링크 위성 27기를 발사하며 올해 80번째 임무에 성공했다. 한편 독일 스타트업이 유럽 대륙 최초로 상업 로켓 궤도 진입에 성공하며 우주발사 시장의 새로운 시대를 열었다. 글로벌 우주 발사체 시장에서 스페이스X의 독주가 지속되는 가운데 신규 경쟁사들의 진입이 이어지고 있다. 저궤도 위성 네트워크 구축 규모가 더욱 확대되고 있다.", "source": "choicenews.co.kr", "date": "2026-09-07 08:48", "url": "http://www.choicenews.co.kr/news/articleView.html?idxno=171000", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 스타링크"}, {"title": "Satellite internet’s regulatory battle - Dawn", "summary": "위성 인터넷 서비스 확산에 따른 글로벌 규제 환경과 주파수·영공권 관련 정책적 마찰을 다룬다.", "source": "Dawn", "date": "2026-09-07 08:30", "url": "https://www.dawn.com/news/2027983", "category": "policy", "importance": 3, "wl": false, "topic": "위성인터넷 규제"}, {"title": "AI로 태양폭풍 예측…우주청·UN, 25개국과 머리 맞댄다", "summary": "우주청과 UN이 25개국과 함께 AI를 활용한 태양폭풍 예측 연구에 나선다. 우주전파재난은 태양 활동으로 인해 위성, 항공, 전력망, 통신 등 핵심 기반시설에 장애를 유발하는 현상이다. 참석자들은 AI 예측 기술과 관측 정보를 결합하여 재난 피해 위험을 줄이고 공동 연구를 확대하기로 했다. 우주 재난 대응 능력을 강화하기 위한 국제적 공조가 본격화되고 있다.", "source": "srtimes.kr", "date": "2026-09-07 08:30", "url": "http://www.srtimes.kr/news/articleView.html?idxno=211724", "category": "other", "importance": 3, "wl": false, "topic": "우주청 태양폭풍"}, {"title": "\"지구-달 사이에 30기 큐브샛 띄운다\"… 中, 5개국 규합 '3D 위성 관측망...", "summary": "중국이 5개국을 규합해 지구와 달 사이에 30기의 초소형 위성을 띄우는 3D 위성 관측망 프로젝트를 공식 출범시켰다. 지구 저궤도부터 약 200만 킬로미터에 이르는 지구-달 공간을 새로운 우주 활동 개척지로 삼겠다는 구상이다. 미래 유인 달 탐사와 심우주 통신 네트워크 구축을 위한 국제 협력이 본격화되었다. 글로벌 우주 강국들의 영토 확장 경쟁이 더욱 치열해지고 있다.", "source": "g-enews.com", "date": "2026-09-07 06:36", "url": "https://www.g-enews.com/view.php?ud=2026090700302241120c8c1c064d_1", "category": "tech", "importance": 3, "wl": false, "topic": "중국 3d위성관측망"}, {"title": "[아참마당] 저궤도 위성이 바꾸는 통신의 미래", "summary": "저궤도 위성이 통신의 미래 패러다임을 바꾸고 있다. 독자적인 6G 위성통신 기술과 산업 생태계 확보라는 관점에서 전략적 접근이 요구된다. 이동통신 주파수를 넘어 비면허 주파수까지 위성 직접연결 영역이 확대되는 추세다. 글로벌 시장에서 위성통신 주도권 경쟁이 더욱 치열해질 것으로 예상된다.", "source": "cctoday.co.kr", "date": "2026-09-07 06:02", "url": "https://www.cctoday.co.kr/news/articleView.html?idxno=2236218", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도위성 통신"}, {"title": "북한 '은밀한 영상' 찍던 그 회사…\"이젠 공간정보 플랫폼으로 진화\"", "summary": "과거 북한의 영상을 촬영하던 위성 기업이 공간정보 플랫폼으로 진화하고 있다. 10기의 위성을 고도 500킬로미터 저궤도에 띄워 매일 수백만 제곱킬로미터의 지상을 촬영한다. 해상도 30센티미터급의 고해상도 시계열 자료를 확보하여 다양한 산업에 활용하고 있다. 정밀한 위성 영상 데이터의 활용 범위가 지리 정보와 안보 분야를 넘어 확대되고 있다.", "source": "mt.co.kr", "date": "2026-09-07 05:00", "url": "https://www.mt.co.kr/future/2026/09/07/2026090217280253293", "category": "other", "importance": 3, "wl": false, "topic": "공간정보플랫폼 위성"}, {"title": "[서학!스타] 로켓랩(RKLB), 94번째 일렉트론 발사 성공…2026년 들어 15번...", "summary": "로켓랩이 94번째 일렉트론 로켓 발사에 성공하며 2026년 들어 15번째 임무를 완수했다. 이번 임무를 통해 일본 위성 기업 신스펙티브의 최신 지구관측 위성이 저궤도에 성공적으로 투입되었다. 뉴질랜드 마히아 발사장에서 수행된 이번 발사는 소형 위성 발사 시장에서 로켓랩의 신뢰성을 다시 한번 입증했다. 글로벌 위성 발사 서비스 수요가 꾸준히 증가하고 있다.", "source": "cbci.co.kr", "date": "2026-09-07 01:00", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=604366", "category": "contract", "importance": 3, "wl": false, "topic": "로켓랩 일렉트론"}, {"title": "ASTS Stock Eyes Worst Week In Over A Month: FCC Chair Says SPCX, AMZN Are Heating Up Satel", "summary": "FCC 의장이 SpaceX와 Amazon 등의 위성통신 사업 경쟁 가열을 언급한 가운데 ASTS 주가가 변동성을 보였다. 저궤도 위성 규제 및 시장 경쟁 환경을 다룬다.", "source": "Stocktwits", "date": "2026-09-07 00:30", "url": "https://stocktwits.com/news-articles/markets/equity/asts-fcc-chair-spcx-amzn-satellite-to-cell-competition/cZmApYPR7FB", "category": "policy", "importance": 3, "wl": false, "topic": "fcc 위성규제"}, {"title": "[김대호 진단] 반도체 열전 (51) 아마존... AWS 클라우드 혁명의 비밀", "summary": "아마존의 카이퍼 프로젝트는 3200개 이상의 저궤도 인공위성을 쏘아 올려 전 지구를 인터넷망으로 뒤덮는 계획이다. 이는 일론 머스크의 스타링크와 정면 승부를 선언한 대형 프로젝트다. 제조업과 클라우드 혁신을 주도해 온 제조사의 우주 인터넷 시장 진입이 본격화되고 있다. 글로벌 저궤도 위성 통신 시장의 경쟁 구도가 다자간 구도로 재편될 전망이다.", "source": "g-enews.com", "date": "2026-09-07 00:00", "url": "https://www.g-enews.com/view.php?ud=202609040949484704906806b77b_1", "category": "competitor", "importance": 3, "wl": false, "topic": "아마존 카이퍼"}, {"title": "A Historic Deal Between Apple and Amazon to Boost Satellite Services on the iPhone - آي-فو", "summary": "애플과 아마존이 아이폰의 위성 서비스 강화를 위해 협력하는 역사적 딜을 추진한다는 소식이다. 모바일과 위성통신의 결합이 가속화된다.", "source": "آي-فون إسلام", "date": "2026-09-06 17:46", "url": "https://iphoneislam.com/language/en/2026/04/a-historic-deal-between-apple-and-amazon-to-boost-satellite-services-on-the-iphone/165317", "category": "contract", "importance": 3, "wl": false, "topic": "아마존 위성통신"}, {"title": "Reinventing Business Internet from the Ground Up and the Sky Down - SWX Local Sports", "summary": "지상과 하늘을 아우르는 접근법을 통해 비즈니스 인터넷 서비스를 근본적으로 재구상하고 혁신하는 방안을 다루었다. 전통적인 유선망과 위성/무선 기술의 융합을 시사한다. 차세대 네트워크 인프라 구축 트렌드이다.", "source": "SWX Local Sports", "date": "2026-09-06 17:22", "url": "https://www.swxlocalsports.com/online_features/tech_talk_and_innovation/reinventing-business-internet-from-the-ground-up-and-the-sky-down/article_044b6e08-cb29-5bcb-99cb-953f5a325d3e.html", "category": "tech", "importance": 3, "wl": false, "topic": "기업인터넷 혁신"}, {"title": "Spectrum Rocket Reaches Orbit From Andoya, Norway - srpske.rs", "summary": "노르웨이 안도야에서 스펙트럼 로켓이 궤도 진입에 성공했다. 유럽의 우주 발사 인프라 확대 소식이다.", "source": "srpske.rs", "date": "2026-09-06 15:10", "url": "https://srpske.rs/en/news/nauka/2026/09/06/isar-aerospace-spectrum-rocket-reaches-orbit-andoya", "category": "tech", "importance": 3, "wl": false, "topic": "노르웨이 로켓발사"}, {"title": "독일 이자르, 유럽 본토 첫 상업 위성 발사 성공", "summary": "독일의 이자르가 유럽 본토 최초로 상업 위성 발사에 성공했다. 소형 위성과 군집 위성 발사가 늘어나면서 저궤도 환경의 우주교통 관리와 충돌 회피의 중요성이 커지고 있다. 이번 발사는 유럽이 자체 발사체 접근성을 확보하는 데 중요한 이정표가 되었다. 향후 민간 및 군사 위성 발사 수요를 소화할 유럽 내 자립 공급망이 구축되고 있다.", "source": "edaily.co.kr", "date": "2026-09-06 14:32", "url": "https://www.edaily.co.kr/News/Read?newsId=01633446645577496&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "other", "importance": 3, "wl": false, "topic": "독일 이자르 위성발사"}, {"title": "Keysight Technologies: Powering India’s 6G, AI and semiconductor ambitions - tele.net.in", "summary": "키사이트 테크놀로지가 인도의 6G, AI, 반도체 인프라 구축을 지원한다. 차세대 통신 기술 연구개발 및 테스트 솔루션 협력을 다룬다.", "source": "tele.net.in", "date": "2026-09-06 13:45", "url": "https://tele.net.in/companies/keysight-technologies-powering-indias-6g-ai-and-semiconductor-ambitions-12490603", "category": "tech", "importance": 3, "wl": false, "topic": "키사이트 6g인프라"}, {"title": "獨스타트업, 유럽서 첫 상업용 로켓 발사 성공…우주 자립 시동", "summary": "독일 스타트업 이자르가 유럽에서 첫 상업용 로켓 발사에 성공하며 우주 자립에 시동을 걸었다. 스펙트럼 로켓은 양산 체제를 갖추어 지상 수백 킬로미터 저궤도로 민간 및 군사 위성을 실어 나르게 된다. 탑재 능력은 약 1톤이며 이자르는 뮌헨 공장에서 연간 30기 이상을 생산할 수 있다고 밝혔다. 유럽의 소형 발사체 시장 경쟁력이 한층 강화될 전망이다.", "source": "news1.kr", "date": "2026-09-06 13:35", "url": "https://www.news1.kr/world/europe/6281311", "category": "other", "importance": 3, "wl": false, "topic": "독일 이자르 로켓발사"}, {"title": "ASTS Stock Rises Overnight: AST SpaceMobile And SpaceX Reportedly Chase Prized Satellite S", "summary": "AST SpaceMobile과 SpaceX가 프리미엄 위성 스펙트럼 확보 경쟁을 벌이며 관련 주가가 상승세를 보였다. 우주 통신 시장의 주도권 경쟁을 보여준다.", "source": "Stocktwits", "date": "2026-09-06 10:38", "url": "https://stocktwits.com/news-articles/markets/equity/asts-spacex-reportedly-chase-prized-satellite-spectrum/cZYBgpkRJZH", "category": "contract", "importance": 3, "wl": false, "topic": "ast스페이스모바일 위성통신"}, {"title": "두 달 전 투자한 스페이스X 주식 10,000달러, 현재 가치 확인해보니", "summary": "스페이스X의 스타링크 가입자 수가 1200만 명에 도달하며 가파른 성장세를 보이고 있다. 2분기 동안 60억 달러 이상의 스타실드 정부 계약을 확보하며 실적을 견인했다. 인공지능 부문 매출 역시 27억 달러를 기록해 장기적인 컴퓨팅 인프라 역량을 입증했다. 우주 통신과 정부 방산, AI 사업의 다각화가 기업 가치를 끌어올리고 있다.", "source": "coinreaders.com", "date": "2026-09-06 07:50", "url": "http://coinreaders.com/256743", "category": "other", "importance": 3, "wl": false, "topic": "스페이스x 가입자"}, {"title": "아마존, 머스크의 스타링크 본격 추격 - 미주조선일보", "summary": "아마존이 프로젝트 카이퍼를 통해 일론 머스크의 스타링크를 본격적으로 추격하고 있다. 저궤도 위성 인터넷 시장의 양강 구도가 형성되고 있다.", "source": "미주조선일보", "date": "2026-09-06 06:38", "url": "https://chosundaily.com/bbs/board.php?bo_table=hotclick&wr_id=31520&sca=%EA%B2%BD%EC%A0%9C&spt=-31748&page=9", "category": "contract", "importance": 3, "wl": false, "topic": "아마존 스타링크추격"}, {"title": "Private German rocket makes history, reaches orbit from European soil - Space", "summary": "독일 민간 로켓이 유럽 영토에서 최초로 궤도 진입에 성공했다. 우주 발사체 기술 발전과 상업화 진전을 나타낸다.", "source": "Space", "date": "2026-09-06 05:51", "url": "https://www.space.com/space-exploration/launches-spacecraft/isar-aerospace-second-launch-norway-andoya-spaceport-spectrum-rocket", "category": "tech", "importance": 3, "wl": false, "topic": "유럽 민간로켓"}], "competitor": [{"title": "\"조직범죄 기업이냐, 中 기술굴기 견제냐\"…美 법정 서는 화웨이", "summary": "미국 정부는 2019년 화웨이를 거래제한 명단에 올린 데 이어 첨단 반도체와 소프트웨어 접근을 제한하고 있다. 미국 시장에서 화웨이 통신장비의 퇴출을 추진하는 등 제재 수위를 지속적으로 확대해왔다. 조직범죄 혐의 및 기술굴기 견제를 둘러싼 법적 공방이 미국 법정에서 진행되고 있다. 글로벌 통신장비 시장에서 화웨이를 향한 미국의 제재 기조는 여전히 엄격하다.", "source": "ajunews.com", "date": "2026-09-07 11:14", "url": "https://www.ajunews.com/view/20260907110239396", "category": "policy", "importance": 5, "wl": false, "topic": "화웨이 미국제재"}, {"title": "Rakuten Symphony, TAWAL Launch Saudi Arabia’s First Cloud RAN Shared Indoor Network - The ", "summary": "라쿠텐 심포니가 사우디아라비아 인프라 기업 TAWAL과 손잡고 사우디 최초의 클라우드 기반 가상화 무선 접속망(Cloud RAN) 공유 실내 네트워크를 구축한다고 발표했다. 오픈랜 선도 주자인 라쿠텐 심포니의 중동 시장 수주 성과다.", "source": "The Fast Mode", "date": "2026-09-07 08:14", "url": "https://www.thefastmode.com/technology-solutions/50500-rakuten-symphony-tawal-launch-saudi-arabia-s-first-cloud-ran-shared-indoor-network", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐심포니 사우디"}, {"title": "Huawei Trial Draws Investor Attention To Key Telecom Network Suppliers - londoninsider.co.", "summary": "화웨이를 둘러싼 미국 법원의 재판 진행이 전 세계 주요 통신 네트워크 장비 공급업체들에 대한 투자자들의 관심을 집중시키고 있다. 화웨이 사법 리스크가 글로벌 통신장비 시장 점유율 구도에 미치는 영향을 분석했다.", "source": "londoninsider.co.uk", "date": "2026-09-07 06:26", "url": "https://londoninsider.co.uk/huawei-trial-draws-investor-attention-to-key-telecom-network-suppliers/", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 재판"}, {"title": "화웨이 , 美 법정서 ‘성장 과정 불법성’ 가린다", "summary": "중국 최대 통신장비 업체 화웨이가 미국에서 회사의 성장 과정 자체를 겨냥한 대형 형사재판의 심판대에 오른다. 미국 검찰은 화웨이가 20여 년에 걸쳐 경쟁사의 영업비밀을 탈취하고 대북 및 이란 제재를 우회했다고 주장하고 있다. 글로벌 통신장비 시장의 선두 주자인 화웨이에 대한 사법 리스크가 최고조에 달하고 있다. 이번 재판 결과는 화웨이의 글로벌 사업 전략에 중대한 분수령이 될 전망이다.", "source": "g-enews.com", "date": "2026-09-07 04:02", "url": "https://www.g-enews.com/view.php?ud=2026090623002345259a1f309431_1", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 미국재판"}, {"title": "ASTS Stock Eyes Comeback After 4-Week Slide: Japan Filing Confirms Rakuten-Led Pick For Ne", "summary": "일본 규제 파일링을 통해 라쿠텐이 주도하는 AST SpaceMobile의 위성통신 파트너십 채택이 확인됐다. 주가 반등 조짐과 함께 글로벌 위성 통신 시장에서의 입지를 다지고 있다.", "source": "Stocktwits", "date": "2026-09-07 00:39", "url": "https://stocktwits.com/news-articles/markets/equity/asts-japan-rakuten-1b-push-spacex-rival/cZmdDamR70H", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐모바일 위성통신"}, {"title": "Nokia, Ericsson, IBM, to Blackberry: How humbled tech giants reinvented for a comeback - T", "summary": "노키아, 에릭슨, IBM, 블랙베리 등 과거 명성을 떨쳤던 글로벌 기술 기업들이 어떻게 혁신을 거쳐 재기에 성공했는지를 조명한 심층 분석 기사다. 글로벌 대형 통신장비 경쟁사인 에릭슨과 노키아의 전략적 전환 과정을 다루고 있어 경쟁정보 가치가 높다.", "source": "The Indian Express", "date": "2026-09-06 17:07", "url": "https://indianexpress.com/article/explained/explained-economics/nokia-ericsson-ibm-blackberry-comeback-10865506/", "category": "exec", "importance": 4, "wl": false, "topic": "노키아 에릭슨 재기"}, {"title": "Maxis Deploys Nokia Optical Transport Technology To Boost AI And Enterprise Network Capaci", "summary": "말레이시아 통신사 막시스가 자사의 AI 및 기업용 네트워크 역량을 강화하기 위해 노키아의 광전송(Optical Transport) 기술을 도입한다고 발표했다. 글로벌 대형 통신장비 경쟁사의 구체적인 수주 계약 건으로 의미가 크다.", "source": "pokde.net", "date": "2026-09-06 05:55", "url": "https://pokde.net/system/service/telco-isp/maxis-deploys-nokia-optical-transport-technology", "category": "contract", "importance": 4, "wl": false, "topic": "노키아 막시스수주"}, {"title": "Huawei September 7 Event: These seven devices launching next week - Huawei Central", "summary": "화웨이가 9월 7일 개최하는 대규모 신제품 행사를 통해 스마트폰, 웨어러블 등 7개의 신규 기기를 전격 공개한다. 글로벌 경쟁사의 신제품 출시 로드맵을 파악할 수 있는 주요 행사 소식이다.", "source": "Huawei Central", "date": "2026-09-05 21:57", "url": "https://www.huaweicentral.com/huawei-september-7-launching-devices/", "category": "tech", "importance": 4, "wl": false, "topic": "화웨이 신제품발표"}, {"title": "Is Nokia Oyj (HLSE:NOKIA) A Bargain Following Its AI And Broadband Expansion? - simplywall", "summary": "노키아(Nokia Oyj)가 인공지능(AI) 및 광대역 통신망 확장을 추진함에 따라 현재 주가가 매력적인 저가 매수 기회인지 분석한 기업 가치 평가 기사다. 노키아의 차세대 기술 투자 전략을 다룬다.", "source": "simplywall.st", "date": "2026-09-07 03:38", "url": "https://simplywall.st/stocks/fi/tech/hel-nokia/nokia-oyj-shares/news/is-nokia-oyj-hlsenokia-a-bargain-following-its-ai-and-broadb", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai브로드밴드"}, {"title": "Nokia stock holds as investors await a fresh catalyst - AD HOC NEWS", "summary": "투자자들이 새로운 사업 촉매제를 기다리는 가운데 노키아 주가가 안정세를 유지하고 있다는 금융 시장 리포트다. 경쟁사의 경영 지표 및 시장 반응을 참고할 수 있다.", "source": "AD HOC NEWS", "date": "2026-09-07 02:20", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/nokia-stock-holds-as-investors-await-a-fresh-catalyst/70060893", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 주가동향"}, {"title": "통신장비주, 같은 실적 개선인데 美는 곧장 주가로 韓은 더디게 - 메트로신문", "summary": "미국과 한국 통신장비주의 실적 개선에도 불구하고 주가 반응에서 온도차가 나는 현상을 분석했다. 글로벌 및 국내 장비 시장 환경을 진단한다.", "source": "메트로신문", "date": "2026-09-06 09:13", "url": "https://www.metroseoul.co.kr/article/20260906500019", "category": "earnings", "importance": 3, "wl": false, "topic": "통신장비주 실적"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "통신 임원들이 5G의 더 큰 사업 기회가 소비자 시장보다는 산업용 자동화와 스마트팩토리 영역에 있다고 강조한 업계 진단 기사다. 에릭슨, 노키아 등 장비사들의 B2B 5G 전략과 맞닿아 있다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 5g오토메이션"}, {"title": "Huawei Pura X View could be available for purchase on September 10 - Huawei Central", "summary": "화웨이의 새로운 폼팩터 기기인 'Huawei Pura X View'가 오는 9월 10일부터 소비자 구매가 가능해질 것이라는 출시 일정 관련 보도다.", "source": "Huawei Central", "date": "2026-09-05 18:47", "url": "https://www.huaweicentral.com/huawei-pura-x-view-purchase-on-september-10/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 신제품출시"}, {"title": "Telecom news: InCoax Networks, Nokia, Sjoberg’s, Telit Cinterion, Array Digital Infrastruc", "summary": "InCoax Networks, 노키아, Sjoberg's, 텔릿 신테리온 등 글로벌 통신장비 및 인프라 기업들의 최근 수주 및 기술 공급 동향을 종합한 통신 장비 업계 소식이다. 경쟁사의 장비 공급 및 솔루션 확장 소식을 담고 있다.", "source": "TelecomLead", "date": "2026-09-05 16:34", "url": "https://telecomlead.com/news/telecom-news-incoax-networks-nokia-sjobergs-telit-cinterion-array-digital-infrastructure-127613", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 수주실적"}, {"title": "명진아이씨티, K-ICT WEEK 2026서 Wi-Fi7 무선인프라 소개... \"공공·기업...", "summary": "명진아이씨티가 K-ICT WEEK 2026에서 공공 및 기업용 Wi-Fi 7 무선 인프라와 네트워크 장비 솔루션을 소개했다. 국내 중소 네트워크 장비 파트너사의 마케팅 활동이다.", "source": "kr.aving.net", "date": "2026-09-07 10:26", "url": "https://kr.aving.net/news/articleView.html?idxno=1814126", "category": "contract", "importance": 2, "wl": false, "topic": "명진아이씨티 wi-fi"}, {"title": "HUAWEI WATCH 6 Pro - HUAWEI Global", "summary": "화웨이가 글로벌 시장을 대상으로 출시한 신형 스마트웨어러블 기기 'HUAWEI WATCH 6 Pro'의 공식 제품 소개 및 사양 정보다. 삼성전자 네트워크사업과 무관한 단말기 기사로 none이어야 하나 화웨이 제품이므로 competitor로 분류한다.", "source": "HUAWEI Global", "date": "2026-09-07 09:15", "url": "https://consumer.huawei.com/en/wearables/watch-6-pro/", "category": "tech", "importance": 2, "wl": false, "topic": "화웨이 스마트워치"}, {"title": "수급 악화로 주가 빠졌지만… RFHIC 반등 기대 커지는 까닭 - 핀포인트뉴스", "summary": "국내 통신장비 부품업체 RFHIC의 수급 악화에 따른 주가 하락 및 반등 기대감을 다룬다. 장비 부품사 시황 분석이다.", "source": "핀포인트뉴스", "date": "2026-09-06 09:56", "url": "https://www.pinpointnews.co.kr/news/articleViewAmp.html?idxno=484216", "category": "earnings", "importance": 2, "wl": false, "topic": "rfhic 실적"}, {"title": "\"빚내서 산 AI 주식 털어낸다\"… 中 증시, 美 금리 급등·유가 충격에 신...", "summary": "미국 금리 급등과 유가 충격 등의 악재로 중국 증시의 스타 마켓 50 지수가 연중 최저점 위기에 직면했다. AI 수익화에 대한 회의론이 확산되면서 관련 주식 매도세가 이어지고 있다. 경쟁사인 이옵톨링크 등 광통신 부품 기업들도 시장 변동성의 영향을 받고 있다. 중국 AI 거래의 심장부인 상하이 시장의 투자 심리가 크게 위축된 모습이다.", "source": "g-enews.com", "date": "2026-09-06 06:06", "url": "https://www.g-enews.com/view.php?ud=202609060000201450c8c1c064d_1", "category": "other", "importance": 2, "wl": false, "topic": "중국증시 스타마켓"}], "policy": [{"title": "Jio, Airtel and Vodafone Idea contest TRAI’s 5G slicing quality rules - Communications Tod", "summary": "지오, 에어텔, 보다폰 아이디어가 인도 통신규제위원회(TRAI)의 5G 네트워크 슬라이싱 품질 규제 방침에 대해 이의를 제기하고 반발하고 있다. 5G 핵심 기술 활용과 관련된 규제 정책을 둘러싼 갈등이다. 주요 통신사와 규제 기관 간의 정책 공방을 다룬다.", "source": "Communications Today", "date": "2026-09-07 11:02", "url": "https://www.communicationstoday.co.in/jio-airtel-and-vodafone-idea-contest-trais-5g-slicing-quality-rules/", "category": "policy", "importance": 4, "wl": false, "topic": "릴라이언스지오 통신규제"}, {"title": "과기정통부 “화재·재난 시 긴급구조 통신 먼저”", "summary": "과기정통부가 대형 화재 등 재난 상황에서 소방대원의 통신을 우선 전송하도록 제도를 개선했다. 상용망 기반 긴급구조 통신 우선 처리를 도입하여 골든타임을 확보할 수 있게 되었다. 망 중립성 가이드라인의 특수서비스 요건을 전향적으로 해석하여 정책적 유연성을 발휘했다. 국민 안전과 직결된 통신 공공성 강화에 크게 기여할 것으로 평가받는다.", "source": "dailian.co.kr", "date": "2026-09-07 11:02", "url": "https://www.dailian.co.kr/news/view/1686649/?sc=Naver", "category": "policy", "importance": 4, "wl": false, "topic": "과기정통부 재난통신"}, {"title": "AI 전력경쟁에 에너지 R&D 48%↑…에너지·원자력 예산 ‘역대 최대’", "summary": "국회에 제출된 자료에 따르면 과기정통부의 2027년도 에너지 기술 R&D 예산이 대폭 증가했다. AI 시대의 전력 수요 급증에 대응하기 위한 정부의 투자가 확대되고 있다. 전체 에너지 R&D 예산은 역대 최대 규모로 편성되어 관련 기술 확보에 집중된다. 차세대 에너지 인프라 구축을 위한 국가적 지원이 본격화될 전망이다.", "source": "kukinews.com", "date": "2026-09-07 11:44", "url": "https://www.kukinews.com/article/view/kuk202609070086", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 에너지r&d"}, {"title": "쿠팡 과징금 6246억인데 티빙은 100억대?…3954만 계정 유출 '티빙 제재...", "summary": "과기정통부는 정보통신망법 위반 사항에 대해 과태료 부과 및 시정명령을 내릴 계획이다. 대규모 개인정보 유출 사고와 관련해 피해 규모와 민감도, 취약점 방치 여부 등이 종합적으로 고려된다. 전문가들은 가중 요소를 정밀하게 반영하여 강력한 제재가 이루어져야 한다고 지적한다. 통신망 사업자의 보안 책임과 관리 의무가 더욱 강조되는 시점이다.", "source": "thepublic.kr", "date": "2026-09-07 11:06", "url": "https://www.thepublic.kr/news/articleView.html?idxno=317760", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 정보통신망법"}, {"title": "쿤텍, ETRI와 온디바이스 AI 정보 보호 기술 개발 진행", "summary": "쿤텍이 ETRI와 함께 온디바이스 AI 정보 보호 기술 개발을 진행하고 있다. 해당 연구는 과기정통부와 정보통신기획평가원의 지원을 받는 정부 과제의 일환이다. 온디바이스 AI 환경에서의 정보 유출 방지를 위한 기술 고도화에 주력하고 있다. 차세대 인공지능 보안 표준을 수립하는 데 기여할 것으로 기대된다.", "source": "epnc.co.kr", "date": "2026-09-07 10:28", "url": "https://www.epnc.co.kr/news/articleView.html?idxno=406607", "category": "tech", "importance": 3, "wl": false, "topic": "쿤텍 온디바이스ai"}, {"title": "딥페이크 성범죄 차단 의무 어긴 플랫폼 과징금 부과 추진", "summary": "방송통신위원회와 과기정통부는 딥페이크 성범죄 차단 의무를 위반한 글로벌 플랫폼에 과징금 부과를 추진한다. 해외 수사기관과의 사법 공조를 확대하고 글로벌 빅테크 기업들이 한국 법령의 불법 영상물 규제 기준을 준수하도록 유도한다. 디지털 성범죄 근절을 위한 정부의 규제 고삐가 더욱 조여질 전망이다. 국내외 플랫폼 사업자의 책임성과 자율 규제 준수가 요구된다.", "source": "gokorea.kr", "date": "2026-09-07 09:48", "url": "https://www.gokorea.kr/news/articleView.html?idxno=877392", "category": "policy", "importance": 3, "wl": false, "topic": "방송통신위원회 딥페이크"}, {"title": "Communications Minister Jyotiraditya Scindia releases revised TDIP guidelines to boost tel", "summary": "인도 통신장관이 통신 부문 육성을 위한 수정된 TDIP 가이드라인을 발표했다. 현지 통신 인프라 투자 촉진 및 규제 개선을 도모한다.", "source": "News On AIR", "date": "2026-09-06 22:10", "url": "https://newsonair.gov.in/communications-minister-jyotiraditya-scindia-releases-revised-tdip-guidelines-to-boost-telecom-sector/", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신정책"}, {"title": "Pakistan Climbs to 7th Globally After a Successful 5G Spectrum Auction - TechJuice", "summary": "파키스탄이 성공적인 5G 주파수 경매를 통해 글로벌 순위 7위로 도약했다. 국가 무선 통신 경쟁력 강화 성과를 다룬다.", "source": "TechJuice", "date": "2026-09-06 02:28", "url": "https://www.techjuice.pk/pakistan-climbs-to-7th-globally-after-a-successful-5g-spectrum-auction/", "category": "policy", "importance": 3, "wl": false, "topic": "파키스탄 5g경매"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "미국 FAA의 5G 무선 고도계 규정 시행으로 항공기와 통신 주파수 간의 오랜 갈등이 일단락됐다. 5G 통신망 운용 환경이 안정화된다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "faa 5g규제"}, {"title": "한국판 구글·페이스북을 목표로…전국 4대 과기원 ‘딥테크 창업’ 진...", "summary": "과기정통부는 대전 KAIST에서 4대 과학기술원 공동 창업리그 최종 본선을 개최했다. 한국판 구글과 페이스북 배출을 목표로 딥테크 창업을 적극 지원하고 있다. 수상팀에게는 과기정통부 장관상과 함께 최대 2억 원의 상금이 수여된다. 우수 과학기술 인재들의 창업 생태계 활성화가 가속화되고 있다.", "source": "biz.heraldcorp.com", "date": "2026-09-07 11:39", "url": "https://biz.heraldcorp.com/article/10864895?ref=naver", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 창업리그"}, {"title": "한미약품, 4000종 품질문서 AI로 학습…문서업무 자동화", "summary": "한미약품은 과기정통부가 주관하는 AX 원스톱 바우처 지원사업 제약 바이오 부문 지원 대상 기업으로 선정됐다. 인공지능 솔루션 도입과 실증을 통해 품질문서 업무 자동화를 추진한다. Hanmi Q-Agent로 명명된 이번 솔루션은 전사적 업무 효율성을 높일 것으로 기대된다. 정부 지원을 통한 전통 제조업의 디지털 전환이 가속화되고 있다.", "source": "sedaily.com", "date": "2026-09-07 11:15", "url": "https://www.sedaily.com/article/20087912?ref=naver", "category": "other", "importance": 2, "wl": false, "topic": "한미약품 ax바우처"}, {"title": "연구개발특구, 기업성장 전문경영인 양성 본격화", "summary": "과기정통부와 연구개발특구진흥재단은 이노폴리스 Scale-up 교육과정을 본격화했다. 대덕특구 내 딥테크 기업의 성장을 이끌 전문경영인 양성을 목표로 한다. 김성수 연구개발정책실장은 이번 교육과정이 지역 기업의 도약에 중요한 역할을 할 것이라고 강조했다. 정부의 기술 사업화 및 인재 양성 지원이 지속되고 있다.", "source": "goodmorningcc.com", "date": "2026-09-07 10:50", "url": "https://www.goodmorningcc.com/news/articleView.html?idxno=451877", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 연구개발특구"}, {"title": "KB스타뱅킹, 모바일신분증 'ISMS-P' 획득…\"정보보호 신뢰성 높여\"", "summary": "KB스타뱅킹이 모바일신분증 서비스와 관련해 ISMS-P 인증을 획득했다. 해당 인증은 과기정통부와 개인정보보호위원회가 공동 주관하고 한국인터넷진흥원이 운영한다. 정보보호 및 개인정보보호 관리체계의 운영 현황과 보안 안정성을 공식적으로 인정받았다. 금융 서비스의 보안 신뢰성을 한층 높이는 계기가 되었다.", "source": "view.asiae.co.kr", "date": "2026-09-07 10:04", "url": "https://view.asiae.co.kr/article/2026090710040038640", "category": "policy", "importance": 2, "wl": false, "topic": "kb스타뱅킹 ismsp"}, {"title": "이스트시큐리티, 네이버클라우드 '보안 특화 AI 개발' 컨소시엄 참여", "summary": "이스트시큐리티가 네이버클라우드 컨소시엄에 참여해 보안 특화 AI 파운데이션 모델 개발에 나선다. 본 사업은 과기정통부와 정보통신산업진흥원이 주관하는 국책 과제다. 사이버 보안 분야에 특화된 인공지능 기술을 고도화하여 위협 대응 능력을 높인다는 목표다. 민관 협력을 통한 국내 보안 AI 생태계 조성에 기여할 것으로 기대된다.", "source": "inews24.com", "date": "2026-09-07 09:32", "url": "http://www.inews24.com/view/2002523", "category": "tech", "importance": 2, "wl": false, "topic": "이스트시큐리티 보안ai"}, {"title": "킨텍스서 9일 5G 특화망 세미나… 중소기업 지원사업 무료 소개 - 스페셜타임스", "summary": "킨텍스에서 5G 특화망 세미나가 개최되어 중소기업 지원사업이 무료로 소개될 예정이다. 국내 5G 특화망 활성화 및 중소기업 참여를 독려하기 위한 행사이다. 정책적 지원 방향을 참고하는 수준이다.", "source": "스페셜타임스", "date": "2026-09-07 09:25", "url": "http://www.specialtimes.co.kr/news/articleView.html?idxno=459279", "category": "policy", "importance": 2, "wl": false, "topic": "과학기술정보통신부 5g"}, {"title": "투자자들은 SBA Communications(SBAC)의 주파수 경매 및 타워 임대 전망에 어떻게 반응하고 있는가 - simplywall.st", "summary": "SBA 커뮤니케이션즈의 타워 임대 사업 및 주파수 경매 전망에 대한 투자자 반응을 다룬다.", "source": "simplywall.st", "date": "2026-09-06 02:33", "url": "https://simplywall.st/ko/stocks/us/real-estate/nasdaq-sbac/sba-communications/news/c99598680c99f9e6/amp", "category": "policy", "importance": 2, "wl": false, "topic": "sba커뮤니케이션즈 주파수"}], "carrier": [{"title": "이통3사 5G SA 전환 속도전…앞서가는 KT에 SKT·LGU+ \"연내 상용화\" - 뉴스웍스", "summary": "국내 이동통신 3사의 5G 단독모드(SA) 전환 속도가 빨라지는 가운데, 상대적으 "}, {"title": "\"AI 데이터센터에 모듈러 접목\" … GS건설·LGU+ 표준모델 개발", "summary": "GS건설이 급증하는 AI 데이터센터 수요에 대응하기 위해 LG유플러스 등과 손잡고 모듈러 기술을 접목한 사전 제작형 모듈러 데이터센터(PMDC) 표준모델 공동 개발에 나선다. 설계와 시공부터 운영까지 전문 역량을 결집해 데이터센터 밸류체인을 확대할 계획이다. 이동통신사의 인프라 확장과 직결되는 핵심 협력 사업이다.", "source": "매일경제 IT", "date": "2026-09-06 17:12", "url": "https://www.mk.co.kr/news/realestate/12145461", "category": "contract", "importance": 4, "wl": true, "topic": "lg유플러스 데이터센터"}, {"title": "Charter Stock Outlook: Can the $34.5B Cox Merger Help CHTR Recover Before Earnings? - trad", "summary": "차터 커뮤니케이션즈가 345억 달러 규모의 콕스(Cox) 인수 합병을 추진 중인 가운데, 실적 발표를 앞둔 주가 전망이 주목받고 있다. 케이블 및 통신 업계의 대형 M&A 딜로 시장 재편에 큰 영향을 미친다. 업계 판도를 바꾸는 대형 인수합병 건이다.", "source": "tradingkey.com", "date": "2026-09-06 07:20", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/261998863-charter-stock-outlook-cox-merger-chtr-before-earnings-tradingkey", "category": "contract", "importance": 4, "wl": false, "topic": "차터커뮤니케이션즈 m&a"}, {"title": "LG유플러스-GS건설, 모듈러 데이터센터 표준모델 개발 협력 - 이슈밸리", "summary": "LG유플러스가 GS건설과 손잡고 모듈러 데이터센터 표준 모델 개발을 위한 상호 협력을 체결했다. AI 데이터센터 구축 속도를 높이기 위한 전략적 제휴이다. 인프라 구축 역량 강화를 위한 파트너십이다.", "source": "이슈밸리", "date": "2026-09-07 11:34", "url": "https://www.issuevalley.com/news/articleView.html?idxno=56058", "category": "contract", "importance": 3, "wl": false, "topic": "엘지유플러스 데이터센터"}, {"title": "우상호 지사 “원주·춘천에 KT·신세계 AI 데이터센터 유치 추진” - v.daum.net", "summary": "우상호 지사가 원주와 춘천 지역에 KT 및 신세계의 AI 데이터센터 유치를 적극 추진하겠다고 밝혔다. 지역 인프라 확충과 대기업 투자 유치를 연계한 사업이다. 통신사의 데이터센터 확장 부지 확보 움직임이다.", "source": "v.daum.net", "date": "2026-09-07 11:15", "url": "https://v.daum.net/v/20260907111551490", "category": "contract", "importance": 3, "wl": false, "topic": "강원도 데이터센터"}, {"title": "아임토리, KT 오픈이노베이션 ‘2026 KT Collaboration’ 파트너 최종 선정 - 세계비즈", "summary": "아임토리가 KT의 오픈이노베이션 프로그램인 2026 KT Collaboration 파트너로 최종 선정됐다. 유망 스타트업과의 상생 협력 및 기술 제휴를 위한 행보이다.", "source": "세계비즈", "date": "2026-09-07 11:02", "url": "https://www.segyebiz.com/newsView/20260907506823", const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
