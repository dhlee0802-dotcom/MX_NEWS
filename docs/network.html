<style>

    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px 0}

  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}

  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

": "https://m.kr.investing.com/news/stock-market-news/article-2084212?ampMode=1", "category": "contract", "importance": 5, "wl": false, "topic": "삼성전자 kddi 수주"}, {"title": "Private 5G docks in Hamburg – as Deutsche Telekom and Ericsson scratch a seven-year itch", "summary": "도이치텔레콤과 에릭슨이 독일 함부르크의 알텐베르더 컨테이너 터미널에 프라이빗 5G 네트워크를 구축했다. 이는 산업용 5G의 상용화 가능성을 보여주는 7년 간의 실험 결과물이다. 경쟁사의 대형 수주 및 구축 사례로 중요도가 높다.", "source": "RCR Wireless", "date": "2026-09-05 00:21", "url": "https://rcrwireless.com/20260904/private-5g/private-5g-hamburg-deutsche-telekom-ericsson", "category": "contract", "importance": 4, "wl": true, "topic": "에릭슨 수주"}, {"title": "Nokia unveils AI-focused R&D centre in Saudi Arabia - Mobile Europe", "summary": "노키아가 사우디아라비아에 인공지능(AI) 중심의 연구개발(R&D) 센터를 신설하며 중동 시장 공략을 본격화했다. 이번 R&D 센터는 AI를 활용한 차세대 네트워크 자동화와 최적화 기술 연구에 집중할 예정이다. 사우디의 디지털 전환 정책과 맞물려 현지 통신사들과의 협력이 더욱 긴밀해질 것으로 기대된다. 에릭슨 등 경쟁사들과의 중동 5G 및 AI 인프라 수주 경쟁에서 유리한 고지를 차지하기 위한 전략적 행보로 평가된다.", "source": "Mobile Europe", "date": "2026-09-04 17:55", "url": "https://www.mobileeurope.co.uk/nokia-saudi-arabia-centre-ai/", "category": "tech", "importance": 4, "wl": false, "topic": "노키아 ai 연구소"}, {"title": "楽天モバイルが再びau回線のローミングを10月以降も継続することを案内！KDDIと現在も詰めの協議を実施中。十分なカバーエリアは縮小へ - s-max.jp", "summary": "라쿠텐 모바일이 KDDI(au)와의 회선 로밍 계약을 10월 이후에도 계속 연장하기로 하고 세부 협상을 진행 중인 소식입니다. 자체 커버리지 축소에 따른 망 임차 전략의 변화를 보여줍니다. 경쟁사 및 파트너십 동향으로 중요합니다.", "source": "s-max.jp", "date": "2026-09-05 21:21", "url": "https://s-max.jp/archives/1810148.html", "category": "contract", "importance": 3, "wl": false, "topic": "라쿠텐모바일 네트워크"}, {"title": "Huawei Enterprise AI Push Is Reshaping Industrial Infrastructure - urbanacres.in", "summary": "화웨이가 기업용 AI 추진 전략을 통해 산업 인프라 전반을 재편하고 있다고 전해졌다. 제조, 물류, 에너지 등 다양한 산업 분야에 AI 기반 통신 및 컴퓨팅 인프라를 공급하며 디지털 전환을 주도하고 있다. 엔터프라이즈 시장에서의 강력한 하드웨어 및 소프트웨어 결합 역량을 과시하고 있다. 글로벌 통신장비사들의 AI 인프라 시장 공략 경쟁을 보여주는 대목이다.", "source": "urbanacres.in", "date": "2026-09-05 11:27", "url": "https://urbanacres.in/huawei-enterprise-ai-push-is-reshaping-industrial-infrastructure/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 ai 인프라"}, {"title": "Nokia Tests Network APIs in Healthcare - Telecom Reseller / Technology Reseller News", "summary": "노키아가 헬스케어 분야에서 네트워크 API 테스트를 진행하며 새로운 통신 서비스 활용 가능성을 모색하고 있다. 이번 테스트는 통신망의 프로그래밍 가능성을 높여 의료 분야를 비롯한 다양한 산업에서 맞춤형 네트워크 서비스를 제공하기 위한 것이다. 경쟁사인 에릭슨 및 화웨이 등도 API 생태계 확장을 추진하는 가운데, 노키아는 실증 단계를 거쳐 상용화 기반을 다지고 있다. 향후 통신사의 수익 다변화와 B2B 솔루션 경쟁에서 중요한 기술적 이정표가 될 것으로 기대된다.", "source": "Telecom Reseller / Technology Reseller News", "date": "2026-09-05 06:30", "url": "https://telecomreseller.com/2026/09/04/nokia-tests-network-apis-in-healthcare/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 네트워크 api"}, {"title": "The Swedish company Ericsson intends to gain a foothold in the Turkmen market of telecommu", "summary": "스웨덴 통신장비 기업 에릭슨이 투르크메니스탄의 통신 시장에 본격적으로 발을 들여놓을 채비를 하고 있다. 중앙아시아 지역의 통신 인프라 현대화 수요를 공략하여 신규 시장을 개척하려는 전략이다. 현지 통신사들과의 협력을 통해 장비 공급 기회를 모색하고 있다. 글로벌 영토 확장과 판로 다변화를 위한 에릭슨의 영업력이 주목받고 있다.", "source": "turkmenportal.com", "date": "2026-09-05 06:17", "url": "https://turkmenportal.com/en/news/54025-shvedskaya-kompaniya-ericsson-namerena-zakrepitsya-na-turkmenskom-rynke-telekommunikacionnyh-uslug--------------------------", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 투르크메니스탄 진출"}, {"title": "MasOrange, Ericsson test 6 GHz spectrum in early step toward 6G future - Fierce Network", "summary": "스페인 통신사 마스오렌지와 에릭슨이 6GHz 주파수를 활용한 테스트를 진행하며 6G 미래를 향한 초기 발걸음을 내디뎠다. 이번 시험은 차세대 이동통신을 위한 잠재적 주파수 대역의 성능을 검증하고 상용화 가능성을 타진하기 위한 것이다. 양사는 협력을 통해 주파수 효율성을 극대화하고 미래 네트워크 아키텍처를 준비하고 있다. 6G 표준화 경쟁이 본격화되는 가운데 장비사와 통신사의 사전 기술 검증이 활발해지고 있다.", "source": "Fierce Network", "date": "2026-09-05 01:11", "url": "https://www.fierce-network.com/newswire/masorange-ericsson-test-6-ghz-spectrum-early-step-toward-6g-future", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 6g 주파수"}, {"title": "BSNL 4G Network Hits 6 Petabytes Daily Traffic Milestone - Whalesbook", "summary": "BSNL의 국산 4G 네트워크가 일일 트래픽 6 페타바이트를 처리하는 기록을 세웠다는 인프라 운영 성과 보도입니다. 인도 자국 기술 기반 통신망의 확장성을 입증합니다. 통신 장비 시장 및 국산화 동향으로 중요합니다.", "source": "Whalesbook", "date": "2026-09-04 23:54", "url": "https://www.whalesbook.com/news/English/technology/BSNL-4G-Network-Hits-6-Petabytes-Daily-Traffic-Milestone/6a9adba440007e01b839cb5a", "category": "tech", "importance": 3, "wl": false, "topic": "c-dot 4g네트워크"}, {"title": "Huawei latest SingleRAN 22.1 launch targets the Agentverse - Total Telecom", "summary": "화웨이가 최신 무선 통신 솔루션인 싱글란 22.1 버전을 출시하며 에이전트버스(Agentverse)를 타겟팅한다고 밝혔다. AI 에이전트와 연동하여 무선 네트워크의 자율 운영과 효율성을 극대화하는 데 초점을 맞추었다. 통신사의 운영 비용을 절감하고 지능형 망 관리를 지원하는 차세대 장비 솔루션이다. 글로벌 경쟁사들의 AI 기반 무선망 솔루션 각축전 속에서 화웨이의 기술 진화를 보여준다.", "source": "Total Telecom", "date": "2026-09-04 22:16", "url": "https://totaltele.com/huawei-latest-singleran-22-1-launch-targets-the-agentverse/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 싱글란 출시"}, {"title": "Telecom Vendors, Please Stop Selling the Data Tsunami Story - sebastianbarros.substack.com", "summary": "통신 장비 공급업체들이 마케팅 수단으로 활용해 온 '데이터 쓰나미(Data Tsunami)' 서사를 이제는 중단해야 한다는 업계 전문가의 비판적 분석 칼럼입니다. 트래픽 증가에 따른 과도한 장비 투자 마케팅의 실효성을 지적합니다. 통신장비 시장의 전략적 방향성에 대한 화두를 던집니다.", "source": "sebastianbarros.substack.com", "date": "2026-09-04 22:00", "url": "https://sebastianbarros.substack.com/p/telecom-vendors-please-stop-selling", "category": "policy", "importance": 3, "wl": false, "topic": "통신장비 산업전망"}, {"title": "딥시크, 내몽골 1GW 데이터센터에 ' 화웨이 칩 16만개' 투입 추진", "summary": "중국 인공지능(AI) 스타트업 딥시크가 자국 통신장비 ·반도체 기업 화웨이 의 AI 가속기 도입을 추진하며 대규모 컴퓨팅 거점 구축에 속도를 내고 있다. 4일(현지시간) 블룸버그 통신 에 따르면 딥시크는 내몽골 자치구에...", "source": "joseilbo.com", "date": "2026-09-04 21:13", "url": "http://www.joseilbo.com/news/news_read.php?uid=575124&class=78&grp=", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Light tech pioneer pureLiFi goes bust - mobileworldlive.com", "summary": "Li-Fi(빛을 이용한 통신 기술) 분야의 선구자였던 퓨어라이피(pureLiFi)가 사업 부도로 파산 절차에 들어갔다는 충격적인 업계 소식입니다. 차세대 무선 통신 기술 상용화의 어려움과 스타트업의 한계를 보여줍니다. 통신 기술 생태계에 큰 시사점을 줍니다.", "source": "mobileworldlive.com", "date": "2026-09-04 20:21", "url": "https://www.mobileworldlive.com/network-tech/light-tech-pioneer-purelifi-goes-bust/", "category": "exec", "importance": 3, "wl": false, "topic": "퓨어라이피 파산"}, {"title": "Huawei Earthquake early alerts feature reaches over 100 million users - Huawei Central", "summary": "화웨이의 스마트폰 및 네트워크 기능을 활용한 지진 조기경보 기능이 1,000만 명 이상의 사용자에게 도달했다고 전해졌다. 통신망과 단말 기술을 연계하여 재난 상황에서 신속한 경보를 전달하는 공공 안전 솔루션의 일환이다. 통신 기술의 사회적 기여와 시스템 안정성을 보여주는 사례다. 화웨이의 통신 장비 및 단말 통합 생태계의 역량을 나타낸다.", "source": "Huawei Central", "date": "2026-09-04 20:04", "url": "https://www.huaweicentral.com/huawei-earthquake-alerts-100-million-users/", "category": "tech", "importance": 3, "wl": false, "topic": "화웨이 지진 조기경보"}, {"title": "Nokia's Index Comeback Collides With a Pivotal Quarter of Promises and Setbacks - AD HOC N", "summary": "노키아의 최근 주가 반등세가 핵심 분기 실적 발표와 다양한 약속 및 차질 사이의 시험대에 올랐다. 증권가에서는 노키아의 구조조정과 신사업 성과가 실적으로 가시화될지 주목하고 있다. 글로벌 통신장비 시장의 투자 둔화 우려 속에서도 차별화된 기술력으로 돌파구를 찾으려 하고 있다. 이번 분기는 노키아의 중장기 성장 전략의 성공 여부를 가늠할 중요한 분수령이 될 전망이다.", "source": "AD HOC NEWS", "date": "2026-09-04 18:11", "url": "https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/nokia-s-index-comeback-collides-with-a-pivotal-quarter-of-promises-and/70053646", "category": "earnings", "importance": 3, "wl": false, "topic": "노키아 실적 전망"}, {"title": "Maxis strengthens its nationwide network infrastructure with Nokia’s optical transport tec", "summary": "말레이시아 통신사 맥시스가 노키아의 광전송 기술을 도입해 전국적인 네트워크 인프라를 대폭 강화했다. 이번 장비 공급 계약을 통해 맥시스는 급증하는 트래픽을 효율적으로 수용하고 5G 서비스 품질을 향상할 기반을 마련했다. 노키아는 아시아 태평양 지역에서 광인프라 수주를 추가로 확보하며 시장 입지를 다지고 있다. 이번 협력은 통신사의 네트워크 고도화 과정에서 노키아의 광전송 솔루션 경쟁력을 입증하는 사례다.", "source": "telecomtv.com", "date": "2026-09-04 17:09", "url": "https://www.telecomtv.com/content/nokia/maxis-strengthens-its-nationwide-network-infrastructure-with-nokia-s-optical-transport-technology-56172/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 네트워크 인프라"}, {"title": "Vodafone sets out to ‘disrupt’ EE-backed ESN with critical infra network slicing - telcoti", "summary": "보다폰이 영국 공공안전망(ESN) 사업에서 EE에 맞서기 위해 차별화된 핵심 인프라 네트워크 슬라이싱 기술을 앞세워 시장 진출을 도모하고 있다는 경쟁 구도 보도입니다. 통신장비 및 공공 통신망 수주전과 연관됩니다. 통신사 및 장비 업계의 주요 격전지입니다.", "source": "telcotitans.com", "date": "2026-09-04 17:06", "url": "https://www.telcotitans.com/vodafonewatch/vodafone-sets-out-to-disrupt-ee-backed-esn-with-critical-infra-network-slicing/10840.article", "category": "contract", "importance": 3, "wl": false, "topic": "보다폰 인프라"}, {"title": "Nokia India: Helping operators move towards self-optimising, AI-ready networks - tele.net.", "summary": "노키아 인디아가 인도 통신사들을 대상으로 자가 최적화 및 AI 준비가 완료된 네트워크로의 전환을 지원하고 있다. 인도의 폭발적인 트래픽 증가에 대응해 운영 비용을 절감하고 망 안정성을 높이는 솔루션을 제공하는 것이 핵심이다. 인공지능을 결합한 네트워크 관리 체계는 향후 통신사들의 필수 요구사항으로 자리 잡고 있다. 노키아는 인도 시장에서의 강력한 입지를 바탕으로 AI 기반 네트워크 솔루션 공급을 확대하고 있다.", "source": "tele.net.in", "date": "2026-09-04 16:41", "url": "https://tele.net.in/companies/nokia-india-helping-operators-move-towards-self-optimising-ai-ready-networks-12490570", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai 네트워크"}, {"title": "Nokia may exit the consumer smartphone market - Zamin.uz", "summary": "노키아가 소비자 스마트폰 시장에서 철수할 가능성이 제기된다. 경쟁사의 포트폴리오 재편 및 사업 전략 변화이다.", "source": "Zamin.uz", "date": "2026-09-04 15:54", "url": "https://zamin.uz/en/technology/220178-nokia-may-exit-the-consumer-smartphone-market.html", "category": "other", "importance": 3, "wl": false, "topic": "노키아 스마트폰"}, {"title": "Ericsson and Uni of Tokyo explore connectivity and AI scenarios for 2035 - Telecompaper", "summary": "에릭슨과 도쿄대학이 2035년을 내다보며 미래 연결성 및 AI 시나리오 공동 연구에 착수했다. 양측은 차세대 무선 통신 기술과 인공지능의 융합 방안을 탐색하고 장기적인 R&D 로드맵을 수립할 계획이다. 6G 표준화 초기 단계에서 학계와 산업계의 협력을 통해 기술 주도권을 선점하려는 의도가 담겨 있다. 이는 향후 글로벌 통신 표준 경쟁에서 에릭슨의 기술적 우위를 강화하는 기반이 될 것이다.", "source": "Telecompaper", "date": "2026-09-04 14:41", "url": 이즌이 역대급 분기 실적을 바탕으로 확보한 재원을 활용해 1만6,600명에 달하는 대규모 구조조정 및 인력 감산을 단행했다. 수익성 극대화와 디지털 전환을 위해 비용 구조를 대폭 슬림화하는 고강도 자구책이다. 통신사가 호실적 속에서도 대규모 구조조정에 나선 것은 통신 인프라의 자동화 및 AI 전환 가속화를 시사한다. 업계 전반에 큰 충격을 준 대형 사건이다.", "source": "FinanceFeeds", "date": "2026-09-04 19:17", "url": "https://financefeeds.com/verizon-layoffs-16600-jobs-record-quarter-cost-cuts/", "category": "contract", "importance": 4, "wl": false, "topic": "버라이즌 대규모 구조조정"}, {"title": "Elliott wants to scuttle Deutsche Telekom's T-Mobile US merger - Telecoms", "summary": "행동주의 펀드 엘리엇이 도이치텔레콤과 티모바일 US 간의 메가머저(합병) 계획을 저지하기 위해 압박을 가하고 있다. 글로벌 통신 시장의 거대 자본 이동과 지배구조 개편을 둘러싼 공방이 치열하다. 대형 통신사의 M&A 방향성은 업계 전체의 투자 생태계에 중대한 영향을 미친다. 경영진의 전략적 결단이 주목되는 이슈다.", "source": "Telecoms", "date": "2026-09-04 17:33", "url": "https://www.telecoms.com/operator-ecosystem/elliott-wants-to-scuttle-deutsche-telekom-s-t-mobile-us-merger", "category": "other", "importance": 4, "wl": false, "topic": "도이치텔레콤 m&a 전략"}, {"title": "auの通信品質を最優先！KDDIが楽天モバイルへの回線貸し出しを9月末で終了、自社サービスの快適化へ - DXマガジン", "summary": "KDDI가 au의 통신 품질을 최우선으로 하기 위해 楽天モバイル(라쿠텐 모바일)에 대한 자사 망 회선 대여(로밍)를 9월 말로 완전히 종료한다고 밝혔다. 자사 가입자들에게 더욱 쾌적하고 안정적인 서비스를 제공하기 위한 단호한 조치다. 라쿠텐 모바일의 망 운영 전략에 즉각적인 타격을 줄 수 있는 중대한 계약 종료 건이다. 일본 이동통신 시장의 경쟁 구도 재편을 예고한다.", "source": "DXマガジン", "date": "2026-09-04 17:01", "url": "https://dxmagazine.jp/news/2629ko73re-01-03-04/", "category": "contract", "importance": 4, "wl": false, "topic": "kddi 楽天モバイル 회선 종료"}, {"title": "KDDI achieves 3.6 Gbps outdoor transmission in 7 GHz 6G candidate band - Telecompaper", "summary": "일본 KDDI가 6G 후보 주파수 대역인 7GHz 대역에서 야외 전송 테스트를 통해 3.6Gbps 속도를 달성하는 데 성공했다. 차세대 이동통신 상용화를 위한 고주파수 대역 활용 가능성을 실증적으로 입증한 성과다. 글로벌 통신사들과 장비사들의 6G 기술 선점 경쟁이 본격화되고 있음을 보여준다. 차세대 통신 표준 기술 발전의 중요한 이정표다.", "source": "Telecompaper", "date": "2026-09-04 15:13", "url": "https://www.telecompaper.com/news/kddi-achieves-36-gbps-outdoor-transmission-in-7-ghz-6g-candidate-band--1581713", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g 주파수 시연"}, {"title": "【悲報】楽天モバイルのKDDIローミングが2026年9月末完全終了で都市部で圏外連発！？予想される危機と今すぐやるべき対策を徹底解説！【10月大移動】 Ignacio Buse (", "summary": "2026년 9월 말로 예정된 라쿠텐 모바일의 KDDI 로밍 계약 완전 종료로 인해 도심지 내 圏外(권외·불통) 현상이 대거 발생할 것이라는 우려와 철저한 대비책을 분석했다. 자사 망 커버리지가 완벽하지 않은 상태에서 로밍이 종료될 경우 가입자들이 겪을 불편과 이에 대한 대응 방안이 쟁점이다. 일본 모바일 시장의 치열한 망 경쟁과 가입자 이동을 예고하는 중대 이슈다.", "source": "Mshale", "date": "2026-09-04 09:03", "url": "https://mshale.com/51e38eef/a21a47a8GAceDCRcawIOA1U", "category": "contract", "importance": 4, "wl": false, "topic": "라쿠텐 모바일 kddi 로밍 종료"}, {"title": "Gov’t to upgrade all rural telephony networks to 4G capability – Sam George - MyJoyOnline", "summary": "정부가 모든 농어촌 통신망을 4G 역량으로 업그레이드할 계획이라고 밝혔다. 통신 인프라 고도화 정책이다.", "source": "MyJoyOnline", "date": "2026-09-06 01:48", "url": "https://www.myjoyonline.com/govt-to-upgrade-all-rural-telephony-networks-to-4g-capability-sam-george/", "category": "contract", "importance": 3, "wl": false, "topic": "농어촌 통신망 업그레이드"}, {"title": "T-Mobile CEO appears to have given up on the postpaid crown as he talks up new categories ", "summary": "티모바일 최고경영자가 전통적인 후불 가입자 1위 타이틀 경쟁에서 한 발 물러서는 대신 새로운 사업 카테고리를 적극 홍보하고 나섰다. 가입자 외형 성장보다는 홈 인터넷과 AI 등 고부가가치 신사업에 집중하겠다는 전략의 변화를 시사한다. 통신사의 사업 포트폴리오 재편 방향을 보여준다.", "source": "PhoneArena", "date": "2026-09-06 01:32", "url": "https://www.phonearena.com/news/t-mobile-losing-share-value-under-srini-gopalan_id183107", "category": "tech", "importance": 3, "wl": false, "topic": "티모바일 가입자 전략"}, {"title": "After 10 years of India feat, Jio sets its sights on global market - The Economic Times", "summary": "인도 시장에서의 성공을 바탕으로 릴라이언스 지오가 글로벌 시장 진출을 본격적으로 모색하고 있다는 전략 보도입니다. 인도 통신사의 해외 진출 및 사업 다각화 방향성을 보여줍니다. 글로벌 통신 시장의 주요 동향입니다.", "source": "The Economic Times", "date": "2026-09-06 01:21", "url": "https://m.economictimes.com/industry/telecom/telecom-news/after-10-years-of-india-feat-jio-sets-its-sights-on-global-market/articleshow/133808067.cms", "category": "exec", "importance": 3, "wl": false, "topic": "릴라이언스지오 글로벌"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "미 연방항공청(FAA)의 5G 전파고도계 규정 도입으로 항공기와 이동통신 간의 오랜 갈등이 종결되었다. 통신망 주파수와 항공 안전 관련 규제 확정이다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "미국 faa 5g 전파고도계"}, {"title": "5G’s bigger opportunity lies in industrial automation, telecom executives say - The Hindu", "summary": "글로벌 통신 임원들은 5G의 더 큰 사업적 기회가 스마트폰을 넘어 산업 자동화 영역에 있다고 진단했다. 초저지연과 고신뢰성을 특징으로 하는 5G 특화망이 스마트 팩토리와 물류 혁신의 핵심 인프라로 자리 잡고 있다. 통신사들은 기업 고객을 대상으로 한 맞춤형 네트워크 솔루션과 클라우드 연계 서비스를 확대하는 추세다. 향후 B2B 수익 모델 다각화를 위한 통신사들의 투자가 가속화될 전망이다.", "source": "The Hindu", "date": "2026-09-05 22:05", "url": "https://www.thehindu.com/business/Industry/5gs-bigger-opportunity-lies-in-industrial-automation-telecom-executives-say/article71431944.ece/amp/", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 5g 산업 자동화"}, {"title": "Pakistan’s 5G Rollout Slows Amid Rising Power Costs - Digital Pakistan", "summary": "파키스탄의 5G 롤아웃이 상승하는 전력 비용 속에서 속도를 내지 못하고 있다. 통신사 네트워크 투자 환경을 다룬다.", "source": "Digital Pakistan", "date": "2026-09-05 17:00", "url": "https://digitalpakistan.pk/pakistans-5g-rollout-slows-amid-rising-power-costs/", "category": "other", "importance": 3, "wl": false, "topic": "파키스탄 5g"}, {"title": "Top 10 Telecom Tower Deals of 2026: MTN, IHS Towers, Altius, Macquarie and CVC Drive Infra", "summary": "2026년 주요 통신 타워 딜을 주도한 MTN, IHS 타워스, 알티우스, 맥쿼리, CVC 등의 인프라 투자가 조명되었다. 글로벌 통신사들은 자산 효율화를 위해 타워 인프라 매각 및 전략적 결합을 지속하고 있다. 인프라 펀드들의 대규모 자본 유입이 통신 타워 시장의 재편을 가속화하는 양상이다. 이는 통신사들의 재무 구조 개선과 차세대 네트워크 투자 재원 확보로 이어지고 있다.", "source": "TelecomLead", "date": "2026-09-05 16:32", "url": "https://telecomlead.com/telecom-equipment/top-10-telecom-tower-deals-of-2026-mtn-ihs-towers-altius-macquarie-and-cvc-drive-infrastructure-ma-127617", "category": "contract", "importance": 3, "wl": false, "topic": "통신 타워 인프라 m&a"}, {"title": "Deutsche Telekom Peoplewatch: change-at-the-top in finance, infra, and tech - telcotitans.", "summary": "도이치 텔레콤이 재무, 인프라, 기술 부문의 최고위급 임원진을 전격 교체하는 대대적인 인사를 단행했다는 조직 개편 소식입니다. 경영 체제 쇄신을 통한 미래 전략 실행을 도모합니다. 유럽 최대 통신사의 리더십 변화입니다.", "source": "telcotitans.com", "date": "2026-09-05 14:04", "url": "https://www.telcotitans.com/deutsche-telekomwatch/deutsche-telekom-peoplewatch-change-at-the-top-in-finance-infra-and-tech/10839.article", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 임원인사"}, {"title": "[뉴스+]SKT는 '수요'·KT는 '이음'·카카오는 '편리'…'모두의 AI' 3色 경쟁 본격화 - 비즈니스플러스", "summary": "SK텔레콤(수요), KT(이음), 카카오(편리) 등 주요 플레이어들이 '모두의 AI'를 표방하며 각기 다른 색깔의 AI 서비스 경쟁에 본격 돌입했다는 IT 기술 동향 보도입니다. 통신사의 AI 생태계 주도권 경쟁을 다룹니다.", "source": "비즈니스플러스", "date": "2026-09-05 13:57", "url": "https://www.businessplus.kr/news/articleView.html?idxno=116431", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai전략"}, {"title": "Ambani’s tech titan IPO story isn’t yet credible - The Economic Times", "summary": "무케시 암바니 산하 테크 기업의 IPO 스토리와 가치 평가에 대해 아직 시장에서 완전히 신뢰를 얻지 못했다는 분석 기사입니다. 통신 및 테크 계열사의 상장 기대와 우려를 동시에 다룹니다. 투자자 관점의 업계 진단입니다.", "source": "The Economic Times", "date": "2026-09-05 11:46", "url": "https://economictimes.indiatimes.com/markets/ipos/fpos/jio-ipo-ambanis-tech-titan-ipo-story-isnt-yet-credible/articleshow/133785076.cms?UTM_Source=Google_Newsstand&UTM_Campaign=RSS_Feed&UTM_Medium=Referral", "category": "exec", "importance": 3, "wl": false, "topic": "릴라이언스지오 ipo"}, {"title": "KT, ‘모두의 AI’ 이음 본격화...생활 속 ‘1인 1 AI 에이전트’ 구현 - fnnews1.com", "summary": "KT가 '모두의 AI' 프로젝트 이음을 본격화하며 생활 속 1인 1 AI 에이전트 구현에 나선다. 통신사의 AI 멀티모델 및 토큰팩토리 결집 전략을 보여준다.", "source": "fnnews1.com", "date": "2026-09-05 10:52", "url": "https://www.fnnews1.com/news/articleViewAmp.html?idxno=108102", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai"}, {"title": "KT, 전사 데이터 활용 ‘에이전틱 플로우’ 구축…“조직 맥락 이해” - AI타임스", "summary": "KT가 전사 데이터를 활용해 조직의 맥락을 깊이 이해하는 '에이전틱 플로우(Agentic Flow)'를 구축하고 업무 혁신에 나선다는 AI 기술 도입 보도입니다. 통신사의 내부 디지털 전환(DX) 및 AI 역량 강화 사례입니다.", "source": "AI타임스", "date": "2026-09-05 10:35", "url": "https://www.aitimes.com/news/articleView.html?idxno=214847", "category": "tech", "importance": 3, "wl": false, "topic": "kt ai전략"}, {"title": "High on subscriber gains, Vodafone Idea flexes its creative muscle - Livemint", "summary": "가입자 순증 추세를 바탕으로 보다폰 아이디어가 창의적인 마케팅과 광고 캠페인을 적극적으로 전개하고 있다는 마케팅 전략 보도입니다. 가입자 이탈 방지 및 브랜드 활성화를 위한 노력입니다. 통신사 영업 전략의 일환입니다.", "source": "Livemint", "date": "2026-09-05 09:30", "url": "https://www.livemint.com/companies/news/high-on-subscriber-gains-vodafone-idea-flexes-its-creative-muscle-11788514575336.html", "category": "exec", "importance": 3, "wl": false, "topic": "보다폰아이디어 마케팅"}, {"title": "[AI돋보기] 기지국이 AI 데이터센터로…통신사 '변신' 시작됐다 - 연합뉴스", "summary": "통신사들의 기지국 인프라가 인공지능 데이터센터(AIDC)로 진화하며 전통적인 통신 사업자에서 AI 플랫폼 기업으로 변신을 꾀하고 있다. 분산된 기지국 부지를 활용해 엣지 컴퓨팅과 AI 연산 처리를 결합하는 전략이 주목받고 있다. 통신망의 물리적 가치를 재정의하고 새로운 수익원을 창출하려는 통신사들의 구조적 변화다. 장비 공급업체들에게도 새로운 비즈니스 기회를 제공하고 있다.", "source": "연합뉴스", "date": "2026-09-05 06:33", "url": "https://www.yna.co.kr/amp/view/AKR20260904023000017", "category": "tech", "importance": 3, "wl": false, "topic": "통신사 ai 데이터센터"}, {"title": "KDDIが光回線＋5Gの「auひかりプラス」を提供する狙い 光コラボを生かして全国展開も視野に", "summary": "KDDI가 광회선과 5G SA를 융합한 'au히かりプラス'를 통해 즉시 이용과 장애 자동 백업을 제공하며, NTT 광코ラボ를 활용해 전국 확대를 노린다. 통신사의 네트워크 서비스 전략과 사업 확대 방향을 보여준다.", "source": "ITmedia Mobile", "date": "2026-09-05 06:00", "url": "https://www.itmedia.co.jp/mobile/articles/2609/05/news016.html", "category": "contract", "importance": 3, "wl": true, "topic": "kddi 상품출시"}, {"title": "Verizon (VZ) Stock Looks Reasonable On Earnings Yet Mixed On Value - simplywall.st", "summary": "버라이즌의 주가가 최근 실적 발표를 바탕으로 합리적인 수준을 유지하고 있으나 밸류에이션에 대해서는 엇갈린 평가가 나오고 있다. 견조한 가입자 기반과 수익성을 증명했으나 향후 성장성에 대한 시장의 고민이 반영된 결과다. 통신사들의 재무 건전성과 투자 여력을 가늠하는 지표가 된다. 주식 시장에서의 통신 섹터 평가를 보여준다.", "source": "simplywall.st", "date": "2026-09-05 05:33", "url": "https://simplywall.st/stocks/us/telecom/nyse-vz/verizon-communications/news/verizon-vz-stock-looks-reasonable-on-earnings-yet-mixed-on-v/amp", "category": "earnings", "importance": 3, "wl": false, "topic": "버라이즌 실적 분석"}, {"title": "대교뉴이프, SKT ‘모두의 AI’ 참여…시니어 돌봄 서비스 구축 - 주간한국", "summary": "대교뉴이프가 SKT의 '모두의 AI' 프로젝트에 참여해 시니어 돌봄 서비스를 구축한다. 통신사의 AI 생태계 확장 및 B2B 서비스 협력 동향을 보여준다.", "source": "주간한국", "date": "2026-09-05 04:36", "url": "https://weekly.hankooki.com/news/articleViewAmp.html?idxno=7182563", "category": "tech", "importance": 3, "wl": false, "topic": "sk텔레콤 ai"}, {"title": "Reliance Jio Launches JioPC: Turn Your Old Computer or TV Into a Cloud Desktop - PaidFreeD", "summary": "인도 릴라이언스 지오가 구형 컴퓨터와 TV를 클라우드 데스크톱으로 전환하는 JioPC를 출시했다. 통신사의 클라우드 서비스 확장이다.", "source": "PaidFreeDroid", "date": "2026-09-05 03:43", "url": "https://paidfreedroid.com/2026/09/reliance-jio-jiopc-launch-india-cloud-computer-price.html/amp", "category": "tech", "importance": 3, "wl": false, "topic": "릴라이언스지오 클라우드"}, {"title": "Charter Communications stock falls as CFO transition and weak sentiment weigh - AD HOC NEW", "summary": "차터 커뮤니케이션즈의 주가가 CFO 교체 소식과 시장의 약세 심리가 맞물리면서 하락세를 기록했다. 경영진 변화에 따른 불확실성이 투자자들의 단기 매물 출화를 유도했다. 통신 및 케이블 사업자의 재무 및 리더십 동향을 보여주는 지표다.", "source": "AD HOC NEWS", "date": "2026-09-05 02:31", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/charter-communications-stock-falls-as-cfo-transition-and-weak-sentiment/70055980", "category": "earnings", "importance": 3, "wl": false, "topic": "차터 커뮤니케이션즈 주가"}, {"title": "TELUS (TSX:T): Dividend Aristocrat Exit And AI Pivot Explained - Kalkine Media", "summary": "텔러스가 전통적인 배당 귀족주 타이틀에서 벗어나 AI 중심의 사업 피벗(Pivot)을 추진하는 전략적 변화를 분석한 기사입니다. 통신사가 인프라 투자를 넘어 AI 및 테크 기업으로 진화하려는 방향성을 보여줍니다. 업계의 주목할 만한 경영 전환입니다.", "source": "Kalkine Media", "date": "2026-09-05 02:24", "url": "https://kalkinemedia.com/ca/stocks/communication/telus-tsxt-dividend-aristocrat-exit-and-ai-pivot-explained", "category": "exec", "importance": 3, "wl": false, "topic": "텔러스 배당 정책"}, {"title": "T-Mobile US stock falls on ugu-states", "category": "exec", "importance": 3, "wl": false, "topic": "릴라이언스지오 성장"}, {"title": "What’s up with… OpenAI, Deutsche Telekom, Ciena - telecomtv.com", "summary": "도이치 텔레콤이 OpenAI 등 글로벌 테크 기업들과의 협력을 확대하며 차세대 통신 서비스 혁신을 모색하고 있다는 기술 동향 보도입니다. 통신 인프라와 AI 기술의 결합 전략을 다룹니다. 유럽 주요 통신사의 혁신 행보입니다.", "source": "telecomtv.com", "date": "2026-09-04 23:54", "url": "https://www.telecomtv.com/content/ai/what-s-up-with-openai-deutsche-telekom-ciena-56175/", "category": "tech", "importance": 3, "wl": false, "topic": "도이치텔레콤 협력"}, {"title": "AT&T Delivers Value, Reliability, and Confidence with New Samsung Galaxy S26 FE - AT&T New", "summary": "AT&T가 신형 삼성 갤럭시 S26 FE 단말기를 통해 가입자들에게 가치와 신뢰성, 안정적인 연결성을 제공한다고 발표했다. 통신사의 단말 라인업 확충과 고객 서비스 마케팅의 일환이다. 단말기 판매 프로모션 성격이 강하나 주요 통신사의 단말 조달 전략을 보여준다. 삼성전자 단말 부문과의 협력 관계를 나타낸다.", "source": "AT&T Newsroom", "date": "2026-09-04 23:00", "url": "https://about.att.com/story/2026/samsung-galaxy-s26-fe.html", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 삼성 갤럭시 공급"}, {"title": "CFOs On the Move: Week ending Sept. 4 - cfo.com", "summary": "9월 첫째 주 주간 기준 글로벌 기업들의 최고재무책임자(CFO) 이동 현황을 정리했다. 주요 통신사를 비롯한 대기업들의 재무 리더십 교체 러시를 조명하고 있다. 경영진의 교체는 기업의 자본 배분과 M&A 전략에 직접적인 영향을 미친다. 업계 전반의 인사 동향을 보여준다.", "source": "cfo.com", "date": "2026-09-04 22:43", "url": "https://www.cfo.com/news/cfos-on-the-move-sept-4-Julia-Brau-Donnelly-Pinterest-Jessica-Fischer-Charter-Deutsche-Telekom/829596/", "category": "exec", "importance": 3, "wl": false, "topic": "통신사 cfo 인사 동향"}, {"title": "Deutsche Telekom eyes synergies from Greek move - mobileworldlive.com", "summary": "도이치 텔레콤이 그리스 자회사(OTE) 리브랜딩 등 남유럽 시장 진출 과정에서 시너지를 극대화하기 위한 경영 전략을 모색하고 있다는 소식입니다. 유럽 권역 내 통합 운영 및 효율성 제고를 목표로 합니다. 통신사의 글로벌 사업 확장 전략입니다.", "source": "mobileworldlive.com", "date": "2026-09-04 21:13", "url": "https://www.mobileworldlive.com/europe/deutsche-telekom-eyes-synergies-from-greek-move/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 전략"}, {"title": "Pakistan 5G Spectrum Auction Raises $507 Million as Jazz Leads, Ufone Follows and Zong Lag", "summary": "파키스탄 5G 주파수 경매가 5억 7천만 달러 규모로 성사되며 주요 통신사들이 낙찰을 완료했다. 통신사 네트워크 투자 소식이다.", "source": "TechJuice", "date": "2026-09-04 20:56", "url": "https://www.techjuice.pk/pakistan-5g-spectrum-auction-raises-507-million-as-jazz-leads-ufone-follows-and-zong-lags/", "category": "contract", "importance": 3, "wl": false, "topic": "파키스탄 주파수 경매"}, {"title": "BSNL 4G network carries 6 PB data every day: C-DoT’s RK Upadhyay", "summary": "타타컨설턴시서비스(TCS) 컨소시엄이 테자스 네트워크와 C-DoT의 기술을 바탕으로 BSNL을 위해 인도 전역에 구축한 토종 4G 네트워크가 하루에 6페타바이트의 데이터를 처리하고 있다. 통신사의 인프라 구축 및 운영 실적이다.", "source": "ET Telecom", "date": "2026-09-04 19:11", "url": "https://telecom.economictimes.indiatimes.com/news/telecom-equipment/bsnl-4g-network-carrying-nearly-6-pb-data-daily-c-dots-rk-upadhyay/133759314", "category": "contract", "importance": 3, "wl": true, "topic": "bsnl 4g망"}, {"title": "Viettel Secures 240 MHz Spectrum for Dominican Republic Network Launch - Telecom Review As", "summary": "베트남의 비텔(Viettel)이 도미니카공화국 네트워크 사업 진출을 위해 240MHz 대역의 주파수를 성공적으로 확보했다. 신규 시장에서 대규모 무선 통신망을 구축하고 가입자 기반을 다지기 위한 필수 절차를 마쳤다. 글로벌 통신사들의 해외 영토 확장과 주파수 확보 경쟁을 보여주는 사례다. 통신장비 공급업체들에게 새로운 영업 기회를 제공한다.", "source": "Telecom Review Asia", "date": "2026-09-04 17:54", "url": "https://www.telecomreviewasia.com/news/network-news/30191-viettel-secures-240-mhz-spectrum-for-dominican-republic-network-launch/", "category": "contract", "importance": 3, "wl": false, "topic": "비텔 주파수 확보"}, {"title": "Tele Columbus slashes investments by 50% in selective capital allocation in H1 - Telecompa", "summary": "독일 통신사 텔레 콜럼버스(Tele Columbus)가 상반기 동안 엄격한 자본 배분(Selective capital allocation) 기조에 따라 인프라 투자를 50%나 대폭 삭감했다고 발표한 재무 전략 뉴스입니다. 유럽 통신사들의 긴축 경영과 투자 축소 트렌드를 반영합니다. 장비 공급사들에 악영향을 미치는 소식입니다.", "source": "Telecompaper", "date": "2026-09-04 17:35", "url": "https://www.telecompaper.com/news/tele-columbus-slashes-investments-by-50-in-selective-capital-allocation-in-h1--1581745", "category": "exec", "importance": 3, "wl": false, "topic": "텔레콜럼버스 투자축소"}, {"title": "“국민 누구나 AI를 쓴다”…정부 ‘모두의 AI’ 출격, SKT·카카오·KT 연내 서비스 경쟁 - 인공지능신문", "summary": "정부의 '모두의 AI' 프로젝트 출격에 맞춰 SKT, KT 등이 연내 서비스 경쟁에 돌입한다. 통신사들의 AI 서비스 확장 및 정부 정책 연계 동향이다.", "source": "인공지능신문", "date": "2026-09-04 17:17", "url": "https://www.aitimes.kr/news/articleView.html?idxno=41767", "category": "tech", "importance": 3, "wl": false, "topic": "과기정통부 ai"}, {"title": "[Biz&Law] 삼성전자 , 美서 5G 기지국 특허침해 피소", "summary": "캐나다의 특허관리전문회사(NPE)인 원고는 삼성전자 가 자사 특허를 침해한 네트워크 제품을 미 통신사 버라이즌(Verizon)에 공급했다고 주장했다. 3일(현지시간) 미국 텍사스주(州) 동부 연방지방법원에 따르면...", "source": "the-biz.co.kr", "date": "2026-09-04 17:00", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=727390", "category": "contract", "importance": 3, "wl": false, "topic": ""}, {"title": "Vi unveils new brand identity, refreshes logo - Telecompaper", "summary": "인도 통신사 보다폰 아이디어(Vi)가 새로운 브랜드 아이덴티티와 로고를 발표하며 리브랜딩을 단행했다는 소식입니다. 시장 내 입지 강화와 이미지 쇄신을 위한 경영 전략입니다. 통신사의 마케팅 및 경영 행보입니다.", "source": "Telecompaper", "date": "2026-09-04 15:41", "url": "https://www.telecompaper.com/news/vi-unveils-new-brand-identity-refreshes-logo--1581727", "category": "exec", "importance": 3, "wl": false, "topic": "보다폰아이디어 브랜드"}, {"title": "Mitsui Fudosan, NTT Docomo form telecom and property alliance - Telecompaper", "summary": "일본의 미쓰이부동산과 NTT도코모가 통신과 부동산을 결합한 전략적 제휴를 공식 발표했다. 스마트 빌딩과 도시 인프라에 고속 통신망을 밀접하게 결합하여 차세대 공간 서비스를 제공할 계획이다. 통신사들이 부동산 및 건설 자원과 손잡고 B2B 인프라 시장을 개척하는 대표적 사례다. 양사의 협력은 도심 내 통신 장비 수요를 자극할 것으로 기대된다.", "source": "Telecompaper", "date": "2026-09-04 14:59", "url": "https://www.telecompaper.com/news/mitsui-fudosan-ntt-docomo-form-telecom-and-property-alliance--1581705", "category": "contract", "importance": 3, "wl": false, "topic": "ntt도코모 미쓰이부동산 제휴"}, {"title": "Telecom Egypt to extend Red2Med system to Taba with petabit link - Developing Telecoms", "summary": "텔레콤 이집트가 타바 지역까지 Red2Med 시스템을 연장하기 위해 페타비트급 링크 구축을 추진한다. 중동과 유럽을 잇는 해저 및 육상 케이블 경로의 대역 iness Standa", "summary": "티모바일의 세리 고팔란이 가입자 성장세를 되살리기 위해 인공지능(AI)과 홈 인터넷 서비스 확장에 전력을 기울이고 있다. 무선 통신을 넘어 가정용 브로드밴드 시장 공략을 강화하여 수익원을 다각화하려는 전략이다. AI 기술을 도입해 고객 응대와 네트워크 운영 효율성도 높이고 있다. 통신사의 미래 성장 전략을 보여주는 대목이다.", "source": "Business Standard", "date": "2026-09-04 12:48", "url": "https://www.business-standard.com/amp/companies/news/t-mobile-s-gopalan-bets-on-ai-home-internet-to-revive-subscriber-growth-126090400143_1.html", "category": "tech", "importance": 3, "wl": false, "topic": "티모바일 홈인터넷 전략"}, {"title": "Reliance Jio vs Airtel Rs 999 Home Broadband Plans - TelecomTalk", "summary": "", "source": "TelecomTalk", "date": "2026-09-04 11:34", "url": "https://telecomtalk.info/reliancejio-vs-airtel-rs999-home-broadband-plans/1011515/", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "Reinventing Business Internet from the Ground Up and the Sky Down - Navajo-Hopi Observer", "summary": "지상과 하늘을 연계하여 낙후된 지역의 비즈니스 인터넷 인프라를 근본적으로 재구축하는 프로젝트가 소개되었다. 지상 광케이블과 위성통신을 결합해 소외 지역의 디지털 격차를 해소하려는 시도다. 통신 서비스의 커버리지 확장과 융합 인프라의 사례를 보여준다.", "source": "Navajo-Hopi Observer", "date": "2026-09-04 11:17", "url": "https://www.nhonews.com/online_features/tech_talk_and_innovation/reinventing-business-internet-from-the-ground-up-and-the-sky-down/article_124462fe-1053-5caf-b6d3-bcc1f097ece5.html", "category": "tech", "importance": 3, "wl": false, "topic": "나바호호피 비즈니스 인터넷"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "릴라이언스 지오가 4억 달러 규모의 대규모 IPO 추진을 위해 나트라디-디왈리 연휴 기간을 목표로 하고 있다. 이르면 다음 주부터 로드쇼가 시작될 수 있다. 주요 통신사의 상장 추진 동향이다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "other", "importance": 3, "wl": true, "topic": "릴라이언스지오 상장"}, {"title": "NTT Docomo to Invest in Mitsui Fudosan Telecom Equipment Unit, Build High-Speed Networks a", "summary": "NTT도코모가 미쓰이   ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
