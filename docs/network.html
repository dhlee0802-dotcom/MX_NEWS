  .art{padding:10px 0;border-top:1px solid var(--line)}

  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}

  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}

</style>

ory": "other", "importance": 2, "wl": false, "topic": ""}, {"title": "AI 모태펀드 60% 의무투자 두고 여야 공방…온누리상품권도 충돌", "summary": "국회 결산심사에서 과학기술정보 통신 부( 과기정통부 )의 인공지능(AI) 분야 모태펀드 운용 방식과 중소벤처기업부(중기부)의 온누리상품권 운영을 놓고 여야가 맞붙었다. 국회 예산결산특별위원회 결산심사소위원회는 4일...", "source": "shinailbo.co.kr", "date": "2026-09-04 20:58", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5058715", "category": "other", "importance": 2, "wl": false, "topic": ""}], "carrier": [{"title": "KDDI achieves 3.6 Gbps outdoor transmission in 7 GHz 6G candidate band - Telecompaper", "summary": "KDDI가 6G 후보 대역인 7GHz 대역 야외 전송 실험에서 3.6 Gbps의 초고속 전송 속도를 달성했다. 차세대 통신 표준 선점을 위한 기술 실증에서 유의미한 성과를 거두었다. 고주파수 대역 활용 능력을 입증하며 6G 상용화 기반을 다지고 있다.", "source": "Telecompaper", "date": "2026-09-04 15:31", "url": "https://www.telecompaper.com/news/kddi-achieves-36-gbps-outdoor-transmission-in-7-ghz-6g-candidate-band--1581713", "category": "tech", "importance": 4, "wl": false, "topic": "kddi 6g"}, {"title": "Jio sets eyes on Navratri-Diwali period to launch mega $4 billion IPO", "summary": "인도 릴라이언스 지오는 4억 달러 규모의 메가 IPO를 나트라디-디왈리 연휴 기간에 맞춰 추진할 계획이다. IPO가 10월 11일 시작되는 나트라디 기간과 겹칠 경우 로드쇼는 빠르면 다음 주부터 시작될 수 있다. 인도 통신 시장 최대어의 상장 행보가 본격화되고 있다.", "source": "ET Telecom", "date": "2026-09-04 10:50", "url": "https://telecom.economictimes.indiatimes.com/news/industry/jio-sets-eyes-on-navratri-diwali-period-to-launch-mega-4-billion-ipo/133749364", "category": "contract", "importance": 4, "wl": true, "topic": "릴라이언스지오 ipo"}, {"title": "Bombay HC quashes ₹2,113 crore DoT demand against Vodafone Idea - scanx.trade", "summary": "인도 고등법원이 보다폰아이디어를 상대로 인도 통신부(DoT)가 청구했던 2,113억 루피 규모의 요금 납부 요구를 기각했습니다. 통신사의 재정적 부담을 크게 덜어주는 중대한 법적 판결로 평가받습니다. 보다폰아이디어의 재무 건전성 회복과 인도 통신 시장 구도에 큰 영향을 미칠 전망입니다. 규제 당국과 통신사 간의 오랜 법적 공방의 분수령이 될 것입니다.", "source": "scanx.trade", "date": "2026-09-04 09:28", "url": "https://scanx.trade/stock-market-news/companies/bombay-high-court-quashes-2-113-crore-dot-demand-notices-against-vodafone-idea-for-one-time-spectrum-charges/42522031", "category": "policy", "importance": 4, "wl": false, "topic": "보다폰아이디어 인도 통신부 요구 기각"}, {"title": "国内初「空飛ぶ基地局」、試験成功…ソフトバンクが商用化へ - newswitch.jp", "summary": "소프트뱅크가 일본 최초로 성층권 통신 플랫폼인 '하늘을 나는 기지국(HAPS)' 비행 및 통신 시험에 성공하며 상용화 단계에 진입했다. 지상 기지국이 닿지 않는 산간오지나 재난 지역에 공중 기지국을 제공하는 혁신 기술이다. 향후 통신 인프라의 공간적 한계를 극복할 게임체인저로 기대를 모으고 있다.", "source": "newswitch.jp", "date": "2026-09-04 06:02", "url": "https://newswitch.jp/p/50177", "category": "tech", "importance": 4, "wl": false, "topic": "소프트뱅크 haps"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "도이치텔레콤이 세대교체의 일환으로 AWS 출신 호프마이어를 영입하고 AI 및 네트워크 부문 조직을 개편하는 한편 최고재무책임자(CFO)가 퇴임합니다. 대대적인 경영진 물갈이를 통해 디지털 및 AI 전환에 속도를 내고 있습니다. 통신사의 리더십 변화가 향후 기술 투자 방향에 미칠 영향이 큽니다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 aws 호프마이어 영입 및 임원진 개편"}, {"title": "T-Mobile Stock Rises on Report Elliott Opposes Deutsche Telekom Merger - Barron's", "summary": "행동주의 펀드 엘리엇 매니지먼트가 도이치텔레콤의 T모바일 US 합병 계획에 반대한다는 입장을 표명한 가운데 T모바일 주가가 상승했습니다. 대형 투자자의 경영 개입과 전략 수정 요구가 통신 시장의 주요 이슈로 부각되었습니다. 향후 글로벌 통신 M&A 및 지배구조에 상당한 파장이 예상됩니다.", "source": "Barron's", "date": "2026-09-04 01:24", "url": "https://www.barrons.com/articles/t-mobile-stock-report-elliott-deutsche-telekom-merger-2880aac4", "category": "policy", "importance": 4, "wl": false, "topic": "티모바일 엘리엇 도이치텔레콤 합병 반대"}, {"title": "Jan Hofmeyr named DT's new Board of Management member for product and technology - fierce-", "summary": "얀 호프마이어가 도이치텔레콤의 제품 및 기술 담당 신임 경영 이사회 멤버(CTO)로 공식 선임되었습니다. 클라우드 및 통신 융합 전문가의 영입으로 회사의 기술 혁신 역량이 한층 강화될 것으로 기대됩니다. 핵심 경영진의 교체는 회사의 중장기 R&D 및 인프라 전략에 직접적인 영향을 미칩니다.", "source": "fierce-network.com", "date": "2026-09-04 00:54", "url": "https://www.fierce-network.com/newswire/jan-hofmeyr-named-dts-new-board-management-member-product-and-technology", "category": "exec", "importance": 4, "wl": false, "topic": "얀 호프마이어 도이치텔레콤 경영 이사회 멤버 선임"}, {"title": "Elliott Management builds Deutsche Telekom stake, opposes possible T-Mobile merger - repor", "summary": "행동주의 펀드 엘리엇 매니지먼트가 도이치텔레콤의 지분을 대거 인수하며 경영진에 압박을 가하고 있습니다. 특히 T모바일 US와의 잠재적 합병 계획에 반대하는 입장을 공식화했습니다. 거대 통신사의 투자 전략과 자본 재배치에 중대한 변수로 작용할 전망입니다. 시장의 큰 주목을 받는 경영권 관련 이슈입니다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:17", "url": "https://www.datacenterdynamics.com/en/news/elliott-management-builds-deutsche-telekom-stake-opposes-possible-t-mobile-merger-reports/", "category": "policy", "importance": 4, "wl": false, "topic": "엘리엇 매니지먼트 도이치텔레콤 지분 인수"}, {"title": "Deutsche Telekom names AWS' Jan Hofmeyr as next CTO - Data Center Dynamics", "summary": "도이치텔레콤이 차기 최고기술책임자(CTO)로 아마존웹서비스(AWS)의 얀 호프마이어를 낙점했습니다. 클라우드 기반 네트워크 운영과 AI 서비스 개발을 주도할 적임자로 평가받습니다. 전통 통신사와 빅테크 간의 인재 교류를 보여주는 상징적인 인사입니다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:02", "url": "https://www.datacenterdynamics.com/en/news/deutsche-telekom-names-aws-jan-hofmeyr-as-next-cto/", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 aws 얀 호프마이어 cto 임명"}, {"title": "Verizon Communications stock gains on Frontier deal and CEO transition - ad-hoc-news.de", "summary": "버라이즌이 프론티어(Frontier) 인수 건과 최고경영진 교체 소식을 동시에 전하며 주가가 상승세를 보였다. 광대역 통신망 확장을 위한 이번 대형 M&A는 유무선 통합 전략에 큰 변화를 예고한다. 업계 내 경쟁 구도 재편에 미칠 파장이 크다.", "source": "ad-hoc-news.de", "date": "2026-09-03 22:43", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/verizon-communications-stock-gains-on-frontier-deal-and-ceo-transition/70049369", "category": "contract", "importance": 4, "wl": false, "topic": "버라이즌 프론티어 인수"}, {"title": "Deutsche Telekom anoints CTO with Comcast chief network veteran and AWS VP Jan Hofmeyr - S", "summary": "도이치텔레콤이 컴캐스트의 네트워크 베테랑이자 AWS 부사장인 얀 호프마이어(Jan Hofmeyr)를 신임 최고기술책임자(CTO)로 임명했습니다. 클라우드와 AI 역량을 결합하기 위한 대규모 경영진 쇄신의 일환입니다. 글로벌 통신사의 기술 전략 변화를 보여주는 핵심 인사 조치입니다. 향후 네트워크 고도화와 클라우드 협업에 큰 변화가 예상됩니다.", "source": "SDxCentral", "date": "2026-09-03 22:32", "url": "https://www.sdxcentral.com/news/deutsche-telekom-anoints-cto-with-comcast-chief-network-veteran-and-aws-vp-jan-hofmeyr/", "category": "exec", "importance": 4, "wl": false, "topic": "도이치텔레콤 컴캐스트 및 aws 출신 cto 영입"}, {"title": "Elliot builds stake in Deutsche Telekom, opposes T-Mobile US merger - report - Telecompape", "summary": "엘리엇이 도이치텔레콤 지분을 확보하고 자회사 T모바일 US와의 합병 구상에 반대 목소리를 높이고 있습니다. 글로벌 통신 시장의 거대 자본 간 이해관계 충돌을 보여주는 중대한 뉴스입니다. 향후 M&A 추진 여부에 중대한 제동이 걸릴 수 있습니다.", "source": "Telecompaper", "date": "2026-09-03 20:19", "url": "https://www.telecompaper.com/news/elliot-builds-stake-in-deutsche-telekom-opposes-t-mobile-us-merger-report--1581641", "category": "policy", "importance": 4, "wl": false, "topic": "엘리엇 도이치텔레콤 지분 매입 및 t모바일us 합병 반대"}, {"title": "Deutsche Telekom shares rise as sources say Elliott builds stake, opposes T-Mobile deal - ", "summary": "행동주의 펀드 엘리엇의 지분 확보와 T모바일 합병 반대 소식이 전해지면서 도이치텔레콤의 주가가 상승세를 보였습니다. 투자자들은 M&A 리스크 완화와 주주 가치 제고 기대로 해석하고 있습니다. 시장의 뜨거운 관심을 받는 거대 통신사 지배구조 이슈입니다.", "source": "TradingView", "date": "2026-09-03 17:21", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N44V0JM:0-deutsche-telekom-shares-rise-as-sources-say-elliott-builds-stake-opposes-t-mobile-deal/", "category": "policy", "importance": 4, "wl": false, "topic": "도이치텔레콤 엘리엇 지분 인수 및 t모바일 합병 반대 소식에 주가 상승"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수 - PRESS9", "summary": "SK텔레콤과 LG유플러스 등 국내 이동통신사들이 그간 축소해 왔던 네트워크 망 투자를 5G SA 고도화와 향후 주파수 경매를 변수로 삼아 다시 늘릴지 관심이 집중되고 있다.", "source": "PRESS9", "date": "2026-09-03 15:07", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 4, "wl": false, "topic": "sk텔레콤 lg유플러스 망투자"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신사업자들이 규제기관 트라이(Trai)가 제안한 5G 슬라이싱 서비스 품질(QoS) 규범을 거부하고 나섰다. 트라이는 슬라이싱 활성화 지역의 자원 사용량을 모니터링하여 무선 자원 이용률이 80%를 넘지 않도록 하는 방안을 제안했으나, 업계는 기술적으로 비현실적이며 심각한 운영 부담을 초래할 것이라고 반발했다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "인도통신 규제"}, {"title": "모두의 AI 3사 청사진 공개…연내 대국민 서비스 출시 - 자본시장뉴스", "summary": "모두의 AI 사업에 참여한 사업자들이 연내 대국민 서비스 출시를 목표로 각사의 청사진을 확정 발표했습니다. 전 국민의 AI 활용도를 높이기 위한 공공·민간 협력 모델이 구체화되고 있습니다. 통신사의 신규 AI 서비스 론칭 일정입니다.", "source": "자본시장뉴스", "date": "2026-09-05 10:38", "url": "https://www.jabon.co.kr/news/articleView.html?idxno=6771", "category": "tech", "importance": 3, "wl": false, "topic": "모두의 ai 3사 청사진 연내 서비스 출시"}, {"title": "KT, 전사 데이터 활용 체계 ‘에이전틱 데이터 플로우’ 구축…“조직 맥락 이해” - AI타임스", "summary": "KT가 전사 데이터 활용 체계인 '에이전틱 데이터 플로우'를 구축하고 조직 맥락을 이해하는 AI 활용을 본격화합니다. 사내 업무 효율성을 높이고 AI 기반 혁신을 가속화하기 위한 디지털 전환 조치입니다. 통신사의 자체 AI 역량 강화 사례를 보여줍니다.", "source": "AI타임스", "date": "2026-09-05 10:35", "url": "https://www.aitimes.com/news/articleView.html?idxno=214847", "category": "tech", "importance": 3, "wl": false, "topic": "kt 에이전틱 데이터 플로우 구축"}, {"title": "'모두의 AI' 연내 출시···SKT·카카오·KT 청사진 공개 - 서울파이낸스", "summary": "SK텔레콤, 카카오, KT 등 주요 통신 및 플랫폼 기업들이 연내 출시를 목표로 하는 '모두의 AI' 프로젝트의 청사진을 공개했습니다. 전 국민이 무료로 이용할 수 있는 실행형 AI 서비스를 공동 개발하기 위한 정부 사업의 일환입니다. 통신사의 AI 생태계 확장 전략을 보여줍니다.", "source": "서울파이낸스", "date": "2026-09-05 10:00", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637258", "category": "tech", "importance": 3, "wl": false, "topic": "skt 카카오 kt 모두의 ai 청사진 공개"}, {"title": "KT, ‘모두의 AI’ 이음 본격화...생활 속 ‘1인 1 AI 에이전트’ 구현 - fnnews1.com", "summary": "KT가 '모두의 AI' 프로젝트 '이음'을 본격화하며 일상 속에서 누구나 '1인 1 AI 에이전트'를 활용할 수 있는 환경을 구현하겠다고 밝혔습니다. 대국민 AI 서비스 보급에 앞장서는 통신사의 청사진입니다. AI 생태계 대중화를 위한 핵심 전략입니다.", "source": "fnnews1.com", "date": "2026-09-05 09:15", "url": "https://www.fnnews1.com/news/articleView.html?idxno=108102", "category": "t erger Update: Will Your Bill And Service Change? - CableTV.com", "summary": "스펙트럼과 콕스(Cox) 간의 합병 추진설과 관련하여 요금 및 서비스 변화 가능성을 분석했다. 케이블TV 및 통신 시장의 거대 사업자 간 결합이 성사될 경우 업계 판도에 미칠 파장이 크다. 소비자 가입 조건과 규제 당국의 심사가 주요 변수다.", "source": "CableTV.com", "date": "2026-09-05 03:19", "url": "https://www.cabletv.com/news/cox-spectrum-merger-will-price-increase", "category": "contract", "importance": 3, "wl": false, "topic": "스펙트럼 콕스 합병"}, {"title": "T-Mobile US stock falls on CFO transition while guidance stays strong - ad-hoc-news.de", "summary": "T모바일 US가 CFO 교체 소식을 발표한 가운데 연간 실적 가이드라인은 견조하게 유지되면서 주가가 하락했다. 경영진 교체에 따른 불확실성이 단기 주가에 부담으로 작용했다. 회사는 안정적인 재무 기조를 이어갈 것이라고 강조했다.", "source": "ad-hoc-news.de", "date": "2026-09-05 01:54", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/t-mobile-us-stock-falls-on-cfo-transition-while-guidance-stays-strong/70055780", "category": "exec", "importance": 3, "wl": false, "topic": "티모바일 인사"}, {"title": "T-Mobile hands CFO reins to ex-Shell exec Jessica Uhl, as Osvaldik retires", "summary": "티모바일은 피터 오스발딕의 은퇴 계획에 따라 전 셸 임원인 제시카 울을 차기 최고재무책임자(CFO)로 선임한다고 밝혔다. 제시카 울은 내년 2월에 CFO직을 이어받을 예정이다. 오스발딕은 2027년 7월 공식 은퇴 전까지 전략 고문으로 활동하게 된다. 이번 인사는 회사의 안정적인 리더십 승계를 위한 경영진 개편의 일환으로 추진된다.", "source": "Light Reading", "date": "2026-09-05 01:12", "url": "https://www.lightreading.com/business-transformation/t-mobile-hands-cfo-reins-to-ex-shell-exec-jessica-uhl-as-osvaldik-retires", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원"}, {"title": "LS일렉트릭, KT클라우드와 AI 데이터센터 인프라 공급·개발 맞손 - koreasprint.com", "summary": "LS일렉트릭이 KT클라우드와 손잡고 AI 데이터센터(AI DC) 인프라 공급 및 개발을 위한 협력을 체결했습니다. 급증하는 AI 컴퓨팅 수요에 발맞추어 전력 및 기반 시설을 안정적으로 구축하기 위한 파트너십입니다. 통신사의 데이터센터 인프라 확장 전략입니다.", "source": "koreasprint.com", "date": "2026-09-05 00:20", "url": "https://www.koreasprint.com/news/articleView.html?idxno=18674", "category": "contract", "importance": 3, "wl": false, "topic": "ls일렉트릭 kt클라우드 ai 데이터센터 인프라 협력"}, {"title": "What’s up with… OpenAI, Deutsche Telekom, Ciena - telecomtv.com", "summary": "오픈에이아이, 도이치텔레콤, 씨에나 등 주요 기술 및 통신 기업들의 최신 협력 및 기술 동향이 보도되었습니다. AI 기술과 통신 인프라의 융합 및 네트워크 장비 시장의 변화를 다루고 있습니다. 통신사의 차세대 기술 도입 흐름을 파악하는 데 유용한 정보입니다.", "source": "telecomtv.com", "date": "2026-09-04 23:50", "url": "https://www.telecomtv.com/content/ai/what-s-up-with-openai-deutsche-telekom-ciena-56175/", "category": "tech", "importance": 3, "wl": false, "topic": "오픈에이아이 도이치텔레콤 씨에나 협력 동향"}, {"title": "AT&T Delivers Value, Reliability, and Confidence with New Samsung Galaxy S26 FE - AT&T New", "summary": "미국 이동통신사 AT&T가 삼성전자의 최신 스마트폰 '갤럭시 S26 FE'를 도입하여 가입자들에게 신뢰성과 가치를 갖춘 프리미엄 모바일 경험을 제공한다고 발표했다.", "source": "AT&T Newsroom", "date": "2026-09-04 23:00", "url": "https://about.att.com/story/2026/samsung-galaxy-s26-fe.html", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 삼성전자"}, {"title": "Deutsche Telekom eyes synergies from Greek move - Mobile World Live", "summary": "도이치텔레콤이 그리스 자회사 OTE(코스모테)의 리브랜딩과 사업 조정을 통해 그룹 차원의 시너지 창출을 모색하고 있습니다. 유럽 지역 내 자회사들과의 통합 운영 효율성을 높이려는 전략입니다. 통신사의 글로벌 자산 관리 및 그룹 경영 전략의 일환입니다.", "source": "Mobile World Live", "date": "2026-09-04 21:13", "url": "https://www.mobileworldlive.com/europe/deutsche-telekom-eyes-synergies-from-greek-move/", "category": "contract", "importance": 3, "wl": false, "topic": "도이치텔레콤 그리스 법인 시너지 모색"}, {"title": "Verizon Layoffs Hit 16,600 as Record Quarter Funds the Cuts - financefeeds.com", "summary": "버라이즌이 역대급 실적 달성에도 불구하고 1만 6,600명 규모의 대대적인 감원을 단행했다. 비용 절감과 효율성 극대화를 위한 구조조정의 일환으로 풀이된다. 호실적 속에서 진행된 대규모 구조조정은 업계에 큰 충격을 주고 있다.", "source": "financefeeds.com", "date": "2026-09-04 19:17", "url": "https://financefeeds.com/verizon-layoffs-16600-jobs-record-quarter-cost-cuts/", "category": "exec", "importance": 3, "wl": false, "topic": "버라이즌 구조조정"}, {"title": "BSNL 4G network carries 6 PB data every day: C-DoT’s RK Upadhyay", "summary": "타타 컨설턴시 서비스(TCS) 컨소시엄이 주도하고 테자스 네트워크와 C-DoT가 참여하여 BSNL을 위해 인도 전역에 구축한 자국산 4G 네트워크가 매일 6PB의 데이터를 처리하고 있다. 인도 정부의 통신 자립화 정책인 '아트마니르바르 바라트'의 대표적 성공 사   ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
