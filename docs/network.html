<style>

  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}

  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}

  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}

  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}

  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

 무선 신호를 활용해 공중 객체를 감지하는 센싱 기능의 가능성을 입증했다. 통신과 센싱이 융합된 6G 핵심 기술 개발의 진전을 보여준다. 경쟁사의 차세대 기술 경쟁력 강화를 위한 주요 R&D 성과이다.", "source": "thelec.net", "date": "2026-09-03 09:03", "url": "https://www.thelec.net/news/articleView.html?idxno=13551", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 6g 기지국 드론 탐지 기술"}, {"title": "Ericsson to Unveil Drone-Tracking Network Tech in Korea - Seoul Economic Daily", "summary": "에릭슨이 한국 시장에서 통신 기지국을 활용한 드론 추적 및 감지 네트워크 기술을 공식 공개할 예정이다. 5G 기지국의 무선 신호 분석을 통해 별도의 장비 없이 드론의 위치를 실시간으로 파악할 수 있는 혁신 기술이다. 국내 통신 인프라 시장을 겨냥한 차세대 안티드론 솔루션 소개다. 에릭슨의 국내 신기술 발표 소식이다.", "source": "Seoul Economic Daily", "date": "2026-09-02 17:46", "url": "https://en.sedaily.com/technology/2026/09/02/ericsson-to-unveil-drone-tracking-network-tech-in-korea", "category": "tech", "importance": 4, "wl": false, "topic": "에릭슨 한국 드론 추적 네트워크 기술 공개"}, {"title": "Huawei profits fall in H1 on revenues up 10% - Telecompaper", "summary": "화웨이가 발표한 상반기 실적에서 매출은 전년 동기 대비 10% 증가했으나 순이익은 감소한 것으로 나타났다. 매출 성장세에도 불구하고 R&D 투자 확대와 비용 증가로 인해 수익성이 다소 악화됐다. 미국의 제재 속에서도 외형 성장을 이어가는 화웨이의 재무 상태를 보여준다. 경쟁사의 공식 재무 실적 발표 보도이다.", "source": "Telecompaper", "date": "2026-09-02 16:05", "url": "https://www.telecompaper.com/news/huawei-profits-fall-in-h1-on-revenues-up-10--1581432", "category": "earnings", "importance": 4, "wl": false, "topic": "화웨이 상반기 실적 매출 증가 이익 감소"}, {"title": "Ericsson signs multi-year deal with stc to expand 5G network - Developing Telecoms", "summary": "에릭슨이 사우디아라비아 통신사 STC와 다년간의 5G 네트워크 확장 계약을 체결했다. 사우디 전역의 5G 인프라 고도화와 커버리지 확대를 위한 대규모 장비 공급 프로젝트다. 중동 시장에서 에릭슨의 입지를 더욱 공고히 하는 계기가 된다. 글로벌 대형 통신장비사의 주요 수주 성과이다.", "source": "Developing Telecoms", "date": "2026-09-02 13:29", "url": "https://developingtelecoms.com/telecom-technology/wireless-networks/20768-ericsson-signs-multi-year-deal-with-stc-to-expand-5g-network.html", "category": "contract", "importance": 4, "wl": false, "topic": "에릭슨 stc 5g 네트워크 확장 계약"}, {"title": "T-Mobile sets CFO transition", "summary": "미국 통신사 T-Mobile은 쉘(Shell)의 전 CFO인 제시카 울(Jessica Uhl)을 2027년 2월 새로운 최고재무책임자(CFO)로 선임한다고 발표했다. 현 CFO인 피터 오스발딕(Peter Osvaldik)은 2027년 7월 1일 은퇴할 때까지 전략 자문 역할을 수행할 예정이다. 이번 최고재무책임자 교체는 중장기 재무 전략의 연속성을 유지하기 위한 리더십 개편의 일환으로 추진된다. T-Mobile은 이번 인사를 통해 급변하는 통신 시장에서 재무 건전성과 투자 효율성을 강화할 계획이다.", "source": "Light Reading", "date": "2026-09-04 05:49", "url": "https://www.lightreading.com/finance/t-mobile-sets-cfo-transition", "category": "exec", "importance": 3, "wl": true, "topic": "티모바일 임원"}, {"title": "Nokia (HLSE:NOKIA) Targets Digital Healthcare With Network As Code - Yahoo Finance", "summary": "노키아가 네트워크 오픈 API 기술인 'Network as Code'를 활용하여 디지털 헬스케어 시장 공략에 나섰다. 통신망의 프로그래밍 가능성을 높여 의료 서비스 접근성을 개선하는 협력을 추진한다. 통신 장비의 소프트웨어 및 API 생태계 확장 전략의 일환이다. 글로벌 통신장비 경쟁사의 신사업 전략 동향이다.", "source": "Yahoo Finance", "date": "2026-09-04 03:16", "url": "https://finance.yahoo.com/technology/ai/articles/nokia-hlse-nokia-targets-digital-181601230.html", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 디지털 헬스케어 네트워크 api"}, {"title": "Ericsson Japan begins AI network research with Tokyo partners - Telecoms Tech News", "summary": "에릭슨 재팬이 도쿄 지역 파트너들과 손잡고 AI 네트워크 공동 연구에 착수했다. 일본 시장의 특성에 맞춘 차세대 무선 통신 및 인공지능 결합 기술을 검증한다. 현지 통신 환경에 최적화된 솔루션 개발을 위한 R&D 협력이다. 에릭슨의 글로벌 오픈 R&D 전략의 일환이다.", "source": "Telecoms Tech News", "date": "2026-09-04 00:16", "url": "https://www.telecomstechnews.com/news/ericsson-japan-begins-ai-network-research-with-tokyo-partners/", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 일본 도쿄 ai 네트워크 연구"}, {"title": "Nokia and BeeHealthy Bring Network-based Verification to Digital Healthcare - NewswireToda", "summary": "노키아가 헬스케어 부문과 손잡고 네트워크 기반 신원 인증 솔루션을 제공하기 시작했다. 통신망 API를 이용해 사용자 본인 확인 과정을 간소화하고 보안성을 높인다. 통신 장비사의 소프트웨어 API 사업 확장 모델이다. 노키아의 B2B 솔루션 제휴 보도이다.", "source": "NewswireToday", "date": "2026-09-04 00:01", "url": "https://www.newswiretoday.com/news/186783/Nokia-and-BeeHealthy-Bring-Network-based-Verification-to-Digital-Healthcare/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 헬스케어 번호 인증 솔루션"}, {"title": "Minnesota operator taps MoCA Access tech to connect MDUs", "summary": "미국 민네소타주의 가족 소유 통신 사업자인 쇼베르(Sjoberg Inc.)가 인코액스(InCoax) 및 노키아(Nokia)와의 파트너십을 통해 다세대 주택(MDU) 단지에 모카 액세스(MoCA Access) 기술을 적용해 기가비트 속도를 구현했다. 이번 협력은 기존 구내동축케이블을 활용해 초고속 브로드밴드 서비스를 효율적으로 확장하는 데 초점을 맞추었다. 노키아는 자사의 네트워크 솔루션을 통해 중소형 통신사의 네트워크 고도화를 지원하고 있다. 해당 프로젝트는 주거지역의 기가비트 인프라 보급을 가속화하는 사례로 평가된다.", "source": "Light Reading", "date": "2026-09-03 23:13", "url": "https://www.lightreading.com/broadband/minnesota-operator-taps-moca-access-tech-to-connect-mdus", "category": "contract", "importance": 3, "wl": true, "topic": "노키아 모카"}, {"title": "Chinese businesses of all stripes are turning to Huawei - The Economist", "summary": "중국 내 다양한 산업 분야의 기업들이 서구권 기술 제재 속에서 국산화 및 자립화 기조에 맞춰 화웨이의 장비와 소프트웨어를 적극 도입하고 있다. 내수 시장을 중심으로 화웨이의 생태계가 빠르게 확장되는 양상이다. 미·중 기술 패권 경쟁 속 화웨이의 현지 입지를 보여준다. 경쟁사 관련 비즈니스 동향 보도이다.", "source": "The Economist", "date": "2026-09-03 22:08", "url": "https://www.economist.com/business/2026/09/03/chinese-businesses-of-all-stripes-are-turning-to-huawei", "category": "other", "importance": 3, "wl": false, "topic": "화웨이 중국 기업들 도입 증가"}, {"title": "Nokia's Sustainability Strategy: An Engine for Innovation, Collaboration, and Long-Term Im", "summary": "노키아가 혁신과 협력을 바탕으로 한 장기적 지속가능경영 및 환경 전략을 발표했다. 친환경 기술 개발과 공급망 관리를 통해 기업의 장기적 가치를 제고하겠다는 방침이다. 글로벌 ESG 경영 기조에 발맞춘 행보를 보여준다. 경쟁사의 경영 전략 방향을 파악할 수 있다.", "source": "Morningstar", "date": "2026-09-03 21:35", "url": "https://www.morningstar.com/news/accesswire/1216238msn/nokias-sustainability-strategy-an-engine-for-innovation-collaboration-and-long-term-impact", "category": "other", "importance": 3, "wl": false, "topic": "노키아 지속가능경영 전략"}, {"title": "Nokia takes aim at healthcare with network deal - Mobile World Live", "summary": "노키아가 전용 네트워크 기술을 활용해 헬스케어 부문 진출을 본격화하는 네트워크 공급 계약을 체결했다. 통신 장비 벤더의 버티컬 시장 확장 사례다.", "source": "Mobile World Live", "date": "2026-09-03 21:17", "url": "https://www.mobileworldlive.com/industry/nokia-takes-aim-at-healthcare-with-network-deal/", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 헬스케어 수주"}, {"title": "The era of AI-native RAN starts now - Nokia", "summary": "노키아가 인공지능이 내재된 차세대 무선 접속망(AI-native RAN) 시대의 도래를 선언하고 관련 기술 비전을 제시했다. AI 알고리즘을 네트워크 설계 단계부터 적용하여 성능과 효율성을 극대화한다. 차세대 이동통신 장비 시장의 패러다임 변화를 주도하겠다는 전략이다. 경쟁사의 기술 전략 발표 보도이다.", "source": "Nokia", "date": "2026-09-03 21:05", "url": "https://www.nokia.com/blog/the-era-of-ai-native-ran-starts-now/", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai 네이티브 ran 비전"}, {"title": "How Could Nokia (NYSE:NOK) R&D Plans Affect NYSE Composite? - Kalkine Media", "summary": "노키아의 최근 연구개발(R&D) 투자 확대 계획이 뉴욕증권거래소(NYSE) 등 글로벌 자본시장에 미치는 영향에 대한 분석이 제기됐다. AI 및 차세대 통신 기술 투자가 기업 가치 평가에 긍정적으로 작용하고 있다. 장비사의 기술 투자 방향과 시장 반응을 다룬 내용이다. 노키아의 R&D 전략 분석 보도이다.", "source": "Kalkine Media", "date": "2026-09-03 19:53", "url": "https://kalkinemedia.com/us/stocks/penny/how-could-nokia-nysenok-rd-plans-affect-nyse-composite", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 r&d 계획 증시 영향"}, {"title": "Nokia deploys Gibabit Connect with InCoax MoCA Access for apartments on Sjoberg's network ", "summary": "노키아가 스웨덴 쇼베리 네트워크의 아파트 단지를 대상으로 기가비트 커넥트 솔루션을 공급 및 구축했다. InCoax MoCA Access 기술을 적용해 기존 케이블 인프라를 활용한 고속 인터넷 서비스를 제공한다. 주거용 초고속 통신망 장비 공급 실적이다. 글로벌 장비사의 유선 액세스 네트워크 장비 공급 사례이다.", "source": "Telecompaper", "date": "2026-09-03 19:46", "url": "https://www.telecompaper.com/news/nokia-deploys-gibabit-connect-with-incoax-moca-access-for-apartments-on-sjobergs-network-in-minnesota--1581634", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 기가비트 커넥트 구축"}, {"title": "La Caisse makes $1 billion-plus bet on Indian towers - Telecoms", "summary": "캐나다 연기금(La Caisse)이 인도 통신 타워 인프라 시장에 10억 달러 이상의 대규모 투자를 단행했다. 인도 통신 시장의 성장성에 발맞추어 인프라 자산을 확보하려는 전략이다. 글로벌 투자 기관의 통신 인프라 자산 투자 동향을 보여준다. 통신 타워 시장의 자본 유입 사례이다.", "source": "Telecoms", "date": "2026-09-03 19:34", "url": "https://www.telecoms.com/towers/la-caisse-makes-1-billion-plus-bet-on-indian-towers", "category": "other", "importance": 3, "wl": false, "topic": "캐나다 연기금 인도 통신 타워 투자"}, {"title": "바이트댄스, 중국 네이멍구에 대규모 AI데이터센터 건설 추진", "summary": "통신장비 업체 화웨이 를 비롯해 숏폼·AI 기업 콰이서우, 전자상거래 업체 알리바바, 미국 애플 등이 이 지역에 컴퓨팅 시설 관련 투자를 진행한 바 있습니다. 바이트댄스가 추진하는 데이터센터의 투자 규모가...", "source": "news.sbs.co.kr", "date": "2026-09-03 19:03", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008736908&plink=ORI&cooper=NAVER", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "우리넷, 16Tbps급 국산 장비로 AI 네트워크 상용화 시험대", "summary": "국내 중소 장비업체인 우리넷이 국책과제로 개발한 16Tbps급 네트워크 장비를 실제 운용 환경에서 검증하며 상용화에 속도를 낸다. 한국지능정보사회진흥원(NIA)의 '2026년 KOREN 기반 AI NETWORK 장비 시범도입 실증' 사업 주관기관으로 선정되어 자체 개발한 '16Tbps급 패킷-광-전달망 시스템'의 성능과 안정성을 검증한다. 국내 통신장비 업체의 차세대 AI 네트워크 인프라 기술 상용화 도전으로 주목된다.", "source": "ZDNet Korea", "date": "2026-09-03 17:56", "url": "https://zdnet.co.kr/view/?no=20260903175618", "category": "contract", "importance": 3, "wl": true, "topic": "우리넷 ai네트워크"}, {"title": "Nokia opens AI research centre in Riyadh - fibre-systems.com", "summary": "노키아가 사우디아라비아 리야드에 인공지능(AI) 연구개발 센터를 공식 개소했다. 중동 지역에서 AI 기반 네트워크 자동화 기술 연구를 주도할 거점을 마련했다. 현지 파트너들과의 협력을 통해 차세대 통신 R&D 역량을 강화할 계획이다. 글로벌 통신장비사의 R&D 거점 확장 동향이다.", "source": "fibre-systems.com", "date": "2026-09-03 17:50", "url": "https://www.fibre-systems.com/article/nokia-opens-ai-research-centre-riyadh", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 사우디 ai 연구소 개소"}, {"title": "Digital health vendor BeeHealthy taps Nokia's number verification API to check patient IDs", "summary": "디지털 헬스케어 기업 비건강티가 환자 신원 확인을 위해 노키아의 번호 인증 API 솔루션을 도입했다. 통신망 기반의 간편 인증을 통해 의료 앱의 보안성과 편의성을 동시에 높인다. 통신 장비사의 API가 이종 산업으로 확장되는 대표적 사례다. 통신 기술의 헬스케어 융합 수주 실적이다.", "source": "Telecompaper", "date": "2026-09-03 17:31", "url": "https://www.telecompaper.com/news/digital-health-vendor-beehealthy-taps-nokias-number-verification-api-to-check-patient-ids--1581595", "category": "contract", "importance": 3, "wl": false, "topic": "노키아 비건강티 번호 인증 api 연동"}, {"title": "LIG아큐버, LG유플러스와 291억원 규모 Core Probe 공급 계약 - 데이터투자", "summary": "LIG아큐버가 LG유플러스와 291억 원 규모의 Core Probe 공급 계약을 체결했다는 장비 공급 계약 보도입니다.", "source": "데이터투자", "date": "2026-09-03 17:27", "url": "https://www.datatooza.com/article/20260903172751600752ef3ef162_80", "category": "contract", "importance": 3, "wl": false, "topic": "lig아큐버 수주"}, {"title": "AI pushes fiber networks toward a capacity crunch, AFL says", "summary": "AFL의 노아 테일러(Noah Taylor)는 AI 인프라 확장에 따라 광섬유 가용성과 전력 제약이 맞물려 심각한 용량 부족(Capacity crunch) 위기를 초래할 수 있다고 경고했다. AI 데이터센터와 통신망 간 데이터 트래픽 폭증은 물리적 인프라 공급에 큰 부담을 주고 있다. 광케이블 및 관련 장비 제조사들은 수요 급증에 대응하기 위한 생산 능력 확대와 공급망 안정화가 요구된다. 해당 문제는 향후 차세대 네트워크 구축 속도를 좌우할 주요 제약 요인으로 꼽힌다.", "source": "RCR Wireless", "date": "2026-09-03 16:07", "url": "https://rcrwireless.com/20260903/networks/ai-fiber-afl", "category": "tech", "importance": 3, "wl": true, "topic": "업계동향 광섬유"}, {"title": "SKT·LGU+, 줄여온 망 투자 다시 늘리나…5G SA·주파수 경매 변수", "summary": "AI-RAN은 기지국과 AI 기술을 결합해 네트워크 운영 효율을 높이고 자율주행·로봇 등 AI 기반 서비스를 지원하는 기술이다. SK텔레콤은 정부의 AI-RAN 관련 사업에 참여해 삼성전자 ·에릭슨·노키아 등과 실증을...", "source": "press9.kr", "date": "2026-09-03 15:14", "url": "http://www.press9.kr/news/articleView.html?idxno=82116", "category": "tech", "importance": 3, "wl": false, "topic": ""}, {"title": "Telstra deploys Ericsson AI scheduler nationwide to boost mobile performance - Telecompape", "summary": "호주 통신사 텔스트라가 모바일 성능 향상을 위해 에릭슨의 AI 스케줄러 솔루션을 전국망에 배치했다. 인공지능 알고리즘을 통해 무선 자원 할당을 최적화하고 사용자 체감 통신 품질을 높인다. 통신 장비와 결합된 AI 솔루션의 상용화 확산 사례이다. 에릭슨의 네트워크 최적화 소프트웨어 공급 성과이다.", "source": "Telecompaper", "date": "2026-09-03 14:48", "url": "https://www.telecompaper.com/news/telstra-deploys-ericsson-ai-scheduler-nationwide-to-boost-mobile-performance--1581561", "category": "contract", "importance": 3, "wl": false, "topic": "텔스트라 에릭슨 ai 스케줄러 도입"}, {"title": "Ericsson, Mobily Advance AI-Powered RAN and Autonomous Networks in Saudi Arabia - The Fast", "summary": "에릭슨이 사우디아라비아에서 모빌리와 손잡고 인공지능(AI) 기반 RAN 및 자율주행 네트워크 기술 고도화를 추진한다. 사우디의 디지털 전환 가속화를 위한 차세대 통신 인프라 구축 협력이다. AI 기술을 접목한 무선 접속망 성능 개선에 초점을 맞추고 있다. 글로벌 통신장비사의 중동 지역 기술 협력 사례이다.", "source": "The Fast Mode", "date": "2026-09-03 14:14", "url": "https://www.thefastmode.com/technology-solutions/50432-ericsson-mobily-advance-ai-powered-ran-and-autonomous-networks-in-saudi-arabia", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 사우디 ai ran 협력"}, {"title": "Is Nokia The AI Infra Dark Horse? New Agentic Rollouts Lift NOK Stock Overnight, Win Retai", "summary": "노키아가 AI 인프라 시장의 다크호스로 부각되며 새로운 에이전틱 솔루션 출시와 함께 주가가 급등했다. 인공지능 기반 네트워크 운영 자동화 기술이 시장의 호응을 얻고 있다. 통신 장비와 AI의 결합을 통한 새로운 수익 창출 모델을 제시하고 있다. 경쟁사의 AI 관련 소프트웨어 전략 동향이다.", "source": "Stocktwits", "date": "2026-09-03 07:16", "url": "https://stocktwits.com/news-articles/markets/equity/is-nokia-the-ai-infra-dark-horse-new-agentic-rollouts-lift-nok-stock-overnight-win-retail-praise/cZX1XHJReKC", "category": "tech", "importance": 3, "wl": false, "topic": "노키아 ai 인프라 에이전틱 솔루션"}, {"title": "Ericsson powers Saudi Arabia’s next phase of digital transformation and innovation - Tahaw", "summary": "에릭슨이 사우디아라비아의 차세대 디지털 전환과 기술 혁신을 지원하기 위한 인프라 협력을 강화한다. 사우디의 국가적 통신 현대화 사업에서 핵심 장비 공급자로서 역할을 수행하고 있다. 중동 지역 통신사와의 전략적 파트너십을 지속 확대하고 있다. 경쟁사의 지역별 사업 전략 보도이다.", "source": "TahawulTech.com", "date": "2026-09-03 07:04", "url": "https://www.tahawultech.com/interviews/ericsson-powers-saudi-arabias-next-phase-of-digital-transformation-and-innovation/", "category": "tech", "importance": 3, "wl": false, "topic": "에릭슨 사우디 디지털 전환 협력"}, {"title": "Telecom news: stc Group, Ericsson, Starlink Mobile, 4iG Group, SpaceX, Movandi, ACES - Tel", "summary": "에릭슨이 사우디 STC 그룹 등 글로벌 통신 사업자들과의 최신 네트워크 협력 및 공급 성과를 발표했다. 5G 확장 및 차세대 통신 인프라 구축을 위한 파트너십이 다수 체결됐다. 중동 통신 시장에서의 장비 공급 확대 흐름을 보여준다. 글로벌 장비사들의 수주 및 기술 제휴 동향이다.", "source": "TelecomLead", "date": "2026-09-03 03:14", "url": "https://telecomlead.com/news/telecom-news-stc-group-ericsson-starlink-mobile-4ig-group-spacex-movandi-aces-127581", "category": "contract", "importance": 3, "wl": false, "topic": "에릭슨 stc 네트워크 협력"}], "policy": [{"title": "India mulls removal of legacy Chinese telecoms kit - report - Data Center Dynamics", "summary": "인도 정부가 자국 통신망 내에 남아있는 구형 중국산 통신장비를 단계적으로 철거하는 방안을 검토하고 있는 것으로 알려졌다. 안보 우려를 이유로 화웨이 및 ZTE 등 중국산 장비를 국가 통신망에서 완전히 배제하려는 수순이다. 주요국 정부 차원의 중국산 장비 퇴출 기조가 인도 시장으로 확산되고 있음을 시사한다. 글로벌 통신 장비 시장의 판도를 바꿀 수 있는 주요 규제 이슈이다.", "source": "Data Center Dynamics", "date": "2026-09-04 02:02", "url": "https://www.datacenterdynamics.com/en/news/india-mulls-removal-of-legacy-chinese-telecoms-kit-report/", "category": "policy", "importance": 5, "wl": false, "topic": "인도 구형 중국산 통신장비 철거 검토"}, {"title": "India weighs 'rip and replace' of legacy Chinese telecom gear – report", "summary": "인도 정부가 국가 안보 우려를 이유로 자국 내에 구축된 노후화된 중국산 통신 장비를 철거하고 교체하는 방안을 검토 중인 것으로 알려졌다. 이번 조치는 글로벌 주요국들이 국가 안보 및 보안 위험을 명분으로 화웨이와 ZTE 등 중국산 장비 배제를 가속화하는 흐름과 맥을 같이 한다. 만약 본격적인 리프 앤 리플레이스(Rip and Replace) 정책이 시행될 경우, 인도 통신 시장 내 장비 공급망에 대규모 지형 변화가 발생할 전망이다. 글로벌 통신 장비사들은 인도 시장의 잠재적 교체 수요에 주목하며 수주 전략을 재정비하고 있다.", "source": "Light Reading", "date": "2026-09-02 21:35", "url": "https://www.lightreading.com/regulatory-politics/india-weighs-rip-and-replace-of-legacy-chinese-telecom-gear---report", "category": "policy", "importance": 5, "wl": true, "topic": "인도정부 화웨이"}, {"title": "The ‘Covered List’: A Fraud Claimed ‘National Security’ - Lawfare", "summary": "미국 연방통신위원회(FCC) 등이 주도하는 안보 위협 장비 목록인 이른바 '커버드 리스트(Covered List)' 제도의 정책적 타당성과 규제 실효성에 대한 법률·정책적 분석이 제기됐다. 국가 안보를 명목으로 한 장비 제재 조치가 통신 장비 시장에 미치는 파장을 다루고 있다. 주요국 정부의 통신 보안 규제 관련 심층 분석 보도이다.", "source": "Lawfare", "date": "2026-09-03 23:00", "url": "https://www.lawfaremedia.org/article/the--covered-list---a-fraud-claimed--national-security", "category": "policy", "importance": 4, "wl": false, "topic": "미국 커버드 리스트 국가안보 제재"}, {"title": "미국 정부, AI 저작권 소송서 오픈AI 지지…\"학습 제한하면 혁신 저해\"", "summary": "미국 트럼프 행정부가 뉴욕타임스(NYT)가 오픈AI를 상대로 제기한 저작권 침해 소송에서 오픈AI의 주장을 지지하는 의견서를 법원에 제출했다. 저작권 규제로 AI 학습을 제한할 경우 미국의 기술 발전과 산업 경쟁력을 저해할 수 있다는 판단에서다. AI 모델 학습과 저작권을 둘러싼 법적 공방에서 미국 정부가 빅테크의 손을 들어준 중대한 정책적 개입이다. AI 산업 전반의 규제 환경에 큰 파장을 미칠 전망이다.", "source": "ZDNet Korea", "date": "2026-09-03 17:28", "url": "https://zdnet.co.kr/view/?no=20260903171308", "category": "policy", "importance": 4, "wl": true, "topic": "미국정부 오픈ai"}, {"title": "화웨이 제재, 부품까지 번진다∙∙∙韓 장비업체에 쏠리는 눈 - 리드경제", "summary": "미국의 대중국 화웨이 제재가 완제품을 넘어 부품 공급망 전반으로 확산되면서 반사이익을 기대하는 국내 통신 장비 및 부품업체들에게 이목이 쏠리고 있다. 글로벌 통신장비 시장의 공급망 재편 속에서 한국 기업들의 기회가 모색되고 있다. 정부의 대중 제재 정책에 따른 국내 업계 영향 분석 기사이다.", "source": "리드경제", "date": "2026-09-02 10:00", "url": "https://www.leadeconomy.co.kr/news/articleView.html?idxno=9505", "category": "policy", "importance": 4, "wl": false, "topic": "화웨이 제재 부품 확산 韓 장비업체 수혜"}, {"title": "BEAD 'non-deployment' funds to be used for deployment – NTIA", "summary": "미국 광대역, EQUITY, Access and Deployment(BEAD) 프로그램을 총괄하는 NTIA는 잔여 BEAD 자금이 추가 입찰에 활용될 것이라는 지침을 발표했다. 이번 지침은 광대역 인프라 구축의 효율성을 높이고 미사용 예산의 활용 범위를 명확히 하기 위한 목적에서 마련됐다. 기타 자금 사용 방안에 대해서는 향후 후속 지침을 통해 추가로 다뤄질 예정이다. 해당 자금 집행 방식은 미국 내 통신 인프라 투자와 관련된 주요 정책적 방향성에 영향을 미칠 것으로 예상된다.", "source": "Light Reading", "date": "2026-09-04 05:16", "url": "https://www.lightreading.com/broadband/bead-non-deployment-funds-to-be-used-for-deployment-ntia", "category": "policy", "importance": 3, "wl": true, "topic": "미국정부 광대역"}, {"title": "GAO issues broadband program to-dos for FCC, NTIA", "summary": "미국 회계감사원(GAO)이 연방 광대역 프로그램의 현황을 평가하고 연방통신위원회(FCC)와 NTIA에 구체적인 권고사항을 전달했다. 이번 평가는 광대역 매핑 데이터의 정확성과 통신 프로그램의 재정적 지속 가능성을 높이는 데 초점이 맞춰졌다. GAO는 연방 예산이 투입되는 통신 인프라 사업의 관리 체계를 강화할 것을 촉구했다. 해당 권고는 향후 미국 내 통신 정책 및 보조금 집행의 투명성을 높이는 데 기여할 것으로 보인다.", "source": "Light Reading", "date": "2026-09-03 21:00", "url": "https://www.lightreading.com/broadband/gao-issues-broadband-program-to-dos-for-fcc-ntia", "category": "policy", "importance": 3, "wl": true, "topic": "미국정부 gao"}, {"title": "AI regulatory regime should be nimble, not over-constraining: Top PM advisor", "summary": "인도의 최고 총리 자문가는 인공지능에 대한 규제 체계가 지나치게 구속력 있기보다는 기민하게(Nimble) 운용되어야 한다는 입장을 밝혔다. 현재 인도는 AI 관련 독자적인 법률이 부재한 상태이나, IT법 개정을 통해 딥페이크와 AI 규정 정비를 추진하고 있다. 정부는 산업 혁신을 저해하지 않으면서도 부작용을 예방할 수 있는 유연한 규제 프레임워크를 모색하고 있다. 해당 정책 방향은 인도 테크 시장의 성장 속도에 영향을 미칠 전망이다.", "source": "ET Telecom", "date": "2026-09-03 16:55", "url": "https://telecom.economictimes.indiatimes.com/news/policy/ai-regulatory-regime-should-be-nimble-not-over-constraining-top-pm-advisor/133729523", "category": "policy", "importance": 3, "wl": true, "topic": "인도정부 ai"}, {"title": "알에프텍, RF 전문 자회사 ‘RFTC’ 출범… 5G ·방산 사업 확대", "summary": "알에프텍(061040)이 5G 통신 장비 와 방산 분야 무선주파수(RF) 기술을 담당하는 전문 자회사 ‘RFTC’를 출범하고 관련 사업 확대에 나선다. 알에프텍은 기존 5G ·방산 분야 연구개발(R&D) 조직을 별도 자회사 RFTC로...", "source": "edaily.co.kr", "date": "2026-09-03 14:44", "url": "https://www.edaily.co.kr/News/Read?newsId=04142646645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "DoT leaning toward 5% AGR-linked charge for satellite spectrum - Communications Today", "summary": "인도 통신부(DoT)가 위성통신 주파수 할당과 관련해 AGR 연계 요율 부과 방안을 검토하고 있다는 규제 정책 동향입니다.", "source": "Communications Today", "date": "2026-09-03 13:56", "url": "https://www.communicationstoday.co.in/dot-leaning-toward-5-agr-linked-charge-for-satellite-spectrum/", "category": "policy", "importance": 3, "wl": false, "topic": "위성통신 주파수규제"}, {"title": "ICT기금 내년에도 14.8% 줄어든다…재원 개편 논의 불가피", "summary": "핵심 재원인 주파수 할당 대가 경우 변동성이 큰데다, 방송광고 시장 위축으로 또 다른 재원인 방송사 분담금도 정체 상태다. 실제 방송사 분담금 징수액은 올해 계획 기준 1526억원으로, 지상파·종합유선방송사업자...", "source": "etnews.com", "date": "2026-09-03 13:48", "url": "https://www.etnews.com/20260903000243", "category": "policy", "importance": 3, "wl": false, "topic": ""}, {"title": "Public Protection, Disaster Relief Network Pilot From Oct, Deployment By 2027: MHA Officia", "summary": "인도 내무부가 공공 보호 및 재난구호(PPDR)를 위한 전용 : false, "topic": "kt클라우드 데이터센터"}, {"title": "Verizon advances its Carrier Ethernet standing amidst M&A market shuffle - Lightwave Onlin", "summary": "미국 통신사 버라이즌이 통신 M&A 시장의 구조조정 속에서 캐리어 이더넷(Carrier Ethernet) 서비스 부문의 시장 지위와 경쟁력을 한층 강화했다. 기업용 유선 네트워크 및 전용선 시장에서의 입지를 다지는 행보다. 주요 통신사의 기업용 통신 서비스 전략 보도이다.", "source": "Lightwave Online", "date": "2026-09-04 05:53", "url": "https://www.lightwaveonline.com/home/article/55403011/verizon-advances-its-carrier-ethernet-standing-amidst-ma-market-shuffle", "category": "contract", "importance": 3, "wl": false, "topic": "버라이즌 캐리어 이더넷 m&a 입지 강화"}, {"title": "London lagged on underground mobile but it's nearly there - Telecoms", "summary": "영국 런던 지하철의 지하 이동통신 커버리지 구축 작업이 막바지 단계에 접어들었다. 그동안 지연되었던 지하철 내 셀룰러 서비스 제공이 거의 완료되어 가고 있다. 대도시 대중교통망 통신 인프라 개선 프로젝트의 진척 상황이다. 통신 서비스 커버리지 확충 관련 보도이다.", "source": "Telecoms", "date": "2026-09-04 04:30", "url": "https://www.telecoms.com/5g-6g/london-lagged-on-underground-mobile-but-it-s-nearly-there", "category": "contract", "importance": 3, "wl": false, "topic": "런던 지하철 모바일 커버리지 구축"}, {"title": "125 Years on the New York Stock Exchange: A legacy built for the future of connectivity - ", "summary": "미국 대형 통신사 AT&T가 뉴욕증권거래소(NYSE) 상장 125주년을 맞아 미래 연결성을 위한 오랜 역사와 유산을 기념했다. 오랜 기간 통신 인프라 혁신을 주도해온 기업의 발자취를 조명하고 있다. 주요 통신사의 기업 역사 기념 보도이다.", "source": "about.att.com", "date": "2026-09-04 03:46", "url": "https://about.att.com/blogs/2026/125-years-on-nyse.html", "category": "other", "importance": 3, "wl": false, "topic": "at&t 뉴욕증권거래소 상장 125주년"}, {"title": "VodafoneThree unveils SuperMobile 5G+ national network slice service - BeBeez Internationa", "summary": "보다폰과 쓰리의 합작사인 보다폰쓰리가 슈퍼모바일 5G+ 국가 차원의 네트워크 슬라이싱 서비스 출격을 공식화했다.", "source": "BeBeez International", "date": "2026-09-04 02:09", "url": "https://bebeez.eu/2026/09/03/vodafonethree-unveils-supermobile-5g-national-network-slice-service/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 쓰리 5g 슬라이싱"}, {"title": "SK Telecom’s Topda turns work vans into an AI inspection fleet", "summary": "SK텔레콤이 일반 업무용 밴에 AI 카메라를 탑재하여 일상적인 기술자 이동 경로를 유선 점검 차량으로 활용하는 '탑다(Topda)' 시스템을 상용화했다. 이 시스템은 AI 기반 이미지 분석 기술을 통해 통신 인프라와 유선망의 이상 유무를 효율적으로 감지한다. 통신사는 현장 작업의 자동화와 유지보수 비용 절감을 위해 AI 기술 적용을 가속화하고 있다. SK텔레콤의 이번 상용화는 현장 인프라 관리의 디지털 전환을 보여주는 대표적 사례다.", "source": "RCR Wireless", "date": "2026-09-04 01:56", "url": "https://rcrwireless.com/20260903/tech/sk-telecoms-topda", "category": "tech", "importance": 3, "wl": true, "topic": "sk텔레콤 ai"}, {"title": "Generational shift: DT brings in AWS’ Hofmeyr for AI/network amid wider refresh, CFO exit ", "summary": "AI와 네트워크 역량 강화를 위해 AWS 출신 호프마이어를 영입하고 기존 CFO가 퇴임하는 등 도이치텔레콤의 세대교체형 리더십 개편이 이뤄졌다.", "source": "telcotitans.com", "date": "2026-09-04 01:51", "url": "https://www.telcotitans.com/deutsche-telekomwatch/generational-shift-dt-brings-in-aws-hofmeyr-for-ai/network-amid-wider-refresh-cfo-exit/10841.article", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 경영진 쇄신"}, {"title": "Jan Hofmeyr named DT's new Board of Management member for product and technology - Fierce ", "summary": "얀 호프마이어가 도이치텔레콤의 제품 및 기술 담당 신임 이사회 멤버로 공식 합류했다. 통신사 R&D 및 기술 전략의 변화를 예고한다.", "source": "Fierce Network", "date": "2026-09-04 00:54", "url": "https://www.fierce-network.com/newswire/jan-hofmeyr-named-dts-new-board-management-member-product-and-technology", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 임원 선임"}, {"title": "VodafoneThree revs 5G SA engine with SuperMobile pitched as competitive edge - telcotitans", "summary": "보다폰과 삼(Three)의 합작 법인이 슈퍼모바일(SuperMobile) 브랜드로 5G 단독모드(SA) 네트워크 슬라이싱 서비스를 출시하며 경쟁 우위 확보에 나섰다.", "source": "telcotitans.com", "date": "2026-09-04 00:51", "url": "https://www.telcotitans.com/vodafonewatch/vodafonethree-revs-5g-sa-engine-with-supermobile-pitched-as-competitive-edge/10838.article", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 쓰리 5g 서비스"}, {"title": "VodafoneThree intros tiered 5G SA slicing portfolio for consumers, enterprises, critical s", "summary": "영국 보다폰쓰리가 소비자 및 기업 고객을 대상으로 티어드(Tiered) 방식의 '패스트트랙' 5G SA 네트워크 슬라이싱 서비스 포트폴리오를 출시했다. 이번 서비스는 맞춤형 품질 보장을 요구하는 기업 고객과 고성능 통신이 필요한 소비자를 겨냥했다. 5G 단독모드 상용화에 이어 네트워크 슬라이싱을 통한 수익화 모델 발굴이 통신사들의 핵심 전략으로 자리 잡고 있다. 양사 합병 이후 서비스 차별화와 가입자 확보 경쟁이 본격화되는 양상이다.", "source": "RCR Wireless", "date": "2026-09-04 00:21", "url": "https://rcrwireless.com/20260903/5g/vodafonethree-tiered-5g-sa-slicing-enterprises-critical-services", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 5g"}, {"title": "Vodafone Follows Bharti Airtel: 5G Network Slicing Live with Minimum 15 Mbps Speeds - Tele", "summary": "보다폰이 바르티 에어텔의 뒤를 이어 최소 15Mbps 속도를 보장하는 5G 네트워크 슬라이싱 상용 서비스를 개시했다. B2B 및 고품질 특화 서비스 제공을 위한 망 진화 사례다.", "source": "TelecomTalk", "date": "2026-09-04 00:05", "url": "https://telecomtalk.info/vodafone-follows-airtel-5g-network-slicing-live/1011530/", "category": "tech", "importance": 3, "wl": false, "topic": "보다폰 5g 네트워크 슬라이싱"}, {"title": "AT&T tops Ethernet Leaderboard amid ranking shakeup – Vertical Systems", "summary": "수직 시스템스(Vertical Systems)의 최신 순위 발표에 따르면, AT&T가 미국 캐리어 이더넷 리더보드(US Carrier Ethernet Leaderboard)에서 1위 자리를 유지했다. 이번 순위 개편은 주요 통신 사업자 간의 경쟁 구도 변화 속에서 이루어졌다. AT&T는 기업용 이더넷 시장에서의 강력한 입지와 서비스 품질을 입증했다. 해당 결과는 미국 내 통신사들의 B2B 네트워크 서비스 경쟁력을 보여주는 지표로 활용된다.", "source": "Light Reading", "date": "2026-09-03 23:44", "url": "https://www.lightreading.com/broadband/at-t-tops-ethernet-leaderboard-amid-ranking-shakeup-vertical-systems", "category": "other", "importance": 3, "wl": true, "topic": "at&t 이더넷"}, {"title": "SmarTone chairman warns over revenue slide", "summary": "홍콩 통신사 스마톤(SmarTone)의 회장이 회사의 매출 감소세에 대해 경고하며 사업을 대폭 강화해야 한다고 강조했다. 최근 실적 부진에 직면한 스마톤은 수익성 악화 요인을 점검하고 경영 전략을 재정비할 필요성에 직면해 있다. 통신 시장 경쟁 심화와 가입자당 평균 매출(ARPU) 정체가 주요 원인으로 꼽힌다. 스마톤은 향후 사업 체질 개선을 위한 고강도 대책을 마련할 것으로 전망된다.", "source": "Light Reading", "date": "2026-09-03 23:37", "url": "https://www.lightreading.com/5g/smartone-chairman-warns-over-revenue-slide", "category": "earnings", "importance": 3, "wl": true, "topic": "스마톤 실적"}, {"title": "Deutsche Telekom names AWS' Jan Hofmeyr as next CTO - Data Center Dynamics", "summary": "AWS 출신의 얀 호프마이어가 도이치텔레콤의 차기 최고기술책임자로 지명되면서 클라우드 및 네트워크 역량 강화를 예고했다.", "source": "Data Center Dynamics", "date": "2026-09-03 23:02", "url": "https://www.datacenterdynamics.com/en/news/deutsche-telekom-names-aws-jan-hofmeyr-as-next-cto/", "category": "exec", "importance": 3, "wl": false, "topic": "도이치텔레콤 cto 영입"}, {"title": "T-Mobile US stock gains as Elliott pressure on Deutsche Telekom reshapes merger debate - A", "summary": "행동주의 펀드 엘리엇의 압박이 모기업인 도이치텔레콤에 가해지면서 티모바일 US를 둘러싼 합병 및 지배구조 논쟁에 변화가 생기고 있다는 보도다. 주요 통신사의 지배구조와 향후 전략 방향에 중대한 영향을 미칠 수 있는 사안이다.", "source": "AD HOC NEWS", "date": "2026-09-03 22:57", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/t-mobile-us-stock-gains-as-elliott-pressure-on-deutsche-telekom-reshapes/70049448", "category": "other", "importance": 3, "wl": false, "topic": "티모바일 모기업 지분 압박"}, {"title": "MasOrange puts 6 GHz through its paces as part of its 6G prep - Telecoms", "summary": "유럽 통신사 마스오렌지가 다가오는 6G 상용화를 대비하여 6GHz 대역에 대한 성능 테스트와 실증을 진행했다. 차세대 이동통신 주파수 확보 및 기술 검증을 위한 주요 시험이다. 유럽 주요 통신사의 선제적인 차세대 네트워크 준비 동향을 보여준다. 통신사 대상 6G 기술 사전 검증 사례이다.", "source": "Telecoms", "date": "2026-09-03 22:54", "url": "https://www.telecoms.com/5g-6g/masorange-puts-6-ghz-through-its-paces-as-part-of-its-6g-prep", "category": "tech", "importance": 3, "wl": false, "topic": "마스오렌지 6ghz 6g 실증 테스트"}, {"title": "Eurobites: VMO2 brings 5G standalone to Northern Ireland", "summary": "영국 버진미디어O2(VMO2)가 북아일랜드 지역에 5G 단독모드(Standalone) 서비스를 도입했다고 밝혔다. 이와 함께 오렌지(Orange)는 돔(Dome) 솔루션을 통해 핵심 인프라 사설 5G 수요를 지원할 계획이며, 노키아는 새로운 API 고객을 확보했다. 유럽 주요 통신사들은 산업용 및 소비자용 5G SA 서비스 상용화와 네트워크 기능 확장 속도를 높이고 있다. 이러한 동향은 유럽 지역의 차세대 통신 인프라 고도화 경쟁을 보여준다.", "source": "Light Reading", "date": "2026-09-03 20:56", "url": "https://www.lightreading.com/5g/eurobites-vmo2-brings-5g-standalone-to-northern-ireland", "category": "tech", "importance": 3, "wl": true, "topic": "보다폰오렌지 노키아"}, {"title": "India Critical Communications Conference Calls for Resilient, Interoperable Emergency Netw", "summary": "인도에서 개최된 중요 통신 컨퍼런스에서 재난 상황에 대응하기 위한 회복력 있고 상호 운용 가능한 비상 통신망 구축의 필요성이 제기됐다. 공공 안전 및 재난구호 통신(PPDR) 인프라의 중요성이 강조되었다. 통신 사업자와 정부 간의 재난망 구축 협력 논의가 이뤄졌다. 통신망의 안정성 및 공공 안전 통신 관련 동향이다.", "source": "The Critical Communications Review", "date": "2026-09-03 20:20", "url": "https://www.criticalcommunicationsreview.com/ccr/news/119612/india-critical-communications-conference-calls-for-resilient-interoperable-emergency-networks", "category": "tech", "importance": 3, "wl": false, "topic": "인도 재난 통신 회복력 컨퍼런스"}, {"title": "Chunghwa Telecom, Askey Launch 5G Platform for Construction Robots - Telecom Review Asia", "summary": "대만 중화텔레콤이 애스키(Askey)와 협력하여 건설 현장 로봇을 위한 5G 전용 플랫폼을 출시했다. 초고속·저지연 5G 네트워크를 활용해 무인 건설 장비와 로봇을 원격 제어할 수 있다. 통신사의 5G B2B 버티컬 시장 진출 사례다. 통신사의 5G 기반 스마트 건설 솔루션 상용화 동향이다.", "source": "Telecom Review Asia", "date": "2026-09-03 19:44", "url": "https://www.telecomreviewasia.com/news/technology-news/30170-chunghwa-telecom-askey-launch-5g-platform-for-construction-robots/", "category": "tech", "importance": 3, "wl": false, "topic": "중화텔레콤 건설 로봇 5g 플랫폼"}, {"title": "Vietnam shuts down its 2G networks nationwide - mediasat.info", "summary": "베트남이 전국적으로 2G 통신망 서비스를 완전히 종료하고 주파수 자원을 4G·5G로 전환하는 통신 인프라 개편 소식입니다.", "source": "mediasat.info", "date": "2026-09-03 19:17", "url": "https://mediasat.info/en/2026/09/03/vietnam-shuts-down-its-2g-networks-nationwide/", "category": "tech", "importance": 3, "wl": false, "topic": "베트남 2g망 종료"}, {"title": "Orange plans new subsea cable linking La Reunion to South Africa - Developing Telecoms", "summary": "프랑스 통신사 오렌지가 레위니옹 섬과 남아프리카공화국을 연결하는 신규 해저 케이블 구축 계획을 추진한다. 대륙 간 해저 통신 인프라 확장 프로젝트다.", "source": "Developing Telecoms", "date": "2026-09-03 18:52", "url": "https://developingtelecoms.com/telecom-business/operator-news/20774-orange-plans-new-subsea-cable-linking-la-reunion-to-south-africa.html", "category": "contract", "importance": 3, "wl": false, "topic": "오렌지 해저케이블 구축"}, {"title": "VodafoneThree declares 5G network slicing war on BT", "summary": "보다폰과 스리(Three)의 합병 법인인 보다폰쓰리가 BT를 겨냥해 새로운 5G 네트워크 슬라이싱 기반의 '슈퍼모바일(SuperMobile)' 요금제와 서비스를 선언했다. 이번에 출시된 상품은 BT의 동등한 서비스에서는 제공하지 않는 차별화된 보증과 품질을 내세우고 있다. 영국 통신 시장에서 양사는 프리미엄 서비스와 기업용 슬라이싱 고객 확보를 위한 경쟁을 본격화하고 있다. 소비자들의 실제 채택 여부가 향후 시장 판도를 가를 핵심 변수로 꼽힌다.", "source": "Light Reading", "date": "2026-09-03 18:23", "url": "https://www.lightreading.com/5g/vodafonethree-declares-5g-network-slicing-war-on-bt", "category": "contract", "importance": 3, "wl": true, "topic": "보다폰쓰리 bt"}, {"title": "울산 시내버스 762대 차세대 와이파이로 전면 교체", "summary": "울산시는 구축 시기에 따라 서로 다른 장비 로 운영돼 온 시내버스 762대의 노후 와이파이 장비 를 철거하고, 5세대 이동통신( 5G ) 백홀 기반의 와이파이 7 장비 를 설치한다. 백홀은 통신사 기지국의 백본망과 버스 내부...", "source": "iusm.co.kr", "date": "2026-09-03 18:20", "url": "https://www.iusm.co.kr/news/articleView.html?idxno=1067423", "category": "exec", "importance": 3, "wl": false, "topic": ""}, {"title": "'독파모' 탈락 네이버클라우드, SKT 제치고 ‘보안 AI’ 낙점 - 디일렉", "summary": "독파모 사업에서 탈락한 네이버클라우드가 SK텔레콤을 제치고 국가 보안 AI 사업자로 낙점되었다는 B2B 인공지능 수주 소식이다.", "source": "디일렉", "date": "2026-09-03 18:18", "url": "https://www.thelec.kr/news/articleView.html?idxno=61789", "category": "contract", "importance": 3, "wl": false, "topic": "네이버클라우드 보안 ai 선정"}, {"title": "Orange acquires Dome platform to expand secure private 5G - Mobile Europe", "summary": "프랑스 오렌지가 보안 프라이빗 5G 포트폴리오를 확장하기 위해 돔(Dome) 플랫폼을 인수했다. 기업용 특화망 서비스 역량 강화를 위한 M&A다.", "source": "Mobile Europe", "date": "2026-09-03 17:41", "url": "https://www.mobileeurope.co.uk/orange-dome-acqusition/", "category": "contract", "importance": 3, "wl": false, "topic": "오렌지 돔 플랫폼 인수"}, {"title": "플리토, 육군에 AI 민원상담 구축…장병·국민 문의 24시간 대응", "summary": "플리토가 이스트소프트, 와이즈넛과 컨소시엄을 구성해 육군본부와 'AI 기반 민원상담체계 개발'을 위한 업무협약을 체결했다. 보안이 중요한 군 폐쇄망에서도 작동하는 인공지능을 통해 장병과 국민의 민원을 24시간 처리하는 상담체계를 구축한다. 국방 분야의 인공지능 전환(AX)을 가속화하는 핵심 행보다. 공공 및 국방 영역에서의 AI 솔루션 도입 사례다.", "s   ["도코모",["docomo"]],["kddi",[]],["소프트뱅크",["softbank"]],["지오",["jio","릴라이언스","reliance"]],
  ["에어텔",["airtel","bharti"]],["보다폰",["vodafone"]],["텔러스",["telus"]],["비디오트론",["videotron"]],
  ["도이치텔레콤",["deutsche telekom"]],["오렌지",["orange"]],["텔레포니카",["telefonica","telefónica"]],
  ["스타링크",["starlink","스페이스x","spacex"]],["ast",["ast spacemobile"]],
  ["아마존",["amazon","kuiper","카이퍼","amazon leo"]],["fcc",[]],["과기정통부",[]],["삼성",["samsung"]]
];
function hasWord(t,w){
  if(/^[a-z0-9&+]+$/.test(w)){ // 짧은 영문 약칭은 단어 경계 검사 (kt가 blacktop 등에 걸리지 않게)
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(^|[^a-z0-9])"+e+"($|[^a-z0-9])").test(t);
  }
  return t.includes(w);
}
/* 통신사 지역 매핑 (인도를 유럽보다 먼저 검사 — Vodafone Idea가 유럽 Vodafone에 걸리지 않게) */
const REGIONS=[
  ["한국",["skt","sk텔레콤","sk telecom","kt","케이티","korea telecom","lg유플러스","lgu+","lg uplus","lg u+"]],
  ["미국",["verizon","버라이즌","at&t","에이티앤티","t-mobile","t모바일","tmobile","echostar","에코스타","viaero","us cellular","us셀룰러","charter","차터"]],
  ["일본",["docomo","도코모","ntt","kddi","softbank","소프트뱅크","rakuten mobile","라쿠텐"]],
  ["인도",["vodafone idea","jio","지오","reliance","릴라이언스","airtel","에어텔","bharti"]],
  ["캐나다",["telus","텔러스","videotron","비디오트론","sasktel"]],
  ["유럽",["vodafone","보다폰","deutsche telekom","도이치텔레콤","orange","오렌지","telefonica","텔레포니카"]]
];
let carrierRegion="전체";
function setRegion(r){carrierRegion=r;render();}
function regionOf(a){
  const t=(((a.topic||"")+" "+(a.title||"")+" "+(a.summary||""))).toLowerCase();
  for(const [r,kws] of REGIONS){ if(kws.some(w=>hasWord(t,w))) return r; }
  return "기타";
}
function prodKey(a){
  const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
