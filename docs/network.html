<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}

  .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
  main{padding:14px 16px 40px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}

  .blk-hd .cnt{font-size:11px;color:var(--sub);font-weight:500}
  .blk-body{padding:4px 14px 10px}
  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.outage{background:#fdeeee;color:#c0392b}
  .cat.contract{background:#e8f8ef;color:#1e8e4e}
  .cat.tech{background:#f0ebfa;color:#6c3fc5}
  .cat.earnings{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#fff6d9;color:#9a7b00}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .noti-btn{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .noti-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .subbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subbar::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
  .rchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

const NEWS_DATA = {"outage": [{"title": "AT&T Wireless Service Restored After Hours-long Nationwide Outage; Company Apologizes To A", "summary": "미국 이동통신사 AT&T의 무선 네트워크 서비스가 전국적인 규모로 수 시간 동안 중단되었다가 복구되었다. 대규모 가입자가 통신 장애로 큰 불편을 겪었으며 회사는 공식 사과했다. 국가 기간통신망의 안정성 문제와 신뢰도 타격을 보여준 대형 장애 사고다.", "source": "Mshale", "date": "2026-09-05 08:38", "url": "https://mshale.com/3dcbe582/7f13b3c0Is6IBlsVc0U", "category": "outage", "importance": 5, "wl": false, "topic": "에이티앤티 장애"}, {"title": "T-Mobile customers complain of widespread outages - Mashable", "summary": "T모바일 고객들을 중심으로 광범위한 통신 장애가 발생했다는 보도다. 무선 통신 서비스 이용에 차질이 빚어져 이용자들이 불편을 겪었다. 구체적인 장애 원인과 복구 상황에 대한 점검이 이루어지고 있다. 통신망 안정성 확보의 중요성을 보여주는 사례다.", "source": "Mashable", "date": "2026-09-06 19:50", "url": "https://mashable.com/article/widespread-outages-t-mobile-att-verizon-sprint/?utm_source=social&utm_medium=facebook&utm_campaign=mash-com-fb-main-link&utm_content=tech&fbclid=IwAR0kTWmIxKKc1z4YXH3X7kXlOdmtVzu_SraTzqK9c6j7xufhMvv7ch70aW4", "category": "outage", "importance": 3, "wl": false, "topic": "t모바일 장애"}, {"title": "AT&T service restored after issues affecting 911 service throughout central Ohio agencies ", "summary": "오하이오 중부 지역에서 발생한 장애로 인해 AT&T 통신 서비스와 911 긴급 전화 연결에 차질이 빚어졌으나 이후 복구되었다. 공공 안전과 직결된 통신망 안정성 문제로 당국의 관리 감독 대상이 된다. 통신 장애 복구를 통한 서비스 정상화가 확인되었다.", "source": "10tv.com", "date": "2026-09-05 19:11", "url": "https://www.10tv.com/video/news/local/att-service-restored-after-issues-affecting-911-service-throughout-central-ohio-agencies/530-42170895-d7c3-468f-89f7-6e1a2ff3abb3", "category": "outage", "importance": 3, "wl": false, "topic": "at&t 장애"}, {"title": "占領下クリミアの学校、通信障害を理由に9月1日から対面授業へ - Межа. Новини України.", "summary": "러시아가 점령한 크림반도의 학교들이 지속적인 통신 장애를 이유로 원격 수업에서 대면 수업으로 전환했다. 지역적인 통신 인프라 불안정이 교육 환경에 미친 영향을 보여준다. 통신 장애가 실질적인 사회적 변화를 야기한 사례다.", "source": "Межа. Новини України.", "date": "2026-09-05 18:25", "url": "https://mezha.net/jp/news/523a8e3c_occupied_crimea_plans/", "category": "outage", "importance": 3, "wl": false, "topic": "크림외교 통신장애"}], "satellite": [{"title": "Forget Starlink? Japan’s $1 Billion BlueBird Play Makes ASTS the National Satellite OS - Y", "summary": "일본에서 10억 달러 규모의 투자가 이루어지며 AST 스페이스모바일이 국가 위성 통신 사업자로 부상하고 있다. 스타링크의 대항마로서 글로벌 시장에서의 입지를 빠르게 넓히는 중이다. 위성 직접통신 분야에서 강력한 상용화 역량을 입증하고 있다.", "source": "Yahoo Finance", "date": "2026-09-06 23:25", "url": "https://finance.yahoo.com/markets/stocks/articles/forget-starlink-japan-1-billion-142530511.html", "category": "contract", "importance": 4, "wl": false, "topic": "에스티에스스페이스모바일 계약"}, {"title": "추락하나했더니 ‘주가 재추진’…시총 2조달러 재입성한 스페이스X", "summary": "스페이스X가 시가총액 2조 달러에 재입성하며 미국 자본시장의 주목을 받고 있다. 스페이스X의 기업 가치 산정 공식이 기존 로켓과 스타링크 중심에서 위성통신과 AI 분야로 확장되고 있다. 오펜하이머는 스페이스X의 AI 컴퓨팅 능력이 크게 향상될 것으로 전망했다. 우주 산업과 AI의 결합이 기업 가치 급등을 견인하는 핵심 동력으로 작용하고 있다.", "source": "mk.co.kr", "date": "2026-09-06 21:43", "url": "https://www.mk.co.kr/article/12145621", "category": "earnings", "importance": 4, "wl": false, "topic": "스페이스x 기업가치"}, {"title": "두 달 전 투자한 스페이스X 주식 10,000달러, 현재 가치 확인해보니", "summary": "스페이스X의 스타링크 가입자가 1,200만 명을 돌파하고 대규모 스타실드 정부 계약을 확보했다. 인공지능 부문 매출 또한 상당한 규모를 기록하며 장기 성장 동력을 입증했다. 우주 위성 통신 사업의 상업적 성공이 가속화되면서 기업 가치가 급등하고 있다. 정부와 민간을 아우르는 수주 성과가 스페이스X의 재무 건전성을 견인하고 있다.", "source": "coinreaders.com", "date": "2026-09-06 07:50", "url": "http://coinreaders.com/256743", "category": "earnings", "importance": 4, "wl": false, "topic": "스페이스x 실적성과"}, {"title": "中·싱가포르 연구진 “ 스타링크 최신 단말기 해킹 성공” [차이나우]", "summary": "중국과 싱가포르의 사이버보안 연구진이 스페이스X의 스타링크 최신 사용자 단말기를 해킹하는 데 성공했다고 밝혔다. 이번 해킹으로 관리자 권한을 확보하여 위성통신망의 보안 취약점이 드러났다. 스타링크의 보안 안정성에 대한 우려가 제기될 수 있는 대목이다. 글로벌 위성 인터넷 서비스의 보안 체계 강화를 위한 대책 마련이 요구된다.", "source": "segye.com", "date": "2026-09-06 07:19", "url": "https://www.segye.com/newsView/20260904502034?OutUrl=naver", "category": "tech", "importance": 4, "wl": false, "topic": "스타링크 보안해킹"}, {"title": "Qualcomm unveils three pillars of 6G: AI-native networks to reshape the telecom value chai", "summary": "퀄컴이 통신 밸류체인을 재편할 6G의 3대 핵심 축으로 AI 네이티브 네트워크를 공식 공개했다. 차세대 통신 표준에서 인공지능이 수행할 역할과 기술적 방향성을 제시한 것이다. 글로벌 통신 장비 및 칩셋 시장에 큰 파장을 미칠 전망이다.", "source": "finance.biggo.com", "date": "2026-09-06 04:35", "url": "https://finance.biggo.com/news/d8f34d15-5d1d-471c-9fc7-4d0a210c0a90", "category": "tech", "importance": 4, "wl": false, "topic": "퀄컴 6g"}, {"title": "SpaceX Just Launched AST SpaceMobile's Biggest Bet To Advance Cell Service From Space - St", "summary": "스페이스엑스가 우주 기반 셀룰러 서비스 확장을 위해 AST 스페이스모바일의 대형 위성을 성공적으로 발사했다. 양사의 협력은 저궤도 위성을 활용한 직접통신(Direct-to-Cell) 서비스 상용화를 가속화하고 있다. 글로벌 우주 통신 시장의 경쟁 구도에 큰 영향을 미칠 전망이다.", "source": "Stocktwits", "date": "2026-09-06 03:52", "url": "https://stocktwits.com/news-articles/markets/equity/spacex-launches-ast-spacemobile-biggest-satellites-cell-service-from-space/cZK0HS1R7IN", "category": "contract", "importance": 4, "wl": false, "topic": "스페이스엑스 위성통신"}, {"title": "Delta Picks Amazon Over Starlink for In-Flight Wi-Fi - MiGFlug", "summary": "델타항공이 기내 와이파이 파트너로 스타링크 대신 아마존을 선택했다. 위성 인터넷 시장에서 스타링크와 아마존의 경쟁이 치열해지는 가운데 나온 주요 계약이다. 항공기 기내 통신 서비스 시장의 판도 변화를 예고한다.", "source": "MiGFlug", "date": "2026-09-05 20:56", "url": "https://migflug.com/afterburner/delta-picks-amazon-over-starlink-for-in-flight-wi-fi/", "category": "contract", "importance": 4, "wl": false, "topic": "아마존 위성통신"}, {"title": "유나이티드항공, 서울~뉴욕 '직항' 첫 운항…뉴어크 허브로 미 동부 연...", "summary": "유나이티드항공이 450대 이상의 항공기에 스타링크 위성통신망을 장착했으며 올해 말까지 1000대로 확대할 계획이다. 2027년 말까지는 전 기단으로 기내 초고속 와이파이 적용 범위를 확대할 예정이다. 스페이스X의 스타링크는 항공업계의 기내 위성인터넷 도입 경쟁을 주도하고 있다. 프리미엄 승객을 겨냥한 항공사의 연결성 강화 전략이 가속화되고 있다.", "source": "newsmaker.or.kr", "date": "2026-09-07 07:48", "url": "http://www.newsmaker.or.kr/news/articleView.html?idxno=181976", "category": "contract", "importance": 3, "wl": false, "topic": "스타링크 위성통신"}, {"title": "\"지구-달 사이에 30기 큐브샛 띄운다\"… 中, 5개국 규합 '3D 위성 관측망...", "summary": "중국이 5개국을 규합해 지구-달 사이에 30기의 큐브샛을 띄우는 초소형 위성 네트워크 프로젝트를 출범시켰다. 지구 저궤도부터 수백만 ㎞ 떨어진 심우주까지 아우르는 새로운 우주 관측망 구축에 나섰다. 인류 우주 활동의 미개척지인 지구-달 공간을 선점하기 위한 전략이다. 주요국들의 우주 탐사 및 위성 네트워크 경쟁이 더욱 치열해지고 있다.", "source": "g-enews.com", "date": "2026-09-07 06:36", "url": "https://www.g-enews.com/view.php?ud=2026090700302241120c8c1c064d_1", "category": "tech", "importance": 3, "wl": false, "topic": "중국 위성관측망"}, {"title": "[아참마당] 저궤도 위성이 바꾸는 통신의 미래", "summary": "독자적인 6G 위성통신 기술과 산업 생태계 확보의 중요성이 강조되었다. 이동통신 주파수를 넘어 비면허 주파수까지 위성 직접연결 영역이 확대되는 글로벌 트렌드를 주목해야 한다는 지적이다. 차세대 위성 통신 경쟁력 강화를 위한 제언이다.", "source": "cctoday.co.kr", "date": "2026-09-07 06:02", "url": "https://www.cctoday.co.kr/news/articleView.html?idxno=2236218", "category": "other", "importance": 3, "wl": false, "topic": "저궤도위성 6g통신"}, {"title": "북한 '은밀한 영상' 찍던 그 회사…\"이젠 공간정보 플랫폼으로 진화\"", "summary": "저궤도 위성을 활용한 공간정보 플랫폼 기업들이 위성 영상보다 시계열 자료의 중요성을 강조하고 있다. 10기의 위성을 고도 500㎞ 저궤도에 띄워 매일 대규모 지상을 고해상도로 촬영한다. 정밀한 위성 관측 데이터는 다양한 산업 분야에서 활용 가치가 높다. 민간 위성 영상 시장의 기술력과 데이터 활용도가 빠르게 진화하고 있다.", "source": "mt.co.kr", "date": "2026-09-07 05:00", "url": "https://www.mt.co.kr/future/2026/09/07/2026090217280253293", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 플랫폼"}, {"title": "[서학!스타] 로켓랩(RKLB), 94번째 일렉트론 발사 성공…2026년 들어 15번...", "summary": "로켓랩이 94번째 일렉트론 발사에 성공하며 올해 들어 15번째 발사 기록을 세웠다. 이번 임무를 통해 일본 위성 기업 신스펙티브의 최신 지구관측 위성이 저궤도에 투입되었다. 뉴질랜드 발사장에서 수행된 이번 발사는 민간 소형 위성 발사 시장에서 로켓랩의 입지를 공고히 했다. 지속적인 발사 성공으로 글로벌 위성 기업들의 신뢰를 얻고 있다.", "source": "cbci.co.kr", "date": "2026-09-07 01:00", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=604366", "category": "contract", "importance": 3, "wl": false, "topic": "로켓랩 위성발사"}, {"title": "ASTS Stock Hits One-Month Low: Insider Buys The Dip After BlueBird Deployments, Japan Win ", "summary": "AST 스페이스모바일의 주가가 한 달 내 최저치를 기록한 가운데 내부자가 저가 매수에 나섰다. 블루버드 위성 발사 성공과 일본 시장 수주 소식이 전해진 직후의 움직임이다. 위성 통신 사업의 성장 기대감 속에서 투자 심리가 흔들리고 있다.", "source": "Stocktwits", "date": "2026-09-06 18:13", "url": "https://stocktwits.com/news-articles/markets/equity/asts-insider-buys-dip-bluebird-deployments-japan-win/cZsA9MwRJuG", "category": "other", "importance": 3, "wl": false, "topic": "에스티에스스페이스모바일 주가"}, {"title": "ASTS Stock Eyes Weekly Comeback: AT&T Says AST SpaceMobile Satellite Offering Will 'Come T", "summary": "AT&T가 AST 스페이스모바일의 위성 통신 서비스 제공이 임박했다고 밝혔다. 양사는 위성을 통한 지상 단말기 직접 연결 서비스 상용화를 추진 중이다. 위성통신과 전통 통신망의 결합이 가속화되는 추세다. 위성통신 기반 커버리지 확대에 대한 기대를 모으고 있다.", "source": "Stocktwits", "date": "2026-09-06 17:21", "url": "https://stocktwits.com/news-articles/markets/equity/asts-at-and-t-satellite-offering-next-year/cZZn4ASR7DU", "category": "contract", "importance": 3, "wl": false, "topic": "at&t 위성통신"}, {"title": "Spectrum Rocket Reaches Orbit From Andoya, Norway - srpske.rs", "summary": "노르웨이 안도야에서 스펙트럼 로켓이 궤도 진입에 성공했다. 유럽 영토에서 발사된 민간 로켓의 역사적인 성과다. 향후 소형 위성 발사 서비스 시장에 긍정적인 영향을 미칠 것으로 보인다.", "source": "srpske.rs", "date": "2026-09-06 15:10", "url": "https://srpske.rs/en/news/nauka/2026/09/06/isar-aerospace-spectrum-rocket-reaches-orbit-andoya", "category": "other", "importance": 3, "wl": false, "topic": "유럽 로켓발사"}, {"title": "독일 이자르, 유럽 본토 첫 상업 위성 발사 성공", "summary": "독일의 이자르가 유럽 본토에서 첫 상업용 소형 위성 발사에 성공했다. 소형 위성과 위성군 발사가 급증하면서 저궤도 공간의 물체가 늘어나 우주교통 관리의 중요성이 대두되고 있다. 이번 발사는 유럽이 자체적인 발사체 접근성을 확보했다는 점에서 큰 의미를 가진다. 민간 우주 기업들의 상업화 경쟁이 본궤도에 올랐음을 보여준다.", "source": "edaily.co.kr", "date": "2026-09-06 14:32", "url": "https://www.edaily.co.kr/News/Read?newsId=01633446645577496&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "tech", "importance": 3, "wl": false, "topic": "유럽 상업위성발사"}, {"title": "Keysight Technologies: Powering India’s 6G, AI and semiconductor ambitions - tele.net.in", "summary": "키사이트테크놀로지스가 인도의 6G, AI, 반도체 산업 성장을 지원하기 위한 기술력을 과시했다. 차세대 통신 표준화와 연구개발 과정에서 계측 장비의 역할이 강조되고 있다. 글로벌 통신 생태계 협력의 중요성을 보여준다.", "source": "tele.net.in", "date": "2026-09-06 13:45", "url": "https://tele.net.in/companies/keysight-technologies-powering-indias-6g-ai-and-semiconductor-ambitions-12490603", "category": "tech", "importance": 3, "wl": false, "topic": "키사이트 6g"}, {"title": "獨스타트업, 유럽서 첫 상업용 로켓 발사 성공…우주 자립 시동", "summary": "독일 스타트업 이자르가 유럽에서 첫 상업용 로켓 발사에 성공하며 우주 자립을 위한 시동을 걸었다. 양산 체제를 갖춘 로켓 스펙트럼은 민간 및 군사 위성을 저궤도에 실어 나르게 된다. 연간 수십 기의 로켓을 생산할 수 있는 제조 역량을 갖추고 있다. 유럽의 민간 우주 발사체 시장 경쟁력이 한층 강화될 전망이다.", "source": "news1.kr", "date": "2026-09-06 13:35", "url": "https://www.news1.kr/world/europe/6281311", "category": "tech", "importance": 3, "wl": false, "topic": "유럽 상업로켓발사"}, {"title": "\"저궤도 위성만으로 지상망 대체 어렵다” - 지디넷코리아", "summary": "저궤도 위성 통신만으로는 지상 통신망을 완전히 대체하기 어렵다는 전문가 진단이 나왔다. 위성망과 지상 5G·6G 네트워크의 상호 보완적 역할이 필수적이라는 분석이다. 차세대 통신 인프라 구축 전략 수립에 시사점을 준다.", "source": "지디넷코리아", "date": "2026-09-06 08:41", "url": "https://zdnet.co.kr/view/?no=20260906084139", "category": "other", "importance": 3, "wl": false, "topic": "저궤도위성 지상망한계"}, {"title": "Reinventing Business Internet from the Ground Up and the Sky Down - NonStop Local KHQ", "summary": "지상과 상공을 아우르는 기업용 인터넷 서비스의 혁신 방안을 다룬 보도다. 전통적인 유선 인프라와 위성 통신을 결합한 새로운 네트워크 구축 방식을 소개한다. 기업 통신 시장의 기술적 변화를 시사한다.", "source": "NonStop Local KHQ", "date": "2026-09-06 07:39", "url": "https://www.khq.com/online_features/tech_talk_and_innovation/reinventing-business-internet-from-the-ground-up-and-the-sky-down/article_84d92eb1-a95a-564d-ae27-301d039b71c6.html", "category": "tech", "importance": 3, "wl": false, "topic": "위성통신 기업인프라"}, {"title": "T, VZ, TMUS Stocks Are Sliding Today — Is There A SpaceX Connection? - Stocktwits", "summary": "미국 주요 통신사들의 주가가 하락세를 보인 가운데 스페이스엑스와의 연계 가능성 및 영향이 주목받고 있다. 위성 직접통신 서비스의 확산이 기존 지상 통신 사업자들의 비즈니스 모델에 위협이자 기회로 작용하고 있다. 통신 시장의 구조적 변화를 반영한다.", "source": "Stocktwits", "date": "2026-09-06 00:12", "url": "https://stocktwits.com/news-articles/markets/equity/t-vz-tmus-stocks-are-sliding-today-is-there-a-spacex-connection/cZNTEzYRJTn", "category": "other", "importance": 3, "wl": false, "topic": "스페이스엑스 통신사"}, {"title": "돌연 파리 우주정상회의 안 간다는 스페이스X‥이유는?", "summary": "스페이스X가 파리 우주정상회의에 불참하기로 결정한 가운데 유럽의 독자적인 위성 구축 움직임이 주목받고 있다. 마크롱 대통령은 스타링크의 대안인 유럽 합작 위성 기업에 대규모 투자를 단행했다. 유럽은 위성 통신을 비유럽 지역에 의존하는 것에 대한 우려를 표명해왔다. 스타링크의 글로벌 확장 속에서 유럽의 독자 노선 구축이 정책적 화두로 떠오르고 있다.", "source": "imnews.imbc.com", "date": "2026-09-05 20:21", "url": "https://imnews.imbc.com/replay/2026/nwdesk/article/6849839_37004.html", "category": "policy", "importance": 3, "wl": false, "topic": "스페이스x 유럽정책"}, {"title": "머스크, 스타링크 로 우크라 훈장...EU 속타는 이유는 [김기혁의 테슬라...", "summary": "러시아-우크라이나 전쟁 발발 후 러시아군의 공세로 지상 통신망이 파괴된 위기 속에서 스페이스X의 스타링크가 핵심 통신 역할을 수행했다. 일론 머스크는 스타링크를 통한 지원 공로로 우크라이나 훈장을 받았다. 지상 기지국과 광케이블이 마비된 상황에서 저궤도 위성 인터넷이 전시 통신 생명줄 역할을 했다는 평가다. 유럽은 이에 자극받아 독자적 위성 인프라 구축의 필요성을 절감하고 있다.", "source": "sedaily.com", "date": "2026-09-05 20:01", "url": "https://www.sedaily.com/article/20087327?ref=naver", "category": "other", "importance": 3, "wl": false, "topic": "스타링크 우크라이나"}, {"title": "LIG \"양자레이더, 새처럼 작게 탐지되는 스텔스기도 잡는다\"", "summary": "LIG넥스원이 양자레이더와 저궤도 위성 체계 등 첨단 국방 기술 개발 현황을 공개했다. 원자기반 항법용 양자 센서와 은닉표적 탐지 기술 등이 포함되었다. 저궤도 위성을 활용한 감시 체계 구축은 안보 역량 강화를 위한 핵심 과제로 추진된다. 방산 기업들의 우주 및 양자 기술 분야 진출이 활발해지고 있다.", "source": "zdnet.co.kr", "date": "2026-09-05 16:29", "url": "https://zdnet.co.kr/view/?no=20260905162848", "category": "tech", "importance": 3, "wl": false, "topic": "저궤도 위성 체계"}, {"title": "Jeff Bezos' Blue Origin Hires 47 Amazon Satellite Engineers To Build Rival TeraWave Networ", "summary": "제프 베이조스의 블루오리진이 아마존의 위성 엔지니어 다수를 영입해 경쟁 네트워크 구축에 나섰다. 우주 통신 분야의 인재 영입 경쟁이 한층 치열해지고 있음을 보여준다. 차세대 위성 통신망 개발 구도의 변화를 예고한다.", "source": "ibtimes.com.au", "date": "2026-09-05 16:00", "url": "https://www.ibtimes.com.au/blue-origin-engineers-amazon-leo-terawave-1875053", "category": "other", "importance": 3, "wl": false, "topic": "블루오리진 위성인력"}, {"title": "테슬라-스페이스X 합병설 재부상...중국 생산망이 최대 걸림돌", "summary": "테슬라와 스페이스X의 합병설이 재부상한 가운데 중국 생산망이 최대 걸림돌로 지적된다. 테슬라는 태양광, 배터리 등을 공급하고 스페이스X는 스타링크와 AI 모델을 제공하는 시너지 기회가 거론된다. 그러나 테슬라의 상하이 생산 거점이 글로벌 공급망에서 차지하는 비중 때문에 합병에 제약이 따른다. 두 혁신 기업 간의 결합 가능성과 현실적 과제들이 업계의 관심을 모으고 있다.", "source": "digitaltoday.co.kr", "date": "2026-09-05 15:02", "url": "https://www.digitaltoday.co.kr/ne  국내에서 5G 추가 주파수 경매가 진행될 것으로 전망되면서 통신장비주들의 수혜 여부와 투자 전략을 분석한다. 정부의 주파수 정책과 통신사 투자가 맞물려 장비 업계에 미치는 파급효과가 크다.", "source": "v.daum.net", "date": "2026-09-05 08:21", "url": "https://v.daum.net/v/20260905082128618?f=p", "category": "contract", "importance": 4, "wl": false, "topic": "과기정통부 주파수"}, {"title": "외산 AI도 예약·결제하는데…'모두의 AI' 차별화 승부처는", "summary": "정부가 추진하는 '모두의 AI' 서비스가 공공 부문을 중심으로 카카오톡, 통신망, 생활서비스를 연결하여 차별화된 공공서비스를 제공할 계획이다. 과기정통부 당국자의 설명과 함께 국내 이용자 접점을 넓히는 전략을 담고 있다. 정부 주도의 AI 생태계 조성 방안을 보여준다.", "source": "news.einfomax.co.kr", "date": "2026-09-07 08:02", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4433643", "category": "other", "importance": 3, "wl": false, "topic": "과기정통부 ai서비스"}, {"title": "AI DC 특별법 '디테일' 다듬는다…지원 대상·전력 특례 어디까지", "summary": "과기정통부가 정보통신산업진흥원과 함께 AI 데이터센터(AIDC) 특별법 시행령 제정을 위한 세부 조율에 나섰다. 지원 대상과 전력 특례 범위 등 구체적인 세부사항을 다듬고 있으며 향후 공청회 등 후속 절차를 진행할 예정이다. 데이터센터 인프라 확충을 위한 제도적 기반 마련 과정이다.", "source": "news1.kr", "date": "2026-09-07 07:00", "url": "https://www.news1.kr/it-science/cc-newmedia/6281401", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai데이터센터"}, {"title": "AI 시대 '전력 확보' 경쟁…정부, 에너지 R&D 48% 확대", "summary": "국회 과기정통위원회 국정감사 자료에 따르면 과기정통부의 에너지 기술 관련 R&D 예산이 대폭 확대되었다. AI 시대의 전력 확보 경쟁에 대응하기 위한 정부 차원의 에너지 기술 투자가 늘어나고 있음을 보여준다. 데이터센터 전력 수급 문제와 직결된 정책적 지원이다.", "source": "yna.co.kr", "date": "2026-09-07 07:00", "url": "https://www.yna.co.kr/view/AKR20260904114900017?input=1195m", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 에너지예산"}, {"title": "[2027 AI예산 해부⑤·完] 컨트롤타워 ‘삼각편대’ 2기 돌입…범정부 A...", "summary": "과기정통부의 2027년 AI 예산이 대폭 증액되며 범정부 컨트롤타워가 2기 체제로 돌입했다. GPU 및 데이터 등 공통 인프라 확충에 막대한 예산이 투입될 예정이다. 국가 차원의 인공지능 경쟁력 강화를 위한 예산 집행 계획이다.", "source": "ddaily.co.kr", "date": "2026-09-07 06:00", "url": "https://www.ddaily.co.kr/page/view/2026090417453143441", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai예산"}, {"title": "[단독] 4000억 AI혁신펀드 13%만 가동… 3곳은 투자 0원", "summary": "국정감사 자료를 통해 과기정통부가 조성한 AI 혁신펀드의 집행률이 저조하고 일부 펀드는 투자가 전무하다는 지적이 제기됐다. 민간 투자를 활성화하기 위해 조성된 자펀드의 운영 실태를 점검하고 개선책 마련이 요구되는 상황이다. 정부의 AI 투자 정책 집행 현주소를 보여준다.", "source": "seoul.co.kr", "date": "2026-09-07 05:05", "url": "https://www.seoul.co.kr/news/economy/2026/09/07/20260907032005?wlog_tag3=naver", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai펀드"}, {"title": "[단독]갈수록 비싸지는 차세대 칩 '베라루빈'…정부, 대당 275억 예산 책...", "summary": "과기정통부가 차세대 AI 칩 서버 확충을 위해 막대한 정부 예산을 배정했다. 대규모 GPU 서버 랙 구축을 통해 국내 첨단 인프라 경쟁력을 높인다는 계획이다. 인공지능 연구개발 및 연산 자원 확보를 위한 국가적 투자의 일환이다.", "source": "mt.co.kr", "date": "2026-09-07 05:00", "url": "https://www.mt.co.kr/tech/2026/09/07/2026090612584118295", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 gpu예산"}, {"title": "[단독] 과기정통부 , 미국 이어 유럽에 'AI 공동연구랩' 세운다", "summary": "과기정통부와 정보통신기획평가원(IITP)이 미국에 이어 유럽에 '글로벌 AI 공동연구랩' 구축을 추진한다. 해외 현지 연구기관과의 협력을 통해 인공지능 원천기술 확보와 글로벌 네트워크를 확장하려는 전략이다. 정부의 국제 R&D 협력 확대 정책을 보여준다.", "source": "mt.co.kr", "date": "2026-09-07 04:11", "url": "https://www.mt.co.kr/tech/2026/09/07/2026090614085160950", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 ai공동연구"}, {"title": "Communications Minister Jyotiraditya Scindia releases revised TDIP guidelines to boost tel", "summary": "인도 통신장관이 통신 부문 성장을 촉진하기 위해 수정된 TDIP 가이드라인을 발표했다. 통신 인프라 투자 확대와 규제 완화를 통해 시장 활성화를 도모하고 있다. 현지 통신 사업자들의 전략에 영향을 미칠 정책 변화다.", "source": "News On AIR", "date": "2026-09-06 22:10", "url": "https://newsonair.gov.in/communications-minister-jyotiraditya-scindia-releases-revised-tdip-guidelines-to-boost-telecom-sector/", "category": "policy", "importance": 3, "wl": false, "topic": "인도 통신정책"}, {"title": "경상국립대, 우주항공·창업 혁신축 키운다…지역 성장 생태계 '가속'", "summary": "경상국립대가 과기정통부 과학기술혁신본부장과 만나 우주항공 분야 인재 양성과 연구역량 강화 방안을 논의했다. 지역 성장 생태계를 가속화하고 국가 우주항공 경쟁력을 높이기 위한 정부와 대학 간의 협력 행보다. 우주 통신 및 과학 기술 인프라 육성과 연계되어 있다.", "source": "industrynews.co.kr", "date": "2026-09-06 21:52", "url": "https://www.industrynews.co.kr/news/articleView.html?idxno=85575", "category": "policy", "importance": 3, "wl": false, "topic": "과기정통부 우주항공"}, {"title": "FAA 5G Radio Altimeter Rule Ends the Fight - MiGFlug", "summary": "미국 연방항공청(FAA)의 5G 무선 고도계 관련 규제가 오랜 갈등 끝에 마무리 단계에 접어들었다. 5G 통신 주파수와 항공기 안전 기기의 간섭 문제를 해결하기 위한 기술적 기준이 정착되고 있다. 통신사와 항공업계 간의 오랜 현안이 해소되는 국면이다.", "source": "MiGFlug", "date": "2026-09-06 01:06", "url": "https://migflug.com/afterburner/fr/faa-5g-radio-altimeter-final-rule-2026/", "category": "policy", "importance": 3, "wl": false, "topic": "미국 faa 5g규제"}, {"title": "Telcos oppose TRAI’s 5G network slicing rules, cite regulatory overreach - Communications ", "summary": "인도 통신사들이 트라이(TRAI)의 5G 네트워크 슬라이싱 규제안에 대해 규제 초과라며 반발하고 있다. 통신사들은 새로운 수익 창출 모델인 네트워크 슬라이싱의 자율성을 주장하고 있다. 정부 규제와 통신 사업자 간 정책 갈등을 보여준다.", "source": "Communications Today", "date": "2026-09-05 14:25", "url": "https://www.communicationstoday.co.in/telcos-oppose-trais-5g-network-slicing-rules-cite-regulatory-overreach/", "category": "policy", "importance": 3, "wl": false, "topic": "인도규제당국 5g슬라이싱"}, {"title": "Telco operators reject quality of service norms for 5G slicing", "summary": "인도 통신규제청(Trai)이 제안한 5G 네트워크 슬라이싱 서비스 품질(QoS) 측정 규범에 대해 통신사들이 반대 입장을 표명했다. 트라이는 슬라이싱 활성화 지역의 통신 자원 사용량을 모니터링하고 무선 자원 이용률을 80% 이하로 제한해 여유 공간을 확보할 것을 제안했으나 통신사들의 반발에 부딪혔다.", "source": "ET Telecom", "date": "2026-09-05 11:23", "url": "https://telecom.economictimes.indiatimes.com/news/industry/telco-operators-reject-quality-of-service-norms-for-5g-slicing/133784680", "category": "policy", "importance": 3, "wl": true, "topic": "트라이 서비스"}, {"title": "과기부, 모두의 AI 사업 착수 간담회 가져 - 코리아리포트", "summary": "과학기술정보통신부가 모두의 AI 사업 착수를 위한 간담회를 개최했다. 정부의 AI 정책 추진 방향을 공유하고 산학연 협력을 논의하는 자리다.", "source": "코리아리포트", "date": "2026-09-07 07:24", "url": "https://www.koreareport.co.kr/news/articleView.html?idxno=52655", "category": "policy", "importance": 2, "wl": false, "topic": "과기정통부 ai간담회"}, {"title": "개인정보·규제·해킹 전문가 모은 티빙…정보보호 자문위 꾸린다", "summary": "티빙이 정보보호 자문위원회를 구성한 가운데, 역대 과기정통부 차관 등 ICT 및   const t=(((a.topic||"")+" "+(a.title||""))).toLowerCase();
  for(const [canon,ali] of COMPANIES){
    if(hasWord(t,canon)||ali.some(x=>hasWord(t,x))) return canon;
  }
  const tp=(a.topic||"").trim();
  if(tp) return tp.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    // 전국 단위 대규모 통신망 장애(중요도 5)만 최상단 경보 블록으로 노출
    const bigOut=secItems("outage").filter(a=>a.importance>=5)
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(bigOut.length) html+=block("🚨 대규모 통신망 장애",bigOut.length+"건",bigOut.map(a=>artCard(a,false)).join(""),true);
    let allArts=[]; tab.secs.forEach(s=>{if(s!=="outage")allArts=allArts.concat(secItems(s));});
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 회사 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 회사 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    let regionFilter=null;
    if(tab.id==="telco"){
      const regions=["전체"].concat(REGIONS.map(r=>r[0])).concat(["기타"]);
      html+=`<div class="subbar">`+regions.map(r=>`<div class="rchip${r===carrierRegion?" on":""}" onclick="setRegion('${r}')">${r}</div>`).join("")+`</div>`;
      regionFilter=a=>carrierRegion==="전체"||regionOf(a)===carrierRegion;
    }
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      let items=secItems(sid); if(regionFilter) items=items.filter(regionFilter);
      let imp=items.slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
      imp=capPerProduct(imp,2).slice(0,n);   // 같은 키워드(회사) 최대 2건
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+(regionFilter&&carrierRegion!=="전체"?" · "+carrierRegion:"")+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>{let it=secItems(s); if(regionFilter) it=it.filter(regionFilter); merged=merged.concat(it);});
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}

/* ── 5점(긴급) 기사 브라우저 알림 ── */
const NOTI_KEY="nw_noti_on", SEEN_KEY="nw_noti_seen";
function notiState(){try{return localStorage.getItem(NOTI_KEY)==="1";}catch(e){return false;}}
function updateNotiBtn(){
  const b=document.getElementById("notiBtn");if(!b)return;
  const on=notiState()&&("Notification" in window)&&Notification.permission==="granted";
  b.textContent=on?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("on",on);
}
function toggleNoti(){
  if(notiState()){localStorage.setItem(NOTI_KEY,"0");updateNotiBtn();return;}
  if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){localStorage.setItem(NOTI_KEY,"1");updateNotiBtn();notifyCritical();}
    else{alert("브라우저 알림 권한이 거부되어 있습니다. 주소창 옆 사이트 설정에서 알림을 허용해 주세요.");}
  });
}
function notifyCritical(){
  if(!notiState()||!("Notification" in window)||Notification.permission!=="granted")return;
  if(typeof NEWS_DATA==="undefined")return;
  let crit=[];Object.keys(NEWS_DATA).forEach(s=>(NEWS_DATA[s]||[]).forEach(a=>{if((a.importance||0)>=5)crit.push(a);}));
  crit.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  let seen=[];try{seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");}catch(e){}
  const seenSet=new Set(seen);let fired=0;
  for(const a of crit){
    const k=String(a.url||a.title).slice(0,180);
    if(seenSet.has(k))continue;
    seenSet.add(k);
    if(fired<5){ // 한 번에 최대 5건까지만 알림
      const n=new Notification("🚨 긴급(5점) 기사",{body:a.title,tag:k});
      n.onclick=()=>{window.open(a.url,"_blank");n.close();};
      fired++;
    }
  }
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...seenSet].slice(-200)));}catch(e){}
}
updateNotiBtn();
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
notifyCritical();
</script>
