 인상…메모리발 스마트폰값 상승 본격화 - 전자신문", "summary": "화웨이, 샤오미, 아너 등 중국 스마트폰 제조사들이 신제품뿐만 아니라 기존에 출시된 구형 모델까지 가격을 일제히 인상했다. 메모리 대란으로 인한 원가 폭등이 모바일 세트 시장 전반에 본격적인 타격을 입히고 있다. 저가 가성비 스마트폰의 시대가 저물고 전 세계적인 '폰값 인상' 도미노가 현실화됐다. 삼성전자 MX사업부의 출고가 전략 및 프로모션 기획에 즉각적인 참고가 필요한 긴급 사안이다.", "source": "전자신문", "date": "2026-09-02 12:00", "url": "https://www.etnews.com/20260902000139", "category": "price", "importance": 5, "wl": false, "topic": "화웨이 샤오미 아너 기존폰 가격 인상 메모리발 스마트폰값 상승"}, {"title": "[중국 특징주] 화웨이·아너 등 中 스마트폰, 메모리價 급등에 가격 최대 20% 인상 - 뉴스핌", "summary": "메모리 반도체 가격의 가파른 상승으로 인해 화웨이, 아너 등 중국 스마트폰 브랜드들의 출고가가 최대 20%까지 인상되었다. 원가 상승분을 더 이상 감내하지 못한 제조사들이 일제히 가격표를 고쳐 달고 있다. 중국 시장 내 스마트폰 수요 위축 우려와 함께 글로벌 단가 상승 압력이 거세지고 있다. 삼성전자의 중국 및 글로벌 시장 가격 정책에 강력한 시그널을 준다.", "source": "뉴스핌", "date": "2026-09-02 09:40", "url": "https://www.newspim.com/news/view/20260902000322", "category": "price", "importance": 5, "wl": false, "topic": "중국 스마트폰 메모리 가격 급등 20% 인상"}, {"title": "中 \"더는 못 버틴다\" 도미노 가격 인상에…조용히 웃는 삼성 [분석+] - 네이트", "summary": "중국 스마트폰 업체들이 메모리값 폭등을 견디지 못하고 도미노 가격 인상을 단행한 반면, 부품 내재화 역량을 갖춘 삼성전자는 상대적으로 여유를 가지며 조용히 미소 짓고 있다는 분석이다. 칩플레이션 국면에서 자체 반도체 공급망을 보유한 삼성의 원가 경쟁력이 강력한 무기로 작용하고 있다. 경쟁사들이 원가 부담으로 허덕이는 사이 시장 점유율을 대거 흡수할 절호의 찬스이다. 경영진 보고 및 즉각적인 영업 전략 반영이 필요한 핵심 사안이다.", "source": "네이트", "date": "2026-09-02 09:00", "url": "https://news.nate.com/view/20260902n06055", "category": "price", "importance": 5, "wl": false, "topic": "중국폰 도미노 가격 인상 속 웃는 삼성 분석"}, {"title": "싼 맛에 샀는데 가격표 보고 너무 놀랐다…한 달 동안 두 번 가격 오른 중국폰 - 서울경제", "summary": "싼 맛에 구매하려던 소비자들을 놀라게 하며 한 달 사이에 가격이 두 번이나 폭등한 중국 스마트폰의 실태가 보도됐다. 메모리 수급난 여파로 원가 연동형 가격 인상이 빈번하게 발생하고 있다. 가성비 스마트폰의 매력이 급격히 상실되면서 중저가 시장의 소비자 반응이 싸늘해지고 있다. 삼성전자의 보급형 라인업 점유율 방어에 반사이익이 기대된다.", "source": "서울경제", "date": "2026-09-02 08:04", "url": "https://www.sedaily.com/article/20086075", "category": "price", "importance": 5, "wl": false, "topic": "한 달 새 두 번 가격 오른 중국폰 가성비 상실"}, {"title": "가성비 중국폰 옛말…화웨이·샤오미 메모리난에 가격 일제히 올려 - 서울경제", "summary": "과거 '가성비'를 무기로 삼던 중국 스마트폰의 공식이 메모리 대란으로 인해 완전히 깨지고 있다. 화웨이와 샤오미가 메모리 가격 폭등을 이유로 스마트폰 가격을 일제히 올리며 수익성 방어에 총력을 기울이고 있다. 저가형 라인업의 마진 압박이 극에 달한 상황이다. 삼성전자의 보급형 및 중저가 모델(A시리즈 등)의 시장 점유율 확대에 유리한 구도가 조성되었다.", "source": "서울경제", "date": "2026-09-02 06:00", "url": "https://www.sedaily.com/article/20086004", "category": "price", "importance": 5, "wl": false, "topic": "가성비 중국폰 종말 화웨이 샤오미 메모리난 가격 인상"}, {"title": "메모리값 폭등에 결국…화웨이·샤오미 스마트폰 가격 줄줄이 올렸다 - 핀포인트뉴스", "summary": "치솟는 메모리 가격을 버티지 못한 화웨이와 샤오미 등 중국 스마트폰 업체들이 줄줄이 가격 인상 대열에 합류했다. 원가 압박이 한계에 달해 출고가 인상이 불가피해진 양상이다. 글로벌 모바일 시장의 가격 상승 트렌드가 거스를 수 없는 대세로 자리 잡고 있다. 삼성전자의 수익성 및 가격 책정 전략에 지대한 영향을 미칠 중대 뉴스이다.", "source": "핀포인트뉴스", "date": "2026-09-01 20:00", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=482778", "category": "price", "importance": 5, "wl": false, "topic": "메모리값 폭등 화웨이 샤오미 스마트폰 가격 인상"}, {"title": "中 폰도 못 버틴 메모리값…화웨이·샤오미 줄줄이 인상 - 데일리안", "summary": "메모리값 고공행진의 파고를 피하지 못한 화웨이와 샤오미 등 중국 스마트폰 제조사들이 휴대전화 가격을 일제히 인상했다. 부품 원가 상승이 세트 가격에 곧바로 전가되는 비용 압박이 현실화됐다. 글로벌 스마트폰 시장 전반의 단가 상승 기조가 뚜렷해지고 있다. 삼성전자의 가격 전략 수립에 지표가 되는 핵심 시장 정보이다.", "source": "데일리안", "date": "2026-09-01 18:54", "url": "https://www.dailian.co.kr/news/view/1685214/%E4%B8%AD-%ED%8F%B0%EB%8F%84-%EB%AA%BB-%EB%B2%84%ED%8B%B4-%EB%A9%94%EB%AA%A8%EB%A6%AC%EA%B0%92%ED%99%94%EC%9B%A8%EC%9D%B4%EC%83%A4%EC%98%A4%EB%AF%B8-2026", "category": "price", "importance": 5, "wl": false, "topic": "중국폰 메모리값 충격 화웨이 샤오미 줄줄이 인상"}, {"title": "\"칩플레이션 못 버텨\"…中 스마트폰도 가격 인상 도미노 - v.daum.net", "summary": "'칩플레이션'의 파고를 견디지 못한 중국 스마트폰 업계 전반에 가격 인상 도미노 현상이 발생했다. 부품 원가 폭등이 세트 가격 상승으로 직결되는 악순환이 반복되고 있다. 글로벌 스마트폰 제조사들의 원가 방어 경쟁이 치열해진 시점이다. 삼성전자 역시 예외일 수 없으나, 메모리 내재화 경쟁력을 활용한 상대적 우위 확보가 가능하다.", "source": "v.daum.net", "date": "2026-09-01 18:27", "url": "https://v.daum.net/v/20260901182751469", "category": "price", "importance": 5, "wl": false, "topic": "칩플레이션 중국 스마트폰 가격 인상 도미노"}, {"title": "아이폰18 원가만 41만원 뛴다는데…\"샤오미 너마저 20만원 폭등\" 中도 폰값 날벼락 - 아시아경제", "summary": "아이폰 18의 원가가 대폭 상승할 것으로 예상되는 가운데, 샤오미 스마트폰 가격마저 20만 원 가까이 폭등하며 가시화되고 있다. 메모리 제조사인 삼성전자 DS부문에는 긍정적이나, 세트 사업인 MX사업부에는 원가 부담으로 작용한다. 부품 수급과 수익성 방어 간의 균형 조율이 필수적이다.", "source": "TrendForce", "date": "2026-09-02 16:05", "url": "https://www.trendforce.com/news/2026/09/02/insights-memory-spot-price-update-ddr5-ddr4-demand-weakens-but-firm-supplier-quotes-support-elevated-prices/", "category": "launch", "importance": 4, "wl": false, "topic": "메모리 스팟 가격 동향 ddr5 ddr4 수요 약세"}, {"title": "Goldman Sachs Report: Q3 Memory Price Outlook Adjusted; PC DRAM Rises to 18-23% - kucoin.c", "summary": "골드만삭스의 최신 시장 전망에 따라 3분기 메모리 가격 오름세가 유지되며 PC DRAM 가격 상승률이 18~23% 범위로 상향 조정됐다. 공급자 우위 시장이 공고해지면서 세트업체들의 원가 부담 가중이 불가피해졌다. 부품 자급률이 높은 삼성전자에 비해 타사 경쟁력 약화 반사이익과 자사 제품 원가 방어의 양면적 과제가 주어졌다.", "source": "kucoin.com", "date": "2026-09-02 13:34", "url": "https://www.kucoin.com/news/flash/goldman-sachs-report-q3-memory-price-outlook-adjusted-pc-dram-rises-to-18-23", "category": "launch", "importance": 4, "wl": false, "topic": "골드만삭스 q3 메모리 가격 전망 수정 pc dram"}, {"title": "Goldman Sachs Report: Q3 Memory Prices Rise; PC DRAM Forecast Raised to 18-23% - kucoin.co", "summary": "골드만삭스 보고서에 따르면 3분기 메모리 가격이 지속 상승하는 가운데 PC DRAM 가격 전망치가 18~23% 수준으로 상향 조정됐다. AI 인프라 수요와 맞물려 메모리 반도체 가격 강세가 예상보다 오래 지속될 가능성이 제기되었다. 세트 제조사들의 원가 마진 압박이 더욱 거세질 것으로 보인다. 삼성전자 MX사업부의 수익성 관리에 비상등이 켜졌다.", "source": "kucoin.com", "date": "2026-09-02 13:05", "url": "https://www.kucoin.com/news/flash/goldman-sachs-report-q3-memory-prices-rise-pc-dram-forecast-raised-to-18-23", "category": "launch", "importance": 4, "wl": false, "topic": "골드만삭스 q3 메모리 가격 전망 및 pc dram 상향"}, {"title": "Dram and NAND set records as AI demand lifts prices but rally cools - CHOSUNBIZ - Chosunbi", "summary": "AI 인프라 수요가 메모리 가격을 역대 최고가로 끌어올린 가운데, 가격 랠리 속도는 다소 진정되는 국면에 접어들었다. 조선비즈 등 주요 언론은 메모리 대란의 명암을 분석하며 세트 제조사들의 원가 압박을 조명했다. 반도체 호황이 세트 부문의 수익성에는 악영향을 미치는 구조적 딜레마가 지속되고 있다. 효율적인 원가 관리가 최우선 과제로 부각된다.", "source": "Chosunbiz", "date": "2026-09-01 14:15", "url": "https://biz.chosun.com/en/en-it/2026/09/01/GVMKNGGZNBCHTKGFDS2DQXX2NY/? tle": "Continuous glucose monitors are about to get more complicated", "summary": "연속 혈당 측정기(CGM) 기술과 관련 시장 환경이 더욱 복잡해지고 있습니다. 최신 기즈모와 헬스케어 기기들이 일상을 바꾸는 트렌드를 분석하는 뉴스레터가 주목받고 있습니다. 디지털 헬스케어 기기의 발전 양상을 보여줍니다.", "source": "The Verge", "date": "2026-09-03 00:30", "url": "https://www.theverge.com/column/988242/optimizer-abbott-libre-duo-ketones-diabetic-ketoacidosis", "category": "launch", "importance": 2, "wl": true, "topic": "혈당 측정기"}, {"title": "Oura’s Menopause Impact Scale Expands Out of the App and Into Women’s Health Care", "summary": "오우라 링의 제작사가 여성 건강 관리를 위해 갱년기 영향 척도 기능을 앱 외부로 확장합니다. 여성 건강 기업들과의 파트너십을 통해 갱년기 케어 서비스를 강화할 방침입니다. 헬스케어 데이터와 전문 의료 서비스를 연계하는 전략입니다. 웨어러블 기기의 헬스케어 활용 범위를 넓히고 있습니다.", "source": "CNET", "date": "2026-09-02 21:04", "url": "https://www.cnet.com/health/medical/oura-menopause-impact-scale-womens-health-care/", "category": "launch", "importance": 2, "wl": true, "topic": "오우라 갱년기 영향 척도"}, {"title": "Ultrahuman wants real-world health data, and is asking its users for it", "summary": "울트라휴먼이 실제 사용자들로부터 실생활 건강 데이터를 수집하기 위해 협조를 요청하고 있습니다. 사용자의 개인 건강 데이터를 기업과 공유하는 방식에 대해 프라이버시 우려가 제기됩니다. 헬스케어 알고리즘 고도화를 위한 데이터 확보 목적입니다. 웨어러블 데이터 활용에 대한 보안 논건이 이어지고 있습니다.", "source": "Android Authority", "date": "2026-09-01 22:00", "url": "https://www.androidauthority.com/ultrahuman-pulsomics-research-program-3705215/", "category": "policy", "importance": 2, "wl": true, "topic": "울트라휴먼 헬스케어 데이터"}, {"title": "Samsung Fit 1 Fitness Tracker Galaxy Fit2 Ios A Man Standing On Top Of A Grass Covered Hil", "summary": "", "source": "krepsiniozinios", "date": "2026-09-02 05:54", "url": "https://www.krepsiniozinios.lt/productSearch/pictureSearch?id=38524787050390", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "10 Apple Health Hacks Every iPhone User Should Know - Lifehacker", "summary": "아이폰 사용자들이 일상에서 활용할 수 있는 10가지 애플 헬스 앱 활용법이 소개됐다. 모바일 디지털 헬스케어 생태계의 사용자 활용 팁을 다룬 내용이다. 삼성헬스 기능 고도화 과정에서 참고할 수 있는 소프트웨어 유저빌리티 트렌드이다.", "source": "Lifehacker", "date":  안드로이드 업데이트를 통해 구글 메시지와 구글 킵 간의 연동 기능이 추가되었습니다. 킵 기반의 체크리스트를 메시지 스레드 내에서 직접 공유하고 편집할 수 있습니다. 대화 참여자 모두가 실시간으로 체크리스트를 수정할 수 있는 협업 기능을 제공합니다. 메시징 앱의 활용 범위를 넓히는 업데이트입니다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/google-messages-keep-notes-checklist-september-android-drop-3705193/", "category": "launch", "importance": 3, "wl": true, "topic": "구글 메시지 업데이트"}, {"title": "Your Pixel 11 will soon have a fix for the static noise ruining your videos", "summary": "픽셀 11 기기에서 동영상 촬영 시 발생하는 정적 소음(스태틱 노이즈) 현상이 확인되었습니다. 구글은 해당 결함을 공식 인정하고 향후 소프트웨어 업데이트를 통해 수정 패치를 배포할 계획입니다. 초기 구매자들을 중심으로 불만이 제기된 사안입니다. 신제품의 품질 안정성 확보가 주요 과제로 떠올랐습니다.", "source": "Android Authority", "date": "2026-09-02 02:03", "url": "https://www.androidauthority.com/pixel-11-static-noise-fix-coming-3705634/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 품질 문제"}, {"title": "Pixel 11’s big modem switch hasn’t ended familiar connectivity complaints", "summary": "픽셀 11에 탑재된 대형 모뎀 교체에도 불구하고 기존의 연결성 관련 불만이 해소되지 않았습니다. 초기 구매 사용자들은 여전히 와이파이, 5G, 블루투스 연결에 문제를 겪고 있다고 보고하고 있습니다. 하드웨어 변경에도 통신 안정성 문제가 지속되는 양상입니다. 제품 품질에 대한 신뢰도 타격이 우려됩니다.", "source": "Android Authority", "date": "2026-09-01 22:21", "url": "https://www.androidauthority.com/pixel-11-connectivity-issues-3705354/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 연결성 문제"}, {"title": "This new Ultra phone has a rear speaker, a take on HiLight, and that iPhone 18 color", "summary": "후면 스피커와 하이라이트 기능, 아이폰 18 색상을 채택한 새로운 울트라 스마트폰이 공개되었습니다. 스냅드래곤 8 엘리트 젠 5 칩셋과 185Hz 화면, 다목적 카메라를 탑재했습니다. 고사양 하드웨어 스펙을 내세워 시장 공략에 나섭니다. 플래그십 스마트폰 시장의 경쟁 심화가 예상됩니다.", "source": "Android Authority", "date": "2026-09-01 21:45", "url": "https://www.androidauthority.com/poco-f9-pro-and-f9-ultra-3704280/", "category": "launch", "importance": 3, "wl": true, "topic": "신형 울트라 스마트폰 출시"}, {"title": "Google’s new Extreme Charging on the Pixel 11 Pro XL has a heat problem", "summary": "픽셀 11 프로 XL에 도입된 새로운 익스트림 충전 기능에서 발열 문제가 보고되었습니다. 충전 시간을 5분 단축시키는 대신 기기 온도가 상승하는 부작용이 발생했습니다. 고속 충전 효율성과 기기 안정성 사이의 트레이드오프를 보여줍니다. 사용자 경험에 부정적 영향을 미칠 수 있는 요소입니다.", "source": "Android Authority", "date": "2026-09-01 19:30", "url": "https://www.androidauthority.com/pixel-11-pro-extreme-charging-tested-heat-problem-3703479/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 프로 xl 발열 문제"}, {"title": "iOS 27 breaks 15 years of muscle memory on iPhone and iPad", "summary": "iOS 27은 2011년 iOS 5 이후 15년간 유지되어 온 아이폰과 아이패드의 알림 센터 사용 방식을 완전히 개편했습니다. 사용자의 기존 인터페이스 습관에 큰 변화를 주는 업데이트입니다. 모바일 OS 사용성에 대한 중대한 개편입니다.", "source": "9to5Mac", "date": "2026-09-01 17:00", "url": "https://9to5mac.com/2026/09/01/ios-27-just-broke-15-years-of-muscle-memory-on-iphone-and-ipad/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 알림 센터"}]};

    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
