트라휴먼 헬스 데이터 수집"}, {"title": "Atrial Fibrillation Samsung Watch Heart Rhythm Samsung Brings Irregular Heart Rhythm Notif", "summary": "삼성 워치가 불규칙 심장 리듬 알림 등 심방세동 감지 기능을 확대하며 디지털 헬스케어 역량을 강화하고 있습니다. 헬스케어 규제 승인을 획득하며 의료 보조 기기로서의 신뢰성을 높이고 있습니다. 사용자들의 건강 모니터링 편의성이 대폭 향상됩니다. 웨어러블 헬스 시장에서의 경쟁 우위를 다지는 핵심 기능입니다.", "source": "krepsiniozinios", "date": "2026-09-02 12:08", "url": "https://krepsiniozinios.lt/?u=19828033001390", "category": "quality", "importance": 3, "wl": false, "topic": "galaxy watch 심박수"}, {"title": "‘가성비’ 앞세운 中 웨어러블 공세…삼성전자, AI 헬스케어로 맞불 - 파이낸셜투데이", "summary": "", "source": "파이낸셜투데이", "date": "2026-09-02 01:39", "url": "http://www.ftoday.co.kr/news/articleViewAmp.html?idxno=364587", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Your Smartwatch Is Lying To You About How Many Calories You Burned - Eurasia Review", "summary": "스마트워치 칼로리 소모량 측정의 정확성에 대한 일반적인 비판적 고찰입니다. 디지털 헬스케어 기능 신뢰도 제고를 위한 참고 자료입니다.", "source": "Eurasia Review", "date": "2026-09-02 09:55", "url": "https://www.eurasiareview.com/02092026-your-smartwatch-is-lying-to-you-about-how-many-calories-you-burned/", "category": "quality", "importance": 2, "wl": false, "topic": "기타 헬스케어"}], "phone": [{"title": "Galaxy Z Fold 8 is selling so well, Samsung is borrowing parts from the future", "summary": "갤럭시 Z 폴드 8이 시장에서 예상을 뛰어넘는 폭발적인 판매량을 기록함에 따라 삼성전자가 물량 공급을 위해 미래 부품 예비분까지 끌어다 쓰고 있는 것으로 전해졌다. 생산 차질을 막기 위해 전사적 역량을 동원할 정도로 수요가 급증하고 있음을 보여준다. 폴더블폰 시장에서 압도적인 판매 흥행 가도를 달리고 있음을 입증하는 중대한 사업적 성과다.", "source": "Android Authority", "date": "2026-09-01 00:18", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-8-ddi-demand-ramp-up-3704985/", "category": "launch", "importance": 5, "wl": true, "topic": "갤럭시 z 폴드 8 공급망 부품 조달"}, {"title": "Apple's iPhone Ultra Crease Fix Set for Android Foldables Next Year", "summary": "애플의 폴더블 '아이폰 울트라'에 적용된 크리스(주름) 개선 기술이 내년 안드로이드 폴더블폰 전반에 확대 적용될 전망입니다. 폴더블 스마트폰의 고질적인 문제인 화면 주름을 해결하기 위한 애플의 엔지니어링 완성도가 시장 전체의 표준을 이끌고 있습니다. 삼성의 갤럭시 Z 폴드 시리즈에 기술적 긴장감을 불어넣는 중대 사안입니다.", "source": "MacRumors", "date": "2026-09-02 20:57", "url": "https://www.macrumors.com/2026/09/02/iphone-ultra-crease-coming-to-android-foldables/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 힌지 적용 사건"}, {"title": "Galaxy S27 Ultra could go Exynos again, and this time, Snapdragon fans might get jealous", "summary": "삼성 내부 테스트 결과 엑시노스 2700이 스냅드래곤 8 엘리트 겐 6 프로를 능가하는 성능을 보여주면서, 차기 갤럭시 S27 울트라에 다시 엑시노스가 탑재될 가능성이 제기되었습니다. 그동안 스냅드래곤을 선호하던 팬들의 이목을 집중시키는 성능 반전 소식입니다. 삼성의 모바일 AP 이원화 전략에 중대한 변화를 예고합니다.", "source": "Android Authority", "date": "2026-09-02 20:43", "url": "https://www.androidauthority.com/galaxy-s27-ultra-exynos-rumor-3706017/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s27 울트라 엑시노스 탑재 사건"}, {"title": "Leakers battle over whether third iPhone 18 Pro color will be silver or black", "summary": "다음 주 출시될 아이폰 18 프로의 세 가지 색상 중 세 번째 색상이 실버가 될지 블랙이 될지를 두고 유명 유출가들 사이에 엇갈린 전망이 제기되고 있습니다. 앞선 유출들을 통해 두 가지 색상은 의견이 모아졌으나 마지막 남은 시그니처 컬러를 두고 혼선이 빚어지고 있습니다. 애플의 차세대 플래그십 디자인에 대한 시장의 높은 관심을 보여줍니다.", "source": "9to5Mac", "date": "2026-09-02 19:53", "url": "https://9to5mac.com/2026/09/02/leakers-battle-over-whether-third-iphone-18-pro-color-will-be-silver-or-black/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 색상 사건"}, {"title": "Leaked iPhone 18 Pro Parts Point to Three Color Options Excluding Black", "summary": "유출된 아이폰 18 프로 부품들을 통해 블랙을 제외한 세 가지 색상 옵션으로 구성될 가능성이 제기되었습니다. 차세대 플래그십 모델의 외형 디자인과 마감 색상에 대한 구체적인 단서가 드러나고 있습니다. 출시를 앞둔 제품의 디자인 유출은 시장의 기대감을 고조시킵니다.", "source": "MacRumors", "date": "2026-09-02 19:17", "url": "https://www.macrumors.com/2026/09/02/leaked-iphone-18-pro-parts-point-to-three-colors/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 부품 색상 사건"}, {"title": "Xiaomi beats Apple to market with wide Xiaomi 18 Fold reveal", "summary": "샤오미가 애플의 폴더블폰 이벤트 이틀 전에 넓은 폼팩터를 채택한 신형 '샤오미 18 폴드'의 공식 렌더링과 영상을 전격 공개하며 시장 선점에 나섰습니다. 경쟁사보다 빠르게 신형 폴더블 폼팩터를 선보여 글로벌 시장에서 주도권을 잡으려는 전략입니다. 삼성의 폴더블폰 독주 체제를 흔드는 강력한 도전자입니다.", "source": "Android Authority", "date": "2026-09-02 18:36", "url": "https://www.androidauthority.com/xiaomi-18-fold-launch-details-3705996/", "category": "launch", "importance": 4, "wl": true, "topic": "샤오미 와이드 폴더블 18 폴드 사건"}, {"title": "New Galaxy S27 and S27 Plus leak sets us up for grave disappointment, this time for fast c", "summary": "차기작 갤럭시 S27 및 S27 플러스의 새로운 유출 정보에 따르면 베이스 모델의 충전 속도가 여전히 갤럭시 S26 FE에도 못 미치는 실망스러운 수준인 것으로 드러났습니다. 플래그십 라인업임에도 불구하고 기본 모델의 하드웨어 스펙이 정체되어 소비자들의 아쉬움을 자극하고 있습니다. 제품 기획 및 스펙 경쟁력 측면에서 보완이 요구됩니다.", "source": "Android Authority", "date": "2026-09-02 17:48", "url": "https://www.androidauthority.com/galaxy-s27-plus-charging-speed-25w-3705976/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s27 및 s27 플러스 유출 사건"}, {"title": "Apple Launching Eight New Products This Month", "summary": "애플이 이번 달에만 아이폰, 워치, 에어팟 등을 포함해 총 8개의 새로운 제품을 대거 출시하며 하드웨어 라인업을 전면 개편합니다. 하반기 글로벌 모바일 및 웨어러블 시장의 주도권을 장악하기 위한 애플의 총력전이 시작되었습니다. 삼성 MX사업부에 가장 강력한 위협 요소입니다.", "source": "MacRumors", "date": "2026-09-02 17:15", "url": "https://www.macrumors.com/2026/09/02/apple-launching-eight-new-products-next-month/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 이달의 신제품 출시 사건"}, {"title": "“통화 중 카드정보 탈취”…그룹아이비, 신종 NFC 악성코드 발견", "summary": "그룹아이비가 전화 통화 중 스마트폰을 원격 제어하고 NFC 기능을 악용해 실물 카드 데이터를 가짜 단말기로 실시간 전송하는 신종 악성코드 '윈드릴레이'를 발견했다. 통화 중 카드 정보 탈취 등 지능형 금융 사기 수법이 고도화되고 있음을 보여준다. 모바일 플랫폼 보안 강화와 사용자 주의가 시급한 상황이다.", "source": "전자신문", "date": "2026-09-02 16:28", "url": "https://www.etnews.com/20260902000401", "category": "quality", "importance": 4, "wl": true, "topic": "신종 nfc 악성코드 윈드릴레이 발견"}, {"title": "New iPhone Ultra details arrive for specs, multitasking, launch timing, more", "summary": "다음 주 9월 이벤트에서 공개될 예정인 폴더블 ‘아이폰 울트라’에 대해 마크 거먼과의 인터뷰를 통해 사양, 멀티태스킹, 출시 시기 등에 대한 새로운 세부 정보가 유출되었습니다. 애플의 첫 폴더블 스마트폰이자 새로운 폼팩터 도입이라는 점에서 모바일 업계의 판도를 바꿀 핵심 변수로 꼽힙니다. 삼성의 폴더블폰 라인업에 즉각적인 대응을 요구하는 중대 사안입니다.", "source": "9to5Mac", "date": "2026-09-02 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 출시 사건"}, {"title": "Foldable iPhone Ultra Likely Has MagSafe Charging", "summary": "출시를 앞둔 폴더블 '아이폰 울트라'에 맥세이프(MagSafe) 무선 충전 기능이 탑재될 가능성이 높다는 전망이 나왔습니다. 얇은 두께를 구현해야 하는 폴더블 폼팩터에 자기 흡착식 무선 충전 기술을 안정적으로 결합하는 것이 핵심 과제입니다. 애플의 폴더블 하드웨어 완성도를 보여주는 대목입니다.", "source": "MacRumors", "date": "2026-09-02 04:05", "url": "https://www.macrumors.com/2026/09/01/foldable-iphone-ultra-magsafe/", "category": "launch", "importance": 4, "wl": true, "topic": "폴더블 아이폰 울트라 맥세이프 사건"}, {"title": "Apple Teases 'Huge Launch' Next Week", "summary": "다음 주 개최될 대형 런칭 이벤트를 앞두고 애플이 대규모 신제품 공개를 공식적으로 예고하며 전 세계 테크 업계의 이목을 집중시키고 있습니다. 하반기 모바일 및 웨어러블 시장의 판도를 뒤흔들 혁신 기기들이 대거 베일을 벗을 예정입니다. 삼성 MX사업부의 긴급 대응 태세가 요구됩니다.", "source": "MacRumors", "date": "2026-09-02 03:03", "url": "https://www.macrumors.com/2026/09/01/apple-teases-huge-launch-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 대규모 신제품 런칭 티저 사건"}, {"title": "iPhone 18 Pro Colors Apparently Include Black, But Skip Silver", "summary": "아이폰 18 프로의 색상 구성에 블랙은 포함되지만 실버는 제외되는 등 새로운 색상 옵션 구성에 대한 구체적인 윤곽이 드러났습니다. 플래그십 스마트폰의 외관 마감은 초기 판매량을 좌우하는 중요한 요소입니다. 유출된 컬러 라인업이 소비자의 선택에 미칠 영향이 주목됩니다.", "source": "MacRumors", "date": "2026-09-02 00:22", "url": "https://www.macrumors.com/2026/09/01/iphone-18-pro-colors-include-black-but-skip-silver/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 색상 옵션 사건"}, {"title": "Apple’s first folding iPhone won’t kill Android foldables — it will save them", "summary": "애플의 첫 폴더블 아이폰 진입이 안드로이드 폴더블폰 시장을 위협하기보다 오히려 시장 전체를 활성화하는 마중물 역할을 할 것이라는 전망이 나왔다. 애플의 참전으로 폴더블 폼팩터의 대중화가 가속화될 수 있다는 분석이다. 삼성전자가 선도해온 폴더블 시장 구도에 큰 변화를 예고하는 대목이다.", "source": "Android Authority", "date": "2026-09-01 18:00", "url": "https://www.androidauthority.com/apple-foldable-iphone-save-android-phones-3704142/", "category": "exec", "importance": 4, "wl": true, "topic": "애플 폴더블 아이폰 출시 영향 분석"}, {"title": "Breaking: Galaxy S25 series joins the One UI 9 beta program party", "summary": "갤럭시 S26 전용으로 제한되던 원 UI 9 베타 프로그램이 마침내 갤럭시 S25 시리즈로 확대 적용되었다. 수개월 간의 베타 독점 기간이 끝나고 전작 사용자들에게도 최신 소프트웨어 경험이 개방된다. 기존 고객 관리와 생태계 통합 차원에서 중요한 진전이다.", "source": "Android Authority", "date": "2026-09-01 17:38", "url": "https://www.androidauthority.com/samsung-galaxy-s25-one-ui-9-beta-1-3705298/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s25 시리즈 원 ui 9 베타 프로그램 참여"}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "차기작 갤럭시 S27과 S27 플러스 모델에 유의미한 망원 카메라 성능 향상이 이뤄질 것으로 전망된다. 유출 정보에 따르면 이들 모델은 S27 프로와 동일한 3배 줌 망원 시스템을 탑재할 가능성이 제기된다. 카메라 하위 모델과의 급 나누기 전략에 변화를 주어 제품 경쟁력을 높이려는 의도로 해석된다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s27 및 s27 플러스 줌 카메라 업그레이드"}, {"title": "iPhone Ultra release timing: Here’s what the latest reporting says", "summary": "애플이 다음 주 9월 이벤트에서 폴더블 ‘아이폰 울트라’를 공식 공개할 예정인 가운데, 실제 사용자들에게 배송되는 정확한 출시 시기는 아직 불투명하다는 최신 보도가 나왔습니다. 폴더블 스마트폰 시장에 진입하는 애플의 첫 제품 일정에 업계의 이목이 집중되어 있습니다. 삼성의 폴더블폰 시장 독주 체제에 중대한 위협 요소입니다.", "source": "9to5Mac", "date": "2026-09-01 03:55", "url": "https://9to5mac.com/2026/08/31/iphone-ultra-release-timing-heres-what-the-latest-reporting-says/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 출시 일정 사건"}, {"title": "Apple could discontinue 10+ popular products next week", "summary": "애플이 다음 주 대규모 9월 신제품 런칭 행사를 개최함과 동시에 10개 이상의 인기 구형 현행 기기들을 대거 단종시킬 것으로 예상됩니다. 신제품 라인업 재편을 위해 구형 모델들을 과감히 정리하는 애플의 전형적인 제품 생명주기 관리 전략입니다. 시장 전반의 재고 흐름과 제품 라인업 교체에 영향을 미칩니다.", "source": "9to5Mac", "date": "2026-09-01 01:04", "url": "https://9to5mac.com/2026/08/31/apple-could-discontinue-10-popular-products-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 구형 제품 단종 사건"}, {"title": "iPhone 18 Pro is coming: Here’s what’s new with each model", "summary": "오는 9월 9일 공개될 아이폰 18 프로와 프로 맥스 모델들에 새롭게 도입될 혁신적인 기능과 변경 사항들에 대한 루머가 구체적으로 정리되었습니다. 애플의 차세대 주력 스마트폰이 가져올 스펙 변화는 글로벌 모바일 시장의 트렌드를 주도합니다. 삼성 MX사업부의 플래그십 전략 수립에 핵심적인 벤치마킹 대상입니다.", "source": "9to5Mac", "date": "2026-08-31 23:06", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-is-coming-heres-whats-new-with-each-model/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 모델별 신기능 사건"}, {"title": "The next Snapdragon flagship chip is getting Qualcomm’s take on DLSS", "summary": "차세대 퀄컴 스냅드래곤 플래그십 칩셋이 AI 하드웨어를 활용해 엔비디아의 DLSS와 유사한 자체 그래픽 업스케일링 기술을 도입할 예정입니다. 모바일 기기에서의 게이밍 성능을 극대화하기 위한 칩셋 제조사들의 경쟁이 치열해지고 있습니다. 스마트폰 게이밍 환경의 질적 도약을 예고합니다.", "source": "Android Authority", "date": "2026-09-02 22:00", "url": "https://www.androidauthority.com/qualcomm-snapdragon-8-elite-gen-6-gpu-3705379/", "category": "launch", "importance": 3, "wl": true, "topic": "퀄컴 스냅드래곤 dlss 기술 사건"}, {"title": "Apple Labor Day 2026 deals now live: AirPods Pro 3, M6 Mac mini, AirTag 2, iPhone, more [U", "summary": "아마존 노동절 세일을 통해 에어팟 프로 3가 50달러 할인된 199달러에 판매되는 등 아이폰, M6 맥 미니, 에어태그 2 등의 대규모 할인 행사가 시작되었습니다. 주요 신제품 출시를 앞두고 구형 모델 및 주변기기의 재고 소진을 위한 공격적인 가격 정책이 펼쳐지고 있습니다. 소비자 수요를 선점하려는 유통가의 움직임을 보여줍니다.", "source": "9to5Mac", "date": "2026-09-02 21:17", "url": "https://9to5mac.com/2026/09/02/apple-labor-day-2026-deals-live/", "category": "launch", "importance": 3, "wl": true, "topic": "애플 노동절 할인 사건"}, {"title": "Randomly locked out of your Samsung account? You’re not alone", "summary": "일부 삼성 계정 사용자들이 이유 없이 계정이 무작위로 잠기는 현상을 겪고 있으며, 이 원인 중 하나로 별칭 이메일 주소 사용이 지목되었습니다. 사용자들의 로그인 불편과 보안 인증 시스템의 오류 가능성이 제기되면서 고객 불만이 커지고 있습니다. 삼성의 계정 관리 및 서버 안정성에 대한 점검이 필요합니다.", "source": "Android Authority", "date": "2026-09-02 20:09", "url": "https://www.androidauthority.com/samsung-galaxy-accounts-random-deactivation-3706032/", "category": "policy", "importance": 3, "wl": true, "topic": "삼성 계정 무작위 잠금 사건"}, {"title": "Pixel 11 notifications are the last straw for many readers sick of phone ads", "summary": "수천 명의 독자들이 스마트폰 알림창에 노출되는 광고에 대해 불만을 토로하며 구글 픽셀 11의 알림 방식이 인내심의 한계를 넘어섰다고 지적했습니다. 모바일 기기의 사용자 경험을 해치는 공격적인 광고 정책이 소비자들의 거센 반발을 불러일으키고 있습니다. 스마트폰 제조사들의 수익화 모델에 경종을 울립니다.", "source": "Android Authority", "date": "2026-09-02 19:15", "url": "https://www.androidauthority.com/pixel-11-ads-on-smartphones-poll-results-3705986/", "category": "policy", "importance": 3, "wl": true, "topic": "픽셀 11 알림 광고 논란 사건"}, {"title": "I downloaded Android 17 QPR2 Beta 4. These 3 features instantly upgraded my Pixel", "summary": "안드로이드 17 QPR2 베타 4가 다운로드 가능해지면서 픽셀 폰 사용자들에게 즉각적인 업그레이드를 선사하는 환영할 만한 세 가지 새로운 기능들이 추가되었습니다. 구글의 차세대 모바일 OS 테스트 버전이 안정화 단계에 접어들며 새로운 사용자 경험을 제공합니다. 모바일 소프트웨어 생태계의 발전상을 보여줍니다.", "source": "Android Authority", "date": "2026-09-02 19:00", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-hands-on-3705624/", "category": "launch", "importance": 3, "wl": true, "topic": "안드로이드 17 베타 업데이트 사건"}, {"title": "Galaxy S24 owners can now get a taste of Android 17 with One UI 9 beta", "summary": "구형 모델인 갤럭시 S24 소유자들도 미국, 인도, 한국에서 원 UI 9 베타를 통해 안드로이드 17을 미리 체험해 볼 수 있게 되었습니다. 삼성전자가 구형 플래그십 모델에까지 최신 OS와 원 UI 베타를 빠르게 확대 지원하며 사후 지원의 폭을 넓히고 있습니다. 기존 사용자들의 만족도를 높이는 긍정적 행보입니다.", "source": "Android Authority", "date": "2026-09-02 17:39", "url": "https://www.androidauthority.com/samsung-galaxy-s24-one-ui-9-beta-3705963/", "category": "launch", "importance": 3, "wl": true, "topic": "갤럭시 s24 안드로이드 17 베타 사건"}, {"title": "Google Messages has a weird bug that’s sending old texts to random people (Updated: Fix in", "summary": "구글 메시지 앱에서 과거의 오래된 대화 내용과 문자 메시지가 전혀 엉뚱한 사람들에게 무작위로 재발송되는 기괴한 버그가 발생했습니다. 메시징 서버의 치명적인 오류로 인해 사생활 침해 및 사용자 혼란이 가중되고 있습니다. 즉각적인 원인 파악과 패치 배포가 시급한 사안입니다.", "source": "Android Authority", "date": "2026-09-02 16:32", "url": "https://www.androidauthority.com/google-messages-old-texts-bug-3704732/", "cate itle": "Samsung Galaxy Z Fold8 vs Xiaomi 18 Fold: Which is the better foldable phone? - Sportskeed", "summary": "삼성 갤럭시 Z 폴드 8과 샤오미 18 폴드를 비교하며 더 나은 폴더블폰을 가리는 분석 기사가 나왔습니다. 중국 제조사들의 거센 추격 속에서 삼성 폴더블폰의 경쟁력을 객관적으로 평가하고 있습니다. 하드웨어 완성도와 소프트웨어 최적화 측면에서 두 기기의 장단점이 명확히 갈립니다. 글로벌 폴더블폰 주도권 다툼이 갈수록 치열해지고 있습니다.", "source": "Sportskeeda Tech", "date": "2026-09-02 21:20", "url": "https://tech.sportskeeda.com/mobiles/samsung-galaxy-z-fold8-vs-xiaomi-18-fold-which-better-foldable-phone", "category": "other", "importance": 3, "sid": "phone", "topic": "galaxy z fold8 비교"}, {"title": "Apple Labor Day 2026 deals now live: AirPods Pro 3, M6 Mac mini, AirTag 2, iPhone, more [U", "summary": "아마존 노동절 세일을 통해 에어팟 프로 3가 50달러 할인된 199달러에 판매되는 등 아이폰, M6 맥 미니, 에어태그 2 등의 대규모 할인 행사가 시작되었습니다. 주요 신제품 출시를 앞두고 구형 모델 및 주변기기의 재고 소진을 위한 공격적인 가격 정책이 펼쳐지고 있습니다. 소비자 수요를 선점하려는 유통가의 움직임을 보여줍니다.", "source": "9to5Mac", "date": "2026-09-02 21:17", "url": "https://9to5mac.com/2026/09/02/apple-labor-day-2026-deals-live/", "category": "launch", "importance": 3, "sid": "phone", "topic": "애플 노동절 할인 사건"}];
</script>
<script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
