ly reached non-foldables", "summary": "화웨이가 기존 바형 스마트폰 폼팩터에 여권 비율인 16:9.5의 와이드 스크린을 적용한 신제품 푸라 X 뷰를 공개하며 광폭 화면 트렌드를 일반 스마트폰으로 확장했다. 폴더블폰이 아닌 전통적인 바형 기기에서도 화면 비율의 변화를 시도하며 디자인 차별화를 꾀하고 있다. 중국 제조사들의 끊임없는 폼팩터 실험이 모바일 디자인 트렌드에 영향을 미치고 있다. 향후 글로벌 시장에서의 소비자 반응이 주목된다.", "source": "Android Authority", "date": "2026-09-08 00:02", "url": "https://www.androidauthority.com/huawei-pura-x-view-full-launch-3708420/", "category": "launch", "importance": 3, "wl": true, "topic": "화웨이 푸라 x 뷰 스마트폰", "alert": false}, {"title": "One UI 9 quietly solves time zone math while calling", "summary": "삼성전자의 차세대 인터페이스 원 UI 9에 통화 중 상대방의 현지 시각을 자동으로 계산해 주는 실용적인 기능이 조용히 탑재된 것으로 확인됐다. 해외 통화나 글로벌 비즈니스 상황에서 자주 발생하는 시간대 계산의 번거로움을 깔끔하게 해결해 주는 사용자 중심의 개선이다. 소프트웨어 편의성 강화를 통해 갤럭시 스마트폰의 실사용 만족도를 높이려는 전략이다. 세심한 기능 추가로 경쟁사 대비 소프트웨어 차별화를 도모하고 있다.", "source": "Android Authority", "date": "2026-09-07 23:28", "url": "https://www.androidauthority.com/one-ui-9-call-brief-international-calling-3708416/", "category": "launch", "importance": 3, "wl": true, "topic": "원 ui 9 시차 계산 기능", "alert": false}, {"title": "Three new iPhones launch this week, here’s what’s coming", "summary": "애플이 9월 쿠퍼티노 본사 이벤트에서 아이폰18 프로, 아이폰18 프로 미니 등 3종의 신제품 스마트폰 라인업을 전격 공개할 예정이다. 이번 행사는 하반기 글로벌 모바일 시장의 최대 격전지에서 경쟁의 신호탄이 될 것으로 보인다. 혁신적인 기능과 가격 정책 변화가 시장 점유율에 미칠 파급력에 업계의 이목이 집중되고 있다. 삼성전자를 비롯한 경쟁사들의 즉각적인 대응 전략 수립이 요구된다.", "source": "9to5Mac", "date": "2026-09-07 21:23", "url": "https://9to5mac.com/2026/09/07/three-new-iphones-launch-this-week-heres-whats-coming/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰18 시리즈 공개", "alert": false}, {"title": "Pixel 11’s sign language translation feature looks seriously useful in real-world demo", "summary": "구글 픽셀 11의 실시간 수화 번역 기능이 실제 시연을 통해 공개되며 뛰어난 실용성과 기술력을 입증했다. 인공지능 기반의 시각 및 음성 통신 보조 기능을 강화하여 접근성을 높이려는 구글의 핵심 AI 전략을 보여준다. 차세대 플래그십 스마트폰의 차별화된 사용자 경험을 제공하는 강력한 무기로 작용할 전망이다. 모바일 AI 번역 및 커뮤니케이션 기능 경쟁에 불을 지피고 있다.", "source": "Android Authority", "date": "2026-09-07 21:03", "url": "https://www.androidauthority.com/pixel-11-live-sign-language-to-text-translation-real-world-demo-3708253/", "category": "launch", "importance": 3, "wl": true, "topic": "픽셀 11 수화 통역 기능", "alert": false}, {"title": "The real reason your phone is getting more expensive", "summary": "애플의 차세대 스마트폰 출시를 앞두고 공급망 비용 상승으로 인한 가격 인상 가능성이 제기됐다. 핵심 부품 가격의 급등은 글로벌 제조사 전반의 원가 부담으로 작용하고 있다. 공급망의 강자인 애플마저 가격표를 올리게 된다면 전체 스마트폰 시장의 가격 상승세가 확정될 것으로 보인다. 이는 소비자의 교체 주기에 영향을 미치고 제조사별 수익성 전략을 재편하는 계기가 될 전망이다.", "source": "The Verge", "date": "2026-09-07 21:00", "url": "https://www.theverge.com/tech/988225/ram-shortage-supply-chain-micron-apple-iphone", "category": "price", "importance": 3, "wl": true, "topic": "아이폰 가격 인상", "alert": false}, {"title": "HUAWEI’s answer to the iPhone Ultra? A slimmer tri-fold with a privacy screen", "summary": "화웨이가 슬림해진 두께와 프라이버시 화면, 신규 망원 카메라를 탑재하고 하모니OS 7으로 구동되는 신형 삼폴드 스마트폰 메이트 XT2를 선보였다. 애플의 울트라 라인업과 삼성전자의 폴더블 리더십을 동시에 겨냥한 화웨이의 야심작이다. 중국 시장을 중심으로 폼팩터 혁신과 하드웨어 완성도를 빠르게 끌어올리고 있다. 글로벌 프리미엄 폴더블 시장에서 강력한 위협 요소로 부상하고 있다.", "source": "Android Authority", "date": "2026-09-07 20:38", "url": "https://www.androidauthority.com/huawei-mate-xt-2-tri-folding-phone-3708262/", "category": "launch", "importance": 3, "wl": true, "topic": "화웨이 메이트 xt2 트라이폴드", "alert": false}, {"title": "5 smartphones that show how far behind the Pixel 11’s Tensor G6 really is", "summary": "구글의 자체 커스텀 실리콘인 텐서 G6 칩셋의 성능이 경쟁사 플래그십 스마트폰들에 비해 크게 뒤처진다는 분석과 함께 커스텀 칩 전략의 실패 가능성이 제기됐다. 지속적인 성능 향상과 전력 효율 확보가 필수적인 플래그십 시장에서 독자 칩 경쟁력이 한계에 부딪히고 있다는 지적이다. 모바일 프로세서 시장에서 퀄컴과 미디어텍, 애플 등에 비해 뒤처지는 성능은 픽셀 시리즈의 약점으로 작용한다. 스마트폰 제조사들의 자체 칩 전략에 적지 않은 타격을 줄 수 있는 사안이다.", "source": "Android Authority", "date": "2026-09-07 18:00", "url": "https://www.androidauthority.com/pixel-11-tensor-g6-far-behind-benchmark-comparisons-3705519/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 텐서 g6 성능 논란", "alert": false}, {"title": "애플 첫 폴더블 한국 출시 10월 이후로…아이폰18과 시차 둔다", "summary": "애플의 첫 폴더블 아이폰 국내 출시 시점이 초도 생산 물량 부족으로   {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
