laxy z fold 8 판매"}, {"title": "Breaking: Galaxy S25 series joins the One UI 9 beta program party", "summary": "그동안 갤럭시 S26 전용이었던 원 UI 9 베타 프로그램이 마침내 갤럭시 S25 시리즈로 확대 적용되기 시작했다. 구형 플래그십 모델 사용자들에게도 최신 소프트웨어와 AI 경험을 조기에 제공하려는 방침이다. 삼성전자의 철저한 사후 소프트웨어 지원 정책을 보여준다.", "source": "Android Authority", "date": "2026-09-01 17:38", "url": "https://www.androidauthority.com/samsung-galaxy-s25-one-ui-9-beta-1-3705298/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s25 one ui 9"}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "갤럭시 S27 및 S27 플러스 모델에 S27 프로와 동일한 3배 망원 카메라 시스템이 탑재되는 등 의미 있는 줌 카메라 업그레이드가 이루어질 가능성이 제기됐다. 플래그십 라인업 전반의 카메라 성능을 상향 평준화하려는 전략이다. 경쟁사 스마트폰의 카메라 스펙 경쟁에 대응하기 위한 조치다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s27 줌 카메라"}, {"title": "iPhone 18 Pro: Three reasons you might want to upgrade from iPhone 17 Pro", "summary": "다음 주 공개를 앞둔 아이폰 18 프로에 대해 기존 아이폰 17 프로 사용자가 업그레이드해야 할 세 가지 주요 이유가 전망되었다. 신제품 출시를 앞두고 루머와 예상 스펙이 집중 조명되며 소비자의 교체 수요를 자극하고 있다. 삼성 MX사업부의 플래그십 전략에도 시사점을 준다.", "source": "9to5Mac", "date": "2026-09-01 05:21", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-three-reasons-you-might-want-to-upgrade-from-iphone-17-pro/", "category": "launch", "importance": 4, "wl": true, "topic": "iphone 18 pro 업그레이드"}, {"title": "Apple could discontinue 10+ popular products next week", "summary": "애플이 다음 주 대규모 9월 런칭 행사를 개최하며 신제품을 선보임과 동시에 10개 이상의 인기 현행 기종을 단종할 것으로 예상된다. 구형 모델의 퇴장을 통해 신제품 판매에 역량을 집중하려는 전략이다. 경쟁사의 라인업 재편이 스마트폰 및 IT 시장에 미치는 파급효과가 크다.", "source": "9to5Mac", "date": "2026-09-01 01:04", "url": "https://9to5mac.com/2026/08/31/apple-could-discontinue-10-popular-products-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "apple 제품 단종"}, {"title": "I compared the cameras on the Galaxy Z Fold 8 and Pixel 11 Pro Fold - and one pulled ahead", "summary": "독일 여행 중 삼성 갤럭시 Z 폴드 8과 구글 픽셀 11 프로 폴드의 카메라 성능을 직접 비교 테스트한 결과 접전 끝에 한 모델이 우세를 점했다. 양대 폴더블폰 플래그십 모델 간의 카메라 화질 및 성능 경쟁이 얼마나 치열한지 보여주는 실사용 평가다.", "source": "ZDNet", "date": "2026-09-01 00:50", "url": "https://www.zdnet.com/article/samsung-galaxy-z-fold-8-camera-vs-pixel-11-pro-fold-camera/", "category": "other", "importance": 4, "wl": true, "topic": "galaxy z fold 8 카메라"}, {"title": "iPhone 18 Pro is coming: Here’s what’s new with each model", "summary": "아이폰 18 프로가 오는 9월 9일 프로 및 프로 마크 모델과 함께 공개될 예정이며 루머를 통해 새로운 기능들이 유출되고 있다. 매년 가을 스마트폰 시장의 최대 이벤트인 아이폰 신제품 발표를 앞두고 업계의 긴장감이 높아지고 있다. 삼성 플래그십 모델과의 정면 승가 예고된다.", "source": "9to5Mac", "date": "2026-08-31 23:06", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-is-coming-heres-whats-new-with-each-model/", "category": "launch", "importance": 4, "wl": true, "topic": "iphone 18 pro 출시"}, {"title": "There’s already another tri-fold phone on the market, and it’s not from Samsung", "summary": "삼성전자가 아닌 화웨이가 새로운 트라이폴드 스마트폰 '메이트 XT 2'를 선보이며 다중 접이식 스마트폰 시장의 파이브를 넓히고 있다. 폴더블 폼팩터 경쟁이 듀얼 폴드를 넘어 트라이폴드로 진화하고 있음을 보여준다. 차세대 폼팩터 주도권을 둔 중화권 업체의 공세가 거세다.", "source": "Android Authority", "date": "2026-08-31 22:57", "url": "https://www.androidauthority.com/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 4, "wl": true, "topic": "huawei mate xt 2"}, {"title": "OnePlus 16 leak reveals ‘final’ camera specs, and it’s what the OnePlus 15 should’ve had", "summary": "원플러스 16의 최종 카메라 스펙 유출 정보에 따르면 전작에서 아쉬웠던 점을 보완한 완성도 높은 카메라 시스템이 탑재될 예정이다. 중국 스마트폰 제조사들의 플래그십 카메라 성능 경쟁이 갈수록 치열해지고 있다. 글로벌 모바일 시장에서 삼성의 경쟁 구도에 영향을 미친다.", "source": "Android Authority", "date": "2026-09-01 15:55", "url": "https://www.androidauthority.com/oneplus-16-final-camera-specs-leak-3705216/", "category": "launch", "importance": 3, "wl": true, "topic": "oneplus 16 카메라"}, {"title": "Apple Might Add a Pencil to Its First Foldable, but Don’t Expect It at Launch", "summary": "애플이 첫 번째 폴더블폰에 애플 펜슬을 추가할 가능성이 있으나 <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
