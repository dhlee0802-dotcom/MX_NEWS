let": [{"title": "[뉴스줌인] 모니모, 삼성페이 품고 오프라인 간편결제 강화", "summary": "삼성금융네트웍스 금융플랫폼 모니모가 삼성 금융 계열사를 넘어 삼성페이와 협업해 금융 서비스를 확장하고 있다. 삼성 금융 계열사의 서비스를 통합 조회하는 것에 그치지 않고 결제 영역까지 강화하며 금융 통합 앱으로 진화하는 모습이다. 모니모페이는 삼성페이와 연동으로 오프라인 결제 경쟁력을 확보했다. 모니모는 2022년 4월 출범 이후 약 2년 뒤인 2024년 7월 모니모페이 서비스를 출시했다. …", "source": "전자신문", "date": "2026-09-01 15:33", "url": "https://www.etnews.com/20260901000362", "category": "launch", "importance": 3, "wl": true, "topic": ""}, {"title": "[단독] 모니모, 삼성페이 연동…삼성 결제 생태계 확장", "summary": "삼성금융네트웍스의 통합 플랫폼 '모니모'에 삼성페이 결제 기능이 공식 연동되었다. 이번 연동을 통해 모니모 앱 내 간편결제 서비스인 '모니모페이'를 오프라인 삼성페이 가맹점에서도 편리하게 사용할 수 있게 되었다. 이는 모니모를 단순 금융 조회를 넘어 오프라인 결제까지 아우르는 '슈퍼 금융 앱'으로 도약시키기 위한 전략이다. 삼성페이는 네이버페이, 카카오페이에 이어 모니모까지 연동 범위를 넓히며 국내 간편결제 생태계에서의 지배력을 더욱 공고히 다지게 되었다.", "source": "전자신문", "date": "2026-09-01 15:08", "url": "https://www.etnews.com/20260901000344", "category": "launch", "importance": 3, "wl": true, "topic": "삼성페이 서비스"}, {"title": "Qatar Central Bank integrates Himyan system into Samsung Wallet application - Qatar Tribun", "summary": "", "source": "Qatar Tribune", "date": "2026-08-30 17:06", "url": "https://news.google.com/rss/articles/CBMizAFBVV95cUxPRmVXcEZEeVNIczlRUGNqNGlINGIzRzZLTEJEZEtwSnhsNU9yQ0RheG8zcDZKWm5md1lsWDRnV3lCbFQtQXVIc1V5VlE3TGk0alczSF9zSFVDbEFoSkpJM3NIanJ1V3FDQzVyeEc3M2NSWWdCOU8wTGFVTTZvLVZmMlRoVFBlb0xtTU1hNndFNXloQnNJQzFFbE9KaFhZbVV5SWRJZm9TNjJXZlhKSTJ2T2xpNXJUMkViMVFwbDM4aTNnU3ZSUHU4Ty1xZzPSAdIBQVVfeXFMT3FwQTVpdFpNdnpnQWJLaHprYzYwdU05RU52enhvSUNPUExnMWtpSG1TaW1ucmR4eDVfOWxOeUpqX2R5aEhrb1Y4Zl9aS2gyd052TzNLTFZDZl8wODVSc3ZwLVEwU3NKemlmenNOa19Ub0xIU1Bjdm9oVFJSSnMyRGVWcDY1T3ZYU0hERENhM2ZXMDRuMG4xUno0TzFnc2xjS2J5VDU5T3A3b21TWlhWdTRjcFVuOEN2NUFsZ1lKenV1em1GMmNHREFrUkY0MEFRa1lR?oc=5", "category": "policy", "importance": 5, "wl": false, "topic": ""}, {"title": "Himyan Samsung Wallet: Qatar cards get contactless payments - tbreak.com", "summary": "", "source": "tbreak.com", "date": "2026-09-01 12:31", "url": "https://news.google.com/rss/articles/CBMiW0FVX3lxTF om/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 4, "wl": true, "topic": "메이트 xt 2 출시"}, {"title": "Today is Tim Cook’s last day as Apple CEO, John Ternus takes over tomorrow", "summary": "애플을 15년간 이끌며 글로벌 시가총액 1위 기업으로 성장시킨 팀 쿡 최고경영자(CEO)가 공식 퇴임하고, 존 터너스 신임 CEO가 바통을 이어받는다. 팀 쿡은 직원들에게 보낸 마지막 메모를 통해 감사의 뜻을 전하며 임기를 마무리했다. 터너스 신임 CEO 체제는 첫 폴더블 아이폰 출시와 인공지능(AI) 경쟁력 회복, 글로벌 공급망 재편이라는 중대한 시험대를 마주하게 된다. 리더십 교체기를 맞이한 애플의 향후 사업 방향성과 전략 변화에 대해 삼성전자의 면밀한 모니터링이 요구된다.", "source": "9to5Mac", "date": "2026-08-31 22:52", "url": "https://9to5mac.com/2026/08/31/tim-cook-last-day-john-ternus-apple-ceo/", "category": "exec", "importance": 4, "wl": true, "topic": "애플 ceo 교체"}, {"title": "애플 '팀 쿡 시대' 종료…존 터너스 차기 CEO, 폴더블·AI 시험대", "summary": "팀 쿡 애플 최고경영자(CEO)가 15년 간의 임기를 마치고 존 터너스에게 경영권을 넘긴다. 터너스 신임 CEO는 첫 폴더블 아이폰 공개를 시작으로 인공지능(AI) 경쟁력 회복과 공급망 재편이라는 과제를 안고 새 체제를 시작한다. 쿡 전 CEO는 지난달 31일(이하 현지시간) 자신의 사회관계망서비스(SNS) 엑스(X)에 “CEO로서 마지막 날을 맞아 애플 커뮤니티에 많은 사랑을 전한다”며 “…", "source": "전자신문", "date": "2026-09-01 14:35", "url": "https://www.etnews.com/20260901000304", "category": "launch", "importance": 3, "wl": true, "topic": ""}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "삼성전자의 차세대 플래그십 스마트폰인 갤럭시 S27 및 S27 플러스 모델에 유의미한 카메라 업그레이드가 적용될 것이라는 전망이 제기되었다. 유출된 정보에 따르면, 이들 기본 및 플러스 모델은 상위 라인업인 S27 프로와 동일한 3배 광학 망원 카메라 시스템을 탑재할 예정이다. 그동안 울트라나 프로 모델에만 집중되었던 고성능 카메라 스펙이 하위 모델로 낙수 효과를 내는 셈이다. 이는 경쟁사들의 카메라 성능 상향 평준화에 대응해 기본 모델의 상품성을 대폭 강화하려는 전략으로 풀이된다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "quality", "importance": 3, "wl": true, "topic": "갤럭시 s27 카메라"}, {"title": "iPhone 18 Pro: Three reasons you might want to upgrade from iPhone 17 Pro", "summary": "다음 주 공개 예정인 애플의 차세대 플래그십 '아이폰 18 프로'의 주요 업그레이드 포인트가 유출되었다. 외신 보도에 따르면, 기존 아이폰 17 프로 사용자들의 기기 변경을 유도할 핵심 차별화 요소로 대폭 향상된 카메라 센서, 차세대 A시리즈 칩셋의 압도적인 AI 연산 성능, 그리고 새로운 디스플레이 기술이 꼽힌다. 비록 전작 출시 후 이른 시점이지만 프리미엄 스마트폰 교체 수요를 자극하기 위한 애플의 전략적 스펙 구성이 돋보인다. 삼성전자는 내년 초 출시될 갤럭시 S 시리즈의 하드웨어 및 AI 기능 경쟁력을 선제적으로 확보해야 한다.", "source": "9to5Mac", "date": "2026-09-01 05:21", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-three-reasons-you-might-want-to-upgrade-from-iphone-17-pro/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 18 출시"}, {"title": "Pixel 11 owners say their phones are waking up without being touched", "summary": "구글의 최신 스마트폰 '픽셀 11' 사용자들 사이에서 기기를 만지지 않았음에도 화면이 스스로 켜지는 오작동 현상이 보고되고 있다. 레딧 등 온라인 커뮤니티에 따르면, 특정 화면 깨우기 제스처의 감도가 지나치게 민감하게 설정되어 발생하는 소프트웨어 오류로 추정된다. 경쟁사 플래그십 제품의 초기 품질 이슈는 삼성 갤럭시의 반사이익 기회로 작용할 수 있다. 삼성은 자사 제품의 제스처 인식 알고리즘 완성도를 점검하고 안정적인 품질 우위를 강조할 필요가 있다.", "source": "Android Authority", "date": "2026-09-01 04:58", "url": "https://www.androidauthority.com/pixel-11-lift-to-check-phone-too-sensitive-3705133/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 결함"}, {"title": "iOS 27 beta 8 now available as Apple tests major Siri AI upgrade", "summary": "애플이 개발자들을 대상으로 차세대 모바일 운영체제인 'iOS 27'의 여덟 번째 베타 버전을 배포했다. 이번 베타 버전은 9월 공식 출시를 앞두고 시스템 안정성을 최종 점검하는 단계로, 특히 애플의 음성 AI 비서인 '시리(Siri)'의 대대적인 AI 업그레이드 성능 테스트에 초점이 맞춰져 있다. 시리는 더욱 자연스러운 대화 맥락 이해와 앱 간 유기적인 동작 제어가 가능해질 전망이다. 삼성전자는 빅스비(Bixby)의 생성형 AI 통합 및 갤럭시 AI 기능 고도화를 통해 이에 맞서야 한다.", "source": "9to5Mac", "date": "2026-09-01 02:12", "url": "https://9to5mac.com/2026/08/31/ios-27-beta-8/", "category": "policy", "importance": 3, "wl": true, "topic": "ios 27 업데이트"}, {"title": "Read Tim Cook’s final message to Apple staff as CEO", "summary": "Steve Jobs' successor carried the torch of the iPhone and built Apple into a global powerhouse with few rivals. Since becoming CEO in 2011, Tim Cook has led the company to become one of the most dominant forces in the da…", "source": "The Verge", "date": "2026-09-01 01:30", "url": "https://www.theverge.com/tech/986832/read-tim-cooks-final-message-as-ceo-to-apple-staff", "category": "exec", "importance": 3, "wl": true, "topic": ""}, {"title": "I compared the cameras on the Galaxy Z Fold 8 and Pixel 11 Pro Fold - and one pulled ahead", "summary": "I put the two phones' cameras to the test on a recent trip to Germany. It was close, but one phone edged out the other.", "source": "ZDNet", "date": "2026-09-01 00:50", "url": "https://www.zdnet.com/article/samsung-galaxy-z-fold-8-camera-vs-pixel-11-pro-fold-camera/", "category": "other", "importance": 3, "wl": true, "topic": ""}, {"title": "Galaxy Z Fold 8 is selling so well, Samsung is borrowing parts from the future", "summary": "삼성전자의 최신 폴더블폰인 갤럭시 Z 폴드8이 시장에서 예상치를 뛰어넘는 흥행을 기록하고 있다. 보도에 따르면 삼성은 급증하는 수요를 맞추기 위해 미래 부품 예비 비축분까지 끌어다 쓰며 생산 라인을 가동 중인 것으로 알려졌다. 이는 폴더블폰 대중화 단계에서 삼성이 확실한 시장 지배력을 유지하고 있음을 보여주는 지표다. 다만 부품 조기 소진에 따른 향후 공급망 관리(SCM) 부담을 최소화하기 위해 추가적인 부품 수급 대책 마련이 시급한 상황이다.", "source": "Android Authority", "date": "2026-09-01 00:18", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-8-ddi-demand-ramp-up-3704985/", "category": "launch", "importance": 3, "wl": true, "topic": "갤럭시 z 폴드8 출시"}, {"title": "New Android 17 QPR2 feature lets you peek inside your phone’s secure sandbox", "summary": "구글이 배포한 안드로이드 17 QPR2 베타 4 버전에서 보안 및 AI 통제 기능이 대폭 강화되었다. 이번 업데이트에는 기기 내 안전 지대인 '프라이빗 컴퓨팅 코어'의 데이터 로깅을 사용자가 직접 제어할 수 있는 대시보드가 추가되었다. 또한 기기에 설치된 AI 에이전트들의 활동을 실시간으로 모니터링하고 감독할 수 있는 전용 대시보드도 새롭게 도입되었다. 구글의 OS 차원 보안 강화 행보에 발맞춰, 삼성 갤럭시의 원 UI(One UI) 차기 버전에서도 관련 보안 기능을 선제적으로 통합할 필요가 있다.", "source": "Android Authority", "date": "2026-08-31 22:48", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-private-compute-core-data-logging-3704959/", "category": "policy", "importance": 3, "wl": true, "topic": "안드로이드 17 업데이트"}, {"title": "Scam Detection could be coming to Galaxy S27, but there’s also good news for older phones", "summary": "구글의 실시간 보이스 피싱 및 스캠 감지 기능이 삼성 갤럭시 S27 시리즈에 탑재될 가능성이 제기되었다. 이 기능은 온디바이스 AI를 활용해 통화 중 사기 의심 패턴을 실시간으로 분석하고 사용자에게 경고를 보내는 기술이다. 특히 최신 플래그십 모델뿐만 아니라 기존 구형 갤럭시 기기들에도 소프트웨어 업데이트를 통해 순차적으로 지원될 예정이다. 스마트폰 보 ne be quiet.", "source": "Android Authority", "date": "2026-09-01 05:06", "url": "https://www.androidauthority.com/device-help-android-17-3705148/", "category": "other", "importance": 2, "wl": true, "topic": ""}, {"title": "How to run Mario Kart 64 with native Metal rendering, high frame rate, and HD textures on ", "summary": "Love Mario Kart 64 and want to play it on iPhone? You may have tried Delta or another N64 emulator in the past to make that happen. And while that works, it’s now possible to run the classic cart racer with native Metal …", "source": "9to5Mac", "date": "2026-09-01 04:50", "url": "https://9to5mac.com/2026/08/31/how-to-run-mario-kart-64-with-native-metal-rendering-high-frame-rate-and-hd-textures-on-iphone-video/", "category": "other", "importance": 2, "wl": true, "topic": ""}, {"title": "Apple Might Add a Pencil to Its First Foldable, but Don’t Expect It at Launch", "summary": "Steve Jobs said in 2007 that “nobody wants a stylus” for the iPhone. That could change.", "source": "CNET", "date": "2026-09-01 03:43", "url": "https://www.cnet.com/tech/mobile/apple-might-add-a-pencil-to-its-first-foldable-but-dont-expect-it-at-launch/", "category": "launch", "importance": 2, "wl": true, "topic": ""}, {"title": "Pixel’s Now Playing is about to get its lost feature back, and we saw the proof", "summary": "Along with multi-user support, a sync functionality, and more.", "source": "Android Authority", "date": "2026-09-01 00:08", "url": "https://www.androidauthority.com/pixel-now-playing-notifications-sync-apk-teardown-3704928/", "category": "other", "importance": 2, "wl": true, "topic": ""}, {"title": "iPhone 18 Pro is coming: Here’s what’s new with each model", "summary": "iPhone 18 Pro will be unveiled next week on September 9 , with new Pro and Pro Max models debuting. Here’s what rumors say is new with each model. more…", "source": "9to5Mac", "date": "2026-08-31 23:06", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-is-coming-heres-whats-new-with-   {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
</html>
