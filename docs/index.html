"topic": "삼성 원유아이 9 글로벌 확대"}, {"title": "Samsung’s Galaxy S27 lineup takes shape in new leak", "summary": "삼성이 준비 중인 차기 플래그십 스마트폰 갤럭시 S27 라인업의 윤곽이 새로운 유출 이미지들을 통해 드러났습니다. 주목할 만한 변화와 함께 일부 사양의 생략이 관측되면서 시장의 관심을 모으고 있습니다. 삼성 MX사업부의 차기 플래그십 준비 상황을 보여주는 핵심 정보입니다.", "source": "Android Authority", "date": "2026-10-21 01:14", "url": "https://www.androidauthority.com/galaxy-s27-screen-protectors-leak-3725552/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 갤럭시 s27 유출"}, {"title": "Samsung Galaxy Z Fold 7 hits all-time low price with $655 off", "summary": "삼성전자의 갤럭시 Z 폴드 7이 주요 유통 채널에서 655달러 할인된 역대 최저가 프로모션으로 판매되기 시작했다. 애플의 아이폰 Duo 출시에 대응하여 고가 폴더블 스마트폰의 진입 장벽을 대폭 낮추고 시장을 선점하려는 전략이다. 연말 쇼핑 시즌을 앞두고 폴더블 구매를 망설이던 대기 수요를 강력히 흡수할 것으로 기대된다. 가격 경쟁력을 앞세워 경쟁사 신제품에 맞서 폴더블 주도권을 사수해야 한다.", "source": "Android Authority", "date": "2026-10-21 23:42", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-7-discount-3726172/", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시 z 폴드 7 할인"}, {"title": "Tech Giant Confirms the Samsung Galaxy S27 Ultra", "summary": "테크 업계를 통해 차기 플래그십 모델인 삼성 갤럭시 S27 울트라의 출시가 공식화 및 확인되었습니다. 혁신적인 하드웨어 업그레이드와 디자인 변경에 대한 기대감이 고조되고 있습니다. 차세대 스마트폰 시장의 주도권을 잡기 위한 개발이 순조롭게 진행 중임을 시사합니다.", "source": "Geeky Gadgets", "date": "2026-10-21 23:04", "url": "https://news.google.com/rss/articles/CBMiZ0FVX3lxTE9kUThvX2FFZkxkaUNUaXFPdEczbzRhVmI2U0ZrUnVBa2dOV3lXdUwySGg4UWl0TTZISzhUQlllZU50Rk4zOXBDYnB3b1ZGYk5YMkFxZ2F3UTh4MHNkX19MZk1CTWFtTzQ?oc=5", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시 s27 울트라 출시"}, {"title": "iPhone Duo Reviews Explain Why Device is Both 'Fun' and 'Frustrating'", "summary": "아이폰 Duo에 대한 종합 리뷰에서 대화면의 혁신적인 사용성은 매력적이나 페이스 ID 미탑재, 발열, 초기 앱 최적화 부족 등이 아쉬운 점으로 평가되었다. 애플의 첫 폴더블 기기로서의 높은 완성도와 1세대 제품의 기술적 한계가 공존한다는 결론이다. 시장의 초기 반응이 호평과 불만으로 양분되고 있다. 삼성전자는 6세대에 걸쳐 안정화된 갤럭시 Z 시리즈의 성숙한 완성도를 차별화 포인트로 내세워야 한다.", "source": "MacRumors", "date": "2026-10-21 22:45", "url": "https://www.macrumors.com/review/iphone-duo/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 duo 종합평가"}, {"title": "iPhone Duo review: The future is foldable", "summary": "아이폰 듀오 리뷰는 폴더블 폼팩터가 미래의 표준임을 시사하고 있습니다. 애플의 첫 폴더블 스마트폰으로서 시장에 던지는 파급력이 매우 큽니다. 혁신적인 폼팩터를 통한 스마트폰 시장의 새로운 경쟁 구도 형성이 주목됩니다.", "source": "9to5Mac", "date": "2026-10-21 21:00", "url": "https://9to5mac.com/2026/10/21/iphone-duo-review/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 리뷰"}, {"title": "This top-selling Samsung phone is finally getting stable One UI 9 with Android 17", "summary": "삼성전자의 글로벌 주력 스마트폰에 안드로이드 17 기반 안정화된 One UI 9 정식 업데이트가 배포되기 시작했다. 플래그십뿐만 아니라 대량 판매 볼륨 모델까지 신속한 OS 업데이트를 확대 적용하고 있다. 장기 사후 지원을 통해 글로벌 고객 만족도와 사용자 경험 완성도를 크게 끌어올렸다. 경쟁사 대비 신속한 소프트웨어 지원을 무기로 안드로이드 시장 리더십을 확고히 해야 한다.", "source": "Android Authority", "date": "2026-10-21 20:31", "url": "https://www.androidauthority.com/samsung-galaxy-a55-stable-one-ui-9-rollout-3725983/", "category": "launch", "importance": 4, "sid": "phone", "topic": "삼성 원유아이 정식 업데이트"}, {"title": "삼성전자 또 일냈다…中비보 제치고 2년여 만에 인도 스마트폰 ‘1위’", "summary": "삼성전자가 중국 비보를 제치고 약 2년여 만에 인도 스마트폰 시장 월간 1위 자리를 탈환했다. 갤럭시 A 시리즈와 S 시리즈의 동반 선전이 주효했다는 분석이다. 세계 최대 스마트폰 시장 중 하나인 인도에서 경쟁력을 회복했다는 점에서 큰 의미가 있다. 현지 맞춤형 판매 전략이 성과로 이어진 결과다.", "source": "sedaily.com", "date": "2026-10-21 20:22", "url": "https://www.sedaily.com/article/20104562", "category": "launch", "importance": 4, "sid": "phone", "topic": "인도 스마트폰 1위"}, {"title": "\"中 낸드 공세 맞선다\"…삼전·닉스, 현지 공장 경쟁력 강화 총력", "summary": "중국 메모리 기업들의 거센 추격에 맞서 삼성전자와 SK하이닉스가 미국의 대중국 반도체 장비 규제 범위 내에서 협의를 거쳐 현지 공정 개선과 최신 장비 도입을 추진하고 있다. 중국 생산거점의 경쟁력을 유지하기 위한 총력전을 펼치고 있다.", "source": "newsis.com", "date": "2026-10-21 20:18", "url": "https://www.newsis.com/view/NISX20261021_0003835506", "category": "exec", "importance": 4, "sid": "memchina", "topic": "메모리반도체 사건"}, {"title": "Video shows French Apple store being emptied by looters", "summary": "프랑스 내 시위 격화로 보르도와 릴 지역의 애플스토어가 시위대에 의해 습격당해 전시 기기들이 대거 약탈당했다. 매장 파손과 함께 단말들이 도난당했으 서 신제품 개발 속도와 완성도를 높이기 위한 조치다.", "source": "전자신문", "date": "2026-10-21 18:22", "url": "https://www.etnews.com/20261021000449", "category": "exec", "importance": 4, "sid": "memchina", "topic": "삼성전자 ds부문 메모리 신제품 개발 코어팀 신설"}, {"title": "Micron says rival DRAM design has ‘fundamental problems’: targets next-gen memory with 3D ", "summary": "마이크론이 경쟁사의 DRAM 설계에 근본적인 문제가 있다고 지적하며 3D 구조를 적용한 차세대 메모리 기술을 공개했다. 회사는 1-delta DRAM과 G11 낸드 기술을 2027년 하반기에 본격 양산할 계획이며 프로세서 위에 메모리를 직접 올리는 수직형 HBM도 소개했다.", "source": "msn.com", "date": "2026-10-21 18:18", "url": "https://www.msn.com/en-us/news/other/micron-says-rival-dram-design-has-fundamental-problems-targets-next-gen-memory-with-3d-dram-new-chips-planned-for-2027/ar-AA2fLaAX", "category": "launch", "importance": 4, "sid": "memchina", "topic": "마이크론 차세대 메모리 3d 기술"}, {"title": "Samsung’s first Android XR glasses face a design problem its competitor already solved", "summary": "삼성전자의 첫 번째 안드로이드 XR 글래스가 경쟁사 메타-레이밴이 극복한 일상용 안경 형태의 디자인 난제에 직면했다는 외신 지적이 나왔다. 첨단 광학 하드웨어 탑재도 중요하지만 대중 수용성을 위해서는 얇고 가벼운 안경 형태를 구현하는 것이 핵심 과제다. 무거운 폼팩터와 심미성 부족은 초기 시장 흥행의 큰 걸림돌이 될 수 있다. 인체공학적 경량화 설계와 패션성을 동시에 확보하는 폼팩터 완성이 요구된다.", "source": "Android Authority", "date": "2026-10-21 18:00", "url": "https://www.androidauthority.com/samsung-smart-glasses-face-problem-ray-ban-meta-solved-3725475/", "category": "launch", "importance": 4, "sid": "glasses", "topic": "삼성 xr 글래스 디자인 난제"}, {"title": "[르포] 백악관 스피커부터 애비 로드 녹음실까지…강남서 만난 '사운드 레전드'", "summary": "삼성전자가 하만 산하 브랜드들의 기념일을 맞아 특별 오디오 전시 행사 '사운드 레전드'를 서울 강남에서 개최합니다. 역사적인 오디오 명기들을 전시하며 하만의 음향 헤리티지를 고객들에게 전달할 계획입니다. 프리미엄 오디오 생태계를 아우르는 삼성전자의 오디오 브랜드 역량 강화 행보입니다.", "source": "ZDNet Korea", "date": "2026-10-21 18:00", "url": "https://zdnet.co.kr/view/?no=20261021161805", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성전자 하만 오디오 사운드레전드 행사 개최"}, {"title": "Loop Capital Cuts Apple Rating Over iPhone Sales Outlook", "summary": "루프 캐피털이 글로벌 수요 둔화와 교체 주기 장기화를 이유로 애플에 대한 투자의견을 전격 하향 조정했다. 신제품 출시에도 불구하고 스마트폰 시장 전반의 ews.com/20261020000374", "category": "policy", "importance": 5, "sid": "memchina", "topic": "딥시크 연방기관 퇴출"}, {"title": "운동하다 넘어진 남성…바지 주머니 속 휴대전화 '폭발'", "summary": "중국에서 배드민턴을 치던 남성이 넘어지는 충격으로 바지 주머니에 있던 휴대전화가 폭발해 중증 화상을 입는 사고가 발생했다. 해당 휴대전화는 구입한 지 두 달밖에 되지 않은 제품으로 확인되었다. 현장 CCTV 영상이 공개되면서 기기 안전성에 대한 우려가 커지고 있다. 소비자 안전과 직결된 사안으로 즉각적인 원인 파악이 필요하다.", "source": "전자신문", "date": "2026-10-20 16:58", "url": "https://www.etnews.com/20261020000366", "category": "quality", "importance": 5, "sid": "phone", "topic": "휴대전화 폭발 사고"}, {"title": "[Biz&Law] 삼성전자, 美 '버즈 프로' 특허소송 종결…웨어러블 리스크 일...", "summary": "버즈 프로와 스마트폰 을 연결하는 ' 갤럭시 웨어러블(Galaxy Wearable)' 애플리케이션(앱)과 공간 음향 최적화 기술인 '스페이스핏(SpaceFit)' 효과도 주요 침해 사례로 지목했다. 다만 이번 사건은 특허침해 성립 여부와...", "source": "the-biz.co.kr", "date": "2026-10-20 16:40", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=729596", "category": "quality", "importance": 5, "sid": "tws", "topic": ""}, {"title": "“귀에 꽂지 말고 걸치세요”…삼성이 만든 새로운 이어폰 보니", "summary": "삼성전자가 귀에 꽂지 않고 걸치는 혁신적인 디자인의 클립형 무선 이어폰 '갤럭시 버즈 온'을 선보였습니다. AI를 활용해 착용감을 개선하고 기존 오픈형 이어폰의 약점이었던 저음 부족과 소리 새는 현상을 대폭 보완한 것이 특징입니다.", "source": "mk.co.kr", "date": "2026-10-20 16:28", "url": "https://www.mk.co.kr/news/business/12180528", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 디자인"}, {"title": "삼성전자 11월 'AI 글래스' 전격 출시, 노태문 구글과 손잡고 메타 아성 도전장", "summary": "삼성전자가 오는 11월 노태문 사장을 필두로 구글과 손잡고 'AI 글래스'를 전격 출시하여 메타의 아성에 도전장을 던진다. 확장현실(XR) 및 AI 웨어러블 시장의 주도권을 잡기 위한 초강수다. 글로벌 빅테크 간의 치열한 폼팩터 전쟁이 예고된다.", "source": "businesspost.co.kr", "date": "2026-10-20 15:12", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=449800", "category": "launch", "importance": 5, "sid": "glasses", "topic": "ai 글래스 출시"}, {"title": "귀 안 막는 삼성 이어폰 나온다…첫 클립형 '갤럭시 버즈 온'", "summary": "삼성전자가 첫 클립형 무선 이어폰 '갤럭시 버즈 온'을 오는 27일 공식 출시합니다. 귀를 막지 않아 주변 소리를 들으면서도 콘텐츠를 감상할 수 있어 러너나 일상 사용자들에게 최적화된 설계를 갖췄습니다.", "source": "yna.co.kr", "date": "2026-10-20 13:31", "url": "https://www.yna.co.kr/view/AKR20261020049500017", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 공개"}, {"title": "갤럭시S27 울트라·프로 디자인 바뀐다…케이스 이미지 유출", "summary": "삼성전자가 내년 초 공개할 차세대 플래그십 스마트폰 갤럭시S27 시리즈 전체 라인업의 케이스 이미지가 유출됐다. 외신과 IT 팁스터 아이스유니버스를 통해 공개된 이미지에 따르면 기본 및 플러스 모델은 전작과 유사한 디자인을 유지할 것으로 보인다. 플래그십 라인업 출고를 앞두고 디자인 변화에 대한 정보가 확산하고 있다.", "source": "ZDNet Korea", "date": "2026-10-20 10:48", "url": "https://zdnet.co.kr/view/?no=20261020084624", "category": "launch", "importance": 5, "sid": "phone", "topic": "갤럭시s27 케이스 이미지"}, {"title": "AI Swallows Up Memory Supply, Smartphone Prices Surge 300% as Global Shipments Hit 'Worst ", "summary": "AI 산업의 급격한 메모리 수요 흡수로 인해 전 세계 메모리 공급난이 심화되면서 스마트폰 가격이 300% 폭등하고 글로벌 출하량이 최악의 타격을 입고 있다. 부품 단가 급등이 완성 스마트폰 제조사들의 원가 구조를 심각하게 압박하고 있다. 고가화 전략과 수익성 악화 사이에서 제조사들의 고심이 깊어지고 있다. 모바일 산업 전반의 비용 부담을 가중시키는 치명적인 악재로 작용 중이다.", "source": "hankyung.com", "date": "2026-10-20 08:55", "url": "https://www.hankyung.com/article/202610188979i", "category": "price", "importance": 5, "sid": "memchina", "topic": "메모리 가격 폭등"}, {"title": "갤럭시 8200만대에 디지털 달러 심는다…삼성전자, 스테이블코인 송금시장 출사표", "summary": "삼성전자가 미국 시장에서 8,200만 대의 갤럭시 스마트폰에 탑재된 삼성월렛을 통해 달러 기반 스테이블코인 해외 송금 서비스를 시작합니다. 별도의 가상자산 지갑 없이 모바일 지갑에서 직접 송금할 수 있어 스테이블코인 대중화의 전기가 될 전망입니다.", "source": "msn.com", "date": "2026-10-20 02:49", "url": "https://www.msn.com/ko-kr/news/other/갤럭시-8200만대에-디지털-달러-심는다-삼성전자-스테이블코인-송금시장-출사표/ar-AA2fCjs1", "category": "launch", "importance": 5, "sid": "wallet", "topic": "삼성월렛 스테이블코인"}, {"title": "Samsung’s Galaxy Tab S10 FE Plus gets a solid $220 discount", "summary": "삼성전자의 대화면 태블릿 '갤럭시 Tab S10 FE 플러스'가 아마존에서 220달러 대폭 할인된 599.99달러에 판매되고 있다. 13.1인치 대화면과 S펜 지원, 256GB 스토리지를 탑재한 가성비 모델로 주목받고 있다. 경쟁사 신제품 공세에 맞서 판매량을 방어하기 위한 가격 조정으로 분석된다.", "source": "Android Authority", "date": "2026-10-20 01:26", "url": "https://www.androidauthority.com/galaxy-tab-s10-fe-plus-deal-amazon-3725169/", "category": "price", "importance": 5, "sid": "tablet", "topic": "galaxy tab s10 fe plus 할인"}, {"title": "Samsung ha   {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}${srchLink(a)}</div></div>`;
}
function srchLink(a){
  if(!((a.url||"").includes("news.google.com")))return"";
  const q=encodeURIComponent('"'+(a.title||"").slice(0,80)+'"');
  return ` · <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700" title="링크가 차단될 때 제목으로 원문 검색">원문 검색</a>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
