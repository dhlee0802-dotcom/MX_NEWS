  .empty{color:var(--low);font-size:12.5px;padding:12px 0;text-align:center}
  .art{padding:10px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.quality{background:#fdeeee;color:#c0392b}
  .cat.launch{background:#e8f8ef;color:#1e8e4e}
  .cat.price{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#f0ebfa;color:#6c3fc5}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .cat.community{background:#fff6d9;color:#9a7b00}
  .sec-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
</style>

 실제 사용자들에게 제품이 배송되는 출하 시점은 아직 불확실한 상태이다. 폴더블폰 시장의 판도를 바꿀 애플의 첫 참전이라는 점에서 업계의 이목이 집중된다. 삼성전자의 폴더블 스마트폰 시장 리더십에 즉각적인 대응 전략 수립이 요구되는 중대 사안이다.", "source": "9to5Mac", "date": "2026-09-01 03:55", "url": "https://9to5mac.com/2026/08/31/iphone-ultra-release-timing-heres-what-the-latest-reporting-says/", "category": "launch", "importance": 5, "wl": true}, {"title": "Galaxy Z Fold 8 is selling so well, Samsung is borrowing parts from the future", "summary": "삼성전자의 갤럭시 Z 폴드 8이 시장에서 폭발적인 판매 호조를 보이면서, 수요를 맞추기 위해 미래에 사용될 부품 예비분까지 끌어다 쓰고 있다는 보도가 나왔다. 예상치를 웃도는 초기 흥행으로 인해 공급망 관리에 총력을 기울이고 있는 상황이다. 폴더블폰 시장에서 삼성의 압도적인 시장 지배력과 인기를 증명하는 매우 중요한 지표다.", "source": "Android Authority", "date": "2026-09-01 00:18", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-8-ddi-demand-ramp-up-3704985/", "category": "launch", "importance": 5, "wl": true}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "차기 플래그십 모델인 갤럭시 S27과 S27 플러스가 S27 프로와 동일한 3배속 망원 카메라 시스템을 채택하여 의미 있는 줌 카메라 성능 향상을 이룰 것이라는 유출 정보가 제기되었다. 카메라 하드웨어 스펙 강화를 통해 사용자 경험을 개선하려는 의도다. 삼성 플래그십 스마트폰의 카메라 경쟁력 유지에 핵심적인 변화다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "quality", "importance": 4, "wl": true}, {"title": "iPhone 18 Pro: Three reasons you might want to upgrade from iPhone 17 Pro", "summary": "다음 주 공개를 앞둔 아이폰 18 프로에 대해 전작인 아이폰 17 프로 사용자들의 업그레이드를 자극할 만한 3가지 핵심 기능이 존재할 것이라는 전망이 제기되었다. 비록 짧은 주기로 기기를 바꾸는 사용자는 적겠지만 신규 수요를 견인할 핵심 요인으로 작용할 전망이다. 애플의 차세대 플래그십 출시 임박에 따른 경쟁사 동향 파악에 중요하다. 삼성 갤럭시 S 시리즈의 마케팅 및 제품 차별화 전략에 시사점을 준다.", "source": "9to5Mac", "date": "2026-09-01 05:21", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-three-reasons-you-might-want-to-upgrade-from-iphone-17-pro/", "category": "launch", "importance": 4, "wl": true}, {"title": "Apple Might Add a Pencil to Its First Foldable, but Don’t Expect It at Launch", "summary": "스티브 잡스가 2007년 스타일러스 펜을 강하게 부정했던 것과 달리, 애플이 첫 폴더블 아이폰에 펜슬을 추가하는 방안을 검토하고 있다는 소식이 전해졌다. 다만 초기 출시 단계부터 포함될 것으로 기대하기는 이르다. 폴더블 스마트폰의 입력 방식 트렌드 변화와 삼성 S펜 전략에 시사점을 준다.", "source": "CNET", "date": "2026-09-01 03:43", "url": "https://www.cnet.com/tech/mobile/apple-might-add-a-pencil-to-its-first-foldable-but-dont-expect-it-at-launch/", "category": "launch", "importance": 4, "wl": true}, {"title": "I compared the cameras on the Galaxy Z Fold 8 and Pixel 11 Pro Fold - and one pulled ahead", "summary": "독일 여행 현장에서 삼성 갤럭시 Z 폴드 8과 구글 픽셀 11 프로 폴드의 카메라 성능을 직접 비교 테스트한 결과, 매우 박빙의 승부 끝에 한 쪽 모델이 근소한 차이로 우세를 점했다. 두 라이벌 폴더블폰의 사진 품질 및 이미징 기술력을 직접 맞붙여 평가한 결과다. 플래그십 폴더블폰의 카메라 경쟁력을 객관적으로 가늠하는 중요한 지표다.", "source": "ZDNet", "date": "2026-09-01 00:50", "url": "https://www.zdnet.com/article/samsung-galaxy-z-fold-8-camera-vs-pixel-11-pro-fold-camera/", "category": "quality", "importance": 4, "wl": true}, {"title": "iPhone 18 Pro is coming: Here’s what’s new with each model", "summary": "오는 9월 9일 공개될 예정인 아이폰 18 프로와 프로 맥스 모델의 새로운 기능과 루머들이 구체화되고 있다. 프로 라인업 전반의 하드웨어 및 소프트웨어 업그레이드가 예고되어 있다. 하반기 글로벌 스마트폰 시장에서 삼성전자 플래그십과의 정면 승부를 예고하는 핵심 정보이다.", "source": "9to5Mac", "date": "2026-08-31 23:06", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-is-coming-heres-whats-new-with-each-model/", "category": "launch", "importance": 4, "wl": true}, {"title": "There’s already another tri-fold phone on the market, and it’s not from Samsung", "summary": "삼성전자가 아닌 화웨이가 새로운 삼단 폴더블 스마트폰인 '메이트 XT 2'를 시장에 선보이며 트리폴드 폰 시장의 규모를 키우고 있다. 폴더블 폼팩터의 다변화가 가속화되는 양상이다. 삼성의 폴더블폰 독주 체제에 도전하는 중국 제조사의 폼팩터 혁신 동향을 파악하는 데 필수적이다.", "source": "Android Authority", "date": "2026-08-31 22:57", "url": "https://www.androidauthority.com/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 4, "wl": true}, {"title": "Here’s the likely reason the iPhone Ultra isn’t getting an Apple Pencil", "summary": "애플이 첫 폴더블 기기인 아이폰 울트라를 개발하는 과정에서 전용 애플 펜슬 출시를 검토했으나 최종적으로 제외하기로 결정한 배경이 전해졌다. 블룸버그는 이를 뒷받침하는 3가지 주요 원인을 분석했다. 폴더블 스마트폰의 사용성과 스타일러스 펜 탑재 여부에 대한 경쟁사의 전략적 판단을 보여준다. 삼성 갤럭시 Z 폴드 시리즈의 S펜 탑재 차별화 포인트와 직결된다.", "source": "9to5Mac", "date": "2026-08-31 20:06", "url": "https://9to5mac.com/2026/08/31/heres-the-likely-reason-the-iphone-ultra-isnt-getting-an-apple-pencil/", "category": "launch", "importance": 4, "wl": true}, {"title": "Scam Detection could be coming to Galaxy S27, but there’s also good news for older phones", "summary": "사기 전화나 보이스피싱을 예방하는 '스캠 감지(Scam Detection)' 기능이 차기 플래그십인 갤럭시 S27에 탑재될 가능성이 제기되었으며, 구형 기기 사용자들에게도 확대 적용될 좋은 소식이 전해졌다. AI 기반 보안 기능이 모바일 커뮤니케이션의 핵심 무기로 자리잡고 있다. 삼성의 온디바이스 AI 보안 경쟁력을 높이는 중요한 업그레이드다.", "source": "Android Authority", "date": "2026-08-31 18:38", "url": "https://www.androidauthority.com/google-scam-detection-samsung-galaxy-s27-apk-teardown-3704743/", "category": "quality", "importance": 4, "wl": true}, {"title": "Apple reportedly considered launching a new Apple Pencil for iPhone Ultra", "summary": "출시를 일주일 앞둔 애플의 첫 폴더블 아이폰 개발 과정에서 전용 애플 펜슬 도입이 검토되었던 것으로 알려졌다. 비록 초기 출시 모델에는 포함되지 않을 것으로 보이지만 폴더블 폼팩터에서의 입력 도구 활용 가능성을 열어두었다. 폴더블폰 시장의 폼팩터 경쟁에서 중요한 시사점을 제공한다.", "source": "9to5Mac", "date": "2026-08-30 23:38", "url": "https://9to5mac.com/2026/08/30/iphone-ultra-apple-pencil-support-tested/", "category": "launch", "importance": 4, "wl": true}, {"title": "Apple Pencil for iPhone Ultra Was Tested", "summary": "애플이 첫 폴더블 스마트폰인 아이폰 울트라를 위해 전용 애플 펜슬을 내부적으로 테스트했던 것으로 확인되었다. 최종 출시 모델에는 포함되지 않더라도 폴더블 폼팩터 확장성에 대한 고민을 엿볼 수 있다. 폴더블폰 시장의 기술 및 액세서리 트렌드 변화를 보여준다.", "source": "MacRumors", "date": "2026-08-30 23:27", "url": "https://www.macrumors.com/2026/08/30/apple-pencil-for-iphone-ultra-was-tested/", "category": "launch", "importance": 4, "wl": true}, {"title": "애플 “오픈AI, 아이폰 영업비밀 침해 증거 인멸 중”", "summary": "애플이 오픈AI를 상대로 제기한 영업비밀 침해 소송에서 오픈AI가 전직 아이폰 엔지니어를 통해 기밀 회로도를 도용한 데 이어 소송 국면에서 핵심 증거를 적극적으로 인멸하고 있다고 새로운 법원 서류를 통해 폭로했다. 양사 간의 법적 공방이 진실게임 양상으로 치닫고 있다.", "source": "전자신문", "date": "2026-09-01 08:08", "url": "https://www.etnews.com/20260901000007", "category": "quality", "importance": 3, "wl": true}, {"title": "Apple reveals ‘shocking evidence’ from ex-employee’s MacBook in OpenAI suit", "summary": "애플이 오픈AI를 상대로 제기한 소송에서 가속화된 증거 개수를 추진하는 가운데 전직 엔지니어의 맥북 포렌식 검사를 통해 새로운 '충격적 증거'를 확보했다고 법원에 제출했다. 아이폰 관련 영업비밀 침해 공방이 법적 다툼으로 격화되고 있다. 주요 빅테크 간의 기술 유출 및 지식재산권 분쟁 동향을 보여준다.", "source": "9to5Mac", "date": "2026-09-01 05:20", "url": "https://9to5mac.com/2026/08/31/apple-openai-forensic-macbook-evidence/", "category": "quality", "importance": 3, "wl": true}, {"title": "PSA: Gemini can adjust system settings on any Pixel running Android 17", "summary": "안드로이드 17을 구동하는 모든 픽셀 기기에서 제미니(Gemini) 인공지능이 음성 명령을 통해 기기의 시스템 설정을 직접 조작할 수 있는 기능이 추가되었다. '폰을 조용히 해달라'는 식의 자연어 제어가 가능하다. 모바일 OS 내 AI 에이전트의 권한 확대와 사용자 편의성 강화 트렌드를 보여준다.", "source": "Android Authority", "date": "2026-09-01 05:06", "url": "https://www.androidauthority.com/device-help-android-17-3705148/", "category": "quality", "importance": 3, "wl": true}, {"title": "Satellite SOS just proved why it could be your phone’s most important feature", "summary": "네팔 홍수 재난 상황에서 스마트폰의 위성 SOS 연결 기능 덕분에 한 생존자가 구조대에 성공적으로 연락하여 목숨을 구할 수 있었다. 위성 통신 기능이 극한의 재난 상황에서 필수적인 생명줄 역할을 함이 다시 한번 입증되었다. 스마트폰의 비상 통신 및 위성 기능 탑재의 중요성을 강조하는 사례다.", "source": "Android Authority", "date": "2026-09-01 02:43", "url": "https://www.androidauthority.com/satellite-connectivity-saves-life-of-man-3705087/", "category": "quality", "importance": 3, "wl": true}, {"title": "iOS 27 beta 8 now available as Apple tests major Siri AI upgrade", "summary": "애플이 9월 정식 출시를 앞두고 대규모 Siri AI 업그레이드가 포함된 iOS 27의 8번째 개발자 베타 버전을 배포했다. 여름 베타 사이클의 막바지에 이르러 AI 기능의 완성도를 높이는 데 주력하고 있다. 모바일 인공지능 분야의 경쟁 구도에서 경쟁사의 소프트웨어 준비 상황을 파악하는 데 중요한 정보이다.", "source": "9to5Mac", "date": "2026-09-01 02:12", "url": "https://9to5mac.com/2026/08/31/ios-27-beta-8/", "category": "quality", "importance": 3, "wl": true}, {"title": "How Android 17 stops network snoops and SMS blasters now - with ECH and a 2G kill switch", "summary": "최신 안드로이드 17 업데이트에 Encrypted Client Hello(ECH) 전면 지원 및 2G 킬 스위치 등의 기능이 추가되어 네트워크 스누핑과 SMS 블스터     html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    const latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
