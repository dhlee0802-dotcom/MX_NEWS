리 체계 점검이 필요하다.", "source": "전자신문", "date": "2026-10-08 15:52", "url": "https://www.etnews.com/20261008000295", "category": "quality", "importance": 5, "wl": true, "topic": "아이폰18 프로 패닉풀", "alert": false}, {"title": "Samsung reportedly can’t make a profit on its phones, so it’s cutting production by millio", "summary": "삼성전자가 스마트폰 사업에서 이익을 내지 못하는 상황에 직면해 수익성 확보를 위해 스마트폰 생산량을 수백만 대 규모로 감축하기로 했다고 보도됐다. 적자를 보며 제품을 대량 판매하기보다는 출하량을 줄여서라도 마진을 방어하겠다는 전략적 판단이다. 글로벌 스마트폰 수요 정체와 원가 상승 압박 속에서 내린 고육지책으로 해석된다. 삼성 MX사업부의 수익성 중심 경영 전환과 실적에 중대한 영향을 미치는 사안이다.", "source": "Android Authority", "date": "2026-10-08 12:46", "url": "https://www.androidauthority.com/samsung-smartphone-production-cut-3720540/", "category": "launch", "importance": 5, "wl": true, "topic": "삼성 스마트폰 수익성 악화 생산 감축", "alert": false}, {"title": "Some cheap Android phones are shipping with malware baked in", "summary": "일부 저가 안드로이드 스마트폰 제품들에 '미드나이트 미모사(Midnight Mimosa)' 등의 악성코드(멀웨어)가 공장에서부터 기본 탑재(Pre-installed)되어 출하되고 있는 것으로 밝혀졌다. 저가형 모바일 디바이스의 공급망 보안 및 소프트웨어 무결성에 심각한 구멍이 뚫렸음을 보여준다. 사용자 개인정보 탈취 및 보안 사고 위험이 극대화된 사안이다. 모바일 보안 업계와 제조사들의 철저한 공급망 검증 조치가 시급하다.", "source": "Android Authority", "date": "2026-10-08 22:00", "url": "https://www.androidauthority.com/midnight-mimosa-malware-android-phones-3720493/", "category": "quality", "importance": 4, "wl": true, "topic": "저가 안드로이드 폰 멀웨어 사전탑재", "alert": true}, {"title": "I spent a month with One UI 9, and these are the 9 best features you need to try", "summary": "삼성전자의 차세대 모바일 인터페이스인 '원 UI 9(One UI 9)'을 한 달간 직접 사용해본 결과, 꼭 시도해봐야 할 최고의 기능 9가지가 소개되었다. 오랜 기다림 끝에 선보인 이번 UI 업데이트는 사용자 경험의 큰 도약을 이뤄냈다는 호평을 받고 있다. 갤럭시 스마트폰의 소프트웨어 경쟁력을 한층 끌어올리는 핵심 요소다. 모바일 사용자 인터페이스 시장에서 삼성의 기술력을 입증하는 대목이다.", "source": "Android Authority", "date": "2026-10-08 19:00", "url": "https://www.androidauthority.com/one-ui-9-best-features-hands-on-3718782/", "category": "launch", "importance": 4, "wl": true, "topic": "원 ui 9 주요 기능 리뷰", "alert": false}, {"title": "The 512GB Samsung Galaxy S26 gets a rare 25% Prime Day discount", "summary": "아마존 프라임데이를 맞아 삼성전자 2026년형 플래그십 스마트폰 '갤럭시 S26' 512GB 모델에 25% 할인율이 적용되었다. 이번 할인으로 출고가에서 300달러가 인하되어 행사가 마감되기 전 소비자들이 플래그십 모델을 더 저렴하게 구매할 수 있게 되었다. 신제품 출시 초기임에도 대형 유통업체를 통한 공격적인 가격 프로모션이 진행되는 양상이다. 이는 초기 판매량 확대와 시장 점유율 방어에 긍정적인 영향을 미칠 것으로 분석된다.", "source": "Android Authority", "date": "2026-10-08 00:01", "url": "https://www.androidauthority.com/512gb-samsung-galaxy-s26-deal-3720319/", "category": "price", "importance": 4, "wl": true, "topic": "갤럭시 s26 가격", "alert": false}, {"title": "Apple overtakes Samsung to lead European carrier smartphone sales in Q2, per report", "summary": "카운터포인트리서치 보고서에 따르면, 2026년 2분기 유럽 통신사 채널 스마트폰 판매에서 애플이 삼성전자를 제치고 1위 브랜드에 올랐다. 통신사 유통망에서 통신사들의 판매 실적이 제조사 자체 브랜드력보다 상대적으로 잘 방어되면서 순위 변동이 일어났다. 유럽 프리미엄 스마트폰 시장에서 삼성전자의 점유율 방어에 비상등이 켜졌다. 경쟁사의 현지 유통 채널 공략 강화에 대한 즉각적인 대응 전략 수립이 필요하다.", "source": "9to5Mac", "date": "2026-10-07 11:00", "url": "https://9to5mac.com/2026/10/06/apple-overtakes-samsung-to-lead-european-carrier-smartphone-sales-in-q2-per-report/", "category": "launch", "importance": 4, "wl": true, "topic": "유럽 스마트폰 시장 애플 1위 등극", "alert": false}, {"title": "Google is launching a one-stop Gemini agent for your work tasks", "summary": "구글이 업무 작업을 위한 통합형 '제미나이 에이전트'를 출시했다. 새로운 AI 에이전트는 사용자의 다양한 업무 태스크를 하나의 플랫폼에서 효율적으로 처리할 수 있도록 지원한다. 생산성 향상을 위한 인공지능 기능이 대폭 강화되었다. 모바일 및 PC 생태계 전반에서 구글의 AI 서비스 경쟁력이 한층 높아질 전망이다.", "source": "The Verge", "date": "2026-10-08 23:28", "url": "https://www.theverge.com/tech/1007904/google-gemini-ai-agent-enterprise", "category": "launch", "importance": 3, "wl": true, "topic": "구글 제미나이 에이전트 출시", "alert": false}, {"title": "iPhone Air 2 Could Be as Thin as an Unfolded iPhone Duo", "summary": "차기 모델로 예상되는 '아이폰 에어 2'의 두께가 완전히 펼쳐진 아이폰 듀오 수준만큼이나 극도로 얇아질 수 있다는 루머가 제기됐다. 스마트폰의 슬림화 경쟁이 극한의 두께 한계에 도전하고 있다. 초슬림 디자인을 구현하기 위한 새로운 소재 및 부품 기술 적용이 필수적이다. 향후 모바일 폼팩터 트렌드에 큰 영향을 미칠 전망이다.", "source": "MacRumors", "date": "2026-10-08 20:21", "url": "https://www.macrumors.com/2026/10/08/iphone-air-2-could-be-as-thin-unfolded-iphone-duo/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 에어 2 두께 루머", "alert": false}, {"title": "Googlebooks could soon get one of Apple’s best ecosystem tricks, but do it better", "summary": "새로운 셋업 화면을 통해 구글북스(Googlebook)가 안드로이드 기기와 연동되는 '폰 언록(Phone Unlock)' 기능을 어떻게 구현할 예정인지 그 구체적 모습이 드러났다. 애플 에코시스템의 연동 기능을 벤치마킹하여 크로스 기기 사용성을 대폭 개선하려는 시도다. 모바일과 PC 생태계 간의 심리스한 연결성이 핵심 경쟁력으로 부상하고 있다.", "source": "Android Authority", "date": "2026-10-08 18:19", "url": "https://www.androidauthority.com/googlebook-android-phone-unlock-apk-teardown-3720577/", "category": "launch", "importance": 3, "wl": true, "topic": "구글북스 폰 언록 생태계 연동", "alert": false}, {"title": "Still not using Pixel VIPs? Here’s how to set it up on your Pixel phone right now", "summary": "구글 픽셀 스마트폰의 전용 기능인 '픽셀 VIPs(Pixel VIPs)'가 드디어 홈 화면에서 유용하게 쓸 수 있는 실용적인 위젯으로 재탄생하여 설정 방법이 소개되었다. 사용자 맞춤형 홈 화면 커스텀 기능을 강화하려는 구글의 소프트웨어 전략의 일환이다. 픽셀 기기만의 차별화된 사용자 경험을 제공하고 있다.", "source": "Android Authority", "date": "2026-10-08 18:00", "url": "https://www.androidauthority.com/pixel-vips-widget-how-to-use-3719994/", "category": "launch", "importance": 3, "wl": true, "topic": "픽셀 vips 위젯 설정 방법", "alert": false}, {"title": "Your Pixel can turn into a mini TV studio, now in 11 more apps", "summary": "구글이 픽셀 스마트폰의 '커넥티드 카메라(Connected Camera)' 기능을 줌, 팀즈, 슬랙 등 11개의 인기 업무용 앱으로 대폭 확대 적용한다. 스마트폰을 고화질 웹캠으로 활용할 수 있는 연결성이 크게 강화되었다. 원격 근무 및 화상 회의 환경에서 모바일 기기의 활용도를 극대화하는 소프트웨어 업데이트다.", "source": "Android Authority", "date": "2026-10-08 17:44", "url": "https://www.androidauthority.com/google-pixel-connected-camera-11-new-apps-update-3720619/", "category": "launch", "importance": 3, "wl": true, "topic": "픽셀 커넥티드 카메라 앱 확대", "alert": false}, {"title": "First look: This Pro Max Android phone is everything the iPhone isn’t", "summary": "글로벌 시장에 출시된 '파인 X10 프로 맥스(Find X10 Pro Max)' 프로 맥스 안드로이드폰에 대한 첫 핸즈온 리뷰가 공개되었다. 루머로 돌던 높은 가격대에 걸맞은 프리미엄 디자인과 최고급 사양을 입증해 보였다. 아이폰 프로 맥스 시리즈와 대척점에 선 강력한 안드로이드 플래그십 모델의 등장을 알린다.", "source" , "url": "https://www.androidauthority.com/samsung-smartphone-production-cut-3720540/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 스마트폰 수익성 악화 생산 감축"}, {"title": "갤럭시·구글 픽셀도 뚫리는 해킹 구멍, 서울대 연구진이 발견했다 - 한국경제", "summary": "서울대 연구진이 갤럭시 및 구글 픽셀 스마트폰에서 해킹이 가능한 보안 취약점을 발견했습니다. 기기 내 데이터 유출 및 제어권 탈취 위험이 있어 즉각적인 보안 조치가 필요합니다. 삼성전자는 해당 취약점에 대한 패치 개발 및 배포를 서두르고 있습니다. 사용자 안전을 위한 긴급 대응이 요구되는 사안입니다.", "source": "한국경제", "date": "2026-10-08 11:42", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE92QnBZYkxmR09tM01pQ1FPamdKSzZQTFM4RlUySENFbTlpbE96YWxZWjJZNjdINjBTWm96TnZJbEJfaE9ZTkZUZER0Ri1fUmdCdTRoNGZ1N285UQ?oc=5", "category": "quality", "importance": 5, "sid": "phone", "topic": "갤럭시 보안 취약점"}, {"title": "Apple Watch Series 12, Ultra 4 Owners Report Skin Irritation", "summary": "애플워치 시리즈 12 및 울트라 4 사용자들 사이에서 피부 트러블 문제가 보고되고 있습니다. 이는 제품 소재나 착용 방식에 따른 품질 이슈로 보이며, 사용자들의 불만이 제기되고 있습니다. 당사 역시 웨어러블 기기 착용 시 발생할 수 있는 피부 안전성 이슈를 선제적으로 점검하고, 고객 대응 매뉴얼을 재정비해야 합니다.", "source": "MacRumors", "date": "2026-10-08 04:02", "url": "https://www.macrumors.com/2026/10/07/apple-watch-series-12-skin-irritation/", "category": "quality", "importance": 5, "sid": "watch", "topic": "애플워치 피부 트러블"}, {"title": "Amazon’s Alexa Tablets are coming for the iPad", "summary": "아마존이 지난 15년간 사용해온 '파이어' 브랜드 명칭을 버리고 애플 아이패드를 정조준한 새로운 태블릿 라인업을 출시했다. 기존 저가 이미지에서 탈피해 완전히 새로운 디자인과 사양으로 무장한 제품들을 선보였다. 태블릿 시장에서 독주 체제를 굳힌 애플에 대항하는 강력한 도전자 등장을 예고한다. 엔터테인먼트 및 일반 소비자를 위한 생태계 확장에 나서고 있다.", "source": "The Verge", "date": "2026-10-08 22:00", "url": "https://www.theverge.com/tech/1007648/amazon-alexa-tablets-price-specs", "category": "launch", "importance": 4, "sid": "tablet", "topic": "아마존 알렉사 태블릿 아이패드 대항마"}, {"title": "Some cheap Android phones are shipping with malware baked in", "summary": "일부 저가 안드로이드 스마트폰 제품들에 '미드나이트 미모사(Midnight Mimosa)' 등의 악성코드(멀웨어)가 공장에서부터 기본 탑재(Pre-installed)되어 출하되고 있는 것으로 밝혀졌다. 저가형 모바일 디바이스의 공급망 보안 및 소프트웨어 무결성에 심각한 구멍이 뚫렸음을 보여준다. 사용자 개인정보 탈취 및 보안 사고 위험이 극대화된 사안이다. 모바일 보안 업계와 제조사들의 철저한 공급망 검증 조치가 시급하다.", "source": "Android Authority", "date": "2026-10-08 22:00", "url": "https://www.androidauthority.com/midnight-mimosa-malware-android-phones-3720493/", "category": "quality", "importance": 4, "sid": "phone", "topic": "저가 안드로이드 폰 멀웨어 사전탑재"}, {"title": "반도체 ETF 리밸런싱에 변동성 커져…삼성전자 2000억 팔고 소부장 더 담는다", "summary": "국내 반도체 상장지수펀드(ETF)의 정기 리밸런싱이 단행됨에 따라 대형주 비중 조정 과정에서 삼성전자에 매도 압력이 발생하는 반면 일부 소부장 종목으로 신규 매수 수요가 유입되는 수급 재편이 나타났다. 총 23조원 규모의 국내 주식형 ETF 중 반도체 관련 ETF가 대부분을 차지하며 증시 변동성에 영향을 미치고 있다. AI 메모리 수요 확대 속에서 국내 반도체 대형주와 소부장 생태계 간의 자금 흐름 변화를 보여주는 중요한 시장 동향이다. 경영진의 투자 및 주가 관리 전략 수립에 참고가 된다.", "source": "전자신문", "date": "2026-10-08 21:55", "url": "https://www.etnews.com/20261008000326", "category": "policy", "importance": 4, "sid": "memchina", "topic": "반도체 etf 리밸런싱"}, {"title": "Samsung Electronics announces its earnings guidance for Q3 2026 - GSMArena.com news - GSMA", "summary": "삼성전자가 2026년 3분기 실적 가이드라인을 공식 발표했다. 회사의 전반적인 경영 실적과 사업부별 성과를 가늠할 수 있는 지표다. 글로벌 시장 투자자와 업계의 이목이 집중되는 공식 발표다.", "source": "GSMArena.com", "date": "2026-10-08 19:04", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE42YkEwT0lTRWRMZmxCbENrYUg2TVVLNndnM0tUX0RFdlJSUVRsekk2MTFFbXR5M1FYZ0VQUWVlaG4yb2hPX0g3cDI5S0ZyTTNxN0dEZlBrWWh0aDRadzRRUWRqLVkwRjNNTk9abzR6N2Y3OXNHaUFFLUN5ZDhrZ9IBekFVX3lxTE45OF9PZ3RZU3U3SVctWXJLbUNibjF4MlZjYkxBS3FRTVJpWHpGNlhxVXJYd0RnelVBbUdkVk9TVzBKX3JUWVdpb1BHQnJaOUF3NUVHZzdFZ0YwX0VmTkM3VDkwX2ZNOS11QWV0RUdUTm0yaUFueGRQN1hR?oc=5", "category": "exec", "importance": 4, "sid": "phone", "topic": "삼성전자 q3 실적 가이드라인"}, {"title": "I spent a month with One UI 9, and these are the 9 best features you need to try", "summary": "삼성전자의 차세대 모바일 인터페이스인 '원 UI 9(One UI 9)'을 한 달간 직접 사용해본 결과, 꼭 시도해봐야 할 최고의 기능 9가지가 소개되었다. 오랜 기다림 끝에 선보인 이번 UI 업데이트는 사용자 경험의 큰 도약을 이뤄냈다는 호평을 받고 있다. 갤럭시 스마트폰의 소프트웨어 경쟁력을 한층 끌어올리는 핵심 요소다. 모바일 사용자 인터페이스 시장에서 삼성의 기술력을 입증하는 대목이다.", "source": "Android Authority", "date": "2026-10-08 19:00", "url": "https://www.androidauthority.com/one-ui-9-best-feature 10-02 16:52", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=728751", "category": "quality", "importance": 5, "sid": "watch", "topic": ""}, {"title": "아이폰 듀오 생산 난항에 거센 비판…\"이럴 거면 왜 7년 기다렸나\"", "summary": "애플의 첫 폴더블폰 아이폰 듀오가 생산 난항과 비판에 직면했다. 신제품 성패는 존 터너스 CEO의 입지에 영향을 미칠 전망이다. 폴더블폰 초기 양산 및 품질 관리 능력이 시험대에 올랐다.", "source": "ZDNet Korea", "date": "2026-10-02 16:32", "url": "https://zdnet.co.kr/view/?no=20261002144140", "category": "quality", "importance": 5, "sid": "phone", "topic": "아이폰 듀오 생산 난항"}, {"title": "\"어제 살걸, 하루 만에 27만원 올랐다\"... 메모리값 폭등에, 삼성폰 값 '깜짝' - v.daum.net", "summary": "메모리 반도체 가격의 폭등 여파로 하루 만에 삼성 스마트폰 가격이 27만 원이나 급등하는 소동이 벌어졌다. 소비자들이 갑작스러운 가격 인상에 큰 혼란을 겪으며 구매를 망설이고 있다. 원가 압박을 견디지 못한 제조사의 가격 현실화가 완제품 시장에 직접적인 충격을 주고 있다. 스마트폰 수요 위축을 가속화할 위험이 크다.", "source": "v.daum.net", "date": "2026-10-02 11:08", "url": "https://news.google.com/rss/articles/CBMiRkFVX3lxTE9ibnZXYkZrRFhhVFM4cTNVeHBWVlQtMXRHQ3Qyc0V0VnRpa1VGLURTcWhZVFZBMFpCTjdOZDZUbHFubmJTVWc?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "메모리값 폭등 삼성폰 가격 27만원 인상"}, {"title": "메모리값 급등에 삼성·애플 스마트폰 가격 올렸다 - 프라임경제", "summary": "메모리 반도체 가격의 가파른 급등 여파로 삼성전자와 애플 등 글로벌 스마트폰 제조사들이 일제히 제품 출고가를 인상했다. 부품 수급난과 인플레이션 압박이 모바일 완제품 시장의 가격 상승을 주도하고 있다. 전 세계 소비자들이 고가 스마트폰 구매에 큰 부담을 느끼는 국면에 접어들었다. 제조사들의 수익성 방어와 판매량 유지 전략이 시험대에 올랐다.", "source": "프라임경제", "date": "2026-10-02 10:40", "url": "https://news.google.com/rss/articles/CBMiZkFVX3lxTE5mSEtjbi1yeTZjRkxKV18yZk5DUDJvYnU4Rm54S3l4SGc3RFRqRTg4bXluTnVkdHhGSk5faWUzMG91akJIdUV0cjB1T2xSdlNER1UyYmRNQzhMUUZVOEZJREZ1WkZKQQ?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "메모리값 급등 삼성 애플 스마트폰 가격 인상"}, {"title": "갤S26부터 태블릿까지 인상…삼성도 못 피한 원가 부담 - v.daum.net", "summary": "갤럭시 S26 스마트폰부터 최신 태블릿 라인업에 이르기까지 삼성전자의 주요 모바일 기기 가격이 줄줄이 인상되었다. 글로벌 부품 원가 상승과 메모리 대란의 직격탄을 피하지 못한 결과다. 제조사 역시 치솟는 원가 부담을 더 이상 감내하기 어려운 상황에 직면했음을 보여준다. 모바일 사업부의 수익성 방어와 소비자 저항 사이의 줄다리기가 본격화되었다.", "source": "v.daum.net", "date": "2026-10-02 10:09", "url": "https://new <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
