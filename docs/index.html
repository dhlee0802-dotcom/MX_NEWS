 요동치고 있다.", "source": "전자신문", "date": "2026-10-22 13:50", "url": "https://www.etnews.com/20261022000263", "category": "launch", "importance": 4, "sid": "memchina", "topic": "창신메모리 4f스퀘어 d램 양산 임박"}, {"title": "Apple must open iPhone to alternative app stores in Australia after Epic Games ruling", "summary": "호주 법원이 에픽게임즈와의 반독점 소송에서 애플에 앱스토어 규정을 대폭 개정하고 대체 앱 마켓을 허용하라는 명령을 내렸다. 이에 따라 애플은 호주 시장에서 폐쇄적인 인앱 결제 및 단독 앱스토어 구조를 개방해야 할 처지에 놓였으며, 애플은 즉각 항소 의사를 밝혔다. 유럽 DMA에 이어 아태지역에서도 빅테크 플랫폼 개방 압박이 본격화되고 있다. 갤럭시 스토어의 글로벌 영토 확장 기회 및 오픈 생태계 전략에 시사점을 준다.", "source": "9to5Mac", "date": "2026-10-22 12:57", "url": "https://9to5mac.com/2026/10/21/apple-must-open-iphone-to-alternative-app-stores-in-australia-after-epic-games-ruling/", "category": "policy", "importance": 4, "sid": "phone", "topic": "애플 반독점법원"}, {"title": "Google’s Gemini Intelligence has a new Android competitor, and it’s ready to get things do", "summary": "앤트로픽이 안드로이드 운영체제에서 구글 제미나이와 직접 경쟁할 자율형 모바일 AI 비서 클로드 Duet을 출시했다. 사용자를 대신해 앱 간 작업을 자율적으로 실행하고 이메일 및 캘린더 관리를 백그라운드에서 완수하는 능력을 갖췄다. 안드로이드 모바일 기기 내 차세대 AI 에이전트 주도권 경쟁이 본격 점화되었다. 갤럭시 단말에 최적화된 독자 AI 에이전트 경험 구축이 시급하다.", "source": "Android Authority", "date": "2026-10-22 12:34", "url": "https://www.androidauthority.com/claude-duet-android-app-launch-capabilities-features-3726465/", "category": "launch", "importance": 4, "sid": "phone", "topic": "클로드 duet 경쟁"}, {"title": "쿠팡 ‘납치광고’ 제재 임박…방미통위 \"심의·의결 단계”", "summary": "사용자가 의도하지 않아도 쿠팡 앱으로 강제 이동시키는 이른바 납치광고에 대해 방송미디어통신위원회가 전기통신사업법 위반 제재 심의에 돌입했습니다. 개인정보보호위원회의 과징금 부과에 이어 통신 당국의 법적 제재 수위가 결정될 예정입니다. 모바일 웹 서핑 중 불법 리디렉션 광고에 대한 정부의 강력한 규제가 임박했습니다. 갤럭시 기본 브라우저 내 악성 리디렉션 차단 알고리즘을 점검해야 합니다.", "source": "ZDNet Korea", "date": "2026-10-22 12:10", "url": "https://zdnet.co.kr/view/?no=20261022121041", "category": "policy", "importance": 4, "sid": "phone", "topic": "쿠팡 납치광고"}, {"title": "Apple Limitis iPhone Duo Purchases to 2 Foldable Phones Per Person", "summary": "애플이 신규 폴더블 스마트폰 아이폰 듀오의 1인당 구매 수량을 2대로 제한하기 시작했습니다. 수년 만에 도입된 구매 수량 제한으로 www.macrumors.com/review/iphone-duo/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 duo 종합평가"}, {"title": "iPhone Duo adding Apple Pencil support next week with iOS 27.2", "summary": "아이폰 듀오가 다음 주 배포되는 OS 업데이트를 통해 예상보다 빠르게 애플 펜슬 지원을 공식 추가할 예정입니다. 대화면 폴더블 디스플레이를 활용한 필기와 드로잉 기능이 조기에 완성됩니다. 갤럭시 Z 폴드의 핵심 차별화 요소였던 S펜 생산성 기능에 강력한 경쟁자가 등장했습니다. 폴더블 스타일러스 사용자 경험의 비교 우위 점검이 시급합니다.", "source": "9to5Mac", "date": "2026-10-21 22:42", "url": "https://9to5mac.com/2026/10/21/iphone-duo-adding-apple-pencil-support-next-week-with-ios-27-2/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 애플 펜슬"}, {"title": "삼성월렛 머니·포인트, 1년 새 300만명…포인트·해외결제 기능 넓힌다", "summary": "삼성전자의 충전식 간편결제 서비스 ‘삼성월렛 머니·포인트’가 출시 1주년을 맞아 가입자 300만 명을 돌파했다. 삼성전자는 이에 발맞추어 포인트 등급제 도입과 해외 결제 기능 지원 등 신규 기능을 추가하며 서비스 영역을 확장한다.", "source": "straightnews.co.kr", "date": "2026-10-21 22:10", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=313691", "category": "launch", "importance": 4, "sid": "wallet", "topic": "삼성월렛머니포인트 300만"}, {"title": "iPhone Duo review: The future is foldable", "summary": "9to5Mac의 메인 리뷰에서 아이폰 듀오를 가리켜 폴더블의 미래를 증명한 최고의 제품이라고 종합 평가를 내렸습니다. 애플 특유의 하드웨어 마감과 앱 연계성이 폴더블 시장의 표준을 높였다는 분석입니다. 기존 안드로이드 주도의 폴더블 시장 판도가 급변하고 있습니다. 갤럭시 Z 폴드의 하드웨어 슬림화 및 AI 차별화 전략이 더욱 절실해졌습니다.", "source": "9to5Mac", "date": "2026-10-21 21:00", "url": "https://9to5mac.com/2026/10/21/iphone-duo-review/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 미래 폴더블"}, {"title": "This top-selling Samsung phone is finally getting stable One UI 9 with Android 17", "summary": "삼성전자의 글로벌 주력 스마트폰에 안드로이드 17 기반 안정화된 One UI 9 정식 업데이트가 배포되기 시작했다. 플래그십뿐만 아니라 대량 판매 볼륨 모델까지 신속한 OS 업데이트를 확대 적용하고 있다. 장기 사후 지원을 통해 글로벌 고객 만족도와 사용자 경험 완성도를 크게 끌어올렸다. 경쟁사 대비 신속한 소프트웨어 지원을 무기로 안드로이드 시장 리더십을 확고히 해야 한다.", "source": "Android Authority", "date": "2026-10-21 20:31", "url": "https://www.androidauthority.com/samsung-galaxy-a55-stable-one-ui-9-rollout-3725983/", "category": "launch", com/ko-kr/money/topstories/삼성전자-첫-클립형-이어폰-갤럭시-버즈-온-공개-27일-출시/ar-AA2fDm9C", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시 버즈 온 공개"}, {"title": "\"착용감·음질 다 잡았다\" 삼성, 귀 안막는 '클립형 이어폰' 승부", "summary": "삼성전자가 갤럭시 버즈 시리즈 최초의 오픈형 클립형 무선 이어폰 '갤럭시 버즈 온'을 27일에 29만9000원으로 공식 출시합니다. 1억 1,900만 개의 귀 데이터를 활용해 착용감을 최적화하고, 듀얼 우퍼로 저음을 강화했으며 머리 움직임 제어 등 AI 음성 명령을 지원합니다. 아웃도어 활동을 즐기는 사용자를 겨냥해 세컨드 이어폰 시장을 공략할 계획입니다.", "source": "msn.com", "date": "2026-10-20 21:15", "url": "https://www.msn.com/ko-kr/news/techandscience/착용감-음질-다-잡았다-삼성-귀-안막는-클립형-이어폰-승부/ar-AA2fFWkT", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 출시"}, {"title": "Samsung fighting iPhone Duo by launching six foldable phones next year", "summary": "삼성전자가 애플의 첫 폴더블폰 아이폰 듀오의 흥행에 맞서 내년 최대 6종의 폴더블폰 라인업 출시를 검토 중인 것으로 전해졌습니다. 애플 진입으로 급변하는 폼팩터 경쟁에서 세그먼트 세분화를 통해 시장 지배력을 방어하려는 포석입니다. 시장 확대와 가격대 다변화를 동시에 노리는 적극적인 라인업 전략으로 평가됩니다. 차세대 Z 시리즈의 개발 일정과 수율 및 원가 경쟁력을 면밀히 수립해야 합니다.", "source": "9to5Mac", "date": "2026-10-20 21:00", "url": "https://9to5mac.com/2026/10/20/samsung-fighting-iphone-duo-by-launching-six-foldable-phones-next-year/", "category": "launch", "importance": 5, "sid": "phone", "topic": "samsung 폴더블폰 라인업"}, {"title": "Snapdragon or Exynos? New upgrade for Exynos Galaxy S27 could make this a tough choice", "summary": "차기 엑시노스 탑재 갤럭시 S27이 셀룰러 성능과 전력 효율성 측면에서 스냅드래곤 모델에 뒤처지지 않을 것이라는 전망이 제기되었습니다. 엑시노스 칩셋의 성능 개선이 이루어질 경우 플래그십 선택의 폭이 넓어질 수 있습니다. 삼성의 자체 칩 경쟁력 회복 여부가 주목되는 대목입니다.", "source": "Android Authority", "date": "2026-10-20 20:45", "url": "https://www.androidauthority.com/samsung-galaxy-s27-cellular-upgrade-modem-3725448/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 엑시노스 갤럭시 s27 업그레이드"}, {"title": "Tesla, Dell, and Apple Have Become the 'Weaker Party'… Samsung Electronics' Negotiating Po", "summary": "테슬라, 델, 애플 등 글로벌 빅테크 기업들이 메모리 수급난 속에서 '약자'의 처지로 전락하며 삼성전자의 부품 협상력이 극대화되었다는 분석이 나왔다. 공급자 주도 시장에서 부품 단가 및 계약 조건의 우위를 점할 수 있게 되었다. 삼성전자의 압도적인 시장 지배력을 방증한다.", "source": "머니투데이", "date": "2026-10-20 18:20", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9TbnRCRTJ1cHNkWE92NEtDaTR3Qjd4SHlfNGsyRzhrRnBvOGQ0d19qQWlISGlqbldISlVZUk1lYW9mQlVpNVpjUmtPbVZhRjF0Y3ZGV2ZuYWxEeXBXcWRhdTBrYTc3bmhNN1ZGbWI4c1c4aVhtQzVJaUxRQXhYUQ?oc=5", "category": "policy", "importance": 5, "sid": "memchina", "topic": "반도체 협상력"}, {"title": "Samsung Secures 80% of Its 2027 Memory Chip Orders in Advance", "summary": "삼성전자가 2027년 전체 메모리 칩 주문량의 80%를 사전 선점으로 확보하는 데 성공했다. 압도적인 공급 능력을 바탕으로 물량을 조기에 계약하며 안정적 수익 기반을 다졌다. 반도체 주도권을 공고히 하는 핵심 성과다.", "source": "SammyGuru", "date": "2026-10-20 18:02", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9lX2QwUzdzaE12ZkJ5YUtOcHpjdWtDS1RrRUtrWFVLUDVLaDhoM1AzM0ttaGFkdC1TRGNpck5ReGdFYjNVYjFCN2NINmR4Q2Q1cmIzaGREc1p3dDJmVFhGdUhPWHRBVUlWcFUxUzloSTROMURtTXF0RzFPYlN1UQ?oc=5", "category": "policy", "importance": 5, "sid": "memchina", "topic": "메모리반도체 계약"}, {"title": "One of Samsung’s most popular phones is now getting stable One UI 9 with Android 17", "summary": "삼성이 대중적인 인기 모델인 갤럭시 A36 5G를 대상으로 안드로이드 17 기반의 안정적인 원 UI 9 배포를 시작했습니다. 플래그십뿐만 아니라 보급형 라인업까지 빠른 소프트웨어 업데이트를 제공하여 사용자 경험을 제고합니다. 삼성 MX사업부의 탄탄한 사후 지원 체계를 보여주는 사례입니다.", "source": "Android Authority", "date": "2026-10-20 17:59", "url": "https://www.androidauthority.com/galaxy-a36-5g-stable-one-ui-9-rollout-europe-3725389/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 갤럭시 a36 원유아이 9"}, {"title": "트럼프, 연방기관서 中딥시크 퇴출…“민감 데이터가 中 이전 우려 있어”", "summary": "미국 국토안보부가 연방정부 기관 내에서 중국 AI 기업 딥시크의 제품 사용을 전면 금지하는 지침을 발표했다. 민감 데이터의 중국 이전 우려와 사이버보안법에 근거한 조치로, IT 시스템에서 해당 제품을 즉시 제거해야 한다. 미중 기술 패권 경쟁과 AI 보안 규제가 더욱 강화되고 있음을 보여준다.", "source": "전자신문", "date": "2026-10-20 17:28", "url": "https://www.etnews.com/20261020000374", "category": "policy", "importance": 5, "sid": "memchina", "topic": "딥시크 연방기관 퇴출"}, {"title": "운동하다 넘어진 남성…바지 주머니 속 휴대전화 '폭발'", "summary": "중국에서 배드민턴을 치던 남성이 넘어지는 충격으로 바지 주머니에 있던 휴대전화가 폭발해 중증 화상을 입는 사고가 발생했다. 해당 휴대전화는 구입한 지 두 달밖에 되지 않은 제품으로 확 <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}${srchLink(a)}</div></div>`;
}
function srchLink(a){
  if(!((a.url||"").includes("news.google.com")))return"";
  const q=encodeURIComponent('"'+(a.title||"").slice(0,80)+'"');
  return ` · <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700" title="링크가 차단될 때 제목으로 원문 검색">원문 검색</a>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
