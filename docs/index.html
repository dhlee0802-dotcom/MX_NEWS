 false}, {"title": "삼전닉스 D램 점유율 64%로 굳건… 3분기 역대급 실적 기록할까 투자자...", "summary": "오픈AI가 보안 위험 단계의 신규 AI 모델 '아스트라'를 출시하며 AGI 시대의 도래를 선언했다. 이로 인해 삼성전자와 SK하이닉스 등 주요 메모리 업체의 D램 점유율이 64%로 공고해졌으며 3분기 역대급 실적 기대감이 커지고 있다. 고용량 제품에 대한 폭발적 수요가 메모리 가격 상승을 이끌고 있다. 국내 반도체 기업들의 실적 호조가 예상되는 대목이다.", "source": "segye.com", "date": "2026-09-07 18:18", "url": "https://www.segye.com/newsView/20260907516603?OutUrl=naver", "category": "launch", "importance": 3, "wl": false, "topic": "삼전닉스 d램 점유율", "alert": false}, {"title": "[중국증시-마감] 반도체주 강세에 상승", "summary": "고성능 AI 모델 아스트라의 확산으로 고용량 메모리 수요가 늘면서 메모리 가격 상승세가 지속될 것이라는 기대가 중국 증시에도 반영됐다. 창신메모리(CXMT) 주가가 6%대 상승하는 등 반도체주가 강세를 보였다. 글로벌 AI 인프라 투자 열풍이 중화권 메모리 및 기술주 전반의 투자심리를 끌어올렸다. 메모리 업황 개선의 온기가 글로벌 시장으로 확산되고 있다.", "source": "news.einfomax.co.kr", "date": "2026-09-07 18:10", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4433793", "category": "price", "importance": 3, "wl": false, "topic": "중국증시 반도체 강세", "alert": false}, {"title": "갈팡질팡하던 유동성, 결국 반도체로 … 삼전닉스 급등", "summary": "오픈AI의 신규 AI 모델 '아스트라' 공개가 메모리 수요 확대 기대를 자극하며 미국과 국내 증시에서 반도체주 강세를 이끌었다. 토큰 가격 하락이 AI 하드웨어 시장 성장을 둔화시키지 않는다는 분석이 힘을 얻었다. 국내 메모리 기업의 탄탄한 기초체력이 주가 반등을 뒷받침했다. AI 기술 진화가 반도체 업황에 강력한 호재로 작용하고 있다.", "source": "mk.co.kr", "date": "2026-09-07 17:58", "url": "https://www.mk.co.kr/article/12146416", "category": "launch", "importance": 3, "wl": false, "topic": "오픈ai 아스트라 반도체 반등", "alert": false}, {"title": "‘아스트라’ 호재에 외국인이 돌아왔다…코스피, 반도체 훈풍에 4.61% 상...", "summary": "오픈AI가 범용인공지능 시대를 선언하며 고성능 AI 모델 '아스트라'를 공개하자 메모리 반도체 가격 상승 기대감이 퍼지며 외국인 매수세가 유입됐다. 에프앤가이드에 따르면 삼성전자의 3분기 영업이익 추정치가 상향 조정됐다. 반도체 훈풍에 힘입어 코스피가 급등세를 보였다. AI 모델의 진화가 국내 반도체 실적 개선의 핵심 동력으로 작용하고 있다.", "source": "economist.co.kr", "date": "2026-09-07 17:52", "url": "https://economist.co.kr/article/view/ecn202609070074", "category": "launch", "importance": 3, "wl": false, "topic": "아스트라 호재 반도체 훈풍", "alert": false}, {"title": "반도체 불기둥에 7000피 눈앞…골드만 “1만 2000 간다”", "summary": "고성능 AI 모델 확산으로 고용량 메모리 수요가 늘고 가격 상승세가 이어질 것이라는  전면戰", "summary": "애플의 첫 폴더블폰 공개를 앞두고 삼성전자와의 전면전이 예상되는 가운데, 애플 워치 시리즈12는 성능을 높인 S계열 칩을 탑재하고 상시 심박 모니터링 기능을 강화할 것으로 알려졌다. 세라믹 소재 도입 등 웨어러블 라인업의 변화도 예고됐다. 삼성 갤럭시 워치 시리즈와의 프리미엄 웨어러블 경쟁이 한층 치열해질 전망이다. 모바일과 워치를 아우르는 생태계 싸움이 가속화되고 있다.", "source": "newswhoplus.com", "date": "2026-09-07 07:30", "url": "https://www.newswhoplus.com/news/articleView.html?idxno=68935", "category": "launch", "importance": 3, "wl": false, "topic": "애플워치 시리즈12", "alert": false}], "tws": [{"title": "The new W4 Plus is Timekettle’s most capable AI interpreter earbuds yet", "summary": "타임케틀이 인공지능 통번역 기능을 대폭 강화한 신형 이어버즈 'W4 플러스'를 선보였다. 여행과 비즈니스 현장에서 언어 장벽을 완벽히 허물어주는 고성능 AI 이어폰으로 평가받는다. 무선 이어폰 시장이 단순한 오디오 재생을 넘어 통번역 등 AI 유틸리티 중심으로 진화하고 있음을 보여준다. 스마트 이어버즈 분야의 새로운 경쟁력 기준을 제시한다.", "source": "Android Authority", "date": "2026-09-05 23:21", "url": "https://www.androidauthority.com/timekettle-w4-plus-3706119/", "category": "launch", "importance": 2, "wl": true, "topic": "타임케틀 w4 플러스", "alert": false}], "tablet": [{"title": "There’s much more to the TCL P80 Ultra than standout screen tech", "summary": "TCL의 'P80 울트라'가 뛰어난 화면 기술뿐만 아니라 완성도 높은 하드웨어를 선보였다. 특히 NXTPAPER 기술이 적용되어 시력 보호와 가독성을 대폭 강화한 것이 핵심 경쟁력이다. 태블릿 및 대화면 디바이스 시장에서 디스플레이 차별화 경쟁이 치열해지고 있음을 보여준다. 실사용자 중심의 혁신적인 화면 기술이 주목받고 있다.", "source": "Android Authority", "date": "2026-09-06 01:30", "url": "https://www.androidauthority.com/tcl-p80-series-nxtpaper-3706515/", "category": "launch", "importance": 2, "wl": true, "topic": "tcl p80 울트라", "alert": false}, {"title": "삼성메디슨, 초음파 진단기기 'HERA Z10' 출시…국제학술대회서 선봬", "summary": "삼성메디슨이 초음파 진단기기 신제품 'HERA Z10'을 국제학술대회에서 전격 공개했다. 현장에서 태아 초음파 이미지를 AI 명화로 재해석한 전시와 함께, 갤럭시 탭을 활용해 태아의 성장 기록을 손쉽게 확인할 수 있는 연동 솔루션을 시연했다. 의료 기기와 모바일 태블릿 간의 결합을 통해 임신 주기 관리 경험을 확장하고 있다. 의료용 모바일 솔루션의 활용도를 높이는 전략이다.", "source": "srtimes.kr", "date": "2026-09-07 18:08", "url": "http://www.srtimes.kr/news/articleView.html?idxno=211802", "category": "launch", "importance": 3, "wl": false, "topic": "갤럭시 탭 연동 초음파", "alert": false}], "pc": [{"title": "This new reveal suggests MacBook Ultra might cost more than we think", "summary": "애플이 OLED 패널, 맥 최초의 터치스크린, 얇아진 섀시, 다이내믹 아일랜드 등을 탑재한 차세대 맥북 프로 리디자인을 빠르면 다음 달 선보일 것으로 예상된다. 예상보다 높은 가격대로 출시될 가능성이 제기되며 프리미엄 노트북 시장에 파장을 예고하고 있다. 대대적인 폼팩터 혁신이 소비자 수요를 얼마나 견인할지 주목된다. 경쟁사들의 PC 시장 전략에도 적지 않은 압박이 될 전망이다.", "source": "9to5Mac", "date": "2026-09-06 12:02", "url": "https://9to5mac.com/2026/09/05/macbook-ultra-pricing-lineup-rumor/", "category": "launch", "importance": 2, "wl": true, "topic": "맥북 울트라", "alert": false}, {"title": "노트북 원가 압박 커지자… 삼성·LG, 실속형으로 시장 공략", "summary": "노트북 원가 압박이 커지는 가운데 삼성전자와 LG전자가 실속형 모델을 앞세워 시장 공략에 나섰다. 삼성전자는 지난 4월 갤럭시 북 6 시리즈 가격을 인상한 데 이어, 지난 1일 119만~149만원대의 뉴 갤럭시 북 6를 출시했다. LG전자도 신제품을 선보이며 가격대를 넓히고 있다. 부품값 상승에 대응하기 위한 양사의 가격 전략 다변화가 진행 중이다.", "source": "the-biz.co.kr", "date": "2026-09-07 16:28", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=727462", "category": "price", "importance": 3, "wl": false, "topic": "뉴 갤럭시 북 6 가격 출시", "alert": false}], "wallet": [{"title": "금융위, 2027년 2월 토큰증권 시대 개막…리테일 연 1억원 한도로 제한", "summary": "금융위원회의 토큰증권 시대 개막 예고와 함께 가상자산 및 결제 인프라 변화가 가속화되고 있다. 현대카드가 테더 관련 실험을 진행하는 가운데, 삼성월렛은 스마트폰에 스테이블코인을 기본 탑재하는 계획을 수립하고 있다. 한국의 상시 외환거래 인프라 개선과 맞물려 모바일 결제 플랫폼의 기능이 확장될 전망이다. 향후 디지털 자산 결제 시장에서 월렛의 주도권 확보가 기대된다.", "source": "wikitree.co.kr", "date": "2026-09-06 20:12", "url": "https://www.wikitree.co.kr/articles/1157625", "category": "launch", "importance": 3, "wl": false, "topic": "삼성월렛 스테이블코인", "alert": false}], "health": [{"title": "Oura finally confirms Ring 4 has a battery problem, and the fallout is staggering", "summary": "오우라가 스마트링 '링 4'의 배터리 결함 문제를 공식 인정하면서 상당한 재정적 타격이 불가피해졌다. 웨어러블 기기 시장에서 품질 관 리의 중요성이 다시 한번 부각되는 대목이다. 고객 불만 해소와 제품 교환 등으로 인해 브랜드 신뢰도에 적지 않은 흠집이 날 것으로 보인다. 디지털 헬스케어 기기 제조사들에게 반면교사가 되고 있다.", "source": "Android Authority", "date": "2026-09-07 15:43", "url": "https://www.androidauthority.com/oura-ring-4-battery-problem-3708162/", "category": "quality", "importance": 3, "wl": true, "topic": "오우라 링", "alert": false}, {"title": "삼성 메디슨, 초음파 진단기기 'HERA Z10' 출시…여성 헬스 케어 확장", "summary": "삼성메디슨이 제36회 세계산부인과초음파학회(ISUOG)에서 산부인과 전용 초음파 진단기기 신제품 'HERA Z10'을 공개하며 프리미엄 제품군 강화에 나섰다. 런던 현장에서 여성 건강 통합 진단 솔루션을 선보이며 글로벌 의료진의 주목을 받았다. AI 기반 진단 성능을 대폭 끌어올린 전략 제품이다. 여성 헬스케어 시장에서 삼성의 기술력을 확고히 다지고 있다.", "source": "ziksir.com", "date": "2026-09-07 13:56", "url": "https://www.ziksir.com/news/articleView.html?idxno=145594", "category": "launch", "importance": 3, "wl": false, "topic": "삼성메디슨 hera z10", "alert": false}, {"title": "메디원, 'KOREA LIFE SCIENCE WEEK 2026'서 AI 기반 산소치료 플랫폼 선봬", "summary": "홈 헬스케어 기업 메디원이 'KOREA LIFE SCIENCE WEEK 2026'에 참가해 가정용 및 휴대용 산소발생기와 AI 기반 산소치료 플랫폼을 선보였다. 서울 삼성동 코엑스에서 개최되는 이번 전시회에서 최신 건강관리 기술을 대거 공개한다. 홈헬스케어 시장의 기술 고도화 흐름을 보여주는 사례다. 관련 디지털 헬스 솔루션의 상용화가 확대되고 있다.", "source": "biotimes.co.kr", "date": "2026-09-07 16:20", "url": "https://www.biotimes.co.kr/news/articleView.html?idxno=34292", "category": "launch", "importance": 2, "wl": false, "topic": "메디원 산소치료 플랫폼", "alert": false}], "phone": [{"title": "Samsung is shutting down two apps it used to brag about", "summary": "삼성전자가 과거 마케팅 포인트로 활용했던 AR 두들(AR Doodle)과 퀵 매저(Quick Measure) 앱의 서비스를 종료하기로 했다. 활용도가 낮아진 증강현실 관련 애플리케이션을 정리하고 소프트웨어 라인업을 효율화하려는 조치로 풀이된다. 불필요한 리소스를 줄이고 핵심 서비스에 집중하겠다는 전략이다. 사용자 경험 관점에서 일부 기능 공백이 우려된다.", "source": "Android Authority", "date": "2026-09-07 18:14", "url": "https://www.androidauthority.com/samsung-ar-doodle-quick-measure-discontinue-3708203/", "category": "quality", "importance": 3, "wl": true, "topic": "삼성 앱", "alert": false}, {"title": "John Ternus’s first test at Apple: selling a $2,000 foldable iPhone", "summary": "애플의 존 테너스가 2,000달러 상당의 폴더블 아이폰 판매라는 새로운 시험대에 올랐다. 스마트폰 제조사들은 상승하는 비용을 충당하기 위해 전반적인 기기 가격을 인상해야 하는 상황이다. 프리미엄 시장에서 고가 전략이 불가피해지며 경쟁 구도에 변화가 예상된다. 이는 향후 폴더블폰 시장의 가격 저항선 형성에 영향을 미칠 수 있다.", "source": "Financial Times Tech", "date": "2026-09-07 13:00", "url": "https://www.ft.com/content/8bbc2b5f-d1fc-4d8d-8085-4c27c362653a?syn-25a6b1a6=1", "category": "price", "importance": <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
