 규모 CHIPS R&D 지원금 최종 확정", "summary": "퀀티넘이 미국 상무부로부터 1억 달러 규모의 CHIPS R&D 지원금을 최종 확정받아 포획 이온 양자 컴퓨팅 확장을 위한 연구개발 및 제조 역량을 강화한다. 글로벌파운드리스 등과의 협력을 통해 차세대 제어 장치 및 광학 부품 제작을 추진한다. 차세대 양자 반도체 및 첨단 컴퓨팅 기술 확보를 위한 국가적 지원 사례다.", "source": "ZDNet Korea", "date": "2026-09-08 21:10", "url": "https://zdnet.co.kr/view/?no=20260908211002", "category": "policy", "importance": 3, "wl": true, "topic": "퀀티넘 반도체 지원", "alert": false}, {"title": "스파이록스, 유리 기판 양산 검사를 지원하는 고속 TGV 크랙 검사 시스템 출시", "summary": "스파이록스가 첨단 패키징 기술 포럼을 개최하고 코닝, DNP 등의 전문가들과 함께 유리 기판 양산 검사를 지원하는 고속 TGV 크랙 검사 시스템을 출시했다. 차세대 AI 및 고성능 컴퓨팅(HPC) 응용 분야를 위한 글래스코어와 TGV 신뢰성 검사 기술을 조명했다. 첨단 반도체 패키징 공정의 핵심 장비 및 검사 기술 트렌드를 보여준다.", "source": "ZDNet Korea", "date": "2026-09-08 20:10", "url": "https://zdnet.co.kr/view/?no=20260908201013", "category": "launch", "importance": 3, "wl": true, "topic": "스파이록스 tgv 검사", "alert": false}, {"title": "[KPCA쇼 2026]LG이노텍, AI가속기용 패키지 기판 첫선…심텍·티엘비 '소캠' 전면에", "summary": "국제 반도체 기판 및 첨단 패키징 산업전(KPCA쇼 2026)에서 LG이노텍이 AI 가속기용 패키지 기판을 처음 선보이고 심텍과 티엘비 등이 소캠을 전면에 내세웠다. AI 가속기와 고성능 컴퓨팅이 요구하는 대면적, 고다층, 방열 등의 과제를 해결하기 위한 국내 기판 업계의 기술 전략이 총집결했다. 차세대 반도체 패키징 및 부품 생태계의 트렌드를 파악할 수 있는 중요 전시 행마다.", "source": "전자신문", "date": "2026-09-08 16:00", "url": "https://www.etnews.com/20260908000058", "category": "launch", "importance": 3, "wl": true, "topic": "kpca쇼 패키지 기판", "alert": false}, {"title": "시높시스, 앤시스 품고 HBM 공략…“칩부터 시스템까지 설계 통합”", "summary": "시높시스가 앤시스 인수를 바탕으로 실리콘 설계부터 시스템 시뮬레이션까지 아우르는 엔지니어링 솔루션을 제시하며 HBM 및 AI 반도체 시장 공략을 강화한다. 칩 설계 영역부터 시스템 전체에 이르는 통합 솔루션을 통해 고객 수요에 대응한다는 비전이다. 고대역폭메모리와 AI 칩 생태계에서 반도체 설계 자산(IP) 및 EDA 도구의 중요성을 보여준다.", "source": "전자신문", "date": "2026-09-08 14:31", "url": "https://www.etnews.com/20260908000269", "category": "launch", "importance": 3, "wl": true, "topic": "시높시스 앤시스 hbm", "alert": false}, {"title": "Belgian-Chinese researcher arrested over suspected theft of chip secrets", "summary": "벨기에 검찰이 반도체 기밀 유출 혐의로 벨기에-중국 국적의 연구원을 체포했습니다. 검찰은 용의자가 폐업한 반도체 제조업체 벨간에 재직한 지 수개월 만에 중국의 기술 기업으로 자리를 스쿨 지급 등 가시적인 제재로 이어질 수 있어 주목됩니다. 글로벌 스마트폰 시장에서 특허 방어와 기술 인증의 중요성을 다시 한번 상기시키는 사건입니다.", "source": "MacRumors", "date": "2026-09-08 23:51", "url": "https://www.macrumors.com/2026/09/08/apple-sued-over-face-id-patent-infringement/", "category": "policy", "importance": 4, "wl": true, "topic": "애플 페이스id 특허 소송", "alert": true}, {"title": "Apple adds 37 hardware identifiers ahead of ‘Surprise and Shine’ event", "summary": "애플이 다가오는 ‘서프라이즈 앤 샤인’ 이벤트에서 공개될 가능성이 있는 아이폰, 아이패드, 맥 등 신제품들을 위해 37개의 새로운 하드웨어 식별자를 추가했습니다. 새로운 기기 라인업의 출시가 임박했음을 시사하는 정황들이 포착되고 있습니다. 이번 행사는 애플의 연중 가장 중요한 하드웨어 발표 중 하나로 기대를 모으고 있습니다. 신제품 대거 등장은 글로벌 스마트폰 및 태블릿 시장의 수요를 자극할 전망입니다.", "source": "9to5Mac", "date": "2026-09-09 08:27", "url": "https://9to5mac.com/2026/09/08/apple-adds-37-hardware-identifiers-ahead-of-surprise-and-shine-event/", "category": "launch", "importance": 3, "wl": true, "topic": "애플 신제품 출시 이벤트", "alert": false}, {"title": "Apple faces new UK rules over nude images on children’s iPhones", "summary": "영국 정부가 애플과 구글에게 아동들이 스마트폰과 태블릿을 통해 음란물을 촬영, 공유, 시청하지 못하도록 차단하는 법안을 도입할 계획이라고 블룸버그가 보도했습니다. 해당 규제가 도입될 경우 플랫폼 기업들은 기기 수준에서 강력한 아동 보호 기능을 의무적으로 탑재해야 합니다. 빅테크를 겨냥한 각국의 유해 콘텐츠 차단 및 아동 보호 규제가 한층 구체화되고 있습니다. 향후 모바일 기기 운영체제 전반에 걸쳐 보안 및 검열 기능 강화가 요구됩니다.", "source": "9to5Mac", "date": "2026-09-09 06:20", "url": "https://9to5mac.com/2026/09/08/apple-faces-new-uk-rules-over-nude-images-on-childrens-iphones/", "category": "policy", "importance": 3, "wl": true, "topic": "영국 아동 보호 규제", "alert": false}, {"title": "Meta unveils AI personal assistant linked to WhatsApp and Instagram", "summary": "메타가 왓츠앱과 인스타그램에 연동되는 새로운 AI 개인 비서인 뮤즈를 공개했습니다. 뮤즈는 대화 내용과 소셜 미디어 활동을 바탕으로 맞춤형 제안을 제공하도록 설계된 에이전트입니다. 이를 통해 사용자는 일상적인 소셜 플랫폼 내에서 더욱 편리하게 인공지능 서비스를 이용할 수 있게 됩니다. 경쟁사인 메타의 AI 에이전트 확장은 모바일 생태계 내에서 AI 주도권 경쟁을 한층 더 심화시킬 것으로 전망됩니다.", "source": "Financial Times Tech", "date": "2026-09-09 05:44", "url": "https://www.ft.com/content/5816292b-c36b-4c22-aa50-2680b9970382?syn-25a6b1a6=1", "category": "launch", "importance": 3, "wl": true, "topic": "메타 ai 어시스턴트 출시", "alert": false}, {"title": "TrendForce: Apple produced 52 million iPhones in Q2 as global smartphone market declined", "summary": "트렌드포스 보고서에 따르면 글로벌 스마트폰 시장이 침체기를 겪는 동안 애플은 2분기에 전년 동기 대비 14% 증가한 5,200만 대의 아이폰을 생산했습니다. 이로써 애플은 글로벌 생산량의 19%를 차지하며 삼성에 이어 2위를 기록했습니다. 전반적인 시장 하락세 속에서도 애플은 탄탄한 생산 실적을 유지하며 점유율을 방어했습니다. 주요 스마트폰 제조사 간의 글로벌 출하량 및 생산 점유율 경쟁 구도를 명확히 보여줍니다.", "source": "9to5Mac", "date": "2026-09-09 05:39", "url": "https://9to5mac.com/2026/09/08/trendforce-apple-produced-52-million-iphones-in-q2-as-global-smartphone-market-declined/", "category": "other", "importance": 3, "wl": true, "topic": "애플 2분기 스마트폰 생산량", "alert": false}, {"title": "iPhone 18 Pro set to become Apple’s new default model", "summary": "애플의 아이폰 18 프로가 곧 공개될 예정이며, 올해 대규모 라인업 개편으로 인해 과거와는 전혀 다른 새로운 기본 모델의 역할을 맡게 될 전망입니다. 프로 모델 중심의 포트폴리오 재편이 소비자 선택에 큰 변화를 가져올 것으로 보입니다. 프리미엄 라인업의 세분화와 기본 모델의 위상 변화는 애플의 판매 전략 핵심을 이룹니다. 이는 경쟁사들의 플래그십 스마트폰 판매 전략에도 적지 않은 자극을 줍니다.", "source": "9to5Mac", "date": "2026-09-09 05:22", "url": "https://9to5mac.com/2026/09/08/iphone-18-pro-set-to-become-apples-new-default-model/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 18 프로 출시", "alert": false}, {"title": "Samsung flexes its foldable lead one day before Apple joins the race", "summary": "애플의 시장 진입을 하루 앞두고 삼성전자가 자사의 폴더블폰 리더십을 과시하며 첫 구매자들을 대거 끌어모으고 있습니다. 신규 라인업은 그 어느 때보다 많은 초보 폴더블폰 구매자들의 발길을 사로잡고 있습니다. 경쟁사의 본격적인 추격에 맞서 시장 선점 효과를 극대화하려는 마케팅 전략이 효과를 거두고 있습니다. 폴더블 스마트폰 대중화 시대를 맞아 삼성의 주도권 수성 의지가 돋보입니다.", "source": "Android Authority", "date": "2026-09-09 04:26", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-8-flip-8-sales-3708955/", "category": "launch", "importance": 3, "wl": true, "topic": "삼성 폴더블폰 시장 선도", "alert": false}, {"title": "Apple Releases iOS 26.6.2", "summary": "애플이 아이폰용 신규 운영체제 업데이트인 iOS 26.6.2를 정식 출시했습니다. 다가오는 신제품 출시 행사를 앞두고 기존 기기들의 시스템 안정성과 호환성을 점검하기 위한 패치입니다. 원활한 사용자 경험 유지와 최신 소프트웨어 환경 조성을 위한 정기적인 업데이트 배포입니다. 전 세계 아이폰 사용자들은 안정적인 구동 환경에서 신제품 맞이를 준비하게 됩니다.", "source": "MacRumors", "date": "2026-09-09 02:47", "url": "https://www.macrumors.com/2026/09/08/apple-releases-ios-26-6-2/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 소프트웨어 업데이트", "alert": false}, {"title": "It’s finally time to upgrade from these aging Samsung foldables", "summary": "구형 폴더블 스마트폰인 갤럭시 Z 폴드 3와 Z 플립 3가 공식적으로 마지막 시스템 업데이트를 수신하며 지원 주기의 막을 내렸습니다. 출시 이후 수년간 지속적인 성능 개선과 기능 추가를 제공받았던 구형 모델들이 최종 소프트웨어 버전에 도달했습니다. 세대 교체 주기에 따라 구형 기기들의 유지보수가 단계적으로 마무리되고 있습니다. 이는 사용자들에게 신기기 업그레이드를 유도하는 자연스러운 수순입니다.", "source": "Android Authority", "date": "2026-09-09 02:12", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-3-flip-end-support-3708878/", "category": "other", "importance": 3, "wl": true, "topic": "갤럭시 z 폴드 3 업데이트 종료", "alert": false}, {"title": "Apple looks to AI capabilities to drive its new foldable phone sales", "summary": "애플이 신형 폴더블폰 판매를 견인하기 위해 인공지능(AI) 기능을 적극 활용할 계획입니다. 신제품 출시로 인한 후광 효과 덕분에 애플은 자사의 다른 제품 가격도 인상할 수 있을 것으로 전망됩니다. 고급형 폴더블폰과 AI 기능의 결합은 프리미엄 스마트폰 시장의 가격 저항선을 높이는 계기가 될 수 있습니다. 경쟁사의 폴더블 시장 진입과 가격 정책 변화는 삼성전자의 프리미엄 및 폴더블 스마트폰 전략에 직접적인 영향을 미칠 것으로 예상됩니다.", "source": "Financial Times Tech", "date": "2026-09-09 01:20", "url": "https://www.ft.com/content/944fd36f-8f91-4178-b05a-2b961c44e310?syn-25a6b1a6=1", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 울트라 폴더블폰 가격", "alert": false}, {"title": "Which of the upcoming new Apple products most excites you? [Poll]", "summary": "6개에서 9개에 이르는 신제품이 공개될 것으로 예상되는 애플의 ‘서프라이즈 앤 샤인’ 이벤트를 단 하루 앞두고 소비자들이 기대하는 제품에 대한 관심이 집중되고 있습니다. 특히 폴더블 폼팩터인 아이폰 울트라가 이번 행사의 가장 핵심적인 뉴스로 꼽히고 있습니다. 애플의 신형 폼팩터 진입은 전 세계 모바일 시장의 판도를 뒤흔들 중대 이벤트로 평가받습니다. 혁신적인 기기들의 등장이 전체 스마트폰 산업의 수요를 촉진할 것으로 보입니다.", "source": "9to5Mac", "date": "2026-09-08 22:54", "url": "https://9to5mac.com/2026/09/08/which-of-the-upcoming-new-apple-products-most-excites-you-poll/", "category": "launch", "importance": 3, "wl": true, "topic": "애플 신제품 발표 투표", "alert": false}, {"title": "iPhone Ultra <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        const items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
