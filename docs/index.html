", "date": "2026-09-02 09:43", "url": "https://www.phonearena.com/news/leaked-galaxy-tab-s12-ultra-benchmark-reveals-a-surprising-performance-upgrade_id183014", "category": "quality", "importance": 3, "wl": false, "topic": "갤럭시 탭 s12 울트라 벤치마크"}, {"title": "삼성전자, ‘New 갤럭시 북6’ 국내 출시…가격 119만~149만원", "summary": "14형·1.35㎏에 인텔 코어 시리즈3…동영상 최대 25시간 재생 30분 충전하면 최대 33%…AI 사진 편집·웹페이지 실시간 번역 스마트폰· 갤럭시 탭 파일 PC서 열고 옮겨…22일까지 출시 행사 [서울타임즈뉴스 = 허성미...", "source": "seoultimes.news", "date": "2026-09-01 15:15", "url": "https://www.seoultimes.news/news/article.html?no=2000099387", "category": "launch", "importance": 3, "wl": false, "topic": ""}, {"title": "Android champ Galaxy Tab S11 Ultra gets a massive price cut at Samsung - PhoneArena", "summary": "안드로이드 진영의 대표 태블릿인 갤럭시 탭 S11 울트라가 삼성 공식 채널에서 대대적인 가격 인하를 단행했습니다. 신제품 출시를 앞두고 재고를 정리하고 판매량을 견인하기 위한 조치입니다. 태블릿 시장 수요를 자극하는 효과가 있습니다.", "source": "PhoneArena", "date": "2026-09-01 14:31", "url": "https://www.phonearena.com/news/tab-s11-ultra-massive-price-cut_id182993", "category": "price", "importance": 3, "wl": false, "topic": "갤럭시 탭 s11 울트라 할인"}], "pc": [{"title": "삼성, 인텔 '코어 시리즈3' 업고 맥북네오 정조준", "summary": "애플의 보급형 노트북 '맥북네오'가 국내외 시장에서 판매량을 늘리며 주목받는 가운데 삼성전자가 인텔의 신형 '코어 시리즈3(와일드캣 레이크)' 프로세서를 탑재한 신제품을 앞세워 맞불을 놓는다. 최근 D램과 SSD 등 메모리 반도체 수급난으로 인해 PC 전체의 가격 상승과 출하량 감소가 이어지는 상황이다. 글로벌 PC 제조사들은 오는 4일 독일에서 개막하는 'IFA 2026'을 기점으로 보급형 윈도 노트북 시장을 겨냥한 총력전에 돌입한다. 삼성의 PC 사업 전략에 중요한 분기점이다.", "source": "ZDNet Korea", "date": "2026-09-02 17:25", "url": "https://zdnet.co.kr/view/?no=20260902162725", "category": "launch", "importance": 4, "wl": true, "topic": "삼성 인텔 코어 시리즈3 노트북"}, {"title": "Acer Googlebook is officially coming soon, and here’s a first glimpse", "summary": "에이서의 새로운 '구글북'이 공식 출시를 앞두고 있으며 오는 9월 15일 구글북 공식 런칭 행사에서 첫 모습을 드러낼 예정인 것으로 확인되었다. 크롬북 및 구글 기반 에코시스템 노트북 시장의 신제품 공세다.", "source": "Android Authority", "date": "2026-09-02 19:24", "url": "https://www.androidauthority.com/acer-googlebook-coming-soon-look-3706074/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 구글북 출시"}, {"title": "궁극의 선명함: AGON by AOC, 세계 최초 5K NVIDIA G-SYNC® Pulsar 게이밍 모니터 공개", "summary": "7년 연속 세계 1위 게이밍 모니터 브랜드인 AGON by AOC가 세계 최초로 5K 초고해상도와 엔비디아 지싱크 펄사 기술을 결합한 혁신적인 게이밍 모니터 'AGP327KG'를 공개했다. 탁월한 모션 선명도와 화면 찢어짐 없는 매끄러운 가변 주사율 경험을 제공하여 하이엔드 게이머들의 기대를 충족시킨다. 글로벌 프리미엄 모니터 시장에서 기술적 우위를 선점하기 위한 강력한 승부수다. 디스플레이 및 게이밍 기기 경쟁에 불을 지폈다.", "source": "ZDNet Korea", "date": "2026-09-02 19:10", "url": "https://zdnet.co.kr/view/?no=20260902191003", "category": "launch", "importance": 3, "wl": true, "topic": "agon 5k 게이밍 모니터"}, {"title": "Acer’s new MacBook Air rival is nearly a pound lighter than Apple’s laptop", "summary": "에이서가 맥북 에어의 두께와 가벼움에 대항하는 새로운 노트북 '스위프트 블레이드 14'를 발표했다. 애플의 초경량 노트북 시장 아성에 도전하는 제품으로 기존 맥북 에어보다 거의 1파운드 더 가볍다. 프리미엄 노트북 시장에서 제조사들의 경량화 경쟁이 더욱 치열해질 전망이다.", "source": "The Verge", "date": "2026-09-02 18:30", "url": "https://www.theverge.com/gadgets/987802/acer-swift-blade-14-air-16-laptop-ifa-price-specs", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 맥북 에어 라이벌"}, {"title": "Acer Recommits to Repairability With New Vero 16 Laptop", "summary": "에이서가 지속 가능성과 수리 용이성을 대폭 강화한 새로운 베로 16 노트북을 선보였다. IFA 2026 현장에서 가장 슬림한 스위프트 라인업 및 스위프트 에어 업데이트 제품군도 함께 공개되었다. 친환경 소재와 유지보수 편의성을 앞세워 글로벌 PC 시장 공략을 가속화하고 있다. 노트북 제조사들의 친환경 디자인 경쟁 흐름을 반영한다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/computing/acer-recommits-to-repairability-with-new-vero-16-laptop/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 베로 16 노트북"}, {"title": "Acer Shows Off a Transformer-ish Concept for a Windows Gaming Handheld", "summary": "에이서가 IFA 2026에서 윈도 기반의 독창적인 변신형(Transformer-ish) 게이밍 핸드헬드 컨셉트 기기를 공개했다. 컴퓨터로서의 듀얼 업무 수행 능력을 극대화하기 위해 탈부착 가능한 키보드를 탑재한 것이 특징이다. 휴대용 게이밍 기기 시장에서 차별화된 폼팩터 경쟁력을 제시하고 있다. PC 제조사들의 새로운 폼팩터 실험을 보여준다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/gaming/acer-shows-off-a-transformer-ish-concept-for-a-windows-gaming-handheld/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 게이밍 핸드헬드"}, {"title": "Microsoft is enabling a Windows 11 security feature that can hurt gaming performance", "summary": "마이크로소프트가 다음 달 더 많은 기기를 대상으로 윈도우 11의 메모리 무결성 보안 기능을 확대 적용할 예정이다. 커널 수준의 보호 기능은 악성 코드 차단에 유용하지만 일부 게이밍 성능 저하를 유발할 수 있다. 보안 강화와 성능 저하 사이의 트레이드오프로 사용자들의 불만이 예상된다.", "source": "The Verge", "date": "2026-09-02 17:57", "url": "https://www.theverge.com/news/988056/microsoft-windows-11-memory-integrity-rollout-october-2026", "category": "quality", "importance": 3, "wl": true, "topic": "윈도우 11 메모리 무결성"}, {"title": "Dell’s newest laptop sounds a lot like a MacBook Neo", "summary": "델이 IFA 2026에서 학생층을 겨냥한 새로운 14S 노트북을 발표했다. 4가지 색상으로 제공되며 8GB RAM과 256GB 스토리지 기본 사양으로 맥북 네오와 유사한 컨셉을 지향한다. 보급형 및 교육용 노트북 시장에서 애플과의 경쟁 구도가 형성되고 있다.", "source": "The Verge", "date": "2026-09-02 16:00", "url": "https://www.theverge.com/gadgets/987839/dell-14s-student-laptop-ifa-2026-price-specs", "category": "launch", "importance": 3, "wl": true, "topic": "델 14s 노트북"}, {"title": "The Dell 14s could be the MacBook Neo alternative you’ve been waiting for", "summary": "델의 14S 노트북이 애플의 맥북 네오에 대항할 수 있는 매력적인 컬러풀한 대안으로 주목받고 있다. 컬러풀한 디자인과 실속 있는 스펙으로 보급형 노트북 시장에서 경쟁 구도가 형성되고 있다.", "source": "Android Authority", "date": "2026-09-02 16:00", "url": "https://www.androidauthority.com/dell-14s-3705796/", "category": "launch", "importance": 3, "wl": true, "topic": "델 14s 맥북 네오 대안"}, {"title": "Dell Doubles Down on Cheap Student Laptops With Lower-End Dell 14S Configs", "summary": "델이 보급형 델 14S 구성을 통해 저렴한 학생용 노트북 시장 공략에 더욱 박차를 가하고 있다. 성능과 가격의 균형을 맞춘 제품군이지만, 최종적인 판매 가격 책정이 시장 성패를 가를 핵심 변수로 남아 있다. 글로벌 교육용 및 보급형 노트북 시장의 경쟁이 치열해지고 있음을 시사한다. 가성비를 중시하는 소비자층을 겨냥한 전략이다.", "source": "CNET", "date": "2026-09-02 16:00", "url": "https://www.cnet.com/tech/computing/dell-doubles-down-on-cheap-student-laptops-with-lower-end-dell-14s-configs/", "category": "launch", "importance": 3, "wl": true, "topic": "델 학생용 노트북 사양"}, {"title": "macOS Golden Gate Seems to Hint at MacBook Pro With OLED Display", "summary": "맥OS 골든 게이트 빌드에서 OLED 디스플레이가 탑재된 차세대 맥북 Pro의 출시 가능성을 암시하는 단서가 발견되었다. 애플이 맥북 라인업에도 OLED 패널 도입을 본격화할 전망이다. IT 디스플레이 시장에서 OLED 전환 트렌드가 가속화되고 있다.", "source": "MacRumors", "date": "2026-09-02 04:34", "url": "https://www.macrumors.com/2026/09/01/macos-golden-gate-hdr-liquid-glass/", "category": "launch", "importance": 3, "wl": true, "topic": "맥os 골든 게이트 oled"}, {"title": "macOS 27 developer beta 8 now available, here’s what’s coming", "summary": "맥OS 27 골든 게이트 공식 출시를 앞두고 애플이 개발자를 위한 맥OS 27 베타 8을 롤아웃했다. 안정성 검증을 위한 주간 테스트 주기가 막바지에 달했다. PC 운영체제의 대규모 업데이트가 임박했음을 시사한다.", "source": "9to5Mac", "date": "2026-09-01 02:16", "url": "https://9to5mac.com/2026/08/31/macos-27-developer-beta-8-now-available-heres-whats-coming/", "category": "quality", "importance": 3, "wl": true, "topic": "맥os 27 개발자 베타 8"}, {"title": "Mac Studio Buyer's Guide: M5 Max vs. M5 Ultra", "summary": "맥 스튜디오 구매를 앞두고 M5 맥스와 M5 울트라 칩셋 간의 성능 차이를 비교하는 가이드가 제공되었다. 고성능 크리에이터용 데스크톱 시장에서의 선택 기준을 제시한다.", "source": "MacRumors", "date": "2026-09-02 21:07", "url": "https://www.macrumors.com/guide/m5-max-vs-m5-ultra/", "category": "launch", "importance": 2, "wl": true, "topic": "맥 스튜디오 바이어스 가이드"}, {"title": "This concept handheld can turn into a laptop, complete with a keyboard", "summary": "별도의 키보드를 들고 다닐 필요 없이 컴퓨터 키보드가 통합된 에이서의 혁신적인 핸드헬드 PC 컨셉 디자인이 소개되었다. 휴대성과 생산성을 결합한 하드웨어 실험이다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-project-dualplay-mini-handheld-concept-3705278/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 컨셉 핸드헬드 노트북"}, {"title": "Acer’s new ePaper monitor could make long work sessions easier on the eyes", "summary": "에이서가 장시간 업무 시 눈의 피로를 덜어주기 위해 종이 같은 디스플레이와 터치, 고해상도를 지원하는 포터블 모니터 'EP130K'를 공개했다. 눈 건강을 중시하는 틈새 디스플레이 시장을 겨냥했다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-epaper-monitor-launch-3705490/", "category al/oura-menopause-impact-scale-womens-health-care/", "category": "other", "importance": 1, "wl": true, "topic": "오라 링 헬스케어 확장"}, {"title": "Ultrahuman wants real-world health data, and is asking its users for it", "summary": "스마트링 제조사인 울트라휴먼이 실제 사용자들로부터 리얼월드 건강 데이터를 수집하기 위해 적극적인 참여를 요청하고 있다. 사용자 건강 정보를 기업 연구에 활용하는 방식을 두고 데이터 프라이버시 관련 논의가 제기된다. 디지털 헬스케어 기기 시장에서 방대한 데이터 확보의 중요성을 보여준다. 사용자 신뢰 구축이 핵심 과제로 꼽힌다.", "source": "Android Authority", "date": "2026-09-01 22:00", "url": "https://www.androidauthority.com/ultrahuman-pulsomics-research-program-3705215/", "category": "other", "importance": 1, "wl": true, "topic": "울트라휴먼 헬스 데이터"}, {"title": "스마트워치 “500㎉ 태웠다” 믿었는데…실제 소모량은 350㎉일 수도 - v.daum.net", "summary": "스마트워치가 표시하는 칼로리 소모량 수치와 실제 인체가 소모한 에너지 간에 차이가 발생한다는 지적이다. 500㎉로 표시되어도 실제로는 350㎉ 수준일 수 있어 정확도 개선이 과제로 꼽힌다.", "source": "v.daum.net", "date": "2026-09-02 15:04", "url": "https://v.daum.net/v/20260902150437177", "category": "quality", "importance": 3, "wl": false, "topic": "스마트워치 칼로리 오차"}, {"title": "Samsung Fit 1 Fitness Tracker Galaxy Fit2 Ios A Man Standing On Top Of A Grass Covered Hil", "summary": "", "source": "krepsiniozinios", "date": "2026-09-02 05:54", "url": "https://www.krepsiniozinios.lt/productSearch/pictureSearch?id=38524787050390", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "‘가성비’ 앞세운 中 웨어러블 공세…삼성전자, AI 헬스케어로 맞불 - 파이낸셜투데이", "summary": "", "source": "파이낸셜투데이", "date": "2026-09-02 01:39", "url": "http://www.ftoday.co.kr/news/articleViewAmp.html?idxno=364587", "category": "other", "importance": 3, "wl": false, "topic": ""}], "phone": [{"title": "Apple's iPhone Ultra Crease Fix Set for Android Foldables Next Year", "summary": "애플의 폴더블 아이폰 울트라에 적용된 화면 주름 개선 기술이 내년 안드로이드 폴더블폰 전반에 채택될 예정이다. 애플의 폼팩터 진입이 안드로이드 진영의 기술 표준에도 영향을 미치고 있다. 삼성 갤 Z 폴드 시리즈의 폼팩터 경쟁력에 직결되는 사안으로 면밀한 기술 분석이 필요하다.", "source": "MacRumors", "date": "2026-09-02 20:57", "url": "https://www.macrumors.com/2026/09/02/iphone-ultra-crease-coming-to-android-foldables/", " }
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
