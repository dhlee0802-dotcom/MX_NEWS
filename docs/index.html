se}, {"title": "The Big Questions Before Apple’s Big iPhone Event", "summary": "애플의 대규모 아이폰 행사를 앞두고 소비자들이 폴더블 아이폰에 두 배의 가격을 지불할 것인지에 대한 의문이 제기되고 있다. 폴더블폰 시장 진입을 앞둔 애플의 가격 전략과 소비자 반응이 주목된다. 삼성전자가 주도하는 폴더블폰 시장 구도에 변화를 줄지 관심이 모인다.", "source": "CNET", "date": "2026-09-05 02:15", "url": "https://www.cnet.com/tech/mobile/the-big-questions-before-apples-big-iphone-event/", "category": "launch", "importance": 3, "wl": true, "topic": "애플 아이폰 이벤트 사건", "alert": false}, {"title": "Will the iPhone 18 Pro’s biggest upgrade really deliver?", "summary": "차기 아이폰 프로 모델은 전작에 비해 큰 폭의 성능 향상을 이루지 못할 것이라는 전망이 지배적이다. 구형 아이폰 사용자라면 다가오는 신제품 출시보다 이전 모델인 아이폰 17 프로를 구매하는 것이 합리적일 수 있다는 분석이 제기된다. 스마트폰 시장의 혁신 정체와 교체 주기 연장 추세를 보여준다.", "source": "9to5Mac", "date": "2026-09-05 01:00", "url": "https://9to5mac.com/2026/09/04/will-the-iphone-18-pros-biggest-upgrade-really-deliver/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 프로 예상 업그레이드", "alert": false}, {"title": "You can now get Samsung’s Galaxy S26 FE for less than $3 a month", "summary": "삼성전자의 최신 팬 에디션 스마트폰인 갤럭시 S26 FE를 월 3달러 미만의 파격적인 비용으로 이용할 수 있는 매우 매력적인 구매 프로모션이 등장했다. 가성비를 중시하는 소비자층을 집중 공략하여 보급형 플래그십 시장의 점유율을 빠르게 확대하려는 전략이다. 글로벌 스마트폰 시장에서 공격적인 가격 마케팅이 전개되고 있다.", "source": "Android Authority", "date": "2026-09-04 23:00", "url": "https://www.androidauthority.com/att-samsung-galaxy-s26-fe-deal-3707450/", "category": "price", "importance": 3, "wl": true, "topic": "삼성 갤럭시 에프이 파격 할인", "alert": false}, {"title": "Apple Reportedly Plans to Release These 14 Products by Early Next Year", "summary": "애플이 내년 초까지 아이폰 신제품과 웨어러블 등을 포함해 총 14개에 달하는 대거 신제품 출시를 준비하고 있다는 로보트가 공개되었다. 연말연시와 연초 성수기를 겨냥한 공격적인 하드웨어 출시 전략을 통해 시장 점유율을 극대화하려는 의도다. 글로벌 IT 하드웨어 시장에 큰 지각변동을 예고하고 있다.", "source": "MacRumors", "date": "2026-09-04 22:55", "url": "https://www.macrumors.com/2026/09/04/apple-14-more-products-by-early-next-year/", "category": "launch", "importance": 3, "wl": true, "topic": "애플 내년 초 신제품 출시", "alert": false}, {"title": "The world’s first triple-200MP camera phone has leaked, and it looks familiar", "summary": "세 개의 2억 화소 카메라 센서를 탑재한 세계 최초의 스마트폰 디자인이 유출되며 업계의 이목을 집중시키고 있다. 거대한 카메라 아일랜드 모듈은 모바일 사진 촬영 기술의 한계를 뛰어넘으려는 제조사의 매우 야심 찬 시도를 보여준다. 스마트폰 카메라 스펙 경쟁이 새로운 국면에 접어들고 있다.", "source": "Android Authority", "date": "2026-09-04 22:37", "url": "https://www.androidauthority.com/oppo-find-x10-pro-max-design-leak-3707675/", "category": "launch", "importance": 3, "wl": true, "topic": "세계 최초 트리플 억만화소 스마트폰", "alert": false}, {"title": "I Took the Pixel 11 Pro and iPhone 17 Pro Around Delhi, and I Know Which Phone Camera’s th", "summary": "새로운 카메라 성능이 강화된 픽셀 11 프로와 아이폰 17 프로의 카메라 성능 비교 평가가 진행되었다. 애플의 신제품 발표를 앞두고 두 플래그십 스마트폰 간의 카메라 화질 경쟁이 주목받고 있다. 모바일 촬영 기술력의 우위를 가늠하는 지표가 된다.", "source": "CNET", "date": "2026-09-04 21:00", "url": "https://www.cnet.com/tech/mobile/i-took-the-pixel-11-pro-and-iphone-17-pro-around-delhi-and-i-know-which-phone-cameras-the-best-for-me/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 프로 사건", "alert": false}, {"title": "This phone could support a crazy 500mm teleconverter lens for 20x optical zoom", "summary": "차세대 스마트폰에 파격적인 500mm 망원 컨버터 렌즈가 탑재되어 20배 광학 줌과 함께 약 41배에 달하는 무손실 해상도 줌을 지원할 가능성이 제기되었다. 모바일 카메라의 광학 줌 한계를 극복하고 DSLR 수준의 망원 촬영 성능을 구현하려는 시도다. 플래그십 스마트폰의 카메라 스펙 경쟁이 극한으로 치닫고 있다.", "source": "Android Authority", "date": "2026-09-04 18:02", "url": "https://www.androidauthority.com/this-phone-support-crazy-20x-external-lens-3707503/", "category": "launch", "importance": 3, "wl": true, "topic": "스마트폰 500미리 망원 렌즈", "alert": false}, {"title": "Your older Pixel phone may finally be getting Quick Share AirDrop support", "summary": "구글 픽셀 7 및 픽셀 8 등 구형 픽셀 스마트폰 사용자들을 대상으로 애플 에어드롭과 유사한 파일 공유 기능을 지원하는 놀라운 퀵셰어 알림이 포착되기 시작했다. 서로 다른 모바일 생태계 간의 파일 전송 장벽을 허물려는 구글의 크로스플랫폼 연동 전략이 구형 기기로 확대되고 있다. 모바일 사용자 경험의 호환성이 점차 개선되는 추세다.", "source": "Android Authority", "date": "2026-09-05 02:30", "url": "https://www.androidauthority.com/pixel-airdrop-3707826/", "category": "launch", "importance": 2, "wl": true, "topic": "픽셀 퀵셰어 에어드롭 지원", "alert": false}, {"title": "Survey shows how divisive the Pixel 11’s Tensor G6 really is", "summary": "픽셀 11에 탑재된 텐서 G6 칩셋이 사용자들 사이에서 얼마나 큰 찬반 양론을 불러일으키고 있는지 보여주는 설문조사 결과가 공개되었다. 독자 칩 성능에 대한 사용자들의 평가가 엇갈리는 가운데 차세대 텐서 G7에 대한 기대와 바램도 함께 조명되었다. 자체 AP를 보유한 제조사들의 칩셋 전략이 직면한 과제를 보여준다.", "source": "Android Authority", "date": "2026-09-04 19:20", "url": "https://www.androidauthority.com/google-tensor-g6-g7-poll-results-3707517/", "category": "other", "importance": 2, "wl": true, "topic": "픽셀 텐서 칩셋 설문조사", "alert": false}, {"title": "I tested 2 of the best Android foldables of 2026. Here’s how to avoid buying the wrong one", "summary": "2026년 출시된 최고의 안드로이드 폴더블폰 두 종을 직접 테스트해본 결과 올바른 제품을 구매하기 위한 구체적인 가이드가 제시되었다. 모토로라 레이저 폴더블 등 경쟁력 있는 제품들이 강력한 대안으로 떠오르면서 소비자의 선택 기준을 분석했다. 폴더블 스마트폰 시장의 성숙과 함께 제품 간 비교 평가가 활발하다.", "source": "Android Authority", "date": "2026-09-04 19:00", "url": "https://www.androidauthority.com/galaxy-z-fold-8-vs-razr-fold-hands-on-3704049/", "category": "launch", "importance": 2, "wl": true, "topic": "안드로이드 폴더블폰 비교 분석", "alert": false}, {"title": "Google’s Scam Detection feature is expanding to even more Android brands", "summary": "통화 중 보이스피싱 등 사기 시도를 실시간으로 감지해 경고해 주는 구글의 첨단 사기 감지 기능이 샤오미 등 다른 주요 안드로이드 스마트폰 브랜드로 빠르게 확장되고 있다. 구글 독점이었던 핵심 AI 보안 기능이 타사 기기에도 개방되면서 모바일 통신 안전성이 전반적으로 향상될 전망이다. 안드로이스 생태계 전반의 보안 강화 트렌드를 보여준다.", "source": "Android Authority", "date": "2026-09-04 14:45", "url": "https://www.androidauthority.com/google-scam-detection-xiaomi-apk-teardown-3707387/", "category": "launch", "importance": 2, "wl": true, "topic": "구글 사기 감지 기능 확대", "alert": false}, {"title": "John Ternus is now Apple CEO, last-minute iPhone event rumors, Apple TV price increase", "summary": "애플의 신임 CEO로 취임한 존 터너스의 첫 주 업무 수행과 팀 쿡의 향후 역할에 대한 평가가 이어지고 있다. 임박한 아이폰 발표 행사 루머와 건강 관련 기능 업데이트 등 주요 현안들이 다뤄졌다. 새로운 리더십 체제 하에서 애플의 사업 방향성에 대한 시장의 관심이 높다.", "source": "9to5Mac", "date": "2026-09-04 05:00", "url": "https://9to5mac.com/2026/09/03/happy-hour-606/", "category": "exec", "importance": 2, "wl": true, "topic": "존 터너스 ceo 첫 주 평가", "alert": false}]};

<script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
