"메타가 배터리 수명을 대폭 개선하고 두께를 슬림화하면서도 가격을 대폭 낮춘 차세대 보급형 스마트 글래스 '레이밴 메타(Gen 3)'를 공식 발표했습니다. 역대 가장 저렴한 가격대를 형성하여 일상 착용형 스마트 글래스의 글로벌 대중화를 본격 견인하겠다는 전략입니다. 스마트 안경 시장에서 메타의 독주 체제가 한층 강화될 것으로 전망됩니다. 당사 차세대 AI 글래스 출시 시점의 가격 책정 및 폼팩터 전략 수립에 결정적인 위협 요인입니다.", "source": "Android Authority", "date": "2026-09-24 15:52", "url": "https://www.androidauthority.com/meta-glasses-ray-ban-meta-gen-3-launched-3714910/", "category": "launch", "importance": 5, "sid": "glasses", "topic": "메타 레이밴 메타 gen 3 보급형 스마트 글래스"}, {"title": "Meta’s newest smart glasses ditch the camera to avoid the ‘pervert-glasses’ tag", "summary": "메타가 공공장소에서의 불법 촬영 논란 및 프라이버시 오명을 극복하기 위해 카메라를 과감히 없앤 신형 스마트 글래스와 아기자기한 AI 디바이스 '뮤즈 참'을 공개했습니다. 사용자의 사생활 침해 우려를 원천 차단하면서 음성 기반 AI 어시스턴트 기능에만 집중할 수 있는 새로운 카테고리를 개척했습니다. 스마트 웨어러블에 대한 대중의 거부감을 낮추기 위한 파격적인 하드웨어 설계 전략입니다. 당사의 XR 및 AI 웨어러블 기기 제품 기획에 중대한 기준점을 제시합니다.", "source": "Android Authority", "date": "2026-09-24 15:20", "url": "https://www.androidauthority.com/ray-ban-meta-audio-muse-charm-launched-3714882/", "category": "launch", "importance": 5, "sid": "glasses", "topic": "메타 카메라 없는 스마트 글래스 및 뮤즈 참"}, {"title": "Meta’s new featherweight VR Glasses take a swing at Apple Vision Pro with IMAX and hologra", "summary": "메타가 애플 비전 프로 가격의 절반 이하라는 파격적인 가성비와 함께 IMAX 스크린 및 홀로그램 기술을 탑재한 초경량 VR 글래스를 전격 공개하며 애플에 정면으로 도전장을 던졌습니다. 프리미엄 XR/VR 헤드셋 시장에서 고가 전략(애플)과 대중적 저가 전략(메타) 간의 전면전이 시작되었음을 알리는 중대 사건입니다. XR 시장의 가격 장벽을 무너뜨리는 파괴적인 행보입니다. 삼성전자가 구글과 협력하여 출시를 준비하고 있는 XR 헤드셋의 가격 정책, 타겟팅, 하드웨어 스펙 전략에 즉각적이고 전면적인 재검토를 요구하는 매우 긴급한 경쟁 정보입니다.", "source": "Android Authority", "date": "2026-09-24 15:10", "url": "https://www.androidauthority.com/meta-vr-glasses-launch-3714878/", "category": "launch", "importance": 5, "sid": "glasses", "topic": "메타 vr글래스"}, {"title": "[AI 슈퍼사이클 나비효과]下 HBM 품귀에 스마트폰도…'프리미엄 쏠림' 심화 - v.daum.net", "summary": "AI 슈퍼사이클의 나비효과로 HBM 품귀 현상이 심화되면서 일반 스마트폰 부품 가격에도 영향을 미치고 프리미엄 모델로의 쏠림 현상이 심화되고 있다는 분석 기사입니다. 원가 상승 압박 속에서 제조사들의 전략 변화를 다루고 있습니다.", "source": "v.daum.net", "date": "2026-09-2 ory prices squeeze sector - China Daily", "summary": "치솟는 메모리 반도체 가격으로 인해 모바일 부문 원가 압박이 가중되면서 전 세계 스마트폰 출하량 전체가 심각한 타격과 압박을 받고 있다. 당사 스마트폰 사업의 거시적 리스크 요인이다.", "source": "China Daily", "date": "2026-09-23 21:29", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTFBvY1ZONGJKSVFmN0ZxMGxTUHNiM3NoUnBVdGpVaWFLVllBcjlScE9ESHNYbkVYTWJZRTMtTjhfUVNOR0cxaDdHU0Fzbl96YjdrbTd3NzlpQVNFNjNZY0tVTnlSZzVld1p2eXhncVpCcjVMam9iR3BwR0NIYzR3QQ?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "메모리 가격 스마트폰 출하량 압박"}, {"title": "Samsung’s next flagship tablets leak with familiar looks and big battery claims", "summary": "삼성전자의 차기 플래그십 태블릿이 친숙한 디자인과 대용량 배터리 주장을 담아 유출되었다. 배터리 지속 시간 및 내구성에 대한 정보가 유출된 정보 더미에 합류했다. 당사 플래그십 태블릿 신제품 출시를 앞둔 사전 유출 정보로 주시가 필요하다.", "source": "Android Authority", "date": "2026-09-23 18:00", "url": "https://www.androidauthority.com/galaxy-tab-s12-ultra-renders-battery-leak-3714396/", "category": "launch", "importance": 5, "sid": "tablet", "topic": "galaxy 사건"}, {"title": "\"반도체값 올랐는데 왜 우리가?\"…국내 부품사들 '날벼락' - 한국경제", "summary": "메모리 반도체 가격이 급등한 여파로 인해 스마트폰 제조사에 부품을 공급하는 국내 협력업체들과 부품사들이 심각한 원가 압박에 직면했습니다. 완성품 단가는 올리기 어려운 상황에서 부품 비용만 치솟아 채산성이 악화되고 있습니다. 모바일 생태계 전반의 하청 및 협력사들이 연쇄적인 타격을 입고 있습니다. MX사업부의 공급망 관리에도 악영향을 미치는 중대한 이슈입니다.", "source": "한국경제", "date": "2026-09-23 16:40", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE9yYnk3SFNLSUx3ZWctWUlBZVNUN0xzRlgzN1B2cmZEZkI0eVBsQWV4LXZhYzdXaW45blp6ODNja0dVR1g0SHJXQS1uYnRrMUhTNTlsV2JWci0wdw?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "부품사 반도체값인상 날벼락"}, {"title": "Facing trouble with the Home Up Good Lock module? You’re not alone, and a fix is coming", "summary": "삼성전자의 커스텀 커뮤니티 및 굿락(Good Lock) '홈 업(Home Up)' 모듈 사용 중 사용자 정의 폴더 라벨 색상 설정에서 발생한 오류로 인해 불편을 겪는 사용자들이 속출하고 있으며, 삼성 측이 공식 수정 패치를 준비 중입니다. 당사 소프트웨어 서비스 오류 및 긴급 조치 사안에 해당합니다. 공식 서비스 오류에 대한 패치 조치가 진행 중입니다.", "source": "Android Authority", "date": "2026-09-23 16:31", "url": "https://www.androidauthority.com/good-lock-home-up-backup-issues-3714410/", "category": "quality", "importance": 5, "sid": "phone", "topic": "굿락 홈 업"}, {"title": "“메모리가 혼자 다 끌고 간다…삼성전자 3분기 영업이익 100조 폭발, 가전·폰 적자도 압도” - 뉴스퀘스트", "summary": "메모리 반도체 부문의 독보적인 실적 호조에 힘입어 삼성전자의 3분기 영업이익이 100조 원을 폭발적으로 돌파할 것으로 보이며, 가전 및 스마트폰 부문의 적자 우려마저 압도하고 있다는 보도입니다. 반도체 슈퍼 사이클이 전사 실적을 견인하는 구조가 극대화되었습니다. 세트 사업의 부진을 반도체 이익이 완전히 상쇄하는 양상입니다. 전사 차원의 자원 배분과 실적 구조를 이해하는 데 핵심적인 뉴스입니다.", "source": "뉴스퀘스트", "date": "2026-09-23 15:23", "url": "https://news.google.com/rss/articles/CBMib0FVX3lxTE1ZNDhwUUhkdTJCQkx1U0ZxelcxVkdoTThXSTBkSW8zbVBibVVNem1fSXpVQ3puY1ZreFRPTVlEZFdvMHFlNk56NjBLNGJsWVEyeGg3dlZzeTViLUxRTElxTTREWkRBSDlRd2VKaUN1aw?oc=5", "category": "exec", "importance": 5, "sid": "memchina", "topic": "삼성전자 3분기 메모리 영업익 100조"}, {"title": "The Galaxy S26 series is now getting stable One UI 9 in the US!", "summary": "미국에서 갤럭시 S26 시리즈에 대한 원 UI 9 안정화 업데이트가 시작되었습니다. 티모바일 S26 울트라를 시작으로 순차적으로 배포될 예정입니다. 당사 플래그십 모델의 최신 소프트웨어 업그레이드가 본격적으로 적용되는 중대한 사건입니다.", "source": "Android Authority", "date": "2026-09-23 15:11", "url": "https://www.androidauthority.com/samsung-galaxy-s26-series-stable-one-ui-9-us-3714362/", "category": "launch", "importance": 5, "sid": "phone", "topic": "galaxy s26 one ui 9"}, {"title": "메모리 뺀 삼성전자 올해 실적 심상찮다⋯모바일.완제품 적자 우려 - 엠투데이", "summary": "메모리 반도체를 제외할 경우 삼성전자의 올해 실적이 심상치 않으며 모바일 및 완제품(MX) 부문에서 적자 우려까지 제기되었습니다. 부품가 상승과 세트 수요 부진이 겹치면서 MX 사업부의 수익성이 심각한 위협을 받고 있음을 경고합니다. 경영진의 즉각적인 비용 통제 및 대응 전략 수립이 필수적입니다.", "source": "엠투데이", "date": "2026-09-23 14:47", "url": "https://news.google.com/rss/articles/CBMib0FVX3lxTFBvY2I0TXhDNXpwcGdmbFl3VXY1OU9ycFBWczUtTEFoWk9NdEZYRTdpc2pfbnNMVnhKZndaUXNZQ1c1WkNiSHlEam9VZEw2b2RXck8tRDhkamNMOXVWNk9CZXd3TmNoN0tNVTJMRVBlbw?oc=5", "category": "exec", "importance": 5, "sid": "memchina", "topic": "삼성전자 실적 우려"}, {"title": "\"이 가격 못 맞추면 안방 뺏긴다\"…중국산 공습에 '초비상' - 한국경제", "summary": "중국산 저가 공세에 대응해 이 가격을 맞추지 못하면 안방 시장을 빼앗길 수 있다는 위기감 속에 국내 업계가 초비상 상태에 빠졌다. 저가형 제품군을 중심으로 가격 경쟁이 극한으로 치달으면서 수익성 확보에 비상이 걸렸다. 당사 완제품 사업의 시장 방어를 위한 즉각적인 대응 전략 수립이 시급하다.", "source": "한국경제", "date": "2026-09-23 14:46", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTFBTS0Q4UnJBazN3TUJrazEyRzdDU1FVOWpfSjhDZlhNTTdtQURHaDlaRUhmeHc4MDNvdFRNQ295cmJqSVdjSVpVbS10MmJIWXJTQjRiQTgxb1pxdw?oc=5", "category": "price", "importance": 5, "sid": "memchina", "topic": "중국산 부품 공습"}, {"title": "삼성전자, 차세대 D램 'D0a' 로드맵 수정…하이브리드 본딩 앞당긴다", "summary": "삼성전자가 차세대 D램 개발 전략을 수정하여 기존 프로젝트성 기술인 'B1b'를 정식 로드맵에 편입하고 첫 10나노미터 미만 D램인 'D0a'로 명명했다. 수직트랜지스터 D램은 'D0a-V'로 분리했으며 하이브리드 본딩 도입 시기를 앞당기는 등 초격차 기술 확보에 속도를 내고 있다. 메모리 반도체 초미세 공정 경쟁에서 기술 리더십을 유지하기 위한 전면적인 전략 개편이다. 삼성 MX사업부가 의존하는 메모리 반도체 공급 및 원가 구조에 직결되는 매우 중요한 정보이다.", "source": "ZDNet Korea", "date": "2026-09-23 14:06", "url": "https://zdnet.co.kr/view/?no=20260923090551", "category": "launch", "importance": 5, "sid": "memchina", "topic": "삼성전자 차세대 d램 d0a 로드맵 수정"}, {"title": "삼성전자 냉장고, SW 업데이트 이후 '먹통'…“무상 수리 제공”", "summary": "삼성전자 일부 냉장고 제품에서 스마트싱스를 통한 소프트웨어 업데이트 이후 작동이 멈추거나 냉각 기능에 오류가 발생하는 피해가 접수되었다. 소비자들이 큰 불편을 겪고 있으며 삼성전자는 무상 수리를 제공하기로 했다. 홈 IoT 가전의 소프트웨어 안정성 및 품질 관리에 대한 신뢰도 타격이 우려된다. 즉각적인 고객 지원과 원인 규명이 필요한 사안이다.", "source": "전자신문", "date": "2026-09-23 13:35", "url": "https://www.etnews.com/20260923000158", "category": "quality", "importance": 5, "sid": "memchina", "topic": "삼성전자 냉장고"}, {"title": "스마트폰 집중 모드와 무음 모드, 알림 차단 범위 다르다", "summary": "스마트폰 의 집중 모드와 무음 모드는 알림을 다루는 범위가 다르다. 무음 모드는 주로 알림 소리와 진동을... 삼성전자도 갤럭시 방해 금지 모드에서 연락처·앱·알람 예외와 알림 숨김 방식을 설정할 수 있으며, 메뉴는...", "source": "vegannews.co.kr", "date": "2026-09-23 13:22", "url": "https://www.vegannews.co.kr/news/article.html?no=386546", "category": "other", "importance": 5, "sid": "phone", "topic": ""}, {"title": "새 스마트폰 가격 폭등에 ‘중고폰도 290만원’ - v.daum.net", "summary": "신형 스마트폰의 출고가가 폭등하면서 중고 스마트폰 가격마저 290만 원에 육박하는 기현상이 벌어지고 있습니다. 부품 원가 상승과 인플레이션 여파로 모바일 기기 전체의 가격 장벽이 급격히 높아졌습니다. 소비자의 교체 수요 위축을 불러올 수 있는 심각한 시장 상황입니다. 삼성전자의 신제품 판매 전략과 가격 저항선 방어에 큰 부담으로 작용합니다.", "source": "v.daum.net", "date": "2026-09-23 11:18", "url": "htt mmary": "삼성전자는 공식 부인했음에도 불구하고 스마트폰 시장 내에서 중국산 메모리를 채택하여 사용할 것이라는 관측과 소문이 끊이지 않고 있습니다. 원가 절감을 위해 공급망 다변화를 모색할 수밖에 없는 시장 상황을 반영합니다. 품질 및 보안 이슈와 직결될 수 있는 민감한 사안입니다. 향후 부품 조달 정책에 대한 업계의 의구심이 해소되지 않고 있습니다.", "source": "문화일보", "date": "2026-09-22 11:58", "url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFBEUGxpU01mUTdteU1ldGRZQ1JYdk05RUZFSDdYQU1IbkU1UmstdHVxNXFSLXNISDZtVDRkaVZyTVZLTkZmQW5IUl9ZRk9yenN0?oc=5", "category": "quality", "importance": 5, "sid": "memchina", "topic": "스마트폰 중국메모리"}, {"title": "아이폰 디스플레이에 COE·LTPO+ 도입 늦어진다", "summary": "애플이 내년 출시 20주년 아이폰에 적용하려던 컬러필터인캡슐레이션(COE)과 저온다결정실리콘산화물 플러스(LTPO+) 등 차세대 디스플레이 신기술 채택 시점을 연기할 전망이다. 기술 성숙도가 기대에 못 미치는 데다 메모리 가격 폭등(칩플레이션) 여파로 원가 부담이 커졌기 때문이다. 원가 절감 압박 속에서 플래그십 신기술 도입에 속도조절을 하는 애플의 전략적 판단을 보여준다. 삼성전자 MX사업부의 원가 관리 및 디스플레이 공급망 전략에도 중요한 시사점을 제공한다.", "source": "전자신문", "date": "2026-09-22 10:21", "url": "https://www.etnews.com/20260922000179", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰 20주년 디스플레이 신기술 도입 지연"}, {"title": "HBM에 발목 잡힌 K반도체, 中 CXMT에 범용 D램 맹추격 허용 - nbn 시사경제", "summary": "HBM 시장 선점에 발이 묶인 K반도체의 허를 찔러, 중국 CXMT가 범용 D램 시장에서 맹추격을 허용하며 점유율을 높여가고 있다. AI용 메모리 쏠림 현상으로 발생한 레거시 시장의 공백을 중국 자본과 물량이 완벽하게 대체하는 모양새다. 메모리 반도체 패권 경쟁의 지형도가 흔들리고 있다. 국가 차원의 반도체 전략 점검이 요구되는 중대한 국면이다.", "source": "nbn 시사경제", "date": "2026-09-22 09:29", "url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFBlQUN3RlJuc3ZxZHRmNVI3clRRWkppaDJ3OW9xV0ltV1VvMk50S1RXQktIa1FIUEZ0bkN2eTRjN2xXSml0cWMyMmp3QVlqNXhvVTJGUVhjZUcwNklmTEVkRU5FNFNmZ2lDTnc?oc=5", "category": "launch", "importance": 5, "sid": "memchina", "topic": "k반도체 hbm 집중 사이 中 범용 d램 침투"}, {"title": "애플, 구형 아이폰까지 100파운드 인상…삼성전자·SK하이닉스 메모리값 ‘힘’ 세졌다 - 중앙이코노미뉴스", "summary": "애플이 구형 아이폰 모델까지 가격을 100파운드 인상한 가운데, 삼성전자와 SK하이닉스의 메모리 가격 협상력이 한층 더 강해졌다. 메모리 공급 부족과 원가 상승 압박을 견디지 못한 세트 업체들이 부품 가격 인상안을 고스란히 수용하고 있다. 메모리 반도체 공급사들의 주도권이 절대적으로 강화되었음을 보여준다. 세트 사업부 입장에서는 원가 상승에 따른 수익성 방어가 시급해진 상황이다.", "source": "중앙이코노미뉴스", "date": "2026-09-22 08:00", "url": "https://news.google.com <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
