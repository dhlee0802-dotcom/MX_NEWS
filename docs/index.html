T2'를 출시하며 삼성전자의 프라이버시 디스플레이 기능을 모방했다는 지적이 나왔다. 메이트 XT2는 삼성전자의 갤럭시 Z 폴드 시리즈에 사용된 안쪽 폴딩 폼팩터를 채택했을 뿐만 아니라 삼성의 사생활 보호 기술까지 의식한 흔적을 보였다. 중국 제조사들의 빠른 추격과 디자인·기능 카피 전략이 다시 한번 도마 위에 올랐다. 삼성전자의 고유 기술과 폼팩터 리더십을 보호하기 위한 모니터링 강화가 요구된다.", "source": "The Verge", "date": "2026-09-07 19:09", "url": "https://www.theverge.com/tech/990958/huawei-mate-xt-2-trifold-launch-china-privacy-display", "category": "quality", "importance": 4, "wl": true, "topic": "메이트 xt2 프라이버시 디스플레이", "alert": false}, {"title": "애플 첫 폴더블 한국 출시 10월 이후로…아이폰18과 시차 둔다", "summary": "애플의 첫 폴더블 스마트폰이 초도 생산 물량 부족으로 인해 북미 지역에 우선 배정되면서 국내 출시 시점이 10월 말 이후로 미뤄질 전망이다. 이로 인해 국내 폴더블폰 시장을 장악하고 있는 삼성전자와의 정면 맞대결도 다소 시차가 발생하게 되었다. 애플의 폴더블폰 진입 일정과 공급망 제약을 보여주는 핵심 소식이다. 삼성 MX사업부의 시장 수성 전략에 영향을 미친다.", "source": "전자신문", "date": "2026-09-07 14:51", "url": "https://www.etnews.com/20260907000344", "category": "launch", "importance": 4, "wl": true, "topic": "애플 첫 폴더블 한국 출시 10월 연기", "alert": false}, {"title": "Motorola and Google foldables are quietly beating Samsung where it counts", "summary": "모토로라와 구글의 폴더블 스마트폰들이 소비자들이 진정으로 중요하게 여기는 폴더블 특화 기능들에서 삼성전자를 조용히 앞서나가고 있다는 분석이 제기되었다. 삼성전자가 안주하는 사이 실질적인 폴더블 사용성 측면에서 경쟁사들에게 추격을 허용하고 있다는 지적이다. 삼성 MX사업부의 폴더블 소프트웨어 및 하드웨어 혁신 전략에 대한 강한 경고다.", "source": "Android Authority", "date": "2026-09-06 19:30", "url": "https://www.androidauthority.com/motorola-google-foldables-beat-samsung-3704932/", "category": "quality", "importance": 4, "wl": true, "topic": "모토로라 구글 폴더블폰 삼성 추월", "alert": false}, {"title": "I want better Samsung phones, but these new sales numbers show why we won’t get them", "summary": "최근 공개된 삼성전자의 스마트폰 판매 수치와 시장 성과는 왜 삼성이 하드웨어 혁신을 더 강하게 밀어붙일 동기를 갖기 어려운지를 적나라하게 보여주고 있다. 안정적인 판매량에 안주할 경우 장기적으로 혁신 경쟁에서 뒤처질 수 있다는 우려가 제기된다. 삼성 MX사업부의 제품 기획 및 혁신 전략에 대한 쓴소리를 담고 있다.", "source": "Android Authority", "date": "2026-09-06 18:30", "url": "https://www.androidauthority.com/samsung-record-sales-keep-us-from-better-phones-3704357/", "category": "policy", "importance": 4, "wl": true, "topic": "삼성 스마트폰 판매량 하드웨어 혁신 정체", "alert": false}, {"title": "Here’s how iPhone Ultra’s form factor could compare to other Apple products", "summary": "애플이 첫 번째 폴더블 스마트폰인 '아이폰 울트라'를 5.5인치 외장 디스플레이와 7.6인치 내장 디스플레이 사양으로 공개할 예정이다. 앞서 삼성전자가 갤럭시 Z 폴드 시리즈를 선보인 가운데, 애플의 가세로 폴더블폰 시장의 판도가 크게 요동칠 것으로 보인다. 폼팩터 경쟁이 본격화되면서 양사의 제품 규격과 디자인 비교가 화두가 되고 있다. 삼성 MX사업부의 시장 점유율 방어 전략에 직접적인 영향을 미칠 중대 사안이다.", "source": "9to5Mac", "date": "2026-09-06 04:15", "url": "https://9to5mac.com/2026/09/05/iphone-ultra-form-factor-comparison/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 폴더블폰 폼팩터", "alert": false}, {"title": "One UI 9 quietly solves time zone math while calling", "summary": "삼성전자의 원 UI 9(One UI 9)이 통화 중 상대방과의 시차를 자동으로 계산해 주는 기능을 조용히 도입하여 사용자의 편의성을 높였다. 글로벌 통화 시 시차를 확인해야 했던 번거로움을 해결해 주는 실용적인 소프트웨어 업데이트다. 사용자 경험(UX) 측면에서 갤럭시 스마트폰의 경쟁력을 강화하는 요소다. 운영체제 업데이트를 통한 디테일한 기능 개선 사례다.", "source": "Android Authority", "date": "2026-09-07 23:28", "url": "https://www.androidauthority.com/one-ui-9-call-brief-international-calling-3708416/", "category": "quality", "importance": 3, "wl": true, "topic": "원유아이 9 통화 시간대 계산 기능", "alert": false}, {"title": "Three new iPhones launch this week, here’s what’s coming", "summary": "애플이 9월 수요일에 개최하는 대규모 가을 행사를 통해 아이폰 18 프로, 아이폰 18 프로 맥스, 그리고 새로운 아이폰 울트라 등 3종의 신제품을 선보일 예정이다. 매년 가을 스마트폰 시장의 가장 큰 이벤트 중 하나로 전 세계의 이목이 집중된다. 이번 라인업에는 새로운 폼팩터와 성능 업그레이드가 포함될 것으로 기대된다. 프리미엄 스마트폰 시장의 경쟁 판도를 흔들 핵심 이벤트다.", "source": "9to5Mac", "date": "2026-09-07 21:23", "url": "https://9to5mac.com/2026/09/07/three-new-iphones-launch-this-week-heres-whats-coming/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 18 시리즈 신제품 공개", "alert": false}, {"title": "The real reason your phone is getting more expensive", "summary": "애플이 차세대 아이폰을 출시할 때 가격표를 인상할 것으로 예상되며 스마트폰 가격 상승의 원인에 관심이 쏠리고 있다. 공급망의 강자인 애플의 가격 인상은 치솟는 원자재 및 부품 비용을 반영한 결과로 분석된다. 이는 스마트폰 업계 전반의 가격 상승세를 이끄는 명확한 신호가 될 수 있다. 삼성전자 등 경쟁사들의 향후 제품 가격 책정 전략에도 적지 않은 압박으로 작용할 전망이다.", "source": "The Verge", "date": "2026-09 ding its own RCS support to cut Google Messages out of the picture", "summary": "보안 중심의 운영체제인 그래핀오에스(GrapheneOS)가 구글 메시지를 배제하고 자체적인 RCS(차세대 문자 메시지) 지원 기능을 개발하고 있다. 메시징 앱의 전면적인 재설계와 클립보드 접근 권한 개편도 함께 추진된다. 프라이버시를 중시하는 대안 OS 시장의 기술적 움직임을 보여준다. 모바일 보안 생태계의 다양성을 시사한다.", "source": "Android Authority", "date": "2026-09-07 22:24", "url": "https://www.androidauthority.com/grapheneos-messaging-rcs-support-secure-paste-3708317/", "category": "quality", "importance": 2, "wl": true, "topic": "그래핀오에스 rcs 지원 구글 배제", "alert": false}, {"title": "More Android apps could soon save you from sending accidental nudes", "summary": "구글이 안드로이드 포토 피커(Photo Picker)에 온디바이스 세이프티코어(SafetyCore) 기반의 민감 콘텐츠 경고 시스템을 도입하여 실수로 부적절한 사진을 전송하는 상황을 방지할 수 있게 할 예정이다. 스마트폰 사용자 보호와 프라이버시 강화를 위한 OS 차원의 기능 추가다. 구글의 모바일 보안 및 AI 기반 안전 기능 확대 전략을 보여준다.", "source": "Android Authority", "date": "2026-09-07 22:18", "url": "https://www.androidauthority.com/android-photo-picker-sensitive-content-warning-apk-teardown-3708303/", "category": "quality", "importance": 2, "wl": true, "topic": "안드로이드 민감 콘텐츠 경고 시스템", "alert": false}, {"title": "Pixel 11’s sign language translation feature looks seriously useful in real-world demo", "summary": "구글 픽셀 11의 실시간 수화 번역 기능이 실제 구동 시연을 통해 매우 유용하게 작동하는 모습을 선보였다. 실생활에서 청각장애인 등 소외 계층과의 소통을 돕는 인공지능 활용 사례로 주목받고 있다. 모바일 기기의 접근성과 AI 활용 범위를 넓히는 기술적 성과다.", "source": "Android Authority", "date": "2026-09-07 21:03", "url": "https://www.androidauthority.com/pixel-11-live-sign-language-to-text-translation-real-world-demo-3708253/", "category": "quality", "importance": 2, "wl": true, "topic": "픽셀 11 수화 통역 실시간 시연", "alert": false}, {"title": "I Used the iPhone 17 Pro Max Without a Case for a Year. Here’s How It Looks Now", "summary": "애플이 향상된 내구성을 공언했던 '세라믹 쉴드 2' 보호 유리를 탑재한 아이폰 17 프로 맥스를 1년 동안 케이스 없이 사용한 결과물의 상태를 점검했다. 수년에 걸친 가장 큰 폭의 내구성 업그레이드가 실제로 어떤 저항력을 보여주었는지 평가한다. 스마트폰 소재 및 내구성 기술의 진화 방향을 보여준다.", "source": "CNET", "date": "2026-09-07 21:00", "url": "https://www.cnet.com/tech/mobile/i-used-the-iphone-17-pro-max-without-a-case-for-a-year-heres-how-it-looks-now/", "category": "quality", "importance": 2, "wl": true, "topic": "아이폰 17 프로 맥스 케이스 없이 사용 후기", "alert": false}, {"title": "Apple Plans to Squeeze More Revenue From the App Store, Report Says", "summary": "애플이 앱스토어 생태계를 통해 추가적인 수익을 쥐어짜기 위한 방안을 마련하고 있다는 보도가 이어졌다. 플랫폼 독점력을 이용한 수익화 전략이 규제 당국의 감시를 강화하는 계기가 될 수 있다. 모바일 소프트웨어 시장의 수익 구조 변화를 시사한다.", "source": "MacRumors", "date": "2026-09-07 19:19", "url": "https://www.macrumors.com/2026/09/07/apple-squeeze-more-revenue-from-app-store/", "category": "policy", "importance": 2, "wl": true, "topic": "애플 앱스토어 수익 극대화 정책", "alert": false}, {"title": "6 big problems Apple’s folding iPhone won’t solve (from a long-time foldable user)", "summary": "오랫동안 폴더블폰을 사용해 온 유저의 시각에서 애플의 첫 폴더블 아이폰이 해결하지 못할 6가지 큰 문제점들을 분석했다. 폴더블 기기가 지닌 구조적 한계와 소프트웨어 최적화의 어려움을 지적하며 맹목적인 기대감을 경계한다. 경쟁사 제품 분석을 통해 폴더블 시장의 본질적인 과제를 짚어본다.", "source": "Android Authority", "date": "2026-09-07 19:00", "url": "https://www.androidauthority.com/6-foldable-phone-weaknesses-expect-iphone-ultra-3706213/", "category": "quality", "importance": 2, "wl": true, "topic": "애플 폴더블폰 한계 지적 회의론", "alert": false}, {"title": "Tim Cook Won't Appear in Apple's September 9 Event Video", "summary": "애플의 최고경영자(CEO) 팀 쿡이 다가오는 9월 9일 신제품 발표 이벤트 영상에 출연하지 않을 것으로 알려졌다. 최고 경영진의 부재 속에서 제품 발표가 어떤 방식으로 진행될지 관심이 모아지고 있다. 기업 마케팅 및 최고 경영자의 대외 노출 전략에 관한 소식이다.", "source": "MacRumors", "date": "2026-09-07 18:27", "url": "https://www.macrumors.com/2026/09/07/tim-cook-wont-appear-apple-sept-9-event-video/", "category": "exec", "importance": 2, "wl": true, "topic": "팀쿡 9월 이벤트 영상 불참", "alert": false}, {"title": "This AI-generated iPhone 18 Pro mock ad makes me actually love dark cherry color", "summary": "신제품 발표 행사를 앞두고 AI 기술로 제작된 아이폰 18 프로의 가상 광고 영상이 공개되어 다크 체리 색상 등에 대한 소비자들의 기대감을 높이고 있다. 애플의 'Rise and Surprise' 이벤트를 통해 폴더블 형태의 아이폰 울트라와 신형 프로 라인업이 공개될 예정이다. 마케팅 측면에서 사전 기대감을 고조시키는 바이럴 콘텐츠의 역할을 하고 있다. 모바일 신제품 출시에 대한 대중적 관심을 보여준다.", "source": "9to5Mac", }
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
