: "2026-09-03 18:09", "url": "https://www.sidae.com/article/2026090314184038335", "category": "other", "importance": 3, "wl": false, "topic": "삼성dx 성과급 가격논란", "alert": false}, {"title": "[미국 주식 돋보기] 델·HPE·브로드컴, 호실적에도 엇갈린 주가", "summary": "HPE 등 주요 기업이 호실적에도 불구하고 메모리와 낸드플래시, CPU 등의 공급이 빠듯하다고 밝혔다. AI 서버 수요 급증으로 부품 부족이 장기화될 경우 매출 전환 속도가 늦어지고 높은 부품 가격이 수익성을 압박할 수 있다. 하드웨어 전반의 원가 부담이 커지는 국면이다.", "source": "mk.co.kr", "date": "2026-09-03 17:59", "url": "https://www.mk.co.kr/article/12143706", "category": "other", "importance": 3, "wl": false, "topic": "메모리부족 부품가격상승", "alert": false}, {"title": "① 삼성·SK, 대미투자 6.5배 늘려야 TSMC와 비슷해져", "summary": "최근 메모리 품목 가격이 고공행진을 거듭하면서 한국의 반도체 수출이 급증했다. 올 상반기 집적회로 수출액은 1490억 달러로 대만을 앞질렀다. 대미 수출 기준 경쟁 구도와 함께 메모리 슈퍼사이클의 영향력이 수출 실적을 견인하고 있다.", "source": "sedaily.com", "date": "2026-09-03 17:59", "url": "https://www.sedaily.com/article/20086946?ref=naver", "category": "other", "importance": 3, "wl": false, "topic": "메모리가격 고공행진", "alert": false}, {"title": "치솟는 부품값에…고개 숙인 HPE 주가", "summary": "모건스탠리 애널리스트는 메모리 가격 상승이 시작된 지 6개월에서 1년이 지나면 OEM 업체의 매출총이익률이 압박받는다고 분석했다. 치솟는 부품값에 대응하기 위해 가격 인상과 부품비 절감, 운영비 축소 등이 불가피하다는 지적이다. 하드웨어 세트 업계 전반의 원가 압박이 가중되고 있다.", "source": "hankyung.com", "date": "2026-09-03 17:49", "url": "https://www.hankyung.com/article/2026090328161", "category": "other", "importance": 3, "wl": false, "topic": "메모리가격상승 수익성압박", "alert": false}, {"title": "'연 1.5%에 5억' 삼성전자 사내대출 시행…'삼세권' 다시 들썩", "summary": "삼성전자가 사내대출 제도를 시행하는 가운데 천안캠퍼스와 아산 온양캠퍼스에 거액의 투자가 집행되고 있다. 천안에 10조 원을 투입해 HBM 생산라인을 현대화하고, 아산 온양에도 6조 원을 들여 신규 공장을 짓는다. 고부가가치 메모리 역량 강화를 위한 대규모 투자가 활발하다.", "source": "hankyung.com", "date": "2026-09-03 17:34", "url": "https://www.hankyung.com/article/202609032877i", "category": "other", "importance": 3, "wl": false, "topic": "고대역폭메모리 hbm 투자", "alert": false}, {"title": "연내 ‘수출 1조 달러’ 달성 확실시… 관심은 시점", "summary": "글로벌 하이퍼스케일러의 AI 인프라 투자 확대로 HBM을 비롯한 고부가가치 메모리 수요가 견조한 흐름을 보이고 있다. 메모리 가격도 상승세를 타며 연내 '수출 1조 달러' 달성이 확실시되고 있다. 반도체 호황이 전체 국가 수출 실적을 견인하는 모양새다.", "source": "weeklytrade.co.kr", "date": "2026-09-03 17:32", "url": "https://weeklytrade.co.kr/news/view.html?section=1&category=3&item=&no=101273", "category": "other", "importance": 3, "wl": false, "topic": "메모리수출 가격상승", "alert": false}, {"title": "[인터뷰] 이병철 전 삼성전자 부사장 “중국 반도체 물량공세, 메모리 ...", "summary": "이병철 전 삼성전자 부사장이 중국 반도체의 물량공세와 메모리 시장에 대해 경고했다. 현재는 AI 특수로 메모리 가격이 유지되지만 다운사이클이 오면 중국발 물량이 가격에 직격탄을 날릴 수 있다는 지적이다. 과거와 달리 감산 외의 구조적 대비가 필요하다고 강조했다.", "source": "ilyo.co.kr", "date": "2026-09-03 17:30", "url": "https://ilyo.co.kr/?ac=article_view&entry_id=512572", "category": "other", "importance": 3, "wl": false, "topic": "중국반도체 물량공세", "alert": false}, {"title": "삼성전자·LG전자, TV원가부담 커지자 '플랫폼' 승부수", "summary": "미국 시장에서 메모리 가격이 크게 상승하면서 삼성전자와 LG전자의 TV 원가 부담이 커지고 있다. 유통업체들을 설득해 제품 가격을 인상하기 어려운 구조 속에서 TV 사업의 수익성 방어를 위해 '플랫폼' 승부수를 던지고 있다. 하드웨어 원가 악화를 소프트웨어 및 플랫폼으로 돌파하려는 전략이다.", "source": "sisajournal-e.com", "date": "2026-09-03 17:30", "url": "https://www.sisajournal-e.com/news/articleView.html?idxno=423497", "category": "other", "importance": 3, "wl": false, "topic": "메모리가격상승 tv원가부담", "alert": false}, {"title": "'첫 200만원대' 폴더블폰, 中 샤오미 18 폴드 공개", "summary": "중국 샤오미가 세계 최초로 LPDDR6 메모리를 기본 지원하는 모바일 프로세서 'O3'를 탑재한 '샤오미 18 폴드'를 공개했다. 200만 원대 초중반의 출고가가 거론되며 플래그십 폴더블 시장에 진입했다. 중국 제조사들의 고성능 메모리 채택 속도가 빨라지고 있다.", "source": "newspim.com", "date": "2026-09-03 17:16", "url": "https://www.newspim.com/news/view/20260903001117", "category": "other", "importance": 3, "wl": false, "topic": "샤오미18폴드 lpddr6", "alert": false}, {"title": "중국 CXMT, HBM3E 소량 양산 착수… 삼성·SK하이닉스 추격 가속화", "summary": "중국 최대 D램 기업 CXMT가 HBM3E 소량 양산에 착수하며 삼성전자와 SK하이닉스를 추격하고 있다. 중국 기업이 가격 경쟁력을 무기로 공급량을 늘릴 경우 국내 업체들은 HBM 등 고부가 제품으로 수익성을 지키는 동시에 범용 메모리 가격 변동에도 대응해야 한다. 미국의 제재 속에서도 중국의 자체 메모리 개발 속도가 빨라지고 있다.", "source": "polinews.co.kr", "date": "2026-09-03 17:13", "url": "https://www.polinews.co.kr/news/articleView.html?idxno=742049", "category": "other", "importance": 3, "wl": false, "topic": "중국cxmt hbm3e 양산", "alert": false}, {"title": "中 CXMT, HBM3E 시험생산 돌입… 삼전닉스 영향은?", "summary": "중국 CXMT가 고대역폭 메모리인 HBM3E 시험생산에 돌입했다. 중국의 범용 D램 공급 공백에 따른 주요 고객사향 영향이 분석되고 있다. 올해까지 가격 상승이 외형 성장을 주도하는 가운데, 중국의 고부가 메모리 진입이 삼성과 하이닉스에 미칠 파장에 이목이 쏠린다.", "source": "ekoreanews.co.kr", "date": "2026-09-03 17:04", "url": "https://www.ekoreanews.co.kr/news/articleView.html?idxno=87888", "category": "other", "importance": 3, "wl": false, "topic": "중국cxmt hbm3e 시험생산", "alert": false}, {"title": "애플 ‘판가 압박’에 정철동 원가 혁신 시험대", "summary": "AI 서버 투자 확대로 메모리 반도체 가격이 급등하면서 애플이 부품업체에 원가 부담을 전가할 가능성이 커졌다. 세트 업계 전반의 원가 압박이 심화되는 가운데 디스플레이 등 부품 공급사들의 수익성 방어 전략이 시험대에 올랐다. 메모리 쇼크가 모바일 생태계 전반으로 확산되고 있다.", "source": "fntimes.com", "date": "2026-09-03 16:58", "url": "https://www.fntimes.com/html/view.php?ud=2026090316514833667de3572ddd_18", "category": "other", "importance": 3, "wl": false, "topic": "메모리가격급등 애플원가압박", "alert": false}, {"title": "[9월4일자] 비즈니스포스트 아침의 주요기사", "summary": "메모리 반도체 호황 장기화 신호와 함께 인도 조선소 유치 및 조선 기자재 동향이 보도되었다. 메모리 가격 상승세가 지속되면서 관련 수출 및 전방 산업 실적에 긍정적인 영향을 미치고 있다. 글로벌 제조업 공급망의 변화 추이가 주목받고 있다.", "source": "businesspost.co.kr", "date": "2026-09-03 21:02", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=446384", "category": "other", "importance": 2, "wl": false, "topic": "메모리반도체 호황", "alert": false}, {"title": "게임 안 할 때 AI 돌린다…게이밍 PC를 묶는 새 컴퓨팅 시장", "summary": "AI 컴퓨팅 시장에서 공급자가 직접 가격을 매기고 성능과 가용성을 비교해 고르는 새로운 클라우드 구조가 대두되고 있다. 인터넷 속도와 GPU 성능 외에도 메모리 구성이 장비마다 다르게 적용된다. 분산된 장비 환경에서 최적화된 플랫폼 작업 분산이 이뤄진다.", "source": "platum.kr", "date": "2026-09-03 19:12", "url": "https://platum.kr/archives/293948", "category": "other", "importance": 2, "wl": false, "topic": "ai토큰 메모리 컴퓨팅시장", "alert": false}, {"title": "[더in터뷰] 날뛰는 트럼프? \"중간선거 염두…투자자들에겐 단기적 악재...", "summary": "미국 대선 및 중간선거 정국 속에서 트럼프 정책의 영향에 대한 분석이 제기됐다. 특히 중국 반도체인 창신메모리반도체가 2분기 들어 미치는 시장 영향력이 거론됐다. 글로벌 반도체 공급망과 미·중 무역 갈등이 증시에 단기적 악재이자 변수로 작용하고 있다.", "source": "news.jtbc.co.kr", "date": "2026-09-03 18:50", "url": "https://news.j %b4%a4%eb%8d%94/", "category": "other", "importance": 3, "wl": false, "topic": "", "alert": false}, {"title": "[포토뉴스] 의료 AI ‘도입 이후’를 묻다…2026 미래 헬스 케어 트렌드...", "summary": "국회와 의료계가 주관하는 '미래 헬스 케어 트렌드 컨퍼런스'가 개최되었다. 서울아산병원과 삼성서울병원 등 상급종합병원 관계자들이 참석해 의료 AI 도입과 확산 사례를 발표했다. 디지털 헬스케어의 최신 흐름과 전망을 공유하는 자리다.", "source": "medigatenews.com", "date": "2026-09-03 21:20", "url": "https://www.medigatenews.com/news/2577226453", "category": "other", "importance": 2, "wl": false, "topic": "의료ai 헬스케어컨퍼런스", "alert": false}, {"title": "\"AI 가전, 기능보다 쓸모 입증으로 성패\"", "summary": "AI 가전의 성패가 단순 기능보다 실질적인 쓸모를 입증하는 데 달렸다는 분석이 제기됐다. AI가 가전, 컴퓨팅, 스마트리빙, 헬스케어 등 카테고리를 초월해 확장되고 있다. 국내 대표 기업인 삼성전자와 LG전자의 기술력과 글로벌 경험이 강점으로 꼽힌다.", "source": "fnnews.com", "date": "2026-09-03 18:13", "url": "https://www.fnnews.com/news/202609031811420867", "category": "other", "importance": 2, "wl": false, "topic": "ai가전 헬스케어전망", "alert": false}, {"title": "'더현대' 품었다…광주에 최대 주거복합단지", "summary": "광주에 추진되는 대규모 주거복합단지 '더현대 광주' 사업에 전남대병원과 연계된 헬스 케어 서비스가 도입된다. 주거 인프라와 첨단 의료·건강 관리를 결합한 지역 랜드마크로 주목받고 있다. 복합 생활 공간 내 디지털 헬스 서비스 적용이 확대되는 추세다.", "source": "hankyung.com", "date": "2026-09-03 18:00", "url": "https://www.hankyung.com/article/2026090327741", "category": "other", "importance": 2, "wl": false, "topic": "더현대광주 헬스케어단지", "alert": false}, {"title": "바이오 클러스터 키우는 인천, 기업 직업훈련 수요 75% ‘경력직’", "summary": "인천 송도국제도시에 위치한 삼성바이오로직스, 삼성바이오에피스, 셀트리온 등을 중심으로 바이오 클러스터가 조성되고 있다. 직업훈련 수요 조사 결과 '디지털 헬스 플랫폼 마케팅' 등 경력직 중심의 수요가 확인됐다. 바이오 및 헬스케어 인재 양성 생태계가 강화되고 있다.", "source": "kyeongin.com", "date": "2026-09-03 17:26", "url": "https://www.kyeongin.com/article/1770191", "category": "other", "importance": 2, "wl": false, "topic": "인천바이오 헬스케어", "alert": false}, {"title": "대표보다 연봉 높은 임원들… 삼성 SDS '글로벌 인재'가 보수 상위권 차지", "summary": "삼성SDS의 글로벌 인재 영입 임원이 보수 상위권을 차지했다. 해당 임원은 미국 서부지역 헬스케어 및 공공서비스 IT 컨설팅 사업을 총괄한 경력을 지니고 있다. 클라우드와 헬스케어 IT 컨설팅 역량을 바탕으로 삼성SDS에 합류해 사업을 이끌고 있다.", "source": "fntimes.com", "date": "2026-09-03 16:52", "url": "https://www.fntimes.com/html/view.php?ud=202609031552585754094b7542a8_18", "category": "other", "importance": 2, "wl": false, "topic": "삼성sds 임원 보수", "alert": false}, {"title": "코스닥 유상증자 급증…개미들이 가장 유의해야 할 점은?", "summary": "코스닥 시장에서 제약·바이오와 헬스케어 기업들의 자금조달 유상증자가 활발하게 이루어지고 있다. 삼성바이오로직스와 뷰노 등이 대표적인 사례로 꼽힌다. 대규모 투자와 연구개발 자금 확보를 위한 제약·바이오 업계의 행보가 이어지고 있다.", "source": "ekoreanews.co.kr", "date": "2026-09-03 16:46", "url": "https://www.ekoreanews.co.kr/news/articleView.html?idxno=87885", "category": "other", "importance": 2, "wl": false, "topic": "제약바이오 유상증자", "alert": false}, {"title": "송재훈의 바이오 투자 통했다…민트벤처파트너스, 3곳 코스닥 입성", "summary": "송재훈 전 삼성서울병원장이 이끄는 민트벤처파트너스가 바이오·헬스케어 기업 3곳을 코스닥에 상장시키는 성과를 거뒀다. 의료 기술사업화와 스타트업 성장을 지원하며 새로운 사업 기회를 만들고 있다. 병원장 출신의 전문성을 바탕으로 벤처 투자를 성공적으로 이끌고 있다.", "source": "edaily.co.kr", "date": "2026-09-03 16:46", "url": "https://www.edaily.co.kr/News/Read?newsId=04575606645576512&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article", "category": "other", "importance": 2, "wl": false, "topic": "민트벤처파트너스 바이오투자", "alert": false}, {"title": "‘더현대 광주’ 품은 3216가구 대단지…‘챔피언스시티 1차’ 견본주택...", "summary": "광주 주거복합단지 '챔피언스시티 1차' 분양에 삼성물산의 주거생활 플랫폼 '홈닉'이 적용된다. 청소·운반 AI 로봇과 더불어 기반 헬스케어 서비스를 단지에 도입하는 방안이 검토되고 있다. 첨단 IT 솔루션과 의료 헬스케어가 결합된 주거 환경을 제시한다.", "source": "mk.co.kr", "date": "2026-09-03 11:10", "url": "https://www.mk.co.kr/article/12143160", "category": "other", "importance": 2, "wl": false, "topic": "더현대광주 홈닉 헬스케어", "alert": false}, {"title": "룰루랩, AI 피부분석 솔루션 루스킨S 출시", "summary": "AI 피부분석 솔루션을 출시한 룰루랩은 2017년 삼성전자 사내벤처 C-Lab에서 스핀오프해 설립된 기업이다. 누적 500만 건 이상의 피부 데이터를 바탕으로 디지털 헬스케어 영역으로 사업을 확장하고 있다. 진단, 추천, 관리가 연결되는 통합 플랫폼 모델을 구축했다.", "source": "hansbiz.co.kr", "date": "2026-09-03 10:58", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=861812", "category": "other", "importance": 2, "wl": false, "topic": "룰루랩 피부분석 헬스케어", "alert": false}, {"title": "동아ST·대웅제약 등 7개사 총출동…의료현장 파고드는 AI·디지털 헬스 ...", "summary": "제3회 미래 function secItems(sid){

function prodKey(a){

function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){

}

    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
