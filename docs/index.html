었다. 하드웨어 아키텍처의 패러다임 변화를 역사적 맥락에서 짚어보았다. 컴퓨팅 환경에서 메모리의 가치가 폭발적으로 상승했음을 보여준다.", "source": "etnews.com", "date": "2026-09-06 16:01", "url": "https://www.etnews.com/20260904000084", "category": "other", "importance": 1, "wl": false, "topic": "메모리 중심 시대 가격 비중 변화", "alert": false}, {"title": "\"하이닉스를 샀는데, 반도체는 모른다\" 반도체 투자 지도 [새책]", "summary": "메모리와 비메모리의 경계가 흐려지는 반도체 산업의 변곡점에서 한국 반도체의 기회와 중국 업체의 추격을 다룬 신간 도서가 소개됐다. 실적을 분석할 때 가격과 출하량, 비용을 함께 고려해야 한다는 투자 지도를 제시했다. 향후 10년 간 글로벌 반도체 경쟁 구도를 바꿀 핵심 변수들을 짚어보았다. 반도체 투자자들에게 거시적 안목을 제공하는 지침서다.", "source": "it.chosun.com", "date": "2026-09-06 15:04", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092169563", "category": "other", "importance": 1, "wl": false, "topic": "반도체 투자 지도 메모리 비메모리 경계", "alert": false}, {"title": "[김용삼의 한국 반도체 비하인드] 전두환의 결단, 기흥·이천 반도체공...", "summary": "전두환 대통령의 결단으로 시작된 기흥과 이천 반도체 공장 건설 이후 한국이 세계 세 번째 메모리 생산국으로 도약한 역사적 배경을 다뤘다. 1985년 개당 3달러 50센트였던 64K D램 국제 가격이 불과 몇 달 만에 50센트로 곤두박질치며 제조원가 위기를 겪었던 일화가 소개됐다. 한국 반도체 산업이 초기 치킨게임과 가격 폭락의 시련을 딛고 성장해 온 과정을 회고했다. 메모리 반도체 역사교훈을 상기시키는 내용이다.", "source": "imaeil.com", "date": "2026-09-06 14:54", "url": "https://www.imaeil.com/page/view/2026090614445908824", "category": "other", "importance": 1, "wl": false, "topic": "한국 반도체 비하인드 64k d램 폭락", "alert": false}], "glasses": [{"title": "I finally tried XREAL’s fully-baked Android XR glasses, and now I’m counting down to launc", "summary": "엑스실(XREAL)이 오랜 기간 공들여 준비한 안드로이드 XR 글래스를 직접 체험해 본 결과 완성도가 매우 높아 정식 출시에 대한 기대감을 높이고 있다. AR 및 AI 웨어러블 디바이스 시장에서 강력한 경쟁 제품의 등장을 예고한다.", "source": "Android Authority", "date": "2026-09-06 17:37", "url": "https://www.androidauthority.com/xreal-aura-hands-on-experience-impressions-3708053/", "category": "launch", "importance": 4, "wl": true, "topic": "엑스실 안드로이드 엑", "alert": false}, {"title": "'넥스트 아이폰' 찾을까…터너스 앞에 놓인 3대 시험대[애플 50년 새판 ...", "summary": "애플은 스마트워치와 무선이어폰 이후 혼합현실 기기인 비전 프로를 출시했으나 흥행에 성공하지 못했다. 미·중 갈등과 미국의 대중국 관세 규제가 이어지면서 공급망 다변화가 과제로 부각되고 있다. 애플은 미국 판매용 아이폰 생산 거점 이동 등 통상 환 moves-three-features-that-apple-watch-users-might-miss-after-updating/", "category": "quality", "importance": 2, "wl": true, "topic": "워치오에스 기능 제거", "alert": false}, {"title": "Wear OS users can’t get Gemini to control their smart home", "summary": "웨어 OS 스마트워치 사용자들 사이에서 인공지능 제미나이를 이용해 스마트 홈 가전 제품을 제어하려 할 때 명령이 먹히지 않는 치명적인 버그가 보고되었다. 웨어러블 플랫폼과 홈 오토메이션 연동 과정의 기술적 결함이다.", "source": "Android Authority", "date": "2026-09-05 00:41", "url": "https://www.androidauthority.com/gemini-wear-os-smart-home-control-bug-3707766/", "category": "quality", "importance": 2, "wl": true, "topic": "웨어오에스 제미나이 버", "alert": false}, {"title": "삼성전자, '비스포크 AI 무풍콤보 프로 벽걸이' IFA 2026 최고 혁신상 수...", "summary": "삼성전자가 IFA 2026에서 최고 혁신상을 수상한 '비스포크 AI 무풍콤보 프로 벽걸이' 에어컨에 갤럭시 워치와 연동되는 '웨어러블 굿슬립' 기능을 탑재했다. 워치가 측정한 사용자의 실제 수면 패턴과 체온 변화에 맞춰 에어컨이 냉방 운전을 미세하게 조절하는 기능이다. 가전과 웨어러블 헬스케어 생태계가 결합된 차별화된 수면 환경 솔루션을 제시했다. 삼성의 AI 가전 리더십을 입증하는 대표적 기능이다.", "source": "kgnews.co.kr", "date": "2026-09-06 16:18", "url": "https://www.kgnews.co.kr/news/article.html?no=910424", "category": "launch", "importance": 3, "wl": false, "topic": "ifa 삼성 웨어러블 굿슬립 기능", "alert": false}, {"title": "”현지 세탁기보다 전기 70% 덜 쓰게”… 에너지 효율로 유럽 파고드는...", "summary": "삼성전자가 IFA 2026에서 거실의 TV, 주방의 냉장고, 세탁실의 세탁기, 운동 공간의 갤럭시 워치가 동선 안에서 모두 연결되는 'AI 리빙의 동반자' 전략을 선보였다. 에너지 효율을 극대화하고 제품 간 연결성을 높여 유럽 시장을 공략하고 있다. AI 리빙의 핵심 축인 유기적 연결 경험을 통해 현지 소비자들의 마음을 파고들고 있다. 삼성 가전 및 모바일 생태계의 글로벌 경쟁력을 과시하는 무대가 되었다.", "source": "hankookilbo.com", "date": "2026-09-06 13:03", "url": "https://www.hankookilbo.com/news/article/A2026090517170000433?did=NA", "category": "launch", "importance": 3, "wl": false, "topic": "삼성 ifa ai 리빙 동반자 전략", "alert": false}, {"title": "삼성전자, IFA 2026서 혁신상 '4관왕'", "summary": "삼성전자가 독일 IFA 2026에서 최고 혁신상을 포함해 총 4관왕을 달성하며 AI 가전 경쟁력을 입증했다. 갤럭시 워치와 연동해 수면 패턴에 맞춰 냉방을 조절하는 '웨어러블 굿슬립' 기능을 탑재한 무풍에어컨 등이 상을 받았다. 비스포크 AI 패밀리허브 냉장고도 디자인 부문에서 혁신상을 수상했다. 삼성의 혁신적인 AI 기술력과 디자인 역량이 세계적으로 인정받았다.", "source": "kihoilbo.co.kr", "date": "2026-09-06 10:58", "url": "https:/ portance": 3, "wl": false, "topic": "뉴 갤럭시 북 6 출시 퀵 셰어", "alert": false}, {"title": "[IFA] '큰손' 잡는다…삼성은 도심으로, LG는 전시장 절반 B2B", "summary": "IFA 2026에 참가한 삼성전자는 도심 전시를 통해 신형 비스포크 AI 세탁기와 갤럭시 S26 FE, 갤럭시 북 6 등을 선보였다. 개별 제품의 기능을 넘어 가전과 모바일, TV가 유기적으로 연결되는 통합 경험을 강조했다. LG가 B2B 상담에 주력한 것과 대조적으로 삼성은 모바일과 가전의 에코시스템 연동에 집중했다. 글로벌 큰손들을 사로잡기 위한 양사의 차별화된 전시 전략이 돋보였다.", "source": "apnews.kr", "date": "2026-09-05 21:32", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051019", "category": "launch", "importance": 3, "wl": false, "topic": "ifa 삼성 모바일 가전 연결 경험", "alert": false}], "wallet": [{"title": "은행권, 생활플랫폼에 금융 심는다…고객확보·수신확대 '두 토끼'", "summary": "국내 은행권이 스타벅스와 올리브영, 토스, 삼성월렛 등 고객의 일상과 밀접한 생활 플랫폼에 계좌와 결제 서비스를 연동하고 있다. 전용 예적금 상품을 선보이며 신규 고객 유입과 수신 확대를 동시에 노리는 전략이다. 금융 서비스가 자체 앱을 넘어 다양한 제3자 플랫폼으로 확장되는 개방형 금융 트렌드가 가속화되고 있다. 결제 및 월렛 시장에서의 플랫폼 간 합종연횡이 활발해지고 있다.", "source": "daily.hankooki.com", "date": "2026-09-05 09:00", "url": "https://daily.hankooki.com/news/articleView.html?idxno=1402408", "category": "launch", "importance": 3, "wl": false, "topic": "은행권 삼성월렛 등 생활플랫폼 연계", "alert": false}, {"title": "[크립토리뷰] 글로벌 고위 인사 집결…'이스트포인트:서울 2026' 1차 라인...", "summary": "서울 삼성동 웨스틴 서울 파르나스에서 글로벌 고위 인사가 집결하는 '이스트포인트:서울 2026'이 개최됐다. 하드웨어 월렛 '디센트'의 제조사가 참가해 AI 에이전트끼리 자율적으로 결제할 수 있는 WAIaaS 프로젝트를 소개했다. 블록체인과 AI 기술이 결합된 차세대 결제 솔루션의 비전을 제시하는 자리다. 디지털 자산 및 월렛 시장의 기술 진화 방향을 보여준다.", "source": "theguru.co.kr", "date": "2026-09-06 08:40", "url": "https://www.theguru.co.kr/news/article.html?no=106732", "category": "launch", "importance": 2, "wl": false, "topic": "이스트포인트 서울 2026 디센트", "alert": false}], "health": [{"title": "Withings’ ‘Thermometer of the Future’ Is Getting an AI Analysis Upgrade", "summary": "위딩스(Withings)의 스마트 체온계 '빔오(BeamO)'가 기기가 측정한 심장 및 폐 생체 기록 데이터를 정밀하게 분석해 주는 새로운 AI 분석 업그레이드 기능을 도입했다. 디지털 헬스케어 기기와 인공지능 분석 기능의 융합이 가속화되고 있다.", "source": "CNET", "date": "2026-09-05 05:38", "url": "https://www.cnet.com/health/medical/withings-thermometer-of-the-future-getting-ai-analysis-upgrade/", "category": "launch", "importance": 3, "wl": true, "topic": "위딩스 빔오 체온계 ai", "alert": false}, {"title": "삼성 ·LG 사이에서 일 냈다…베를린 IFA 홀린 ‘포항 AI 4총사’", "summary": "세계 3대 IT 전시회인 베를린 IFA에서 포항 지역 첨단기술 기업 4개사가 삼성과 LG 사이에서 독자 개발한 AI 제품을 시연하며 눈길을 끌었다. AI와 로봇, 모빌리티, 디지털 헬스 등 미래 산업 기술을 총망라하는 무대에서 지역 중소기업들이 혁신 역량을 과시했다. 글로벌 거래선과의 접점을 넓히며 해외 시장 진출의 발판을 마련했다. 지방 자치단체의 기술 기업 육성 성과를 보여주는 사례다.", "source": "kbmaeil.com", "date": "2026-09-06 13:30", "url": "https://www.kbmaeil.com/article/20260906500330", "category": "launch", "importance": 3, "wl": false, "topic": "포항 ai 4총사 베를린 ifa 공동관", "alert": false}, {"title": "삼성 에피스·셀트리온 '44조 키트루다' 잡아라…美 유통망 확보 잰걸음", "summary": "삼성바이오에피스와 셀트리온이 44조 원 규모의 대형 면역항암제 '키트루다' 특허 만료를 겨냥해 유통망 확보와 직판 등 다양한 방안을 검토하고 있다. 머크의 키트루다 특허 만료 임박에 따라 글로벌 바이오시밀러 시장 선점을 위한 경쟁이 치열해지고 있다. 항암 사업부를 중심으로 한 빅파마의 조직 개편과 맞물려 국내 기업들의 발걸음이 빨라지고 있다. 차세대 블록버스터 바이오시밀러 시장을 잡기 위한 핵심 격전지가 되고 있다.", "source": "newsworks.co.kr", "date": "2026-09-06 08:00", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=852724", "category": "launch", "importance": 3, "wl": false, "topic": "삼성에피스 셀트리온 키트루다 바이오시밀러", "alert": false}, {"title": "재평가·하반기 임상 결과 공개에 분주… 빅파마, 어디에 베팅?", "summary": "미국이 향후 4년 내 전 국민 웨어러블 헬스케어 착용을 목표로 시장 확대를 추진하는 가운데 빅파마들이 관련 기업 인수에 적극 나서고 있다. 삼성바이오로직스의 글로벌 펩타이드 CDMO 기업 폴리펩타이드그룹 인수 추진 등 제약·바이오 업계의 대규모 M&A가 활발하다. 웨어러블 기반 디지털 헬스와 전통 제약 비즈니스의 결합이 가속화되고 있다. 글로벌 제약 시장의 투자 판도가 재편되는 양상이다.", "source": "hitnews.co.kr", "date": "2026-09-05 06:12", "url": "https://www.hitnews.co.kr/news/articleView.html?idxno=78923", "category": "launch", "importance": 3, "wl": false, "topic": "빅파마 웨어러블 헬스케어 인수", "alert": false}, {"title": "한국 기술 전수받던 중국, 의료 기기의 역습", "summary": "국내 기업 메디슨이 과거 초음파 기술을 이전했던 중국 뉴알파인의 후신인 유나이티드이미징 헬스케어의 분자 영상 장비가 최고 권위의 학회에 설치되는 등 중국 의료기기 산업이 급성장했다. 과거 한국으로부터 기술을 전수받던 중국이 이제는 첨단 의료기기 분야에서 역습을 가하는 양상이다. 글로벌 의료기기 시장에서 한중 간 기술 격차가 좁혀지고 있음을 보여준다. 국내 의료기기 제조 업계에 경각심을 주는 사례다.", "source": "biz.chosun.com", "date": "2026-09-06 06:01", "url": "https://biz.chosun.c function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
