": "galaxy z fold 8 판매 호조"}, {"title": "New iPhone Ultra details arrive for specs, multitasking, launch timing, more", "summary": "다음 주 애플 9월 이벤트에서 공개될 예정인 아이폰 울트라에 대한 사양, 멀티태스킹, 출시 일정 등 새로운 세부 정보가 마크 거먼과의 인터뷰를 통해 공개되었다. 신형 플래그십 라인업 추가에 따라 스마트폰 시장 경쟁 구도에 큰 지각변동이 예상된다. 삼성전자 MX사업부의 즉각적인 대응 전략 수립이 필요한 사안이다.", "source": "9to5Mac", "date": "2026-09-02 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 출시"}, {"title": "Apple’s first folding iPhone won’t kill Android foldables — it will save them", "summary": "애플의 첫 폴더블 아이폰 진입이 오히려 침체된 안드로이드 폴더블폰 시장 전체를 사들이며 대중화의 기폭제가 될 것이라는 전망이 제기되었다. 애플의 참전으로 폴더블 폼팩터에 대한 글로벌 소비자들의 관심이 폭발적으로 증가할 것으로 예상된다. 삼성전자 MX사업부가 독점해 온 폴더블 시장의 구도 재편과 이에 따른 선제적 마케팅 및 제품 혁신 전략 수립이 시급하다.", "source": "Android Authority", "date": "2026-09-01 18:00", "url": "https://www.androidauthority.com/apple-foldable-iphone-save-android-phones-3704142/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 폴더블폰 폴더블 시장"}, {"title": "iPhone 18 Pro is coming: Here’s what’s new with each model", "summary": "아이폰 18 프로 및 프로 맥스 모델이 오는 9월 9일 공개될 예정인 가운데, 각 모델별 신규 루머와 기능들이 대거 보도되었다. 매년 하반기 글로벌 스마트폰 시장의 가장 강력한 기대작인 만큼 업계의 이목이 집중되고 있다. 삼성전자 플래그십 스마트폰 판매량에 직접적인 타격을 줄 수 있는 핵심 경쟁 제품이다.", "source": "9to5Mac", "date": "2026-08-31 23:06", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-is-coming-heres-whats-new-with-each-model/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 출시"}, {"title": "There’s already another tri-fold phone on the market, and it’s not from Samsung", "summary": "삼성전자가 아닌 중국 화웨이에 의해 새로운 형태의 두 번 접는 스마트폰인 화웨이 메이트 XT 2가 출시되며 트라이폴드(3단 접이식) 스마트폰 시장이 더욱 확장되었다. 폴더블 혁신 경쟁에서 중국 제조사들이 폼팩터 다양화를 무기로 공세를 강화하고 있다. 삼성전자 MX사업부의 차세대 폴더블 폼팩터 개발 전략에 중대한 자극제가 되는 사안이다.", "source": "Android Authority", "date": "2026-08-31 22:57", "url": "https://www.androidauthority.com/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 4, "wl": true, "topic": "huawei mate xt 2 트라이폴드"}, {"title": "Foldable iPhone Ultra Likely Has MagSafe Charging", "summary": "출시를 앞둔 폴더블 아이폰 울트라에 맥세이프 무선 충전 기능이 탑재될 가능성이 높게 점쳐지고 있다. 폴더블 폼팩터에서도 자사 고유의 충전 및 액세서리 생태계를 그대로 유지하려는 전략이다. 모바일 액세서리 및 무선 충전 표준 경쟁에 영향을 미칠 사안이다.", "source": "MacRumors", "date": "2026-09-02 04:05", "url": "https://www.macrumors.com/2026/09/01/foldable-iphone-ultra-magsafe/", "category": "launch", "importance": 3, "wl": true, "topic": "폴더블 아이폰 magsafe"}, {"title": "Galaxy S25 gets one of the S26’s coolest camera tricks with One UI 9 Beta 1", "summary": "원UI 9 베타 1을 통해 갤럭시 S26의 혁신적인 카메라 기능인 수평 유지(Horizontal Lock) 기술이 전작인 갤럭시 S25 시리즈에도 적용되기 시작했다. 삼성전자가 구형 플래그십 모델에 최신 소프트웨어 및 AI 카메라 기능을 빠르게 확대 제공하고 있다. 기존 고객의 만족도를 높이고 생태계 결속을 강화하는 전략이다.", "source": "Android Authority", "date": "2026-09-02 03:20", "url": "https://www.androidauthority.com/galaxy-s25-one-ui-9-beta-horizontal-camera-lock-3705704/", "category": "launch", "importance": 3, "wl": true, "topic": "galaxy s25 one ui 9 베타"}, {"title": "Samsung is expanding the One UI 9 beta to its older foldables", "summary": "삼성전자가 최신 원UI 9 베타 프로그램의 대상을 기존 갤럭시 S 시리즈를 넘어 이전 세대 폴더블 스마트폰 라인업까지 순차적으로 확대 적용하기 시작했다. 구형 폴더블폰 사용자들에게 최신 AI 및 소프트웨어 경험을 제공하여 브랜드 충성도를 높이려는 전략이다. 생태계 확장 측면에서 매우 긍정적인 행보이다.", "source": "Android Authority", "date": "2026-09-02 01:13", "url": "https://www.androidauthority.com/one-ui-9-beta-galaxy-z-fold-7-3705578/", "category": "launch", "importance": 3, "wl": true, "topic": "구형 폴더블 one ui 9 베타"}, {"title": "Deals: iPhone Air up to $359 off, iPhone 17 Pro, M5 MacBook Air $240 off, AirTag 2, more", "summary": "아마존 노동절 할인 행사에서 아이폰 에어가 최대 359달러 할인되는 등 애플 주요 제품들의 파격적인 가격 인하가 단행됐다. 아이폰 17 프로와 M5 맥북 에어 등도 대폭 할인 판매 중이다. 신제품 출시를 앞둔 구형 모델 및 연계 제품들의 재고 소진성 가격 공세가 치열하다.", "source": "9to5Mac", "date": "2026-09-02 00:31", "url": "https://9to5mac.com/2026/09/01/deals-iphone-air-iphone-17-pro-m5-macbook-air/", "category": "price", "importance": 3, "wl": true, "topic": "아이폰 에어 가격"}, 해 2011년 iOS 5 이후 15년 동안 유지해 온 알림 센터의 사용자 인터페이스와 작동 방식을 전면 개편한다. 오랜 사용자 습관에 변화를 주는 대대적인 UI 혁신이다. 모바일 운영체제의 사용자 경험 변화 트렌드를 보여준다.", "source": "9to5Mac", "date": "2026-09-01 17:00", "url": "https://9to5mac.com/2026/09/01/ios-27-just-broke-15-years-of-muscle-memory-on-iphone-and-ipad/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 인터페이스"}, {"title": "OnePlus 16 leak reveals ‘final’ camera specs, and it’s what the OnePlus 15 should’ve had", "summary": "원플러스 16의 최종 카메라 사양 유출 정보가 공개되었으며, 전작인 원플러스 15에서 아쉽게 빠졌던 진정한 완성형 카메라 시스템을 드디어 탑재한 것으로 나타났다. 중국 스마트폰 제조사들의 플래그십 카메라 성능 경쟁이 갈수록 치열해지고 있다. 글로벌 시장에서 삼성전자 갤럭시 플래그십의 카메라 경쟁력을 위협하는 요소이다.", "source": "Android Authority", "date": "2026-09-01 15:55", "url": "https://www.androidauthority.com/oneplus-16-final-camera-specs-leak-3705216/", "category": "launch", "importance": 3, "wl": true, "topic": "oneplus 16 카메라"}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "차기작 갤럭시 S27 및 S27 플러스 모델에 상위 프로 모델과 동일한 고성능 3배 망원 카메라 시스템이 마침내 탑재될 것이라는 구체적인 유출 정보가 제기됐다. 하위 모델의 카메라 성능을 대폭 끌어올려 라인업 전체의 경쟁력을 강화하려는 전략이다. 프리미엄 스마트폰 카메라 스펙 경쟁에서 우위를 점하기 위한 포석이다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "launch", "importance": 3, "wl": true, "topic": "galaxy s27 줌 카메라"}, {"title": "iPhone 18 Pro: Three reasons you might want to upgrade from iPhone 17 Pro", "summary": "다음 주 출시될 예정인 아이폰 18 프로로 업그레이드해야 하는 세 가지 핵심 이유가 분석 보도되었다. 전작 사용자들의 교체 수요를 자극할 차별화 포인트들이 제시되고 있다. 스마트폰 프리미엄 시장에서의 교체 주기 단축 및 판매 촉진 전략을 보여준다.", "source": "9to5Mac", "date": "2026-09-01 05:21", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-three-reasons-you-might-want-to-upgrade-from-iphone-17-pro/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 18 프로 업그레이드"}, {"title": "Satellite SOS just proved why it could be your phone’s most important feature", "summary": "치명적인 네팔 홍수 재난 상황에서 스마트폰의 위성 SOS 연결 기능이 조난자의 생존과 구조에 결정적인 역할을 한 것으로 확인됐다. 긴급 위성 통신 기능이 단순 마케팅용을 넘어 실질적인 생명 구호 수단임이 입증되었다. 향후 플래그십 스마트폰의 필수 안전 사양으로 자리 잡을 전망이다.", "source": "Android Authority", "date": "2026-09-01 02:43", "url": "https://www.androidauthority.com/satellite-connectivity-saves-life-of-man-3705087/", "category": "launch", "importance": 3, "wl": true, "topic": "위성 sos 구조"}, {"title": "iOS 27 beta 8 now available as Apple tests major Siri AI upgrade", "summary": "애플이 9월 공개를 앞둔 iOS 27의 여덟 번째 개발자 베타 버전을 배포했으며, 대대적인 시리 AI 업그레이드 테스트가 진행 중이다. 모바일 AI 비서 기능의 혁신이 iOS 생태계 전반에 적용될 예정인바 스마트폰 시장의 AI 경쟁이 한층 가열될 전망이다. 삼성전자 갤럭시의 원UI 및 AI 기능 고도화에 중요한 시사점을 제공한다.", "source": "9to5Mac", "date": "2026-09-01 02:12", "url": "https://9to5mac.com/2026/08/31/ios-27-beta-8/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 베타 출시"}, {"title": "Apple could discontinue 10+ popular products next week", "summary": "애플이 대규모 9월 신제품 런칭 행사를 개최하면서 10개 이상의 인기 구형 기기를 단종할 것으로 예상된다. 신제품 라인업 재편을 위해 구형 모델을 과감히 정리하는 애플의 전통적인 포트폴리오 관리 방식이다. 프리미엄 스마트폰 시장의 세대교체 속도를 가속화하는 요인이다.", "source": "9to5Mac", "date": "2026-09-01 01:04", "url": "https://9to5mac.com/2026/08/31/apple-could-discontinue-10-popular-products-next-week/", "category": "launch", "importance": 3, "wl": true, "topic": "애플 구형 제품 단종"}, {"title": "Here’s the likely reason the iPhone Ultra isn’t getting an Apple Pencil", "summary": "애플이 차기 폴더블 아이폰 울트라를 위해 전용 애플 펜슬 출시를 검토했으나 최종 취소한 것으로 알려졌다. 블룸버그는 이와 관련해 세 가지 핵심 이유가 존재한다고 분석했다. 폴더블 스마트폰 폼팩터에서 스타일러스 펜의 효용성과 전략적 판단을 보여주는 대목이다.", "source": "9to5Mac", "date": "2026-08-31 20:06", "url": "https://9to5mac.com/2026/08/31/heres-the-likely-reason-the-iphone-ultra-isnt-getting-an-apple-pencil/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 울트라 애플 펜슬"}, {"title": "Scam Detection could be coming to Galaxy S27, but there’s also good news for older phones", "summary": "차기작 갤럭시 S27에 보이스피싱 및 사기를 실시간으로 탐지하는 '스캠 감지(Scam Detection)' 기능이 탑재될 예정이며, 동시에 기존 구형 갤럭시 모델들에게도 해당 기능이 확대 지원될 것이라는 긍정적인 소식이 전 프트웨어 개선 작업이다.", "source": "The Verge", "date": "2026-09-02 03:00", "url": "https://www.theverge.com/tech/987339/google-september-android-drop-motion-assist-gemini-find-hub", "category": "launch", "importance": 2, "wl": true, "topic": "google find hub 출시"}, {"title": "5 new features coming to your phone with the September 2026 Android Drop", "summary": "9월 안드로이드 기능 드롭 업데이트를 통해 파인드 허브 물품 기억 기능과 구글 메시지 내 킵 연동 등 5가지 신기능이 사용자들에게 제공된다. 구글이 모바일 운영체제의 정기 업데이트를 통해 신규 기능을 공격적으로 배포하고 있다. 안드로이드 생태계의 경쟁력 강화를 위한 조치이다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/september-2026-android-drop-3705528/", "category": "launch", "importance": 2, "wl": true, "topic": "android 드롭 업데이트"}, {"title": "Google’s Guided Vision turns Gemini Live into a real-world visual guide", "summary": "구글의 인공지능 서비스 제미나이 라이브에 현실 세계의 시각적 안내를 돕는 가이디드 비전 기능이 새롭게 도입된다. 카메라를 통해 사용자가 찾지 못하는 물건을 실시간으로 안내해 주는 AI 시각 기능이다. 모바일 AI의 활용 범위가 일상 생활 속으로 빠르게 확장되고 있다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/gemini-live-guided-vision-2-3705480/", "category": "launch", "importance": 2, "wl": true, "topic": "gemini live guided vision"}, {"title": "The latest Android Drop brings an unexpected crossover between Google Messages and Keep", "summary": "최신 안드로이드 업데이트를 통해 구글 메시지와 구글 킵이 예상치 못한 크로스오버를 이루며 메시지 창 안에서 실시간 공동 체크리스트 작성이 가능해졌다. 채팅방 참여자 누구나 목록을 수정할 수 있는 협업 기능이 추가됐다. 커뮤니케이션 앱의 생산성 기능 강화 트렌드를 보여준다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/google-messages-keep-notes-checklist-september-android-drop-3705193/", "category": "launch", "importance": 2, "wl": true, "topic": "google messages keep 연동"}, {"title": "Your Pixel 11 will soon have a fix for the static noise ruining your videos", "summary": "구글이 픽셀 11 스마트폰 비디오 촬영 시 발생하는 정적 노이즈 버그를 공식 인정하고 향후 소프트웨어 업데이트를 통해 수정할 것을 약속했다. 신제품 출시 초기 하드웨어 및 소프트웨어 결함 대응의 중요성을 보여준다. 사용자 경험 관리를 위한 신속한 패치가 요구된다.", "source": "An <script>

const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
