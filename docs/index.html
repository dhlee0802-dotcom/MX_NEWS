e": "2026-09-08 10:26", "url": "https://zdnet.co.kr/view/?no=20260908012643", "category": "price", "importance": 4, "wl": false, "topic": "내년 메모리 가격 상승", "alert": false}, {"title": "Samsung India pays the price of costlier chips with a round of layoffs - The Economic Time", "summary": "삼성전자 인도 법인이 치솟은 부품 원가 압박을 견디지 못하고 일련의 구조조정 및 감원 조치를 단행했습니다. 고물가와 메모리 반도체 가격 급등이 현지 법인의 수익성을 악화시켜 인력 감축이라는 고강도 자구책으로 이어진 것입니다. 신흥 시장에서의 원가 부담이 고용 안정성과 현지 사업 운영에 직격탄을 날리고 있습니다. 부품 난조가 세트 사업의 구조조정으로 이어지는 심각성을 보여줍니다.", "source": "The Economic Times", "date": "2026-09-08 09:00", "url": "https://m.economictimes.com/industry/cons-products/electronics/samsung-india-pays-the-price-of-costlier-chips-with-a-round-of-layoffs/articleshow/133894023.cms", "category": "price", "importance": 4, "wl": false, "topic": "삼성 인도 법인 구조조정", "alert": false}, {"title": "Apple Locks In NAND Deal: 3-5 Years, No Price Cap [2026] - tech-insider.org", "summary": "애플이 키옥시아와 3~5년 장기 낸드플래시 공급 계약을 체결했으며 가격 상한선이 없다는 소식이 전해졌습니다. 글로벌 메모리 반도체 공급 부족과 가격 상승 국면에서 주요 빅테크 기업이 물량 확보를 위해 장기 계약에 나선 것입니다. 이는 메모리 원가 부담이 전방위적으로 확대되고 있음을 보여주는 방증입니다. 스마트폰과 IT 기기 제조원가에 직접적인 압박 요인으로 작용합니다.", "source": "tech-insider.org", "date": "2026-09-08 05:34", "url": "https://tech-insider.org/apple-nand-memory-supply-deal-kioxia-2026/", "category": "policy", "importance": 4, "wl": false, "topic": "애플 낸드플래시 장기계약", "alert": false}, {"title": "Is AI Making iPhones More Expensive? Micron Among Big Winners as Global Memory Shortage Es", "summary": "글로벌 메모리 반도체 부족 현상이 심화되면서 AI 기술이 아이폰의 가격을 더 비싸게 만들고 있는지에 대한 분석이 제기되었습니다. 마이크론 등 주요 메모리 제조사들이 이번 반도체 수급난의 최대 수혜주로 부각되고 있습니다. 원가 상승 압박은 완제품 스마트폰의 가격 인상으로 이어질 가능성이 높습니다. 모바일 제조사들의 수익성 방어에 비상이 걸린 상황입니다.", "source": "tradingkey.com", "date": "2026-09-07 22:36", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262154271-ai-iphone-dram-shortage-micron-price-hike-global-winner-tradingkey", "category": "price", "importance": 4, "wl": false, "topic": "글로벌 메모리 부족", "alert": false}, {"title": "RAM Prices Soar 485% as Memory Shortage Hits Canada [2026] - tech-insider.org", "summary": "메모리 부족 현상의 여파로 캐나다 등지에서 RAM 가격이 485% 폭등하는 등 심각한 수급 불균형이 발생했습니다. 인공지능 열풍으로 인한 부품 품귀 현상이 일반 소비재 시장까지 직격탄을 날리고 있습니다. 전자기기 제조 원가의 급격한 상승은 완제품 가격 인상으로 이어질 수밖에 없습니다. 완제품 제조사들의 원가 관리 부담이 극대화되는 시점입니다.", "source": "tech-insider.org", "date": "2026-09-07 21:38", "url": "https://tech-insider.org/ca/ram-ddr5-ssd-price-shortage-canada-2026/", "category": "price", "importance": 4, "wl": false, "topic": "램 가격 폭등", "alert": false}, {"title": "AI 호황 청구서, 소비자에…메모리값 폭등에 전자업계 ‘원가 비상’ - 아시아투데이", "summary": "AI 호황에 따른 메모리 반도체값 폭등으로 전 세계 전자업계가 제조원가 비상 체제에 돌입했습니다. 급등한 부품 가격을 완제품 가격에 온전히 반영하기 어렵고, 흡수하기도 버거운 딜레마에 빠졌습니다. 스마트폰과 가전 등 세트 사업을 영위하는 기업들의 수익성 방어에 적신호가 켜졌습니다. 공급망 리스크 관리가 기업의 생존을 가르는 핵심 역량으로 대두되었습니다.", "source": "아시아투데이", "date": "2026-09-07 17:23", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20260907010002511", "category": "price", "importance": 4, "wl": false, "topic": "메모리값 폭등 원가 비상", "alert": false}, {"title": "Omdia: Samsung absorbed memory crisis while Xiaomi maintained its margins - newswav.com", "summary": "옴디아 분석에 따르면 삼성전자는 메모리 위기의 충격을 내부적으로 흡수한 반면, 샤오미는 이 과정에서 마진을 잘 방어한 것으로 나타났습니다. 부품 가격 폭등 국면에서 각 제조사들이 구사하는 원가 흡수 및 수익성 방어 전략의 차이를 보여줍니다. 글로벌 스마트폰 시장에서 제조사별 체급과 공급망 협상력이 실적을 가르는 핵심 요인으로 작용하고 있습니다. 삼성 MX사업부의 원가 관리 성과를 평가하는 데 중요한 시사점을 줍니다.", "source": "newswav.com", "date": "2026-09-07 17:21", "url": "https://newswav.com/article/omdia-samsung-absorbed-memory-crisis-while-xiaomi-maintained-its-margins-A2609_3AXdxc", "category": "policy", "importance": 4, "wl": false, "topic": "메모리 위기 대응 분석", "alert": false}, {"title": "\"스마트폰 원가 절반이 메모리반도체\" 전망 나와, 삼성전자 SK하이닉스 증설도 '역부족' - 비즈니스포스트", "summary": "스마트폰 제조원가의 절반을 메모리반도체가 차지한다는 전망이 제기된 가운데, 삼성전자와 SK하이닉스의 대규모 증설 노력도 폭증하는 수요를 감당하기에 역부족이라는 지적이 나왔습니다. 메모리 비중이 지나치게 높아지면서 세트 업체의 원가 구조가 극도로 취약해졌습니다. 반도체 생산 능력 한계가 완제품 제조사들의 출하량 계획에 직격탄을 날리고 있습니다. 구조적인 수급 불균형이 해소되려면 상당한 시간이 소요될 전망입니다.", "source": "비즈니스포스트", "date": "2026-09-07 14:10", "url": "https://www.businessp 구현 방식이 자사 특허를 침해했다고 소송을 제기했다. 생체 인식 기술 관련 특허 분쟁이 애플을 상대로 본격화되는 모양새다. 특허 침해 결과에 따라 아이폰 보안 인증 시스템에 차질이 생길 수 있다. 글로벌 스마트폰 제조사들의 핵심 기술 특허 공방이 지속되고 있다.", "source": "9to5Mac", "date": "2026-09-08 10:34", "url": "https://9to5mac.com/2026/09/07/basf-subsidiary-sues-apple-over-alleged-face-id-patent-infringement/", "category": "quality", "importance": 3, "wl": true, "topic": "애플 페이스id 특허 소송", "alert": false}, {"title": "The wide-screen trend has officially reached non-foldables", "summary": "화웨이가 전통적인 바형 스마트폰 폼팩터에 여권 비율인 16:9.5의 와이드 스크린을 적용한 푸라 X 뷰를 공개했다. 폴더블이 아닌 일반 스마트폰에서도 와이드스크린 트렌드가 본격화되고 있다. 색다른 화면 비율을 통해 사용자 경험에 차별화를 두려는 시도다. 모바일 디스플레이 트렌드의 변화를 보여준다.", "source": "Android Authority", "date": "2026-09-08 00:02", "url": "https://www.androidauthority.com/huawei-pura-x-view-full-launch-3708420/", "category": "launch", "importance": 3, "wl": true, "topic": "화웨이 푸라 x 뷰 출시", "alert": false}, {"title": "One UI 9 quietly solves time zone math while calling", "summary": "삼성전자의 차기 인터페이스인 원 UI 9에 통화 중 시차 계산 문제를 조용히 해결해 주는 기능이 포함되었다. 해외 통화 시 시간대 확인의 번거로움을 덜어주는 사용자 친화적 기능이다. 지속적인 소프트웨어 고도화를 통해 사용자 편의성을 높이고 있다. 갤럭시 스마트폰의 소프트웨어 경쟁력을 강화하는 요소다.", "source": "Android Authority", "date": "2026-09-07 23:28", "url": "https://www.androidauthority.com/one-ui-9-call-brief-international-calling-3708416/", "category": "launch", "importance": 3, "wl": true, "topic": "원 ui 9 시차 계산", "alert": false}, {"title": "The latest Wide Fold is here and has everything the Galaxy Z Fold 8 lacks", "summary": "시장에 새로 등장한 와이드 폴드 형태의 폴더블폰이 삼성 갤럭시 Z 폴드 8의 부족한 점들을 채워주며 일부 영역에서 우위를 점하고 있다. 폴더블폰 시장에서 가로 비율과 사용성을 개선한 경쟁 제품들의 공세가 거세다. 삼성전자의 폴더블 리더십을 위협하는 요소로 작용한다. 폼팩터 완성도를 높이기 위한 제조사들의 경쟁이 심화되고 있다.", "source": "Android Authority", "date": "2026-09-07 21:53", "url": "https://www.androidauthority.com/xiaomi-18-fold-launched-3708357/", "category": "launch", "importance": 3, "wl": true, "topic": "와이드 폴드 경쟁", "alert": false}, {"title": "The real reason your phone is getting more expensive", "summary": "애플이 신형 아이폰을 공개하면서 가격 인상을 <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        const items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
