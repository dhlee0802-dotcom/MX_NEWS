.com", "date": "2026-10-19 11:44", "url": "https://www.digitaltrends.com/cool-tech/a-smart-scale-with-a-screen-on-its-handle-wyze-might-be-onto-something/", "category": "launch", "importance": 1, "wl": false, "topic": "와이즈 스마트 체중계 사건", "alert": false}], "phone": [{"title": "운동하다 넘어진 남성…바지 주머니 속 휴대전화 '폭발'", "summary": "중국에서 배드민턴을 치던 남성이 넘어지는 충격으로 바지 주머니에 있던 휴대전화가 폭발해 중증 화상을 입는 사고가 발생했다. 해당 휴대전화는 구입한 지 두 달밖에 되지 않은 제품으로 확인되었다. 현장 CCTV 영상이 공개되면서 기기 안전성에 대한 우려가 커지고 있다. 소비자 안전과 직결된 사안으로 즉각적인 원인 파악이 필요하다.", "source": "전자신문", "date": "2026-10-20 16:58", "url": "https://www.etnews.com/20261020000366", "category": "quality", "importance": 5, "wl": true, "topic": "휴대전화 폭발 사고", "alert": true}, {"title": "트럼프, 연방기관서 中딥시크 퇴출…“민감 데이터가 中 이전 우려 있어”", "summary": "미국 도널드 트럼프 행정부가 연방정부 기관에서 중국 인공지능 기업 딥시크 제품의 사용을 전면 금지했다. 민감한 데이터가 중국으로 이전될 수 있다는 안보 우려에 따른 조치이다. 미 국토안보부는 사이버보안법에 근거해 연방 기관들의 IT 시스템에서 해당 제품을 즉시 제거하도록 명령했다. 글로벌 AI 및 보안 규제 강화 기조를 보여준다.", "source": "전자신문", "date": "2026-10-20 17:28", "url": "https://www.etnews.com/20261020000374", "category": "policy", "importance": 4, "wl": true, "topic": "딥시크 연방기관 퇴출", "alert": false}, {"title": "Apple Limiting U.S. iPhone Duo Orders to Two Per Customer", "summary": "애플이 미국 공식 온라인 스토어에서 신규 폴더블폰 아이폰 듀오의 1인당 구매 가능 수량을 최대 2대로 엄격히 제한하기 시작했다. 초기 공급 물량 부족과 전 세계적인 예약 폭주로 인해 되팔이 방지 및 실수요자 공급을 우선시하려는 조치다. 극단적인 품귀 현상이 판매 채널 전반에서 확인되고 있다. 폴더블 시장의 강력한 초기 수요 추이를 예의주시해야 한다.", "source": "MacRumors", "date": "2026-10-20 08:42", "url": "https://www.macrumors.com/2026/10/19/iphone-duo-order-limit-us/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 듀오 구매 수량 제한", "alert": false}, {"title": "Following $5.7B verdict, Taction wants a cut of iPhone and Apple Watch sales through 2035", "summary": "애플이 텍션 테크놀로지와의 햅틱 특허 침해 소송에서 57억 달러의 기록적인 배상 평결을 받은 후, 텍션 측이 2035년까지의 아이폰 및 애플워치 추가 로열티를 공식 요구했다. 이번 판결은 모바일 햅틱 피드백 기술 전반에 걸친 대형 지식재산권 분쟁으로 번지고 있다. 천문학적 규모의 배상액과 함께 향후 제품 판매에 지속적인 비용 부담이 발생할 전망이다. 유사 특허에 대한 삼성전자 갤럭시 스마트폰의 IP 리스크를 점검하는 계기로 삼아야 한다.", "so  올리고 아이폰 첫 300만원대", "summary": "AI 열풍으로 인한 글로벌 메모리 공급 부족 여파로 갤럭시 S26 출고가가 오르고 아이폰은 처음으로 300만 원대를 돌파했다. 핵심 반도체 부품 단가 급등이 플래그십 스마트폰 출고가의 연쇄 인상으로 직결되고 있다. 소비자들의 가격 저항이 극에 달하며 교체 주기 장기화 우려가 현실화되고 있다. 가격 인상에 상응하는 AI 소프트웨어 체감 가치 제공이 절실하다.", "source": "빅데이터뉴스", "date": "2026-10-19 17:06", "url": "https://news.google.com/rss/articles/CBMie0FVX3lxTE1OeW1jVlhvbnNyeVA0SDlpYWt0cDV6RGpoRjBlUTdreU1OT1hqMEN6Y3JmYXI5bXdfUWJlejdlWGdMVVhBeFlDZzJuQkRnZnVZZnRBN3NGNHh5UTk2dnZ1ZGN4TTV1NkhIRWR2RWhMMnVXZ1pGdm8wWTEydw?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "갤럭시s26 출고가 인상"}, {"title": "The Galaxy S27 may launch earlier than usual, Samsung’s leaked plans reveal", "summary": "삼성전자의 차기 플래그십 스마트폰 '갤럭시 S27'이 예상보다 이른 시점에 출시될 가능성이 유출된 계획을 통해 제기됐다. 다만 RAM과 스토리지 부문의 마지막 순간 하드웨어 업그레이드 여부가 전체 일정에 변수로 작용할 수 있다. 출시 일정을 앞당겨 시장 주도권을 선점하려는 전략적 움직임으로 해석된다.", "source": "Android Authority", "date": "2026-10-19 16:57", "url": "https://www.androidauthority.com/samsung-galaxy-s27-launch-window-leak-3724822/", "category": "launch", "importance": 5, "sid": "phone", "topic": "galaxy s27 출시일정"}, {"title": "Apple’s First Foldable iPhone Is Already Backordered Until January", "summary": "애플 최초의 폴더블 스마트폰 아이폰 듀오의 사전 예약 주문 배송일정이 폭발적 수요로 인해 내년 1월로 밀려났다. 공급 부족과 강력한 대기 수요가 맞물려 초기 공급망 관리가 시험대에 올랐다. 프리미엄 폴더블폰 시장의 판도가 급격히 애플 중심으로 재편될 조짐을 보인다. 애플의 초기 공급 지연 틈새를 노려 갤럭시 Z 폴드 마케팅을 강화해야 한다.", "source": "techrepublic.com", "date": "2026-10-19 15:34", "url": "https://www.techrepublic.com/article/news-iphone-duo-preorders-january-shipping-delays/", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰듀오 배송지연"}, {"title": "삼성, 내년 갤럭시 Z 시리즈 6종으로 확대하나…‘트라이폴드2·슬라이드’ 등장 전망 - 디지털데일리", "summary": "삼성이 내년 갤럭시 Z 폴더블폰 라인업을 6종으로 늘릴 것으로 보이는 가운데, 신규 폼팩터인 트라이폴드2와 슬라이드형 제품이 등장할 것으로 예상되어 폼팩터 경쟁이 더욱 치열해질 전망이다.", "source": "ZDNet Korea", "date": "2026-10-19 12:42", "url": "https://zdnet.co.kr/view/?no=20261019190401", "category": "launch", "importance": 5, "sid": "phone", "topic": "갤럭시 z 시리즈 확대"}, {"title": "Apple’s $1,999 iPhone bet just got its first answer", "summary": "애플의 첫 폴더블폰 아이폰 듀오가 초고가에도 불구하고 사전 주문이 폭주하며 흥행에 성공했다. 2TB 모델이 3천 달러를 넘는 고가임에도 애플 팬덤의 구매가 몰리며 시장 안착을 이뤄냈다. 폴더블 시장의 단독 주주였던 삼성전자의 프리미엄 독점권이 실질적 위협에 직면했다. 폴더블 플래그십 기술 및 마케팅 전략의 전면적 대응이 시급하다.", "source": "finance.yahoo.com", "date": "2026-10-19 01:59", "url": "https://finance.yahoo.com/markets/stocks/articles/apple-1-999-iphone-bet-014700097.html", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰듀오 출시"}, {"title": "South Africa Smartphone Market Share 2026: Samsung at 49.75%", "summary": "2026년 남아프리카공화국 스마트폰 시장에서 삼성전자가 49.75%의 압도적인 점유율로 선두를 차지하고 있다는 시장 조사 보도이다. 아프리카 주요 거점 시장에서의 시장 지배력 유지 현상을 보여주는 핵심 지표이다.", "source": "msn.com", "date": "2026-10-19 23:48", "url": "https://www.msn.com/ko-kr/news/other/쪼그라든-스마트폰-시장-삼성-애플-점유율-넘어-수익성-공급망-시험대/ar-AA2etfId", "category": "launch", "importance": 4, "sid": "phone", "topic": "남아프리카 스마트폰 시장 점유율"}, {"title": "[A 현장] '갤럭시 버즈 온' 베일 벗었다...삼성전자 \"착용감·통화 품질 세계 최고 자부\"", "summary": "삼성전자가 진행한 소비자 조사에 따르면 클립형 이어폰 사용자의 약 73%가 기존 인이어 이어폰도 함께 소지하며 병행 사용하는 것으로 나타났다. 대중교통 등 몰입이 필요할 때는 ANC 기능을 갖춘 갤럭시 버즈4 프로를 쓰고, 러닝이나 사무실에서는 오픈형 성격의 갤럭시 버즈 온을 활용한다. 사용자의 라이프스타일에 맞춘 다층적 웨어러블 전략이 주목받고 있다.", "source": "asiaa.co.kr", "date": "2026-10-19 23:35", "url": "https://www.asiaa.co.kr/news/articleView.html?idxno=267019", "category": "launch", "importance": 4, "sid": "tws", "topic": "갤럭시 버즈 온 소비자 조사"}, {"title": "Car Keys in Apple Wallet coming soon to three popular vehicle brands", "summary": "GM이 캐딜락, 쉐보레, GMC 등 자사 주요 브랜드 차량에 애플 월렛 디지털 차 키 지원을 도입한다고 공식 발표했습니다. NFC 및 UWB 기반 스마트폰 차 키 생태계가 미국 대형 완성차로 급격히 확대되고 있습니다. 삼성 월렛의 글로벌 자동차 제조사 파트너십 확장에 대응이 요구됩니다.", "source": "9to5Mac", "date": "2026-10-19 23:31", "url": "https://9to5mac.com/2026/10/19/car-keys-in-apple-wallet-coming-soon-to-three-popular-vehicle-brands/", "category": "launch", "importance": 4, "sid": "wallet", "topic": "애플 월렛 디지털 차 키"}, {"title": "Global smartphone shipments hit 14-year low in Q3 2026 — Counterpoint", "summ ing moved up to earlier dates", "summary": "지난주 사전 주문 개시 직후 2027년 1월 말까지 밀렸던 아이폰 듀오의 예상 배송 일정이 일부 고객을 대상으로 앞당기기 시작했다. 초기 공급 병목 현상을 해소하기 위해 애플이 생산 라인 가동률을 끌어올리고 있는 징후로 풀이된다. 폴더블 신제품에 대한 강력한 초기 대기 수요가 유지되고 있다. 폴더블 시장에서 갤럭시 Z 폴드와의 점유율 경쟁 추이를 지속적으로 추적해야 한다.", "source": "9to5Mac", "date": "2026-10-19 22:19", "url": "https://9to5mac.com/2026/10/19/some-iphone-duo-orders-getting-moved-up-to-earlier-dates/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 배송일 앞당겨짐"}, {"title": "Wildfire and Badge Partner to Bring Personalized Merchant Offers and Rewards to Mobile Wal", "summary": "", "source": "Yahoo Finance", "date": "2026-10-19 22:01", "url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxPSmVJY1IycXA4aVc0VDR3a3VXOUNSdXB3MU1XeEFkNVh0OTVLOUo0eHhLVVp4MERwd1Ftekw5dEdHeXFTWmJHbWhlOTNxWEhsNk5JbXZkdXhtbmhlVXRod0ZhRmhER09xX20tMFV3WlBuMXFvMTh2T1V5NXNXMjYwRldYY3NUMXkzN0lvUmVlWWxDcjhiYVc0QUQ0VFpKREFFRUlWaA?oc=5", "category": "other", "importance": 4, "sid": "wallet", "topic": ""}, {"title": "램값 폭등에 중고메모리 거래↑…삼전닉스 호황의 역설", "summary": "AI 투자 확대로 메모리 가격이 전년 대비 200~300% 폭등하면서 중고 메모리 칩 거래가 급증하고 있다. 삼성전자와 SK하이닉스가 AI 서버용 메모리로 호황을 누리는 사이, 스마트폰 및 PC 제조사들은 원가 부담을 줄이기 위해 폐휴대폰의 칩을 재사용하는 방식을 도입하고 있다. 완제품 원가 압박이 극심해지며 공급망 관리의 중요성이 커지고 있다.", "source": "dealsite.co.kr", "date": "2026-10-19 21:15", "url": "https://dealsite.co.kr/articles/170932", "category": "price", "importance": 4, "sid": "memchina", "topic": "중고메모리 거래 증가"}, {"title": "스마트폰 시장 14% 역성장 전망에도…애플만 증가세 예상", "summary": "스마트폰 시장 전체가 14% 역성장할 것으로 전망되는 가운데 애플만 나홀로 증가세를 기록할 것으로 예상된다. 글로벌 수요 침체 속에서도 프리미엄 브랜드의 독주 현상이 심화되고 있음을 보여준다. 당사 스마트폰 출하량 방어 및 점유율 전략에 중요한 시사점을 제공한다.", "source": "디지털투데이", "date": "2026-10-19 21:00", "url": "https://news.google.com/rss/articles/CBMic0FVX3lxTE9jVC1JdDN4azVoOF93d0dBX1JjRnV1ajByN0FEZXZ5aFk2aUhJcDF5Y3k5Z1V6ZS10b0ZvOGNLSjkwcTkxY3FMNE9tV3lMX3ViR3hxWGtobXh4MW5uZHM3MXBxVG1vMEhsUFRhOFZLNU1SYWs?oc=5", "category": "launch", "importance": 4, "sid": "phone", "topic": "스마트폰 시장 역성장 애플 증가"}, {"title": "KeyBanc: HBM Prices to Double in Q1 2027 as Long-Term Contract Renewals Fuel Increases", "summary": "키뱅크는 장기 계약 갱신으로 인해 2027년 1분기 HBM 가격이 두 배로 상승할 것이라고 전망했다. AI 중심의 메모리 가격 급등세가 지속될 것임을 시사하며, 반도체 및 완제품 원가에 큰 파장을 미칠 전망이다.", "source": "note.com", "date": "2026-10-19 20:25", "url": "https://note.com/genelab_999/n/n3a6200c554ab?hl=en", "category": "price", "importance": 4, "sid": "memchina", "topic": "hbm 가격 전망"}, {"title": "Constrained iPhone Duo availability is annoying, but a mixed blessing for Apple", "summary": "아이폰 듀오가 사전 주문 개시 단 1분 만에 배송 예정일이 1월로 대폭 밀리는 등 극심한 공급 제약에 직면했다. 이러한 품귀 현상은 소비자 불만을 초래하지만 동시에 제품에 대한 폭발적인 시장 인기를 증명하는 양날의 검으로 작용하고 있다. 애플 최초 폴더블폰의 수율 및 수요 균형이 시험대에 올랐다. 갤럭시 Z 폴드의 안정적 공급망 우위를 부각하는 마케팅 전략이 유효하다.", "source": "9to5Mac", "date": "2026-10-19 20:25", "url": "https://9to5mac.com/2026/10/19/constrained-iphone-duo-availability-is-annoying-but-a-mixed-blessing-for-apple/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 공급 제약"}, {"title": "고화질·저전력이 무기… 삼성D·LGD, 中 저가 공세 방어", "summary": "삼성디스플레이와 LG디스플레이가 주요 고객사 신제품용 패널 공급 확대에 힘입어 3분기 모바일 OLED 시장에서 중국 경쟁사들을 다시 앞질렀다. 고해상도·저전력 기술을 무기로 중국의 저가 공세를 방어하고 프리미엄 패널 공급 역량을 과시했다.", "source": "fnnews.com", "date": "2026-10-19 20:13", "url": "https://www.fnnews.com/news/202610191813064046", "category": "quality", "importance": 4, "sid": "phone", "topic": "삼성디스플레이 lg디스플레이 실적"}, {"title": "퀄컴·삼성, 갤럭시용 스냅드래곤 할인 계약 난항?", "summary": "퀄컴과 삼성전자가 갤럭시 스마트폰용 스냅드래곤 칩셋의 독점 할인 계약 조건을 놓고 협상에 난항을 겪으며 양사 간 갈등 조짐이 제기됐다.", "source": "kbench.com", "date": "2026-10-19 19:54", "url": "https://kbench.com/?q=node/282596", "category": "launch", "importance": 4, "sid": "phone", "topic": "퀄컴 삼성 스냅드래곤 계약 갈등"}, {"title": "\"왜 이렇게 비싸졌지\"…AI 열풍에 스마트폰값 폭등 [차이나 워치]", "summary": "AI 산업의 메모리 반도체 수요 급증으로 스마트폰 가격이 치솟으면서 올 3분기 중국 출하량이 13년 만에 최저 수준으로 떨어지고 글로벌 출하량도 급감했다. 메모리 가격 폭등이 완제품 원가 상승과 출하량 감소로 직결되는 심각한 수급 불균형이 발생하고 있다. 원가 상승 압박에 따른 스마트폰 제조사들의 수익성 관리 전략 마련이 시급하다.", "source": "hankyung.com", "date": "2026-10-19 19:30", "url": "https://www.hankyung.com/article/202610188979i", "category": "price", "importance": 4, "sid": "memchina", "topic": "스마트폰 가격 폭등"}, {"title": "갤럭시로 디지털 달러 보낸다…삼성월렛, 美 스테이블코인 송금 시동", "summary": "삼성전자가 10월 마지막 주부터 미국에서 삼성월렛을 통한 스테이블코인 송금 서비스를 시작한다. 모바일 지갑이 실제 금융 서비스로 영역을 확장하는 계기가 될 것으로 보인다.", "source": "bonmedia.kr", "date": "2026-10-19 19:27", "url": "https://www.bonmedia.kr/news/articleView.html?idxno=8713", "category": "launch", "importance": 4, "sid": "wallet", "topic": "삼성월렛 스테이블코인 송금"}, {"title": "삼성, 'One UI' 버리고 '갤럭시 OS'로 바꾸나", "summary": "삼성전자가 기존 소프트웨어 브랜드인 원 UI를 폐기하고 갤럭시 OS로 전면 교체할 가능성이 제기됐다. 스마트폰과 태블릿을 아우르는 통합 모바일 운영체제 이미지를 구축해 애플 iOS와의 독자 대항 구도를 강화하려는 목적이다. 단순 UI 커스텀을 넘어 독자 플랫폼으로서의 정체성을 강조하려는 전략이다. 브랜드 전략 변화 여부에 대한 사실 확인이 요구된다.", "source": "kbench.com", "date": "2026-10-19 18:21", "url": "https://kbench.com/?q=node/282593", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시os 브랜드 전환 루머"}, {"title": "애플 ‘아이폰 듀오’ 흥행 조짐에…삼성 폴더블 시장 주도권 시험대", "summary": "애플의 첫 폴더블폰 아이폰 듀오의 사전 예약 수요가 폭증하며 삼성전자의 시장 독점 주도권이 시험대에 올랐다. 예약 직후 배송이 내년으로 지연될 만큼 구매가 몰리며 글로벌 폴더블 점유율 경쟁이 본격화됐다. 삼성전자는 다년간 축적한 힌지 및 디스플레이 내구성을 앞세워 수성에 나선다. 당사 폴더블 리더십 방어를 위한 공격적인 프로모션과 마케팅이 요구된다.", "source": "asiatoday.co.kr", "date": "2026-10-19 18:11", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006041", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰듀오 폴더블 주도권"}, {"title": "삼성전기, 3605억원 '메모리 패키지기판' 장기공급계약", "summary": "삼성전기가 글로벌 메모리 반도체 대기업과 3,605억 원 규모의 차세대 메모리용 반도체 패키지 기판 1년 장기공급계약(LTA)을 맺었습니다. 고성능 AI 메모리 수요 증가에 따른 패키징 부품 공급 확대입니다. 그룹 관계사의 반도체 부품 수주 확대를 참고할 수 있습니다.", "source": "ZDNet Korea", "date": "2026-10-19 18:02", "url": "https://zdnet.co.kr/view/?no=20261019174430", "category": "launch", "importance": 4, "sid": "memchina", "topic": "삼성전기 패키지기판"}, {"title": "Bank of America bets that memory chip profitability will dominate the market. Retail inves", "summary": "", "source": "富途牛牛", "date": "2026-10-19 17:52", "url": "https://news.goo d": "phone", "topic": "비보x500울트라 유출"}, {"title": "삼성 첫 오버이어 헤드폰 첫 인증 포착…애플 '에어팟 맥스' 정조준", "summary": "삼성전자의 첫 오버이어 무선 헤드폰 모델이 규제 인증을 통과했다. 애플의 에어팟 맥스와 소니 제품이 주도하는 프리미엄 오디오 시장에 도전장을 던지는 제품이다. 갤럭시 모바일 생태계의 사운드 경험을 헤드폰 영역까지 확장하는 첫 마일스톤이다. 하이엔드 음향 액세서리 포트폴리오 강화 측면에서 중요한 의미를 갖는다.", "source": "kbench.com", "date": "2026-10-19 16:31", "url": "https://kbench.com/?q=node/282589", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성오버이어헤드폰 인증"}, {"title": "애플 첫 폴더블 배송 지연…삼성 갤럭시 Z 폴드8 반사이익 얻나 By EBN", "summary": "애플의 첫 폴더블 스마트폰 사전 예약 배송이 내년으로 지연되면서 삼성 갤럭시 Z 폴드8이 반사이익을 얻을 것이라는 분석이다. 애플 신제품의 대기 기간이 길어지자 즉시 구매 가능한 삼성 플래그십 폴더블로 수요가 분산될 가능성이 제기된다. 프리미엄 폴더블 시장에서 당사의 안정적인 공급망과 양산 역량이 부각되고 있다. 공급 지연 틈새를 활용한 타깃 마케팅을 적극 추진할 만하다.", "source": "ebn.co.kr", "date": "2026-10-19 15:41", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1728305", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시z폴드8 반사이익"}, {"title": "삼성폰 또 '급 나누기'…갤S27 플러스, 기존 기능도 뺀다", "summary": "삼성전자가 차기 갤럭시 S27 플러스 모델에서 기존에 지원하던 UWB 기능을 제외할 가능성이 제기되며 급 나누기 논란이 일고 있다. 원가 폭등 속에서 부품 절감을 통해 가격 인상폭을 억제하려는 조치로 풀이된다. 그러나 기존 탑재 기능 삭제에 따른 플러스 모델 구매층의 불만이 예상된다. 라인업 간 기능 차별화와 원가 절감 사이의 정교한 밸런스가 요구된다.", "source": "뉴스1", "date": "2026-10-19 15:27", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE5Rci16RkFVWG9IOGk0TUI0RVl5cGpCVkcyajV5dGRrVVdXWk9tVHRWTUlWbVdEaml4WGJieHpSWGR0WVJwTUxGWUdKbk1MVUh2S3QzUDBNQjIzUQ?oc=5", "category": "quality", "importance": 4, "sid": "phone", "topic": "갤럭시s27플러스 uwb제외 루머"}, {"title": "폴더블폰에 “싸구려”라던 애플…삼성 패널 쓰고 가격은 100만원 더", "summary": "폴더블폰의 완성도를 폄하하던 애플이 삼성디스플레이 패널을 적용한 아이폰 듀오를 비싸게 책정해 논란이다. 초고가 가격 정책에도 불구하고 충성 고객층의 초기 수요가 몰리며 가격 저항을 무력화하고 있다. 애플 브랜드 파워가 고가 폴더블 시장에서도 통함을 보여주는 대목이다. 당사 플래그십 폴더블의 프리미엄 가치 제고와 가격 전략 재검토가 필요하다.", "source": "에너지경제신문", "date": "2026-10-19 15:04", "url": "https://news.google.com/rss/articles/CBMiY0FVX3lxTE9FdHVld055YmFHcDlVSXdORmo0WTRNaWNiWm56b1ZmNmVWcUFVYzIwZWNoUnI0RjZuU2d2T2FvRUlWMUZNWFRTelRtRlQyS3M0UTRZRk9vOU1KVkNQdm9hSGRUUQ?oc=5" <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
