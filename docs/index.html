dNews.aspx?no=1317526&inflow=G", "category": "price", "importance": 4, "sid": "memchina", "topic": "중국 스마트폰 중고 d램 재활용"}, {"title": "삼성전자, D램·낸드 개발 전담팀 꾸렸다…핵심 인력 보상 강화", "summary": "삼성전자 반도체(DS) 부문이 차세대 D램과 낸드플래시 신제품 개발을 전담하는 '코어팀'을 신설하고 핵심 인력에 대한 보상 강화와 조직 간 협업 체계 구축에 착수했다. 이는 메모리 반도체 경쟁 심화 속에서 신제품 개발 속도와 완성도를 높이기 위한 조치다.", "source": "전자신문", "date": "2026-10-21 18:22", "url": "https://www.etnews.com/20261021000449", "category": "exec", "importance": 4, "sid": "memchina", "topic": "삼성전자 ds부문 메모리 신제품 개발 코어팀 신설"}, {"title": "Samsung’s first Android XR glasses face a design problem its competitor already solved", "summary": "삼성전자의 첫 번째 안드로이드 XR 글래스가 경쟁사 메타-레이밴이 극복한 일상용 안경 형태의 디자인 난제에 직면했다는 외신 지적이 나왔다. 첨단 광학 하드웨어 탑재도 중요하지만 대중 수용성을 위해서는 얇고 가벼운 안경 형태를 구현하는 것이 핵심 과제다. 무거운 폼팩터와 심미성 부족은 초기 시장 흥행의 큰 걸림돌이 될 수 있다. 인체공학적 경량화 설계와 패션성을 동시에 확보하는 폼팩터 완성이 요구된다.", "source": "Android Authority", "date": "2026-10-21 18:00", "url": "https://www.androidauthority.com/samsung-smart-glasses-face-problem-ray-ban-meta-solved-3725475/", "category": "launch", "importance": 4, "sid": "glasses", "topic": "삼성 xr 글래스 디자인 난제"}, {"title": "[르포] 백악관 스피커부터 애비 로드 녹음실까지…강남서 만난 '사운드 레전드'", "summary": "삼성전자가 하만 산하 브랜드들의 기념일을 맞아 특별 오디오 전시 행사 '사운드 레전드'를 서울 강남에서 개최합니다. 역사적인 오디오 명기들을 전시하며 하만의 음향 헤리티지를 고객들에게 전달할 계획입니다. 프리미엄 오디오 생태계를 아우르는 삼성전자의 오디오 브랜드 역량 강화 행보입니다.", "source": "ZDNet Korea", "date": "2026-10-21 18:00", "url": "https://zdnet.co.kr/view/?no=20261021161805", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성전자 하만 오디오 사운드레전드 행사 개최"}, {"title": "Loop Capital Cuts Apple Rating Over iPhone Sales Outlook", "summary": "루프 캐피털이 글로벌 수요 둔화와 교체 주기 장기화를 이유로 애플에 대한 투자의견을 전격 하향 조정했다. 신제품 출시에도 불구하고 스마트폰 시장 전반의 침체로 인해 아이폰 판매 전망이 불투명하다는 평가다. 프리미엄 플래그십 시장의 수요 회복 속도에 대한 금융권의 회의론이 반영되었다. 4분기 글로벌 스마트폰 시장의 실판매 동향을 면밀히 분석해야 한다.", "source": "MacRumors", "date": "2026-10-21 17:38", "url": "https://www.macrumors.com/2026/10/21/loop-capital-cuts-apple-rating-over-iphone-sales-outlook/", "category": "other", "im a", "topic": "tsmc 공장 건설현장 사고"}, {"title": "Perplexity Computer Can Now Run Fully Locally on Mac", "summary": "퍼플렉시티의 AI 컴퓨터 기능이 인터넷 연결 없이 맥 환경에서 완전히 로컬로 작동하게 되었습니다. 기기 내부 NPU 자원을 활용해 민감한 데이터의 외부 유출 없이 로컬 검색과 연산을 처리합니다. PC 시장에서 데이터 프라이버시를 앞세운 온디바이스 AI 도구의 대중화가 가속화되고 있습니다. 갤럭시 북의 로컬 NPU 활용 온디바이스 AI 생산성 앱 확장이 필요합니다.", "source": "MacRumors", "date": "2026-10-21 07:20", "url": "https://www.macrumors.com/2026/10/20/perplexity-computer-local-mac/", "category": "launch", "importance": 4, "sid": "pc", "topic": "perplexity 로컬 ai"}, {"title": "NY포스트 “솔리다임, 美 뉴욕 유티카에 낸드 공장 검토”", "summary": "SK하이닉스의 미국 낸드 자회사 솔리다임이 미국 뉴욕주에 낸드 플래시 생산 공장 건립을 위해 주 정부와 진전된 협상을 진행 중이다. 메모리 반도체 공급망 확장과 투자 관련 주요 소식이다.", "source": "전자신문", "date": "2026-10-21 07:14", "url": "https://www.etnews.com/20261021000003", "category": "launch", "importance": 4, "sid": "memchina", "topic": "솔리다임 뉴욕 낸드 공장"}, {"title": "Google’s more personalized Gemini AI is heading to your car", "summary": "구글이 안드로이드 오토와 구글 빌트인 차량에 개인 맞춤형 제미나이 AI를 대폭 확대 적용한다고 발표했습니다. 지메일, 캘린더, 지도 등 구글 서비스 전반의 개인 데이터를 연동하여 차량 내 맞춤형 음성 어시스턴트를 제공합니다. 애플 카플레이와의 차량 내 인포테인먼트 및 AI 주도권 경쟁이 본격화되고 있습니다. 갤럭시 스마트폰의 차량 연동 경험 및 빅스비 연계 편의성 고도화가 요구됩니다.", "source": "The Verge", "date": "2026-10-21 07:11", "url": "https://www.theverge.com/tech/1014999/google-gemini-ai-cars-android-auto", "category": "launch", "importance": 4, "sid": "phone", "topic": "gemini ai 인포테인먼트"}, {"title": "Survey reveals trust in Google has taken a big hit after this quiet Android change", "summary": "설문조사 결과 구글이 사용자 동의 없이 전화번호를 구글 계정에 자동 연동하면서 브랜드 신뢰도가 급락한 것으로 나타났습니다. 다수의 사용자가 강제적인 데이터 통합과 프라이버시 침해에 강한 거부감을 드러냈습니다. 플랫폼 빅테크의 일방적인 데이터 통제 정책에 반발이 커지고 있습니다. 삼성 계정의 투명한 개인정보 관리와 보안성을 강조해 신뢰를 확보해야 합니다.", "source": "Android Authority", "date": "2026-10-21 06:18", "url": "https://www.androidauthority.com/android-phone-number-verification-google-trust-poll-results-3725788/", "category": "policy", "importance": 4, "sid": "phone", "topic": "google 계정 강제연동"}], "2026-10-20": [{"title": "Amazon cuts the Samsung Galaxy S26 Ultra by 32%, saving you over $450", "summary": "아마존에서 삼성 갤럭시 S26 울트라가 32% 할인되어 945달러에 판매되고 있습니다. S펜 지원, 갤럭시 AI 기능 등을 갖춘 플래그십 모델의 대폭 할인입니다. 출시 후 가격 조정 및 재고 소진을 위한 공격적인 프로모션입니다.", "source": "Android Authority", "date": "2026-10-20 23:48", "url": "https://www.androidauthority.com/deal-samsung-galaxy-s26-ultra-amazon-3725580/", "category": "price", "importance": 5, "sid": "phone", "topic": "삼성 갤럭시 s26 울트라 할인"}, {"title": "삼성전자, 첫 클립형 이어폰 ‘갤럭시 버즈 온’ 공개…27일 출시", "summary": "삼성전자가 갤럭시 최초의 클립형 무선 이어폰 '갤럭시 버즈 온'을 공개했다. 귀를 막지 않는 오픈형 폼팩터를 적용해 주변 소리를 들으면서 음악을 감상할 수 있으며, 블랙 단일 모델로 29만 9000원에 27일 출시된다.", "source": "msn.com", "date": "2026-10-20 21:24", "url": "https://www.msn.com/ko-kr/money/topstories/삼성전자-첫-클립형-이어폰-갤럭시-버즈-온-공개-27일-출시/ar-AA2fDm9C", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시 버즈 온 공개"}, {"title": "\"착용감·음질 다 잡았다\" 삼성, 귀 안막는 '클립형 이어폰' 승부", "summary": "삼성전자가 갤럭시 버즈 시리즈 최초의 오픈형 클립형 무선 이어폰 '갤럭시 버즈 온'을 27일에 29만9000원으로 공식 출시합니다. 1억 1,900만 개의 귀 데이터를 활용해 착용감을 최적화하고, 듀얼 우퍼로 저음을 강화했으며 머리 움직임 제어 등 AI 음성 명령을 지원합니다. 아웃도어 활동을 즐기는 사용자를 겨냥해 세컨드 이어폰 시장을 공략할 계획입니다.", "source": "msn.com", "date": "2026-10-20 21:15", "url": "https://www.msn.com/ko-kr/news/techandscience/착용감-음질-다-잡았다-삼성-귀-안막는-클립형-이어폰-승부/ar-AA2fFWkT", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 출시"}, {"title": "Samsung fighting iPhone Duo by launching six foldable phones next year", "summary": "삼성전자가 애플의 첫 폴더블폰 아이폰 듀오의 흥행에 맞서 내년 최대 6종의 폴더블폰 라인업 출시를 검토 중인 것으로 전해졌습니다. 애플 진입으로 급변하는 폼팩터 경쟁에서 세그먼트 세분화를 통해 시장 지배력을 방어하려는 포석입니다. 시장 확대와 가격대 다변화를 동시에 노리는 적극적인 라인업 전략으로 평가됩니다. 차세대 Z 시리즈의 개발 일정과 수율 및 원가 경쟁력을 면밀히 수립해야 합니다.", "source": "9to5Mac", "date": "2026-10-20 21:00", "url": "https://9to5mac.com/2026/10/20/samsung-fighting-iphone-duo-by-launching-six-foldable-phones-next-year/", "category": "launch", "importance": 5, "sid": "phone", "topic": "samsung 폴더블폰 라인업"}, {"title": "Snapdragon or Exynos? New upgrade for Exynos Galaxy S27 could make this a tough choice", "summary": "차기 엑시노스 탑재 갤럭시 S27이 셀룰러 성능과 전력 효율성 측면에서 스냅드래곤 모델에 뒤처지지 않을 것이라는 전망이 제기되었습니다. 엑시노스 칩셋의 성능 개선이 이루어질 경우 플래그십 선택의 폭이 넓어질 수 있습니다. 삼성의 자체 칩 경쟁력 회복 여부가 주목되는 대목입니다.", "source": "Android Authority", "date": "2026-10-20 20:45", "url": "https://www.androidauthority.com/samsung-galaxy-s27-cellular-upgrade-modem-3725448/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 엑시노스 갤럭시 s27 업그레이드"}, {"title": "Tesla, Dell, and Apple Have Become the 'Weaker Party'… Samsung Electronics' Negotiating Po", "summary": "테슬라, 델, 애플 등 글로벌 빅테크 기업들이 메모리 수급난 속에서 '약자'의 처지로 전락하며 삼성전자의 부품 협상력이 극대화되었다는 분석이 나왔다. 공급자 주도 시장에서 부품 단가 및 계약 조건의 우위를 점할 수 있게 되었다. 삼성전자의 압도적인 시장 지배력을 방증한다.", "source": "머니투데이", "date": "2026-10-20 18:20", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9TbnRCRTJ1cHNkWE92NEtDaTR3Qjd4SHlfNGsyRzhrRnBvOGQ0d19qQWlISGlqbldISlVZUk1lYW9mQlVpNVpjUmtPbVZhRjF0Y3ZGV2ZuYWxEeXBXcWRhdTBrYTc3bmhNN1ZGbWI4c1c4aVhtQzVJaUxRQXhYUQ?oc=5", "category": "policy", "importance": 5, "sid": "memchina", "topic": "반도체 협상력"}, {"title": "Samsung Secures 80% of Its 2027 Memory Chip Orders in Advance", "summary": "삼성전자가 2027년 전체 메모리 칩 주문량의 80%를 사전 선점으로 확보하는 데 성공했다. 압도적인 공급 능력을 바탕으로 물량을 조기에 계약하며 안정적 수익 기반을 다졌다. 반도체 주도권을 공고히 하는 핵심 성과다.", "source": "SammyGuru", "date": "2026-10-20 18:02", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9lX2QwUzdzaE12ZkJ5YUtOcHpjdWtDS1RrRUtrWFVLUDVLaDhoM1AzM0ttaGFkdC1TRGNpck5ReGdFYjNVYjFCN2NINmR4Q2Q1cmIzaGREc1p3dDJmVFhGdUhPWHRBVUlWcFUxUzloSTROMURtTXF0RzFPYlN1UQ?oc=5", "category": "policy", "importance": 5, "sid": "memchina", "topic": "메모리반도체 계약"}, {"title": "One of Samsung’s most popular phones is now getting stable One UI 9 with Android 17", "summary": "삼성이 대중적인 인기 모델인 갤럭시 A36 5G를 대상으로 안드로이드 17 기반의 안정적인 원 UI 9 배포를 시작했습니다. 플래그십뿐만 아니라 보급형 라인업까지 빠른 소프트웨어 업데이트를 제공하여 사용자 경험을 제고합니다. 삼성 MX사업부의 탄탄한 사후 지원 체계를 보여주는 사례입니다.", "source": "Android Authority", "date": "2026-10-20 17:59", "url": "https://www.androidauthority.com/galaxy-a36-5g-st ble iPhone Is Already Backordered Until January", "summary": "애플 최초의 폴더블 스마트폰 아이폰 듀오의 사전 예약 주문 배송일정이 폭발적 수요로 인해 내년 1월로 밀려났다. 공급 부족과 강력한 대기 수요가 맞물려 초기 공급망 관리가 시험대에 올랐다. 프리미엄 폴더블폰 시장의 판도가 급격히 애플 중심으로 재편될 조짐을 보인다. 애플의 초기 공급 지연 틈새를 노려 갤럭시 Z 폴드 마케팅을 강화해야 한다.", "source": "techrepublic.com", "date": "2026-10-19 15:34", "url": "https://www.techrepublic.com/article/news-iphone-duo-preorders-january-shipping-delays/", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰듀오 배송지연"}, {"title": "삼성, 내년 갤럭시 Z 시리즈 6종으로 확대하나…‘트라이폴드2·슬라이드’ 등장 전망 - 디지털데일리", "summary": "삼성이 내년 갤럭시 Z 폴더블폰 라인업을 6종으로 늘릴 것으로 보이는 가운데, 신규 폼팩터인 트라이폴드2와 슬라이드형 제품이 등장할 것으로 예상되어 폼팩터 경쟁이 더욱 치열해질 전망이다.", "source": "ZDNet Korea", "date": "2026-10-19 12:42", "url": "https://zdnet.co.kr/view/?no=20261019190401", "category": "launch", "importance": 5, "sid": "phone", "topic": "갤럭시 z 시리즈 확대"}, {"title": "Apple’s $1,999 iPhone bet just got its first answer", "summary": "애플의 첫 폴더블폰 아이폰 듀오가 초고가에도 불구하고 사전 주문이 폭주하며 흥행에 성공했다. 2TB 모델이 3천 달러를 넘는 고가임에도 애플 팬덤의 구매가 몰리며 시장 안착을 이뤄냈다. 폴더블 시장의 단독 주주였던 삼성전자의 프리미엄 독점권이 실질적 위협에 직면했다. 폴더블 플래그십 기술 및 마케팅 전략의 전면적 대응이 시급하다.", "source": "finance.yahoo.com", "date": "2026-10-19 01:59", "url": "https://finance.yahoo.com/markets/stocks/articles/apple-1-999-iphone-bet-014700097.html", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰듀오 출시"}, {"title": "South Africa Smartphone Market Share 2026: Samsung at 49.75%", "summary": "2026년 남아프리카공화국 스마트폰 시장에서 삼성전자가 49.75%의 압도적인 점유율로 선두를 차지하고 있다는 시장 조사 보도이다. 아프리카 주요 거점 시장에서의 시장 지배력 유지 현상을 보여주는 핵심 지표이다.", "source": "msn.com", "date": "2026-10-19 23:48", "url": "https://www.msn.com/ko-kr/news/other/쪼그라든-스마트폰-시장-삼성-애플-점유율-넘어-수익성-공급망-시험대/ar-AA2etfId", "category": "launch", "importance": 4, "sid": "phone", "topic": "남아프리카 스마트폰 시장 점유율"}, {"title": "[A 현장] '갤럭시 버즈 온' 베일 벗었다...삼성전자 \"착용감·통화 품질 세계 최고 자부\"", "summary": "삼성전자가 진행한 소비자 조사에 따르면 클립형 이어폰 사용자의 약 73%가 기존 인이어 이어폰도 함께 소지하며 병행 사용하는 것으로 나타났다. 대중교통 등 몰입이 필요할 때는 ANC 기능을 갖춘 갤럭시 버즈 elZZZzFNTV9qNk5ObF9lT0RRN3JkbFgtTW81Z01HbWRsUnFYWlVoR0tMTlAyYw?oc=5", "category": "policy", "importance": 4, "sid": "memchina", "topic": "oled 패널 공급"}, {"title": "삼성 첫 오버이어 헤드폰 첫 인증 포착…애플 '에어팟 맥스' 정조준", "summary": "삼성전자의 첫 오버이어 무선 헤드폰 모델이 규제 인증을 통과했다. 애플의 에어팟 맥스와 소니 제품이 주도하는 프리미엄 오디오 시장에 도전장을 던지는 제품이다. 갤럭시 모바일 생태계의 사운드 경험을 헤드폰 영역까지 확장하는 첫 마일스톤이다. 하이엔드 음향 액세서리 포트폴리오 강화 측면에서 중요한 의미를 갖는다.", "source": "kbench.com", "date": "2026-10-19 16:31", "url": "https://kbench.com/?q=node/282589", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성오버이어헤드폰 인증"}, {"title": "애플 첫 폴더블 배송 지연…삼성 갤럭시 Z 폴드8 반사이익 얻나 By EBN", "summary": "애플의 첫 폴더블 스마트폰 사전 예약 배송이 내년으로 지연되면서 삼성 갤럭시 Z 폴드8이 반사이익을 얻을 것이라는 분석이다. 애플 신제품의 대기 기간이 길어지자 즉시 구매 가능한 삼성 플래그십 폴더블로 수요가 분산될 가능성이 제기된다. 프리미엄 폴더블 시장에서 당사의 안정적인 공급망과 양산 역량이 부각되고 있다. 공급 지연 틈새를 활용한 타깃 마케팅을 적극 추진할 만하다.", "source": "ebn.co.kr", "date": "2026-10-19 15:41", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1728305", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시z폴드8 반사이익"}, {"title": "삼성폰 또 '급 나누기'…갤S27 플러스, 기존 기능도 뺀다", "summary": "삼성전자가 차기 갤럭시 S27 플러스 모델에서 기존에 지원하던 UWB 기능을 제외할 가능성이 제기되며 급 나누기 논란이 일고 있다. 원가 폭등 속에서 부품 절감을 통해 가격 인상폭을 억제하려는 조치로 풀이된다. 그러나 기존 탑재 기능 삭제에 따른 플러스 모델 구매층의 불만이 예상된다. 라인업 간 기능 차별화와 원가 절감 사이의 정교한 밸런스가 요구된다.", "source": "뉴스1", "date": "2026-10-19 15:27", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE5Rci16RkFVWG9IOGk0TUI0RVl5cGpCVkcyajV5dGRrVVdXWk9tVHRWTUlWbVdEaml4WGJieHpSWGR0WVJwTUxGWUdKbk1MVUh2S3QzUDBNQjIzUQ?oc=5", "category": "quality", "importance": 4, "sid": "phone", "topic": "갤럭시s27플러스 uwb제외 루머"}, {"title": "폴더블폰에 “싸구려”라던 애플…삼성 패널 쓰고 가격은 100만원 더", "summary": "폴더블폰의 완성도를 폄하하던 애플이 삼성디스플레이 패널을 적용한 아이폰 듀오를 비싸게 책정해 논란이다. 초고가 가격 정책에도 불구하고 충성 고객층의 초기 수요가 몰리며 가격 저항을 무력화하고 있다. 애플 브랜드 파워가 고가 폴더블 시장에서도 통함을 보여주는 대목이다. 당사 플래그십 폴더블의 프리미엄 가치 제고와 가격 전략 재검토가 필요하다.", "source": "에너지경제신문", "date": "2026-10-19 15:04", "url": "https://news.google.com/rss/articles/CBMiY0FVX3lxTE9FdHVld055YmFHcDl // ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}

  text+="브리핑을 마칩니다.";

  u.lang="ko-KR"; u.rate=1.05;

}

  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
