tle": "애플 '팀 쿡 시대' 종료…존 터너스 차기 CEO, 폴더블·AI 시험대", "summary": "팀 쿡이 15년 임기를 마치고 존 터너스에게 애플 CEO 자리를 넘긴다. 신임 터너스 CEO는 첫 폴더블 아이폰 공개를 시작으로 AI 경쟁력 회복과 공급망 재편이라는 막중한 과제를 안고 새 체제를 시작한다. 팀 쿡은 SNS를 통해 퇴임 소회를 전했다. 애플의 리더십 교체와 폴더블폰 참전은 글로벌 스마트폰 시장 구도에 거대한 지각변동을 예고한다.", "source": "전자신문", "date": "2026-09-01 14:35", "url": "https://www.etnews.com/20260901000304", "category": "exec", "importance": 4, "wl": true, "topic": "apple ceo 교체와 폴더블"}, {"title": "iPhone Ultra release timing: Here’s what the latest reporting says", "summary": "애플이 9월 행사에서 첫 폴더블 스마트폰인 '아이폰 울트라'를 공개할 예정이나, 실제 사용자 배송 일정은 아직 불투명하다는 보도가 나왔다. 폴더블폰 시장에 진입하는 애플의 행보는 업계 전반의 경쟁 구도에 큰 파장을 일으킬 것으로 예상된다. 삼성전자 갤럭시 Z 폴드 시리즈가 선점하고 있는 폴더블폰 시장에 강력한 경쟁 상대로 부상한다. 이에 대한 철저한 제품 경쟁력 분석과 마케팅 대응 전략 수립이 필요하다.", "source": "9to5Mac", "date": "2026-09-01 03:55", "url": "https://9to5mac.com/2026/08/31/iphone-ultra-release-timing-heres-what-the-latest-reporting-says/", "category": "launch", "importance": 4, "wl": true, "topic": "iphone ultra 출시"}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "갤럭시 S27 및 S27 플러스 모델에 S27 프로와 동일한 3배율 망원 카메라 시스템이 탑재되어 유의미한 줌 카메라 업그레이드가 이루어질 가능성이 제기되었다. 플래그십 스마트폰의 카메라 성능 경쟁력을 강화하려는 행보로 풀이된다. 삼성전자 스마트폰의 하드웨어 스펙 업그레이드 방향을 보여주며 시장의 기대를 모으고 있다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "launch", "importance": 3, "wl": true, "topic": "galaxy s27 카메라 개선"}, {"title": "iPhone 18 Pro: Three reasons you might want to upgrade from iPhone 17 Pro", "summary": "다음 주 공개를 앞둔 아이폰 18 프로에 대해 아이폰 17 프로 사용자들이 업그레이드를 고려할 만한 세 가지 주요 동기가 제시되었다. 혁신적인 기능 개선이 예고되면서 교체 수요를 자극할 것으로 보입니다. 프리미엄 스마트폰 시장에서 애플의 신제품 공세가 본격화되고 있다. 삼성전자 MX사업부의 플래그십 스마트폰 판매 전략에 대응이 요구된다.", "source": "9to5Mac", "date": "2026-09-01 05:21", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-three-reasons-you-might-want-to-upgrade-from-iphone-17-pro/", "category": "launch", "importance": 3, "wl": true, "topic": "iphone 18 pro 출시"}, {"title": "Apple Might Add a Pencil to Its First Foldable, but Don’t Expect It at Launch", "summary": "애플이 첫 폴더블 아이폰에 펜슬 지원을 검토했으나 스티브 잡스의 과거 발언과 달리 출시 초기에는 포함하지 않을 가능성이 높다는 보도가 나왔다. 폴더블 스마트폰 시장에서 스타일러스 펜의 탑재 여부가 제조사별 차별화 요소로 작용하고 있음을 보여준다.", "source": "CNET", "date": "2026-09-01 03:43", "url": "https://www.cnet.com/tech/mobile/apple-might-add-a-pencil-to-its-first-foldable-but-dont-expect-it-at-launch/", "category": "launch", "importance": 3, "wl": true, "topic": "iphone ultra 애플 펜슬 미지원"}, {"title": "iOS 27 beta 8 now available as Apple tests major Siri AI upgrade", "summary": "애플이 9월 공식 출시를 앞두고 주요 시리(Siri) AI 업그레이드가 포함된 iOS 27의 여덟 번째 베타 버전을 배포했다. 향상된 인공지능 비서 기능을 통해 모바일 사용자 경험을 대폭 개선하려는 전략이다. AI 스마트폰 시장에서 경쟁하는 삼성전자에 시사하는 바가 크다. 소프트웨어 완성도를 높여가는 애플의 AI 전략을 예의주시해야 한다.", "source": "9to5Mac", "date": "2026-09-01 02:12", "url": "https://9to5mac.com/2026/08/31/ios-27-beta-8/", "category": "quality", "importance": 3, "wl": true, "topic": "ios 27 베타"}, {"title": "Apple could discontinue 10+ popular products next week", "summary": "애플이 다가오는 9월 신제품 런칭 행사와 함께 10개 이상의 인기 현행 기기를 단종할 것으로 예상된다. 신제품 라인업 재편을 통해 재고를 정리하고 판매 집중도를 높이려는 전략이다. 스마트폰 및 IT 기기 시장에서 세대 교체가 빠르게 이루어지고 있음을 보여준다. 경쟁사의 제품 수명 주기 관리 전략을 파악하는 데 유용하다.", "source": "9to5Mac", "date": "2026-09-01 01:04", "url": "https://9to5mac.com/2026/08/31/apple-could-discontinue-10-popular-products-next-week/", "category": "launch", "importance": 3, "wl": true, "topic": "apple 구형 제품 단종"}, {"title": "I compared the cameras on the Galaxy Z Fold 8 and Pixel 11 Pro Fold - and one pulled ahead", "summary": "독일 여행 중 갤럭시 Z 폴드 8과 픽셀 11 프로 폴드의 카메라 성능을 직접 비교 테스트한 결과 접전 끝에 한 제품이 우세를 차지했다. 두 차세대 폴더블 스마트폰 간의 카메라 화질 및 사진 품질 경쟁이 매우 치열함을 보여준다. 삼성전자 폴더블 플래그십의 카메라 경쟁력을 객관적으로 평가하는 유의미한 정보이다.", "source": "ZDNet", "date": "2026-09-01 00:50", "url": "https://www.zdnet.com/article/samsung-galaxy-z-fold-8-camera-vs-pixel-11-pro-fold-camera/", "category": "quality", "importance": 3, "wl": true, "topic": "galaxy z fold 8 vs pixel 11 pro fold 카메라"}, {"title": "There’s already another tri-fold phone on the market, and it’s not from Samsung", "summary": "삼성전자가 아닌 다른 제조사에서 또 다른 트라이폴드(3단 접이식) 스마트폰인 화웨이 메이트 XT 2가 시장에 출시되며 삼중 접이식 스마트폰 시장이 확대되고 있다. 폴더블을 넘어선 새로운 폼팩터 경쟁이 가속화되고 있음을 보여준다. 삼성전자의 차세대 폼팩터 개발 및 시장 선점 전략에 긴장감을 주는 경쟁사 동향이다.", "source": "Android Authority", "date": "2026-08-31 22:57", "url": "https://www.androidauthority.com/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 3, "wl": true, "topic": "huawei mate xt 2 출시"}, {"title": "Scam Detection could be coming to Galaxy S27, but there’s also good news for older phones", "summary": "갤럭시 S27에 사기 전화 및 피싱을 탐지하는 '스캠 감지(Scam Detection)' 기능이 탑재될 가능성이 제기되었으며, 구형 기기에도 확대될 수 있다는 긍정적인 소식이 전해졌다. AI 기반의 보안 기능이 차세대 스마트폰의 핵심 셀링 포인트로 부상하고 있다. 삼성전자가 보안 및 통화 품질 관련 AI 기능을 강화하여 소비자 편의를 높이려는 전략의 일환이다.", "source": "Android Authority", "date": "2026-08-31 18:38", "url": "https://www.androidauthority.com/google-scam-detection-samsung-galaxy-s27-apk-teardown-3704743/", "category": "launch", "importance": 3, "wl": true, "topic": "galaxy s27 스캠 감지"}, {"title": "PSA: Gemini can adjust system settings on any Pixel running Android 17", "summary": "안드로이드 17을 구동하는 픽셀 기기에서 제미니(Gemini) AI를 통해 시스템 설정을 음성으로 직접 조절할 수 있게 되었다. AI 어시스턴트가 단순 정보 검색을 넘어 OS 제어 권한까지 확장되는 추세를 보여준다. 모바일 AI 에이전트의 실사용 편의성이 대폭 강화되고 있음을 시사한다.", "source": "Android Authority", "date": "2026-09-01 05:06", "url": "https://www.androidauthority.com/device-help-android-17-3705148/", "category": "quality", "importance": 2, "wl": true, "topic": "android 17 gemini 설정"}, {"title": "Satellite SOS just proved why it could be your phone’s most important feature", "summary": "네팔 홍수 재난 상황에서 위성 SOS 기능이 조난자의 구조를 도우며 스마트폰의 위성 통신 기능이 생존에 가장 중요한 기능임을 입증했다. 극한 환경에서의 비상 통신 수단으로서 위성 연결성의 중요성이 부각되고 있다. 프리미엄 스마트폰의 필수 안전 기능으로 자리 잡고 있는 추세다.", "source": "Android Authority", "date": "2026-09-01 02:43", "url": "https://www.androidauthority.com/satellite-connectivity-saves-life-of-man-3705087/", "category": "quality", "importance": 2, "wl": true, "topic": "satellite sos 구조 사례"}, {"title": "New Android 17 QPR2 feature lets you peek inside your phone’s secure sandbox", "summary": "안드로이드 17 QPR2 베타 4 버전에서 프라이버시 대시보드 내에 프라이빗 컴퓨트 코어 데이터 로깅 제어 기능이 새롭게 도입되었다. 사용자가 스마트폰의 보안 샌드박스 내부 동작을 직접 모니터링하고 제어할 수 있게 된다. 모바일 운영체제의 프라이버시 보호 기능이 한층 더 고도화되고 있다.", "source": "Android Authority", "date": "2026-08-31 22:48", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-private-compute-core-data-logging-3704959/", "category": "quality", "importance": 2, "wl": true, "topic": "android 17 qpr2 프라이버시"}, {"title": "How Android 17 stops network snoops and SMS blasters now - with ECH and a 2G kill switch", "summary": "안드로이드 17 최신 업데이트가 ECH(Encrypted Client Hello) 및 2G 킬 스위치 지원을 광범위하게 도입하여 네트워크 스니핑과 SMS 블래스터 공격을 효과적으로 차단한다. 모바일 통신 보안 기능이 대폭 강화되고 있음을 보여준다.", "source": "ZDNet", "date": "2026-08-31 22:13", "url": "https://www.zdnet.com/article/android-17-web-browsing-security-privacy-features-update/", "category": "quality", "importance": 2, "wl": true, "topic": "android 17 네트워크 보안"}, {"title": "Android 17 QPR2 Beta 4 fixes a long-standing APK sideloading pain point", "summary": "안드로이드 17 QPR2 베타 4에서 새로운 인라인 다이얼로그 박스와 일회성 설치 권한을 도입하여 알려지지 않은 앱(APK) 사이드로딩의 보안성과 편의성을 개선했다. 외부 앱 설치 시 발생하던 오랜 불편 사항을 해소하려는 조치다. 모바일 OS의 보안 정책 변화를 보여준다.", "source": "Android Authority", "date": "2026-08-31 21:29", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-apk-sideloading-permissions-3704842/", "category": "quality", "importance": 2, "wl": true, "topic": "android 17 apk 사이드로딩"}, {"title": "Android 17 QPR2 Beta 4 puts AI agents under supervision with new dashboard", "summary": "안드로이드 17 QPR2 베타 4에 기기에 설치된 모든 AI 에이전트를 추적하고 관리할 수 있는 새로운 대시보드가 추가되었다. 파편화될 수 있는 AI 에이전트들의 권한과 동작을 통합 관리할 수 있는 기반을 마련했다. 모바일 AI 생태계의 보안 및 거버넌스 강화 트렌드를 보여준다.", "source": "Android Authority", "date": "2026-08-31 20:05", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-agent-dashboard-3704775/", "category": "qualit <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
</html>
