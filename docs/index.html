 "wl": true, "topic": "화웨이 메이트패드 프로 출시"}, {"title": "Galaxy Tab S12 Ultra Could Deliver a Big Performance Boost - SammyGuru", "summary": "차기작인 갤럭시 Tab S12 울트라가 대폭 향상된 성능과 처리 속도를 제공할 것이라는 전망이 제기되었습니다. 태블릿 시장에서 프리미엄 입지를 굳히기 위한 하드웨어 업그레이드가 예고되었습니다.", "source": "SammyGuru", "date": "2026-09-02 21:13", "url": "https://sammyguru.com/samsung-galaxy-tab-s12-ultra-geekbench-performance/", "category": "launch", "importance": 4, "wl": false, "topic": "갤럭시 tab s12 성능"}, {"title": "Leaked Galaxy Tab S12 Ultra benchmark reveals a surprising performance upgrade - PhoneAren", "summary": "유출된 갤럭시 Tab S12 울트라의 벤치마크 결과 놀라운 성능 향상이 확인되었습니다. 차세대 태블릿 시장에서 강력한 성능을 바탕으로 우위를 점할 것으로 기대됩니다. 프로세서와 전반적인 시스템 속도가 대폭 개선된 것으로 나타났습니다. 프리미엄 태블릿 수요를 견인할 핵심 제품으로 주목받고 있습니다.", "source": "PhoneArena", "date": "2026-09-02 09:43", "url": "https://www.phonearena.com/news/leaked-galaxy-tab-s12-ultra-benchmark-reveals-a-surprising-performance-upgrade_id183014", "category": "quality", "importance": 3, "wl": false, "topic": "galaxy tab s12 ultra 출시"}, {"title": "삼성전자, ‘New 갤럭시 북6’ 국내 출시…가격 119만~149만원", "summary": "14형·1.35㎏에 인텔 코어 시리즈3…동영상 최대 25시간 재생 30분 충전하면 최대 33%…AI 사진 편집·웹페이지 실시간 번역 스마트폰· 갤럭시 탭 파일 PC서 열고 옮겨…22일까지 출시 행사 [서울타임즈뉴스 = 허성미...", "source": "seoultimes.news", "date": "2026-09-01 15:15", "url": "https://www.seoultimes.news/news/article.html?no=2000099387", "category": "launch", "importance": 3, "wl": false, "topic": ""}, {"title": "Snatch a stylus-powered Galaxy Tab S10 Lite at a bargain price courtesy of Samsung's lates", "summary": "삼성전자의 최신 프로모션을 통해 스타일러스 펜이 포함된 갤럭시 탭 S10 라이트를 저렴한 가격에 구매할 수 있습니다. 보급형 태블릿 시장에서 가성비를 강조하여 판매량을 견인하려는 전략입니다. 합리적인 가격에 생산성 기기를 찾는 학생과 실속파 소비자들을 타겟으로 합니다.", "source": "PhoneArena", "date": "2026-09-02 00:31", "url": "https://www.phonearena.com/news/galaxy-tab-s10-lite-samsung-deal_id183011", "category": "price", "importance": 2, "wl": false, "topic": "galaxy tab s10 lite 출시"}], "pc": [{"title": "M6 MacBook Pro: Three new upgrades launching this fall", "summary": "애플이 올가을 14인치 화면과 기존 산업 디자인을 유지한 신형 'M6 맥북 프로'를 출시할 예정입니다. 공식 공개된 M6 칩셋을 기반으로 세 가지 주요 성능 업그레이드가 이뤄질 것으로 기대됩니다. 차세대 PC 시장에서 애플 실리콘의 성능 리더십을 이어갈 주력 모델입니다. 노트북 시장의 경쟁 구도에 상당한 파장을 일으킬 전망입니다.", "source": "9to5Mac", "date": "2026-09-03 00:36", "url": "https://9to5mac.com/2026/09/02/m6-macbook-pro-three-new-upgrades-launching-this-fall/", "category": "launch", "importance": 4, "wl": true, "topic": "맥북프로 출시"}, {"title": "Apple's New Mac Mini Already Discounted - See the Pre-Order Deals", "summary": "애플의 신형 '맥 미니'가 출시 직후 이례적으로 사전 예약 할인에 돌입했습니다. 신제품 판매 초기부터 가격 경쟁력을 내세워 소비자 수요를 선점하려는 유통가의 움직임이 포착되었습니다. PC 시장에서 애플 실기론 기반 미니 PC의 인기를 증명합니다. 관련 액세서리 및 하드웨어 시장에도 영향을 미치고 있습니다.", "source": "MacRumors", "date": "2026-09-03 00:11", "url": "https://www.macrumors.com/2026/09/02/pre-order-discounts-mac-mini/", "category": "price", "importance": 3, "wl": true, "topic": "맥미니 할인"}, {"title": "Mac Studio Buyer's Guide: M5 Max vs. M5 Ultra", "summary": "애플의 하이엔드 데스크톱 '맥 스튜디오' 구매를 앞둔 사용자들을 위해 M5 맥스(Max)와 M5 울트라(Ultra) 칩셋 성능을 전격 비교하는 바이어스 가이드가 공개되었습니다. 크리에이터 및 프로페셔널 사용자층을 위한 최적의 칩셋 선택 가이드를 제공합니다. 워크스테이션 시장에서 애플 실리콘의 최상위 라인업 성능 경쟁력을 보여줍니다. 전문가용 PC 시장의 주요 참고 자료입니다.", "source": "MacRumors", "date": "2026-09-02 21:07", "url": "https://www.macrumors.com/guide/m5-max-vs-m5-ultra/", "category": "launch", "importance": 3, "wl": true, "topic": "맥스튜디오 가이드"}, {"title": "궁극의 선명함: AGON by AOC, 세계 최초 5K NVIDIA G-SYNC® Pulsar 게이밍 모니터 공개", "summary": "AGON by AOC가 세계 최초로 5K 초고해상도와 엔비디아 지싱크 펄사(G-SYNC Pulsar) 기술을 결합하여 탁월한 모션 선명도와 화면 찢어짐 없는 게이밍 경험을 제공하는 혁신적인 게이밍 모니터를 공개했다. 7년 연속 세계 1위 게이밍 모니터 브랜드로서 기술 리더십을 공고히 하려는 전략이다. 하이엔드 게이머들을 사로잡기 위한 디스플레이 기술 경쟁이 한층 고조되고 있다.", "source": "ZDNet Korea", "date": "2026-09-02 19:10", "url": "https://zdnet.co.kr/view/?no=20260902191003", "category": "launch", "importance": 3, "wl": true, "topic": "agon 게이밍 모니터 5k g-sync"}, {"title": "Acer launches the Swift Air 16 and the incredibly light Swift Blade 14", "summary": "에이서가 인텔 코어 7 프로세서의 강력한 성능과 3K OLED 디스플레이를 탑재한 초경량 노트북 '스위프트 블레이드 14'와 '스위프트 에어 16'을 전격 출시했습니다. 프리미엄 성능과 가벼운 휴대성을 동시에 만족시키는 고성능 노트북 라인업입니다. 하반기 글로벌 PC 시장에서 인텔 진영의 노트북 경쟁력을 과시하고 있습니다. 삼성 갤럭시 북 시리즈에 긴장감을 주는 신제품입니다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-swift-blade-14-and-air-16-3705806/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 스위프트"}, {"title": "Acer Recommits to Repairability With New Vero 16 Laptop", "summary": "에이서가 IFA 2026 전시회를 통해 뛰어난 수리 용이성을 강조한 친환경 노트북 '베로 16' 신제품과 함께 더욱 슬림해진 스위프트 라인업을 공개했다. 지속 가능성과 제조 편의성을 동시에 잡은 친환경 디자인 철학이 반영되었다. 글로벌 PC 시장에서 친환경 소재와 수리 가능 설계가 주요 트렌드로 자리잡고 있다. 소비자들의 가치 소비 성향을 겨냥한 노트북 신제품 공세다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/computing/acer-recommits-to-repairability-with-new-vero-16-laptop/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 베로 16 노트북 공개"}, {"title": "Acer Shows Off a Transformer-ish Concept for a Windows Gaming Handheld", "summary": "에이서가 일반 컴퓨터로도 겸용해서 사용할 수 있도록 키보드가 결합된 변신형(Transformer) 윈도우 게이밍 핸드헬드 콘셉트 기기를 선보였다. 휴대용 게임기와 업무용 PC의 경계를 허물며 다목적 활용성을 강조한 형태다. 급성장하는 포터블 게이밍 디바이스 시장에서 독창적인 폼팩터를 제시하려는 시도다. 모바일 게이밍 하드웨어의 진화 방향을 엿볼 수 있다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/gaming/acer-shows-off-a-transformer-ish-concept-for-a-windows-gaming-handheld/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 윈도우 게이밍 핸드헬드"}, {"title": "The Dell 14s could be the MacBook Neo alternative you’ve been waiting for", "summary": "델의 신형 '14s' 노트북이 다채로운 컬러와 감각적인 디자인을 무기로 일각에서 기대하는 '맥북 네오'의 강력한 대안으로 부상할 수 있을지 주목됩니다. 컬러풀한 전자기기 르네상스 시류에 발맞추어 윈도우 진영에서도 디자인 혁신 제품이 속속 등장하고 있습니다. 프리미엄 슬림 노트북 시장에서 삼성 갤럭시 북과 치열한 경쟁이 예상됩니다.", "source": "Android Authority", "date": "2026-09-02 16:00", "url": "https://www.androidauthority.com/dell-14s-3705796/", "category": "launch", "importance": 3, "wl": true, "topic": "델14스 노트북"}, {"title": "신세계프라퍼티, 청담동에 ‘아만 서울’ 세운다…국내 첫 진출", "summary": "종합 부동산 개발사 신세계프라퍼티가 세계 최정상급 럭셔리 호스피탈리티 브랜드 '아만(Aman)'을 서울에 최초로 선보인다. 서울 강남구 청담동 일대에 조성되는 '아만 서울'은 초고가 호텔과 브랜디드 레지던스, 회원제 클럽 등을 갖춘 하이엔드 복합시설로 개발된다. 국내 초고가 부동산 및 호텔 시장에 새로운 획을 그을 대형 프로젝트다.", "source": "매일경제 IT", "date": "2026-09-02 14:08", "url": "https://www.mk.co.kr/news/realestate/12142273", "category": "launch", "importance": 3, "wl": true, "topic": "신세계프라퍼티 청담 아만 서울"}, {"title": "Apple tells Mac App Store developers they can now drop Intel support", "summary": "애플이 맥 앱스토어 개발자들에게 macOS 13 이상을 요구하는 유니버설 앱에서 인텔 기반 맥 지원을 공식 중단할 수 있음을 통보했습니다. 애플 실리콘 전환 완료에 발맞추어 구형 아키텍처에 대한 지원을 단계적으로 축소하고 있습니다. PC 생태계 전반의 플랫폼 고도화와 세대교체가 가속화되고 있습니다. 소프트웨어 개발 환경이 애플 실리콘 중심으로 완전히 재편되고 있습니다.", "source": "9to5Mac", "date": "2026-09-02 09:50", "url": "https://9to5mac.com/2026/09/01/apple-tells-mac-app-store-developers-they-can-now-drop-intel-support/", "category": "policy", "importance": 3, "wl": true, "topic": "맥앱스토어 인텔중단"}, {"title": "정용진의 ‘럭셔리 승부수’…세계 최고급 ‘아만’, 서울 청담에 들어선다", "summary": "정용진 신세계그룹 회장이 주도하는 하이엔드 라이프스타일 전략의 일환으로, 세계 최고급 럭셔리 호스피탈리티 브랜드 '아만(Aman)'이 서울 강남 청담동에 들어선다. 신세계프라퍼티가 시행을 맡은 이번 프로젝트는 국내 하이엔드 주거 및 호텔 시장에 거대한 파장을 예고하고 있다. 정용진 회장의 럭셔리 승부수가 본격화되는 양상이다.", "source": "매일경제 IT", "date": "2026-09-02 08:58", "url": "https://www.mk.co.kr/news/realestate/12141966", "category": "launch", "importance": 3, "wl": true, "topic": "정용진 회장 아만 서울 럭셔리"}, {"title": "“증가속도 가장 빨라”…서울 갭투자 의심 거래 절반이 30대", "summary": "최근 1년간 서울 지역 아파트의 갭투자 의심 거래가 50% 이상 급증한 가운데, 25개 자치구 중 11곳에서 두 배 이상 폭증하며 증가 속도가 가장 빠른 연령층은 30대로 나타났다. 젊은 층을 중심으로 '영끌'과 갭투자가 다시 기승을 부리자 당국이 실거래 모니터링 강화와 대응 방안 마련에 나섰다. 과열되는 부동산 시장의 투기적 수요에 대한 경고등이 켜졌다.", "source": "매일경제 IT", "date": "2026-09-02 08:54", "url": "https://www.mk.co.kr/news/economy/12141959", "category": "policy", "importance": 3, "wl": true, "topic": "서울 30대 갭투자 의심 거래 급증"}, {"title": "macOS Golden Gate Seems to Hint at MacBook Pro With OLED Display", "summary": "최신 macOS 골든 게이트 빌드 파일에서 OLED 디스플레이를 탑재한 차세대 맥북 프로의 등장을 암시하는 단서가 발견되었습니다. 애플이 노트북 라인업 전반에 걸쳐 OLED 패널 도입을 본격화할 채비 를 하고 있습니다. 프리미엄 PC 디스플레이 시장에서 OLED 전환 경쟁이 폭발적으로 일어날 전망입니다. 삼성디스플레이 등 패널 공급사들에게도 중대한 사업적 의미를 갖는 뉴스입니다.", "source": "MacRumors", "date": "2026-09-02 04:34", "url": "https://www.macrumors.com/2026/09/01/macos-golden-gate-hdr-liquid-glass/", "category": "launch", "importance": 3, "wl": true, "topic": "맥북프로 oled"}, {"title": "Here’s how Googlebooks will stop random files from clogging your desktop", "summary": "구글북스가 데스크톱 화면이 무작위 파일로 어지러워지는 것을 방지하기 위해 주제, 이벤트, 작업별로 파일을 자동으로 '컬렉션'에 분류해 주는 기능을 도입합니다. 사용자들의 파일 정리 스트레스를 줄여주고 작업 생산성을 높이기 위한 소프트웨어 업데이트입니다. PC 및 데스크톱 환경의 사용자 경험을 한층 개선합니다. 운영체제 및 유틸리티 서비스의 AI 자동화 트렌드를 보여줍니다.", "source": "Android Authority", "date": "2026-09-03 02:55", "url": "https://www.androidauthority.com/googlebooks-automatic-file-sorting-gemini-3706182/", "category": "launch", "importance": 2, "wl": true, "topic": "구글북스 자동분류"}, {"title": "This Googlebook app just leaked in its entirety, and you can already try it on your phone", "summary": "새로운 '구글북스' 앱이 전면 유출되어 사용자들이 모바일 기기에서 미리 체험해 볼 수 있게 되었습니다. '룩 업(Look up)' 기능을 통해 구글 검색, 맵스, 플라이트 등의 데이터를 활용해 즉각적인 답변을 제공합니다. 서비스 간 통합을 강화한 구글의 차세대 에코시스템 전략을 보여줍니다. 모바일 및 PC 플랫폼 유틸리티의 혁신을 예고합니다.", "source": "Android Authority", "date": "2026-09-03 00:41", "url": "https://www.androidauthority.com/googlebook-look-up-app-play-store-3706244/", "category": "launch", "importance": 2, "wl": true, "topic": "구글북스 앱 유출"}, {"title": "Acer Googlebook is officially coming soon, and here’s a first glimpse (Updated)", "summary": "에이서의 구글북스(Googlebook) 기반 노트북이 공식 출시를 앞두고 첫 번째 실물 모습이 포착되었습니다. 오는 9월 15일 예정된 공식 구글북스 런칭 행사에서 공개될지 기대를 모으고 있습니다. 새로운 OS 생태계를 탑재한 PC 제품군이 시장에 다변화를 가져올 전망입니다. 제조사들의 신규 플랫폼 채택 움직임이 빨라지고 있습니다.", "source": "Android Authority", "date": "2026-09-02 19:24", "url": "https://www.androidauthority.com/acer-googlebook-coming-soon-look-3706074/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 구글북스"}, {"title": "넓은 집보다 비싼 국평…서울지역 ‘가격역전 거래’ 160% 늘었다", "summary": "대출 규제와 토지거래허가제 등의 영향으로 서울 아파트 매매 시장에서 전용면적 84㎡ 국민평형이 같은 단지의 넓은 중대형 평형보다 비싸게 팔리는 '가격 역전' 거래가 1년 새 2.6배 급증했다. 규제가 실수요층을 15억 이하 및 84㎡로 쏠리게 만들면서 주택 가격 왜곡 현상이 뚜렷해지고 있다. 서울 외곽 지역에서도 신고가가 잇따르는 등 시장 변동성이 지속되고 있다.", "source": "매일경제 IT", "date": "2026-09-02 18:46", "url": "https://www.mk.co.kr/news/realestate/12142680", "category": "price", "importance": 2, "wl": true, "topic": "서울 아파트 가격역전 거래 증가"}, {"title": "This concept handheld can turn into a laptop, complete with a keyboard", "summary": "컴퓨터 키보드가 일체형으로 통합되어 노트북으로 변신할 수 있는 에이서의 혁신적인 컨셉 핸드헬드 PC가 공개되었습니다. 별도의 키보드를 들고 다닐 필요 없이 기기 하나로 완벽한 컴퓨팅 환경을 구현합니다. 휴대용 기기의 폼팩터 경계를 허무는 독창적인 시도입니다. 미래형 PC 디자인의 가능성을 보여줍니다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-project-dualplay-mini-handheld-concept-3705278/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 콘셉트 pc"}, {"title": "Acer’s new ePaper monitor could make long work sessions easier on the eyes", "summary": "에이서가 장시간의 업무 세션에서도 눈의 피로를 덜어주는 페이퍼라이크 디스플레이, 터치 기능, 고해상도를 지원하는 포터블 전자종이(ePaper) 모니터 'EP130K'를 공개했습니다. 오피스 환경에서 눈 건강과 생산성을 모두 챙기려는 직장인들을 겨냥한 특화 디스플레이 기기입니다. 모니터 시장의 세분화된 니즈를 반영한 제품입니다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-epaper-monitor-launch-3705490/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 전자종이 모니터"}, {"title": "같은단지 넓은 집보다 비싼 '국평'", "summary": "서울 아파트 매매 시장에서 대출 규제와 전월세 물량 부족 등이 맞물려 국민평형인 전용 84㎡가 동일 단지의 중대형 평형보다 높거나 비슷하게 팔리는 가격 역전 사례가 확산하고 있다. 실수요자들이 선호하는 평형에 매수세가 집중되면서 가격 체계의 왜곡이 심화되는 양상이다. 정부의 부동산 규제가 시장의 수급과 선호도를 바꾸어 놓은 결과다.", "source": "매일경제 IT", "date": "2026-09-02 18:04", "url": "https://www.mk.co.kr/news/realestate/12142654", "category": "price", "importance": 2, "wl": true, "topic": "국민평형 중대형보다 비싼 역전현상"}, {"title": "하반기 전월세 물량 역대 최저 … 가을 이사철 '최악 주거난' 예고", "summary": "서울 아파트 전월세 물량이 역대 최저 수준으로 감소한 가운데 다가오는 가을 이사철을 맞아 최악의 주거난이 예고되고 있다. 특히 하반기 3·4분기에 출회할 전월세 물량이 가장 적어 임대차 시장의 불안감을 키우고 있다. 공급 부족에 따른 임대료 상승 압력이 커지며 실수요자들의 주거 비용 부담이 가중될 전망이다.", "source": "매일경제 IT", "date": "2026-09-02 18:03", "url": "https://www.mk.co.kr/news/realestate/12142648", "category": "policy", "importance": 2, "wl": true, "topic": "하반기 전월세 물량 역대 최저"}, {"title": "대출 더 받는 15억이하·84㎡ 쏠림 … 규제가 부추긴 집값 왜곡", "summary": "서울 마포구 상암월드컵파크 등지에서 전용 84㎡가 더 넓은 104㎡보다 비싸게 팔리는 현상이 목격되는 등 대출과 규제가 부추긴 집값 왜곡 현상이 심화되고 있다. 15억 이하 주택과 국민평형에 대출 편의성이 집중되면서 실수요자들의 쏠림 현상이 가격 역전을 이끌었다. 정책적 규제가 실수요자의 선택지를 왜곡하는 부작용을 낳고 있다.", "source": "매일경제 IT", "date": "2026-09-02 18:03", "url": "https://www.mk.co.kr/news/realestate/12142647", "category": "price", "importance": 2, "wl": true, "topic": "대출 규제 15억이하 84㎡ 쏠림"}, {"title": "서울시립대 앞 전농동 일대… 1800가구 신통기획 재개발", "summary": "서울시립대 앞 저층 주거지인 동대문구 전농동 152-65 일대가 재개발을 거쳐 최고 35층, 1800가구 규모의 대단지 아파트로 탈바꿈한다. 서울시가 신속통합기획(신통기획)을 확정하면서 도심 내 주택 공급에 속도가 붙을 전망이다. 노후 저층 주거지의 주거 환경 개선과 대단지 공급 효과가 기대를 모은다.", "source": "매일경제 IT", "date": "2026-09-02 17:58", "url": "https://www.mk.co.kr/news/realestate/12142607", "category": "launch", "importance": 2, "wl": true, "topic": "전농동 1800가구 신통기획 재개발"}, {"title": "강남 집 살때 '아빠 찬스'보다 '주식머니'… 7개월간 2.25조 이동", "summary": "올해 증시 호황에 힘입어 강남 3구에서 주택을 매매하는 데 동원된 주식 및 채권 매각 대금이 증여 및 상속 자금의 두 배에 육박할 정도로 급증했다. 자산가들의 전통적인 증여·상속 방식 대신 주식 시장에서 거둔 투자 수익이 강남 고가 주택 매입의 주요 자금원으로 떠오른 것이다. 증시 유동성이 부동산 시장으로 흘러 들어가는 자금 조달 패러다임의 변화를 보여준다.", "source": "매일경제 IT", "date": "2026-09-02 17:58", "url": "https://www.mk.co.kr/news/realestate/12142608", "category": "other", "importance": 2, "wl": true, "topic": "강남 주택 매매 주식머니 유입"}, {"title": "주택도시기금 71% … '임대주택' 공급 집중", "summary": "국토교통부가 책정한 내년도 주택도시기금 40조 6692억 원 가운데 융자 및 출자 사업을 합쳐 약 29조 2053억 원이 임대주택 관련 사업에 집중 배정되었다. 전체 예산의 71%에 달하는 막대한 자금이 서민 주거 안정과 공공 임대주택 공급 확대에 투입되는 셈이다. 정부의 내년도 부동산 정책 기조가 주택 공급과 취약계층 주거 지원에 방점이 찍혀 있음을 보여준다.", "source": "매일경제 IT", "date": "2026-09-02 17:58", "url": "https://www.mk.co.kr/news/realestate/12142605", "category": "policy", "importance": 2, "wl": true, "topic": "국토부 내년 임대주택 예산 71%"}, {"title": "수정안 나와도 시장은 ‘예상대로’…“똘똘한 한 채 선호·변동성 지속”", "summary": "정부가 다주택자와 고가주택을 겨냥한 세제 강화의 큰 틀을 유지한 채 최종 세제개편안을 확정함에 따라, 부동산 시장에 미치는 파급 효과는 당초 예상했던 범위를 크게 벗어나지 않을 것이라는 전망이 우세하다. 시장은 이미 예상된 규제 기조를 선반영하여 '똘똘한 한 채' 선호 현상과 변동성을 이어갈 것으로 보인다.", "source": "매일경제 IT", "date": "2026-09-02 16:43", "url": "https://www.mk.co.kr/news/realestate/12142461", "category": "policy", "importance": 2, "wl": true, "topic": "수정 세제개편안 시장 예상대로"}, {"title": "비거주 1주택자·임대사업자 더 손보나…與, 부동산 세제 추가 논의 예고", "summary": "정부가 발표한 부동산 세제개편안이 국회 심의 과정에서 여당과 전문가들의 의견을 반영해 추가로 수정될 수 있다는 전망이 제기되었다. 국회 기획재정위원회 더불어민주당 간사 등을 중심으로 세부 제도의 보완 가능성이 거론되면서 시장의 이목이 집중되고 있다. 다주택자와 임대사업자 관련 세제를 둘러싼 정치권의 공방이 이어질 전망이다.", "source": "매일경제 IT", "date": "2026-09-02 16:06", "url": "https://www.mk.co.kr/news/realestate/12142418", "category": "policy", "importance": 2, "wl": true, "topic": "여당 부동산 세제 추가 논의"}, {"title": "Dell Doubles Down on Cheap Student Laptops With Lower-End Dell 14S Configs", "summary": "델이 보급형 학생용 시장을 겨냥하여 가격대를 낮춘 '델 14S' 구성을 새롭게 선보이며 저가 노트북 공략을 강화했다. 인플레이션 시기 교육용 실속형 PC 수요를 선점하기 위한 전략이다. 최종 판매 가격이 얼마로 책정될 것인가가 시장 성공의 관건으로 꼽힌다. 글로벌 PC 제조사들의 보급형 시장 경쟁이 한층 치열해지고 있다.", "source": "CNET", "date": "2026-09-02 16:00", "url": "https://www.cnet.com/tech/computing/dell-doubles-down-on-cheap-student-laptops-with-lower-end-dell-14s-configs/", "category": "price", "importance": 2, "wl": true, "topic": "델 학생용 저가 노트북 출시"}, {"title": "“이참에 둘째도 낳을까봐요”…서울 신혼부부 38% 미리내집서 ‘입주 후 출산’", "summary": "서울시가 저출생 대책으로 도입한 신혼부부용 장기전세주택 '미리내집' 첫 공급에서 입주 후 출산을 선택한 신혼부부 비율이 38%에 달하는 등 뜨거운 호응을 얻고 있다. 맞벌이 3인가구 기준 월소득 조건 완화와 20년 거주, 2자녀 이상 우선매수권 부여 등의 파격적인 혜택이 주거 안정과 출산 장려를 동시에 견인하고 있다.", "source": "매일경제 IT", "date": "2026-09-02 15:51", "url": "https://www.mk.co.kr/news/realestate/12142399", "category": "launch", "importance": 2, "wl": true, "topic": "서울시 신혼부부 미리내집 출산"}, {"title": "강남 집값은 떨어지는데…경희궁자이 월세 500만원 된 이유 [부동산 손품노트]", "summary": "서울 아파트값이 강북권을 중심으로 가파른 상승세를 기록하며 오름폭을 다시 키우고 있는 가운데, 경희궁자이 등 주요 단지의 월세가 500만 원에 달하는 등 임대차 시장의 가격 고공행진이 이어지고 있다. 매매가와 월세 가격이 동반 상승하며 무주택 서민들의 주거비 부담을 가중시키고 있다. 서울 주택 시장의 전반적인 가격 불안 양상을 보여준다.", "source": "매일경제 IT", "da 로지 시장에 도전하는 다이슨의 행보가 주목된다. 글로벌 가전 기업들의 헬스케어 진출 경쟁이 가속화되고 있다.", "source": "전자신문", "date": "2026-09-02 16:00", "url": "https://www.etnews.com/20260902000315", "category": "launch", "importance": 3, "wl": true, "topic": "다이슨 카메라젯 오랄케어 출시"}, {"title": "Is The Calorie Counter on Your Smartwatch Accurate? Not Really, Study Finds", "summary": "시중의 여러 스마트워치가 측정하는 소모 칼로리 수치의 정확도가 실제와는 큰 차이가 있다는 새로운 연구 결과가 발표되었다. 다양한 웨어러블 기기를 대상으로 테스트를 진행한 결과 전반적으로 정확성이 떨어진다는 지적이다. 디지털 헬스케어 기기의 핵심 기능 중 하나인 운동량 측정의 기술적 한계를 드러낸다. 향후 헬스케어 알고리즘 고도화의 필요성이 강조된다.", "source": "CNET", "date": "2026-09-03 02:09", "url": "https://www.cnet.com/tech/mobile/is-the-calorie-counter-on-your-smartwatch-accurate-not-really-study-finds/", "category": "quality", "importance": 2, "wl": true, "topic": "스마트워치 칼로리 측정 정확도 논란"}, {"title": "Google is sending MrBeast into the wilderness, armed with AI", "summary": "구글이 유명 유튜버 미스터비스트와 다년 간의 파트너십을 체결하고 제미니, 구글 헬스, 핏비트 에어 등을 홍보하기로 했습니다. 지미 '미스터비스트' 도널드슨이 제미니를 활용하는 영상을 시작으로 다양한 콘텐츠가 제작될 예정입니다. 대중적 영향력이 큰 크리에이터를 활용해 AI 및 헬스케어 서비스 마케팅을 강화하려는 포석입니다. 플랫폼 생태계 확장을 위한 공격적인 홍보 전략을 보여줍니다.", "source": "The Verge", "date": "2026-09-03 00:47", "url": "https://www.theverge.com/tech/988355/mrbeast-google-partnership-gemini-fitbit", "category": "launch", "importance": 2, "wl": true, "topic": "구글 미스터비스트"}, {"title": "Oura’s Menopause Impact Scale Expands Out of the App and Into Women’s Health Care", "summary": "스마트링 제조사 오우라가 자사 앱 내에서 제공하던 갱년기 영향 척도(Menopause Impact Scale) 기능을 외부 여성 건강 전문 기업들과의 파트너십을 통해 의료 서비스 영역으로 확장한다. 웨러어블 생체 데이터를 활용해 여성 헬스케어 전문 기관과의 협력을 본격화하는 행보디. 단순 수면 및 활동량 측정을 넘어 의료 및 전문 헬스케어 생태계로 진입하려는 전략이다. 디지털 헬스의 영역이 임상 및 전문 케어로 진화하고 있다.", "source": "CNET", "date": "2026-09-02 21:04", "url": "https://www.cnet.com/health/medical/oura-menopause-impact-scale-womens-health-care/", "category": "policy", "importance": 2, "wl": true, "topic": "오우라 링 갱년기 스케일 확장"}, {"title": "Ultrahuman wants real-world health data, and is asking its users for it", "summary": "디지털 헬스케어 기업 울트라휴먼이 사용자들을 대상으로 실제 생활 속 건강 데이터 공유를 적극적으로 요청하고 나섰다. 방대한 생체 데이터를 확보하여 서비스 고도화와 연구에 활용하려는 목적이다. 개인정보 제공에 대한 우려 속에서도 헬스케어 데이터 수집 경쟁이 치열해지고 있다. 웨어러블 기반 건강 관리 생태계의 데이터 확보 중요성을 보여준다.", "source": "Android Authority", "date": "2026-09-01 22:00", "url": "https://www.androidauthority.com/ultrahuman-pulsomics-research-program-3705215/", "category": "policy", "importance": 2, "wl": true, "topic": "울트라휴먼 헬스케어 데이터"}, {"title": "Continuous glucose monitors are about to get more complicated", "summary": "최신 웨어러블 헬스케어 기기인 연속혈당측정기(CGM) 관련 시장과 제품군이 더욱 복잡해지고 다양화되고 있습니다. 일상 속에서 건강을 관리하려는 소비자들이 늘어나면서 관련 기기들의 기능 경쟁이 치열해지고 있습니다. 헬스케어 테크놀로지의 발전이 개인 맞춤형 건강 관리 경험을 고도화하고 있습니다. 관련 뉴스레터를 통해 최신 기즈모 트렌드가 공유되고 있습니다.", "source": "The Verge", "date": "2026-09-03 00:30", "url": "https://www.theverge.com/column/988242/optimizer-abbott-libre-duo-ketones-diabetic-ketoacidosis", "category": "other", "importance": 1, "wl": true, "topic": "연속혈당측정기 뉴스"}, {"title": "스마트워치 “500㎉ 태웠다” 믿었는데…실제 소모량은 350㎉일 수도 - v.daum.net", "summary": "스마트워치가 표시하는 운동 칼로리 소모량이 실제 소비된 열량보다 과대 측정되는 경향이 있다는 분석이 나왔습니다. 웨어러블 기기의 헬스케어 알고리즘 한계에 대한 소비자들의 인식이 확산되고 있습니다. 정확한 데이터 제공을 위한 소프트웨어 고도화가 요구됩니다.", "source": "v.daum.net", "date": "2026-09-02 15:04", "url": "https://v.daum.net/v/20260902150437177", "category": "quality", "importance": 3, "wl": false, "topic": "스마트워치 칼로리 오차"}, {"title": "Your Smartwatch Is Lying To You About How Many Calories You Burned - Eurasia Review", "summary": "스마트워치가 계산하는 칼로리 소모량 측정의 정확성에 한계가 있음을 지적하는 분석 기사입니다. 웨어러블 헬스케어 기능의 신뢰성 문제를 다루며 업계 전반에 시사점을 줍니다.", "source": "Eurasia Review", "date": "2026-09-02 09:55", "url": "https://www.eurasiareview.com/02092026-your-smartwatch-is-lying-to-you-about-how-many-calories-you-burned/", "category": "quality", "importance": 3, "wl": false, "topic": "기타 헬스케어"}, {"title": "I let my Galaxy Watch control my day—this feature did the heavy lifting - How-To Geek", "summary": "갤럭시 워치 제품군이 사용자의 하루 일정을 관리하고 제어하는 헬스 및 라이프스타일 기능이 실제 일상에서 얼마나 유용한지 다룬 체험 리뷰입니다. 웨어러블의 실용성이 강조되었습니다.", "source": "How-To Geek 6 series gets eighth One UI 9 beta release (!!)", "summary": "삼성전자의 차세대 플래그십 '갤럭시 S26' 시리즈를 위한 여덟 번째 One UI 9 베타 버전이 전격 배포되었다. 정식 출시를 앞두고 소프트웨어 완성도를 극한으로 끌어올리기 위한 집중적인 테스트가 이어지고 있다. 소프트웨어 안정화 작업이 순조롭게 진행되면서 제품 공개 및 출시 일정도 탄력을 받을 전망이다. 모바일 사업부의 최우선 과제인 완성도 높은 사용자 경험 구축을 반증한다.", "source": "Android Authority", "date": "2026-09-01 18:16", "url": "https://www.androidauthority.com/samsung-galaxy-s26-one-ui-9-beta-8-3705321/", "category": "launch", "importance": 5, "wl": true, "topic": "갤럭시 s26 시리즈 one ui 9 베타"}, {"title": "Breaking: Galaxy S25 series joins the One UI 9 beta program party", "summary": "수개월간 갤럭시 S26 전용으로 제한되었던 삼성전자의 One UI 9 베타 프로그램이 드디어 '갤럭시 S25' 시리즈로 확대 적용되기 시작했다. 전작 플래그십 사용자들 역시 최신 One UI 인터페이스와 AI 기능을 미리 경험할 수 있게 되었다. 소프트웨어 지원 범위를 넓혀 기존 고객들의 만족도를 높이고 생태계 결속력을 다지려는 전략이다. 플래그십 모델 간 소프트웨어 업그레이드 연계성이 강화되고 있다.", "source": "Android Authority", "date": "2026-09-01 17:38", "url": "https://www.androidauthority.com/samsung-galaxy-s25-one-ui-9-beta-1-3705298/", "category": "launch", "importance": 5, "wl": true, "topic": "갤럭시 s25 시리즈 one ui 9 베타"}, {"title": "iPhone 18 Pro will have three upgrades that have been rumored for years", "summary": "애플의 신제품 '아이폰 18 프로'가 다음 주 출시를 앞두고 수년 동안 소문으로만 돌던 세 가지 핵심 업그레이드를 탑재할 것으로 예상됩니다. 사전 유출된 정보에 따르면 하드웨어 및 기능 면에서 유의미한 변화가 있을 것으로 보입니다. 차세대 스마트폰 시장에서 애플의 경쟁력을 가늠할 주요 제품입니다. 글로벌 모바일 업계의 이목이 집중되고 있습니다.", "source": "9to5Mac", "date": "2026-09-03 03:21", "url": "https://9to5mac.com/2026/09/02/iphone-18-pro-will-have-three-upgrades-that-have-been-rumored-for-years/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰18프로 출시"}, {"title": "Samsung Galaxy Z Flip 8 gets its first big discount with $150 off", "summary": "삼성전자의 최신 폴더블폰 '갤럭시 Z 플립 8'이 출시 초기부터 150달러 대폭 로그인을 기록하며 첫 번째 대형 할인에 돌입했습니다. 초기 판매 열기를 이어가고 수요를 극대화하기 위한 공격적인 가격 정책입니다. 폴더블폰 대중화 가속화를 위한 제조사 및 유통가의 판매 촉진 전략이 돋보입니다. 경쟁 심화에 대응하기 위한 선제적 조치로 풀이됩니다.", "source": "Android Authority", "date": "2026-09-03 01:34", "url": "https://www.androidauthority.com/samsung-galaxy-z- 형 폴더블 스마트폰 라인업으로 확대 적용하기 시작했다. 최신 소프트웨어 경험을 전작 사용자들에게까지 빠르게 제공하려는 행보로 풀이된다. 갤럭시 생태계 전반의 소프트웨어 지원 신뢰도를 높이는 데 기여할 것으로 보인다. 폴더블폰 시장에서의 소프트웨어 경쟁력을 지속 강화하고 있다.", "source": "Android Authority", "date": "2026-09-02 01:13", "url": "https://www.androidauthority.com/one-ui-9-beta-galaxy-z-fold-7-3705578/", "category": "launch", "importance": 4, "wl": true, "topic": "삼성 one ui 9 베타 확대"}, {"title": "The Galaxy S26 FE is the wrong Samsung phone to buy right now", "summary": "새롭게 선보이는 '갤럭시 S26 FE' 모델에 대해 지금 당장 구매하기에는 매력이 부족하다는 비판적 평가가 제기되었다. 제품 자체의 기본기는 무난하지만 치열한 스마트폰 시장에서 소비자들의 지갑을 열기에는 차별성이 부족하다는 지적이다. 삼성전자의 준프리미엄 전략 라인업이 직면한 시장의 냉정한 평가를 대변한다. 가격 대비 성능과 확실한 킬러 콘텐츠의 필요성이 강조된다.", "source": "Android Authority", "date": "2026-09-01 18:30", "url": "https://www.androidauthority.com/galaxy-s26-fe-wrong-samsung-phone-buy-3704387/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s26 fe 구매 적절성 분석"}, {"title": "Apple’s first folding iPhone won’t kill Android foldables — it will save them", "summary": "애플의 첫 폴더블 아이폰 진입이 안드로이드 폴더블폰 시장을 위협하기보다 오히려 시장 전체의 파이를 키우고 대중화를 이끄는 마중물 역할을 할 것이라는 분석이 제기됐다. 그간 틈새시장에 머물렀던 폴더블 폼팩터가 애플의 가세로 대중적 관심을 받게 될 전망이다. 삼성전자가 주도해온 폴더블 스마트폰 생태계에 새로운 활력이 더해질 것으로 기대된다. 시장 경쟁 구도의 패러다임 전환이 주목된다.", "source": "Android Authority", "date": "2026-09-01 18:00", "url": "https://www.androidauthority.com/apple-foldable-iphone-save-android-phones-3704142/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 폴더블 아이폰 폴더블폰 시장 영향"}, {"title": "New Galaxy A18 leak reveals three colorways and up to 256GB of storage", "summary": "삼성전자의 보급형 스마트폰 '갤럭시 A18'의 유출 정보를 통해 세 가지 색상 웨이웨이와 최대 256GB 스토리지 사양이 공개되었습니다. 화려한 컬러 옵션보다는 실용성에 집중한 보급형 라인업의 전통을 이어갈 것으로 보입니다. 중저가 스마트폰 시장에서 경쟁력을 유지하기 위한 스펙 업그레이드가 적용되었습니다. 글로벌 보급형 시장을 겨냥한 실속형 모델입니다.", "source": "Android Authority", "date": "2026-09-03 01:43", "url": "https://www.androidauthority.com/samsung-galaxy-a18-colors-leak-3706354/", "category": "launch", "importance": 3, "wl": true, "topic": "갤럭시a18 유출"}, {"title": "제미나이가 여권 ra-lock-3705704/", "category": "quality", "importance": 3, "wl": true, "topic": "갤럭시 s25 카메라 기능 추가"}, {"title": "Gemini and Find Hub are teaming up to remember where you put your passport", "summary": "구글 안드로이드 플랫폼이 제미나이와 파인드 허브(Find Hub) 기능을 연동하여 중요 물건의 위치를 기억해주는 서비스를 선보인다. 여권이나 예비 키, 출생증명서 등 사용자가 자주 잊어버리는 물품의 위치를 쉽게 찾을 수 있도록 지원한다. 일상 속 편의성을 대폭 끌어올리는 AI 기반 기능으로 주목받고 있다. 안드로이드 생태계 전반의 AI 활용도를 높이는 계기가 될 전망이다.", "source": "Android Authority", "date": "2026-09-02 03:14", "url": "https://www.androidauthority.com/gemini-find-hub-item-locations-3705589/", "category": "launch", "importance": 3, "wl": true, "topic": "제미나이 여권 기억 기능"}, {"title": "5 new features coming to your phone with the September 2026 Android Drop", "summary": "구글이 2026년 9월 안드로이드 드롭을 통해 스마트폰에 적용될 5가지 신규 기능을 발표했다. 파인드 허브를 통한 물품 기억 기능부터 구글 메시지 내 구글 킵 연동 기능 등이 포함되었다. 사용자들의 일상 생활과 접근성을 대폭 개선하는 다양한 도구들이 추가되는 것이 특징이다. 안드로이드 전반의 소프트웨어 가치를 높이는 정기 업데이트다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/september-2026-android-drop-3705528/", "category": "launch", "importance": 3, "wl": true, "topic": "안드로이드 9월 기능 추가"}, {"title": "Google’s Guided Vision turns Gemini Live into a real-world visual guide", "summary": "구글이 제미나이 라이브에 현실 세계를 시각적으로 안내하는 '가이드 비전' 기능을 추가한다. 사용자가 찾고자 하는 물건이나 장소를 시각적으로 쉽게 찾을 수 있도록 돕는 실시간 안내 기능이다. AI가 단순한 대화를 넘어 현실 세계의 물리적 탐색을 돕는 단계로 진화하고 있음을 보여준다. 모바일 기기에서의 AI 활용성이 한층 더 확장될 전망이다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/gemini-live-guided-vision-2-3705480/", "category": "launch", "importance": 3, "wl": true, "topic": "제미나이 가이드 비전"}, {"title": "The latest Android Drop brings an unexpected crossover between Google Messages and Keep", "summary": "최신 안드로이드 업데이트를 통해 구글 메시지와 구글 킵 간의 뜻밖의 기능 결합이 이루어졌다. 메시지 앱 안에서 킵 기반의 체크리스트를 바로 생성하고 채팅방 참여자 모두가 수정할 수 있는 기능이다. 소통과 생산성 도구의 경계를 허물며 사용자 협업 기능을 강화했다. 모바일 커뮤니케이션 환경의 유연성을 높이는 업데이트다.", "source": "Android Authority", "date": "2026-09-02 03:00", "ur const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
</html>
