id": "wallet", "topic": "삼성월렛머니포인트 300만"}, {"title": "iPhone Duo review: The future is foldable", "summary": "아이폰 듀오 리뷰는 폴더블 폼팩터가 미래의 표준임을 시사하고 있습니다. 애플의 첫 폴더블 스마트폰으로서 시장에 던지는 파급력이 매우 큽니다. 혁신적인 폼팩터를 통한 스마트폰 시장의 새로운 경쟁 구도 형성이 주목됩니다.", "source": "9to5Mac", "date": "2026-10-21 21:00", "url": "https://9to5mac.com/2026/10/21/iphone-duo-review/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 리뷰"}, {"title": "This top-selling Samsung phone is finally getting stable One UI 9 with Android 17", "summary": "삼성전자의 글로벌 주력 스마트폰에 안드로이드 17 기반 안정화된 One UI 9 정식 업데이트가 배포되기 시작했다. 플래그십뿐만 아니라 대량 판매 볼륨 모델까지 신속한 OS 업데이트를 확대 적용하고 있다. 장기 사후 지원을 통해 글로벌 고객 만족도와 사용자 경험 완성도를 크게 끌어올렸다. 경쟁사 대비 신속한 소프트웨어 지원을 무기로 안드로이드 시장 리더십을 확고히 해야 한다.", "source": "Android Authority", "date": "2026-10-21 20:31", "url": "https://www.androidauthority.com/samsung-galaxy-a55-stable-one-ui-9-rollout-3725983/", "category": "launch", "importance": 4, "sid": "phone", "topic": "삼성 원유아이 정식 업데이트"}, {"title": "삼성전자 또 일냈다…中비보 제치고 2년여 만에 인도 스마트폰 ‘1위’", "summary": "삼성전자가 중국 비보를 제치고 약 2년여 만에 인도 스마트폰 시장 월간 1위 자리를 탈환했다. 갤럭시 A 시리즈와 S 시리즈의 동반 선전이 주효했다는 분석이다. 세계 최대 스마트폰 시장 중 하나인 인도에서 경쟁력을 회복했다는 점에서 큰 의미가 있다. 현지 맞춤형 판매 전략이 성과로 이어진 결과다.", "source": "sedaily.com", "date": "2026-10-21 20:22", "url": "https://www.sedaily.com/article/20104562", "category": "launch", "importance": 4, "sid": "phone", "topic": "인도 스마트폰 1위"}, {"title": "\"中 낸드 공세 맞선다\"…삼전·닉스, 현지 공장 경쟁력 강화 총력", "summary": "중국 메모리 기업들의 거센 추격에 맞서 삼성전자와 SK하이닉스가 미국의 대중국 반도체 장비 규제 범위 내에서 협의를 거쳐 현지 공정 개선과 최신 장비 도입을 추진하고 있다. 중국 생산거점의 경쟁력을 유지하기 위한 총력전을 펼치고 있다.", "source": "newsis.com", "date": "2026-10-21 20:18", "url": "https://www.newsis.com/view/NISX20261021_0003835506", "category": "exec", "importance": 4, "sid": "memchina", "topic": "메모리반도체 사건"}, {"title": "Video shows French Apple store being emptied by looters", "summary": "프랑스 내 시위 격화로 보르도와 릴 지역의 애플스토어가 시위대에 의해 습격당해 전시 기기들이 대거 약탈당했다. 매장 파손과 함께 단말들이 도난당했으며 애플은 도난 기기에 대해 원격 잠금 및 무력화 조치를 진행할 계획이다. 현지 치안 불안으로 인한 오프라인 유통 채널의 보안 취약성이 노출되었다. 유럽 주요 거점 내 삼성 스토어의 매장 보안 및 도난 방지 프로세스 점검이 필요하다.", "source": "9to5Mac", "date": "2026-10-21 19:53", "url": "https://9to5mac.com/2026/10/21/video-shows-french-apple-store-being-emptied-by-looters/", "category": "quality", "importance": 4, "sid": "phone", "topic": "프랑스 애플스토어 약탈"}, {"title": "애플, BOE 등에 'LCD 아이맥' 개발 자료요청서 발송...'OLED 속도조절론' 부상", "summary": "애플이 BOE를 비롯한 디스플레이 패널 업체들에 신형 액정표시장치 아이맥 패널 개발을 위한 자료요청서를 발송했습니다. 이에 따라 애플 IT 제품군의 유기발광다이오드 전환 속도가 당초 예상보다 조절될 수 있다는 관측이 나오고 있습니다. 데스크톱 및 노트북 패널 시장에서 LCD와 OLED 공급 전략 변화가 예상됩니다.", "source": "ZDNet Korea", "date": "2026-10-21 19:35", "url": "https://zdnet.co.kr/view/?no=20261021182553", "category": "launch", "importance": 4, "sid": "pc", "topic": "애플 엘시디 아이맥 패널 개발요청서 발송"}, {"title": "삼성은 엑시노스 2700에 최적화된 M2700 모뎀을 탑재하여 갤럭시 S27의 전력 효율을 크게 향상시켰습니다.", "summary": "삼성전자가 엑시노스 2700에 최적화된 M2700 모뎀을 탑재하여 갤럭시 S27의 전력 효율을 크게 향상시킬 예정입니다.", "source": "Vietnam.vn", "date": "2026-10-21 19:19", "url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxQbDJ1QTdMU1VRVVVYR2R0b05ObmRsWm5uUHFXbW1Cb2xfaHZfaVlLSDl2MDdMVGl6VlZrMmVMQTJ2ejVvMk94SlBZTkNhb3Z3bUZ2aXF2bFY0NHNweDV6bVRDVnIzSUNWVlFFZ1FrRkJGZENkVnFZTkNNdGVJVU9WRUpSVWRIdE5SU2xMZGZWS1BWbFp3OTk2QmlZYmNaZDVaSWdHTVlqQ0d1eV9LMm1ZUkJhY3A?oc=5", "category": "launch", "importance": 4, "sid": "phone", "topic": "엑시노스 2700 웨이퍼 생산"}, {"title": "새 스마트폰에 헌 D램…메모리 품귀에 저가폰 생존전", "summary": "메모리 가격 폭등으로 저가폰 생존을 위해 중국 저가 스마트폰 업체들이 폐휴대폰에서 D램을 회수해 재장착하고 있다. 반면 중저가 라인업을 유지하는 삼성전자는 마진율이 높은 프리미엄 폰 판매에 집중하는 전략을 취하고 있다. 양사 간 공급망 대응 전략의 대비를 보여준다.", "source": "newstomato.com", "date": "2026-10-21 18:38", "url": "https://www.newstomato.com/ReadNews.aspx?no=1317526&inflow=G", "category": "price", "importance": 4, "sid": "memchina", "topic": "중국 스마트폰 중고 d램 재활용"}, {"title": "삼성전자, D램·낸드 개발 전담팀 꾸렸다…핵심 인력 보상 강화", "summary": "삼성전자 반도체(DS) 부문이 차세대 D램과 낸드플래시 신제품 개발을 전담하는 '코어팀'을 신설하고 핵심 인력에 대한 보상 강화와 조직 간 협업 체계 구축에 착수했다. 이는 메모리 반도체 경쟁 심화 속에서 신제품 개발 속도와 완성도를 높이기 위한 조치다.", "source": "전자신문", "date": "2026-10-21 18:22", "url": "https://www.etnews.com/20261021000449", "category": "exec", "importance": 4, "sid": "memchina", "topic": "삼성전자 ds부문 메모리 신제품 개발 코어팀 신설"}, {"title": "Micron says rival DRAM design has ‘fundamental problems’: targets next-gen memory with 3D ", "summary": "마이크론이 경쟁사의 DRAM 설계에 근본적인 문제가 있다고 지적하며 3D 구조를 적용한 차세대 메모리 기술을 공개했다. 회사는 1-delta DRAM과 G11 낸드 기술을 2027년 하반기에 본격 양산할 계획이며 프로세서 위에 메모리를 직접 올리는 수직형 HBM도 소개했다.", "source": "msn.com", "date": "2026-10-21 18:18", "url": "https://www.msn.com/en-us/news/other/micron-says-rival-dram-design-has-fundamental-problems-targets-next-gen-memory-with-3d-dram-new-chips-planned-for-2027/ar-AA2fLaAX", "category": "launch", "importance": 4, "sid": "memchina", "topic": "마이크론 차세대 메모리 3d 기술"}, {"title": "Samsung’s first Android XR glasses face a design problem its competitor already solved", "summary": "삼성전자의 첫 번째 안드로이드 XR 글래스가 경쟁사 메타-레이밴이 극복한 일상용 안경 형태의 디자인 난제에 직면했다는 외신 지적이 나왔다. 첨단 광학 하드웨어 탑재도 중요하지만 대중 수용성을 위해서는 얇고 가벼운 안경 형태를 구현하는 것이 핵심 과제다. 무거운 폼팩터와 심미성 부족은 초기 시장 흥행의 큰 걸림돌이 될 수 있다. 인체공학적 경량화 설계와 패션성을 동시에 확보하는 폼팩터 완성이 요구된다.", "source": "Android Authority", "date": "2026-10-21 18:00", "url": "https://www.androidauthority.com/samsung-smart-glasses-face-problem-ray-ban-meta-solved-3725475/", "category": "launch", "importance": 4, "sid": "glasses", "topic": "삼성 xr 글래스 디자인 난제"}, {"title": "[르포] 백악관 스피커부터 애비 로드 녹음실까지…강남서 만난 '사운드 레전드'", "summary": "삼성전자가 하만 산하 브랜드들의 기념일을 맞아 특별 오디오 전시 행사 '사운드 레전드'를 서울 강남에서 개최합니다. 역사적인 오디오 명기들을 전시하며 하만의 음향 헤리티지를 고객들에게 전달할 계획입니다. 프리미엄 오디오 생태계를 아우르는 삼성전자의 오디오 브랜드 역량 강화 행보입니다.", "source": "ZDNet Korea", "date": "2026-10-21 18:00", "url": "https://zdnet.co.kr/view/?no=20261021161805", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성전자 하만 오디오 사운드레전드 행사 개최"}, {"title": "Loop Capital Cuts Apple Rating Over iPhone Sales Outlook", "summary": "루프 캐피털이 글로벌 수요 둔화와 교체 주기 장기화를 이유로 애플에 대한 투자의견을 전격 하향 조정했다. 신제품 출시에도 불구하고 스마트폰 시장 전반의 침체로 인해 아이폰 판매 전망이 불투명하다는 평가다. 프리미엄 플래그십 시장의 수요 회복 ry": "와이즈앱 리테일 분석 결과 지난 9월 국내 주요 페이 앱 중 삼성 월렛의 월간 활성 사용자 수가 1887만 명을 기록하며 1위를 차지했다. 국내 스마트폰 이용자 상당수가 활용하는 핵심 모바일 결제 플랫폼으로서의 지위를 공고히 하고 있다.", "source": "news1.kr", "date": "2026-10-21 10:46", "url": "https://www.news1.kr/it-science/internet-platform/6326640", "category": "launch", "importance": 4, "sid": "wallet", "topic": "삼성월렛사건"}, {"title": "삼성, 갤럭시S27 두뇌 '엑시노스 2700' 웨이퍼 생산 착수", "summary": "삼성전자가 차세대 모바일 애플리케이션 프로세서인 엑시노스 2700 생산에 착수한 것으로 알려졌다. 전작 대비 생산량을 10% 이상 늘리는 등 차세대 플래그십 스마트폰 준비를 본격화하고 있다. 향후 갤럭시S27 시리즈의 성능과 수급에 직접적인 영향을 미칠 것으로 전망된다.", "source": "msn.com", "date": "2026-10-21 10:24", "url": "https://www.msn.com/ko-kr/news/other/삼성-갤럭시s27-두뇌-엑시노스-2700-웨이퍼-생산-착수/ar-AA2fJ0dB", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시s27 사건"}, {"title": "Apple is looking for a cellular modem engineer to help shape its transition to 6G", "summary": "애플이 차세대 6G 무선 통신 전환을 주도할 셀룰러 모뎀 핵심 엔지니어 인력 채용에 공식 착수했다. 독자 5G 모뎀 개발에 이어 포스트 5G 시대를 위한 통신 칩셋 내재화 전략을 한층 강화하는 행보다. 퀄컴 등 외부 칩셋 벤더에 대한 의존을 완전히 끊고 통신 아키텍처 주도권을 쥐겠다는 의도다. 삼성전자의 차세대 6G 이동통신 표준 선점 및 독자 통신 솔루션 경쟁력 확보가 중요하다.", "source": "9to5Mac", "date": "2026-10-21 10:18", "url": "https://9to5mac.com/2026/10/20/apple-is-looking-for-a-cellular-modem-engineer-to-help-shape-its-transition-to-6g/", "category": "launch", "importance": 4, "sid": "phone", "topic": "애플 6g 모뎀 인력 채용"}, {"title": "삼성전자, 日 도쿄대와 손잡았다…갤럭시로 고령자 건강 연구", "summary": "삼성전자가 일본 도쿄대학교와 협력하여 고령자 건강 연구에 착수한다. 갤럭시 워치와 스마트폰을 활용해 고령자의 건강 데이터를 수집 및 분석하고 노화에 따른 신체 기능 저하를 예방하는 디지털 헬스케어 연구를 지원한다.", "source": "newspim.com", "date": "2026-10-21 10:00", "url": "https://www.newspim.com/news/view/20261021001021", "category": "launch", "importance": 4, "sid": "health", "topic": "갤럭시워치사건"}, {"title": "Ray-Ban Meta Smart Glasses Boost EssilorLuxottica Sales", "summary": "", "source": "ChannelNews.com.au", "date": "2026-10-21 09:38", "url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxNNWFXc3NhMnM1ZXVsb1haV2JYQjI2Ry00Y0xiTEY3VHZnNkt6WWZXRF9rOUlzekdQTEhLakZTM01PT ience/착용감-음질-다-잡았다-삼성-귀-안막는-클립형-이어폰-승부/ar-AA2fFWkT", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 출시"}, {"title": "Samsung fighting iPhone Duo by launching six foldable phones next year", "summary": "삼성전자가 애플의 첫 폴더블폰 아이폰 듀오의 흥행에 맞서 내년 최대 6종의 폴더블폰 라인업 출시를 검토 중인 것으로 전해졌습니다. 애플 진입으로 급변하는 폼팩터 경쟁에서 세그먼트 세분화를 통해 시장 지배력을 방어하려는 포석입니다. 시장 확대와 가격대 다변화를 동시에 노리는 적극적인 라인업 전략으로 평가됩니다. 차세대 Z 시리즈의 개발 일정과 수율 및 원가 경쟁력을 면밀히 수립해야 합니다.", "source": "9to5Mac", "date": "2026-10-20 21:00", "url": "https://9to5mac.com/2026/10/20/samsung-fighting-iphone-duo-by-launching-six-foldable-phones-next-year/", "category": "launch", "importance": 5, "sid": "phone", "topic": "samsung 폴더블폰 라인업"}, {"title": "Snapdragon or Exynos? New upgrade for Exynos Galaxy S27 could make this a tough choice", "summary": "차기 엑시노스 탑재 갤럭시 S27이 셀룰러 성능과 전력 효율성 측면에서 스냅드래곤 모델에 뒤처지지 않을 것이라는 전망이 제기되었습니다. 엑시노스 칩셋의 성능 개선이 이루어질 경우 플래그십 선택의 폭이 넓어질 수 있습니다. 삼성의 자체 칩 경쟁력 회복 여부가 주목되는 대목입니다.", "source": "Android Authority", "date": "2026-10-20 20:45", "url": "https://www.androidauthority.com/samsung-galaxy-s27-cellular-upgrade-modem-3725448/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 엑시노스 갤럭시 s27 업그레이드"}, {"title": "Tesla, Dell, and Apple Have Become the 'Weaker Party'… Samsung Electronics' Negotiating Po", "summary": "테슬라, 델, 애플 등 글로벌 빅테크 기업들이 메모리 수급난 속에서 '약자'의 처지로 전락하며 삼성전자의 부품 협상력이 극대화되었다는 분석이 나왔다. 공급자 주도 시장에서 부품 단가 및 계약 조건의 우위를 점할 수 있게 되었다. 삼성전자의 압도적인 시장 지배력을 방증한다.", "source": "머니투데이", "date": "2026-10-20 18:20", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9TbnRCRTJ1cHNkWE92NEtDaTR3Qjd4SHlfNGsyRzhrRnBvOGQ0d19qQWlISGlqbldISlVZUk1lYW9mQlVpNVpjUmtPbVZhRjF0Y3ZGV2ZuYWxEeXBXcWRhdTBrYTc3bmhNN1ZGbWI4c1c4aVhtQzVJaUxRQXhYUQ?oc=5", "category": "policy", "importance": 5, "sid": "memchina", "topic": "반도체 협상력"}, {"title": "Samsung Secures 80% of Its 2027 Memory Chip Orders in Advance", "summary": "삼성전자가 2027년 전체 메모리 칩 주문량의 80%를 사전 선점으로 확보하는 데 성공했다. 압도적인 공급 능력을 바탕으로 물량을 조기에 계약하며 안 에서 제조사들의 고심이 깊어지고 있다. 모바일 산업 전반의 비용 부담을 가중시키는 치명적인 악재로 작용 중이다.", "source": "hankyung.com", "date": "2026-10-20 08:55", "url": "https://www.hankyung.com/article/202610188979i", "category": "price", "importance": 5, "sid": "memchina", "topic": "메모리 가격 폭등"}, {"title": "갤럭시 8200만대에 디지털 달러 심는다…삼성전자, 스테이블코인 송금시장 출사표", "summary": "삼성전자가 미국 시장에서 8,200만 대의 갤럭시 스마트폰에 탑재된 삼성월렛을 통해 달러 기반 스테이블코인 해외 송금 서비스를 시작합니다. 별도의 가상자산 지갑 없이 모바일 지갑에서 직접 송금할 수 있어 스테이블코인 대중화의 전기가 될 전망입니다.", "source": "msn.com", "date": "2026-10-20 02:49", "url": "https://www.msn.com/ko-kr/news/other/갤럭시-8200만대에-디지털-달러-심는다-삼성전자-스테이블코인-송금시장-출사표/ar-AA2fCjs1", "category": "launch", "importance": 5, "sid": "wallet", "topic": "삼성월렛 스테이블코인"}, {"title": "Samsung’s Galaxy Tab S10 FE Plus gets a solid $220 discount", "summary": "삼성전자의 대화면 태블릿 '갤럭시 Tab S10 FE 플러스'가 아마존에서 220달러 대폭 할인된 599.99달러에 판매되고 있다. 13.1인치 대화면과 S펜 지원, 256GB 스토리지를 탑재한 가성비 모델로 주목받고 있다. 경쟁사 신제품 공세에 맞서 판매량을 방어하기 위한 가격 조정으로 분석된다.", "source": "Android Authority", "date": "2026-10-20 01:26", "url": "https://www.androidauthority.com/galaxy-tab-s10-fe-plus-deal-amazon-3725169/", "category": "price", "importance": 5, "sid": "tablet", "topic": "galaxy tab s10 fe plus 할인"}, {"title": "Samsung has good and bad news about One UI 9’s disappearing status bar icons", "summary": "삼성전자가 One UI 9에서 발생하는 상태 표시줄 아이콘 사라짐 현상의 원인을 파악했다고 밝혔다. 다만 문제 해결 과정이 단순하지 않아 즉각적인 패치 적용에 어려움이 있는 것으로 전해졌다. 자사 소프트웨어 품질 이슈로 사용자 경험에 직접적인 타격을 주고 있다.", "source": "Android Authority", "date": "2026-10-20 00:27", "url": "https://www.androidauthority.com/samsung-one-ui-9-quickstar-status-bar-icons-bug-3725088/", "category": "quality", "importance": 5, "sid": "phone", "topic": "one ui 9 상태표시줄 오류"}, {"title": "Samsung secures long-term agreements for bulk of 2027 DRAM, NAND and HBM supply", "summary": "빅테크 기업들이 2027년 삼성전자의 DRAM, NAND, HBM 총 물량의 80%에 대해 장기공급계약을 체결했으며, 나머지 20%는 AI 하이퍼스칼러를 겨냥하고 있는 것으로 나타났다. KB증권 등을 통해 전해진 이번 계약은 AI 수요 폭증에 선제적으로 대응하는 대규모 물량 선점의 성격을 띤다. 글로벌 메모리 시장에서 삼성전자의 압도적인 공급 영향력과 수익성 개 급 나누기 논란이 일고 있다. 원가 폭등 속에서 부품 절감을 통해 가격 인상폭을 억제하려는 조치로 풀이된다. 그러나 기존 탑재 기능 삭제에 따른 플러스 모델 구매층의 불만이 예상된다. 라인업 간 기능 차별화와 원가 절감 사이의 정교한 밸런스가 요구된다.", "source": "뉴스1", "date": "2026-10-19 15:27", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE5Rci16RkFVWG9IOGk0TUI0RVl5cGpCVkcyajV5dGRrVVdXWk9tVHRWTUlWbVdEaml4WGJieHpSWGR0WVJwTUxGWUdKbk1MVUh2S3QzUDBNQjIzUQ?oc=5", "category": "quality", "importance": 4, "sid": "phone", "topic": "갤럭시s27플러스 uwb제외 루머"}, {"title": "폴더블폰에 “싸구려”라던 애플…삼성 패널 쓰고 가격은 100만원 더", "summary": "폴더블폰의 완성도를 폄하하던 애플이 삼성디스플레이 패널을 적용한 아이폰 듀오를 비싸게 책정해 논란이다. 초고가 가격 정책에도 불구하고 충성 고객층의 초기 수요가 몰리며 가격 저항을 무력화하고 있다. 애플 브랜드 파워가 고가 폴더블 시장에서도 통함을 보여주는 대목이다. 당사 플래그십 폴더블의 프리미엄 가치 제고와 가격 전략 재검토가 필요하다.", "source": "에너지경제신문", "date": "2026-10-19 15:04", "url": "https://news.google.com/rss/articles/CBMiY0FVX3lxTE9FdHVld055YmFHcDlVSXdORmo0WTRNaWNiWm56b1ZmNmVWcUFVYzIwZWNoUnI0RjZuU2d2T2FvRUlWMUZNWFRTelRtRlQyS3M0UTRZRk9vOU1KVkNQdm9hSGRUUQ?oc=5", "category": "price", "importance": 4, "sid": "phone", "topic": "아이폰듀오 삼성패널 가격"}, {"title": "갤럭시 S27 울트라에서 최고급 스냅드래곤 칩이 빠지고 엑시노스 칩이 탑재될 가능성이 제기되고 있다.", "summary": "차기 갤럭시 S27 울트라에서 최고급 스냅드래곤 칩을 배제하고 엑시노스 칩이 탑재될 가능성이 제기되고 있다. 퀄컴 칩셋의 가격 인상과 발열 논란에 대응해 자체 AP 비중을 높여 원가 절감을 꾀하려는 의도다. 플래그십 모델의 AP 이원화 또는 자체 칩 전환은 제품 성능 평가와 직결된다. 차기 엑시노스 수율 및 발열 제어 역량 확보가 최우선 선결 과제다.", "source": "geeky-gadgets.com", "date": "2026-10-19 14:56", "url": "https://www.geeky-gadgets.com/samsung-galaxy-s27-ultra-rumors-32/", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시s27울트라 ap이원화 루머"}, {"title": "스마트폰 구입도 부담인데…메모리 대란에 배터리 교체비 인하론", "summary": "메모리 가격 급등으로 올해 글로벌 스마트폰 가격이 약 20% 상승하면서 소비자들이 신제품 구매를 미루고 있다. 그러나 제조사들이 기기 장기 사용을 돕는 저가 배터리 교체 정책을 내놓지 않고 있어 소비자의 부담이 가중된다는 지적이다.", "source": "digitaltoday.co.kr", "date": "2026-10-19 14:50", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=708071", "category": "price", "importance": 4, "sid": "phone", "topic": "메모리 대란 배터리 교체"}, {"title": "Inside the Samsung Galaxy S27 Ultra Chip Dr function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}${srchLink(a)}</div></div>`;
}
function srchLink(a){
  if(!((a.url||"").includes("news.google.com")))return"";
  const q=encodeURIComponent('"'+(a.title||"").slice(0,80)+'"');
  return ` · <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700" title="링크가 차단될 때 제목으로 원문 검색">원문 검색</a>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
