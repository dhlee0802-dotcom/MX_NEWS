/galaxy-s27-screen-protectors-leak-3725552/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 갤럭시 s27 유출"}, {"title": "Samsung Galaxy Z Fold 7 hits all-time low price with $655 off", "summary": "삼성전자의 갤럭시 Z 폴드 7이 주요 유통 채널에서 655달러 할인된 역대 최저가 프로모션으로 판매되기 시작했다. 애플의 아이폰 Duo 출시에 대응하여 고가 폴더블 스마트폰의 진입 장벽을 대폭 낮추고 시장을 선점하려는 전략이다. 연말 쇼핑 시즌을 앞두고 폴더블 구매를 망설이던 대기 수요를 강력히 흡수할 것으로 기대된다. 가격 경쟁력을 앞세워 경쟁사 신제품에 맞서 폴더블 주도권을 사수해야 한다.", "source": "Android Authority", "date": "2026-10-21 23:42", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-7-discount-3726172/", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시 z 폴드 7 할인"}, {"title": "Tech Giant Confirms the Samsung Galaxy S27 Ultra", "summary": "테크 업계를 통해 차기 플래그십 모델인 삼성 갤럭시 S27 울트라의 출시가 공식화 및 확인되었습니다. 혁신적인 하드웨어 업그레이드와 디자인 변경에 대한 기대감이 고조되고 있습니다. 차세대 스마트폰 시장의 주도권을 잡기 위한 개발이 순조롭게 진행 중임을 시사합니다.", "source": "geeky-gadgets.com", "date": "2026-10-21 23:04", "url": "https://www.geeky-gadgets.com/galaxy-s27-ultra-rumors-3/", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시 s27 울트라 출시"}, {"title": "iPhone Duo Reviews Explain Why Device is Both 'Fun' and 'Frustrating'", "summary": "아이폰 Duo에 대한 종합 리뷰에서 대화면의 혁신적인 사용성은 매력적이나 페이스 ID 미탑재, 발열, 초기 앱 최적화 부족 등이 아쉬운 점으로 평가되었다. 애플의 첫 폴더블 기기로서의 높은 완성도와 1세대 제품의 기술적 한계가 공존한다는 결론이다. 시장의 초기 반응이 호평과 불만으로 양분되고 있다. 삼성전자는 6세대에 걸쳐 안정화된 갤럭시 Z 시리즈의 성숙한 완성도를 차별화 포인트로 내세워야 한다.", "source": "MacRumors", "date": "2026-10-21 22:45", "url": "https://www.macrumors.com/review/iphone-duo/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 duo 종합평가"}, {"title": "삼성월렛 머니·포인트, 1년 새 300만명…포인트·해외결제 기능 넓힌다", "summary": "삼성전자의 충전식 간편결제 서비스 ‘삼성월렛 머니·포인트’가 출시 1주년을 맞아 가입자 300만 명을 돌파했다. 삼성전자는 이에 발맞추어 포인트 등급제 도입과 해외 결제 기능 지원 등 신규 기능을 추가하며 서비스 영역을 확장한다.", "source": "straightnews.co.kr", "date": "2026-10-21 22:10", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=313691", "category": "launch", "importance": 4, "sid": "wallet", "topic": "삼성월렛머니포인트 300만"}, {"title": "iPhone Duo review: The future is foldable", "summary": "아이폰 듀오 리뷰는 폴더블 폼팩터가 미래의 표준임을 시사하고 있습니다. 애플의 첫 폴더블 스마트폰으로서 시장에 던지는 파급력이 매우 큽니다. 혁신적인 폼팩터를 통한 스마트폰 시장의 새로운 경쟁 구도 형성이 주목됩니다.", "source": "9to5Mac", "date": "2026-10-21 21:00", "url": "https://9to5mac.com/2026/10/21/iphone-duo-review/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 리뷰"}, {"title": "This top-selling Samsung phone is finally getting stable One UI 9 with Android 17", "summary": "삼성전자의 글로벌 주력 스마트폰에 안드로이드 17 기반 안정화된 One UI 9 정식 업데이트가 배포되기 시작했다. 플래그십뿐만 아니라 대량 판매 볼륨 모델까지 신속한 OS 업데이트를 확대 적용하고 있다. 장기 사후 지원을 통해 글로벌 고객 만족도와 사용자 경험 완성도를 크게 끌어올렸다. 경쟁사 대비 신속한 소프트웨어 지원을 무기로 안드로이드 시장 리더십을 확고히 해야 한다.", "source": "Android Authority", "date": "2026-10-21 20:31", "url": "https://www.androidauthority.com/samsung-galaxy-a55-stable-one-ui-9-rollout-3725983/", "category": "launch", "importance": 4, "sid": "phone", "topic": "삼성 원유아이 정식 업데이트"}, {"title": "삼성전자 또 일냈다…中비보 제치고 2년여 만에 인도 스마트폰 ‘1위’", "summary": "삼성전자가 중국 비보를 제치고 약 2년여 만에 인도 스마트폰 시장 월간 1위 자리를 탈환했다. 갤럭시 A 시리즈와 S 시리즈의 동반 선전이 주효했다는 분석이다. 세계 최대 스마트폰 시장 중 하나인 인도에서 경쟁력을 회복했다는 점에서 큰 의미가 있다. 현지 맞춤형 판매 전략이 성과로 이어진 결과다.", "source": "sedaily.com", "date": "2026-10-21 20:22", "url": "https://www.sedaily.com/article/20104562", "category": "launch", "importance": 4, "sid": "phone", "topic": "인도 스마트폰 1위"}, {"title": "\"中 낸드 공세 맞선다\"…삼전·닉스, 현지 공장 경쟁력 강화 총력", "summary": "중국 메모리 기업들의 거센 추격에 맞서 삼성전자와 SK하이닉스가 미국의 대중국 반도체 장비 규제 범위 내에서 협의를 거쳐 현지 공정 개선과 최신 장비 도입을 추진하고 있다. 중국 생산거점의 경쟁력을 유지하기 위한 총력전을 펼치고 있다.", "source": "newsis.com", "date": "2026-10-21 20:18", "url": "https://www.newsis.com/view/NISX20261021_0003835506", "category": "exec", "importance": 4, "sid": "memchina", "topic": "메모리반도체 사건"}, {"title": "Video shows French Apple store being emptied by looters", "summary": "프랑스 내 시위 격화로 보르도와 릴 지역의 애플스토어가 시위대에 의해 습격당해 전시 기기들이 대거 약탈당했다. 매장 파손과 함께 단말들이 도난당했으며 애플은 도난 기기에 대해 원격 잠금 및 무력화 조치를 진행할 계획이다. 현지 치안 불안으로 인한 오프라인 유통 채널의 보안 성-귀-안막는-클립형-이어폰-승부/ar-AA2fFWkT", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 출시"}, {"title": "Samsung fighting iPhone Duo by launching six foldable phones next year", "summary": "삼성전자가 애플의 첫 폴더블폰 아이폰 듀오의 흥행에 맞서 내년 최대 6종의 폴더블폰 라인업 출시를 검토 중인 것으로 전해졌습니다. 애플 진입으로 급변하는 폼팩터 경쟁에서 세그먼트 세분화를 통해 시장 지배력을 방어하려는 포석입니다. 시장 확대와 가격대 다변화를 동시에 노리는 적극적인 라인업 전략으로 평가됩니다. 차세대 Z 시리즈의 개발 일정과 수율 및 원가 경쟁력을 면밀히 수립해야 합니다.", "source": "9to5Mac", "date": "2026-10-20 21:00", "url": "https://9to5mac.com/2026/10/20/samsung-fighting-iphone-duo-by-launching-six-foldable-phones-next-year/", "category": "launch", "importance": 5, "sid": "phone", "topic": "samsung 폴더블폰 라인업"}, {"title": "Snapdragon or Exynos? New upgrade for Exynos Galaxy S27 could make this a tough choice", "summary": "차기 엑시노스 탑재 갤럭시 S27이 셀룰러 성능과 전력 효율성 측면에서 스냅드래곤 모델에 뒤처지지 않을 것이라는 전망이 제기되었습니다. 엑시노스 칩셋의 성능 개선이 이루어질 경우 플래그십 선택의 폭이 넓어질 수 있습니다. 삼성의 자체 칩 경쟁력 회복 여부가 주목되는 대목입니다.", "source": "Android Authority", "date": "2026-10-20 20:45", "url": "https://www.androidauthority.com/samsung-galaxy-s27-cellular-upgrade-modem-3725448/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 엑시노스 갤럭시 s27 업그레이드"}, {"title": "Tesla, Dell, and Apple Have Become the 'Weaker Party'… Samsung Electronics' Negotiating Po", "summary": "테슬라, 델, 애플 등 글로벌 빅테크 기업들이 메모리 수급난 속에서 '약자'의 처지로 전락하며 삼성전자의 부품 협상력이 극대화되었다는 분석이 나왔다. 공급자 주도 시장에서 부품 단가 및 계약 조건의 우위를 점할 수 있게 되었다. 삼성전자의 압도적인 시장 지배력을 방증한다.", "source": "머니투데이", "date": "2026-10-20 18:20", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9TbnRCRTJ1cHNkWE92NEtDaTR3Qjd4SHlfNGsyRzhrRnBvOGQ0d19qQWlISGlqbldISlVZUk1lYW9mQlVpNVpjUmtPbVZhRjF0Y3ZGV2ZuYWxEeXBXcWRhdTBrYTc3bmhNN1ZGbWI4c1c4aVhtQzVJaUxRQXhYUQ?oc=5", "category": "policy", "importance": 5, "sid": "memchina", "topic": "반도체 협상력"}, {"title": "Samsung Secures 80% of Its 2027 Memory Chip Orders in Advance", "summary": "삼성전자가 2027년 전체 메모리 칩 주문량의 80%를 사전 선점으로 확보하는 데 성공했다. 압도적인 공급 능력을 바탕으로 물량을 조기에 계약하며 안정적 수익 기반을 다졌다. 반도체 주 /www.the-biz.co.kr/news/articleView.html?idxno=729596", "category": "quality", "importance": 5, "sid": "tws", "topic": ""}, {"title": "“귀에 꽂지 말고 걸치세요”…삼성이 만든 새로운 이어폰 보니", "summary": "삼성전자가 귀에 꽂지 않고 걸치는 혁신적인 디자인의 클립형 무선 이어폰 '갤럭시 버즈 온'을 선보였습니다. AI를 활용해 착용감을 개선하고 기존 오픈형 이어폰의 약점이었던 저음 부족과 소리 새는 현상을 대폭 보완한 것이 특징입니다.", "source": "mk.co.kr", "date": "2026-10-20 16:28", "url": "https://www.mk.co.kr/news/business/12180528", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 디자인"}, {"title": "삼성전자 11월 'AI 글래스' 전격 출시, 노태문 구글과 손잡고 메타 아성 도전장", "summary": "삼성전자가 오는 11월 노태문 사장을 필두로 구글과 손잡고 'AI 글래스'를 전격 출시하여 메타의 아성에 도전장을 던진다. 확장현실(XR) 및 AI 웨어러블 시장의 주도권을 잡기 위한 초강수다. 글로벌 빅테크 간의 치열한 폼팩터 전쟁이 예고된다.", "source": "businesspost.co.kr", "date": "2026-10-20 15:12", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=449800", "category": "launch", "importance": 5, "sid": "glasses", "topic": "ai 글래스 출시"}, {"title": "귀 안 막는 삼성 이어폰 나온다…첫 클립형 '갤럭시 버즈 온'", "summary": "삼성전자가 첫 클립형 무선 이어폰 '갤럭시 버즈 온'을 오는 27일 공식 출시합니다. 귀를 막지 않아 주변 소리를 들으면서도 콘텐츠를 감상할 수 있어 러너나 일상 사용자들에게 최적화된 설계를 갖췄습니다.", "source": "yna.co.kr", "date": "2026-10-20 13:31", "url": "https://www.yna.co.kr/view/AKR20261020049500017", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 공개"}, {"title": "갤럭시S27 울트라·프로 디자인 바뀐다…케이스 이미지 유출", "summary": "삼성전자가 내년 초 공개할 차세대 플래그십 스마트폰 갤럭시S27 시리즈 전체 라인업의 케이스 이미지가 유출됐다. 외신과 IT 팁스터 아이스유니버스를 통해 공개된 이미지에 따르면 기본 및 플러스 모델은 전작과 유사한 디자인을 유지할 것으로 보인다. 플래그십 라인업 출고를 앞두고 디자인 변화에 대한 정보가 확산하고 있다.", "source": "ZDNet Korea", "date": "2026-10-20 10:48", "url": "https://zdnet.co.kr/view/?no=20261020084624", "category": "launch", "importance": 5, "sid": "phone", "topic": "갤럭시s27 케이스 이미지"}, {"title": "AI Swallows Up Memory Supply, Smartphone Prices Surge 300% as Global Shipments Hit 'Worst ", "summary": "AI 산업의 급격한 메모리 수요 흡수로 인해 전 세계 메모리 공급난이 심화되면서 스마트폰 가격이 300% 폭등하고 글로벌 출하량이 최악의 타격을 입고 있다. 부품 단가 급등이 완성 스마트폰 제조사들의 원가 구조를 심각하게 압박하고 있다. 고가화 전략과 수익성 악화 사이에서 제조사들의 고심이 깊어지고 있다 // ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){

  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";

    const sec=SEC_NAME[a.sid||a._sid]||"";

  text+="브리핑을 마칩니다.";

}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}

  if(!((a.url||"").includes("news.google.com")))return"";
  const q=encodeURIComponent('"'+(a.title||"").slice(0,80)+'"');
  return ` · <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700" title="링크가 차단될 때 제목으로 원문 검색">원문 검색</a>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
