ro 출시 업그레이드"}, {"title": "Apple's New Mac Mini Already Discounted - See the Pre-Order Deals", "summary": "애플의 신형 맥 미니가 공식 출시 이전부터 사전 예약 할인에 돌입했다. 소형 데스크톱 PC 시장에서 초기 수요를 선점하기 위한 공격적인 가격 정책이다. 가성비를 중시하는 소비자들을 공략하여 판매량을 극대화하려는 유통가의 전략이다. PC 시장의 가격 경쟁이 치열해지고 있다.", "source": "MacRumors", "date": "2026-09-03 00:11", "url": "https://www.macrumors.com/2026/09/02/pre-order-discounts-mac-mini/", "category": "price", "importance": 3, "wl": true, "topic": "apple 신형 mac mini 사전예약"}, {"title": "Acer launches the Swift Air 16 and the incredibly light Swift Blade 14", "summary": "에이서가 인텔 코어 7 성능과 3K OLED 디스플레이를 탑재한 초경량 '스위프트 블레이드 14'와 '스위프트 에어 16' 노프북을 새롭게 출시했다. 고성능과 경량화를 동시에 잡은 프리미엄 노트북 라인업으로 시장 공략을 강화하고 있다. 삼성전자 갤럭시북 시리즈와 치열한 슬림 노트북 경쟁이 예상된다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-swift-blade-14-and-air-16-3705806/", "category": "launch", "importance": 3, "wl": true, "topic": "acer swift air 16 swift blade 14 출시"}, {"title": "The Dell 14s could be the MacBook Neo alternative you’ve been waiting for", "summary": "델이 맥북 네오의 대안이 될 수 있는 컬러풀하고 매력적인 신형 노트북 '델 14s'를 선보였다. 다채로운 색상과 뛰어난 가성비를 무기로 프리미엄 노트북 시장의 틈새를 공략하고 있다. 삼성전자 갤럭시북 및 애플 맥북 에어가 경쟁하는 슬림 노트북 시장에 새로운 선택지를 제시한다.", "source": "Android Authority", "date": "2026-09-02 16:00", "url": "https://www.androidauthority.com/dell-14s-3705796/", "category": "launch", "importance": 3, "wl": true, "topic": "dell 14s 노트북 출시"}, {"title": "macOS Golden Gate Seems to Hint at MacBook Pro With OLED Display", "summary": "macOS 골든 게이트 빌드에서 OLED 디스플레이를 탑재한 맥북 프로의 등장을 암시하는 단서들이 포착되었다. 애플이 차세대 노트북 라인업에 OLED 패널을 전격 도입할 준비를 하고 있음을 시사한다. 프리미엄 노트북 시장에서 디스플레이 기술 경쟁이 한층 더 격화될 전망이다. 삼성디스플레이 등 패널 공급사들과의 협력 및 노트북 시장 판도에 중대한 영향을 미칠 사안이다.", "source": "MacRumors", "date": "2026-09-02 04:34", "url": "https://www.macrumors.com/2026/09/01/macos-golden-gate-hdr-liquid-glass/", "category": "launch", "importance": 3, "wl": true, "topic": "macos oled macbook pro 힌트"}, {"title": "Anthropic upgrades Claude’s  이제 중단할 수 있다고 통보했다. 자사 하드웨어 생태계의 완전한 애플 실리콘 전환을 가속화하려는 조치다. 구형 인텔 맥 기반 소프트웨어 생태계가 점차 축소되고 있음을 보여준다. 개발자와 사용자 모두에게 최신 플랫폼으로의 이동을 압박하고 있다.", "source": "9to5Mac", "date": "2026-09-02 09:50", "url": "https://9to5mac.com/2026/09/01/apple-tells-mac-app-store-developers-they-can-now-drop-intel-support/", "category": "policy", "importance": 2, "wl": true, "topic": "mac app store 인텔 지원 중단"}, {"title": "Mac App Store Apps Can Now Drop Support for Intel Macs", "summary": "맥 앱스토어의 앱들이 인텔 맥에 대한 지원을 공식적으로 중단할 수 있게 되었다. 애플 실리콘 중심으로 소프트웨어 생태계가 완전히 재편되는 과정이다. 구형 인텔 기반 PC 사용자들의 플랫폼 업그레이드가 불가피해졌다. 하드웨어와 소프트웨어의 빠른 세대교체를 보여준다.", "source": "MacRumors", "date": "2026-09-02 08:50", "url": "https://www.macrumors.com/2026/09/01/mac-app-store-intel-mac-support/", "category": "policy", "importance": 2, "wl": true, "topic": "mac app store intel 지원 중단"}, {"title": "Meta launches Muse Voice Transcribe for real-time voice dictation on Mac", "summary": "메타가 실시간 음성 인식 모델인 최초의 오디오 지각 모델 'Muse Voice Transcribe'를 출시했다. 다국어 스트리밍 전사 기능을 맥용 메타 AI, 뮤즈 코드, 개발자들을 위한 메타 모델 API에 제공한다. 데스크톱 환경에서 AI 기반 음성 텍스트 변환 및 오디오 처리 능력이 대폭 향상되었다. 빅테크 간 음성 AI 생태계 확장 경쟁을 보여준다.", "source": "9to5Mac", "date": "2026-09-02 02:00", "url": "https://9to5mac.com/2026/09/01/meta-launches-muse-voice-transcribe-for-real-time-voice-dictation-on-mac/", "category": "launch", "importance": 2, "wl": true, "topic": "meta muse voice transcribe 출시"}, {"title": "Perplexity launches privacy-minded ‘hybrid compute’ AI feature for Mac", "summary": "퍼플렉시티가 M6 맥 미니 런칭 행사에서 애플의 주목을 받은 데 이어 맥을 위한 프라이버시 중심의 '하이브리드 컴퓨팅' AI 기능을 새롭게 출시했다. 클라우드와 로컬 AI 간의 작업을 효율적으로 분할하여 처리할 수 있는 혁신적 솔루션이다. 데스크톱 환경에서 보안성을 높인 AI 활용도를 극대화했다. 맥 사용자들을 타겟으로 한 AI 서비스 경쟁이 치열해지고 있다.", "source": "9to5Mac", "date": "2026-09-02 00:20", "url": "https://9to5mac.com/2026/09/01/perplexity-launches-privacy-minded-hybrid-compute-ai-feature-for-mac/", "category": "launch", "importance": 2, "wl": true, "topic": "perplexity mac 하이브리드 컴퓨팅"}, {"title": "Rare Working Apple-1 Could Fetch $800,000 at  충전 유출"}, {"title": "Galaxy S24 owners can now get a taste of Android 17 with One UI 9 beta", "summary": "구형 플래그십인 갤럭시 S24 소유자들도 미국, 인도, 한국 등 주요 지역에서 안드로이드 17 기반 One UI 9 베타 버전을 통해 최신 소프트웨어를 미리 맛볼 수 있게 되었다. 삼성전자가 구형 프리미엄 모델까지 파격적인 OS 업그레이드 지원을 아끼지 않고 있음을 보여준다. 기존 고객들의 브랜드 충성도를 높이고 생태계 수명을 연장하는 핵심 전략이다.", "source": "Android Authority", "date": "2026-09-02 17:39", "url": "https://www.androidauthority.com/samsung-galaxy-s24-one-ui-9-beta-3705963/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s24 one ui 9 베타"}, {"title": "“통화 중 카드정보 탈취”…그룹아이비, 신종 NFC 악성코드 발견", "summary": "통화 중 스마트폰을 원격 제어하고 비접촉식 실시간 카드 정보를 탈취해 가짜 단말기로 결제하는 신종 NFC 중계형 악성코드 '윈드릴레이'가 발견됐다. 모바일 사용자들의 금융 보안에 직접적인 위협을 가하는 신종 보안 사고로 즉각적인 대응과 보안 체계 강화가 요구된다. 스마트폰 플랫폼 전반의 보안 신뢰성에 직결되는 사안이다.", "source": "전자신문", "date": "2026-09-02 16:28", "url": "https://www.etnews.com/20260902000401", "category": "quality", "importance": 4, "wl": true, "topic": "윈드릴레이 신종 nfc 악성코드 통화 탈취"}, {"title": "New iPhone Ultra details arrive for specs, multitasking, launch timing, more", "summary": "다음 주 애플의 9월 이벤트에서 공개될 예정인 '아이폰 울트라'에 대한 사양, 멀티태스킹, 출시 일정 등 새로운 세부 정보가 마크 거먼과의 인터뷰를 통해 공개되었다. 최상위 라인업 신제품의 등장을 앞두고 구체적인 스펙과 소프트웨어 기능이 윤곽을 드러내고 있다. 삼성전자의 갤럭시 S 울트라 및 폴더블 라인업에 강력한 압박을 가할 프리미엄 스마트폰이다. 시장의 판도를 바꿀 핵심 전략 제품으로 평가된다.", "source": "9to5Mac", "date": "2026-09-02 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 4, "wl": true, "topic": "iphone ultra 사양 유출"}, {"title": "Foldable iPhone Ultra Likely Has MagSafe Charging", "summary": "출시가 예상되는 폴더블 아이폰 울트라 모델에 맥세이프(MagSafe) 무선 충전 기능이 탑재될 가능성이 높다는 전망이 제기됐다. 폴더블 폼팩터의 얇은 두께와 무선 충전 편의성을 동시에 잡기 위한 애플의 기술력이 주목받고 있다. 삼성전자의 폴더블폰 라인업에 강력한 자극제가 될 차세대 혁신 기능이다. 모바일 액세서리 생태계에도 큰 파장을 미칠 전망이다.", "source": "MacRumors", "date": "2026-09-02 04:05", "url": "https://www.macrumors.com/2026/09/01/foldable-iphone-ultra-magsafe/", "category": "launch", "importance": 4, "wl": true, "topic": "apple foldable iphone ultra 맥세이프"}, {"title": "Galaxy S25 gets one of the S26’s coolest camera tricks with One UI 9 Beta 1", "summary": "삼성전자가 갤럭시 S25를 대상으로 One UI 9 베타 1을 배포하며 갤럭시 S26의 최고 카메라 기능 중 하나인 '수평 유지(Horizontal Lock)' 기능을 이식했다. 구형 플래그십 모델 사용자들에게 최신 카메라 기술을 빠르게 하방 전개하는 이례적인 조치다. 소프트웨어 업데이트를 통한 사용자 경험 극대화와 제품 가치 유지 전략을 보여준다. 기존 고객들의 만족도를 크게 높일 핵심 기능 추가다.", "source": "Android Authority", "date": "2026-09-02 03:20", "url": "https://www.androidauthority.com/galaxy-s25-one-ui-9-beta-horizontal-camera-lock-3705704/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s25 one ui 9 beta 카메라"}, {"title": "Samsung is expanding the One UI 9 beta to its older foldables", "summary": "삼성전자가 전세대 폴더블 스마트폰 모델들을 대상으로 원 UI 9 베타 프로그램의 적용 범위를 확대하고 있다. 최신 소프트웨어 경험을 구형 기기까지 빠르게 확산시켜 사용자 유지율을 높이고 생태계 결속을 다지는 전략이다. 프리미엄 폴더블 라인업의 소프트웨어 지원 경쟁에서 중요한 의미를 지닌다.", "source": "Android Authority", "date": "2026-09-02 01:13", "url": "https://www.androidauthority.com/one-ui-9-beta-galaxy-z-fold-7-3705578/", "category": "launch", "importance": 4, "wl": true, "topic": "원 ui 9 베타 구형 폴더블폰 확대"}, {"title": "The Galaxy S26 FE is the wrong Samsung phone to buy right now", "summary": "갤럭시 S26 FE 모델이 현재 스마트폰 시장 상황에서 매력적인 구매 선택지가 아니라는 지적이 제기되었다. 제품 성능 자체는 무난하지만 시장의 기대치나 가격 경쟁력 측면에서 아쉬움이 남는다는 평가다. 준프리미엄 라인업의 포지셔닝 전략 재검토 필요성을 시사한다.", "source": "Android Authority", "date": "2026-09-01 18:30", "url": "https://www.androidauthority.com/galaxy-s26-fe-wrong-samsung-phone-buy-3704387/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s26 fe 제품 포지셔닝 비판"}, {"title": "Breaking: Galaxy S26 series gets eighth One UI 9 beta release (!!)", "summary": "갤럭시 S26 시리즈를 대상으로 원 UI 9의 여덟 번째 베타 버전이 파격적으로 배포되었다. 소프트웨어 완성도를 극대화하기 위해 다수의 베타 업데이트를 연달아 진행하며 안정성 확보에 총력을 기울이고 있다. 차기 플래그십 운영체제 완성도 제고를 위한 삼성전자의 의지를 보여준다.", "source": "Android Authority", "date": "2026-09-01 18:16", "url": "https://www.androidauthority.com/samsung-galaxy-s26-one-ui-9-beta-8-3705321/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s26 시리즈 원 ui 9 여덟 번째 베타"}, {"title": "Apple’s first folding iPhone won’t kill Android foldables — it will save them", "summary": "애플의 첫 폴더블 아이폰 출시가 오히려 안드로이드 폴더블폰 시장을 죽이지 않고 대중화의 기폭제가 될 것이라는 전망이 나왔다. 애플의 시장 진입이 폴더블 폼팩터 전반에 대한 대중적 관심을 환기하고 생태계를 키우는 촉매제가 될 수 있다. 프리미엄 폴더블 시장의 경쟁 구도 변화를 예고하는 분석이다.", "source": "Android Authority", "date": "2026-09-01 18:00", "url": "https://www.androidauthority.com/apple-foldable-iphone-save-android-phones-3704142/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 첫 폴더블 아이폰 폴더블폰 시장 영향"}, {"title": "iOS 27 Introduces New 'iPhone Handoff' Feature", "summary": "iOS 27에 새롭게 도입된 '아이폰 핸드오프(iPhone Handoff)' 기능은 애플 기기 간의 연동성을 한층 더 극대화한다. 사용자들은 기기 전환 시 끊김 없는 매끄러운 작업 경험을 누릴 수 있게 되었다. 애플 생태계의 결속력을 강화하는 핵심 소프트웨어 기능이다. 경쟁 진영인 안드로이드 생태계의 연동성 향상에 자극을 주는 요소다.", "source": "MacRumors", "date": "2026-09-03 04:35", "url": "https://www.macrumors.com/2026/09/02/ios-27-iphone-handoff-feature/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 아이폰 핸드오프 기능"}, {"title": "Students and opposition activists targeted with spyware in Serbia", "summary": "세르비아의 학생과 야권 활동가들이 스파이웨어의 표적이 된 것으로 확인됐다. 피해를 입은 12명은 애플로부터 아이폰이 해킹당했다는 통지를 받았다. 이 사건은 특정 인물들을 대상으로 한 디지털 감시의 심각성을 보여준다. 모바일 기기의 보안 취약점과 프라이버시 보호에 대한 경각심을 높이는 계기가 되고 있다.", "source": "Financial Times Tech", "date": "2026-09-03 04:11", "url": "https://www.ft.com/content/c9c3a0ef-98d5-4aeb-9d20-e6250d6fcf99?syn-25a6b1a6=1", "category": "quality", "importance": 3, "wl": true, "topic": "iphone 스파이웨어 감염 사건"}, {"title": "iOS 27 fixes Apple Mail in three ways longtime users will love", "summary": "iOS 27은 시리 AI와 생산성 앱들의 강력한 업그레이드를 담고 있으나 오랜 사용자들을 위한 애플 메일 등의 고질적 버그 수정도 포함하고 있다. 운영체제 대규모 업데이트에서 사용자 경험을 저해하던 오류들을 대거 바로잡았다. 모바일 기기의 전반적인 안정성과 성능 완성도를 높이는 데 주력했다. 충성 고객층의 만족도를 유지하기 위한 필수적인 조치다.", "source": "9to5Mac", "date": "2026-09-03 04:00", "url": "https://9to5mac.com/2026/09/02/ios-27-fixes-apple-mail-in-three-ways-longtime-users-will-love/", "category": "quality", "importance": 3, "wl": true, "topic": "ios 27 메일 및 버그 수정"}, {"title": "New Galaxy A18 leak reveals three colorways and up to 256GB of storage", "summary": "삼성전자의 보급형 스마트폰 '갤럭시 A18'의 신규 유출을 통해 세 가지 색상 옵션과 최대 256GB의 저장용량이 공개됐다. 파격적인 색상 변화는 없지만 실속 있는 스펙 업그레이드가 예상된다. 글로벌 보급형 시장에서 삼성의 탄탄한 라인업 유지를 보여주는 모델이다. 중저가 스마트폰 시장의 경쟁력을 가늠할 수 있다.", "source": "Android Authority", "date": "2026-09-03 01:43", "url": "https://www.androidauthority.com/samsung-galaxy-a18-colors-leak-3706354/", "category": "launch", "importance": 3, "wl": true, "topic": "galaxy a18 색상 저장소 유출"}, {"title": "제미나이가 여권 둔 곳 기억…구글, 안드로이드 새 기능 5종 공개", "summary": "구글이 9월 안드로이드 드롭을 통해 제미나이를 활용해 물건 위치를 기억하는 기능과 이동 중 스마트폰 멀미 저감 기능, 시각장애인용 실시간 음성 안내 등 접근성을 개선한 신기능 5종을 공식 공개했다. 모바일 OS 전반의 사용자 경험과 AI 편의 기능이 대폭 강화된다.", "source": "ZDNet Korea", "date": "2026-09-02 22:08", "url": "https://zdnet.co.kr/view/?no=20260902220322", "category": "launch", "importance": 3, "wl": true, "topic": "구글 안드로이드 9월 드롭 신기능 5종 공개"}, {"title": "The next Snapdragon flagship chip is getting Qualcomm’s take on DLSS", "summary": "퀄컴의 차세대 플래그십 모바일 칩셋이 엔비디아의 DLSS와 유사한 자체 그래픽 업스케일링 기술을 탑재할 것으로 보인다. 퀄컴은 차세대 폰의 그래픽 성능 향상을 위해 AI 하드웨어를 적극적으로 활용하고 있다. 모바일 게이밍 환경을 극적으로 끌어올릴 핵심 기술이다. 모바일 AP 시장에서 퀄컴의 기술 주도권 강화 전략을 보여준다.", "source": "Android Authority", "date": "2026-09-02 22:00", "url": "https://www.androidauthority.com/qualcomm-snapdragon-8-elite-gen-6-gpu-3705379/", "category": "launch", "importance": 3, "wl": true, "topic": "qualcomm 차세대 스냅드래곤 dlss"}, {"title": "Randomly locked out of your Samsung account? You’re not alone", "summary": "삼성전자 계정 사용자들 사이에서 이유 없이 계정이 무작위로 잠기는 현상이 동시다발적으로 발생하여 이용자들이 불편을 겪고 있다. 입증되지 않은 한 가설에 따르면 이는 별칭(alias) 이메일 주소 사용과 관련이 있을 수 있다는 분석이 제기된다. 계정 보안 및 인증 시스템의 예기치 못한 오류로 보인다. 사용자 신뢰 회복을 위한 신속한 원인 규명이 요구된다.", "source": "Android Authority", "date": "2026-09-02 20:09", "url": "https://www.androidauthority.com/samsung-galaxy-accounts-random-deactivation-3706032/", "category": "quality", "importance": 3, "wl": true, "topic": "samsu function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
</html>
