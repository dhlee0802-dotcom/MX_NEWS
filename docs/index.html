": "Study finds that smartwatches are ‘lying to you’ about how many calories you burned - KTLA", "summary": "KTLA는 스마트워치들이 칼로리 소모량 측정 과정에서 부정확한 수치를 제공한다는 연구 결과를 보도했다. 웨어러블 헬스케어 기능의 측정 정확도에 대한 소비자 경고성 내용이다. 당사 갤럭시 워치의 헬스 알고리즘 신뢰성을 점검하고 차별화할 필요성을 제기한다. 디지털 헬스 제품의 품질 관리에서 주시해야 할 이슈다.", "source": "KTLA", "date": "2026-09-06 03:12", "url": "https://ktla.com/news/consumer-business/study-finds-that-smartwatches-are-lying-to-you-about-how-many-calories-you-burned/", "category": "quality", "importance": 3, "wl": false, "topic": "스마트워치 칼로리 측정", "alert": false}, {"title": "Oura is going public, but these smart ring companies are coming for its crown - TechCrunch", "summary": "", "source": "TechCrunch", "date": "2026-09-06 00:00", "url": "https://techcrunch.com/2026/09/05/oura-is-going-public-but-these-smart-ring-companies-are-coming-for-its-crown/", "category": "other", "importance": 2, "wl": false, "topic": "", "alert": false}], "phone": [{"title": "HUAWEI’s answer to the iPhone Ultra? A slimmer tri-fold with a privacy screen", "summary": "화웨이가 신형 폴더블폰 메이트 XT2를 공개했다. 더 얇아진 트라이폴드 디자인과 프라이버시 스크린, 새로운 망원 카메라를 탑재했으며 하모니OS 7을 구동한다. 애플의 폴더블폰에 대응하는 화웨이의 전략적 제품으로 평가된다. 삼성전자의 폴더블 스마트폰 시장 점유율 확보에 강력한 위협 요소로 작용할 전망이다.", "source": "Android Authority", "date": "2026-09-07 20:38", "url": "https://www.androidauthority.com/huawei-mate-xt-2-tri-folding-phone-3708262/", "category": "launch", "importance": 4, "wl": true, "topic": "메이트 xt2 트라이폴드", "alert": false}, {"title": "애플 첫 폴더블 한국 출시 10월 이후로…아이폰18과 시차 둔다", "summary": "애플의 첫 폴더블 아이폰 국내 출시가 10월 이후로 연기될 전망이다. 초도 물량 부족으로 북미 시장에 우선 배정될 예정이며, 이로 인해 삼성전자와의 국내 시장 맞대결 시점도 늦춰지게 되었다. 글로벌 물량 수급 문제로 인해 국내 출시 일정이 조절되면서 국내 폴더블 시장의 경쟁 구도에 변화가 생겼다. 삼성 MX사업부는 이를 활용해 국내 시장 방어 전략을 재정비할 시간적 여유를 갖게 되었다.", "source": "전자신문", "date": "2026-09-07 14:51", "url": "https://www.etnews.com/20260907000344", "category": "launch", "importance": 4, "wl": true, "topic": "애플 폴더블 국내 연기", "alert": false}, {"title": "John Ternus’s first test at Apple: selling a $2,000 foldable iPhone", "summary": "애플의 하드웨어 엔지니어링 수석 부사장이 2,000달러 수준의 폴더블 아이폰 판매라는 첫 시험대에 올랐다. 상승하는 부품 비용을 상쇄하기 위해 전반적인 기기 가격 인상이 필요한 상황이다. 고가 폴더블 시장에서의 가격 책정 전략이 향후 애플의 수익성에 중요한 변수가 될 전망이다. 삼성전자의 폴더블폰 라인업과 고가 시장에서 직접적인 경쟁이 예상된다.", "source": "Financial Times Tech", "date": "2026-09-07 13:00", "url": "https://www.ft.com/content/8bbc2b5f-d1fc-4d8d-8085-4c27c362653a?syn-25a6b1a6=1", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 폴더블 가격", "alert": false}, {"title": "Motorola and Google foldables are quietly beating Samsung where it counts", "summary": "모토로라와 구글 등 경쟁사들이 폴더블폰 시장에서 사용자 경험 위주의 특화 기능을 앞세워 삼성전자의 점유율을 위협하고 있으며, 삼성의 하드웨어 혁신 정체에 대한 비판이 제기되고 있다. 후발 주자들이 공격적인 마케팅과 소프트웨어 개선으로 폼팩터 시장을 공략하고 있다. 삼성 MX사업부는 하드웨어 우위를 넘어선 차별화된 사용자 가치 창출이 시급하다. 폴더블 시장의 경쟁 격화에 대응한 혁신 전략이 요구된다.", "source": "Android Authority", "date": "2026-09-06 19:30", "url": "https://www.androidauthority.com/motorola-google-foldables-beat-samsung-3704932/", "category": "launch", "importance": 4, "wl": true, "topic": "경쟁사 폴더블 위협", "alert": false}, {"title": "I want better Samsung phones, but these new sales numbers show why we won’t get them", "summary": "최근 삼성전자의 스마트폰 판매 실적과 관련해 하드웨어 혁신 동력이 부족하다는 분석이 제기되었다. 단순한 시장 점유율 유지를 넘어선 차별화된 기술 혁신이 필요하다는 지적이 나오고 있다. 글로벌 스마트폰 시장에서 경쟁력을 유지하기 위한 근본적인 체질 개선이 요구되는 시점이다. 삼성 MX사업부의 향후 제품 기획 방향에 중요한 시사점을 던진다.", "source": "Android Authority", "date": "2026-09-06 18:30", "url": "https://www.androidauthority.com/samsung-record-sales-keep-us-from-better-phones-3704357/", "category": "launch", "importance": 4, "wl": true, "topic": "삼성 스마트폰 판매 정체", "alert": false}, {"title": "I Can’t Put the Galaxy Z Fold 8 Down. Can Apple’s Foldable Change That?", "summary": "삼성전자의 갤럭시 Z 폴드8이 사용자들에게 호평받는 가운데, 애플의 폴더블 아이폰 출시가 시장 판도를 바꿀 수 있을지 주목된다. 삼성의 폴더블 시장 선점 효과가 지속될지 여부가 관건이다. 혁신적인 폼팩터를 앞세운 삼성과 신규 진입하는 애플 간의 정면 승부가 예상된다. 글로벌 폴더블 스마트폰 시장의 주도권 향방에 업계의 이목이 쏠려 있다.", "source": "CNET", "date": "2026-09-05 22:00", "url": "https://www.cnet.com/tech/mobile/i-cant-put-the-galaxy-z-fold-8-down-can-apples-foldable-change-that/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 z 폴드8 평가", "alert": false}, {"title": "Forget AI zoom: The first phone with three 200MP cameras is officially coming soon", "summary": "세 개의 200만 화소 카메라를 탑재한 최초의 스마트폰이 곧 출시될 예정이라는 소식이 전해졌다. 고화소 센서를 다중 탑재하여 카메라 성능의 극대화를 노리는 제품이다. 모바일 카메라 기술 경쟁이 한층 더 치열해질 것으로 예상된다. 삼성전자의 이미지 센서 및 플래그십 카메라 전략에 시사점을 준다.", "source": "Android Authority", "date": "2026-09-07 18:25", "url": "https://www.androidauthority.com/first-triple-200mp-camera-phone-confirmed-3708200/", "category": "launch", "importance": 3, "wl": true, "topic": "2억 화소 트리플 카메라", "alert": false}, {"title": "Samsung is shutting down two apps it used to brag about", "summary": "삼성전자가 과거 홍보했던 AR 두들과 퀵 메저 앱 서비스를 종료한다. 소프트웨어 포트폴리오를 재정비하고 핵심 기능 위주로 자원을 집중하기 위한 전략적 결정으로 풀이된다. 비효율적인 자원 배분을 줄이고 사용자 이용 빈도가 높은 핵심 서비스에 집중하려는 조치이다. 삼성 MX사업부의 소프트웨어 운영 효율화 기조를 보여준다.", "source": "Android Authority", "date": "2026-09-07 18:14", "url": "https://www.androidauthority.com/samsung-ar-doodle-quick-measure-discontinue-3708203/", "category": "exec", "importance": 3, "wl": true, "topic": "삼성 ar두들 종료", "alert": false}, {"title": "This AI-generated iPhone 18 Pro mock ad makes me actually love dark cherry color", "summary": "애플이 9월 9일 예정된 이벤트에서 첫 폴더블 아이폰인 울트라와 신형 아이폰 18 프로를 공개할 예정이다. 인공지능이 생성한 광고 목업 영상이 공개되면서 다크 체리 색상 등에 대한 기대감이 높아지고 있다. 신제품 발표를 앞두고 소비자들의 관심이 집중되고 있다. 삼성전자의 플래그십 스마트폰 판매 전략에 영향을 줄 수 있는 주요 이벤트이다.", "source": "9to5Mac", "date": "2026-09-07 14:01", "url": "https://9to5mac.com/2026/09/06/this-ai-generated-iphone-18-pro-mock-ad-makes-me-actually-love-dark-cherry-color/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 18 프로", "alert": false}, {"title": "The Fairphone 6 Plus is the midrange phone we desperately needed", "summary": "페어폰 6 플러스가 새로운 중급형 스마트폰으로 출시되며 시장의 주목을 받고 있다. 지속 가능성과 수리 용이성을 강조한 제품으로 차별화된 가치를 제공한다. 중급형 스마트폰 시장에서 친환경 콘셉트로 입지를 다지고 있다. 소비자들의 가치 소비 성향을 반영한 제품으로 평가된다.", "source": "The Verge", "date": "2026-09-06 22:00", "url": "https://www.theverge.com/tech/990436/fairphone-6-plus-review", "category": "launch", "importance": 3, "wl": true, "topic": "페어폰 6 플러스", "alert": false}, {"title": "iPhone 18 Pro: Everything M6 Tells Us About the A20 Chip", "summary": "향후 출시될 아이폰 18 프로 모델에 적용될 M6 기반의 A20 칩셋에 대한 분석과 전망이 제기되었다. 차세대 프로세서의 성능 향상 폭과 전력 효율성에 관심이 집중되고 있다. 애플의 독자 실콘 전략이 모바일 기기의 성능 경쟁을 주도하고 있다. 삼성전자의 차세대 애플리케이션 프로세서 개발에 시사점을 제공한다.", "source": "MacRumors", "date": "2026-09-06 01:00", "url": "https://www.macrumors.com/2026/09/05/what-m6-tells-us-about-a20/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰18 프로 칩셋", "alert": false}, {"title": "Survey says Pixel phones are not nearly as buggy as you might believe", "summary": "구글 픽셀 스마트폰에 대한 사용자 설문 조사 결과 알려진 것만큼 버그가 많지 않다는 평가가 나왔다. 기기의 안정성에 대한 긍정적인 인식이 확산되면서 브랜드 신뢰도 회복에 도움이 될 것으로 보인다. 소프트웨어 품질 관리가 성공적으로 이루어지고 있음을 시사한다. 경쟁사 제품의 완성도 변화를 주시할 필요가 있다.", "source": "Android Authority", "date": "2026-09-07 18:11", "url": "https://www.androidauthority.com/are-pixel-phones-buggy-poll-results-3708214/", "category": "quality", "importance": 2, "wl": true, "topic": "구글 픽셀 버그", "alert": false}, {"title": "5 smartphones that show how far behind the Pixel 11’s Tensor G6 really is", "summary": "구글의 커스텀 실리콘 전략과 관련해 텐서 G6 프로세서의 성능 경쟁력에 대한 의문과 비판이 제기되었다. 경쟁사들의 최신 칩셋에 비해 성능 면에서 다소 뒤처진다는 지적이 나오고 있다. 자체 칩 설계 역량을 강화하는 과정에서 겪는 기술적 과제로 평가된다. 삼성전자의 엑시노스 및 애플리케이션 프로세서 경쟁력 확보 전략에 참고할 만한 사안이다.", "source": "Android Authority", "date": "2026-09-07 18:00", "url": "https://www.androidauthority.com/pixel-11-tensor-g6-far-behind-benchmark-comparisons-3705519/", "category": "quality", "importance": 2, "wl": true, "topic": "텐서 g6 성능", "alert": false}, {"title": "Netflix includes 80+ ad-free iPhone and iPad games, here’s every app", "summary": "넷플릭스가 광고 없는 80개 이상의 아이폰 및 아이패드용 게임 서비스를 제공하고 있다. 구독형 서비스의 가치를 높이기 위해 모바일 게임 포트폴리오를 지속적으로 확장하고 있다. 애플 기기 사용자들에게 추가적인 엔터테인먼트 경험을 제공한다. 모바일 게임 시장에서의 플랫폼 경쟁이 심화되고 있다.", "source": "9to5Mac", "date": "2026-09-07 01:41", " const TABS=[

];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;

    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
