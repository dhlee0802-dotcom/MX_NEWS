-liquid-glass/", "category": "launch", "importance": 3, "wl": true, "topic": "맥os oled 맥북프로"}, {"title": "Here’s how Googlebooks will stop random files from clogging your desktop", "summary": "구글북스가 주제, 이벤트, 작업에 따라 사용자의 파일을 자동으로 분류하여 '컬렉션'으로 정리해 주는 새로운 기능을 선보였습니다. 데스크톱 환경에서 파일 관리의 번거로움을 줄여주어 사용자 편의성을 크게 향상시킵니다. 인공지능을 활용한 운영체제 수준의 스마트 조직화 기능이 대세로 자리 잡고 있습니다. PC 사용자들의 생산성 향상에 기여할 것입니다.", "source": "Android Authority", "date": "2026-09-03 02:55", "url": "https://www.androidauthority.com/googlebooks-automatic-file-sorting-gemini-3706182/", "category": "launch", "importance": 2, "wl": true, "topic": "구글북스 파일 정리"}, {"title": "This Googlebook app just leaked in its entirety, and you can already try it on your phone", "summary": "새로운 구글북스 앱의 전 기능이 유출되어 사용자들이 이미 모바일 기기에서 직접 체험해 볼 수 있게 되었습니다. 구글 검색, 지도, 항공편 서비스와 연동되어 질문에 답하는 통합 기능을 제공합니다. 차세대 크롬북 및 운영체제 생태계의 핵심 인터페이스로 자리 잡을 전망입니다. 에코시스템의 확장성이 한층 강화되었습니다.", "source": "Android Authority", "date": "2026-09-03 00:41", "url": "https://www.androidauthority.com/googlebook-look-up-app-play-store-3706244/", "category": "launch", "importance": 2, "wl": true, "topic": "구글북스 앱 유출"}, {"title": "Mac Studio Buyer's Guide: M5 Max vs. M5 Ultra", "summary": "맥 스튜디오 구매 가이드를 통해 M5 맥스 모델과 M5 울트라 모델의 성능 차이와 적합한 사용자층을 비교 분석했습니다. 고성능 크리에이터와 개발자들을 위한 최상위 워크스테이션 선택 기준을 제시합니다. 애플 실리콘의 강력한 성능을 극대화하려는 프로슈머들에게 유용한 정보입니다. 전문가용 PC 시장의 기준을 보여줍니다.", "source": "MacRumors", "date": "2026-09-02 21:07", "url": "https://www.macrumors.com/guide/m5-max-vs-m5-ultra/", "category": "launch", "importance": 2, "wl": true, "topic": "맥 스튜디오 가이드"}, {"title": "궁극의 선명함: AGON by AOC, 세계 최초 5K NVIDIA G-SYNC® Pulsar 게이밍 모니터 공개", "summary": "에이온 바이 AOC가 세계 최초로 5K 초고해상도와 엔비디아 지싱크 펄사 기술을 결합한 게이밍 모니터를 공개했다. 탁월한 모션 선명도와 가변 주사율을 제공하여 게이밍 경험을 극대화하는 제품이다. 글로벌 1위 게이밍 모니터 브랜드의 기술력을 과시하는 신제품이다.", "source": "ZDNet Korea", "date": "2026-09-02 19:10", "url": "https://zdnet.co.kr/view/?no=20260902191003", "category": "launch", "importance": 2, "wl": true, "topic": "agon 5k g-sync 모니터"}, {"title": "Acer’s new ePaper monitor could make long work sessions easier on the eyes", "summary": "에이서가 종이와 같은 질감의 디스플레이, 터치 기능, 고해상도를 지원하는 포터블 형태의 'EP130K' ePaper 모니터를 출시했습니다. 장시간 업무를 수행하는 직장인들의 눈 피로를 획기적으로 줄여주는 시력 보호용 특화 기기입니다. 문서 작업이 많은 전문가들을 위한 차별화된 디스플레이 솔루션으로 주목받고 있습니다. 모니터 시장의 틈새를 공략하는 혁신 제품입니다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-epaper-monitor-launch-3705490/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 epaper 모니터"}, {"title": "Acer Shows Off a Transformer-ish Concept for a Windows Gaming Handheld", "summary": "에이서가 키보드를 결합하여 컴퓨터 역할까지 겸용할 수 있는 트랜스포머 형태의 윈도우 게이밍 핸드헬드 콘셉트 기기를 공개했다. 휴대용 게임기와 일반 노트북의 경계를 허물며 다목적 활용성을 강조한 제품이다. PC 시장에서 새로운 폼팩터의 가능성을 제시하고 있다. 게이밍 기기 제조사들의 차별화 경쟁이 가열되고 있다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/gaming/acer-shows-off-a-transformer-ish-concept-for-a-windows-gaming-handheld/", "category": "launch", "importance": 2, "wl": true, "topic": "acer 게이밍 핸드헬드 콘셉트"}, {"title": "Acer Recommits to Repairability With New Vero 16 Laptop", "summary": "에이서가 IFA 2026에서 수리 용이성을 강화한 새로운 베로 16 노트북을 선보였다. 이와 함께 브랜드 역사상 가장 슬림한 스위프트 시리즈와 스위프트 에어 업그레이드 모델도 함께 공개했다. 친환경 소재와 지속 가능성을 강조하는 동시에 디자인 혁신을 추구하고 있다. 글로벌 노트북 시장에서 제품 라인업을 강화하기 위한 전략이다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/computing/acer-recommits-to-repairability-with-new-vero-16-laptop/", "category": "launch", "importance": 2, "wl": true, "topic": "acer vero 16 노트북"}, {"title": "Dell Doubles Down on Cheap Student Laptops With Lower-End Dell 14S Configs", "summary": "델이 저렴한 가격대의 학생용 노트북 시장을 공략하기 위해 하위 라인업인 델 14S 구성을 강화하고 있다. 가성비를 중시하는 교육용 시장에서 판매량을 확대하려는 의도다. 최종적인 판매 가격 책정이 시장 성패를 가를 핵심 요인으로 지목된다. PC 제조사들 간의 보급형 노트북 경쟁이 치열해지고 있다.", "source": "CNET", "date": "2026-09-02 16:00", "url": "https://www.cnet.com/tech/computing/dell-doubles-down-on-cheap-student-laptops-with-lower-end-dell-14s-configs/", "category": "launch", "importance": 2, "wl": true, "topic": "dell 14s 학생용 노트북"}, {"title": "Apple tells Mac App Store developers they can now drop Intel support", "summary": "애플이 macOS 13 이상을 요구하는 맥 앱스토어의 유니버설 앱 개발자들에게 인텔 기반 맥에 대한 지원을 공식적으로 중단할 수 있다고 통보했습니다. 구형 프로세서 중심의 지원을 마무리하고 애플 실리콘 생태계로의 전환을 가속화하고 있습니다. 소프트웨어 에코시스템의 세대교체가 빠르게 이루어지고 있습니다. PC 시장 전반의 아키텍처 전환 흐름을 보여주는 대목입니다.", "source": "9to5Mac", "date": "2026-09-02 09:50", "url": "https://9to5mac.com/2026/09/01/apple-tells-mac-app-store-developers-they-can-now-drop-intel-support/", "category": "other", "importance": 2, "wl": true, "topic": "맥 앱스토어 인텔 지원 중단"}, {"title": "삼성전자, ‘New 갤럭시 북6’ 출시... 1.35kg 휴대성에 최대 25시간 배터리 - 테크데일리", "summary": "삼성전자가 1.35kg의 가벼운 무게와 최대 25시간 지속되는 배터리 성능을 갖춘 뉴 갤럭시 북6를 공식 출시했다. 고성능과 높은 휴대성을 동시에 충족하며 소비자들의 가격 부담을 낮춘 실속형 라인업으로 기획됐다. 최근 고물가 속에서 가성비 노트북 수요를 적극 공략하여 PC 시장 점유율을 확대하려는 전략적 의미를 지닌다.", "source": "테크데일리", "date": "2026-09-02 21:32", "url": "https://www.techdaily.co.kr/news/articleViewAmp.html?idxno=29479", "category": "launch", "importance": 4, "wl": false, "topic": "갤럭시 북6 출시"}, {"title": "Samsung Just Made the Galaxy Book6 $250 Cheaper, But There’s a Catch | Samsung Galaxy Book", "summary": "삼성전자가 갤럭시 북6의 가격을 250달러 인하하여 소비자 접근성을 높였다. 최신 인텔 코어 프로세서를 탑재하고 가격 경쟁력을 강화한 모델로, 고물가 시대에 가성비를 중시하는 노트북 시장에서 점유율 확대가 기대된다.", "source": "the-gadgeteer.com", "date": "2026-09-02 00:00", "url": "https://the-gadgeteer.com/2026/09/01/samsung-galaxy-book6-what-changed/", "category": "price", "importance": 4, "wl": false, "topic": "북6 가격"}, {"title": "Samsung's new $799 Galaxy Book6 is a welcome sight in an ever more expensive market - Wind", "summary": "끊임없이 가격이 오르는 IT 시장에서 799달러짜리 신형 갤럭시 북6의 등장은 소비자들에게 반가운 소식이다. 합리적인 가격에 탄탄한 성능을 제공하여 가성비 노트북으로 호평을 받고 있다. PC 시장에서 삼성의 가격 경쟁력을 부각하는 요소다.", "source": "Windows Central", "date": "2026-09-01 23:20", "url": "https://www.windowscentral.com/hardware/laptops/samsungs-new-usd799-galaxy-book6-is-an-antidote-to-constantly-rising-pc-prices-but-still-offers-stellar-battery-life", "category": "launch", "importance": 4, "wl": false, "topic": "북6 출시"}, {"title": "삼성 갤럭시 북 6 노트북 상세 정보: 인텔 코어 3 및 5 프로세서, 25시간 배터리 수명, 가격은 799달러부터 시작합니다. - Vietnam.vn", "summary": "인텔 코어 3 및 5 프로세서를 탑재하고 25시간의 배터리 수명을 지원하는 삼성 갤럭시 북6가 799달러의 합리적인 가격으로 글로벌 출시된다. 뛰어난 가성비와 성능을 무기로 글로벌 노트북 시장에서 강력한 경쟁력을 발휘할 것으로 기대를 모으고 있다. 실속형 PC 라인업의 주력 모델이다.", "source": "Vietnam.vn", "date": "2026-09-01 22:44", "url": "https://www.vietnam.vn/ko/chi-tiet-laptop-samsung-galaxy-book-6-chip-intel-core-3-va-5-pin-25-gio-gia-tu-799-usd", "category": "launch", "importance": 4, "wl": false, "topic": "갤럭시 북6 가격"}, {"title": "신성씨앤에스, 삼성전자 기업 전용 '갤럭시 북6 엔터프라이즈 에디션' 공급 확대 - 머니투데이 - 머니투데이", "summary": "신성씨앤에스가 삼성전자의 기업 전용 라인업인 갤럭시 북6 엔터프라이즈 에디션의 B2B 공급 물량을 확대한다. 보안성과 관리 편의성이 강화된 기업 맞춤형 제품으로 법인 고객들의 수요를 적극 공략하고 있다. B2B PC 시장에서 안정적인 판매 채널을 확보하는 성과다.", "source": "머니투데이", "date": "2026-09-01 16:54", "url": "https://www.mt.co.kr/amp/industry/2026/09/01/2026090110384410142", "category": "launch", "importance": 4, "wl": false, "topic": "갤럭시 북6 기업용"}, {"title": "[재계 투데이] 삼성전자, 뉴 갤럭시 북6 국내 출시 外 - DealSite경제TV", "summary": "삼성전자가 뉴 갤럭시 북6를 국내 시장에 공식 출시하는 등 주간 재계 주요 소식을 다룬 종합 보도다. 고성능과 합리적 가격을 내세운 실속형 노트북으로 국내 소비자를 공략한다. 하반기 IT 가전 시장의 주요 제품 론칭 소식이다.", "source": "DealSite경제TV", "date": "2026-09-01 14:22", "url": "https://news.dealsitetv.com/articles/175465", "category": "launch", "importance": 4, "wl": false, "topic": "뉴 갤럭시 북6 국내 출시"}, {"title": "Samsung Expands the Galaxy Book6 Lineup, Making Galaxy Book More Accessible - Samsung Glob", "summary": "삼성전자가 뉴 갤럭시 북6 라인업을 글로벌 시장으로 대거 확장하며 더 많은 소비자들이 갤럭시 북의 뛰어난 성능을 합리적으로 누릴 수 있도록 접근성을 대폭 높였다. 포트폴리오 다변화로 글로벌 PC 판매량을 견인하려는 전략이다.", "source": "Samsung Global Newsroom", "date": "2026-09-01 08:01", "url": "https://news.samsung.com/us/samsung-expands-galaxy-book6-lineup-making-galaxy-book-more-accessible/", "category": "launch", "importance": 4, "wl": false, "topic": "갤럭시 북6 라인업 확대"}, {"title": "삼성, 인텔 '코어 시리즈3' 업고 맥북네오 정조준", "summary": "갤럭시 스마트폰 과 파일 공유 기능을 지원한다. (사진=삼성전자) CPU 코어 수와 GPU  MrBeast into the wilderness, armed with AI", "summary": "구글이 유명 유튜버 미스터비스트와 다년간의 파트너십을 체결하고 지미 도덜슨이 제미나이를 활용하는 영상을 시작으로 헬스, 핏빗 등 자사 서비스를 적극 홍보할 예정입니다. 구글 헬스와 핏빗 에어 등이 결합된 대중적인 콘텐츠 마케팅이 본격화됩니다. 디지털 헬스케어 및 AI 생태계 확장을 위한 공격적인 투자와 파트너십 전략의 일환입니다. 삼성전자의 헬스케어 및 웨어러블 사업에 강력한 도전이 될 수 있습니다.", "source": "The Verge", "date": "2026-09-03 00:47", "url": "https://www.theverge.com/tech/988355/mrbeast-google-partnership-gemini-fitbit", "category": "launch", "importance": 3, "wl": true, "topic": ""}, {"title": "Continuous glucose monitors are about to get more complicated", "summary": "연속 혈당 측정기(CGM)가 더욱 복잡해지고 있습니다. 최신 웨어러블 기기와 헬스케어 알약들이 일상을 바꿀 것이라는 기대 속에 관련 제품군이 다변화되고 있습니다. 사용자들의 건강 관리 정밀도가 높아지는 반면 기기 사용과 데이터 해석의 진입장벽이 커지고 있습니다. 디지털 헬스케어 시장에서 CGM의 활용도가 점차 확장되는 추세입니다.", "source": "The Verge", "date": "2026-09-03 00:30", "url": "https://www.theverge.com/column/988242/optimizer-abbott-libre-duo-ketones-diabetic-ketoacidosis", "category": "quality", "importance": 2, "wl": true, "topic": "연속 혈당 측정기"}, {"title": "Oura’s Menopause Impact Scale Expands Out of the App and Into Women’s Health Care", "summary": "오우라 링의 제작사가 여성 건강 관리를 위해 갱년기 영향 지표 기능을 앱을 넘어 실제 여성 의료 기관과의 파트너십으로 확장한다. 웨어러블 기기에서 수집된 건강 데이터를 의료 현장과 연계하여 전문적인 케어를 지원하려는 시도다. 디지털 헬스케어가 단순 피트니스 트래킹을 넘어 전문 의료 분야로 깊숙이 진입하고 있다. 헬스케어 생태계 내에서의 협력 모델을 구축하고 있다.", "source": "CNET", "date": "2026-09-02 21:04", "url": "https://www.cnet.com/health/medical/oura-menopause-impact-scale-womens-health-care/", "category": "launch", "importance": 2, "wl": true, "topic": "oura 갱년기 건강 관리"}, {"title": "“치실 귀찮다”던 다이슨 창업자, 카메라로 문제 풀었다", "summary": "다이슨이 카메라로 치아 사이 보이지 않는 틈을 찾아내는 오랄케어 기기 '다이슨 카메라젯'을 출시하며 헬스케어 제품군으로 사업 영역을 확대한다. 창업자의 개인적 경험에서 비롯된 제품으로 혁신적인 헬스케어 솔루션을 지향한다. 헤어케어와 청소기 위주였던 다이슨의 포트폴리오가 다변화되고 있다. 글로벌 가전 기업들의 헬스케어 진출이 활발해지고 있다.", "source": "전자신문", "date": "2026-09-02 16:00", "url": "https://www.etnews.com/20260902000315", "category": "launch", "importance": 2, "wl": true, "topic": "다이슨 카메라젯 오랄케어"}, {"title": "Ultrahuman wants real-world health data, and is asking its users for it", "summary": "울트라휴먼이 실제 환경에서의 정밀한 건강 데이터를 확보하기 위해 사용자들에게 데이터 공유를 요청하고 있다. 웨어러블 기기 제조사가 실사용자들의 방대한 생체 데이터를 수집하여 알고리즘을 고도화하려는 전략이다. 개인정보 보호와 데이터 활용 간의 균형 문제가 다시 대두될 수 있다. 디지털 헬스케어 생태계 확장을 위한 데이터 확보 경쟁이 치열하다.", "source": "Android Authority", "date": "2026-09-01 22:00", "url": "https://www.androidauthority.com/ultrahuman-pulsomics-research-program-3705215/", "category": "policy", "importance": 2, "wl": true, "topic": "ultrahuman 건강 데이터 수집"}, {"title": "\"스마트 워치 칼로리 맹신 마세요\"…체지방 많을수록 오차 커져 - v.daum.net", "summary": "스마트워치가 측정하는 소모 칼로리 수치에 체지방률에 따른 오차가 존재한다는 연구 결과가 제기됐다. 체지방이 많을수록 계산된 칼로리와 실제 소모량 간의 격차가 커지는 경향을 보여 사용자들의 주의가 요구된다. 디지털 헬스케어 및 웨어러블 기기의 측정 정확도 개선이 향후 과제로 부각된다.", "source": "v.daum.net", "date": "2026-09-02 14:41", "url": "https://v.daum.net/v/20260902144128988", "category": "quality", "importance": 3, "wl": false, "topic": "스마트워치 칼로리 오차"}, {"title": "I let my Galaxy Watch control my day—this feature did the heavy lifting - How-To Geek", "summary": "사용자가 갤럭시 워치를 활용해 하루 일과를 온전히 제어하고 건강 관리 및 알림 기능을 손목 위에서 완벽히 소화하는 일상 밀착형 사용 후기가 소개됐다. 웨어러블 기기의 실효성과 편의성을 강조한 리뷰다.", "source": "How-To Geek", "date": "2026-09-02 08:30", "url": "https://www.howtogeek.com/i-let-my-galaxy-watch-control-my-daythis-feature-did-the-heavy-lifting/", "category": "launch", "importance": 3, "wl": false, "topic": "갤럭시 워치 일상 제어"}, {"title": "Samsung Fit 1 Fitness Tracker Galaxy Fit2 Ios A Man Standing On Top Of A Grass Covered Hil", "summary": "", "source": "krepsiniozinios", "date": "2026-09-02 05:54", "url": "https://www.krepsiniozinios.lt/productSearch/pictureSearch?id=38524787050390", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "‘가성비’ 앞세운 中 웨어러블 공세…삼성전자, AI 헬스케어로 맞불 - 파이낸셜투데이", "summary": "", "source": "파이낸셜투데이", "date": "2026-09-02 01:39", "url": "http://www.ftoday.co.kr/news/articleViewAmp.html?idxno=364587", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Smartwatch Calorie Counts Overstated by Up to 25%, Study Finds—Higher Body Fat Linked to L", "summary": "스마트워치의 칼로리 소모량 측정치가 최대 25%까지 과대 측정될 수 있다는 연구 결과가 발표됐다. 체지방률이 높을수록 측정 오차가 커진다는 분석이다. 웨어러블 헬스케어 기기의 측정 정확도 개선 필요성이 제기된다.", "source": "finance.biggo.com", "date": "2026-09-02 22:59", "url": "https://finance.biggo.com/news/9fa0a330-bd97-435b-adf5-524ac822e848", "category": "quality", "importance": 2, "wl": false, "topic": "기타 헬스케어"}], "phone": [{"title": "iPhone 18 Pro will have three upgrades that have been rumored for years", "summary": "출시를 코앞에 둔 아이폰18 프로에 수년간 루머로 돌았던 세 가지 핵심 업그레이드가 탑재될 예정입니다. 하드웨어 완성도를 높이고 사용자들의 기대를 충족시킬 프리미엄 기능들이 대거 적용됩니다. 애플의 차세대 플래그십 스마트폰으로서 글로벌 시장의 이목을 집중시키고 있습니다. 삼성전자 MX사업부의 즉각적인 대응과 철저한 스펙 분석이 요구되는 핵심 이벤트입니다.", "source": "9to5Mac", "date": "2026-09-03 03:21", "url": "https://9to5mac.com/2026/09/02/iphone-18-pro-will-have-three-upgrades-that-have-been-rumored-for-years/", "category": "launch", "importance": 5, "wl": true, "topic": "아이폰18 프로 출시"}, {"title": "Amazon slashes $300 off the Galaxy Z Fold 8 Ultra in its first price drop", "summary": "아마존이 삼성의 신형 폴더블폰 '갤럭시 Z 폴드 8 울트라'를 출시 직후 300달러 대폭 할인된 1,799.99달러에 판매하며 첫 번째 가격 인하를 단행했습니다. 초고가 폴더블 스마트폰의 초기 진입장벽을 낮춰 판매량을 끌어올리려는 파격적인 조치입니다. 프리미엄 폴더블 시장에서 소비자의 구매 매력을 높이는 강력한 유인책입니다. 삼성전자 MX사업부의 판매 마케팅 전략에 중요한 지표가 됩니다.", "source": "Android Authority", "date": "2026-09-02 23:55", "url": "https://www.androidauthority.com/galaxy-z-fold-8-ultra-deal-3706325/", "category": "price", "importance": 4, "wl": true, "topic": "갤럭시 z 폴드 8 울트라 할인"}, {"title": "Apple's iPhone Ultra Crease Fix Set for Android Foldables Next Year", "summary": "애플의 폴더블 아이폰 울트라에 적용된 크리즈(주름) 개선 기술이 내년 안드로이드 폴더블폰 시장에도 영향을 미칠 것으로 보입니다. 애플이 고질적인 폴더블 디스플레이의 주름 문제를 어떻게 해결했는지에 대한 분석이 이어지고 있습니다. 폼팩터 혁신 경쟁에서 애플이 새로운 표준을 제시할 수 있을지 주목됩니다. 삼성전자 갤럭시 Z 시리즈의 힌지 및 디스플레이 기술 개발에 자극제가 될 전망입니다.", "source": "MacRumors", "date": "2026-09-02 20:57", "url": "https://www.macrumors.com/2026/09/02/iphone-ultra-crease-coming-to-android-foldables/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 주름"}, {"title": "Galaxy S27 Ultra could go Exynos again, and this time, Snapdragon fans might get jealous", "summary": "삼성의 내부 테스트 결과 엑시노스 2700이 스냅드래곤 8 엘리트 젠 6 프로를 능가하는 성능을 보여주며, 차기 '갤럭시 S27 울트라'에 엑시노스 칩셋이 재탑재될 가능성이 제기되었습니다. 그동안 스냅드래곤을 선호하던 팬들에게는 놀라운 소식인 동시에 자체 칩 경쟁력 부활을 알리는 신호탄입니다. 플래그십 스마트폰의 AP 다변화 전략에 큰 변화를 예고하고 있습니다. 삼성전자의 반도체 역량이 시험대에 올랐습니다.", "source": "Android Authority", "date": "2026-09-02 20:43", "url": "https://www.androidauthority.com/galaxy-s27-ultra-exynos-rumor-3706017/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s27 울트라 엑시노스"}, {"title": "Xiaomi beats Apple to market with wide Xiaomi 18 Fold reveal", "summary": "샤오미가 애플의 이벤트 이틀 전에 공식 렌더링과 비디오를 공개하며 새로운 와이드 폴더블 폼팩터의 '샤오미 18 폴드'를 시장에 전격 출시하여 애플보다 한발 앞서가고 있습니다. 가로로 넓어진 와이드 스크린을 채택해 폴더블폰의 사용성을 극대화한 전략 모델입니다. 중국 제조사들의 신제품 선점 공세가 매우 공격적으로 전개되고 있습니다. 삼성전자 갤럭시 Z 폴드 시리즈에 강력한 견제구로 작용합니다.", "source": "Android Authority", "date": "2026-09-02 18:36", "url": "https://www.androidauthority.com/xiaomi-18-fold-launch-details-3705996/", "category": "launch", "importance": 4, "wl": true, "topic": "샤오미 18 폴드 출시"}, {"title": "New Galaxy S27 and S27 Plus leak sets us up for grave disappointment, this time for fast c", "summary": "차기 플래그십 스마트폰 '갤럭시 S27 및 S27 플러스'의 유출 정보에 따르면 특히 고속 충전 기술 등에서 심각한 실망감을 안겨줄 것으로 우려되고 있습니다. 특히 기본 모델의 경우 갤럭시 S26 FE보다도 스펙상 뒤처지는 모습을 보여 소비자들의 비판을 받고 있습니다. 프리미엄 라인업 내에서 원가 절감이나 급나누기가 과도하다는 지적입니다. 삼성전자 모바일 사업부의 스펙 전략에 대한 재검토가 요구됩니다.", "source": "Android Authority", "date": "2026-09-02 17:48", "url": "https://www.androidauthority.com/galaxy-s27-plus-charging-speed-25w-3705976/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s27 플러스 유출"}, {"title": "Apple Launching Eight New Products This Month", "summary": "애플이 이번 달 무려 8개의 새로운 신제품을 대거 출시하며 하반기 시장 공세에 나섭니다. 스마트폰, 태블릿, 노트북, 웨어러블을 아우르는 대규모 하드웨어 공습이 예고되었습니다. 글로벌 IT 시장의 판도를 흔들 초대형 이벤트로 평가받습니다. 삼성전자 MX사업부의 전방위적인 대응 전략 수립이 필수적인 시점입니다.", "source": "MacRumors", "date": "2026-09-02 17:15", "url": "https://www.macrumors.com/2026/09/02/apple-launching-eight-new-products-next-month/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 8개 신제품"}, {"title": "New iPhone Ultra details arrive for specs, multitasking, launch timing, more", "summary": "다음 주 애플의 9월 이벤트에서 공개될 아이폰 울트라에 대해 톰스 가이드와 마크 거먼의 인터뷰를 통해 사양, 멀티태스킹, 출시 일정 등 새로운 세부 정보가 대거 공개되었습니다. 최상위 라인업 신제품으로서 모바일 시장의 판도를 흔들 강력한 스펙을 예고하고 있습니다. 혁신적인 소프트웨어 기능과 새로운 폼팩터의 가능성이 제기됩니다. 삼성전자 갤럭시 S 울트라 라인업의 강력한 경쟁 상대로 즉각적인 분석이 필요합니다.", "source": "9to5Mac", "date": "2026-09-02 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 사양 출시"}, {"title": "Foldable iPhone Ultra Likely Has MagSafe Charging", "summary": "접이식 폼팩터로 예상되는 폴더블 아이폰 울트라에 맥세이프(MagSafe) 무선 충전 기능이 탑재될 가능성이 높게 점쳐지고 있습니다. 얇은 두께를 유지하면서도 자석 기반의 편리한 충전 및 액세서리 생태계를 구현하려는 설계입니다. 폴더블폰의 사용 편의성을 높이는 핵심 차별점이 될 수 있습니다. 삼성전자 갤럭시 Z 폴드 시리즈와의 기술 경쟁에서 주목해야 할 포인트입니다.", "source": "MacRumors", "date": "2026-09-02 04:05", "url": "https://www.macrumors.com/2026/09/01/foldable-iphone-ultra-magsafe/", "category": "launch", "importance": 4, "wl": true, "topic": "폴더블 아이폰 맥세이프"}, {"title": "Apple Teases 'Huge Launch' Next Week", "summary": "애플이 다음 주 열릴 이벤트에서 '거대한 런칭(Huge Launch)'이 있을 것임을 예고하며 글로벌 미디어와 소비자의 이목을 집중시키고 있습니다. 하반기 IT 시장의 판도를 뒤흔들 혁신적인 신제품들의 등장이 임박했습니다. 스마트폰, 웨어러블, PC 등 전 분야에 걸쳐 대대적인 발표가 예상됩니다. 삼성전자 MX사업부의 비상 대응 체제 가동이 필요한 시점입니다.", "source": "MacRumors", "date": "2026-09-02 03:03", "url": "https://www.macrumors.com/2026/09/01/apple-teases-huge-launch-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 대형 런칭 예고"}, {"title": "Breaking: Galaxy S26 series gets eighth One UI 9 beta release (!!)", "summary": "갤럭시 S26 시리즈를 대상으로 여덟 번째 One UI 9 베타 버전이 긴급 배포되었다. 정식 출시를 앞두고 소프트웨어의 완성도를 극대화하기 위한 집중적인 테스트가 진행 중이다. 삼성전자는 버그 수정과 최적화 작업을 통해 사용자 경험을 끌어올리고 있다. 차세대 플래그십 OS 안정화 작업이 막바지에 접어들었음을 시사한다.", "source": "Android Authority", "date": "2026-09-01 18:16", "url": "https://www.androidauthority.com/samsung-galaxy-s26-one-ui-9-beta-8-3705321/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s26 one ui 9 베타"}, {"title": "Apple’s first folding iPhone won’t kill Android foldables — it will save them", "summary": "애플의 첫 번째 폴더블 아이폰 출시가 안드로이드 폴더블폰 시장을 죽이는 것이 아니라 오히려 살리는 계기가 될 것이라는 전망이 나왔다. 애플의 진입이 폴더블 폼팩터에 대한 대중적 관심을 환기하고 시장 규모를 키워줄 것이라는 분석이다. 삼성전자가 개척해 온 폴더블 스마트폰 생태계 전반에 긍정적인 자극제가 될 수 있다. 경쟁 구도의 변화 속에서 폴더블 대중화가 가속화될 전망이다.", "source": "Android Authority", "date": "2026-09-01 18:00", "url": "https://www.androidauthority.com/apple-foldable-iphone-save-android-phones-3704142/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 폴더블폰 전망"}, {"title": "iOS 27 Introduces New 'iPhone Handoff' Feature", "summary": "iOS 27에 새롭게 도입된 '아이폰 핸드오프' 기능은 기기 간 연동성을 한층 강화합니다. 애플 에코시스템 안에서 아이폰과 다른 기기들 간의 작업 연속성이 매끄러워졌습니다. 멀티디바이스 경험을 중시하는 사용자들에게 큰 호응을 얻을 것으로 기대됩니다. 에코시스템의 결속력을 높이는 핵심 소프트웨어 기능입니다.", "source": "MacRumors", "date": "2026-09-03 04:35", "url": "https://www.macrumors.com/2026/09/02/ios-27-iphone-handoff-feature/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 핸드오프"}, {"title": "Students and opposition activists targeted with spyware in Serbia", "summary": "세르비아 학생과 야당 활동가들이 스파이웨어 공격의 표적이 되었습니다. 피해자 중 12명은 아이폰이 손상되었다는 애플의 알림을 받았습니다. 이번 사건은 특정 개인들을 노린 모바일 보안 위협의 심각성을 보여줍니다. 향후 모바일 플랫폼 전반의 보안 강화와 신속한 위협 대응의 중요성이 커지고 있습니다.", "source": "Financial Times Tech", "date": "2026-09-03 04:11", "url": "https://www.ft.com/content/c9c3a0ef-98d5-4aeb-9d20-e6250d6fcf99?syn-25a6b1a6=1", "category": "quality", "importance": 3, "wl": true, "topic": "아이폰18 스파이웨어 해킹"}, {"title": "iOS 27 fixes Apple Mail in three ways longtime users will love", "summary": "iOS 27은 시리 AI와 메일, 메모, 리마인더, 캘린더 등 생산성 앱 업그레이드를 탑재하고 있습니다. 오랜 사용자들을 위해 애플 메일의 고질적인 버그들을 수정하여 사용자 경험을 크게 개선했습니다. 운영체제 수준에서의 대대적인 AI 통합과 편의성 강화가 돋보입니다. 아이폰 사용자들의 만족도를 높이고 생태계 결속력을 다지는 핵심 업데이트입니다.", "source": "9to5Mac", "date": "202  그래픽 성능을 극적으로 향상시키는 데 초점을 맞추고 있습니다. 모바일 게이밍 환경의 품질을 한 단계 끌어올릴 핵심 반도체 기술입니다. 고성능 스마트폰 시장에서 AP 경쟁력을 좌우할 중요한 요소입니다.", "source": "Android Authority", "date": "2026-09-02 22:00", "url": "https://www.androidauthority.com/qualcomm-snapdragon-8-elite-gen-6-gpu-3705379/", "category": "launch", "importance": 3, "wl": true, "topic": "스냅드래곤 차세대 칩 dlss"}, {"title": "Apple Labor Day 2026 deals now live: AirPods Pro 3, M6 Mac mini, AirTag 2, iPhone, more [U", "summary": "아마존이 노동절 세일을 맞아 에어팟 프로 3 가격을 50달러 인하된 199달러로 내리는 등 대대적인 2026년 가을 할인 행사를 시작했습니다. M6 맥 미니, 에어태그 2, 아이폰 등 주력 하드웨어 제품들이 대거 할인 판매에 돌입했습니다. 소비 성수기를 앞두고 유통업계의 가격 공세가 치열하게 전개되고 있습니다. 삼성전자의 판매 전략에도 참고할 만한 가격 변동성입니다.", "source": "9to5Mac", "date": "2026-09-02 21:17", "url": "https://9to5mac.com/2026/09/02/apple-labor-day-2026-deals-live/", "category": "price", "importance": 3, "wl": true, "topic": "애플 노동절 할인"}, {"title": "Leakers battle over whether third iPhone 18 Pro color will be silver or black", "summary": "다음 주 출시될 아이폰18 프로의 세 가지 색상 중 실버와 블랙 외에 나머지 한 가지 컬러를 두고 저명한 유출가들 사이에 의견이 엇갈리고 있습니다. 신제품 발표를 앞두고 디자인과 마감 색상에 대한 관심이 최고조에 달해 있습니다. 세부 사양과 외관에 대한 루머가 소비자들의 구매 심리에 영향을 미치고 있습니다. 경쟁사 동향 파악을 위한 주요 모니터링 포인트입니다.", "source": "9to5Mac", "date": "2026-09-02 19:53", "url": "https://9to5mac.com/2026/09/02/leakers-battle-over-whether-third-iphone-18-pro-color-will-be-silver-or-black/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰18 프로 색상"}, {"title": "Leaked iPhone 18 Pro Parts Point to Three Color Options Excluding Black", "summary": "유출된 아이폰18 프로 부품들을 통해 블랙을 제외한 세 가지 컬러 옵션이 존재한다는 점이 거듭 확인되었습니다. 부품 공급망을 통한 신제품 디자인 유출이 구체화되면서 디자인 라인업에 대한 윤곽이 드러나고 있습니다. 출시 전 소비자의 기대감을 고조시키는 요인입니다. 경쟁사 동향 분석에 활용되는 핵심 데이터입니다.", "source": "MacRumors", "date": "2026-09-02 19:17", "url": "https://www.macrumors.com/2026/09/02/leaked-iphone-18-pro-parts-point-to-three-colors/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰18 프로 부품 컬러"}, {"title": "Pixel 11 notifications are the last straw for many readers sick of pho onvince me to upgrade next year - How-To Geek", "summary": "외신 IT 매체가 삼성전자의 차세대 폴더블 스마트폰이 시장에서 확실한 업그레이드 선택을 받기 위해 내년에 반드시 개선해야 할 5가지 핵심 기능을 제안했다. 경쟁 심화 속에서 지속적인 폼팩터 혁신의 필요성을 지적한 분석 기사다.", "source": "How-To Geek", "date": "2026-09-03 02:30", "url": "https://www.howtogeek.com/features-samsung-foldables-need-to-convince-me-to-upgrade-next-year/", "category": "launch", "importance": 3, "sid": "phone", "topic": "폴더블폰 개선 요구"}, {"title": "Is The Calorie Counter on Your Smartwatch Accurate? Not Really, Study Finds", "summary": "새로운 연구 결과에 따르면 시중에 판매되는 스마트워치들의 칼로리 소모량 추정치의 정확도가 전반적으로 낮은 것으로 나타났다. 다양한 웨어러블 기기들을 평가한 결과 신뢰할 만한 수준의 정확도를 보여준 제품은 드물었다. 디지털 헬스케어 및 피트니스 트래킹 기능의 기술적 한계를 지적하는 대목이다. 스마트워치 사용자들에게 객관적인 건강 지표 제공의 중요성이 커지고 있다.", "source": "CNET", "date": "2026-09-03 02:09", "url": "https://www.cnet.com/tech/mobile/is-the-calorie-counter-on-your-smartwatch-accurate-not-really-study-finds/", "category": "quality", "importance": 2, "sid": "watch", "topic": "스마트워치 칼로리 정확도"}, {"title": "New Leak Suggests the Galaxy S27 Edge Might Actually Be Real - SammyGuru", "summary": "단종되었던 엣지 디자인이 차기작 갤럭시 S27 시리즈를 통해 엣지 모델로 극적인 부활을 이룰 수 있다는 새로운 유출 루머가 제기됐다. 폼팩터 다양화를 통해 소비자 선택의 폭을 넓히려는 전략적 변화 가능성으로 주목받는다.", "source": "SammyGuru", "date": "2026-09-03 02:04", "url": "https://sammyguru.com/galaxy-s27-edge-new-leak-comeback/", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시 s27 엣지 루머"}];
</script>
<script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
