": 4, "sid": "memchina", "topic": "tsmc 공장 건설현장 사고"}, {"title": "中 스마트폰 업계, 메모리 공급난에 '재활용 D램' 활용…생산 목표 다시 높인다", "summary": "AI 서버용 메모리 공급이 우선시되면서 심각한 부품 부족과 가격 상승을 겪고 있는 중국 스마트폰 업체들이 보급형 제품을 중심으로 회수한 중고 D램 재사용을 늘리며 생산 목표 유지를 시도하고 있다. 카운터포인트리서치에 따르면 이러한 부품 재활용 트렌드는 올해 2분기 이후 본격화되었다. 원가 절감을 위한 중국 경쟁사들의 고육지책을 보여준다.", "source": "ebn.co.kr", "date": "2026-10-21 07:27", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1728538", "category": "quality", "importance": 4, "sid": "memchina", "topic": "중국 스마트폰 업계 재활용 d램 활용"}, {"title": "Perplexity Computer Can Now Run Fully Locally on Mac", "summary": "퍼플렉시티의 AI 컴퓨터 기능이 인터넷 연결 없이 맥 환경에서 완전히 로컬로 작동하게 되었습니다. 기기 내부 NPU 자원을 활용해 민감한 데이터의 외부 유출 없이 로컬 검색과 연산을 처리합니다. PC 시장에서 데이터 프라이버시를 앞세운 온디바이스 AI 도구의 대중화가 가속화되고 있습니다. 갤럭시 북의 로컬 NPU 활용 온디바이스 AI 생산성 앱 확장이 필요합니다.", "source": "MacRumors", "date": "2026-10-21 07:20", "url": "https://www.macrumors.com/2026/10/20/perplexity-computer-local-mac/", "category": "launch", "importance": 4, "sid": "pc", "topic": "perplexity 로컬 ai"}, {"title": "NY포스트 “솔리다임, 美 뉴욕 유티카에 낸드 공장 검토”", "summary": "SK하이닉스의 미국 낸드 자회사 솔리다임이 미국 뉴욕주에 낸드 플래시 생산 공장 건립을 위해 주 정부와 진전된 협상을 진행 중이다. 메모리 반도체 공급망 확장과 투자 관련 주요 소식이다.", "source": "전자신문", "date": "2026-10-21 07:14", "url": "https://www.etnews.com/20261021000003", "category": "launch", "importance": 4, "sid": "memchina", "topic": "솔리다임 뉴욕 낸드 공장"}, {"title": "Google’s more personalized Gemini AI is heading to your car", "summary": "구글이 안드로이드 오토와 구글 빌트인 차량에 개인 맞춤형 제미나이 AI를 대폭 확대 적용한다고 발표했습니다. 지메일, 캘린더, 지도 등 구글 서비스 전반의 개인 데이터를 연동하여 차량 내 맞춤형 음성 어시스턴트를 제공합니다. 애플 카플레이와의 차량 내 인포테인먼트 및 AI 주도권 경쟁이 본격화되고 있습니다. 갤럭시 스마트폰의 차량 연동 경험 및 빅스비 연계 편의성 고도화가 요구됩니다.", "source": "The Verge", "date": "2026-10-21 07:11", "url": "https://www.theverge.com/tech/1014999/google-gemini-ai-cars-android-auto", "category": "launch", "importance": 4, "sid": "phone", "topic": "gemini ai 인포테인먼트"}, {"title": "Survey reveals trust in Google has taken a big hit after this quiet Android change", "summary": "설 .", "source": "mk.co.kr", "date": "2026-10-20 16:28", "url": "https://www.mk.co.kr/news/business/12180528", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 디자인"}, {"title": "삼성전자 11월 'AI 글래스' 전격 출시, 노태문 구글과 손잡고 메타 아성 도전장", "summary": "삼성전자가 오는 11월 노태문 사장을 필두로 구글과 손잡고 'AI 글래스'를 전격 출시하여 메타의 아성에 도전장을 던진다. 확장현실(XR) 및 AI 웨어러블 시장의 주도권을 잡기 위한 초강수다. 글로벌 빅테크 간의 치열한 폼팩터 전쟁이 예고된다.", "source": "businesspost.co.kr", "date": "2026-10-20 15:12", "url": "https://www.businesspost.co.kr/BP?command=article_view&num=449800", "category": "launch", "importance": 5, "sid": "glasses", "topic": "ai 글래스 출시"}, {"title": "귀 안 막는 삼성 이어폰 나온다…첫 클립형 '갤럭시 버즈 온'", "summary": "삼성전자가 첫 클립형 무선 이어폰 '갤럭시 버즈 온'을 오는 27일 공식 출시합니다. 귀를 막지 않아 주변 소리를 들으면서도 콘텐츠를 감상할 수 있어 러너나 일상 사용자들에게 최적화된 설계를 갖췄습니다.", "source": "yna.co.kr", "date": "2026-10-20 13:31", "url": "https://www.yna.co.kr/view/AKR20261020049500017", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 공개"}, {"title": "갤럭시S27 울트라·프로 디자인 바뀐다…케이스 이미지 유출", "summary": "삼성전자가 내년 초 공개할 차세대 플래그십 스마트폰 갤럭시S27 시리즈 전체 라인업의 케이스 이미지가 유출됐다. 외신과 IT 팁스터 아이스유니버스를 통해 공개된 이미지에 따르면 기본 및 플러스 모델은 전작과 유사한 디자인을 유지할 것으로 보인다. 플래그십 라인업 출고를 앞두고 디자인 변화에 대한 정보가 확산하고 있다.", "source": "ZDNet Korea", "date": "2026-10-20 10:48", "url": "https://zdnet.co.kr/view/?no=20261020084624", "category": "launch", "importance": 5, "sid": "phone", "topic": "갤럭시s27 케이스 이미지"}, {"title": "AI Swallows Up Memory Supply, Smartphone Prices Surge 300% as Global Shipments Hit 'Worst ", "summary": "AI 산업의 급격한 메모리 수요 흡수로 인해 전 세계 메모리 공급난이 심화되면서 스마트폰 가격이 300% 폭등하고 글로벌 출하량이 최악의 타격을 입고 있다. 부품 단가 급등이 완성 스마트폰 제조사들의 원가 구조를 심각하게 압박하고 있다. 고가화 전략과 수익성 악화 사이에서 제조사들의 고심이 깊어지고 있다. 모바일 산업 전반의 비용 부담을 가중시키는 치명적인 악재로 작용 중이다.", "source": "hankyung.com", "date": "2026-10-20 08:55", "url": "https://www.hankyung.com/article/202610188979i", "category": "price", "importance": 5, "sid": "memchina", "topic": "메모리 가격 폭등"}, {"title": "갤럭시 8200만대에 디지털 달러 심는다…삼성전자, 스테이블코인 송금시장 출사표", "summary": "삼성전자가 ac", "date": "2026-10-19 20:25", "url": "https://9to5mac.com/2026/10/19/constrained-iphone-duo-availability-is-annoying-but-a-mixed-blessing-for-apple/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 공급 제약"}, {"title": "고화질·저전력이 무기… 삼성D·LGD, 中 저가 공세 방어", "summary": "삼성디스플레이와 LG디스플레이가 주요 고객사 신제품용 패널 공급 확대에 힘입어 3분기 모바일 OLED 시장에서 중국 경쟁사들을 다시 앞질렀다. 고해상도·저전력 기술을 무기로 중국의 저가 공세를 방어하고 프리미엄 패널 공급 역량을 과시했다.", "source": "fnnews.com", "date": "2026-10-19 20:13", "url": "https://www.fnnews.com/news/202610191813064046", "category": "quality", "importance": 4, "sid": "phone", "topic": "삼성디스플레이 lg디스플레이 실적"}, {"title": "퀄컴·삼성, 갤럭시용 스냅드래곤 할인 계약 난항?", "summary": "퀄컴과 삼성전자가 갤럭시 스마트폰용 스냅드래곤 칩셋의 독점 할인 계약 조건을 놓고 협상에 난항을 겪으며 양사 간 갈등 조짐이 제기됐다.", "source": "kbench.com", "date": "2026-10-19 19:54", "url": "https://kbench.com/?q=node/282596", "category": "launch", "importance": 4, "sid": "phone", "topic": "퀄컴 삼성 스냅드래곤 계약 갈등"}, {"title": "\"왜 이렇게 비싸졌지\"…AI 열풍에 스마트폰값 폭등 [차이나 워치]", "summary": "AI 산업의 메모리 반도체 수요 급증으로 스마트폰 가격이 치솟으면서 올 3분기 중국 출하량이 13년 만에 최저 수준으로 떨어지고 글로벌 출하량도 급감했다. 메모리 가격 폭등이 완제품 원가 상승과 출하량 감소로 직결되는 심각한 수급 불균형이 발생하고 있다. 원가 상승 압박에 따른 스마트폰 제조사들의 수익성 관리 전략 마련이 시급하다.", "source": "hankyung.com", "date": "2026-10-19 19:30", "url": "https://www.hankyung.com/article/202610188979i", "category": "price", "importance": 4, "sid": "memchina", "topic": "스마트폰 가격 폭등"}, {"title": "갤럭시로 디지털 달러 보낸다…삼성월렛, 美 스테이블코인 송금 시동", "summary": "삼성전자가 10월 마지막 주부터 미국에서 삼성월렛을 통한 스테이블코인 송금 서비스를 시작한다. 모바일 지갑이 실제 금융 서비스로 영역을 확장하는 계기가 될 것으로 보인다.", "source": "bonmedia.kr", "date": "2026-10-19 19:27", "url": "https://www.bonmedia.kr/news/articleView.html?idxno=8713", "category": "launch", "importance": 4, "sid": "wallet", "topic": "삼성월렛 스테이블코인 송금"}, {"title": "삼성, 'One UI' 버리고 '갤럭시 OS'로 바꾸나", "summary": "삼성전자가 기존 소프트웨어 브랜드인 원 UI를 폐기하고 갤럭시 OS로 전면 교체할 가능성이 제기됐다. 스마트폰과 태블릿을 아우르는 통합 모바일 운영체제 이미지를 구축해 애플 iOS와의 독자 대항 구도를 강화하려는 목적이다. 단순 UI 커스텀을 넘어 독자 플랫폼으로서의 정체성을 강조하려는 전략이다. 브랜드 전략 변화 여부에 대한 사실 확인이 요구된다 amsung, LG Display gear up for Apple's next OLED wave", "summary": "삼성전자와 LG디스플레이가 애플의 차세대 OLED 패널 물량 공세를 소화하기 위해 공급망 장비 세팅 등 본격적인 준비 체제에 돌입했다. 디스플레이 계열사의 대형 수주 및 생산 라인 가동과 직결된다. 부품 협력사의 핵심 비즈니스 동향이다.", "source": "The Korea Herald", "date": "2026-10-19 16:34", "url": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE53ZGxfdmgwVXlFd05KOHltOEp5Rkdycm0zdVFrRnRRNDc3elZZZzFNTV9qNk5ObF9lT0RRN3JkbFgtTW81Z01HbWRsUnFYWlVoR0tMTlAyYw?oc=5", "category": "policy", "importance": 4, "sid": "memchina", "topic": "oled 패널 공급"}, {"title": "삼성 첫 오버이어 헤드폰 첫 인증 포착…애플 '에어팟 맥스' 정조준", "summary": "삼성전자의 첫 오버이어 무선 헤드폰 모델이 규제 인증을 통과했다. 애플의 에어팟 맥스와 소니 제품이 주도하는 프리미엄 오디오 시장에 도전장을 던지는 제품이다. 갤럭시 모바일 생태계의 사운드 경험을 헤드폰 영역까지 확장하는 첫 마일스톤이다. 하이엔드 음향 액세서리 포트폴리오 강화 측면에서 중요한 의미를 갖는다.", "source": "kbench.com", "date": "2026-10-19 16:31", "url": "https://kbench.com/?q=node/282589", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성오버이어헤드폰 인증"}, {"title": "애플 첫 폴더블 배송 지연…삼성 갤럭시 Z 폴드8 반사이익 얻나 By EBN", "summary": "애플의 첫 폴더블 스마트폰 사전 예약 배송이 내년으로 지연되면서 삼성 갤럭시 Z 폴드8이 반사이익을 얻을 것이라는 분석이다. 애플 신제품의 대기 기간이 길어지자 즉시 구매 가능한 삼성 플래그십 폴더블로 수요가 분산될 가능성이 제기된다. 프리미엄 폴더블 시장에서 당사의 안정적인 공급망과 양산 역량이 부각되고 있다. 공급 지연 틈새를 활용한 타깃 마케팅을 적극 추진할 만하다.", "source": "ebn.co.kr", "date": "2026-10-19 15:41", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1728305", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시z폴드8 반사이익"}, {"title": "삼성폰 또 '급 나누기'…갤S27 플러스, 기존 기능도 뺀다", "summary": "삼성전자가 차기 갤럭시 S27 플러스 모델에서 기존에 지원하던 UWB 기능을 제외할 가능성이 제기되며 급 나누기 논란이 일고 있다. 원가 폭등 속에서 부품 절감을 통해 가격 인상폭을 억제하려는 조치로 풀이된다. 그러나 기존 탑재 기능 삭제에 따른 플러스 모델 구매층의 불만이 예상된다. 라인업 간 기능 차별화와 원가 절감 사이의 정교한 밸런스가 요구된다.", "source": "뉴스1", "date": "2026-10-19 15:27", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE5Rci16RkFVWG9IOGk0TUI0RVl5cGpCVkcyajV5dGRrVVdXWk9tVHRWTUlWbVdEaml4WGJieHpSWGR0WVJwTUxGWUdKbk1MVUh2S3QzUDBNQjIzUQ?oc=5", "category": "quality", "importance": 4, "sid": "phone", "topic": "갤럭시s27플러스 uwb제외 루머"}, {"title": "폴더블폰에 “싸구려”라던 애플…삼성 패널 쓰고 가격은 100만원 더", "summary": "폴더블폰의 완성도를 폄하하던 애플이 삼성디스플레이 패널을 적용한 아이폰 듀오를 비싸게 책정해 논란이다. 초고가 가격 정책에도 불구하고 충성 고객층의 초기 수요가 몰리며 가격 저항을 무력화하고 있다. 애플 브랜드 파워가 고가 폴더블 시장에서도 통함을 보여주는 대목이다. 당사 플래그십 폴더블의 프리미엄 가치 제고와 가격 전략 재검토가 필요하다.", "source": "에너지경제신문", "date": "2026-10-19 15:04", "url": "https://news.google.com/rss/articles/CBMiY0FVX3lxTE9FdHVld055YmFHcDlVSXdORmo0WTRNaWNiWm56b1ZmNmVWcUFVYzIwZWNoUnI0RjZuU2d2T2FvRUlWMUZNWFRTelRtRlQyS3M0UTRZRk9vOU1KVkNQdm9hSGRUUQ?oc=5", "category": "price", "importance": 4, "sid": "phone", "topic": "아이폰듀오 삼성패널 가격"}, {"title": "갤럭시 S27 울트라에서 최고급 스냅드래곤 칩이 빠지고 엑시노스 칩이 탑재될 가능성이 제기되고 있다.", "summary": "차기 갤럭시 S27 울트라에서 최고급 스냅드래곤 칩을 배제하고 엑시노스 칩이 탑재될 가능성이 제기되고 있다. 퀄컴 칩셋의 가격 인상과 발열 논란에 대응해 자체 AP 비중을 높여 원가 절감을 꾀하려는 의도다. 플래그십 모델의 AP 이원화 또는 자체 칩 전환은 제품 성능 평가와 직결된다. 차기 엑시노스 수율 및 발열 제어 역량 확보가 최우선 선결 과제다.", "source": "geeky-gadgets.com", "date": "2026-10-19 14:56", "url": "https://www.geeky-gadgets.com/samsung-galaxy-s27-ultra-rumors-32/", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시s27울트라 ap이원화 루머"}, {"title": "스마트폰 구입도 부담인데…메모리 대란에 배터리 교체비 인하론", "summary": "메모리 가격 급등으로 올해 글로벌 스마트폰 가격이 약 20% 상승하면서 소비자들이 신제품 구매를 미루고 있다. 그러나 제조사들이 기기 장기 사용을 돕는 저가 배터리 교체 정책을 내놓지 않고 있어 소비자의 부담이 가중된다는 지적이다.", "source": "digitaltoday.co.kr", "date": "2026-10-19 14:50", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=708071", "category": "price", "importance": 4, "sid": "phone", "topic": "메모리 대란 배터리 교체"}, {"title": "Inside the Samsung Galaxy S27 Ultra Chip Drama", "summary": "삼성전자 '갤럭시 S27 울트라'에 탑재될 예정인 스냅드래곤 8 엘리트 젠 6 프로 칩셋의 발열 우려로 인해 삼성전자가 자체 칩셋인 엑시노스 2700으로 교체를 검토하고 있다는 전망이 제기됐다. 플래그십 성능과 직결되는 프로세서 채택 문제를 두고 공급망 내 관측이 엇갈리고 있다.", "source": "geeky-gadgets.com", "date": "2026-10-19 14:30", "url": "https://www.geeky-gadgets.com/samsung-galaxy-s27-ultra-rumors-33/", "category": "quality", "importance": 4, "sid": "phone", "topic": "갤s27 ap"}, {"title": "애플 첫 OLED 맥북 27일 베일 벗는다…삼성·LGD 수혜 기대", "summary": "애플이 유기발광다이오드(OLED)를 탑 <script>

  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
