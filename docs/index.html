더블폰과는 거리가 멀다. 애플이 폴더블 시장에 본격 가세함에 따라 삼성전자의 독점적 지위가 도전받게 되었다. 향후 폴더블폰 시장의 경쟁 구도 심화가 예상된다.", "source": "The Verge", "date": "2026-09-10 07:23", "url": "https://www.theverge.com/tech/992755/apple-iphone-duo-history-of-devices", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 duo 폴더블폰"}, {"title": "애플 첫 폴더블폰 '아이폰 듀오', 10월 23일 국내 출시…329만원부터", "summary": "애플의 첫 폴더블폰 '아이폰 듀오'가 오는 10월 23일 한국을 포함한 전 세계 주요 시장에 공식 출시되며 국내 출고가는 256GB 기준 329만 원부터 시작한다. 애플이 한국 시장을 1차 출시국에 포함시키며 국내 폴더블폰 시장의 판도를 뒤흔들 강력한 공세를 예고했다. 삼성전자가 안방인 국내 시장에서 거센 도전에 직면하게 되었다. 삼성 MX사업의 마케팅 및 방어 전략에 즉각적이고 비상한 대응이 요구되는 중대 사건이다.", "source": "ZDNet Korea", "date": "2026-09-10 07:06", "url": "https://zdnet.co.kr/view/?no=20260910062532", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰듀오 국내출시"}, {"title": "I just touched the iPhone Duo and Apple just solved the foldable crease problem in the mos", "summary": "애플의 아이폰 듀오를 직접 체험한 결과 애플이 폴더블폰의 고질적인 문제인 화면 주름 문제를 독창적인 방식으로 해결했다는 평가가 나왔다. 하드웨어 완성도 측면에서 삼성에게 강력한 위협 요소가 될 수 있다. 기술 혁신 가속화가 요구되는 시점이다.", "source": "TechRadar", "date": "2026-09-10 06:57", "url": "https://news.google.com/rss/articles/CBMia0FVX3lxTE9LX25KYWRFbm5QakZ6ZEdWQkVXemN1V3E2aDQxdzBUN1NjWWFsMklfV1ZUZXktOEtkU0UtVjNTazg4NkpVNUhkZUxxNzZ6dzg5VEFUcEpQT3JtS1UxQzFTRkkySTdlY2FETW1n?oc=5", "category": "quality", "importance": 4, "sid": "phone", "topic": "아이폰듀오 주름"}, {"title": "애플 '에어팟5'…ANC 강화·시리 AI·실시간 번역 지원", "summary": "애플이 액티브 노이즈 캔슬링과 시리 AI, 실시간 번역 기능을 지원하는 오픈형 무선 이어폰 에어팟 5를 공개했습니다. 국내 가격은 19만 9천 원부터 시작합니다. 프리미엄 기능을 보급형 라인까지 확대하여 무선이어폰 시장 지배력을 강화하려는 전략입니다.", "source": "전자신문", "date": "2026-09-10 06:54", "url": "https://www.etnews.com/20260910000007", "category": "launch", "importance": 4, "sid": "tws", "topic": "에어팟 5 출시"}, {"title": "It’s the year of smartphone price hikes", "summary": "애플의 행사 이후 신형 스마트폰 가격 인상이 현실화되었다. 아이폰 18 프로와 프로 맥스가 각각 1,199달러와 1,299달러부터 시작해 전작 대비 100달러 올랐다. 프리미엄 스마트폰 시장 전반의 가격 상승세를 주도하고 있다. 삼성전자의 차기 플래그십 스마트폰 가격 책정에도 중대한 영향을 미칠 전망이다.", "source":  아이폰 듀오에 대해 공개적으로 저격하며 견제구를 날렸습니다. 경쟁사의 시장 진입에 따른 자극적인 마케팅 반응입니다. 폴더블 시장 주도권 방어를 위한 제스처입니다.", "source": "MacRumors", "date": "2026-09-10 05:28", "url": "https://www.macrumors.com/2026/09/09/samsung-mocks-iphone-duo/", "category": "exec", "importance": 4, "sid": "phone", "topic": "삼성 아이폰듀오 조롱"}, {"title": "iPhone 18 Pro's $100 Price Increase is Actually $300 If You Want 1TB Storage", "summary": "아이폰 18 프로의 기본 100달러 가격 인상은 1TB 스토리지 선택 시 실제로는 300달러 인상 효과로 이어집니다. 고용량 모델을 선택하는 소비자의 가격 부담이 커졌습니다. 실질 구매 비용의 가파른 상승입니다.", "source": "MacRumors", "date": "2026-09-10 05:20", "url": "https://www.macrumors.com/2026/09/09/iphone-18-pro-storage-price-hike/", "category": "price", "importance": 4, "sid": "phone", "topic": "아이폰18프로 실차가격"}, {"title": "Google just quietly erased the Pixel Tablet from its store", "summary": "구글이 공식 스토어에서 픽셀 태블릿을 조용히 삭제했다. 이는 태블릿 사업 철수 또는 제품 라인업 단종의 신호탄으로 해석된다. 경쟁사의 태블릿 시장 철수 가능성 시사이다. 단종 조치이나 당사 직접 사고가 아니므로 알람은 false이다.", "source": "Android Authority", "date": "2026-09-10 05:15", "url": "https://www.androidauthority.com/google-pixel-tablet-store-removed-3709484/", "category": "launch", "importance": 4, "sid": "tablet", "topic": "구글 픽셀 태블릿 단종"}], "2026-09-09": [{"title": "Samsung takes another shot at Apple hours before iPhone Ultra/Duo launch", "summary": "삼성전자가 애플의 폴더블폰 출시 직전, 세계에서 가장 가벼운 폴더블폰을 선보이며 애플의 시장 진입을 환영했습니다. 애플의 폴더블폰 참전에 맞서 삼성 MX사업부가 기선 제압을 시도하는 치열한 마케팅전이 전개되고 있습니다.", "source": "Android Authority", "date": "2026-09-09 23:26", "url": "https://www.androidauthority.com/samsung-welcome-to-foldable-ad-3709219/", "category": "launch", "importance": 5, "sid": "phone", "topic": "iphone duo 출시"}, {"title": "美 NSA·CISA·FBI, 중국 AI 6개사 '지식 증류' 경보…\"수십억 토큰 빼갔다\"", "summary": "미국 NSA, CISA, FBI 등 정보기관들이 딥시크, 알리바바, 문샷 AI 등 중국 AI 기업 6곳을 대상으로 산업 규모의 '지식 증류'를 문제 삼으며 대대적인 합동 경보를 발령했다. 대형 모델의 답을 교재 삼아 비용과 시간을 절감하는 증류 기법을 통해 수십억 토큰을 탈취당했다고 지적했다. 미·중 간 AI 기술 패권 전쟁과 지식재산권 보호를 둘러싼 규제가 극한으로 치닫고 있음을 보여준다. 중국 AI 및 메모리 반도체 생태계와 직간접적으로 얽힌 글로벌 IT 공급망 전체에 즉각적이고 중대한 파장을 미치는 function capPerProduct(list,max){

    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        const items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
