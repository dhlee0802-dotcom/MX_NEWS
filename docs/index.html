변경에 대한 기대감이 고조되고 있습니다. 차세대 스마트폰 시장의 주도권을 잡기 위한 개발이 순조롭게 진행 중임을 시사합니다.", "source": "geeky-gadgets.com", "date": "2026-10-21 23:04", "url": "https://www.geeky-gadgets.com/galaxy-s27-ultra-rumors-3/", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시 s27 울트라 출시"}, {"title": "iPhone Duo Reviews Explain Why Device is Both 'Fun' and 'Frustrating'", "summary": "아이폰 Duo에 대한 종합 리뷰에서 대화면의 혁신적인 사용성은 매력적이나 페이스 ID 미탑재, 발열, 초기 앱 최적화 부족 등이 아쉬운 점으로 평가되었다. 애플의 첫 폴더블 기기로서의 높은 완성도와 1세대 제품의 기술적 한계가 공존한다는 결론이다. 시장의 초기 반응이 호평과 불만으로 양분되고 있다. 삼성전자는 6세대에 걸쳐 안정화된 갤럭시 Z 시리즈의 성숙한 완성도를 차별화 포인트로 내세워야 한다.", "source": "MacRumors", "date": "2026-10-21 22:45", "url": "https://www.macrumors.com/review/iphone-duo/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 duo 종합평가"}, {"title": "iPhone Duo adding Apple Pencil support next week with iOS 27.2", "summary": "아이폰 듀오가 다음 주 배포되는 OS 업데이트를 통해 예상보다 빠르게 애플 펜슬 지원을 공식 추가할 예정입니다. 대화면 폴더블 디스플레이를 활용한 필기와 드로잉 기능이 조기에 완성됩니다. 갤럭시 Z 폴드의 핵심 차별화 요소였던 S펜 생산성 기능에 강력한 경쟁자가 등장했습니다. 폴더블 스타일러스 사용자 경험의 비교 우위 점검이 시급합니다.", "source": "9to5Mac", "date": "2026-10-21 22:42", "url": "https://9to5mac.com/2026/10/21/iphone-duo-adding-apple-pencil-support-next-week-with-ios-27-2/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 애플 펜슬"}, {"title": "삼성월렛 머니·포인트, 1년 새 300만명…포인트·해외결제 기능 넓힌다", "summary": "삼성전자의 충전식 간편결제 서비스 ‘삼성월렛 머니·포인트’가 출시 1주년을 맞아 가입자 300만 명을 돌파했다. 삼성전자는 이에 발맞추어 포인트 등급제 도입과 해외 결제 기능 지원 등 신규 기능을 추가하며 서비스 영역을 확장한다.", "source": "straightnews.co.kr", "date": "2026-10-21 22:10", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=313691", "category": "launch", "importance": 4, "sid": "wallet", "topic": "삼성월렛머니포인트 300만"}, {"title": "iPhone Duo review: The future is foldable", "summary": "9to5Mac의 메인 리뷰에서 아이폰 듀오를 가리켜 폴더블의 미래를 증명한 최고의 제품이라고 종합 평가를 내렸습니다. 애플 특유의 하드웨어 마감과 앱 연계성이 폴더블 시장의 표준을 높였다는 분석입니다. 기존 안드로이드 주도의 폴더블 시장 판도가 급변하고 있습니다. 갤럭시 Z 폴드의 하드웨어 슬림화 및 AI 차별화 전략이 더욱 절실해졌습니다.", "source": "9to5Mac", "date": "2026-10-21 21:00", "url": "https://9to5mac.com/2026/10/21/iphone-duo-review/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 미래 폴더블"}, {"title": "This top-selling Samsung phone is finally getting stable One UI 9 with Android 17", "summary": "삼성전자의 글로벌 주력 스마트폰에 안드로이드 17 기반 안정화된 One UI 9 정식 업데이트가 배포되기 시작했다. 플래그십뿐만 아니라 대량 판매 볼륨 모델까지 신속한 OS 업데이트를 확대 적용하고 있다. 장기 사후 지원을 통해 글로벌 고객 만족도와 사용자 경험 완성도를 크게 끌어올렸다. 경쟁사 대비 신속한 소프트웨어 지원을 무기로 안드로이드 시장 리더십을 확고히 해야 한다.", "source": "Android Authority", "date": "2026-10-21 20:31", "url": "https://www.androidauthority.com/samsung-galaxy-a55-stable-one-ui-9-rollout-3725983/", "category": "launch", "importance": 4, "sid": "phone", "topic": "삼성 원유아이 정식 업데이트"}, {"title": "삼성전자 또 일냈다…中비보 제치고 2년여 만에 인도 스마트폰 ‘1위’", "summary": "삼성전자가 중국 비보를 제치고 약 2년여 만에 인도 스마트폰 시장 월간 1위 자리를 탈환했다. 갤럭시 A 시리즈와 S 시리즈의 동반 선전이 주효했다는 분석이다. 세계 최대 스마트폰 시장 중 하나인 인도에서 경쟁력을 회복했다는 점에서 큰 의미가 있다. 현지 맞춤형 판매 전략이 성과로 이어진 결과다.", "source": "sedaily.com", "date": "2026-10-21 20:22", "url": "https://www.sedaily.com/article/20104562", "category": "launch", "importance": 4, "sid": "phone", "topic": "인도 스마트폰 1위"}, {"title": "\"中 낸드 공세 맞선다\"…삼전·닉스, 현지 공장 경쟁력 강화 총력", "summary": "중국 메모리 기업들의 거센 추격에 맞서 삼성전자와 SK하이닉스가 미국의 대중국 반도체 장비 규제 범위 내에서 협의를 거쳐 현지 공정 개선과 최신 장비 도입을 추진하고 있다. 중국 생산거점의 경쟁력을 유지하기 위한 총력전을 펼치고 있다.", "source": "newsis.com", "date": "2026-10-21 20:18", "url": "https://www.newsis.com/view/NISX20261021_0003835506", "category": "exec", "importance": 4, "sid": "memchina", "topic": "메모리반도체 사건"}, {"title": "Video shows French Apple store being emptied by looters", "summary": "프랑스 내 시위 격화로 보르도와 릴 지역의 애플스토어가 시위대에 의해 습격당해 전시 기기들이 대거 약탈당했다. 매장 파손과 함께 단말들이 도난당했으며 애플은 도난 기기에 대해 원격 잠금 및 무력화 조치를 진행할 계획이다. 현지 치안 불안으로 인한 오프라인 유통 채널의 보안 취약성이 노출되었다. 유럽 주요 거점 내 삼성 스토어의 매장 보안 및 도난 방지 프로세스 점검이 필요하다.", "source": "9to5Mac", "date": "2026-10-21 19:53", "url": "https://9to5mac.com/2026/10/21/video-shows-french-apple-store-being-emptied-by-looters/", "category": "quality", "importance": 4, "sid": "phone", "topic": "프랑스 애플스토어 약탈"}, {"title": "애플, BOE 등에 'LCD 아이맥' 개발 자료요청서 발송...'OLED 속도조절론' 부상", "summary": "애플이 BOE를 비롯한 디스플레이 패널 업체들에 신형 액정표시장치 아이맥 패널 개발을 위한 자료요청서를 발송했습니다. 이에 따라 애플 IT 제품군의 유기발광다이오드 전환 속도가 당초 예상보다 조절될 수 있다는 관측이 나오고 있습니다. 데스크톱 및 노트북 패널 시장에서 LCD와 OLED 공급 전략 변화가 예상됩니다.", "source": "ZDNet Korea", "date": "2026-10-21 19:35", "url": "https://zdnet.co.kr/view/?no=20261021182553", "category": "launch", "importance": 4, "sid": "pc", "topic": "애플 엘시디 아이맥 패널 개발요청서 발송"}, {"title": "삼성은 엑시노스 2700에 최적화된 M2700 모뎀을 탑재하여 갤럭시 S27의 전력 효율을 크게 향상시켰습니다.", "summary": "삼성전자가 엑시노스 2700에 최적화된 M2700 모뎀을 탑재하여 갤럭시 S27의 전력 효율을 크게 향상시킬 예정입니다.", "source": "Vietnam.vn", "date": "2026-10-21 19:19", "url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxQbDJ1QTdMU1VRVVVYR2R0b05ObmRsWm5uUHFXbW1Cb2xfaHZfaVlLSDl2MDdMVGl6VlZrMmVMQTJ2ejVvMk94SlBZTkNhb3Z3bUZ2aXF2bFY0NHNweDV6bVRDVnIzSUNWVlFFZ1FrRkJGZENkVnFZTkNNdGVJVU9WRUpSVWRIdE5SU2xMZGZWS1BWbFp3OTk2QmlZYmNaZDVaSWdHTVlqQ0d1eV9LMm1ZUkJhY3A?oc=5", "category": "launch", "importance": 4, "sid": "phone", "topic": "엑시노스 2700 웨이퍼 생산"}, {"title": "새 스마트폰에 헌 D램…메모리 품귀에 저가폰 생존전", "summary": "메모리 가격 폭등으로 저가폰 생존을 위해 중국 저가 스마트폰 업체들이 폐휴대폰에서 D램을 회수해 재장착하고 있다. 반면 중저가 라인업을 유지하는 삼성전자는 마진율이 높은 프리미엄 폰 판매에 집중하는 전략을 취하고 있다. 양사 간 공급망 대응 전략의 대비를 보여준다.", "source": "newstomato.com", "date": "2026-10-21 18:38", "url": "https://www.newstomato.com/ReadNews.aspx?no=1317526&inflow=G", "category": "price", "importance": 4, "sid": "memchina", "topic": "중국 스마트폰 중고 d램 재활용"}, {"title": "삼성전자, D램·낸드 개발 전담팀 꾸렸다…핵심 인력 보상 강화", "summary": "삼성전자 반도체(DS) 부문이 차세대 D램과 낸드플래시 신제품 개발을 전담하는 '코어팀'을 신설하고 핵심 인력에 대한 보상 강화와 조직 간 협업 체계 구축에 착수했다. 이는 메모리 반도체 경쟁 심화 속에서 신제품 개발 속도와 완성도를 높이기 위한 조치다.", "source": "전자신문", "date": "2026-10-21 18:22", "url": "https://www.etnews.com/20261021000449", "category": "exec", "importance": 4, "sid": "memchina", "topic": "삼성전자 ds부문 메모리 신제품 개발 코어팀 신설"}, {"title": "Micron says rival DRAM design has ‘fundamental problems’: targets next-gen memory with 3D ", "summary": "마이크론이 경쟁사의 DRAM 설계에 근본적인 문제가 있다고 지적하며 3D 구조를 적용한 차세대 메모리 기술을 공개했다. 회사는 1-delta DRAM과 G11 낸드 기술을 2027년 하반기에 본격 양산할 계획이며 프로세서 위에 메모리를 직접 올리는 수직형 HBM도 소개했다.", "source": "msn.com", "date": "2026-10-21 18:18", "url": "https://www.msn.com/en-us/news/other/micron-says-rival-dram-design-has-fundamental-problems-targets-next-gen-memory-with-3d-dram-new-chips-planned-for-2027/ar-AA2fLaAX", "category": "launch", "importance": 4, "sid": "memchina", "topic": "마이크론 차세대 메모리 3d 기술"}, {"title": "Samsung’s first Android XR glasses face a design problem its competitor already solved", "summary": "삼성전자의 첫 번째 안드로이드 XR 글래스가 경쟁사 메타-레이밴이 극복한 일상용 안경 형태의 디자인 난제에 직면했다는 외신 지적이 나왔다. 첨단 광학 하드웨어 탑재도 중요하지만 대중 수용성을 위해서는 얇고 가벼운 안경 형태를 구현하는 것이 핵심 과제다. 무거운 폼팩터와 심미성 부족은 초기 시장 흥행의 큰 걸림돌이 될 수 있다. 인체공학적 경량화 설계와 패션성을 동시에 확보하는 폼팩터 완성이 요구된다.", "source": "Android Authority", "date": "2026-10-21 18:00", "url": "https://www.androidauthority.com/samsung-smart-glasses-face-problem-ray-ban-meta-solved-3725475/", "category": "launch", "importance": 4, "sid": "glasses", "topic": "삼성 xr 글래스 디자인 난제"}, {"title": "[르포] 백악관 스피커부터 애비 로드 녹음실까지…강남서 만난 '사운드 레전드'", "summary": "삼성전자가 하만 산하 브랜드들의 기념일을 맞아 특별 오디오 전시 행사 '사운드 레전드'를 서울 강남에서 개최합니다. 역사적인 오디오 명기들을 전시하며 하만의 음향 헤리티지를 고객들에게 전달할 계획입니다. 프리미엄 오디오 생태계를 아우르는 삼성전자의 오디오 브랜드 역량 강화 행보입니다.", "source": "ZDNet Korea", "date": "2026-10-21 18:00", "url": "https://zdnet.co.kr/view/?no=20261021161805", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성전자 하만 오디오 사운드레전드 행사 개최"}, {"title": "Loop Capital Cuts Apple Rating Over iPhone Sales Outlook", "summary": "루프 캐피털이 글로벌 수요 둔화와 교체 주기 장기화를 이유로 애플에 대한 투자의견을 전격 하향 조정했다. 신제품 출시에도 불구하고 스마트폰 시장 전반의 침체로 인해 아이폰 판매 전망이 불투명하다는 평가다. 프리미엄 플래그십 시장의 수요 회복 속도에 대한 금융권의 회의론이 반영되었다. 4분기 글로벌 스마트폰 시장의 실판매 동향을 면밀히 분석해야 한다.", "source": "MacRumors", "date": "2026-10-21 17:38", "url": "https://www.macrumors.com/2026/10/21/loop-capital-cuts-apple-rating-over-iphone-sales-outlook/", "category": "other", "impor urope-3725389/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 갤럭시 a36 원유아이 9"}, {"title": "트럼프, 연방기관서 中딥시크 퇴출…“민감 데이터가 中 이전 우려 있어”", "summary": "미국 국토안보부가 연방정부 기관 내에서 중국 AI 기업 딥시크의 제품 사용을 전면 금지하는 지침을 발표했다. 민감 데이터의 중국 이전 우려와 사이버보안법에 근거한 조치로, IT 시스템에서 해당 제품을 즉시 제거해야 한다. 미중 기술 패권 경쟁과 AI 보안 규제가 더욱 강화되고 있음을 보여준다.", "source": "전자신문", "date": "2026-10-20 17:28", "url": "https://www.etnews.com/20261020000374", "category": "policy", "importance": 5, "sid": "memchina", "topic": "딥시크 연방기관 퇴출"}, {"title": "운동하다 넘어진 남성…바지 주머니 속 휴대전화 '폭발'", "summary": "중국에서 배드민턴을 치던 남성이 넘어지는 충격으로 바지 주머니에 있던 휴대전화가 폭발해 중증 화상을 입는 사고가 발생했다. 해당 휴대전화는 구입한 지 두 달밖에 되지 않은 제품으로 확인되었다. 현장 CCTV 영상이 공개되면서 기기 안전성에 대한 우려가 커지고 있다. 소비자 안전과 직결된 사안으로 즉각적인 원인 파악이 필요하다.", "source": "전자신문", "date": "2026-10-20 16:58", "url": "https://www.etnews.com/20261020000366", "category": "quality", "importance": 5, "sid": "phone", "topic": "휴대전화 폭발 사고"}, {"title": "[Biz&Law] 삼성전자, 美 '버즈 프로' 특허소송 종결…웨어러블 리스크 일...", "summary": "버즈 프로와 스마트폰 을 연결하는 ' 갤럭시 웨어러블(Galaxy Wearable)' 애플리케이션(앱)과 공간 음향 최적화 기술인 '스페이스핏(SpaceFit)' 효과도 주요 침해 사례로 지목했다. 다만 이번 사건은 특허침해 성립 여부와...", "source": "the-biz.co.kr", "date": "2026-10-20 16:40", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=729596", "category": "quality", "importance": 5, "sid": "tws", "topic": ""}, {"title": "“귀에 꽂지 말고 걸치세요”…삼성이 만든 새로운 이어폰 보니", "summary": "삼성전자가 귀에 꽂지 않고 걸치는 혁신적인 디자인의 클립형 무선 이어폰 '갤럭시 버즈 온'을 선보였습니다. AI를 활용해 착용감을 개선하고 기존 오픈형 이어폰의 약점이었던 저음 부족과 소리 새는 현상을 대폭 보완한 것이 특징입니다.", "source": "mk.co.kr", "date": "2026-10-20 16:28", "url": "https://www.mk.co.kr/news/business/12180528", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 디자인"}, {"title": "삼성전자 11월 'AI 글래스' 전격 출시, 노태문 구글과 손잡고 메타 아성 도전장", "summary": "삼성전자가 오는 11월 노태문 사장을 필두로 구글과 손잡고 'AI 글래스'를 전격 출시하여 메타의 아성에 도전장을 던진다. 확장현실(XR) 및 AI 웨어러블 시장의 주도권을 잡기 위한 초강수다. 글로벌 빅테크 간의 치열한 폼팩터 전쟁이 예고된다.", "source": "businesspost.co.kr", "date": "2026-10-20 15:12", "url": "https://www.busi ltOEp5Rkdycm0zdVFrRnRRNDc3elZZZzFNTV9qNk5ObF9lT0RRN3JkbFgtTW81Z01HbWRsUnFYWlVoR0tMTlAyYw?oc=5", "category": "policy", "importance": 4, "sid": "memchina", "topic": "oled 패널 공급"}, {"title": "삼성 첫 오버이어 헤드폰 첫 인증 포착…애플 '에어팟 맥스' 정조준", "summary": "삼성전자의 첫 오버이어 무선 헤드폰 모델이 규제 인증을 통과했다. 애플의 에어팟 맥스와 소니 제품이 주도하는 프리미엄 오디오 시장에 도전장을 던지는 제품이다. 갤럭시 모바일 생태계의 사운드 경험을 헤드폰 영역까지 확장하는 첫 마일스톤이다. 하이엔드 음향 액세서리 포트폴리오 강화 측면에서 중요한 의미를 갖는다.", "source": "kbench.com", "date": "2026-10-19 16:31", "url": "https://kbench.com/?q=node/282589", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성오버이어헤드폰 인증"}, {"title": "애플 첫 폴더블 배송 지연…삼성 갤럭시 Z 폴드8 반사이익 얻나 By EBN", "summary": "애플의 첫 폴더블 스마트폰 사전 예약 배송이 내년으로 지연되면서 삼성 갤럭시 Z 폴드8이 반사이익을 얻을 것이라는 분석이다. 애플 신제품의 대기 기간이 길어지자 즉시 구매 가능한 삼성 플래그십 폴더블로 수요가 분산될 가능성이 제기된다. 프리미엄 폴더블 시장에서 당사의 안정적인 공급망과 양산 역량이 부각되고 있다. 공급 지연 틈새를 활용한 타깃 마케팅을 적극 추진할 만하다.", "source": "ebn.co.kr", "date": "2026-10-19 15:41", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1728305", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시z폴드8 반사이익"}, {"title": "삼성폰 또 '급 나누기'…갤S27 플러스, 기존 기능도 뺀다", "summary": "삼성전자가 차기 갤럭시 S27 플러스 모델에서 기존에 지원하던 UWB 기능을 제외할 가능성이 제기되며 급 나누기 논란이 일고 있다. 원가 폭등 속에서 부품 절감을 통해 가격 인상폭을 억제하려는 조치로 풀이된다. 그러나 기존 탑재 기능 삭제에 따른 플러스 모델 구매층의 불만이 예상된다. 라인업 간 기능 차별화와 원가 절감 사이의 정교한 밸런스가 요구된다.", "source": "뉴스1", "date": "2026-10-19 15:27", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE5Rci16RkFVWG9IOGk0TUI0RVl5cGpCVkcyajV5dGRrVVdXWk9tVHRWTUlWbVdEaml4WGJieHpSWGR0WVJwTUxGWUdKbk1MVUh2S3QzUDBNQjIzUQ?oc=5", "category": "quality", "importance": 4, "sid": "phone", "topic": "갤럭시s27플러스 uwb제외 루머"}, {"title": "폴더블폰에 “싸구려”라던 애플…삼성 패널 쓰고 가격은 100만원 더", "summary": "폴더블폰의 완성도를 폄하하던 애플이 삼성디스플레이 패널을 적용한 아이폰 듀오를 비싸게 책정해 논란이다. 초고가 가격 정책에도 불구하고 충성 고객층의 초기 수요가 몰리며 가격 저항을 무력화하고 있다. 애플 브랜드 파워가 고가 폴더블 시장에서도 통함을 보여주는 대목이다. 당사 플래그십 폴더블의 프리미엄 가치 제고와 가격 전략 재검토가 필요하다.", "source": "에너지경제신문", "date": "2026-10-19 15:04", "url": "https://news.google.com/rss/articles/CBMiY <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}${srchLink(a)}</div></div>`;
}
function srchLink(a){
  if(!((a.url||"").includes("news.google.com")))return"";
  const q=encodeURIComponent('"'+(a.title||"").slice(0,80)+'"');
  return ` · <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700" title="링크가 차단될 때 제목으로 원문 검색">원문 검색</a>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
