 "category": "launch", "importance": 2, "wl": false, "topic": "삼성 ifa 혁신상", "alert": false}, {"title": "Scientists Discover a Serious Problem With Sleep Trackers - ScienceAlert", "summary": "사이언스얼럿은 과학자들이 수면 추적기의 측정 정확도에 대한 심각한 문제를 발견했다고 보도했습니다. 웨어러블 기기의 수면 및 건강 데이터 신뢰성에 대한 우려를 제기합니다.", "source": "ScienceAlert", "date": "2026-09-06 20:01", "url": "https://www.sciencealert.com/scientists-discover-a-serious-problem-with-sleep-trackers", "category": "quality", "importance": 2, "wl": false, "topic": "수면 추적기 정확도 문제 제기", "alert": false}], "phone": [{"title": "Motorola and Google foldables are quietly beating Samsung where it counts", "summary": "모토로라와 구글의 폴더블 스마트폰들이 소비자들이 진정으로 중요하게 여기는 핵심 폴더블 기능에 집중하며 삼성을 조용히 앞서고 있다는 평가가 나온다. 삼성이 놓치고 있는 사용자 중심의 폼팩터 혁신 포인트를 경쟁사들이 파고들고 있다는 지적이다. 글로벌 폴더블폰 시장에서 삼성의 독주 체계가 흔들릴 수 있는 경고등이 켜졌다. 삼성 MX사업부 차원의 제품 완성도 제고와 혁신 전략 재점검이 시급하다.", "source": "Android Authority", "date": "2026-09-06 19:30", "url": "https://www.androidauthority.com/motorola-google-foldables-beat-samsung-3704932/", "category": "strategy", "importance": 4, "wl": true, "topic": "모토로라 구글 폴더블", "alert": false}, {"title": "I want better Samsung phones, but these new sales numbers show why we won’t get them", "summary": "최근 발표된 삼성 스마트폰의 새로운 판매 수치를 분석한 결과, 삼성전자가 하드웨어 혁신을 강하게 밀어붙일 동력이 부족하다는 지적이 제기되고 있다. 안정적인 판매량에 안주하여 파괴적인 혁신 시도가 줄어들고 있다는 비판이다. 글로벌 스마트폰 시장에서 경쟁사들의 추격이 거세지는 가운데 안주할 경우 점유율 하락으로 이어질 수 있다. 삼성 MX사업부의 중장기 제품 로드맵에 대한 뼈아픈 반성과 혁신 가속화가 요구된다.", "source": "Android Authority", "date": "2026-09-06 18:30", "url": "https://www.androidauthority.com/samsung-record-sales-keep-us-from-better-phones-3704357/", "category": "strategy", "importance": 4, "wl": true, "topic": "삼성 스마트폰 판매량", "alert": false}, {"title": "Here’s how iPhone Ultra’s form factor could compare to other Apple products", "summary": "애플이 첫 폴더블 아이폰인 '아이폰 울트라'를 5.5인치 외장 디스플레이와 7.6인치 내장 디스플레이 사양으로 이달 공개할 예정이다. 지난 7월 삼성이 갤럭시 Z 폴드 시리즈를 선보인 가운데 애플의 시장 진입이 본격화되고 있다. 폴더블폰 시장의 판도를 바꿀 메이저 플레이어의 참전으로 경쟁이 치열해질 전망이다. 삼성 MX사업부의 즉각적이고 차별화된 대응 전략 수립이 필수적이다.", "source": "9to5Mac", "date": "2026-09-06 04:15", "url": "https://9to5mac.com/2026/09/05/iphone-ultra-form-factor-comparison/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 폼팩터", "alert": false}, {"title": "I Can’t Put the Galaxy Z Fold 8 Down. Can Apple’s Foldable Change That?", "summary": "삼성전자의 콤팩트하고 다재다능한 폴더블폰 '갤럭시 Z 폴드 8'이 뛰어난 사용성으로 호평을 받는 가운데, 곧 출시될 애플의 아이폰 울트라가 이러한 아성을 무너뜨릴 수 있을지 관심이 집중된다. 삼성이 개척한 폴더블 시장에서 양사의 진검승부가 예고되고 있다. 하반기 스마트폰 시장의 가장 뜨거운 화두다. 삼성 MX사업부의 시장 수성 전략과 차별화 마케팅에 총력이 필요한 시점이다.", "source": "CNET", "date": "2026-09-05 22:00", "url": "https://www.cnet.com/tech/mobile/i-cant-put-the-galaxy-z-fold-8-down-can-apples-foldable-change-that/", "category": "strategy", "importance": 4, "wl": true, "topic": "갤럭시 z 폴드 8 평가", "alert": false}, {"title": "This $500 Android phone shows what Google still gets wrong with the Pixel 11 camera", "summary": "500달러 대의 중저가 안드로이드 폰이 구글 픽셀 11 프리미엄 모델에는 빠진 두 가지 기본 카메라 기능을 탑재해 차별화를 꾀하고 있다. 고가 플래그십 모델이 놓치고 있는 실용적 기능들을 중저가 폰들이 채택하면서 경쟁 구도에 변수가 되고 있다. 가성비 스마트폰 시장에서 스펙 경쟁의 초점이 변화하고 있음을 보여준다. 향후 삼성 갤럭시 A 시리즈의 제품 기획에 시사점을 준다.", "source": "Android Authority", "date": "2026-09-06 20:00", "url": "https://www.androidauthority.com/google-pixel-11-cheap-phone-camera-features-3703907/", "category": "launch", "importance": 3, "wl": true, "topic": "픽셀 11 카메라", "alert": false}, {"title": "iPhone Handoff will seamlessly share one number between two phones", "summary": "애플이 두 대의 아이폰 간에 하나의 전화번호를 매끄럽게 공유할 수 있는 '아이폰 핸드오프' 기능을 선보였다. 멀티 디바이스 환경에서 사용자 편의성을 극대화하기 위한 생태계 연동 기능이다. 애플 사용자들의 디바이스 락인 효과를 더욱 강화할 것으로 보인다. 향후 삼성의 갤럭시 에코시스템 연동성 강화에 경쟁 압박으로 작용할 전망이다.", "source": "The Verge", "date": "2026-09-06 05:53", "url": "https://www.theverge.com/tech/990868/iphone-handoff-ios-27", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 핸드오프", "alert": false}, {"title": "iPhone 18 Pro: Everything M6 Tells Us About the A20 Chip", "summary": "차기 아이폰 18 프로에 탑재될 A20 칩의 성능과 아키텍처 방향성이 M6 칩 관련 정보를 통해 전망되고 ndroid just got an iPhone feature I’ve waited a year for — how to use it", "summary": "안드로이드용 구글 포토에 아이폰에서 먼저 제공되어 호평을 받았던 수동 사진 스택(Manual Photo Stacks) 기능이 드디어 도입됐다. 플랫폼 간의 기능적 격차가 빠르게 좁혀지며 사용자 편의성이 상향 평준화되고 있다. 모바일 소프트웨어 기능 경쟁의 트렌드를 보여준다. 향후 삼성 갤러리 앱의 기능 개선에 참고할 만한 사안이다.", "source": "Android Authority", "date": "2026-09-05 18:30", "url": "https://www.androidauthority.com/google-photos-android-app-manual-stacks-how-to-3707900/", "category": "launch", "importance": 2, "wl": true, "topic": "구글 포토 스택", "alert": false}, {"title": "This Android smartphone has a detachable GoPro-like camera, and we tried it!", "summary": "고프로처럼 카메라 모듈을 본체에서 완전히 분리해 독립적으로 사용할 수 있는 독특한 러기드 안드로이드 스마트폰이 등장해 이목을 끌고 있다. 폼팩터의 고정관념을 깬 실험적인 하드웨어 시도로 틈새시장을 공략하고 있다. 극한의 환경이나 특수 목적용 모바일 기기의 진화를 보여준다. 향후 모바일 디바이스의 폼팩터 확장 가능성에 참고할 수 있다.", "source": "Android Authority", "date": "2026-09-05 16:07", "url": "https://www.androidauthority.com/ulefone-rugone-xsnap-7-pro-hands-on-3707961/", "category": "launch", "importance": 2, "wl": true, "topic": "탈착식 카메라 스마트폰", "alert": false}, {"title": "Competitive Pokémon is on phones now, but you still need a Switch to become a champion", "summary": "컴피티티브 포켓몬 배틀이 스마트폰으로 영역을 넓혔으나 최고 수준의 대회에 참가하려면 여전히 닌텐도 스위치가 필요하다. 모바일 진입 장벽을 낮춰 대중성을 확보하는 동시에 하드코어 유저는 스위치로 연계하는 전략을 취하고 있다. 모바일과 콘솔 간의 크로스 플랫폼 활용 사례를 보여준다. 향후 모바일 게이밍 생태계 확장에 참고할 만하다.", "source": "The Verge", "date": "2026-09-06 22:00", "url": "https://www.theverge.com/games/990691/competitive-pokemon-champions-mobile-tournament-accessibility", "category": "launch", "importance": 1, "wl": true, "topic": "포켓몬 스마트폰", "alert": false}, {"title": "The best Android alarm app isn’t on the Play Store. Here’s how to install it", "summary": "플레이스토어에 등록되지 않은 독특한 방식의 서드파티 클럭 앱 설치 방법이 안드로이드 사용자들 사이에서 공유되고 있다. 기본 알람 앱의 한계를 극복하려는 틈새 유틸리티 수요를 보여준다. 사용자 맞춤형 커스텀 기능을 선호하는 마니아층의 성향을 반영한다. 향후 기본 시계 앱의 기능 고도화에 간접적인 참고가 된다.", "source": "Android Authority", "date": "2026-09-06 19:00", "url": "https://www.androidauthority.com/chrono-alarm-clock-       const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
