://www.androidauthority.com/samsung-galaxy-z-fold-8-ddi-demand-ramp-up-3704985/", "category": "launch", "importance": 5, "wl": true, "topic": "갤럭시 z 폴드 8 판매"}, {"title": "“통화 중 카드정보 탈취”…그룹아이비, 신종 NFC 악성코드 발견", "summary": "전화 통화 중 스마트폰을 원격 제어하여 비접촉식 카드 정보를 실시간으로 탈취하는 신종 NFC 중계형 악성코드 '윈드릴레이'가 발견됐다. 공격자는 감염된 스마트폰의 NFC 기능을 악용해 원격의 가짜 결제 단말기로 카드 데이터를 전송한다. 모바일 금융 보안 및 결제 시스템의 취약점을 파고드는 새로운 위협으로 각별한 주의가 요구된다.", "source": "전자신문", "date": "2026-09-02 16:28", "url": "https://www.etnews.com/20260902000401", "category": "quality", "importance": 4, "wl": true, "topic": "윈드릴레이 악성코드"}, {"title": "New iPhone Ultra details arrive for specs, multitasking, launch timing, more", "summary": "다음 주 애플의 9월 이벤트에서 공개될 예정인 아이폰 울트라에 대한 사양, 멀티태스킹, 출시 시기 등의 새로운 세부 정보가 공개되었다. 마크 거먼과의 인터뷰를 통해 차세대 기기의 윤곽이 드러났다. 시장의 기대를 모으는 핵심 플래그십 제품이다. 경쟁사인 삼성전자의 즉각적인 대응 전략 수립이 요구된다.", "source": "9to5Mac", "date": "2026-09-02 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 출시"}, {"title": "Galaxy S25 gets one of the S26’s coolest camera tricks with One UI 9 Beta 1", "summary": "갤럭시 S25가 원 UI 9 베타 1을 통해 차기작 갤럭시 S26의 가장 멋진 카메라 기능 중 하나인 수평 잠금(Horizontal Lock) 기능을 물려받았다. 소프트웨어 업데이트를 통해 구형 플래그십 모델의 카메라 사용성이 대폭 향상되었다. 삼성전자가 최신 AI 및 카메라 기능을 기존 기기로 확장하고 있다. 사용자 경험의 연속성을 강화하는 전략이다.", "source": "Android Authority", "date": "2026-09-02 03:20", "url": "https://www.androidauthority.com/galaxy-s25-one-ui-9-beta-horizontal-camera-lock-3705704/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s25 원유아이 9 베타"}, {"title": "Apple Teases 'Huge Launch' Next Week", "summary": "애플이 다음 주 개최될 대규모 신제품 런칭 행사를 공식적으로 예고했다. 혁신적인 신기기들이 대거 공개될 것으로 기대를 모으고 있다. 하반기 글로벌 모바일 및 IT 시장의 최대 이벤트다. 경쟁사인 삼성전자의 긴장감이 최고조에 달하고 있다.", "source": "MacRumors", "date": "2026-09-02 03:03", "url": "https://www.macrumors.com/2026/09/01/apple-teases-huge-launch-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 신제품 출시"}, {"title": "Here are iPhone 18 Pro’s new colors, says leaker", "summary": "다음 주 공개를 앞둔 아이폰 18 프로에 대해 신뢰할 수 있는 웨이보 유출자가 새롭게 선보일 세 가지 색상을 언급했다. 매년 출시 전 디자인과 색상 유출은 소비자들의 구매 의향에 큰 영향을 미친다. 혁신적인 변화보다는 마케팅적 요소가 부각될 수 있다. 삼성전자의 플래그십 마케팅 전략에도 참고가 되는 정보이다.", "source": "9to5Mac", "date": "2026-09-01 22:45", "url": "https://9to5mac.com/2026/09/01/here-are-iphone-18-pros-new-colors-says-leaker/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 출시"}, {"title": "Breaking: Galaxy S26 series gets eighth One UI 9 beta release (!!)", "summary": "갤럭시 S26 시리즈를 대상으로 무려 8번째 원 UI 9 베타 버전이 예외적으로 배포되는 등 소프트웨어 테스트가 전례 없이 집중적으로 진행되고 있다. 차세대 플래그십 스마트폰의 완성도를 극대화하기 위해 소프트웨어 안정화 작업에 총력을 기울이고 있는 모습이다. 정식 릴리즈를 앞둔 막바지 담금질이 한창이다. 경쟁사 대비 한 발 앞선 소프트웨어 경험을 구축하려는 전략이다.", "source": "Android Authority", "date": "2026-09-01 18:16", "url": "https://www.androidauthority.com/samsung-galaxy-s26-one-ui-9-beta-8-3705321/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s26 원유아이 9 베타"}, {"title": "Breaking: Galaxy S25 series joins the One UI 9 beta program party", "summary": "갤럭시 S25 시리즈가 원 UI 9 베타 프로그램에 전격 합류했다. 그동안 갤럭시 S26 전용으로 제한되었던 베타 프로그램이 수개월 만에 구형 플래그십 모델로 확대 적용되는 것이다. 기존 사용자들의 소프트웨어 경험 개선과 최신 기능 제공 측면에서 중요한 의미를 갖는다. 삼성전자의 신속한 소프트웨어 지원 정책 변화를 보여주는 사례다.", "source": "Android Authority", "date": "2026-09-01 17:38", "url": "https://www.androidauthority.com/samsung-galaxy-s25-one-ui-9-beta-1-3705298/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s25 원유아이 베타"}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "갤럭시 S27 및 S27 플러스 모델에 의미 있는 줌 카메라 업그레이드가 적용될 가능성이 제기됐다. 유출 정보에 따르면 이들 모델은 S27 프로와 동일한 3배 망원 카메라 시스템을 탑재할 것으로 보인다. 플래그십 라인업 간의 카메라 성능 격차가 조정되면서 사용자 선택 폭이 넓어질 전망이다. 이는 차세대 스마트폰 시장에서 카메라 경쟁력을 강화하려는 전략의 일환으로 풀이된다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "quality", "importance": 4, "wl": true, "topic": "갤럭시 s27 카메라"}, {"title": "Apple could discontinue 10+ popular products next week", "summary": "애플이 다음 주 대규모 9월 런칭 이벤트를 개최함에 따라 10개 이상의 인기 현행 제품들이 단종될 것으로 예상된다. 신제품 자리를 마련하고 라인업을 간소화하기 위한 필수적인 조치다. 구형 모델의 퇴출은 시장 재고 정리와 직결된다. 경쟁사 역시 신제품 출시에 따른 단종 전략을 주시해야 한다.", "source": "9to5Mac", "date": "2026-09-01 01:04", "url": "https://9to5mac.com/2026/08/31/apple-could-discontinue-10-popular-products-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 구형제품 단종"}, {"title": "There’s already another tri-fold phone on the market, and it’s not from Samsung", "summary": "삼성전자가 아닌 새로운 삼중 폴더블(트라이폴드) 스마트폰이 시장에 등장했다. 화웨이가 메이트 XT 2를 출시하며 삼중 폴더블 스마트폰 시장 규모가 한층 더 확장되었다. 폼팩터 혁신 경쟁이 치열해지는 가운데 경쟁사의 추격이 가속화되고 있다. 이는 향후 삼성전자의 차세대 폼팩터 개발 전략에 큰 압박으로 작용할 전망이다.", "source": "Android Authority", "date": "2026-08-31 22:57", "url": "https://www.androidauthority.com/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 4, "wl": true, "topic": "화웨이 메이트 xt 2"}, {"title": "Google Messages has a weird bug that’s sending old texts to random people (Updated: Fix in", "summary": "구글 메시지 앱에서 오래된 옛날 대화 내용이 엉뚱한 사람들에게 무작위로 전송되는 기괴한 버그가 발생했다. 사용자들의 프라이버시 침해와 소통 혼란을 야기하는 심각한 결함이다. 구글은 즉각적인 원인 파악과 수정 작업에 착수했다. 모바일 커뮤니케이션 앱의 안정성 신뢰도에 타격을 입었다.", "source": "Android Authority", "date": "2026-09-02 16:32", "url": "https://www.androidauthority.com/google-messages-old-texts-bug-3704732/", "category": "quality", "importance": 3, "wl": true, "topic": "구글 메시지 버그"}, {"title": "Tim Cook handed $47mn pay deal as Apple’s executive chair", "summary": "애플의 전 CEO 팀 쿡이 4,700만 달러 규모의 보상 패키지를 받으며 집행이사직을 맡게 되었다. 이는 전직 CEO의 역할 확대를 시사하며 후임자인 존 터너스는 5,800만 달러를 받는다. 애플의 리더십 교체 과정에서 거액의 보상이 책정되었다. 향후 경영 체제 개편에 관심이 쏠린다.", "source": "Financial Times Tech", "date": "2026-09-02 08:38", "url": "https://www.ft.com/content/8efaf87c-e5bf-4cfe-8403-16690ed4c265?syn-25a6b1a6=1", "category": "exec", "importance": 3, "wl": true, "topic": "아이폰 임원 사건"}, {"title": "iPhone Air Review: One Year With Apple's Super Thin $999 iPhone", "summary": "애플의 초슬림 999달러 아이폰 에어를 출시 후 1년간 사용해 본 리뷰가 공개되었다. 혁신적인 두께와 디자인으로 주목받았던 모델의 장단점이 재조명되고 있다. 폼팩터 슬림화 트렌드의 가능성과 한계를 보여주는 사례다. 향후 신제품 개발에 시사하는 바가 크다.", "source": "MacRumors", "date": "2026-09-02 08:35", "url": "https://www.macrumors.com/2026/09/01/iphone-air-one-year-review/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 에어 리뷰"}, {"title": "Gemini and Find Hub are teaming up to remember where you put your passport", "summary": "제미나이와 파인드 허브가 협력하여 여권, 예비 키, 출생증명서 등 중요한 물건을 어디에 두었는지 기억해 주는 기능을 선보인다. 인공지능과 위치 추적 생태계가 결합하여 일상 속 편의성을 극대화했다. 분실물 찾기 기능이 AI 비서와 연동되어 더욱 스마트해졌다. 사용자들의 실생활 유용성을 높인 업데이트다.", "source": "Android Authority", "date": "2026-09-02 03:14", "url": "https://www.androidauthority.com/gemini-find-hub-item-locations-3705589/", "category": "launch", "importance": 3, "wl": true, "topic": "제미나이 파인드허브 연동"}, {"title": "5 new features coming to your phone with the September 2026 Android Drop", "summary": "9월 안드로이드 기능 드롭을 통해 파인드 허브의 물건 기억 기능부터 구글 메시지 내 구글 킵 직접 사용까지 5가지 새로운 기능이 스마트폰에 추가된다. 구글 에코시스템 전반의 연동성이 대폭 강화되었다. 매달 정기적인 기능 업데이트로 사용자 경험을 지속적으로 업그레이드하고 있다. 모바일 플랫폼 경쟁력 제고를 위한 조치다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/september-2026-android-drop-3705528/", "category": "launch", "importance": 3, "wl": true, "topic": "안드로이드 9월 기능 드롭"}, {"title": "Google’s Guided Vision turns Gemini Live into a real-world visual guide", "summary": "구글의 가이디드 비전 기능이 제미나이 라이브에 도입되어 현실 세계를 시각적으로 안내하는 가이드 역할을 수행하게 된다. 사용자가 찾지 못하는 물건이나 길을 찾는 데 실시간 시각 정보를 활용해 도움을 준다. AI 비서의 활용 영역이 시각 인식 분야로 확장되었다. 일상생활에서의 보조 기능이 한층 강화됐다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/gemini-live-guided-vision-2-3705480/", "category": "launch", "importance": 3, "wl": true, "topic": "제미나이 가이디드 비전"}, {"title": "Your Pixel 11 will soon have a fix for the static noise ruining your videos", "summary": "구글은 픽셀 11 비디오 촬영 시 발생하는 정적 소음(스태틱 노이즈) 버그를 공식 인정하고 조만간 수정 패치를 배포하겠다고 약속했다. 최신 플래그십 스마트폰에서 발생한 하드웨어 및 소프트웨어 결함으로 사용자 불만이 제기되었다. 신속한 결함 보완이 브랜드 신뢰 유지의 관건이다. 카메라 품질 안정화 작업이 진행 중이다.", "source": "Android Authority", "date": "2026-09-02 02:03", "url": "https://www.androidauthority.com/pixel-11-static-noise-fix-coming-3705634/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 비디오 노이즈 버그"}, {"title": "Take a look: Users are now getting Android’s convoluted sideloading process, and everyone ", "summary": "안드로이드 소유자들이 구글의 새로운 사이드로딩(앱 외부 설치) 프로세스를 경험하고 있으며 스크린샷을 통해 더 자세한 절차가 공개되었다. 보안과 사용자 확인 절차가 한층 더 강화된 구조다. 외부 앱 설치에 대한 규제와 통제가 엄격해지고 있다. 오픈소스 플랫폼의 개방성과 보안의 균형을 맞추려는 시도다.", "source": "Android Authority", "date": "2026-09-01 22:51", "url": "https://www.androidauthority.com/android-sideloading-apps-flow-screenshots-3705423/", "category": "policy", "importance": 3, "wl": true, "topic": "안드로이드 사이드로딩 절차"}, {"title": "Pixel 11’s big modem switch hasn’t ended familiar connectivity complaints", "summary": "픽셀 11의 대대적인 모뎀 교체에도 불구하고 초기 소유자들 사이에서 와이파이, 5G, 블루투스 등 친숙한 연결성 불만 민원이 여전히 제기되고 있다. 하드웨어 부품 변경에도 불구하고 고질적인 통신 품질 문제가 완전히 해소되지 않았다. 플래그십 스마트폰의 기본기 신뢰도에 흠집을 냈다. 구글의 추가적인 소프트웨어 최적화가 요구된다.", "source": "Android Authority", "date": "2026-09-01 22:21", "url": "https://www.androidauthority.com/pixel-11-connectivity-issues-3705354/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 연결성 불만"}, {"title": "This new Ultra phone has a rear speaker, a take on HiLight, and that iPhone 18 color", "summary": "후면 스피커, 하이라이트 기능, 아이폰 18 컬러 등을 차용한 새로운 울트라 스마트폰이 공개되었다. 스냅드래곤 8 엘리트 젠 5 칩, 185Hz 화면, 다기능 카메라를 탑재해 강력한 하드웨어 스펙을 자랑한다. 고성능 플래그십 스마트폰 시장에서 차별화를 꾀하는 제품이다. 경쟁사 제품들과의 스펙 경쟁이 치열해지고 있다.", "source": "Android Authority", "date": "2026-09-01 21:45", "url": "https://www.androidauthority.com/poco-f9-pro-and-f9-ultra-3704280/", "category": "launch", "importance": 3, "wl": true, "topic": "신형 울트라폰 스펙"}, {"title": "Google’s new Extreme Charging on the Pixel 11 Pro XL has a heat problem", "summary": "픽셀 11 프로 XL에 도입된 새로운 익스트림 충전(Extreme Charging) 기능이 충전 속도를 5분 단축시키는 대신 심각한 발열 문제를 유발하고 있는 것으로 나타났다. 고속 충전의 이점과 기기 발열로 인한 하드웨어 수명 단하 우려가 맞서고 있다. 안전성과 성능 최적화 사이의 딜레마를 보여준다. 사용자들의 불만이 제기되는 대목이다.", "source": "Android Authority", "date": "2026-09-01 19:30", "url": "https://www.androidauthority.com/pixel-11-pro-extreme-charging-tested-heat-problem-3703479/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 프로 발열 문제"}, {"title": "The Galaxy S26 FE is the wrong Samsung phone to buy right now", "summary": "갤럭시 S26 FE가 준수한 성능을 갖추고 있기는 하지만 지금 시점에서 구매하기에는 적절한 선택이 아니라는 분석이 제기되었다. 제품의 포지셔닝과 가격 책정 면에서 아쉬움이 지적된다. 플래그십과 보급형 사이의 애매한 위치가 구매 매력을 떨어뜨린다. 소비자들에게 현명한 구매 가이드를 제시하는 내용이다.", "source": "Android Authority", "date": "2026-09-01 18:30", "url": "https://www.androidauthority.com/galaxy-s26-fe-wrong-samsung-phone-buy-3704387/", "category": "price", "importance": 3, "wl": true, "topic": "갤럭시 s26 fe 구매 분석"}, {"title": "Apple’s first folding iPhone won’t kill Android foldables — it will save them", "summary": "애플의 첫 폴더블 아이폰이 안드로이드 폴더블폰 시장을 위협하기보다 오히려 시장 전체를 대중화시키며 구원할 것이라는 전망이 나왔다. 애플의 진입은 그동안 정체되었던 폴더블 폼팩터에 대한 소비자 관심을 환기시키고 시장 생태계를 확장하는 계기가 될 것으로 분석된다. 프리미엄 스마트폰 시장에서 애플과 안드로이드 진영 간의 경쟁 구도가 폴더블 영역으로 본격적으로 확전될 조름이다. 이는 향후 삼성전자의 폴더블 스마트폰 전략에도 적지 않은 자극과 영향을 미칠 것으로 예상된다.", "source": "Android Authority", "date": "2026-09-01 18:00", "url": "https://www.androidauthority.com/apple-foldable-iphone-save-android-phones-3704142/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 폴더블 출시"}, {"title": "iOS 27 breaks 15 years of muscle memory on iPhone and iPad", "summary": "애플은 iOS 27부터 지난 15년 동안 아이폰과 아이패드의 핵심이었던 알림 센터 체계를 대대적으로 변경한다. 연대순으로 알림을 보여주던 기존 근육 기억을 깨는 큰 변화다. 사용자 인터페이스의 대대적인 개편으로 적응 기간이 필요할 것으로 보인다. 운영체제 경쟁에서 사용자 경험의 변화를 이끄는 핵심 업데이트다.", "source": "9to5Mac", "date": "2026-09-01 17:00", "url": "https://9to5mac.com/2026/09/01/ios-27-just-broke-15-years-of-muscle-memory-on-iphone-and-ipad/", "category": "policy", "importance": 3, "wl": true, "topic": "아이오에스 27 알림센터 개편"}, {"title": "Apple Releases New iOS 27, iPadOS 27, macOS 27, and tvOS 27 Public Betas", "summary": "애플이 새로운 iOS 27, iPadOS 27, macOS 27, tvOS 27의 퍼블릭 베타 버전을 동시에 대거 공개했다. 정식 출시를 앞두고 일반 사용자들의 피드백을 수렴하여 안정성을 최종 검증하는 단계다. 대대적인 운영체제 개편의 막바지 테스트가 진행 중이다. 가을 릴리즈를 향한 카운트다운에 돌입했다.", "source": "MacRumors", "date": "2026-09-01 06:13", "url": "https://www.macrumors.com/2026/08/31/apple-ios-27-public-beta-6/", "category": "launch", "importance": 3, "wl": true, "topic": "아이오에스 27 베타 출시"}, {"title": "Satellite SOS just proved why it could be your phone’s most important feature", "summary": "치명적인 네팔 홍수 재난 상황에서 위성 연결 기능을 통해 생존자가 구조대에 연락하는 데 성공했다. 위성 SOS 기능이 스마트폰의 가장 중요한 안전 기능 중 하나임을 실증적으로 증명했다. 모바일 기기의 위성 통신 기능 탑재 필요성이 더욱 부각되고 있다.", "source": "Android Authority", "date": "2026-09-01 02:43", "url": "https://www.androidauthority.com/satellite-connectivity-saves-life-of-man-3705087/", "category": "quality", "importance": 3, "wl": true, "topic": "위성 sos 구조"}, {"title": "CarPlay keeps getting better with three recent exciting app updates", "summary": "카플레이는 9월 iOS 27 업데이트를 통해 전용 시리 앱과 시리 AI 등의 새로운 기능을 탑재하며 한층 더 진화할 예정이다. 대규모 모바일 소프트웨어 릴리즈 이전에 차량용 인포테인먼트 시스템의 기능이 선제적으로 업그레이드된다. 운전자들의 사용자 경험이 대폭 개선될 전망이다. 애플의 차량 플랫폼 장악력이 강화되고 있다.", "source": "9to5Mac", "date": "2026-08-31 21:11", "url": "https://9to5mac.com/2026/08/31/carplay-keeps-getting-better-with-three-recent-exciting-app-updates/", "category": "launch", "importance": 3, "wl": true, "topic": "카플레이 업데이트"}, {"title": "I lived with Samsung’s worst 2025 Android phone for a year. Here’s why I’m finally giving ", "summary": "삼성전자의 2025년형 안드로이드 스마트폰인 갤럭시 S25 엣지를 1년간 실사용해 본 후기가 공개됐다. 제품의 한계와 아쉬운 점으로 인해 결국 사용을 포기하게 된 배경이 다뤄졌다. 특정 폼팩터나 파생 모델에 대한 시장의 냉정한 평가를 보여준다.", "source": "Android Authority", "date": "2026-08-31 19:30", "url": "https://www.androidauthority.com/galaxy-s25-edge-one-year-later-3703679/", "category": "quality", "importance": 3, "wl": true, "topic": "갤럭시 s25 엣지"}, {"title": "Scam Detection coul   for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
