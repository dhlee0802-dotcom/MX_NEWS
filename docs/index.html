le Debuts the iPhone Duo, Its First Foldable Phone", "summary": "애플이 첫 번째 폴더블 스마트폰인 '아이폰 듀오'를 공식 데뷔시켰다. 이 제품은 7.6인치 내부 디스플레이와 5.4인치 커버 디스플레이를 탑재했으며 10월에 출시될 예정이다. 스마트폰 시장에서 애플의 첫 폴더블 진출이라는 점에서 업계 판도를 흔들 역사적 사건이다. 삼성 MX사업부에 즉각적이고 강력한 대응을 요구하는 최우선 긴급 정보이다.", "source": "CNET", "date": "2026-09-10 03:01", "url": "https://www.cnet.com/tech/mobile/apple-debuts-the-iphone-duo-its-first-foldable-handset/", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰듀오 폴더블"}, {"title": "I Got My Hands on the iPhone Duo, Apple’s First Foldable Phone. Here’s What Stands Out", "summary": "애플의 첫 폴더블폰인 아이폰 Duo는 5.4인치 커버 스크린과 7.6인치 메인 디스플레이를 갖춘 팜 사이즈 디자인으로 10월 출시를 앞두고 큰 주목을 받고 있다. 애플이 오랜 준비 끝에 내놓은 가장 대담한 폼팩터 기기다. 삼성의 폴더블폰 독점 체제에 강력한 균열을 낼 핵심 경쟁작이다.", "source": "CNET", "date": "2026-09-10 03:01", "url": "https://www.cnet.com/tech/mobile/apple-debuts-the-iphone-duo-its-first-foldable-handset/", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰폴더블 실물핸즈온"}, {"title": "Apple finally reveals foldable iPhone Duo with Z Fold 8-like form factor", "summary": "애플이 갤럭시 Z 폴드 8과 유사한 폼팩터를 채택한 첫 폴더블 스마트폰 '아이폰 Duo'를 공식 공개했다. 긴 준비 기간 끝에 애플이 폴더블 시장에 본격 가세하면서 글로벌 스마트폰 판도 변화가 예고된다. 삼성전자의 폴더블 리더십에 직접적인 도전이 될 것으로 보인다.", "source": "Android Authority", "date": "2026-09-10 02:59", "url": "https://www.androidauthority.com/iphone-duo-launch-3709342/", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰폴더블 출시"}, {"title": "Apple unveils foldable iPhone Duo", "summary": "애플이 자사 최초의 폴더블 스마트폰인 아이폰 Duo를 공식 발표했습니다. 글로벌 미디어와 업계의 폭발적인 관심을 한 몸에 받고 있으며, 향후 폴더블폰 시장의 새로운 거대 강자로 급부상할 전망입니다. 프리미엄 폼팩터 시장의 판도를 완전히 뒤흔들 잠재력을 지니고 있습니다. 삼성전자 MX사업부의 제품 전략 수정과 최고 수준의 대응을 요구하는 중대 사안입니다.", "source": "9to5Mac", "date": "2026-09-10 02:57", "url": "https://9to5mac.com/2026/09/09/apple-unveils-foldable-iphone-duo/", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰 duo 공개"}, {"title": "Apple Watch Series 12 and Ultra 4 unveiled with upgraded health tracking system", "summary": "애플워치 시리즈 12와 울트라 4가 업그레이드된 헬스케어 트래킹 시스템을 탑재하고 공식 언팩되었습니다. 삼성 갤럭시 워치 시리즈의 헬스케어 리더십에 직접적인 위협이 되는 신제품 출시로 즉각적인 분석과 대응이 필요합니다.", "source": "9to5Mac", "date": "2026-09-10 02:44", "url": "https://9to5mac.com/2026/09/09/apple-watch-series-12-and-ultra-4-unveiled-with-upgraded-health-tracking-system/", "category": "launch", "importance": 5, "sid": "watch", "topic": "애플워치 시리즈 12 출시"}, {"title": "Apple announces A20 Pro chip with 2nm design and major performance gains", "summary": "애플이 2나노미터(2nm) 공정으로 제작된 첫 번째 칩인 'A20 프로'를 공개했다. 아이폰 듀오, 아이폰 18 프로, 프로 맥스에 탑재되어 CPU, GPU, AI 성능에서 대대적인 도약을 이뤄냈다. 업계 최초의 2nm 모바일 칩 상용화는 반도체 및 스마트폰 성능 경쟁에 거대한 충격을 준다. 삼성전자 시스템LSI 및 MX사업부의 칩셋 전략에 강력한 위협이자 과제이다.", "source": "9to5Mac", "date": "2026-09-10 02:37", "url": "https://9to5mac.com/2026/09/09/apple-announces-a20-pro-chip-with-2nm-design-and-major-performance-gains/", "category": "launch", "importance": 5, "sid": "phone", "topic": "애플 a20 프로 칩"}, {"title": "Apple Announces iPhone 18 Pro and iPhone 18 Pro Max", "summary": "애플이 아이폰18 프로와 프로 맥스를 공식 발표했습니다.", "source": "MacRumors", "date": "2026-09-10 02:12", "url": "https://www.macrumors.com/2026/09/09/apple-announces-iphone-18-pro-and-iphone-18-pro-max/", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰18 출시"}, {"title": "iPhone 18 Pro officially announced: Here’s what’s new", "summary": "애플의 대규모 이벤트에서 아이폰 18 프로와 아이폰 18 프로 맥스가 공식 발표되었습니다. 프리미엄 스마트폰 라인업의 핵심 모델로서 모바일 시장 전반에 강력한 파급력을 행사할 것으로 예상됩니다.", "source": "9to5Mac", "date": "2026-09-10 02:11", "url": "https://9to5mac.com/2026/09/09/iphone-18-pro-officially-announced-heres-whats-new/", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰 18 프로 시리즈 공식 발표"}, {"title": "Apple iPhone 18 Pro and Pro Max Are Official: $1,199, Fancy Cameras and More", "summary": "애플이 수요일 '서프라이즈 앤 샤인' 이벤트를 통해 1,199달러의 시작 가격을 가진 아이폰 18 프로 및 프로 맥스를 공식 발표했다. 화려한 카메라 업그레이드와 신규 하드웨어가 탑재되었다. 글로벌 프리미엄 스마트폰 시장의 수요를 블랙홀처럼 빨아들일 핵심 제품이다. 삼성 MX사업부의 마케팅 및 판매 전략에 즉각적인 대응을 요한다.", "source": "CNET" ally is", "summary": "구글의 커스텀 실리콘 전략 실패 가능성이 제기되는 가운데 픽셀 11에 탑재된 텐서 G6 프로세서의 성능이 경쟁사 스마트폰들에 비해 한참 뒤처져 있음을 보여주는 5가지 사례가 지적됐다. 자체 칩셋 성능 경쟁에서 구글이 직면한 기술적 한계를 시사한다. 프리미엄 AP 시장에서 퀄컴 및 미디어텍 등과의 격차가 부각되고 있다.", "source": "Android Authority", "date": "2026-09-07 18:00", "url": "https://www.androidauthority.com/pixel-11-tensor-g6-far-behind-benchmark-comparisons-3705519/", "category": "quality", "importance": 4, "sid": "phone", "topic": "구글 픽셀 11 텐서 g6 프로세서 경쟁사 대비 성능 열세 지적"}, {"title": "DRAM Revenue Surges 59.5% in One Quarter: Why It Was Not Driven by Higher Chip Sales - Moo", "summary": "D램 매출이 한 분 만에 59.5% 급증했으며, 이는 단순한 출하량 증가가 아님을 보여주는 분석이 나왔습니다. 메모리 가격 폭등이 반도체 기업들의 실적을 견인하고 있음을 입증합니다. 완제품 업계에는 그만큼 막대한 원가 부담으로 작용하고 있습니다. 제조사들의 수익성 악화 우려가 심화되는 대목입니다.", "source": "Moomoo", "date": "2026-09-07 17:31", "url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxQcUhDT0d4QllTR2ZnUFJ6aWlOYXlvRFctNS1HZGhiSnBPcy1RRTQySEJuUl96eVZ0eDViMmVuSzNZVGVDOG81YkVWSVZWNjdnenhKRXB5VC1fZjI2YzRSTkRMTllKdG5QZ2g4akplUDVZNGdSYW5SSlRtRUZxaDZuN3N1cG83ZkxUMUpNa3F1Z1hnUQ?oc=5", "category": "price", "importance": 4, "sid": "memchina", "topic": "d램 분기 매출 급증 원인"}, {"title": "삼성, 파운드리 DSP '옥석 가리기'…13곳→11곳 재편", "summary": "삼성전자가 파운드리 디자인솔루션파트너(DSP) 체계를 재정비하여 파트너사를 13곳에서 11곳으로 축소했다. 고객과 프로젝트를 실제로 확보할 수 있는 업체 중심으로 옥석 가리기에 나선 것으로, 국내 설계업체 위더맥스와 영국 손드렐 등이 제외됐다. 파운드리 생태계의 실효성을 높이기 위한 구조조정이다.", "source": "전자신문", "date": "2026-09-07 16:30", "url": "https://www.etnews.com/20260907000332", "category": "policy", "importance": 4, "sid": "memchina", "topic": "삼성 파운드리 dsp 재편"}, {"title": "“휴대폰 주문했는데 이어폰을 보내?'…알리익스프레스, 불량 셀러 강력 제재", "summary": "알리익스프레스가 전혀 다른 상품을 발송하거나 고의로 상품 정보를 부풀리는 불량 판매자에게 판매금지 조치를 내리는 등 강력한 제재를 가한다. 그동안 '초저가'를 앞세워 빠르게 키운 국내 이용자 기반을 바탕으로 성장해온 알리가 품질 관리에 나선 것으로 파악된다. 7일 업계에 따르면 알리익스프레스는 최근 'Sell A Send B'(셀 A 센드 B) 제재 규칙을 가동했다. 플랫폼 내 모든 판매자를…", "source": "전자신문", "date": "2026-09-07 16:20", "url": "https://www.etnews.com/20260907000258", "category": "quality", "importance": 4, "sid": "tws", "topic": " // ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
