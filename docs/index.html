g-galaxy-z-fold-8-ddi-demand-ramp-up-3704985/", "category": "launch", "importance": 5, "wl": true, "topic": "갤럭시z폴드8 판매"}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "차기 플래그십 스마트폰인 갤럭시 S27과 S27 플러스 모델에 S27 프로와 동일한 3배 망원 카메라 시스템이 탑재될 가능성이 제기되었다. 카메라 성능 업그레이드를 통해 일반 및 플러스 모델의 경쟁력을 한층 끌어올릴 것으로 기대된다. 프리미엄 스마트폰 시장에서 카메라 스펙 경쟁이 지속되고 있음을 보여준다. 삼성전자 MX사업부의 차세대 라인업 차별화 전략에 중요한 요소다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시s27 출시"}, {"title": "iPhone 18 Pro: Three reasons you might want to upgrade from iPhone 17 Pro", "summary": "애플이 다음 주 아이폰 18 프로를 공개할 예정인 가운데, 기존 아이폰 17 프로 사용자들이 업그레이드를 고려할 만한 세 가지 핵심 이유가 제시됐다. 대부분의 사용자가 단기간에 기기를 바꾸지는 않겠지만 신규 구매자들을 유인할 주요 기능들이 탑재될 것으로 기대된다. 프리미엄 스마트폰 시장에서 애플의 신제품 출시가 미칠 파급효과가 주목된다. 삼성전자 MX사업부의 플래그십 전략에도 지속적인 모니터링이 필요하다.", "source": "9to5Mac", "date": "2026-09-01 05:21", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-three-reasons-you-might-want-to-upgrade-from-iphone-17-pro/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰18프로 출시"}, {"title": "I compared the cameras on the Galaxy Z Fold 8 and Pixel 11 Pro Fold - and one pulled ahead", "summary": "독일 여행 중 삼성전자 갤럭시 Z 폴드 8과 구글 픽셀 11 프로 폴드의 카메라 성능을 직접 비교 테스트한 결과, 미세한 차이로 한쪽 모델이 우위를 차지했다. 두 차세대 폴더블 플래그십 간의 광학 및 소프트웨어 카메라 경쟁이 매우 치열하게 전개되고 있음을 입증한다. 삼성전자 폴더블폰의 카메라 경쟁력을 객관적으로 가늠할 수 있는 중요 평가다.", "source": "ZDNet", "date": "2026-09-01 00:50", "url": "https://www.zdnet.com/article/samsung-galaxy-z-fold-8-camera-vs-pixel-11-pro-fold-camera/", "category": "quality", "importance": 4, "wl": true, "topic": "갤럭시z폴드8 카메라"}, {"title": "There’s already another tri-fold phone on the market, and it’s not from Samsung", "summary": "화웨이가 새로운 삼중 폴더블(Tri-fold) 스마트폰인 '메이트 XT 2'를 선보이며 시장에 진입했다. 삼성전자가 아직 상용화하지 않은 폼팩터 분야에서 중국 제조사들이 공격적인 신제품 공세를 펼치고 있다. 삼중 접이식 스마트폰 시장의 경쟁 구도가 점차 확대되는 양상이다. 삼성전자 MX사업부의 차세대 폼팩터 개발 및 대응 전략에 시사하는 바가 크다.", "source": "Android Authority", "date": "2026-08-31 22:57", "url": "https://www.androidauthority.com/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 4, "wl": true, "topic": "화웨이 메이트xt2 출시"}, {"title": "애플 “오픈AI, 아이폰 영업비밀 침해 증거 인멸 중”", "summary": "애플이 오픈AI를 상대로 제기한 영업비밀 침해 소송과 관련해, 오픈AI가 전직 아이폰 엔지니어를 채용해 기밀 회로도를 업무에 활용한 데 이어 소송 국면에서 핵심 증거를 적극적으로 인멸하고 있다고 주장했다. 새로운 법원 서류를 통해 법적 공방을 한층 더 강화하고 있다. 빅테크 간 기술 유출 및 법적 분쟁의 수위가 최고조에 달하고 있다.", "source": "전자신문", "date": "2026-09-01 08:08", "url": "https://www.etnews.com/20260901000007", "category": "quality", "importance": 3, "wl": true, "topic": "오픈ai 소송"}, {"title": "iOS 27 beta 8 now available as Apple tests major Siri AI upgrade", "summary": "애플이 9월 대중 공개를 앞두고 개발자를 위한 iOS 27 베타 8을 배포했다. 이번 베타 버전은 대대적인 시리(Siri) AI 업그레이드를 테스트하는 데 초점이 맞춰져 있다. 여름 베타 주기의 막바지 단계에서 소프트웨어 완성도를 점검하고 있다. 모바일 AI 기능 강화가 아이폰 사용자 경험에 미칠 영향이 주목된다.", "source": "9to5Mac", "date": "2026-09-01 02:12", "url": "https://9to5mac.com/2026/08/31/ios-27-beta-8/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 베타"}, {"title": "Apple could discontinue 10+ popular products next week", "summary": "애플이 다음 주 대규모 9월 출시 행사를 개최함에 따라, 신제품 도입과 함께 10개 이상의 인기 현행 기기들을 단종할 것으로 예상된다. 구형 모델의 퇴장을 통해 신제품 라인업으로 수요를 집중시키려는 전략이다. 플래그십 출시 주기에 발맞춘 제품 포트폴리오 재편의 전형적인 모습이다. 스마트폰 및 태블릿 시장의 세대교체 속도를 가늠할 수 있다.", "source": "9to5Mac", "date": "2026-09-01 01:04", "url": "https://9to5mac.com/2026/08/31/apple-could-discontinue-10-popular-products-next-week/", "category": "launch", "importance": 3, "wl": true, "topic": "애플 단종 제품"}, {"title": "Android 17 QPR2 Beta 4 puts AI agents under supervision with new dashboard", "summary": "안드로이드 17 QPR2 베타 4에 기기에 설치된 모든 AI 에이전트를 추적하고 관리할 수 있는 새로운 대시보드가 도입됐다. AI 에이전트들이 통제 하에 안전하게 작동할 수 있도록 감독 기능을 제공한다. 모바일 기기 내 AI 생태계가 확장됨에 따라 보안 및 관리의 필요성이 커지고 있음을 보여준다.", "source": "Android Authority", "date": "2026-08-31 20:05", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-agent-dashboard-3704775/", "category": "quality", "importance": 3, "wl": true, "topic": "안드로이드17 베타"}, {"title": "5 Android phones you should buy instead of the Google Pixel 11 Pro Fold", "summary": "구글 픽셀 11 프로 폴드 대신 구매를 고려해볼 만한 강력한 경쟁력을 가진 5대의 안드로이드 스마트폰이 추천됐다. 폴더블폰 시장에서 구글의 신제품에 맞서는 제조사들의 주요 경쟁 모델들을 조명했다. 글로벌 폴더블 스마트폰 시장의 치열한 경쟁 구도를 보여준다.", "source": "Android Authority", "date": "2026-08-30 19:30", "url": "https://www.androidauthority.com/google-pixel-11-pro-fold-alternatives-3698460/", "category": "community", "importance": 3, "wl": true, "topic": "픽셀11프로폴드 대안"}, {"title": "PSA: Gemini can adjust system settings on any Pixel running Android 17", "summary": "안드로이드 17을 구동하는 모든 픽셀 기기에서 제미나이(Gemini)를 통해 시스템 설정을 직접 제어할 수 있는 기능이 제공된다. 음성 명령만으로 스마트폰의 다양한 환경 설정을 손쉽게 변경할 수 있어 사용자 편의성이 대폭 향상된다. 모바일 운영체제와 AI 비서의 통합 수준이 한 차원 높아지고 있음을 보여준다.", "source": "Android Authority", "date": "2026-09-01 05:06", "url": "https://www.androidauthority.com/device-help-android-17-3705148/", "category": "quality", "importance": 2, "wl": true, "topic": "안드로이드17 제미나이"}, {"title": "Pixel 11 owners say their phones are waking up without being touched", "summary": "일부 픽셀 11 사용자들 사이에서 스마트폰을 만지지 않았음에도 저절로 화면이 켜지는 현상이 보고되고 있다. 레딧 등을 통한 사용자들의 불만에 따르면 최신 픽셀 기기의 특정 제스처 감도 설정이 지나치게 민감하게 작동하는 것이 원인으로 지목된다. 신제품 하드웨어 및 소프트웨어 품질 안정화의 중요성을 시사한다.", "source": "Android Authority", "date": "2026-09-01 04:58", "url": "https://www.androidauthority.com/pixel-11-lift-to-check-phone-too-sensitive-3705133/", "category": "quality", "importance": 2, "wl": true, "topic": "픽셀11 화면깨어남"}, {"title": "Satellite SOS just proved why it could be your phone’s most important feature", "summary": "치명적인 네팔 홍수 재난 상황에서 스마트폰의 위성 SOS 기능이 생존자가 구조대에 연락하는 데 결정적인 역할을 한 것으로 보고됐다. 지상 통신망이 마비된 극한의 재난 환경에서 위성 통신 기능의 중요성이 다시 한번 입증됐다. 프리미엄 스마트폰의 필수 안전 기능으로 위성 연결성이 자리 잡고 있음을 보여준다.", "source": "Android Authority", "date": "2026-09-01 02:43", "url": "https://www.androidauthority.com/satellite-connectivity-saves-life-of-man-3705087/", "category": "quality", "importance": 2, "wl": true, "topic": "위성sos 구조"}, {"title": "Pixel’s Now Playing is about to get its lost feature back, and we saw the proof", "summary": "픽셀 스마트폰의 '나우 플레이잉(Now Playing)' 기능에 멀티사용자 지원 및 동기화 기능 등 과거에 유실되었던 기능들이 다시 추가될 예정인 것으로 확인됐다. 소프트웨어 업데이트를 통해 사용자 경험을 개선하려는 구글의 노력을 보여준다. 모바일 음악 인식 기능의 편의성이 한층 강화될 전망이다.", "source": "Android Authority", "date": "2026-09-01 00:08", "url": "https://www.androidauthority.com/pixel-now-playing-notifications-sync-apk-teardown-3704928/", "category": "quality", "importance": 2, "wl": true, "topic": "픽셀 나우플레이ing"}, {"title": "How Android 17 stops network snoops and SMS blasters now - with ECH and a 2G kill switch", "summary": "최신 안드로이드 17 업데이트는 ECH(Encrypted Client Hello) 및 2G 킬 스위치 등의 광범위한 지원을 추가하여 네트워크 스누핑과 SMS 블래스터 공격을 효과적으로 차단한다. 모바일 네트워크 보안성과 사용자 프라이버시 보호 기능이 대폭 강화됐다. 운영체제 레벨의 보안 대책 트렌드를 보여준다.", "source": "ZDNet", "date": "2026-08-31 22:13", "url": "https://www.zdnet.com/article/android-17-web-browsing-security-privacy-features-update/", "category": "quality", "importance": 2, "wl": true, "topic": "안드로이드17 보안"}, {"title": "Google Messages has a bizarre bug that’s sending old texts to random people", "summary": "구글 메시지 앱에서 오래된 대화 내용이 전혀 상관없는 무작위 사람들에게 전송되는 기괴한 버그가 발생했다. 과거의 문자 메시지들이 재차 발송되면서 사용자들의 혼란과 프라이버시 우려가 제기되고 있다. 모바일 커뮤니케이션 소프트웨어의 치명적인 결함 사례로 신속한 패트가 요구된다.", "source": "Android Authority", "date": "2026-08-31 20:00", "url": "https://www.androidauthority.com/google-messages-old-texts-bug-3704732/", "category": "quality", "importance": 2, "wl": true, "topic": "구글메시지 버그"}, {"title": "I lived with Samsung’s worst 2025 Android phone for a year. Here’s why I’m finally giving ", "summary": "삼성전자의 2025년형 안드로이드 스마트폰인 갤럭시 S25 엣지를 1년간 실사용해 본 후 결국 사용을 포기하게 된 사연이 전해졌다. 제품의 완성도나 만족도 측면에서 아쉬움이 남았던 경험을 공유하며 기기 교체 배경을 설명했다. 과거 모델에 대한 소비자 피드백과 평가의 일종이다.", "source": "Android Authority", "date": "2026-08-31 19:30", "url": "https://www.androidauthority.com/galaxy-s25-edge-one-year-later-3703679/", "category": "com rue, "topic": "안드로이드 앱"}, {"title": "There’s no GrapheneOS for Pixel 11 phones because Google cut a key security feature", "summary": "구글이 비용 절감을 위해 핵심 보안 기능을 누락시켰다는 의혹이 제기되면서 픽셀 11용 그래핀OS(GrapheneOS)가 출시되지 못하고 있다. 보안에 특화된 커스텀 OS 개발 팀은 구글의 하드웨어 보안 정책 변화에 우려를 표명하고 있다. 스마트폰 보안 생태계에 미치는 영향이 주목된다.", "source": "Android Authority", "date": "2026-08-30 16:05", "url": "https://www.androidauthority.com/no-grapheneos-google-pixel-11-3704622/", "category": "quality", "importance": 2, "wl": true, "topic": "그래핀os 픽셀11"}, {"title": "How to run Mario Kart 64 with native Metal rendering, high frame rate, and HD textures on ", "summary": "아이폰에서 델타나 기존 N64 에뮬레이터 대신 네이티브 Metal 렌더링, 고프레임 레이트, HD 텍스처를 적용해 클래식 게임 마리오 카트 64를 구동하는 방법이 소개됐다. 애플의 그래픽 API인 Metal을 활용해 향상된 성능으로 고전 게임을 즐길 수 있게 되었다. 모바일 기기의 그래픽 처리 능력과 에뮬레이터 성능의 발전 양상을 보여준다. 게이밍 측면에서 아이폰의 활용도가 점차 넓어지고 있다.", "source": "9to5Mac", "date": "2026-09-01 04:50", "url": "https://9to5mac.com/2026/08/31/how-to-run-mario-kart-64-with-native-metal-rendering-high-frame-rate-and-hd-textures-on-iphone-video/", "category": "quality", "importance": 1, "wl": true, "topic": "마리오카트 에뮬레이터"}, {"title": "Survey reveals your favorite Pixel 11 Pro XL alternatives", "summary": "설문조사 결과 독자들이 꼽은 픽셀 11 프로 XL의 최고 대안 제품들이 예상과 다른 양상을 보였다. 소비자들이 선호하는 스마트폰 대안에 대한 시장 조사를 통해 모바일 트렌드를 엿볼 수 있다. 프리미엄 스마트폰 시장의 소비자 선호도 변화를 나타낸다.", "source": "Android Authority", "date": "2026-08-31 22:44", "url": "https://www.androidauthority.com/pixel-11-pro-xl-alternatives-2-3704633/", "category": "community", "importance": 1, "wl": true, "topic": "픽셀11 프로 대안"}, {"title": "Just How Water-Resistant Is Apple’s iPhone? I Tested It in My Swimming Pool", "summary": "애플 아이폰의 방수 성능을 수영장에서 직접 테스트하며 초기 방수 도입 역사와 기술적 발전 과정을 되돌아보는 리뷰가 진행됐다. 모바일 기기의 내구성과 방수 기술의 진화를 보여준다.", "source": "CNET", "date": "2026-08-31 21:00", "url": "https://www.cnet.com/tech/mobile/apple-iphone-water-resistant-test-swimming-pool/", "category": "quality", "importance": 1, "wl": true, "topic": "아이폰 방수테스트"}, {"title": "I tri const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
</html>
