a’s newest smart glasses ditch the camera to avoid the ‘pervert-glasses’ tag", "summary": "메타가 공공장소에서의 불법 촬영 논란 및 프라이버시 오명을 극복하기 위해 카메라를 과감히 없앤 신형 스마트 글래스와 아기자기한 AI 디바이스 '뮤즈 참'을 공개했습니다. 사용자의 사생활 침해 우려를 원천 차단하면서 음성 기반 AI 어시스턴트 기능에만 집중할 수 있는 새로운 카테고리를 개척했습니다. 스마트 웨어러블에 대한 대중의 거부감을 낮추기 위한 파격적인 하드웨어 설계 전략입니다. 당사의 XR 및 AI 웨어러블 기기 제품 기획에 중대한 기준점을 제시합니다.", "source": "Android Authority", "date": "2026-09-24 15:20", "url": "https://www.androidauthority.com/ray-ban-meta-audio-muse-charm-launched-3714882/", "category": "launch", "importance": 5, "sid": "glasses", "topic": "메타 카메라 없는 스마트 글래스 및 뮤즈 참"}, {"title": "Meta’s new featherweight VR Glasses take a swing at Apple Vision Pro with IMAX and hologra", "summary": "메타가 애플 비전 프로 가격의 절반 이하라는 파격적인 가성비와 함께 IMAX 스크린 및 홀로그램 기술을 탑재한 초경량 VR 글래스를 전격 공개하며 애플에 정면으로 도전장을 던졌습니다. 프리미엄 XR/VR 헤드셋 시장에서 고가 전략(애플)과 대중적 저가 전략(메타) 간의 전면전이 시작되었음을 알리는 중대 사건입니다. XR 시장의 가격 장벽을 무너뜨리는 파괴적인 행보입니다. 삼성전자가 구글과 협력하여 출시를 준비하고 있는 XR 헤드셋의 가격 정책, 타겟팅, 하드웨어 스펙 전략에 즉각적이고 전면적인 재검토를 요구하는 매우 긴급한 경쟁 정보입니다.", "source": "Android Authority", "date": "2026-09-24 15:10", "url": "https://www.androidauthority.com/meta-vr-glasses-launch-3714878/", "category": "launch", "importance": 5, "sid": "glasses", "topic": "메타 vr글래스"}, {"title": "[AI 슈퍼사이클 나비효과]下 HBM 품귀에 스마트폰도…'프리미엄 쏠림' 심화 - v.daum.net", "summary": "AI 슈퍼사이클의 나비효과로 HBM 품귀 현상이 심화되면서 일반 스마트폰 부품 가격에도 영향을 미치고 프리미엄 모델로의 쏠림 현상이 심화되고 있다는 분석 기사입니다. 원가 상승 압박 속에서 제조사들의 전략 변화를 다루고 있습니다.", "source": "v.daum.net", "date": "2026-09-24 15:01", "url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE5yNng3UEdwQmpNdU05ZWprcjdzb0NvUFdKT0hPS0V0NjlkcUdpVDV0VDlwc2tmSGt1M1A4VVVWUlR5dnY3ZG81VE9OLWlrN3M?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "hbm 품귀 프리미엄 스마트폰 쏠림"}, {"title": "갤럭시폰에는 조만간 위조 배터리를 차단하고 폭발을 방지하는 보안 칩이 탑재될 예정입니다. - Vietnam.vn", "summary": "갤럭시 스마트폰에 위조 배터리를 차단하고 폭발을 방지하는 보안 칩이 조만간 탑재될 예정입니다. 이는 제품 안전성과 직결되는 중대한 하드웨어 개선 조치입니다. 소비자 안전 사고를 미연에 방지하고 제품 신뢰도를 높이는 데 크게 기여할 것입니다. 삼성전자의 철저한 품질 관리 의지를 보여주는 대목  "부품사 반도체값인상 날벼락"}, {"title": "Facing trouble with the Home Up Good Lock module? You’re not alone, and a fix is coming", "summary": "삼성전자의 커스텀 커뮤니티 및 굿락(Good Lock) '홈 업(Home Up)' 모듈 사용 중 사용자 정의 폴더 라벨 색상 설정에서 발생한 오류로 인해 불편을 겪는 사용자들이 속출하고 있으며, 삼성 측이 공식 수정 패치를 준비 중입니다. 당사 소프트웨어 서비스 오류 및 긴급 조치 사안에 해당합니다. 공식 서비스 오류에 대한 패치 조치가 진행 중입니다.", "source": "Android Authority", "date": "2026-09-23 16:31", "url": "https://www.androidauthority.com/good-lock-home-up-backup-issues-3714410/", "category": "quality", "importance": 5, "sid": "phone", "topic": "굿락 홈 업"}, {"title": "“메모리가 혼자 다 끌고 간다…삼성전자 3분기 영업이익 100조 폭발, 가전·폰 적자도 압도” - 뉴스퀘스트", "summary": "메모리 반도체 부문의 독보적인 실적 호조에 힘입어 삼성전자의 3분기 영업이익이 100조 원을 폭발적으로 돌파할 것으로 보이며, 가전 및 스마트폰 부문의 적자 우려마저 압도하고 있다는 보도입니다. 반도체 슈퍼 사이클이 전사 실적을 견인하는 구조가 극대화되었습니다. 세트 사업의 부진을 반도체 이익이 완전히 상쇄하는 양상입니다. 전사 차원의 자원 배분과 실적 구조를 이해하는 데 핵심적인 뉴스입니다.", "source": "뉴스퀘스트", "date": "2026-09-23 15:23", "url": "https://news.google.com/rss/articles/CBMib0FVX3lxTE1ZNDhwUUhkdTJCQkx1U0ZxelcxVkdoTThXSTBkSW8zbVBibVVNem1fSXpVQ3puY1ZreFRPTVlEZFdvMHFlNk56NjBLNGJsWVEyeGg3dlZzeTViLUxRTElxTTREWkRBSDlRd2VKaUN1aw?oc=5", "category": "exec", "importance": 5, "sid": "memchina", "topic": "삼성전자 3분기 메모리 영업익 100조"}, {"title": "The Galaxy S26 series is now getting stable One UI 9 in the US!", "summary": "미국에서 갤럭시 S26 시리즈에 대한 원 UI 9 안정화 업데이트가 시작되었습니다. 티모바일 S26 울트라를 시작으로 순차적으로 배포될 예정입니다. 당사 플래그십 모델의 최신 소프트웨어 업그레이드가 본격적으로 적용되는 중대한 사건입니다.", "source": "Android Authority", "date": "2026-09-23 15:11", "url": "https://www.androidauthority.com/samsung-galaxy-s26-series-stable-one-ui-9-us-3714362/", "category": "launch", "importance": 5, "sid": "phone", "topic": "galaxy s26 one ui 9"}, {"title": "메모리 뺀 삼성전자 올해 실적 심상찮다⋯모바일.완제품 적자 우려 - 엠투데이", "summary": "메모리 반도체를 제외할 경우 삼성전자의 올해 실적이 심상치 않으며 모바일 및 완제품(MX) 부문에서 적자 우려까지 제기되었습니다. 부품가 상승과 세트 수요 부진이 겹치면서 MX 사업부의 수익성이 심각한 위협을 받고 있음을 경고합니다. 경영진의 즉각적인 비용 통제 및 대응 전략 수립이 필수적입니다.", "source": "엠투데이", "date": "2026-09-23 14:47", "url": "https://news.google.com/rss/artic s://www.vegannews.co.kr/news/article.html?no=386546", "category": "other", "importance": 5, "sid": "phone", "topic": ""}, {"title": "새 스마트폰 가격 폭등에 ‘중고폰도 290만원’ - v.daum.net", "summary": "신형 스마트폰의 출고가가 폭등하면서 중고 스마트폰 가격마저 290만 원에 육박하는 기현상이 벌어지고 있습니다. 부품 원가 상승과 인플레이션 여파로 모바일 기기 전체의 가격 장벽이 급격히 높아졌습니다. 소비자의 교체 수요 위축을 불러올 수 있는 심각한 시장 상황입니다. 삼성전자의 신제품 판매 전략과 가격 저항선 방어에 큰 부담으로 작용합니다.", "source": "v.daum.net", "date": "2026-09-23 11:18", "url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE1CS3lBQ1MwdU15VE96cnhIUGgwUTFCRHFQR3hUQW1TX2pDSTdGeF9sbGMzbmZDTmZsM2RQQ25aTWxUUU04ZXRoNTlYUGw3UWdTUUZ1Mw?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "새 스마트폰 가격 폭등"}, {"title": "삼성전자, 냉장고 '먹통 사태'에 스마트싱스 업데이트 즉각 중단", "summary": "추석 연휴를 앞두고 삼성전자 냉장고 일부 제품이 스마트싱스 소프트웨어 업데이트 직후 작동을 멈추는 먹통 현상을 일으켜 소비자들이 큰 불편을 겪었다. 이에 삼성전자는 즉각 해당 소프트웨어 배포를 전면 중단했다. 회사는 서비스 엔지니어를 긴급 투입해 문제 제품에 대한 수리를 진행하고 있다.", "source": "ZDNet Korea", "date": "2026-09-23 11:06", "url": "https://zdnet.co.kr/view/?no=20260923104525", "category": "quality", "importance": 5, "sid": "phone", "topic": "스마트싱스 냉장고 먹통 사태"}, {"title": "삼성전자, 최신 퀄컴칩서 차세대 'LPDDR6' 업계 최초 검증 완료", "summary": "삼성전자가 퀄컴의 최첨단 모바일 칩셋인 스냅드래곤 8 엘리트 6세대에서 업계 최초로 차세대 저전력 메모리인 'LPDDR6' 검증을 완료했다. LPDDR6는 내년부터 본격 상용화되는 차세대 D램으로 서버 및 엣지 AI 시장에서 삼성전자의 초격차 기술력을 입증하는 성과다. 모바일 메모리 반도체 시장에서의 리더십을 공고히 하는 중요한 마일스톤이다.", "source": "ZDNet Korea", "date": "2026-09-23 10:40", "url": "https://zdnet.co.kr/view/?no=20260923093534", "category": "quality", "importance": 5, "sid": "memchina", "topic": "삼성전자 lpddr6 퀄컴 칩 검증"}, {"title": "Acer Warns PC Prices Jump 20% in Memory Crisis [2026] - tech-insider.org", "summary": "테크 인사이더는 에이서(Acer)가 심각한 메모리 수급 위기로 인해 2026년 PC 가격이 20% 급등할 것이라고 공식 경고했다고 보도했습니다. 메모리 반도체 공급 부족 및 가격 폭등이 완제품 제조사의 가격 정책과 실물 경제에 미치는 직격탄을 보여주는 실제 사건입니다. 삼성전자 DS부문의 메모리 가격 전략뿐만 아니라 MX사업부의 원가 압박 및 완제품 가격 책정에 직접적인 영향을 미칩니다. 시장의 급격한 변동에 당일 대응이 필요한 중대 사안입니다.", "source": "tech-insider.org", "date": "2026-09-23 10:25", "url": "https://news.google.com/  14:55", "url": "https://news.google.com/rss/articles/CBMihwFBVV95cUxPcUNicXI0M0sxbUcxek5abWE5VWNLbmNWWndNVzJaMURrbHdaUTJsOEo4UTVzUDE5VndFV0M1ZGlqTDQ4c25hZTI1anh4b1cwdlJ0ZXc1UGVxSWt5Y1EtOGR0T1Jsb1ZQV1V3ckM0aHlUUmJkMGtlX3dnUTZvZEhjcnJ3aUF3R0k?oc=5", "category": "policy", "importance": 5, "sid": "wallet", "topic": ""}, {"title": "삼성은 부인했지만… 스마트폰 시장 ‘중국 메모리 사용설’ 솔솔 - 문화일보", "summary": "삼성전자는 공식 부인했음에도 불구하고 스마트폰 시장 내에서 중국산 메모리를 채택하여 사용할 것이라는 관측과 소문이 끊이지 않고 있습니다. 원가 절감을 위해 공급망 다변화를 모색할 수밖에 없는 시장 상황을 반영합니다. 품질 및 보안 이슈와 직결될 수 있는 민감한 사안입니다. 향후 부품 조달 정책에 대한 업계의 의구심이 해소되지 않고 있습니다.", "source": "문화일보", "date": "2026-09-22 11:58", "url": "https://news.google.com/rss/articles/CBMiUEFVX3lxTFBEUGxpU01mUTdteU1ldGRZQ1JYdk05RUZFSDdYQU1IbkU1UmstdHVxNXFSLXNISDZtVDRkaVZyTVZLTkZmQW5IUl9ZRk9yenN0?oc=5", "category": "quality", "importance": 5, "sid": "memchina", "topic": "스마트폰 중국메모리"}, {"title": "아이폰 디스플레이에 COE·LTPO+ 도입 늦어진다", "summary": "애플이 내년 출시 20주년 아이폰에 적용하려던 컬러필터인캡슐레이션(COE)과 저온다결정실리콘산화물 플러스(LTPO+) 등 차세대 디스플레이 신기술 채택 시점을 연기할 전망이다. 기술 성숙도가 기대에 못 미치는 데다 메모리 가격 폭등(칩플레이션) 여파로 원가 부담이 커졌기 때문이다. 원가 절감 압박 속에서 플래그십 신기술 도입에 속도조절을 하는 애플의 전략적 판단을 보여준다. 삼성전자 MX사업부의 원가 관리 및 디스플레이 공급망 전략에도 중요한 시사점을 제공한다.", "source": "전자신문", "date": "2026-09-22 10:21", "url": "https://www.etnews.com/20260922000179", "category": "launch", "importance": 5, "sid": "phone", "topic": "아이폰 20주년 디스플레이 신기술 도입 지연"}, {"title": "HBM에 발목 잡힌 K반도체, 中 CXMT에 범용 D램 맹추격 허용 - nbn 시사경제", "summary": "HBM 시장 선점에 발이 묶인 K반도체의 허를 찔러, 중국 CXMT가 범용 D램 시장에서 맹추격을 허용하며 점유율을 높여가고 있다. AI용 메모리 쏠림 현상으로 발생한 레거시 시장의 공백을 중국 자본과 물량이 완벽하게 대체하는 모양새다. 메모리 반도체 패권 경쟁의 지형도가 흔들리고 있다. 국가 차원의 반도체 전략 점검이 요구되는 중대한 국면이다.", "source": "nbn 시사경제", "date": "2026-09-22 09:29", "url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFBlQUN3RlJuc3ZxZHRmNVI3clRRWkppaDJ3OW9xV0ltV1VvMk50S1RXQktIa1FIUEZ0bkN2eTRjN2xXSml0cWMyMmp3QVlqNXhvVTJGUVhjZUcwNklmTEVkRU5FNFNmZ2lDTnc?oc=5", "category": "launch", "importance": 5, "sid": "memchina", "topic": "k반도체 hbm 집중 사이 中 범용 d램 침투"}, {"title": "애플, 구형 아이폰까지 100파운드 인상…삼성전자·SK하이닉스 메모리값 ‘힘’ 세졌다 - 중앙이코노미뉴스", "summary": "애플이 구형 아이폰 모델까지 가격을 100파운드 인상한 가운데, 삼성전자와 SK하이닉스의 메모리 가격 협상력이 한층 더 강해졌다. 메모리 공급 부족과 원가 상승 압박을 견디지 못한 세트 업체들이 부품 가격 인상안을 고스란히 수용하고 있다. 메모리 반도체 공급사들의 주도권이 절대적으로 강화되었음을 보여준다. 세트 사업부 입장에서는 원가 상승에 따른 수익성 방어가 시급해진 상황이다.", "source": "중앙이코노미뉴스", "date": "2026-09-22 08:00", "url": "https://news.google.com/rss/articles/CBMickFVX3lxTE5Kd3RZUXJiTWlXZVRMU0ttVjFxeTJaME01NUNGbmxOZHdOZ2t1am1lLU9KUVBqV1hTQ21BY2pXWXVRVmlYcGlQVnpzUFBWaUVidW9NbFVWTjdtd1BKUzFuS1hiY0FEYW9NMnJYMlh5V3lVQQ?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "애플 구형폰 가격 인상 메모리값"}, {"title": "Report: AI glasses shipments surged 263% in H1 2026 as Apple prepares to enter the market", "summary": "카운터포인트 리서치에 따르면 2026년 상반기 전 세계 AI 글래스 출하량이 263% 급증했으며, 메타가 디스플레이가 없는 부문에서 개인정보 보호 우려 속에서도 선두를 차지하고 있습니다. 애플의 시장 진입을 앞두고 웨어러블 XR 시장의 폭발적인 성장세를 보여주는 핵심 지표입니다.", "source": "9to5Mac", "date": "2026-09-22 04:55", "url": "https://9to5mac.com/2026/09/21/report-ai-glasses-shipments-surged-263-in-h1-2026-as-apple-prepares-to-enter-the-market/", "category": "launch", "importance": 5, "sid": "glasses", "topic": "ai 글래스 출하량"}, {"title": "HP Warns PC Shipments Will Shrink Through 2027 as Memory Prices Surge - Startup Fortune", "summary": "스타트업 포춘은 HP가 치솟는 메모리 반도체 가격 여파로 인해 2027년까지 PC 출하량 감소세가 지속될 것이라고 엄중히 경고했다고 보도했습니다. 메모리 대란이 글로벌 PC 제조사의 중장기 사업 실적과 출하 목표에 미치는 직접적 타격을 보여주는 확정된 경고 사건입니다. 노트북 및 PC 사업을 영위하는 삼성전자 MX사업부에 즉각적인 대응 전략과 공급망 관리를 요구하는 긴급 사안입니다.", "source": "Startup Fortune", "date": "2026-09-22 01:16", "url": "https://news.google.com/rss/articles/CBMingFBVV95cUxNa3FWeTdCZ0dCa0ZYV2ZDTG11N0VJTHFWS2NVczNGaFlsQmN4b1hjeXpkWlk0SXB4Y2g5eUNXbWU0ZmZTbVd2ZG5iaW5zLV9kd1NLTlZxanFrUTNYbmdZT0RNU0FFR3lwUVpzTG5XRVVpZFI1eXhrdkNibWlkSDkwWjB3WkJDZno4X1gyaElwQ0s3Z1hILXpETDNJTXNWQQ?oc=5", "category": "price", "importance": 5, "sid": "pc", "topic": "hp pc 출하량 메모리"}, {"title": "Galaxy phones have an app delay problem, but Samsung is on the case", "summa <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
