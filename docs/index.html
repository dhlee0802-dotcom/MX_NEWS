rtphone Price Hikes Loom Next Year - f", "summary": "빅고 파이낸스는 AI 인프라 확대로 인한 메모리 반도체 밀어내기(Crowding-Out) 현상이 심화되면서, 내년 스마트폰 제조사들의 대규모 가격 인상이 불가피하다고 보도했다. DRAM과 NAND 공급 부족이 세트 부문의 원가 압박을 극한으로 치닫게 만들고 있다. 부품 비용 급등은 완제품 가격 경쟁력에 직격탄이 된다. 삼성 MX사업부의 내년도 스마트폰 가격 책정 및 수익성 방어 전략에 즉각적인 대응이 요구되는 긴급 이슈다.", "source": "finance.biggo.com", "date": "2026-09-24 16:26", "url": "https://news.google.com/rss/articles/CBMidkFVX3lxTE1xSzk2VXA5SmhpRUMxbm5NeHQ4T3A5MnhuTHZnZ3RzMWdXdUwyRWV2UkVtb3R1b1E5VnNDVzZjZTg2OVRQSzRBemZmbEtFbTY5VVVoVlgzRmZrQjlkUnNhVG1IWWVhSDV2dnkyaWpLYU1xX3RxTVE?oc=5", "category": "price", "importance": 5, "sid": "memchina", "topic": "ai 메모리 품귀 현상 및 스마트폰 가격 인상 전망"}, {"title": "Meta’s newest smart glasses are its most affordable ones yet", "summary": "메타가 배터리 수명을 대폭 개선하고 두께를 슬림화하면서도 가격을 대폭 낮춘 차세대 보급형 스마트 글래스 '레이밴 메타(Gen 3)'를 공식 발표했습니다. 역대 가장 저렴한 가격대를 형성하여 일상 착용형 스마트 글래스의 글로벌 대중화를 본격 견인하겠다는 전략입니다. 스마트 안경 시장에서 메타의 독주 체제가 한층 강화될 것으로 전망됩니다. 당사 차세대 AI 글래스 출시 시점의 가격 책정 및 폼팩터 전략 수립에 결정적인 위협 요인입니다.", "source": "Android Authority", "date": "2026-09-24 15:52", "url": "https://www.androidauthority.com/meta-glasses-ray-ban-meta-gen-3-launched-3714910/", "category": "launch", "importance": 5, "sid": "glasses", "topic": "메타 레이밴 메타 gen 3 보급형 스마트 글래스"}, {"title": "Meta’s newest smart glasses ditch the camera to avoid the ‘pervert-glasses’ tag", "summary": "메타가 공공장소에서의 불법 촬영 논란 및 프라이버시 오명을 극복하기 위해 카메라를 과감히 없앤 신형 스마트 글래스와 아기자기한 AI 디바이스 '뮤즈 참'을 공개했습니다. 사용자의 사생활 침해 우려를 원천 차단하면서 음성 기반 AI 어시스턴트 기능에만 집중할 수 있는 새로운 카테고리를 개척했습니다. 스마트 웨어러블에 대한 대중의 거부감을 낮추기 위한 파격적인 하드웨어 설계 전략입니다. 당사의 XR 및 AI 웨어러블 기기 제품 기획에 중대한 기준점을 제시합니다.", "source": "Android Authority", "date": "2026-09-24 15:20", "url": "https://www.androidauthority.com/ray-ban-meta-audio-muse-charm-launched-3714882/", "category": "launch", "importance": 5, "sid": "glasses", "topic": "메타 카메라 없는 스마트 글래스 및 뮤즈 참"}, {"title": "Meta’s new featherweight VR Glasses take a swing at Apple Vision Pro with IMAX and hologra", "summary": "메타가 애플 비전 프로 가격의 절반 이하라 . 세부 사양과 폼팩터 변화가 사전에 노출되면서 시장의 이목이 집중되고 있다.", "source": "Android Authority", "date": "2026-09-23 22:19", "url": "https://www.androidauthority.com/samsung-galaxy-tab-s12-plus-ultra-leak-renders-specs-3714531/", "category": "launch", "importance": 5, "sid": "tablet", "topic": "갤럭시 탭 s12 플러스 울트라 유출"}, {"title": "Smartphone shipments come under pressure as memory prices squeeze sector - China Daily", "summary": "치솟는 메모리 반도체 가격으로 인해 모바일 부문 원가 압박이 가중되면서 전 세계 스마트폰 출하량 전체가 심각한 타격과 압박을 받고 있다. 당사 스마트폰 사업의 거시적 리스크 요인이다.", "source": "China Daily", "date": "2026-09-23 21:29", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTFBvY1ZONGJKSVFmN0ZxMGxTUHNiM3NoUnBVdGpVaWFLVllBcjlScE9ESHNYbkVYTWJZRTMtTjhfUVNOR0cxaDdHU0Fzbl96YjdrbTd3NzlpQVNFNjNZY0tVTnlSZzVld1p2eXhncVpCcjVMam9iR3BwR0NIYzR3QQ?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "메모리 가격 스마트폰 출하량 압박"}, {"title": "Samsung’s next flagship tablets leak with familiar looks and big battery claims", "summary": "삼성전자의 차기 플래그십 태블릿이 친숙한 디자인과 대용량 배터리 주장을 담아 유출되었다. 배터리 지속 시간 및 내구성에 대한 정보가 유출된 정보 더미에 합류했다. 당사 플래그십 태블릿 신제품 출시를 앞둔 사전 유출 정보로 주시가 필요하다.", "source": "Android Authority", "date": "2026-09-23 18:00", "url": "https://www.androidauthority.com/galaxy-tab-s12-ultra-renders-battery-leak-3714396/", "category": "launch", "importance": 5, "sid": "tablet", "topic": "galaxy 사건"}, {"title": "\"반도체값 올랐는데 왜 우리가?\"…국내 부품사들 '날벼락' - 한국경제", "summary": "메모리 반도체 가격이 급등한 여파로 인해 스마트폰 제조사에 부품을 공급하는 국내 협력업체들과 부품사들이 심각한 원가 압박에 직면했습니다. 완성품 단가는 올리기 어려운 상황에서 부품 비용만 치솟아 채산성이 악화되고 있습니다. 모바일 생태계 전반의 하청 및 협력사들이 연쇄적인 타격을 입고 있습니다. MX사업부의 공급망 관리에도 악영향을 미치는 중대한 이슈입니다.", "source": "한국경제", "date": "2026-09-23 16:40", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE9yYnk3SFNLSUx3ZWctWUlBZVNUN0xzRlgzN1B2cmZEZkI0eVBsQWV4LXZhYzdXaW45blp6ODNja0dVR1g0SHJXQS1uYnRrMUhTNTlsV2JWci0wdw?oc=5", "category": "price", "importance": 5, "sid": "phone", "topic": "부품사 반도체값인상 날벼락"}, {"title": "Facing trouble with the Home Up Good Lock module? You’re not alone, and a fix is coming", "summary": "삼성전자의 커스텀 커뮤니티 및 굿락(Good Lock) '홈 업(Home Up)' 모듈 사용 중 사용자 정의 폴더 라벨 색상 설정에서 발생한 오류로 인해 불편을 겪는 사용자들이 속출하고 있으며, 삼성 측이 공식 수정 패치를 준비 중입니다. 당사 소프트웨어 서비스 오류 및 긴급 조치 사안에 해당합니다. 공식 서비스 오류에 대한 패치 조치가 진행 중입니다.", "source": "Android Authority", "date": "2026-09-23 16:31", "url": "https://www.androidauthority.com/good-lock-home-up-backup-issues-3714410/", "category": "quality", "importance": 5, "sid": "phone", "topic": "굿락 홈 업"}, {"title": "“메모리가 혼자 다 끌고 간다…삼성전자 3분기 영업이익 100조 폭발, 가전·폰 적자도 압도” - 뉴스퀘스트", "summary": "메모리 반도체 부문의 독보적인 실적 호조에 힘입어 삼성전자의 3분기 영업이익이 100조 원을 폭발적으로 돌파할 것으로 보이며, 가전 및 스마트폰 부문의 적자 우려마저 압도하고 있다는 보도입니다. 반도체 슈퍼 사이클이 전사 실적을 견인하는 구조가 극대화되었습니다. 세트 사업의 부진을 반도체 이익이 완전히 상쇄하는 양상입니다. 전사 차원의 자원 배분과 실적 구조를 이해하는 데 핵심적인 뉴스입니다.", "source": "뉴스퀘스트", "date": "2026-09-23 15:23", "url": "https://news.google.com/rss/articles/CBMib0FVX3lxTE1ZNDhwUUhkdTJCQkx1U0ZxelcxVkdoTThXSTBkSW8zbVBibVVNem1fSXpVQ3puY1ZreFRPTVlEZFdvMHFlNk56NjBLNGJsWVEyeGg3dlZzeTViLUxRTElxTTREWkRBSDlRd2VKaUN1aw?oc=5", "category": "exec", "importance": 5, "sid": "memchina", "topic": "삼성전자 3분기 메모리 영업익 100조"}, {"title": "The Galaxy S26 series is now getting stable One UI 9 in the US!", "summary": "미국에서 갤럭시 S26 시리즈에 대한 원 UI 9 안정화 업데이트가 시작되었습니다. 티모바일 S26 울트라를 시작으로 순차적으로 배포될 예정입니다. 당사 플래그십 모델의 최신 소프트웨어 업그레이드가 본격적으로 적용되는 중대한 사건입니다.", "source": "Android Authority", "date": "2026-09-23 15:11", "url": "https://www.androidauthority.com/samsung-galaxy-s26-series-stable-one-ui-9-us-3714362/", "category": "launch", "importance": 5, "sid": "phone", "topic": "galaxy s26 one ui 9"}, {"title": "메모리 뺀 삼성전자 올해 실적 심상찮다⋯모바일.완제품 적자 우려 - 엠투데이", "summary": "메모리 반도체를 제외할 경우 삼성전자의 올해 실적이 심상치 않으며 모바일 및 완제품(MX) 부문에서 적자 우려까지 제기되었습니다. 부품가 상승과 세트 수요 부진이 겹치면서 MX 사업부의 수익성이 심각한 위협을 받고 있음을 경고합니다. 경영진의 즉각적인 비용 통제 및 대응 전략 수립이 필수적입니다.", "source": "엠투데이", "date": "2026-09-23 14:47", "url": "https://news.google.com/rss/articles/CBMib0FVX3lxTFBvY2I0TXhDNXpwcGdmbFl3VXY1OU9ycFBWczUtTEFoWk9NdEZYRTdpc2pfbnNMVnhKZndaUXNZQ1c1WkNiSHlEam9VZEw2b2RXck8tRDhkamNMOXVWNk9CZXd3TmNoN0tNVTJMRVBlbw?oc=5", "category": "exec", "importance": 5, "sid": "memchina", "topic": "삼성전자 실적 우려"}, {"title": "\"이 가격 못 맞추면 안방 뺏긴다\"…중국산 공습에 '초비상' - 한국경제", "summary": "중국산 저가 공세에 대응해 이 가격을 맞추지 못하면 안방 시장을 빼앗길 수 있다는 위기감 속에 국내 업계가 초비상 상태에 빠졌다. 저가형 제품군을 중심으로 가격 경쟁이 극한으로 치달으면서 수익성 확보에 비상이 걸렸다. 당사 완제품 사업의 시장 방어를 위한 즉각적인 대응 전략 수립이 시급하다.", "source": "한국경제", "date": "2026-09-23 14:46", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTFBTS0Q4UnJBazN3TUJrazEyRzdDU1FVOWpfSjhDZlhNTTdtQURHaDlaRUhmeHc4MDNvdFRNQ295cmJqSVdjSVpVbS10MmJIWXJTQjRiQTgxb1pxdw?oc=5", "category": "price", "importance": 5, "sid": "memchina", "topic": "중국산 부품 공습"}, {"title": "삼성전자, 차세대 D램 'D0a' 로드맵 수정…하이브리드 본딩 앞당긴다", "summary": "삼성전자가 차세대 D램 개발 전략을 수정하여 기존 프로젝트성 기술인 'B1b'를 정식 로드맵에 편입하고 첫 10나노미터 미만 D램인 'D0a'로 명명했다. 수직트랜지스터 D램은 'D0a-V'로 분리했으며 하이브리드 본딩 도입 시기를 앞당기는 등 초격차 기술 확보에 속도를 내고 있다. 메모리 반도체 초미세 공정 경쟁에서 기술 리더십을 유지하기 위한 전면적인 전략 개편이다. 삼성 MX사업부가 의존하는 메모리 반도체 공급 및 원가 구조에 직결되는 매우 중요한 정보이다.", "source": "ZDNet Korea", "date": "2026-09-23 14:06", "url": "https://zdnet.co.kr/view/?no=20260923090551", "category": "launch", "importance": 5, "sid": "memchina", "topic": "삼성전자 차세대 d램 d0a 로드맵 수정"}, {"title": "삼성전자 냉장고, SW 업데이트 이후 '먹통'…“무상 수리 제공”", "summary": "삼성전자 일부 냉장고 제품에서 스마트싱스를 통한 소프트웨어 업데이트 이후 작동이 멈추거나 냉각 기능에 오류가 발생하는 피해가 접수되었다. 소비자들이 큰 불편을 겪고 있으며 삼성전자는 무상 수리를 제공하기로 했다. 홈 IoT 가전의 소프트웨어 안정성 및 품질 관리에 대한 신뢰도 타격이 우려된다. 즉각적인 고객 지원과 원인 규명이 필요한 사안이다.", "source": "전자신문", "date": "2026-09-23 13:35", "url": "https://www.etnews.com/20260923000158", "category": "quality", "importance": 5, "sid": "memchina", "topic": "삼성전자 냉장고"}, {"title": "스마트폰 집중 모드와 무음 모드, 알림 차단 범위 다르다", "summary": "스마트폰 의 집중 모드와 무음 모드는 알림을 다루는 범위가 다르다. 무음 모드는 주로 알림 소리와 진동을... 삼성전자도 갤럭시 방해 금지 모드에서 연락처·앱·알람 예외와 알림 숨김 방식을 설정할 수 있으며, 메뉴는...", "source": "vegannews.co.kr", "date": "2026-09-23 13:22", "url": "https://www.vegannews.co.kr/news/article.html?no=386546", "category": "other", "importance function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);

  return out.slice(0,10);
}

}

function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
