  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}

, {"title": "iOS 27 basically turns your iPhone and AirPods into an Apple Watch at the gym", "summary": "iOS 27은 체육관에서 아이폰과 에어팟을 애플 워치처럼 활용할 수 있는 기능을 제공한다. 2017년 출시된 GymKit의 기능을 확장하여 호환되는 운동 기기와 심박수 및 거리 데이터를 주고받을 수 있게 된다. 웨어러블 기기 없이도 주변 기기와 연동해 피트니스 측정이 가능해진다. 애플 생태계 내 헬스케어 기능의 접근성이 대폭 강화된다.", "source": "9to5Mac", "date": "2026-09-03 03:00", "url": "https://9to5mac.com/2026/09/02/ios-27-basically-turns-your-iphone-and-airpods-into-an-apple-watch-at-the-gym/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 gymkit 연동 사건"}, {"title": "Is The Calorie Counter on Your Smartwatch Accurate? Not Really, Study Finds", "summary": "최근 진행된 스마트워치의 칼로리 소모량 측정 정확도 평가 연구 결과, 시판 중인 제품들의 추정 정확도가 전반적으로 높지 않은 것으로 나타났다. 웨어러블 기기의 핵심 건강 지표 중 하나인 칼로리 계산 기능의 한계와 개선 필요성을 지적한 내용이다. 삼성전자 갤럭시 워치의 디지털 헬스케어 알고리즘 정확도 제고 및 품질 검증의 중요성을 시사한다.", "source": "CNET", "date": "2026-09-03 02:09", "url": "https://www.cnet.com/tech/mobile/is-the-calorie-counter-on-your-smartwatch-accurate-not-really-study-finds/", "category": "quality", "importance": 3, "wl": true, "topic": "스마트워치 칼로리"}, {"title": "Google is sending MrBeast into the wilderness, armed with AI", "summary": "구글이 인기 유튜버 미스터비스트(MrBeast)와 다년간의 파트너십을 체결하고 향후 영상에 Gemini, Google Health, Fitbit Air를 선보이기로 했다. 첫 영상은 지미 도널드슨이 제미니를 활용하는 내용으로 시작된다. 대중적인 인플루언서를 통한 공격적인 AI 및 헬스케어 생태계 마케팅 전략이다. 소비자 접점을 넓히기 위한 플랫폼 경쟁이 가속화되고 있다.", "source": "The Verge", "date": "2026-09-03 00:47", "url": "https://www.theverge.com/tech/988355/mrbeast-google-partnership-gemini-fitbit", "category": "launch", "importance": 3, "wl": true, "topic": "google mrbeast 파트너십 사건"}, {"title": "HUAWEI’s new watches deliver smarter ski tracking, blood pressure monitoring, and more", "summary": "화웨이가 스마트 스키 트래킹, 혈압 모니터링 등 첨단 기능을 탑재한 새로운 스마트워치 라인업을 출시했다. 웨어러블 시장에서 헬스케어 및 아웃도어 기능을 강화하여 경쟁력을 높이려 한다. 다양한 소비자층을 겨냥한 맞춤형 제품 공세다.", "source": "Android Authority", "date": "2026-09-02 23:06", "url": "https://www.androidauthority.com/huawei-watch-gt-7-watch-6-d3-freebuds-neo-launched-3  for Android Foldables Next Year", "summary": "애플의 아이폰 울트라에 적용된 디스플레이 주름 개선 기술이 내년 안드로이드 폴더블폰에도 적용될 예정이다. 폴더블 기기의 고질적인 문제인 화면 주름을 해결하기 위한 하드웨어 기술 혁신이다. 모바일 디스플레이 시장 전반에 기술 표준을 제시하는 의미가 있다. 삼성전자 등 경쟁사들의 폴더블 디스플레이 개발 전략에 큰 자극이 될 전망이다.", "source": "MacRumors", "date": "2026-09-02 20:57", "url": "https://www.macrumors.com/2026/09/02/iphone-ultra-crease-coming-to-android-foldables/", "category": "quality", "importance": 4, "wl": true, "topic": "아이폰 울트라 주름 개선 사건"}, {"title": "Galaxy S27 Ultra could go Exynos again, and this time, Snapdragon fans might get jealous", "summary": "갤럭시 S27 울트라에 다시 엑시노스가 탑재될 수 있으며, 이번에는 삼성 내부 테스트에서 엑시노스 2700이 스냅드래곤 8 엘리트 젠 6 프로를 능가하는 성능을 보여 스냅드래곤 팬들을 자극할 수 있다는 전망이 제기되었다. 자체 칩셋 경쟁력이 회복되면서 플래그십 AP 전략에 변화가 예상된다. 원가 절감과 성능 최적화 두 마리 토끼를 잡으려는 삼성의 의도가 엿보인다.", "source": "Android Authority", "date": "2026-09-02 20:43", "url": "https://www.androidauthority.com/galaxy-s27-ultra-exynos-rumor-3706017/", "category": "quality", "importance": 4, "wl": true, "topic": "galaxy s27 ultra 엑시노스 탑재 사건"}, {"title": "Xiaomi beats Apple to market with wide Xiaomi 18 Fold reveal", "summary": "샤오미가 애플의 이벤트 이틀 전에 공식 렌더링과 영상을 통해 새로운 와이드 폴더블 폼팩터를 갖춘 '샤오미 18 폴드'를 전격 공개하며 시장 선점에 나섰다. 애플보다 빠르게 신제품을 선보이며 폴더블폰 시장에서의 주도권을 잡으려는 의도다. 경쟁사들의 신제품 출시 일정에 맞춘 치열한 마케팅전의 일환이다.", "source": "Android Authority", "date": "2026-09-02 18:36", "url": "https://www.androidauthority.com/xiaomi-18-fold-launch-details-3705996/", "category": "launch", "importance": 4, "wl": true, "topic": "xiaomi 18 fold 출시 사건"}, {"title": "New Galaxy S27 and S27 Plus leak sets us up for grave disappointment, this time for fast c", "summary": "신형 갤럭시 S27 및 S27 플러스의 유출을 통해 기본 모델이 여전히 갤럭시 S26 FE에도 뒤처지는 등 실망스러운 사양을 보여줄 것으로 예상되어 큰 실망을 안겨주고 있다. 플래그십 기본 모델의 급 나누기와 스펙 정체에 대한 소비자들의 불만이 제기되었다. 경쟁사 제품 대비 경쟁력 저하 우려가 커지는 대목이다.", "source": "Android Authority", "date": "2026-09-02 17:48", "url": "https://www.androidauthority.com/galaxy-s27-plus-charging-speed-25w-3705976/", "category": "quality", "importance": 4, "wl": true, "topic": "galaxy s27 및 s27 plus 유출 사건"}, {"title": "Apple Launching Eight New Products This Month", "summary": "애플이 이번 달에 무려 8개의 새로운 제품을 대거 출시할 예정이다. 하반기 성수기를 겨냥한 대규모 신제품 공세가 예고되었다. 글로벌 IT 및 모바일 시장 전반에 강력한 파급력을 행사할 전망이다. 경쟁사들의 긴장감을 높이는 핵심 이벤트다.", "source": "MacRumors", "date": "2026-09-02 17:15", "url": "https://www.macrumors.com/2026/09/02/apple-launching-eight-new-products-next-month/", "category": "launch", "importance": 4, "wl": true, "topic": "apple 8개 신제품 출시 사건"}, {"title": "“통화 중 카드정보 탈취”…그룹아이비, 신종 NFC 악성코드 발견", "summary": "그룹아이비가 통화 중 스마트폰을 원격 제어하고 비접촉식 카드 정보를 실시간으로 빼내 결제에 이용하는 신종 NFC 중계형 악성코드 '윈드릴레이(WindRelay)'를 발견했다. 감염된 스마트폰의 NFC 기능을 악용해 실물 카드 데이터를 원격의 가짜 결제 단말기로 전송하는 수법이다. 모바일 금융 보안 및 NFC 결제 안전성에 심각한 위협을 가하는 취약점이다. 삼성전자 갤럭시 스마트폰의 보안(Knox) 기능 강화 및 사용자 보호 대책 마련에 긴급히 대응해야 할 사안이다.", "source": "전자신문", "date": "2026-09-02 16:28", "url": "https://www.etnews.com/20260902000401", "category": "quality", "importance": 4, "wl": true, "topic": "nfc 악성코드"}, {"title": "New iPhone Ultra details arrive for specs, multitasking, launch timing, more", "summary": "다음 주 애플의 9월 이벤트에서 공개될 예정인 아이폰 울트라에 대해 사양, 멀티태스킹, 출시 일정 등 새로운 세부 정보가 마크 거먼과의 인터뷰를 통해 공개되었다. 새로운 폼팩터와 고성능 플래그십 라인업 추가에 대한 기대감이 커지고 있다. 스마트폰 시장에서 프리미엄 경쟁에 불을 지피는 계기가 될 전망이다. 출시 임박에 따라 제품 스펙 윤곽이 뚜렷해지고 있다.", "source": "9to5Mac", "date": "2026-09-02 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 4, "wl": true, "topic": "iphone ultra 출시 사건"}, {"title": "Galaxy S25 gets one of the S26’s coolest camera tricks with One UI 9 Beta 1", "summary": "갤럭시 S25가 One UI 9 베타 1을 통해 갤럭시 S26의 가장 멋진 카메라 기술 중 하나인 '수평 고정(Horizontal Lock)' 기능을 이어받았다. 최신 플래그십의 혁신적인 카메라 소프트웨어 기능이 전작 모델로 빠르게 확장되고 있다. 삼성의 소프트웨어 업데이트를 통한 구형 기기 가치 제고 전략의 일환이다. 카메라 사용자 경험을 대폭 향상시키는 요소다.", "source": "Android Authority", "date": "2026-09-02 03:20", "url": "https://www.androidauthority.com/galaxy-s25-one-ui-9-beta-horizontal-camera-lock-3705704/", "category": "launch", "importance": 4, "wl": true, "topic": "one ui 9 beta 1 갤럭시 s25 적용 사건"}, {"title": "Apple Teases 'Huge Launch' Next Week", "summary": "애플이 다음 주 예정된 '거대한 출시(Huge Launch)' 행사를 예고하며 기대감을 최고조로 끌어올리고 있다. 하반기 신제품 라인업 공개를 앞두고 글로벌 IT 업계의 이목이 집중되고 있다. 시장의 판도를 바꿀 혁신 제품들이 대거 선보일 것으로 예상된다.", "source": "MacRumors", "date": "2026-09-02 03:03", "url": "https://www.macrumors.com/2026/09/01/apple-teases-huge-launch-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "apple 거대한 출시 예고 사건"}, {"title": "The Galaxy S26 FE is the wrong Samsung phone to buy right now", "summary": "갤럭시 S26 FE 모델이 현재 시장에서 매력적인 선택지가 아니라는 평가가 제기되었다. 제품 자체의 기본기는 탄탄하지만 가격 대비 포지셔닝이나 경쟁력 측면에서 소비자 소구점이 부족하다는 지적이다. 준프리미엄 세그먼트에서 FE 라인업의 가격과 스펙 설정에 대한 고민이 필요함을 시사한다. 삼성전자 MX사업부의 준플래그십 판매 전략 점검이 요구된다.", "source": "Android Authority", "date": "2026-09-01 18:30", "url": "https://www.androidauthority.com/galaxy-s26-fe-wrong-samsung-phone-buy-3704387/", "category": "price", "importance": 4, "wl": true, "topic": "s26fe 평가"}, {"title": "Breaking: Galaxy S26 series gets eighth One UI 9 beta release (!!)", "summary": "갤럭시 S26 시리즈를 대상으로 One UI 9의 8차 베타 버전이 전격 배포되었다. 지속적인 베타 업데이트를 통해 소프트웨어 완성도를 극한으로 끌어올리려는 삼성전자의 의지를 보여준다. 정식 출시를 앞두고 소프트웨어 안정화 작업이 순조롭게 진행 중임을 시사한다. MX사업부의 플래그십 소프트웨어 품질 관리 역량을 보여주는 중요 소식이다.", "source": "Android Authority", "date": "2026-09-01 18:16", "url": "https://www.androidauthority.com/samsung-galaxy-s26-one-ui-9-beta-8-3705321/", "category": "launch", "importance": 4, "wl": true, "topic": "s26원유아이9베타"}, {"title": "Apple’s first folding iPhone won’t kill Android foldables — it will save them", "summary": "애플의 첫 번째 폴더블 아이폰의 시장 진입이 기존 안드로이드 폴더블폰 시장을 위협하기보다 오히려 전체 폴더블 시장 대중화를 이끌어 '구원투수' 역할을 할 것이라는 전망이 제기됐다. 애플의 참전으로 폴더블 디바이스에 대한 소비자 관심과 생태계가 급격히 성숙할 것으로 기대된다. 삼성전자가 주도해온 폴더블폰 시장의 구도 재편과 파이 확대 측면에서 매우 중요한 의미를 지닌다. 삼성 MX사업부는 애플 진입에 대비한 하드웨어 및 소프트웨어 차별화 전략을 더욱 공고히 해야 한다.", "source": "Android Authority", "date": "2026-09-01 18:00", "url": "https://www.androidauthority.com/apple-foldable-iphone-save-android-phones-3704142/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 폴더블폰"}, {"title": "Breaking: Galaxy S25 series joins the One UI 9 beta program party", "summary": "수개월간 갤럭시 S26 전용으로 제한되었던 One UI 9 베타 프로그램이 드디어 갤럭시 S25 시리즈로 공식 확대 적용되기 시작했다. 전작 플래그십 사용자들에게도 최신 OS 및 AI 경험을 신속하게 제공하려는 삼성전자의 정책 변화를 보여준다. 구형 플래그십 사용자 Lock-in 및 생태계 통합 관리 차원에서 긍정적이다. 삼성 MX사업부의 전작 사후 지원 속도를 보여주는 중요 지표다.", "source": "Android Authority", "date": "2026-09-01 17:38", "url": "https://www.androidauthority.com/samsung-galaxy-s25-one-ui-9-beta-1-3705298/", "category": "launch", "importance": 4, "wl": true, "topic": "s25원유아이9베타"}, {"title": "iOS 27 Introduces New 'iPhone Handoff' Feature", "summary": "iOS 27에 새롭게 '아이폰 핸드오프(iPhone Handoff)' 기능이 도입되어 기기 간 연동성이 한층 강화된다. 애플 생태계 내 기기 간 연속성을 극대화하는 소프트웨어 업데이트다. 사용자 생산성을 높이는 핵심 기능으로 주목받고 있다.", "source": "MacRumors", "date": "2026-09-03 04:35", "url": "https://www.macrumors.com/2026/09/02/ios-27-iphone-handoff-feature/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 핸드오프 기능 사건"}, {"title": "Students and opposition activists targeted with spyware in Serbia", "summary": "세르비아의 학생들과 야권 운동가들이 스파이웨어의 표적이 되었다. 타겟이 된 12명은 애플로부터 아이폰이 침해당했다는 알림을 받았다. 이번 사태는 특정 정권이나 세력이 모바일 기기를 해킹하는 보안 위협을 보여준다. 모바일 보안과 개인정보 보호의 중요성이 더욱 부각되고 있다.", "source": "Financial Times Tech", "date": "2026-09-03 04:11", "url": "https://www.ft.com/content/c9c3a0ef-98d5-4aeb-9d20-e6250d6fcf99?syn-25a6b1a6=1", "category": "quality", "importance": 3, "wl": true, "topic": "iphone 해킹 사건"}, {"title": "iOS 27 fixes Apple Mail in three ways longtime users will love", "summary": "iOS 27은 Siri AI와 Apple Mail, Notes 등 생산성 앱 업그레이드를 탑재하고 있다. 오랜 사용자들을 위해 불편했던 버그들을 수정하는 기능들이 포함되어 사용자 경험을 개선한다. 애플의 모바일 운영체제 전반에 걸친 AI 기능 통합과 안정성 확보에 초점이 맞춰져 있다. 아이폰 사용자들의 핵심적인 소프트웨어 업그레이드 경험에 변화를 준다.", "source": "9to5Mac", "date": "2026-09-03 04:00", "url": "https://9to5mac.com/2026/09/02/ios-27-fixes-apple-mail-in-three-ways-longtime-users-will-love/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 업데이트 사건"}, {"title": "New Galaxy A18 leak reveals three colorways and up to 256GB of storage", "summary": "신형 갤럭시 A18의 유출을 통해 세 가지 색상 옵션과 최대 256GB의 저장 용량이 공개되었다. 화려한 색상보다는 실용성에 초점을 맞춘 보급형 스마트폰 라인업이다. 삼성전자의 가성비 중저가 시장 공략 전략을 보여준다.", "source": "Android Authority", "date": "2026-09-03 01:43", "url": "https://www.androidauthority.com/samsung-galaxy-a18-colors-leak-3706354/", "category": "launch", "importance": 3, "wl": true, "topic": "galaxy a18 유출 사건"}, {"title": "제미나이가 여권 둔 곳 기억…구글, 안드로이드 새 기능 5종 공개", "summary": "구글이 9월 안드로이드 드롭을 통해 제미나이를 활용한 분실물 위치 기억 기능, 이동 중 멀미 완화 기능, 시각장애인을 위한 실시간 음성 안내 등 사용자 접근성과 일상 편의성을 대폭 개선한 신기능 5종을 공개했다. 모바일 OS 내 AI 통합 서비스 경쟁력을 강화하려는 조치다. 삼성전자 갤럭시 AI의 기능 고도화와 모바일 생태계 트렌드 분석에 필수적인 정보이다.", "source": "ZDNet Korea", "date": "2026-09-02 22:08", "url": "https://zdnet.co.kr/view/?no=20260902220322", "category": "launch", "importance": 3, "wl": true, "topic": "안드로이드 제미나이"}, {"title": "The next Snapdragon flagship chip is getting Qualcomm’s take on DLSS", "summary": "차세대 스냅드래곤 플래그십 칩셋에 퀄컴 버전의 DLSS 기술이 탑재될 예정이다. 퀄컴은 차세대 스마트폰의 그래픽 성능을 향상시키기 위해 AI 하드웨어를 적극 활용하고 있다. 모바일 게이밍 환경과 그래픽 처리 능력이 대폭 향상될 것으로 기대된다. 모바일 프로세서 시장의 기술 경쟁력을 높이는 핵심 요소다.", "source": "Android Authority", "date": "2026-09-02 22:00", "url": "https://www.androidauthority.com/qualcomm-snapdragon-8-elite-gen-6-gpu-3705379/", "category": "launch", "importance": 3, "wl": true, "topic": "snapdragon 차세대 칩셋 dlss 사건"}, {"title": "Apple Labor Day 2026 deals now live: AirPods Pro 3, M6 Mac mini, AirTag 2, iPhone, more [U", "summary": "아마존 노동절 세일을 맞아 에어팟 프로 3가 50달러 할인된 199달러로 가격이 인하되었으며, 에어태그 2와 아이폰 등 애플 주요 제품들의 대규모 할인이 시작되었다. 가을 신제품 출시를 앞두고 대형 유통업체들을 중심으로 재고 정리와 수요 선점을 위한 가격 할인 경쟁이 치열해지고 있다. 소비자들의 구매 부담을 낮추는 요인으로 작용한다.", "source": "9to5Mac", "date": "2026-09-02 21:17", "url": "https://9to5mac.com/2026/09/02/apple-labor-day-2026-deals-live/", "category": "price", "importance": 3, "wl": true, "topic": "apple 기기 할인 사건"}, {"title": "Randomly locked out of your Samsung account? You’re not alone", "summary": "삼성 계정에서 이유 없이 무작위로 잠기는 현상이 발생해 사용자들의 혼란이 이어지고 있다. 한 미확인 가설에 따르면 이는 별칭 이메일 주소 사용과 관련이 있을 수 있다는 분석이다. 계정 보안 및 로그인 시스템과 관련된 오류로 사용자 불만이 제기되고 있다.", "source": "Android Authority", "date": "2026-09-02 20:09", "url": "https://www.androidauthority.com/samsung-galaxy-accounts-random-deactivation-3706032/", "category": "quality", "importance": 3, "wl": true, "topic": "samsung 계정 무작위 잠금 사건"}, {"title": "Leakers battle over whether third iPhone 18 Pro color will be silver or black", "summary": "다음 주 출시를 앞둔 아이폰 18 프로의 세 번째 색상이 실버가 될지 블랙이 될지를 두고 유명 유출가들 사이에 의견이 엇갈리고 있다. 전작들의 성공에 이어 신제품의 디자인과 색상 옵션에 대한 시장의 관심이 매우 높다. 출시 임박 시점에서 마케팅 기대감을 높이는 요소로 작용한다. 세부 스펙과 외관에 대한 다양한 추측이 난무하고 있다.", "source": "9to5Mac", "date": "2026-09-02 19:53", "url": "https://9to5mac.com/2026/09/02/leakers-battle-over-whether-third-iphone-18-pro-color-will-be-silver-or-black/", "category": "launch", "importance": 3, "wl": true, "topic": "iphone 18 pro 색상 사건"}, {"title": "Leaked iPhone 18 Pro Parts Point to Three Color Options Excluding Black", "summary": "유출된 아이폰 18 프로 부품들을 통해 블랙을 제외한 세 가지 색상 옵션이 제공될 것임이 시사되었다. 신제품 출시를 앞두고 디자인 및 색상 마케팅에 대한 정보가 구체화되고 있다. 소비자의 구매 의향에 영향을 미치는 주요 요소다.", "source": "MacRumors", "date": "2026-09-02 19:17", "url": "https://www.macrumors.com/2026/09/02/leaked-iphone-18-pro-parts-point-to-three-colors/", "category": "launch", "importance": 3, "wl": true, "topic": "iphone 18 pro 부품 색상 사건"}, {"title": "Pixel 11 notifications are the last straw for many readers sick of phone ads", "summary": "픽셀 11의 알림 기능에 포함된 광고로 인해 스마트폰 광고에 지친 많은 독자들이 불만을 터뜨리며 마지막 인내심 한계에 다다랐다. 스마트폰 제조사들의 알림 기반 광고 정책에 대한 소비자 반발이 거세지고 있다. 사용자 경험을 저해하는 소프트웨어 정책의 문제점을 지적한다.", "source": "Android Authority", "date": "2026-09-02 19:15", "url": "https://www.androidauthority.com/pixel-11-ads-on-smartphones-poll-results-3705986/", "category": "quality", "importance": 3, "wl": true, "topic": "pixel 11 알림 광고 논란 사건"}, {"title": "I downloaded Android 17 QPR2 Beta 4. These 3 features instantl function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
</html>
