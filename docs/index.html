ority", "date": "2026-09-04 20:22", "url": "https://www.androidauthority.com/samsung-galaxy-watch-7-ultra-one-ui-9-watch-beta-3707568/", "category": "launch", "importance": 3, "wl": true, "topic": "galaxy watch one ui 9 watch", "alert": false}, {"title": "watchOS 27 removes three features that Apple Watch users might miss after updating", "summary": "이달 말 출시될 예정인 애플의 watchOS 27 업데이트에서 일부 애플워치 사용자가 아쉽게 느낄 만한 세 가지 기능이 제외됩니다. 소프트웨어 버전 업그레이드 과정에서 기존 기능의 변경 및 삭제가 이루어짐에 따라 사용자들의 적응이 필요할 것으로 보입니다. 웨어러블 운영체제의 고도화 과정에서 기능 최적화와 사용자 경험 사이의 조정 작업이 반영된 결과입니다. 업데이트 이후 사용자 피드백이 주목됩니다.", "source": "9to5Mac", "date": "2026-09-05 05:36", "url": "https://9to5mac.com/2026/09/04/watchos-27-removes-three-features-that-apple-watch-users-might-miss-after-updating/", "category": "quality", "importance": 2, "wl": true, "topic": "watchos 27", "alert": false}, {"title": "Pixel Watch 5 gets its first update, and Gemini is stealing the show", "summary": "픽셀 워치 5(Pixel Watch 5)가 첫 번째 소프트웨어 업데이트를 배포한 가운데 제미나이(Gemini)와 핸즈프리 컨트롤 기능이 핵심으로 주목받았습니다. 웨어러블 기기에서 온디바이스 인공지능과 음성 제어의 결합이 제품 만족도를 좌우하는 핵심 요소로 자리 잡았습니다. 구글의 스마트워치 생태계에서 AI 중심의 사용자 경험 강화 전략을 보여줍니다. 웨어러블 기기 소프트웨어 경쟁력의 중요성을 시사합니다.", "source": "Android Authority", "date": "2026-09-05 01:42", "url": "https://www.androidauthority.com/pixel-watch-5-september-update-3707741/", "category": "launch", "importance": 2, "wl": true, "topic": "pixel watch 5", "alert": false}, {"title": "Wear OS users can’t get Gemini to control their smart home", "summary": "웨어 OS(Wear OS) 스마트워치 사용자들 사이에서 이상한 제미나이 버그로 인해 스마트 홈 기기를 음성으로 제어하지 못하는 문제가 발생하고 있습니다. 웨어러블 기기에서 AI 어시스턴트와 스마트 홈 IoT 간의 연동 오작동이 사용자 불편을 야기하고 있습니다. 스마트워치 플랫폼의 소프트웨어 안정성과 기기 간 연동성 검증이 중요함을 보여줍니다. 웨어러블 AI 기능 고도화 과정에서 해결해야 할 과제입니다.", "source": "Android Authority", "date": "2026-09-05 00:41", "url": "https://www.androidauthority.com/gemini-wear-os-smart-home-control-bug-3707766/", "category": "quality", "importance": 2, "wl": true, "topic": "wear os gemini", "alert": false}, {"title": "I tried Motorola’s first W eveals-plans-for-larger-foldable-biggest-overhaul-more/", "category": "launch", "importance": 4, "wl": true, "topic": "iphone 폴더블", "alert": false}, {"title": "Crazy Exynos 2700 leak gives us an unprecedented look at Galaxy S27’s processor", "summary": "차세대 모바일 AP인 엑시노스 2700(Exynos 2700)에 관한 파격적인 유출 정보가 공개되며 차기 갤럭시 S27의 프로세서 성능을 미리 엿볼 수 있게 되었습니다. 대폭 업그레이드된 CPU 코어, 넉넉한 캐시 메모리, 그리고 강력한 신경망처리장치(NPU)가 핵심 하이라이트로 꼽힙니다. 온디바이스 AI 연산 능력과 전력 효율성이 한 차원 높아질 것으로 기대됩니다. 삼성전자의 차세대 플래그십 스마트폰 경쟁력을 좌우할 핵심 반도체 칩셋의 청사진입니다.", "source": "Android Authority", "date": "2026-09-04 20:03", "url": "https://www.androidauthority.com/samsung-exynos-2700-specs-leak-3707590/", "category": "launch", "importance": 4, "wl": true, "topic": "exynos 2700", "alert": false}, {"title": "Apple paying 400% more for iPhone 18 Pro memory, says TrendForce", "summary": "시장조사기관 트렌드포스(TrendForce)에 따르면 애플이 아이폰 18 프로 메모리 부품 비용으로 전년 대비 400% 더 높은 가격을 지불하게 될 것으로 예상됩니다. 메모리 반도체 가격 급등의 영향으로 부품 원가 부담이 극심해졌으나, 애플은 그 인상분의 전액을 소비자 가격에 곧바로 전가하지는 않을 방침인 것으로 전해졌습니다. 원가 상승 압박 속에서도 가격 경쟁력을 유지하려는 제조사의 마진 방어 전략을 보여줍니다. 스마트폰 부품 수급 및 원가 관리 측면에서 업계 전반에 시사하는 바가 큽니다.", "source": "9to5Mac", "date": "2026-09-03 20:37", "url": "https://9to5mac.com/2026/09/03/apple-paying-400-more-for-iphone-18-pro-memory-says-trendforce/", "category": "price", "importance": 4, "wl": true, "topic": "iphone 18 pro 메모리 가격", "alert": false}, {"title": "The Big Questions Before Apple’s Big iPhone Event", "summary": "애플의 대형 스마트폰 행사를 앞두고 소비자들이 두 배 비싼 폴더블 아이폰을 구매할지에 대한 의문이 제기되고 있다. 고가 폴더블폰 시장의 수용성에 대한 시장의 관심이 집중되는 시점이다. 애플이 제시할 가격 전략과 혁신성이 판도를 좌우할 것으로 보인다. 모바일 업계 전체의 프리미엄 전략에 큰 영향을 미칠 전망이다.", "source": "CNET", "date": "2026-09-05 02:15", "url": "https://www.cnet.com/tech/mobile/the-big-questions-before-apples-big-iphone-event/", "category": "launch", "importance": 3, "wl": true, "topic": "아이폰 이벤트 전망", "alert": false}, {"title": "The best tech and gadgets announced at IFA so far", "summary": "유럽 최대 가전 전시회인 IFA 2026이 독일 베를린에서 개막하며 일주일간 쏟아진 주요 신제품과 가전 트렌드가 공개되었습니다. 방대 ": "galaxy s26 fe", "alert": false}, {"title": "Apple Reportedly Plans to Release These 14 Products by Early Next Year", "summary": "애플이 내년 초까지 출시를 계획하고 있는 총 14개에 달하는 신제품 라인업 로드맵이 대거 공개되었습니다. 아이폰, 맥, 아이패드 등 주력 하드웨어 전반에 걸친 방대한 신제품 출시 계획이 윤곽을 드러냈습니다. 애플의 공격적인 하드웨어 갱신 주기가 경쟁사들에게 상당한 압박으로 작용할 전망입니다. 글로벌 IT 시장의 제품 출시 흐름을 파악하는 핵심 정보입니다.", "source": "MacRumors", "date": "2026-09-04 22:55", "url": "https://www.macrumors.com/2026/09/04/apple-14-more-products-by-early-next-year/", "category": "launch", "importance": 3, "wl": true, "topic": "apple 신제품 로드맵", "alert": false}, {"title": "The world’s first triple-200MP camera phone has leaked, and it looks familiar", "summary": "세계 최초로 세 개의 200 메가픽셀(200MP) 카메라 센서를 탑재한 스마트폰이 유출된 가운데, 거대한 카메라 아일랜드 디자인이 친숙한 인상을 줍니다. 모바일 카메라 스펙 경쟁이 울트라 고화소 멀티 렌즈 체제로 극한을 향해 치닫고 있음을 보여줍니다. 스마트폰 후면 디자인과 카메라 모듈의 대형화 추세가 지속되고 있습니다. 모바일 카메라 하드웨어의 초고화소 경쟁 구도를 보여주는 사례입니다.", "source": "Android Authority", "date": "2026-09-04 22:37", "url": "https://www.androidauthority.com/oppo-find-x10-pro-max-design-leak-3707675/", "category": "launch", "importance": 3, "wl": true, "topic": "triple 200mp 카메라폰", "alert": false}, {"title": "September is going Pro Max: Here are the 6 ‘Pro Max’ flagships launching this month", "summary": "9월을 맞아 6개의 주요 스마트폰 브랜드들이 차세대 칩셋과 대대적인 카메라 업그레이드를 탑재한 ‘프로 맥스(Pro Max)’ 플래그십 신제품들을 일제히 출시할 예정입니다. 하반기 글로벌 스마트폰 시장의 패권을 잡기 위한 플래그십 대전이 본격적으로 막을 올렸습니다. 최고급 사양을 무장한 제조사들의 프리미엄폰 경쟁이 치열해질 전망입니다. 삼성전자의 플래그십 라인업에 맞서는 경쟁사들의 총력전이 예고되었습니다.", "source": "Android Authority", "date": "2026-09-04 22:28", "url": "https://www.androidauthority.com/september-2026-pro-max-smartphones-launch-3707688/", "category": "launch", "importance": 3, "wl": true, "topic": "pro max 플래그십", "alert": false}, {"title": "I Took the Pixel 11 Pro and iPhone 17 Pro Around Delhi, and I Know Which Phone Camera’s th", "summary": "올여름 새롭게 향상된 카메라 기능을 선보인 픽셀 11 프로와 아이폰 17 프로의 카메라 성능을 비교하는 리뷰가 공개되었다. 애플의 신제품 행사를 앞두고 두 플래그십 모델의 카메라 화질 경쟁이 주목받고 있다. 스마트폰 핵심 경쟁력인 카메라 성능에서 우위를 점하기 위한 제조사들의 노력이 치열하     const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
