": "Acer Googlebook is officially coming soon, and here’s a first glimpse (Updated)", "summary": "에이서의 구글북스가 공식 출시를 앞두고 첫 번째 모습이 공개되었습니다. 다가오는 9월 15일 공식 구글북스 런칭 행사에서 실물이 공개될지 이목이 쏠리고 있습니다. 새로운 운영체제와 폼팩터를 탑재한 PC 제품군의 등장을 예고합니다. 노트북 시장의 경쟁 구도에 새로운 변수가 될 수 있습니다.", "source": "Android Authority", "date": "2026-09-02 19:24", "url": "https://www.androidauthority.com/acer-googlebook-coming-soon-look-3706074/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 구글북스 출시"}, {"title": "궁극의 선명함: AGON by AOC, 세계 최초 5K NVIDIA G-SYNC® Pulsar 게이밍 모니터 공개", "summary": "에이온 바이 에이오시가 세계 최초로 5K 초고해상도와 엔비디아 지싱크 펄사 기술을 결합해 탁월한 모션 선명도와 부드러운 가변 주사율을 제공하는 게이밍 모니터를 공개했다. 글로벌 게이밍 모니터 1위 브랜드로서 하드웨어 기술력을 과시했다. 고성능 디스플레이 시장의 기술 진화 방향을 보여준다.", "source": "ZDNet Korea", "date": "2026-09-02 19:10", "url": "https://zdnet.co.kr/view/?no=20260902191003", "category": "launch", "importance": 3, "wl": true, "topic": "agon by aoc 5k 모니터"}, {"title": "This concept handheld can turn into a laptop, complete with a keyboard", "summary": "에이서가 컴퓨터 키보드가 완전히 통합되어 노트북으로 변신할 수 있는 혁신적인 컨셉 핸들러 PC를 공개했습니다. 별도의 키보드를 들고 다니지 않아도 되는 휴대용 PC의 새로운 진화 형태를 제시합니다. 게이밍 및 휴대용 컴퓨팅 기기 시장에서 폼팩터의 경계를 허무는 참신한 시도입니다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-project-dualplay-mini-handheld-concept-3705278/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 컨셉핸드헬드"}, {"title": "Acer launches the Swift Air 16 and the incredibly light Swift Blade 14", "summary": "에이서가 인텔 코어 7 성능과 3K OLED 디스플레이를 탑재한 초경량 '스위프트 블레이드 14'와 '스위프트 에어 16' 노트북을 새롭게 출시했습니다. 고성능과 극도의 가벼움을 동시에 구현하여 프리미엄 노트북 시장을 겨냥합니다. 슬림형 PC 시장에서 가시적인 경쟁력을 갖춘 제품입니다. 삼성 갤럭시 북 시리즈에 대응하는 강력한 라이벌입니다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-swift-blade-14-and-air-16-3705806/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 스위프트 블레이드"}, {"title": "Acer Recommits to Repairability With New Vero 16 Laptop", "summary": "에이서가 IFA 2026에서 수리 용이성을 강조한 베로 16 노트북과 함께 역대 가장 슬림한 스위프트 및 스위프트 에어 신제품을 대거 공개했다. 친환경 설계와 제품 수리 편의성, 초슬림 폼팩터 구현에 초점을 맞추었다. 글로벌 PC 시장에서 친환경 디자인과 휴대성 경쟁이 이어지고 있음을 보여준다. 삼성 갤럭시 북 시리즈의 친환경 및 디자인 전략 점검에 참고할 만하다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/computing/acer-recommits-to-repairability-with-new-vero-16-laptop/", "category": "launch", "importance": 3, "wl": true, "topic": "acer vero 16 노트북"}, {"title": "The Dell 14s could be the MacBook Neo alternative you’ve been waiting for", "summary": "델 14스(Dell 14s) 노트북이 소비자들이 고대해 온 맥북 네오의 훌륭한 대안으로 자리잡을 수 있다는 평가가 나왔습니다. 화사한 컬러와 뛰어난 가성비를 무기로 다채로운 전자제품 르네상스 시대를 이끌고 있습니다. 윈도우 진영에서 프리미엄 휴대용 노트북 시장을 공략하는 주요 모델입니다. 삼성 갤럭시 북 시리즈의 강력한 경쟁 상대로 주목됩니다.", "source": "Android Authority", "date": "2026-09-02 16:00", "url": "https://www.androidauthority.com/dell-14s-3705796/", "category": "launch", "importance": 3, "wl": true, "topic": "델 14스 노트북"}, {"title": "Apple tells Mac App Store developers they can now drop Intel support", "summary": "애플이 맥 앱스토어 개발자들에게 macOS 13 이상을 요구하는 유니버설 맥 앱에서 인텔 기반 맥 지원을 중단할 수 있음을 통보했습니다. 인텔 아키텍처에서 완전히 벗어나 자사 실리콘 생태계로의 전환을 가속화하는 조치입니다. 소프트웨어 생태계의 세대교체가 빠르게 이루어지고 있습니다. PC 시장에서 독자 프로세서 기반 체제의 우위가 더욱 굳어지고 있습니다.", "source": "9to5Mac", "date": "2026-09-02 09:50", "url": "https://9to5mac.com/2026/09/01/apple-tells-mac-app-store-developers-they-can-now-drop-intel-support/", "category": "policy", "importance": 3, "wl": true, "topic": "맥 앱스토어 인텔중단"}, {"title": "Mac App Store Apps Can Now Drop Support for Intel Macs", "summary": "맥 앱스토어의 앱들이 인텔 맥 지원을 공식적으로 드롭할 수 있게 되었습니다. 애플 실리콘 중심의 소프트웨어 생태계 전환이 완전히 마무리 단계에 접어들었음을 뜻합니다. 레거시 아키텍처를 완전히 정리하고 성능 최적화에 집중하려는 개발자들의 행보가 이어질 것입니다. PC 플랫폼의 세대교체가 가속화되고 있습니다.", "source": "MacRumors", "date": "2026-09-02 08:50", "url": "https://www.macrumors.com/2026/09/01/mac-app-store-intel-mac-support/", "category": "policy", "importance": 3, "wl": true, "topic": "맥앱스토어 인텔제외"}, {"title": "macOS Golden Gate Seems to Hint at MacBook Pro With OLED Display", "summary": "맥OS 골든 게이트 베타 버전에서 OLED 디스플레이를 탑재한 신형 맥북프로의 출시를 암시하는 단서가 발견되었습니다. 애플이 맥북 라인업에도 차세대 디스플레이인 OLED를 본격적으로 도입할 준비를 하고 있습니다. 모바일과 태블릿에 이어 노트북 시장까지 OLED 대중화가 빠르게 확산될 전망입니다. 디스플레이 패널 시장과 경쟁사 PC 제품군에 큰 파장을 미칠 소식입니다.", "source": "MacRumors", "date": "2026-09-02 04:34", "url": "https://www.macrumors.com/2026/09/01/macos-golden-gate-hdr-liquid-glass/", "category": "quality", "importance": 3, "wl": true, "topic": "맥os oled맥북프로"}, {"title": "Meta launches Muse Voice Transcribe for real-time voice dictation on Mac", "summary": "메타가 실시간 음성 지각 모델인 '뮤즈 보이스 전사(Muse Voice Transcribe)'를 맥용 메타 AI, 뮤즈 코드, 개발자용 API를 통해 출시했습니다. 다국어 스트리밍 음성 변환 기능을 제공하여 생산성 도구의 편의성을 높였습니다. AI 기반 음성 인식 기술이 데스크톱 플랫폼 전반으로 확장되고 있습니다. 맥 생태계에서 AI 음성 유틸리티의 활용도가 한층 높아질 전망입니다.", "source": "9to5Mac", "date": "2026-09-02 02:00", "url": "https://9to5mac.com/2026/09/01/meta-launches-muse-voice-transcribe-for-real-time-voice-dictation-on-mac/", "category": "launch", "importance": 3, "wl": true, "topic": "메타 뮤즈보이스 전사"}, {"title": "Perplexity launches privacy-minded ‘hybrid compute’ AI feature for Mac", "summary": "퍼플렉시티가 프라이버시를 강조한 맥용 '하이브리드 연산' AI 기능을 출시했습니다. M6 맥 미니 런칭 행사에서 애플의 주목을 받았던 퍼플렉시티가 맥 전용 기능을 선보이며 데스크톱 AI 시장 공략에 나섰습니다. 클라우드와 로컬 AI 연산을 결합하여 보안성과 효율성을 동시에 높인 것이 특징입니다. 맥OS 생태계 내에서 AI 검색 및 어시스턴트 경쟁이 가열되고 있습니다.", "source": "9to5Mac", "date": "2026-09-02 00:20", "url": "https://9to5mac.com/2026/09/01/perplexity-launches-privacy-minded-hybrid-compute-ai-feature-for-mac/", "category": "launch", "importance": 3, "wl": true, "topic": "퍼플렉시티 맥 하이브리드"}, {"title": "Here’s how Googlebooks will stop random files from clogging your desktop", "summary": "구글북스가 주제, 이벤트, 작업별로 데스크톱 파일을 자동으로 분류하는 스마트 컬렉션 기능을 도입했습니다. 사용자의 파일 관리 편의성을 획기적으로 개선하려는 소프트웨어 업데이트입니다. 크롬북 및 구글 데스크톱 생태계의 AI 활용 능력이 강화되고 있습니다.", "source": "Android Authority", "date": "2026-09-03 02:55", "url": "https://www.androidauthority.com/googlebooks-automatic-file-sorting-gemini-3706182/", "category": "launch", "importance": 2, "wl": true, "topic": "구글북스 파일정리"}, {"title": "Acer’s new ePaper monitor could make long work sessions easier on the eyes", "summary": "에이서가 장시간 업무에도 눈이 편안하도록 페이퍼라이크 디스플레이, 터치, 고해상도를 지원하는 포터블 모니터 'EP130K'를 출시했습니다. 전자종이 기술을 활용해 시력 보호와 업무 생산성을 동시에 추구하는 실용적인 디바이스입니다. 모니터 시장에서 눈 건강을 중시하는 틈새 수요를 공략합니다.", "source": "Android Authority", "date": "2026-09-02 18:30", "url": "https://www.androidauthority.com/acer-epaper-monitor-launch-3705490/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 이페이퍼 모니터"}, {"title": "Acer Shows Off a Transformer-ish Concept for a Windows Gaming Handheld", "summary": "에이서가 일반 PC 업무와 휴대용 게이밍을 동시에 수행할 수 있도록 키보드가 결합된 트랜스포머 형태의 윈도우 게이밍 핸드헬드 콘셉트 기기를 선보였다. 휴대용 게임기와 노트북의 경계를 허무는 독창적인 폼팩터 디자인이다. 게이밍 기기 및 신개념 모바일 PC 시장의 아이디어를 보여준다. 향후 새로운 폼팩터 트렌드를 파악하는 참고 자료가 된다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/gaming/acer-shows-off-a-transformer-ish-concept-for-a-windows-gaming-handheld/", "category": "launch", "importance": 2, "wl": true, "topic": "acer 핸드헬드 콘셉트"}, {"title": "Dell Doubles Down on Cheap Student Laptops With Lower-End Dell 14S Configs", "summary": "델이 저가형 학생용 노트북 라인업인 델 14S의 보급형 구성을 강화하며 시장 공략에 나섰다. 고물가 시대 교육용 PC 시장에서 가격 경쟁력을 확보하려는 행보다. 실속형 소비자층을 타겟으로 한 보급형 노트북 시장의 가격 경쟁 구도를 보여준다. 삼성 갤럭시 북 보급형 라인업의 가격 정책에 참고가 된다.", "source": "CNET", "date": "2026-09-02 16:00", "url": "https://www.cnet.com/tech/computing/dell-doubles-down-on-cheap-student-laptops-with-lower-end-dell-14s-configs/", "category": "price", "importance": 2, "wl": true, "topic": "dell 14s 노트북"}, {"title": "Samsung's $799 Galaxy Book6 challenges the MacBook Neo with a larger screen and claimed 25", "summary": "테크스팟 등 해외 유력 IT 매체가 799달러의 합리적인 가격에 더 큰 화면과 25시간 배터리 수명을 내세운 삼성 '갤럭시 북6'를 맥북 네오의 강력한 대항마로 집중 분석했다. 고물가 속 가성비를 중시하는 글로벌 PC 시장에서 삼성의 입지를 넓혀줄 구원투수로 평가받고 있다.", "source": "TechSpot", "date": "2026-09-02 23:21", "url": "https://www.techspot.com/news/113709-samsung-launches-799-galaxy-book6-intel-wildcat-lake.html", "category": "launch", "importance": 4, "wl": false, "topic": "뉴 갤럭시 북6 출시"}, {"title": "Labor Day 2026: MacBook Air M4 Hits $799 as AI Memory Locks In Higher Price Floors - techt", "summary": "노동절 시즌을 맞아 맥북 에어 M4가 할인 판매되는 한편, AI 메모리 수요로 인해 고공행진하는 메모리 가격이 전체적인 PC 가격의 하한선을 높이고 있다는 분석입니다. 부품 원가 상승이 완제품 가격 구조에 미치는 영향을 설명합니다.", "source": "techtimes.com", "date": "2026-09-02 04:00", "url": "https://www.techtimes.com/articles/326233/20260901/labor-day-2026-macbook-air-m4-hits-799-ai-memory-locks-higher-price-floors.htm", "category": "price", "importance": 4, "wl": false, "topic": "메모리 가격 동향"}, {"title": "Samsung’s Galaxy Book6: A Lightweight Marvel with 25-Hour Battery for Just $799 - freeyork", "summary": "799달러라는 파격적인 가격과 25시간의 긴 배터리 수명을 갖춘 가벼운 노트북 갤럭시 북6가 소개되었습니다. 뛰어난 휴대성과 전력 효율로 모바일 라이프스타일에 최적화되었습니다. 합리적인 가격 경쟁력을 바탕으로 노트북 시장에서 강력한 돌풍을 예고하고 있습니다. 소비자의 가성비 요구를 충족시키는 핵심 제품입니다.", "source": "freeyork.org", "date": "2026-09-02 03:20", "url": "https://freeyork.org/technology/samsung-s-galaxy-book6-samsungs-galaxy-book6-light/", "category": "launch", "importance": 4, "wl": false, "topic": "갤럭시 북6 출시"}, {"title": "Samsung expands Galaxy Book 6 range with $799 model - t2ONLINE", "summary": "삼성전자가 799달러 모델을 추가하며 갤럭시 북 6 라인업을 확장했습니다. 가격 선택의 폭을 넓혀 더 많은 소비자층을 흡수하려는 전략입니다. 대중적인 가격대 진입을 통해 PC 시장 점유율 확대를 꾀합니다. 경쟁사 제품들과의 가격 탄력성 싸움에서 우위를 점하려는 포석입니다.", "source": "t2ONLINE", "date": "2026-09-01 20:14", "url": "https://t2online.in/tech/tech-news/samsung-expands-galaxy-book-6-range-with--799-model/2007692", "category": "launch", "importance": 4, "wl": false, "topic": "갤럭시 book6 출시"}, {"title": "메모리값 뛰자 ‘가성비 노트북’ 뜬다… 중저가 PC 경쟁 치열 - v.daum.net", "summary": "메모리 반도체 가격이 급등하면서 노트북 제조 원가가 치솟자, 업계에서는 가성비를 내세운 중저가 PC 경쟁이 한층 치열해지고 있다. 고가 프리미엄 제품에 부담을 느낀 소비자들이 늘어나면서 실속형 라인업이 대안으로 부상했다. 삼성전자 등 주요 제조사들은 가격 저항선을 낮춘 보급형 모델을 통해 틈새시장을 적극 공략하고 있다. 수익성과 점유율을 동시에 방어하기 위한 치열한 수싸움이 이어지고 있다.", "source": "v.daum.net", "date": "2026-09-01 18:33", "url": "https://v.daum.net/v/20260901183308624", "category": "launch", "importance": 4, "wl": false, "topic": "메모리값 상승 가성비  헬스 기능 신뢰성 제고를 위한 기술적 보완이 요구된다.", "source": "CNET", "date": "2026-09-03 02:09", "url": "https://www.cnet.com/tech/mobile/is-the-calorie-counter-on-your-smartwatch-accurate-not-really-study-finds/", "category": "quality", "importance": 3, "wl": true, "topic": "smartwatch 칼로리 소모 정확도"}, {"title": "Oura’s Menopause Impact Scale Expands Out of the App and Into Women’s Health Care", "summary": "오우라 링의 제조사가 여성 건강 기업들과 파트너십을 맺고 갱년기 영향 척도 기능을 앱을 넘어 실제 여성 건강 관리 영역으로 확장한다. 헬스케어 웨어러블 데이터가 전문 의료 및 여성 생애 주기 관리 서비스로 깊숙이 연계되고 있다. 디지털 헬스케어 플랫폼의 확장 가능성을 보여준다. 삼성 헬스의 타겟 세대별 맞춤 기능 고도화에 시사점을 준다.", "source": "CNET", "date": "2026-09-02 21:04", "url": "https://www.cnet.com/health/medical/oura-menopause-impact-scale-womens-health-care/", "category": "launch", "importance": 3, "wl": true, "topic": "oura 갱년기 건강 관리"}, {"title": "“치실 귀찮다”던 다이슨 창업자, 카메라로 문제 풀었다", "summary": "다이슨이 카메라를 이용해 치아 사이 보이지 않는 틈을 찾아내는 오랄케어 기기 다이슨 카메라젯을 출시하며 헬스케어 제품군으로 사업을 본격 확대한다. 헤어케어와 청소기에 이어 개인 건강 관리 영역으로 포트폴리오를 넓히는 첫걸음이다. 글로벌 가전 및 헬스케어 브랜드의 영역 파괴 경쟁을 보여준다. 삼성전자의 디지털 헬스 및 홈 웰니스 전략에 참고가 된다.", "source": "전자신문", "date": "2026-09-02 16:00", "url": "https://www.etnews.com/20260902000315", "category": "launch", "importance": 3, "wl": true, "topic": "다이슨 카메라젯 오랄케어"}, {"title": "Google is sending MrBeast into the wilderness, armed with AI", "summary": "구글이 유명 유튜버 미스터비스트(지미 도널드슨)와 다년간의 파트너십을 체결했습니다. 미스터비스트는 향후 영상에서 제미니, 구글 헬스, 핏빗 에어 등을 적극 활용할 예정입니다. 첫 영상에서는 제미니를 사용하는 모습이 공개되며 대중적 인지도를 활용한 마케팅을 시작합니다. 구글의 AI 및 헬스케어 생태계 홍보에 큰 파급효과가 기대됩니다.", "source": "The Verge", "date": "2026-09-03 00:47", "url": "https://www.theverge.com/tech/988355/mrbeast-google-partnership-gemini-fitbit", "category": "launch", "importance": 2, "wl": true, "topic": "구글 미스터비스트"}, {"title": "Ultrahuman wants real-world health data, and is asking its users for it", "summary": "울트라휴먼이 실사용자들을 대상으로 실제 건강 데이터를 자사 플랫폼에 공유해 줄 것을 공개 요청했다. 웨어러블 기기 제조사가 알고리즘 고도화를 위해 대규모 사용자 생체 데이터를 확보하려는 시도다. 디지털 헬스케어 및 웨어러블 데이터 활용 트렌드를 보여준다. 삼성 헬스 및 갤럭시 워치 에코시스템 전략 수립에 참고가 된다.", "sour ing-speed-25w-3705976/", "category": "quality", "importance": 4, "wl": true, "topic": "갤럭시s27 충전속도"}, {"title": "“통화 중 카드정보 탈취”…그룹아이비, 신종 NFC 악성코드 발견", "summary": "그룹아이비가 통화 중 스마트폰을 원격 제어하고 비접촉식 카드 정보를 실시간으로 빼내어 결제에 이용하는 신종 NFC 중계형 악성코드 윈드릴레이를 발견했다. 감염된 스마트폰의 NFC 기능을 악용해 실물 카드 데이터를 공격자의 단말기로 전송하는 수법이다. 모바일 금융 보안에 심각한 위협을 초래할 수 있는 취약점이다. 스마트폰 운영체제 차원의 보안 대책 강화가 시급하다.", "source": "전자신문", "date": "2026-09-02 16:28", "url": "https://www.etnews.com/20260902000401", "category": "quality", "importance": 4, "wl": true, "topic": "윈드릴레이 nfc 악성코드"}, {"title": "New iPhone Ultra details arrive for specs, multitasking, launch timing, more", "summary": "다음 주 애플 9월 이벤트에서 공개될 폴더블 형태의 '아이폰 울트라'에 대한 스펙, 멀티태스킹, 출시 일정 등의 새로운 세부 정보가 마크 거먼의 인터뷰를 통해 공개되었습니다. 애플의 첫 폴더블 스마트폰 진출작으로 시장의 판도를 바꿀 게임 체인저로 기대를 모으고 있습니다. 폴더블폰 시장을 주도해 온 삼성전자에 가장 강력한 경쟁 상대로 부상할 전망입니다. MX사업부의 즉각적인 프리미엄 전략 대응이 요구됩니다.", "source": "9to5Mac", "date": "2026-09-02 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 스펙"}, {"title": "Foldable iPhone Ultra Likely Has MagSafe Charging", "summary": "출시를 앞둔 폴더블 형태의 '아이폰 울트라'에 맥세이프(MagSafe) 무선 충전 기능이 탑재될 가능성이 높다는 보도가 나왔습니다. 폼팩터의 혁신과 함께 기존 액세서리 생태계와의 호환성을 유지하려는 전략입니다. 폴더블폰의 편의성을 높이는 핵심 기능으로 주목받고 있습니다. 삼성전자의 폴더블폰 무선 충전 및 악세서리 전략에도 시사하는 바가 큽니다.", "source": "MacRumors", "date": "2026-09-02 04:05", "url": "https://www.macrumors.com/2026/09/01/foldable-iphone-ultra-magsafe/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰울트라 맥세이프"}, {"title": "Samsung is expanding the One UI 9 beta to its older foldables", "summary": "삼성전자가 전세대 폴더블 스마트폰 모델을 대상으로 원 UI 9 베타 프로그램을 확대 적용한다. 최신 소프트웨어 경험을 구형 기기 사용자에게까지 빠르게 넓히려는 조치다. 갤럭시 생태계 전반의 소프트웨어 지원 체계를 강화하고 고객 충성도를 높인다. 플래그십 및 폴더블 사용자 유지에 긍정적인 영향을 미친다.", "source": "Android Authority", "date": "2026-09-02 01:13", "url": "https://www.androidauthority.com/one-ui-9-beta-galaxy-z-fold-7-3705578/", "categ 를 받았습니다. 특정 정치적 목적을 가진 사이버 공격에 스마트폰이 악용되고 있음을 보여줍니다. 모바일 기기의 보안과 프라이버시 보호의 중요성이 더욱 커지고 있습니다.", "source": "Financial Times Tech", "date": "2026-09-03 00:48", "url": "https://www.ft.com/content/c9c3a0ef-98d5-4aeb-9d20-e6250d6fcf99?syn-25a6b1a6=1", "category": "quality", "importance": 3, "sid": "phone", "topic": "아이폰 보안 위협"}, {"title": "Google is sending MrBeast into the wilderness, armed with AI", "summary": "구글이 유명 유튜버 미스터비스트(지미 도널드슨)와 다년간의 파트너십을 체결했습니다. 미스터비스트는 향후 영상에서 제미니, 구글 헬스, 핏빗 에어 등을 적극 활용할 예정입니다. 첫 영상에서는 제미니를 사용하는 모습이 공개되며 대중적 인지도를 활용한 마케팅을 시작합니다. 구글의 AI 및 헬스케어 생태계 홍보에 큰 파급효과가 기대됩니다.", "source": "The Verge", "date": "2026-09-03 00:47", "url": "https://www.theverge.com/tech/988355/mrbeast-google-partnership-gemini-fitbit", "category": "launch", "importance": 2, "sid": "health", "topic": "구글 미스터비스트"}, {"title": "Galaxy Users See Their Samsung Accounts Suddenly Deactivated - SammyGuru", "summary": "일부 갤럭시 사용자들 사이에서 본인들의 삼성 계정이 영문도 모른 채 갑작스럽게 비활성화되는 오류가 발생해 커뮤니티에서 혼란이 빚어졌다. 클라우드 서비스 연동 및 기기 이용에 차질을 빚으면서 삼성전자의 신속한 원인 규명과 대응을 요구하는 목소리가 커졌다. 계정 보안 및 서버 안정성 관리의 중요성을 일깨운 사건이다.", "source": "SammyGuru", "date": "2026-09-03 00:43", "url": "https://sammyguru.com/galaxy-users-see-their-samsung-accounts-suddenly-deactivated/", "category": "quality", "importance": 3, "sid": "phone", "topic": "삼성 계정 갑작스러운 비활성화 논란"}, {"title": "[테크 in 넘버] 350억달러 외", "summary": "(약 95조4400억원), 순이익은 같은 기간 36% 급감한 238억1000만위안(약 4조8600억원)을 기록했다. 연구개발(R&D) 지출이 크게 늘었고, 메모리 반도체 가격 상승으로 스마트폰 사업 원가 부담이 커졌기 때문이다.", "source": "chosun.com", "date": "2026-09-03 00:38", "url": "https://www.chosun.com/economy/tech_it/2026/09/03/G5QAIS4Y65G37OGJZESJBLT6EM/?utm_source=naver&utm_medium=referral&utm_campaign=naver-news", "category": "price", "importance": 2, "sid": "phone", "topic": ""}];
</script>
<script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
