 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 5, "wl": true, "topic": "아이폰 울트라"}, {"title": "Galaxy Z Fold 8 is selling so well, Samsung is borrowing parts from the future", "summary": "갤럭시 Z Fold 8의 판매량이 호조를 보이면서 삼성전자가 미래 부품 예비분까지 끌어다 공급 공백을 메우고 있는 것으로 전해졌다. 예상보다 높은 시장 수요를 충족하기 위한 특단의 조치로 풀이된다. 안드로이드 어소리티가 보도했다. 폴더블폰의 흥행 가도가 이어지고 있음을 시사한다.", "source": "Android Authority", "date": "2026-09-01 00:18", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-8-ddi-demand-ramp-up-3704985/", "category": "launch", "importance": 5, "wl": true, "topic": "galaxy z fold 8 부품 수급"}, {"title": "iPhone 18 Pro is coming: Here’s what’s new with each model", "summary": "오는 9월 9일 공개될 예정인 아이폰 18 프로와 프로 맥스 모델의 각 기기별 신규 기능에 대한 루머와 세부 사항이 정리됐다. 매년 스마트폰 시장의 기준점을 제시하는 플래그십 모델의 출시다. 삼성 갤럭시 S 시리즈의 차기작 경쟁력 분석을 위해 즉각적인 분석이 필요한 핵심 정보이다.", "source": "9to5Mac", "date": "2026-08-31 23:06", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-is-coming-heres-whats-new-with-each-model/", "category": "launch", "importance": 5, "wl": true, "topic": "아이폰18 프로"}, {"title": "Galaxy S24 owners can now get a taste of Android 17 with One UI 9 beta", "summary": "구형 모델인 갤럭시 S24 소유자들도 원 UI 9 베타를 통해 최신 안드로이드 17의 기능을 미리 체험할 수 있게 되었다. 미국, 인도, 한국 등 주요 시장에서 베타 프로그램이 공식 라이브됐다. 구형 플래그십에 대한 사후 소프트웨어 지원 확대 정책을 보여준다.", "source": "Android Authority", "date": "2026-09-02 17:39", "url": "https://www.androidauthority.com/samsung-galaxy-s24-one-ui-9-beta-3705963/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시s24"}, {"title": "Google Messages has a weird bug that’s sending old texts to random people (Updated: Fix in", "summary": "구글 메시지 앱에서 과거에 주고받았던 오래된 문자 메시지가 전혀 엉뚱한 사람들에게 발송되는 기괴한 버그가 발생해 논란이 일었다. 사생활 침해와 신뢰도 저하를 초래하는 치명적인 소프트웨어 결함이다. 모바일 OS 및 메시징 앱 업데이트 시 철저한 품질 검수의 중요성을 일깨우는 보안·품질 이슈다.", "source": "Android Authority", "date": "2026-09-02 16:32", "url": "https://www.androidauthority.com/google-messages-old-texts-bug-3704732/", "category": "quality", "importance": 4, "wl": true, "topic": "구글 메시지"}, {"title": "“통화 중 카드정보 탈취”…그룹아이비, 신종 NFC 악성코드 발견", "summary": "통화 중 피해자의 스마트폰을 원격 제어하고 NFC 기능을 이용해 카드 정보를 실시간으로 빼내는 신종 악성코드가 발견됐다. 그룹아이비가 확인한 윈드릴레이는 감염된 폰의 NFC 데이터를 원격의 가짜 단말기로 전송하도록 설계됐다. 전자신문이 긴급 보도했다. 모바일 금융 보안에 각별한 주의가 요구된다.", "source": "전자신문", "date": "2026-09-02 16:28", "url": "https://www.etnews.com/20260902000401", "category": "quality", "importance": 4, "wl": true, "topic": "windrelay 신종 nfc 악성코드"}, {"title": "Galaxy S25 gets one of the S26’s coolest camera tricks with One UI 9 Beta 1", "summary": "갤럭시 S25가 원 UI 9 베타 1을 통해 차기작인 갤럭시 S26의 가장 멋진 카메라 기능 중 하나인 '수평 고정(Horizontal Lock)' 기능을 물려받았다. 구형 플래그십 모델에 대한 최신 소프트웨어 기능 역주행 지원 사례다. 삼성 스마트폰의 소프트웨어 생태계 결속력 강화 전략을 보여준다.", "source": "Android Authority", "date": "2026-09-02 03:20", "url": "https://www.androidauthority.com/galaxy-s25-one-ui-9-beta-horizontal-camera-lock-3705704/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시s25"}, {"title": "5 new features coming to your phone with the September 2026 Android Drop", "summary": "파인드 허브를 통한 물건 기억 기능부터 구글 메시지 내에서 직접 구글 킵을 사용하는 기능까지, 2026년 9월 안드로이드 기능 드롭을 통해 스마트폰에 도입되는 5가지 신기능이 공개됐다. 구글의 정기 생태계 업데이트를 통한 기능 확장이다. 삼성 갤럭시의 소프트웨어 기능 기획에 참고가 된다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/september-2026-android-drop-3705528/", "category": "launch", "importance": 4, "wl": true, "topic": "안드로이드 드롭"}, {"title": "Google’s Guided Vision turns Gemini Live into a real-world visual guide", "summary": "구글의 '가이드드 비전' 기능이 도입되면서 제미나이 라이브가 현실 세계의 실시간 시각적 가이드 역할을 수행할 수 있게 됐다. 사용자가 찾지 못하는 물건이나 정보를 시각적으로 찾아주는 고도화된 AI 기능이다. 모바일 AI 비서의 멀티모달 실시간 상호작용 경쟁력을 높이는 핵심 기능이다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/gemini-live-guided-vision-2-3705480/", "category": "launch", "importance": 4, "wl": true, "topic": "구글 제미나이"}, {"title": "Your Pixel 11 will soon have a fix for the static noise ruining your videos", "summary": "구글이 픽셀 11 스마트폰 비디오 촬영 시 발생하는 정적 소음(스태틱 노이즈) 버그를 공식적으로 인정하고 추후 수정 패치를 제공하겠다고 약속했다. 플래그십 모델의 카메라 오디오 품질 결함 문제다. 삼성 갤럭의 카메라 품질 관리 및 신속한 펌웨어 패치 대응 체계를 점검하는 데 시사점을 준다.", "source": "Android Authority", "date": "2026-09-02 02:03", "url": "https://www.androidauthority.com/pixel-11-static-noise-fix-coming-3705634/", "category": "quality", "importance": 4, "wl": true, "topic": "픽셀11 비디오"}, {"title": "Samsung is expanding the One UI 9 beta to its older foldables", "summary": "삼성전자가 최신 원 UI 9 베타 프로그램을 자사의 구형 폴더블 스마트폰 라인업으로까지 전격 확대 적용하고 있다. 최신 소프트웨어 경험을 구형 디바이스 사용자에게까지 넓혀 생태계 락인 효과를 노리는 전략이다. 갤럭시 사용자 경험 제고 및 소프트웨어 지원 정책의 중요한 행보이다.", "source": "Android Authority", "date": "2026-09-02 01:13", "url": "https://www.androidauthority.com/one-ui-9-beta-galaxy-z-fold-7-3705578/", "category": "launch", "importance": 4, "wl": true, "topic": "삼성 원ui"}, {"title": "Pixel 11’s big modem switch hasn’t ended familiar connectivity complaints", "summary": "구글 픽셀 11이 대대적인 모뎀 칩 교체 단행에도 불구하고 와이파이, 5G, 블루투스 등 고질적인 연결성 불만과 통신 끊김 현상을 해결하지 못한 것으로 드러났다. 핵심 하드웨어 칩셋 변경에도 불구하고 통신 품질 확보에 실패한 사례다. 삼성 갤럭의 모뎀 성능 검증 및 품질 관리에 시사하는 바가 큰 하드웨어 이슈다.", "source": "Android Authority", "date": "2026-09-01 22:21", "url": "https://www.androidauthority.com/pixel-11-connectivity-issues-3705354/", "category": "quality", "importance": 4, "wl": true, "topic": "픽셀11 모뎀"}, {"title": "Breaking: Galaxy S26 series gets eighth One UI 9 beta release (!!)", "summary": "갤럭시 S26 시리즈를 대상으로 여덟 번째 원 UI 9 베타 버전이 배포됐다. 잇따른 소프트웨어 업데이트를 통해 완성도를 높여가는 모습이다. 안드로이드 어소리티가 관련 소식을 긴급 보도했다. 차세대 플래그십 모델의 소프트웨어 안정화 작업이 빠르게 진행되고 있음을 보여준다.", "source": "Android Authority", "date": "2026-09-01 18:16", "url": "https://www.androidauthority.com/samsung-galaxy-s26-one-ui-9-beta-8-3705321/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s26 one ui 9 베타"}, {"title": "Breaking: Galaxy S25 series joins the One UI 9 beta program party", "summary": "갤럭시 S25 시리즈가 원 UI 9 베타 프로그램에 새롭게 합류했다. 수개월간 갤럭시 S26 전용으로 제한되었던 베타 프로그램이 마침내 구형 플래그십으로 확대되는 양상이다. 안드로이드 어소리티가 소식을 전했다. 기존 사용자들의 소프트웨어 지원 만족도를 높일 것으로 기대된다.", "source": "Android Authority", "date": "2026-09-01 17:38", "url": "https://www.androidauthority.com/samsung-galaxy-s25-one-ui-9-beta-1-3705298/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s25 one ui 9 베타"}, {"title": "iOS 27 breaks 15 years of muscle memory on iPhone and iPad", "summary": "애플이 iOS 27을 통해 2011년 iOS 5 이후 15년간 유지해온 아이폰 및 아이패드의 알림센터 사용자 경험(UX)과 머슬 메모리를 완전히 개편한다. 알림 확인 방식을 대대적으로 수정하면서 기존 사용자들의 적응에 큰 변화가 예상된다. 삼성 One UI의 알림 및 UX 디자인 혁신 전략에 시사점을 주는 경쟁사 소프트웨어 개편 정보이다.", "source": "9to5Mac", "date": "2026-09-01 17:00", "url": "https://9to5mac.com/2026/09/01/ios-27-just-broke-15-years-of-muscle-memory-on-iphone-and-ipad/", "category": "quality", "importance": 4, "wl": true, "topic": "ios 알림센터"}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "갤럭시 S27 및 S27 플러스 모델에 의미 있는 수준의 줌 카메라 업그레이드가 이뤄질 가능성이 제기됐다. 유출 정보에 따르면 이들 모델에도 S27 프로와 동일한 3배 망원 시스템이 탑재될 것으로 보인다. 안드로이드 어소리티가 이를 보도했다. 차기 플래그십의 카메라 경쟁력이 강화될 전망이다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s27 줌 카메라 업그레이드"}, {"title": "iOS 27 beta 8 now available as Apple tests major Siri AI upgrade", "summary": "애플이 9월 정식 출시를 앞두고 대규모 시리(Siri) AI 업그레이드가 테스트되는 iOS 27의 8번째 개발자 베타를 배포했다. 온디바이스 AI 기능의 완성도를 높이기 위한 막바지 테스트 단계다. 삼성전자의 원UI 및 AI 비서 고도화 일정에 대응하여 주시해야 할 소프트웨어 경쟁 정보이다.", "source": "9to5Mac", "date": "2026-09-01 02:12", "url": "https://9to5mac.com/2026/08/31/ios-27-beta-8/", "category": "launch", "importance": 4, "wl": true, "topic": "ios 베타"}, {"title": "Apple could discontinue 10+ popular products next week", "summary": "애플이 다가오는 9월 신제품 런칭 행사에서 새로운 기기들을 대거 선보임과 동시에 기존 인기 제품 10개 이상을 단종시킬 것으로 예상된다. 신구 제품 간의 세대교체가 급격하게 이루어지는 대목이다. 스마트폰 및 태블릿 라인업의 라이프사이클 관리 전략 수립에 참고할 만한 경쟁사 동향이다.", "source": "9to5Mac", "date": "2026-09-01 01:04", "url": "https://9to5mac.com/2026/08/31/apple-could-discontinue-10-popular-products-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 단종"}, {"title": "There’s already another tri-fold phone on the market, and it’s not from Samsung", "summary": "삼성전자가 아닌 다른 제조사에 의해 또 다른 삼fold(삼중 폴더블) 스마트폰이 시장에 등장했다. 화웨이가 메이트 XT 2를 선보이며 삼중 폴더블 스마트폰 시장 규모가 한층 더 커졌다. 안드로이드 어소리티가 보도했다. 폼팩터 다변화 경쟁이 치열해지고 있다.", "source": "Android Authority", "date": "2026-08-31 22:57", "url": "https://www.androidauthority.com/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 4, "wl": true, "topic": "huawei mate xt 2 출시"}, {"title": "Pixel 11 notifications are the last straw for many readers sick of phone ads", "summary": "스마트폰 내에 난무하는 광고와 알림 피로감에 지친 수많은 소비자들이 구글 픽셀 11의 알림 방식에 대해 강한 불만을 제기하고 있다. 모바일 OS 내의 과도한 푸시 알림과 광고성 기능이 사용자 경험을 해치고 있다는 지적이다. 삼성 One UI의 알림 정책 및 사용자 경험 개선에 반면교사로 삼아야 할 사안이다.", "source": "Android Authority", "date": "2026-09-02 19:15", "url": "https://www.androidauthority.com/pixel-11-ads-on-smartphones-poll-results-3705986/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀11 알림"}, {"title": "I downloaded Android 17 QPR2 Beta 4. These 3 features instantly upgraded my Pixel", "summary": "안드로이드 17 QPR2 베타 4 버전이 픽셀 스마트폰에 배포되며 사용자 경험을 즉각적으로 향상시키는 3가지 유용한 신기능을 도입했다. 구글의 차기 모바일 OS 완성 작업이 순조롭게 진행 중이다. 삼성전자의 차기 안드로이드 업데이트 일정을 가늠하는 참고 정보이다.", "source": "Android Authority", "date": "2026-09-02 19:00", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-hands-on-3705624/", "category": "launch", "importance": 3, "wl": true, "topic": "안드로이드17 베타"}, {"title": "5 Android phones you should buy instead of the Fairphone Gen 6 Plus", "summary": "650달러의 가격대로 구매할 수 있는 페어폰 6 플러스의 대안이 될 만한 우수한 가성비의 안드로이드 스마트폰 5종이 추천됐다. 중저가 스마트폰 시장에서의 치열한 가성비 경쟁을 보여준다. 삼성전자 갤럭시 A 시리즈의 가격 경쟁력 분석에 참고할 만하다.", "source": "Android Authority", "date": "2026-09-02 18:30", "u re, and your muscle memory won’t like it", "summary": "구글 시계 앱의 타이머 탭 UI가 대대적으로 개편되면서 오랜 기간 사용자들이 익숙해져 있던 머슬 메모리와 조작 방식을 깨뜨려 불만을 사고 있다. 앱의 일방적인 UI 개편이 기존 유저들에게 주는 UX 마찰을 보여준다. 삼성 One UI 디자인 변경 시 유의해야 할 교훈이다.", "source": "Android Authority", "date": "2026-09-02 04:11", "url": "https://www.androidauthority.com/google-clock-app-new-timer-ui-3705710/", "category": "quality", "importance": 3, "wl": true, "topic": "구글 시계"}, {"title": "Take a look: Users are now getting Android’s convoluted sideloading process, and everyone ", "summary": "안드로이드 스마트폰 사용자들이 구글의 새로운 사이드로드(앱 외부 설치) 프로세스를 실제로 경험하기 시작했으며, 관련 스크린샷을 통해 복잡해진 절차의 실태가 드러났다. 보안을 강화하기 위한 구글의 앱 설치 장벽 높이기 정책이다. 모바일 OS 개방성과 보안 정책의 변화를 보여준다.", "source": "Android Authority", "date": "2026-09-01 22:51", "url": "https://www.androidauthority.com/android-sideloading-apps-flow-screenshots-3705423/", "category": "policy", "importance": 3, "wl": true, "topic": "안드로이드 사이드로드"}]};

  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
</html>
