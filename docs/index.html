y": "모토로라가 스마트워치 시장에 복귀한 지 몇 달 만에 프리미엄 시장을 겨냥한 첫 번째 제품 'Moto Watch Ultra'를 공개했다. 최근 선보인 모토 워치 시리즈 대비 향상된 성능과 업그레이드된 기능을 대거 탑재했다. Wear OS를 다시 탑재하며 프리미엄 스마트워치 생태계 진입을 본격화하고 있다. 향후 고가 스마트워치 시장에서 치열한 경쟁이 예상된다.", "source": "The Verge", "date": "2026-09-04 01:00", "url": "https://www.theverge.com/gadgets/988734/moto-watch-ultra-release-date-price-specs-wear-os-ifa", "category": "launch", "importance": 3, "wl": true, "topic": "moto watch ultra", "alert": false}, {"title": "We need to talk about Siri AI for Apple Watch", "summary": "watchOS 27 베타 버전을 통해 애플워치에 도입된 새로운 Siri AI가 기대에 미치지 못하고 있다는 지적이 제기되었다. 당초 애플워치를 진정한 AI 웨어러블로 변모시킬 것으로 기대를 모았으나 7~8월 테스트 과정에서 한계점이 드러났다. 음성 기반 인터페이스의 실효성과 반응 속도 개선이 요구되는 시점이다. 향후 웨어러블 기기에서의 AI 사용자 경험 완성도를 높이는 것이 주요 과제로 남았다.", "source": "9to5Mac", "date": "2026-09-03 23:07", "url": "https://9to5mac.com/2026/09/03/we-need-to-talk-about-siri-ai-for-apple-watch/", "category": "quality", "importance": 3, "wl": true, "topic": "siri ai", "alert": false}, {"title": "Galaxy Watch 9 owners just got a much less disruptive way to update", "summary": "갤럭시 워치 9 사용자들을 위해 사용 중단 없이 백그라운드에서 훨씬 덜 방해받는 방식으로 소프트웨어 업데이트를 진행할 수 있는 기능이 제공되기 시작했다. 기기를 사용하지 못하는 불편함을 최소화하고 업데이트 편의성을 대폭 개선한 사용자 중심의 조치다. 웨어러블 OS 관리의 완성도를 한 단계 끌어올렸다. 사용자들의 만족도를 높이는 핵심 업그레이드로 평가받는다.", "source": "Android Authority", "date": "2026-09-03 22:51", "url": "https://www.androidauthority.com/galaxy-watch-9-seamless-updates-3706897/", "category": "launch", "importance": 3, "wl": true, "topic": "galaxy watch 9 업데이트", "alert": false}, {"title": "iOS 27 basically turns your iPhone and AirPods into an Apple Watch at the gym", "summary": "iOS 27 업데이트를 통해 아이폰과 에어팟의 조합만으로도 헬스장에서 애플워치를 착용한 것과 유사한 피트니스 연동 경험을 누릴 수 있게 되었다. 애플워치의 대표적인 피트니스 기능인 GymKit 연동성이 확장되면서 웨어러블 생태계의 활용 범위가 넓어졌다. 운동 기기와 스마트 기기 간의 실시간 심박수 및 거리 측정 데이터 공유가 한층 원활해졌다. 사용자들의 헬스케어 접근성을 높이는 계기가 될 전망이다.", "source": "9to5Mac", "date": "2026-09-03 03:00", "url": "https://9to5mac.com/2026/09/02/ios-27-basically-turns-your-iphone-and-airpods-into-an-apple-  that links idle computers into a personal AI data center", "summary": "엔비디아가 유휴 컴퓨터들을 연결하여 개인용 AI 데이터 센터를 구축할 수 있는 무료 도구인 'Personal AI Router(PAIR)'를 발표했다. Ollama 및 LM Studio 같은 도구를 사용하여 로컬 AI 추론 작업을 처리할 수 있도록 홈 컴퓨터들을 동기화해 준다. 개인 사용자들의 온디바이스 AI 활용 환경을 크게 개선할 것으로 기대된다. AI 인프라의 개인화 트렌드를 가속화하는 계기가 될 전망이다.", "source": "The Verge", "date": "2026-09-04 01:00", "url": "https://www.theverge.com/ai-artificial-intelligence/989435/nvidia-pair-personal-ai-router-home-local-llm-compute-tool-rtx-macbook", "category": "launch", "importance": 3, "wl": true, "topic": "personal ai router", "alert": false}, {"title": "This 14-inch laptop has a screen that unrolls to 17 inches", "summary": "레노버가 IFA 2026에서 화면이 수평으로 14인치에서 17인치까지 확장되는 비즈니스용 롤러블 컨셉 노트북 'ThinkBook Project Swan'을 공개했다. 롤러블 디스플레이 기술을 지속적으로 발전시켜 온 회사의 최신 성과물이다. 멀티태스킹과 휴대성을 동시에 극대화할 수 있는 새로운 폼팩터의 가능성을 제시했다. 향후 상용화 시 모바일 워크스테이션 시장에 혁신을 불러올 것으로 보인다.", "source": "The Verge", "date": "2026-09-04 01:00", "url": "https://www.theverge.com/tech/989477/lenovo-thinkbook-project-swan-concept-laptop-14-17-rollable-ifa-announcement", "category": "launch", "importance": 3, "wl": true, "topic": "thinkbook project swan", "alert": false}, {"title": "Lenovo’s wild new laptop grows a bigger screen when you need it", "summary": "레노버가 필요할 때마다 화면 크기가 더 커지는 혁신적인 롤러블 노트북 컨셉을 공개하며 또 한 번 기술력을 과시했다. 물리적 크기의 한계를 극복하고 사용 환경에 따라 디스플레이가 확장되는 새로운 폼팩터의 가능성을 제시했다. 모바일 컴퓨팅 시장에서 디자인과 하드웨어 혁신을 주도하려는 레노버의 의도가 돋보인다. 향후 상용화 시 노트북 시장에 거센 지각변동이 예상된다.", "source": "Android Authority", "date": "2026-09-04 01:00", "url": "https://www.androidauthority.com/lenovo-project-swan-at-ifa-2026-3706926/", "category": "launch", "importance": 3, "wl": true, "topic": "lenovo 롤러블 노트북", "alert": false}, {"title": "Lenovo just showed off a laptop with new cooling tech that could replace fans", "summary": "레노버가 기존 팬을 완전히 대체할 수 있는 혁신적인 고체 냉각 기술을 탑재한 초슬림 노트북을 선보였다. 팬이 없어 소음이 전혀 없으면서도 뛰어난 발열 제어 능력을 보여주는 미래형 기술이다. 노트북 두께를 극적으로 줄이면서도 고성능을 유지할 수 있는 기반을 마련했다. 모바일 하드웨어 설계 기술의 새로운 패러다임을 제시하고 있다   let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    // 토글: 켜짐 <-> 꺼짐(음소거)
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();   // 다시 켜면 꺼둔 동안 밀린 알림 표시
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;   // OFF 동안은 알리지도, 본 것으로 기록하지도 않음
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
