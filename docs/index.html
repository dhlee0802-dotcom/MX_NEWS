 교육 및 엔트리 시장에서 치열한 경쟁 구도가 형성될 전망이다.", "source": "The Verge", "date": "2026-09-02 16:00", "url": "https://www.theverge.com/gadgets/987839/dell-14s-student-laptop-ifa-2026-price-specs", "category": "launch", "importance": 4, "wl": true, "topic": "델 14s 노트북 출시"}, {"title": "macOS Golden Gate Seems to Hint at MacBook Pro With OLED Display", "summary": "맥OS 골든 게이트 베타 버전의 코드 속에서 OLED 디스플레이를 탑재한 차세대 맥북 프로의 존재를 시사하는 단서가 발견되었다. 애플이 그동안 아이패드 등에 적용해 온 OLED 기술을 노트북 라인업까지 본격적으로 확대할 것으로 기대된다. 프리미엄 디스플레이 시장에서 노트북용 OLED 패널 수요가 급증할 전망이다. 삼성디스플레이 등 패널 업계와의 협력 및 경쟁 구도에도 큰 영향을 미칠 사안이다.", "source": "MacRumors", "date": "2026-09-02 04:34", "url": "https://www.macrumors.com/2026/09/01/macos-golden-gate-hdr-liquid-glass/", "category": "launch", "importance": 4, "wl": true, "topic": "맥북 프로 oled"}, {"title": "Acer Googlebook is officially coming soon, and here’s a first glimpse", "summary": "에이서의 새로운 '구글북'이 공식 출시를 앞두고 첫 번째 실물 모습이 공개되었다. 다가오는 9월 15일 공식 구글북 런칭 행사에서 베일을 벗을 것으로 기대된다. 크롬OS 기반의 교육용 및 보급형 노트북 시장에서 새로운 선택지가 될 전망이다. 에이서와 구글의 파트너십을 통한 하드웨어 확장 전략의 일환이다.", "source": "Android Authority", "date": "2026-09-02 19:24", "url": "https://www.androidauthority.com/acer-googlebook-coming-soon-look-3706074/", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 구글북 출시"}, {"title": "Acer’s new concept hardware is a gaming handheld with a keyboard", "summary": "에이서가 키보드가 탑재된 새로운 게이밍 핸드헬드 컨셉 하드웨어를 공개했다. 기존의 스팀 덱 스타일 소형 기기들과 달리 컴퓨터 키보드를 통합하여 다기능성을 강화했다. 휴대용 PC 게이머들에게 새로운 폼팩터의 선택지를 제시하려는 시도로 풀이된다. 시장 반응에 따라 향후 모바일 게이밍 기기 디자인 트렌드에 영향을 줄 수 있다.", "source": "The Verge", "date": "2026-09-02 18:30", "url": "https://www.theverge.com/games/988029/acer-project-dualplay-mini-concept-gaming-handheld-keyboard-ifa", "category": "launch", "importance": 3, "wl": true, "topic": "에이서 컨셉 핸드헬드 출시"}, {"title": "This concept handheld can turn into a laptop, complete with a keyboard", "summary": "에이서가 컴퓨터 키보드가 완전히 통합되어 노트북으로 변신할 수 있는 독창적인 콘셉트 핸드헬드 PC를 선보였다. 별도의 휴대용 키보드를 들고 다닐 필요 없이 게이밍과 문서 작업을 모두 소화할 수 있는 다기능 폼팩터 ": "2026-09-01 22:00", "url": "https://www.androidauthority.com/ultrahuman-pulsomics-research-program-3705215/", "category": "quality", "importance": 2, "wl": true, "topic": "울트라휴먼 헬스케어 데이터 수집"}, {"title": "\"스마트 워치 칼로리 맹신 마세요\"…체지방 많을수록 오차 커져 - v.daum.net", "summary": "스마트 워치가 제공하는 칼로리 소모량 측정값의 맹신을 경고하며 체지방이 많을수록 실제 측정치와 오차가 커진다는 연구 결과가 보도되었다. 디지털 헬스케어 정확도 개선이 필요한 대목이다.", "source": "v.daum.net", "date": "2026-09-02 14:41", "url": "https://v.daum.net/v/20260902144128988", "category": "quality", "importance": 3, "wl": false, "topic": "스마트 워치 칼로리 오차 경고"}, {"title": "Samsung Fit 1 Fitness Tracker Galaxy Fit2 Ios A Man Standing On Top Of A Grass Covered Hil", "summary": "", "source": "krepsiniozinios", "date": "2026-09-02 05:54", "url": "https://www.krepsiniozinios.lt/productSearch/pictureSearch?id=38524787050390", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "‘가성비’ 앞세운 中 웨어러블 공세…삼성전자, AI 헬스케어로 맞불 - 파이낸셜투데이", "summary": "", "source": "파이낸셜투데이", "date": "2026-09-02 01:39", "url": "http://www.ftoday.co.kr/news/articleViewAmp.html?idxno=364587", "category": "other", "importance": 3, "wl": false, "topic": ""}, {"title": "Smartwatches Overestimate Calories Burned, Study Finds - 조선일보", "summary": "스마트워치가 측정하는 칼로리 소모량이 실제보다 과대평가된다는 연구 결과가 국내 언론을 통해 보도되었다. 웨어러블 디바이스의 피트니스 측정 정확도 한계가 지적되고 있다. 디지털 헬스케어 기능을 고도화하는 제조사들에게 알고리즘 개선의 필요성을 제기한다. 향후 정확도 신뢰성 확보가 제품 경쟁력의 주요 변수가 될 것이다.", "source": "조선일보", "date": "2026-09-02 15:13", "url": "https://www.chosun.com/english/industry-en/2026/09/02/VDC2ASMWPFFOZCQ5VRFZEDGFNE/", "category": "quality", "importance": 2, "wl": false, "topic": "디지털헬스 사건"}], "phone": [{"title": "Galaxy S27 Ultra could go Exynos again, and this time, Snapdragon fans might get jealous", "summary": "삼성의 내부 테스트 결과 엑시노스 2700이 스냅드래곤 8 엘리트 겐 6 프로를 성능 면에서 능가하는 것으로 나타났다. 이로 인해 갤럭시 S27 울트라에 다시 한번 엑시노스가 탑재될 가능성이 제기되며 스냅드래곤 팬들을 자극하고 있다. 자체 칩셋의 성능 반등은 모바일 AP 경쟁 구도에서 삼성의 입지를 크게 강화할 수 있는 호재다. 프리미엄 스마트폰 시장에서 탑재 칩셋을 둘러신 성능 논쟁이 뜨겁게 달아오를 전망이다.", "source": "Android Authority", "date": "2026-09-02 20:43", "url": "https://www.androidauthority.com/galaxy-s27-ultra-exynos-rumor-3706017/", "category": "quality", "importance": 5, "wl": true, "topic": "갤럭시 s27 울트라 칩셋"}, {"title": "Xiaomi beats Apple to market with wide Xiaomi 18 Fold reveal", "summary": "샤오미가 애플의 폴더블폰 행사보다 이틀 앞서 와이드 폴더블 폼팩터를 채택한 신제품 '샤오미 18 폴드'의 공식 렌더링과 비디오를 전격 공개하며 시장 선점에 나섰다. 애플보다 빠르게 새로운 광폭 폴더블 폼팩터를 선보이며 기술력을 과시하려는 의도다. 글로벌 폴더블폰 시장에서 중국 제조사들의 공세가 한층 매서워지고 있다. 삼성 MX사업부의 폴더블 리더십 수성을 위한 강력한 위협 요소로 즉각적인 대응이 필요하다.", "source": "Android Authority", "date": "2026-09-02 18:36", "url": "https://www.androidauthority.com/xiaomi-18-fold-launch-details-3705996/", "category": "launch", "importance": 5, "wl": true, "topic": "샤오미 18 폴드 출시"}, {"title": "New Galaxy S27 and S27 Plus leak sets us up for grave disappointment, this time for fast c", "summary": "신규 유출된 정보에 따르면 차기작 갤럭시 S27 및 S27 플러스 모델이 빠른 충전 스펙 등에서 심각한 실망감을 안겨줄 것으로 우려된다. 특히 기본 모델의 충전 속도 등 하드웨어 스펙이 전작인 갤럭시 S26 FE보다도 뒤처진다는 지적이 나왔다. 플래그십 라인업임에도 원가 절감이나 급 나누기로 인해 소비자 기대에 못 미칠 수 있다는 분석이다. 삼성 MX사업부의 플래그십 차별화 전략에 대한 시장의 우려가 커지는 긴급 사안이다.", "source": "Android Authority", "date": "2026-09-02 17:48", "url": "https://www.androidauthority.com/galaxy-s27-plus-charging-speed-25w-3705976/", "category": "launch", "importance": 5, "wl": true, "topic": "갤럭시 s27 울트라 출시"}, {"title": "Galaxy Z Fold 8 is selling so well, Samsung is borrowing parts from the future", "summary": "갤럭시 Z 폴드 8이 엄청난 판매 호조를 보여 삼성이 미래 부품 예비분까지 끌어다 공급 공백을 메우고 있는 것으로 전해졌다. 예상보다 높은 초기 수요로 인해 생산 물량 조절이 시급한 긴급 사안이다.", "source": "Android Authority", "date": "2026-09-01 00:18", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-8-ddi-demand-ramp-up-3704985/", "category": "launch", "importance": 5, "wl": true, "topic": "갤럭시 z 폴드 8 판매 호조"}, {"title": "Leakers battle over whether third iPhone 18 Pro color will be silver or black", "summary": "다음 주 출시를 앞둔 아이폰 18 프로의 세 번째 색상 옵션을 두고 유출가들 간의 전망이 엇갈리고 있다. 이미 두 가지 색상에 대해서는 일치된 의견이 모였으나 나머지 한 자리를 두고 실버와 블랙이 대립하고 있다. 애플의 신제품 공개를 앞두고 디자인과 색상 마케팅에 대한 시장의 기대감이 고조되고 있다. IT 팁스터들의 정보전에 소비자와 업계의 이목이 집중된다.", "source": "9to5Mac", "date": "2026-09-02 19:53", "url": "https://9to5mac.com/2026/09/02/leakers-battle-over-whether-third-iphone-18-pro-color-will-be-silver-or-black/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 색상"}, {"title": "Apple Launching Eight New Products This Month", "summary": "애플이 이번 달에만 총 여덟 개의 새로운 제품을 대거 출시할 예정이라는 소식이 전해졌다. 가을 특수를 겨냥한 대규모 하드웨어 공세가 시작될 전망이다. 아이폰, 웨어러블, 오디오 등 전 방위적인 신제품 투입으로 시장을 압도하려 하고 있다. 글로벌 IT 시장에서 애플의 영향력이 절정에 달하는 시기다.", "source": "MacRumors", "date": "2026-09-02 17:15", "url": "https://www.macrumors.com/2026/09/02/apple-launching-eight-new-products-next-month/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 신제품 출시"}, {"title": "New iPhone Ultra details arrive for specs, multitasking, launch timing, more", "summary": "다음 주 애플의 9월 행사에서 공개될 예정인 '아이폰 울트라'에 대한 스펙, 멀티태스킹, 출시 일정 등의 새로운 세부 정보가 공개되었다. 톰스 가이드와 마크 거먼의 인터뷰를 통해 신제품의 혁신적인 기능들이 사전 유출되었다. 새로운 폼팩터와 고성능 사양을 갖춘 울트라 모델은 프리미엄 스마트폰 시장에 큰 파장을 예고하고 있다. 삼성 MX사업부의 플래그십 전략에도 직접적인 경계 대상이 될 것이다.", "source": "9to5Mac", "date": "2026-09-02 05:25", "url": "https://9to5mac.com/2026/09/01/new-iphone-ultra-details-arrive-for-specs-multitasking-launch-timing-more/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 울트라 출시"}, {"title": "Galaxy S25 gets one of the S26’s coolest camera tricks with One UI 9 Beta 1", "summary": "원 UI 9 베타 1을 통해 갤럭시 S25가 차기작인 갤럭시 S26의 가장 멋진 카메라 기능 중 하나인 '수평 고정(Horizontal Lock)'을 물려받게 되었다. 구형 플래그십 모델에도 최신 카메라 소프트웨어 기술을 빠르게 이식하여 사용자 경험을 업그레이드하고 있다. 소프트웨어 업데이트를 통한 기존 기기의 생명력 연장과 가치 제고 전략이다. 삼성 MX사업부의 플래그십 사후 지원 역량을 과시하는 대목이다.", "source": "Android Authority", "date": "2026-09-02 03:20", "url": "https://www.androidauthority.com/galaxy-s25-one-ui-9-beta-horizontal-camera-lock-3705704/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s25 카메라 기능"}, {"title": "Samsung is expanding the One UI 9 beta to its older foldables", "summary": "삼성전자가 최신 안드로이드 기반 원 UI 9 베타 프로그램을 자사의 구형 폴더블 스마트폰 라인업까지 본격적으로 확대 적용하고 있다. 최신 소프트웨어 경험을 과거 세대 폴더블 기기 사용자들에게까지 넓혀 제공하겠다는 방침이다. 삼성의 철저한 사후 지원 정책은 폴더블 생태계 전반의 결속력을 다지는 데 기여한다. 프리미엄 고객 로열티를 유지하기 위한 핵심 전략이다.", "source": "Android Authority", "date": "2026-09-02 01:13", "url": "https://www.androidauthority.com/one-ui-9-beta-galaxy-z-fold-7-3705578/", "category": "launch", "importance": 4, "wl": true, "topic": "삼성 원 ui 베타 확대"}, {"title": "Galaxy S27 and S27 Plus could finally get a meaningful zoom camera upgrade", "summary": "갤럭시 S27 및 S27 플러스 모델에 의미 있는 줌 카메라 업그레이드가 적용될 가능성이 제기되었다. 유출 정보에 따르면 S27 프로와 동일한 3배 망원 시스템을 탑재할 것으로 예상된다.", "source": "Android Authority", "date": "2026-09-01 06:40", "url": "https://www.androidauthority.com/galaxy-s27-and-s27-plus-zoom-camera-rumor-3705167/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 s27 줌 카메라 업그레이드"}, {"title": "iPhone 18 Pro: Three reasons you might want to upgrade from iPhone 17 Pro", "summary": "다음 주 출시를 앞둔 아이폰 18 프로가 전작인 아이폰 17 프로 사용자들마저 업그레이드하도록 유도할 세 가지 핵심 이유가 분석되었다. 성능, 디자인, 신규 기능 등에서 체감할 수 있는 뚜렷한 차별점이 마련될 것으로 예상된다. 매년 반복되는 스마트폰 교체 주기를 단축시키기 위한 애플의 전략이 담겨 있다. 프리미엄 스마트폰 수요를 자극하는 중요한 전환점이 될 것이다.", "source": "9to5Mac", "date": "2026-09-01 05:21", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-three-reasons-you-might-want-to-upgrade-from-iphone-17-pro/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 업그레이드"}, {"title": "Apple could discontinue 10+ popular products next week", "summary": "다음 주 예정된 대규모 9월 런칭 행사에서 새로운 제품들이 대거 등장함에 따라 애플이 10개 이상의 인기 현행 기기를 단종할 것으로 예상된다. 신제품 라인업 정비를 위해 구형 모델들의 퇴출이 불가피한 수순이다. 매년 신제품 발표 시기마다 반복되는 애플의 포트폴리오 재편 전략이다. 시장의 재고 물량과 중고 가격에도 적지 않은 영향을 미칠 것이다.", "source": "9to5Mac", "date": "2026-09-01 01:04", "url": "https://9to5mac.com/2026/08/31/apple-could-discontinue-10-popular-products-next-week/", "category": "launch", "importance": 4, "wl": true, "topic": "애플 구형 기기 단종"}, {"title": "iPhone 18 Pro is coming: Here’s what’s new with each model", "summary": "오는 9월 9일 공개될 예정인 아이폰 18 프로와 프로 맥스 모델의 새로운 기능과 루머가 정리되어 공개되었다. 매년 혁신을 거듭해 온 프로 라인업이 이번에는 어떤 하드웨어 및 소프트웨어 변화를 선보일지 관심이 쏠린다. 프리미엄 스마트폰 시장의 기준을 제시하는 핵심 모델인 만큼 업계의 이목이 집중되어 있다. 삼성 MX사업부의 플래그십 전략 수립에 지대한 영향을 미치는 중대 이벤트다.", "source": "9to5Mac", "date": "2026-08-31 23:06", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-is-coming-heres-whats-new-with-each-model/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 프로 출시"}, {"title": "Pixel 11 notifications are the last straw for many readers sick of phone ads", "summary": "픽셀 11의 알림창 내 광고 표출 문제로 인해 수많은 독자들이 스마트폰 내 광고 범람에 환멸을 느끼며 불만을 토로하고 있다. 하드웨어 완성도와 별개로 소프트웨어 내에 파고드는 광고 수익 모델이 소비자들의 반발을 사고 있다. 스마트폰 제조사들의 무분별한 광고 삽입이 브랜드 충성도를 떨어뜨리는 주요 요인으로 지적된다. 삼성 등 경쟁사들이 이를 반면교사 삼아 프리미엄 이미지 굳히기에 나설 기회다.", "source": "Android Authority", "date": "2026-09-02 19:15", "url": "https://www.androidauthority.com/pixel-11-ads-on-smartphones-poll-results-3705986/", "category": "quality", "importance": 3, "wl": true, "topic": "픽셀 11 알림 광고"}, {"title": "I downloaded Android 17 QPR2 Beta 4. These 3 features instantly upgraded my Pixel", "summary": "안드로이드 17 QPR2 베타 4가 배포되면서 픽셀 스마트폰 사용자들에게 즉각적인 체감 개선을 주는 3가지 핵심 기능이 추가되었다. 대규모 판올림은 아니지만 사용자 편의성을 소소하게 업그레이드해 주는 실속 있는 변화들이 포함되었다. 구글의 최신 OS 테스트 과정이 순조롭게 진행되고 있음을 보여준다. 향후 정식 릴리즈에 대한 기대감을 높이고 있다.", "source": "Android Authority", "date": "2026-09-02 19:00", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-hands-on-3705624/", "category": "launch", "importance": 3, "wl": true, "topic": "안드로이드 17 베타"}, {"title": "Google Messages just made it easier to spot AI-edited photos in your group chats", "summary": "구글 메시지 앱에 그룹 채팅 속 친구가 보낸 사진이 AI로 편집된 사진인지 쉽게 판별할 수 있는 기능이 추가되었다. 지나치게 완벽한 사진의 진위를 파악할 수 있도록 도와주는 실용적인 기능이다. 생성형 AI 이미지의 범람 속에서 소통의 신뢰성을 지키기 위한 구글의 조치다. 모바일 메시징 앱에 AI 기반 검증 기능이 필수적으로 도입되는 추세다.", "source": "Android Authority", "date": "2026-09-02 18:08", "url": "https://www.androidauthority.com/google-messages-ai-media-3706006/", "category": "launch", "importance": 3, "wl": true, "topic": "구글 메시지 ai 감지"}, {"title": "Galaxy S24 owners can now get a taste of Android 17 with One UI 9 beta", "summary": "구형 플래그십인 갤럭시 S24 시리즈 사용자들이 안드로이드 17 기반 원 UI 9 베타를 통해 최신 운영체제를 미리 체험할 수 있게 되었다. 미국, 인도, 한국 등 주요 시장에서 베타 프로그램이 본격적으로 라이브되었다. 구형 기기에 대한 지속적인 소프트웨어 지원은 브랜드 신뢰도를 높이는 핵심 요소다. 삼성전자의 생태계 유지 전략을 잘 보여준다.", "source": "Android Authority", "date": "2026-09-02 17:39", "url": "https://www.androidauthority.com/samsung-galaxy-s24-one-ui-9-beta-3705963/", "category": "launch", "importance": 3, "wl": true, "topic": "갤럭시 s24 원 ui 베타"}, {"title": "Google Messages has a weird bug that’s sending old texts to random people (Updated: Fix in", "summary": "구글 메시지 앱에 예전 대화 내용이 전혀 엉뚱한 사람들에게 무작위로 전송되는 기괴한 버그가 발생했다. 과거의 오래된 문자 메시지들이 수면 위로 재부상하면서 사생활 침해 및 사용자 혼란이 가중되었다. 모바일 커뮤니케이션 인프라의 안정성에 큰 흠집을 낸 심각한 소프트웨어 결함이다. 신속한 오류 수정이 요구되는 사안이다.", "source": "Android Authority", "date": "2026-09-02 16:32", "url": "https://www.androidauthority.com/google-messages-old-texts-bug-3704732/", "category": "quality", "importance": 3, "wl": true, "topic": "구글 메시지 오류"}, {"title": "iPhone Air Review: One Year With Apple's Super Thin $999 iPhone", "summary": "애플의 초슬림 999달러 스마트폰인 아이폰 에어를 1년간 직접 사용해 본 소감과 리뷰가 공개되었다. 압도적인 두께와 디자인의 장단점, 실사용에서의 내구성 및 성능 평가가 상세히 다뤄졌다. 새로운 폼팩터가 시장에서 거둔 성과를 돌아보는 의미 있는 평가다. 향후 초슬림 스마트폰 트렌드에 시사하는 바가 크다.", "source": "MacRumors", "date": "2026-09-02 08:35", "url": "https://www.macrumors.com/2026/09/01/iphone-air-one-year-review/", "category": "other", "importance": 3, "wl": true, "topic": "아이폰 에어 리뷰"}, {"title": "Google is rolling out a handy new battery feature for Pixel phones", "summary": "구글이 픽셀 스마트폰에 배터리 소모 원인을 명확하게 설명해 주는 편리한 신규 배터리 기능을 롤아웃하고 있다. 사용자가 직접 어떤 앱이나 프로세스가 전력을 소모하는지 직관적으로 파악할 수 있게 되었다. 스마트폰 운영체제의 전력 관리 투명성을 높이는 유용한 업데이트다. 사용자 만족도를 높이는 모바일 소프트웨어의 기본기를 다지고 있다.", "source": "Android Authority", "date": "2026-09-02 06:51", "url": "https://www.androidauthority.com/pixel-battery-usage-summaries-rollout-3705856/", "category": "launch", "importance": 3, "wl": true, "topic": "픽셀 배터리 진단"}, {"title": "Gemini and Find Hub are teaming up to remember where you put your passport", "summary": "구글 제미니와 파인드 허브가 긴밀하게 손을 잡고 사용자가 여권, 예비 열쇠, 출생증명서 등 중요한 물건을 어디에 두었는지 기억해 주는 기능을 선보였다. AI와 위치 추적 생태계가 결합하여 일상생활의 편의성을 극대화하고 있다. 스마트폰 비서가 단순한 검색을 넘어 실생활의 물리적 공간까지 케어하는 방향으로 진화하고 있다. 모바일 AI의 활용 범위를 넓히는 핵심 기능이다.", "source": "Android Authority", "date": "2026-09-02 03:14", "url": "https://www.androidauthority.com/gemini-find-hub-item-locations-3705589/", "category": "launch", "importance": 3, "wl": true, "topic": "제미니 파인드 허브 연동"}, {"title": "5 new features coming to your phone with the September 2026 Android Drop", "summary": "2026년 9월 안드로이드 픽셀 드롭을 통해 파인드 허브를 통한 물건 기억부터 구글 메시지 내 직접 구글 킵 사용까지 5가지 새로운 기능이 스마트폰에 대거 추가된다. 구글의 정기적인 기능 업데이트는 픽셀 생태계의 매력을 높이는 주된 동력이다. 사용자들의 일상적인 생산성과 편의성을 향상시키는 실속 있는 기능들이 대거 포함되었다. 모바일 소프트웨어 경쟁력을 강화하는 구글의 핵심 전략이다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/september-2026-android-drop-3705528/", "category": "launch", "importance": 3, "wl": true, "topic": "안드로이드 9월 드롭"}, {"title": "Google’s Guided Vision turns Gemini Live into a real-world visual guide", "summary": "구글이 제미니 라이브에 현실 세계를 시각적으로 안내해 주는 '가이드드 비전' 기능을 도입했다. 제미니 라이브가 사용자가 찾지 못하는 물건이나 길을 시각적으로 도와주는 실시간 가이드 역할을 수행하게 된다. AI 비서가 음성을 넘어 눈이 되어 현실 세계와 상호작용하는 혁신적인 진화다. 모바일 AI의 몰입형 경험을 한 단계 끌어올렸다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www.androidauthority.com/gemini-live-guided-vision-2-3705480/", "category": "launch", "importance": 3, "wl": true, "topic": "제미니 가이드드 비전"}, {"title": "The latest Android Drop brings an unexpected crossover between Google Messages and Keep", "summary": "최신 안드로이드 업데이트를 통해 구글 메시지와 구글 킵 간의 예상치 못한 크로스오버가 이루어져 킵 기반 체크리스트를 메시지 창 안에서 바로 공유하고 스레드 참여자 모두가 수정할 수 있게 되었다. 커뮤니케이션 앱과 생산성 도구의 경계를 허무는 유용한 기능이다. 그룹 채팅에서의 협업 효율성을 극대화하는 소프트웨어적 혁신이다. 모바일 메시징의 활용성을 다각도로 넓히고 있다.", "source": "Android Authority", "date": "2026-09-02 03:00", "url": "https://www. ://www.sammobile.com/news/larger-galaxy-z-flip-8-and-fold-8-storage-options-get-discounts-in-the-uk/", "category": "price", "importance": 3, "sid": "phone", "topic": "갤럭시 z 플립8 폴드8 할인"}, {"title": "세미콘 타이완: 작센, 글로벌 반도체 산업을 위한 유럽 최고의 중심지로 자리매김", "summary": "대만 세미콘 타이완에서 독일 작센주가 유럽 최대 마이크로일렉트로닉스 클러스터인 실리콘 작센을 선보이며 첨단 제조 및 연구 중심지로서의 투자 유치를 홍보했다.", "source": "ZDNet Korea", "date": "2026-09-02 19:10", "url": "https://zdnet.co.kr/view/?no=20260902191013", "category": "launch", "importance": 2, "sid": "memchina", "topic": "독일 작센주 반도체 클러스터 홍보"}, {"title": "궁극의 선명함: AGON by AOC, 세계 최초 5K NVIDIA G-SYNC® Pulsar 게이밍 모니터 공개", "summary": "AGON by AOC가 세계 최초로 5K 초고해상도와 엔비디아 지싱크 펄사 기술을 결합한 게이밍 모니터를 공개했다.", "source": "ZDNet Korea", "date": "2026-09-02 19:10", "url": "https://zdnet.co.kr/view/?no=20260902191003", "category": "launch", "importance": 2, "sid": "pc", "topic": "agon by aoc 5k 모니터 공개"}];
</script>
<script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
