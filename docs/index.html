", "source": "CNET", "date": "2026-09-01 03:43", "url": "https://www.cnet.com/tech/mobile/apple-might-add-a-pencil-to-its-first-foldable-but-dont-expect-it-at-launch/", "category": "launch", "importance": 4, "wl": true, "topic": "apple foldable pencil"}, {"title": "There’s already another tri-fold phone on the market, and it’s not from Samsung", "summary": "화웨이가 새로운 삼중 폴더블 스마트폰인 '메이트 XT 2'를 출시하며 폴더블폰 시장의 경쟁을 심화시키고 있다. 삼성전자가 주도해온 폴더블 시장에서 중국 제조사들이 폼팩터 혁신을 내세워 추격하고 있다. 새로운 형태의 접히는 스마트폰이 시장에서 어떤 반응을 얻을지 주목된다. 삼성전자의 차세대 폼팩터 전략에 긴장감을 주는 요인이다.", "source": "Android Authority", "date": "2026-08-31 22:57", "url": "https://www.androidauthority.com/huawei-mate-xt-2-3704905/", "category": "launch", "importance": 4, "wl": true, "topic": "huawei mate xt 2 출시"}, {"title": "Scam Detection could be coming to Galaxy S27, but there’s also good news for older phones", "summary": "차기 플래그십 스마트폰인 갤럭시 S27에 실시간 '스캠 감지' 기능이 탑재될 가능성이 제기되었으며 구형 모델 사용자들에게도 확대될 좋은 소식이 전해졌다. 보이스피싱과 스미싱 사기를 AI로 차단하는 유용한 기능이다. 보안과 소비자 보호 기능이 모바일 인공지능의 핵심 경쟁력으로 부각되고 있다. 삼성전자의 소프트웨어 가치를 높이는 중요한 업데이트다.", "source": "Android Authority", "date": "2026-08-31 18:38", "url": "https://www.androidauthority.com/google-scam-detection-samsung-galaxy-s27-apk-teardown-3704743/", "category": "launch", "importance": 4, "wl": true, "topic": "galaxy s27 스캠 감지"}, {"title": "OnePlus 16 leak reveals ‘final’ camera specs, and it’s what the OnePlus 15 should’ve had", "summary": "원플러스 16의 최종 카메라 사양이 유출되었으며, 이는 전작인 원플러스 15가 놓쳤어야 했던 진정한 업그레이드를 담고 있다는 평가를 받는다. 카메라 성능의 대폭적인 개선을 통해 플래그십 스마트폰 시장에서의 경쟁력을 회복하려 한다. 중국 스마트폰 제조사들의 카메라 기술 경쟁이 가열되고 있다. 글로벌 스마트폰 시장에서 삼성전자 제품과의 카메라 스펙 경쟁에 영향을 준다.", "source": "Android Authority", "date": "2026-09-01 15:55", "url": "https://www.androidauthority.com/oneplus-16-final-camera-specs-leak-3705216/", "category": "launch", "importance": 3, "wl": true, "topic": "oneplus 16 카메라"}, {"title": "PSA: Gemini can adjust system settings on any Pixel running Android 17", "summary": "안드로이드 17을 구동하는 모든 픽셀 기기에서 제미나이를 통해 음성 명령으로 시스템 설정을 직접 제어할 수 있게 되었다. AI 어시스턴트가 단순한 검색을 넘어 기기의 핵심 제어 권한까지 수행하는 단계로 진화하고 있다. 사용자 편의성이 대폭 향상되는 기능이다. 모바일 AI 에이전트 시장에서 구글의 기술력을 보여주는 사례다.", "source": "Android Authority", "date": "2026-09-01 05:06", "url": "https://www.androidauthority.com/device-help-android-17-3705148/", "category": "quality", "importance": 3, "wl": true, "topic": "gemini 시스템 설정"}, {"title": "Satellite SOS just proved why it could be your phone’s most important feature", "summary": "네팔 홍수 재난 상황에서 위성 SOS 기능 덕분에 한 생존자가 구조대에 성공적으로 연락을 취할 수 있었다. 스마트폰의 위성 통신 기능이 실제 위급 상황에서 생명을 구하는 결정적인 역할을 함이 입증되었다. 지상 기지국이 차단된 재난 지역에서 위성 SOS의 중요성이 부각되고 있다. 최신 스마트폰들의 필수 안전 기능으로 자리 잡고 있다.", "source": "Android Authority", "date": "2026-09-01 02:43", "url": "https://www.androidauthority.com/satellite-connectivity-saves-life-of-man-3705087/", "category": "quality", "importance": 3, "wl": true, "topic": "satellite sos 구조"}, {"title": "iOS 27 beta 8 now available as Apple tests major Siri AI upgrade", "summary": "애플이 9월 정식 출시를 앞두고 8번째 iOS 27 베타 버전을 배포했다. 이번 베타 버전에는 대규모 시리 AI 업그레이드 테스트가 포함되어 있다. 모바일 인공지능 기능 강화에 초점을 맞추고 있다. 스마트폰 소프트웨어 경쟁에서 AI 성능이 핵심 차별화 요소로 작용하고 있다.", "source": "9to5Mac", "date": "2026-09-01 02:12", "url": "https://9to5mac.com/2026/08/31/ios-27-beta-8/", "category": "launch", "importance": 3, "wl": true, "topic": "ios 27 베타"}, {"title": "New Android 17 QPR2 feature lets you peek inside your phone’s secure sandbox", "summary": "안드로이드 17 QPR2 베타 4 버전에는 프라이버시 대시보드 내에 프라이빗 컴퓨트 코어 데이터 로깅 제어 기능이 새롭게 도입되었다. 사용자가 자신의 보안 샌드박스 내부를 직접 모니터링하고 제어할 수 있게 된다. 모바일 운영체제 차원에서 개인정보 보호 및 데이터 투명성이 한층 강화되고 있다. 보안에 대한 사용자 통제권을 대폭 확대하는 조치다.", "source": "Android Authority", "date": "2026-08-31 22:48", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-private-compute-core-data-logging-3704959/", "category": "policy", "importance": 3, "wl": true, "topic": "android 17 프라이버시"}, {"title": "How Android 17 stops network snoops and SMS blasters now - with ECH and a 2G kill switch", "summary": "최신 안드로이드 17 업데이트는 ECH 지원과 2G 킬 스위치 기능을 광범위하게 도입하여 네트워크 스누핑과 가짜 기지국(SMS 블스터) 공격으로부터 사용자를 강력하게 보호한다. 모바일 통신 보안 취약점을 원천적으로 차단하려는 중요한 보안 강화 조치다. 공공장소에서의 무선 데이터 가로채기 시도를 효과적으로 방어한다. 스마트폰 운영체제 보안 표준을 한 단계 끌어올렸다.", "source": "ZDNet", "date": "2026-08-31 22:13", "url": "https://www.zdnet.com/article/android-17-web-browsing-security-privacy-features-update/", "category": "policy", "importance": 3, "wl": true, "topic": "android 17 네트워크 보안"}, {"title": "Android 17 QPR2 Beta 4 fixes a long-standing APK sideloading pain point", "summary": "구글이 안드로이드 17 QPR2 베타 4를 통해 외부 앱(APK) 설치 과정의 오랜 불편함이었던 보안 승인 절차를 개선했다. 새로운 인라인 대화 상자와 일회성 설치 권한을 도입하여 알 수 없는 앱 설치를 더욱 안전하고 쉽게 만들었다. 보안과 사용자 편의성의 균형을 맞추려는 조치다. 안드로이드 오픈 에코시스템의 보안성이 한층 강화된다.", "source": "Android Authority", "date": "2026-08-31 21:29", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-apk-sideloading-permissions-3704842/", "category": "policy", "importance": 3, "wl": true, "topic": "android 17 apk 사이드로드"}, {"title": "Android 17 QPR2 Beta 4 puts AI agents under supervision with new dashboard", "summary": "안드로이드 17 QPR2 베타 4에 기기에 설치된 모든 인공지능 에이전트를 한눈에 감독하고 관리할 수 있는 새로운 대시보드가 추가되었다. 모바일 기기에 탑재되는 수많은 AI 서비스들을 체계적으로 통제할 수 있는 기반이 마련된다. AI 기능의 난립 속에서 시스템 자원과 프라이버시를 보호하기 위한 필수적인 조치다. 모바일 OS의 AI 관리 기능이 표준화되는 추세다.", "source": "Android Authority", "date": "2026-08-31 20:05", "url": "https://www.androidauthority.com/android-17-qpr2-beta-4-agent-dashboard-3704775/", "category": "policy", "importance": 3, "wl": true, "topic": "android 17 ai 대시보드"}, {"title": "Google Messages has a bizarre bug that’s sending old texts to random people", "summary": "구글 메시지 앱에서 과거의 오래된 대화 내용이 전혀 엉뚱한 사람에게 전송되는 기괴한 버그가 발생했다. 사용자들의 사생활과 신뢰성에 심각한 타격을 줄 수 있는 결함이다. 메시징 플랫폼의 안정성에 대한 우려를 낳고 있다. 구글의 신속한 패치와 원인 규명이 요구되는 상황이다.", "source": "Android Authority", "date": "2026-08-31 20:00", "url": "https://www.androidauthority.com/google-messages-old-texts-bug-3704732/", "category": "quality", "importance": 3, "wl": true, "topic": "google messages 버그"}, {"title": "I lived with Samsung’s worst 2025 Android phone for a year. Here’s why I’m finally giving ", "summary": "필자가 1년 동안 삼성전자의 2025년형 스마트폰인 갤럭시 S25 에지를 사용해 보고 결국 기기를 바꾸게 된 이유를 소회로 밝혔다. 제품의 특정 단점과 아쉬운 점들을 솔직하게 지적했다. 플래그십 라인업 내에서 엣지 모델이 가진 한계를 보여준다. 향후 제품 기획에 있어 사용자 피드백의 중요성을 시사한다.", "source": "Android Authority", "date": "2026-08-31 19:30", "url": "https://www.androidauthority.com/galaxy-s25-edge-one-year-later-3703679/", "category": "quality", "importance": 3, "wl": true, "topic": "galaxy s25 edge 리뷰"}, {"title": "This fan-favorite image editor is the first app to support Android’s new location data con", "summary": "인기 이미지 편집 앱이 안드로이드의 새로운 위치 데이터 제어 기능을 최초로 지원하기 시작했다. 사용자는 안드로이드 포토 피커를 사용할 때 사진에 포함된 위치 정보를 유지하거나 제거할지 직접 선택할 수 있다. 개인정보 보호를 강화하는 안드로이드 OS의 정책과 맞물려 있다. 앱 생태계 전반으로 위치 데이터 권한 관리가 확산되고 있다.", "source": "Android Authority", "date": "2026-08-31 18:00", "url": "https://www.androidauthority.com/android-photo-picker-location-sharing-release-3704689/", "category": "policy", "importance": 3, "wl": true, "topic": "android 사진 위치정보"}, {"title": "Your Pixel’s built-in PA system is finally easy to find in Android 17 QPR2 Beta 4", "summary": "안드로이드 17 QPR2 베타 4에서 삼성 갤럭시의 '음성 브로드캐스트' 기능과 유사한 픽셀의 내장 PA 시스템 기능을 훨씬 쉽게 활성화할 수 있게 되었다. 제조사별로 산재해 있던 유용한 커뮤니케이션 기능들이 안드로이드 OS 표준으로 흡수되거나 접근성이 개선되고 있다. 사용자 편의성을 높이는 기능적 수렴 현상이다. 모바일 운영체제 간의 기능 벤치마킹을 보여준다.", "source": "Android Authority", "date": "2026-08-31 17:29", "url": "https://www.androidauthority.com/pixel-voice-broadcast-android-17-qpr2-beta-4-3704655/", "category": "launch", "importance": 3, "wl": true, "topic": "android 17 voice broadcast"}, {"title": "Why RAMageddon Might Force Apps and Operating Systems’ Performance to Suck Less", "summary": "전 세계적인 AI 반도체 수요 폭증으로 메모리 품귀 현상인 이른바 'RAMageddon'이 발생하면서 구글이 안드로이드 운영체제와 앱들의 메모리 효율성을 강도 높게 관리하기 시작했다. 하드웨어 자원이 부족해짐에 따라 소프트웨어 성능 최적화가 생존의 필수 조건이 되었다. 모바일 및 PC 앱 생태계 전반에 구조적 변화를 강제하고 있다. 삼성전자의 메모리 공급 전략과도 맞물려 있는 중대한 이슈다.", "source": "CNET", "date": "2026-08-31 00:00", "url": "https://www.cnet.com/tech/services-and-software/w }
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
</body>
