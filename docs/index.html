ra 출시"}, {"title": "John Ternus is now the CEO of Apple", "summary": "존 터너스가 애플의 신임 CEO로 공식 취임했습니다. 2011년 이후 처음으로 교체된 리더십으로, 향후 애플의 AI 전략과 폴더블 기기 개발 등 주요 과제를 이끌게 됩니다. 팀 쿡은 경영진 의장으로 남습니다.", "source": "The Verge", "date": "2026-09-01 19:04", "url": "https://www.theverge.com/tech/987150/apple-ceo-john-ternus", "category": "exec", "importance": 4, "wl": true, "topic": "애플 존 터너스 ceo 취임"}, {"title": "iPhone 18 Pro: Three reasons you might want to upgrade from iPhone 17 Pro", "summary": "다음 주 공개 예정인 아이폰 18 Pro의 주요 특징에 대한 보도입니다. 기존 아이폰 17 Pro 사용자들을 유인할 수 있는 핵심 기능들이 포함될 것으로 예상되며, 스마트폰 시장의 교체 수요를 자극할 전망입니다.", "source": "9to5Mac", "date": "2026-09-01 05:21", "url": "https://9to5mac.com/2026/08/31/iphone-18-pro-three-reasons-you-might-want-to-upgrade-from-iphone-17-pro/", "category": "launch", "importance": 4, "wl": true, "topic": "아이폰 18 pro 출시"}, {"title": "Galaxy Z Fold 8 is selling so well, Samsung is borrowing parts from the future", "summary": "갤럭시 Z 폴드 8의 판매량이 예상을 뛰어넘어 삼성전자가 미래 부품 재고까지 끌어다 쓰고 있습니다. 폴더블폰 시장에서의 강력한 수요를 증명하며 생산 효율화가 시급한 상황입니다.", "source": "Android Authority", "date": "2026-09-01 00:18", "url": "https://www.androidauthority.com/samsung-galaxy-z-fold-8-ddi-demand-ramp-up-3704985/", "category": "launch", "importance": 4, "wl": true, "topic": "갤럭시 z 폴드 8 판매 호조"}, {"title": "OpenAI calls trade secret dispute ‘a mess of Apple’s own making’", "summary": "애플이 전 직원이 OpenAI로 이직하며 기밀을 유출했다는 증거를 제시하며 소송을 이어가고 있습니다. 애플은 이를 '애플 스스로 자초한 혼란'이라고 비판하는 OpenAI 측과 법적 공방을 벌이고 있습니다.", "source": "9to5Mac", "date": "2026-09-01 20:07", "url": "https://9to5mac.com/2026/09/01/openai-calls-trade-secret-dispute-a-mess-of-apples-own-making/", "category": "policy", "importance": 3, "wl": true, "topic": "애플 openai 소송"}, {"title": "Tim Cook’s Apple: his 10 biggest wins and misses", "summary": "2011년부터 애플을 이끌어온 팀 쿡 CEO가 퇴임합니다. 그는 재임 기간 동안 애플의 시가총액을 비약적으로 상승시키며 성공적인 경영 성과를 거두었습니다. 후임으로 존 터너스가 임명되어 새로운 리더십 체제가 시작됩니다.", "source": "The Verge", "date": "2026-09-01 20:00", "url": "https://www.theverge.com/tech/987043/tim-cook-biggest-wins-misses", "category": "exec", "importance": 3, "wl": true, "topic": "애플 팀 쿡 퇴임"}, {"title": "The Galaxy S26 FE is the wrong Samsung phone to buy right now", "summary": "갤럭시 S26 FE가 가격 대비 성능 면에서 매력적이지 않다는 평가가 나왔습니다. 소비자들에게 다른 모델을 고려할 것을 권장하며, 중저가 라인업의 경쟁력 강화가 필요함을 시사합니다.", "source": "Android Authority", "date": "2026-09-01 18:30", "url": "https://www.androidauthority.com/galaxy-s26-fe-wrong-samsung-phone-buy-3704387/", "category": "price", "importance": 3, "wl": true, "topic": "갤럭시 s26 fe 구매 비추천"}, {"title": "Breaking: Galaxy S26 series gets eighth One UI 9 beta release (!!)", "summary": "갤럭시 S26 시리즈가 8번째 One UI 9 베타 업데이트를 진행했습니다. 소프트웨어 완성도를 높여 사용자 경험을 개선하려는 삼성의 지속적인 노력을 보여줍니다.", "source": "Android Authority", "date": "2026-09-01 18:16", "url": "https://www.androidauthority.com/samsung-galaxy-s26-one-ui-9-beta-8-3705321/", "category": "launch", "importance": 3, "wl": true, "topic": "갤럭시 s26 one ui 9 베타"}, {"title": "Apple’s first folding iPhone won’t kill Android foldables — it will save them", "summary": "애플의 첫 폴더블 아이폰 출시가 안드로이드 폴더블폰 시장을 위협하기보다 오히려 시장을 활성화할 것이라는 분석입니다. 애플의 진입으로 폴더블 기기에 대한 대중적 관심이 높아질 것으로 기대됩니다.", "source": "Android Authority", "date": "2026-09-01 18:00", "url": "https://www.androidauthority.com/apple-foldable-iphone-save-android-phones-3704142/", "category": "policy", "importance": 3, "wl": true, "topic": "애플 폴더블폰 시장 영향"}, {"title": "Breaking: Galaxy S25 series joins the One UI 9 beta program party", "summary": "갤럭시 S25 시리즈가 One UI 9 베타 프로그램에 합류했습니다. 기존 S26 전용이었던 베타 테스트를 확대하여 구형 모델 사용자들에게도 최신 소프트웨어 경험을 제공합니다.", "source": "Android Authority", "date": "2026-09-01 17:38", "url": "https://www.androidauthority.com/samsung-galaxy-s25-one-ui-9-beta-1-3705298/", "category": "launch", "importance": 3, "wl": true, "topic": "갤럭시 s25 one ui 9 베타"}, {"title": "애플 '팀 쿡 시대' 종료…존 터너스 차기 CEO, 폴더블·AI 시험대", "summary": "팀 쿡 애플 최고경영자(CEO)가 15년 간의 임기를 마치고 존 터너스에게 경영권을 넘긴다. 터너스 신임 CEO는 첫 폴더블 아이폰 공개를 시작으로 인공지능(AI) 경쟁력 회복과 공급망 재편이라는 <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
