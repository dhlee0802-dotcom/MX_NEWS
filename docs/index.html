dauthority.com/acer-epaper-monitor-launch-3705490/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 모니터"}, {"title": "Acer Recommits to Repairability With New Vero 16 Laptop", "summary": "에이서가 IFA 2026에서 지속 가능성과 수리 용이성을 대폭 강화한 신형 베로 16 노트북을 선보였다. 환경 친화적인 소재 사용과 함께 브랜드 내에서 가장 슬림한 스위프트 라인업의 신제품과 업데이트 모델도 공개했다. 글로벌 PC 시장에서 친환경 디자인과 휴대성을 앞세워 소비자 공략에 나섰다. 경쟁력 있는 라인업 구축으로 시장 점유율 확대를 꾀하고 있다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/computing/acer-recommits-to-repairability-with-new-vero-16-laptop/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 베로 16 노트북"}, {"title": "Acer Shows Off a Transformer-ish Concept for a Windows Gaming Handheld", "summary": "에이서가 IFA 2026 현장에서 키보드가 결합된 독특한 형태의 윈도우 기반 게이밍 핸드헬드 컨셉트 기기를 공개했다. 일반적인 휴대용 게임기의 한계를 넘어 PC로서의 이중 역할을 수행할 수 있도록 설계된 점이 특징이다. 게이밍 기기 시장의 새로운 폼팩터 가능성을 제시하며 주목받고 있다. 하드웨어 혁신을 통한 차별화 전략을 보여준다.", "source": "CNET", "date": "2026-09-02 18:30", "url": "https://www.cnet.com/tech/gaming/acer-shows-off-a-transformer-ish-concept-for-a-windows-gaming-handheld/", "category": "launch", "importance": 2, "wl": true, "topic": "에이서 게이밍 핸드헬드"}, {"title": "Dell Doubles Down on Cheap Student Laptops With Lower-End Dell 14S Configs", "summary": "델이 저가형 학생용 노트북 라인업인 델 14S의 보급형 구성을 확대하며 시장 공략을 강화하고 있다. 교육용 시장에서 가성비를 중시하는 수요층을 겨냥한 실속형 모델이다. 경쟁이 치열한 보급형 PC 시장에서 최종 출시 가격이 어느 수준으로 책정될지가 주요 관심사다. 학생용 IT 기기 수요를 선점하기 위한 전략적 포석이다.", "source": "CNET", "date": "2026-09-02 16:00", "url": "https://www.cnet.com/tech/computing/dell-doubles-down-on-cheap-student-laptops-with-lower-end-dell-14s-configs/", "category": "launch", "importance": 2, "wl": true, "topic": "델 14s 노트북"}, {"title": "삼성전자, ‘New 갤럭시 북6’ 국내 출시 - Samsung Global Newsroom", "summary": "삼성전자가 최신 성능과 AI 기능을 대폭 강화한 'New 갤럭시 북6' 시리즈를 국내 시장에 공식 출시했다. 뛰어난 휴대성과 강력한 프로세서를 결합해 프리미엄 노트북 시장 내 입지를 공고히 하려는 전략이다. 갤럭시 에코시스템과의 연동성을 높여 사용자 경험을 극대화했다. 국내 노트북 시장에서 강력한 판매 드라이브를 걸 것으로 기대된다.", "source": "Samsung Global Newsroom", "date": "2026-09 l": "https://www.cnet.com/health/medical/oura-menopause-impact-scale-womens-health-care/", "category": "other", "importance": 2, "wl": true, "topic": "오우라 링"}, {"title": "Ultrahuman wants real-world health data, and is asking its users for it", "summary": "스마트 링 및 웨어러블 업체 울트라휴먼이 실제 사용자들로부터 리얼월드 건강 데이터를 수집하기 위해 협조를 요청하고 있다. 민감한 건강 정보를 기업과 공유하는 것에 대한 보안 및 프라이버시 우려가 제기된다. 헬스케어 알고리즘 고도화를 위한 방대한 데이터 확보가 필수적인 상황이다. 사용자 신뢰 구축과 데이터 보호가 중요한 과제로 지적된다.", "source": "Android Authority", "date": "2026-09-01 22:00", "url": "https://www.androidauthority.com/ultrahuman-pulsomics-research-program-3705215/", "category": "other", "importance": 2, "wl": true, "topic": "울트라휴먼 헬스데이터"}, {"title": "\"스마트 워치 칼로리 맹신 마세요\"…체지방 많을수록 오차 커져 - v.daum.net", "summary": "스마트워치의 칼로리 소모량 계산에 오차가 있다는 연구 결과가 보도되었습니다. 체지방이 많을수록 측정 오차가 커지는 한계가 지적되었습니다. 디지털 헬스케어 기기의 정확도 신뢰성에 대한 사용자들의 우려가 커질 수 있습니다. 삼성 헬스 및 웨어러블 제품의 알고리즘 개선 필요성이 제기됩니다.", "source": "v.daum.net", "date": "2026-09-02 14:41", "url": "https://v.daum.net/v/20260902144128988", "category": "quality", "importance": 3, "wl": false, "topic": "스마트워치 칼로리 오차"}, {"title": "‘가성비’ 앞세운 中 웨어러블 공세…삼성전자, AI 헬스케어로 맞불 - 파이낸셜투데이", "summary": "", "source": "파이낸셜투데이", "date": "2026-09-02 01:39", "url": "http://www.ftoday.co.kr/news/articleViewAmp.html?idxno=364587", "category": "other", "importance": 3, "wl": false, "topic": ""}], "phone": [{"title": "Galaxy S27 Ultra could go Exynos again, and this time, Snapdragon fans might get jealous", "summary": "삼성전자의 내부 테스트 결과 차기작인 갤럭시 S27 울트라에 탑재될 예정인 엑시노스 2700이 스냅드래곤 8 엘리트 젠 6 프로를 능가하는 성능을 보여주어 스냅드래곤 팬들의 부러움을 살 수 있다는 전망이 나왔습니다. 자체 칩셋 경쟁력 회복 가능성을 시사하는 매우 중대한 하드웨어 이슈입니다. MX사업부의 칩셋 전략과 원가 절감, 성능 소구점에 직결됩니다.", "source": "Android Authority", "date": "2026-09-02 20:43", "url": "https://www.androidauthority.com/galaxy-s27-ultra-exynos-rumor-3706017/", "category": "launch", "importance": 5, "wl": true, "topic": "갤럭시 s27 울트라"}, {"title": "Xiaomi beats Apple to market with wide Xiaomi 18 Fold reveal", "summary": "샤오미가 애플의 폴더블폰 공개 행사 </script>
<script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}}
];
let activeTab="top";
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];                 // 이슈명 첫 단어 = 제품명
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);                    // 같은 제품 최대 2건
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);  // 같은 제품 최대 2건
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
</script>
