ance": 3, "wl": true, "topic": "애플 크리에이터 기업 인수", "alert": false}, {"title": "New Baseus Spacemate RD1 Plus 14-in-1 dock gets its first price drop, saving you $90", "summary": "베이스어스의 신형 스페이스메이트 RD1 플러스 14-in-1 멀티 독이 첫 할인에 들어가며 35% 인하된 가격에 판매되고 있다. 듀얼 4K 디스플레이 지원과 최대 120W 고속 충전을 지원하는 고성능 노트북 확장 허브다. 모바일 오피스 및 재택근무 환경을 위한 PC 주변기기 수요가 확대되고 있다. 갤럭시 북 사용자를 위한 도킹 인터페이스 환경 점검에 활용될 수 있다.", "source": "Android Authority", "date": "2026-10-21 02:13", "url": "https://www.androidauthority.com/baseus-spacemate-rd1-plus-dock-deal-3725659/", "category": "price", "importance": 3, "wl": true, "topic": "베이스어스 멀티독 할인", "alert": false}, {"title": "Latest Windows update disables key security setting – but there’s a workaround", "summary": "마이크로소프트의 10월 윈도우 업데이트 설치 후 핵심 보안 기능이 비활성화되는 버그가 발생했습니다. 악성 및 의심스러운 앱을 차단하는 설정이 켜지지 않으며, 현재는 레지스트리 수정을 통한 임시 해결만 가능합니다. 윈도우 PC 환경의 시스템 안정성과 보안성 관리가 요구됩니다.", "source": "ZDNet", "date": "2026-10-20 23:26", "url": "https://www.zdnet.com/tech/microsoft-october-windows-update-disables-security-setting-workaround/", "category": "quality", "importance": 3, "wl": true, "topic": "윈도우 업데이트 보안설정 비활성화 오류", "alert": false}, {"title": "Apple Says Mac Mini Assembly in U.S. to Begin Later This Year", "summary": "애플이 올해 말부터 신형 맥 미니의 조립 생산을 미국 본토에서 시작할 계획이라고 공식 발표했다. 미국 내 제조업 투자 공약을 이행하고 지정학적 공급망 리스크를 완화하려는 다변화 전략이다. 미 정부의 관세 혜택과 정책적 요구에 선제적으로 부응하려는 의도로 분석된다. 글로벌 거점 다변화 및 미국 내 생산 확대 흐름을 면밀히 관찰해야 한다.", "source": "MacRumors", "date": "2026-10-20 23:17", "url": "https://www.macrumors.com/2026/10/20/mac-mini-assembly-in-us-later-this-year/", "category": "policy", "importance": 3, "wl": true, "topic": "애플 맥미니 미국 생산", "alert": false}, {"title": "Skyrim Comes to Apple Silicon Macs With New Unofficial Installer", "summary": "애플 실리콘 맥에서 인기 게임 스카이림을 구동할 수 있는 새로운 비공식 인스톨러가 커뮤니티에 공개되었다. 게이머 커뮤니티를 중심으로 자체 칩셋 기반 맥의 게이밍 확장 가능성이 꾸준히 시도되고 있다. 공식적인 게임 개발사 지원 부족에도 불구하고 맥의 GPU 성능 활용이 늘고 있다. PC 플랫폼 내 맥의 비공식 게이밍 생태계 확장을 보여주는 사례다.", "source": "MacRumors", "date": "2026-10-21 11:56", "url": "ht 80/", "category": "price", "importance": 5, "sid": "phone", "topic": "삼성 갤럭시 s26 울트라 할인"}, {"title": "삼성전자, 첫 클립형 이어폰 ‘갤럭시 버즈 온’ 공개…27일 출시", "summary": "삼성전자가 갤럭시 최초의 클립형 무선 이어폰 '갤럭시 버즈 온'을 공개했다. 귀를 막지 않는 오픈형 폼팩터를 적용해 주변 소리를 들으면서 음악을 감상할 수 있으며, 블랙 단일 모델로 29만 9000원에 27일 출시된다.", "source": "msn.com", "date": "2026-10-20 21:24", "url": "https://www.msn.com/ko-kr/money/topstories/삼성전자-첫-클립형-이어폰-갤럭시-버즈-온-공개-27일-출시/ar-AA2fDm9C", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시 버즈 온 공개"}, {"title": "\"착용감·음질 다 잡았다\" 삼성, 귀 안막는 '클립형 이어폰' 승부", "summary": "삼성전자가 갤럭시 버즈 시리즈 최초의 오픈형 클립형 무선 이어폰 '갤럭시 버즈 온'을 27일에 29만9000원으로 공식 출시합니다. 1억 1,900만 개의 귀 데이터를 활용해 착용감을 최적화하고, 듀얼 우퍼로 저음을 강화했으며 머리 움직임 제어 등 AI 음성 명령을 지원합니다. 아웃도어 활동을 즐기는 사용자를 겨냥해 세컨드 이어폰 시장을 공략할 계획입니다.", "source": "msn.com", "date": "2026-10-20 21:15", "url": "https://www.msn.com/ko-kr/news/techandscience/착용감-음질-다-잡았다-삼성-귀-안막는-클립형-이어폰-승부/ar-AA2fFWkT", "category": "launch", "importance": 5, "sid": "tws", "topic": "갤럭시버즈온 출시"}, {"title": "Samsung fighting iPhone Duo by launching six foldable phones next year", "summary": "삼성전자가 애플의 첫 폴더블폰 아이폰 듀오의 흥행에 맞서 내년 최대 6종의 폴더블폰 라인업 출시를 검토 중인 것으로 전해졌습니다. 애플 진입으로 급변하는 폼팩터 경쟁에서 세그먼트 세분화를 통해 시장 지배력을 방어하려는 포석입니다. 시장 확대와 가격대 다변화를 동시에 노리는 적극적인 라인업 전략으로 평가됩니다. 차세대 Z 시리즈의 개발 일정과 수율 및 원가 경쟁력을 면밀히 수립해야 합니다.", "source": "9to5Mac", "date": "2026-10-20 21:00", "url": "https://9to5mac.com/2026/10/20/samsung-fighting-iphone-duo-by-launching-six-foldable-phones-next-year/", "category": "launch", "importance": 5, "sid": "phone", "topic": "samsung 폴더블폰 라인업"}, {"title": "Snapdragon or Exynos? New upgrade for Exynos Galaxy S27 could make this a tough choice", "summary": "차기 엑시노스 탑재 갤럭시 S27이 셀룰러 성능과 전력 효율성 측면에서 스냅드래곤 모델에 뒤처지지 않을 것이라는 전망이 제기되었습니다. 엑시노스 칩셋의 성능 개선이 이루어질 경우 플래그십 선택의 폭이 넓어질 수 있습니다. 삼성의 자체 칩 경쟁력 회복 여부가 주목되는 대목입니다.", "source": "Android Authority", "date": "2026-10-20 20:45", "url": "https://www.androidauthority.com/samsung-galaxy-s27-cellular-upgrade-modem-3725448/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 엑시노스 갤럭시 s27 업그레이드"}, {"title": "Tesla, Dell, and Apple Have Become the 'Weaker Party'… Samsung Electronics' Negotiating Po", "summary": "테슬라, 델, 애플 등 글로벌 빅테크 기업들이 메모리 수급난 속에서 '약자'의 처지로 전락하며 삼성전자의 부품 협상력이 극대화되었다는 분석이 나왔다. 공급자 주도 시장에서 부품 단가 및 계약 조건의 우위를 점할 수 있게 되었다. 삼성전자의 압도적인 시장 지배력을 방증한다.", "source": "머니투데이", "date": "2026-10-20 18:20", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9TbnRCRTJ1cHNkWE92NEtDaTR3Qjd4SHlfNGsyRzhrRnBvOGQ0d19qQWlISGlqbldISlVZUk1lYW9mQlVpNVpjUmtPbVZhRjF0Y3ZGV2ZuYWxEeXBXcWRhdTBrYTc3bmhNN1ZGbWI4c1c4aVhtQzVJaUxRQXhYUQ?oc=5", "category": "policy", "importance": 5, "sid": "memchina", "topic": "반도체 협상력"}, {"title": "Samsung Secures 80% of Its 2027 Memory Chip Orders in Advance", "summary": "삼성전자가 2027년 전체 메모리 칩 주문량의 80%를 사전 선점으로 확보하는 데 성공했다. 압도적인 공급 능력을 바탕으로 물량을 조기에 계약하며 안정적 수익 기반을 다졌다. 반도체 주도권을 공고히 하는 핵심 성과다.", "source": "SammyGuru", "date": "2026-10-20 18:02", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9lX2QwUzdzaE12ZkJ5YUtOcHpjdWtDS1RrRUtrWFVLUDVLaDhoM1AzM0ttaGFkdC1TRGNpck5ReGdFYjNVYjFCN2NINmR4Q2Q1cmIzaGREc1p3dDJmVFhGdUhPWHRBVUlWcFUxUzloSTROMURtTXF0RzFPYlN1UQ?oc=5", "category": "policy", "importance": 5, "sid": "memchina", "topic": "메모리반도체 계약"}, {"title": "One of Samsung’s most popular phones is now getting stable One UI 9 with Android 17", "summary": "삼성이 대중적인 인기 모델인 갤럭시 A36 5G를 대상으로 안드로이드 17 기반의 안정적인 원 UI 9 배포를 시작했습니다. 플래그십뿐만 아니라 보급형 라인업까지 빠른 소프트웨어 업데이트를 제공하여 사용자 경험을 제고합니다. 삼성 MX사업부의 탄탄한 사후 지원 체계를 보여주는 사례입니다.", "source": "Android Authority", "date": "2026-10-20 17:59", "url": "https://www.androidauthority.com/galaxy-a36-5g-stable-one-ui-9-rollout-europe-3725389/", "category": "launch", "importance": 5, "sid": "phone", "topic": "삼성 갤럭시 a36 원유아이 9"}, {"title": "트럼프, 연방기관서 中딥시크 퇴출…“민감 데이터가 中 이전 우려 있어”", "summary": "미국 국토안보부가 연방정부 기관 내에서 중국 AI 기업 딥시크의 제품 사용을 전면 금지하는 지침을 발표했다. 민감 데이터의 중국 이전 우려와 사이버보안법에 근거한 조치로, IT 시스템에서 해당 제품을 즉시 제거해야 한다. 미중 기술 패권 경쟁과 AI 보안 규제가 더욱 강 ana-sui-us/", "category": "launch", "importance": 4, "sid": "wallet", "topic": "삼성월렛 솔라나 연동"}, {"title": "Big downgrade: Some Android brands could offer just 4GB of RAM in their upcoming budget ph", "summary": "AI 붐으로 인한 메모리 반도체 가격 급등 여파로 일부 안드로이드 브랜드들이 차기 보급형 스마트폰에 4GB RAM을 탑재하는 다운그레이드를 검토 중입니다. 서버용 메모리 수요 폭증으로 범용 모바일 D램 공급 단가가 상승하자 제조사들이 원가 절감에 나선 것입니다. 중국 제조사들의 원가 압박이 제품 스펙 후퇴로 이어지고 있습니다. 갤럭시 A 시리즈의 메모리 사양 차별화 및 원가 대응 전략 마련이 필요합니다.", "source": "Android Authority", "date": "2026-10-20 20:18", "url": "https://www.androidauthority.com/android-budget-phones-4gb-ram-2027-3725430/", "category": "policy", "importance": 4, "sid": "memchina", "topic": "안드로이드 보급형 메모리 4gb 다운그레이드"}, {"title": "iPhone Duo orders limited to two per customer as Apple tackles scalping", "summary": "애플이 폴더블폰 아이폰 듀오의 되팔이(리셀)를 방지하기 위해 1인당 구매 수량을 2대로 제한했습니다. 극심한 초기 공급 부족과 폭발적인 수요로 인해 암시장이 형성되는 것을 억제하려는 조치입니다. 애플 첫 폴더블 기기에 대한 초기 시장 수요가 매우 강력함을 증명합니다. 시장 수요 규모와 초기 공급망 대응 전략을 면밀히 분석할 필요가 있습니다.", "source": "9to5Mac", "date": "2026-10-20 20:05", "url": "https://9to5mac.com/2026/10/20/iphone-duo-orders-limited-to-two-per-customer-as-apple-tackles-scalping/", "category": "launch", "importance": 4, "sid": "phone", "topic": "아이폰 듀오 1인당 2대 구매 제한"}, {"title": "Xiaomi's Buyback Is Banked, but the Smartphone Math Still Doesn't Add Up", "summary": "", "source": "ad-hoc-news.de", "date": "2026-10-20 19:40", "url": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxPUDlkb21xZFd2Nkh0SDFLVW5pcU9pSy1QSTM3MWRPVVdRb3JXVzJSa0xJbnJIc0hSS1V5N0tkTDA0blpmSF9PdG42LUI5SExaWDcxUXRFUF9Bd29DV01BMzhJUHVEQ1BPeEY3Y29vU0M4UkRWZFNpcnBrOUJYLUlUWFRGYXJsc0ZFeGN2LWpiU0RNWkZNcXRkUFVBWHpPUFBFeG4wTzkwcW13V0RmYVB1T1RpcU15aVI1QXNiRmNDMGNPNU9ZNzlxRjl0aTk4MHNnS1BIaEI0TXZEclU?oc=5", "category": "policy", "importance": 4, "sid": "phone", "topic": ""}, {"title": "I’ve used the Pixel 11 Pro XL and iPhone 18 Pro Max, and Apple’s ecosystem isn’t enough an", "summary": "픽셀 11 프로 XL과 아이폰 18 프로 맥스를 비교한 결과, 픽셀 시리즈가 애플 에코시스템과의 격차를 크게 좁혔다는 평가가 나왔습니다. 플래그십 일스톤이다. 하이엔드 음향 액세서리 포트폴리오 강화 측면에서 중요한 의미를 갖는다.", "source": "kbench.com", "date": "2026-10-19 16:31", "url": "https://kbench.com/?q=node/282589", "category": "launch", "importance": 4, "sid": "tws", "topic": "삼성오버이어헤드폰 인증"}, {"title": "애플 첫 폴더블 배송 지연…삼성 갤럭시 Z 폴드8 반사이익 얻나 By EBN", "summary": "애플의 첫 폴더블 스마트폰 사전 예약 배송이 내년으로 지연되면서 삼성 갤럭시 Z 폴드8이 반사이익을 얻을 것이라는 분석이다. 애플 신제품의 대기 기간이 길어지자 즉시 구매 가능한 삼성 플래그십 폴더블로 수요가 분산될 가능성이 제기된다. 프리미엄 폴더블 시장에서 당사의 안정적인 공급망과 양산 역량이 부각되고 있다. 공급 지연 틈새를 활용한 타깃 마케팅을 적극 추진할 만하다.", "source": "ebn.co.kr", "date": "2026-10-19 15:41", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1728305", "category": "launch", "importance": 4, "sid": "phone", "topic": "갤럭시z폴드8 반사이익"}, {"title": "삼성폰 또 '급 나누기'…갤S27 플러스, 기존 기능도 뺀다", "summary": "삼성전자가 차기 갤럭시 S27 플러스 모델에서 기존에 지원하던 UWB 기능을 제외할 가능성이 제기되며 급 나누기 논란이 일고 있다. 원가 폭등 속에서 부품 절감을 통해 가격 인상폭을 억제하려는 조치로 풀이된다. 그러나 기존 탑재 기능 삭제에 따른 플러스 모델 구매층의 불만이 예상된다. 라인업 간 기능 차별화와 원가 절감 사이의 정교한 밸런스가 요구된다.", "source": "뉴스1", "date": "2026-10-19 15:27", "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTE5Rci16RkFVWG9IOGk0TUI0RVl5cGpCVkcyajV5dGRrVVdXWk9tVHRWTUlWbVdEaml4WGJieHpSWGR0WVJwTUxGWUdKbk1MVUh2S3QzUDBNQjIzUQ?oc=5", "category": "quality", "importance": 4, "sid": "phone", "topic": "갤럭시s27플러스 uwb제외 루머"}, {"title": "폴더블폰에 “싸구려”라던 애플…삼성 패널 쓰고 가격은 100만원 더", "summary": "폴더블폰의 완성도를 폄하하던 애플이 삼성디스플레이 패널을 적용한 아이폰 듀오를 비싸게 책정해 논란이다. 초고가 가격 정책에도 불구하고 충성 고객층의 초기 수요가 몰리며 가격 저항을 무력화하고 있다. 애플 브랜드 파워가 고가 폴더블 시장에서도 통함을 보여주는 대목이다. 당사 플래그십 폴더블의 프리미엄 가치 제고와 가격 전략 재검토가 필요하다.", "source": "에너지경제신문", "date": "2026-10-19 15:04", "url": "https://news.google.com/rss/articles/CBMiY0FVX3lxTE9FdHVld055YmFHcDlVSXdORmo0WTRNaWNiWm56b1ZmNmVWcUFVYzIwZWNoUnI0RjZuU2d2T2FvRUlWMUZNWFRTelRtRlQyS3M0UTRZRk9vOU1KVkNQdm9hSGRUUQ?oc=5", "category": "price", "importance": 4, "sid": "phone", "topic": "아이폰듀오 삼성패널 가격"}, {"title": "갤럭시 S27 울트라에서 최고급 스냅드래곤 칩이 빠지고 엑시노스 칩이 탑재될 가능성이 제기되고 있다.", "summary": "차기 갤럭시 S27 울트라에서 최고급 스냅드래곤 칩을 배제하고 엑시노스 칩이 탑재될 가능성이 제기되고 있다. 퀄컴 <script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
const SEC_NAME={phone:"스마트폰",tablet:"태블릿",pc:"PC",watch:"워치",tws:"TWS",glasses:"XR·AI글래스",wallet:"삼성월렛",health:"헬스",memchina:"메모리·中폰"};
const TABS=[
  {id:"top",     name:"⭐ 주요·최신", secs:["phone","tablet","pc","watch","tws","glasses","wallet","health","memchina"], mode:"top"},
  {id:"phone",   name:"📱 스마트폰",  secs:["phone"],            impN:{phone:10}},
  {id:"memcn",   name:"🇨🇳 메모리·中폰", secs:["memchina"],      impN:{memchina:5}},
  {id:"tabpc",   name:"📟 태블릿·PC", secs:["tablet","pc"],      impN:{tablet:5,pc:5}},
  {id:"wear",    name:"⌚ 워치·TWS",  secs:["watch","tws"],      impN:{watch:5,tws:5}},
  {id:"xr",      name:"🕶 XR",        secs:["glasses"],          impN:{glasses:5}},
  {id:"payhp",   name:"💳 월렛·헬스", secs:["wallet","health"],  impN:{wallet:5,health:5}},
  {id:"daily",   name:"📌 일자별 중요", secs:[], mode:"daily"}
];
let activeTab="top";
let dailyDate="all";
let dailyImp=0;
function setDailyDate(d){ dailyDate=d; render(); window.scrollTo(0,0); }
function setDailyImp(n){ dailyImp=n; render(); }
// ── 새벽 브리핑: 어제 18시 이후 중요도 4+ 기사를 음성으로 읽기 ──
function briefItems(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-1); cutoff.setHours(18,0,0,0);
  const pool=[];
  if(typeof NEWS_ARCHIVE!=="undefined") Object.values(NEWS_ARCHIVE).forEach(l=>pool.push(...l));
  if(typeof NEWS_LATEST!=="undefined") pool.push(...NEWS_LATEST);
  const seen=new Set(), out=[];
  for(const a of pool){
    const d=new Date((a.date||"").replace(" ","T"));
    if(isNaN(d)||d<cutoff||(a.importance||0)<4) continue;
    const k=(a.title||"").slice(0,40);
    if(seen.has(k)) continue; seen.add(k);
    out.push(a);
  }
  out.sort((a,b)=>b.importance-a.importance);
  return out.slice(0,10);
}
function toggleBrief(){
  const b=document.getElementById("briefBtn");
  if(window.speechSynthesis.speaking){ speechSynthesis.cancel(); b.textContent="🔊 새벽 브리핑"; return; }
  const items=briefItems();
  if(!items.length){ alert("어제 저녁 이후 중요도 4점 이상 기사가 없습니다."); return; }
  let text="밤사이 중요 기사 "+items.length+"건 브리핑입니다. ";
  items.forEach((a,i)=>{
    const sec=SEC_NAME[a.sid||a._sid]||"";
    text+=(i+1)+"번. "+(sec?sec+" 분야. ":"")+a.title+". "+(a.summary||"")+" ";
  });
  text+="브리핑을 마칩니다.";
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=1.05;
  u.onend=()=>{ b.textContent="🔊 새벽 브리핑"; };
  b.textContent="⏹ 브리핑 중지";
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function artCard(a,showSec){
  return `<div class="art">
    <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${showSec&&a._sid?`<span class="sec-tag">${SEC_NAME[a._sid]||a._sid}</span>`:""}</div>
    <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
    <div class="art-sum">${esc(a.summary||"")}</div>
    <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div></div>`;
}
function block(title,cnt,inner,isImp){
  return `<div class="block"><div class="blk-hd${isImp?" imp":""}"><h3>${title}</h3><span class="cnt">${cnt}</span></div><div class="blk-body">${inner||'<div class="empty">해당 기사 없음</div>'}</div></div>`;
}
function secItems(sid){
  return (typeof NEWS_DATA!=="undefined"&&NEWS_DATA[sid]?NEWS_DATA[sid]:[]).map(a=>({...a,_sid:sid}));
}
function prodKey(a){
  const t=(a.topic||"").trim();
  if(t) return t.split(" ")[0];
  const m=(a.title||"").toLowerCase().match(/[a-z0-9가-힣]+/); return m?m[0]:"";
}
function capPerProduct(list,max){
  const cnt={},out=[];
  for(const a of list){
    const k=prodKey(a); if(!k){out.push(a);continue;}
    cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]<=max) out.push(a);
  }
  return out;
}
function render(){
  if(typeof NEWS_META==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · "+NEWS_META.generated;
  document.getElementById("tabbar").innerHTML=TABS.map(t=>`<div class="tab${t.id===activeTab?" on":""}" onclick="setTab('${t.id}')">${t.name}</div>`).join("");
  const tab=TABS.find(t=>t.id===activeTab);
  let html="";
  if(tab.mode==="daily"){
    const arch=(typeof NEWS_ARCHIVE!=="undefined")?NEWS_ARCHIVE:{};
    const days=Object.keys(arch).sort().reverse();
    if(!days.length){ html+=block("📌 일자별 중요 기사","0건","",true); }
    else{
      html+=`<div class="datebar"><span class="dchip${dailyDate==="all"?" on":""}" onclick="setDailyDate('all')">전체</span>`
        + days.map(d=>`<span class="dchip${dailyDate===d?" on":""}" onclick="setDailyDate('${d}')">${d.slice(5)}</span>`).join("")
        + `</div>`
        + `<div class="datebar"><span class="dchip${dailyImp===0?" on":""}" onclick="setDailyImp(0)">중요도 전체</span>`
        + `<span class="dchip${dailyImp===4?" on":""}" onclick="setDailyImp(4)">중요 4점</span>`
        + `<span class="dchip${dailyImp===5?" on":""}" onclick="setDailyImp(5)">긴급 5점</span></div>`;
      const showDays=(dailyDate==="all")?days:days.filter(d=>d===dailyDate);
      showDays.forEach(d=>{
        let items=(arch[d]||[]).map(a=>({...a,_sid:a.sid}));
        if(dailyImp) items=items.filter(a=>a.importance===dailyImp);
        html+=block("📌 "+d+" 중요 기사",items.length+"건",items.map(a=>artCard(a,true)).join(""),true);
      });
    }
  }else if(tab.mode==="top"){
    let allArts=[]; tab.secs.forEach(s=>allArts=allArts.concat(secItems(s)));
    let imp=allArts.filter(a=>a.importance>=4).sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||""));
    imp=capPerProduct(imp,2);
    html+=block("⚠ 중요 기사 (중요도 4·5)",imp.length+"건",imp.map(a=>artCard(a,true)).join(""),true);
    let latest=(typeof NEWS_LATEST!=="undefined"?NEWS_LATEST:[]).map(a=>({...a,_sid:a.sid}));
    latest=capPerProduct(latest,2).slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,true)).join(""));
  }else{
    tab.secs.forEach(sid=>{
      const n=(tab.impN&&tab.impN[sid])||5;
      const imp=secItems(sid).slice().sort((a,b)=>b.importance-a.importance||(b.date||"").localeCompare(a.date||"")).slice(0,n);
      html+=block("⚠ "+(SEC_NAME[sid]||sid)+" 중요 기사 TOP "+n,imp.length+"건",imp.map(a=>artCard(a,false)).join(""),true);
    });
    let merged=[]; tab.secs.forEach(s=>merged=merged.concat(secItems(s)));
    merged.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const latest=merged.slice(0,20);
    html+=block("🕐 최신 기사",latest.length+"건",latest.map(a=>artCard(a,tab.secs.length>1)).join(""));
  }
  document.getElementById("content").innerHTML=html;
}
function setTab(id){activeTab=id;render();window.scrollTo(0,0);}
function enableNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{ updateNotifBtn(); if(p==="granted") checkAlerts(); });
    return;
  }
  if(Notification.permission==="granted"){
    const muted = localStorage.getItem("alertMute")==="1";
    localStorage.setItem("alertMute", muted?"0":"1");
    updateNotifBtn();
    if(muted) checkAlerts();
  }
}
function updateNotifBtn(){
  const b=document.getElementById("notifBtn");
  if(!("Notification" in window)){ b.style.display="none"; return; }
  b.style.display="inline-block";
  if(Notification.permission==="default"){ b.textContent="🔔 알림 켜기"; b.style.color="var(--blue)"; }
  else if(Notification.permission!=="granted"){ b.textContent="🔕 알림 차단됨"; b.style.color="var(--low)"; }
  else if(localStorage.getItem("alertMute")==="1"){ b.textContent="🔕 알림 OFF"; b.style.color="var(--low)"; }
  else { b.textContent="🔔 알림 ON"; b.style.color="var(--blue)"; }
}
function notifKey(a){ return (a.title||"").toLowerCase().replace(/[^a-z0-9가-힣]/g,"").slice(0,40); }
function checkAlerts(){
  if(!("Notification" in window)) return;
  if(Notification.permission!=="granted") return;
  if(localStorage.getItem("alertMute")==="1") return;
  if(typeof NEWS_DATA==="undefined") return;
  let alerts=[]; Object.keys(NEWS_DATA).forEach(sid=>NEWS_DATA[sid].forEach(a=>{ if(a.alert) alerts.push(a); }));
  let seen=[]; try{ seen=JSON.parse(localStorage.getItem("alertSeen")||"[]"); }catch(e){}
  const seenSet=new Set(seen); let fired=0;
  for(const a of alerts){
    const k=notifKey(a);
    if(seenSet.has(k)) continue;
    seenSet.add(k);
    if(fired<3){
      const n=new Notification("🚨 MX 긴급: "+a.title,{ body:(a.summary||"").slice(0,120)+"\n"+a.source+" · "+a.date, tag:k });
      n.onclick=()=>{ window.open(a.url,"_blank"); n.close(); };
      fired++;
    }
  }
  try{ localStorage.setItem("alertSeen", JSON.stringify([...seenSet].slice(-300))); }catch(e){}
}
setTimeout(()=>{ location.href = location.pathname + "?t=" + Date.now(); }, 5*60*1000);
render();
updateNotifBtn();
checkAlerts();
</script>
