<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MX 뉴스 모니터링 (로컬)</title>
<style>
  :root{
    --navy:#0f2a5c; --blue:#1e5eff; --blue-soft:#eef3ff;
    --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
    --bg:#f6f8fb; --card:#ffffff;
    --crit:#d63031; --crit-bg:#fdeeee; --high:#e67e22; --high-bg:#fdf3e7;
    --mid:#2f80ed; --mid-bg:#ebf3fe; --low:#8a94a6; --low-bg:#f1f3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 22px;position:sticky;top:0;z-index:10}
  h1{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  h1 span{color:var(--blue)}
  .hd-meta{font-size:12px;color:var(--sub);margin-top:3px}
  .filters{display:flex;gap:6px;padding:12px 22px 0;flex-wrap:wrap}
  .chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{padding:16px 22px 40px;max-width:1240px;margin:0 auto}
  .alerts{background:var(--card);border:1px solid #f3c9c9;border-left:4px solid var(--crit);border-radius:10px;padding:14px 16px;margin-bottom:18px;display:none}
  .alerts.on{display:block}
  .alerts h2{font-size:13px;font-weight:800;color:var(--crit);margin-bottom:8px}
  .alert-item{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px dashed #f0dcdc;font-size:13px}
  .alert-item:first-of-type{border-top:none}
  .alert-item a{color:var(--ink);text-decoration:none;font-weight:600}
  .alert-item a:hover{color:var(--crit)}
  .alert-item .sec{font-size:11px;color:var(--sub);white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .section{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sec-hd{padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfe}
  .sec-hd h3{font-size:14px;font-weight:800;color:var(--navy)}
  .sec-hd .cnt{font-size:11px;color:var(--sub);font-weight:500;margin-left:6px}
  .sec-body{padding:6px 14px 12px}
  .empty{color:var(--low);font-size:12.5px;padding:14px 0;text-align:center}
  .art{padding:11px 0;border-top:1px solid var(--line)}
  .art:first-child{border-top:none}
  .art-tags{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap;align-items:center}
  .imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:4px}
  .imp.i5{background:var(--crit);color:#fff}
  .imp.i4{background:var(--crit-bg);color:var(--crit)}
  .imp.i3{background:var(--high-bg);color:var(--high)}
  .imp.i2{background:var(--mid-bg);color:var(--mid)}
  .imp.i1{background:var(--low-bg);color:var(--low)}
  .cat{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--low-bg);color:var(--sub)}
  .cat.quality{background:#fdeeee;color:#c0392b}
  .cat.launch{background:#e8f8ef;color:#1e8e4e}
  .cat.price{background:#fdf3e7;color:#c46a10}
  .cat.exec{background:#f0ebfa;color:#6c3fc5}
  .cat.policy{background:#ebf3fe;color:#1e5eff}
  .cat.community{background:#fff6d9;color:#9a7b00}
  .art-title{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;display:block}
  .art-title:hover{color:var(--blue)}
  .art-sum{font-size:12.5px;color:var(--sub);margin-top:3px}
  .art-src{font-size:11px;color:var(--low);margin-top:4px}
  .wl{color:#1e8e4e;font-weight:700}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Samsung MX <span>뉴스 모니터링 — 로컬 크롤러</span></h1>
  <div class="hd-meta" id="lastUpdate">news_data.js 없음 — 먼저 python crawler.py 실행</div>
</header>
<div class="filters">
  <span class="chip on" data-min="1" onclick="setFilter(this)">전체</span>
  <span class="chip" data-min="4" onclick="setFilter(this)">중요(4+)만</span>
  <span class="chip" data-min="5" onclick="setFilter(this)">긴급(5)만</span>
</div>
<main>
  <div class="alerts" id="alerts"><h2>⚠ TODAY'S TOP ALERTS — 중요도 4 이상</h2><div id="alertList"></div></div>
  <div class="section" id="latestBox" style="margin-bottom:18px;display:none">
    <div class="sec-hd"><h3>🕐 최신 수집 기사<span class="cnt" id="latestCnt"></span></h3></div>
    <div class="sec-body" id="latestList"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="news_data.js"></script>
<script>
const CAT_LABEL={quality:"품질 이슈",launch:"신제품/출시",price:"가격/판매",exec:"경영/인사",policy:"정책/서비스",community:"커뮤니티",other:"기타"};
let minImp=1;
function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
function impBadge(n){const t=n>=5?"긴급":n>=4?"중요":n>=3?"주목":n>=2?"참고":"저";return `<span class="imp i${n}">${t} ${n}</span>`;}
function setFilter(el){document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");minImp=parseInt(el.dataset.min);render();}
function render(){
  if(typeof NEWS_DATA==="undefined"){return;}
  document.getElementById("lastUpdate").textContent="최근 48시간 · 크롤링 시각: "+NEWS_META.generated;
  const g=document.getElementById("grid");
  g.innerHTML=NEWS_META.sections.map(s=>{
    const arts=(NEWS_DATA[s.id]||[]).filter(a=>a.importance>=minImp);
    const body=arts.length?arts.map(a=>`
      <div class="art">
        <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span>${a.wl?'<span class="wl">✓지정매체</span>':''}</div>
        <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
        <div class="art-sum">${esc(a.summary||"")}</div>
        <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div>
      </div>`).join(""):`<div class="empty">해당 조건의 기사 없음</div>`;
    return `<div class="section"><div class="sec-hd"><h3>${s.name}<span class="cnt">(${arts.length}건)</span></h3></div><div class="sec-body">${body}</div></div>`;
  }).join("");
  const items=[];
  NEWS_META.sections.forEach(s=>(NEWS_DATA[s.id]||[]).forEach(a=>{if(a.importance>=4)items.push({...a,secName:s.name});}));
  items.sort((a,b)=>b.importance-a.importance);
  const box=document.getElementById("alerts");
  if(items.length){box.classList.add("on");
    document.getElementById("alertList").innerHTML=items.map(a=>`
      <div class="alert-item">${impBadge(a.importance)}<a href="${a.url}" target="_blank">${esc(a.title)}</a><span class="sec">${a.secName} · ${esc(a.source)}</span></div>`).join("");
  }else{box.classList.remove("on");}
  if(typeof NEWS_LATEST !== "undefined" && NEWS_LATEST.length){
    const lb = document.getElementById("latestBox");
    lb.style.display = "block";
    document.getElementById("latestCnt").textContent = "(" + NEWS_LATEST.length + "건)";
    document.getElementById("latestList").innerHTML = NEWS_LATEST.map(a=>`
      <div class="art">
        <div class="art-tags">${impBadge(a.importance)}<span class="cat ${a.category}">${CAT_LABEL[a.category]||a.category}</span></div>
        <a class="art-title" href="${a.url}" target="_blank">${esc(a.title)}</a>
        <div class="art-sum">${esc(a.summary||"")}</div>
        <div class="art-src">${esc(a.source)} · ${esc(a.date)}</div>
      </div>`).join("");
  }
}
setTimeout(()=>location.reload(), 5*60*1000); // 감시 모드에서 5분마다 최신 데이터로 자동 갱신
render();
</script>
</body>
</html>
